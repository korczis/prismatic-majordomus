# The object kinds the Rust executable (apps/majordomus-cli) knows how to read, one entry
# each. Read at run time from the tool distribution, beside share/schemas/; a repository
# adds kinds of its own in .ai/repo/knowledge/kinds.yaml and schemas of its own under
# .ai/repo/knowledge/schemas/, and may not redefine a kind or a schema declared here.
#
# Every file under .ai/** is one of these kinds, and the `ai-document-integrity` rule is
# what makes that true rather than aspirational.
#
# Rust carries the mechanism (read a file in a format, validate its keys against a list,
# take an identity and a title from named fields). This file carries the knowledge of which
# fields mean what for each kind. Which files are of which kind is not decided here either:
# the repository's own .ai/repo/knowledge/sources.yaml maps pathspecs to kinds, and a kind
# it names that no kinds file knows is reported, never guessed.
#
# fields:
#   format          markdown | yaml | text — how the file is read; text carries no metadata
#   front_matter    required | optional | none — for markdown, whether a YAML front matter
#                   block must be present, may be present, or is not looked for
#   without_front_matter
#                   for markdown, the kind a file with no front matter is read as instead
#                   of being refused: a README inside the rules tree is a document, not a
#                   broken rule. The named kind must itself accept such a file.
#   schema          the document schema the file must satisfy, by its identity
#                   `<vendor>.<name>/v<n>`. The identity fixes the path: `majordomus.adr/v1`
#                   is share/schemas/majordomus/adr/adr.v1.*, under the tool distribution
#                   for the `majordomus` vendor and under the repository's own
#                   .ai/repo/knowledge/schemas/ for any other. A Markdown kind is described
#                   in protobuf (adr.v1.proto: `Header` is the front matter, `Body` names
#                   the sections, `Document` is the pair); a YAML kind is described in JSON
#                   Schema (policy.v1.schema.json), because YAML is JSON's data model.
#                   Absent means the kind declares no contract and its metadata is carried
#                   through unvalidated. Everything else is projected from these files by
#                   `majordomus generate` and never written by hand: the JSON Schema beside
#                   each .proto, the shell tool's allow-lists under share/allow/ and its
#                   body-section lists under share/sections/.
#   identity        the metadata fields joined with '@' that make the object's identity;
#                   empty means the repository-relative path is the identity
#   title           the metadata field holding the title, or '@heading' for the first
#                   level-one Markdown heading; absent means no title
#   description     the metadata field holding the one-line description; absent means none
#   schema_version  a field that must carry one of the supported values (integers or
#                   strings), when the kind has a format version distinct from its identity
#   members         for a yaml kind: the list in the file that holds the objects, one per
#                   item; identity, title and description are read from each item, and
#                   schema_version still applies to the file
#
# declared: markdown kinds a file may declare for itself through its front matter `kind:`
# whatever class discovered it. A README inside the rules tree that says `kind: context`
# is a context document, not a broken rule; a kind not listed here is a mismatch.
schema: majordomus-kinds/v1

declared: [context]

kinds:
  rule:
    format: markdown
    front_matter: required
    without_front_matter: document
    schema: majordomus.rule/v1
    identity: [id, version]
    title: title
    description: description

  prompt:
    format: markdown
    front_matter: required
    schema: majordomus.prompt/v1
    identity: [name]
    title: name
    description: description

  skill:
    format: markdown
    front_matter: required
    schema: majordomus.skill/v1
    identity: [id]
    title: title
    description: description
    schema_version:
      field: schema
      supported: [skill/v1]

  profile:
    format: yaml
    schema: majordomus.profile/v1
    identity: [name]
    title: name
    description: description

  policy:
    format: yaml
    schema: majordomus.policy/v1
    identity: []
    schema_version:
      field: version
      supported: [1]

  scope:
    format: yaml
    schema: majordomus.scope/v1
    identity: []
    schema_version:
      field: version
      supported: [1]

  milestone:
    format: yaml
    schema: majordomus.milestone/v1
    identity: [id]
    title: title
    description: outcome

  issue:
    format: yaml
    schema: majordomus.issue/v1
    identity: [id]
    title: title
    description: objective

  document:
    format: markdown
    front_matter: optional
    schema: majordomus.document/v1
    identity: []
    title: '@heading'
    description: description

  # The plan's header — what this repository is, not what is planned in it. The milestones
  # and issues beside it are their own kinds.
  project:
    format: yaml
    schema: majordomus.project/v1
    identity: []
    title: name
    description: repository
    schema_version:
      field: schema_version
      supported: [1]

  context:
    format: markdown
    front_matter: required
    schema: majordomus.context/v1
    identity: [id]
    title: title
    description: description
    schema_version:
      field: schema
      supported: [context/v1]

  session:
    format: markdown
    front_matter: required
    without_front_matter: document
    schema: majordomus.session-record/v1
    identity: [session_id]
    title: title
    description: title
    schema_version:
      field: schema
      supported: ["session/v1"]

  # The working context of an episode, under the checkout-local half of the layer. It is
  # declared here so that the kind its front matter names is a kind this distribution knows
  # and its contract can be found; no source class discovers it, and none should — it names
  # one machine and it is a snapshot no surface can regenerate (ADR 0015). Declaring a kind
  # says what a document of this shape is, not that something indexes it.
  session-context:
    format: markdown
    front_matter: required
    without_front_matter: document
    schema: majordomus.session-context/v1
    identity: [session_id]
    title: title
    description: title
    schema_version:
      field: schema
      supported: ["session-context/v1"]

  adr:
    format: markdown
    front_matter: required
    without_front_matter: document
    schema: majordomus.adr/v1
    identity: [id]
    title: title
    description: title
    schema_version:
      field: schema
      supported: [adr/v1]

  knowledge:
    format: markdown
    front_matter: required
    without_front_matter: document
    schema: majordomus.knowledge/v1
    identity: [id]
    title: title
    description: description
    schema_version:
      field: schema
      supported: [knowledge/v1]

  use-case:
    format: markdown
    front_matter: required
    schema: majordomus.use-case/v1
    identity: [id]
    title: title
    description: summary

  application:
    format: markdown
    front_matter: required
    schema: majordomus.application/v1
    identity: [id]
    title: title
    description: summary

  taxonomy:
    format: yaml
    members: categories
    schema: majordomus.taxonomy/v1
    identity: [id]
    title: title
    description: summary
    schema_version:
      field: version
      supported: [1]

  claim:
    format: yaml
    members: claims
    schema: majordomus.claim/v1
    identity: [id]
    title: claim
    description: note
    schema_version:
      field: version
      supported: [1]

  command:
    format: yaml
    members: commands
    schema: majordomus.command/v1
    identity: [id]
    title: title
    description: summary
    schema_version:
      field: version
      supported: [1]

  moment:
    format: markdown
    front_matter: required
    schema: majordomus.moment/v1
    identity: [id]
    title: title
    description: summary
    schema_version:
      field: schema
      supported: [moment/v1]

  audience:
    format: markdown
    front_matter: required
    schema: majordomus.audience/v1
    identity: [id]
    title: title
    description: summary
    schema_version:
      field: schema
      supported: [audience/v1]

  area:
    format: markdown
    front_matter: required
    schema: majordomus.area/v1
    identity: [id]
    title: title
    description: summary
    schema_version:
      field: schema
      supported: [area/v1]

  implementation:
    format: text
    identity: []

  test:
    format: text
    identity: []
