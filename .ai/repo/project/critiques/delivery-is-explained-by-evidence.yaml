    finding: "Convergence 06.3 lists a failed test, a stale pull request and a disappearing peer among the injected failures, and I2369 drops all three, pointing at cases that run in this repository rather than in the consumer; I2368 runs only two of the five unattended scenarios from the installed artifact, where autopilot 06 issue 3 asks for the full set on both self and consumer."
