id: a-provider-carries-the-contract-natively
title: "Each agent client carries the contract through its own extension points, generated once and checked for drift"
slug: a-provider-carries-the-contract-natively
order: 190
priority: p2
problem: "The Claude integration is four mechanisms installed three ways; Codex has no hook adapter; nothing checks an installed extension against what was generated; the stop of a session owes nothing. Proposed in ADR 0214 (A provider's native extension points carry the contract as generated projections; Majordomus neither embeds nor patches the worker's runtime) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c174#18, chatgpt-majordomus:c194#3, chatgpt-majordomus:c236#4, chatgpt-majordomus:c261#7, chatgpt-majordomus:c193#1, chatgpt-majordomus:c109#3, chatgpt-majordomus:c222#2."
outcome: "One generated Claude plugin, the edit guard wired and then refusing, a Stop-time owed report, extension provenance in doctor, bounded hooks and MCP listing, Codex hook parity where Codex offers the hook, Zed schema associations."
current_state: "Verified on master 707a04c: ADR 0146/0165 accepted, .claude/skills generated per domain; .claude/hooks/majordomus-edit-guard exists and case 3069 pipes payloads into it, but .claude/settings.json wires only UserPromptSubmit, SessionStart, SessionEnd and PreCompact, so Claude Code never calls it; share/mods/claude-code/{majordomus-brief,majordomus-handover} (ADR 0136); editors/{claude,zed,antigravity}.rs (ADR 0140); codex `unadapted` in share/providers.yaml."
desired_state: "As the outcome, with every artefact stamped and drift-gated."
scope:
