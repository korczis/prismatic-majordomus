  - "docs/MESH.md"
depends_on: []
acceptance_criteria:
  - "Removing a key from trust.allow on a running runtime closes that key's links within one heartbeat and refuses its next hello, with no restart"
  - "Under a permissive umask the node key file is never readable by group or others"
