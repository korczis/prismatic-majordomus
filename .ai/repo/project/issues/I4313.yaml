id: I4313
milestone: a-finding-is-tracked-to-its-issue
title: "A /ui donut colours each slice by the status token its label means, never by its position"
slug: ui-donuts-colour-by-status-token
priority: p2
profile: implementation
parallel_safe: false
objective: "Make the /ui donut and its legend take each slice's colour from the status role its label is filed under in the one declaration, status.states in share/design/tokens.yaml (:312), read through the compiled-in projection with role_of_state (apps/majordomus-cli/src/design/mod.rs:769), instead of from its position in TONES; a label with no filed role gets the neutral tone; replace status_tone's private mapping with the same lookup, filing any plan status word the declaration lacks in tokens.yaml."
why: "The donut colours slices by position (apps/majordomus-cli/src/ui/view.rs:34 declares TONES; :681 and :700 index it by i % TONES.len()), so one status reads in different colours on different screens, and the evidence and governance donuts can paint a failure green. status_tone (apps/majordomus-cli/src/ui/view.rs:637-650) keeps a second mapping of status words to tones beside the declaration in share/design/tokens.yaml, of which share/design/status.css is a generated projection (its header says so). ADR 0135 assigns colour meaning to the design system, and project.ui-derived-state requires /ui to show what the source said. Drawing the donut and meter over a table of their numbers is open I3792's (its acceptance: 'the /ui donut and meter each render a table with the numbers they draw'), so this issue keeps only the colouring and the one lookup."
current_state: "On 81ef931a3e1 TONES is a positional palette of six tones, status_tone maps plan status words to tones by hand, and share/design/tokens.yaml files state words under the roles ok, warn, bad, info and neutral."
desired_state: "The donut reads each slice's colour from the role its label is filed under in share/design/tokens.yaml, through role_of_state; status_tone reads the same declaration; the same label has the same colour on every screen; when a word is filed in tokens.yaml, share/design/status.css and the compiled-in apps/majordomus-cli/src/design/tokens.yaml are regenerated by majordomus generate, never edited."
scope:
  - ".ai/repo/project/issues/I4313.yaml"
  - "apps/majordomus-cli/src/ui/view.rs"
  - "share/design/tokens.yaml"
non_scope:
  - "The site's charts (I4304)"
  - "Any new chart form on /ui"
  - "The /ui files that the I3004 and I2914 branches rewrite beyond view.rs"
  - "A table of the donut's counts, which open I3792 delivers"
  - "Editing share/design/status.css or any other generated projection by hand"
depends_on:
  - "I4316"
serves:
  - "a-review-is-seen-at-its-commit#relations-and-status-are-drawn-from-tables"
acceptance_criteria:
  - "A donut of failed and passed counts draws failed in the failure tone and passed in the success tone, whatever their order"
  - "A label with no declared status meaning is drawn in the neutral tone"
  - "status_tone and the donut agree for every plan status word, each filed in share/design/tokens.yaml"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib ui::view::"
  - "bin/majordomus generate --check"
  - "bin/majordomus plan validate"
evidence_required:
  - "donut_colours_by_status_token"
risk: "Medium. #2583 and the unlanded I3004 and I2914 branches edit apps/majordomus-cli/src/ui; open I3792 also edits view.rs; this issue re-reads them before starting."
created_at: 2026-10-28
updated_at: 2026-10-28
