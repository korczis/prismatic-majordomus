id: I4788
milestone: a-downstream-adopters-findings-are-fixed-in-the-tool
title: "plan validate against a base revision names every milestone a change re-opens and every issue it moves from READY to BLOCKED, with the edit that did it"
slug: a-plan-change-says-what-it-reopens
priority: p1
profile: implementation
parallel_safe: false
objective: "`plan validate --against <rev>` (default: the merge base with the trunk when the tree differs from it) derives the status of every milestone and issue at the base, read from git, and at the work tree, and reports `milestone_reopened` for each milestone that was DONE at the base and is not now, and `ready_now_blocked` for each issue READY at the base and BLOCKED now, each naming the record whose edit caused it (an issue moved into the milestone, a dependency added, an evidence entry removed). Warnings by default; the commit hook and CI run it, and a policy key makes `milestone_reopened` refuse."
why: "In a downstream supervised repository on 1.2.0 (2026-11-25), moving one issue into a milestone that was already DONE silently re-opened that milestone, and because later milestones wait on it, every READY issue of every later milestone became BLOCKED. Nothing said so when the change was made; it was found when the next worker asked for ready work and got none."
current_state: "Measured at origin/master 46775282570. lib/plan.sh mj_plan_validate judges the schema, the references, the DAG and status consistency of the tree as it is; status is derived, never stored, so a re-opened milestone is a valid plan and validate is silent about it. I4266 makes `plan` say why an issue with no dependency is BLOCKED by its milestone, after the fact; nothing compares two revisions of the plan."
desired_state: "The comparison reads the base's plan files with git (`git show <rev>:<path>`), never a previous run's output; both findings appear in text and JSON; pre-commit reports them; docs/PLANNING.md documents the flag and the policy key; a case moves an issue into a DONE milestone that a later milestone depends on and sees both findings name that move."
scope:
  - ".ai/repo/project/issues/I4788.yaml"
  - "lib/plan.sh"
  - "lib/project.sh"
  - ".githooks/pre-commit"
  - "share/skeleton/policy.yaml"
  - "docs/PLANNING.md"
  - "test/cases/4788_a_plan_change_says_what_it_reopens.sh"
non_scope:
  - "Explaining an existing BLOCKED status (I4266)"
  - "Refusing the change by default: a re-opened milestone is sometimes the truth, and the owner decides"
depends_on: []
serves:
  - "a-downstream-adopter-is-told-the-truth-and-keeps-its-proofs#a-plan-change-says-what-it-reopens"
acceptance_criteria:
  - "In a fixture where milestone M1 is DONE and M2 depends on it with two READY issues, moving a new issue into M1 reports milestone_reopened for M1 and ready_now_blocked for both issues of M2, each naming the moved issue's file"
  - "Adding a depends_on edge to a not-DONE issue reports ready_now_blocked naming the edge"
  - "A change that re-opens nothing reports nothing, and validate without --against behaves as at 46775282570"
  - "With the policy key set, milestone_reopened exits 10"
validation:
  - "bash test/run.sh 4788_a_plan_change_says_what_it_reopens"
  - "bin/majordomus plan validate"
evidence_required:
  - "case_4788"
risk: "Medium. Deriving the plan twice doubles validate's cost on a large plan; the base derivation is cached by the base commit's tree id."
created_at: 2026-11-25
updated_at: 2026-11-25
