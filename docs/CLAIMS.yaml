  - id: evidence-proof-is-an-execution
    claim: A claim's proof is an execution that was recorded with the commit it ran against, not a test path that resolves
    source: docs/EVIDENCE.md
    implementation: apps/majordomus-cli/src/evidence/mod.rs
    test: test/cases/124_evidence.sh
    status: guaranteed
    responsibility: none
    note: The matrix binds a claim to a test by path, and the path check proves only that a file exists. The ledger under .ai/repo/evidence records the latest execution of every test with its outcome, duration, commit, tree state, source digest, time and origin; `majordomus evidence show` derives each claim's state from that join on every read, and a claim whose test nobody ran reads `not_run` rather than inheriting a guarantee from the file's existence.

  - id: rule-proof-is-named-and-resolves
    claim: Every blocking rule names what proves it, and every path it names is in the tree
    source: docs/DOCTRINE.md
    implementation: scripts/ci/rule-proof-check
    test: test/cases/125_rule_proof.sh
    status: guaranteed
    responsibility: none
    note: A rule could name a behavioural case in English prose, and nothing noticed when that case was renamed or deleted; the rule went on reading as enforced. The gate holds both halves of the relation. A named path that is not in the tree is `dangling` and is never ratcheted, because a proof that does not exist is worse than no proof. A blocking rule naming neither a validator nor a test nor a reason is `unproven`, which is the half no other check in this repository knows to look for.

  - id: rule-exemption-carries-its-reason
    claim: A rule that no program can express says so in its own front matter, with the reason, and is counted apart from every rule that has a gate
    source: docs/DOCTRINE.md
    implementation: scripts/ci/rule-proof-check
    test: test/cases/125_rule_proof.sh
    status: guaranteed
    responsibility: none
    note: 'Some rules genuinely have no machine expression: the provenance of what was written, whether a mechanism earns its cost. Before `reviewed_because` those sat in a debt list beside rules that merely had not been got round to, and the two were indistinguishable. The reason is the whole declaration — there is no flag beside it, because a flag can be set and a reason cannot be set without writing one. An executable proof always wins over it, so a rule that acquires a case stops being review-enforced without anyone remembering to delete anything.'

  - id: rule-state-is-derived-from-what-ran
    claim: A rule's proof state is derived from the tree and the ledger together, and a mechanism that refuses violations is never reported as a run that passed
    source: docs/DOCTRINE.md
    implementation: apps/majordomus-cli/src/rules/mod.rs
    test: test/cases/133_rule_graph.sh
    status: guaranteed
    responsibility: none
    note: '`majordomus doctrine` asks whether the repository satisfies a rule now; the proof graph asks whether the rule is in a state where it could be satisfied at all. Ten states, and the ones that must not collapse are `proven` (a passing run and nothing changed since), `gated` (an executable check a CI gate runs, with no verdict recorded here) and `reviewed` (a declared exemption). A rule''s state is the weakest of its parts, so one dangling case makes the rule dangling however many others pass.'

  - id: authored-files-are-english
    claim: Every authored file in this repository is spelled in English, and a proper noun or a test fixture that is not carries its reason beside the check
    source: docs/DOCTRINE.md
    implementation: scripts/ci/english-only-check
    test: test/cases/138_governance_gates.sh
    status: guaranteed
    responsibility: none
    note: 'The check is an alphabet test and says so: a letter that occurs in Czech, Slovak or Polish and never in English, or a whole other script, is not English whatever else is true of the file. English prose carrying a sentence of another language spelled in ASCII passes it, and always will — the rule stays wider than the gate, which is the honest relation between the two. The two exemptions are declared with a reason: `name` for a proper noun, `fixture` for a file that uses a foreign string as data to prove the program handles one.'

  - id: a-finding-names-how-to-see-it-again
    claim: Every finding a command reports names the command that reproduces it
    source: docs/DOCTRINE.md
    implementation: scripts/ci/finding-reproduce-check
    test: test/cases/138_governance_gates.sh
    status: guaranteed
    responsibility: none
    note: '`mj_finding` takes the reproduce command as its fifth argument and prints the finding without it when it is absent, so a caller that forgot one produced a finding that read exactly like a finding that could not have one. The gate counts the arguments of every call to the reporting helpers, treating a forwarding call as the caller''s business and reporting a call it cannot parse as unreadable rather than passing it silently. It landed with an empty baseline: the nine violations it found were fixed rather than recorded.'

  - id: evidence-currency-is-not-collapsed
    claim: A run recorded against this commit and a run whose inputs merely have not changed since are reported as different states, never as one
    source: docs/EVIDENCE.md
    implementation: apps/majordomus-cli/src/evidence/mod.rs
    test: test/cases/124_evidence.sh
    status: guaranteed
    responsibility: none
    note: '`proven` means the diff between the execution''s own commit and the working tree is empty, excluding the ledger''s own row — the tree in front of you is the tree the run measured. `inputs_unchanged` is a passing run where nothing the claim names differs from the working tree — the absence of a known invalidation, not proof at HEAD, because a change the claim does not name could have broken it. Collapsing the two is how a badge stops meaning anything, so the states are distinct in the model, in every projection and in the gate.'

  - id: evidence-partial-run-preserves-the-rest
    claim: Recording one test's result never erases the evidence recorded for any other test
    source: docs/EVIDENCE.md
    implementation: apps/majordomus-cli/src/evidence/ledger.rs
    test: test/cases/124_evidence.sh
    status: guaranteed
    responsibility: none
    note: The ledger is merged per test, not rewritten per run, so `bash test/run.sh 84_distribution_model` followed by a recording updates exactly that one entry. A whole-ledger write would turn a one-case run into a repository that has proven one thing, which is worse than one that has proven nothing because it looks deliberate.

  - id: evidence-navigates-both-ways
    claim: Every claim names the test that proves it and every test names the claims it proves, from one derivation
    source: docs/EVIDENCE.md
