# The Flowbite Pro kit profile: what `majordomus design kit` judges a repository's user
# interface against (I4334, ADR 0230).
#
# Markers only. This file names the attributes, class lists, package names and file
# shapes by which a tree shows that it is built on Flowbite Pro on Tailwind, and the
# packages of the kits it must not also use. It holds no Pro source: no template, no
# block, no stylesheet, no script of the licensed distribution is copied here or anywhere
# in this repository (rule project.ui-uses-flowbite-pro, "Licence"). The licensed sources
# live outside every repository, on the owner's machine.
#
# Every regular expression below is the `regex` crate's syntax, written in single quotes so
# that the YAML subset passes its backslashes through untouched. A repository adopts the
# profile with `majordomus design kit adopt flowbite-pro`, which writes the rule from
# flowbite-pro.rule.md beside this file, the two enforcement entries and `ui.kit:
# flowbite-pro` in the policy's `ui:` block (I4336); exemptions are the repository's own
# `ui.exempt` entries, and nothing in the policy narrows this profile.
schema: 1
id: flowbite-pro
title: Flowbite Pro on Tailwind 4 and Flowbite 4
rule: project.ui-uses-flowbite-pro
rule_file: ui-uses-flowbite-pro.v1.md
rule_template: design/kits/flowbite-pro.rule.md

# The files the signals read are the repository's: in a Git work tree, the tracked files and
# the untracked ones Git does not ignore, so a local virtualenv or an ignored build is never
# judged; elsewhere, every file below the root.
#
# Directories no signal reads: dependencies, build output, vendored sources (the licensed
# Pro distribution itself among them) and the layer. A bare name matches a directory of
# that name at any depth; a name with a slash matches a directory whose path ends with it.
# A minified script (`*.min.js`) is build output wherever it lies.
skip_dirs: [.git, node_modules, _build, deps, target, dist, build, out, .next, .nuxt, .svelte-kit, .turbo, .cache, coverage, vendor, tmp, .ai, priv/static, .venv, venv, __pycache__, .elixir_ls, .docusaurus, _site]

# Of skip_dirs, the vendored ones: no signal reads a file in them, and their paths are still
# listed, because a vendored copy of a kit is a path (the licensed markers, S4's vendored
# files) whatever imports it.
vendored: [vendor]

# Files larger than this are build output, not something a person wrote.
max_file_bytes: 1048576

# The files whose text the markup signals (S3, S4 imports, S5) read, by extension.
markup: [html, htm, heex, eex, leex, tsx, jsx, vue, svelte, astro, erb, hbs, njk, liquid, twig, ex]
# Of those, the source files whose markup is embedded: one is read only when it carries the
# sigil (Phoenix keeps components, LiveViews and, since 1.8, the app layout in ~H).
embedded_markup:
  - extension: ex
    sigil: '~H'
scripts: [js, mjs, cjs, ts, tsx, jsx, vue, svelte]
styles: [css, pcss, postcss, scss]

# S0: whether the repository has a user interface at all, and the surfaces it has. A
# repository without one passes vacuously.
#
# A surface is one UI manifest and the files below its directory. The root surface is
# `package_manifests` (Phoenix keeps its bundle's manifest in assets/) and every file no
# other surface owns. Every declared workspace (`workspaces` in the root manifest, plain or
# under `packages`, and the `pnpm_workspace` file) is a surface of its own when its manifest
# declares a UI package, and so is a nested app: a manifest outside `not_app_dirs` with
# `app_markup` in its own subtree. Any other manifest that declares a UI package is a notice,
# never a finding and never a surface, so a vacuous pass is never a silent one.
#
# Published pages are an interface whatever builds them: a page at the root, and a page
# under `published.dirs`, under a directory an upload-pages-artifact step or a deploy, build,
# publish or release script names, and under docs/ when docs/ is published (a CNAME or a
# .nojekyll there, or a Pages artifact or publish_dir step whose path is docs).
ui:
  package_manifests: [package.json, assets/package.json]
  manifest: package.json
  pnpm_workspace: pnpm-workspace.yaml
  not_app_dirs: [examples, example, fixtures, fixture, tests, test, __tests__, spec, vendor, docs, deps, priv, node_modules]
  app_markup: [html, htm, heex, jsx, tsx, vue, svelte]
  packages: [tailwindcss, '@tailwindcss/vite', '@tailwindcss/postcss', '@tailwindcss/cli', react, next, vue, svelte, flowbite, flowbite-react]
  mix_file: mix.exs
  mix_deps: [phoenix_live_view]
  files: ['**/*.heex', '**/templates/*.html', 'app/layout.tsx', 'src/app/layout.tsx', index.html, src/index.html, app/index.html, web/index.html, client/index.html, ui/index.html]
  published:
    dirs: [site, www, public]
    pages: [html, htm]
    skip: [public/assets, public/build]
    docs: docs
    docs_markers: [docs/CNAME, docs/.nojekyll]

# The wiring markers: what connects the kit to a surface's build. Wiring is owed, and it is
# never enough: a surface passes S1 to S3 only when its own files also carry a usage marker.
wiring:
  # S1: the dependency. React and Next take the framework binding.
  dependency:
    package: flowbite
    react_package: flowbite-react
    react_when: [react, next]
  # S2: the Tailwind plugin and the source Tailwind scans for Flowbite's classes.
  plugin:
    # Tailwind 4: CSS-first configuration.
    v4_entry: '@import\s+["'']tailwindcss["'']'
    v4_plugin: '@plugin\s+["'']flowbite(-react)?/plugin(/tailwindcss|\.js)?["'']'
    v4_source: '@source\s+["''][^"'']*flowbite[^"'']*["'']'
    # Tailwind 3: tailwind.config.* with the plugin and a content glob over Flowbite. The
    # paths are relative to the surface's directory and to each of its manifests'. The entry
    # is the directive or its postcss-import form. flowbite-react 0.10 configures both
    # through flowbite-react/tailwind: `v3_binding` finds the identifier a configuration binds
    # to it (capture group 1 or 2), and the plugin and the content are then owed as that
    # identifier's `.plugin()` and `.content()`, never another object's.
    v3_entry: '(@tailwind\s+(base|components|utilities)|@import\s+["'']tailwindcss/(base|components|utilities)["''])'
    v3_configs: [tailwind.config.js, tailwind.config.cjs, tailwind.config.mjs, tailwind.config.ts, assets/tailwind.config.js, assets/tailwind.config.cjs, assets/tailwind.config.mjs, assets/tailwind.config.ts]
    v3_plugin: '(require\(\s*["'']flowbite(-react)?/plugin["'']\s*\)|from\s+["'']flowbite(-react)?/plugin["''])'
    v3_content: '["''][^"'']*flowbite[^"'']*\*[^"'']*["'']'
    v3_binding: '(?:\b(?:const|let|var)\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*require\(\s*["'']flowbite-react/tailwind["'']\s*\)|\bimport\s+(?:\*\s+as\s+)?([A-Za-z_][A-Za-z0-9_]*)\s+from\s+["'']flowbite-react/tailwind["''])'
    # Tailwind compiled in the browser is not a build.
    play_cdn: '(cdn\.tailwindcss\.com|@tailwindcss/browser)'
    # Flowbite fetched from a CDN, with no package behind it.
    cdn_flowbite: '(src|href)=["'']https?://[^"'']*(cdn|unpkg|jsdelivr|cdnjs)[^"'']*flowbite[^"'']*["'']'
  # S3: what proves Flowbite's JavaScript is loaded.
  loaded: '((import|from)\s+["'']flowbite(/[^"'']*)?["'']|require\(\s*["'']flowbite(/[^"'']*)?["'']\s*\)|<script\b[^>]*\bsrc=["''][^"'']*flowbite[^"'']*\.js[^"'']*["'']|from\s+["'']flowbite-react["''])'

# The usage markers: what shows that a surface's own files use the kit, rather than only
# declaring and loading it.
usage:
  # The attributes Flowbite's JavaScript drives; S3 owes the JavaScript behind them.
  attributes: '\bdata-(drawer|dropdown|modal|tabs|collapse|tooltip|popover|accordion|dial|carousel|dismiss)-[a-z-]+'
  # A flowbite-react component in use.
  components: 'import\s*\{[^}]*\}\s*from\s*["'']flowbite-react["'']'
  # Flowbite's JavaScript API called by name.
  api: '\bnew\s+(Drawer|Dropdown|Modal|Tabs|Collapse|Tooltip|Popover|Accordion|Dial|Carousel|Dismiss|Datepicker)\s*\('
  # A script that reads those attributes itself re-implements Flowbite.
  reimplemented: '(querySelector(All)?\(\s*["''][^"'']*\[data-(drawer|dropdown|modal|tabs|collapse|tooltip)-|getAttribute\(\s*["'']data-(drawer|dropdown|modal|tabs|collapse|tooltip)-|dataset\.(drawer|dropdown|modal|tabs|collapse|tooltip)[A-Z])'

# The licence. Flowbite Pro is licensed, so the profile declares its licensed markers: what
# in a tree is the licensed distribution itself (a directory or a manifest named after a
# Pro product), as opposed to markup adapted from it. Where a tree carries one, the licence
# evidence (kit-evidence/v1, read by the design licence of I4336) decides it: active passes,
# and inactive, refused or not judged is a finding no exemption moves, because a variant the
# judge cannot decide is never a pass.
licence:
  evidence: kit-evidence/v1
  markers:
    - name: a Flowbite Pro distribution directory
      path: '(^|/)(flowbite-pro-[a-z0-9.-]+|flowbite-react-blocks-[a-z0-9.-]+|publisher-ui-blocks-[a-z0-9.-]+)(/|$)'
    - name: a manifest named after a Flowbite Pro product
      text: '"name"\s*:\s*"(flowbite-pro-[a-z0-9.-]+|flowbite-react-blocks[a-z0-9.-]*)"'
    # Matched against dependency names only (dependencies, devDependencies,
    # peerDependencies, optionalDependencies), so a script or any other key named like a Pro
    # product is no marker.
    - name: a dependency on a Flowbite Pro package
      dependency: '^(flowbite-pro-[a-z0-9.-]+|flowbite-react-blocks[a-z0-9.-]*)$'

# S4: the kits that must not also be used. A name ending in `/` is an npm scope: every
# package under it is that kit. An import names the package, or a path through a vendor/ or
# node_modules/ directory that ends in it (`@plugin "../vendor/daisyui"`, as Phoenix 1.8
# vendors daisyUI). `mix` names Hex packages read from every mix.exs, `files` the
# configuration a kit's installer leaves behind, and `vendored` the kit's own files by path
# wherever they lie, vendored directories included.
forbidden:
  - kit: daisyUI
    packages: [daisyui]
    vendored: '(^|/)daisyui(-theme)?\.m?js$'
  - kit: Bootstrap
    packages: [bootstrap, react-bootstrap, bootstrap-vue]
  - kit: Preline
    packages: [preline]
  - kit: TW Elements
    packages: [tw-elements, tw-elements-react]
  - kit: shadcn/ui and Radix
    packages: [shadcn, shadcn-ui, '@radix-ui/']
    files: [components.json]
  - kit: Petal Components
    mix: [petal_components]
  - kit: Material UI
    packages: ['@mui/', '@material-ui/']
  - kit: Ant Design
    packages: [antd]
  - kit: Bulma
    packages: [bulma]
  - kit: Chakra UI
    packages: ['@chakra-ui/']
  - kit: Foundation
    packages: [foundation-sites]
  - kit: Materialize
    packages: [materialize-css, '@materializecss/materialize']

# Reported, never refused: a runtime that is not a kit.
reported:
  - kit: Alpine.js
    packages: [alpinejs]
    markup: '\bx-data\s*='

# S5: the Pro shell on each root layout. The layouts and the role aliases are the profile's
# alone: the policy's `ui:` block declares neither (ADR 0230). A `*.html.heex` layout is
# judged together with the `root.html.heex` beside it, because Phoenix splits the document
# from the shell. Phoenix 1.8 draws the app layout in `layouts.ex` (`Layouts.app/1`): that
# file is a layout when it carries ~H, and it is judged together with the app and root
# templates of its `layouts/` directory (`embedded_templates`), which are then no layouts of
# their own; another template there, such as an email's, supplies nothing. A layout under
# `marketing_layouts`, a published site's, is judged by a navbar and a footer instead of the
# application shell.
shell:
  layouts: ['app/layout.tsx', 'src/app/layout.tsx', '**/components/layouts.ex', '**/components/layouts/app.html.heex', '**/templates/layout/app.html.heex', 'index.html', 'src/index.html', 'templates/base.html', '**/templates/base.html']
  companion: root.html.heex
  embedded_templates: [app.html.heex, root.html.heex]
  marketing_layouts: ['site/**', 'www/**', 'docs/**']
  fixed_nav: '<nav\b[^>]*\bclass(Name)?=["''{][^"''}]*\bfixed\b'
  sidebar: '<aside\b[^>]*\baria-label=["'']Sidebar["'']'
  # flowbite-react draws the sidebar and the breadcrumb as components.
  react_sidebar: '<Sidebar\b[^>]*\baria-label='
  breadcrumb: '<nav\b[^>]*\baria-label=["'']Breadcrumb["'']'
  react_breadcrumb: '<Breadcrumb\b'
  # The marketing shell a layout under `marketing_layouts` is judged by instead.
  marketing_nav: '<nav\b'
  marketing_footer: '<footer\b'
  # Each role is met by every class of one alternative (a space-separated class list): the
  # raw Pro utilities first, then the role aliases a token rule declares.
  roles:
    page: ['bg-gray-50 dark:bg-gray-900', bg-page]
    surface: ['bg-white dark:bg-gray-800', bg-surface]
    border: ['border-gray-200 dark:border-gray-700', border-default]
