id: I3428
milestone: an-entity-says-how-it-is-known-and-what-it-affects
title: "An entity read carries the observation envelope repository.info already answers, plus the blob of its file, and a change to that file moves both"
slug: an-entity-read-says-when-it-was-observed
priority: p2
profile: implementation
objective: "Add to EntityView the observed envelope that repository.info already carries: observed.index with observed_at and stale_after, from the index observation crate::live takes. Add the blob of the object's file from the git index, beside the last-changing commit I3314 adds. A member of a collection file names the file it is read from. Introduce no new freshness type."
why: "The owner's 2026-10-19 Cognitive Fabric pack asks for last-verified time and source freshness on the shared projection (campaigns/prismatic-way-cognitive-fabric-prompt-pack/prompts/05_SURFACES.md). verification/ACCEPTANCE.md asks every surface to show the same freshness semantics."
current_state: "EntityView has no observation time and no blob (apps/majordomus-cli/src/capability/builtin/entity.rs:395-435). repository.info carries observed.index with observed_at and stale_after (test/cases/545_every_answer_says_when_it_was_observed.sh:9-12). UI readings carry the age of the cache reading, not of the record (apps/majordomus-cli/src/capability/readings.rs:1-27). I3314 plans the last commit."
desired_state: "Every entity read carries the time of the index observation it was answered from, in repository.info's shape, and the blob of its file. After a commit that changes the file, the next read carries a later observed_at and the new blob."
scope:
  - "apps/majordomus-cli/src/capability/builtin/entity.rs"
  - "apps/majordomus-cli/src/live.rs"
  - "apps/majordomus-cli/tests/objects.rs"
  - "docs/generated/registry.json"
  - "docs/generated/registry.yaml"
  - "docs/generated/openapi.json"
  - "docs/generated/openapi.yaml"
  - "site/data/generated/openapi.json"
  - "site/data/registry/registry.json"
non_scope:
  - "Storing history or freshness in the index"
  - "A per-request stat of every object (live.rs:30-36 says why)"
  - "A new freshness type beside evidence::freshness and readings::Freshness"
  - "The observed envelope on capabilities other than entity.show"
depends_on:
  - "I3314"
  - "I3427"
serves:
  - "a-change-reconciles-what-it-affects#every-surface-reads-one-entity"
acceptance_criteria:
  - "entity.show of an ADR carries observed.index (observed_at, stale_after) in repository.info's shape and the blob of its file"
  - "After a commit that changes the file, the next read has a later observed_at and the new blob; a read with no change keeps both"
  - "An object with no file of its own says not applicable, never an empty value"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test objects"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib live"
  - "bash test/run.sh 545_every_answer_says_when_it_was_observed"
  - "bin/majordomus-cli generate --check"
evidence_required:
  - "test_entity_observed_envelope"
created_at: 2026-10-19
updated_at: 2026-10-19
