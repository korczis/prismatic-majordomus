id: I3251
milestone: an-outcome-becomes-a-reviewed-plan
title: "A desired outcome is briefed with what the repository already holds about it"
slug: an-outcome-is-briefed
priority: p2
profile: implementation
objective: "Revive I2206 from origin/chore/the-owner-packs-are-planned (ec37317fe7c, 2026-10-10, never landed): `intent draft brief <statement>` returns, read-only, the intents, criteria, milestones, issues, capabilities and rules whose records match the outcome, each with the reason it matched, before anything is proposed."
why: "The owner asked on 2026-10-09 what derive's interface is and on 2026-09-15 for impact analysis before planning; reusing devcontext and the capability graph is cheaper than a new analysis. Proposed in ADR 0191 (A plan drafted from an intent is a proposal, checked by the plan's own validators before any record is written) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c146#5, chatgpt-majordomus:c205#2. The owner's pack of 2026-11-07 asks for the same in campaigns/majordomus-intent-workbench-pack-20261107/prompts/02-P02-EVIDENCE-BACKED-CONTEXT.md; the criteria this record did not hold were folded in on 2026-11-07."
current_state: "intents.propose writes a declared intent from a sentence and checks only that the id is free; devcontext compiles context from an issue, milestone, text or paths."
desired_state: "The brief is a composition of devcontext and the object search, answered by one capability."
scope:
  - "apps/majordomus-cli/src/capability/builtin/intents.rs"
  - "apps/majordomus-cli/src/devcontext/select.rs"
  - "apps/majordomus-cli/src/devcontext/mod.rs"
  - "apps/majordomus-cli/src/capability/builtin/objects.rs"
  - "apps/majordomus-cli/src/commands/intent.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/tests/intent.rs"
acceptance_criteria:
  - "An outcome naming an existing intent's subject lists that intent first with the matching terms"
  - "The brief writes nothing"
  - "A brief asked for a draft revision names that revision, and an answer for an older revision of the same draft is discarded rather than shown"
  - "The brief reports, for each source class it reads (records, rules and ADRs, knowledge, code, git history), whether it was read, partial or unavailable, with the reason"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
evidence_required:
  - "test_an_outcome_is_briefed"
created_at: 2026-10-18
updated_at: 2026-11-07
