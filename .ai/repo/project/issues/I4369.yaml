id: I4369
milestone: work-graph-github
title: "A record renamed with `replaces:` keeps its GitHub issue or milestone, and an issue whose record was renamed without one stays unmanaged, names the commit that removed its record, and is never closed or reused"
slug: a-renamed-record-keeps-its-github-issue
priority: p2
profile: implementation
parallel_safe: false
objective: "The issue and milestone schemas gain a key `replaces`, a list of former ids, with share/allow/issue.txt and share/allow/milestone.txt regenerated by `majordomus generate`. plan validate, in both engines (lib/project.awk and apps/majordomus-cli/src/plan.rs, compared by case 99), refuses a `replaces` entry that names a record still present, or a former id claimed by two records. scripts/github-sync, and so the forge command that packages it (I4370), resolves an issue projected for a replaced id as the replacing record's issue: it moves the identity marker to the replacing record and retitles the issue, so one GitHub number survives the rename, and --check reports the replacing record `behind`, not `missing`, and the old issue not `unmanaged`. A milestone, which github-sync finds by its `<id> — ` title prefix (github-sync:277), is found by a replaced id's prefix the same way and retitled, so its number and its issues' assignment survive. When both the old and the new id already have an issue, --apply closes the old one as not planned with the comment 'superseded by #<n>', and from then on --check does not report it unmanaged. Without `replaces:`, nothing new is invented: the old issue stays `unmanaged` (github-sync:1121-1130), --check exits 11 on it (:1138), and --apply never closes it, never reuses its number and never rewrites its marker. The unmanaged finding gains one fact when git history holds the record (`git log --diff-filter=D` on its path): the commit that removed it, so a forgotten `replaces:` is told apart from an id that was never a record here; where the history cannot be read (a shallow clone) the finding says so instead of reading as never a record. `next --kind issue` (I4357) counts replaced ids as taken, and the identifier landing check refuses a new record whose id a `replaces` entry names."
why: "The marker made a title rename harmless (I1401), but an id rename still forks the projection: the old issue reads unmanaged and the new id reads missing, so the next --apply creates a second issue and the first is left behind with its history. A milestone is keyed by its title prefix, so an id rename creates a second milestone and leaves the first with no finding at all. On 2026-10-22 an apply against a truncated listing created 487 duplicates (I3920); a rename is the same failure one record at a time. OSCILLA's owner decided on 2026-10-29 to mirror its plan milestones first and its issues later, so the rule has to exist before any milestone or issue of an adopter is written."
current_state: "Measured at 5370ee63d19: scripts/github-sync:28-33 keys a record by <!-- majordomus:record <id> --> and says a title rename would orphan the record if titles were the key; github-sync:35-46 defines insync, behind, edited, conflict, adopt and missing, and `unmanaged` for an issue claiming an id the repository does not have; remote_issue_line (:271-276) resolves an issue by its marker only, or by title once when it has none; remote_milestone_number (:277) resolves a milestone by its `<id> — ` title prefix, and nothing reports a GitHub milestone the model does not have; :1014 reports a record with no counterpart DRIFT missing and --apply creates it; :1121-1130 reports an issue whose marker or canonical-shaped title names an absent record as DRIFT unmanaged (the note at :1129), and --check exits 11 on any drift (:1138); the finding does not say whether the id was ever a record; the listing guard of I3920 (:252-263, a listing shorter than totalCount exits 12) is in the code, while the record I3920 is still open and unstamped; share/allow/issue.txt and share/allow/milestone.txt have no `replaces` key (a milestone has only the forward pointer `superseded_by`); nothing relinks an issue or a milestone when its record's id changes; I4357 (open) adds `next --kind issue|adr|case --reserve` and the identifier landing check (scripts/ci/collision-gate, which today compares added paths, not ids). The adapter is scripts/github-sync today and I4370 moves it to share/libexec/github-sync and lib/forge.sh; this record changes whichever file holds the adapter when this lands, and does not wait for I4370."
desired_state: "Renaming a record with `replaces:` moves its GitHub issue or milestone with it; renaming an issue without it stays an unmanaged drift finding that names the commit that removed the record and changes nothing on GitHub. Enforced by case 4369, cases 45, 99 and 894, and plan validate in both engines."
