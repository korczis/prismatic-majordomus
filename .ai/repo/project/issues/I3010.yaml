id: I3010
milestone: surfaces-never-disagree
title: "The mesh manual says the edit guard is not wired, and how to wire it by hand"
slug: the-edit-guard-is-documented-as-it-is
priority: p1
profile: implementation
parallel_safe: true
objective: "docs/MESH.md stops saying the edit guard is wired in the provider's configuration. It says that `capture install` writes no PreToolUse entry, so `session.edits_require_claim` refuses nothing in Claude Code yet; that the hook script and guard.edit exist; how a person wires it by hand (the entry, which settings file, a new session); and that wiring it and refusing an unclaimed edit are the generated-plugin work after the alpha."
why: "On 2026-10-19 a read-only audit for the owner's global-skills mission found the claim false on master 2dfff96988a and again on 9904000: the project's Claude Code settings carry no PreToolUse entry, and nothing in lib/, src/ or share/ writes one, while the manual showed the entry as wired and the policy sets edits_require_claim: true. A false enforcement claim is alpha-severity under the owner's truth order."
current_state: "The manual presents the PreToolUse entry as wired; it is not."
desired_state: "The manual states what runs today, the hand wiring, and the follow-up issues."
