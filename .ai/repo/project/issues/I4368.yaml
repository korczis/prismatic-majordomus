acceptance_criteria:
  - "Library test in release::changelog: with project.yaml repository korczis/oscilla and default_branch main and release records v3.12.1 and v3.13.0, the v3.13.0 section links https://github.com/korczis/oscilla/compare/v3.12.1...v3.13.0, tree/v3.13.0 and releases/tag/v3.13.0, a change links https://github.com/korczis/oscilla/commit/<sha>, a decision links blob/main/<path>, and the unreleased section links compare/v3.13.0...main and tree/main"
  - "Library test in release::changelog: with no project.yaml the links are https://github.com/korczis/prismatic-majordomus and master, exactly as today"
  - "Library test in release::commits: with `history: first-parent` declared, a fixture range of three first-parent commits yields exactly three changes carrying pull requests 247, 245 and 246, and none of the merged branches' inner commits. The commits are a merge 'feat(studio): V603 pinch zoom on the timeline (#247)' (PR_TITLE form, read as feat, scope studio), a merge 'Merge pull request #245 from korczis/test/s080-pattern-matrix' whose body's first line is 'test(engine): S080 every pattern through the §80 matrix leaves no node' (read as test, scope engine), and a squash commit 'test(plan): the two heads of #238 are squash-merged evidence commits (#246)'"
  - "Library test in release::commits: the same fixture range with no history declared yields exactly the changes `git log --no-merges` lists, with no pull request field set"
  - "Case 4368 renders `majordomus release changelog` in a fixture shaped like OSCILLA's v3.12.1..v3.13.0 window (nine `Merge pull request #N from ...` merges, #223 to #226, #230 and #232 to #235, and the squash commits #229, #236 and #237) with `history: first-parent`: it lists exactly twelve changes, each linked to https://github.com/korczis/oscilla/pull/<N>, and no line begins with 'Merge pull request'; without the declaration it lists the branches' non-merge commits as today"
  - "Case 4368: a project.yaml carrying `history: first-parent` raises no undeclared-key finding in `majordomus doctor` (share/allow/project.txt lists it); one carrying `history: no-such-mode` makes `majordomus release changelog` exit non-zero naming the key and the value, never a silent fallback to --no-merges; `majordomus generate --check` reports share/allow/project.txt and share/schemas/generated/changelog.schema.json in sync"
  - "`majordomus generate changelog --check` passes on this repository after the change, and the pull request changes no byte of docs/generated/changelog.{md,json,yaml} or site/data/generated/changelog.json"
