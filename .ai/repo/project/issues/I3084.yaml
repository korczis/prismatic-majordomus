id: I3084
milestone: public-proof
title: "An article explains the mesh in both languages: many machines, one journal"
slug: many-machines-one-journal
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/many-machines-one-journal.md, an English article on how sessions on several machines cooperate through the Majordomus mesh. It covers what ADR 0067 measured: a peer board lives in one process, a repository on two machines was two, and presence was a sighting. It covers the trust a commit grants a machine and the signed handshake that admits a link. It covers one journal of signed events folded the same way everywhere, and claims that live on a heartbeat, with the recorded run between two machines. It covers handovers and reviews across the link, and what the mesh does not do. Every statement is one that ADR 0067, ADR 0050, ADR 0044, ADR 0059, rule project.mesh-cooperation-is-authenticated or docs/MESH.md on master states, and no count is typed by hand. site/content-src/mnoho-stroju-jeden-denik.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the seats, claiming and continuity articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. The mesh is how sessions on different machines see each other's work, and the site explained it only in docs/MESH.md, the rule and the ADRs, which are written for the sessions that follow them."
current_state: "No article explains the mesh. The article groups relate each other, and none of them names it."
desired_state: "/many-machines-one-journal/ and /mnoho-stroju-jeden-denik/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 passes, with the translation at its source's digest."
