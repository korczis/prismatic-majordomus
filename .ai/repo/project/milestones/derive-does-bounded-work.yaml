  - "apps/majordomus-cli/src/commands/generate.rs"
  - "apps/majordomus-cli/src/capability/builtin/artifacts.rs"
  - "apps/majordomus-cli/src/gates"
  - "apps/majordomus-cli/tests"
  - "share/schemas/generated"
