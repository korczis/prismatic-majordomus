# Claims matrix — the canonical answer to "what does Majordomus actually do today?"
#
# Every capability sentence on the public website is rendered from this file. Nothing
# else on the site may state a capability. The rule from AGENTS.md applies here:
# no claim without an executable behind it.
#
# status:
#   guaranteed  implemented, deterministic, and backed by a behavioural test that runs
#   advisory    projected into worker instructions; a worker may ignore it and nothing
#               detects that it did. Documentation, not enforcement.
#   planned     specified and not implemented. Named so that omissions are visible.
#   rejected    considered and deliberately refused, with the reason in note. Published so
#               that a reader can see what was refused rather than assume it was forgotten.
#
# fields:
#   claim           one sentence, present tense for guaranteed, plain future for planned
#   source          the canonical file that defines the behaviour
#   implementation  the file that implements it, or "-" when nothing does
#   test            the behavioural test that proves it, or "-" when none does
#
# `scripts/generate-site-data --check` verifies that every source, implementation and test
# path in this file exists. A guaranteed claim with no test path is an error.
version: 1

claims:
  - id: policy-parse
    claim: The canonical policy is parsed and rejected if it contains an unknown key
    source: docs/SCHEMAS.md
    implementation: lib/common.sh
    test: test/cases/00_yaml_flatten.sh
    status: guaranteed
    responsibility: policy
    note: A restricted YAML subset. Tabs, anchors, flow maps and multi-line scalars are refused rather than guessed at.

  - id: profile-validate
    claim: Every profile is parsed, its unknown keys rejected, and the default profile proven to exist
    source: docs/SCHEMAS.md
    implementation: lib/doctor.sh
    test: test/cases/02_doctor_basic.sh
    status: guaranteed
    responsibility: profiles

  - id: wiring-reconciliation
    claim: Every enforcement the policy declares is reconciled against what actually runs
    source: docs/DESIGN.md
    implementation: lib/doctor.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: doctor
    note: The path must exist, be executable, and be invoked by the named dispatcher. A hook that invokes it and discards the exit code counts as not wired.

  - id: exit-code-contract
    claim: Exit codes are a contract, and no code means "warn and continue"
    source: docs/CLI.md
    implementation: lib/common.sh
    test: test/cases/03_update.sh
    status: guaranteed

  - id: projection-generation
    claim: Provider instruction files are generated from the one policy, deterministically
    source: docs/DESIGN.md
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection
    note: Running update twice leaves the byte-identical file. The test asserts the hash.

  - id: projection-fingerprint
    claim: Every generated instruction file is fingerprinted, and a hand edit is detected
    source: docs/SCHEMAS.md
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection

  - id: region-projection
    claim: A projection can own only the region between its markers, leaving the rest of the file untouched
    source: docs/SCHEMAS.md
    implementation: lib/update.sh
    test: test/cases/13_region_projection.sh
    status: guaranteed
    responsibility: projection
    note: How a repository that already has a hand-written CLAUDE.md adopts Majordomus. An edit outside the markers is never drift; an edit inside them is caught. Malformed markers are refused, not guessed at.

  - id: dispatcher-wiring
    claim: Wiring is found in a hook or in any subhook of the directory that hook dispatches to
    source: docs/CLI.md
    implementation: lib/doctor.sh
    test: test/cases/14_wiring_dispatcher.sh
    status: guaranteed
    responsibility: doctor
    note: The finding names the file that actually carries the invocation. A subhook that is not executable is reported as not wired, because the dispatcher skips it.

  - id: doctrine-registry
    claim: Every rule the tool enforces is declared in one registry, and doctor proves each one is reached by the command that claims to run it
    source: docs/DOCTRINE.md
    implementation: lib/doctrine.sh
    test: test/cases/18_doctrine_wiring.sh
    status: guaranteed
    responsibility: doctor
    note: A doctrine whose validator does not exist, a validator no doctrine declares, a command that never dispatches, a blocking rule whose command cannot exit non-zero, a missing test, and CI that swallows the suite are six separate failures with six separate messages. Each is mutation-tested.

  - id: doctrine-class-decides
    claim: A doctrine's class is what decides whether a violation stops the command, not a label beside it
    source: docs/DOCTRINE.md
    implementation: lib/doctrine.sh
    test: test/cases/17_doctrine_enforcement.sh
    status: guaranteed
    responsibility: policy
    note: The test changes checkpoint freshness from advisory to blocking in a copy of the registry and asserts that check's exit code moves from 0 to 10. There are two classes and no override.

  - id: ledger-integrity
    claim: Every line of the append-only ledger is a well-formed event, and a malformed line is a failure rather than a skipped record
    source: docs/DOCTRINE.md
    implementation: lib/check.sh
    test: test/cases/22_history.sh
    status: guaranteed
    responsibility: state
    note: The reader skips a bad line rather than crashing, and check, doctor and watch all report it. The ledger is the one durable record nothing else can reconstruct.

  - id: decision-attribution
    claim: A decision record without a task, a head and a reason is reported, and does not block
    source: docs/DOCTRINE.md
    implementation: lib/check.sh
    test: test/cases/21_decision_question.sh
    status: advisory
    responsibility: state
    note: decisions.md is hand-editable by design, so an unattributable entry is a warning. finish still refuses when a profile requires a record it cannot find.

  - id: blocker-store
    claim: An entry in the questions store that does not parse blocks acceptance exactly as an unresolved question does
    source: docs/DOCTRINE.md
    implementation: lib/check.sh
    test: test/cases/21_decision_question.sh
    status: guaranteed
    responsibility: scope
    note: A gate that cannot read an entry can be bypassed by mistyping one, so an unreadable question is not a lesser problem than an open one.

  - id: prompt-assets
    claim: Every repository-local prompt asset renders, and an unknown token is a failure
    source: docs/DOCTRINE.md
    implementation: lib/prompt.sh
    test: test/cases/24_prompt_search.sh
    status: guaranteed
    responsibility: policy
    note: Covers name and filename mismatch, an empty description, an unknown front-matter key, missing front matter, and a block token used inline.

  - id: no-silent-overwrite
    claim: A hand-edited instruction file is never silently overwritten
    source: docs/CLI.md
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection
    note: update refuses, offers a diff, and overwrites only under an explicit flag.

  - id: context-budget
    claim: The always-loaded instruction file has a line budget with a failing check
    source: share/skeleton/policy.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection
    note: Over budget, nothing is written at all.

  - id: pointer-integrity
    claim: Every repository-relative reference in the always-loaded file is proven to resolve
    source: docs/DESIGN.md
    implementation: lib/doctor.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: doctor

  - id: no-counts-in-context
    claim: A hardcoded count in the always-loaded file is a failure
    source: docs/DESIGN.md
    implementation: lib/doctor.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: doctor

  - id: retention-caps
    claim: The append-only ledger and handover store have retention caps that are checked
    source: share/skeleton/policy.yaml
    implementation: lib/doctor.sh
    test: test/cases/02_doctor_basic.sh
    status: guaranteed
    responsibility: doctor

  - id: init-refuses
    claim: Installing into a repository that already has an installation is refused
    source: docs/CLI.md
    implementation: lib/init.sh
    test: test/cases/01_init.sh
    status: guaranteed

  - id: reproduce-command
    claim: Every finding carries the command that reproduces it
    source: docs/DESIGN.md
    implementation: lib/common.sh
    test: test/cases/02_doctor_basic.sh
    status: guaranteed

  - id: no-network
    claim: Nothing performs a network call, evaluates generated text, or deletes recursively
    source: docs/DESIGN.md
    implementation: bin/majordomus
    test: test/cases/08_no_forbidden_constructs.sh
    status: guaranteed

  - id: scoped-task
    claim: A task is started with a declared file scope and a profile, and only one task is active per checkout
    source: docs/CLI.md
    implementation: lib/start.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope
    note: A scope path that escapes the repository root is refused. Starting a second task while one is active is refused.

  - id: git-identity
    claim: Identity fields on every state record are computed from git and never authored
    source: docs/SCHEMAS.md
    implementation: lib/start.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: state
    note: A handover body that tries to set one is rejected rather than merged.

  - id: consistency-check
    claim: check reports whether state, scope, blockers and checkpoint age are consistent right now
    source: docs/CLI.md
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope

  - id: scope-enforcement
    claim: A touched file outside the claimed scope is a failure, not a warning
    source: docs/DESIGN.md
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope

  - id: divergence-label
    claim: State read back is labelled exact, advanced, diverged or different_context against git
    source: docs/SCHEMAS.md
    implementation: lib/common.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: state

  - id: overlap-report
    claim: Overlap between parallel workers is computed on claimed paths in both containment directions
    source: docs/DESIGN.md
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope
    note: Reported, never blocking. Work in progress is reported and never blocked.

  - id: drift-watch
    claim: watch reports policy, projection, state, scope, handover, verification, staleness and retention drift
    source: docs/DESIGN.md
    implementation: lib/watch.sh
    test: test/cases/07_watch.sh
    status: guaranteed
    responsibility: watch

  - id: handover-record
    claim: handover writes an append-only record with computed front matter and required sections
    source: docs/SCHEMAS.md
    implementation: lib/handover.sh
    test: test/cases/05_handover.sh
    status: guaranteed
    responsibility: handover
    note: A body with a missing or empty required section is refused and names the sections.

  - id: no-transcripts
    claim: Handovers carry durable facts, never conversation transcripts
    source: docs/DESIGN.md
    implementation: lib/handover.sh
    test: test/cases/05_handover.sh
    status: guaranteed
    responsibility: handover

  - id: finish-contract
    claim: finish evaluates the finish contract line by line and refuses when any line is unmet
    source: docs/CLI.md
    implementation: lib/finish.sh
    test: test/cases/06_finish.sh
    status: guaranteed
    responsibility: finish

  - id: typed-outcome
    claim: An outcome is a value from a closed vocabulary, not free text
    source: docs/SCHEMAS.md
    implementation: lib/finish.sh
    test: test/cases/06_finish.sh
    status: guaranteed
    responsibility: finish
    note: no_match means the work was done and the thing sought does not exist. failed means the work could not be done. They are different facts.

  - id: profile-axes
    claim: Capability class, reasoning effort, output verbosity, context and verification are five independent axes
    source: share/skeleton/profiles/implementation.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: advisory
    responsibility: profiles
    note: The axes are validated and projected into the worker's instructions. Whether a worker honours them is not observable from outside the worker.

  - id: capability-class
    claim: A profile names a capability class rather than a vendor model
    source: share/skeleton/profiles/deep-work.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: advisory
    responsibility: profiles
    note: Mapping a class to a concrete model is left to whoever runs the worker. Majordomus never selects or invokes a model.

  - id: minimum-context
    claim: A profile declares which context a worker should load and no more
    source: share/skeleton/profiles/routine.yaml
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: advisory
    responsibility: profiles
    note: majordomus context now assembles a briefing from those toggles, and that selection is guaranteed (see context-assembly). This claim stays advisory because nothing measures what the worker actually read once it has been handed the briefing.

  - id: effort-escalation
    claim: Escalating reasoning effort after repeated blocked attempts is recorded rather than assumed
    source: share/skeleton/profiles/debugging.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: advisory
    responsibility: profiles

  - id: checkpoint-interval
    claim: A profile sets how often a worker should checkpoint, and a stale task is reported
    source: share/skeleton/policy.yaml
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: advisory
    responsibility: profiles
    note: The staleness report is guaranteed. Whether the worker checkpoints is not.

  - id: context-assembly
    claim: The context a worker is given is assembled from durable state in authority order, and what a profile excludes is excluded
    source: docs/CONTINUITY.md
    implementation: lib/context.sh
    test: test/cases/23_context.sh
    status: guaranteed
    responsibility: profiles
    note: Git first, then task and profile, then blockers, then authored records, then history. The profile's context block decides what is offered; it is the only code that reads those fields.

  - id: context-selection-budget
    claim: The assembled context obeys a line budget, and every section it drops is named with its reason
    source: share/skeleton/policy.yaml
    implementation: lib/context.sh
    test: test/cases/23_context.sh
    status: guaranteed
    responsibility: profiles
    note: The count is of the printed document, not of its sections. Git, task, profile and open blockers are never dropped; record bodies degrade to a pointer before they disappear.

  - id: checkpoint-record
    claim: A checkpoint is a capped progress record with computed identity, and a body over the cap is refused rather than truncated
    source: docs/SCHEMAS.md
    implementation: lib/checkpoint.sh
    test: test/cases/20_checkpoint.sh
    status: guaranteed
    responsibility: state
    note: The cap is what keeps a checkpoint distinct from a handover. Mode 0600, created atomically, never staged.

  - id: record-resolution
    claim: The right prior record is resolved by worktree and branch, and an unrelated one is never offered
    source: docs/CONTINUITY.md
    implementation: lib/common.sh
    test: test/cases/23_context.sh
    status: guaranteed
    responsibility: handover
    note: Same worktree and branch, else same branch, else nothing. Ties within one second are broken by ledger order. Absence is reported as absence.

  - id: history-ledger-read
    claim: The ledger is readable back as operational history, filtered by task, event and time
    source: docs/CLI.md
    implementation: lib/history.sh
    test: test/cases/22_history.sh
    status: guaranteed
    responsibility: watch
    note: What happened, when, for which task, at which head, and what outcome was accepted. Never what anyone said.

  - id: record-retention
    claim: Rotating the ledger archives the oldest lines and never deletes them
    source: docs/SCHEMAS.md
    implementation: lib/history.sh
    test: test/cases/22_history.sh
    status: guaranteed
    responsibility: watch
    note: Refuses to overwrite an existing archive, and does nothing when the ledger is under its cap.

  - id: decision-record
    claim: A decision is recorded with its reason and its task, and is superseded by a later entry rather than edited
    source: docs/SCHEMAS.md
    implementation: lib/decision.sh
    test: test/cases/21_decision_question.sh
    status: guaranteed
    responsibility: state
    note: --why is required. --supersedes refuses text matching no recorded decision. Task and head are computed.

  - id: open-question-gate
    claim: An unresolved question blocks acceptance, and an entry the gate cannot parse is a failure rather than a silent pass
    source: docs/SCHEMAS.md
    implementation: lib/question.sh
    test: test/cases/21_decision_question.sh
    status: guaranteed
    responsibility: finish
    note: A gate that cannot read an entry can be bypassed by mistyping one, so check, doctor and watch all fail on a malformed entry.

  - id: prompt-asset
    claim: A repository-local prompt renders against a closed set of state tokens, and an unknown token is an error
    source: docs/SCHEMAS.md
    implementation: lib/prompt.sh
    test: test/cases/24_prompt_search.sh
    status: guaranteed
    responsibility: policy
    note: No conditionals, loops, includes or shell. A prompt that silently renders a misspelled token as literal text is worse than one that refuses.

  - id: record-search
    claim: Durable records are searchable literally, across kinds, without an index
    source: docs/CLI.md
    implementation: lib/search.sh
    test: test/cases/24_prompt_search.sh
    status: guaranteed
    responsibility: watch
    note: A fixed-string grep in authority order. No ranking, no embedding, no index that could fall out of step with the records it describes.

  - id: continuity-reachable
    claim: Every continuity store is proven reachable through its own command, not merely present on disk
    source: docs/CLI.md
    implementation: lib/doctor.sh
    test: test/cases/25_continuity_lifecycle.sh
    status: guaranteed
    responsibility: doctor
    note: doctor runs the resolver, renders every prompt asset, validates both parsed stores and builds the context. A directory of records that no command reads is the failure this tool exists to catch.

  - id: semantic-retrieval
    claim: Ranked or semantic retrieval over durable records is deliberately not implemented
    source: docs/CONTINUITY.md
    implementation: '-'
    test: '-'
    status: rejected
    responsibility: watch
    note: The corpus is a handful of Markdown files and one JSONL. An index or an embedding store would be a second source of truth that has to be kept in step with the first, and a scan is faster than that problem. Revisited only if a repository appears where the scan is measurably too slow.

  - id: worktree-ownership
    claim: A task record names the checkout it belongs to, and another checkout is never held to its scope
    source: docs/SCHEMAS.md
    implementation: lib/check.sh
    test: test/cases/27_foreign_task.sh
    status: guaranteed
    responsibility: scope
    note: The record is tracked, so it travels with the branch. check, finish --check and watch report a foreign record and enforce nothing from it; finish refuses to write to it. A record from before the field existed is treated as local, so upgrading does not turn an installation red.

  - id: runtime-adapters
    claim: Opt-in runtime adapters will clamp read size, output size and fan-out from profile-derived limits
    source: docs/DESIGN.md
    implementation: '-'
    test: '-'
    status: planned
    note: v0.2. The one implementation studied was rolled back within days because its limits were global constants rather than task-derived.

  - id: telemetry
    claim: Execution telemetry will be recorded once a provider exposes it honestly
    source: docs/DESIGN.md
    implementation: '-'
    test: '-'
    status: planned
    note: v0.3. Nothing in v0.1 measures token spend. Any estimated_ field is labelled and excluded from enforcement.

  - id: cost-per-outcome
    claim: Cost per accepted outcome will be reported from measured data only
    source: docs/DESIGN.md
    implementation: '-'
    test: '-'
    status: planned
    note: v0.4.

  - id: routing
    claim: Routing recommendations will be derived from measured cost and outcome data
    source: docs/DESIGN.md
    implementation: '-'
    test: '-'
    status: planned
    note: v0.5. Recommendations only. Majordomus does not invoke a model.

  - id: shared-policy
    claim: One policy will be shared across repositories and workers
    source: docs/DESIGN.md
    implementation: '-'
    test: '-'
    status: planned
    note: v1.0.

  - id: task-dependencies
    claim: Dependencies between tasks are deliberately not represented
    source: docs/DESIGN.md
    implementation: '-'
    test: '-'
    status: rejected
    note: No use case in the evidence justified a dependency graph. Listed so that the omission is visible rather than assumed to be an oversight. Revisited only when a real case appears.
