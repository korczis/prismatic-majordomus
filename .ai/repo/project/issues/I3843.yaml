    type: test
    command: "scripts/site-build && scripts/ci/homepage-check && bash test/run.sh 333_homepage_narrative"
    result: "local build at 76c57859663 + this patch: built title in the sentence's case; homepage-check ok; cases 333, 3590, 3732, 406, 543, 544 ok; a mutation of the title check makes 333 fail"
    commit: 76c578596631b290f9291691b388f359fbce97ae
    recorded_at: 2026-10-22T05:42:05Z
  - covers: czech_title_translated
    type: test
    command: "scripts/site-translate reach --lang cs --against origin/master && scripts/site-build"
    result: "10 cs keys admitted, each reaching a page (reach: 0 reaching none); the rebuilt /cs/ title, description and og:description read 'Vaši AI agenti říkají, že je práce hotová. Majordomus je přiměje to dokázat'"
    commit: 76c578596631b290f9291691b388f359fbce97ae
    recorded_at: 2026-10-22T05:42:22Z
