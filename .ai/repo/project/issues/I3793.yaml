id: I3793
milestone: one-kit-on-every-surface
title: "One copy control ships to every surface"
slug: one-copy-and-one-tab-control
priority: p1
profile: implementation
parallel_safe: true
objective: "Make kit.js's dependency-free copy control the only one: replace the Alpine copy button on the site with it, and ship it to /ui and the Cockpit as a byte copy held by scripts/cockpit-assets --check, the way nav.js and theme.js already travel, so a code block or a command copies the same on every surface. The tab half of this issue (one tab control on every surface) moved on 2026-11-17 to I4536 (slice S2 of milestone one-frame-one-kit-one-library-per-job), where the one tab control is Flowbite tabs, so that the tab control is built once and not twice; this issue keeps the copy control. I4535 (S1 of that milestone) later moves this one copy control under share/design/js/core/clipboard.js as a move, not a second implementation."
why: "On 2026-10-20 the site had two copy implementations (Alpine in components.html and terminal-run.html, data-copy in kit.js), each with its own interaction spec, and /ui and the Cockpit had no copy control at all; the owner asked for one kit everywhere. The tab half was moved because I4536 replaces every hand-written tab control with Flowbite's, and keeping it here as well would build the tab control twice (review of 2026-11-17 on PR #2962)."
current_state: "copy-button.mjs and kit-copy.mjs specs; no copy control on /ui and the Cockpit. The tab specs (tabs.mjs and kit-tabs.mjs) are I4536's."
desired_state: "One copy implementation, one spec, present on the site, /ui and the Cockpit; a second implementation planted fails the design check that names it."
scope:
  - "site/kit.js"
  - "site/templates/components.html"
  - "site/templates/partials/terminal-run.html"
  - "share/ui"
  - "share/cockpit"
  - "scripts/cockpit-assets"
  - "scripts/lib/interaction-specs"
  - "scripts/ci/design-check"
non_scope:
  - "The tab control: moved to I4536 on 2026-11-17 (Flowbite tabs)"
depends_on: []
acceptance_criteria:
  - "The site, /ui and the Cockpit load the same copy code, byte-identical, checked by cockpit-assets --check"
  - "No Alpine copy component remains on the site, and one interaction spec covers the copy control"
  - "A second copy implementation planted on any surface fails a gate that names it"
validation:
  - "bin/majordomus plan validate"
  - "scripts/cockpit-assets --check"
  - "scripts/interaction-probe"
evidence_required:
  - "one_copy_control_case"
created_at: 2026-10-20
updated_at: 2026-11-17
