id: the-owner-oversees-the-mesh-from-one-page
title: "The owner oversees and moves the whole mesh from one page that reads the runtime and owns nothing"
statement: "The owner oversees every peer, session, claim and blocker of the mesh from one page that reads the runtime's own capabilities, shows each figure's source and freshness, recovers after a disconnect, and offers one authorised action whose result it reads back from the journal. The view is named Prismatic Lumen and adds no capability, store or event type of its own; its speed is claimed only against a recorded baseline."
invariants:
  - "The page owns no state, scheduler or event bus; it reads blackboard, peers, mesh and monitor capabilities"
  - "Expired is not dead and a dropped link is not failed: the page shows the runtime's own liveness words and never shows an inference as fact"
  - "An action is authorised by the capability it invokes, never by the page"
non_goals:
  - "Federation across other Prismatic projects"
  - "Scheduled reports and notifications"
  - "Mutation from the published Pages snapshot"
  - "A gateway for Pages or mobile clients"
  - "Anything before v1.0.0-alpha.1"
  - "A skill, CLI command, MCP namespace or route named lumen before the owner decides it (ADR 0209)"
  - "Reach from a phone or another machine, which intent the-mesh-is-operated-from-any-device carries"
milestones:
  - "prismatic-lumen"
satisfaction:
  - id: the-mesh-is-overseen-from-one-page
    criterion: "One /ui page shows every peer, session, claim and blocker of the mesh with its source and age in the runtime's own words (an expired stream reads expired, a link reads the state mesh.peers reports, every blocker names its source), follows them live, and after a forced disconnect says reconnecting and then shows the current state without a reload (planned proof: a mesh-page reconnect case numbered by `scripts/case-numbers next` and announced on the board at start)"
    evidence: command
    ref: "majordomus intent explain the-owner-oversees-the-mesh-from-one-page"
  - id: one-action-reads-its-result-from-the-journal
    criterion: "The page offers one mesh action, mesh.review.request, written only under the identity the router resolves and refused by the capability without one, renders it disabled in the published snapshot, and shows as its result the journal event the action produced, not the request's echo (planned proof: the mesh-action tests of the ui module)"
    evidence: command
    ref: "majordomus intent explain the-owner-oversees-the-mesh-from-one-page"
  - id: latency-is-measured-before-it-is-claimed
    criterion: "A baseline of the page's warm status, cold and warm first paint, event-to-screen and recovery times, with hardware, percentiles and routes, is committed under .ai/repo/benchmarks as regenerated by the command that measures it, and any latency target is declared only as a benchmark-policy budget citing that baseline (planned proof: the committed mesh-page baseline)"
    evidence: command
    ref: "majordomus intent explain the-owner-oversees-the-mesh-from-one-page"
created_at: 2026-10-18
updated_at: 2026-10-18
