# The deployment of this repository's executable. Authoritative: the container image
# definition, its ignore file and the Gigalixir files under deploy/gigalixir/ are generated
# from this file and `majordomus generate --check` fails when one of them is edited by hand.
#
# Hosted on Gigalixir (owner order, 2026-10-21, ADR 0219): the application
# prismatic-majordomus on stack gigalixir-24. Its Procfile and the inline buildpack's hooks
# are rendered from this object; what is pushed is assembled from `build.inputs` at one
# commit, those files and the executable built at that commit, never the repository. The
# credential that authorises the push is a workflow secret, never a field here. Fly.io stays
# no target (owner order, 2026-10-12). `status: declared` stays true until an observation
# (`served.observe`) says the provider serves master; then it becomes `active`.
# The same object still builds the GHCR image (docker-image.yml, release.yml's `image` job),
# whose `serve --deployment majordomus` takes its address from `listen`. `region`,
# `machines` and `resources` are required by deployment/v1 and read by no generated file.
schema: deployment/v1
kind: deployment
id: majordomus
title: The Majordomus layer, served from its container image
description: This repository's executable serving the AI layer over HTTP and MCP, hosted on Gigalixir and published to GHCR as a container image.
status: declared

application: majordomus

build:
  package: majordomus-cli
  binary: majordomus
  profile: release
  # The path dependencies the package compiles against: in the build context and the
  # builder's dependency stage, never in the runtime image.
  crates:
    - apps/majordomus-core
  # The build context, and nothing else. The package's own directory is what the builder
  # stage compiles; every other input is what the running process reads — the tool
  # distribution, the layer, and the files this repository's source classes point at, so
  # that the deployed index is the same shape as the one here.
  inputs:
    - apps/majordomus-cli
    - share
    - .ai
    - docs
    - lib
    - bin
    - test
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - CONTRIBUTING.md
    - SECURITY.md
  # No `site:` yet. The image does not carry the built site, and declaring one it does not
  # serve would be the drift this kind exists to prevent (I0912 owns it).

listen:
  # One port. The process and the image both read this.
  port: 8080
  # A hosted process is reachable or it is nothing; `all` is the intent, not a suppressed
  # warning. Local invocation keeps its loopback default and never reads this object.
  interface: all

health:
  # Registered capabilities, not router entries: every capability route lives under
  # /api/v1/, so these are the paths the registry actually serves and the platform polls
  # what OpenAPI, the reference and the smoke suite already know about.
  liveness: /api/v1/live
  readiness: /api/v1/ready
  grace_seconds: 2
  interval_seconds: 15
  timeout_seconds: 2

resources:
  cpu_kind: shared
  cpus: 1
  # A hypothesis until a measured run under it passes; I0922 decides the final number.
  memory_mb: 256

machines:
  count: 1
  min_running: 0
  autostart: true
  autostop: true

region: fra

# Every budget below is written by the run that measured it; a number nobody measured
# would be a preference wearing a baseline's name. The size, cold-start and memory figures
# are not here yet because nothing has measured them (I0921, I0922, I0923).
budgets:
  # `majordomus bench health.live` and `bench health.ready`, quick profile, debug build:
  # p99 2.1 ms and 6.4 ms over HTTP. The ceiling leaves room for a loaded machine and is
  # still an order of magnitude under any platform's check timeout.
  blocking_check_ms: 25

# The provider that hosts it (ADR 0219). Its files under deploy/gigalixir/ are generated:
# the Procfile starts the executable on the provider's PORT, falling back to listen.port.
provider:
  name: gigalixir
  app: prismatic-majordomus
  stack: gigalixir-24
  url: https://prismatic-majordomus.gigalixirapp.com

created_at: 2026-09-06
updated_at: 2026-10-21
