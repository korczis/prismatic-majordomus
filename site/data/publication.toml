# ---------------------------------------------------------------- not published

[[kinds]]
kind = "critique"
projection = "none"
reason = "A critique is the adversarial pass over one intent's plan, written by a worker, and work started under the intent without it or with a blocking finding open fails intent validation (ADR 0073). It is planning state of this repository; what the plan became is published on /plan/."

[[kinds]]
kind = "deployment"
projection = "none"
reason = "A deployment object carries the target a release is published to. Its rendered artifacts are in the repository and its state is on the Cockpit; a public page would say only what /docs/install/ already says."

[[kinds]]
kind = "distribution-model"
projection = "none"
reason = "The distribution model is the input the release matrix, the installer and /docs/install/ are all generated from. The generated pages are the publication; the model behind them is not a second one."

[[kinds]]
kind = "document"
projection = "none"
reason = "A document of the layer is prose already published where it belongs — /docs/, /method/, /context/ — and a second address for the same words is the duplication this file exists to prevent."

[[kinds]]
kind = "gap"
projection = "none"
reason = "A gap is what one worker observed of the repository against an intent's criteria at one commit (ADR 0073). It is a dated input to planning, superseded by the next observation, and the work it suggested is published on /plan/."

[[kinds]]
kind = "implementation"
projection = "none"
reason = "An implementation object is a source file a claim names. It is reachable from the claim that names it and from the repository; a page rendering a Rust module is the source browser GitHub already is."

[[kinds]]
kind = "integration-batch"
projection = "none"
reason = "A batch manifest is the integrator's record of one composition: the master it was composed on and its members in order, each with its head and the merge commit that carries it (ADR 0114). It is YAML with no prose, so the generic entity page would render an empty body; a page that lays out the members is not built yet. Until it is, `majordomus prs explain`, the Cockpit's integration page and the file under .ai/repo/integration/batches/ answer for a batch."
empty = "A manifest is written only by `majordomus prs compose --apply`, on a batch branch that may carry no authored line (ADR 0114 D4), so this entry cannot arrive with the first manifest and stands before it."

[[kinds]]
kind = "intent"
projection = "none"
reason = "An intent's stage and criteria are derived on every read from the plan and the evidence ledger (ADR 0070); a static page would freeze a derivation at the commit the site was built from. The milestones that realise an intent are published on /plan/, and `majordomus intent show` and the Cockpit's /cockpit/intents answer for the intent itself."

[[kinds]]
kind = "knowledge"
projection = "none"
reason = "Curated knowledge is written for the worker reading the layer, not for a visitor: it is the orientation a session starts from, and it changes with the work rather than with the product."

[[kinds]]
kind = "mesh-declaration"
projection = "none"
reason = "The mesh declaration is one checkout's identity on the local network. It is operational state of an installation, not a fact about the product."

[[kinds]]
kind = "prompt"
projection = "none"
reason = "A prompt is an input to a provider, rendered with the repository's own state. Published on its own it would read as documentation of something a visitor cannot run."

[[kinds]]
kind = "scope"
projection = "none"
reason = "The scope declares which paths of this checkout the tool reads. It is a fact about this repository's layout, and /context/ is where a visitor is told about layout."

[[kinds]]
kind = "test"
projection = "none"
reason = "A test object is a case file. What it proves is published — on /guarantees/ for the claim and on the rule's own page for the rule — and that is the direction a reader asks in."

[[kinds]]
kind = "workspace"
projection = "none"
reason = "A workspace records an external place work is done (a ChatGPT project, an issue tracker). It names accounts and surfaces of the people working here, not of the product."
