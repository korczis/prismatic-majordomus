id: I4415
milestone: a-second-adopter-is-served
title: "finish names the load its verification ran under, waits below a declared load bound before it runs, and retries a failure under load only as policy allows, recording every attempt"
slug: a-verification-under-load-says-so
priority: p2
profile: implementation
parallel_safe: true
objective: "Three changes to mj_validate_verification in lib/finish.sh, none of which changes a repository that declares nothing. First, every verification run reads the host's 1-minute load average and core count before and after it, through one helper in lib/common.sh that lib/bench.sh's mj_bench_load then calls, and the result line says so on pass and on fail: `npm test — exit 1, 412s, load 77.3 -> 93.1 on 12 cores`. The same fields (load_start, load_end, cores) go into the verify object of task.finished, and task.refused gains that verify object, which it does not carry today. Second, a policy key verification.load_max_per_core (absent: no gate) with verification.load_wait_seconds (default 600), overridable per invocation by MAJORDOMUS_VERIFY_LOAD_MAX: before the command starts, finish waits while the load is above the bound, saying on stderr what it waits for and how long it has waited, and past the wait it does not run the command; the verification line fails as `not run: load <x> above <bound> for <n>s`, and task.refused records verify.not_run: load, so I3131's aggregate can tell a refusal of the work from a refusal of the machine. Under CI (CI or GITHUB_ACTIONS set) there is no gate, as in OSCILLA's suites and I4006. Third, a policy key verification.verify_retries (integer 0-2, default 0): a failed attempt is retried only when that attempt started or ended above the load bound and the tree id is the one the failed attempt ran over; a failure on a quiet machine, or with no bound declared, is never retried, so a deterministic failure cannot be retried into a pass. Every attempt is recorded (verify.attempts: exit, seconds, load_start, load_end, tree), and a pass after a failed attempt reads `exit 0 on attempt 2 of 3 (attempt 1: exit 1, load 81.0)`, never as a plain pass. The rule majordomus.verification-integrity states the attempt record and the conditions under which a retry is admitted."
why: "Observed in OSCILLA (korczis/oscilla) on 2026-10-29 by session oscilla-b0, on the shared Mac that also runs Majordomus worktrees and builds: `majordomus finish --outcome completed --verify-command \"npm test\"` was refused twice when npm test failed under a 1-minute load of 77 to 93, and then passed on a plain retry with nothing changed. The refusals said neither that the machine was loaded nor how loaded, so each read as a defect of the work, and each left a task.refused line that an aggregate of caught false dones (I3131, ADR 0208) would count as one. OSCILLA's own suites already hold this line: outside CI each waits for the 1-minute load to fall below OSC_LOAD_MAX (default 2 x cores) for at most OSC_LOAD_WAIT_MS (default 600000), prints the load at start and end, and fails without running past the wait (OSCILLA tests/README.md, scripts/release-prepare.mjs). The command finish runs has no such gate unless the adopter builds one, and finish records nothing that would let a reader tell the cause. Filed from oscilla-b0's upstream candidates (item 6 of the 2026-10-29 evening list)."
current_state: "Measured at origin/master 51b38035a71: lib/finish.sh:199 runs the verify command once, with stdout and stderr sent to /dev/null; lib/finish.sh:203 fails the line as `<cmd> — exit <n>, <s>s` with no load or host; the verify object (lib/finish.sh:129) carries command, exit, seconds and tree, and only task.finished writes it: task.refused (lib/finish.sh:108, share/events.yaml:56) records the doctrines, not the run. The load average is read only by the benchmark paths (lib/bench.sh:148 mj_bench_load, apps/majordomus-cli/src/bench/results.rs:141). Policy verification admits only required_for_changes and finish_requires (share/allow/policy.txt:13-14, share/schemas/majordomus/policy/policy.v1.schema.json:57). Nothing in finish waits, gates or retries."
desired_state: "A verification refused on a busy machine says how busy it was, in the line and in the ledger. A repository that declares a load bound has its verification wait for the machine before it runs, and a run the machine never let start is a refusal of the machine, recorded as such. A retry happens only under a declared policy, only for a failure that ran above the bound over an unchanged tree, and every attempt stays in the record, so a flaky suite is visible rather than hidden by its eventual pass. With no key declared, finish behaves as today apart from the load fields. Enforced by case 4415, case 06 and the amended rule."
