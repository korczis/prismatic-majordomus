id: I0605
milestone: shared-policy
title: Publish the shared-policy claim and what sharing still cannot do
slug: publish-shared-policy-claim
priority: p3
profile: implementation
parallel_safe: false
objective: "Move the shared-policy claim to guaranteed, cite the implementation and the cases, and state plainly what a shared policy does not provide: no service, no registry, no cross-machine visibility, and no enforcement of a repository that never adopts it."
why: "Shared policy is the version most easily read as an organisational control plane. The claim has to name the boundary in the same place it names the capability, or the boundary will be assumed away."
current_state: "The claim is planned, and the design document places multi-repository policy outside the local-first scope with a note that it returns here."
desired_state: "The claim is guaranteed for what is implemented, the limitations page names what it is not, and the design document's deferral is reconciled with what now exists."
scope:
  - docs
  - site/data/generated
non_scope:
  - Any claim about repositories that have not adopted the shared source
depends_on:
  - I0604
acceptance_criteria:
  - The claim cites an implementation path and a test path that both exist
  - The limitations page names what shared policy does not do
  - The design document no longer defers what has shipped, and still refuses what has not
  - The generated site data regenerates with no stale file
validation:
  - scripts/generate-site-data --check
  - bash test/run.sh
evidence_required:
  - docs_build
risk: "This claim is the one a reader will most want to be wider than it is."
created_at: 2026-09-04
updated_at: 2026-09-04
