non_scope:
  - "The homepage: its story and its byte budget are declared (site/data/homepage.toml) and it carries no diagram by decision; I2655 asks that question on its own"
  - "The Cockpit and majordomus ui: they render their own graphs; sharing this viewer with them is I2656"
  - "Typing links into a diagram's source with Mermaid's click directive: a link is inferred from an identity or it does not exist"
depends_on: []
acceptance_criteria:
  - "Every <pre class=\"mermaid\"> of the built site carries a unique id diagram-<name>, the list of its nodes, and tabindex=0; a build that would publish two diagrams with one id on a page is refused"
  - "A node whose id or label is the identity of an object the site has a page for is listed beside the diagram as a link to that page, and scripts/ci/link-check resolves every such link"
  - "A link to #diagram-<name>:<node> is refused by scripts/ci/link-check when the diagram does not declare that node"
  - "In a browser, the viewer zooms, pans and resets from its toolbar and from the keyboard, copies its own link, and opens the diagram and node a fragment names"
  - "A <figure data-chart> is drawn from the table inside it, and the table stays on the page"
  - "The hand-drawn-diagram ratchet stays at diagrams=0"
validation:
  - "node --test scripts/lib/diagrams.test.mjs"
  - "MJ_TEST_JOBS=2 bash test/run.sh 3006_diagrams_are_interactive_and_linkable 12_site_build 272_diagrams_are_drawn"
  - "scripts/site-build && scripts/site-check"
  - "scripts/ci/diagram-check"
evidence_required:
  - "diagram_pass_unit_tests"
  - "diagram_case_3006"
  - "site_check_passes"
