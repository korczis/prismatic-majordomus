# The CI runs, supervised: a waiting run of a commit that already has its run, a run superseded
# while a newer run of its pull request waits behind it, or one queued or running past its
# workflow's declared bound, is force-cancelled with its reason recorded (I3903). An adapter
# over `majordomus prs supervise --apply`; the model and its rationale are
# .ai/repo/ci/supervise.yaml, the decision is apps/majordomus-cli/src/integration/supervise.rs,
# and docs/CI.md is the prose.
#
# Event-driven first, the clock as the watchdog: every requested validate run starts this, so a
# new run that would wait behind its pull request's superseded run or its own twin is retired
# within a minute; the schedule catches whatever an event did not, and survives every local
# restart because it runs here, not on anybody's machine.
#
# It must not be starved by what it supervises. On 2026-10-28 the hosted pool was full of
# validate's jobs, and a supervisor queued behind them supervises nothing; so it runs first on
# lundra, the repository's own machine, which does not share the account's hosted concurrency.
# The GitHub-hosted lane is the fallback, and it comes second in the same run: it `needs` the
# lundra lane and runs only when that lane did not supervise (`if: always()` and no
# `supervised` output), so on a tick where lundra supervised there is no second apply and no
# second spend of the repository's one request budget. When lundra cannot take its job — no
# runner online, or every runner busy with validate's jobs once vars.MJ_RUNNER sends them there
# (#2596) — the job waits in its lane's group, the next trigger's lundra job waits behind it,
# and the one after replaces that one, which cancels it: the replaced run's hosted lane then
# applies. So a lundra that takes no job is covered from the third trigger on, by the pool that
# validate's first wave then does not fill. A hosted lane that runs still stands aside if
# lundra's supervision succeeded in the last fifteen minutes (`--unless-supervised-within 15
# --supervised-by lundra`), as it may have in another run: the ten minutes of the schedule and
# five of margin, so that the lundra success before a burst, 8 to 10 minutes old on a quiet
# stretch, still counts and the burst's hosted lane does not apply beside lundra's. Only lundra's success counts: a job
# that stood aside succeeded too, and a lane counting its own would stand aside behind itself
# for ever once lundra stopped. Each lane is its own concurrency group, and a second apply finds
# the first one's cancels already done (each act reads its run again first, and a run that
# completed is skipped; a cancel the forge refuses with 409, because the other lane's landed
# between the re-read and the act, is `run_already_ended`, not a failure). The queue workflow reports when lundra has not supervised for thirty
# minutes (`supervise_stale`).
#
# Each step is bounded on its own, and their bounds add up to less than the job's, so the job is
# never killed: the supervise step's four minutes outlast the executable's 180 s forge budget,
# after which it starts no call, so no act is cut off between its record and its outcome.
#
# It compiles nothing: an apply that waited twenty minutes for a build was cancelled by the next
# request before it acted. It downloads the executable the newest master validate run built
# (`majordomus-exe`, kept a day), or the published release when none is kept, and takes only one
# that has `prs supervise`: every executable built before I3903 landed answers `--version` and
# not this command.
name: supervise
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows: [validate]
    types: [requested]
  workflow_dispatch:

# Cancelling a run is Actions write, which also reads the artifact. Reading the open pull
# requests' heads and labels is pull-requests read; nothing here writes the tree, a pull request
# or an issue.
permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  lundra:
    name: supervise (lundra)
    # lundra's runners, which validate's jobs also take once vars.MJ_RUNNER sends them there; a
    # runner registered for this lane alone is named by vars.MJ_SUPERVISE_RUNNER (a JSON list
    # of labels), with no other change
    runs-on: ${{ fromJSON(vars.MJ_SUPERVISE_RUNNER || '["self-hosted","lundra"]') }}
    # One apply per lane at a time, and never cancelled by the next request: five validate
    # requests within a minute used to cancel every apply before it acted. The newest request
    # waits, and its observation is the one that runs next; the one it replaces is cancelled,
    # and that run's hosted lane covers.
    concurrency:
      group: supervise-lundra
      cancel-in-progress: false
    # the sum of its steps' bounds (1 + 2 + 4) and a minute for the runner to set up
    timeout-minutes: 8
    # `true` only when it supervised: the hosted lane of this run stands aside on it
    outputs:
      supervised: ${{ steps.supervise.outputs.supervised }}
    steps:
      # the model is all it reads of the tree
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout: .ai

      # a minute and a half of downloads at most, then the release, each call bounded
      - name: the executable that supervises the runs, prebuilt
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "supervise: no GitHub CLI on this runner" >&2; exit 12; }
          dir="$RUNNER_TEMP/mj"
          mkdir -p "$dir"
          for id in $(timeout 20 gh run list --repo "$GITHUB_REPOSITORY" --workflow validate.yml \
              --branch master --event push --limit 10 --json databaseId --jq '.[].databaseId'); do
            [ "$SECONDS" -lt 60 ] || break
            # built on GitHub-hosted Linux: where its architecture or libc does not fit it does
            # not run, and the release (built for each) is taken instead. It must have the
            # command, not only run: a build older than I3903 answers --version and nothing more
            if timeout 45 gh run download "$id" --repo "$GITHUB_REPOSITORY" --name majordomus-exe \
                --dir "$dir" 2>/dev/null \
                && [ -s "$dir/majordomus" ] && chmod +x "$dir/majordomus" \
                && "$dir/majordomus" prs supervise --help >/dev/null 2>&1; then
              echo "the executable validate run $id built: $(cat "$dir/majordomus-cli.json" 2>/dev/null)"
              break
            fi
            rm -rf "$dir" && mkdir -p "$dir"
          done
          if [ -x "$dir/majordomus" ]; then
            echo "MJ=$dir/majordomus" >> "$GITHUB_ENV"
          else
            echo "::warning::no master validate run keeps an executable with prs supervise that runs here; the published release supervises"
            # the installer allows its own download ten minutes: this bounds the whole of it
            curl -fsSL --max-time 15 -o "$RUNNER_TEMP/install.sh" https://majordomus.dev/install.sh \
              && timeout 40 sh "$RUNNER_TEMP/install.sh" \
                --install-dir "$RUNNER_TEMP/bin" --prefix "$RUNNER_TEMP/opt" || true
            if ! "$RUNNER_TEMP/bin/majordomus" prs supervise --help >/dev/null 2>&1; then
              echo "::error::supervise: neither a master validate run's majordomus-exe (kept a day) nor the published release $("$RUNNER_TEMP/bin/majordomus" --version 2>/dev/null) has prs supervise; nothing supervises until master's validate builds one or a release ships it" >&2
              exit 12
            fi
            echo "MJ=$RUNNER_TEMP/bin/majordomus" >> "$GITHUB_ENV"
          fi

      # `--apply`: each run decided on is read again, recorded on the trail, then cancelled.
      # 0 is nothing to do, every act done, or a covering lane that stood aside; 12 is a forge
      # that could not be read or an act that could not be taken, and that fails this lane.
      # Four minutes: the executable reads the forge for at most 180 s and then asks nothing.
      - id: supervise
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: lundra
          COVER: ''
        run: |
          rc=0
          set -- --apply
          [ -z "$COVER" ] || set -- "$@" --unless-supervised-within "$COVER" --supervised-by lundra
          "$MJ" prs supervise "$@" > "$RUNNER_TEMP/supervise.txt" 2>&1 || rc=$?
          sed 's/^/    /' "$RUNNER_TEMP/supervise.txt"
          {
            printf '## The CI runs, supervised here (%s)\n\n```\n' "$LANE"
            cat "$RUNNER_TEMP/supervise.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || { echo "supervise: majordomus prs supervise --apply exited $rc" >&2; exit "$rc"; }
          echo "supervised=true" >> "$GITHUB_OUTPUT"

  # the fallback: after lundra's lane, whatever became of it, and only when it did not supervise
  hosted:
    name: supervise (hosted)
    needs: lundra
    if: ${{ always() && needs.lundra.outputs.supervised != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: supervise-hosted
      cancel-in-progress: false
    timeout-minutes: 8
    steps:
      # the model is all it reads of the tree
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout: .ai

      # a minute and a half of downloads at most, then the release, each call bounded
      - name: the executable that supervises the runs, prebuilt
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "supervise: no GitHub CLI on this runner" >&2; exit 12; }
          dir="$RUNNER_TEMP/mj"
          mkdir -p "$dir"
          for id in $(timeout 20 gh run list --repo "$GITHUB_REPOSITORY" --workflow validate.yml \
              --branch master --event push --limit 10 --json databaseId --jq '.[].databaseId'); do
            [ "$SECONDS" -lt 60 ] || break
            # built on GitHub-hosted Linux: where its architecture or libc does not fit it does
            # not run, and the release (built for each) is taken instead. It must have the
            # command, not only run: a build older than I3903 answers --version and nothing more
            if timeout 45 gh run download "$id" --repo "$GITHUB_REPOSITORY" --name majordomus-exe \
                --dir "$dir" 2>/dev/null \
                && [ -s "$dir/majordomus" ] && chmod +x "$dir/majordomus" \
                && "$dir/majordomus" prs supervise --help >/dev/null 2>&1; then
              echo "the executable validate run $id built: $(cat "$dir/majordomus-cli.json" 2>/dev/null)"
              break
            fi
            rm -rf "$dir" && mkdir -p "$dir"
          done
          if [ -x "$dir/majordomus" ]; then
            echo "MJ=$dir/majordomus" >> "$GITHUB_ENV"
          else
            echo "::warning::no master validate run keeps an executable with prs supervise that runs here; the published release supervises"
            # the installer allows its own download ten minutes: this bounds the whole of it
            curl -fsSL --max-time 15 -o "$RUNNER_TEMP/install.sh" https://majordomus.dev/install.sh \
              && timeout 40 sh "$RUNNER_TEMP/install.sh" \
                --install-dir "$RUNNER_TEMP/bin" --prefix "$RUNNER_TEMP/opt" || true
            if ! "$RUNNER_TEMP/bin/majordomus" prs supervise --help >/dev/null 2>&1; then
              echo "::error::supervise: neither a master validate run's majordomus-exe (kept a day) nor the published release $("$RUNNER_TEMP/bin/majordomus" --version 2>/dev/null) has prs supervise; nothing supervises until master's validate builds one or a release ships it" >&2
              exit 12
            fi
            echo "MJ=$RUNNER_TEMP/bin/majordomus" >> "$GITHUB_ENV"
          fi

      # `--apply`: each run decided on is read again, recorded on the trail, then cancelled.
      # 0 is nothing to do, every act done, or a covering lane that stood aside; 12 is a forge
      # that could not be read or an act that could not be taken, and that fails this lane.
      # Four minutes: the executable reads the forge for at most 180 s and then asks nothing.
      - id: supervise
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: hosted
          COVER: '15'
        run: |
          rc=0
          set -- --apply
          [ -z "$COVER" ] || set -- "$@" --unless-supervised-within "$COVER" --supervised-by lundra
          "$MJ" prs supervise "$@" > "$RUNNER_TEMP/supervise.txt" 2>&1 || rc=$?
          sed 's/^/    /' "$RUNNER_TEMP/supervise.txt"
          {
            printf '## The CI runs, supervised here (%s)\n\n```\n' "$LANE"
            cat "$RUNNER_TEMP/supervise.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || { echo "supervise: majordomus prs supervise --apply exited $rc" >&2; exit "$rc"; }
          echo "supervised=true" >> "$GITHUB_OUTPUT"
