  - "apps/majordomus-cli/src/commands/mesh.rs"
  - "apps/majordomus-cli/src/capability/builtin/mesh.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/src/policy.rs"
  - "lib/doctor.sh"
  - "share/skeleton/policy.yaml"
  - "share/schemas/majordomus/policy/policy.v1.schema.json"
  - "share/allow/policy.txt"
  - "docs/MESH.md"
  - "docs/generated/cli.md"
  - "docs/generated/cli.json"
  - "docs/generated/cli.yaml"
  - "docs/generated/registry.json"
  - "docs/generated/registry.yaml"
