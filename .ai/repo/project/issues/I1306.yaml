evidence:
  - covers: derivations_projected
    type: test
    command: "env -u MAJORDOMUS_SHARE ./bin/majordomus-cli generate --check && bash test/run.sh 99_plan_capabilities"
    result: "generate --check reports every projection in sync after the plan module was declared: the eight capabilities reach MCP as tools plus a majordomus://plan resource, HTTP as eight /api/v1/plan routes and the OpenAPI document, and docs/generated/modules/plan.md appeared, with no transport registry, OpenAPI file or documentation table edited by hand. The case asserts the same from outside: every plan capability carries an MCP tool and an HTTP path, plan.model carries the resource URI, and all eight routes are in docs/generated/openapi.json."
    commit: 990bd0588a13f17a0dd0087080af3c422e3b1e37
    recorded_at: 2026-09-09T19:32:51Z
  - covers: shell_and_executable_agree
    type: test
    command: "env -u MAJORDOMUS_SHARE bash test/run.sh 99_plan_capabilities"
    result: "ok, 1 passed. The case runs lib/project.awk and apps/majordomus-cli/src/plan.rs over every record of this repository (16 milestones, 192 issues) and over a fixture carrying a cancelled issue, a completion without its evidence, a milestone gate blocking the work underneath it, two issues of one wave sharing a path, an unknown dependency and a cycle. It compares, byte for byte: every issue's status, wave, milestone, priority, title, depends_on and blocked_by; every milestone's status, title and counts keyed by the declared vocabulary; the active milestone and the next ready issue; the roadmap's rank and order for every milestone; the whole wave layering; and every finding's level, code, subject and message in derivation order. It also proves no plan capability writes to the repository."
    commit: 990bd0588a13f17a0dd0087080af3c422e3b1e37
    recorded_at: 2026-09-09T19:33:02Z
