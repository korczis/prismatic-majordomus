id: I3291
milestone: every-sessions-usage-is-observed
title: "Gemini CLI usage events map onto the same record, thought tokens included"
slug: gemini-usage-is-read
priority: p3
profile: implementation
objective: "Map gemini_cli.api_response (input, output, cached-content, thought tokens) through the receiver of I3288 with no Gemini-specific path beyond the mapping table."
why: "The owner named three clients; Gemini differs only in field names and one extra category. Gemini is named in the statement but its encoding was unverified; a protobuf-only export would make this issue impossible under I3288's non_scope. It extends milestone execution-telemetry. Proposed in ADR 0213 (Usage is observed through each provider's official telemetry into one provider-neutral record, and reported, estimated and billed amounts are never merged) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c253#2."
current_state: "scripts/lib/advisors/gemini-cli.mjs calls Gemini as an advisor; no usage is read."
desired_state: "A Gemini fixture produces records; adding it changed only the mapping and fixtures."
scope:
  - "apps/majordomus-cli/src/economics/usage.rs"
  - "test/fixtures"
depends_on:
  - "I3288"
serves:
  - "every-sessions-usage-is-observed#gemini-usage-recorded"
acceptance_criteria:
  - "Each Gemini token category maps to a declared common category or to an explicit provider-only field"
  - "The diff that adds Gemini touches no consumer"
  - "The Gemini fixture is captured from a named, dated Gemini CLI version"
  - "Gemini CLI's OTLP http export is verified to be JSON; if it is protobuf only, the issue is reported blocked by I3288's non_scope rather than adding a dependency"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib economics::usage"
  - "majordomus plan validate"
evidence_required:
  - "test_gemini_usage_maps"
created_at: 2026-10-18
updated_at: 2026-10-18
