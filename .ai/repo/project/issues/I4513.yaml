id: I4513
milestone: ci-critical-path
title: "The pre-commit pages gate judges a staged merge as scripts/derive writes it, with both parents"
slug: the-pages-gate-judges-a-merge-as-derive-writes-it
priority: p1
profile: implementation
parallel_safe: true
objective: "Make scripts/pages current and majordomus generate --check, as the pre-commit hook runs them, compute a staged merge's derived data from the same history scripts/derive uses since I3963 (a scratch commit with both parents), so a merge derived once commits in one go."
why: "I3963 (completed 2026-10-26) made scripts/derive accept a merge in progress. It writes the staged merge as a scratch commit with both parents and derives that, so history readers (changelog decisions, delivery history) see the merged lineage. Its desired_state says the merge then commits through the pages gate in one go. On 2026-10-30 it did not, three times. The pre-commit gate recomputes from HEAD, the merge's first parent, so the correct two-parent output reads as stale and the commit is refused. Each repair then committed the merge with HEAD-based output, ran the full derive on the committed merge and committed that as a second commit: #1056 (cfc30602e0d, then bde618e3448), #1083 (98f989e7b49, then 2925fba6b0d) and #2688 (two derive passes before 45b9f8b4da0). Every master merge into a branch pays one extra derive and one extra commit, and the first commit records derived data the next one overwrites."
current_state: "Measured 2026-10-30 against master 51b38035a71. scripts/derive with MERGE_HEAD present derives a two-parent scratch commit (I3963). .githooks/pre-commit runs scripts/pages current, which calls majordomus generate --check and scripts/generate-site-data --check at HEAD with no reference to MERGE_HEAD. The two disagree on history-derived outputs (changelog, delivery and plan history), so a merge staged with scripts/derive's output is refused as stale."
desired_state: "While MERGE_HEAD exists and every path is resolved and staged, the pages gate judges the staged tree against the same two-parent scratch commit scripts/derive uses, so one derive followed by git commit passes. Outside a merge nothing changes."
scope:
  - .ai/repo/project/issues/I4513.yaml
  - scripts/pages
  - scripts/derive
  - .githooks/pre-commit
  - test/cases/4513_a_derived_merge_commits_in_one_go.sh
non_scope:
  - "Teaching scripts/derive to derive from HEAD again. The two-parent history is the correct one (I3963)."
  - "Cherry-picks and reverts. scripts/derive still refuses them (I3963)."
acceptance_criteria:
  - "On a fixture branch with an uncommitted, fully staged merge of a trunk that changed a history-derived output, one run of scripts/derive followed by git commit succeeds, and the committed derived files equal what a derive of the committed merge writes"
  - "Outside a merge, scripts/pages current behaves as before"
validation:
  - bash test/run.sh 4513_a_derived_merge_commits_in_one_go
  - scripts/pages current
evidence_required:
  - ci
risk: "Medium. The gate's job is to refuse stale data; deriving its reference from a scratch commit must not let a tree that differs from the staged merge pass. The case must include a stale staged file and prove it is still refused."
created_at: 2026-10-30
updated_at: 2026-10-30
