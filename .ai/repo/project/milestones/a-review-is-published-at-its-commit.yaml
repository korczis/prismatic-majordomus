acceptance_criteria:
  - "Criteria findings-are-published-at-their-commit, each-cited-line-is-blamed-to-its-commit, every-forge-link-is-pinned-and-proven, dependencies-are-judged, a-planted-smell-fails-a-named-gate, a-review-is-a-record-with-a-scorecard, an-untracked-serious-finding-is-refused, security-findings-are-redacted and hotspots-are-drawn-over-their-table of intent a-review-is-seen-at-its-commit carry their evidence"
