id: I4723
milestone: fabric-local-pilot
title: "Fabric's typed identities and local IPC contract exist, with no service side effect (P02)"
slug: fabric-p02-ipc-contract
priority: p1
profile: implementation
objective: "Define the typed identities (NodeId and MeshRepositoryId reused from mesh, a checkout context id distinct from both, a host instance generation, a session id) and the local IPC contract (hello and welcome with protocol ranges, context register, session attach and detach, capability call, subscribe and ack, health, typed errors) beside their owners, with size-bounded framing, deadlines, and a delivery contract that never resends an uncertain write, as mcp::bridge already refuses to."
why: "Corrected DAG: P02 follows P01 (ADR 0199 as amended, accepted 2026-11-25, I4721) and precedes the host singleton. The owner's answer of 2026-11-25 named P02 as the next step after G0. S04's matrix binds authentication context to these frames, so the contract must carry the caller's context from the start."
current_state: "Observed 2026-11-25: in flight on branch feature/fabric-p02-ipc-contract (apps/majordomus-cli/src/fabric, uncommitted, not pushed). No IPC contract exists on master."
desired_state: "One typed contract in apps/majordomus-cli/src/fabric, schemas derived through the existing schemars and capability metadata, no new public HTTP API, no daemon, no new binary; unsupported targets answer a typed unavailable status."
scope:
  - "apps/majordomus-cli/src/fabric"
  - "apps/majordomus-cli/src/mesh/identity.rs"
  - "apps/majordomus-cli/src/mesh/repository.rs"
  - "apps/majordomus-cli/src/mcp/bridge.rs"
  - "share/schemas"
non_scope:
  - "A listener, a socket or any process (P03)"
  - "A second identity scheme beside mesh::identity and mesh::repository"
  - "A copy of the types in the UI, the OpenAPI document or the docs"
depends_on:
  - "I4721"
traces:
  - "branch feature/fabric-p02-ipc-contract"
acceptance_criteria:
  - "An incompatible protocol range is refused with a typed reason, an unknown optional field is ignored and an unknown required feature is refused"
  - "A malformed, truncated or overlong frame is refused before it is parsed into a request"
  - "A write whose outcome is unknown is reported as such and never resent; a test fails when the contract would resend it"
  - "Two worktrees of one repository get distinct context ids and one MeshRepositoryId"
validation:
  - "majordomus plan validate"
  - "cargo test --lib fabric"
evidence_required:
  - "ipc_contract_refusals_test"
created_at: 2026-11-25
updated_at: 2026-11-25
