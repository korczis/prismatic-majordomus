pack: majordomus-intent-closure
version: 1
purpose: close the intent-driven development loop over existing Majordomus architecture
execution:
  preferred: prompts/00_MASTER_AUTONOMOUS_ORCHESTRATOR.md
  order:
    - prompts/10_SESSION_INTENT_BINDING.md
    - prompts/20_EXECUTED_OPPOSITION_PASS.md
    - prompts/30_SATISFACTION_ENGINE.md
    - prompts/40_COMPLETION_POLICY.md
    - prompts/50_GITHUB_RECONCILIATION.md
    - prompts/60_COCKPIT_INTENT_PROJECTION.md
    - prompts/70_OUTCOME_TO_PLAN_DERIVATION.md
    - prompts/80_CROSS_SURFACE_HARDENING.md
    - prompts/90_RELEASE_AND_PROOF.md
constraints:
  - reuse canonical existing architecture
  - no parallel sources of truth
  - every prompt is one milestone
  - numbered implementation sections are issue candidates
  - implementation plus tests plus docs plus enforcement plus evidence
  - no policy bypasses
final_invariant: >-
  No executable work without an intent or explicit typed exemption; no intent work
  without a completed opposition pass; no completion without criterion-level evidence;
  no satisfied intent from issue or milestone status alone.
