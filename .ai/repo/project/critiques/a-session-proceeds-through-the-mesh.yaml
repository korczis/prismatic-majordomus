  - id: watchdog-rebuilds-supervision-and-assumes-it-can-wake
    class: unnecessary_work
    subject: "I4009"
    finding: "I4009 overlaps nothing-in-the-mesh-waits-on-something-dead (I3182 classification, I3183 repair) without citing it, its substrate I3990-I3994 is not on master, wake is undefined (nothing can wake a session stuck on a dialog), 'never by polling' has no emitter named, and ADR 0200 restricts reaping."
    blocking: false
    resolution:
      state: planned
      issue: I4009
      because: "I4009 now depends on I3182, starts only after I3990 and I3182 are on master and the owner accepts ADR 0200 and I4005's ADR, composes I3182's classification and I3183's repair with no reader or repairer of its own, defines wake as a board or mesh message to the holder with a recorded deadline, signals nothing to a process it does not own, and names the claim-holding server as the emitter of the overdue signal."
  - id: idle-serve-exit-regressions
    class: regression_risk
    subject: "I4007"
    finding: "Idle was defined as no lease, peer or execution, leaving out attached MCP clients, event subscribers, mesh links and open episodes, and nothing said the next client re-ensures the server."
    blocking: false
    resolution:
      state: planned
      issue: I4007
      because: "I4007 gains the criterion that an attached MCP client, an open event stream or a running execution keeps the server alive and the next client re-ensures it. Mesh link and probe traffic deliberately do not count: on 2026-10-22 the machine's own servers kept each other alive that way (#2393's root cause), so counting them would undo the issue."
