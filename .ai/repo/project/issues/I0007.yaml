id: I0007
milestone: M000
title: Enforce the canonical model as doctrine
slug: model-doctrine
priority: p1
profile: implementation
parallel_safe: true
objective: "Add the project model to the doctrine registry so that doctor reports a broken model and watch reports a model that has drifted, through the same dispatcher every other rule uses."
why: "A rule enforced by a script nobody runs is documentation. The doctrine registry is how this repository makes enforcement verifiable end to end."
current_state: "The registry covered policy, profiles, scope, state, notes, projections and retention. Nothing covered the plan."
desired_state: "majordomus.project-integrity and majordomus.dag-integrity are declared, have validator functions, are dispatched by doctor and watch, and each has a test."
scope:
  - share/standard/majordomus/
  - lib/doctor.sh
non_scope:
  - Blocking a commit on a work-in-progress issue; progress is reported, not blocked
depends_on:
  - I0005
acceptance_criteria:
  - A repository with no canonical model skips both doctrines rather than failing
  - An invalid model is a blocking doctor failure with a reproduce command
  - watch reports the same violations as drift
validation:
  - bash test/run.sh 44_model_doctrine
evidence_required:
  - doctrine_test
risk: "A doctrine that fails in a repository without a project model would make every user installation red."
