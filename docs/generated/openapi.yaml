          description: May be published on a public surface such as GitHub Pages.
        - type: string
          const: internal
          description: Served to whoever can reach the loopback server; never published.
        - type: string
          const: restricted
          description: "Never leaves this machine: not published, not sent to a remote provider."
      description: "Who may see a piece of knowledge, and therefore where it may be projected."
    Libc:
      oneOf:
        - type: string
          const: gnu
          description: "GNU libc: the ordinary distributions."
        - type: string
          const: musl
          description: "musl: Alpine, and any statically linked artifact."
      description: The C library a Linux artifact is linked against.
    Listen:
      type: object
