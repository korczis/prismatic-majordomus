id: I0504
milestone: routing-recommendations
title: Prove the recommendation is advisory and publish it as such
slug: advisory-not-routing
priority: p3
profile: implementation
parallel_safe: false
objective: "Prove with a case that a recommendation never changes the profile a task runs under, and publish the routing claim stating that Majordomus recommends and does not route."
why: "The distance between recommending a profile and selecting one is one convenience commit wide. A case is the only thing that keeps it, and the claim is where a reader is told which side of the line the tool is on."
current_state: "The command answers with a profile and a basis. Nothing proves it cannot act on its own answer."
desired_state: "A case starts a task after a recommendation and shows the profile is whatever the worker asked for, and the claim says recommendations only."
scope:
  - test/cases
  - docs
  - site/data/generated
non_scope:
  - Any automatic application of a recommendation, behind a flag or otherwise
depends_on:
  - I0503
acceptance_criteria:
  - A case shows a task starting under a profile different from the recommended one, unimpeded
  - The claim cites an implementation path and a test path that both exist and says recommendations only
  - The generated site data regenerates with no stale file
validation:
  - bash test/run.sh
  - scripts/generate-site-data --check
evidence_required:
  - suite
  - docs_build
risk: "A tool that recommends is one flag away from a tool that decides; the case is the record of the decision not to add the flag."
created_at: 2026-09-04
updated_at: 2026-09-04
