id: I3126
milestone: a-claim-stands-only-on-its-evidence
title: "check and finish count the refusals later overridden and the completions later reverted, per rule and per release"
slug: governance-errors-are-counted
priority: p2
profile: implementation
objective: "From the ledger, derive two rates per rule and per release. Candidate false refusals: a refusal followed by an override, or a later finish of the same task with no relevant change. Candidate false acceptances: a completed finish whose commits are reverted, or whose issue reopens, within a window. Publish both with denominator, window and provenance."
why: "The owner's audits of 2026-10-13 (c256#2) and 2026-10-14 (c262#10) named false refusal as a critical class of bug, because a tool that refuses correct work gets bypassed. The second adopter met a personal-mode bootstrap that update later refused. Neither rate is measured. It extends milestone cost-per-accepted-outcome. Proposed in ADR 0208 (The product's value is stated as the false dones its finish caught, beside the friction it cost) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c256#2, chatgpt-majordomus:c256#5, chatgpt-majordomus:c262#10."
current_state: "The ledger records finish outcomes and refusals. Nothing joins them over time."
desired_state: "Two derived measures, never typed, on the economics or evidence view."
scope:
  - "apps/majordomus-cli/src/economics"
  - "apps/majordomus-cli/src/ledger.rs"
  - "docs/ECONOMICS.md"
non_scope:
  - "Deciding which refusals were wrong (reported as candidates)"
serves:
  - "a-claim-stands-only-on-its-evidence#bypass-observed"
acceptance_criteria:
  - "A fixture ledger with an overridden refusal and a reverted completion yields one of each"
  - "Each rate carries its denominator and window"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib economics"
evidence_required:
  - "governance_error_rates"
created_at: 2026-10-18
updated_at: 2026-10-18
