id: I4546
milestone: one-frame-one-kit-one-library-per-job
serves:
  - "one-kit-on-every-surface#derived-and-proven"
  - "one-kit-on-every-surface#one-library-per-job"
title: "Every route, kit component and share/design/js module is covered by a probe or a case, the published copy is probed after the deploy, and every gate of the plan is held at zero"
slug: the-kit-is-probed-and-gated
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S12 of milestone one-frame-one-kit-one-library-per-job, the last one: it tightens the gates that I4534 and I4653 started as ratchets to zero, and closes the coverage the owner found missing on 2026-11-17 ('nema 100 % coveratge'). Every route of I4534's route inventory is visited by a ui-shard probe, every kit component and every share/design/js module (core, chart, graph, scene, behaviour, table, links, visual) is driven by an interaction spec or a case on every surface it appears on, and a case fails on a route, component or module none covers. The design kit --check ratchet and the baselines of I4534's ratchet case (frame mark, component class, library construction) and of I4653's two gates are empty, and the gates run without a baseline from here on; the library case fails on any import of cytoscape or chart.js anywhere in the tree and on a construction of ECharts, D3, p5 or Alpine outside share/design/js. The probes cover the mesh topology page (three.js or its D3 successor, by I4541's verdict), the activity chart and the observatory kiosk's p5 scenes. After the pages deploy, a browser probe of the published copy (the site and the /ui and /cockpit snapshot) finds every page of the route inventory served with the frame mark and its visuals drawn. It absorbs #933 (seven widths, a reduced-motion pass and a rendering budget), whose widths, reduced-motion pass and budget become this slice's site probe, as I4534's verdict proposes; #933 stays open until this slice merges and is closed naming the delivering commit."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). The owner's rule of 2026-11-14 (Visuals, derivation and links) says 'Enforced, not advised', and on 2026-11-17 he found the pages not fully working and coverage short of 100 %. The gates are started early as ratchets; this slice is where they stop admitting anything."
current_state: "Measured on master on 2026-11-07: share/cockpit/topology.js (three.js 0.185.1) and share/cockpit/activity.js (p5 2.3.2) have no dedicated probe; .github/workflows/validate.yml runs four ui-shard jobs and no design kit --check step; case 4334 (test/cases/4334_the_ui_kit_is_checked_by_one_capability.sh) proves the capability, not the gate on this tree. Read on 2026-11-17: case 3602 holds that every route is probed by exactly one shard; no case relates kit components or client modules to the specs that drive them; no probe reads the published copy after the pages deploy."
desired_state: "Every route, kit component and share/design/js module is covered and a case refuses one that is not; every gate of the plan runs at zero with no baseline; the pages deploy is followed by a browser probe of the published copy, recorded with the deployed commit."
