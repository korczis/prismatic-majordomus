non_scope:
  - "Asking the owner: the provider's question tool or the terminal asks, and this records what was asked and answered"
  - "Typed coordination records in the mesh journal: I4665"
  - "Attributing a record to the session that wrote it: the other issues of M002"
  - "Rewriting the existing prose answers in issue records: a later change cites them once the kind exists"
  - "A later issue: a provider hook that writes the record from the question tool's own payload (text_source provider-payload), below the model"
  - "A later issue: relay hops (from, to, at, never text) and the lookup of an answer by id from a linked runtime over the mesh"
  - "A later issue: one answer governing several repositories under an NDA, as independently generated per-repository records with their own ids and digests (a shared id or digest links them; literal-substring redaction is no confidentiality boundary)"
  - "ADR acceptance through a record (adr accept --answer <id>): planned by another session on top of this kind"
depends_on: []
acceptance_criteria:
  - "Case 4669: a fixture transcript in the provider's shape yields a record whose question, options, asking session and both times come from the transcript, whose free text keeps its double and trailing spaces, and whose source carries the transcript's file name (never its path), the locator and the sha256 of the raw lines"
  - "A selected label or free text not in the transcript's answer, a question or options that differ from the transcript, a label not offered, several labels on a single-select question, an empty answer, an existing id and an unknown --supersedes are each refused, and a refused record writes nothing"
  - "A typed record says text_source typed and session_source declared or environment, and `question answer` says it is unverified"
  - "The registry lists the record under kind owner-answer with no schema violation"
  - "`question resolve --owner-answer` closes a blocking question with an id that names a record and refuses one that names none"
  - "check and doctor report a record whose question or answer no longer matches its digest, a label that was not offered, transcript-checked without a locator and digest, a file not in the writer's shape, and a citation owner-answer:<id> under .ai/repo/ that names no record; a citation that resolves is not reported"
  - "Negative control: with the label check alone violated and both digests consistent, the case finds the record reported"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=2 bash test/run.sh 4669_an_owner_answer_carries_its_provenance"
evidence_required:
