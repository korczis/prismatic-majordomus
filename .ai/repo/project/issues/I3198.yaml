id: I3198
milestone: mesh-peers-execute-assigned-work
title: "A peer is offered an assignment by capability under a fenced lease, and accepts or refuses it with a reason"
slug: an-assignment-is-offered
priority: p3
profile: deep-work
objective: "Add assignment offer, accept, refuse and return as mesh events and capabilities: the offer names the issue, the required capabilities and the lease; a peer whose declared capabilities do not satisfy it refuses with the missing one; a lease lost mid-run returns the work and says so; nothing executes yet."
why: "Release R3 of the 10-13 plan: distributed execution without a second workflow database. The mesh today carries claims, handovers and reviews and executes nothing (docs/MESH.md). Proposed in ADR 0202 (The mesh routes work to an identity, never an address, and selects among proven transports instead of implementing NAT traversal); ADR 0205 (What a runtime can do is a set of separately evidenced facts, and detection never authorises) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c245#2."
current_state: "Verified: no assignment kind in mesh/cooperation.rs; ADR 0167 seats are claims."
desired_state: "assignment.* capabilities and events; mesh lab scenario for offer and loss."
scope:
  - "apps/majordomus-cli/src/mesh/cooperation.rs"
  - "apps/majordomus-cli/src/capability/builtin/mesh.rs"
  - "test/mesh-lab/run"
non_scope:
  - "Running the work on the peer (a second issue, after its decision)"
depends_on:
  - "I3174"
serves:
  - "nothing-in-the-mesh-waits-on-something-dead#assigned-work-returns"
acceptance_criteria:
  - "A peer lacking the capability is never assigned and says why"
  - "Cancellation reaches the holder"
  - "A duplicate completion is harmless"
validation:
  - "majordomus plan validate"
  - "cargo test --lib mesh::cooperation"
evidence_required:
  - "mesh_lab_assignment"
created_at: 2026-10-18
updated_at: 2026-10-18
