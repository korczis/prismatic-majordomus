id: I0502
milestone: routing-recommendations
title: Recommend a profile from measured cost, naming the measurements
slug: recommend-from-measurements
priority: p3
profile: implementation
parallel_safe: false
objective: "Add the command that recommends a profile for a class of work from measured cost per accepted outcome, and prints the measurements the recommendation was derived from alongside it."
why: "A recommendation whose basis is not printed is an opinion with a command around it. Naming the measurements is what makes it checkable, and being checkable is the only thing that separates this from advice."
current_state: "Cost per accepted outcome is reported per outcome. Nothing recommends anything."
desired_state: "Asking which profile a class of work should use returns a profile, the measurements behind it, and the group they came from."
scope:
  - lib
  - bin
non_scope:
  - Invoking a model, or choosing a provider on a worker's behalf
depends_on:
  - I0501
acceptance_criteria:
  - Every recommendation lists the accepted outcomes and figures it was derived from
  - The recommendation names the group and how the group was derived
  - The command reads records and computes nothing that the cost layer already computes
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "Following a recommendation produces the data that justifies it; the output has to record that the measurements postdate earlier recommendations."
created_at: 2026-09-04
updated_at: 2026-09-04
