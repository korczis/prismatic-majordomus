# The release pipeline. An adapter over .ai/repo/ci/release.yaml and the build matrix
# generated from share/distribution.yaml; it carries no platform, runner, artifact name or
# URL of its own, and test/cases/87_release_pipeline.sh holds it to that.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The version is not chosen here: the tag must already equal the version the crate manifest
# declares — the one place it is authored — and the shell tool must print it, which is the
# first thing checked and the reason a mistyped tag costs thirty seconds rather than a
# published release.
#
# Phases: plan -> build (matrix) -> publish -> smoke. Nothing is built unless the tagged
# commit's `ci` check concluded success (scripts/ci/release-verdict), and nothing is published
# unless every supported target built and verified; a release missing a platform is not a
# release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag to release from
        required: true

# Read-only by default: only the publication job is given more, and only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ plan
  # One version, one model, and the matrix the rest of the run is shaped by.
  plan:
    runs-on: ubuntu-24.04
    # ten for the version and model checks, and up to five more for a ci run still concluding
    timeout-minutes: 20
    # the check-runs of the tagged commit are what the verdict step reads
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: resolve
        name: the tag equals the authority, and the tool prints it
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          scripts/release-version --check --tag "$tag"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      # A release follows the verdict. The tagged commit is published only when its `ci`
      # check (the aggregate verdict of validate.yml, the one status a merge is held to)
      # concluded success. v0.3.1, v0.5.0, v0.6.0 and v0.7.0 were published from commits
      # whose `ci` concluded failure, because nothing here asked. A verdict that cannot be
      # read, or is still running after the wait, refuses too (exit 12): it is not a pass.
      - name: the tagged commit passed ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release-verdict --tag "${{ steps.resolve.outputs.tag }}" --wait 300

      - uses: ./.github/actions/setup-rust

      - name: the distribution model and every recorded release hold their invariants
        run: |
          cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          apps/majordomus-cli/target/debug/majordomus distribution validate
          apps/majordomus-cli/target/debug/majordomus generate distribution --check

      - id: matrix
        name: the build matrix, generated from the model
        run: |
          matrix="$(jq -c '{include: .include}' docs/generated/distribution-matrix.json)"
          smoke="$(jq -c '{include: [.include[] | select(.native)]}' docs/generated/distribution-matrix.json)"
          {
            echo "matrix=$matrix"
            echo "smoke=$smoke"
          } >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.id)\t\(.runner)\t\(.artifact)"' docs/generated/distribution-matrix.json

  # ------------------------------------------------------------------ build
  # One archive per supported target, on the runner the model names, verified where it was
  # built. fail-fast, because a release missing a platform is not a release.
  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 1

      - name: the packages this target needs
        if: matrix.packages != ''
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - uses: ./.github/actions/setup-rust

      - name: the target this artifact is for
        run: rustup target add "${{ matrix.target }}"

      # The vendored browser libraries are built, not committed (.gitignore), and the archive
      # is `share/` as it stands: without this step every installation shipped a UI and a
      # Cockpit whose graphs asked for /ui/assets/vendor/cytoscape.min.js and got a 404.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: the browser assets the archive carries
        run: |
          npm ci --no-audit --no-fund
          scripts/cockpit-assets

      - name: package
        env:
          MAJORDOMUS_BUILD_COMMIT: ${{ github.sha }}
        run: scripts/release-package --target "${{ matrix.target }}" --tag "${{ needs.plan.outputs.tag }}" --out dist

      - name: the archive carries every vendored library a page loads
        run: |
          artifact="$(printf '%s' "${{ matrix.artifact }}" | sed "s/{tag}/${{ needs.plan.outputs.tag }}/")"
          tar -tzf "dist/$artifact" > listing.txt
          missing=0
          for file in share/ui/vendor/cytoscape.min.js share/cockpit/vendor/alpine.csp.min.js \
                      share/cockpit/vendor/cytoscape.min.js share/cockpit/vendor/three.module.min.js \
                      share/cockpit/vendor/three.core.min.js share/cockpit/vendor/p5.min.js; do
            grep -q "/$file\$" listing.txt || { echo "::error::the archive holds no $file"; missing=1; }
          done
          [ "$missing" = 0 ]

      - name: verify the artifact is what the model says it is
        run: |
          artifact="$(printf '%s' "${{ matrix.artifact }}" | sed "s/{tag}/${{ needs.plan.outputs.tag }}/")"
          native=""
          [ "${{ matrix.native }}" = "true" ] && native="--native"
          # shellcheck disable=SC2086
          scripts/release-verify --archive "dist/$artifact" \
            --target "${{ matrix.target }}" --tag "${{ needs.plan.outputs.tag }}" $native

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ publish
  # The only job with write permission, and it begins only when every build succeeded.
  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      # the pull request that proposes the record; smoke names it when the record is unmerged
      record_pr: ${{ steps.record.outputs.record_pr }}
    permissions:
      contents: write
      # to start the pages workflow by hand. A push made with GITHUB_TOKEN starts no
      # workflow — see the step that uses this — so the publication has to be asked for.
      actions: write
      # to propose the record as a pull request. Without it `gh pr create` is refused, and
      # v0.7.0 published every artifact, pushed its record branch and then failed here.
      pull-requests: write
      # to attest each archive's provenance (I2165): the OIDC token names this workflow run,
      # and the attestation is stored with the repository, where `gh attestation verify`
      # and the installer look it up by the archive's digest
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: ./.github/actions/setup-rust

      - name: the executable that answers what an artifact is called
        run: cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml

      # Rerunning this workflow for a tag that already has a release is a supported path, and
      # it is the one an operator reaches for after a failure in a later step. The choice made
      # here is: the assets on an existing release are the release. This run's rebuild is
      # discarded and the published bytes are downloaded in its place, because the record about
      # to be written is evidence of what a user will download — and a rebuild is not
      # bit-identical (docs/DISTRIBUTION.md records that, rather than claiming otherwise), so
      # recording this run's bytes would state digests nothing serves. When no release exists,
      # this run's artifacts are published and are then the same bytes by construction.
      - id: publication
        name: publish the release, or adopt the one already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.plan.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; adopting its assets rather than republishing"
            rm -rf dist && mkdir dist
            gh release download "$tag" --dir dist --pattern '*.tar.gz' \
              || { echo "::error::$tag exists but publishes no archive. Delete the release (gh release delete $tag) and rerun this workflow."; exit 1; }
            echo "adopted=true" >> "$GITHUB_OUTPUT"
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*.tar.gz
            echo "adopted=false" >> "$GITHUB_OUTPUT"
          fi
          ls -l dist

      # Computed from the bytes in dist, which are now the published bytes either way.
      - name: the conventional digest file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS )
          # derived from immutable assets, so replacing it on a rerun changes nothing it states
          gh release upload '${{ needs.plan.outputs.tag }}' dist/SHA256SUMS --clobber

      # Each archive's provenance, signed by this workflow's identity (I2165). A checksum served
      # beside an archive proves the transfer, not who built it; this states that the bytes in
      # dist — the published bytes, adopted or new — were produced by this repository's release
      # workflow at this tag. `gh attestation verify <archive> --repo <repository>` checks it,
      # and so does the installer wherever the GitHub CLI is present and signed in. A rerun
      # attests the same digests again, which adds a record and changes nothing it states.
      - name: the provenance of every published archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz'

      # Staged the moment it exists, before anything derives from it. The layer is what git's
      # index lists (VcsIndex runs `git ls-files`, apps/majordomus-cli/src/discovery/mod.rs):
      # an untracked record is not an object of it. The generators that read files by path —
      # releases/latest.json, docs/INSTALL.md, site/data/registry/distribution.json — see a
      # record the moment it is written; the ones that enumerate the index — the changelog,
      # the registry, the product graph — see it only once it is staged. v0.8.0 derived with
      # the record untracked and proposed a tree that stated both answers at once: the
      # installer data named the release and the changelog did not, so the record's pull
      # request (#624) failed generate --check on arrival and was repaired by hand.
      - name: the record of what was published, staged so the index sees it
        run: |
          tag='${{ needs.plan.outputs.tag }}'
          scripts/release-record --tag "$tag" --dir dist \
            --commit "${{ github.sha }}" \
            --notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          git add -- ".ai/repo/releases/$tag.yaml"

      # Not `generate --target distribution` alone: the record moves docs/INSTALL.md, and that
      # document is a canonical input of the site's derived data, so regenerating only the
      # distribution's own projections leaves site/data/generated stale and the Pages build —
      # the one that would publish releases/latest.json — refuses the tree. The whole
      # derivation graph, in its own order, is what keeps the release readable by the
      # installer it was published for.
      - name: every projection of the new record, regenerated in dependency order
        env:
          MAJORDOMUS_BIN: ${{ github.workspace }}/apps/majordomus-cli/target/debug/majordomus
        run: scripts/derive

      # The verdict CI will give the record's pull request, given here, where a red one can
      # still be withheld. It is taken over the index as it will be committed, because that is
      # the tree CI checks out: whatever the derivation wrote is staged first, rather than a
      # list of trees that can fall behind it — a release changes more than its own metadata;
      # the installation guide gains a row, and the site's data and content are projections
      # of that guide. The downloaded artifacts in dist/ and the build outputs are kept out by
      # .gitignore, not by a pathspec: git refuses a pathspec that names an ignored path, exit
      # 1, which is how v0.20.0 was published with no record. A tree this refuses is not proposed: a pull request born red is one
      # a person has to repair before the release can reach the site, which is the state the
      # staging above exists to prevent and this step exists to prove absent.
      - name: the proposal is what the derivation produces, judged before it is proposed
        env:
          MAJORDOMUS_BIN: ${{ github.workspace }}/apps/majordomus-cli/target/debug/majordomus
        run: |
          git add -A -- .
          scripts/derive-check || {
            echo "::error::the record and its projections are not what scripts/derive produces from them, so the record pull request would fail generate --check; nothing was pushed. Run scripts/derive over the record and propose the result by hand."
            exit 1
          }

      # The release reaches the site now, not after its record's pull request has passed a
      # suite of an hour and a half (ADR 0131). What the installer reads is releases/latest.json
      # and releases/<tag>.json; both are projections of the record just derived and judged
      # above, and nothing else of the site depends on them. They go onto what gh-pages serves
      # and nothing else does: build.json keeps naming the master commit the site was built
      # from, so the pages-live gate still reads master. A deploy of master before the record
      # lands keeps this release as the latest rather than taking the site back a version
      # (scripts/site-deploy). The record's pull request follows, under the full verdict.
      - name: the site serves this release's metadata, ahead of its record
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/site-deploy --release-metadata '${{ needs.plan.outputs.tag }}'

      - name: propose the record and the metadata it publishes
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Everything to commit was staged, and judged, by the step above.
          # A rerun over a release whose record is already committed has nothing to add, and
          # that is success, not failure: the state this step exists to reach is already there.
          if git diff --cached --quiet; then
            echo "::notice::the record and its projections are already committed; nothing to push"
            exit 0
          fi
          git commit \
            -m "chore(release): record ${{ needs.plan.outputs.tag }} and the metadata it publishes" \
            -m "The record is written from the artifacts that were published; every projection of it — the public metadata under site/static/releases/, the installation guide, the site's data and content — is regenerated by scripts/derive. All of it is generated: nothing here was typed."
          # Through a pull request, never straight at the default branch. v0.6.0 published six
          # artifacts and then failed here three times with `GH006: protected branch hook
          # declined`, and the branch protection was right: a pipeline that writes its own
          # output into a protected branch is a pipeline that reviews itself. v0.2.0 and v0.3.0
          # carry the same wound from before protection existed — the version gate has been
          # reporting "tagged and the layer holds no release record for it" about them ever
          # since, which is what this step failing silently looks like months later.
          branch="release/record-${{ needs.plan.outputs.tag }}"
          git branch -f "$branch"
          for attempt in 1 2 3; do
            git push -f origin "$branch" && break
            echo "push attempt $attempt failed; retrying"
            sleep 5
            [ "$attempt" = 3 ] && { echo "::error::the record could not be pushed to $branch"; exit 1; }
          done
          url="$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "chore(release): record ${{ needs.plan.outputs.tag }} and the metadata it publishes" \
              --body "Written by scripts/release-record from the artifacts published for ${{ needs.plan.outputs.tag }}, with every projection regenerated by scripts/derive. Nothing here was typed. Until this merges, the published site's latest.json does not name ${{ needs.plan.outputs.tag }} and the layer holds no record for it, so majordomus release version warns about the tag." \
            2>"$RUNNER_TEMP/create.err" || gh pr view "$branch" --json url --jq .url 2>/dev/null)" || {
            # Both failed: no pull request exists and none could be opened. Say why, rather
            # than exiting 1 with the reason sent to /dev/null — which is how v0.7.0's record
            # sat on its branch for hours with nothing proposing it. The usual cause is the
            # repository setting that forbids GitHub Actions to create pull requests.
            echo "::error::the record is on $branch but no pull request proposes it: $(tr '\n' ' ' < "$RUNNER_TEMP/create.err")"
            echo "::error::open it by hand (gh pr create --base ${{ github.event.repository.default_branch }} --head $branch), or allow GitHub Actions to create pull requests in the repository settings"
            exit 1
          }
          echo "::notice::the release record is proposed in $url; the site will not name ${{ needs.plan.outputs.tag }} until it merges"
          echo "record_pr=$url" >> "$GITHUB_OUTPUT"

      # The record's pull request starts no check of its own.
      #
      # It was opened with GITHUB_TOKEN, and GitHub starts no workflow from an event that
      # token caused: the `pull_request` run it records concludes failure with no job in it.
      # So the proposal above sat BLOCKED with an empty check rollup after v0.15.0 and again
      # after v0.16.0, the required `ci` never reported, and each release waited for a
      # person to close and reopen the pull request before its record could merge, with
      # smoke failing by design the whole time. A dispatch is the one event that token may
      # cause, so the pipeline asks for the verdict itself, on the record's branch, planned
      # as that pull request's own run would have been (validate.yml, input plan=change).
      # The check-runs attach to the branch's head commit, which is what the pull request
      # and its required check read.
      #
      # A dispatch that cannot be started is said, with the remedy, and does not fail the
      # job: the release is published either way, and smoke must still run to say so.
      - name: ask for the record's verdict, because its pull request starts none
        if: steps.record.outputs.record_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/record-${{ needs.plan.outputs.tag }}"
          if gh workflow run validate.yml --ref "$branch" -f plan=change; then
            echo "validate requested on $branch, planned as the change it is"
          else
            echo "::warning::could not start validate on $branch; the record's pull request has no check until somebody closes and reopens it, or runs: gh workflow run validate.yml --ref $branch -f plan=change"
          fi

      # The step without which none of the above reaches a user.
      #
      # GitHub does not start a workflow from a push made with GITHUB_TOKEN. That is a
      # deliberate loop-breaker and it cannot be turned off for a token; it means the commit
      # above — the one carrying site/static/releases/latest.json — starts no `pages` run,
      # ever. The release then owns a GitHub Release, a committed record, and a published
      # site that has never heard of either, and smoke waits fifteen minutes for a file that
      # nothing is going to write. Release v0.3.1 spent its whole smoke phase in exactly
      # that state, with all six builds green and the external contract broken the entire
      # time; the deploy is the last link of the chain, so the release asks for it rather
      # than assuming a side effect it does not have.
      #
      # `workflow_dispatch` is the same entry point a person uses, so this adds no second
      # deploy path (site-deploy-one-path); it starts the one that exists. It runs whether
      # or not the commit step had anything to push, because a rerun after a failed deploy
      # is precisely the case with nothing to commit and everything to publish.
      - name: ask Pages to publish the default branch, because nothing else will
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}" \
            || { echo "::error::could not start the pages workflow; the release metadata is committed but unpublished. Start it by hand: gh workflow run pages.yml --ref ${{ github.event.repository.default_branch }}"; exit 1; }
          echo "pages requested on ${{ github.event.repository.default_branch }}"

  # ------------------------------------------------------------------ image
  # The release's deployment image, made from the release's own published executables rather
  # than from a compile of its own. The publish job decides which bytes are the release (an
  # existing release's assets win over this run's rebuild, which is not bit-identical), so
  # this job reads them back from the release, holds each archive to SHA256SUMS and to the
  # provenance attestation publish made for it, and copies the very executable a user installs
  # into the image. The generated Dockerfile takes it through MAJORDOMUS_BINARY_FROM=release and
  # the `release-binary` build context, and BuildKit builds only the stages the image reaches,
  # so nothing is compiled: the image is the runtime base, the binary and the layer.
  image:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: read
    env:
      IMAGE: ghcr.io/korczis/prismatic-majordomus
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      # Which archives, from the distribution model rather than from a list here: every Linux
      # musl target, and the platform each one is for.
      - name: the release's verified Linux executables
        id: binaries
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -eu
          commit="$(git rev-parse HEAD)"
          mkdir -p release-archives release-binary
          platforms=""
          jq -r '.include[] | select(.target | endswith("-unknown-linux-musl")) | "\(.target)\t\(.artifact)"' \
            docs/generated/distribution-matrix.json > musl-targets.tsv
          [ -s musl-targets.tsv ] || { echo "::error::the distribution model names no Linux musl target"; exit 1; }
          while IFS="$(printf '\t')" read -r target artifact; do
            archive="${artifact//\{tag\}/$TAG}"
            case "$target" in
              x86_64-*) arch=amd64 ;;
              aarch64-*) arch=arm64 ;;
              *) echo "::error::no container platform for $target"; exit 1 ;;
            esac
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$archive" -D release-archives --clobber
            gh attestation verify "release-archives/$archive" -R "$GITHUB_REPOSITORY" >/dev/null \
              || { echo "::error::$archive carries no provenance attestation of this repository"; exit 1; }
            root="${archive%.tar.gz}"
            tar -xzf "release-archives/$archive" -C release-archives "$root/libexec/majordomus-cli" "$root/RELEASE.json"
            built="$(jq -r .commit "release-archives/$root/RELEASE.json")"
            [ "$built" = "$commit" ] || { echo "::error::$archive was built from $built, the tag is $commit"; exit 1; }
            install -m 0755 "release-archives/$root/libexec/majordomus-cli" "release-binary/majordomus-$arch"
            platforms="${platforms:+$platforms,}linux/$arch"
            echo "$archive -> linux/$arch ($(sha256sum "release-binary/majordomus-$arch" | cut -c1-16))"
          done < musl-targets.tsv
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D release-archives --clobber
          ( cd release-archives && grep -- '-unknown-linux-musl\.tar\.gz$' SHA256SUMS | sha256sum -c - ) \
            || { echo "::error::an archive does not match the release's SHA256SUMS"; exit 1; }
          { echo "commit=$commit"; echo "platforms=$platforms"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        timeout-minutes: 3
      - uses: docker/setup-buildx-action@v3
        timeout-minutes: 3
      - uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The runner's own platform first, loaded, so the smoke runs the image that is pushed.
      - name: the image, from the release's executable (no compile)
        timeout-minutes: 5
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ needs.plan.outputs.tag }}
          build-args: MAJORDOMUS_BINARY_FROM=release
          build-contexts: release-binary=release-binary

      - name: the image runs the release
        timeout-minutes: 3
        uses: ./.github/actions/image-smoke
        with:
          image: ${{ env.IMAGE }}:${{ needs.plan.outputs.tag }}
          commit: ${{ steps.binaries.outputs.commit }}

      - name: publish the release image for every platform the release ships
        id: publish
        timeout-minutes: 10
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: ${{ steps.binaries.outputs.platforms }}
          tags: ${{ env.IMAGE }}:${{ needs.plan.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: MAJORDOMUS_BINARY_FROM=release
          build-contexts: release-binary=release-binary
          provenance: mode=max
          sbom: true

      - name: summary
        if: always()
        timeout-minutes: 1
        env:
          REF: ${{ env.IMAGE }}:${{ needs.plan.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          PLATFORMS: ${{ steps.binaries.outputs.platforms }}
        run: |
          {
            echo "### release image"
            if [ -n "$DIGEST" ]; then echo "- published: \`$REF@$DIGEST\` ($PLATFORMS)"
            else echo "- published: no"; fi
            echo "- executable: the release's own musl archives, checksummed and attested"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ smoke
  # The published installer, from its published URL, installing the release that was just
  # published. This is the check that catches a release whose artifacts exist and whose
  # names the installer does not expect.
  smoke:
    needs: [plan, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 1

      # The handshake with Pages, on the identity that matters. The wait is for the published
      # latest.json to name *this* tag — not for a commit, and not for a clock. Waiting on the
      # site's build commit was considered and rejected: the default branch moves during a
      # release, so Pages may legitimately be serving a newer commit than the one that carried
      # the record, and a run that insisted on equality would wait for a state that will never
      # arrive. The tag is the immutable identity of what was published, so it is what is
      # waited on; the build commit is reported beside it because it is what an operator needs
      # to know when the wait fails.
      - name: wait for the published metadata to name this release
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_PR: ${{ needs.publish.outputs.record_pr }}
        run: |
          # The publish job put this release's metadata on the site itself, ahead of its record
          # (ADR 0131), so the wait no longer begins with the record being on the default
          # branch: until 2026-10-10 it did, and it failed every release whose record was still
          # a proposal, which was every release. What is waited on is what the installer reads.
          base="$(sed -n 's/.*"installer_url": "\([^"]*\)".*/\1/p' site/data/registry/distribution.json | head -n 1)"
          base="${base%/install.sh}"
          url="$(sed -n 's/.*"latest_url": "\([^"]*\)".*/\1/p' site/data/registry/distribution.json | head -n 1)"
          tag='${{ needs.plan.outputs.tag }}'
          echo "waiting for  $url"
          echo "to name      $tag"
          for attempt in $(seq 1 60); do
            if curl -fsSL --max-time 60 "$url" 2>/dev/null | grep -q "\"tag\": \"$tag\""; then
              echo "the site publishes $tag after $attempt attempt(s)"
              echo "site built from  $(curl -fsSL --max-time 60 "$base/build.json" 2>/dev/null | sed -n 's/.*"commit": "\([^"]*\)".*/\1/p' | head -n 1)"
              exit 0
            fi
            sleep 15
          done
          {
            echo "expected  \"tag\": \"$tag\" in $url"
            echo "observed  HTTP $(curl -s --max-time 60 -o /dev/null -w '%{http_code}' "$url")"
            echo "body      $(curl -fsSL --max-time 60 "$url" 2>/dev/null | head -c 400)"
            echo "site is built from commit $(curl -fsSL --max-time 60 "$base/build.json" 2>/dev/null | sed -n 's/.*"commit": "\([^"]*\)".*/\1/p' | head -n 1)"
            echo "reproduce: curl -fsSL $url"
            echo "the publish job puts the metadata on gh-pages (scripts/site-deploy --release-metadata);"
            echo "if its step passed, GitHub's own Pages build of gh-pages is where this failed."
            echo "the record itself: ${RECORD_PR:-the pull request from release/record-$tag}"
          } >&2
          echo "::error::$url still does not name $tag after 15 minutes"
          exit 1

      # The published installer installs the published tag, and the installed tool does what
      # a client configuration asks of it: it initialises a repository that is not this one
      # and serves it over the shared server, ready and naming that repository (I2162). One
      # gate, scripts/ci/install-check, measures this for a person, for the nightly run and
      # here; --expect pins it to this tag, and nothing in this job swallows a failure.
      - name: the published release installs, initialises and serves a foreign repository
        run: scripts/ci/install-check --expect "${{ needs.plan.outputs.tag }}"
