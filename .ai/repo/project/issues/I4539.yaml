  - "I4495"
acceptance_criteria:
  - "The interaction probe drives search, filter, sort, pagination, column visibility, CSV export, JSON export and the row link on each of the seven lists"
  - "An exported CSV and JSON hold exactly the rows and columns shown"
  - "The issue list keeps I4495's page-in-the-URL reading (milestone a-screen-is-fast-bounded-and-says-why), on which this table builds rather than replacing it"
  - "With script disabled each list renders its server page and pagination links that reach every row the capability returns"
  - "Every /ui screen that adopts the table stays within the warm budget of the ui-checks step (100 ms p95, I4200), measured by majordomus bench on the same build before and after"
