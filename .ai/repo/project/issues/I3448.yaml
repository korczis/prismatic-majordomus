    result: "Both cases ok at b3124102bbf. Case 3721: a fixture gh-pages carrying releases/v9.9.9-alpha.1.json (published by --release-metadata) and a build without it: after an ordinary deploy the file's blob is unchanged and the deploy prints 'kept releases/v9.9.9-alpha.1.json' and its gh-pages commit names 'release files kept: v9.9.9-alpha.1.json'; once the build holds a different copy, the build's blob is served and nothing is said kept; latest.json kept at v9.10.0 while newer than the build's 9.9.8 and replaced by 9.10.1. Fails before: with origin/master 54c317f11ad's scripts/site-deploy the case fails ('expected /kept releases/v9.9.9-alpha.1.json: gh-pages serves it and the build does not hold it/'; that deploy pushed 'deploy: site from ..., 1 routes' without the file). Mutants: dropping the restore fails on 'a deploy of master removed or changed releases/v9.9.9-alpha.1.json (served blob: none)'; dropping the build-holds-it skip fails on the commit naming v9.9.8.json as kept. Case 1041 (ADR 0131) unchanged and green."
