risks:
  - "Flowbite JS reads data-* attributes at load: a fragment swapped in later needs its initialiser called again, or a drawer and a dropdown in it are dead"
  - "Moving the site's inline x-data to Alpine.data under the CSP build can break the 15 templates that carry it; each must be driven by the interaction probe before the slice lands"
  - "The four Cytoscape integrations carry different keyboard and theme behaviour; unifying them can regress /cockpit/trains, the busiest graph"
