  - "Removing, skipping or making advisory any gate to fit the bound; a plan that does not fit waits for its own jobs"
depends_on: []
acceptance_criteria:
  - "Before any gate job asks for a runner, a run's plan job counts the hosted jobs of this repository in flight and yields when admitting its selected jobs would pass fourteen; a case replays eleven concurrent pull request runs and proves the in-flight count never passes fourteen"
  - "A yielded run is resumed when slots free, and the release path and master are never made to wait for a pull request's run; a case proves the order"
  - "The bound and the measurement that set it (20/20 on 2026-11-06, six reserved for OSCILLA; the re-scope's evidence of 2026-11-08) are written in .ai/repo/ci/"
  - "A job whose runs-on is a self-hosted label (lundra) is not counted against the bound, and the case proves it on a fixture workflow"
  - "scripts/ci/step-bound-check and case 26 are green on the changed workflows"
validation:
  - "bash test/run.sh 4532_the_hosted_ci_jobs_are_bounded_to_fourteen 26_ci_wiring"
  - "scripts/ci/step-bound-check"
evidence_required:
  - suite
risk: "A bound lengthens every full validate: a plan that spreads over its shards now waits for them. The minutes it costs are measured on GitHub before the bound is tightened below fourteen, and a case can only prove the declared width, never the account's live queue."
