intent: a-browser-computes-what-the-server-verifies
observed_at: d116266803
recorded_by: claude-code (session 21616f1e, worktree feature/a-browser-computes-for-the-mesh; read-only audit of the mesh, the execution plane, the capability registry and wasm32 portability at master)
recorded_at: 2026-10-17
observations:
  - id: one-crate-no-wasm
    statement: The repository has one Rust crate and no Cargo workspace, no wasm32 target, no browser binding and no cfg(target_arch = "wasm32") anywhere
    source: file:apps/majordomus-cli/Cargo.toml
  - id: canonical-json-twice
    statement: Canonical JSON is written twice, in mesh/journal.rs for signatures and in capability/executor.rs for cache keys, by two implementations that agree only by inspection
    source: file:apps/majordomus-cli/src/mesh/journal.rs
  - id: no-caller-authentication
    statement: A caller beyond loopback reads and writes nothing, and the server authenticates no caller; ADR 0126 leaves token or key-based authorization open
    source: file:.ai/repo/adrs/0126-a-caller-beyond-loopback-reads-and-changes-nothing-it-cannot-authenticate.md
  - id: reports-are-not-recomputed
    statement: executions.report stores what its reporter says and recomputes nothing; no capability takes a result computed elsewhere and checks it
    source: file:apps/majordomus-cli/src/capability/builtin/executions.rs
  - id: no-page-runs-the-module
    statement: No page runs the wasm32 module; the asset server reads every file as text and serves no application/wasm, and the Cockpit's policy allows no WebAssembly compilation
    source: file:apps/majordomus-cli/src/cockpit/assets.rs
  - id: one-row-at-a-time
    statement: The page computes and verifies one digest of the reader's input; whether the module a browser loaded answers every fixture row is proven by node in a gate, not in any browser
    source: file:apps/majordomus-cli/src/ui/compute.rs
  - id: a-bare-textarea
    statement: The page's JSON input is a plain textarea that says nothing about its text until the server answers, and reformatting it with JSON.parse would rewrite the values the digest is computed over (1.0, 1e300, integers past 2^53)
    source: file:apps/majordomus-cli/src/ui/compute.rs
