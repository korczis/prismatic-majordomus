id: I2885
milestone: development-runtime
title: "Build output that no declared owner holds is measured and refused before it accumulates"
slug: ownerless-build-output-is-measured
priority: p1
profile: implementation
parallel_safe: true
objective: "The accumulation gate measures build output outside the declared locations — ~/.cache/*-target and ~/.cache/*-build directories written by workers' remote runs, offload targets of runs that ended — and the machine sweep reclaims those that are idle and named by no process, so a worker's private copy cannot outlive its run unnoticed."
why: "2026-10-18: lundra held about 25 GB in ~/.cache/*-target and *-build directories (conv-mesh-*, leaf-*, s4-skewed-*, rt-s3-share-target, majordomus-offload-target-<tag>) that belonged to runs long finished; no rule declared them, so no sweep looked at them."
current_state: "(Follows I2881, recorded beside it on their own branches.) Rule accumulation-is-measured v2 covers worktrees and the declared build directories; nothing measures undeclared build output under ~/.cache."
desired_state: "A declared pattern for remote-run build output under ~/.cache, measured by the accumulation gate and swept by machine.sweep with the same fail-closed verdicts; remote-run tooling writes only under that pattern."
scope:
  - ".ai/repo/rules/project"
  - "apps/majordomus-cli/src/capability/builtin/machine.rs"
acceptance_criteria:
  - "An idle ~/.cache/<run>-target named by no process is reported and, with --reclaim, removed; a live one is kept"
validation:
  - "majordomus plan validate"
evidence_required:
  - "ownerless_output_test"
created_at: 2026-10-18
updated_at: 2026-10-18
