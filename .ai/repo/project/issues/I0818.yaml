id: I0818
milestone: M004
title: The command registry is read in one pass
slug: registry-batch-reads
priority: p0
profile: implementation
parallel_safe: false
objective: "Replace the per-index, per-field awk lookups in mj_cmdreg_public, mj_cmdreg_ids and the event registry with one awk pass each, and read them once per process."
why: "Command coverage costs three seconds because mj_cmdreg_public runs dozens of awk processes and is called inside a loop over declared commands."
current_state: "mj_cmdreg is one awk per key; mj_cmdreg_public loops it; mj_validate_command_coverage calls mj_cmdreg_public per declared command."
desired_state: "Each registry is flattened once and its public ids and dispatch table are derived with one awk; the coverage validator reads every case header with one pass."
scope:
  - lib/commands.sh
  - lib/common.sh
  - test/cases/30_command_registry.sh
  - test/cases/31_command_coverage.sh
non_scope:
  - A change to share/commands.yaml
depends_on:
  - I0817
acceptance_criteria:
  - validate:command_coverage and validate:command_surface each under 200 ms on this repository
  - Cases 30, 31, 35 and 36 pass unchanged
  - yaml_flatten count for doctor does not grow
validation:
  - MJ_TIMING=1 bin/majordomus doctor
  - bash test/run.sh 31_command_coverage
evidence_required:
  - batch_reads
risk: "A batch read must produce exactly the per-key results; the cases that mutate the registry are the proof."
created_at: 2026-09-05
updated_at: 2026-09-05
