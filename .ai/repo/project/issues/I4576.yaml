id: I4576
milestone: ci-critical-path
title: "The integration lease's holder record is never empty or half written while its holder renews it, so no reader of it gets a lease without a holder"
slug: the-lease-reader-waits-for-a-whole-record
priority: p1
profile: implementation
parallel_safe: true
objective: "IntegrationLease's write_record replaces the holder record without an empty or partial state a concurrent reader can see, and IntegrationLease::read retries a record that does not parse until a time bound rather than for five 2 ms attempts, so an observer reads its holder while a keep-alive or a progress rewrites it."
why: "integration::tests::progress_rewrites_the_record_and_the_lease_is_still_its_holders reads the lease through holder() while keep_alive_every(20 ms) rewrites the record. write_record truncates the file (set_len(0)) before it writes the new record, so a reader can meet it empty. read() retried five times 2 ms apart, about 10 ms in all, and under load the writer was preempted between the truncation and the write for longer: read returned a state whose holder was None, and the test's unwrap panicked. It failed master validate 42964292450 rust (2) and #2983's coverage job on 2026-11-11. Every other caller of IntegrationLease::read meets the same window and reports a held lease as one without a holder."
current_state: "At origin/master d34f159439f write_record empties the file and then writes it, and read gives up after five 2 ms retries."
desired_state: "write_record writes the new record over the old one padded with spaces to the old length, then trims the trailing spaces, so every state a reader can meet is a whole record; read keeps retrying a record that does not parse for up to LEASE_READ_PATIENCE before it reports no holder. The test passes 50 runs out of 50 under load where it failed before."
scope:
  - ".ai/repo/project/issues/I4576.yaml"
  - "apps/majordomus-cli/src/integration/drain.rs"
  - "apps/majordomus-cli/src/integration/tests.rs"
non_scope:
  - "Node::hold's holder record, which I4566 made a retrying reader of"
depends_on: []
acceptance_criteria:
  - "Run 50 times on lundra under parallel load, progress_rewrites_the_record_and_the_lease_is_still_its_holders fails at least once before the change and passes every run after it"
  - "A unit test reads the record while a writer rewrites it in a tight loop and never meets a lease without a holder"
validation:
  - "cargo test --lib -- integration::tests::progress_rewrites_the_record_and_the_lease_is_still_its_holders (50 runs)"
evidence_required:
  - test
serves: []
created_at: 2026-11-11
