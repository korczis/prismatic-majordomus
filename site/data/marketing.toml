# The only hand-written prose on the site: positioning sentences and button labels. No
# capability claims (features, domains and claims are objects of the layer, derived onto the
# page) and no numbers (the generator computes every count). Budget: scripts/site-check fails
# when this file exceeds 60 lines.
[hero]
eyebrow = "A supervisory control layer for AI-assisted work"
title = "AI coding agents do the work."
subtitle = "Your repository decides whether it is done."
lead = "Majordomus keeps the context, the paths each agent may touch, the rules and the definition of done in the repository instead of a chat window, and it refuses to record work as finished until the repository's own checks pass. It runs beside whichever coding agent you use, and it never calls a model."
cta_primary = "Watch it refuse an agent"
cta_install = "Install"
verdict_kicker = "recorded run · the worker says it is done"
verdict_after = "It is accepted only when every line passes:"
verdict_link = "Step through the whole run"
console_caption = "Recorded runs, not a mockup: each panel is the stdout of a scenario this site executed while it was being generated, with the machine and the clock redacted and nothing else touched."
[recognise]
title = "Where AI-assisted work breaks down"
lead = "None of these are model problems. They are operations problems, and the repository is where operations belong."
closing = "Majordomus turns each of them into repository state, a contract a machine checks and a record of what happened."
more = "Recognise a specific moment? The failure modes it answers, by who meets them"
[map]
kicker = "what it controls"
title = "One control layer, a few things it controls"
lead = "Every feature is filed under exactly one domain. Open one for the failure it answers, the features in it and the evidence behind them; every member and every count is derived from the features' own files."
from = "a worker's change"
to = "a verified outcome"
[workflow]
kicker = "how it works"
title = "One task, from start to finish"
lead = "A worker claims a task and the paths it may touch, reads what the repository knows, records progress, is checked against policy, leaves a handover, and asks to finish. The repository answers each step."
closing = "Nothing here asks a model to behave. Each command checks the repository's own state against the contract written before the work started, and an unmet line stops the command."
inspect = "Inspect the recorded runs behind every step"
[refuses]
kicker = "the proof"
title = "A worker's word is not proof"
lead = "A worker strays outside its scope, says it is done, and is refused; fixes the scope and is refused again, because the repository's own test still fails; and is accepted only when every line of the contract passes. A recorded run of the real tool, stepped through."
closing = "This is the difference between a tool that tells a worker what to do and one that decides whether what it did counts. A worker can always say it is finished; here that sentence is a claim the repository evaluates, line by line, and nothing is recorded while any line fails."
more = "Every other refusal the lifecycle recorded"
[surfaces]
kicker = "one source, every surface"
title = "Declared once, projected everywhere"
lead = "A capability, a rule, a feature, a domain: each is declared once in the repository. The command line, the HTTP API and its OpenAPI document, MCP, the Cockpit, the reference and this site are projections of that declaration, and a projection that disagrees with it fails the build."
source = ".ai/ declarations and the executable's capabilities"
registry = "one registry, validated"
[providers]
title = "Repository intelligence is not a model provider."
boundary = "Majordomus never invokes a model; it decides what a worker is told, what it may touch, and whether its claim of being done can be believed."
[install]
kicker = "get started"
title = "Try it on a repository you already have"
layer = "What init creates is the layer this site is generated from: one directory, tracked, readable without the tool."
[write_once]
title = "Write once. Surface everywhere."
lead = "A rule, a skill, a decision, a use case, an operational moment, a feature: each is one file under the layer with a schema. Discovery finds it, the schema validates it, the index holds it, and every interface reads the index. Nothing registers anything."
[contract]
caption = "The contract as the repository's own README shows it: a recorded run from the challenge, redacted and otherwise untouched, which the build refuses to publish if it stops matching. One line per check, each naming what it proved; a failing line carries the command that reproduces it, and nothing is written until every line passes."
[architecture]
lead = "This page is a projection of the repository it describes. Every feature, count, provider, interface and moment on it came out of the same executable that answers agents, and a stale page fails the build before it can be deployed."
