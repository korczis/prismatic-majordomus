id: I2753
milestone: surfaces-never-disagree
title: "Two diagrams on one page never share an element id"
slug: two-diagrams-never-share-an-element-id
priority: p2
profile: implementation
parallel_safe: true
objective: "Give every element id inside a drawn Mermaid diagram a prefix unique to that drawing, and rewrite every reference to it, so that a page with several diagrams that share node names has no duplicate id."
why: "site/diagrams.js draw() renders with mermaid.render('mjd-' + seq, source), but Mermaid 11.12.0 prefixes only marker ids with that id: flowchart node ids (flowchart-<node>-<n>) and edge ids (L_<a>_<b>_<n>) are global, so two flowcharts that both name a node collide. On 2026-10-16 run 38887561936 found ui-audit semantics.duplicate-id on /docs/docs/development-runtime/. A duplicate id breaks fragment links, aria-labelledby and the viewer's own node lookups, and the ui audit is right to refuse it."
current_state: "Each drawing's svg carries a unique id, but the nodes, edges and clusters inside it carry ids Mermaid derives from their names alone."
desired_state: "After render, draw() prefixes every id inside the svg with the svg's own id and rewrites each reference to one: url(#...) in attributes and style, href and xlink:href, aria-labelledby and aria-describedby. A case renders two diagrams sharing node names on one page and asserts that every id on it is unique and every reference resolves."
scope:
  - "site/diagrams.js"
  - "test/cases"
non_scope:
  - "Changing the Mermaid version or its configuration."
depends_on: []
acceptance_criteria:
  - "A page with two flowcharts that share node and edge names has no duplicate id after both are drawn"
  - "Every url(#), href, xlink:href, aria-labelledby and aria-describedby reference inside a drawn svg resolves to an element of that same svg"
  - "scripts/ui audit reports no semantics.duplicate-id on /docs/docs/development-runtime/"
  - "The viewer's hover, focus and node links still work on the rewritten ids"
validation:
  - "bin/majordomus plan validate"
  - "bash test/run.sh <the case this issue adds>"
  - "scripts/ui audit --only /docs/docs/development-runtime/"
evidence_required:
  - "diagram_ids_unique_case"
  - "ui_audit_no_duplicate_id"
created_at: 2026-10-16
updated_at: 2026-10-16
