id: mesh-peers-execute-assigned-work
title: "Work is offered to a peer by capability under a fenced lease, and runs there as an execution"
slug: mesh-peers-execute-assigned-work
order: 175
priority: p3
problem: "Since 2026-09-11 the owner asked for work to be placed on peers by capability, health and history. The mesh coordinates but executes nothing a peer sends (docs/MESH.md); the-mesh-works-out-of-the-box names a milestone 'mesh-peers-execute-assigned-work (I2332-I2336)' that exists on no ref but a 10-04 stash. Proposed in ADR 0205 (What a runtime can do is a set of separately evidenced facts, and detection never authorises) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c113#6, chatgpt-majordomus:c154#5, chatgpt-majordomus:c226#2."
outcome: "An assignment is offered, accepted or refused by a peer whose declared capabilities and execution profile satisfy it, and an accepted one runs through the execution plane under the same authorisation as a local call."
current_state: "Verified: the-mesh-works-out-of-the-box.yaml non_scope cites it; git grep finds I2332 only in that file and generated copies; ADR 0033 executions are local."
desired_state: "assignment.offer / accept / refuse as capabilities; profile satisfaction checked; a lost lease returns the work."
scope:
  - "apps/majordomus-cli/src/mesh/cooperation.rs"
  - "apps/majordomus-cli/src/execution"
  - "apps/majordomus-cli/src/capability/builtin/mesh.rs"
  - "docs/MESH.md"
non_scope:
  - "A placement optimiser over cost history (routing-recommendations)"
  - "Deciding how many peers to activate (open question)"
acceptance_criteria:
  - "A peer lacking the capability is never assigned and says why"
  - "A lease lost mid-run returns the work and says so"
validation:
  - "majordomus plan validate"
evidence_required: []
depends_on:
  - "mesh-journal-converges"
  - "runtime-trust"
  - "runtime-adapters"
risks:
  - "Remote execution is the largest trust widening the mesh can make: it waits for ADR 0126's authenticated caller and a decision record of its own"
created_at: 2026-10-18
updated_at: 2026-10-18
