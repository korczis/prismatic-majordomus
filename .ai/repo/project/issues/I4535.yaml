id: I4535
milestone: one-frame-one-kit-one-library-per-job
serves:
  - "one-kit-on-every-surface#one-client-core"
title: "One share/design/js/core module set, served from its own asset root, holds every shared client helper, and every byte copy and hand-kept near-duplicate is gone"
slug: one-client-core-module
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S1 of milestone one-frame-one-kit-one-library-per-job, landed as ordered pull requests, one step each. Step 0, the asset root: serve share/design as an asset root of its own (Assets::under(share, 'design', '/design/assets/'), routed in cockpit/mod.rs and ui/mod.rs) and extend rewrite_imports to version /design/assets specifiers, because cockpit/assets.rs resolve_relative refuses a '..' past the surface root and canonicalize refuses a symlink, so neither /ui nor /cockpit can import share/design/js/core today; the cases of this step join the ratchet gate I4534 started. Step 1, socket: socket.js moves to the core; executions, monitor, peers, live.js and SOCKET_LIB are repointed, cases 100_execution_plane, 3382, 3383, 3386 and 3409 are repathed, both copies and the socket line of scripts/cockpit-assets COPIES are deleted, which also ends one tab loading two socket.js module instances. Step 2, the bar: nav.js and theme.js move to the core and load as type=module on all three surfaces at once (BAR_SCRIPTS of ui/shell.rs and cockpit/view.rs to the /design/assets URLs; scripts/site-build, site/templates/base.html, scripts/site-check and scripts/lib/site-pages.awk follow), and the six copies and the COPIES machinery are deleted; rule project.the-ui-wears-the-sites-navbar, whose required behaviour 3 asks for those byte copies, is amended in the same pull request to name share/design/js/core as the one served source. Step 3, the near-duplicates, one consumer per pull request: tokens.js (declared, resolve, hex, token, mix, measure, motionMs, motionAllowed, palette), load.js, clipboard.js and tip.js; clipboard.js is the home of I3793's one copy control, moved and not reimplemented. It absorbs #1178 (the Observatory hears executions as they happen), whose socket client lands on the core in step 1, as I4534's verdict proposes. The two Cytoscape setups are not deduplicated here: they are about 3 % similar and are rewritten onto ECharts and D3 by I4541."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). ADR 0135 says shared code moves to a module both surfaces import and is not duplicated, and on 2026-11-17 the owner found code being duplicated instead of the existing mechanisms being reused or extended ('zacina se duplikovat kod misto toho aby byly vyuzity a/nebo rozsireny mechanismy')."
current_state: "Read at master ae13be1 on 2026-11-17 by a read-only spike of a peer session. Byte-copy groups written by scripts/cockpit-assets COPIES (lines 41-45) and held by its --check: nav.js and theme.js (site/ to share/ui and share/cockpit, three copies each), socket.js (share/cockpit to share/ui); cytoscape and p5 are copied into share/cockpit/vendor and share/ui/vendor, so each library is served at two URLs. Near-duplicates, the real targets: token to hex through a canvas pixel, 5 copies (site/charts.js, site/graph.js, share/ui/ui.js, share/ui/observatory.js, the share/cockpit/cockpit.js palette); isDark, 3 (site/charts.js, site/diagrams.js, site/graph.js); motionMs, 2; a lazy script loader, 8 (share/cockpit/cockpit.js twice, share/ui/ui.js, site/graph.js, site/charts.js, site/diagrams.js, share/ui/observatory.js, share/ui/observatory-kiosk.js); clipboard, 3 (site/diagrams.js, site/kit.js, share/ui/ui.js); showTip and hideTip, 2 (share/cockpit/graph.js, share/ui/ui.js). apps/majordomus-cli/src/cockpit/assets.rs resolve_relative (line 348) refuses a '..' past the surface root and canonicalize refuses a symlink, so share/design is reachable from neither surface. One tab may load two socket.js module instances: live.js imports ./socket.js while /ui borrows SOCKET_LIB from /cockpit/assets. nav.js and theme.js are classic scripts (cockpit/view.rs:84-88, ui/shell.rs:100-105). No share/design/js directory exists."
desired_state: "share/design/js/core/{socket,nav,theme,tokens,load,clipboard,tip}.js exist once and are served from /design/assets/ under a digest that covers their transitive imports, and the site build fingerprints the same graph; share/ui, share/cockpit and site import them and keep no byte copy and no hand-kept near-duplicate; scripts/cockpit-assets has no COPIES; the cases of this slice run in the suite and in the ratchet gate."
