id: I4544
milestone: one-frame-one-kit-one-library-per-job
serves:
  - "one-kit-on-every-surface#readable-by-a-model"
title: "Every page carries rel=alternate JSON of the data it shows, and /ui and the site publish an llms.txt derived from the route registry"
slug: every-page-is-readable-by-a-model
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S10 of milestone one-frame-one-kit-one-library-per-job. Every /ui, /cockpit and site page carries a link rel=alternate type=application/json to the capability answer or data file it renders. /ui serves /ui/llms.txt and the site publishes /llms.txt, each derived from the route registry (the derived SCREENS of I4538 and the site's sections), never hand-written."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). The owner asks for every page to be readable by an LLM; a model reading the HTML today has to scrape what a capability already answers as JSON."
current_state: "Measured on master on 2026-11-07: no page carries a rel=alternate JSON link and neither /ui nor the site serves llms.txt; the /ui routes are the hand list at apps/majordomus-cli/src/ui/mod.rs:140."
desired_state: "Every page has its JSON alternate and both llms.txt files are derived and list every route with its alternate."
scope:
  - "apps/majordomus-cli/src/ui/mod.rs"
  - "apps/majordomus-cli/src/cockpit/mod.rs"
  - "apps/majordomus-cli/src/ui/shell.rs"
  - "site/templates/base.html"
  - "scripts/site-build"
  - ".ai/repo/project/issues/I4544.yaml"
non_scope:
  - "New JSON endpoints: an alternate names an answer that exists"
depends_on:
  - "I4538"
acceptance_criteria:
  - "A case (numbered by scripts/case-numbers next) fetches every /ui and /cockpit route, follows its rel=alternate and gets JSON that answers 200"
  - "/ui/llms.txt and the site's /llms.txt list every route of the registry, and a route added to the registry appears in both with no other edit"
validation:
  - "majordomus plan validate"
  - "scripts/site-build"
evidence_required:
  - "model_readable_case"
created_at: 2026-11-07
updated_at: 2026-11-07
