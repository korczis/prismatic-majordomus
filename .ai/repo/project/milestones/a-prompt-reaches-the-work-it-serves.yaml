risks:
  - "I3408 and I3409 add the first reader of the private prompt archive; I3434, I3432 and I3433 land before I3408 and I3409 so that neither a remote caller nor a snapshot can carry a match"
  - "I3408 waits on I3251, I3409 on I3431 (which waits on I3220), and I3430 on I3412 and I3431; I3406, I3434 and I3432 are wave 0 and need nothing"
  - "lib/capture.sh is edited by I3406, I3411, I3410, I3143, I3303 and I3304; land in depends_on order and merge master between them; if I3304 moves the write path out of lib/capture.sh first, I3406's scope is re-recorded before it starts"
  - "The cause of shared prompt ids (redelivery versus an id a provider reuses on resume) is uncertain; I3406 never deletes a record and writes a known key with different text as a counted collision"
  - "Term matching answers unmatched for a prompt in a language no record uses, which is correct and may read as a miss"
  - "When I3273 lands, its reconciliation of this campaign must classify the segments these records came from as existing; the campaign references in sources are what it reads"
