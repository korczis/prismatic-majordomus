id: the-mesh-is-operated-from-any-device
title: "The owner understands and operates the whole mesh from one page, on any device"
statement: "From a phone, a desktop or a Claude Code session the owner sees which nodes, sessions and tasks are live, what is blocked and why, and performs an authorised action whose result and evidence come back live; the page is a client of the persistent runtime, so closing it or ending a session loses nothing and changes nothing."
invariants:
  - "The page reads only capabilities the runtime already serves; it keeps no registry, scheduler, event bus or identity of its own"
  - "A caller beyond loopback changes nothing it cannot authenticate (ADR 0126)"
  - "Every state shown carries its source and when it was observed; stale is said, never hidden"
  - "A model may propose an operation; only the authorisation path executes it"
non_goals:
  - "A second backend, scheduler or knowledge index beside Majordomus"
  - "A public anonymous control surface"
  - "Pages as a live coordinator; WebRTC as a requirement for control"
  - "An ecosystem-wide federation before one project works end to end"
  - "A public ingress such as a tunnel hostname: a later phase under its own decision"
milestones:
  - "the-mesh-is-operated-from-one-page"
  - "the-hub-is-reached-from-any-device"
  - "the-mesh-is-operated-from-any-device"
satisfaction:
  - id: reads-any-linked-runtime
    criterion: "The UI served on one machine reads a linked runtime the mesh names and says which runtime every reading came from (planned proof: apps/majordomus-cli/tests/ui_linked_runtime.rs (I3191))"
    evidence: command
    ref: "majordomus intent explain the-mesh-is-operated-from-any-device"
  - id: one-authorised-action-end-to-end
    criterion: "One mutating operation started from /ui/mesh is authorised, executed, audited and its result shown live; refused without authentication (planned proof: case_an_operation_from_the_ui_is_audited, numbered with scripts/case-numbers (I3192))"
    evidence: command
    ref: "majordomus intent explain the-mesh-is-operated-from-any-device"
  - id: reachable-privately
    criterion: "The hub's UI, API and MCP answer over the tailnet from a second authorised device and nowhere publicly (planned proof: majordomus served observe of the hub target from a second tailnet device and from outside it, recorded under .ai/repo/evidence (I3195))"
    evidence: command
    ref: "majordomus intent explain the-mesh-is-operated-from-any-device"
  - id: survives-the-client
    criterion: "Ending the session or closing the page loses no persistent work and the next client resumes from a snapshot and cursor (planned proof: case_a_remote_change_reaches_the_page, numbered with scripts/case-numbers (I3181))"
    evidence: command
    ref: "majordomus intent explain the-mesh-is-operated-from-any-device"
