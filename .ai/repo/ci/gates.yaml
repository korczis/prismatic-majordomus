# The CI model of this repository: which validation gates exist, which job runs each, and
# which classes of changed paths can affect which gates. scripts/ci-plan reads this file and
# nothing else to decide what a change must run; .github/workflows/validate.yml is a thin
# adapter over that plan and carries no path list of its own. A path class that is wrong
# here is wrong once, in the one place the tests read (test/cases/94_ci_plan.sh).
#
# Rules the planner applies:
#   - a gate with `always: true` runs in every plan;
#   - a changed path selects the gates of every class whose pattern matches it (the union,
#     never the first match), so an overlap can only widen a plan;
#   - a class whose gates are the word `full` escalates the whole plan;
#   - a changed path that no class matches escalates the whole plan, and the plan names it;
#   - `implies` adds a gate whenever its parent is selected (a full Rust gate includes the
#     registry checks); `requires` names the gate a gate cannot run without (the probe needs
#     the built site), which the planner adds;
#   - the full plan (a master push, the schedule, a dispatch, a pull request labelled ci:full, or the
#     escalations above) selects every gate.
#
# Patterns: `**` crosses directories, `*` does not, a pattern without a wildcard names one
# path. Paths are repository-relative, as `git diff --name-only` prints them.
version: 1

gates:
  - id: shell-lint
    job: structure
    always: true
    runs: scripts/ci/shell-lint
    summary: bash -n over every script, shellcheck over the tool, the scripts and the cases

  - id: ui-check
    job: structure
    always: true
    runs: scripts/ui check
    summary: the static half of UI conformance — every scrolling box this repository writes is reachable from the keyboard

  - id: core-check
    job: structure
    always: true
    runs: scripts/ci/core-check
    summary: doctor, watch, the context documents, the continuity commands, plan validate, the offline GitHub projection, every reference a document makes, the derived site data

  - id: site-basepath
    job: structure
    runs: scripts/site-basepath-check
    summary: the documentation source states no origin-absolute link, so one build serves both the published site and the executable's /docs mount

  - id: shell-suite
    job: suite
    runs: MJ_TEST_JOBS=4 bash test/run.sh
    summary: every behavioural case, in a disposable repository each, four at a time

  - id: rust-integration
    job: rust
    runs: scripts/rust-check --integration
    summary: the executable built, the registry validated, every committed projection current, the benchmark coverage complete

  - id: command-graph
    job: rust
    runs: scripts/ci/command-graph
    summary: the command graph builds without an error, and no workflow file carries a hand-written bridge to either program

  - id: rust-check
    job: rust
    implies: [rust-integration]
    runs: scripts/rust-check --ci
    summary: fmt, clippy with warnings denied, the suites and doc examples, rustdoc, the benchmarks building, the registry checks, the benchmark runner through every transport

  - id: rust-command
    job: structure
    runs: scripts/ci/rust-command-check --strict
    summary: every composed command module asserts, in the file that declares it, that it is what it claims

  - id: rust-coverage
    job: coverage
    runs: just coverage
    summary: line coverage of the crate against scripts/rust-coverage-threshold

  - id: rust-bench
    job: bench
    runs: cargo run --quiet --manifest-path apps/majordomus-cli/Cargo.toml -- bench --profile ci --check --no-write
    summary: the benchmark check against the committed baseline of its platform (macOS, the one platform with a baseline under .ai/repo/benchmarks/rust/)

  - id: web-topology
    job: structure
    runs: cargo run --quiet --manifest-path apps/majordomus-cli/Cargo.toml -- web validate
    summary: the repository's web surfaces resolve into one topology with no collision, no nested claim and no directory outside the generated root

  - id: cockpit-assets
    job: site
    runs: scripts/cockpit-assets --check
    summary: the committed Cockpit stylesheet matches the source it is compiled from

  - id: worktree-topology
    job: structure
    runs: scripts/ci/worktree-check
    summary: the branch-to-worktree rule has one constant in the crate, the pre-commit hook asks the guard and the policy declares it, every document and template names the same container, and the behavioural case passes through the built executable

  - id: cockpit-probe
    job: cockpit
    runs: scripts/cockpit-probe
    summary: every Cockpit route the server serves answered, and the pages and interactions measured in a real browser

  - id: site-build
    job: site
    runs: scripts/site-build && scripts/site-check
    summary: the derived data current, the site built once, every static check over the output

  - id: site-probe
    job: site
    requires: [site-build]
    runs: SITE_PROBE_JOBS=4 scripts/site-probe
    summary: every route at three widths in a real browser, the menu, the dropdown, the theme toggle, the diagrams

  - id: ui-audit
    job: site
    requires: [site-build]
    runs: scripts/ui audit --report
    summary: every discovered page at every width the theme implies, in a browser, against the responsive, semantic, component and WCAG invariants; the report is rendered at /tests/ui

  # The one gate that measures the published site rather than this tree: the advertised
  # install command, run as it is written, against what GitHub Pages and GitHub Releases
  # are serving right now. No class selects it, because no change to a tree can make it
  # true or false — only a deployment can; it runs in the full plan, which is every master
  # push, the weekly schedule, a dispatch and a pull request labelled ci:full. A tagged
  # release proves the same thing in its own smoke phase, at the moment of publication;
  # this is what notices afterwards, when a release was never retried or a deployment
  # regressed and every tree-level gate stayed green.
  - id: installer-live
    job: install
    runs: scripts/ci/install-check
    summary: the install command the project advertises, fetched and run from the published site, installing the published release on this runner

  - id: macos
    job: macos
    runs: MJ_TEST_JOBS=3 bash test/run.sh && cargo test --no-fail-fast --manifest-path apps/majordomus-cli/Cargo.toml
    summary: the behavioural suite under the stock macOS shell and userland, and the crate's suites on macOS

classes:
  # the pipeline itself: a change here can only be validated by running everything
  - id: ci
    paths: [.github/workflows/**, .github/actions/**, scripts/ci/**, scripts/ci-plan, scripts/ci-baseline, .ai/repo/ci/**, test/run.sh, test/lib.sh, justfile, .just/**]
    gates: full

  # the Rust executable: its crate, its gate script, its coverage floor, its benchmark baseline
  - id: rust
    paths: [apps/majordomus-cli/**, scripts/ci/rust-command-check, scripts/rust-check, scripts/rust-coverage-threshold, .ai/repo/benchmarks/rust/**]
    gates: [rust-check, rust-command, rust-coverage, rust-bench, command-graph, shell-suite, macos, cockpit-probe, worktree-topology]

  # projections of the registry and the policy: generate --check decides whether they are
  # current, and their content is read by the site and by the suite
  - id: rust-generated
    paths: [docs/generated/**, site/data/registry/**, share/allow/**, AGENTS.md, CLAUDE.md]
    gates: [rust-integration, shell-suite, site-build, site-probe]

  # the Cockpit's own assets: its stylesheet source, its compiled stylesheet, its scripts.
  # Read from disk by the served executable, so the crate's suites see them; the compiled
  # stylesheet is a generated artifact, and cockpit-assets --check is what proves it current.
  # Declared before `share` so a reader sees the narrower rule first; the planner takes the
  # union of every matching class, so both apply.
  - id: cockpit
    paths: [share/cockpit/**, scripts/cockpit-assets, scripts/cockpit-probe, scripts/lib/cockpit-probe.mjs]
    gates: [cockpit-assets, cockpit-probe, rust-check, site-build]

  # the distribution: the skeleton, the schemas, the kinds, the command and event registries;
  # read by both implementations at run time, embedded in the crate at build, and inputs of
  # the site generator
  - id: share
    paths: [share/**]
    gates: [rust-check, rust-coverage, rust-bench, command-graph, shell-suite, site-build, site-probe, macos, worktree-topology, ui-audit]

  # the shell tool, its cases and fixtures, the hooks, and the scripts written against lib/
  - id: shell
    paths: [bin/**, lib/**, test/**, .githooks/**, .envrc, scripts/generate-site-data, scripts/github-sync, scripts/rules-package, scripts/lib/**]
    gates: [shell-suite, rust-integration, command-graph, site-build, site-probe, macos, worktree-topology, ui-audit]

  # this repository's own AI layer: policy, profiles, rules, prompts, workflows, plan, knowledge,
  # ADRs; objects of the index the registry dataset is derived from, inputs of the site
  - id: layer
    paths: [.ai/**]
    gates: [shell-suite, rust-integration, site-build, site-probe, worktree-topology, ui-audit]

  # documents and the files the site generator reads at the root; documents are index objects
  - id: docs
    paths: [docs/**, README.md, CONTRIBUTING.md, SECURITY.md, LICENSE, examples/**]
    gates: [shell-suite, rust-integration, site-build, site-probe, worktree-topology, ui-audit]

  # the site: templates, assets, styles, scripts, its build dependencies and its scripts
  - id: site
    paths: [site/**, assets/**, package.json, package-lock.json, .nojekyll, scripts/site-build, scripts/site-check, scripts/site-basepath-check, scripts/site-probe, scripts/site-serve, scripts/ui, scripts/lib/ui-*.mjs]
    gates: [shell-suite, site-basepath, site-build, site-probe, ui-audit]

  # the release pipeline's own scripts: they pack, verify and record what a tag publishes,
  # and they ask the executable for every name they use, so the crate's registry checks and
  # the behavioural cases are what decide whether they still work
  - id: distribution
    paths: [scripts/release-package, scripts/release-verify, scripts/release-version, scripts/release-record, scripts/release-fixture]
    gates: [shell-suite, rust-integration, macos]

  # the MCP client configurations and the launcher they name; case 90 reads them
  - id: clients
    paths: [.mcp.json, .codex/**, .gemini/**]
    gates: [shell-suite]

  # nothing a gate reads
  - id: inert
    paths: [.gitignore, .editorconfig, .github/ISSUE_TEMPLATE/**, .github/pull_request_template.md]
    gates: []
