non_scope:
  - "`majordomus ui`: that is I2231, gated on I2131 and I2153, and I2131's record may decide against the command"
  - "The Cockpit's areas, the intents on the Overview and the intent page on a phone: I2232, I2234 and I2225"
  - "`observed_at` on every capability that reports state and parity of every capability across the command line, HTTP and MCP: I2149 and I2150 (runtime pack, session 1b)"
  - "A second push channel, server-sent events or a client-side scheduler beside the one WebSocket"
  - "A delivery report, a release analysis or an evidence judgement asked by the Overview: its sources stay the cheap ones (dashboard.rs:31-33)"
  - "Exposing `prs drain`, `prs repair` or `release bump` over MCP or HTTP: the list of capabilities that write the repository grows one deliberate line at a time (capability/builtin/mod.rs:319-326)"
  - "The phone drawer and its tests: branch feature/cockpit-mobile-navigation"
acceptance_criteria:
  - "The Overview shows the queue by disposition, the required verdict and the proof of the last release, each card naming the capability, the input and the pointer it read, and each source asked once"
  - "Every card and every delivery answer carries the observation of its own source; one older than that source's bound is reported stale on all four surfaces and never as ok"
  - "A line appended to the integration trail reaches a subscribed page over `/events`, a reconnect replays the gap by cursor, and a subscriber too far behind is told to resynchronise"
  - "A command capability with no declared key is announced as not repeatable on every surface, and one that declares a dry run is proved to move nothing by it"
  - "One fixture asserts equal ids, order and status for the queue, the verdict, a run and the release proof on the command line, HTTP, MCP and the Cockpit, and a surface made to differ fails it by name"
validation:
