non_scope:
  - "Removing or narrowing the machine-wide derive lock: rule project.one-derive-at-a-time and PR #855 stay; every derive, incremental or not, takes the lock, and the gap file on A05.2 records that splitting it by key without a bound recreates the load-57 contention the lock fixed"
  - "Running independent generators in parallel inside one derive: not planned until I2311's records show which stage dominates and at what load"
  - "Re-deriving in the Pages build instead of refusing a stale tree: refused for reasons milestone derived-data-integrity records"
  - "What the site's input fingerprint covers and where the staleness refusal runs: milestone derived-data-integrity, I1409"
  - "Cutting case 95 or the suite's sharding: I2115 on origin/rescue/d1/chore/the-ci-critical-path-is-planned and the branch origin/fix/the-suite-is-dealt-from-measured-seconds"
  - "The warm, partial and cold baseline of the required check and its sub-minute target: milestone ci-critical-path"
  - "Reusing a CI verdict across runs: a skip is recorded and bound here, and no verdict is carried from one run to another"
  - "A cache shared between worktrees, machines or CI runs: a derive record lives under the checkout's own `.ai/local/` and is never tracked (rule project.cache-is-invisible)"
acceptance_criteria:
  - "Every artifact of the manifest and every output of stage B names its inputs as data, and a generator that reads an undeclared tracked input is refused by a case"
  - "A derive with nothing changed runs no stage, says so, and leaves the tree byte for byte as it was; a missing or corrupt record causes a full derive"
  - "After one canonical change a derive regenerates only what reads it, and the tree equals what a full derive writes from the same inputs under reordered inputs, a rename, an interruption and a poisoned record"
  - "Every derive still takes the machine lock, and case 1018 passes unchanged"
  - "Derive has a budget per scenario set from recorded samples, and a regression names the stage that moved"
  - "A gate a CI run did not run is recorded with the hash of the inputs that would have selected it, and a suite case that declares its reads is left out only by a plan that names why"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh 1054_a_derive_with_nothing_changed_generates_nothing"
  - "MJ_TEST_JOBS=4 bash test/run.sh 1055_an_incremental_derive_equals_a_full_one"
  - "MJ_TEST_JOBS=4 bash test/run.sh 1056_derive_has_a_measured_budget"
  - "MJ_TEST_JOBS=4 bash test/run.sh 1018_one_derive_at_a_time_and_no_orphans"
  - "scripts/derive-check"
evidence_required:
  - "inputs_declared_per_artifact"
  - "noop_derive_generates_nothing"
  - "incremental_equals_full"
  - "derive_budget_measured"
depends_on: []
risks:
  - "Narrowing what a change regenerates is silent in the dangerous direction: an undeclared input makes an artifact stale while the derive reports success. The full derive stays the authority, every incremental path carries a bypass, and the equivalence case is the gate, not a review."
  - "Generated content depends on the machine (a `%h` abbreviation against the local object store, a shallow history, the environment, per I1409), so a record keyed on file digests alone would serve bytes a clean derive elsewhere does not write. Non-file inputs - git history, the executable's generation, the use-case scenarios run, the declared environment - are part of every key."
  - "The equivalence proof costs full generations, and case 95 already shows what a case that regenerates repeatedly costs on a runner; the driver's logic is proved over stand-in generators as case 400 does, and the real generators are run as few times as the proof needs."
  - "A skip of a derive is a mutating command reading recorded state, which rule project.cache-is-invisible version 1 forbids; the rule is amended by its own new version under an ADR before any derive skips, or nothing skips."
