id: I1518
milestone: work-graph-github
title: The project model names its milestones in one vocabulary
slug: one-milestone-vocabulary
priority: p2
profile: implementation
parallel_safe: false
objective: "Give every milestone an identity of the same kind, so that a person reading the plan, an issue's milestone field and a GitHub milestone title sees one naming scheme rather than two."
why: "The model carries two vocabularies side by side: five milestones are named M000..M004 and fifteen are named by slug (foundation, work-graph-github, fly-deployment, ...). Measured on 2026-09-15: 66 of 215 issues point at the M-form and 149 at slugs. The split is an accident of when each milestone was written, not a distinction the model makes, and it costs a reader the question 'is M004 a different kind of thing from capability-graph?' every time."
current_state: "M000..M004 and 15 slugs coexist. Nothing enforces either form."
desired_state: "One vocabulary, chosen deliberately and enforced by a gate, with every issue's milestone field and every GitHub milestone title following it."
scope:
  - .ai/repo/project/milestones
  - .ai/repo/project/issues
  - test/cases
non_scope:
  - The adapter's identity handling, which is I1517 and must land first.
depends_on:
  - I1517
acceptance_criteria:
  - Every milestone id matches one declared form, and a gate refuses one that does not
  - Every issue's milestone field names an existing milestone in that form
  - The rename reaches GitHub as a rename, not as a second milestone
validation:
  - bash scripts/ci/github-check
  - bash test/run.sh
evidence_required:
  - one_vocabulary_is_enforced
risk: "Renaming a milestone changes its GitHub title. While the adapter matches milestones by title — which is what I1517 fixes — a rename does not rename anything: it creates a duplicate and leaves 66 issues pointing at an orphan. This issue is therefore blocked on I1517 and must not be attempted first."
created_at: 2026-09-15
updated_at: 2026-09-15
