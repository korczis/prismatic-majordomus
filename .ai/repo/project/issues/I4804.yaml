id: I4804
milestone: a-second-adopter-is-served
title: "init adopts a repository on a new canonical worktree branch, never in a dirty primary checkout, and carries a personal layer's tracked half across"
slug: init-adopts-on-a-worktree-branch
priority: p2
profile: implementation
parallel_safe: true
objective: "`majordomus init --worktree <branch> [--from <ref>] [--extend]` works in an unsupervised repository too. It creates the canonical worktree `<repository>-wt/<branch>` from the remote trunk as last fetched, or from `--from` when the remote cannot be reached, runs init (or init --extend) and update inside it, and leaves the primary checkout byte-identical. When the primary checkout holds a personal or untracked layer, its `.ai/repo/` is copied into the new worktree as the shared layer's starting content, `.ai/local/` is never copied, and the command lists what it carried. It refuses (15) when another session holds an active task in any worktree of the repository, naming the task and its session, unless `--beside <task>` records that the owner allowed it."
why: "Observed on 2026-11-25 while 17 unsupervised repositories of one adopter workspace were adopted on branches with a pull request each (the owner's choice: a shared layer, delivered for review, nothing merged). Four primary checkouts were dirty (28, 51, 52 and 151 files), so init in place would have mixed the layer with someone's work in progress. `majordomus worktree create` exists only once a layer exists, so every adopting agent rebuilt the `<repository>-wt/<branch>` convention by hand with `git worktree add`. One repository had an untracked layer in its primary checkout. Its tracked half had to be carried to the branch by hand, with the instruction never to touch .ai/local. In another repository a peer held an active task, and nothing refused the new worktree."
current_state: "Measured at origin/master 46775282570 on 2026-11-25. init writes into the checkout it runs in; `--personal` covers the layer in info/exclude and `--shared` removes the cover (I2491). `worktree create` (I4002) needs the repository's layer to derive the path and the branch's home. No command starts a layer on a branch away from the primary checkout, and init does not look for other sessions' tasks."
desired_state: "A repository is adopted as reviewable work on a branch in its canonical worktree, whatever state the primary checkout is in, with the personal layer's content carried over and other sessions' tasks respected."
scope:
  - "lib/init.sh"
  - "lib/worktree.sh"
  - "docs/CLI.md"
  - "test/cases/4804_init_adopts_on_a_worktree_branch.sh"
non_scope:
  - "Pushing the branch or opening the pull request: the adopter's forge flow"
  - "Surveying a workspace: I4803"
  - "Personal and shared covers: I2491"
depends_on: []
acceptance_criteria:
  - "Case 4804: a fixture repository with no layer and a dirty primary checkout gets `<repo>-wt/<branch>` with a layer that `doctor` reads clean, and the primary's `git status --porcelain --untracked-files=all` is byte-identical before and after"
  - "A fixture whose primary checkout holds an untracked `.ai/` gets the branch's `.ai/repo/` equal to it and no file under `.ai/local/`, and the command lists the carried paths"
  - "A fixture with an active task in a linked worktree is refused with exit 15 naming the task and session; `--beside <task>` proceeds and records the permission in the new layer's decisions"
  - "Negative control: with the task lookup removed, the case finds the busy repository adopted without a refusal"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=2 bash test/run.sh 4804_init_adopts_on_a_worktree_branch"
evidence_required:
  - "init_adopts_on_a_worktree_branch"
serves: []
created_at: 2026-11-25
