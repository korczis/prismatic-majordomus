id: I2341
milestone: the-queue-drains-until-settled
title: "A drain is settled when every pull request in scope is merged, closed on proof or blocked with a reason, and it reports each one"
slug: settled-is-a-contract
priority: p1
profile: implementation
parallel_safe: true
objective: "Define settled: every in-scope pull request is merged, provably superseded or closed under policy, or explicitly blocked on something external with every automatic option exhausted; and report the counts and one explanation per pull request, never a false all-done."
why: "A drain that exits when nothing is ready reports the same exit as a drain with nothing left to do. The owner cannot tell an empty queue from a stuck one without reading the queue, which is the reading the command was meant to replace. Source: autopilot prompts/04-pr-drain.md Issue 5 'Queue convergence contract'."
current_state: "A drain exits when no pull request is ready, with exit 10 when it merged nothing and says why; prs status lists each pull request with its disposition and reasons. There is no state that means the queue is settled and no final report."
desired_state: "Settled is a predicate over the queue and the run, declared in one place and shown by prs status and the run's status. The until-settled mode ends as satisfied only when it holds with nothing blocked, and as blocked when it holds with at least one external blocker. The final report is derived from the trail: counts by outcome and, for each pull request, what happened or what it waits on and what was tried."
scope:
  - "apps/majordomus-cli/src/integration/drain.rs"
  - "apps/majordomus-cli/src/integration/model.rs"
  - "apps/majordomus-cli/src/capability/builtin/integration.rs"
  - "docs/INTEGRATION.md"
non_scope:
  - "Closing a pull request to make the predicate true. Closure follows cleanup's existing proof."
depends_on:
  - I2337
  - I2330
acceptance_criteria:
  - "The run ends as satisfied only when every in-scope pull request is merged or closed on proof"
  - "A queue with one pull request waiting on an external check ends as blocked, and the report names the check and the attempts made"
  - "The report's counts equal the trail's, and every in-scope pull request appears in it once"
  - "A drain that stops for any other reason does not report settled"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --test integration_executor"
  - "cargo test --test integration_trail"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the cases this issue adds>"
evidence_required:
  - "settled_report_case"
  - "blocked_is_not_settled_case"
created_at: 2026-10-10
updated_at: 2026-10-10
