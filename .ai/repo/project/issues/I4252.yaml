parallel_safe: true
objective: "Blocks for pyproject.toml (Python), package.json (Node) and go.mod (Go) are seeded when their marker is at the root, and the message names every marker it looked for."
why: "An adopter's field report (a private Python client repository adopted from the v1.0.0-alpha.8 release on 2026-10-27, with the plan model, project rules, knowledge, skills, Claude Code capture and a GitHub projection all in use) found: `init` printed 'no stack recognised at the root (looked for mix.exs, Cargo.toml)' for a repository with pyproject.toml, so its scope carried no virtual-environment, cache or lock-file entries."
current_state: "share/skeleton/ai/repo/scope.yaml carries stack blocks for mix.exs and Cargo.toml only."
desired_state: "Blocks for pyproject.toml (Python), package.json (Node) and go.mod (Go) are seeded when their marker is at the root, and the message names every marker it looked for."
