id: I4355
milestone: ci-critical-path
title: "A machine announces its own disk emergency on the mesh and names who holds the build lock"
slug: a-machine-announces-its-disk-emergency
priority: p1
profile: implementation
parallel_safe: true
objective: "A watcher, `scripts/reap-orphans --watch`, run every 60 s by a launchd agent or systemd user timer the mesh enrolment installs, publishes an advisory claim machine/<id>/disk while free space is below 35 GiB and withdraws it at 40 GiB or more; below 10 GiB it lists the holders of debug/.cargo-build-lock (pid, worktree, age) and lib/rust_bin.sh refuses admission with reason disk_emergency. The watcher deletes nothing. Clause 7 of the cooperation rule stops saying the limit is owed and names the cases that hold it."
why: "Incident 5 of 2026-10-28: the 641b Mac fell to 0-3 GiB free twice (17:32Z and 21:34Z) while several sessions kept building, and none of them learnt the machine was in trouble until its own build failed; the board carried nothing about the disk. The cooperation rule's clause 7 sets 35 GiB as a seat's operating number and says that holding it in code is owed (I3825)."
current_state: "Measured at 81ef931a3e1: .ai/repo/rules/project/the-cooperation-model-is-the-owners-word.v2.md line 163 says holding 35 GiB and five builders in code is owed (I3825); scripts/reap-orphans has no watch mode; no mesh claim is ever published for a machine's disk."
desired_state: "A machine below 35 GiB carries machine/<id>/disk on the mesh, withdrawn at 40 GiB; below 10 GiB the claim names the lock's holders and new builds are refused with disk_emergency; the mesh doctor reports a missing watcher where the mesh is enabled. Enforced by case 4355, the doctor check and the rule's text cases 3824 and 3150."
