id: I3249
milestone: an-unmet-criterion-is-drafted-into-work
title: "A replan is bounded: past a declared budget of drafts without measurable progress it ends in a named state a person resolves"
slug: a-replan-is-bounded
priority: p2
profile: implementation
objective: "Declare in .ai/repo/policy.yaml a replan budget (drafts per intent revision without a newly satisfied criterion); intents.draft_plan reports `human_needed` with the criteria that did not move once the budget is spent, and drafts nothing further."
why: "Autonomy without termination is an unbounded loop (2026-10-08, 2026-10-11, 2026-10-16); the proposed ADR 'Replanning is bounded, idempotent and never weakens its intent' needs one mechanism, not a runtime. Proposed in ADR 0192 (Replanning is bounded, idempotent and never weakens its intent) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c221#2, chatgpt-majordomus:c270#4."
current_state: "No replan exists; nothing counts drafts per intent."
desired_state: "Progress is measured from the verdicts at each draft's commit, read from the ledger; the bound is policy data."
scope:
  - ".ai/repo/policy.yaml"
  - "share/schemas/majordomus/policy"
  - "apps/majordomus-cli/src/policy.rs"
  - "apps/majordomus-cli/src/intent_plan.rs"
  - "apps/majordomus-cli/src/evidence/ledger.rs"
  - "apps/majordomus-cli/src/capability/builtin/intents.rs"
  - "apps/majordomus-cli/tests/intent_plan.rs"
depends_on:
  - "I3247"
acceptance_criteria:
  - "The budget+1th draft with no newly satisfied criterion returns human_needed naming the stuck criteria"
  - "A draft after a criterion moved resets the count"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
evidence_required:
  - "test_a_replan_is_bounded"
created_at: 2026-10-18
updated_at: 2026-10-18
