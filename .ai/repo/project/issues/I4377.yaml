id: I4377
milestone: one-kit-on-every-surface
title: "Every graph and chart reads at a glance and answers the hand, in one visual and interaction language"
slug: the-graphs-read-at-a-glance-and-answer-a-hand
priority: p1
profile: implementation
parallel_safe: true
objective: "The five graph components (site/charts.js on ECharts; site/graph.js, share/cockpit/graph.js, share/cockpit/trains.js and share/ui/ui.js on Cytoscape) follow one language: colour by role from the --mj-* tokens only (series in declared order, at most six categorical series, state in its status role with its word), derived fills, gridlines and gradients by color-mix over tokens resolved by the browser, one token-styled HTML tooltip card, HTML legend chips that filter and preview, hover and selection that light a neighbourhood and dim the rest, search with a live count for relation graphs, zoom-out, zoom-in and fit controls with bounds, keyboard operation with visible focus, and no motion under prefers-reduced-motion, in light and dark."
why: "The owner, 2026-10-29: \"udelej grafy fakt sexy, moderni, interaktivni\" (make the graphs really attractive, modern and interactive). The five components each drew in their own way: different dimming opacities, canvas-only legends a keyboard could not reach, chart colours re-dealt after a filter, wheel zoom that captured page scroll on reading surfaces, and no common tooltip, search or fit control. ADR 0135 (library roles) and ADR 0152 (a chart is a second view of its table) already decide what draws what; what was missing was one look and one interaction model."
current_state: "On master 5370ee63d19 each component styles and handles input on its own; legends on the Cockpit and UI canvases are partly drawn in the canvas; charts have no legend filter and a tooltip of ECharts' default style. The chart component itself (site/charts.js and its .mj-chart rules in share/design/figure.css) is carried by I4400 on master (192f5816c15, b17f0f2ebab): a crosshair, one exact tooltip, series a reader hides and a zoomable range, from the design's tokens; this issue keeps master's chart and delivers the four Cytoscape components."
desired_state: "The five components share the language above; the legend, the zoom and fit group and the search field are HTML controls the interaction probe drives (scripts/lib/interaction-specs/graph.mjs claims them); a plain wheel scrolls the page on reading surfaces and Ctrl/Cmd+wheel or a pinch zooms, while the Cockpit's application frames keep wheel zoom; docs/DIAGRAMS.md and docs/UI.md say how a reader uses them."
scope:
  - ".ai/repo/project/issues/I4377.yaml"
  - "site/charts.js"
  - "site/graph.js"
  - "site/templates/partials/graph.html"
  - "share/cockpit/graph.js"
