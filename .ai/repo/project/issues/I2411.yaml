id: I2411
milestone: the-mesh-works-out-of-the-box
title: "A server whose mesh is enabled is reachable on the tailnet and the LAN, and only by a trusted peer"
slug: a-mesh-server-is-reachable-by-its-peers
priority: p0
profile: implementation
parallel_safe: false
objective: "On a machine the repository enrolled in its mesh (the trunk commits an enabled declaration whose trust.allow lists this machine's key), every server a session starts binds every interface when no flag and no MAJORDOMUS_HTTP_HOST names one, so a trusted peer can dial it by multicast, through a hub and over the tailnet, while a request from a non-loopback address stays limited to what ADR 0126 allows; the tailnet route also asks the primary checkout's port; and a read of the mesh is answered in a checkout with no build of its generation (ADR 0234)."
why: "The server binds 127.0.0.1 unless --host or MAJORDOMUS_HTTP_HOST says otherwise and advertises only loopback, so two machines on default settings can never dial each other. On 2026-11-22 the owner's four machines (both MacBook Pros, the iMac, lundra, all on 1.2.0) were linked only because a person had started `majordomus serve --host 0.0.0.0 --port 8791 --idle 0` by hand in a prismatic-majordomus-hub checkout on each; MAJORDOMUS_HTTP_HOST was set on none of them. In the primary checkout bin/majordomus refused every mesh read because the tree's executable was missing and the installed release was not of the tree's generation (ADR 0224)."
current_state: "Measured at origin/master 636acc8c845 on 2026-11-22: cli::resolve_checkout_http_host binds MAJORDOMUS_HTTP_HOST or loopback; the remote-caller restrictions (ADR 0126) and the local-only mesh reads (ADR 0220 decision 4) are on master; mesh::tailscale asks every online peer on tailscale.port (8791) only; lib/rust_bin.sh mj_rust_resolve refuses every command alike when neither the tree's executable, a release of its generation, nor a sibling worktree's executable can answer."
desired_state: "cli::resolve_node_http_host binds 0.0.0.0 on an enrolled machine when nothing else names an interface, in the primary checkout and in a linked worktree, says so naming the opt-out, and server.status reports it as desired.host; MAJORDOMUS_HTTP_HOST=127.0.0.1 and a flag still win; an unlisted, uncommitted or disabled declaration keeps loopback; the tailnet route asks 8791 and 8741; a mesh query is answered by the installed release of another generation, said on stderr, and every other command is refused as before."
