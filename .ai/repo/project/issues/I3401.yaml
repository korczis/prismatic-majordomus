acceptance_criteria:
  - "Precondition: majordomus intent preflight for this issue passes from a branch of master that holds I3400"
  - "Over the command line, over MCP and over HTTP POST /api/v1/intents/propose (the Served helper in tests/common), a two-paragraph statement, a statement opening with '# ', one holding a '- ' list item, a table row, a fence or a block quote, and a one-paragraph statement over the bound are each answered with error code invalid_input. The listing of .ai/repo/project/intents is byte-identical before and after each call"
  - "The message contains majordomus://skill/decompose-a-brief, the canonical text's byte length and sha256: followed by the digest of the trimmed statement plus one line feed; the test computes that digest independently and compares it, including for a statement given with leading and trailing whitespace"
  - "A one-paragraph statement with several sentences and non-ASCII letters within the bound is written as before, and every existing assertion of case 2978 still passes"
  - "The brief test is a pure function with a doctest for each block form, for a long single line within the bound (not a brief), for one over the bound, and for an indented continuation line inside one paragraph"
  - "A test reads every tracked intent under .ai/repo/project/intents and asserts its statement is within the bound, so the constant stays pinned by what it measures"
  - "The test the_capabilities_that_write_the_repository_are_these in apps/majordomus-cli/src/capability/builtin/mod.rs is unchanged and passes"
  - "ADR 0144's Decision states the refusal and the bound with the command that measured it, its Alternatives say why a decomposition the worker drafts under a critique and plan validate differs from the rejected model-guessed plan, and majordomus adr check passes"
  - "majordomus generate --check is clean"
