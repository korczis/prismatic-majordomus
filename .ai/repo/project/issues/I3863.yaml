id: I3863
milestone: public-proof
title: "An article explains in both languages what proves a rule, and where that proof stops"
slug: a-rule-is-proven-by-what-it-refuses
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/a-rule-is-proven-by-what-it-refuses.md, an English article on what Majordomus accepts as proof that a rule is enforced. It covers the badge the proof graph replaced, the three enforcement modes of ADR 0048 and the reason a review must give, what scripts/ci/rule-proof-check decides (dangling and unproven, the class that is not an exemption, the one vendored exemption), the ten states of the rules module and the three that never collapse, the floor the gate's own guarantee names, the shell floor that case 08 named and case 3480 now reads, and the refusal that ADR 0188 and the intent a-claim-stands-only-on-its-evidence ask for, with I3110, I3111 and I3112. Its time-bound statements are dated. Every statement is one that an ADR, a rule, a guarantee, an issue, the rules module, the gate or a case on master states, and no count is typed by hand. site/content-src/pravidlo-se-dokazuje-odmitnutim.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the proof-carrying documentation, silence and automation articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. Whether a blocking rule is really enforced is the question the owner's intent a-claim-stands-only-on-its-evidence asks, and no article tells a reader what the repository counts as proof of a rule today, or where that proof stops."
current_state: "No article explains how a rule is proven. The article groups relate each other, and none of them names it."
desired_state: "/a-rule-is-proven-by-what-it-refuses/ and /pravidlo-se-dokazuje-odmitnutim/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 and check 19 pass, with the translation at its source's digest."
