id: every-model-call-is-paid-from-a-declared-source
title: "Every model call Majordomus makes or starts is paid from a funding source the vendor declared and the owner holds, routed by policy and never guessed"
slug: every-model-call-is-paid-from-a-declared-source
order: 512
priority: p2
problem: "The model catalogue (share/models.yaml, ADR 0049) knows a vendor's credential variable and nothing about how a call through it is paid. A Claude Max plan now includes a recurring monthly API credit grant the owner claims in the vendor's console, so the same owner holds a subscription seat (Claude Code), a credit grant and possibly metered billing on one vendor, and nothing says which of them an advisor, a benchmark arm or an execution draws on. share/advisors.yaml reaches OpenAI through its API credential but has no Anthropic API advisor at all, so a held Anthropic credit grant funds nothing Majordomus does. I3292 gives the usage record a billing_mode declared by the person; this milestone generalises that one field into declared, per-vendor funding sources that routing reads."
outcome: "A vendor's funding sources are declared once with dated evidence, the owner's holdings stay local, routing names the source each call would draw on as an inference with its basis, the owner is told a held source no credential reaches with the vendor's claim link, and spend against a source is observed from a vendor seam or recorded absent with its reason."
current_state: "share/models.yaml declares credential_env per vendor and no funding source; share/advisors.yaml has no Anthropic API advisor; I3292 plans billing_mode on the usage record, declared by the person; ADR 0213 keeps reported, estimated and billed amounts apart."
desired_state: "Every criterion of the intent is carried by an issue here and proven by its test."
acceptance_criteria:
  - "share/models.yaml declares each vendor's funding sources with kind, credential variable, renewal period, claim link and dated evidence, and the schema refuses a source without evidence"
  - "The owner's holdings and caps are read from .ai/local or the environment and appear in no generated or projected file"
  - "models.route names the funding source a route would draw on, labelled inferred with its basis, in the repository's declared source order"
  - "share/advisors.yaml declares an Anthropic API advisor reached through the vendor's credential"
  - "doctor and the brief name a held source no credential reaches, with the vendor's claim link and its evidence date"
  - "The economics runner and executions record the funding source each run drew on beside its usage record"
  - "Spend against a source is observed from a named vendor seam or recorded absent with its reason; no remaining-credit figure is derived from tokens and a price"
  - "A run that would draw on a metered source while a credit grant is held, or cross a declared cap, is told so and refused only where policy declares refuse"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
evidence_required: []
created_at: 2026-10-20
updated_at: 2026-10-20
