id: I4536
milestone: one-frame-one-kit-one-library-per-job
serves:
  - "one-kit-on-every-surface#flowbite-js-drives-behaviour"
title: "Flowbite JS, vendored from npm 4.0.2 and CSP-checked, drives collapse, dropdown, modal, drawer, tabs and tooltip on every surface"
slug: flowbite-js-drives-behaviour
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S2 of milestone one-frame-one-kit-one-library-per-job. Vendor Flowbite JS from the npm flowbite 4.0.2 package.json already pins, built by scripts/cockpit-assets and scripts/site-build into the served tree and checked against the /ui and /cockpit CSP. Delete the collapse and dropdown of site/nav.js; move tabs, modal, drawer and tooltip (site/kit.js, site/search.js, the Cockpit palette, the graph detail panes) onto Flowbite's data attributes and its initialisers, re-run after a fragment swap. ADR 0230 (Flowbite Pro is adapted onto Tailwind 4) is proposed; this slice builds on it and asks the owner to accept it through the ADR process. The owner's order of 2026-11-07 does not name ADR 0230 and is not read as accepting it. Initialise per fragment: Flowbite's initDropdowns and its siblings construct a new instance for every matching element of the whole document, and the constructor binds listeners before the instance registry refuses a duplicate (node_modules/flowbite/dist/flowbite.js:6804-6820, 7026, 8336-8345), so re-running initFlowbite after a swap binds every existing toggle twice; a swapped fragment's elements are instantiated alone through the component constructors. Flowbite's Dropdown and Collapse have no Escape handling or focus return (only Drawer, Modal and Tooltip handle Escape, flowbite.js:6455, 7375, 8173), which site/nav.js:5-8 does today; the keyboard behaviour is kept by a core extension that drives Flowbite's instance API, never by reading the data attributes. The tab half of I3793 (one tab control on every surface) is delivered here as Flowbite tabs; I3793 keeps the copy control."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). Flowbite is used as CSS only, so every interactive control is hand-written, and the design kit judge's S3 signal refuses a script that reads the kit's data attributes itself."
current_state: "Measured on master on 2026-11-07: package.json pins flowbite 4.0.2 and tailwindcss 4.1.14; no page loads Flowbite JS; site/nav.js (77 lines) re-implements collapse and dropdown and is byte-copied to share/ui/nav.js and share/cockpit/nav.js; tabs, modal, drawer and tooltip are hand-written in site/kit.js (134 lines), site/search.js (277 lines), share/cockpit/palette.js and the graph scripts. ADR 0230 reads status: proposed."
desired_state: "One vendored flowbite.min.js is served on /ui, /cockpit and the site and initialised through share/design/js/core; nav.js holds no collapse or dropdown code; no hand-written tabs, modal, drawer or tooltip remains; majordomus design kit --check reports zero S3 findings."
