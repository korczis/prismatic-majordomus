  - "Through a served fixture, submitting the UI's form for executions.demonstrate starts an execution whose id the answer names and whose inspector on the UI answers 200"
  - "The form of a capability whose effect changes the repository carries the confirmation the Cockpit's carries, and the form of a query does not"
  - "A capability whose stability is not executable, or that has no HTTP exposure, shows that reason and no control"
  - "POST to /ui and to /ui/capabilities answers 405"
  - "A page of the snapshot written by majordomus web report ui-snapshot holds no form that posts"
  - "With no script the inspector shows the command line and the API route of the capability and no button"
