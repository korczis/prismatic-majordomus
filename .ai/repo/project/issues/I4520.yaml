  - "Case 4520: an MJ_* variable the caller exported reaches the verify command with the caller's value, and MJ_FINISH_OUTCOME does not"
  - "Case 4520: under a launcher that exports MAJORDOMUS_LAUNCHER, as the installed one does, the verify command does not see it"
validation:
