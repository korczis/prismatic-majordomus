id: a-test-fails-when-the-code-is-wrong
title: "The suites that guard critical predicates are shown to fail when those predicates are wrong"
slug: a-test-fails-when-the-code-is-wrong
order: 160
priority: p2
problem: "docs/COVERAGE.md (\"What this is not, yet\") states that coverage proves a line ran, not that a test would fail if the line were wrong. No mutation run exists (no cargo-mutants anywhere in the tree), and the release compatibility analyzer (src/release/compat.rs, 33 tests) has no property test, while 8 other modules use proptest. Proposed in ADR 0190 (Mutation testing is scheduled evidence over declared critical predicates, never a gate on every change) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c113#16, chatgpt-majordomus:c139#5, chatgpt-majordomus:c158#10, chatgpt-majordomus:c158#20, chatgpt-majordomus:c293#2, chatgpt-majordomus:c111#6."
outcome: "Declared critical predicates carry a scheduled mutation run with published survivors, and the compatibility analyzer's algebraic invariants are property tests."
current_state: "Verified on master 707a04c on 2026-10-18. proptest is a dev-dependency (Cargo.toml:87), used in mesh/cooperation, mesh/journal, mesh/protocol, mesh/state, deploy, served, integration and economics/stats. There is no mutation tooling."
desired_state: "I3120 and I3121 land. docs/COVERAGE.md names which subsystems are mutation-tested and how often."
scope:
  - "apps/majordomus-cli/src/release/compat.rs"
  - ".github/workflows"
  - ".ai/repo/ci/gates.yaml"
  - "docs/COVERAGE.md"
non_scope:
  - "A blocking mutation gate on every pull request"
  - "Mutation of shell libraries"
acceptance_criteria:
  - "A mutation run over the declared critical modules is recorded on a named revision and its survivors are listed"
  - "Compatibility properties hold under proptest in the lib suite"
validation:
  - "majordomus plan validate"
evidence_required: []
risks:
  - "A mutation run is expensive on the one-at-a-time CI pool (memory: ci-pool-runs-one-validate-at-a-time); schedule it outside the validate pool or offload it."
created_at: 2026-10-18
updated_at: 2026-10-18
