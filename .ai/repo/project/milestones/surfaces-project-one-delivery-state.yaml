  - "trail_over_the_one_channel"
  - "surface_contract_test"
depends_on:
  - "delivery-is-explained-by-evidence"
risks:
  - "Adding a delivery or release analysis to the Overview breaks its cost rule; a fact with no cheap source is left out and said to be, never computed in the card."
  - "Projecting a run before the typed run model exists would make the Cockpit page the model; the run card waits for the capability that folds the trail (I2324)."
  - "The command line is declared twice by design (capability/closure.rs:7-9), so a capability added late reaches it only after an edit of cli.rs; the fixture reads the generic `majordomus run` path where no dedicated command exists."
  - "I2149 and I2150 are on an unlanded branch and touch the same answers and the same parity test; whichever lands second builds on the other's shape, and a second observation type or a second parity harness is the defect to avoid."
  - "I2231 may be decided against by I2131; nothing here may assume the `ui` command exists."
