depends_on: []
acceptance_criteria:
  - "A held exclusive claim of a session whose newest session beat is older than its ttl (plus the expiry on a foreign runtime) reads suspended while its runtime beats, its advisory claim and the session stay as they were, and admission no longer refuses on it (mesh::state tests a_silent_exclusive_claim_is_suspended_while_its_runtime_beats, a_silent_exclusive_claim_refuses_nobody)"
  - "A beat within its ttl holds the claim, a session that never beat keeps the stream rule, and the digest of one silence is the same on every read (a_beat_within_its_ttl_holds_the_claim, a_session_that_never_beat_keeps_the_stream_rule, silence_reads_the_same_digest_twice)"
  - "A session beat with its phase round-trips between journals and is aged on the reader's clock (mesh::journal a_session_beat_round_trips_and_is_aged_on_the_readers_clock)"
  - "A ping and the notifications a client sends unattended are not progress; a tool call is (mcp::protocol a_ping_is_not_progress)"
  - "A stalled board session's exclusive claim is suspended without any event written, its session stays open, a peer that only pings writes nothing, real work holds the claim again, and mesh.beat records a phase and refuses a dead pid (mesh::cooperation a_stalled_board_session_s_exclusive_claim_is_suspended_and_holds_again_on_progress)"
  - "Only a session holding a live exclusive claim is beaten for, at most once a quarter of its ttl whatever its phase, and at most 8 x ceil(3600 s / (ttl / 4)) beats a rolling hour; past that beats are withheld (never a ttl-0 beat), a warning is logged once and mesh doctor's session_beats check fails (mesh::cooperation a_phase_changing_beater_writes_at_most_one_beat_a_quarter_of_the_ttl, an_advisory_only_session_writes_no_beats, a_runtime_past_its_beat_limit_withholds_beats_and_says_so)"
  - "A holder that resumes after another session was admitted over its suspended exclusive claim releases that claim with the reason, instead of re-arming it, and must claim again through admission (mesh::cooperation a_resumed_holder_releases_a_claim_another_session_was_admitted_over)"
  - "Over MCP mesh.beat speaks only for the calling session; the command line and plain HTTP name the session"
  - "Against a served runtime over plain HTTP MCP: an exclusive claim holds while tool calls continue and reads suspended when only pings follow while the runtime's own stream stays alive, its advisory claim and session untouched and no session closed; a command-line claim that never beats holds; a second exclusive claimer is admitted; a claim kept by mesh beat --phase 'waiting on CI' holds, shows its phase in mesh peers, and is suspended once the beats stop (case 3990)"
