id: I3074
milestone: public-proof
title: "Every article ends with the articles related to it, in its reader's language, and each answers it back"
slug: the-articles-are-linked-in-every-language
priority: p2
profile: implementation
parallel_safe: true
objective: "An article names the articles related to it in [extra] related, as the routes its [extra.translations] uses, and site/templates/page.html ends it with a Related section that draws each one from the page itself through get_page: its title, its description and its language, tagged where that is not the article's own. Check 21 of scripts/site-check reads the list with the reader it already has for the counterparts, and refuses, naming the file: a related route that is no page or no article, the article itself or one of its own counterparts, an entry listed twice, a page in another language where the related article has a counterpart in the article's own, a related article that names neither the article nor any of its counterparts back, two counterparts that relate different articles, and, once the site relates any article, an article the navigation lists that names none. The eight articles of site/content-src each name the other three groups in their own language. Case 3389 holds each refusal on fixtures, the real tree, and the built section of every article."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language, and enforced. e7's I3436-I3438 make every article read in every language and hold its counterparts to each other; an article still led nowhere but to its own translation, so a reader who finished the essay on the bet on a layer was not shown the documentation it argues for, the stream that measures it or the plan it becomes. The withdrawn first attempt of this issue is preserved at refs/rescue/docs/the-articles-are-linked-in-every-language/20261019T0400Z."
current_state: "site/templates/page.html ends an article with its body. No article names a related one, and nothing in scripts/site-check or the suite reads such a list."
desired_state: "Every article the navigation lists ends with a Related section naming the other groups of articles, each in the reader's language, and every group relates the same articles in each of its languages. Check 21 refuses a list that breaks any of those, on the real tree in the site job and on fixtures in case 3389."
