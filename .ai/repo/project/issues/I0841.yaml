id: I0841
milestone: M004
title: Cache equivalence proved by property-shaped cases
slug: cache-equivalence
priority: p0
profile: implementation
parallel_safe: false
objective: "For every read-only command in the registry, run it with the cache cold, warm, and disabled, on this repository and on a synthetic one, and assert byte-identical output and exit code; then mutate one file and assert the changed output is served."
why: "A cache that changes a result is worse than no cache; the proof has to cover every reader, not the one that was tested."
current_state: "No cache exists yet."
desired_state: "One case iterating the registry's read-only commands, so a command added later is covered by existing."
scope:
  - test/cases/86_cache_equivalence.sh
  - share/commands.yaml
non_scope: []
depends_on:
  - I0821
acceptance_criteria:
  - The case reads the registry for the command list and fails if it is empty
  - Every read-only command is byte-identical across modes
  - A mutated file changes the output and the counters show a miss
validation:
  - bash test/run.sh 86_cache_equivalence
evidence_required:
  - flatten_cache
risk: "Commands whose output carries a timestamp (context) are compared after the timestamp line is dropped, and the case says which line."
created_at: 2026-09-05
updated_at: 2026-09-05
