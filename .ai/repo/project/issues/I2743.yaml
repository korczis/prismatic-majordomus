id: I2743
milestone: truthful-plan-surfaces
title: "The public roadmap draws every milestone in the graph's order, each issue with its inferred delivery"
slug: the-roadmap-draws-every-milestone
priority: p0
profile: implementation
parallel_safe: true
objective: "Rewrite site/templates/roadmap.html and site/content-src roadmap so /roadmap/ lists every milestone of the plan in the milestone graph's order (no filter on any hand field), shows released_in, each issue's declared status beside its inferred stage linked to the pull request, commit and tag that prove it, states the commit and time observed, and draws the milestone graph through the ADR 0152 viewer with nodes linked to milestone pages."
why: "ADR 0166 decisions 4 and 6. The page lists 8 of 38 milestones and none of the work in flight; its front matter still names .majordomus/project/milestones/."
current_state: "roadmap.html keeps milestones whose version is set; the issue counts are stamp-derived; nothing links a stage to its proof."
desired_state: "One template over roadmap.json and delivery.json; scripts/site-check asserts that every milestone id of plan.json appears on /roadmap/."
scope:
  - "site/templates/roadmap.html"
  - "site/templates/plan-section.html"
  - "site/templates/milestone.html"
  - "site/content-src"
  - "site/content/roadmap.md"
  - "scripts/site-check"
  - "test/cases/3103_the_roadmap_draws_every_milestone.sh"
depends_on: [I2740, I2742]
acceptance_criteria:
  - "Every milestone id in plan.json appears on the built /roadmap/, in the graph's order"
  - "An issue with a merged pull request shows merged with a link to that pull request"
  - "The page names the commit and time its data was observed"
validation:
  - "bash test/run.sh 12_site_build 3103_the_roadmap_draws_every_milestone"
evidence_required:
  - "roadmap_complete_case"
