id: I3860
milestone: public-proof
title: "An article explains in both languages why a saving is measured, not claimed"
slug: a-saving-is-measured-not-claimed
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/a-saving-is-measured-not-claimed.md, an English article on how Majordomus decides whether it saves tokens (ADR 0082). It covers the question asked of matched runs, control and treatment, a corpus whose hidden tests can be failed, the five classes every number carries, the two measurements that are never merged, the publication rule declared before the evidence, the economics-claims gate, stale evidence, how a reader repeats it, and what is not measured. It states no saving figure, and its one time-bound statement, that no live run had been recorded, is dated. Every statement is one that ADR 0082, docs/ECONOMICS.md, the economics claims, the methodology, the generated report or the gates on master states, and no count is typed by hand. site/content-src/uspora-se-meri-netvrdi.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the silence, proof-carrying documentation and reasoning articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. A token saving is the value Majordomus is most often assumed to have, and the site's Token economics page shows the numbers without the story of why none is published until a declared rule allows it."
current_state: "No article explains how a saving is measured. The article groups relate each other, and none of them names it."
desired_state: "/a-saving-is-measured-not-claimed/ and /uspora-se-meri-netvrdi/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 and economics check pass, with the translation at its source's digest."
