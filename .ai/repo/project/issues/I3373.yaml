objective: "Put to the owner, and record with majordomus decision, each cut the 30-day window needs: I3133 drops its dependency on I0401, because the benchmark's hidden tests decide acceptance on their own; I0401 moves out of milestone cost-per-accepted-outcome (which waits on execution-telemetry) into a milestone without that dependency, since its definition half needs no telemetry and its acceptance already tolerates an explicit absence; milestone delivery-flow-is-measured drops its dependency on development-runtime, or I3202 moves out of it; I3288 drops its dependency on I0301 if the loopback receiver needs no telemetry adapter; I3299 is raised from p3 to p1. Apply each accepted cut to its record with a why that cites the decision; for each refused cut, record which criteria of this intent it leaves outside the window."
