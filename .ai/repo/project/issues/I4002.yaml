acceptance_criteria:
  - "worktree.create plans and applies the canonical <repository>-wt/<branch> path and refuses a misplaced or existing one with a reason"
  - "It wraps WorktreeService's ensure (apps/majordomus-cli/src/worktree), the path `majordomus worktree create` takes, and adds no second implementation of worktree creation"
