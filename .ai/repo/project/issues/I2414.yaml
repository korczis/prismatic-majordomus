id: I2414
milestone: the-mesh-works-out-of-the-box
title: "mesh.state and mesh.peers answer a filtered summary that fits one tool answer"
slug: mesh-reads-are-filtered
priority: p1
profile: implementation
parallel_safe: true
objective: "Give mesh.state and mesh.peers inputs that narrow and summarise: a kind (sessions, claims, handovers, reviews), open-only, mine-only, a scope or PR substring and a limit, with a counts-only summary by default."
why: "Both take no input (apps/majordomus-cli/src/capability/builtin/mesh.rs:1184-1216) and answered 56-134 kB on 2026-10-10, over every MCP client's tool-result limit, so every read went through a saved file and jq."
current_state: "Whole-state answers only; mesh.events is the only paged read."
desired_state: "A default answer under 16 kB with counts and the newest items; filters that return exactly the asked slice; the full state still available on request."
scope:
  - "apps/majordomus-cli/src/capability/builtin/mesh.rs"
  - "apps/majordomus-cli/src/mesh/state.rs"
  - "docs/MESH.md"
acceptance_criteria:
  - "mesh.state with no input answers under 16 kB on a journal of 20 000 events"
  - "Each filter returns exactly the matching items, proved on a fixture state"
  - "The full answer is still available with an explicit input"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --lib capability::builtin::mesh"
evidence_required:
  - "mesh_state_filtered_test"
created_at: 2026-10-10
updated_at: 2026-10-10
