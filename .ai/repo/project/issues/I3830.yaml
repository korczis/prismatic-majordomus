acceptance_criteria:
  - "A fixture push whose run-plan gate fails exits 0 with a line naming the gate and saying CI holds the verdict, and CI's validate refuses the same head"
  - "A commit that moves a canonical input without regenerating is still refused by scripts/pages current"
  - "An uncomputable plan (exit 12), a failed finish --check and a duplicate case number still refuse the push"
  - "doctor and rustdoc report and do not refuse; the worktree guard and the SSH permissions check still refuse"
  - "doctor still finds each enforcement wired by its hook"
