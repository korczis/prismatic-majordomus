# The publication model of this repository: what makes the public site different, what the
# fast path is allowed to spend on making it different, and how the result is measured.
# `scripts/pages` reads this file and nothing else; .github/workflows/pages.yml is an adapter
# over that script, and docs/GITHUB_PAGES_PERFORMANCE.md explains the design it encodes.
#
# A budget here is repository-controlled latency only. The Actions queue, runner allocation
# and GitHub's own "pages build and deployment" are measured and reported but never budgeted:
# they are not this repository's seconds to spend, and a gate that fails on them would fail
# on GitHub's weather rather than on a regression anybody can fix.
version: 1

# ---------------------------------------------------------------- what triggers a publication
# The site can only differ when an input of the site generator, of the site itself, or of the
# publication path differs. That set is not written here twice: `gate` names the gate of
# .ai/repo/ci/gates.yaml that builds the site, and the paths are the union of the classes that
# select it. `scripts/pages paths` computes them; test/cases/97_pages_fast_path.sh holds the
# workflow's own trigger to that computation, so the two cannot drift.
trigger:
  branch: master
  gate: site-build
  # A publication is also asked for on a clock, because a push-triggered run that fails leaves
  # the site where it was and nothing asks again: on 2026-09-14 the site stood seven hours while
  # every run failed. The cadence is the window `scripts/ci/pages-check` judges by (OWED_AFTER,
  # 1800s) — a schedule slower than the window cannot notice what the window calls owed. The
  # scheduled run asks the gate first and builds only when a publication is owed, and reports the
  # intervention by ending red; test/cases/97_pages_fast_path.sh holds this against the workflow.
  schedule: '*/30 * * * *'
  # paths that change what is published and that no class selecting the gate above covers.
  # The pipeline's own files, and since ADR 0086 the inputs of the crate's rustdoc, which the
  # site composes at /rustdoc: the crate's sources and manifests, the toolchain that renders
  # them, its producer and the action that runs it here. They are extras rather than classes
  # of the site-build gate because the reference is built by its own producer and never by
  # the site build, so a change to the crate must publish without making every Rust change
  # plan the site's gates (test/cases/94_ci_plan.sh holds that it does not).
  extra:
    - .github/actions/rustdoc/**
    - .github/workflows/pages.yml
    - apps/majordomus-cli/Cargo.lock
    - apps/majordomus-cli/Cargo.toml
    - apps/majordomus-cli/build.rs
    - apps/majordomus-cli/src/**
    - rust-toolchain.toml
    - scripts/pages
    - scripts/rust-check
    - scripts/site-deploy

# ---------------------------------------------------------------- how a publication happens
deploy:
  branch: gh-pages
  output: site/public
  # the served file that names the commit the public site was built from; the probe reads it
  identity: build.json
  # How long after GitHub publishes a release the homepage and /releases/latest.json may still
  # name an older one before `scripts/pages release-live` refuses the site. A release reaches
  # the three in order: GitHub, then latest.json from the release's publish job, then the pages
  # from the build of master that job asks for, which waits in the Actions queue like any other
  # run. The bound is the deploy window scripts/ci/pages-check judges an owed publication by
  # (OWED_AFTER, 1800s), for the same measured reason: a queue of 25 minutes is weather.
  # project.the-site-offers-the-release-it-published.
  release_window: 1800
  # How long GitHub's own "pages build and deployment" may stay `building` or `queued` before
  # it counts as hung, and `scripts/pages rebuild` replaces it instead of waiting on it (I3902).
  # A rebuild preempts the build in flight, so the bound sits above the longest build that
  # has ever finished: on 2026-10-22 the builds took 45-80 s as usual, with outliers of 351,
  # 582, 745 and 1200 s that did finish, and one that was still `building` after 47 minutes
  # while the site served the previous commit and nothing could replace it. 1500 s is the
  # longest finished build plus a quarter. A hung build costs delivery time and nothing
  # else: no request ever replaced it, because the old predicate refused while it was in
  # flight.
  build_hung_after: 1500
  publish: scripts/site-deploy --skip-build
  # What the publishing clone must be able to answer, and therefore what it must be given.
  #
  # `scripts/site-check` resolves the site's links to the forge against git rather than over
  # the network: commit/<sha> and compare/a...b need the history, releases/tag/<t> and
  # tree/<tag> need the tags. A clone without them cannot decide those links, must refuse
  # rather than guess, and site-check counts a refusal as a failure — so the publication
  # stops. That is not hypothetical: between 2026-09-14 18:34 and 2026-09-15 00:0x the
  # deploy checked out at depth 1, six links to tags that exist were reported non-existent,
  # 2302 commit links were undecidable, and the site stayed at 8cf457000 for seven hours
  # while master moved three merges ahead, with every gate green.
  #
  # Declared here rather than written into the workflow, for the same reason `trigger` is:
  # .github/workflows/pages.yml is an adapter, `scripts/pages checkout` computes the depth
  # this implies, `scripts/pages checkout --verify` measures the clone a run was actually
  # given, and test/cases/97_pages_fast_path.sh holds the workflow to this file so the two
  # cannot drift. Changing what the publisher needs is an edit here and nowhere else.
  checkout:
    # full: every commit the site may link to. `scripts/pages checkout` renders this as
    # fetch-depth: 0. No other value is meaningful while link-check resolves commit links —
    # a truncated history cannot be partially sufficient, because which commits the site
    # links to is decided by its content, not by a depth.
    history: full
    # required: the site links to release tags, and `actions/checkout` fetches none at a
    # shallow depth. This is a separate key because it is a separate failure: a clone can
    # carry the whole history and still have no tags.
    tags: required
  # What a reader must find once the public site serves the commit: a route, and a marker the
  # built page carries there. `scripts/pages verify --smoke` fetches each one after the
  # identity matches, so "the right commit is served" and "the pages a visitor is sent to are
  # there and work" are both measured on the public bytes. Markers are the data attributes the
  # templates render for exactly this, never a sentence, so the words can change freely.
  smoke:
    - route: /
      marker: data-recorded-story
    - route: /
      marker: data-cta
    - route: /challenge/
      marker: data-challenge-replay
    - route: /challenge/
      marker: /guarantees/
  # What a publication holds that the site build does not compose: a surface a process serves,
  # read once at the published commit by that commit's own executable and written as files
  # (ADR 0141). `surface` is the topology's id of the served surface (docs/generated/web.json),
  # and its mount there is where the publication holds the snapshot, so no mount is written
  # here; `artifact` is where the producer writes it, `producer` is the command that does, and
  # `marker` is the attribute every page of it states the commit it was read at with.
  #
  # Declared here because until 2026-10-12 only .github/workflows/pages.yml knew: its deploy
  # job placed the snapshot and nothing else could tell that a site without one was short of a
  # surface. A person's `scripts/site-deploy` published the site without it, the public probes
  # read /build.json and never the mount, and a snapshot read at an older commit than the
  # pages beside it was nobody's finding. `scripts/pages snapshots` resolves these rows;
  # `scripts/site-deploy` refuses a tree that lacks one, `scripts/pages verify-ui` asks the
  # public site for it, and section 2c of scripts/ci/pages-check holds the live site to it
  # (project.the-published-ui-is-the-trunks). test/cases/2983_the_published_ui_is_the_trunks.sh
  # holds the workflow to this entry, so the two cannot drift.
  snapshots:
    - surface: ui
      artifact: target/web/ui-snapshot
      producer: majordomus web report ui-snapshot
      marker: data-snapshot-of
    # the Cockpit, by the same exporter (ADR 0147). Written after the UI's, because it reads
    # first the pages the UI's snapshot links to, and then leads those links to its own pages.
    - surface: cockpit
      artifact: target/web/cockpit-snapshot
      producer: majordomus web report cockpit-snapshot
      marker: data-snapshot-of

# ---------------------------------------------------------------- what the fast path may spend
# Seconds, wall clock, on a GitHub-hosted Linux runner with the caches warm. Derived from
# measurement, not from taste: `scripts/pages benchmark` locally and the timing rows every
# deployment writes are what these were set from, and what a change to them must cite.
#
# There is one key per row `scripts/pages report` actually measures, and `controlled` is the
# sum of them. Both halves of that are load-bearing and neither held until 2026-09-12. The
# first set named `checkout` and `setup` separately while the workflow times them as one step,
# and named no phase at all for `fingerprint` or `local-check` — so three of the six rows of
# every job summary printed an empty budget cell. It also summed to 105 against a `controlled`
# of 75, which made the aggregate stricter than the parts it is made of: every phase could be
# inside its own budget and the run still breach, with nothing to point at. A total that
# cannot be reached by adding up its own rows is a number nobody can act on.
#
# THE MEASUREMENT THESE WERE RE-DERIVED FROM (2026-10-20). The Czech copy of the site (ADR
# 0218) doubled the pages every phase reads, and the rows set on 2026-09-12 from the English
# site no longer described anything: `build` went from 15 s to 200-314 s and `check` from
# 167-171 s to 296-517 s, while the budgets still said 8 and 60. Six runs of
# .github/workflows/pages.yml that passed `check` with the Czech copy, 39438897759 ..
# 39485870985 (2026-10-20T14:24Z .. 19:43Z), read from the per-step timings of
# `gh api repos/korczis/prismatic-majordomus/actions/runs/<id>/jobs`, on ubuntu-latest with
# both cache domains restoring. Four of them published; two failed after the check, for a
# reason these rows do not measure, so `publish` and `controlled` are read from four.
#
#   row              min  median  p90  max   budget  headroom over max
#   checkout-setup    18      21   22   25       32              1.3x
#   build            200     270  294  314      400              1.3x
#   check            296     504  509  517      660              1.3x
#   publish           32      54   54   54       70              1.3x
#   rustdoc          172     179  181  183      230              1.3x
#   controlled       723    1011 1011 1057     1398              1.3x
#
# `checkout-setup` is the checkout, its verification and setup-site; `rustdoc` is the rustdoc
# job, checkout to upload, plus the download of its artifact in the deploy job, which replaces
# the provisional 90 written before any runner had run it. `fingerprint` and `local-check` are
# rows the API does not show apart from the steps that run them, and keep their 3 s.
#
# The growth is not all the corpus. Twice the pages explains twice the `check`, and it took
# three times; it does not explain eighteen times the `build`. These budgets describe what the
# path costs now, so that a breach means a change; why the build costs this is the first
# entry under "Remaining bottlenecks" in docs/GITHUB_PAGES_PERFORMANCE.md.
#
# THE MEASUREMENT BEFORE IT (2026-09-12). Twenty-five runs that reached the publish step,
# 2026-09-10T22:56Z .. 2026-09-12T06:38Z, over the English site: checkout-setup 15, build 6,
# check 47, publish 24 at their maximum, budgeted 18, 8, 60 and 28. Those replaced the set
# written when this file was created (b959046cd), which came from
# .ai/repo/benchmarks/pages/baseline.macos-arm64.json — a local laptop, five samples, over a
# site of 417 routes — and had never been re-derived on the machine it judges.
#
# A CHANGE THAT MULTIPLIES THE PAGES RE-DERIVES THESE ROWS. A language copy, a new family of
# generated pages or a new composed surface changes what every row reads. Its pull request
# re-derives the warm rows from a measured run of it, and the step bounds of pages.yml follow
# from them through `bound` below, which scripts/ci/step-bound-check holds.
budget:
  warm:
    # everything before `scripts/pages build`, which the workflow times as one row because it
    # runs as one step: the runner's own checkout and the setup-site action. The Actions queue
    # is measured before this and is deliberately not in it. The name is one token because
    # the keys of this file are [A-Za-z0-9_-] — `mj_yaml_flatten` refuses anything else.
    checkout-setup: 32
    fingerprint: 3
    build: 400
    # the whole of `scripts/site-check`, which walks every published route. It is the phase
    # that grows with the site and the first place to look when `controlled` moves.
    check: 660
    local-check: 3
    publish: 70
    # the rustdoc job, checkout to upload, and its artifact's download
    rustdoc: 230
    # the sum of the rows above, and the number the SLO verdict is taken against
    controlled: 1398
  # a cold runner pays for the caches it cannot restore; it is still bounded. No cold run
  # appears in either window, so this keeps the allowance first expressed as 180 against a
  # warm 75 — 105 s for an uncached `npm ci` and Zola download — and the rustdoc job's own
  # cold cost, every dependency's metadata built before the crate is documented, estimated at
  # 150 s with the toolchain download. 1398 + 105 + 150.
  cold:
    controlled: 1653
  # How a budget becomes a bound. A budget is a warning: `scripts/pages report` names a row
  # over it and the run stays green. A step's `timeout-minutes` is a kill, and a kill of a row
  # that is merely slow skips the publish and leaves the site old, which is what the `check`
  # step's 3 minutes did to run 39392245576 once the Czech copy doubled its pages. So:
  #   percent       a step of pages.yml named after a warm row, or a job named after one, is
  #                 bounded at no less than this percent of that row's budget
  #                 (scripts/ci/step-bound-check refuses a smaller bound);
  #   near_percent  `scripts/pages report` names a row NEAR when it spent more than this
  #                 percent of its step's bound, before the run that crosses it.
  bound:
    percent: 150
    near_percent: 50
  # push -> publicly observable. Reported against every deployment, and not enforced: the
  # queue and GitHub's own Pages build are the larger half of it and neither is ours.
  end_to_end: 60

# ---------------------------------------------------------------- what is cached, and by what
# Each domain is invalidated by its own inputs and nothing else, so a documentation change
# does not evict a toolchain and a lockfile change does not evict the site.
caches:
  - id: node-modules
    path: node_modules
    inputs: [package-lock.json]
    saves: npm ci
  - id: zola
    path: .mj-cache/zola
    inputs: [.ai/repo/ci/pages.yaml]
    saves: the Zola release download
