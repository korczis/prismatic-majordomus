id: I1301
milestone: external-workspaces
title: A workspace is a declared object of the layer; only its content is local
slug: workspace-kind
priority: p0
profile: deep-work
parallel_safe: true
objective: "Register `workspace` as a kind — allowed keys, schema, directory contract — and declare the first workspace under .ai/repo/workspaces/, so that the catalogue of what may be synced is the repository's own tracked statement while the synced content stays out of the tracked tree."
why: "ADR 0025 established that .ai/local reaches no surface: the Rust index knows one discovery, tracked files through the git index, and excludes the local half at three points. A synced corpus therefore cannot ride the kind pipeline — but the declaration of which workspace exists, who holds it, what the operator authorised and how it is reached carries none of the private content and all of the useful metadata. Declared as a kind it is indexed, readable, listable and projectable for free, exactly as tests/external_extension.rs proves for any other kind."
current_state: "No workspace kind, no .ai/repo/workspaces directory, no allow file and no schema exist."
desired_state: "A workspace object states vendor, workspace identity, the human name, what the operator authorised, the browser profile reference by name only, and the capabilities the adapter is expected to negotiate. It is indexed, closed by an allow file, and carries a context README per ADR 0011."
scope:
  - .ai/repo/workspaces
  - share/kinds.yaml
  - share/allow/workspace.txt
  - share/schemas
non_scope:
  - Any synced content; the store is I1303
  - Any credential, cookie or token value; the declaration names a profile, it does not hold one
  - Any Rust that special-cases the kind
depends_on: []
acceptance_criteria:
  - The object states vendor, upstream workspace identity, display name, the authorisation the operator asserts, the browser profile reference by name, and the expected capability set
  - Keys are closed by share/allow/workspace.txt and an unknown key is refused
  - The directory carries a context README stating what is authoritative and what is generated, per ADR 0011
  - The object is listed and read through the existing object surface with no code that special-cases it
  - No secret value and no credential name appears in the object or its schema
validation:
  - bash test/run.sh
  - bin/majordomus doctor
  - majordomus generate --check
evidence_required:
  - kind_registered
  - keys_closed
  - directory_contract
  - object_indexed
risk: "A schema written for ChatGPT becomes a ChatGPT file with a generic name. It has to state only what a second vendor would plausibly restate, and push everything else into a named vendor block."
