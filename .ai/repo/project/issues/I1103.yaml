  - apps/majordomus-cli/src/cockpit
  - apps/majordomus-cli/src/generate.rs
non_scope:
  - Anything outside the phase named in the objective
depends_on:
  - I1102
acceptance_criteria:
  - docs/COCKPIT.md names no capability identifier in a table by hand
  - The Cockpit's routes are one declared list the router and the generator both read
validation:
  - majordomus knowledge check
  - majordomus canonicality check
evidence_required:
  - suite
risk: "A phase that is half done leaves a mirror half derived; each phase ends with the audit and the baseline recorded again."
