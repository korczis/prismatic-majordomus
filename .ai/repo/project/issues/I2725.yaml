acceptance_criteria:
  - "A tag on a commit with candidates is published from them, verified, in under three minutes of build phase"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "candidate_promotion_verified"
