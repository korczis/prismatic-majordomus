id: I4480
milestone: the-runtime-supervises-itself
title: "An execution accepted before a restart is answered after it as an unknown outcome, never as absent"
slug: an-execution-survives-a-restart-as-a-record
priority: p1
profile: implementation
parallel_safe: false
objective: "Put a bounded journal behind the execution store so that the executions a server accepted, with their events, are still answered after the server stops and starts, and one that had not finished reads the final UnknownOutcome state I4001 adds."
why: "campaigns/majordomus-autonomous-idd-maximal/09_STATE_MACHINE_AND_DATA_CONTRACTS.md asks that a typed execution can be reconstructed from persisted events after a restart, and campaigns/majordomus-autonomous-idd-maximal/02_ORCHESTRATOR_MESH.md and 19_ACCEPTANCE_TRACEABILITY_MATRIX.md (AC-008) ask that a restart loses no work silently. docs/EXECUTIONS.md states the opposite as a known limit: an execution does not outlive the process that accepted it, and there is no execution that survives a restart. A worker that started a long capability call and whose server was replaced finds an empty list and cannot tell a call that never ran from one that ran halfway."
current_state: "Measured at 51b38035a71. apps/majordomus-cli/src/execution/store.rs keeps snapshots and events in process memory only, bounded by execution::store::Limits (max_executions, max_events, max_log_chars, max_subscriber_queue, max_running). ExecutionState (execution/model.rs) is Queued, Running, Cancelling, Succeeded, Failed and Cancelled, and may_move_to is the whole contract; events carry schema_version PROTOCOL_VERSION 1 (execution/event.rs). docs/EXECUTIONS.md still says an execution does not outlive the server that holds it and that a durable store is a substitution behind Limits. No journal exists. I4001 plans UnknownOutcome and a versioned event schema; I3182 records the same in-memory gap for the supervisor's orphaned and unknown-outcome categories, and plans no journal."
desired_state: "The store appends each accepted execution and each event to a journal under .ai/local/state/executions/ (the convention of .ai/local/state/served/) and reads it at start. An execution found Queued, Running or Cancelling at start (or in I4001's Authorizing, Claimed or Verifying) moves to I4001's UnknownOutcome, with an event that says the accepting process ended; no separate interrupted state is added. The journal is bounded by the same Limits, including max_running, an execution found running at start does not count against max_running afterwards, passes the execution redactor, and a damaged line is counted and reported, not fatal."
scope:
  - "apps/majordomus-cli/src/execution/store.rs"
  - "apps/majordomus-cli/src/execution/model.rs"
  - "apps/majordomus-cli/src/execution/event.rs"
  - "apps/majordomus-cli/src/execution/engine.rs"
  - "apps/majordomus-cli/src/execution/redact.rs"
  - "apps/majordomus-cli/src/capability/builtin/executions.rs"
  - "apps/majordomus-cli/tests/executions.rs"
  - "apps/majordomus-cli/src/ui/command.rs"
  - "docs/EXECUTIONS.md"
  - ".ai/repo/adrs"
  - ".ai/repo/rules/project/execution-events-are-typed.v1.md"
  - ".ai/repo/project/issues/I4480.yaml"
  - ".ai/repo/rules/project/execution-state-is-authoritative.v1.md"
  - ".ai/repo/rules/project/executions-carry-no-secret.v1.md"
non_scope:
  - "Running such a handler again: the record says its outcome is unknown and a caller decides"
  - "Retries, schedules or a queue that dispatches after a restart"
  - "Replicating executions over the mesh"
  - "Tracking the journal in git: it is checkout state under .ai/local"
depends_on:
  - I4001
acceptance_criteria:
  - "A server that accepted three executions, one succeeded and two running, is killed and started; executions.list answers all three, the succeeded one unchanged and the other two UnknownOutcome"
  - "executions.events after a cursor read before the restart answers the remaining events and repeats none"
  - "UnknownOutcome reached through a restart is final: the store refuses any move out of it, and the event schema_version is the one I4001 versions"
  - "The journal never holds more executions or events than Limits allows, and a test fills it past the bound"
  - "A journal with a torn last line starts, reports one damaged line, and answers every complete execution before it"
  - "The journal of an execution whose input held a credential the redactor knows does not contain the credential"
  - "The monitor's execution cursor (I3218) keeps its meaning across a journal reload: no event is delivered twice and none is skipped"
validation:
