id: I3166
milestone: knowledge-acts-on-what-it-learns
title: "A curated note whose cited file changed since its last review is reported for review, not served as current"
slug: a-note-whose-source-moved-is-flagged
priority: p2
profile: implementation
objective: "Have knowledge validate and the context compiler compare each cited provenance.derived_from file with the blob recorded at the note's last review and mark the note needs-review when it differs."
why: "2026-09-15: a knowledge entry whose evidence stops holding is marked stale rather than silently remaining true; 2026-10-16: knowledge size alone does not give efficiency, stale knowledge needs selective revalidation. Using dates against git log flags three of master's four notes on day one (docs/CLI.md has changed 74 times since start-here.md). The criterion 'devcontext lowers its confidence' is met by a separate needs-review field, because confidence is the trust of the discovery path. Sources: chatgpt-majordomus:c144#3, chatgpt-majordomus:c278#6."
current_state: "Curated notes carry derived_from; I1987 keeps provenance after deletion (case 3023); nothing compares the cited files with the note."
desired_state: "needs-review is derived and shown where the note is served."
scope:
  - "lib/knowledge.sh"
  - "apps/majordomus-cli/src/devcontext"
  - "apps/majordomus-cli/src/capability/builtin/knowledge_base.rs"
  - "docs/KNOWLEDGE.md"
  - "apps/majordomus-cli/src/ui/knowledge.rs"
  - "lib/context.sh"
  - "share/schemas/majordomus/knowledge/knowledge.v1.schema.json"
  - "share/schemas/majordomus/knowledge/knowledge.v1.proto"
  - ".ai/repo/project/intents"
non_scope:
  - "Rewriting notes automatically"
  - "Lowering devcontext selector confidence for a stale note"
  - "Failing knowledge validate because a cited file moved"
  - "Blocking on needs-review, until promoted: the owner decided on 2026-10-30 (P00 question Q-H1) that needs-review starts advisory, and promoting it to blocking is a later, separate decision"
serves:
  - "the-layer-evolves-when-it-is-due#a-moved-source-is-flagged"
acceptance_criteria:
  - "A note whose cited file changed since its last review is reported"
  - "Each new case named here takes its number from `scripts/case-numbers next` and is announced on the board before the file is written (ADR 0053); a case number written in this record before that is provisional"
  - "A curated note is anchored by the blob hash of each provenance.derived_from file recorded at its last review; needs-review is derived when the current blob differs, not from git log against the note's date, so a shallow clone gives the same verdict"
  - "A note without recorded hashes reads unanchored, not needs-review; the first reading over the curated notes is recorded with how many are flagged"
  - "A person clears needs-review with one ledger-recorded re-review act that re-stamps the hashes"
  - "knowledge validate reports needs-review as a WARN and keeps its exit status; case 3075 stays green when a cited file moves"
  - "needs-review is advisory first (owner decision 2026-10-30, P00 question Q-H1): every reader that shows it (knowledge validate, knowledge check, devcontext, the briefing, /ui/knowledge) reports it as a WARN and none changes its exit status because of it; the case allocated here asserts the exit status of knowledge validate and knowledge check is the same with a moved source as without one, so promoting it to blocking is a visible change of that case"
  - "devcontext reports needs-review in its own field with the reason; selector confidence keeps its meaning (devcontext/select.rs, model.rs)"
  - "needs-review is shown on /ui/knowledge and in the briefing's knowledge pointers (mj_context_pointers)"
  - "The criterion a-moved-source-is-flagged is rewritten to evidence: test with the allocated case path, and that case runs in this issue's validation"
validation:
  - "bash test/run.sh 3075_knowledge_validate_judges_the_graph"
evidence_required:
  - "case_note_source_moved"
created_at: 2026-10-18
updated_at: 2026-10-30
