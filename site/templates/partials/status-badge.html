{#- expects: badge_status -#}
{%- if badge_status == "guaranteed" -%}
<span class="inline-flex items-center rounded border border-green-300 bg-green-50 px-2 py-0.5 font-mono text-xs font-medium text-green-800 dark:border-green-800 dark:bg-green-900/30 dark:text-green-300">guaranteed</span>
{%- elif badge_status == "advisory" -%}
<span class="inline-flex items-center rounded border border-amber-300 bg-amber-50 px-2 py-0.5 font-mono text-xs font-medium text-amber-800 dark:border-amber-800 dark:bg-amber-900/30 dark:text-amber-300">advisory</span>
{%- elif badge_status == "planned" -%}
<span class="inline-flex items-center rounded border border-gray-300 bg-gray-50 px-2 py-0.5 font-mono text-xs font-medium text-gray-700 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">planned</span>
{%- elif badge_status == "rejected" -%}
<span class="inline-flex items-center rounded border border-gray-300 bg-white px-2 py-0.5 font-mono text-xs font-medium text-gray-500 line-through dark:border-gray-700 dark:bg-gray-900 dark:text-gray-500">rejected</span>
{%- endif -%}
