title: "The UI runs any capability and explains what needs the owner, whose version it shows and where its time went"
slug: the-ui-runs-and-explains
order: 195
priority: p1
problem: "The Cockpit runs any capability from a schema-generated form (cockpit/pages.rs, share/cockpit/runner.js), but /ui/capabilities only describes one, and docs/MAJORDOMUS_UI.md says nothing on the UI starts work yet; no response says where its time went; the Dashboard leads with delivery figures rather than what needs the owner; the UI's search does not reach every entity; a version badge does not say whose version it is. Sources: chatgpt-majordomus:c187#8, chatgpt-majordomus:c223#2."
outcome: "I3225, I3226, I3227, I3228, I3229 and I3230 close these gaps on the existing screens."
current_state: "Verified on master 707a04c7ce8: /ui/capabilities reads capabilities.describe and runs nothing; capability/builtin/perf.rs exposes phase timings; no Server-Timing header in apps/ or share/ (grep); ui/dashboard.rs reads repository.info, health.report, release.version, distribution.releases, plan.status, plan.roadmap and mesh.peers; ui/navbar.rs fills the badge with the executable's version."
desired_state: "Each issue lands as one PR against the existing screen it names, serving one criterion of the-ui-runs-and-explains-the-work."
