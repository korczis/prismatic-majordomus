id: one-bar-and-one-language-on-every-surface
title: "One bar, and the reader's language, on every surface of the product"
statement: "Every surface a reader meets — majordomus.dev, its /ui and /cockpit snapshots, the UI and the Cockpit a running majordomus serves, and every application page — wears one top bar, declared once in site/data/nav.toml and rendered once by the site, with the same language switch, and opens in the reader's language: each surface's own text is derived from its English and the shared translation memory, the switch on every surface leads to that surface's own copy in each language, and a gate refuses a surface whose bar or whose languages differ from the site's. How it is derived, what each surface may differ in, and why, is documented where the bar is declared."
