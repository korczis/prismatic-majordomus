id: I4522
milestone: a-bounded-task-is-carried-to-accepted-work
title: "A repository's release records are judged against the repository's own distribution model, or on internal consistency alone when it declares none, never against the installed tool's"
slug: release-records-are-judged-by-their-own-model
priority: p1
profile: implementation
parallel_safe: true
objective: "Release records under .ai/repo/releases are judged against the distribution model of the repository that carries them: the distribution-model object its own knowledge sources index (Model::from_index, apps/majordomus-cli/src/distribution/mod.rs:370), which in this repository is share/distribution.yaml through the `distribution` class of .ai/repo/knowledge/sources.yaml:246-250. The installed tool's model, Model::load(&app.share) and Model::locate(&share), stays what describes this build, its installer and its archive names, and stops being what a repository's records are measured against. Releases::findings and Release::findings (apps/majordomus-cli/src/distribution/release.rs:348 and :134) take the repository's model as an Option: with a model, every finding they make today is made against it; with none, the model-bound findings (a target the model does not declare or does not publish, a name the naming function does not derive, a URL outside the model's download prefix; release.rs:174-199) are not made, and the record is judged on internal consistency alone: a semantic version, no pre-release on the stable channel, tag equal to `v` and the version (release.rs:106), every required target carried by an artifact, no target twice, no tag twice, a URL ending in its own tag and name, a 64-hex digest and a non-zero size. The judgement is chosen in one function every caller asks (the generator, distribution validate, distribution metadata, the distribution status capability), so the generator and the command line cannot judge one record two ways. A finding names which model it was judged against, or that it was judged on internal consistency because the repository declares none."
why: "Reported to the landing seat on 2026-10-30 by OSCILLA's oscilla-b0. In an adopter, `majordomus generate --check` reaches distribution_artifacts (apps/majordomus-cli/src/generate.rs:937-952), which loads the model from the installed share (:940) and the records from the adopter (:941) and refuses the tree on the first finding (:942-951); the composed index carries the same installed model (apps/majordomus-cli/src/app.rs:167, Model::locate(&share)). OSCILLA declares no distribution model of its own, and every one of its 19 release records at origin/main 27ce813e names the target `web` in required_targets and artifacts, so each one fails at release.rs:174-178 with `artifact for `web`, which the model does not declare`. The obligation `generated` is discharged by `majordomus generate --check` (share/obligations.yaml:64-71), so its evidence cannot be recorded and `finish --outcome completed` refuses obligation-closure (OSCILLA task t-20261030120335-ec44). The records did not change; an upgrade of the tool did. A record is evidence of what a repository published, judged by the model of the repository that published it: Release::findings already says it is checked against `the model it claims to have been built from` (release.rs:131-133) and already judges a record without required_targets on internal consistency alone rather than against a model it never saw (release.rs:156-157). Mission section 9 asks that evidence be judged against the inputs it describes; here it is judged against another project's."
current_state: "At origin/master 51b38035a71: App::compose sets index.distribution = Model::locate(&share) (app.rs:167), the model of the tool's data directory, absent only when that directory carries no distribution.yaml (mod.rs:360-365). distribution_artifacts takes Model::load(&app.share) (generate.rs:940) and refuses on releases.findings(&model) (generate.rs:942); distribution validate (apps/majordomus-cli/src/commands/distribution.rs:192-195) and distribution metadata (commands/distribution.rs:291 and :304) do the same; the distribution status capability judges Releases::from_index against ctx.index.distribution (apps/majordomus-cli/src/capability/builtin/distribution.rs:234-241, :369, :385). Release::findings (release.rs:134-217) refuses an artifact whose target the model does not declare (:174-178) or publish (:181-185), a name the naming function does not derive (:187-192) and a URL outside the model's download prefix (:147, :194-198); Releases::findings (release.rs:348-359) adds duplicate tags. Model::from_index (mod.rs:370) exists and reads the repository's indexed distribution-model object, but no release judgement asks it. An installed copy run in this repository is unaffected only because the share it carries is this repository's share/distribution.yaml. No case runs generate --check over an adopter's release records."
desired_state: "An unchanged release record in an adopter is judged the same before and after an upgrade of the tool: against the adopter's own distribution model when its sources index one, on internal consistency when they do not, and a record that contradicts the adopter's own model is still refused with the finding it gets today. This repository's records are judged against share/distribution.yaml exactly as today. Enforced by case 4522 and by cases 84, 139 and 1024 unchanged."
