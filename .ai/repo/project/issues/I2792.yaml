id: I2792
milestone: knowledge-base
title: "One capability lists the whole knowledge base, and /ui/knowledge browses it"
slug: the-knowledge-base-is-listed-and-browsed
priority: p1
profile: implementation
parallel_safe: true
objective: "Add knowledge_base.records: every curated and candidate record with id, uri, source class, class, status, epistemics, origin, date, title, subject, route, tags and how many of its references resolve, filterable by class, status and subject; project it to the CLI (knowledge records), HTTP and MCP from the one declaration; and give /ui/knowledge a panel that presents the base grouped by class beside the review queue."
why: "Only the review queue (knowledge_base.candidates) and one record at a time (knowledge_base.record) are readable; objects.list returns summaries without resolution, so no surface can show what the repository knows."
current_state: "Three knowledge_base capabilities: candidates, record, status. /ui/knowledge reads status and candidates."
desired_state: "knowledge_base.records answers over CLI, HTTP and MCP; /ui/knowledge shows the base; the published UI snapshot carries it."
scope:
