non_scope:
  - "Changing OSCILLA's records, its sources or anything else in that repository: its 19 records stay as they are and pass because the judgement changes"
  - "How this repository's records are judged: share/distribution.yaml is both the installed share and the repository's indexed model here, and every finding release.rs makes today for a record of this repository is still made"
  - "What the distribution target projects into a repository (the matrix, the installer, the site dataset, INSTALL.md) and which model it renders them from: only how release records are judged changes here"
  - "What this build is and what the installer serves (`distribution build`, `distribution artifact`, the installability checks over the tool's own targets): those stay the installed tool's model"
  - "scripts/release-record and the completeness check it makes when a release is written: it sees the model of its own day and is unchanged"
  - "Inventing a location for an adopter's model: the repository declares one through a distribution-model class in its own knowledge sources, as this repository does, or declares none"
depends_on: []
serves: []
acceptance_criteria:
  - "Case 4522, in a fixture adopter repository run by this tree's executable with this tree's share (whose model declares no target `web`): the fixture's knowledge sources declare a distribution-model class over its own model, which publishes a target `web` under its own project and naming, and one release record names an artifact for `web` consistent with that model; `majordomus generate --check` exits 0 and prints no `which the model does not declare`, `majordomus distribution validate` reports valid, and a task that requires `generated`, with its evidence recorded from `majordomus generate --check`, finishes with `finish --outcome completed` exit 0 and no obligation-closure refusal"
  - "Case 4522: the same fixture with no distribution-model class in its sources and a record shaped as OSCILLA's (required_targets [web], one `web` artifact whose name and URL no naming function derives): `generate --check` exits 0 and `distribution validate` reports the record judged on internal consistency because the repository declares no model"
  - "Case 4522: with no model of its own, a record that is not internally consistent is still refused by generate --check and distribution validate, one assertion per finding: a required target with no artifact, two artifacts for one target, a URL that does not end in its own tag and name, a digest that is not 64 hexadecimal characters, a zero size, two records claiming one tag"
  - "Case 4522: with its own model, a record that contradicts it is still refused with today's words: an artifact for a target the adopter's model does not declare (`which the model does not declare`), one it does not publish, a name its naming function does not derive, a URL outside its download prefix; the finding names the adopter's model as the one judged against"
  - "Case 4522: in this repository, `majordomus generate --check` and `majordomus distribution validate` give the same result as before the change, and a copy of one of its records with an artifact for a target share/distribution.yaml does not declare is refused with `which the model does not declare`"
  - "Unit tests in apps/majordomus-cli/src/distribution/tests.rs drive Releases::findings with a model and with none over the same records, and the generator, distribution validate, distribution metadata and the status capability reach the judgement through one function"
  - "Cases 84, 139 and 1024 pass unchanged"
  - "Before the change, case 4522 fails at its first assertion"
validation:
  - "MJ_TEST_JOBS=4 bash test/run.sh 4522_release_records_are_judged_by_their_own_model 84_distribution_model 139_release_record_schema 1024_an_installed_release_serves_a_foreign_repository"
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib distribution"
  - "bin/majordomus generate --check"
  - "bin/majordomus shell check"
  - "bin/majordomus doctor"
  - "bin/majordomus plan validate"
evidence_required:
  - "adopter_release_record_case"
risk: "Judging on internal consistency drops the naming and prefix checks for every repository that declares no model, so a mistyped artifact name in such a repository is no longer caught by the tool; the finding has to say that the record was judged on consistency alone, so a reader knows the absence of a refusal is not a proof against a model. A repository that indexes a distribution-model object it did not mean as its release model starts being judged against it."
