title: "Growth outside an intent is reviewed before it lands"
slug: growth-outside-an-intent-is-reviewed-before-it-lands
priority: p0
profile: implementation
parallel_safe: true
objective: "Flag a new registry, provider, route or service that no intent's scope names, and refuse it until reviewed."
