id: I4567
milestone: a-bounded-task-is-carried-to-accepted-work
title: "A task whose own commits were rebased has a supported finish, judged over its rebased commits"
slug: finish-after-a-rebase
priority: p1
profile: implementation
parallel_safe: true
objective: "majordomus finish recognises a task whose recorded head was rewritten by a rebase of the task's own commits (patch-id equivalent commits reachable from HEAD, or an explicit --rebased-from <old head>), re-anchors the task to the rebased commits, and judges scope-integrity over those commits only; where it cannot prove the equivalence it refuses with the one supported path named."
why: "Reported from the OSCILLA mesh (oscilla-ce at integrator oscilla-43's request, 2026-11-09, majordomus 1.0.0, korczis/oscilla). Task t-20261109192505-8c57 started at de358fed; the integrator asked for the branch to be rebased onto the new train head 809bcc66 (new head 5977c527). finish --outcome completed then failed scope-integrity, because the first-parent range counted the train's own files (tests/visual/synth/*.png, references.json), and state-consistency (lib/check.sh:158, \"diverged from recorded head de358fe; history was rewritten\"). --outcome partial was refused on state-consistency too, and none of finish's outcomes (completed, partial, blocked, no_match, failed) fits. It happened again on t-20261109195818-0a0c (test/k205-knob-wheel). The worker's workaround, without editing .ai/local or forcing, was `majordomus handover --close` naming both heads, then a fresh task anchored at the rebased head; that path is not documented as the supported one."
current_state: "At origin/master b8d3ffc786b (2026-11-09): lib/check.sh reports a recorded head that is not an ancestor of HEAD as `diverged` and fails state-consistency; finish has no outcome or option for a rebase of the task's own commits."
desired_state: "A rebased task finishes: finish finds the task's commits again by patch-id (or takes --rebased-from), records the re-anchoring in the task record with both heads, and judges scope over the rebased commits. When equivalence cannot be shown, the refusal names `handover --close` plus a fresh task as the supported path, and docs/LIFECYCLE or the task-lifecycle workflow says so."
scope:
  - ".ai/repo/project/issues/I4567.yaml"
  - "lib/check.sh"
  - "lib/finish.sh"
  - ".ai/repo/workflows/task-lifecycle.md"
  - "test/cases"
non_scope:
  - "Rewrites that are not rebases of the task's own commits (a reset that drops them, a force-push of another branch), which stay refused as diverged"
  - "OSCILLA's integrator policy, which now asks for merges rather than rebases"
depends_on: []
acceptance_criteria:
  - "A case rebases a task's two commits onto a new base that adds unrelated files, and finish --outcome completed passes with scope judged over the two rebased commits only, the task record naming the old and the new head"
  - "A case resets the branch so the task's commits are gone, and finish still refuses state-consistency, naming handover --close and a fresh task"
  - "The task-lifecycle workflow documents what to do after an integrator-ordered rebase"
validation:
  - "bash test/run.sh <the new case>"
evidence_required:
  - test
serves: []
created_at: 2026-11-09
