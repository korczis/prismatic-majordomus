# The only hand-written prose on the site. No capability claims (those come from
# docs/CLAIMS.yaml via capabilities.json), no numbers (the generator computes them).
# Budget: scripts/site-check fails when this file exceeds 60 lines.

[hero]
kicker = "portable shell · no runtime · no model calls"
headline = "A supervisory control layer for AI-assisted work"
lead = "Scoped, efficient, coordinated, verifiable. Policy, context, state and a finish contract — without another runtime."
cta_primary = "Get started"
cta_secondary = "View on GitHub"

[leads]
problem = "Every failure listed was observed in a working environment before it was designed against. The evidence, with magnitudes, is in the extraction report."
model = "Majordomus does not replace a worker and never invokes a model. It decides what a worker is told, what it may touch, and whether its claim of being done can be believed."
install = "One directory in your repository holds the policy, the profiles, and the durable state. Nothing is compiled, served, or running in the background."
supervises = "Every responsibility is a file in one directory and a subcommand that reads it."
profiles = "Rendered from the profile files a fresh install writes. Change the YAML; this page changes."
capabilities = "A supervisory tool that overstates itself is the thing it was built to prevent. Every row names its source, implementation and test, and the build fails if a path does not exist."
architecture = "The website is a projection of the repository, built the way the tool asks projects to build their own instructions: one canonical source, generated outputs, a check that fails on drift."
final = "One directory. One pointer in your AI instructions. Stop rebuilding your AI workflow in every new session."

[audiences]
developer = "Copy one directory, run one command, and every AI tool you open reads the same rules. Handovers carry state, not transcripts."
lead = "One policy for every tool the team runs, a finish contract before anything is called done, and a matrix that says what is guaranteed and what is only advisory."
organisation = "The ledger already records sessions, handovers, workers and verification per task. When token telemetry lands, cost per accepted outcome is one query away — measured, not estimated."
