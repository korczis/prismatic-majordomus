id: I4591
milestone: adopter-upgrades
title: "mj_ms reads EPOCHREALTIME under any locale's decimal separator"
slug: mj-ms-reads-any-decimal-separator
priority: p1
profile: implementation
parallel_safe: true
objective: "mj_ms (lib/common.sh) keeps every digit of EPOCHREALTIME and drops whatever separates them, so the millisecond clock is digits under any locale and every caller's arithmetic holds; a case pins it with an injected comma and, where one is installed, a real comma locale."
why: "Bash formats EPOCHREALTIME with the locale's decimal separator: under LC_ALL=cs_CZ.UTF-8, bash 5.3 answers `1794507023,452598`. mj_ms removed only a dot (`${EPOCHREALTIME/./}`), so the comma survived into every caller's `$(( ... ))`: a fraction that opens 08 or 09 is an invalid octal token and the command dies (lib/doctor.sh:94, 'value too great for base (error token is 087)', exit 1), and any other fraction is silently read by the comma operator as a wrong elapsed time. Reported by the algoglyph integrator: korczis/algoglyph CI run 43276351631 on a self-hosted runner, Majordomus v1.0.1; algoglyph pinned LC_ALL=C.UTF-8 as a workaround (its commit a1fc269). scripts/derive:77 already strips the first non-digit, the separator, (`${EPOCHREALTIME/[^0-9]/}`) and is not affected."
current_state: "Measured at origin/master 03695157151: lib/common.sh:683 `local t=${EPOCHREALTIME/./}`. Under hr_HR.UTF-8 on bash 5.2.21 mj_ms prints `1794507385,119`; with EPOCHREALTIME=1794507023,087598 the subtraction doctor.sh:94 does fails with 'value too great for base (error token is 087)'. Callers: lib/bench.sh, lib/capture.sh, lib/common.sh (timing), lib/doctor.sh, lib/usecase.sh, lib/watch.sh, scripts/pages."
desired_state: "mj_ms strips every non-digit (`${EPOCHREALTIME//[!0-9]/}`) before dropping the microseconds, so it prints epoch milliseconds as digits whatever the separator. The result opens with the epoch seconds, never a zero, so no caller's arithmetic needs a 10# guard."
scope:
  - "lib/common.sh"
  - "test/cases/4577_mj_ms_reads_any_decimal_separator.sh"
  - ".ai/repo/project/issues/I4591.yaml"
non_scope:
  - "scripts/derive's own clock (now_ms), which already strips a non-digit separator"
  - "The callers of mj_ms, whose arithmetic is correct once mj_ms answers digits"
  - "The locale any command or CI runner runs under; the algoglyph workaround can be dropped after the next release"
acceptance_criteria:
  - "With EPOCHREALTIME given a comma separator (1794507023,087598), mj_ms prints 1794507023087 and a doctor-shaped subtraction of two readings succeeds"
  - "With a dot separator the answer is the same"
  - "Under an installed locale whose real EPOCHREALTIME carries a comma, mj_ms prints digits"
  - "Negative: the case fails against lib/common.sh before this change (value too great for base, error token 087)"
validation:
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 4577_mj_ms_reads_any_decimal_separator"
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 886_the_timing_report_is_json"
evidence_required:
  - "mj_ms_reads_any_decimal_separator"
depends_on: []
serves: []
created_at: 2026-11-12
