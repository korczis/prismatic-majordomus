id: I3355
milestone: the-proof-scorecard-is-published
title: "majordomus economics proof serves the scorecard on the command line, HTTP and MCP from one capability declaration"
slug: the-scorecard-is-a-capability
priority: p1
profile: implementation
objective: "Declare capability economics.proof in apps/majordomus-cli/src/capability/builtin/economics.rs (CLI economics proof, HTTP GET /api/v1/economics/proof, MCP majordomus_economics_proof) answering I3354's scorecard, add the CLI text rendering, name it in the projection test at builtin/economics.rs:235-258, and run majordomus generate for every projection it writes."
why: "The owner's report of 2026-10-19 asks for the verdicts to be public. Every surface reads one capability, which is how this repository adds an operation (capability! declarations, ADR 0004). It depends on I3376 because both add declarations and projection-test entries to the same region of builtin/economics.rs."
current_state: "apps/majordomus-cli/src/capability/builtin/economics.rs:141-202 declares economics.summary, explain, runs and check; the projection test is at :235-258."
desired_state: "majordomus economics proof prints six rows and the totals; --format json, /api/v1/economics/proof and majordomus_economics_proof return the same data."
