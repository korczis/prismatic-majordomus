id: I2647
milestone: a-failure-is-answered-by-a-record
title: "The trunk's workflow answers its own failure: a failed run prints the draft and records what is owed"
slug: the-trunks-workflow-answers-its-own-failure
priority: p1
profile: implementation
parallel_safe: false
objective: "Run the forge half where the forge is: on a failed run of a workflow on master, a job runs postmortem owed and postmortem draft, puts the draft in the run's summary, and fails while a run past its grace has no record."
why: "The owner's order of 2026-10-13 and ADR 0156: an explanation of a red trunk that is not a record cannot be listed, checked, linked or searched."
current_state: "postmortem owed is a command a session runs by hand."
desired_state: "A workflow declared in .ai/repo/ci, triggered by the completion of validate and pages on master, runs owed and draft with the run's own token; its model, its shell-lint and a case hold it; a landing that answers the run turns it green."
scope:
  - ".github/workflows"
  - ".ai/repo/ci"
  - "test/cases"
  - "docs/POST_MORTEMS.md"
  - "docs/CI.md"
non_scope:
  - "Writing a record from CI: the trunk changes only through pull requests"
  - "Failures on pull request heads"
depends_on: [I2646]
acceptance_criteria:
  - "The workflow is proven in a local Linux container before it is pushed"
  - "A failed run on master shows the draft in its summary within one workflow run"
  - "The job is not required for a pull request to merge, so a red trunk can still take the fix and the record"
validation:
  - "bin/majordomus plan validate"
  - "scripts/ci/shell-lint"
evidence_required:
  - "workflow_run_on_master"
created_at: 2026-10-13
updated_at: 2026-10-13
