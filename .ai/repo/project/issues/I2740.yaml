id: I2740
milestone: truthful-plan-surfaces
title: "An issue's delivery is inferred from branches, pull requests, merges, tags and the published site"
slug: an-issue-delivery-is-inferred
priority: p0
profile: implementation
parallel_safe: true
objective: "Add the capability plan.delivery (CLI majordomus plan delivery [--json] [<id>], HTTP and MCP from the one capability declaration) that answers, for every issue, the furthest stage of none, branch, pr_open, merged, released, deployed, each with the object that proved it and when it was observed, and expose it in the site data the plan pages read."
why: "ADR 0166. Status is derived from stamps only (lib/project.awk:156-170, plan.rs derive); trace.issue, delivery.report and github-sync each read a part of the truth and nothing joins them. I2653 was merged whole by #1097 and still reads READY."
current_state: "trace.issue (capability/builtin/trace.rs, worktree/trace.rs) gives an issue's branches and merged commits; the served forge cache holds pull requests and releases; nothing answers a stage per issue."
desired_state: "plan.delivery reuses trace.issue for branches and merges, the issue edge of I1405 for pull requests named by title, branch or trailer, the served forge cache for open pull requests (unread forge reported as unread, never as none), git tag --contains for the first v* tag, and the published latest.json for deployed; scripts/generate-site-data writes site/data/generated/delivery.json from it."
scope:
  - "apps/majordomus-cli/src/capability/builtin/plan.rs"
  - "apps/majordomus-cli/src/plan"
  - "apps/majordomus-cli/src/plan.rs"
  - "apps/majordomus-cli/tests/plan_delivery.rs"
  - "scripts/generate-site-data"
  - "site/data/generated/delivery.json"
  - "docs/PLANNING.md"
  - "docs/generated"
  - "test/cases/3100_an_issue_delivery_is_inferred.sh"
depends_on: []
acceptance_criteria:
  - "An issue named by a merged pull request in a fixture repository reads merged with the merge commit, and released once a v* tag contains it"
  - "An issue with only an open pull request reads pr_open with its number; with an unread forge the answer says unread"
  - "The capability is declared once and reaches CLI, HTTP and MCP through majordomus generate"
  - "site/data/generated/delivery.json is produced by the executable and checked by generate-site-data --check"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test plan_delivery"
  - "bash test/run.sh 3100_an_issue_delivery_is_inferred"
evidence_required:
  - "delivery_stage_case"
  - "mutations_fail_the_case"
