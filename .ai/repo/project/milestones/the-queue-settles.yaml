  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/src/capability/builtin/integration.rs"
  - "apps/majordomus-cli/src/capability/builtin/worktree.rs"
  - "apps/majordomus-cli/src/worktree"
  - "apps/majordomus-cli/tests"
