id: I4317
milestone: surfaces-never-disagree
title: "The homepage's supported figure follows the recorded run's state, and /guarantees/ shows the same figure"
slug: the-homepage-supported-figure-follows-the-runs-state
priority: p1
profile: implementation
parallel_safe: true
objective: "The count of guaranteed claims a recorded run supports is shown as a count only when the run confirms it: a run of the built commit that confirms its report shows the count, a run of an older commit that nothing of its own withholds shows it marked stale with its distance, and a run whose own state is stale or unknown (failures, a dirty tree, a refused or absent report) shows no number and says 'not confirmed', in the words /evidence/ uses. One definition of that word (site/templates/partials/run-figure.html) and one figure (site/templates/partials/supported-figure.html) serve the homepage, /evidence/, /guarantees/ and /guarantees/guaranteed/; the committed ledger's count those two pages also show says it is the ledger's; scripts/ci/homepage-check `declared` holds all of them to the run."
why: "Evidence from 2026-10-28 on https://majordomus.dev (serving 81ef931): the homepage proof band prints '<dd data-supported=\"232\"><span>232</span> supported by the recorded run of 81ef931, the commit this page was built from'. /guarantees/ prints '232 declared 0 supported by a recorded run' (site/data/registry/product.json evidence.supported = 0). /evidence/ carries data-status=\"stale\" and says that CI's run of 81ef931a3e15 \"recorded failures, so it does not confirm the report below. A job that ran tests ran them in a dirty tree.\" Three pages of one deployment gave three answers to one question. Review of 3d0e11d on 2026-10-28: the homepage shows the same run's count a second time, in the evidence chain (partials/evidence-chain.html, node 'supported by the recorded run', drawn twice: button and detail panel), and nothing checks that copy; with an evidence.json that is stale, 4 commits behind, with failures recorded, replacing the chain's two 'not confirmed' values with '232' in the built index.html left `scripts/ci/homepage-check --only declared` printing 'OK declared ... confirms no count, 'not confirmed' supported, never a count'. And with a current run the homepage prints '232 supported by the recorded run of 0123456, the commit this page was built from' while /guarantees/ci-verdict/ prints 'not supported by a recorded run' and /features/matrix/ prints '0/N claims supported by a recorded run' on every row."
current_state: "site/templates/index.html sets ci_measured only from ci.available and ci.claims and ci.claims.measured, and prints ci.claims.supported without reading ci.state or ci.unconfirmed. site/templates/evidence.html does branch on ci.state == \"stale\". site/templates/guarantees.html and status.html print product.json evidence.supported, the committed ledger's verdict, as 'supported by a recorded run'. scripts/ci/homepage-check's `declared` check compares the homepage with evidence.json claims.supported and the evidence page's data-ci-supported only. After 3d0e11d the evidence chain's node and detail show the run's figure with no attribute the check reads, and site/templates/claim.html and features-matrix.html print product.json `evidence`, the committed ledger's verdict, as 'supported by a recorded run'; the check scans only /guarantees/ and /guarantees/guaranteed/."
desired_state: "partials/run-figure.html derives current, behind, unconfirmed or unmeasured from evidence.json (available, claims.measured, state, unconfirmed, behind); the homepage band, the evidence chain, /evidence/, /guarantees/ and /guarantees/guaranteed/ read it, and partials/supported-figure.html draws the figure with data-supported (the count, or the word) and data-supported-state (the run's state). A withheld figure says 'not confirmed' and names the run's commit and why, with no number. The ledger's count on /guarantees/ carries data-ledger-supported and says it counts the runs the committed ledger records. homepage-check `declared` fails when any of those pages shows a count the run's state withholds, when its state attribute is not the run's, when /evidence/ still counts, when /guarantees/ shows another figure or a second count that does not name the ledger, and when the homepage says a test proves it beside such a run. The evidence chain's node and detail values carry the same data-supported and data-supported-state, and homepage-check fails a chain value that is not the run's figure (the count, or exactly 'not confirmed' or 'unmeasured'), a state that is not the run's, a number beside a withheld word, or a missing node or detail. Every claim's page under /guarantees/ and /features/matrix/ label the committed ledger's verdict as 'the runs the committed ledger records' with data-ledger-supported, and homepage-check fails 'supported by a recorded run', 'not supported by a recorded run' or a count of it anywhere under /guarantees/ and on /features/matrix/ outside the run's figure."
scope:
  - ".ai/repo/project/issues/I4317.yaml"
  - "site/templates/partials/run-figure.html"
  - "site/templates/partials/supported-figure.html"
  - "site/templates/partials/evidence-chain.html"
  - "site/templates/index.html"
  - "site/templates/evidence.html"
  - "site/templates/guarantees.html"
  - "site/templates/status.html"
  - "site/templates/claim.html"
  - "site/templates/features-matrix.html"
  - "scripts/ci/homepage-check"
  - "test/cases/544_the_homepage_counts_declared_apart_from_supported.sh"
  - "test/cases/12_site_build.sh"
acceptance_criteria:
  - "With evidence.json recording a stale run of the built commit (failures and a dirty tree, as at 81ef931), a homepage band printing a plain '2 supported by the recorded run' fails homepage-check `declared` with a finding that names the run's state and reasons (test/cases/544)"
  - "The same run said as 'not confirmed', with no number, on the homepage, /evidence/ (data-ci-supported=\"unconfirmed\") and /guarantees/ passes; a number in those words, words that do not say 'not confirmed', a data-supported-state that is not the run's, and an evidence page that still counts each fail (test/cases/544)"
  - "A run whose state is unknown because it ran in a dirty tree, and a run behind the build that recorded failures, withhold the count the same way (test/cases/544)"
  - "/guarantees/ as served at 81ef931 (the ledger's 0 printed as 'supported by a recorded run' and no run figure) fails; a second count that does not name the committed ledger fails; a /guarantees/ or /guarantees/guaranteed/ figure that disagrees with the run fails (test/cases/544)"
  - "The real templates read partials/run-figure.html on the homepage, /evidence/, /guarantees/ and its guaranteed page, and draw partials/supported-figure.html on the homepage and both guarantees pages (test/cases/544)"
  - "With the stale run, the homepage's evidence chain showing '2' on its node and its detail fails `declared` with a finding that names the run's state and reasons; a chain whose data-supported reads the count, a number beside its 'not confirmed', a data-supported-state that is not the run's and a chain missing its evidence detail each fail; the chain said as 'not confirmed', or 'unmeasured' with no run, passes (test/cases/544)"
  - "A claim page under /guarantees/ saying 'not supported by a recorded run' or 'Supported by a recorded run', and a /features/matrix/ cell saying '0/9 claims supported by a recorded run', fail `declared`; the same pages naming the committed ledger pass; the real claim.html and features-matrix.html carry data-ledger-supported and no 'supported by a recorded run' (test/cases/544, test/cases/12)"
  - "scripts/ci/homepage-check passes `declared` over a full site build with no evidence.json, with a clean run behind the build, with a current run, and with the stale run of 81ef931"
validation:
  - "bash test/run.sh 544_the_homepage_counts_declared_apart_from_supported"
  - "bash test/run.sh 333_homepage_narrative 3105_the_homepage_states_no_present_it_does_not_read"
  - "bash test/run.sh 12_site_build"
  - "scripts/site-build && scripts/ci/homepage-check"
  - "bin/majordomus plan validate"
evidence_required:
  - test
  - ci
risk: "A run of the built commit whose only reason is one the producer adds later (a new entry of evidence.json `unconfirmed`) withholds the count until it is resolved; that is the intended reading, and /evidence/ lists the reason."
created_at: 2026-10-28
updated_at: 2026-10-28
