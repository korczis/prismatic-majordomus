id: I3830
milestone: ci-critical-path
title: "A local gate reports and CI decides: pre-commit and pre-push refuse only on integrity"
slug: a-local-gate-reports-and-ci-decides
priority: p1
profile: implementation
parallel_safe: true
objective: "Make doctor, rustdoc and a failed gate or case of scripts/ci/run-plan --before-push report their findings in the pre-commit and pre-push hooks without refusing, while derive-current (scripts/pages current), the worktree guard, the SSH permissions check, finish --check, case numbers and an uncomputable plan keep refusing; CI keeps every required check and remains the verdict. The worktree guard keeps refusing because CI checks out a fresh clone and never sees which worktree a commit came from, and rule project.worktree-topology v1 clause 6 makes the hook's refusal the enforcement."
why: "The owner's relaxation of 2026-10-21 (rule project.the-cooperation-model-is-the-owners-word v2, I3824): local gates are informative and CI holds the verdict. On 2026-10-20 a push of a rescue ref spent 3490 s in run-plan --before-push at load 70-90, and a commit hook started a cold cargo build."
current_state: ".githooks/pre-commit refuses on doctor and on the worktree guard; .githooks/pre-push refuses on rustdoc (scripts/rust-check --doc) and on any failed gate or case of scripts/ci/run-plan --before-push; rule project.a-push-runs-what-ci-would-find-first v1 says a refused gate is fixed before the push."
desired_state: "A red reporting gate prints its finding with the line 'reported, not refused: CI holds the verdict' and lets the commit or push through; the integrity checks refuse as before; rule project.a-push-runs-what-ci-would-find-first v2 states which checks refuse and that CI decides the rest."
scope:
  - ".githooks/pre-commit"
