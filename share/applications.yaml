# Where Majordomus fits, as data — and, as importantly, where it does not.
#
# An application is a context: a shape of repository, team or work. Each says what makes
# it a fit, what makes it a poor fit, and which use cases apply. `fits_when` and
# `does_not_fit_when` are both required, because a catalogue that only lists fits is
# marketing rather than a description.
#
# Every use_cases reference must resolve to an entry in share/use-cases.yaml, and the
# reverse reference must exist there too — the doctrine checks both directions, so the
# two files cannot drift into disagreeing about which applies to which.
version: 1

applications:
  - id: repository-with-authored-governance
    title: A repository whose rules were written by people
    weight: 1
    summary: There is already a CLAUDE.md, an AGENTS.md or an equivalent that somebody wrote and others follow.
    context: "The governance root is authored, not generated. It carries judgement that no tool produced and none should overwrite. Adoption usually stalls here, because the obvious integration is for the tool to own the file."
    fits_when:
      - The authored text should stay authoritative and a generated section can sit inside it
      - Enforcement already exists as git hooks, including dispatchers over a hook.d directory
      - Rules are written down and nobody can currently prove which of them run
    does_not_fit_when:
      - The repository wants a single generated instruction file and is happy to hand ownership over
      - There is no governance to supervise yet, in which case start with the shipped skeleton instead
    use_cases: [adopt-an-existing-repository, prove-a-rule-is-enforced, find-out-what-drifted]
    doctrines: [projection_integrity, enforcement_wiring]
    responsibilities: [projection, policy, doctor]

  - id: several-agents-one-repository
    title: Several workers in one repository at once
    weight: 2
    summary: More than one agent or person is changing the same repository in the same period, in worktrees or in sequence.
    context: "Each worker is individually reasonable. The cost appears between them: two tasks touching one file from different assumptions, a task record that travels with a branch into a checkout that never claimed it, a handover nobody can tell is stale."
    fits_when:
      - Work is divided by paths and it matters that the division is checked rather than agreed
      - Sessions hand work to each other and the handover has to survive the branch moving
      - You need to know which checkout a task record belongs to
    does_not_fit_when:
      - One person works one repository at a time and nothing is ever handed over
      - Coordination is the point and you want a scheduler; this tool reports overlap, it does not resolve it
    use_cases: [run-several-workers-at-once, hand-work-between-sessions]
    doctrines: [scope_integrity, state_consistency, handover_integrity]
    responsibilities: [scope, state, handover]

  - id: ci-gated-project
    title: A project where CI decides what is acceptable
    weight: 3
    summary: Integration is gated, and a claim about the code is expected to have a test and a pipeline behind it.
    context: "The team already believes that a rule without a blocking check is a suggestion. What is usually missing is the same standard applied to the rules governing the work itself, rather than only to the code."
    fits_when:
      - A completion claim should require verification that actually ran, with its exit code recorded
      - Public capability claims are expected to name their implementation and their test
      - The pipeline must fail when a declared rule stops being invoked
    does_not_fit_when:
      - Checks are advisory by policy and a red pipeline is routinely merged past
      - There is no CI, in which case the lifecycle commands still work but the last link of every chain is missing
    use_cases: [accept-or-refuse-finished-work, prove-a-rule-is-enforced]
    doctrines: [verification_integrity, doctrine_wiring_integrity]
    responsibilities: [finish, doctor]

  - id: long-running-work
    title: Work that outlives the session doing it
    weight: 4
    summary: A task spans days, several sessions, or several people, and the reasoning has to survive the gaps.
    context: "The decisions are made once and needed repeatedly. Kept in a transcript they are unfindable; kept in prose they go stale silently; kept nowhere they are made again, differently."
    fits_when:
      - Decisions need to be findable later by the task and commit that made them
      - Progress must be quotable without reading everything that led to it
      - Something unresolved should block acceptance until it is answered
    does_not_fit_when:
      - The work is a single sitting and nothing needs to be recalled afterwards
      - You want a knowledge base; this keeps operational state, not documentation
    use_cases: [hand-work-between-sessions, find-out-what-drifted, accept-or-refuse-finished-work]
    doctrines: [ledger_integrity, decision_records, blocker_resolution, task_continuity]
    responsibilities: [state, handover, finish]
