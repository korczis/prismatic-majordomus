id: I4324
milestone: a-second-adopter-is-served
title: "A finished worktree's build output is reclaimed, node_modules and target/ included, whether its branch landed by merge or by squash"
slug: finished-worktrees-give-back-their-build-output
priority: p2
profile: implementation
parallel_safe: true
objective: "Three changes to `majordomus worktree cleanup`, and one reading of doctor. First, a worktree whose branch has landed by the predicate of I4333 is cleanup-eligible, so a branch squash-merged under `landing: squash` is offered, as one merged by merge commit is today. Second, a finished worktree that cleanup keeps (its branch landed, or it is idle past the sweep window, but its status is not empty) is offered for build-output reclaim: `majordomus worktree cleanup --build-output` lists, and with `--remove` deletes, its node_modules/ and target/ directories (any depth). A directory is reclaimed only when `git check-ignore` reports it ignored and git tracks no file under it. Reclaim runs under the guards I3832 already gives the removal: no process cwd, open file or command line inside, not named by the derive lock or a live mesh claim, idle past MAJORDOMUS_WORKTREE_SWEEP_IDLE_MIN, and under every cargo lock in a target/. The listing gives each directory's size, and the answer gives the total reclaimed. The worktree, its branch and every tracked or unignored file stay. Third, the removal refusal of `worktree cleanup --remove` (apps/majordomus-cli/src/commands/worktree.rs:751-780) stops refusing a gone upstream on its own: a clean worktree whose upstream is gone and whose HEAD is an ancestor of the trunk's remote-tracking branch (git merge-base --is-ancestor, read at the moment of removal like every other reading there) is removed, because every commit it holds is on the remote through the trunk. A worktree whose HEAD carries a commit that remote trunk lacks is still refused, naming the count, whether its upstream is gone or it never had one, and so are uncommitted work, a process inside, and an ancestry git cannot decide. Fourth, doctor reads the same listing, read-only: when the build output reclaimable by `worktree cleanup --build-output`, plus the worktrees `worktree cleanup` lists as eligible, exceed a floor stated beside the check (overridable through an environment variable), it prints one `WARN disk — <n> finished worktrees hold <size> of reclaimable build output` whose remedy is `majordomus worktree cleanup --build-output` (then `--remove`). Doctor never deletes. Under the pre-commit context (MAJORDOMUS_DOCTOR_CONTEXT=commit) the reading is left out, as the per-worktree uncommitted-work reading already is, so the hook stays within its latency budget."
why: "Observed on 2026-10-28 on the shared Mac that runs OSCILLA (korczis/oscilla) worktrees under ~/dev/oscilla-wt, with majordomus 1.0.0-alpha.8. The disk filled (ENOSPC, see I4323). Much of the space was regenerable build output in finished worktrees: earlier that day the session measured about 12 GB of node_modules under oscilla-wt, and at the time of writing 23 node_modules directories totalling 2.3 GiB remain. Majordomus offered none of it. OSCILLA squash-merges, and on master 81ef931a3e1 cleanup eligibility needs merged_into_trunk == Some(true) (worktree/service.rs:835-840), which comes from `git branch --merged` (worktree/state.rs:514-536). A squash-merged branch is never in that list. For example, fix/release-scripts-refuse-unknown-flags, merged as #199 on 2026-10-18, is not among the 84 branches `git branch --merged origin/main` lists. A worktree kept for any other reason keeps all its build output. The only build-output reclaim is this repository's scripts/reap-orphans, whose build-output half removes apps/majordomus-cli/target alone (reap-orphans:37-45, :130). I3833's planned disk.prune names cargo build directories and the container cache. I3832 hardens the removal of whole merged worktrees. Neither knows node_modules or an adopter's target/, and both decide 'merged' by ancestry. Observed again by OSCILLA on 2026-10-29 (oscilla-b0, filed from oscilla-b0's upstream candidates, item 7): 199 worktrees, each with its own node_modules of about 100 MB, and the disk at 97%; the proposal was `majordomus worktree prune --merged`, removing worktrees or only their dependency directories when the branch has landed and the tree is clean, gated by doctor. The same evening `majordomus worktree cleanup --remove` in OSCILLA removed 3 worktrees and refused 90, almost all with 'its upstream origin/<branch> is gone', although each HEAD is an ancestor of the trunk and each tree is clean: the branches were merged on GitHub and the remote branch deleted, the forge's default after a merge. The refusal exists so that commits held on one disk are never removed with their worktree (I3832); a head the trunk already contains holds no such commit, so the guard refused the very worktrees cleanup exists to reclaim, while the case it is for (OSCILLA's fix/v272-* branches, with no upstream and commits the trunk lacks) is refused just as well by ancestry."
current_state: "On master 81ef931a3e1, a squash-merged worktree is never cleanup-eligible, and no command reclaims the node_modules/ or target/ of a worktree that is kept. At origin/master 51b38035a71 the reclaim's refusal returns `its upstream <name> is gone` for every gone upstream before it reads ancestry or the tree (apps/majordomus-cli/src/commands/worktree.rs:762), and the unit test an_upstream_deleted_after_the_listing_is_seen_by_the_reclaim holds that for a nominated, merged branch."
desired_state: "In a squash-landing repository, finished worktrees are offered for removal as merge-landed ones are. A finished worktree that is kept can give back its ignored node_modules/ and target/ through one named, listed-first command. A directory that is tracked, unignored, in use or recently written is never removed. A clean worktree of a branch merged on the forge and deleted there is removed by `worktree cleanup --remove`; one whose head holds commits the remote trunk lacks is not. When finished worktrees hold more reclaimable build output than the floor, doctor says so and names the command, and removes nothing."
