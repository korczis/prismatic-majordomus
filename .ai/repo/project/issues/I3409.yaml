  - "Monitor or mesh publication of matches"
  - "Changing the session domain (I3142)"
depends_on:
  - "I3408"
  - "I3411"
  - "I3433"
  - "I3431"
serves:
  - "a-change-reconciles-what-it-affects#the-slice-is-one-identity"
acceptance_criteria:
  - "A fixture episode with one prompt, a task.started naming it, its binding and a task.finished answers matched, the task (recorded), the issue, the outcome, the verify command, the criterion's evidence state and agrees"
  - "The same fixture without the prompt key answers the task labelled inferred"
  - "The fixture with the capture hook replayed 100 times and its independent ledger lines read in shuffled order answers byte-identically"
  - "The command line, loopback HTTP and MCP answers for the fixture are equal, and the live intent inspector lists the prompt identity"
  - "A request from beyond loopback is refused, and the snapshot written for publication contains no prompt identity or match"
validation:
