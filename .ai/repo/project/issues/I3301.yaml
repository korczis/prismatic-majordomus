id: I3301
milestone: a-provider-carries-the-contract-natively
title: "A Claude Code session that stops with an active task is told what the task still owes"
slug: a-stop-reports-what-is-owed
priority: p3
profile: implementation
objective: "Wire the provider's Stop event to a generated shim that reads the active task's owed obligations from the running shared server's obligations capability and reports them, never blocking a stop."
why: "Prevention instead of after-the-fact detection was the owner's ask (10-02, 10-08); the edit-time judgement exists (I2735, case 3069) and is wired by I3322; the finish-time half does not. Rebound to the new intent criterion #stop-reports-owed. It does not serve #unclaimed-edit-refused, because it does not touch the edit guard. Claude Code's Stop event fires per turn, and finish --check is a cold shell start whose owed list disagreed with finish in field report #19, so the obligations capability is the source. The acceptance criterion that named finish --check was removed for the server-backed criteria. Proposed in ADR 0214 (A provider's native extension points carry the contract as generated projections; Majordomus neither embeds nor patches the worker's runtime) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c193#1."
current_state: ".claude/settings.json wires UserPromptSubmit, SessionStart, SessionEnd, PreCompact; no Stop hook."
desired_state: "A Stop shim generated with the others; a case proves the owed list reaches the session."
scope:
  - "lib/capture.sh"
  - ".claude/hooks"
  - "share/providers.yaml"
  - "apps/majordomus-cli/src/capability/builtin/obligations.rs"
depends_on:
  - "I3304"
serves:
  - "a-provider-carries-the-contract-natively#stop-reports-owed"
acceptance_criteria:
  - "A stop with no task returns nothing and costs under the hook budget"
  - "The Stop hook never blocks; the owed list reaches the person through the Stop output's user-visible message, and the model receives it in the next UserPromptSubmit context; both behaviours are verified against the detected Claude Code version and recorded in share/providers.yaml"
  - "The owed list is read from the running shared server's obligations capability (obligation_closure), not from a cold finish --check; with no server the hook prints nothing and starts nothing"
  - "A case proves the hook's owed list matches what finish refuses on, including note-integrity (field report #19)"
validation:
  - "bash test/run.sh 54_session_lifecycle_hooks"
  - "bash test/run.sh 170_provider_lifecycle_declared"
evidence_required:
  - "case_a_stop_reports_what_is_owed"
created_at: 2026-10-18
updated_at: 2026-10-18
