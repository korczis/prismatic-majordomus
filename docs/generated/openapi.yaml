        fields:
          type: array
          items:
            "$ref": "#/components/schemas/FieldSource"
          description: "One entry per field, in the order the resolver produced them."
      required:
        - resolution
        - fields
      description: Where the values of one snapshot came from.
    EnvrcApproval:
      oneOf:
        - type: object
          properties:
            outcome:
              type: string
              const: approved
