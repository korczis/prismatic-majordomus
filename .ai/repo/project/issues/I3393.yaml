id: I3393
milestone: recovery-from-injected-faults-is-proven
title: "Each fault is injected into real coding-agent sessions on one host, and each trial's recovery and conservation reading are committed"
slug: agent-sessions-survive-injected-faults
priority: p1
profile: implementation
objective: "In a throwaway clone of the economics fixture with the pinned release installed, run the registered trials per fault kind with real agent sessions: kill a session by its exact pid mid-task, then majordomus recover closes the stranded episode and a second session resumes with handover --resolve; stop the shared server while a claim is announced and restart it; let two sessions take the same issue and the same lines, resolving through a merge of master, never a force-push. For each trial take the conservation reading and commit a T5 trial record under .ai/repo/benchmarks/trials/t5-resilience/."
why: "T5 of the owner's report of 2026-10-19 asks for recovery of real work. The lab proves the mechanism with scripted workers; this proves it with the agents the product is for."
current_state: "Case 135 proves record-store recovery and case 113_shared_server_survives_a_crash proves server restart, neither as a work-level trial."
desired_state: "The registered number of trials per kind is committed, failed ones included."
scope:
  - ".ai/repo/benchmarks"
non_scope:
  - "Killing any process the trial did not start"
  - "Faults in this repository's own checkouts"
depends_on:
  - "I3390"
  - "I3391"
serves:
  - "the-product-proves-it-pays#recovery-is-proven-for-each-injected-fault"
acceptance_criteria:
  - "Each record passes the loader with the T5 digest"
  - "Each record names the pid it killed and the session that resumed"
  - "Each record carries its conservation reading"
  - "A failed trial is committed with what stopped it"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test economics"
  - "bash test/run.sh 135_session_store_recovery"
  - "majordomus economics proof"
evidence_required:
  - "t5_agent_trials_committed"
created_at: 2026-10-19
updated_at: 2026-10-19
