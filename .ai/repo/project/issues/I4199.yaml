id: I4199
milestone: ci-critical-path
title: "A case that compiles the crate runs alone or caps cargo, so the cases beside it are never starved past their bounds"
slug: a-case-that-compiles-never-starves-its-neighbours
priority: p1
profile: implementation
parallel_safe: false
objective: "Run 77_rust_evidence alone (its doc-example and benchmark builds take every core), cap cargo at two jobs and two test threads in the two light compiling cases (76_capabilities_projections, 493_mesh_compaction_keeps_what_is_live), and hold the rule with case 4199: a case whose script runs cargo test, bench or build on a manifest declares '# majordomus-exclusive:' or carries CARGO_BUILD_JOBS on that line."
why: "Train 5 (#2403, d078fb2309e) was red twice on case 431_economics_claims_gated, killed at its 600 s bound (609 s, 608 s). Alone the case takes 51-69 s, its economics code did not change between trains 4 and 5, and the fixture it reads grew 2%. On CI it spent its whole window beside 77_rust_evidence (3434-3905 s of cargo test --doc and cargo bench --no-run) in a shard that runs four cases at a time on a four-core runner. Its time tracked its neighbour, not its own work; raising the bound would hide the starvation."
current_state: "Measured on d078fb2309e: test/run.sh runs '# majordomus-exclusive:' cases alone after the parallel phase and nothing else; 77_rust_evidence, 76_capabilities_projections and 493_mesh_compaction_keeps_what_is_live compile with cargo in the parallel phase, uncapped; no rule ties compiling to either remedy. CI durations: 77 3434-3905 s, 76 171-241 s, 493 6-142 s; 431 on train 5's shard 2 overlapped 77 for its entire 609 s."
desired_state: "No case compiles the crate in the parallel phase with every core: 77 runs alone and 76 and 493 cap cargo at two jobs, case 4199 refuses any new case that compiles uncapped, and case 431 runs beside light neighbours within its bound."
