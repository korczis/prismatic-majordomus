id: I3248
milestone: an-unmet-criterion-is-drafted-into-work
title: "A draft that drops or weakens a criterion of its intent is refused unless a recorded decision names the change"
slug: a-draft-never-weakens-its-intent
priority: p2
profile: implementation
objective: "Compare a draft against the intent revision it was drafted under; a draft whose criteria set or evidence kinds are narrower is refused naming the criterion, unless a decision record (majordomus decision) cites it."
why: "On 2026-10-09 the owner's IDD invariants included that an automatic replan must not silently weaken the original intent. Proposed in ADR 0192 (Replanning is bounded, idempotent and never weakens its intent) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c205#2."
current_state: "No draft exists, so nothing compares a draft with its intent."
desired_state: "The refusal is one finding of the draft check, with the decision id as its only escape."
scope:
  - "apps/majordomus-cli/src/intent_draft.rs"
  - "apps/majordomus-cli/tests/intent_draft.rs"
depends_on:
  - "I3247"
acceptance_criteria:
  - "A draft omitting a criterion is refused naming it"
  - "The same draft with a decision citing the criterion passes and names the decision"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
evidence_required:
  - "test_a_draft_never_weakens_its_intent"
created_at: 2026-10-18
updated_at: 2026-10-18
