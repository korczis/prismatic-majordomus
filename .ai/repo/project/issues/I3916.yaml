id: I3916
milestone: truthful-plan-surfaces
title: "The homepage counts supported claims from the run the evidence page reads, and names the revision it was recorded at"
slug: the-proof-figure-reads-the-recorded-run
priority: p0
profile: implementation
parallel_safe: false
objective: "The homepage's proof figure (data-supported, site/templates/index.html:454-460) reads the same recorded evidence the evidence page reads (site/data/evidence.json from scripts/pages evidence: the nearest complete ancestor run, with its state, commit and how far behind it is), not the committed ledger .ai/repo/evidence/ledger.json. It shows the count with the revision it was recorded at and says when that revision is behind the one the page was built from; it never shows a bare 0 for a revision whose run is not recorded yet."
why: "On 2026-10-22 an outside reviewer read the homepage as 232 guarantees declared and 0 proven: for a product whose thesis is prove it, a suicidal number on the front page. The figure is 0 because site.rs:1095 claim_evidence reads the committed ledger, whose newest execution is from 2026-09-17, while the CI runs that prove the claims reach only site/data/evidence.json, read by the evidence page alone (evidence.html:13); the deploy does not regenerate product.json (pages.yml ~482)."
current_state: "index.html:454-460 renders data-supported from site/data/registry/product.json model.evidence.supported, generated by site.rs:1095-1312 from the committed ledger (14 executions, newest 2026-09-17); evidence.json carries state current/stale/unknown, commit and behind (scripts/pages:846-1008); scripts/ci/homepage-check declared and cases 544 and 502 pin the figure."
desired_state: "The homepage and the evidence page read one recorded run and show the same supported count, with the revision it was recorded at and its distance from the built one; with no recorded run the figure says so in words, never 0; cases 544 and 502 and homepage-check hold it."
scope:
  - "site/templates/index.html"
