  - "test/cases/3049_a_second_workers_record_lands_on_the_first_workers_task.sh"
non_scope:
  - "The shell writers, which I0703 covered and I4292 completes"
  - "Verifying who a worker is: the identity stays the one the session supplies (ADR 0164)"
depends_on: []
acceptance_criteria:
  - "No Rust writer of a durable record reads the session pointer to name a session"
  - "With two episodes open in one checkout, a plan transition, a continuity publish and a reasoning record each name the calling episode, and none relates a task the other episode opened"
  - "An MCP plan transition names the episode of the connection that made it"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib ledger::"
  - "bash test/run.sh 3049"
evidence_required:
  - rust_attribution_two_episodes
  - suite
risk: "Three Rust writers share the pointer read; fixing ledger.rs and not continuity or reasoning leaves a defect that looks fixed."
