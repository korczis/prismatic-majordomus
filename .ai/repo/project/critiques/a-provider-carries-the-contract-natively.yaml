intent: a-provider-carries-the-contract-natively
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author, and reconciled with the plan by a third after the 2026-10-18 verification. Read only: nothing was run. Disposition: Accept with required changes: 7 of 11 findings are blocking. After the 2026-10-18 verification 8 are planned, 1 is rejected (carried by I3157 under repository-automation-is-typed) and 2 are open only until the issues split from I3300 for the guard wiring and its rollout receive their ids at merge. The intent and serves edits the amendments could not express are applied in the plan."
findings:
  - id: edit-guard-is-not-wired
    class: unproven_assumption
    subject: "a-provider-carries-the-contract-natively#unclaimed-edit-refused"
    finding: "The criterion is cited as already proven by test/cases/3069_an_edit_no_claim_covers_is_refused.sh, but nothing wires the guard into Claude Code. .claude/settings.json on master and in the worktree only wires UserPromptSubmit, SessionStart, SessionEnd and PreCompact. No PreToolUse entry exists anywhere in lib/, scripts/, share/ or apps/majordomus-cli/src, and capture install never writes one, because mj_lifecycle_kinds does not include the guard. docs/MESH.md:466-470 says \"The hook is wired in the provider's configuration\", which is false. Case 3069 pipes JSON straight into `guard hook` and into the shim (sections 1-5), so it never shows that Claude Code calls the shim. On the plan's own evidence the criterion would read as satisfied while every Claude Code edit goes through unjudged, even though .ai/repo/policy.yaml:141 sets edits_require_claim: true. The mj_lifecycle_state wiring check (lib/capture.sh:2073) does not cover the guard either, so doctor stays silent. No issue in the plan wires it: I3300 mentions the edit-guard hook only as plugin content and serves one-plugin. The fix: add an issue, or an I3300 acceptance criterion, that has capture install generate the Edit|Write|MultiEdit|NotebookEdit PreToolUse entry, extends the lifecycle wiring check to it, and repoints the criterion's ref at a case that reads the generated provider configuration. Bash-tool writes still bypass the guard (case 3069 asserts Bash is let through). The owner raised this hook-bypass path in c193#1, and the criterion should either say so or name the CI backstop."
    blocking: true
    resolution:
      state: planned
      issue: I3322
      because: "Planned in the issue split from I3300 by the 2026-10-18 verification (one worker, one issue, one pull request): plan key prv-23a, whose id is allocated when the plan is merged; the state becomes planned with that id then. Confirmed: the worktree's .claude/settings.json has no PreToolUse entry, though .claude/hooks/majordomus-edit-guard exists. That issue has capture install write the PreToolUse entry, adds the guard to the lifecycle wiring check so doctor reports it unwired, and fixes docs/MESH.md in the same change; it serves the new #the-guard-is-wired. #unclaimed-edit-refused is served by the follow-on refusal issue (plan key prv-23b), its ref is repointed from case 3069 to a case that pipes a payload through the command the generated .claude/settings.json names, and its wording says Bash-tool writes are not judged at edit time and are caught by the task scope at check, finish and the pre-push hook. I3300 depends on the wiring issue and packages the guard once it is wired."
  - id: serves-do-not-make-criteria-true
    class: insufficient_work
    subject: "a-provider-carries-the-contract-natively"
    finding: "Most issues serve a criterion they cannot make true, so the coverage gate would show all three criteria covered when only I3300 and I3303 actually work toward theirs. I3301 (Stop report) and I3304 (prompt capture budget) both serve #unclaimed-edit-refused, but neither touches the edit guard. I3305 and I3306 (external scripted capabilities), I3307 (tools/list byte budget) and I3308 (Zed schema associations) all serve #one-plugin, but none puts anything into a Claude Code plugin or into doctor's drift report. Each issue should either serve a criterion that states what it delivers, or move to the intent it extends: I3304 to development-runtime (its own why says so), I3307 to mcp-transports-are-reliable (also stated in its why), I3305 and I3306 to repository-automation-is-typed."
    blocking: true
    resolution:
      state: planned
      issue: I3301
      because: "Applied in the plan on 2026-10-18. Milestones development-runtime and mcp-transports-are-reliable belong to no intent, so moving I3304 or I3307 there would leave them unbound under intent-bound-work; the intent instead gains criteria each issue can make true: #stop-reports-owed (I3301), #hooks-within-budget (I3304, since the generated Stop and edit-guard hooks run on every turn and edit), #mcp-listing-bounded (I3307) and #editor-validates-the-layer (I3308). #one-plugin is split: I3300 serves #one-plugin and I3302 serves the doctor half, #installed-extension-drift-reported. I3305 and I3306 serve repository-automation-is-typed#scripted-capability-runs on that intent's milestone (see external-capability-duplicates-i3157). The why of each issue records its binding."
  - id: stop-and-gemini-have-no-criterion
    class: missed_requirement
    subject: "a-provider-carries-the-contract-natively"
    finding: "The statement promises two things no criterion checks. First, 'a session that stops owing work is told so': I3301 does that work but has no criterion to serve, which is why it is mis-bound to #unclaimed-edit-refused. Second, 'then Codex and Gemini': Gemini has no criterion, no issue and no non_goal, although share/providers.yaml:147-154 already records verified Gemini hook evidence and two caveats an adapter must handle. Add a criterion such as #stop-reports-owed with a planned case for I3301. Then either add a Gemini criterion and issue, or move Gemini to non_goals or a later intent, so the statement promises only what the criteria check."
    blocking: true
    resolution:
      state: planned
      issue: I3301
      because: "Applied in the plan on 2026-10-18: the intent gains #stop-reports-owed ('A Claude Code session that ends a turn with an active task that still owes work is told what it owes ... without its stop being blocked'), which I3301 serves. Gemini is in the intent's non_goals as 'A Gemini adapter, deferred until the Codex adapter (I3303) settles the adapter shape; the verified Gemini evidence and the SessionEnd and PreCompress caveats in share/providers.yaml stay', and the statement no longer names Gemini. I3303 records Gemini as non_scope so that no adapter gets built by accident."
  - id: external-capability-duplicates-i3157
    class: unnecessary_work
    subject: "I3305"
    finding: "I3305 and I3306 duplicate I3157 from the same promotion batch. I3157 (repository-automation-is-typed, depends on I1801) already proves an adopter-declared scripted capability reaches CLI, MCP and OpenAPI, with its origin, effect and exposure ceiling, and that an over-ceiling call is refused. That is I3305's 'registers with its origin' plus the refusal half of I3306. The rest of I3306 (default-deny, time bound) overlaps I1800, the sandboxed engine (READY). Both issues also contradict the intent: ADR 0214 and the non_goals rule out a plugin system of Majordomus's own, and these are about Majordomus loading code, not a client carrying the contract. Merge the missing parts (install location outside the tree, grants, quarantine) into I3157 or I1800 under repository-automation-is-typed, and drop both issues from this intent."
    blocking: true
    resolution:
      state: rejected
      because: "The work is carried by I3157 under another intent, so nothing is planned here. Confirmed: I3157 is on milestone repository-automation-is-typed and serves repository-automation-is-typed#scripted-capability-runs. Applied in the plan on 2026-10-18: I3305 and I3306 leave this intent, serve repository-automation-is-typed#scripted-capability-runs on that intent's milestone, depend on I3157, and are reduced to what I3157 and I1800 do not cover: I3305 to an install location outside the tree, I3306 to explicit grants, quarantine and the audit record. The intent's non_goals now say that loading code from outside the repository belongs to repository-automation-is-typed."
  - id: plugin-install-path-unproven
    class: unproven_assumption
    subject: "I3300"
    finding: "I3300 assumes a generated plugin can be installed into a project with no marketplace, which both it and the intent rule out. Today's mods are not installed as plugins. share/mods/claude-code/majordomus-brief/README.md says capture install copies them to .claude/skills/<name> because 'Claude Code loads a mod from .claude/skills/<name> by itself, so no settings file is changed'. A Claude Code plugin with hooks and an MCP server is normally enabled through a marketplace entry (extraKnownMarketplaces/enabledPlugins) or --plugin-dir. That clashes with the non_scope 'A marketplace' and possibly with ADR 0140/0145, which forbid projecting personal settings. Before generating anything, record which install mechanism, verified against which Claude Code version, gives zero-config loading in a project. Today editors/claude.rs:25 hard-codes VERIFIED_AGAINST = \"Claude Code 2.1\", which is not detection. If no such mechanism exists, the 'one plugin' criterion has to change."
    blocking: true
    resolution:
      state: planned
      issue: I3300
      because: "I3300 now opens with a verification step that comes before any generation. The install mechanism that loads the plugin with no configuration by the person (for example, a repo-local directory marketplace plus enabledPlugins in the tracked project .claude/settings.json, which is shared project configuration and not a personal setting under ADR 0145) is recorded in share/providers.yaml with vendor evidence, its date and the detected Claude Code version. If no such mechanism exists, I3300 stops and #one-plugin is reworded to name the projection that does load: per-piece projection under one generated manifest. The non_scope is sharpened. A local marketplace manifest in the repository is a generated projection, while hosting or operating a marketplace stays out of scope (ADR 0214)."
  - id: plugin-double-wires-hooks-and-mcp
    class: regression_risk
    subject: "I3300"
    finding: "I3300's desired state says the plugin replaces the hand-assembled pieces, but no acceptance criterion requires removing them. If the plugin's hooks and MCP entry are installed alongside the existing .claude/settings.json hooks, the .claude/skills/majordomus-{brief,handover} copies and the root .mcp.json, then every prompt is captured twice, every SessionStart opens two episodes and runs the brief twice, and the client connects two majordomus MCP servers. Two servers double the 192-tool listing that I3307 is trying to bound. capture install would also keep rewriting the settings.json hooks (lib/capture.sh:2196-2205). Add criteria for migration and uninstall: an installed plugin makes capture install drop its own settings and skill copies, doctor flags a double wiring, and a fixture shows exactly one capture record and one episode per event."
    blocking: false
    resolution:
      state: planned
      issue: I3300
      because: "I3300 gains migration and uninstall criteria: once the plugin is installed, capture install drops its settings.json hooks, skill copies and duplicate MCP entry; doctor reports double wiring; and a fixture shows one capture record and one episode per event. Scope adds lib/capture.sh, lib/doctor.sh and .mcp.json."
  - id: stop-hook-semantics-and-source
    class: unproven_assumption
    subject: "I3301"
    finding: "Three parts of I3301's design are unverified or contradicted. (1) Claude Code's Stop event fires at the end of every assistant turn, not when the session ends. The model only reads a Stop hook's message if the hook blocks, which continues the turn, so 'returning the owed obligations as the hook's message and never blocking' either reaches only the person or contradicts itself. Verify against the client version and state which one is meant. (2) finish --check is the shell command (lib/finish.sh:25). Running it on every turn is the same cold-start cost I3304 is trying to remove from hooks. (3) The adopter field report on the board (p11, item #19) says finish --check reports 0 failing while finish refuses on note-integrity, so its owed list cannot be trusted. Read the owed list from the running server's obligations capability (the obligation_closure tool, 'What this task still owes') instead, and fix or cite the #19 discrepancy."
    blocking: true
    resolution:
      state: planned
      issue: I3301
      because: "I3301 is respecified on three points. (1) Stop fires per turn, so the hook never blocks: it reaches the person through the Stop output's user-visible message, and the model learns the owed list from the next UserPromptSubmit context. Both behaviours are verified against the detected Claude Code version and recorded in share/providers.yaml. (2) The owed list comes from the running shared server's obligations capability (apps/majordomus-cli/src/capability/builtin/obligations.rs, obligation_closure), not from a cold finish --check. With no server, the hook prints nothing and does not start one. (3) A case proves that the hook's owed list matches what finish refuses on, including note-integrity, which settles or reproduces field report #19. The acceptance criterion that named finish --check is removed from I3301."
  - id: codex-guard-cannot-read-codex-payload
    class: unproven_assumption
    subject: "I3303"
    finding: "I3303 assumes `guard hook --provider codex` can judge a Codex edit. guard.rs:491-510 reads only Claude Code's tool_input.file_path and tool_input.notebook_path. Codex writes through apply_patch, whose patch text can name several paths, and through shell. A Codex payload would therefore look like 'a tool that writes no file' and be let through, which case 3069 section 4 asserts is the intended behaviour. The scope also leaves out apps/majordomus-cli/src/guard.rs. Separately, the Codex evidence in share/providers.yaml (lines 144-146) cites SessionStart, SessionEnd, PreCompact, PostCompact and UserPromptSubmit, but no pre-tool event. Record dated vendor evidence for a Codex pre-tool hook and its payload shape before building. Add guard.rs, with a parser that handles multi-path patches, to the scope, or narrow #codex-parity to episodes only."
    blocking: true
    resolution:
      state: planned
      issue: I3303
      because: "Confirmed: guard.rs reads only file_path and notebook_path, and the Codex evidence in providers.yaml names no pre-tool event. I3303 first records dated vendor evidence of a Codex pre-tool hook and its payload. If one exists, guard.rs gains a Codex parser that judges every path an apply_patch names and refuses the whole patch when any path is unclaimed. If none exists, I3303 delivers episodes only. #codex-parity in the plan now states both outcomes: refusal where share/providers.yaml evidences a Codex pre-tool hook, and otherwise Codex edits caught at check, finish and pre-push. Scope adds apps/majordomus-cli/src/guard.rs and apps/majordomus-cli/src/capability/builtin/guard.rs."
  - id: extension-drift-already-partly-exists
    class: unproven_assumption
    subject: "I3302"
    finding: "I3302's current_state, 'No comparison exists between generated and installed extensions', is wrong. mj_capture_mod_same (lib/capture.sh:2304) compares each installed mod with its source and capture install rewrites a drifted copy (2336-2350, the 'Written by' marker under ADR 0123). Shims are compared with mj_capture_shim_body (2263, 2364). mj_lifecycle_state (2073) already reports the wiring state of each provider's hooks, and doctor fails a hand-edited projection (lib/doctor.sh:1199). I3302 should extend these checks with digests, versions and declared permissions, unknown active mods and the edit-guard shim, rather than build a second comparison. Its objective also promises a /ui report, but its scope has no ui module or test."
    blocking: false
    resolution:
      state: planned
      issue: I3302
      because: "I3302 is restated as an extension of mj_capture_mod_same, mj_capture_shim_body, mj_lifecycle_state and doctor's projection check, with digests, versions, declared permissions, unknown active mods and the edit-guard shim, and its current_state is corrected. It builds no second comparison. The /ui report enters scope through apps/majordomus-cli/src/ui and a case. It serves #installed-extension-drift-reported."
  - id: no-surface-or-shippable-proof
    class: delivery_verification
    subject: "a-provider-carries-the-contract-natively#one-plugin"
    finding: "#one-plugin and #codex-parity both cite `majordomus intent explain a-provider-carries-the-contract-natively`, the intent's own explain output, as command evidence. No intent on master uses this 'planned proof' pattern, and it proves nothing. Allocate real case numbers ('35xx' is not one) and cite them. 'Installing it yields working skills, hooks and MCP' needs a real claude binary, which existing cases run only opt-in (test/cases/2980 requires MJ_CLAUDE_E2E=1), and Codex parity needs a codex binary in the same way. State which part a CI-runnable structural case proves, and which part is an opt-in end-to-end case run against a dated client version. The owner's ask (c261#0: '... reports in claude and on web as well') also has no surface: no issue puts provider wiring state, plugin provenance or the guard's refusals on /ui, /cockpit, site or docs/EDITORS.md. docs/MESH.md:466 needs correcting in the same change that wires the guard."
    blocking: false
    resolution:
      state: planned
      issue: I3300
      because: "No criterion cites a placeholder case number any more: each names the proof its issue adds, and the case number is taken from scripts/case-numbers and announced on the board when the issue starts. The proofs are split into two kinds: a CI-runnable structural case that reads the generated plugin and provider configuration, and an opt-in end-to-end case gated like case 2980, run against a dated client version. I3300 and I3303 each carry this criterion. The surface ask is carried by I3302's /ui report and by I3300's docs/EDITORS.md update; docs/MESH.md is corrected by the guard-wiring issue split from I3300."
  - id: wiring-guard-refuses-every-peer
    class: regression_risk
    subject: "I3300"
    finding: "Wiring the edit guard in this repository turns enforcement on for every session the moment the change lands, because .ai/repo/policy.yaml:141 has edits_require_claim: true and the board shows a dozen concurrent Claude Code and Codex peers, most editing without a live mesh claim or an active-task scope in their own checkout. The plan has no rollout step: no announcement, no claim-coverage check of the active peers, and no dry or advisory mode before refusals start. The plugin or wiring change needs an acceptance criterion that names how live sessions are moved onto claims first."
    blocking: false
    resolution:
      state: planned
      issue: I3322
      because: "Planned in the issue split from I3300 by the 2026-10-18 verification (one worker, one issue, one pull request): plan key prv-23a, whose id is allocated when the plan is merged; the state becomes planned with that id then. That issue lands the guard in an advisory mode declared in policy, which reports an unclaimed edit without refusing it, announces the change on the board and the mesh, and adds a claim-coverage report of live peers editing without a claim. Refusal turns on in a separate later issue (plan key prv-23b), only with a dated report that shows no live unclaimed editor."
