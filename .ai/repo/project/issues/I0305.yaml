id: I0305
milestone: execution-telemetry
title: Publish the telemetry claim and record what remains unmeasured
slug: publish-telemetry-claim
priority: p3
profile: implementation
parallel_safe: false
objective: "Move the telemetry claim to guaranteed for the providers that report honestly, name the implementation and the case, and state in the economics document which providers report nothing and what that costs the analysis."
why: "The value of this milestone is as much in what it refuses to claim as in what it measures. A reader has to be able to see which sessions are measured and which are not before believing any number built on top."
current_state: "The claim is planned and the economics document claims nothing on purpose."
desired_state: "The claim is guaranteed with its narrow scope stated, and the economics document says which providers are measured, which are not, and what follows from that."
scope:
  - docs
  - site/data/generated
non_scope:
  - Any figure derived from the measurements
depends_on:
  - I0304
acceptance_criteria:
  - The claim cites an implementation path and a test path that both exist
  - The economics document names the measured and unmeasured cases
  - The generated site data regenerates with no stale file
validation:
  - scripts/generate-site-data --check
  - bash test/run.sh
evidence_required:
  - docs_build
risk: "Publishing measurement invites treating partial coverage as full coverage; the coverage statement has to sit next to the claim, not in a footnote."
created_at: 2026-09-04
updated_at: 2026-09-04
