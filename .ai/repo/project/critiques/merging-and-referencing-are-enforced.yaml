    blocking: true
    resolution:
      state: planned
      issue: I3970
      because: "I3970 now names a separate workflow on pull_request_target that checks out the base only, moves the rule to version 2 and amends github.yaml so only the pull request's own fields may be written, reads the trunk's records alone, projects a head-only record as a plain id with no priority or milestone, and extends case 1097; the rule, github.yaml and case 1097 are in its scope and validation."
