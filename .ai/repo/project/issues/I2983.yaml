id: I2983
milestone: peer-blackboard
title: "/ui/peers shows the blackboard and is read again when it changes"
slug: the-peers-screen-follows-the-blackboard
priority: p1
profile: implementation
parallel_safe: false
serves:
  - the-peer-blackboard-is-one-reality#the-screen-follows
objective: "Add the Peers screen to the UI: every worker of the repository with where it works, its client, whether it is here, its intent and its claims; the claims that meet; the reviews and handovers that wait; the typed relations; and every source with its state. It renders blackboard.snapshot through the same shared read the live channel's followers take (http::follow::blackboard), so a screen read after a change frame is the blackboard at that change. share/ui/live.js follows /events?follow=blackboard&frames=snapshot through the one socket client (share/ui/socket.js, a byte copy of share/cockpit/socket.js kept by scripts/cockpit-assets), asks ui.js to read the screen again on a change or a reconnection, and keeps a state line that says live, reconnecting or read on a timer. The minute refresh runs only while the channel is not live. The published UI snapshot withholds the screen until its public-safe form exists (I2984)."
why: "Who works on what is on the blackboard and on no UI screen; /cockpit/peers reads peers.list, which knows one board's machines and nothing of the mesh."
current_state: "No /ui screen renders blackboard.snapshot; /ui screens are refreshed every minute and never pushed."
desired_state: "An announcement reaches an open /ui/peers within a second of the change on this machine, with the screen saying it is live."
scope:
  - "apps/majordomus-cli/src/ui/peers.rs"
