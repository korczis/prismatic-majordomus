id: I4668
milestone: a-session-proceeds-through-the-mesh
title: "doctor names every heavy process group that no session, claim, run record or declared service accounts for, with the inbound SSH peer that started it, and the owner pauses one through a governed command"
slug: an-unattributed-heavy-process-is-named
priority: p1
profile: implementation
parallel_safe: true
objective: "One capability sweeps the local process table and groups heavy work by process group. A group is heavy when its summed CPU or resident memory stays above a policy threshold (machine.heavy_process: cpu_percent, rss_mib, sustained_seconds, min_members) for the declared interval. Each heavy group is attributed from facts only, in this order: a live session's process tree (the provider registry who.rs already reads), a mesh claim or board row that records the pid or group, an offload run record or the owner variables in the environment, and a declared service (machine.services of I4622 once it exists). A group none of them accounts for is unattributed. When its parent chain reaches an SSH server's per-connection process, the report names the inbound peer address and port, the remote user and the connection's start time. Otherwise it names the chain up to init. `majordomus mesh who --unattributed` lists every unattributed heavy group with its process group, leader, member count, summed CPU and memory, start time, chain and peer. doctor reports one WARN that counts them and names that command. `majordomus machine pause <pgid> --because <text>` sends SIGSTOP to the group, and `machine resume <pgid>` sends SIGCONT. Each one is refused unless an owner approval names that group and its leader's start time. Each one writes a ledger line with the attribution, the approval and the reason. Nothing is killed, and no file or permission is changed."
why: "Observed from 2026-11-19 to 2026-11-22 on a shared workstation, during a long run with many sessions in an adopter repository. About 32 CPU-heavy processes, re-parented to init, held the load at 50-86 and swap at its limit for three days. The disk floor refused pushes, the growing swap filled the volume, and compiles were killed. Every session on the mesh said it did not own the work. The driver ran on another machine and started the processes over non-interactive inbound SSH sessions, so no local process tree led to a session, a claim or a run record. Finding the owner took hours of manual forensics: the per-connection SSH server parents, the peer's LAN address, and a hosts-file convention that mapped the address to a machine. The pause that stopped it removed the execute bit from the workload's binary. That change was unrecorded and unannounced, and the remote driver's next launch would have failed without saying why. The tool already traces a process to its session when a session started it (I3956). It has no answer for heavy work that no session started."
current_state: "Measured at origin/master d02c59d447c on 2026-11-22. apps/majordomus-cli/src/mesh/who.rs (I3956, slices 1 and 2) answers one subject at a time: a pid, a run tag, an issue or a path. It walks the pid's parent chain, reads its environment's owner variables and joins the provider's session registry, the run records, the board and the mesh claims. It marks a process a leftover only when its parent is init and its working directory is gone. A process whose directory still exists and whose chain ends in an SSH server's connection process is answered `known: false`, with no peer named. The crate reads no SSH connection, and nothing in it or in lib/ contains `sshd`. Nothing sweeps the process table. lib/doctor.sh reads no load, swap or process group. scripts/reap-orphans reaps only majordomus serve and mcp processes, matched by executable path. I3956 (BLOCKED) refuses an untraced remote run that the tool itself starts. I4622 (open) declares and supervises services a session starts. Neither one reports work that entered the machine from outside both, and no command pauses a process group with a record."
desired_state: "A session that finds the machine loaded asks one command and gets back every heavy process group the mesh cannot account for, each with the address that started it. doctor counts them. Pausing one is a recorded, owner-approved SIGSTOP of exactly that group, which a resume undoes. A chmod, a kill or a name match is never the mechanism."
scope:
