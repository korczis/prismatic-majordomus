id: I1954
milestone: test-evidence
title: Every runner reaches the ledger, through the recording branch
slug: every-runner-reaches-the-ledger
priority: p1
profile: implementation
parallel_safe: false
objective: "Wire the trunk's runs to the recording branch of ADR 0080 and every runner to a measured report, so that a merge to master is followed by one recording pull request that changes only the ledger (ADR 0087 decisions 1, 6 and 16)."
why: "CI runs every test on every merge and keeps none of it in the tracked ledger. Until this lands, the ledger holds only local rows and the site renders mostly not_run."
current_state: "No workflow records CI's executions into the tracked ledger. The suite runner's report has no reason column and no measurement, and the crate and coverage runners emit no provenance."
desired_state: "A trunk run, after a merge and on a schedule, records with --origin ci and with the provenance evidence stamp measured, and opens at most one recording pull request whose diff is the ledger, by a token whose events start the required workflow; a trunk commit that the ledger committed in it already covers (the newest ci execution's commit is contained in it and nothing but the ledger changed since), as the landing of a recording pull request on the commit it measured is, starts no recording, while a ledger-only commit on top of a merge no landed recording covers is recorded; every runner's report carries its revision and the reason a case did not pass."
scope:
  - .github/workflows/validate.yml
  - scripts/ci/evidence-collect
  - scripts/rust-check
  - scripts/rust-coverage
  - scripts/shell-coverage
  - test/run.sh
  - test/cases/94_ci_plan.sh
  - test/cases/357_ci_records_evidence.sh
  - test/cases/510_ci_evidence_reaches_the_ledger_through_a_recording_branch.sh
  - test/cases/511_every_runner_report_carries_its_revision_and_reason.sh
  - .ai/repo/automation/inventory.jsonl
  - docs/EVIDENCE.md
  - docs/COVERAGE.md
  - docs/CLAIMS.yaml
  - docs/claims
  - .ai/repo/features/evidence.md
  - .ai/repo/features/ci.md
  - .ai/repo/features/coverage.md
non_scope:
  - "Committing the ledger from a validating run"
  - "New shell automation (ADR 0069)"
  - "Making the required ci check depend on the evidence job"
depends_on:
  - I1951
acceptance_criteria:
  - "A trunk run's executions reach the tracked ledger only through a recording pull request whose diff is the ledger alone, and at most one such pull request is open"
  - "The recording pull request starts the required workflow, by the token the owner chose"
  - "A covered trunk commit starts no recording, whether a merge or the schedule started its run: the newest ci execution in the ledger committed in it names a commit it contains, and nothing but .ai/repo/evidence/ledger.json changed since, so that landing a recording pull request on the commit it measured opens no further one (ADR 0087 decision 1); asserted by case 510"
  - "A ledger-only commit that lands on top of a merge no landed recording covers is recorded, by the run its landing starts and by the schedule: case 510 lands the recording of one merge on top of a later merge whose recording was lost, and asserts that the next run records instead of stopping"
  - "A recording job that cannot compare the ledger's commit with the trunk commit fails and says why, and neither records nor stops as covered; asserted by case 510"
  - "Every runner's report carries the commit and tree its run measured, and a case that did not pass carries its reason"
validation:
  - bash test/run.sh 510_ci_evidence_reaches_the_ledger_through_a_recording_branch
  - bash test/run.sh 511_every_runner_report_carries_its_revision_and_reason
  - bash test/run.sh 357_ci_records_evidence
  - bash test/run.sh 94_ci_plan
evidence_required:
  - recording_branch_wired
  - recording_stops_at_a_covered_commit
  - recording_resumes_over_an_unrecorded_merge
  - runner_reports_measured
risk: "It also waits on PR #629 (the skip word), PR #587 (new shell refused), PR #566 and PR #355, and on the owner's choice of token (ADR 0087 decision 16). Each recording costs a full suite run."
created_at: 2026-09-26
updated_at: 2026-09-26
