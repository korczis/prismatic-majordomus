# The queue's state, measured on a clock rather than when somebody remembers to ask.
# The model is .ai/repo/ci/queue.yaml; test/cases/350_the_queue_measures_itself.sh holds the
# two to each other and holds this job to observing rather than merging.
name: queue
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# actions read: the supervisor's liveness is read from its runs' jobs (I3903)
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  measure:
    runs-on: ubuntu-latest
    # per job, not per workflow: a liveness lane waiting for a runner must not hold the next
    # measurement behind it
    concurrency:
      group: queue
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # the whole history: `majordomus prs refresh` fetches each pull request's head and asks
      # git what merging it into master would do, which a shallow clone cannot answer. Its
      # own bound, under the job's: a fetch of every head and tag that stalls fails by name
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0

      # the driver GitHub cannot run is the entire reason this measurement exists; the
      # contract is the one scripts/ci/core-check installs
      - name: the derived merge driver
        run: |
          git config merge.derived.name "derived artifacts: resolve to ours, regenerate before committing"
          git config merge.derived.driver "scripts/merge-derived %O %A %B %P"

      - uses: ./.github/actions/setup-rust

      - name: the executable that observes the queue
        run: cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml

      # `refresh` and `status` only: they observe and render. `drain` and `cleanup --apply`
      # are the commands that act, and this job names neither.
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mj="$PWD/apps/majordomus-cli/target/debug/majordomus"
          rc=0
          "$mj" prs refresh > "$RUNNER_TEMP/queue.txt" 2>&1 || rc=$?
          if [ "$rc" = 0 ]; then
            "$mj" prs status >> "$RUNNER_TEMP/queue.txt" 2>&1 || rc=$?
          fi
          sed 's/^/    /' "$RUNNER_TEMP/queue.txt"
          {
            printf '## The queue, measured here\n\n```\n'
            cat "$RUNNER_TEMP/queue.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 10 is a fact about the queue (a stale observation, a protection this token cannot
          # read) and not a fault of this measurement. 12 is the measurement failing, and a
          # report nobody can trust is worse than none, so that is the one that fails the job.
          [ "$rc" != 12 ] || { echo "queue: the measurement could not be made" >&2; exit 12; }
          [ "$rc" = 0 ] || [ "$rc" = 10 ] || { echo "queue: majordomus prs exited $rc" >&2; exit "$rc"; }

  # I3903: the supervisor cannot say that it stopped, so this clock says it for it. A dry run of
  # `prs supervise` (no apply: this job never acts) reports its newest success, and one older
  # than thirty minutes, or none, is `supervise_stale`: nothing then retires a stuck or duplicate
  # run, and that fails this job.
  #
  # It must not wait where the supervisor waits. On lundra, which validate's jobs do not fill, it
  # reports a supervisor that runs there and fails; GitHub-hosted, it reports a lundra with no
  # runner online. It compiles nothing, as the supervisor does not. What no job in Actions can
  # report is lundra offline while the hosted pool is saturated: both lanes then queue. That is
  # read from outside Actions, by `majordomus prs supervise --format json` on any machine of the
  # mesh (`.liveness.finding`, docs/CI.md).
  alive:
    name: the supervisor is alive (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: lundra
            runner: [self-hosted, lundra]
          - lane: hosted
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: queue-alive-${{ matrix.lane }}
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      # the model is all it reads of the tree
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .ai

      - name: the executable that reads the supervisor, prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tool in gh jq; do
            command -v "$tool" >/dev/null || { echo "queue: no $tool on this runner" >&2; exit 12; }
          done
          dir="$RUNNER_TEMP/mj"
          mkdir -p "$dir"
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow validate.yml --branch master \
              --event push --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name majordomus-exe --dir "$dir" 2>/dev/null \
                && [ -s "$dir/majordomus" ] && chmod +x "$dir/majordomus" \
                && "$dir/majordomus" prs supervise --help >/dev/null 2>&1; then
              break
            fi
            rm -rf "$dir" && mkdir -p "$dir"
          done
          if [ -x "$dir/majordomus" ]; then
            echo "MJ=$dir/majordomus" >> "$GITHUB_ENV"
          else
            curl -fsSL --max-time 60 https://majordomus.dev/install.sh \
              | sh -s -- --install-dir "$RUNNER_TEMP/bin" --prefix "$RUNNER_TEMP/opt"
            if ! "$RUNNER_TEMP/bin/majordomus" prs supervise --help >/dev/null 2>&1; then
              echo "::error::queue: no executable here has prs supervise (no master majordomus-exe kept, and the release $("$RUNNER_TEMP/bin/majordomus" --version 2>/dev/null) predates it)" >&2
              exit 12
            fi
            echo "MJ=$RUNNER_TEMP/bin/majordomus" >> "$GITHUB_ENV"
          fi

      - name: the supervisor is alive
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
        run: |
          mj="$MJ"
          rc=0
          # a success within the thirty minutes is all it needs to read; only without one does
          # the dry run observe the runs
          "$mj" prs supervise --format json --unless-supervised-within 30 \
            > "$RUNNER_TEMP/supervise.json" || rc=$?
          [ "$rc" != 12 ] || { echo "queue: the supervisor's runs could not be read" >&2; exit 12; }
          finding="$(jq -r '.liveness.finding // empty' "$RUNNER_TEMP/supervise.json")"
          detail="$(jq -r '.liveness.detail // empty' "$RUNNER_TEMP/supervise.json")"
          {
            printf '## The supervisor, read from %s\n\n' "$LANE"
            if [ -n "$finding" ]; then printf '%s: %s\n' "$finding" "$detail"; else printf 'alive\n'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$finding" ] || { echo "queue: $finding: $detail" >&2; exit 1; }
          echo "the supervisor is alive: $(jq -r '.liveness.newest_success_at' "$RUNNER_TEMP/supervise.json")"
