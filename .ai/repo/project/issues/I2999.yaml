id: I2999
milestone: peer-blackboard
title: "From /ui/peers an operator answers a review, takes a handover or releases a claim, through its capability"
slug: the-blackboard-is-acted-on-through-its-capabilities
priority: p1
profile: implementation
parallel_safe: false
serves:
  - the-peer-blackboard-is-one-reality#acted-on-through-capabilities
objective: "Put the actions the blackboard's records already have next to the records on /ui/peers. An open review is answered (mesh.review.answer), an untaken handover is taken (mesh.handover.consume), and a claim of the caller's own session is released (mesh.release). Each is a form that posts to the capability's own HTTP route and names the record it acts on. It is offered only where the capability admits the caller: loopback, or a remote caller the capability's execution policy admits. The page shows the action pending until the next blackboard frame shows the record changed. A refusal is shown with the capability's own reason. Nothing is done by the page and nothing succeeds on a timer."
why: "The blackboard shows what waits and for whom, but acting on it means leaving the page for the command line. A page that offered a control without a capability behind it, or claimed a success it had not seen, would be the mock control this repository refuses."
current_state: "/ui/peers is read-only. The mesh capabilities that change reviews, handovers and claims are reachable only from the command line, MCP and HTTP."
desired_state: "An operator on this machine acts on a review, a handover or their own claim from /ui/peers, and sees the result only when the blackboard shows it."
scope:
  - "apps/majordomus-cli/src/ui/peers.rs"
  - "share/ui/ui.js"
  - "docs/BLACKBOARD.md"
  - "docs/MAJORDOMUS_UI.md"
depends_on:
  - "I2983"
acceptance_criteria:
  - "Answering an open review on /ui/peers records the answer through mesh.review.answer, and the review leaves the page with the next frame"
  - "An action the capability refuses, or that a caller beyond loopback may not take, is not offered or is shown refused with the capability's reason"
  - "No action on the page changes what it shows before the blackboard shows it"
validation:
  - "majordomus plan validate"
evidence_required:
  - "case_blackboard_actions_go_through_capabilities"
created_at: 2026-10-19
updated_at: 2026-10-19
