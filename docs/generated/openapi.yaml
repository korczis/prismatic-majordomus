        - title
        - provenance
        - ownership
        - freshness
        - claims
      description: One node as a listing shows it.
    KnowledgeVerification:
      oneOf:
        - type: string
          const: existence
          description: The claim holds while the thing it names exists; re-checked live on every read.
        - type: string
          const: content
