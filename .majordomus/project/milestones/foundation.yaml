id: foundation
title: A supervisory control layer that is real rather than described
slug: foundation
version: "0.1"
order: 10
priority: p0
problem: "An AI worker in a repository has no durable memory, no declared scope, and no contract that says when its work is finished. Every session starts from nothing and ends by asserting success. The evidence that a rule is enforced is usually a sentence claiming it is."
outcome: "A repository carries one policy, a small set of profiles, durable task state, and a set of commands that refuse work which does not meet a declared contract — with every rule dispatched from a registry that proves it reaches the command claiming to run it."
current_state: "Delivered. The policy, the profiles, the durable records, the command surface, the doctrine registry with wiring reconciliation and the provider projections all exist and are covered by the behavioural suite."
desired_state: "Unchanged: this milestone is the base every later one is measured against."
scope:
  - bin
  - lib
  - share
  - test
non_scope:
  - Measuring tokens or cost
  - Constraining a provider's runtime
acceptance_criteria:
  - One canonical policy projects to every provider and drift is detectable in one command
  - A task declares scope, and work outside it is reported
  - A finish contract is evaluated rather than asserted
  - Every enforced rule is declared in a registry, dispatched from it, and proven to reach its command
  - Every behaviour has a case in the suite and CI runs it
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
depends_on: []
claims: []
risks:
  - "The floor is bash 3.2 and BSD userland, which bounds what the engine can be asked to do."
evidence:
  - covers: suite
    type: test
    command: "bash test/run.sh"
    result: "the behavioural suite covering the policy, the profiles, the task lifecycle, the doctrine registry and the provider projections passes"
    recorded_at: 2026-09-04
created_at: 2026-09-04
updated_at: 2026-09-04
