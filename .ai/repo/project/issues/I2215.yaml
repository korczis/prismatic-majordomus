id: I2215
milestone: the-intent-loop-is-proved-end-to-end
title: "What is said of plan start is what case 962 proves, and the claims check reads every claim page and note"
slug: what-is-said-of-plan-start-is-what-is-proved
priority: p1
profile: implementation
parallel_safe: true
objective: "Correct the two statements that call intent-refused-at-plan-start planned, and widen test/cases/892 so that a claim page under docs/claims/ or a note in docs/CLAIMS.yaml that presumes a status another claim does not have fails it."
why: "docs/claims/intent-plan-reviewed.md:20 says 'plan start does not refuse the start; refusing it there is intent-refused-at-plan-start, which is planned', and the note at docs/CLAIMS.yaml:905 says the same, while docs/CLAIMS.yaml:943-950 declares that claim guaranteed with test/cases/962_plan_start_asks_the_binding_in_both_engines.sh. The page is rendered to site/content/guarantees/intent-plan-reviewed.md:29, which is the page the owner's 2026-10-09 pack quotes as a known gap. Case 892 holds prose to the claims matrix, but its corpus is README.md, docs/*.md, site/data/*.toml and three trees (test/cases/892_what_is_said_of_intents_is_what_the_claims_matrix_says.sh:61-62): docs/claims/ and the notes inside docs/CLAIMS.yaml are never read, so the contradiction passed."
current_state: "Two statements contradict a guaranteed claim; the check that exists for exactly this does not read the files they are in."
desired_state: "docs/claims/intent-plan-reviewed.md and the note at docs/CLAIMS.yaml:905 say that plan start is refused where the policy requires binding (intent-refused-at-plan-start) and that under off or advisory the refusal is intent validate's, after the start; case 892's corpus includes docs/claims/*.md and the note field of every claim in docs/CLAIMS.yaml; the derived guarantee page is regenerated."
scope:
  - docs/claims/intent-plan-reviewed.md
  - docs/CLAIMS.yaml
  - site/content/guarantees/intent-plan-reviewed.md
  - test/cases/892_what_is_said_of_intents_is_what_the_claims_matrix_says.sh
non_scope:
  - Changing any claim's status
  - Changing the binding policy of this repository (I2202)
  - Any change to the intent engine
depends_on: []
acceptance_criteria:
  - "Reverting docs/claims/intent-plan-reviewed.md:20 to its current text makes case 892 fail naming the file and intent-refused-at-plan-start"
  - "Reverting the note at docs/CLAIMS.yaml:905 makes case 892 fail naming docs/CLAIMS.yaml"
  - "Case 892 passes on the corrected tree, and its corpus listing includes docs/claims/"
  - "site/content/guarantees/intent-plan-reviewed.md is the derived rendering of the corrected source, with no hand edit"
validation:
  - "bin/majordomus plan validate"
  - "bash test/run.sh 892_what_is_said_of_intents_is_what_the_claims_matrix_says"
  - "scripts/derive"
evidence_required:
  - "stale_planned_statement_refused_case"
created_at: 2026-10-09
updated_at: 2026-10-09
