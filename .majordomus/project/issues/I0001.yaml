id: I0001
milestone: M000
title: Audit what actually plans work in this repository
slug: audit-planning-reality
priority: p0
profile: deep-work
parallel_safe: true
objective: "Establish an evidence-backed map of how work is currently planned, tracked and remembered here, so that the model that replaces it is built against reality rather than against the README."
why: "Every later issue depends on knowing what already exists. The repository already has a canonical-to-derived architecture for claims, doctrines and the website; a planning model that ignored it would be a second architecture."
current_state: "Planning lived in task records, handovers, checkpoints and decisions. GitHub had no milestones and no issues. There was no dependency relation between pieces of work anywhere."
desired_state: "The current-state map exists, backed by commands anyone can rerun, and the schema work that follows cites it."
scope:
  - docs
non_scope:
  - Any change to behaviour
depends_on: []
acceptance_criteria:
  - The GitHub milestone and issue inventory is measured, not assumed
  - The existing canonical-to-derived pipeline is identified so the new model reuses it
  - The portability constraints that bound the implementation are named
validation:
  - gh issue list --state all
  - gh api repos/korczis/prismatic-majordomus/milestones
evidence_required:
  - inventory
risk: "Low. Read-only."
