id: I0907
milestone: fly-deployment
title: The running process says what it is, from an allowlist
slug: build-and-runtime-metadata
priority: p1
profile: implementation
parallel_safe: true
objective: "Expose the version, revision, build profile, target and the safe platform facts of a hosted process through the existing metadata surface, with every field explicitly allowlisted."
why: "Verifying that the deployed image is the one that was built requires the running process to say which revision it is. Doing that by reflecting the environment would publish whatever the platform happens to inject, including things that must never leave the Machine."
current_state: "/api/v1/live answers alive, version, commit and dirty from the build arguments MAJORDOMUS_BUILD_COMMIT and MAJORDOMUS_BUILD_DIRTY (health.rs), and majordomus version names its target. Owed: the build profile and target on the metadata read, platform facts from an allowlist, and the redaction test. The image is published to GHCR and the hub runs on Gigalixir (ADR 0219); Fly.io, which fly_platform_fields named, is not a target since 2026-10-12."
desired_state: "One metadata read reports an allowlisted set of build and platform fields, and a test proves that a value outside the allowlist cannot reach it."
scope:
  - apps/majordomus-cli/src/about.rs
  - apps/majordomus-cli/build.rs
non_scope:
  - Any environment dump, any pass-through of unknown variables
  - Any credential, token or authorization header, in any form
depends_on:
  - I0902
acceptance_criteria:
  - Version, commit revision, build profile and target are embedded at build time through the existing version infrastructure
  - Platform facts are read from the hosting environment by explicit name only, and absence is reported as absence rather than as an error
  - A test proves an environment variable outside the allowlist never appears in the output, including one whose name resembles a secret
  - The metadata read is a registered capability and appears in OpenAPI and the reference without a second registration
validation:
  - cargo test --workspace --all-features
  - majordomus generate --check
evidence_required:
  - metadata_allowlisted
  - fly_platform_fields
  - redaction_test
risk: "A build timestamp defeats reproducibility. It is included only if the reproducibility decision in I0910 permits it."
created_at: 2026-09-06
updated_at: 2026-10-26
