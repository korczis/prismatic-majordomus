id: I3320
milestone: the-session-domain-is-written-once
title: "A lifecycle command run against an absent or stale executable fails loudly and never falls back to a shell writer"
slug: a-lifecycle-command-refuses-a-stale-executable
priority: p1
profile: implementation
objective: "Give the lifecycle commands (session open and close, the provider event shims, checkpoint and handover) one resolution of the Rust executable with a declared lifecycle contract version: with no resolvable executable, or one older than the tree's contract, the command writes a typed provider.event.failed naming the cause, leaves the episode open, exits non-zero (the hook shims stay fail-open for the provider), and nothing falls back to a shell writer."
why: "Split out of I3141 on 2026-10-18 (verification: I3141 was several pieces of work). The critique of a-session-record-says-what-it-served found that after the cutover the closer, the opener and the hooks need the executable, that lib/rust_bin.sh documents Rust-backed features that degraded in silence when it was missing, and that an old binary would close with old semantics. A fallback to shell would be a second writer, so this is part of close-has-one-writer. Sources: chatgpt-majordomus:c109#3."
current_state: "lib/rust_bin.sh resolves MAJORDOMUS_BIN, then libexec/, then target/debug, with no contract version; test/lib.sh rust_bin returns 3 and a case skips without an executable; bash test/run.sh --no-skips already fails a declining case."
desired_state: "One resolution with a contract check that every lifecycle command calls first; a missing or stale executable is a typed, visible failure that health reports. Landed in two halves (a3, 2026-10-21): this issue declares the contract, adds the resolution (mj_rust_lifecycle) and wires it into every lifecycle step that already runs the executable (the start event's server, mesh and keep-awake steps), each of which now leaves provider.event.failed naming the cause instead of returning quietly; the hard gate on the episode's own opener and closer is inherited by I3141, because until the Rust closer is the writer they need no executable and gating them would make every hook depend on a build for nothing."
scope:
  - "lib/rust_bin.sh"
  - "lib/capture.sh"
  - "apps/majordomus-cli/src/lib.rs"
  - "apps/majordomus-cli/src/capability/builtin/distribution.rs"
non_scope:
  - "Building the executable from a hook"
  - "Changing the provider's fail-open contract"
  - "Gating session open and close on the executable: I3141 inherits it with the Rust closer"
  - "majordomus_health naming the lifecycle executable's state: health.report reads no ledger today; doctor's lifecycle-observed rule already reports the failed events (follow-up, unowned)"
serves:
  - "a-session-record-says-what-it-served#close-has-one-writer"
acceptance_criteria:
  - "The lifecycle contract version is declared once and the executable reports the version it implements"
  - "With MAJORDOMUS_BIN pointing at nothing, and with an executable reporting an older contract, every lifecycle step that runs the executable writes provider.event.failed naming the cause and runs nothing in its place, the hook exits 0, and the resolution run by hand exits 12 with the cause on stderr; a case covers both (the episode-stays-open half belongs to I3141, which makes the closer need the executable)"
  - "health reports the failed event"
  - "Each new case named here takes its number from `scripts/case-numbers next` and is announced on the board before the file is written (ADR 0053); a case number written in this record before that is provisional"
validation:
  - "bash test/run.sh --no-skips 3839_a_lifecycle_step_names_an_absent_or_stale_executable 54_session_lifecycle_hooks 220_exactly_once_close 565_knowledge_switch_and_failure_leave_evidence 708_health_sees_a_stopped_knowledge_writer 108_entry_converges_on_a_server"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test session_domain"
evidence_required:
  - "case_a_lifecycle_step_names_an_absent_or_stale_executable"
created_at: 2026-10-18
updated_at: 2026-10-21
