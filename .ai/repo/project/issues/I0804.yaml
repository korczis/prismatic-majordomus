    type: test
    command: "test/run.sh 61_session_envelope"
    result: "1 passed. Closing writes an immutable record, removes the open one and appends exactly one session.closed event; closing with nothing open exits 12; a summary carrying an identity field exits 10 and leaves the open record in place; a second close writes a new file and leaves the earlier record byte-identical; every record is mode 0600"
    commit: 7ca51d2ce8c108364866050a7b9ca0ce5dd01d88
    recorded_at: 2026-09-04T17:38:23Z
  - covers: envelope_is_references
    type: test
    command: "test/run.sh 61_session_envelope"
    result: "1 passed, and the mutation back to a time window fails it. The case proves the record names checkpoint, handover and decision references and carries none of their bodies, that every referenced state path resolves, that an episode across two tasks names both while a task across two sessions is named by both, and that an event stamped by another session or by none is excluded. The first live run of the time-window implementation collected the other worker's records into my envelope; selection is now by the session stamp each ledger line carries"
    commit: 7ca51d2ce8c108364866050a7b9ca0ce5dd01d88
    recorded_at: 2026-09-04T17:38:32Z
