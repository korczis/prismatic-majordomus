id: a-registered-corpus-judges-majordomus
title: "The registered corpus judges the same agent with and without Majordomus, by an exact task-level test on accepted results, and the verdict is published with its losses"
slug: a-registered-corpus-judges-majordomus
order: 204
priority: p1
problem: "Whether Majordomus delivers more accepted work than the same agent without it has never been measured. Under methodology version 1 a pair with a failed side is invalid (methodology.yaml:44), so acceptance cannot be compared in pairs; stats.rs:260 offers only a clustered interval of a median; no live run has ever been committed. I3133, which declares the acceptance pairing, is BLOCKED through I0401, whose milestone cost-per-accepted-outcome depends on execution-telemetry (BLOCKED), so T2 cannot finish inside the owner's 30-day window as the plan stands."
outcome: "The blocking chain is cut or re-scoped by recorded decisions; the calculator decides the primary outcome by an exact task-level test and reports secondary outcomes without a verdict word; the corpus is run in both arms and the verdict, losses included, is published on the T2 row."
current_state: "site/data/generated/plan.json derives I3133 BLOCKED (depends_on I0401), I0401 BLOCKED (milestone cost-per-accepted-outcome depends on execution-telemetry), execution-telemetry BLOCKED. git ls-files .ai/repo/benchmarks/economics/runs lists only runs/context (9 records). EconomicsSession.duration_ms (model.rs:687) is recorded and read by no metric. claims.rs:41-44 VOCABULARY holds no acceptance or wall-time word."
desired_state: "economics summary reports the registered suite's primary verdict, its secondary differences with intervals, attempted, valid and missing pairs; runs/corpus holds every attempted run; the T2 row reads a computed status."
scope:
  - "apps/majordomus-cli/src/economics/stats.rs"
  - "apps/majordomus-cli/src/economics/mod.rs"
  - "apps/majordomus-cli/src/economics/model.rs"
  - "apps/majordomus-cli/src/economics/report.rs"
  - "apps/majordomus-cli/src/economics/claims.rs"
