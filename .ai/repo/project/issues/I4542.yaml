id: I4542
milestone: one-frame-one-kit-one-library-per-job
serves:
  - "one-kit-on-every-surface#one-library-per-job"
  - "one-kit-on-every-surface#every-entity-linked"
title: "ECharts draws every chart of the three surfaces through share/design/js/chart, the activity time series leaves p5, p5 keeps the kiosk's generative scenes through share/design/js/scene, and /ui/trends and /trends/ share one definition"
slug: one-echarts-module
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S8 of milestone one-frame-one-kit-one-library-per-job. Move site/charts.js's ECharts 6.0.0 integration into share/design/js/chart, the one place ECharts is constructed (for charts and for the graph series of I4541), and load it on /ui and /cockpit as on the site. /ui/trends and the site's /trends/ draw site/data/trends.json through it. The Rust SVG lines of apps/majordomus-cli/src/ui/trends.rs, the Rust SVG donut, the Tera SVG sparkline and the p5 time series of share/cockpit/activity.js become ECharts charts, or a static fallback declared with its reason and drawn from the page's table. Every chart is mounted through I4653's visual wrapper, and every mark that stands for an entity takes its href from I4540's resolver. p5 stays for generative art only, as the owner's rule of 2026-11-14 (Visuals, derivation and links) sets ('p5 for generative art'): the observatory kiosk's scenes (share/ui/observatory-kiosk.js, ADR 0160) construct p5 only through share/design/js/scene, which this slice adds, and p5 is vendored once rather than into both share/cockpit/vendor and share/ui/vendor. The Chart.js question is answered by the owner's rule of 2026-11-14: 'no Chart.js or Cytoscape'; Chart.js is rejected, the intent's non-goal cites that rule, and this slice is not gated on a further answer. ADR 0152 (a diagram and a chart on the site are one viewer each) stays proposed; its status is the owner's act. It absorbs I2654 (a chart is held to its table by a gate) and I3792 (every chart on every surface is drawn from a table on its page), each closed by this slice naming its delivering commit."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). The owner's rule of 2026-11-14 names ECharts for charts and p5 for generative art. Five chart renderers draw the same data differently, a time series is drawn with p5, and /ui/trends and /trends/ already draw one file two ways."
current_state: "Measured on master on 2026-11-07: ECharts 6.0.0 on the site only (site/charts.js, 2391 lines); Rust SVG lines in apps/majordomus-cli/src/ui/trends.rs (fn chart at line 72, reading site/data/trends.json through delivery.trends); a Rust SVG donut; a Tera SVG sparkline; a p5 time series in share/cockpit/activity.js; Chart.js absent from package.json. ADR 0152 reads status: proposed. Read on 2026-11-17: p5 2.3.2 is constructed in share/cockpit/activity.js (new p5, line 73, a time series of /api/v1/perf counters) and share/ui/observatory-kiosk.js (new window.p5, line 100, the kiosk's scenes) and vendored into both share/cockpit/vendor and share/ui/vendor; the handbook calls echarts.init in handbook/cs/extras10.js:487, extras11.js:37 and extras12.js:215; I2654 reads READY and I3792 BLOCKED on it."
desired_state: "share/design/js/chart is the one ECharts integration on three surfaces and share/design/js/scene the one p5 integration; /ui/trends and /trends/ render one chart definition; every other chart is ECharts or a declared static fallback; share/cockpit/activity.js draws no p5; I2654 and I3792 are closed by this slice."
