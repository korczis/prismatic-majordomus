id: I0702
milestone: M002
title: Decide how a record is attributed, between named alternatives
slug: decide-attribution
priority: p1
profile: deep-work
parallel_safe: false
objective: "Choose between the alternatives that actually exist — attribute to the session that ran the command, refuse to write when the active task belongs to somebody else, or require the task to be named explicitly — and record the choice with the case each rejected option gets wrong."
why: "Every option here trades a different thing away, and the wrong one either invents an identity this repository refuses to maintain or makes the common single-worker case tedious. A decision record is the only artefact that survives to explain why the chosen one was chosen."
current_state: "The gap is reproduced. Nothing has been decided, and the obvious fix — a worker identity the tool maintains — is the one the doctrine against new nouns exists to prevent."
desired_state: "One decision record naming the choice, both rejected alternatives, and the situation each of them is wrong in, with the conditions the choice imposes on the implementation."
scope:
  - docs
non_scope:
  - Implementing anything
depends_on:
  - I0701
acceptance_criteria:
  - The record names the choice and both rejected alternatives, each with the case it gets wrong
  - Any identity the choice relies on is supplied by the session and stored only inside the record it explains
  - The conditions the implementation must meet are stated, not left to the implementer
validation:
  - bin/majordomus decision list
evidence_required:
  - decision_recorded
risk: "Choosing to refuse rather than to attribute makes a single worker pay for a problem only concurrent workers have; whichever way it goes, the cost falls on somebody and the record has to say who."
created_at: 2026-09-04
updated_at: 2026-09-04
