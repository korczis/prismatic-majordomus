id: the-site-says-what-ships
title: "The public site says what ships, at the version a visitor can install, and shows what changed since it was last deployed"
slug: the-site-says-what-ships
order: 331
priority: p1
problem: "The site is already derived and gated: every figure and list on the homepage comes from a dataset, homepage-check holds the section order, the honesty of feature links, the trust strip and an asset weight budget, site-probe and ui-audit sweep every route in a browser, and case 352 refuses a shown version with no release behind it. What is left is a set of deltas, each measured on master 4dfd1856d2. The latest release is derived twice: the navbar badge reads the highest release filename by `ls|sort` with no channel or yanked filter (scripts/generate-site-data:281-282), while the hero badge, the trust card and releases/latest.json read `Releases::latest_stable` (distribution/release.rs:311); they agree only because every record is stable. A deploy is verified to serve its commit, and its smoke routes carry no version marker (.ai/repo/ci/pages.yaml:85-93), so latest.json is confirmed by hand with curl (docs/DISTRIBUTION.md:200-201); the badge lagged v0.19.1 by about eight hours. The committed changelog stops at the last release by design (release/changelog.rs:85), and nothing shows what changed since the previous deployment. Hand-written copy is held to a line budget and a ban on numbers (scripts/site-check:64-65), never to docs/CLAIMS.yaml. The first screen shows three of the five pains the owner names, links its limitations rather than showing them, and walks through a single-task lifecycle only. The browser sweeps measure five widths, not 375 or 768, nothing emulates reduced motion, and only bytes are budgeted. The `featured` field still claims a homepage placement the page no longer renders."
outcome: "One derivation of the latest stable release feeds every badge, card and latest.json, and a prerelease or yanked record cannot make two of them disagree. Every deploy is verified to serve the version latest.json names and the commit build.json names. The site shows what changed between the previously deployed commit and the current one, composed at build time from release analysis and never committed. A sentence of hand-written copy that promises a capability its claim does not support fails the site check. The first screen states the outcome, who it serves and what it does not do, the narrative names five pains each with the capability that answers it or the limitation that says it does not, and the walkthrough replays a recorded run from intent to merge and release. The browser sweeps add 375 and 768 pixels and reduced motion, a measured rendering budget joins the weight budget, and what the homepage no longer renders is no longer declared."
current_state: "The navbar and the hero read two derivations of the latest release; a deploy is checked for its commit and four markers; the changelog ends at the last release; prose is checked for numbers; three pains, linked limitations and a single-task walkthrough; five probed widths, no reduced-motion probe and a byte budget only."
desired_state: "A visitor sees one release identity everywhere, a deploy that fails verification when it serves another version, a section of what changed since the last deployment labelled released or not yet released, copy that cannot outrun the claims, a first screen that says what the tool does and does not do, and pages judged at seven widths, with reduced motion and against a rendering budget on every change that can move the site."
