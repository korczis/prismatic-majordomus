id: I0834
milestone: M004
title: The test runner reports per-case time and the suite budget
slug: suite-time
priority: p0
profile: implementation
parallel_safe: false
objective: "Print each case's wall time in test/run.sh, sort the slowest at the end, and record the suite's total in the benchmark history as a system target."
why: "A single case costs 29 s because it runs doctor several times; the suite's half hour is the same cost multiplied."
current_state: "run.sh prints ok or FAIL and nothing about time."
desired_state: "Per-case times printed, the suite under ten minutes on this repository after the doctor fixes, the total recorded."
scope:
  - test/run.sh
  - lib/bench.sh
non_scope:
  - Parallel test execution
depends_on:
  - I0828
acceptance_criteria:
  - run.sh prints a time per case and a ranked tail
  - The suite total appears in bench --list as a system target
validation:
  - bash test/run.sh 01_init
evidence_required:
  - doctor_under_budget
risk: "Times in the runner output must not be asserted by any case."
created_at: 2026-09-05
updated_at: 2026-09-05
