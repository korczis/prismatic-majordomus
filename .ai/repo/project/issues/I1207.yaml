id: I1207
milestone: web-sign-in
title: No credential reaches any output, and hostile provider metadata renders safely
slug: identity-no-leakage
priority: p0
profile: implementation
parallel_safe: true
objective: "Prove the negatives. Place sentinel values in the client-secret and signing-key environment variables and exercise every output this repository produces — API responses, the Cockpit's HTML, the generated site, OpenAPI and its examples, MCP answers, the artifact manifest, the caches, the logs and the doctor report — asserting no sentinel appears anywhere. Separately, give a provider object a display name carrying control characters, ANSI sequences and markup, and assert it renders as text in the terminal, in the HTML and in the JSON."
why: "Every other guarantee of this milestone is a claim until a test tries to break it, and a credential that leaks once has leaked permanently."
current_state: "No credentials exist yet, so no test can leak one."
desired_state: "A sentinel test runs in CI and fails loudly if any future change routes a credential into an output."
scope:
  - apps/majordomus-cli/tests
  - test/cases
  - .ai/repo/ci/gates.yaml
non_scope:
  - Weakening the assertion to the outputs that happen to pass today
depends_on:
  - I1204
acceptance_criteria:
  - The sentinel sweep covers every output surface the repository produces, enumerated from the registry rather than listed by hand where that is possible
  - A deliberate regression that renders a secret is caught by the test, proved by a negative case
  - Hostile provider metadata renders as text on every surface, with no escape and no truncation that hides it
  - The gate runs in CI on every change
validation:
  - bash test/run.sh
  - cargo test --workspace --all-features
evidence_required:
  - sentinel_sweep
  - negative_case
  - hostile_metadata
risk: "A sweep that enumerates outputs by hand will miss the surface added after it. Where the registry can enumerate them, it does."
created_at: 2026-09-08
updated_at: 2026-09-08
