id: I3015
milestone: two-folder-integration
title: "serve and mcp discover the repository once, through the shared model"
slug: serve-and-mcp-discover-once
priority: p0
profile: implementation
parallel_safe: true
objective: "majordomus serve and majordomus mcp take the repository App::load discovered instead of discovering it again (commands/serve.rs and commands/mcp.rs today discover beside App::load), and env, web and guard read the same cell, so every entry point of the executable pays one discovery."
why: "The second slice of I1105. The 2026-10-20 survey counted two discoveries at the startup of serve, serve status and mcp, and only App::load's discovery is timed, so the others are never measured."
current_state: "serve.rs and mcp.rs call Repository::discover and then App::load, which discovers again."
desired_state: "One discovery at each entry point, measured where it happens."
scope:
  - apps/majordomus-cli/src/commands/serve.rs
  - apps/majordomus-cli/src/commands/mcp.rs
  - apps/majordomus-cli/src/commands/env.rs
  - apps/majordomus-cli/src/commands/web.rs
  - apps/majordomus-cli/src/commands/guard.rs
  - apps/majordomus-cli/src/app.rs
  - apps/majordomus-cli/tests/hot_path.rs
non_scope:
  - "The capabilities' Repository::open calls (I3016)"
depends_on:
  - I3014
acceptance_criteria:
  - "After serve's startup and after an MCP initialize, repository_discoveries is 1, asserted in tests/hot_path.rs"
  - "The discovery phase is timed at every entry point that discovers"
validation:
  - "cargo test --workspace --all-features"
evidence_required:
  - one_discovery_at_every_entry
created_at: 2026-10-21
updated_at: 2026-10-21
