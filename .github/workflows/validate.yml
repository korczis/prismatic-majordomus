# The one validation workflow. It is an adapter over repository-owned tooling, never a
# second implementation of the gates: `scripts/ci-plan` decides from the CI model in
# .ai/repo/ci/gates.yaml which gates a change can affect, every job runs the same script a
# person runs, and `scripts/ci/verdict` turns the plan and the jobs' results into the one
# status a branch rule can require. Docs: docs/CI.md.
#
# The shape: plan → structure (always) → the selected gates, in parallel → ci (the verdict).
#
# A verdict that does not arrive is not a verdict. On 2026-09-10 four master runs had every
# Linux job finished — five of them red — and their `ci` job had not started, because it needs
# `bench`, `macos` and `install (macos-latest)` and those had been queued for hours behind a
# macOS runner pool this repository shares with the world. Master carried the defects overnight
# with every check apparently green, because a run that never reported and a run that reported
# green look identical. So the model now marks those three gates `on-demand`: the schedule, a
# dispatch and a pull request labelled ci:full plan them, a routine push does not, their jobs
# are skipped rather than queued, and `ci` — which still needs every job, and still turns red
# when any of them does — reports on every push and every pull request. Nothing was deleted or
# weakened: the macOS gates run in full every night and on request, which is more often than
# they were completing before.
# Publication is not here: .github/workflows/pages.yml is the latency-sensitive path that puts
# a master commit on GitHub Pages, and it runs beside this workflow rather than after it. This
# one decides whether a change may merge; that one decides what the public site shows. The
# split is docs/GITHUB_PAGES_PERFORMANCE.md; the model is .ai/repo/ci/pages.yaml.
name: validate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Every night, and this is the run that carries the on-demand gates: a gate nothing
    # selected for a while still has a run, and a gate no push can afford a runner for still
    # has a cadence. It was weekly while every push ran everything; a push no longer does.
    - cron: '17 4 * * *'

permissions:
  contents: read
  # scripts/ci/github-check reads the repository's issues and milestones to prove the
  # canonical project model and its GitHub projection still agree.
  issues: read

# One run of a pull request at a time, and a started run reaches its verdict. A newer commit
# waits in the group and replaces any commit still waiting there, so a burst of pushes costs
# one run each for the first and the last — never a run that was killed halfway. Until
# 2026-09-15 a newer commit cancelled the run in progress; the suite takes over two hours,
# sessions merge master into their branches more often than that, and pull request #576
# was cancelled four times in a row without ever producing the verdict a merge is decided
# on. Every other run (master, the schedule, a dispatch) is its own group: it neither waits
# for nor cancels another; only deployments queue, in the pages job's own group.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

# Every job carries a timeout. GitHub's default is six hours, which is not a bound: a job
# that hangs holds a runner for a shift, and while any job of a run is still going the run's
# logs cannot be read at all — so the one failure a person needs to see is hidden by the
# hang beside it. The minutes below are the observed maximum of twenty completed runs plus
# headroom, not a target: they exist to turn a hang into a failure, and a healthy job should
# never come near them. Raise one when the work legitimately grows; do not raise one to make
# a hang pass.

jobs:
  # ------------------------------------------------------------------ plan
  # What this change can affect, from the model: a pull request is planned from its diff
  # against the base it will merge into (HEAD^1 of the merge commit); everything else, and a
  # pull request labelled ci:full, runs the full plan. The plan is the artifact ci-plan.
  plan:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      selected: ${{ steps.plan.outputs.selected }}
      shell_suite: ${{ steps.plan.outputs.shell_suite }}
      rust_check: ${{ steps.plan.outputs.rust_check }}
      rust_integration: ${{ steps.plan.outputs.rust_integration }}
      projection_closure: ${{ steps.plan.outputs.projection_closure }}
      web_topology: ${{ steps.plan.outputs.web_topology }}
      rust_coverage: ${{ steps.plan.outputs.rust_coverage }}
      coverage_differential: ${{ steps.plan.outputs.coverage_differential }}
      rust_bench: ${{ steps.plan.outputs.rust_bench }}
      command_graph: ${{ steps.plan.outputs.command_graph }}
      version_surface: ${{ steps.plan.outputs.version_surface }}
      intent_check: ${{ steps.plan.outputs.intent_check }}
      cockpit_assets: ${{ steps.plan.outputs.cockpit_assets }}
      cockpit_probe: ${{ steps.plan.outputs.cockpit_probe }}
      site_build: ${{ steps.plan.outputs.site_build }}
      site_probe: ${{ steps.plan.outputs.site_probe }}
      ui_audit: ${{ steps.plan.outputs.ui_audit }}
      interaction_probe: ${{ steps.plan.outputs.interaction_probe }}
      macos: ${{ steps.plan.outputs.macos }}
      mesh_lab: ${{ steps.plan.outputs.mesh_lab }}
      installer_live: ${{ steps.plan.outputs.installer_live }}
      pages_live: ${{ steps.plan.outputs.pages_live }}
      rustdoc: ${{ steps.plan.outputs.rustdoc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # --on-demand asks for the gates the model marks on-demand — the macOS ones, whose
          # runners this repository waits hours for. The schedule, a dispatch and a pull
          # request labelled ci:full ask; a routine push does not, so that the verdict below
          # is a verdict rather than a job queued behind a runner pool.
          case "$EVENT" in
            pull_request)
              case ",$LABELS," in
                *,ci:full,*) scripts/ci-plan --full "pull request labelled ci:full" --on-demand > plan.json ;;
                *) scripts/ci-plan --base HEAD^1 --head HEAD > plan.json ;;
              esac ;;
            schedule|workflow_dispatch) scripts/ci-plan --full "$EVENT on $REF" --on-demand > plan.json ;;
            *) scripts/ci-plan --full "$EVENT on $REF" > plan.json ;;
          esac
          jq -r '"mode=\(.mode)", "selected=\(.selected | join(" "))", (.gates[] | "\(.id | gsub("-"; "_"))=\(.selected)")' plan.json >> "$GITHUB_OUTPUT"
          {
            echo "## plan"; echo
            jq -r '"**\(.mode)** — \(.reason). \(.changed | length) changed path(s), base `\(.base)`, head `\(.head)`."' plan.json; echo
            echo '| gate | job | planned | reason |'; echo '|---|---|---|---|'
            jq -r '.gates[] | "| \(.id) | \(.job) | \(if .selected then "run" else "skip" end) | \(.reason) |"' plan.json
            echo
            jq -r 'if (.classes | length) > 0 then "Classes: " + (.classes | map("\(.id) (\(.paths | length))") | join(", ")) else "" end' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: plan.json
          retention-days: 14

  # ------------------------------------------------------------------ structure
  # The cheap, deterministic gates every plan runs: the shell syntax and shellcheck, then
  # doctor, watch, the context documents, the continuity subsystem, the project model, the
  # offline GitHub projection and the derived site data, through scripts/ci/core-check.
  # A full plan (any change to gates.yaml escalates to one) runs about 1380 s of gates here,
  # core-check 698-714 s and shell-lint about 300 s, so 25 minutes cancelled it at 25:00.
  structure:
    needs: plan
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      # the whole history and its tags: `version-matches-surface` asks what the public
      # surface has lost since the last release, and it finds that release with
      # `git tag --list 'v[0-9]*'` and reads the registry out of it with `git show`. A
      # depth-1 checkout with no tags gives it neither, so the gate failed for want of the
      # data rather than for anything about the tree, on every run it has ever had. The
      # suite job already checks out in full, for the same class of reason.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y shellcheck >/dev/null
      - name: pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -sSL --max-time 120 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin actionlint
          actionlint -version
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      # Every gate the model assigns to this job, in its order, as the plan selected them:
      # shell-lint, ui-check and core-check on every plan, and the structural gates a change
      # needs — site-basepath, rust-command, worktree-topology, providers-data. Dispatched
      # from the plan rather than listed here, so a gate declared in the model cannot be
      # reported as run and never executed, which is what happened to four of them.
      - name: the structure gates of the plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: MJ_CI_TIMINGS=timings.tsv scripts/ci/run-plan --plan plan.json --job structure
      - if: always()
        run: scripts/ci/summary --job structure --timings timings.tsv
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-structure
          path: timings.tsv
          retention-days: 14

  # ------------------------------------------------------------------ suite
  # Every behavioural case (test/run.sh), four at a time, in a disposable repository each.
  # The Rust cases drive the executable built here once (MAJORDOMUS_BIN); the two that are
  # cargo's own gates (the crate's HTTP and projection suites, the doc examples, the
  # benchmark build) keep cargo, warm from the cache. Zola and the site dependencies are
  # present so the site cases run rather than skip.
  # Four shards of the suite on four runners, each running its cases four at a time. Which
  # case runs where is decided by test/run.sh (MJ_TEST_SHARD) from the seconds recorded in
  # .ai/repo/ci/suite-durations.tsv, longest first: one committed file, so every shard deals
  # the same hand and their union is the whole suite. Measured: one runner took >130 min,
  # because 24,879 case-seconds were dealt to four workers; dealt to sixteen, the critical
  # path is the longest single case (~35 min). The suite job below proves the union.
  suite-shard:
    needs: plan
    if: needs.plan.outputs.shell_suite == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 225, re-measured. The bound is a backstop against a wedged runner, and every case
    # already carries one of its own (test/run.sh, `majordomus-timeout:`), so the job bound
    # only has to sit above what a healthy run costs. It kept not doing that. 150 was set
    # from a 93-100 minute cost after two branches cut a minute apart on 2026-09-11 decided
    # it — #209 finished in 92m 48s with a verdict, #208 was killed at 100m 22s without one —
    # and that comment asked for the cost to be re-measured from the first run allowed to
    # finish. Measured, eleven consecutive runs on 2026-09-19/20:
    #
    #   94.2  98.4  121.8  126.1  142.3  142.9  144.7  145.0  145.3  145.4  148.3   minutes
    #
    # The margin had fallen to 1.7 minutes, so runner weather again decided whether a pull
    # request was validated at all — and a cancelled job carries no verdict while looking, in
    # GitHub's own interface, exactly like one a person abandoned. 225 restores the same ~50%
    # doctrine against the cost actually measured.
    #
    # Raising a bound only buys time, so it is not the whole change: .ai/repo/ci/suite.yaml
    # declares this number and what a healthy run may cost in case seconds, and the
    # suite-budget step below refuses growth while the bound still has room. One declaration,
    # two readers — test/cases/417 refuses the workflow and the model when they disagree.
    timeout-minutes: 225
    runs-on: ubuntu-latest
    steps:
      # the whole history: a case that clones this checkout into a fixture and pushes
      # (96_site_deploy does, to a bare repository of its own) cannot push a shallow clone
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: site
        uses: ./.github/actions/setup-site
      - id: rust
        uses: ./.github/actions/setup-rust
      # The crate's reference, which scripts/site-build composes into every build and refuses
      # to build without (ADR 0086): the cases that build the site (09, 12, 96, 97) build it
      # here. The toolchain and cache are the step above's, so it sets up nothing of its own.
      - name: the crate's Rust API reference
        uses: ./.github/actions/rustdoc
        with:
          setup: "false"
      # `just` is a subject of this suite, not a convenience: 77_rust_evidence asks whether a
      # person running `just test` reaches the same gates CI runs, and 90 and 102 read the
      # recipe list and the completion it declares. The runner had no `just`, so 77 died at
      # the `just --dump` assignment — `bash -eu` makes a 127 fatal before the case's own
      # "the justfile does not parse" guard can say so — and 90 and 102 skipped their
      # justfile halves silently. A gate nothing can run is not a gate.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: the executable, built once for every case
        run: |
          RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          echo "MAJORDOMUS_BIN=$PWD/apps/majordomus-cli/target/debug/majordomus" >> "$GITHUB_ENV"
      # The one canonical validation surface. Every behavioural, negative and integration
      # case runs here; nothing is skipped, and no failure is swallowed. test/run.sh exits
      # non-zero when any case fails, and this step has no `|| true` to hide it.
      - name: behavioural tests
        env:
          MJ_TEST_JOBS: 4
          MJ_TEST_SHARD: ${{ matrix.shard }}/4
          MJ_TEST_REPORT: suite.tsv
        run: bash test/run.sh
      # The tree the suite ran in, measured here, right after its run: the evidence job records
      # the suite's report against this measurement, never against its own fresh checkout
      # (ADR 0087 decision 6). The one output the run names, its report, is excluded by name,
      # and nothing else is; whatever else the run left behind makes the tree dirty, and the
      # first lines of it are printed.
      - name: the tree the suite ran in
        if: always()
        run: |
          st="$(git --no-optional-locks status --porcelain --untracked-files=all -- . ':(exclude)suite.tsv')"
          if [ -z "$st" ]; then wt=clean; else wt=dirty; printf '%s\n' "$st" | sed -n '1,50p'; fi
          jq -n --arg commit "$(git rev-parse HEAD)" --arg wt "$wt" '{commit: $commit, working_tree: $wt, excluded: ["suite.tsv"]}' > "$RUNNER_TEMP/suite-tree.json"
      # an artifact of its own per shard (the ci job reads every ci-metrics-* artifact as
      # metrics); the suite job joins the four into the one measurement the evidence job reads
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-suite-tree-${{ matrix.shard }}
          path: ${{ runner.temp }}/suite-tree.json
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: scripts/ci/summary --job suite --report suite.tsv --fact "shard=${{ matrix.shard }}/4" --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}" --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-shard-${{ matrix.shard }}
          path: suite.tsv
          retention-days: 3

  # The suite's one verdict, over every shard: the four reports joined, every case under
  # test/cases/ present exactly once (test/run.sh --verify-report, so a shard that lost or
  # repeated a case is a failure, not a quieter suite), the budget held against the whole run,
  # and the joined report published as ci-metrics-suite for the evidence job and the metrics.
  # It fails when any shard failed. Named `suite` so the gate model, the evidence job and the
  # ci verdict read it exactly as they read the single job it replaces.
  suite:
    needs: [plan, suite-shard]
    if: always() && needs.plan.outputs.shell_suite == 'true'
    # 225, re-measured. The bound is a backstop against a wedged runner, and every case
    # already carries one of its own (test/run.sh, `majordomus-timeout:`); it stays the
    # number .ai/repo/ci/suite.yaml declares (case 417) and bounds every shard below too.
    timeout-minutes: 225
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-shard-*
          path: shards
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-suite-tree-*
          path: ${{ runner.temp }}/trees
      # The suite ran in four trees, one per shard, each measured where it ran. The suite's
      # tree is clean only when all four were and when they are one commit; a shard that left
      # no measurement leaves the suite's tree unknown, and no file is written at all.
      - name: the trees the shards ran in
        if: always()
        run: |
          set -- "$RUNNER_TEMP"/trees/*/suite-tree.json
          if [ "$#" -eq 4 ] && [ -f "$1" ]; then
            jq -s '{commit: (if (map(.commit) | unique | length) == 1 then .[0].commit else "several" end),
                    working_tree: (if all(.[]; .working_tree == "clean") and (map(.commit) | unique | length) == 1
                                   then "clean" else "dirty" end),
                    excluded: ["suite.tsv"]}' "$@" > "$RUNNER_TEMP/suite-tree.json"
            cat "$RUNNER_TEMP/suite-tree.json"
          else
            echo "::warning::$# of 4 shards left a tree measurement; the suite's tree is unknown"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-suite-tree
          path: ${{ runner.temp }}/suite-tree.json
          if-no-files-found: ignore
          retention-days: 14
      - name: every case, exactly once
        run: |
          cat shards/*/suite.tsv > suite.tsv
          test/run.sh --verify-report suite.tsv
      - if: always()
        run: scripts/ci/summary --job suite --report suite.tsv
      # What the run cost, against what .ai/repo/ci/suite.yaml says it may cost: the whole
      # suite's case-seconds and its slowest case, never a shard's share of them.
      - name: the suite finishes inside its bound
        if: always()
        run: scripts/ci/suite-budget --report suite.tsv
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-suite
          path: suite.tsv
          retention-days: 14
      - name: every shard passed
        if: always()
        run: |
          echo "the shards concluded: ${{ needs.suite-shard.result }}"
          [ "${{ needs.suite-shard.result }}" = success ]

  # ------------------------------------------------------------------ rust
  # The Rust executable through scripts/rust-check: every gate (--ci: format, lints as
  # errors, the suites, rustdoc, the benchmarks building, the registry checks, the benchmark
  # check against this platform's baseline) when the crate can be affected, or the registry
  # checks alone (--integration) when only the data it reads changed. Either way the built
  # executable is the artifact majordomus-cli-<target> for a later job or a later phase.
  rust:
    needs: plan
    if: needs.plan.outputs.rust_check == 'true' || needs.plan.outputs.rust_integration == 'true' || needs.plan.outputs.projection_closure == 'true' || needs.plan.outputs.web_topology == 'true' || needs.plan.outputs.command_graph == 'true' || needs.plan.outputs.version_surface == 'true' || needs.plan.outputs.rustdoc == 'true' || needs.plan.outputs.intent_check == 'true'
    # The bound. 30 minutes was set on 2026-09-09 from the observed maximum of twenty runs
    # plus headroom, and the work grew into it: of the 110 rust jobs that reached a verdict
    # from 2026-09-20 to 09-28 the slowest took 29.9 minutes (feature/mesh-cooperation, runs
    # 35495674263 and 36075604033), and master's took 17.6 to 25.6. The integration batch
    # int/batch-b (#651) — 27 capabilities and 398 doctests more (885 to 1283) — was then
    # killed at the bound on both attempts of run 36508890963, and reported cancelled. Not a
    # hang: `cargo test` finished both times, in 1666 s and 1668 s against Batch A's 1072 s
    # (run 36356512201), 29.7 and 30.1 minutes into the job, and `cargo doc` had run 32 s
    # and 10 s when the job was killed.
    #
    # What the batch costs, measured to the end of `cargo test` and estimated after it:
    # Batch A's later rust-check phases (327 s: cargo doc, bench --no-run, build, the
    # registry checks, quality report) scaled by the test ratio 1.556 are 509 s; the rust
    # gates of the plan, which since #634 run the rustdoc gate and rebuild for web-topology,
    # took 69 s on #634's own run 36241676207 and are 107 s scaled; the steps after them and
    # the cache save that a partial restore owes (unmeasured) are allowed 65 s. That is
    # 41.4 minutes, or 38.6 with #634's later phases unscaled. 60 is 1.45 and 1.55 times
    # those, the ~50% doctrine the suite job's bound follows (.ai/repo/ci/suite.yaml): a
    # slow runner still reaches a verdict, and a hang still fails inside the hour. Raise it
    # again from a run that measured the whole job, not from this estimate.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Three lanes of the crate's tests on three runners (scripts/rust-check, MJ_RUST_TEST_LANE),
    # dealt by whole test binaries from their measured seconds: 1 is the doctests and preflight,
    # 2 the lib, the binaries, cli_examples, bench and peer_claims, 3 every other binary and
    # every other gate — fmt, clippy, docs, the benchmark build, the registry checks, the plan's
    # rust gates and the executable artifact. One runner spent ~30 of its 40 minutes in
    # `cargo test`; dealt to three, each lane costs about a third of it.
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3]
    steps:
      # the whole history: `generate --check` runs here, and the changelog is composed from
      # the release records, the decisions and `git log <previous>..<this>` — history is one
      # of its canonical sources (project.release-is-a-projection). A default checkout is one
      # commit deep, so every release record named a commit the clone did not have,
      # `merge-base --is-ancestor` said `fatal: Not a valid commit name 45f921ef…` once per
      # decision, every range yielded nothing, and the composer wrote the honest degraded
      # document it is required to write. The gate then reported the committed artifact stale
      # for a reason no branch had caused. A check reads its inputs; this job now fetches them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: the crate's tests, lane ${{ matrix.lane }}
        if: matrix.lane != 3 && needs.plan.outputs.rust_check == 'true'
        env:
          MJ_RUST_TEST_LANE: ${{ matrix.lane }}
          # the lane's results, for the evidence job to record (ADR 68): plain text, which the
          # recorder reads line by line, and outside the checkout the tree step measures
          CARGO_TERM_COLOR: never
          MJ_CARGO_TEST_OUTPUT: ${{ runner.temp }}/cargo-test-${{ matrix.lane }}.txt
        run: MJ_CI_TIMINGS=timings.tsv scripts/rust-check --ci
      - name: rust-check
        if: matrix.lane == 3 && (needs.plan.outputs.rust_check == 'true' || needs.plan.outputs.rust_integration == 'true')
        env:
          MODE: ${{ needs.plan.outputs.rust_check == 'true' && '--ci' || '--integration' }}
          MJ_RUST_TEST_LANE: 3
          # the crate's results, for the evidence job to record (ADR 68): plain text, which the
          # recorder reads line by line, and outside the checkout the next step measures
          CARGO_TERM_COLOR: never
          MJ_CARGO_TEST_OUTPUT: ${{ runner.temp }}/cargo-test-3.txt
        run: MJ_CI_TIMINGS=timings.tsv scripts/rust-check "$MODE" --artifact dist
      # The tree the crate ran in, measured here, before the plan below is downloaded into it
      # (ADR 0087 decision 6). The two outputs the step above names, its timings and its
      # artifact directory, are excluded by name, and nothing else is. scripts/rust-check runs
      # in the crate's directory, so both relative names land there, and that is where they
      # are excluded: excluded at the root, they matched nothing and the tree read dirty.
      - name: the tree the crate ran in
        if: always() && (needs.plan.outputs.rust_check == 'true' || needs.plan.outputs.rust_integration == 'true')
        run: |
          st="$(git --no-optional-locks status --porcelain --untracked-files=all -- . ':(exclude)apps/majordomus-cli/timings.tsv' ':(exclude)apps/majordomus-cli/dist')"
          if [ -z "$st" ]; then wt=clean; else wt=dirty; printf '%s\n' "$st" | sed -n '1,50p'; fi
          jq -n --arg commit "$(git rev-parse HEAD)" --arg wt "$wt" '{commit: $commit, working_tree: $wt, excluded: ["apps/majordomus-cli/timings.tsv","apps/majordomus-cli/dist"]}' > "$RUNNER_TEMP/crate-tree.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          # one artifact per lane, its output beside the tree it ran in; the evidence job
          # joins the three outputs and the three measurements
          name: ci-evidence-crate-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/cargo-test-${{ matrix.lane }}.txt
            ${{ runner.temp }}/crate-tree.json
          if-no-files-found: ignore
          retention-days: 14
      - if: matrix.lane == 3
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
      # The other gates the model assigns to this job — the ones that need the executable
      # the step above built: projection-closure, web-topology, command-graph,
      # version-surface, intent-check, and rustdoc, which judges the tree the --ci run of the
      # step above handed off into target/web/rustdoc (the gate requires rust-check, so the two are
      # always planned together). rust-check and rust-integration are the step above, with
      # the mode and the artifact argument the model's line does not carry, so they are the
      # only two skipped here.
      - name: the rust gates of the plan
        if: matrix.lane == 3
        run: MJ_CI_TIMINGS=timings.tsv scripts/ci/run-plan --plan plan.json --job rust --skip rust-check,rust-integration
      - id: target
        if: matrix.lane == 3
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - if: matrix.lane == 3 && (needs.plan.outputs.rust_check == 'true' || needs.plan.outputs.rust_integration == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: majordomus-cli-${{ steps.target.outputs.triple }}
          path: dist
          retention-days: 7
      - if: always() && matrix.lane == 3
        run: scripts/ci/summary --job rust --timings timings.tsv --fact "mode=${{ needs.plan.outputs.rust_check == 'true' && 'ci' || 'integration' }}" --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}" --fact "artifact=majordomus-cli-${{ steps.target.outputs.triple }}"
      - if: always() && matrix.lane == 3
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-rust
          path: timings.tsv
          retention-days: 14

  # ------------------------------------------------------------------ coverage
  # Line, function and region coverage of the crate, measured over the code that is under
  # test rather than over the code plus the tests, and held to two thresholds: the crate-wide
  # floor in scripts/rust-coverage-threshold and the canonical session/continuity domain's in
  # scripts/session-coverage-threshold. `cargo llvm-cov --summary-only` is not run directly
  # here any more: it has no way to exclude a `#[cfg(test)] mod tests` that lives in the same
  # file as the code it tests, so its denominator contained the tests and the number moved
  # whenever a test was added or deleted. scripts/rust-coverage is the same measurement with
  # that subtracted; it runs the same suite once and post-processes the JSON export.
  coverage:
    needs: plan
    if: needs.plan.outputs.rust_coverage == 'true' || needs.plan.outputs.coverage_differential == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/majordomus-cli
    steps:
      - uses: actions/checkout@v4
        with:
          # The differential gate diffs against the merge-base with the trunk. A shallow
          # clone has no merge-base, and this gate answers UNKNOWN rather than passing
          # silently, so the history it reads has to be here.
          fetch-depth: 0
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # One instrumented run, one export, two verdicts read from it: the measurement exists
      # once (docs/COVERAGE.md) and neither gate re-instruments. This step holds nothing —
      # --report measures and exits 0 — so a floor failure cannot hide the differential's
      # answer, and the differential's cannot hide the floor's.
      - run: ../../scripts/rust-coverage --report --export ../../coverage.json
      - if: needs.plan.outputs.coverage_differential == 'true'
        env:
          MJ_COVERAGE_EXPORT: ${{ github.workspace }}/coverage.json
          MJ_COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: ../../scripts/ci/coverage-differential
      - if: ${{ !cancelled() && needs.plan.outputs.rust_coverage == 'true' }}
        run: ../../scripts/rust-coverage --from ../../coverage.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-coverage
          path: coverage.json
          retention-days: 14
      - if: always()
        run: ../../scripts/ci/summary --job coverage --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}" --fact "crate threshold=$(cat ../../scripts/rust-coverage-threshold)" --fact "session domain threshold=$(cat ../../scripts/session-coverage-threshold)"

  # ------------------------------------------------------------------ evidence
  # What this run proved, kept where it happened (docs/EVIDENCE.md, ADR 68 as ADR 0087 amends
  # it). The suite, the crate and the coverage jobs each leave a raw report, and the suite and
  # the crate a measurement of the tree they ran in. scripts/ci/evidence-collect first derives
  # the report from the tracked ledger on this checkout, then records the suite's and the
  # crate's results as `ci` executions stamped with this run (a run record, which decides no
  # verdict), summarises the coverage, and this job keeps the result as the artifact `evidence`.
  # The reports and the result live under the runner's temporary directory, never in the
  # checkout the report is derived in. It is not a gate and the verdict does not need it: it
  # reads jobs that have already decided, and a red suite is exactly the evidence worth
  # keeping. It runs whenever the suite or the crate produced anything, whatever they concluded.
  #
  # On master, when this commit is still the tip, it then dispatches the pages workflow, so the
  # site that was published at once with the nearest older evidence (labelled stale) republishes
  # with the evidence of the commit it shows. pages.yml stays triggered by the push alone.
  evidence:
    needs: [plan, suite, rust, coverage]
    if: always() && (needs.suite.result == 'success' || needs.suite.result == 'failure' || needs.rust.result == 'success' || needs.rust.result == 'failure')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh workflow run pages.yml`, and nothing else of Actions
      actions: write
    env:
      # the head a pull request was built from, carried beside the merge commit that ran
      MJ_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # the whole history: the report compares each execution's commit with the tree
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: rust
        uses: ./.github/actions/setup-rust
      - name: the executable
        run: |
          RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          echo "MAJORDOMUS_BIN=$PWD/apps/majordomus-cli/target/debug/majordomus" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: '{ci-metrics-suite,ci-metrics-coverage,ci-evidence-suite-tree}'
          path: ${{ runner.temp }}/reports
          merge-multiple: true
      # each lane in a directory of its own: every lane names its measurement crate-tree.json
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-crate-*
          path: ${{ runner.temp }}/lanes
      # Each lane of the rust job kept its own cargo test output and the recorder reads one;
      # every binary's record starts at a `Running` or `Doc-tests` line, so joining is exact.
      # The crate ran in three trees: clean only when all three were and on one commit, and
      # unknown (no file) when a lane left no measurement.
      - name: gather
        run: |
          r="$RUNNER_TEMP/reports"; mkdir -p "$r"
          cat "$RUNNER_TEMP"/lanes/*/cargo-test-*.txt > "$r/cargo-test.txt" 2>/dev/null || : > "$r/cargo-test.txt"
          set -- "$RUNNER_TEMP"/lanes/*/crate-tree.json
          if [ "$#" -eq 3 ] && [ -f "$1" ]; then
            jq -s '{commit: (if (map(.commit) | unique | length) == 1 then .[0].commit else "several" end),
                    working_tree: (if all(.[]; .working_tree == "clean") and (map(.commit) | unique | length) == 1
                                   then "clean" else "dirty" end),
                    excluded: .[0].excluded}' "$@" > "$r/crate-tree.json"
          fi
          scripts/ci/evidence-collect --out "$RUNNER_TEMP/evidence" --suite "$r/suite.tsv" --suite-tree "$r/suite-tree.json" --crate-output "$r/cargo-test.txt" --crate-tree "$r/crate-tree.json" --coverage "$r/coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 90
      - name: refresh the publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/evidence-collect --refresh-publication

  # ------------------------------------------------------------------ bench
  # The benchmark check against the committed baseline of its platform (.ai/repo/benchmarks/
  # rust/): a conservative measurement through the real transports. The baseline is per
  # platform, and the one committed is macOS's, so this is where the comparison is real.
  bench:
    needs: plan
    if: needs.plan.outputs.rust_bench == 'true'
    timeout-minutes: 25
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/majordomus-cli
    steps:
      - uses: actions/checkout@v4
      - id: rust
        uses: ./.github/actions/setup-rust
      - run: cargo run --quiet -- bench --profile ci --check --no-write
      - if: always()
        run: ../../scripts/ci/summary --job bench --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"

  # ------------------------------------------------------------------ site
  # The site built once: the derived data current, the build, every static check over the
  # output, then every route at every width in a real browser (four at a time). On master
  # the same bytes become the Pages artifact the deploy job publishes; nothing rebuilds them.
  site:
    needs: plan
    # Every gate this job carries, not only the first: the build is a prerequisite of the
    # probe, so a plan that asks for the probe or the Cockpit stylesheet and not for
    # site-build must still open the job — otherwise the gate is planned and the job that
    # would run it never starts. The UI audit is the ui job's, not this one's.
    if: needs.plan.outputs.site_build == 'true' || needs.plan.outputs.cockpit_assets == 'true' || needs.plan.outputs.site_probe == 'true'
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      # The whole history, because scripts/ci/link-check decides a commit link by whether the
      # commit is in the history being published, and refuses to report clean from a shallow
      # clone that cannot say.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: site
        uses: ./.github/actions/setup-site
      # One generation for the whole job. This step is the gate — it stages a fresh generation
      # from the canonical sources and diffs it against what is committed, which is the only
      # thing that proves the two agree — and the build and the check then read the committed
      # data rather than each paying for a generation of their own to learn the same fact.
      # The Cockpit's stylesheet is compiled from one source file; this is the only gate
      # that can prove the committed one still matches it, because it needs the Node
      # toolchain the site job already has.
      - name: the Cockpit stylesheet in sync
        if: needs.plan.outputs.cockpit_assets == 'true'
        run: scripts/ci/timed --bound 2700 cockpit-assets "cockpit-assets --check" timings.tsv scripts/cockpit-assets --check
      - name: derived site data in sync
        if: needs.plan.outputs.site_build == 'true'
        run: scripts/ci/timed --bound 2700 site-build "generate-site-data --check" timings.tsv scripts/generate-site-data --check
      # The crate's Rust API reference, produced the one way it is produced everywhere
      # (.github/actions/rustdoc: the rust gate's own rustdoc step and its handoff). The build
      # below composes it at /rustdoc and refuses without it, and the check after it asserts
      # it is there and built from this commit (ADR 0086). Its rows go into this job's timings.
      - name: the crate's Rust API reference
        id: rust
        uses: ./.github/actions/rustdoc
        with:
          timings: timings.tsv
      - name: build the site
        run: scripts/ci/timed --bound 2700 site-build site-build timings.tsv scripts/site-build --no-data
      # Metadata and landmarks on every route, no unrendered template delimiter, every
      # internal link resolving, no remote asset, no credential, and the generated data
      # still matching its canonical sources.
      - name: check the site
        if: needs.plan.outputs.site_build == 'true'
        run: scripts/ci/timed --bound 2700 site-build site-check timings.tsv scripts/site-check --no-sync
      # Browser-measured: no horizontal overflow at 320/390/1280 on every route, the mobile
      # menu, the dropdowns, the theme toggle, Mermaid rendering. The full sweep, deliberately:
      # every overflow this site has produced came from canonical data rendered into a shared
      # template, which no sample of one route per template can see.
      - name: probe the site in a browser
        if: needs.plan.outputs.site_probe == 'true'
        run: CHROME_BIN=google-chrome SITE_PROBE_JOBS=4 scripts/ci/timed --bound 2700 site-probe site-probe timings.tsv scripts/site-probe
      - name: manifest
        run: cat site/data/generated/source.json
      - if: always()
        run: scripts/ci/summary --job site --timings timings.tsv --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}" --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}" --fact "routes=$(find site/public -name index.html | wc -l | tr -d ' ')"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-site
          path: timings.tsv
          retention-days: 14

  # ----------------------------------------------------------------- interactions
  # Every interactive control on every page of the built site, exercised in a real browser by the behaviour spec
  # that claims it (project.every-link-and-control-is-tested). Its own job: the site job's browser steps already
  # run to that job's bound, and a gate in a job that never finishes enforces nothing. The installed Chrome drives
  # it; a missing browser under CI is a failure, never a skip.
  interactions:
    needs: plan
    if: needs.plan.outputs.interaction_probe == 'true'
    # the full probe measured 599 s on a 4-job local run over every page with a control; a hosted runner is slower,
    # and a job killed at its bound reports cancelled, which the verdict counts as red
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: site
        uses: ./.github/actions/setup-site
      # the build refuses without the crate's reference, which it composes at /rustdoc
      - name: the crate's Rust API reference
        uses: ./.github/actions/rustdoc
        with:
          timings: timings.tsv
      - name: build the site
        run: scripts/ci/timed --bound 2400 interaction-probe site-build timings.tsv scripts/site-build --no-data
      - name: exercise every control
        run: CHROME_BIN=google-chrome MJ_PROBE_JOBS=4 scripts/ci/timed --bound 2400 interaction-probe interaction-probe timings.tsv scripts/interaction-probe
      - if: always()
        run: scripts/ci/summary --job interactions --timings timings.tsv --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-interactions
          path: timings.tsv
          retention-days: 14

  # ----------------------------------------------------------------- ui
  # Every discovered page at every width the compiled theme implies, in a browser, against the
  # responsive, semantic, component and WCAG invariants. Its own job, for the reason the
  # interactions job has one: in the site job the audit started after about 30 minutes of
  # build, check and probe, then took 1,042 s and 1,155 s over 4,151 visits (runs 35171586937
  # and 35156274863), and on most runs of 2026-09-16 and 17 the job reached its 50-minute bound
  # mid-audit and was reported cancelled with no finding. It drives the repository's own server,
  # so it needs the executable; the Rust cache makes that a restore in nearly every run.
  # It grew with the site: on #723's run (int/batch-j be9f675f16) the audit took 2,345 s over
  # 5,902 visits of 1,740 pages at 4 jobs, 55 s inside its 2,400 s bound, and on master's run of
  # the same tree (37087514909) it was stopped at 2,400 s mid-audit. The bound is 3,600 s and
  # the job's 75 minutes, so a third more site still finishes and reports.
  ui:
    needs: plan
    if: needs.plan.outputs.ui_audit == 'true'
    timeout-minutes: 75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: site
        uses: ./.github/actions/setup-site
      # before the build, which composes the crate's reference at /rustdoc and refuses without
      # it; one toolchain and one cache for the reference and the executable below
      - id: rust
        uses: ./.github/actions/setup-rust
      - name: the crate's Rust API reference
        uses: ./.github/actions/rustdoc
        with:
          setup: "false"
          timings: timings.tsv
      - name: build the site
        run: scripts/ci/timed --bound 2400 ui-audit site-build timings.tsv scripts/site-build --no-data
      - name: the executable the audit drives
        run: |
          RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          echo "MAJORDOMUS_BIN=$PWD/apps/majordomus-cli/target/debug/majordomus" >> "$GITHUB_ENV"
      - name: audit the UI in a browser
        run: scripts/ci/timed --bound 3600 ui-audit ui-audit timings.tsv scripts/ui audit --report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: |
            target/web/run-ui.json
            target/web/tests/ui
          retention-days: 14
      - if: always()
        run: scripts/ci/summary --job ui --timings timings.tsv --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}" --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-ui
          path: timings.tsv
          retention-days: 14

  # ----------------------------------------------------------------- cockpit
  # The Cockpit measured against a server this job starts: every route the server serves
  # answered — derived from that server, never listed — then the pages and the interactions
  # in a real browser. Its own job rather than a step of the site's, because the gate that
  # selects it is a change to the crate or to share/cockpit/, and neither of those builds
  # the website.
  cockpit:
    needs: plan
    if: needs.plan.outputs.cockpit_probe == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: site
        uses: ./.github/actions/setup-site
      - id: rust
        uses: ./.github/actions/setup-rust
      # the graph and topology pages load vendored libraries that are deliberately not
      # committed (two megabytes nothing on the critical path needs), so the runner has to
      # build them out of node_modules before a browser is pointed at those pages. Without
      # this the probe reports a console 404 on every page that lazily loads one.
      - name: vendor the lazy-loaded libraries the probe expects to find
        run: scripts/ci/timed --bound 900 cockpit-assets cockpit-assets timings.tsv scripts/cockpit-assets
      - name: probe the Cockpit
        run: CHROME_BIN=google-chrome scripts/ci/timed --bound 1200 cockpit-probe cockpit-probe timings.tsv scripts/cockpit-probe
      - if: always()
        run: scripts/ci/summary --job cockpit --timings timings.tsv --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}" --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-cockpit
          path: timings.tsv
          retention-days: 14

  # ------------------------------------------------------------------ mesh-lab
  # Mesh cooperation over a real network (test/mesh-lab/run, claim mesh-network-acceptance):
  # four Linux containers on one docker bridge, multicast discovery with no seeds, links, a
  # claim and a handover across nodes, a node disconnected from the network and healed, a
  # node killed and restarted, and `mesh verify` inside a node. The executable is built here
  # and copied into the node image, so the lab tests exactly what the crate builds; the
  # evidence file is kept as an artifact.
  mesh-lab:
    needs: plan
    if: needs.plan.outputs.mesh_lab == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rust
        uses: ./.github/actions/setup-rust
      - name: the executable the nodes run
        run: RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml --bin majordomus
      - name: the lab
        run: MESH_LAB_BIN="$PWD/apps/majordomus-cli/target/debug/majordomus" scripts/ci/timed --bound 1500 mesh-lab mesh-lab timings.tsv test/mesh-lab/run
      # The lab does not judge itself: this reads the record it wrote and refuses anything
      # short of a complete acceptance — a dropped scenario, a pass that measured nothing,
      # an executable no node could name. `always()` so that a failing lab's record is read
      # too, and the step names which half is wrong.
      - name: the record the lab wrote
        if: always()
        run: scripts/ci/mesh-lab-evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-lab-evidence
          path: target/mesh-lab/evidence.json
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: scripts/ci/summary --job mesh-lab --timings timings.tsv --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-mesh-lab
          path: timings.tsv
          retention-days: 14

  # ------------------------------------------------------------------ macos
  # The behaviour that depends on the platform: the suite under the stock macOS shell
  # (bash 3.2) and BSD userland, and the crate's own suites there (files, signals, the
  # lease, the spawned processes). Lints, docs and coverage are platform-independent and
  # run on Linux only.
  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    timeout-minutes: 110
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: site
        uses: ./.github/actions/setup-site
      - id: rust
        uses: ./.github/actions/setup-rust
      # the cases that build the site need the crate's reference it composes (ADR 0086)
      - name: the crate's Rust API reference
        uses: ./.github/actions/rustdoc
        with:
          setup: "false"
      - name: shell syntax under bash 3.2
        run: for f in bin/majordomus lib/*.sh test/run.sh test/lib.sh test/cases/*.sh; do /bin/bash -n "$f"; done
      - name: the executable, built once for every case
        run: |
          RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          echo "MAJORDOMUS_BIN=$PWD/apps/majordomus-cli/target/debug/majordomus" >> "$GITHUB_ENV"
      - name: behavioural tests
        env:
          MJ_TEST_JOBS: 3
          MJ_TEST_REPORT: suite.tsv
        run: bash test/run.sh
      - name: the crate's suites
        run: RUSTFLAGS='' cargo test --no-fail-fast --manifest-path apps/majordomus-cli/Cargo.toml
      - if: always()
        run: scripts/ci/summary --job macos --report suite.tsv --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-macos
          path: suite.tsv
          retention-days: 14

  # ------------------------------------------------------------------ install
  # The advertised command, from the published site, on two of the platforms it claims to
  # serve. Every other job here reads this checkout; this one reads what a stranger gets,
  # which is why the plan selects it only in the full mode (a master push, the schedule, a
  # dispatch, a pull request labelled ci:full): no change to a tree can make it pass or fail
  # — only a deployment can. A release proves the same thing once, at publication; this is
  # what keeps proving it afterwards.
  install:
    needs: plan
    if: needs.plan.outputs.installer_live == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # --wait: publishing a release and deploying the site are two workflows, and the
      # second is not instant. A push that lands between them would be told the promise is
      # broken when it is merely a few minutes old; a site that cannot serve the metadata
      # inside the window is broken, and the finding stands.
      - name: the advertised install command, from the published site
        run: scripts/ci/install-check --wait 300

  # ------------------------------------------------------------------ pages
  # Is what GitHub Pages serves a projection of this branch at all? One runner, because the
  # answer is not platform-dependent, and selected in the same full mode as `install` for the
  # same reason: no change to a tree can make it true or false. It is the gate that was
  # missing on 2026-09-09, when the public site served an unmerged branch for half an hour
  # with every tree-level gate green — and the gate that stayed green through 2026-09-10, when
  # the site was hours behind master, until it was taught to ask the converse as well.
  #
  # `pages: read` is the second half of publication: the push to gh-pages is this repository's
  # and the build of it is GitHub's, and the gate reads that build's own status rather than
  # inferring it from the symptom. The whole history is needed, so `fetch-depth: 0` stays: the
  # gate walks master back to the published commit to decide whether a deploy is owed.
  pages:
    needs: plan
    if: needs.plan.outputs.pages_live == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the published site came from master, is current, and is being served
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/pages-check

  # ------------------------------------------------------------------ ci
  # The one status to require: green only when planning succeeded, every selected gate's job
  # succeeded, and no job that ran failed or was cancelled. Always runs, so a required check
  # is never left pending by a skipped job. It also gathers the jobs' timing rows into the
  # artifact ci-performance-metrics.
  #
  # It still needs every job the model names — a red `macos` on the nightly run turns this red
  # — and on a routine push those three are skipped rather than queued, which is what makes
  # this status arrive at all. Requiring it in the branch rule is the repository owner's
  # setting and is not made here; until it is required, this is a verdict a person can read
  # and not one the merge obeys.
  ci:
    needs: [plan, structure, suite, rust, coverage, bench, site, interactions, ui, cockpit, mesh-lab, macos, install, pages]
    if: always()
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-metrics-*
          path: metrics
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          scripts/ci/metrics metrics > ci-metrics.tsv
          scripts/ci/verdict --plan plan.json --needs needs.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-performance-metrics
          path: |
            plan.json
            needs.json
            ci-metrics.tsv
          retention-days: 90
