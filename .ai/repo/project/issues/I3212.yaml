id: I3212
milestone: finished-work-reaches-a-verified-release
title: "Two open pull requests that realise the same issue are reported as duplicates, with the survivor named"
slug: duplicate-pull-requests-are-named
priority: p2
profile: implementation
objective: "Use the pull request to issue edge the work graph already derives to report open pull requests that realise the same issue, name the survivor by evidence (green head, landed member of a top, newer head) and leave the closing to the landing seat; never close automatically on title or path similarity."
why: "The 2026-10-12 pack proposed that duplicate and superseded pull requests be detected from the work graph and closed knowingly with a pointer to the survivor (c242#5). The drain closes a pull request only when a declared Supersedes marker's successor lands. It extends milestone work-graph-github. Proposed in ADR 0197 (The backlog is bounded by a declared bound that every session reads at start, and the bound reports rather than refuses) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c242#5, chatgpt-majordomus:c051#2."
current_state: "I1405 (DONE) derives the pull request to issue edge; classify.rs holds and closes on 'Supersedes #N' markers; no reading reports two open pull requests on one issue."
desired_state: "integration.queue carries a duplicates section: the issue, the pull requests, the proposed survivor and the evidence for it; integration.explain repeats it per pull request; nothing is closed by it."
scope:
  - "apps/majordomus-cli/src/integration/classify.rs"
  - "apps/majordomus-cli/src/integration/model.rs"
  - "docs/INTEGRATION.md"
  - "test/cases"
  - "apps/majordomus-cli/src/capability/builtin/brief.rs"
  - "apps/majordomus-cli/src/commands/prs.rs"
non_scope:
  - "Closing pull requests"
  - "Similarity by title or overlapping paths"
depends_on:
  - "I3204"
serves:
  - "finished-work-reaches-a-verified-release#the-backlog-is-loud"
acceptance_criteria:
  - "Two open pull requests naming the same issue are reported with the survivor and why"
  - "A pull request naming no issue is never reported as a duplicate"
  - "The drain's closures are unchanged"
  - "The brief's integration line (prs brief) names the number of duplicate candidates and their issues when there are any, from the same reading as integration.queue"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib integration::classify"
  - "majordomus plan validate"
evidence_required:
  - "test_duplicates_by_issue"
created_at: 2026-10-18
updated_at: 2026-10-18
