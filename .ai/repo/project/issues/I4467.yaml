acceptance_criteria:
  - "Case 4467: in a fixture with a linked worktree holding an active task T2, `majordomus handover --delegated <T2> --delegated feature/x` in the primary checkout writes a record whose front matter lists T2 as active with that worktree and feature/x with its head"
  - "Case 4467: after T2 is finished completed in its worktree and feature/x is merged into the trunk, `majordomus handover --resolve` under a new MJ_SESSION_KEY prints T2 `active` then and `completed` now, and feature/x as contained in the trunk"
  - "Case 4467: a ref that resolves to nothing (`--delegated t-nonexistent`) and an unrecognised ref (`--delegated run:12345`) are recorded and resolved as `unknown` with a reason, never as done"
  - "Case 4467: `handover --derive --delegated <T2>` writes a `# Delegated` section naming T2"
  - "Case 05 passes unchanged, and a handover written without --delegated has no delegated list"
  - "Before the change, case 4467 fails at its first assertion"
