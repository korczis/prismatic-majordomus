id: I2412
milestone: the-mesh-works-out-of-the-box
title: "`majordomus init` declares the mesh and enrols this machine's key, so a fresh repository cooperates"
slug: init-declares-the-mesh
priority: p1
profile: implementation
parallel_safe: true
objective: "A fresh `majordomus init` writes a mesh declaration (multicast and Tailscale discovery on, deny_unknown trust) and an enrolment command adds this machine's node key to it, so a repository becomes a mesh by init and one enrolment per machine."
why: "share/skeleton ships no declaration, so the mesh of a fresh repository is off (docs/MESH.md:396-399; share/skeleton/ai/repo/knowledge/sources.yaml:192-197 only indexes the class). Even with one, deny_unknown with an empty allowlist links nothing (mesh/config.rs:104-106), and there is no command to add a key."
current_state: "A repository has a mesh only if somebody hand-writes .ai/repo/mesh/<name>.yaml and its allowlist."
desired_state: "init writes the declaration; `majordomus mesh enrol` adds this node's key to the allowlist and says what to commit; nothing trusts a key nobody enrolled."
scope:
  - "share/skeleton"
  - "apps/majordomus-cli/src/commands"
  - "apps/majordomus-cli/src/mesh/config.rs"
  - "docs/MESH.md"
  - "test/cases"
acceptance_criteria:
  - "`majordomus init` in an empty repository writes a mesh declaration that validates"
  - "`majordomus mesh enrol` adds this node's key once, idempotently"
  - "A machine whose key is not enrolled opens no mesh socket (I2261 still holds)"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh 01_init"
evidence_required:
  - "init_declares_mesh_case"
