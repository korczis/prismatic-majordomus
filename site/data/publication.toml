# Where each kind of the layer's index is published on this site.
#
# The repository indexes every file under `.ai/` as an object of some kind — `majordomus
# entity kinds` lists them — and every object has an address in the Cockpit because it is an
# object. The public site is a different question: some kinds have an editorial section
# written for them, some are published as entity pages from the objects themselves, and some
# are not published at all. Until this file existed, that knowledge was implicit in twenty
# lines of `scripts/generate-site-data` and a kind could be added to the layer and reach no
# public page with nothing saying so.
#
# `scripts/ci/entity-check` reads this file and `majordomus entity kinds` and refuses both
# directions: a kind of the index that is not declared here, and a kind declared here that
# the index does not hold. A one-way check is the defect class this repository keeps finding
# in itself, so this one is written both ways from the start.
#
# fields:
#   kind         the kind, as `share/kinds.yaml` declares it and the index reports it
#   projection   entity  — one page per object, generated from the objects by the entity
#                          projection into `route`; the page's body is the object's own file
#                section — an editorial section already publishes this kind at `route`;
#                          nothing here generates it, and the check only asserts the route
#                          resolves
#                none    — not published, with `reason` saying why
#   route        the public index of the kind, for `entity` and `section`
#   title        the section heading, for `entity`
#   description  the section's one-line summary, for `entity`
#   weight       where the section sorts among the site's sections, for `entity`
#   reason       why a kind is not published, for `none`
#   empty        why the index may hold no object of the kind, for a kind `share/kinds.yaml`
#                declares whose objects are written by an act and not by a person. Without
#                it an entry for a kind the index does not hold is refused; with it the entry
#                stands before the first object and after, so the act that writes the first
#                one need not also edit this file
#
# A kind published as `entity` must not also have an editorial section: two pages for one
# object is the duplication this whole subsystem exists to remove.

# ---------------------------------------------------------------- generated from the objects

[[kinds]]
kind = "adr"
projection = "entity"
route = "/adrs/"
title = "Decisions"
description = "Every architecture decision this repository has recorded, with what it supersedes, what it put in force, and what has since referred back to it. One page per decision, generated from the decision's own file."
weight = 45

[[kinds]]
kind = "rule"
projection = "entity"
route = "/rules/"
title = "Rules"
description = "Every rule in force here — the vendored doctrine package and this repository's own — with the class it declares, the artefacts it names as its enforcement, whether the tree holds them, and the rules either side of it in the dependency graph."
weight = 46

