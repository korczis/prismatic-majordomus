# The publication model of this repository: what makes the public site different, what the
# fast path is allowed to spend on making it different, and how the result is measured.
# `scripts/pages` reads this file and nothing else; .github/workflows/pages.yml is an adapter
# over that script, and docs/GITHUB_PAGES_PERFORMANCE.md explains the design it encodes.
#
# A budget here is repository-controlled latency only. The Actions queue, runner allocation
# and GitHub's own "pages build and deployment" are measured and reported but never budgeted:
# they are not this repository's seconds to spend, and a gate that fails on them would fail
# on GitHub's weather rather than on a regression anybody can fix.
version: 1

# ---------------------------------------------------------------- what triggers a publication
# The site can only differ when an input of the site generator, of the site itself, or of the
# publication path differs. That set is not written here twice: `gate` names the gate of
# .ai/repo/ci/gates.yaml that builds the site, and the paths are the union of the classes that
# select it. `scripts/pages paths` computes them; test/cases/97_pages_fast_path.sh holds the
# workflow's own trigger to that computation, so the two cannot drift.
trigger:
  branch: master
  gate: site-build
  # paths that change what is published and that no class selecting the gate above covers.
  # The pipeline's own files, and since ADR 0086 the inputs of the crate's rustdoc, which the
  # site composes at /rustdoc: the crate's sources and manifests, the toolchain that renders
  # them, its producer and the action that runs it here. They are extras rather than classes
  # of the site-build gate because the reference is built by its own producer and never by
  # the site build, so a change to the crate must publish without making every Rust change
  # plan the site's gates (test/cases/94_ci_plan.sh holds that it does not).
  extra:
    - .github/actions/rustdoc/**
    - .github/workflows/pages.yml
    - apps/majordomus-cli/Cargo.lock
    - apps/majordomus-cli/Cargo.toml
    - apps/majordomus-cli/build.rs
    - apps/majordomus-cli/src/**
    - rust-toolchain.toml
    - scripts/pages
    - scripts/rust-check
    - scripts/site-deploy

# ---------------------------------------------------------------- how a publication happens
deploy:
  branch: gh-pages
  output: site/public
  # the served file that names the commit the public site was built from; the probe reads it
  identity: build.json
  publish: scripts/site-deploy --skip-build

# ---------------------------------------------------------------- what the fast path may spend
# Seconds, wall clock, on a GitHub-hosted Linux runner with the caches warm. Derived from
# measurement, not from taste: `scripts/pages benchmark` locally and the timing rows every
# deployment writes are what these were set from, and what a change to them must cite.
#
# There is one key per row `scripts/pages report` actually measures, and `controlled` is the
# sum of them. Both halves of that are load-bearing and neither held until 2026-09-12. The
# first set named `checkout` and `setup` separately while the workflow times them as one step,
# and named no phase at all for `fingerprint` or `local-check` — so three of the six rows of
# every job summary printed an empty budget cell. It also summed to 105 against a `controlled`
# of 75, which made the aggregate stricter than the parts it is made of: every phase could be
# inside its own budget and the run still breach, with nothing to point at. A total that
# cannot be reached by adding up its own rows is a number nobody can act on.
#
# THE MEASUREMENT THESE WERE RE-DERIVED FROM (2026-09-12). Twenty-five runs of
# .github/workflows/pages.yml that reached the publish step, 2026-09-10T22:56Z ..
# 2026-09-12T06:38Z, read from the per-step timings of
# `gh api repos/korczis/prismatic-majordomus/actions/runs/<id>/jobs`, on ubuntu-latest with
# both cache domains restoring:
#
#   row              min  median  p90  max   budget  headroom over p90
#   checkout-setup     7      10   12   15       18              1.5x
#   fingerprint        0       0    0    1        3                --
#   build              4       4    5    6        8              1.6x
#   check             30      38   46   47       60              1.3x
#   local-check        0       0    0    1        3                --
#   publish           13      20   24   24       28              1.2x
#   controlled        60      75   84   86      120              1.4x
#
# THE rustdoc ROW (ADR 0086), PROVISIONAL UNTIL THE FIRST RUNS OF THE rustdoc JOB MEASURE IT.
# The reference is produced by a job of its own that the deploy job waits for, so its wall
# time, checkout to upload, plus the download of its artifact in the deploy job, is a phase of
# the controlled path; the deploy job writes it as the row `rustdoc`. No runner has run it yet.
# What has been measured is the step itself, `scripts/rust-check --doc`, on an Apple M5 Pro on
# 2026-09-24: 12, 6 and 6 s warm (cargo doc 10, 4 and 5 s, the handoff 2, 1 and 1 s; 2991
# files, 84 MB), and 34 s for a cold `cargo doc` into an empty target directory (519 MB). The
# warm budget of 90 is that step at about three times the laptop's time on a four-vCPU runner
# (rustdoc of one crate is mostly one core), plus the setup-rust toolchain and cache restore,
# the checkout, and the artifact's upload and download, estimated at about 60 s together. Set
# it from the first twenty runs' timing rows, as the rows above were set, and replace this
# paragraph with that measurement.
#
# WHY THE OLD BUDGET WAS WRONG, RATHER THAN THE PATH HAVING REGRESSED. The numbers above
# replace the set written when this file was created (b959046cd) and never changed since.
# Those were derived from .ai/repo/benchmarks/pages/baseline.macos-arm64.json — a local macOS
# arm64 laptop, five samples, `check` median 9799 ms — over a site of 417 routes. The site
# `check` walks is now 1021 routes, 2.45x that baseline, and that file's own README says a
# baseline of one machine says nothing about another. Nothing regressed: over the same
# twenty-five runs `checkout-setup` held at 7-15 s and `build` at 4-6 s, so both cache domains
# below restore; and `check` cost 41 ms per route at 896 routes on 2026-09-10 (37 s) against
# 45 ms per route at 1022 routes on 2026-09-12 (46 s), so its growth is the corpus it walks
# rather than a defect in how it walks it. What had gone stale was the budget, which had never
# been re-derived on the machine it judges.
budget:
  warm:
    # everything before `scripts/pages build`, which the workflow times as one row because it
    # runs as one step: the runner's own checkout and the setup-site action. The Actions queue
    # is measured before this and is deliberately not in it. The name is one token because
    # the keys of this file are [A-Za-z0-9_-] — `mj_yaml_flatten` refuses anything else.
    checkout-setup: 18
    fingerprint: 3
    build: 8
    # the whole of `scripts/site-check`, which walks every published route. It is the phase
    # that grows with the site and the first place to look when `controlled` moves.
    check: 60
    local-check: 3
    publish: 28
    # the rustdoc job, checkout to upload, and its artifact's download: provisional, see above
    rustdoc: 90
    # the sum of the rows above, and the number the SLO verdict is taken against
    controlled: 210
  # a cold runner pays for the caches it cannot restore; it is still bounded. No cold run
  # appears in the window above, so this keeps the allowance the previous pair expressed —
  # 180 against a warm 75, which is 105 s for an uncached `npm ci` and Zola download — over
  # the re-derived warm budget, and adds the rustdoc job's own cold cost, as provisional as
  # its warm row: every dependency's metadata built before the crate is documented, 34 s cold
  # on the laptop above against 6 warm, so about 100 s more on a runner and 150 with the
  # toolchain download. 210 + 105 + 150.
  cold:
    controlled: 465
  # push -> publicly observable. Reported against every deployment, and not enforced: the
  # queue and GitHub's own Pages build are the larger half of it and neither is ours.
  end_to_end: 60

# ---------------------------------------------------------------- what is cached, and by what
# Each domain is invalidated by its own inputs and nothing else, so a documentation change
# does not evict a toolchain and a lockfile change does not evict the site.
caches:
  - id: node-modules
    path: node_modules
    inputs: [package-lock.json]
    saves: npm ci
  - id: zola
    path: .mj-cache/zola
    inputs: [.ai/repo/ci/pages.yaml]
    saves: the Zola release download
