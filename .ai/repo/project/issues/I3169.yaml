id: I3169
milestone: campaigns-are-read-as-provenance
title: "A new pack enters campaigns/ through one command that checks the archive before writing a byte"
slug: a-pack-is-checked-before-it-is-kept
priority: p2
profile: implementation
objective: "Add a campaign add command that reads a ZIP or directory with limits on member count, sizes, decompression ratio, nesting, path traversal and symlinks, writes the pack verbatim, appends campaigns/MANIFEST.sha256 and the campaign index member, and executes nothing it contains."
why: "ADR 0124 point 6 (untrusted content, ZIP safety); the 2026-10-10 design separated ingestion from authorisation to execute; owner 2026-10-13: packs carry a schema, prompts and instructions. Proposed in ADR 0180 (A prompt pack is a campaign: kept as received, indexed as a kind, and cited by the records it drove) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c210#4, chatgpt-majordomus:c245#6."
current_state: "Packs are copied in by hand and checked by campaigns-check afterwards."
desired_state: "One safe command; the same check refuses a hand copy that breaks it."
scope:
  - "apps/majordomus-cli/src/commands"
  - "apps/majordomus-cli/src/cli.rs"
  - "share/commands.yaml"
  - "scripts/ci/campaigns-check"
  - "campaigns/README.md"
  - "test/cases"
non_scope:
  - "Network fetches"
  - "Running prompts"
depends_on:
  - "I3167"
serves:
  - "campaigns-are-provenance-the-plan-reads#intake-is-safe"
acceptance_criteria:
  - "Each unsafe archive shape is refused before a write"
  - "A safe pack lands with manifest and index rows"
  - "Each new case named here takes its number from `scripts/case-numbers next` and is announced on the board before the file is written (ADR 0053); a case number written in this record before that is provisional"
validation:
  - "bash test/run.sh 340_a_brief_is_kept_as_received"
evidence_required:
  - "case_pack_checked_before_kept"
created_at: 2026-10-18
updated_at: 2026-10-18
