  { label = "The challenge: watch it refuse an agent", href = "/challenge/", bar = true },
  { label = "Guarantees", href = "/guarantees/", bar = true },
  { label = "Evidence graph", href = "/evidence/", bar = true },
  { label = "The finish contract", href = "/contract/" },
  { label = "Doctrine", href = "/doctrines/" },
  { label = "Decisions", href = "/adrs/" },
  { label = "Rules in force", href = "/rules/" },
  { label = "Benchmarks", href = "/registry/benchmarks/" },
  { label = "Token economics", href = "/economics/" },
  { label = "Limitations", href = "/limitations/", bar = true },
  { label = "Roadmap", href = "/roadmap/", bar = true },
