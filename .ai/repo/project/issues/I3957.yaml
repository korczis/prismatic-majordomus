depends_on: []
acceptance_criteria:
  - "A case extending the stand-in-cargo fixtures of cases 3831 and 3177 walks every command path through bin/majordomus, bin/majordomus-cli, bin/majordomus-mcp, the just bridge, each git hook and every gate, with the executable missing and then stale, and counts zero cargo invocations"
  - "An installed release whose build generation differs from the tree is refused, and one whose generation matches is used"
  - "The edit guard and the pre-commit guard name their outcome for a stale executable; neither passes silently"
  - "Cases 3177, 3221 and 3831 still pass, or are amended with the reason ADR 0224 gives"
validation:
