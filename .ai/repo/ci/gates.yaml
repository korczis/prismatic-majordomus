# The CI model of this repository: which validation gates exist, which job runs each, and
# which classes of changed paths can affect which gates. scripts/ci-plan reads this file and
# nothing else to decide what a change must run; .github/workflows/validate.yml is a thin
# adapter over that plan and carries no path list of its own. A path class that is wrong
# here is wrong once, in the one place the tests read (test/cases/94_ci_plan.sh).
#
# Rules the planner applies:
#   - a gate with `always: true` runs in every plan;
#   - a changed path selects the gates of every class whose pattern matches it (the union,
#     never the first match), so an overlap can only widen a plan;
#   - a class whose gates are the word `full` escalates the whole plan;
#   - a changed path that no class matches escalates the whole plan, and the plan names it;
#   - a class's `except` lists single paths (never patterns) its patterns cover and it does
#     not: the path still falls in every other class that matches it. It is how a data file
#     under an escalating directory is planned by its readers instead of escalating;
#   - `implies` adds a gate whenever its parent is selected (a full Rust gate includes the
#     registry checks); `requires` names the gate a gate cannot run without (the probe needs
#     the built site), which the planner adds;
#   - `subsumed-by` names a gate that runs everything this gate runs: when that gate is in the
#     plan, this one is not planned beside it, and the plan says so. It is how a gate that
#     exists for the plan which does not run the suite (the case gates of the record shapes
#     below) stops running the same cases a second time on a plan that does. It is decided
#     last, once `implies` and `requires` have been applied, so a subsuming gate that is only
#     implied still subsumes; a subsuming gate that is not in the plan (a shape leaves the
#     suite out) subsumes nothing, and the gate is planned exactly as without the field. The
#     executable's reader (src/gates/model.rs) applies the same rule at the same point, and
#     both refuse a gate subsumed by itself, by a gate that does not exist, or by a gate that
#     is itself subsumed.
#   - the full plan (a master push, the schedule, a dispatch, a pull request labelled ci:full, or the
#     escalations above) selects every gate but the on-demand ones;
#   - a gate with `on-demand: true` is planned only when the plan is asked for it
#     (`scripts/ci-plan --on-demand`), which the schedule, a dispatch and a pull request
#     labelled ci:full do and a routine push does not. It is not a weaker gate: it is one
#     whose runner this repository cannot get on demand, and a plan that selects it on every
#     push is a plan that never completes. The three that carry it say why, below.
#   - a `shape` is the one rule that narrows. A change of a shape — at least one changed path
#     matches the shape's `records`, and every other changed path is a derived file — plans
#     the `always` gates and the shape's own `gates` (with `implies` and `requires` applied)
#     instead of the union of its classes. A derived file is one git marks `merge=derived`
#     AND a pattern of the block scripts/gitattributes generates matches from the root: git's
#     answer alone is not enough, because an attribute line outside that block, a nested
#     .gitattributes, or a pattern without a slash (which git matches at any depth) would let
#     an authored file pass as a derived one. Only an affected plan narrows: `--full`, an
#     escalating class and an unclassified path are never narrowed, and the plan names the
#     shape and why. What makes it sound is that the shape's gates prove every derived file
#     equal to its regeneration (see the shape below), so the record is the only authored
#     input in the change. The executable's reader (src/gates/model.rs) applies no shape and
#     plans the union, which can only be wider.
#
# Lanes and tiers (ADR 0186). Every gate declares a `lane`, the time horizon its verdict
# belongs to: `feedback` is cheap, fast and decisive, and a pull request's required verdict
# needs it green; `proof` is the heavy half (the suite, the browser sweeps, the crate's
# lanes, coverage, macOS, the installer), which judges the combined top before it lands;
# `release` is a gate only a release asks. The `tiers` map names, for each moment a plan is
# asked at, the lanes it runs. A structure gate is feedback when structure-durations.tsv
# measures it at about a minute or less, or its note says seconds and file reads; the ones
# that cost more (core-check, shell-lint, worktree-topology, evidence-check), that reach
# the network (github-projection) or that nothing has measured (plan-drift) are proof until
# a measurement says otherwise. No gate is release-only today. Both readers refuse, once
# `tiers` is declared, a gate without a lane and a tier naming a lane that does not exist,
# and always a lane that is none of the three. Lanes select nothing yet: the plan is exactly
# what it was without them (I2350, slice S2; slice S4 selects by tier).
#
# Patterns: `**` crosses directories, `*` does not, a pattern without a wildcard names one
# path. Paths are repository-relative, as `git diff --name-only` prints them.
version: 1

# The lanes each tier runs (ADR 0186): a push checked here and a pull request run the
# feedback lane, the combined top the landing seat integrates adds the proof, and a release
# runs all three.
tiers:
  local: [feedback]
  pull-request: [feedback]
  integration: [feedback, proof]
  release: [feedback, proof, release]

gates:
  - id: shell-lint
    job: structure
    lane: proof
    always: true
    runs: scripts/ci/shell-lint
    summary: bash -n over every script, shellcheck over the tool, the scripts and the cases

  # The raw prompt archive is ignored and doctor refuses a repository that tracks it; neither
  # covers a *derived* artefact that carries a prompt. One `find` in a site generator that
  # forgot to exclude the local half would publish the archive with no prompt file committed
  # anywhere for a reviewer to see. File reads only, so it belongs with the structure checks.
  - id: prompt-privacy
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/prompt-privacy
    summary: no published or generated file is a prompt record, a rendering, or a copy of one; every site generator names the local half so it can exclude it

  - id: ui-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/ui check
    summary: the static half of UI conformance — every scrolling box this repository writes is reachable from the keyboard

  - id: pipefail-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/pipefail-check
    summary: a script that pipes under `set -e` may not report its pipeline's failure as its last command's success; a ratchet over the scripts that still can

  - id: argv-limit-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/argv-limit-check
    summary: a whole file's JSON may not travel to jq on the command line — Linux refuses a single argument over 131072 bytes and macOS never will, so the shape is checked rather than the size

  - id: doc-command-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/doc-command-check && scripts/ci-plan --inventory
    summary: a command the documents tell a reader to run is executed by a use-case scenario or a command-line example, or marked with the reason it cannot run here; and no tracked file outside this model lists gates or runs several of their commands, each a ratchet over what still promises or lists without proof (.ai/repo/ci/gate-list-baseline.txt)

  - id: liveness-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/liveness-check
    summary: a wait with no bound, a process spawned and never reaped, a command that pages to a terminal; a ratchet over the shell that still carries them

  - id: build-cache-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/build-cache-check
    summary: a local script that runs cargo build, test or run, npm ci or install, or mix deps.get outside the cache's choke points declares why on the line; GitHub workflows are a declared exemption

  # Development semantics belong to the capability registry and every surface consumes them
  # (ADR 0040). File reads only — share/commands.yaml against docs/generated/registry.json,
  # plus the two Cockpit trees — so it belongs beside the other structure checks and needs
  # no build. The debt is ratcheted in .ai/repo/development-semantics-baseline.txt; the gate
  # fails on a new entry, not on the accepted ones.
  - id: development-semantics
    job: structure
    lane: feedback
    always: true
    runs: scripts/development-semantics-check
    summary: a mutating development command is backed by a capability of the canonical runtime and a Cockpit tree reaches into no layer path; the debt ratchets down and may not grow

  # A tool that says what somebody else's product can do is making a claim about a third
  # party, and this repository was making two of them wrong at once until ADR 0103: it
  # reported one of the six providers it declares, and the omission had gone stale because
  # two of the five had shipped hook systems since. The gate reads share/providers.yaml and
  # runs `capture status`; no build, so it belongs with the other structure checks.
  - id: provider-evidence
    job: structure
    lane: feedback
    always: true
    runs: scripts/provider-evidence-check
    summary: every declared provider's session and prompt capability is declared with the citation it was verified from, and every one of them is reported

  - id: core-check
    job: structure
    lane: proof
    always: true
    runs: scripts/ci/core-check
    summary: doctor, watch, the context documents, the continuity commands, plan validate, the offline GitHub projection, every reference a document makes, the derived site data

  - id: evidence-check
    job: structure
    lane: proof
    always: true
    runs: scripts/evidence-check
    summary: every claim that declares a guarantee, against the run actually recorded for it; a ratchet over the claims no recorded execution yet supports

  - id: site-basepath
    job: structure
    lane: feedback
    runs: scripts/site-basepath-check
    summary: the documentation source states no origin-absolute link, so one build serves both the published site and the executable's /docs mount

  # Two branches claiming one decision identity is a defect of the *pair of trees*, so no
  # check that reads one tree can see it: `generate --strict` meets it at the merge, excludes
  # every claimant and names the identity rather than the two sessions. `adr check` asks it
  # of the other refs instead — for every identity this branch adds relative to the base, does
  # another ref already carry a different decision there — and `doctor` runs the same
  # examination in the pre-commit hook, where the answer is still cheap to act on. Git
  # plumbing and file reads only, no build, so it belongs with the structure checks; the job
  # checks out at fetch-depth 0, and the check says out loud when it cannot see the other
  # refs rather than exiting clean.
  - id: adr-collision
    job: structure
    lane: feedback
    runs: bin/majordomus adr check
    summary: every decision valid and its references resolving, and no identity this branch adds is already carried by a different decision on another ref

  # The knowledge graph refuses an identity two sources claim: `knowledge nodes` exits 10 and
  # names it, rather than keeping one claimant and hiding the ambiguity. Nothing ran it. For a
  # day it exited 10 on this repository with eleven directory contracts claimed twice (a line
  # that forced every context document to `document`, so the two classes discovering one README
  # emitted one identity), and every surface that reads the graph was faithful to a graph that
  # had refused to hold them. A reporter nobody asks is a declaration, not an enforcement. File
  # reads and the version-control index only, no build; shared scope, because operational
  # records are one checkout's own and CI holds none.
  - id: knowledge-nodes
    job: structure
    lane: feedback
    always: true
    runs: bin/majordomus knowledge nodes --scope shared
    summary: every canonical object is one node with one identity; an identity two source classes claim is refused by name, and the refusal fails the plan

  # The same question for every path, not only for decision identities: does another unmerged
  # branch already add, independently and differently, a path this pull request adds? A
  # collision is a defect of the pair of trees, so it can only be asked across refs, and a
  # checkout that cannot see them gets 12 rather than a pass. It must run on every plan,
  # because the answer turns on what other branches carry, not on which class of path this
  # change touches. Git plumbing only; the job checks out at fetch-depth 0. A related branch
  # (one this is built on) and a same-bytes copy (a rescue branch) are listed and pass; a
  # person accepts a real collision with the label collision:accepted.
  - id: collision-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/collision-gate
    summary: no path this pull request adds is added independently, with different content, by another unmerged branch; related work and same-bytes copies are listed, and a checkout that cannot see the other branches says so instead of passing

  # The second identifier this repository allocates by hand: a behavioural case's number. Two
  # files of one identity in one tree is the defect this refuses; the collisions of the day it
  # was written sit on the baseline, because they are spread across other sessions' branches
  # and renumbering them would break those. File reads only, no build, no git.
  # always: two branches that each add a case under the same number are both clean alone,
  # and neither change's paths select this gate on the other's merge. The pair exists only
  # in the merged tree, so the gate is asked of every plan (2026-10-12, 1096 twice on master).
  - id: case-numbers
    job: structure
    lane: feedback
    always: true
    runs: scripts/case-numbers check
    summary: no file under test/cases/ shares its identity with another, beyond the collisions recorded on the baseline

  - id: shell-suite
    job: suite
    lane: proof
    runs: MJ_TEST_JOBS=4 bash test/run.sh
    summary: every behavioural case, in a disposable repository each, four at a time

  - id: rust-integration
    job: rust
    lane: proof
    runs: scripts/rust-check --integration
    summary: the executable built, the registry validated, every committed projection current, the benchmark coverage complete

  - id: command-graph
    job: rust
    lane: proof
    runs: scripts/ci/command-graph
    summary: the command graph builds without an error, and no workflow file carries a hand-written bridge to either program

  - id: rust-check
    job: rust
    lane: proof
    implies: [rust-integration, rust-quality]
    runs: scripts/rust-check --ci
    summary: fmt, clippy with warnings denied, the suites and doc examples, rustdoc, the benchmarks building, the registry checks, the benchmark runner through every transport

  # `always`, and it was not. No class named this gate, so the one check that catches a
  # public command missing its reference, its fixture, its demo or its cases ran only in a
  # full plan — which a routine push is not. A change to share/commands.yaml alone, which is
  # exactly how a command is added, planned every gate except this one. It reads files and
  # takes under a second, which is why it can be unconditional rather than classed.
  - id: command-furnished
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/command-furnished
    summary: every public command carries its reference section, its fixture, its demo and its behavioural and negative cases, reported in one pass rather than one refusal per derivation

  - id: rust-command
    job: structure
    lane: feedback
    runs: scripts/ci/rust-command-check --strict
    summary: every composed command module asserts, in the file that declares it, that it is what it claims

  # Seventeen seconds, file reads and git only. Unconditional rather than classed: what a
  # chapter rests on can be a document, a rule, a decision, a claim, a command or a module,
  # so the change that breaks it can arrive through any path, and a class list that forgot
  # one would be the gap (project.the-handbook-is-built-from-the-tree, ADR 0149).
  - id: handbook-check
    job: structure
    lane: feedback
    always: true
    runs: python3 handbook/build.py --check
    summary: every edition of the handbook builds from this tree; a chapter whose declared anchor left the repository's graph, a chapter that cites nothing, a caption with no figure behind it and derived data that changed shape each fail

  - id: english-only
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/english-only-check
    summary: every authored file is spelled in English; a letter that occurs in Czech, Slovak or Polish and never in English, or a whole other script, fails — proper nouns and files that use a foreign string as test data are declared with their reason beside the check

  # File reads only, under a second, so it is unconditional rather than classed: the dependency
  # it refuses can arrive through any manifest, script or configuration file, and a class list
  # that forgot one would be the gap.
  - id: prismatic-independence
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/prismatic-independence-check
    summary: no submodule, gitlink, dependency manifest, script, hook, workflow or configuration file names a Prismatic project; the project's own name and the bare brand word are not references, and documents are out of scope

  - id: finding-reproduce
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/finding-reproduce-check
    summary: every finding a command reports names the command that reproduces it; a reporting call with too few arguments, or one this gate cannot parse, is a finding of its own

  # A skill is a capability only when something proves it: a test names it and the evidence
  # ledger holds a run of that test, a surface invokes it, a doctrine and this gate hold it
  # (project.skills-are-proven-capabilities, ADR 0076). The verdict is the executable's
  # `skills verify`, the same derivation the command line, HTTP and MCP answer with; an
  # orphan fails, evidence that is not current is reported and does not.
  - id: skills-proof
    job: structure
    lane: feedback
    runs: bin/majordomus-cli skills verify
    summary: every active skill is named by a test and invoked by a workflow, prompt, profile, provider template, recipe or CI workflow; no test or invocation names a skill that does not exist

  # Two tests demand to name every active skill — the crate's tests/skills.rs in its header
  # and case 391 in its first marker line — and skills-proof cannot see that demand: it asks
  # only that some test names each skill. On 2026-10-13 an active skill named by neither
  # passed the structure job, was merged with --admin, and turned the trunk's rust lane red
  # an hour later (I2664). This reads the same lines in seconds and builds nothing.
  - id: skill-naming
    job: structure
    lane: feedback
    runs: scripts/ci/skill-naming-check
    summary: every active skill is named where a test demands the whole list — the majordomus-skill header of apps/majordomus-cli/tests/skills.rs and the first marker line of test/cases/391_skills_are_proven_capabilities.sh — and neither names a skill that does not exist

  # docs/COCKPIT_IDE_AUDIT.md's gap matrix says "Planned" requires a plan object, and nothing
  # read it: a row could claim to be scheduled with nothing scheduling it (I1510). This reads
  # the matrix and the plan's issue records together, keys on the status vocabulary and the
  # issue ids only, and builds nothing.
  - id: audit-plan
    job: structure
    lane: feedback
    runs: scripts/ci/audit-plan-check
    summary: every row of docs/COCKPIT_IDE_AUDIT.md's gap matrix whose status is planned names an issue id, and every id it names is an issue of the plan; rows in the other statuses are evidence claims and are not read

  # The release-record-cases gate below runs its cases by name, and a case that reads the
  # release record and is not on that list is one the release record's pull request never
  # runs. Which cases those are is defined once, in the script; case 94 asks the same script.
  # On 2026-10-14 a branch that added such a case went red only in case 94, in a suite shard
  # (I2716). This reads the cases and the model in seconds and builds nothing.
  - id: release-record-listing
    job: structure
    lane: feedback
    runs: scripts/ci/release-record-cases-check
    summary: every case that names the release record or reads what is offered from it is run by the release-record-cases gate, and every case that gate names exists

  # The ChatGPT source pack of this repository can be built (rule
  # project.packs-carry-only-sources): the plan of the `chatgpt` profile has no finding — no
  # file over a shard's token budget, no more files than a ChatGPT project indexes, no file
  # naming the checkout it was planned in. Reads the index's blobs; writes nothing.
  - id: pack-plan
    job: structure
    lane: feedback
    runs: bin/majordomus-cli pack plan chatgpt
    summary: the chatgpt pack plans clean — every file within a shard's token budget, the shards within the file count, no source naming the checkout, never a binary, worktree, link or build artifact

  - id: rule-proof
    job: structure
    lane: feedback
    runs: scripts/ci/rule-proof-check
    summary: every blocking rule names what proves it and every proof is in the tree; a blocking rule that names none is new debt, a named case that was renamed or deleted fails outright, and the verdict names the population it is not about (claims are the claim-proof gate)

  # The commit policy over the history (rule project.conventional-commits). Needs the
  # executable, because the judge is the executable's — the gate chooses a range and
  # compares a count, and carries no grammar of its own. The branch's own commits must pass
  # outright; the history's existing debt is ratcheted in
  # .ai/repo/commit-policy-baseline.txt.
  - id: commit-policy
    job: structure
    lane: feedback
    runs: scripts/ci/commit-policy
    summary: every commit this branch adds satisfies the repository's commit policy, and the history's recorded debt does not grow

  # A grep over the tree, so it costs nothing and runs in every plan: a second parser of
  # the lease can be introduced from a shell script, a recipe, a hook or the crate, and no
  # one path class names all four.
  - id: lease-reader
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/lease-reader-check
    summary: the shared server's lease is parsed by the one typed reader the executable owns; a second parser anywhere but documentation and the tests is refused

  # A claim marked guaranteed names a test, and the test names the claim back. The other end
  # of the promise — a rule declared blocking that names no proof — is the `rule-proof` gate
  # above and is not measured here; this gate carried a weaker duplicate of it until the two
  # verdicts were read as contradicting each other. File reads only (docs/CLAIMS.yaml and the
  # tests it names), so it belongs beside the other structure checks and needs no build. The
  # debt is ratcheted in .ai/repo/claim-proof-baseline.txt; the gate fails on a new claim, not
  # on the known ones.
  - id: claim-proof
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/claim-proof-check --strict
    summary: every claim marked guaranteed names a runnable test that names the claim back, so the link reads from both ends; the verdict states its denominator and names the population it is not about, and with the debt at zero any exception fails

  # A number about tokens, context or cost reaches a reader only from recorded evidence: prose
  # that types one is refused, and a claim bound to an economics metric cannot be guaranteed
  # while the metric's evidence does not stand (ADR 0082).
  - id: economics-claims
    job: structure
    lane: feedback
    always: true
    runs: bin/majordomus-cli economics check
    summary: no quantity about tokens, context or cost is typed into hand-written prose, and every claim bound to an economics metric is guaranteed only while its evidence is current and meets the binding

  # The third population. A public command must have an executable use case and doctor fails
  # without one; a guaranteed claim is held by claim-proof above. The tools the registry
  # projects over MCP were held by nothing: `use_cases.coverage.mcp_tools` is advisory, and
  # for that class `covered` means NAMED, because no use-case scenario can reach an MCP tool.
  # Greps over the generated registry and the files that send a tools/call, so it costs
  # nothing and needs no build. The debt is ratcheted in .ai/repo/mcp-tool-run-baseline.txt;
  # the gate fails on a tool that arrives unexercised, not on the known ones.
  - id: mcp-tool-run
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/mcp-tool-run-check
    summary: every MCP tool the registry projects is sent a tools/call by a case or an integration test of this repository; the verdict states its denominator and the populations it is not about, and the uninvoked set may not grow

  # Without --summary: the verdict and the exit status are the same, and a failure lists each
  # finding with its file, symbol and remedy instead of "findings were not listed". Two
  # implementations failed here on 2026-10-14 and had to rerun the report to learn why
  # (I2715). scripts/rust-check asks the same subcommand first, so an author meets the same
  # finding text before the structure job does.
  - id: rust-quality
    job: structure
    lane: feedback
    runs: bin/majordomus-cli quality report
    summary: the crate's own exported surface — documentation beyond the signature, an executable example on everything that carries behaviour, a module boundary something exercises — and every command of the command line accounted for against the capability registry

  - id: generation-converges
    job: structure
    lane: feedback
    runs: scripts/ci/generation-converges
    summary: generating twice changes nothing the second time — no artifact is written from a value the same run also writes

  # I4512: a derived file past .ai/repo/scope.yaml's out.max_bytes leaves the index, stage C of
  # scripts/derive then reads an index without it, and the derive converges only on a second
  # run — on whichever branch first grows the file past the edge. Every plan runs it, because
  # what grows a derived page is a canonical record anywhere, not a changed path of its own.
  - id: derived-size
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/derived-size-check
    summary: no derived file whose place in the index its size decides (scope verdict in, or out only as over_limit) is above 75% of out.max_bytes; each one that is, is refused with its size, the fraction and the limit

  - id: rust-coverage
    job: coverage
    lane: proof
    runs: just coverage
    summary: coverage of the crate against scripts/rust-coverage-threshold and of the session/continuity domain against scripts/session-coverage-threshold, both measured with test code out of the denominator

  - id: coverage-differential
    job: coverage
    lane: proof
    runs: scripts/ci/coverage-differential
    summary: every executable line, function and region a change adds or touches under the crate is covered by a test, measured against the branch's merge-base with the trunk over the same export and test-exclusion as the crate gate; new debt is refused, legacy debt on untouched lines is not this gate's business (project.new-code-is-covered)

  # macOS, because the one committed baseline is macOS's. On demand for the reason below:
  # its runner is the scarce one, and a queued benchmark check is not a measurement.
  - id: rust-bench
    job: bench
    lane: proof
    on-demand: true
    runs: bin/majordomus-cli bench --profile ci --check --no-write
    summary: the benchmark check against the committed baseline of its platform (macOS, the one platform with a baseline under .ai/repo/benchmarks/rust/)

  - id: projection-closure
    job: rust
    lane: proof
    runs: scripts/ci/projection-check
    summary: the command line, the one interface declared twice, agrees with the registry — no capability claims a command clap does not answer, and no new command is hand-written rather than derived

  - id: web-topology
    job: rust
    lane: proof
    runs: bin/majordomus-cli web validate
    summary: the repository's web surfaces resolve into one topology with no collision, no nested claim and no directory outside the generated root

  # An intent names the milestones that realise it and the evidence that settles it; a link
  # that resolves to nothing would read as a planned intent forever. `intent validate` is the
  # whole model, not only the records: the intents' own links (ADR 0070), the plan's coverage
  # of every criterion through `serves` (ADR 0073), and the gap and critique each intent is
  # held to before execution. Any failure exits 10. It judges links, never evidence: a stale
  # or failing criterion is the realization's to refuse. The executable decides it
  # (project.work-serves-a-declared-intent), so it runs where the toolchain is.
  - id: intent-check
    job: rust
    lane: proof
    runs: bin/majordomus-cli intent validate
    summary: every intent names a milestone and a criterion, and every milestone, evidence reference and governance entry it names resolves; every serves link names a criterion of an intent that realises the issue's milestone, every issue under such a milestone serves a criterion, and a criterion of an intent with work has an issue serving it; the gap and critique hold together, and no serving issue started without a critique or with a blocking finding open; a milestone no intent serves, and weaker coverage, are reported as warnings

  # Closed work that the evidence contradicts. The plan can say every milestone of an intent is
  # DONE while a criterion's recorded run is failing, or not current: that is an intent reading
  # finished that reality says is not, and the realization refuses it with exit 10 naming the
  # criterion (ADR 0075, project.an-intent-outlives-its-sessions). Currency is the evidence
  # module's own judgement at the working tree (evidence::freshness, read through
  # evidence::current): a pass is stale when something the criterion names changed since it,
  # its test no longer hashes to what ran, its commit is not in this history, or it ran on a
  # dirty tree. The plan and the ledger it reads are tracked, and the comparison is against the
  # checkout, so a clean CI checkout answers what a worker with a clean tree does; a criterion
  # never evidenced is a warning (closed_work_unproven), not a refusal.
  - id: intent-realization
    job: rust
    lane: proof
    runs: bin/majordomus-cli intent realization
    summary: no intent whose counted milestones are all DONE has a criterion whose latest recorded run is failing or no longer current evidence at the checkout; criteria never evidenced and work serving no intent are warnings; the work realising each intent, its providers and handovers, and each link's provenance are reported

  - id: cockpit-assets
    job: site
    lane: proof
    runs: scripts/cockpit-assets --check
    summary: every committed stylesheet of the browser surfaces (the Cockpit's and the UI's) matches the source it is compiled from

  # A grep over six files, so it costs nothing and runs in every plan. ADR 0012 decides that
  # no Cockpit page reads the index directly — a page that does is outside the executor, the
  # cache, the counters and the validation every other caller passes through — and until
  # this gate the sentence was documentation only: four reads had grown under it.
  - id: cockpit-projection
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/cockpit-projection-check
    summary: no Cockpit page reads the index directly; every fact a page shows is what a capability answered through Context::execute (ADR 0012)

  # The same scan widened to what ADR 0089 (project.ui-derived-state) asks of an interface:
  # no Cockpit page reads the registry, the product model or the Why catalogue itself outside
  # the navigation's declared allow-list, no health check is ok by literal, no enum defaults
  # to a healthy variant, and no page turns an absent count into zero. Line scans of the
  # crate's sources, so it costs nothing and runs in every plan; the known findings are a
  # ratchet in .ai/repo/ui-integrity-baseline.txt, and a new one fails.
  - id: ui-integrity
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/cockpit-projection-check --ui-integrity
    summary: what an interface shows is derived and unknown is never drawn as healthy — no direct registry, product or Why read in a Cockpit page outside the navigation's allow-list, no health check ok by literal, no healthy #[default], no absent count rendered as zero, beyond the baseline (ADR 0089)

  # Needs no browser, no built site and no node: it reads one YAML file, regenerates three
  # greps the tree for a design decision made outside share/design/tokens.yaml: a colour
  # literal, a raw palette utility, a bracketed size, a second declaration of a token, a
  # read of a token nothing emits, a copy of the brand, a theme key named by hand. Cheap
  # enough to run beside the structure checks; the projections themselves are proved
  # current by generate --check in the rust job, like every other generated artifact.
  - id: design
    job: structure
    lane: feedback
    runs: scripts/ci/design-check
    summary: no source carries a design decision of its own — every colour, size, status word, brand copy and theme key comes from share/design/tokens.yaml through its projections

  # structure-b, not structure (I4381): it costs p50 156 / p90 179 s, and beside shell-lint and
  # core-check it took the one job past its 55-minute bound with every gate green.
  - id: worktree-topology
    job: structure-b
    lane: proof
    runs: scripts/ci/worktree-check
    summary: the branch-to-worktree rule has one constant in the crate, the pre-commit hook asks the guard and the policy declares it, every document and template names the same container, and the behavioural case passes through the built executable

  # The quantities that grow on their own — open pull requests, linked worktrees, local
  # branches, running servers. None shrinks by itself and none is visible from where a person
  # looks, so each one's absence of a command is the defect. The runner has none of these
  # quantities; what it holds together is that the commands still exist, that the reaper is
  # safe by construction, that .gitattributes and the site generator still agree about which
  # trees resolve on merge, and that no document sends a reader to a merge button this
  # repository's merge policy cannot reach.
  - id: backlog-hygiene
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/backlog-check
    summary: every self-accumulating quantity keeps its measuring command, the reaper matches by predicate rather than by name, every derived site tree is declared merge=derived, and nothing advertises the forge merge button

  - id: mesh-check
    job: structure
    lane: feedback
    runs: scripts/ci/mesh-check
    summary: the mesh stays one subsystem — UDP sockets, link transports, link handlers and the journal only under src/mesh/ (and its capability module), one MeshRegistry constructed only there, a Cockpit mesh page that asks the mesh capabilities, and the mesh-declaration kind, its schema and both rules moving together (project.mesh-is-observation-not-authority, project.mesh-cooperation-is-authenticated)

  # Cooperation accepted over a real network: four Linux containers on one docker bridge,
  # multicast discovery with no seeds, links, a claim and a handover across nodes, a node
  # disconnected from the network and healed, a node killed and restarted, and mesh verify
  # inside a node. Loopback integration tests prove the protocol; this proves a network.
  - id: mesh-lab
    job: mesh-lab
    lane: proof
    runs: test/mesh-lab/run
    summary: separate Linux nodes on a real bridge discover each other by multicast, link, share claims and handovers, converge, and recover from a partition and a crash, and scripts/ci/mesh-lab-evidence then judges the record the lab wrote — a complete acceptance or nothing (project.mesh-cooperation-is-authenticated, claim mesh-network-acceptance)

  # ADR 0032 keeps the network half of a workspace adapter out of the crate and asks for a
  # gate, "or the boundary is a sentence rather than a constraint". It reads the manifest
  # for the dependency list and the lock for what a feature flag pulled in behind it: the
  # crate takes jsonschema with default-features = false precisely so that nothing resolves
  # over the network, and turning those features on would add an HTTP client and a TLS stack
  # without adding a line to the list. File reads only, so it runs with the structure checks.
  # The portable core (ADR 0170) is one implementation run in two places: the host and a
  # browser's wasm32. This gate proves both answer the shared fixture: the crate's own tests
  # on the host, then the wasm32 module built and executed by node through the C ABI a
  # browser Worker calls. A module that only compiles proves nothing about what it computes.
  - id: portable-core
    job: structure
    lane: proof
    runs: scripts/rust-check --portable-core
    summary: the portable core answers the shared canonical-digest fixture on the host and, built for wasm32 and executed, in the module a browser loads (ADR 0170)

  - id: crate-boundary
    job: structure
    lane: feedback
    runs: scripts/ci/crate-boundary
    summary: the Rust crate declares only dependencies that were argued for, and links no async runtime, HTTP client, CDP client or TLS stack but rustls over ring (ADR 0032, amended by ADR 0220)

  # The one structural gate that reads the remote. It needs a token (issues:read) and says
  # so rather than passing when it has none: a projection gate that skips quietly is the
  # disease it was written to cure — --check has exited 11 on drift since the adapter was
  # written, and nothing ever called it.
  - id: order-check
    job: structure
    lane: feedback
    runs: scripts/ci/order-check
    summary: a collection has one order — no case-folded comparator outside order.rs, no sort key that renders markup, no locale-collated comparison, and the ordering debt does not grow

  # Entering the repository converges on a ready shared server (ADR 0035), and every piece of
  # that is one reasonable line away from being undone: a `serve ensure` in the file a shell
  # evaluates on entry, a build on either entry path, a switch the schema was never taught, a
  # shim unwired from the provider, a fourth hand parser of the lease. File reads only, so it
  # belongs beside the structure checks; the convergence itself is test/cases/108, which the
  # suite runs, which is why the gate is given --no-suite here rather than running it twice.
  - id: entry-converges
    job: structure
    lane: feedback
    runs: scripts/ci/entry-converges --no-suite
    summary: entry by a shell starts nothing and builds nothing, the start event ensures the server where the policy says it does, the briefing has one author and the lease one typed reader, and a server nobody owns has a bounded life

  # Shell automation is migrating into typed and scripted capabilities (ADR 0069), and a
  # migration converges only if new shell stops arriving. The judge is the executable's own
  # `shell.check` — typed Rust, because a new shell gate is exactly what this refuses — so
  # it needs the executable, and it reads git's index and file heads only: no site, no
  # network. Selected by the `shell-inventory` class rather than `always`, so a plan that
  # touches no governed directory does not build the crate in this job for it.
  - id: shell-inventory
    job: structure
    lane: feedback
    runs: bin/majordomus-cli shell check
    summary: every shell unit under bin/, lib/, scripts/, share/, apps/majordomus-cli/assets/, .githooks/ and .claude/hooks/ is declared in .ai/repo/automation/inventory.jsonl with an exemption that says why it is shell and when it stops being, and no record names a unit the tree no longer has

  - id: step-bound
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/step-bound-check
    summary: every timed step and every full-history checkout of validate.yml and pages.yml declares a bound smaller than its job's, so a step that runs out of time fails with a message instead of being killed by its job and reported as a cancellation; every gate of this model has a step in its job that dispatches it, times it or writes its receipt, so the ci verdict never meets a green job with a silent gate; and a pages.yml step or job named after a row of .ai/repo/ci/pages.yaml is bounded at no less than budget.bound.percent of that row's warm budget

  # network: true marks a gate that reaches beyond this machine (GitHub's API, the live
  # site, the published installer). It is true or absent. scripts/ci/run-plan --before-push
  # never runs such a gate before a push and says so (project.a-push-runs-what-ci-would-find-first).
  # structure-b, not structure (I4381): network-bound, p50 389 / p90 589 s, and it waits on
  # GitHub's API rather than on the CPU the structure gates share.
  - id: github-projection
    job: structure-b
    lane: proof
    runs: scripts/ci/github-check
    network: true
    summary: the GitHub projection still agrees with the canonical model — no record behind, edited, in conflict or unmanaged, and the backlog of unprojected records no larger than its baseline

  # ADR 0166, decision 2: merged work the plan has not recorded is drift. The executable judges
  # it (`majordomus plan drift --gate head|trunk`, capability plan.drift) against the window
  # .ai/repo/ci/plan.yaml declares; the script only says which tree the runner is. Every plan
  # runs it because a stamp, a merge and a clock each move the verdict, and none of them is a
  # changed path. Advisory under `drift.enforcement: advisory` until I2748 settles today's drift.
  - id: plan-drift
    job: structure
    lane: proof
    always: true
    runs: scripts/ci/plan-drift-check
    summary: merged work the plan has not recorded is pending on a head and inside the window declared in .ai/repo/ci/plan.yaml, and refused on the trunk past it with `majordomus plan verify|done <id>` named; active_without_work and done_without_trace are reported and never refuse; a missing or unreadable window refuses

  - id: providers-data
    job: structure
    lane: feedback
    runs: scripts/ci/providers-check
    summary: every provider is declared once beside its template, every projected bootstrap is under the derived merge driver, the generated provider table is current, and no document lists providers by hand instead of pointing at it

  - id: cockpit-probe
    job: cockpit
    lane: proof
    runs: scripts/cockpit-probe
    summary: every Cockpit route the server serves answered, and the pages and interactions measured in a real browser; the route set is the one the UI audit uses

  # The build composes the crate's rustdoc at /rustdoc and refuses without it (ADR 0086), so the
  # command a person runs produces it first, as the site job does through .github/actions/rustdoc.
  - id: site-build
    job: site
    lane: proof
    runs: scripts/rust-check --doc && scripts/site-build && scripts/site-check
    summary: the derived data current, the site built once, every static check over the output

  # Split in six shards (I2841): the site-probe-shard jobs each measure a stride of the routes
  # with the assets the site job built, and the site-probe job's receipt says both that every
  # shard passed and that their reports are every route once (scripts/site-probe --verify-report).
  - id: site-probe
    job: site-probe
    lane: proof
    requires: [site-build]
    runs: SITE_PROBE_JOBS=4 SITE_PROBE_SHARD=K/6 scripts/site-probe, then scripts/site-probe --verify-report
    summary: every route at three widths in a real browser, split in six shards that together are the sweep, the menu, the dropdown, the theme toggle, the diagrams

  # Every link of every page, in every language the site declares, followed in Chromium with the
  # page's scripts running and answered from the build itself (ADR 0218): each lands on a built
  # file, stays in its copy's language, and the switch and the alternates lead to every copy.
  - id: site-languages
    job: site
    lane: proof
    requires: [site-build]
    runs: node scripts/lib/site-i18n-probe.mjs site/public "$(sed -n 's/^base_url = "\(.*\)"/\1/p' site/config.toml)" --jobs 4
    summary: every link of every page in every language lands, stays in its language, and the switch and the alternates lead to every copy

  # The crate's Rust API reference, judged as the published surface it is (ADR 0086): the pages
  # rustdoc wrote for the one invocation the rust-check gate proves warning-free, handed off by
  # that same step into target/web/rustdoc — so it `requires` rust-check, whose --ci run in this
  # job is what produces the tree, and a plan that selects it can never run it against no tree
  # or an older one. The site's own contracts do not read these pages (they are another
  # producer's); this is their contract: every exported item at its derived route, no orphan
  # page, the tree built from HEAD, the crate index and its assets present, every internal link
  # resolving, and no machine path or secret in a published byte.
  - id: rustdoc
    job: rust
    lane: proof
    requires: [rust-check]
    runs: bin/majordomus-cli quality rustdoc
    summary: the crate's published rustdoc tree is this commit's and complete — every exported item has its page at its derived route, no page is an orphan, the crate index and its assets are present, every internal link resolves, and no machine path or secret is published

  # Every interactive control on every page of the built site, exercised in a browser by the behaviour spec
  # that claims it (project.every-link-and-control-is-tested). A job of its own: the site job's browser
  # steps already use its whole bound, and a gate that shares a job which never finishes enforces nothing.
  # Split in six shards (I3602): the interaction-probe-shard jobs each drive a stride of the pages of the
  # site job's build, and the interactions job's receipt says both that every shard passed and that their
  # reports are every page once (scripts/site-probe --verify-report, the one fan-in for both probes).
  - id: interaction-probe
    job: interactions
    lane: proof
    runs: scripts/site-build --no-data, then MJ_PROBE_SHARD=K/6 scripts/interaction-probe per shard, then scripts/site-probe --verify-report
    summary: every interactive control on every page is claimed by one behaviour spec and does what it says in a browser — menus, dropdowns, theme, copy buttons, tabs, filters, the diagnosis, the contract, the changelog, the graphs and every keyboard scroll region

  # A job of its own for the same reason as interaction-probe: after the site job's build, check and
  # probe, the audit no longer fit that job's bound and was killed mid-run.
  - id: ui-audit
    job: ui
    lane: proof
    requires: [site-build]
    runs: scripts/rust-check --doc && bin/majordomus-cli bench system.http. --transport system --profile ci --no-write --check && scripts/ui audit --report && bash test/run.sh --no-skips --runs-in ui
    summary: "every warm screen of the UI within the latency budget the benchmark policy declares, measured over a real socket; then every discovered page of every surface the executable serves — built directories and the routes it renders itself — at every width the theme implies, in a browser, against the responsive, semantic, component and WCAG invariants; the report is rendered at /tests/ui; then the cases that drive the UI in a browser (majordomus-skip-runs-in: ui), with no skip excused"

  # The one gate that measures the published site rather than this tree: the advertised
  # install command, run as it is written, against what GitHub Pages and GitHub Releases
  # are serving right now. No class selects it, because no change to a tree can make it
  # true or false — only a deployment can; it is on demand (see the gate itself, below), so
  # it runs on the nightly schedule, on a dispatch and on a pull request labelled ci:full. A tagged
  # release proves the same thing in its own smoke phase, at the moment of publication;
  # this is what notices afterwards, when a release was never retried or a deployment
  # regressed and every tree-level gate stayed green.
  # The other gate that measures the published site rather than this tree, and the one that
  # was missing: is what GitHub Pages serves a projection of master at all? On 2026-09-09 the
  # public site served a commit from an unmerged branch for about half an hour and every
  # tree-level gate stayed green throughout, because the tree was fine — what was wrong was
  # which tree had been published. A person noticed by eye. No class selects it, for the same
  # reason installer-live has none: no change to a tree can make it true or false.
  #
  # It was a one-way check until 2026-09-10: it asked whether the published commit is ON
  # master and printed how far behind master's head it was as part of saying so. Twenty pull
  # requests landed that afternoon, the site sat hours behind, and this gate said `ok` every
  # time it ran. A publication owed for longer than the deploy window is a refusal now, and
  # GitHub's own build of gh-pages — the half of publishing this repository does not own, and
  # which errored at 17:35 that day with nothing red anywhere — is read rather than inferred.
  # The compatibility gate. `scripts/ci/version-matches-surface` is an adapter over
  # `majordomus release analyze` — the one typed engine that also answers the HTTP route, the
  # MCP tool, the Cockpit panel and `release bump` — so it needs the executable and belongs in
  # the rust job rather than in structure, which has no toolchain. The rust job already checks
  # out the full history, which this needs for the same reason `generate --check` does: the
  # baseline's surface is read out of the registry committed at its tag.
  #
  # It was in no class until now, which meant it ran only on a full plan: a pull request that
  # added a capability and left the version alone was never asked the question. The `rust`
  # class selects it now, and `apps/majordomus-cli/**` is the whole of what can move the
  # public surface — every capability in the committed registry is builtin and lives there.
  - id: version-surface
    job: rust
    lane: proof
    runs: scripts/ci/version-matches-surface
    summary: the declared version is at least what the public contract requires since the last release — capabilities, routes, MCP tools, commands and both schemas of each, compared as contracts rather than as text — and every breaking movement is named

  # `at-finish`. Every other gate in this model
  # measures a tree, so a path class can select it: change the file, run the gate. This one
  # measures a deployment — which commit GitHub Pages is serving, and whether it is still on
  # master — and no change to any file can make it pass or fail. That is why it is in no
  # class, and why being in no class is not a defect here the way it was for `version-surface`.
  #
  # It left the question owned by nobody, though. A full plan asks it, and a full plan runs on
  # a push to master, which is *before* the publication it would judge. The moment the question
  # is worth asking is when a session says it is done, so `finish` asks it: that is what
  # `at-finish` declares. See majordomus.publication-currency.
  - id: pages-live
    job: pages
    lane: proof
    at-finish: true
    runs: scripts/ci/pages-check
    network: true
    summary: the site GitHub Pages serves was built from a commit on master, no publication has been owed longer than the deploy window, the live site is serving what gh-pages published, the UI it holds at the UI's mount was read at that same commit and every page its record lists answers, GitHub's own build of that branch did not error, and the homepage, /releases/latest.json and the newest GitHub release name one release once the release window has passed

  # On demand: half of its matrix is a macOS runner, and `needs.install.result` is one value
  # over both legs, so the whole job is as scarce as its scarcest leg. It loses least by
  # moving: the model's own note above says no change to a tree can make it pass or fail, so
  # a gate that measures a deployment belongs on the cadence of the schedule rather than on
  # the cadence of a commit.
  - id: installer-live
    job: install
    lane: proof
    on-demand: true
    runs: scripts/ci/install-check --wait 300
    network: true
    summary: the install command the project advertises, fetched and run from the published site, installing the published release on this runner

  # The measurement this repository's macOS gates were made on-demand by, on 2026-09-10: four
  # master runs (67ec7c2aa, c08c44733, 31285bdf5, beaee8654) had every Linux job finished —
  # five of them red — while `bench`, `macos` and `install (macos-latest)` had been queued for
  # between three and seven hours, so the `ci` verdict those failures were supposed to reach
  # had not run at all. Master carried the defects overnight with every check apparently
  # green, because green and never-reported look identical. The arithmetic is not fixable by
  # waiting: this repository pushes to master about every seven minutes, this job runs for
  # about 106 minutes, and three macOS jobs per push is demand no free-tier macOS capacity
  # answers. A gate that never runs protects nothing; a gate that runs nightly protects
  # something, so this one runs on the schedule, on a dispatch and on a pull request labelled
  # ci:full — and the plan says, on every push, that it was not planned.
  - id: macos
    job: macos
    lane: proof
    on-demand: true
    runs: MJ_TEST_JOBS=3 bash test/run.sh && cargo test --no-fail-fast --manifest-path apps/majordomus-cli/Cargo.toml
    summary: the behavioural suite under the stock macOS shell and userland, and the crate's suites on macOS

  # The campaign briefs under campaigns/ are provenance: nothing reads them at run time, which is
  # why nothing would notice one being edited, half-copied or quietly added to. File reads only —
  # the manifest against the tree in both directions, and the index against the packs.
  - id: campaigns-provenance
    job: structure
    lane: feedback
    runs: scripts/ci/campaigns-check
    summary: every file under campaigns/ is the bytes the manifest recorded, every file present is declared, and every pack has a row in the index that names it

  # Box art in a published document: a picture nothing can render, link, theme, diff against
  # what it describes, or wrap on a phone. File reads only, so it belongs in the structure
  # job; the ratchet is meant to reach zero.
  - id: diagram-check
    job: structure
    lane: feedback
    runs: scripts/ci/diagram-check
    summary: no architectural relationship in a published document (docs, the site's pages and templates, the decisions, the rules, the handbook, the markdown majordomus ui renders) is typed in box art — every one is a mermaid block, with literal terminal output, file listings, quoted file content and the verbatim campaign packs exempt by declaration

  # The site's navigation is one declaration — site/data/nav.toml — and the navbar and the
  # footer are projections of it. Both halves of that have failed here: the footer rendered
  # five links it typed itself while the file's own header said otherwise, and two routes sat
  # in two groups under two labels. File reads only, so it belongs in the structure job.
  - id: nav-check
    job: structure
    lane: feedback
    runs: scripts/ci/nav-check
    summary: the site's navigation is declared once in site/data/nav.toml — no href is written twice, the primary navigation stays small, every template that renders navigation reads nav.groups and types no route the declaration does not carry, and the call to action resolves

  # Every object of the layer has an address derived from its kind and identity, and every
  # kind declares where it is published. Two identities of one kind that reduce to one
  # address is the only way an object can fail to be addressable, and a kind nobody decided
  # about is how one goes unpublished for a year with nothing saying so.
  - id: entity-check
    job: structure
    lane: feedback
    runs: scripts/ci/entity-check
    summary: every object of the layer is addressable — no two identities of a kind reduce to one route — and site/data/publication.toml declares, for every kind the index holds and for no kind it does not, whether the site publishes it as entity pages, as an editorial section, or not at all and why

  # The release's own declarations, which `generate --check` cannot reach: it proves the
  # written changelog and share/version.txt match the tree, not that the one place the
  # version is authored is the place the release script reads, nor that the shell tool
  # actually prints what that place declares. Until this gate, the second question was asked
  # only when a tag was cut, so a half-applied bump lived on the default branch until
  # somebody tried to publish. File reads only; it belongs in the structure job.
  - id: release-check
    job: structure
    lane: feedback
    runs: scripts/ci/release-check
    summary: the version is authored in one place with one writer — the crate's writer and the release script name the same manifest, the shell tool prints what it declares, the lock records it, no changelog is kept by hand, the tree is not behind what was published, and every published tag has a release record so that a release the pipeline failed to record cannot pass for a finished one

  # The version is authored once, in apps/majordomus-cli/Cargo.toml, and the shell tool reads
  # its projection share/version.txt (ADR 0085). What refuses a second statement is the
  # release module itself — `release::version::diagnose`, the same findings `release analyze`
  # carries on every surface — and this gate is only its caller: `release version` exits 10
  # when the projection is not what the manifest declares, or when a version is written down
  # by hand in bin/, lib/, scripts/ or share/ outside a generated artifact.
  #
  # `always`, because no path class can name where a second statement will be written: the
  # shell class does not select release-check, and a `FOO_VERSION="1.2.3"` added to lib/ or a
  # hand edit of share/version.txt would otherwise merge green and fail the next master push.
  # It needs the executable, which the structure job already builds for evidence-check.
  - id: version-authored-once
    job: structure
    lane: feedback
    always: true
    runs: bin/majordomus-cli release version
    summary: the version is authored in one place — share/version.txt, the projection the shell tool reads, states what the crate manifest declares, no version is written by hand in bin/, lib/, scripts/ or share/ outside a generated artifact, and no hand-written prose names a version label (a major and a minor with no patch) outside the declared history (project.prose-states-no-version)

  # A page's link into its own source names the commit the site was built from, not master:
  # a link to master points at whatever the file says today, and the page beside it says
  # what the file said when it was rendered. The templates make those links through
  # site/templates/source-links.html; this is the ratchet over the ones still hard-coded
  # (test/cases/533_source_links_name_the_built_commit.sh). File reads only.
  - id: source-pin-check
    job: structure
    lane: feedback
    always: true
    runs: scripts/ci/source-pin-check
    summary: no template under site/templates adds a source link that names master instead of the commit the page was built from — a ratchet over the blob/master and tree/master occurrences, per file, against .ai/repo/source-pin-baseline.txt

  # The third half of scripts/derive-check, which no gate of this model ran: `generate
  # --check` is rust-integration's and `generate-site-data --check` is core-check's, and the
  # merge policy itself — .gitattributes, which is generated too — was proved only by a case
  # of the suite and by the release workflow before it proposes a record. File reads and jq,
  # no build. The release-record shape needs it: it is what proves that every line marking a
  # file derived is a generator's claim, so the planner's reading of "derived" is not a
  # person's.
  - id: merge-policy
    job: structure
    lane: feedback
    runs: scripts/gitattributes --check
    summary: the merge policy's generated block of .gitattributes is what the generators write — every path it marks merge=derived is one a generator owns, and every generated path is marked

  # The behavioural cases whose subject is the committed release record, its writer, or what
  # the site and the installer are offered from it, run by name in the job that has the built
  # executable. The suite runs them too; this gate exists for the plan that does not run the
  # suite, the release-record shape below. The list is every case that names a record path
  # (.ai/repo/releases, release-record, site/static/releases, scripts/ci/release-check) or reads
  # the checkout's own installation guide, distribution projection or changelog, as
  # scripts/ci/release-record-cases-check defines it; that script is the release-record-listing
  # gate of the structure job, and case 94 asks it too, so a new such case cannot be left out.
  - id: release-record-cases
    job: rust
    lane: proof
    subsumed-by: shell-suite
    requires: [rust-integration]
    runs: MJ_TEST_JOBS=4 bash test/run.sh --no-skips 49_roadmap_doctrine 84_distribution_model 87_release_pipeline 97_install_gate 103_release_projection 112_version_matches_surface 139_release_record_schema 352_the_version_the_site_shows_is_one_you_can_get 620_mcp_tools_are_invoked_and_answer 743_release_version_answers_with_the_contract 763_a_tag_older_than_the_record_practice_is_a_note 1041_a_release_publishes_its_metadata 1060_the_version_is_allocated_at_landing 1087_the_site_offers_the_release_it_published 3021_a_tag_does_not_freeze_the_queue 3029_a_tag_in_flight_is_pending 3102_a_milestone_version_is_inferred 3100_an_issue_delivery_is_inferred 3104_the_ui_roadmap_reads_delivery 3055_a_derivation_needs_no_history 3179_a_prerelease_is_never_published_as_stable 3212_a_prerelease_version_is_bumped_and_ordered 3222_an_alpha_publishes_beside_the_latest_release 3224_a_published_alpha_owes_its_record 3225_the_installer_takes_an_alpha_only_by_name 3342_a_dry_run_initialises_nothing 996_the_record_pull_request_gets_its_verdict 3385_doctor_fits_its_budget_in_the_commit_hook 3724_the_roadmap_says_what_the_plan_holds 3470_the_release_follows_the_work 3471_the_delivery_screen_shows_what_waits_for_a_release 3727_the_pages_name_the_pre_release_beside_the_stable_one 3045_the_site_shows_what_changed_since_it_was_deployed
    summary: the cases about the committed release record and what is offered from it — the distribution model, the release pipeline and projection, the record's schema, the version the site shows, the install gate, the stable channel the MCP tools resolve, the release the roadmap infers each milestone shipped in — pass against this tree

  # The behavioural cases whose subject is the plan: its issue and milestone records, the
  # commands that read and write them, the projections of them (docs/PLAN_STATUS.md, the plan
  # pages, the GitHub projection) and the intents and tasks bound to them. The suite runs them
  # too; this gate exists for the plan that does not run the suite, the plan-record shape
  # below. The list is every case that names a plan record path or PLAN_STATUS, or runs a
  # `plan` subcommand, and test/cases/94_ci_plan.sh holds it to that grep, so a new such case
  # cannot be left out (I2662: a pull request that records evidence planned the whole suite).
  - id: plan-record-cases
    job: rust
    lane: proof
    subsumed-by: shell-suite
    requires: [rust-integration]
    runs: MJ_TEST_JOBS=4 bash test/run.sh --no-skips 26_ci_wiring 40_project_model 41_project_status 42_dag_waves 43_plan_command 44_model_doctrine 45_github_projection 46_cross_surface 47_mutation 48_roadmap_graph 49_roadmap_doctrine 51_derived_artifacts_committed 53_status_vocabulary 57_derived_merge_driver 58_home_path_gate 74_knowledge_edges 75_knowledge_mutation 97_github_gate 98_traceability 99_plan_capabilities 99_work_graph_chain 103_release_projection 129_executable_issues 131_completion_gates 133_plan_transition 194_audit_rows_are_planned 274_commit_policy 367_an_intent_is_satisfied_only_by_evidence 386_a_plan_is_held_to_its_intent 388_an_intent_is_realised_across_providers_and_held_to_reality 400_derivation_is_one_graph 581_no_plan_stamp_without_its_event 582_the_done_guard_holds_in_both_engines 602_a_spliced_body_is_recognised_as_its_own 620_mcp_tools_are_invoked_and_answer 890_an_intent_criterion_is_met_only_by_current_evidence 892_what_is_said_of_intents_is_what_the_claims_matrix_says 893_preflight_follows_what_an_issue_serves 894_github_sync_applies_only_the_trunk 895_a_finished_task_does_not_satisfy_an_intent 960_a_task_starts_bound_to_what_it_serves 961_a_resumed_task_is_told_its_intent_moved 962_plan_start_asks_the_binding_in_both_engines 1038_a_head_is_judged_against_what_it_changes 1076_the_roadmap_opens_a_milestone 1081_an_intent_opens_what_serves_it 3048_a_derivation_survives_an_unrelated_merge 3053_a_repository_of_n_records_costs_n 3073_context_knowledge_slice 3075_knowledge_validate_judges_the_graph 3100_an_issue_delivery_is_inferred 3101_merged_work_unrecorded_is_drift 3102_a_milestone_version_is_inferred 3103_the_roadmap_draws_every_milestone 3104_the_ui_roadmap_reads_delivery 3220_the_idd_loop_is_walked_in_a_browser 3246_every_file_the_site_generator_reads_is_an_input 3385_doctor_fits_its_budget_in_the_commit_hook 3400_a_recorded_commit_link_names_the_history 3244_a_milestone_title_fits_on_github 3726_a_record_holds_no_template_delimiter 3970_a_pull_request_carries_its_metadata 3958_no_entry_path_or_gate_builds 3057_unlinked_work_is_classed_end_to_end 3004_evolve_is_a_procedure_of_existing_commands 4512_no_derived_page_outgrows_the_index 4235_an_evidence_token_is_matched_whole 4261_issues_trace_outward 4266_a_milestone_block_is_named
    summary: the cases about the plan's records and what reads them — the project model, the plan command and its transitions, the DAG and roadmap, the GitHub projection, the intents bound to issues, the completion gates — pass against this tree

# Shapes: changes whose plan is narrower than the union of their classes (the header's last
# rule). Each names the paths that make a change of its shape (`records`, at least one must
# change), what every other changed path must be (`others: derived`, the only kind there is),
# and the gates the shape plans beside the `always` ones.
shapes:
  # A release record and nothing but the projections of it: the pull request
  # .github/workflows/release.yml opens on release/record-<tag> after scripts/release-record
  # wrote .ai/repo/releases/<tag>.yaml and scripts/derive regenerated what follows from it.
  # Planned by the union it was the full suite, the UI audit, the interactions and the site
  # probe (#976, v0.21.0: about 95 minutes before the homepage could name the release).
  #
  # Soundness: every other path is derived, and the gates below prove each one equal to its
  # regeneration from this tree — so the only authored input of the change is the record, and
  # what can break is what reads the record or its projections. The proof, by generator:
  #   majordomus generate (docs/generated/**, site/data/registry/**, site/static/releases/**,
  #     docs/INSTALL.md, share/version.txt, the provider bootstraps): rust-integration runs
  #     `generate --check`;
  #   scripts/generate-site-data (site/data/generated/**, site/content/**, docs/PLAN_STATUS.md,
  #     docs/PAGES_STATUS.md, docs/SITE_CLAIMS.md): core-check runs `generate-site-data
  #     --check`, on every plan;
  #   scripts/gitattributes (.gitattributes): merge-policy.
  # One gap stays open and is named rather than hidden: generate-site-data --check judges the
  # directories under site/content it stages, and the generated block marks every directory
  # there derived, so a hand-written directory under site/content would be marked derived and
  # judged by nothing but the site build. None exists today (the generator says so where it
  # publishes); a change that adds one is a change to the generator's output set, which this
  # shape does not plan.
  #
  # The gates, one by one:
  #   rust-integration      every projection of `majordomus generate` is current, and the
  #                         registry validates with the record as one more object of the index;
  #   version-surface       the newest record is the baseline the declared version is held to;
  #   release-check         the tree is not behind what was published, and every published tag
  #                         has its record;
  #   merge-policy          .gitattributes is the generators' (the soundness above);
  #   pack-plan             the record is one more source of the ChatGPT pack, which must still
  #                         fit its shards, and .gitattributes decides what the pack drops;
  #   entity-check          the record is one more addressable object: no two identities may
  #                         reduce to one route;
  #   site-basepath         the installation guide is a document the site serves at two mounts;
  #   site-build            the site builds from the new data, and site-check holds it —
  #                         homepage-check's trust card names the release the installer resolves,
  #                         every link resolves, and the cases that read the built site run;
  #   release-record-cases  the behavioural cases about the record and what is offered from it.
  # Left out, deliberately: the shell suite (its cases about the record are the gate above),
  # the crate's own tests and coverage (no code changed), and the browser gates — site-probe,
  # ui-audit, interaction-probe and cockpit-probe measure templates, styles and controls, none
  # of which a derived data file changes; the record adds a changelog section and a release
  # entry to pages those gates have measured every release before. The master push after the
  # merge is a full plan and runs every one of them.
  - id: release-record
    records: [.ai/repo/releases/v*.yaml]
    others: derived
    gates: [rust-integration, version-surface, release-check, merge-policy, pack-plan, entity-check, site-basepath, site-build, release-record-cases]

  # Plan records and nothing but their projections: the pull request that records an issue's
  # evidence or marks it done (`majordomus plan evidence|verify|done`), or a milestone's, and
  # the derive that follows it. Planned by the union (`layer` and `intent`) it was the full
  # suite in four shards, the crate's integration lane, the site probe and the UI audit — on
  # 2026-10-14 #1151 (I0806's record) queued behind six such runs in a pool that verifies about
  # one pull request at a time (I2662).
  #
  # Soundness, as for release-record: every other path is derived and proven equal to its
  # regeneration (rust-integration runs `generate --check`, core-check runs `generate-site-data
  # --check` on every plan, merge-policy proves the derived block is the generators'), so the
  # only authored input is the record, and what can break is what reads it:
  #   rust-integration    the registry validates with the record as an object of the index,
  #                       and every projection of the plan is current;
  #   intent-check        intents link issues; a changed status or evidence can break a link
  #                       or a criterion;
  #   intent-realization  an intent's realisation is judged against the issues that serve it;
  #   github-projection   an issue record is projected to its GitHub issue, and the drift
  #                       check reads the record;
  #   entity-check        the record is an addressable object with a route;
  #   merge-policy        .gitattributes is the generators' (the soundness above);
  #   diagram-check       a plan page renders the record's body, which must not type a
  #                       relationship in box art;
  #   site-build          the plan pages build from the new data and every link resolves;
  #   plan-record-cases   the behavioural cases about the plan and what reads it.
  # Left out, deliberately: the shell suite (its plan cases are the gate above), the crate's
  # own tests and coverage (no code changed), and the browser gates, which measure templates,
  # styles and controls a record does not change. The master push after the merge is a full
  # plan and runs every one of them.
  - id: plan-record
    records: [.ai/repo/project/issues/I*.yaml, .ai/repo/project/milestones/*.yaml]
    others: derived
    gates: [rust-integration, intent-check, intent-realization, github-projection, entity-check, merge-policy, diagram-check, site-build, plan-record-cases]

classes:
  # the pipeline itself: a change here can only be validated by running everything.
  # `except` names the files under .ai/repo/ci/ that are data, not pipeline: each is read by
  # named gates only, found by grepping every reader, and planned by `ci-data` below. They
  # are single paths on purpose — a file that appears under .ai/repo/ci/ tomorrow escalates
  # until someone names its readers. Replayed over the forty master merges before this
  # change: sixteen plans were full, and one of them (#881) only because of a file now named
  # here; the other fifteen also changed a pipeline definition and still escalate.
  - id: ci
    paths: [.github/workflows/**, .github/actions/**, scripts/ci/**, scripts/ci-plan, scripts/ci-baseline, .ai/repo/ci/**, test/run.sh, test/lib.sh, justfile, .just/**]
    except: [.ai/repo/ci/suite-durations.tsv, .ai/repo/ci/case-numbers-baseline.txt, .ai/repo/ci/github-drift-baseline.txt, .ai/repo/ci/baseline.json, .ai/repo/ci/README.md]
    gates: full

  # the pipeline's data, by reader. suite-durations.tsv is how test/run.sh deals the shards
  # (case 721 proves the deal); case-numbers-baseline.txt is scripts/case-numbers' ratchet
  # (also in `cases`); github-drift-baseline.txt is scripts/ci/github-check's ratchet;
  # baseline.json is the record scripts/ci-baseline writes and only it reads; README.md is
  # the directory's contract. Every one of them is also under `layer`, which plans what reads
  # .ai/ as objects of the index, so the union stays at least that wide.
  - id: ci-data
    paths: [.ai/repo/ci/suite-durations.tsv, .ai/repo/ci/case-numbers-baseline.txt, .ai/repo/ci/github-drift-baseline.txt, .ai/repo/ci/baseline.json, .ai/repo/ci/README.md]
    gates: [shell-suite, case-numbers, github-projection]

  # the Rust executable: its crate, its gate script, its coverage floor, its benchmark baseline.
  # The crate's sources and the web module that serves the reference are under
  # apps/majordomus-cli/**, and scripts/rust-check is its producer, so this class is the one
  # that selects the rustdoc gate; the composite action that runs the producer in CI
  # (.github/actions/rustdoc) is under the `ci` class above, which plans everything.
  - id: rust
    paths: [apps/majordomus-cli/**, apps/majordomus-core/**, scripts/ci/rust-command-check, scripts/ci/projection-check, scripts/ci/crate-boundary, scripts/rust-check, scripts/rust-coverage, scripts/ci/coverage-differential, scripts/rust-coverage-threshold, scripts/session-coverage-threshold, scripts/session-coverage-domain, .ai/repo/rust-quality-baseline.txt, .ai/repo/benchmarks/rust/**]
    gates: [rust-check, rust-command, generation-converges, rust-quality, projection-closure, rust-coverage, coverage-differential, rust-bench, command-graph, shell-suite, macos, cockpit-probe, worktree-topology, providers-data, order-check, entry-converges, mesh-check, mesh-lab, crate-boundary, portable-core, version-surface, release-check, rustdoc]

  # the mesh: its declaration objects, their schema, the gate that holds the subsystem
  # to ADR 0050 and ADR 0067, the network lab that accepts it, and the architecture document
  - id: mesh
    paths: [.ai/repo/mesh/**, share/schemas/majordomus/mesh-declaration/**, scripts/ci/mesh-check, scripts/ci/mesh-lab-evidence, test/mesh-lab/**, test/cases/414_mesh_lab_evidence.sh, apps/majordomus-cli/src/mesh/**, docs/MESH.md, docs/claims/mesh-*.md]
    gates: [mesh-check, mesh-lab, rust-integration, shell-suite]

  # projections of the registry and the policy: generate --check decides whether they are
  # current, and their content is read by the site and by the suite
  - id: rust-generated
    paths: [docs/generated/**, site/data/registry/**, share/allow/**, AGENTS.md, CLAUDE.md]
    gates: [rust-integration, shell-suite, site-build, site-probe, providers-data, version-surface]

  # governance: the rule objects themselves, the gate that holds their proof, and the
  # baseline of the rules nothing executable proves yet. `layer` already selects the suite
  # for anything under .ai/; this class is narrower and adds the one gate that reads the
  # rules as a relation rather than as files. The planner takes the union of every matching
  # class, so both apply, and the vendored package under share/ is selected here too —
  # `share` does not name it and a doctrine's proof can go stale exactly like a rule's.
  - id: governance
    paths: [.ai/repo/rules/**, .ai/repo/rule-proof-baseline.txt, share/standard/majordomus/rules/**, scripts/ci/rule-proof-check, scripts/ci/claim-proof-check, .ai/repo/claim-proof-baseline.txt, scripts/ci/english-only-check, scripts/ci/english-only-allow.txt, scripts/ci/finding-reproduce-check, test/cases/125_rule_proof.sh, test/cases/133_rule_graph.sh, test/cases/138_governance_gates.sh, test/cases/230_verdict_states_its_subject.sh, apps/majordomus-cli/src/rules/**, site/data/publication.toml, scripts/ci/entity-check, test/cases/277_entities_are_routable.sh]
    gates: [rule-proof, claim-proof, english-only, finding-reproduce, entity-check, shell-suite, rust-integration]

  # the MCP surface as a population: the ratchet that holds every projected tool to being
  # invoked by something, its baseline, and the case that both invokes a sample and proves
  # the ratchet by mutation. The denominator is the generated registry, which `rust-generated`
  # already selects; this class is what selects the gate itself when its own files move.
  - id: mcp-surface
    paths: [scripts/ci/mcp-tool-run-check, .ai/repo/mcp-tool-run-baseline.txt, test/cases/620_mcp_tools_are_invoked_and_answer.sh]
    gates: [mcp-tool-run, shell-suite]

  # the skills: every active skill is a proven capability (project.skills-are-proven-capabilities);
  # a change to a skill, to a surface that invokes one, or to the derivation runs the proof.
  - id: skills
    paths: [.ai/repo/skills/**, .ai/repo/prompts/**, .ai/repo/workflows/**, .ai/repo/profiles/**, .ai/repo/providers/**, .just/**, justfile, apps/majordomus-cli/src/skill/**, apps/majordomus-cli/src/capability/builtin/skills.rs, apps/majordomus-cli/src/commands/skills.rs, apps/majordomus-cli/tests/skills.rs, lib/skills.sh, test/cases/95_skills.sh, test/cases/391_skills_are_proven_capabilities.sh, test/cases/3020_an_active_skill_is_named_where_the_crate_test_demands.sh, .ai/repo/rules/project/skills-are-proven-capabilities.v1.md]
    gates: [skills-proof, skill-naming, shell-suite, rust-integration]

  # the audit's gap matrix and the plan it names: a planned row is a claim on an issue, so an
  # edit to the matrix, to an issue record (one renamed or deleted), to the gate or to its case
  # runs the gate. `docs` and `layer` already select the suites; this class adds the gate.
  - id: audit-plan
    paths: [docs/COCKPIT_IDE_AUDIT.md, .ai/repo/project/issues/**, scripts/ci/audit-plan-check, test/cases/194_audit_rows_are_planned.sh]
    gates: [audit-plan, shell-suite]

  # the source pack and the archive: one profile declaration, the selection both read, the
  # skill on top of them and the rule they hold. A change to any of them can move what a
  # ChatGPT project is handed, so the pack is planned again and both suites run.
  - id: pack
    paths: [share/archive.yaml, lib/archive.sh, apps/majordomus-cli/src/pack/**, apps/majordomus-cli/src/capability/builtin/pack.rs, apps/majordomus-cli/src/commands/pack.rs, apps/majordomus-cli/src/quality/leak-patterns.tsv, .gitattributes, .ai/repo/skills/pack-for-chatgpt/**, .ai/repo/rules/project/packs-carry-only-sources.v1.md, test/cases/871_pack_for_chatgpt.sh, test/cases/130_archive.sh]
    gates: [pack-plan, shell-suite, rust-integration]

  # the commit policy: the subsystem that judges a message, the gate that reads the history
  # through it, the hook that refuses with it, and the baseline of the commits that predate
  # it. A change to the grammar, the policy or the vocabulary changes what every commit made
  # afterwards is held to, so the gate and both suites run.
  - id: commit-policy
    paths: [apps/majordomus-cli/src/commit/**, apps/majordomus-cli/src/capability/builtin/commit.rs, apps/majordomus-cli/src/commands/commit.rs, scripts/ci/commit-policy, .ai/repo/commit-policy-baseline.txt, .githooks/commit-msg, test/cases/274_commit_policy.sh]
    gates: [commit-policy, rust-integration, shell-suite, rust-quality]

  # the evidence fabric: the ledger of recorded executions, the join that reads it and the
  # gate that ratchets it. A claim's proof is derived from the matrix and the ledger
  # together, so a change to either is a change to what this repository says is proven.
  - id: evidence
    paths: [.ai/repo/evidence/**, .ai/repo/evidence-baseline.txt, scripts/evidence-check, docs/CLAIMS.yaml, docs/claims/**, docs/EVIDENCE.md]
    gates: [evidence-check, core-check, shell-suite, site-build]

  # the Cockpit's own assets: its stylesheet source, its compiled stylesheet, its scripts.
  # Read from disk by the served executable, so the crate's suites see them; the compiled
  # stylesheet is a generated artifact, and cockpit-assets --check is what proves it current.
  # Declared before `share` so a reader sees the narrower rule first; the planner takes the
  # union of every matching class, so both apply.
  - id: cockpit
    paths: [share/cockpit/**, scripts/cockpit-assets, scripts/cockpit-probe, scripts/lib/cockpit-probe.mjs, scripts/lib/ui-routes.mjs]
    gates: [cockpit-assets, cockpit-probe, rust-check, site-build, order-check, design, ui-audit]

  # the UI's own assets and screens (`majordomus ui`, ADR 0135): its stylesheet source, its
  # compiled stylesheet and script, and the Rust module that renders it. Without this class
  # a change under share/ui/ matched only `share`, which does not select cockpit-assets, so
  # a stale compiled ui.css would have passed.
  - id: ui
    paths: [share/ui/**, apps/majordomus-cli/src/ui/**]
    gates: [cockpit-assets, cockpit-probe, rust-check, rust-integration, design, ui-audit]

  # the design tokens and their projections. The canonical file reaches every surface, so a
  # change here is selected by the site, the Cockpit and the crate at once; the class exists
  # so that the gate also runs when only the generator or the gate itself is edited.
  - id: design
    paths: [share/design/**, scripts/ci/design-check, apps/majordomus-cli/src/design/**, apps/majordomus-cli/src/capability/builtin/design.rs, apps/majordomus-cli/src/web/tokens.css, apps/majordomus-cli/src/cockpit/logo-mark.svg, site/data/registry/design.json, docs/DESIGN_SYSTEM.md]
    gates: [design, cockpit-assets, cockpit-probe, rust-check, rust-integration, site-build, site-probe, ui-audit]

  # the distribution: the skeleton, the schemas, the kinds, the command and event registries;
  # read by both implementations at run time, embedded in the crate at build, and inputs of
  # the site generator
  - id: share
    paths: [share/**]
    gates: [rust-check, rust-coverage, rust-bench, command-graph, shell-suite, site-build, site-probe, macos, worktree-topology, ui-audit, providers-data, entry-converges]

  # the shell tool, its cases and fixtures, the hooks, and the scripts written against lib/
  - id: shell
    paths: [bin/**, lib/**, test/**, .githooks/**, .envrc, scripts/generate-site-data, scripts/github-sync, scripts/rules-package, scripts/lib/**]
    gates: [shell-suite, rust-integration, command-graph, site-build, site-probe, macos, worktree-topology, ui-audit, order-check, github-projection, entry-converges]

  # this repository's own AI layer: policy, profiles, rules, prompts, workflows, plan, knowledge,
  # ADRs; objects of the index the registry dataset is derived from, inputs of the site
  - id: layer
    paths: [.ai/**]
    gates: [shell-suite, rust-integration, site-build, site-probe, worktree-topology, ui-audit, providers-data, github-projection, entry-converges]

  # the intents, the plan they are derived against, the engine that derives them, the command
  # and Cockpit pages that render them, and the evidence module whose judgement decides whether
  # a criterion is met. `layer` and `rust` already select the suites; this class adds the two
  # gates that read intents as links between records and against the evidence, not as files.
  - id: intent
    paths: [.ai/repo/project/**, share/schemas/majordomus/intent/**, share/schemas/majordomus/gap/**, share/schemas/majordomus/critique/**, apps/majordomus-cli/src/intent.rs, apps/majordomus-cli/src/intent_plan.rs, apps/majordomus-cli/src/intent_review.rs, apps/majordomus-cli/src/capability/builtin/intents.rs, apps/majordomus-cli/src/intent_realization.rs, apps/majordomus-cli/src/capability/builtin/intent_realization.rs, apps/majordomus-cli/src/commands/intent.rs, apps/majordomus-cli/src/cockpit/intents.rs, apps/majordomus-cli/src/evidence/**, apps/majordomus-cli/src/plan.rs, .ai/repo/evidence/**, test/cases/367_an_intent_is_satisfied_only_by_evidence.sh, test/cases/386_a_plan_is_held_to_its_intent.sh, test/cases/388_an_intent_is_realised_across_providers_and_held_to_reality.sh]
    gates: [intent-check, intent-realization, rust-integration, shell-suite]

  # the decisions and the allocator that hands out their identities. `layer` already selects
  # the suite for anything under .ai/; this class is narrower and adds the one gate that reads
  # the decisions as a set spread across refs rather than as files of this tree. The planner
  # takes the union of every matching class, so both apply.
  - id: decisions
    paths: [.ai/repo/adrs/**, lib/adr.sh, test/cases/271_adr_allocation.sh, test/cases/99_adr.sh]
    gates: [adr-collision, core-check, shell-suite]

  # the campaign briefs and what proves them: provenance, read by people rather than by the tool,
  # so beyond the suite the only gate this class needs is the one that decides them
  - id: campaigns
    paths: [campaigns/**, scripts/ci/campaigns-check, test/cases/340_a_brief_is_kept_as_received.sh, .ai/repo/rules/project/a-brief-is-kept-as-received.v1.md]
    gates: [campaigns-provenance, shell-suite]

  # the detector the collision-check gate calls. The gate runs on every plan already; this
  # class exists so that an edit to the detector selects its behavioural case instead of
  # escalating the whole plan as an unmatched path.
  - id: coordination
    paths: [scripts/collision-check, test/cases/566_the_collision_guard_has_a_caller.sh]
    gates: [collision-check, shell-lint, shell-suite]

  # the case identities and the allocator that surveys them. `shell` already selects the suite
  # for anything under test/; this class adds the one gate that reads the cases as a set of
  # identities, and names the allocator, whose edits would otherwise escalate the whole plan.
  - id: cases
    paths: [test/cases/**, scripts/case-numbers, .ai/repo/ci/case-numbers-baseline.txt, .ai/repo/rules/project/a-number-names-one-case.v1.md]
    gates: [case-numbers, shell-lint, shell-suite, release-record-listing]

  # documents and the files the site generator reads at the root; documents are index objects
  - id: docs
    paths: [docs/**, README.md, CONTRIBUTING.md, SECURITY.md, LICENSE, examples/**, scripts/ci/doc-command-check, .ai/repo/doc-command-baseline.txt, test/cases/638_a_documented_command_is_run.sh]
    gates: [shell-suite, rust-integration, site-build, site-probe, worktree-topology, ui-audit, providers-data, diagram-check, doc-command-check]

  # the site: templates, assets, styles, scripts, its build dependencies and its scripts
  - id: site
    paths: [site/**, assets/**, package.json, package-lock.json, .nojekyll, scripts/site-build, scripts/site-check, scripts/site-basepath-check, scripts/site-probe, scripts/site-serve, scripts/site-translate, scripts/lib/site-i18n*.mjs, scripts/ui, scripts/lib/ui-*.mjs, scripts/interaction-probe, scripts/lib/interactions.mjs, scripts/lib/interaction-specs/**, scripts/lib/browser.mjs, scripts/lib/project-links.awk]
    gates: [shell-suite, site-basepath, site-build, site-probe, site-languages, ui-audit, order-check, design, nav-check, interaction-probe, entity-check]

  # the release pipeline's own scripts: they pack, verify and record what a tag publishes,
  # and they ask the executable for every name they use, so the crate's registry checks and
  # the behavioural cases are what decide whether they still work
  - id: distribution
    paths: [scripts/release-package, scripts/release-verify, scripts/release-version, scripts/release-record, scripts/release-fixture, .ai/repo/releases/**, .ai/repo/release-record-baseline.txt]
    gates: [shell-suite, rust-integration, macos, release-check, version-surface]

  # the merge policy: the file itself, its generator, the driver it names, and the case that
  # proves its converse. Every path here is in another class already; this one adds the gate.
  - id: merge-policy
    paths: [.gitattributes, scripts/gitattributes, scripts/merge-derived, test/cases/241_merge_policy_claims_only_generator_output.sh]
    gates: [merge-policy, shell-suite]

  # the MCP client configurations and the launcher they name; case 90 reads them
  - id: clients
    paths: [.mcp.json, .codex/**, .gemini/**]
    gates: [shell-suite]

  # nothing a gate reads
  - id: inert
    paths: [.gitignore, .editorconfig, .github/ISSUE_TEMPLATE/**, .github/pull_request_template.md]
    gates: []

  # the release as a projection: the module that composes the changelog and writes the
  # version, the one place it is authored and the lock's record of it, the projection the
  # shell tool reads and the tool that reads it, and the records the changelog is composed
  # from. Every path here is already in `rust`, `shell`, `share` or `layer`; the overlap is
  # deliberate and can only widen a plan, and it is what keeps the class readable as one
  # subject rather than as four edits to lists that are about something else.
  - id: release
    paths: [apps/majordomus-cli/src/release/**, apps/majordomus-cli/Cargo.toml, apps/majordomus-cli/Cargo.lock, share/version.txt, bin/majordomus, .ai/repo/releases/**]
    gates: [release-check]

  # The commands that keep the self-accumulating quantities bounded (rule
  # project.accumulation-is-measured). Narrow on purpose: the rule's own file is named here
  # rather than the whole rules tree, so a change to one rule does not escalate every plan.
  - id: backlog
    paths: [scripts/reap-orphans, apps/majordomus-cli/src/integration, lib/rust_bin.sh, .ai/repo/rules/project/accumulation-is-measured.v2.md, test/cases/131_backlog_hygiene.sh, test/cases/276_disk_is_bounded.sh, test/cases/318_a_partial_sweep_says_so.sh]
    gates: [backlog-hygiene, shell-lint, shell-suite]

  # Shell automation against its migration inventory: a unit added, changed or deleted under
  # a governed directory, the inventory itself, the module that judges it, and its case.
  # Every governed directory is already in another class; the overlap only widens a plan.
  - id: shell-inventory
    paths: [bin/**, lib/**, scripts/**, share/**, .githooks/**, .claude/hooks/**, .ai/repo/automation/**, apps/majordomus-cli/src/automation/**, apps/majordomus-cli/src/capability/builtin/shell.rs, apps/majordomus-cli/src/commands/shell.rs, test/cases/365_new_shell_is_refused.sh, test/cases/366_automation_inventory_agrees_with_the_tree.sh]
    gates: [shell-inventory]
