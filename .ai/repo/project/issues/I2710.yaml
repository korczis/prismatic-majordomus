    result: "tests: 7 passed, 0 failed (run 2026-10-14 ~22Z on master c0e3585dc836201089d6b5dd49f5a79fe8bff798 plus this change); case 3027 drives scripts/ci/release-path over fixture run lists: a PR validate yields (cancel + label + comment naming the release run) while a release, record verdict or bot-dispatched Pages run is busy, preempt cancels queued PR validates on a tag push, resume reruns them once the path is clear, master's runs and dispatches are never touched"
