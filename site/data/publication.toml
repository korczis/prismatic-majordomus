# ---------------------------------------------------------------- not published

[[kinds]]
kind = "deployment"
projection = "none"
reason = "A deployment object carries the target a release is published to. Its rendered artifacts are in the repository and its state is on the Cockpit; a public page would say only what /docs/install/ already says."

[[kinds]]
kind = "distribution-model"
projection = "none"
reason = "The distribution model is the input the release matrix, the installer and /docs/install/ are all generated from. The generated pages are the publication; the model behind them is not a second one."

[[kinds]]
kind = "document"
projection = "none"
reason = "A document of the layer is prose already published where it belongs — /docs/, /method/, /context/ — and a second address for the same words is the duplication this file exists to prevent."

[[kinds]]
kind = "implementation"
projection = "none"
reason = "An implementation object is a source file a claim names. It is reachable from the claim that names it and from the repository; a page rendering a Rust module is the source browser GitHub already is."

[[kinds]]
kind = "knowledge"
projection = "none"
reason = "Curated knowledge is written for the worker reading the layer, not for a visitor: it is the orientation a session starts from, and it changes with the work rather than with the product."

[[kinds]]
kind = "mesh-declaration"
projection = "none"
reason = "The mesh declaration is one checkout's identity on the local network. It is operational state of an installation, not a fact about the product."

[[kinds]]
kind = "prompt"
projection = "none"
reason = "A prompt is an input to a provider, rendered with the repository's own state. Published on its own it would read as documentation of something a visitor cannot run."

[[kinds]]
kind = "scope"
projection = "none"
reason = "The scope declares which paths of this checkout the tool reads. It is a fact about this repository's layout, and /context/ is where a visitor is told about layout."

[[kinds]]
kind = "test"
projection = "none"
reason = "A test object is a case file. What it proves is published — on /guarantees/ for the claim and on the rule's own page for the rule — and that is the direction a reader asks in."

[[kinds]]
kind = "workspace"
projection = "none"
reason = "A workspace records an external place work is done (a ChatGPT project, an issue tracker). It names accounts and surfaces of the people working here, not of the product."
