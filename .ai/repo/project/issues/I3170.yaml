id: I3170
milestone: campaigns-are-read-as-provenance
title: "An execution of a record that cites a campaign pins the revision it ran, and a later revision changes nothing about it"
slug: an-execution-pins-its-campaign
priority: p3
profile: implementation
objective: "Record the campaign id and revision digest on an execution whose input names an issue, milestone or intent citing that campaign, resolved at start and never changed afterwards, with no change to StartInput or the executions.start contract."
why: "ADR 0124 point 1: an artifact revision is not an execution run; 2026-10-10: a revision must not silently mutate an in-flight worker's contract. Proposed in ADR 0180 (A prompt pack is a campaign: kept as received, indexed as a kind, and cited by the records it drove) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c210#4."
current_state: "Executions (ADR 0033) carry no campaign."
desired_state: "Pinned revision on the execution record."
scope:
  - "apps/majordomus-cli/src/execution"
  - "apps/majordomus-cli/src/capability/builtin/executions.rs"
depends_on:
  - "I3168"
serves:
  - "campaigns-are-provenance-the-plan-reads#an-execution-pins-its-campaign"
acceptance_criteria:
  - "An execution names its campaign digest"
  - "A newer revision does not alter it"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib execution::"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test executions"
evidence_required:
  - "test_execution_pins_campaign"
created_at: 2026-10-18
updated_at: 2026-10-18
