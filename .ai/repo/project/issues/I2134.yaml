id: I2134
milestone: runtime-trust
title: "A key removed from the trust list loses its links without a restart, and a node key can be rotated"
slug: trust-can-be-revoked-and-keys-rotated
priority: p0
profile: implementation
parallel_safe: false
objective: "Re-read the trust declaration while the runtime runs, drop the links and admission of a de-listed key, offer a key rotation that peers can follow, and create the node key file private from its first byte."
why: "Trust is frozen at activation (apps/majordomus-cli/src/mesh/manager.rs:466,486, apps/majordomus-cli/src/mesh/cooperation.rs:1150): a key removed from trust.allow keeps its links until every peer restarts, and there is no rotate or revoke flow (threat T11). A compromised key therefore cannot be cut off without restarting every runtime. The node key file is written and then chmodded to 0600 (apps/majordomus-cli/src/mesh/identity.rs:338-347), so it exists for a moment at umask permissions. Reloaded events of a revoked key are I2124's (the journal reload applies the trust policy, milestone runtime-trust); this issue is the live half. Baseline audit of 2026-10-09 at master 1fb8d6be44, mesh gap 6 and the identity row."
current_state: "Revocation takes effect only on each peer's restart. Rotation does not exist. The key file is briefly readable at umask permissions."
desired_state: "Cooperation holds its trust as a replaceable value; Cooperation::retrust puts a new one in force and ends the link of every peer it no longer trusts, and the server calls it with each new generation of the repository it reads, so a key withdrawn from trust.allow and committed loses its links without a restart: its next sync meets unknown_link and its hello is refused untrusted. The deferred part, rotating a node key and purging a withdrawn key's events from the running journal, is I2705."
scope:
  - "apps/majordomus-cli/src/mesh/manager.rs"
  - "apps/majordomus-cli/src/mesh/cooperation.rs"
