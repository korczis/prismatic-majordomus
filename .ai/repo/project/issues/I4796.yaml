acceptance_criteria:
  - "The fixture bundle test/fixtures/analysis/conforming conforms and majordomus reasoning analysis exits 0 on it"
  - "A bundle whose synthesis cites a REFUTED finding outside the refuted register fails, naming the finding, and the CLI exits 10"
  - "An UNVERIFIABLE finding named in the synthesis gaps ledger is not a citation defect, and one the ledger does not name is"
  - "A synthesis checked without its cross-checks is incomplete, ok is false, and the checks that did not run carry their reason"
  - "A Markdown file of the bundle without analysis front matter is refused, never skipped; a path outside the repository is refused"
validation:
