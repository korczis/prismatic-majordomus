id: I1966
milestone: capability-graph
title: The composed graph is whole or its generation refuses
slug: the-composed-graph-is-whole-or-refused
priority: p1
profile: implementation
parallel_safe: true
objective: "Stop docs/generated/graph.json from silently dropping nodes and edges at the MAX_NODES cap. Either the cap is raised or removed under a measured size budget, or generation refuses a truncated graph and names the count and the cap. The committed graph must never be a prefix of the repository that still passes as whole."
why: "graph::Builder::node refuses every node past MAX_NODES = 2000 (apps/majordomus-cli/src/graph.rs). It sets metadata.truncated, and compose() then drops each edge whose end could not be added. generate::graph_document refuses an unresolved relation (ADR 0020, case 390) but writes a truncated graph without a word. derive-check stays green, and every newly indexed object takes the place of a real node and its edges. This is the defect case 390 was written against, 'the file looks whole and is quietly short of one edge', reached by another route. It also breaks the capability-graph milestone's criterion that a relation that does not resolve fails generation rather than going missing."
current_state: "The committed docs/generated/graph.json is composed without a node bound (graph::composed_complete, 9f98133aa2, PR #788) and holds 2434 nodes and 5341 edges with metadata.truncated false in 2,766,504 bytes; the implemented_by edge from majordomus://claim/mcp-uri-resolution to apps/majordomus-cli/src/capability/builtin/objects.rs is present. graph::whole refuses a truncated graph committed as data, and the site's why and product graphs go through it, proved by unit tests in graph.rs. Still open: no case drives generation over a fixture past a bound, because the composed graph has none, and no measured size budget is written beside MAX_NODES (2000, the bound of a graph a person is shown). Measured on master 4090b2b8ae, 2026-10-08."
desired_state: "A committed graph.json is either complete, with metadata.truncated false, or it is not written: generation fails, naming the node count it needed and the cap it hit, as graph_document already does for an unresolved relation. If the cap is raised or removed for the committed artifact, the new bound is a size budget measured on this repository and written beside the constant with its measurement. The Cockpit and the interactive views may keep a display bound of their own, and they keep saying when they apply it."
scope:
  - apps/majordomus-cli/src/graph.rs
  - apps/majordomus-cli/src/generate.rs
  - test/cases/390_unresolved_relation_refuses_generation.sh
  - docs/generated/graph.json
  - docs/generated/graph.schema.json
non_scope:
  - "The mesh registry's own MAX_NODES (apps/majordomus-cli/src/mesh/registry.rs), which is an unrelated bound on peers"
  - "The Cockpit's graph pages and the site's why-graph and product-graph, apart from keeping their existing truncation notice true"
  - "Changing which objects, claims or relations are composed: the inputs stay as they are, and only the completeness of the output is at stake"
  - "Pruning claims or index classes to get under the cap"
acceptance_criteria:
  - "Generating the composed graph over this repository yields metadata.truncated false, or generation exits non-zero naming the node count and the cap"
  - "The implemented_by edge from majordomus://claim/mcp-uri-resolution to apps/majordomus-cli/src/capability/builtin/objects.rs is present in docs/generated/graph.json, and so is every claim edge whose target file exists"
  - "A fixture whose composition exceeds the bound makes generation refuse; it does not write a truncated graph.json, and the case fails if the refusal is removed"
  - "Any new bound on the committed artifact has its measured size (bytes, nodes, edges) written beside the constant"
validation:
  - bash test/run.sh 390_unresolved_relation_refuses_generation
  - "cargo test --lib graph::"
  - scripts/derive-check
evidence_required:
  - composed_graph_complete_or_refused
  - truncation_refusal_case
  - size_budget_measured
risk: "Raising the cap without a budget brings the problem back one size later, and graph.json is already 2.3 MB. Refusing outright makes every derive fail until the bound is settled, so the refusal and the new bound belong in one change."
created_at: 2026-10-03
updated_at: 2026-10-08
