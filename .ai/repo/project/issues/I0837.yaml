  - I0817
acceptance_criteria:
  - The JSON parses with jq and carries every phase and counter of the text form
validation:
  - MJ_TIMING=1 bin/majordomus --json doctor
evidence_required:
  - phase_timing
risk: "stdout stays the command's; the report stays on stderr in both forms."
