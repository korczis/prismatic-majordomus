non_scope:
  - "The published Cockpit snapshot keeps no script, so its copy of the bar has no working menus there; giving the snapshot the bar's two scripts is a change to the exporter's subject"
  - "A second navigation declaration or a second renderer of the bar for any surface"
depends_on: []
acceptance_criteria:
  - "Every UI screen and Cockpit page carries exactly one nav[aria-label=Main], the site's, with the executable's version and the product entry leading to /ui"
  - "scripts/ui navbar reports no difference between the bar on the site's front page and on /ui and /cockpit at every declared width, light and dark, closed and with a menu open"
  - "A copy that is not the built bar, and a share/ui script that is not the site's bytes, each fail their check"
validation:
