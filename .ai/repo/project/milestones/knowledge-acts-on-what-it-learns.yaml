id: knowledge-acts-on-what-it-learns
title: "The repository decides when to evolve its layer, and a session carries it out"
slug: knowledge-acts-on-what-it-learns
order: 167
priority: p2
problem: "Observations become grouped, routed candidates at the episode boundary (I2073-I2075 DONE), but acting on them waits for the owner to call /evolve by hand: .ai/repo/skills/evolve/SKILL.md lists when to use it, and nothing derives that it is due. Intent a-session-leaves-what-it-observed declares acting on a route and friction from task.refused/task.gate out of scope 'until measured'. Curated notes are never re-judged when the files they cite change. Proposed in ADR 0183 (Evolution is scheduled at the episode boundary and carried out by a session; nothing promotes itself) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c274#2."
outcome: "Friction is measured and then derived; each boundary records an evolve readiness verdict the next session is told; evolve output does not feed itself; outcomes are measured; a curated note whose source moved is flagged."
current_state: "Verified on master 707a04c: lib/knowledge.sh derives, groups, routes, promotes and rejects; knowledge_base.rs judges the stopped writer (case 708); four curated notes under .ai/repo/knowledge/curated carry provenance.derived_from (this branch adds a fifth); lib/history.sh reads task.refused for display, but no deriver reads it; no readiness verdict exists."
desired_state: "I3162-I3166 landed; ADR 0183 accepted and ADR 0118 amended to reference it (I3163)."
