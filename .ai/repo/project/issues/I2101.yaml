id: I2101
milestone: mobile-first
title: the Cockpit landing and worktrees pages take seconds to answer on this repository
slug: worktrees-page-latency
priority: p2
profile: implementation
parallel_safe: true
objective: "Find what /cockpit and /cockpit/worktrees spend their seconds on with this repository's data, remove or defer it, and hold both pages to a latency budget in the probe and the UI audit."
why: "On this machine /cockpit/worktrees answered in 24.1s from the main checkout's server and 7.4-18.4s from the branch's, and /cockpit itself in 9.1-18.6s from the branch's server (5.2-7.5s from the main checkout's, a different commit with a smaller catalogue). The UI audit recorded page.unreachable (no load within 20s) for /cockpit at all 13 audited widths and for /cockpit/worktrees at 1024 and 1440. The same executable renders a freshly initialised consumer's /cockpit in 0.38-0.48s, so the cost scales with the repository's own data (118 catalogue entries, about 1,900 objects), not with the shell; the machine's load average was 41-45 during the measurement. On a phone a page that slow reads as broken."
current_state: "Open, cause measured. /cockpit (pages::overview) asks five capabilities on every request; timed through the HTTP API on the branch server at load 40: environment.preflight 8.1s then 6.9s (not cached: it runs each toolchain's --version, git and just as processes), dashboard.overview 6.9s then 3.2s, health.report 1.1s then 0.001s, repository.info and distribution.status under 6ms. The landing page therefore waits about 7s on preflight alone. Also measured with the UI audit (16 page.unreachable on /cockpit, /cockpit/worktrees and /cockpit/intents) and with a consumer fixture whose /cockpit renders in 0.38-0.48s. Not caused by the drawer."
desired_state: "The landing page does not wait on environment.preflight or dashboard.overview: either their answers are cached against what they read, or their cards load after the page (a link where the script does not run); /cockpit and /cockpit/worktrees answer within the probe's budget on this repository, held by a latency assertion in the probe and the UI audit."
scope:
- apps/majordomus-cli/src/cockpit
- share/cockpit/worktrees.js
depends_on: []
acceptance_criteria:
- The cause is named with a measurement
- The page loads within the probe's timeout at every declared width
validation:
- scripts/cockpit-probe
evidence_required:
- sections_reachable_on_a_phone
created_at: '2026-10-09'
updated_at: '2026-10-09'
