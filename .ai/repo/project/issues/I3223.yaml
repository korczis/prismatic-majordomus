objective: "Offer in the hero's left column, under the reassure line, a short list of links: the challenge as the default, described as refused and then accepted, and every use case that site/data/generated/terminal.json names among its refusals, each linking to its /use-cases/<id>/ page with at most its one derived verdict line, naming the homepage problem it answers, with the build's commit; homepage-check and case 333 hold it."
why: "On 2026-10-10 the owner asked for a friendlier, interactive, derived landing page with no big rewrite; ChatGPT proposed switchable real scenarios instead of one static terminal. The scenario corpus and replay already exist (I1600). Sources: chatgpt-majordomus:c215#8, chatgpt-majordomus:c137#5, chatgpt-majordomus:c134#3."
current_state: "Verified on master 707a04c7ce8: site/templates/index.html links /challenge/ and does not inline a replay (only challenge.html includes partials/challenge-replay.html); site/data/homepage.toml holds html_bytes = 160000; terminal.json `refusals` lists every recorded lifecycle step that exited non-zero; committed derived data carries no commit (test/cases/51_derived_artifacts_committed.sh)."
desired_state: "scripts/generate-site-data writes the eligible choices from terminal.json; homepage-check refuses a choice without a recorded run, and holds the order and budget."
