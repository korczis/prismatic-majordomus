# The regression policy `majordomus bench --check` applies when it compares a run with
# this platform's accepted baseline (baseline.<os>-<arch>-<build>.json beside this file).
# Thresholds are relative increases of a metric; an increase under minimum_absolute_us is
# noise whatever the ratio (a sub-millisecond loopback round trip moves by hundreds of
# microseconds between two runs on one machine, and a regression worth a person's time is
# a millisecond or more). A metric gates only when the run took minimum_samples or more:
# the p99 of a twenty-sample quick run is its slowest sample, which one scheduler hiccup
# decides, so short runs report it as SHORT and fail on the median alone.
# Data, read at run time; there is no threshold in the code.
version: 1

regression:
  p50:
    relative: 0.25
    minimum_samples: 0
  p95:
    relative: 0.30
    minimum_samples: 50
  p99:
    relative: 0.50
    minimum_samples: 200

minimum_absolute_us: 1000

# Per-target allowances, one list item per target key as `bench coverage` prints it; a
# metric not named keeps the general threshold and its minimum_samples. The process-cold target
# spawns a majordomus process and builds the index before it answers, so the machine's
# load, not the code, decides most of its wall clock: a 120 ms spawn reads 150 ms while
# three other test suites run. It gets twice the room a request gets.
targets:
  - target: system.mcp.process_cold
    p50:
      relative: 0.50
    p95:
      relative: 0.75
    p99:
      relative: 1.00

# Budgets: absolute bounds, held by `bench --check` with or without a baseline and on every
# host (I2489, ADR 0142, rule project.no-screen-waits-for-a-source). A regression threshold
# cannot say that a screen is fast enough, only that it did not get slower here.
#
# A warm screen of the UI answers within 100 ms at p95. The number is the owner's (the
# UI-performance pack, 2026-10-12: "warm SSR p95 < 100 ms"), and it was measured before it
# was declared: `bench --transport system --profile ci` on a debug build with this Mac at
# load 57 read every screen but one at 1-21 ms p95, over the pinned context and over the
# live view. The one was /ui/command at 400-660 ms, which walked the registry once per
# command; with that fixed it reads like the others. A release build is faster still, so
# the bound has room for a slow runner and none for a screen that computes on the request.
# Fifty samples is what the ci profile takes; a p95 of fewer than twenty is not judged.
budgets:
  - prefix: system.http.ui.
    cache: warm
    metric: p95
    milliseconds: 100
    minimum_samples: 20
  - prefix: system.http.live.ui.
    cache: warm
    metric: p95
    milliseconds: 100
    minimum_samples: 20
