id: delivery-is-explained-by-evidence
title: A delivered change is explained from its intent to its deployment by evidence the repository keeps, and what delivery costs is measured, bounded and compared
statement: "A reader asks one question about a finished task and is answered from the intent it served to its commits, its tests, the release that carried it and the deployment that serves it, with every step that left no evidence marked unknown. What delivery costs — a derive, a run of the required check, the time a pull request waits — is a tracked measurement with its sample and its machine, a derive does the work its changed inputs ask for and no more, the required verdict holds against a skipped job, a stale head and an administrator, a release is landed by one command that keeps a trail, and the same facts read the same on every surface with their age. The whole path is shown working in this repository and in one that is not."
invariants:
  - Evidence that was not recorded is unknown, never a pass and never estimated
  - What identifies an operation is a join of the identities that exist — task, session, execution, evidence run — and no new scheme
  - An incremental derive writes byte for byte what a full derive writes from the same inputs, and the full derive stays the authority
  - A cache is invisible - keyed by content, bypassable, proved byte-identical and kept out of the tracked tree
  - Every surface is a projection of one canonical state; a page, a tool or a command holds no model of its own
  - A measurement names its sample size, its machine and its date, and a comparison never reads a single sample as a trend
milestones:
  - the-delivery-baseline-is-recorded
  - derive-does-bounded-work
  - delivery-is-explained-by-evidence
