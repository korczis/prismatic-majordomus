  - "apps/majordomus-cli/src/capability/builtin/integration.rs"
  - "apps/majordomus-cli/src/cockpit/pages.rs"
  - "apps/majordomus-cli/src/commands/prs.rs"
  - "docs/INTEGRATION.md"
depends_on: []
acceptance_criteria:
  - "A forge answer without the merge settings yields no merge methods (unknown), and one with them yields what they allow"
  - "A pull request held for unread settings reads merge_settings_unread with disposition unknown, and nothing merges"
  - "The queue's diagnostic says the merge settings could not be read and never that the repository allows nothing"
validation:
