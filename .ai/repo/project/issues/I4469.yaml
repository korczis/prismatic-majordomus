id: I4469
milestone: a-bounded-task-is-carried-to-accepted-work
title: "A knowledge record may say where it holds, in an optional typed holds_for (subsystem, version, environment), and a task's context matches it against the task's scope"
slug: a-note-says-where-it-holds
priority: p3
profile: implementation
parallel_safe: true
objective: "Add one optional field to knowledge/v1, `holds_for`, a typed object with three optional members: subsystem (repository paths or path prefixes, the same spelling a task's scope uses), version (a version range of the tool or the repository the lesson was learnt on) and environment (named conditions such as an operating system, a CI host or a provider). A record without holds_for means what it means today. The field is declared in share/schemas/majordomus/knowledge/knowledge.v1.proto, projected into knowledge.v1.schema.json by `majordomus generate`, and admitted by share/allow/knowledge.txt. The readers that compile a task's context (devcontext and the briefing's knowledge pointers) match a note's holds_for.subsystem against the task's scope with the same path matching the task's scope uses, select a matching note before an unmatched one, leave out a note whose holds_for names a version or an environment that the task's state contradicts, and print why a note was selected or left out. knowledge validate refuses a holds_for member of the wrong type or an unknown key."
why: "Found by the P00 audit on master 51b38035a71 (H2, matrix row Conditions of validity): a note cannot say where it holds; knowledge/v1 (share/schemas/majordomus/knowledge/knowledge.v1.proto:27-78) has free `description`, `about` and `tags` only, none machine-matchable against a task, so a lesson learnt for one subsystem, version or host is served everywhere or nowhere. The audit placed it after the reader slices; the owner decided question Q-H2 on 2026-10-30: an optional typed holds_for field on knowledge records, machine-matchable against a task's scope, after the reader slice I3318."
current_state: "At master 51b38035a71 knowledge/v1 carries `about` (a path or a typed subject, knowledge.v1.proto:68-73) and `tags` (:59); share/allow/knowledge.txt admits no holds_for; devcontext assigns knowledge to its Knowledge tier by kind alone (apps/majordomus-cli/src/devcontext/select.rs:254), and `devcontext compile --issue I3166` selected 0 of 7 knowledge candidates in the audit. No issue owned the field."
desired_state: "A note that says where it holds is offered to the task that works there and kept from the task it does not apply to, with the reason shown, and a note that says nothing is treated as before. Enforced by case 4469."
scope:
  - ".ai/repo/project/issues/I4469.yaml"
  - "share/schemas/majordomus/knowledge/knowledge.v1.proto"
  - "share/schemas/majordomus/knowledge/knowledge.v1.schema.json"
  - "share/allow/knowledge.txt"
  - "lib/knowledge.sh"
  - "lib/context.sh"
  - "apps/majordomus-cli/src/devcontext"
  - "apps/majordomus-cli/src/capability/builtin/knowledge_base.rs"
  - "docs/KNOWLEDGE.md"
  - "test/cases/4469_a_note_says_where_it_holds.sh"
non_scope:
  - "Making holds_for required, or backfilling it on the existing curated notes"
  - "Deriving holds_for from git history or from `about`: the writer of a note declares it"
  - "Knowledge references as edges of the composed graph and their backlinks: I3318"
  - "Flagging a note whose cited sources moved: I3166"
depends_on:
  - "I3318"
serves: []
acceptance_criteria:
  - "knowledge/v1 declares an optional holds_for with the optional members subsystem, version and environment; `majordomus generate --check` is clean and a record without holds_for validates as before"
  - "Case 4469: `knowledge validate` refuses a fixture note whose holds_for has an unknown key or a member of the wrong type, naming the record and the key"
  - "Case 4469: in a fixture with two curated notes, one whose holds_for.subsystem is lib/knowledge.sh and one whose holds_for.subsystem is site, `devcontext compile --path lib/knowledge.sh` selects the first, leaves the second out, and prints holds_for as the reason for each"
  - "Case 4469: a note whose holds_for.environment names a condition the task's state contradicts is left out with that reason, and a note without holds_for is selected or dropped exactly as before the change"
  - "Before the change, case 4469 fails at its first assertion"
validation:
  - "MJ_TEST_JOBS=4 bash test/run.sh 4469_a_note_says_where_it_holds 3075_knowledge_validate_judges_the_graph"
  - "majordomus generate --check"
  - "bin/majordomus shell check"
  - "bin/majordomus doctor"
  - "bin/majordomus plan validate"
evidence_required:
  - "holds_for_matched_case"
created_at: 2026-10-30
updated_at: 2026-10-30
