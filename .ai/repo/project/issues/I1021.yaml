id: I1021
milestone: capability-graph
title: A browser proves the interface, at the widths people use
slug: browser-tests
priority: p1
profile: implementation
parallel_safe: true
objective: "Extend the existing browser checking to cover navigation on desktop and mobile, search and filtering, the detail view, graph initialisation, conditional runtime exposure, link integrity and console errors."
why: "Everything in this milestone is finally judged by whether a person can open it. Server-side tests cannot see an overflowing table, a menu that does not open or a script that throws on load."
current_state: "A probe script drives the Cockpit's routes and interactions in a real browser."
desired_state: "The probe covers the derived surfaces at representative viewports, uses stable selectors and runs in CI."
scope:
  - scripts/cockpit-probe
non_scope:
  - Pixel comparison of a rendered graph
  - Selectors coupled to presentational class names
depends_on:
  - I1014
  - I1015
  - I1016
acceptance_criteria:
  - Desktop and mobile navigation, search and filtering, the detail view and graph initialisation are all exercised
  - Representative viewports from a narrow phone to a wide desktop are asserted, including the absence of horizontal overflow
  - The runtime-only surfaces appear when a backend is present and are not offered when it is not
  - Internal links resolve and the console is free of errors
  - Selectors are stable identifiers rather than presentational classes
validation:
  - scripts/cockpit-probe
evidence_required:
  - browser_coverage
  - viewport_assertions
risk: "Browser tests are the flakiest thing in any suite. Bounded waits on stable selectors, and no sleeps."
created_at: 2026-09-06
updated_at: 2026-09-06
