id: I2251
milestone: a-provider-hook-refuses-an-out-of-scope-edit
title: "Claude Code refuses an edit outside the task's scope before it is written"
slug: claude-code-refuses-an-out-of-scope-edit
priority: p1
profile: implementation
parallel_safe: false
objective: "Install, through the existing capture adapter mechanism, a Claude Code PreToolUse hook for write-class tools that asks the task's scope for the target path and refuses an out-of-scope write, and a Stop hook that runs finish --check and reports its verdict."
why: "Finding F12: the only Claude Code hooks installed are prompt capture and session lifecycle (lib/capture.sh:249, :286; .claude/hooks/ holds majordomus-capture and majordomus-session-*). A worker learns it strayed at check or pre-push, after the edit."
current_state: "No PreToolUse hook exists anywhere (grep of lib/, share/, apps/majordomus-cli/src, .claude/)."
desired_state: "With an active task, a Write, Edit or NotebookEdit to a path outside the task's scope is refused by the hook with the scope and the remedy; with no active task the hook allows and says nothing; the hook answers from local state in well under a second; installation and removal go through capture install/uninstall."
scope:
  - "lib/capture.sh"
  - "lib/check.sh"
  - ".claude/hooks"
  - "share/providers.yaml"
  - "docs/CONTINUITY.md"
  - "test/cases"
non_scope:
  - "Bash tool commands that write files; they are reported as a stated limitation, not parsed"
  - "Treating the hook as the gate; CI is the gate"
depends_on:
  - "I2250"
  - "I2242"
acceptance_criteria:
  - "A documented PreToolUse payload for an Edit outside scope is answered with a refusal, and one inside scope is allowed, in a case"
  - "With no active task the hook allows every payload"
  - "The hook's warm latency is recorded in the case output and stays under the declared hook budget"
  - "capture uninstall removes exactly what install added"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "claude_pretooluse_refusal_case"
created_at: 2026-10-09
updated_at: 2026-10-09
