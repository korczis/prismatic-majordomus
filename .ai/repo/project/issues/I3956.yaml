  - ".claude/hooks/"
  - ".ai/repo/providers/"
  - "apps/majordomus-cli/src/guard.rs"
  - "apps/majordomus-cli/src/guard/"
  - "apps/majordomus-cli/src/commands/guard.rs"
  - "docs/OFFLOAD.md"
  - ".ai/repo/rules/project/a-derive-offload-waits-its-turn.v1.md"
  - ".ai/repo/automation/inventory.jsonl"
