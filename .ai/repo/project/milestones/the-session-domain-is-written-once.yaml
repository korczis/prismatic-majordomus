  - "Changing what a record contains beyond the completeness verdict and the task snapshot"
  - "Prompt capture, which already joins episodes and redacts (lib/capture.sh)"
acceptance_criteria:
  - "Each of ADR 0047's six cutover steps is one landed change, each independently revertible"
  - "bash test/run.sh --no-skips 54_session_lifecycle_hooks 60_session_lifecycle 61_session_envelope 62_session_divergence 63_session_records 111_session_per_provider 130_lifecycle_survives_a_stale_task 135_session_store_recovery 220_exactly_once_close passes after every step"
  - "No lifecycle semantic remains in shell, proved by I3145's structural case; the inventory disposition follows the cutover and is not its proof"
  - "Every closed record's completeness verdict is derivable, never stored, and reaches the surfaces a resuming session reads"
validation:
  - "bash test/run.sh --no-skips 54_session_lifecycle_hooks 60_session_lifecycle 61_session_envelope 62_session_divergence 63_session_records 111_session_per_provider 130_lifecycle_survives_a_stale_task 135_session_store_recovery 220_exactly_once_close"
  - "majordomus plan validate"
evidence_required: []
risks:
  - "Several workers edit lib/*.sh at once; ADR 0047 warns a cutover on such a day is a semantic merge conflict. Claim each step on the mesh before starting."
  - "Hook shims must stay fail-open for the provider (inventory facts for .claude/hooks/*)."
