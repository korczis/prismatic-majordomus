acceptance_criteria:
  - "Every /ui and /cockpit page is served by the one frame function, read by the ui-shard probe at every width it visits"
  - "The site's base.html renders the Pro navbar and footer at every width the site probe visits"
  - "A test adds a /ui route to the route table and finds it in /ui's navigation, and removes one and finds it gone, with no second list edited"
  - "Every /ui and /cockpit page carries the one frame's mark (one frame function stamps it) and the ui-shard probe refuses a page without it: majordomus design kit judges only site/templates/base.html as a layout and cannot see the Rust frames, so its S5 count is no evidence for /ui or /cockpit"
  - "majordomus design kit --check reports zero S5 findings for the site with no new ui.exempt entry; this issue's evidence says whether base.html carries the navbar and footer markers itself or the profile was changed in the distribution (ADR 0230, consequence on run-time assembled shells)"
  - "The Pro navbar and footer on site/templates/base.html render in every language the site declares (site/i18n/languages.json), with every label from the site's i18n data"
  - "No Flowbite Pro source file enters the tree: the adapted markup is reviewed against rule project.ui-uses-flowbite-pro and this issue's evidence names the Pro block each part was adapted from"
validation:
  - "majordomus design kit --check"
  - "node scripts/ui audit"
  - "majordomus plan validate"
evidence_required:
  - "one_frame_probe"
