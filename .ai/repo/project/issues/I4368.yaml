id: I4368
milestone: adopter-upgrades
title: "An adopter's changelog links into its own repository and trunk, and a repository that declares first-parent history is listed by its pull requests"
slug: an-adopters-changelog-links-into-its-own-repository
priority: p2
profile: implementation
parallel_safe: true
objective: "release/changelog.rs takes its forge base from the repository's .ai/repo/project/project.yaml `repository` (https://github.com/<repository>) and its trunk from `default_branch`, falling back to CARGO_PKG_REPOSITORY and master only where there is no project.yaml (the project schema requires both keys). Every link it builds reads that base and trunk: the unreleased compare and tree links (today `...master` and `tree/master`), the notes, compare, tree and commit links of each release, and each decision's `blob/<trunk>/<path>` link (today `blob/master`). How the release window is read is something a repository declares: an optional project.yaml key `history: first-parent`, added to the project schema. Where nothing is declared, release/commits.rs keeps `git log --no-merges` exactly as today. With first-parent declared, it reads the window with --first-parent, and each first-parent commit is one change. A merge commit whose subject ends in ` (#N)` (merge_commit_title=PR_TITLE) is read by its subject without that suffix; one whose subject is the forge's `Merge pull request #N from ...` is read by its body's first line; a squash or direct commit whose subject ends in ` (#N)` is read as today. The first-parent mode reads a merge's pull request and title by calling I4366's shared merge-subject reader (merge_subject), and release/commits.rs keeps no ` (#` or `Merge pull request #` matcher of its own. Each of the three carries pull request N in a new optional Change field, linked to <base>/pull/N; outside first-parent mode the field stays empty. With first-parent declared, no changelog line begins with 'Merge pull request'. This repository declares nothing, so `majordomus release changelog` and its page docs/generated/changelog.{md,json,yaml} are byte-identical, although it too lands mostly by merge commits (313 of the last 400 first-parent commits on master)."
why: "OSCILLA keeps 19 release records under .ai/repo/releases and lands by merge commits; from 2026-10-29 its owner disabled squash and rebase and set merge_commit_title=PR_TITLE and merge_commit_message=PR_BODY. In such a repository the changelog's every compare, tree, notes, commit and decision link points into korczis/prismatic-majordomus, because forge() is the crate's own manifest repository. The unreleased section compares against master and decisions link blob/master, a branch OSCILLA does not have. git log --no-merges drops exactly the commits that carry the pull request titles, so the changelog lists each branch's inner commits, fixups included. Switching every repository to --first-parent would rewrite this repository's own page, which lands mostly by merge commits ('Merge pull request #2653 ...', 'merge: master (...) into I4241, derived'), so the mode is declared, not assumed. OSCILLA's own release notes are fixed in OSCILLA by its planned release-analysis issue; this is the tool's half."
current_state: "Measured at 5370ee63d19: apps/majordomus-cli/src/release/changelog.rs:31-44 forge() returns about::REPOSITORY, which is env!(CARGO_PKG_REPOSITORY) (about.rs:24, https://github.com/korczis/prismatic-majordomus in apps/majordomus-cli/Cargo.toml:8); changelog.rs:139-142 writes `compare/<tag>...master` and `tree/master` for the unreleased section; changelog.rs:176-184 builds the notes, compare and tree links and :219-224 the commit links from the same base; changelog.rs:700 links each decision as `blob/master/<path>`; release/commits.rs:53-63 in_range runs `git log --no-merges` (:59); release/model.rs:217-237 Change has no pull request field; the committed page is docs/generated/changelog.{md,json,yaml}, written by compose_published and checked by `majordomus generate changelog --check` (case 103); the project schema share/schemas/majordomus/project/project.v1.schema.json is additionalProperties false with required schema_version, name, repository and default_branch, and has no history key; I2826 (open) requires this repository's GitHub release body to equal the composed changelog; OSCILLA's .ai/repo/project/project.yaml declares repository korczis/oscilla and default_branch main."
desired_state: "`majordomus release changelog` in an adopter links to that adopter's repository and trunk, and in a repository that declares first-parent history lists one line per landed pull request with its number; this repository's own page renders byte-identical. Enforced by case 4368 and library tests in release::changelog and release::commits."
