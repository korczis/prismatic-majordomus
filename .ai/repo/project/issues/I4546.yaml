  - "I4538"
  - "I4539"
  - "I4540"
  - "I4541"
  - "I4542"
  - "I4543"
acceptance_criteria:
  - "The ui-shard probe visits /cockpit/graphs/topology and /cockpit/activity and fails when either renders an empty canvas"
  - "Every kit component is driven by an interaction spec on each surface it appears on"
  - "validate.yml runs majordomus design kit --check and the job fails on a planted finding (case 26 still passes)"
  - "majordomus design licence reports active (ui.kit: flowbite-pro), and majordomus doctor names no missing design-kit enforcement entry"
  - "A case fails on a planted second import or construction of ECharts, Cytoscape, p5 or Alpine outside share/design/js, and passes on the tree"
  - "The ui-shard probe visits the observatory kiosk's p5 scenes (share/ui/observatory-kiosk.js, ADR 0160) and fails on an empty stage"
  - "The first commit that adds this issue's case also changes criterion one-library-per-job of .ai/repo/project/intents/one-kit-on-every-surface.yaml to evidence: test with that case as its ref, so the criterion stops being proven by majordomus intent explain of itself"
validation:
  - "majordomus design kit --check"
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 26_ci_wiring"
  - "majordomus plan validate"
evidence_required:
  - "kit_gate_case"
