intent: a-session-record-says-what-it-served
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: all 11 findings are planned (5 blocking, 6 non-blocking), each carried by an amendment to I3141-I3146, and none is left open or rejected."
findings:
  - id: rust-closer-is-not-the-shell-closer
    class: unproven_assumption
    subject: "I3141"
    finding: "I3141 assumes session::store close() can replace the shell closer, but on 707a04c it covers only the O_EXCL claim and a plain fs::write. The rest of what close does today is not in it. (1) Rust has no outbox: RECORD_DIR is hard-coded to .ai/repo/sessions (apps/majordomus-cli/src/session/store.rs:84, :314), and records_of scans only that directory. The shell writes trunk records to the outbox and finds a record in either store (lib/session.sh:602, mj_session_find_record), per the ADR 0091 amendment of 2026-10-15. (2) Rust has no composer: the body comes from a caller-supplied closure, while front matter, changed_files, commits, refs and the derived body are shell (lib/session.sh:560-596, mj_derive_session_body in lib/derive.sh, mj_changed_files_block in lib/changed.sh). (3) Several steps are absent: the outbox drain (:654), knowledge derive (:667), the session.closed ledger line (:678), pointer teardown under the session-pointer lock (:698-726), the working-context close (:728), the `--if-none`/`--provider-session`/foreign-checkout refusals, and the identity check on the summary. The issue's scope lacks lib/derive.sh, lib/changed.sh and lib/knowledge.sh. 'Delete the shell writer' therefore means either porting the composed body, which the intent lists as a non-goal ('reopening the composed body'), or calling back into shell, which breaks close-has-one-writer. The issue must choose one, and add the outbox and every teardown step as acceptance criteria."
    blocking: true
    resolution:
      state: planned
      issue: I3141
      because: "Verified on 707a04c (store.rs:84 RECORD_DIR, lib/session.sh:143-154 outbox, :654-728 drain/derive/session.closed/teardown). The choice: the domain closer is the only writer, and the existing shell composer stays as a pure renderer. The shell composes the record text (front matter and body) from the ledger window and git before the claim and hands it to the closer as the caller-supplied body that store.rs already takes. The closer then claims, picks the store or the outbox, writes, drains the outbox, appends session.closed, tears down the pointer under the lock and closes the working context. Rust never calls back into shell, the composed body is not reopened, and one writer remains. Every teardown step and refusal becomes an acceptance criterion. Plan reconciled on 2026-10-18 after verification: the intent criterion close-has-one-writer now states the structural proof (no record write, close lock or session.closed append in lib/session.sh), and the executable contract the closer relies on is a separate issue split out of I3141, which I3141 depends on."
  - id: criteria-proofs-cannot-fail-today
    class: delivery_verification
    subject: "a-session-record-says-what-it-served#close-has-one-writer"
    finding: "No criterion has a proof that fails on master and passes after the work. close-has-one-writer cites test/cases/220_exactly_once_close.sh, which is green today with the shell closer and so cannot show that the shell closer is gone. The other three criteria give evidence: command with ref `majordomus intent explain a-session-record-says-what-it-served`, which is the intent judging itself. Their real proofs are '(to be written)' notes inside the criterion text. Those notes also disagree with the issues: open-records-its-task plans apps/majordomus-cli/tests/session_open.rs, but I3142 requires case_open_records_its_task and validates only cases 60, 111 and 130; record-states-completeness plans test/cases/<n>_... with no number taken from the 3500-3599 block. Each criterion needs a named test that would fail now, for example a structural assertion that lib/session.sh calls no mj_publish_record and takes no session-close lock."
    blocking: true
    resolution:
      state: planned
      issue: I3141
      because: "Each serving issue now owns a named proof that is red on master. I3141 gets a structural case: lib/session.sh makes no mj_publish_record call, takes no session-close lock and appends no session.closed. I3142 gets apps/majordomus-cli/tests/session_open.rs, reconciled with its evidence_required. I3146 gets a new completeness case under test/cases, its number announced on the board before it is written. I3145 gets the structural no-shell-semantics case. Each issue repoints its intent criterion to evidence: test with that ref in the same PR, so no criterion stays self-referential. Plan reconciled on 2026-10-18 after verification: every criterion now names its planned proof (case_close_asks_the_domain, session_open.rs, case_record_states_completeness, case_one_resolver) instead of case 220 or the inventory, and stays evidence: command until that proof lands. I3143 and I3144 serve criteria of their own (hooks-run-the-domain, checkpoints-name-their-episode), so each serving issue owns one proof."
  - id: open-snapshot-misattributes-across-windows
    class: regression_risk
    subject: "I3142"
    finding: "'The active task' is per checkout: mj_load_current reads $MJ_STATE_DIR/current.yaml (lib/common.sh:1206-1207). Episodes are per provider session: case 111, and commands.yaml says 'one open session per provider session, not per worktree'. Snapshotting the task at open therefore names the other window's task in a two-window checkout. Selecting by session stamp, not by checkout state, is exactly what mj_session_refs exists to prevent (lib/session.sh:786). The snapshot also breaks the intent's own invariant 'Episode state never reads task state' and ADR 0047's 'an episode carries Option<TaskId> and nothing else of a task', because the bound issue is task state. The 'why' evidence does not show the defect either: record 20261014T003753Z--s-20261014003330-fef4 has task_id: none, a clean tree, no commits and a handover, so tasks: [] is correct for it. The issue must say which task an episode began on when two episodes share a checkout, and how it is recorded as a ledger fact rather than read from current.yaml."
    blocking: true
    resolution:
      state: planned
      issue: I3142
      because: "The rule is defined as follows. session.started records an Option<TaskId> as a ledger field and nothing else of the task. The task comes from a ledger fact stamped with the same provider session or its predecessor episode. current.yaml is consulted only when the episode being opened is the checkout's only open episode. With two open episodes and no stamped fact, the field is absent and the record attributes nothing. The bound issue is never snapshotted: the closer derives it from the task's own ledger events, which keeps ADR 0047's Option<TaskId> and the intent's invariant. The fef4 record is withdrawn as evidence, and the fixture reproduces the 2026-09-11 shape (task started in an earlier episode, no task event inside the window). Plan reconciled on 2026-10-18 after verification: I3142's objective, why and the criterion open-records-its-task were rewritten to this rule, the fef4 record is no longer cited, and its evidence_required is test_session_open_records_its_task."
  - id: completeness-reason-has-no-home
    class: missed_requirement
    subject: "I3146"
    finding: "The verdict depends on facts and surfaces the plan does not provide. (1) 'Declared reason' and 'continuation reason' have no home: session-record.v1 has additionalProperties: false and no reason field, ADR 0182 keeps session/v1, the milestone forbids changing record content, and no issue adds a command to declare a reason. As written, every record with changed files and no task is incomplete with no way to declare a reason. (2) `check` has requires_task: required and judges the current task (share/commands.yaml:202-221). `finish` runs before the provider's end event closes the episode. Neither has a closed record to judge, and lib/check.sh is not in I3146's scope. (3) The milestone says every closed record 'carries' a verdict, while I3146 and ADR 0182 say the verdict is derived and never stored. The plan must define which record or open episode each of doctor, check and finish judges, and where a declared reason lives."
    blocking: true
    resolution:
      state: planned
      issue: I3146
      because: "ADR 0182 already derives the verdict 'from the record, the ledger and git', so a declared reason belongs in the ledger, not the record. I3146 adds a session.reason ledger event and a command that appends it, and session-record.v1 stays unchanged. A continuation reason is a handover in the window, or a later episode of the same provider session naming this one as its predecessor. doctor judges closed records. check and finish judge the calling provider session's open episode as a prospective verdict over its window so far. check reports it without changing requires_task. 'Carries' is defined as 'derivable for every closed record, never stored', and lib/check.sh joins the scope. Plan reconciled on 2026-10-18 after verification: the criterion record-states-completeness names the session.reason ledger event and the open-episode verdict, and share/schemas/majordomus/session-record left I3146's scope."
  - id: hook-cutover-drops-end-and-start-duties
    class: insufficient_work
    subject: "I3143"
    finding: "I3143's new behaviour already exists on master. The receipt is written before any guard (mj_capture_session_receipt, lib/capture.sh:1526; events.yaml:160-174 says 'the first act of every lifecycle adapter, written before any guard runs'), and failures write provider.event.failed, which doctor counts (lib/doctor.sh:920). What the issue does not list is everything else the shims trigger today, all of which the domain would have to take over: handover on end with --no-task (capture.sh:1841-1852), mesh join on start and leave on end (I2734; :1597, :1861), ensure_server_on_start (:1646), the briefing printed to the model's context on start, the commit of the closed record through plumbing (mj_capture_publish_record, :1880, :1908), and the knowledge-derive failure becoming a typed event (:1872-1878). Without these in the acceptance criteria, a shim exec'ing 'one domain command' silently drops the mesh exit, the continuation and the record commit."
    blocking: true
    resolution:
      state: planned
      issue: I3143
      because: "Confirmed at capture.sh:1597, :1646, :1880 and :1908. Every current duty of the start and end paths becomes an acceptance criterion with a regression check. A criterion that is red today replaces the one master already meets: no generated shim invokes `capture session`, and the lifecycle domain command writes the receipt. Plan reconciled on 2026-10-18 after verification: the intent gains the criterion hooks-run-the-domain, which names every start and end duty, and I3143 serves it."
  - id: lifecycle-depends-on-a-built-executable
    class: regression_risk
    subject: "the-session-domain-is-written-once"
    finding: "After steps 1-3 the closer, the opener and the hooks need the Rust executable. lib/rust_bin.sh resolves it from MAJORDOMUS_BIN, then libexec/, then target/debug, and documents that a missing executable made Rust-backed features 'degrade in silence'. A hook cannot build a missing or stale executable, and an old binary would close with old semantics. The plan does not say what happens then: is the episode left open? does the hook fall back to shell? Case 220 itself switches off ensure_server_on_start so that it does not need a built executable (220_exactly_once_close.sh header). Under delegation, test/lib.sh rust_bin returns 3 and the case skips, so the milestone's '54, 60-63, 111, 130, 135 and 220 pass unchanged' can be met by skips. '130' is also ambiguous, because there are four 130_* cases. Latency is another risk: I3304 in this same import measured about 4 s of cold start per hook call and records the owner's order that hooks never slow him down, and moving SessionStart into the executable is that cost. The plan needs a criterion for absent or stale executables, a no-skip guarantee for these cases, and a latency budget."
    blocking: false
    resolution:
      state: planned
      issue: I3141
      because: "I3141 and I3143 get acceptance criteria for this. With no resolvable executable, or one older than the tree's lifecycle contract, the closer fails loudly with a typed provider.event.failed. The episode stays open and the shell never falls back. The validation of the named cases treats a skip as a failure, and '130' is named as 130_lifecycle_survives_a_stale_task. I3143 depends on I3304 and stays inside its declared capture budget. Plan reconciled on 2026-10-18 after verification: the absent-or-stale-executable contract is its own issue in this milestone, split out of I3141 (plan key I3320; its id is allocated by the next merge), and I3141, I3142 and I3143 depend on it. The no-skip guarantee uses bash test/run.sh --no-skips, which exists on master, in every validation of the milestone, and the cases are named in full (130_lifecycle_survives_a_stale_task)."
  - id: capture-sh-is-edited-by-five-sibling-issues
    class: regression_risk
    subject: "I3143"
    finding: "Other issues promoted in the same branch change the hook paths I3143 replaces, and none of them declares a dependency on or overlap with I3141-I3143. I3148 writes governance and briefing digests into session.started through lib/capture.sh. I3303 generates Codex shims that call `capture session`, the command I3143 retires. I3304 hands capture to the shared server. I3301 wires the Stop event. I3296 measures compaction in capture.sh. Separately, I3156 (ADR 0184) generates bin/majordomus delegation lines and flags a command name implemented by both executables outside a declared delegation. I3141 hand-writes the first such delegation (session close) with no ordering against I3156. ADR 0047's own warning ('a cutover on the day four agents are editing lib/*.sh is a semantic merge conflict') applies to the import itself. Add the edges: I3148 and I3303 after I3142 and I3143, or the reverse, and I3141 on I3156's delegation format."
    blocking: false
    resolution:
      state: planned
      issue: I3143
      because: "I3148 already depends on I3142. The reverse order is taken for the rest: I3143 lands after I3148, I3303, I3304 and I3301, so it ports the shims and capture paths they leave behind. None of them depends on I3141-I3146, so there is no cycle. I3141 depends on I3156, so the session-close delegation uses ADR 0184's generated format. I3296's compaction measurement is listed as a known overlap in capture.sh and must be claimed on the mesh before I3143 starts. Plan reconciled on 2026-10-18 after verification: ADR 0184 was amended: delegation stays read from the generated docs/generated/cli.yaml at run time, so I3141's session-close delegation is that read and no generated or hand-written line in bin/majordomus."
  - id: inventory-disposition-is-self-certified
    class: unproven_assumption
    subject: "a-session-record-says-what-it-served#no-shell-session-semantics"
    finding: "The planned proof is `shell check` showing no class-A record. The inventory field is 'disposition' (there is no 'class'), and it is hand-authored. shell.check validates only that a record is present, well-formed and has a disposition in A-F (apps/majordomus-cli/src/capability/builtin/shell.rs, capability description). It never inspects what the file does. lib/intent_binding.sh is disposition A although its own reason says 'it decides nothing', so A does not mean semantics are present. Editing three inventory lines satisfies the criterion with no cutover at all. The proof should be structural: lib/session.sh, lib/checkpoint.sh and lib/handover.sh make no mj_publish_record, mj_lock_take or mj_ledger_append lifecycle write, and none references session.freshness."
    blocking: false
    resolution:
      state: planned
      issue: I3145
      because: "I3145 owns the inventory criterion. A structural case replaces the self-certified proof: lib/session.sh, lib/checkpoint.sh and lib/handover.sh contain no mj_publish_record, no lifecycle mj_lock_take, no mj_ledger_append of a session or task lifecycle event and no session.freshness reference. The inventory disposition change is a consequence of the cutover, not its proof. Plan reconciled on 2026-10-18 after verification: the criterion no-shell-session-semantics now states the structural property, and I3145's acceptance keeps the disposition change only as a consequence."
  - id: adr-0047-has-six-steps-and-step-5-is-underscoped
    class: insufficient_work
    subject: "I3145"
    finding: "ADR 0047 lists six cutover steps, but the milestone says five and its acceptance asks for 'each of ADR 0047's five cutover steps'. Step 6 is removing lib/session.sh's state machine, resolver and freshness arithmetic so that 'nothing in lib/ holds domain state'. It is folded into I3145 or dropped. I3145 deletes mj_resolve_latest and mj_freshness (lib/common.sh:1570, :1702), but its scope names only common.sh, handover.sh and context.sh. Callers also live in lib/check.sh:277, finish.sh:260, start.sh:173, prompt.sh:131-136, watch.sh:53/67, derive.sh, doctor.sh, recover.sh, checkpoint.sh and session.sh, and the Cockpit it says it repoints (apps/majordomus-cli/src/cockpit) is not in scope either. Both ADR 0047 and ADR 0052 are still status: proposed, but the plan treats them as decided."
    blocking: false
    resolution:
      state: planned
      issue: I3145
      because: "Verified: ADR 0047 lines 215-232 list six steps. I3145 explicitly carries step 5 and step 6 and adds every caller of mj_resolve_latest and mj_freshness, plus the Cockpit, to its scope. ADR 0047 and ADR 0052 stay proposed, and accepting them is the owner's act. The plan proceeds on them as the design of record and is replanned if the owner rejects either one. That is recorded in the issue's why. Plan reconciled on 2026-10-18 after verification: the milestone's problem, desired_state and acceptance now say six steps."
  - id: checkpoint-acceptance-already-met
    class: insufficient_work
    subject: "I3144"
    finding: "I3144's only acceptance criterion that is not a regression check, 'a checkpoint is written with no active task', already holds on master. lib/checkpoint.sh writes `${id:-none}` when no task is loaded, and the end-of-session handover already runs with --no-task (lib/capture.sh:1848). Nothing in the acceptance pins the objective, 'recorded against the episode'. Checkpoint and handover front matter (mj_record_front_matter, lib/common.sh:1541-1550) carries task_id but no session_id. The issue needs a criterion that fails today, for example that the front matter names the episode or that the domain is the writer."
    blocking: false
    resolution:
      state: planned
      issue: I3144
      because: "Criteria that are red today are added. Checkpoint and handover front matter names the session_id of the episode that wrote it. The domain is the only writer of both records. The task.checkpoint and task.handed_over ledger lines carry the episode id. The existing criterion is kept only as a regression check. Plan reconciled on 2026-10-18 after verification: the intent gains the criterion checkpoints-name-their-episode, which I3144 serves."
  - id: verdict-reaches-no-reader-surface
    class: surface_missing
    subject: "a-session-record-says-what-it-served#record-states-completeness"
    finding: "The verdict reaches only doctor, check and finish. The intent says 'a fresh session continues from the record', and the owner asked for 'integrated / deployed / documented' (c116#4). No issue carries the verdict to any reader surface: the session-start briefing, session latest/show/list, continuity resume, the site's /sessions/ pages (site/content/sessions), the Cockpit pages, /ui/idd or the session MCP resource. A record could be incomplete while every surface a resuming session reads stays silent about it. ADR 0182, which this verdict implements, is cited by neither I3146 nor the milestone."
    blocking: false
    resolution:
      state: planned
      issue: I3146
      because: "I3146 cites ADR 0182 and carries the derived verdict to the surfaces a resuming session reads: the session-start briefing, session latest/show/list, continuity resume, the session-domain capability and its MCP resource, the generated site/content/sessions pages and the Cockpit session view. Each surface gets a case. /ui/idd is left to the IDD stream, which reads the same capability."
