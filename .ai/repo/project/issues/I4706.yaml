id: I4706
milestone: a-second-adopter-is-served
title: "A dependency the policy declares consumed from outside changes only by a pin bump to a commit its upstream holds, and every other change to it is refused at commit and at push"
slug: a-consumed-dependency-changes-only-by-its-pin
priority: p2
profile: implementation
parallel_safe: true
objective: "A policy key `dependencies.consumed` lists the paths of dependencies that the repository consumes and must never edit. Each entry is a git submodule, or a vendored directory with a declared sync command, and names its upstream (a remote URL and optionally a branch). commit.validate, run by the commit-msg hook, and `finish --check`, run by the pre-push hook, judge each commit that touches such a path. For a submodule, the only allowed change is its gitlink, moving to a commit that is reachable from the declared upstream branch or tag at the time of the check. A gitlink that points at a commit the upstream does not hold is refused, because that commit was made by editing the dependency locally. For a vendored directory, a change is allowed only when the commit's trailer names the declared sync command and the tree equals what that command produces. doctor names a declared submodule whose checkout is dirty or detached from its pinned commit. A refusal names the path, the commit and the remedy: change the dependency upstream, then bump the pin."
why: "Observed on 2026-11-22 in an adopter repository. It consumes two of its owner's other projects as pinned git submodules. A standing owner order says it must never edit them, and wrap any gap on its own side instead. The rule lived only in a memory note and in reviewers' attention. Nothing in the layer could refuse a session that edited the submodule's checkout and bumped the pin to its own local commit. The pattern is generic: any repository that consumes a dependency it does not own needs this boundary enforced."
current_state: "Measured at origin/master 636acc8c845 on 2026-11-22. The policy schema (share/schemas/majordomus/policy/policy.v1.schema.json) has no key that declares a consumed dependency. commit.validate (apps/majordomus-cli/src/commit/) judges a message's type, scope and trailers, and not the paths a commit changes. The task scope that `check` and `finish` enforce is a per-task allow-list. It is written by the worker and says nothing permanent about a path. ADR 0230 mentions submodules only when it explains how the UI kit check counts repositories. No issue, ADR or rule names a guard for a consumed dependency."
desired_state: "A consumed dependency's content changes only upstream. The consumer's history shows a pin bump and nothing else, and both hooks refuse the alternative with a remedy that names the upstream."
scope:
