# The release pipeline. An adapter over .ai/repo/ci/release.yaml and the build matrix
# generated from share/distribution.yaml; it carries no platform, runner, artifact name or
# URL of its own, and test/cases/87_release_pipeline.sh holds it to that.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The version is not chosen here: the tag must already agree with the crate's version and
# with bin/majordomus, which is the first thing checked and the reason a mistyped tag costs
# thirty seconds rather than a published release.
#
# Phases: plan -> build (matrix) -> publish -> smoke. Nothing is published unless every
# supported target built and verified; a release missing a platform is not a release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag to release from
        required: true

# Read-only by default: only the publication job is given more, and only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ plan
  # One version, one model, and the matrix the rest of the run is shaped by.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: resolve
        name: the tag, and the version every writer of it agrees on
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          scripts/release-version --check --tag "$tag"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust

      - name: the distribution model and every recorded release hold their invariants
        run: |
          cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          apps/majordomus-cli/target/debug/majordomus distribution validate
          apps/majordomus-cli/target/debug/majordomus generate distribution --check

      - id: matrix
        name: the build matrix, generated from the model
        run: |
          matrix="$(jq -c '{include: .include}' docs/generated/distribution-matrix.json)"
          smoke="$(jq -c '{include: [.include[] | select(.native)]}' docs/generated/distribution-matrix.json)"
          {
            echo "matrix=$matrix"
            echo "smoke=$smoke"
          } >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.id)\t\(.runner)\t\(.artifact)"' docs/generated/distribution-matrix.json

  # ------------------------------------------------------------------ build
  # One archive per supported target, on the runner the model names, verified where it was
  # built. fail-fast, because a release missing a platform is not a release.
  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 1

      - name: the packages this target needs
        if: matrix.packages != ''
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - uses: ./.github/actions/setup-rust

      - name: the target this artifact is for
        run: rustup target add "${{ matrix.target }}"

      - name: package
        env:
          MAJORDOMUS_BUILD_COMMIT: ${{ github.sha }}
        run: scripts/release-package --target "${{ matrix.target }}" --tag "${{ needs.plan.outputs.tag }}" --out dist

      - name: verify the artifact is what the model says it is
        run: |
          artifact="$(printf '%s' "${{ matrix.artifact }}" | sed "s/{tag}/${{ needs.plan.outputs.tag }}/")"
          native=""
          [ "${{ matrix.native }}" = "true" ] && native="--native"
          # shellcheck disable=SC2086
          scripts/release-verify --archive "dist/$artifact" \
            --target "${{ matrix.target }}" --tag "${{ needs.plan.outputs.tag }}" $native

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ publish
  # The only job with write permission, and it begins only when every build succeeded.
  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # to start the pages workflow by hand. A push made with GITHUB_TOKEN starts no
      # workflow — see the step that uses this — so the publication has to be asked for.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: ./.github/actions/setup-rust

      - name: the executable that answers what an artifact is called
        run: cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml

      # Rerunning this workflow for a tag that already has a release is a supported path, and
      # it is the one an operator reaches for after a failure in a later step. The choice made
      # here is: the assets on an existing release are the release. This run's rebuild is
      # discarded and the published bytes are downloaded in its place, because the record about
      # to be written is evidence of what a user will download — and a rebuild is not
      # bit-identical (docs/DISTRIBUTION.md records that, rather than claiming otherwise), so
      # recording this run's bytes would state digests nothing serves. When no release exists,
      # this run's artifacts are published and are then the same bytes by construction.
      - id: publication
        name: publish the release, or adopt the one already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.plan.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; adopting its assets rather than republishing"
            rm -rf dist && mkdir dist
            gh release download "$tag" --dir dist --pattern '*.tar.gz' \
              || { echo "::error::$tag exists but publishes no archive. Delete the release (gh release delete $tag) and rerun this workflow."; exit 1; }
            echo "adopted=true" >> "$GITHUB_OUTPUT"
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*.tar.gz
            echo "adopted=false" >> "$GITHUB_OUTPUT"
          fi
          ls -l dist

      # Computed from the bytes in dist, which are now the published bytes either way.
      - name: the conventional digest file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS )
          # derived from immutable assets, so replacing it on a rerun changes nothing it states
          gh release upload '${{ needs.plan.outputs.tag }}' dist/SHA256SUMS --clobber

      - name: the record of what was published
        run: |
          scripts/release-record --tag "${{ needs.plan.outputs.tag }}" --dir dist \
            --commit "${{ github.sha }}" \
            --notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}"

      # Not `generate --target distribution` alone: the record moves docs/INSTALL.md, and that
      # document is a canonical input of the site's derived data, so regenerating only the
      # distribution's own projections leaves site/data/generated stale and the Pages build —
      # the one that would publish releases/latest.json — refuses the tree. The whole
      # derivation graph, in its own order, is what keeps the release readable by the
      # installer it was published for.
      - name: every projection of the new record, regenerated in dependency order
        env:
          MAJORDOMUS_BIN: ${{ github.workspace }}/apps/majordomus-cli/target/debug/majordomus
        run: scripts/derive

      - name: propose the record and the metadata it publishes
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # whatever the derivation wrote, rather than a list of trees that can fall behind
          # it: a release changes more than its own metadata — the installation guide gains a
          # row, and the site's data and content are projections of that guide. Only the
          # downloaded artifacts are kept out; the build outputs are already ignored.
          git add -A -- . ':(exclude)dist'
          # A rerun over a release whose record is already committed has nothing to add, and
          # that is success, not failure: the state this step exists to reach is already there.
          if git diff --cached --quiet; then
            echo "::notice::the record and its projections are already committed; nothing to push"
            exit 0
          fi
          git commit \
            -m "chore(release): record ${{ needs.plan.outputs.tag }} and the metadata it publishes" \
            -m "The record is written from the artifacts that were published; every projection of it — the public metadata under site/static/releases/, the installation guide, the site's data and content — is regenerated by scripts/derive. All of it is generated: nothing here was typed."
          # Through a pull request, never straight at the default branch. v0.6.0 published six
          # artifacts and then failed here three times with `GH006: protected branch hook
          # declined`, and the branch protection was right: a pipeline that writes its own
          # output into a protected branch is a pipeline that reviews itself. v0.2.0 and v0.3.0
          # carry the same wound from before protection existed — the version gate has been
          # reporting "tagged and the layer holds no release record for it" about them ever
          # since, which is what this step failing silently looks like months later.
          branch="release/record-${{ needs.plan.outputs.tag }}"
          git branch -f "$branch"
          for attempt in 1 2 3; do
            git push -f origin "$branch" && break
            echo "push attempt $attempt failed; retrying"
            sleep 5
            [ "$attempt" = 3 ] && { echo "::error::the record could not be pushed to $branch"; exit 1; }
          done
          url="$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "chore(release): record ${{ needs.plan.outputs.tag }} and the metadata it publishes" \
              --body "Written by scripts/release-record from the artifacts published for ${{ needs.plan.outputs.tag }}, with every projection regenerated by scripts/derive. Nothing here was typed. Until this merges, the published site's latest.json does not name ${{ needs.plan.outputs.tag }} and the layer holds no record for it, so majordomus release version warns about the tag." \
            2>/dev/null || gh pr view "$branch" --json url --jq .url)"
          echo "::notice::the release record is proposed in $url; the site will not name ${{ needs.plan.outputs.tag }} until it merges"
          echo "record_pr=$url" >> "$GITHUB_OUTPUT"

      # The step without which none of the above reaches a user.
      #
      # GitHub does not start a workflow from a push made with GITHUB_TOKEN. That is a
      # deliberate loop-breaker and it cannot be turned off for a token; it means the commit
      # above — the one carrying site/static/releases/latest.json — starts no `pages` run,
      # ever. The release then owns a GitHub Release, a committed record, and a published
      # site that has never heard of either, and smoke waits fifteen minutes for a file that
      # nothing is going to write. Release v0.3.1 spent its whole smoke phase in exactly
      # that state, with all six builds green and the external contract broken the entire
      # time; the deploy is the last link of the chain, so the release asks for it rather
      # than assuming a side effect it does not have.
      #
      # `workflow_dispatch` is the same entry point a person uses, so this adds no second
      # deploy path (site-deploy-one-path); it starts the one that exists. It runs whether
      # or not the commit step had anything to push, because a rerun after a failed deploy
      # is precisely the case with nothing to commit and everything to publish.
      - name: ask Pages to publish the default branch, because nothing else will
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}" \
            || { echo "::error::could not start the pages workflow; the release metadata is committed but unpublished. Start it by hand: gh workflow run pages.yml --ref ${{ github.event.repository.default_branch }}"; exit 1; }
          echo "pages requested on ${{ github.event.repository.default_branch }}"

  # ------------------------------------------------------------------ smoke
  # The published installer, from its published URL, installing the release that was just
  # published. This is the check that catches a release whose artifacts exist and whose
  # names the installer does not expect.
  smoke:
    needs: [plan, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 1

      # The handshake with Pages, on the identity that matters. The wait is for the published
      # latest.json to name *this* tag — not for a commit, and not for a clock. Waiting on the
      # site's build commit was considered and rejected: the default branch moves during a
      # release, so Pages may legitimately be serving a newer commit than the one that carried
      # the record, and a run that insisted on equality would wait for a state that will never
      # arrive. The tag is the immutable identity of what was published, so it is what is
      # waited on; the build commit is reported beside it because it is what an operator needs
      # to know when the wait fails.
      - name: wait for the published metadata to name this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The record now reaches the default branch through review, so there is a window in
          # which the release is published and its metadata is not. Waiting sixty times for a
          # file that a human has not merged yet is not a smoke test, it is a timeout wearing
          # one — so the wait is skipped, loudly, while the record is still a proposal.
          tag='${{ needs.plan.outputs.tag }}'
          if ! gh api "repos/${{ github.repository }}/contents/.ai/repo/releases/$tag.yaml?ref=${{ github.event.repository.default_branch }}" >/dev/null 2>&1; then
            echo "::notice::$tag is published, but its record is still a proposal: the site cannot name it yet. Merge the release-record pull request, then re-run this job."
            exit 0
          fi
          base="$(sed -n 's/.*"installer_url": "\([^"]*\)".*/\1/p' site/data/registry/distribution.json | head -n 1)"
          base="${base%/install.sh}"
          url="$(sed -n 's/.*"latest_url": "\([^"]*\)".*/\1/p' site/data/registry/distribution.json | head -n 1)"
          tag='${{ needs.plan.outputs.tag }}'
          echo "waiting for  $url"
          echo "to name      $tag"
          for attempt in $(seq 1 60); do
            if curl -fsSL "$url" 2>/dev/null | grep -q "\"tag\": \"$tag\""; then
              echo "the site publishes $tag after $attempt attempt(s)"
              echo "site built from  $(curl -fsSL "$base/build.json" 2>/dev/null | sed -n 's/.*"commit": "\([^"]*\)".*/\1/p' | head -n 1)"
              exit 0
            fi
            sleep 15
          done
          {
            echo "expected  \"tag\": \"$tag\" in $url"
            echo "observed  HTTP $(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "body      $(curl -fsSL "$url" 2>/dev/null | head -c 400)"
            echo "site is built from commit $(curl -fsSL "$base/build.json" 2>/dev/null | sed -n 's/.*"commit": "\([^"]*\)".*/\1/p' | head -n 1)"
            echo "reproduce: curl -fsSL $url"
            echo "the record was committed to the default branch; if that commit is on the branch"
            echo "and Pages has run since, the pages workflow is where this failed."
          } >&2
          echo "::error::$url still does not name $tag after 15 minutes"
          exit 1

      - name: install the published release with the published installer
        run: |
          installer="$(sed -n 's/.*"installer_url": "\([^"]*\)".*/\1/p' site/data/registry/distribution.json | head -n 1)"
          curl -fsSL --max-time 120 "$installer" | sh -s -- --version "${{ needs.plan.outputs.tag }}"

      - name: the installed tool is the release that was published
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          majordomus --version
          [ "$(majordomus version)" = "majordomus ${{ needs.plan.outputs.version }}" ]
          majordomus-mcp --help >/dev/null 2>&1 || true

      - name: and it initialises a repository that has none
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          git init -q .
          majordomus init
          test -f .ai/repo/policy.yaml
