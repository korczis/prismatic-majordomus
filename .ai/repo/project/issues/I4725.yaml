id: I4725
milestone: fabric-local-pilot
title: "Entering a checkout registers its logical context with the host agent in one bounded call (P04)"
slug: fabric-p04-context-registry
priority: p1
profile: implementation
objective: "When a shell enters a checkout, register or revalidate its logical context with a running host agent in one bounded IPC call, derived from the manifest, git, the checkout identity and mesh::repository, with its authority mode (legacy_proxy, host_owned or unavailable); keep registering a context distinct from attaching a live session; change no checkout server's ownership."
why: "Corrected DAG: P04 follows P03 (I4724). BASE_PACK_MAP: a context entry is not a live session and not a mutable owner (S02, S04)."
current_state: "Observed 2026-11-25: env enter resolves the checkout's environment and starts no server (ADR 0043); nothing registers a context anywhere."
desired_state: "env enter returns the same exports and banner as today, registers the context when an agent answers, and reports the agent unavailable otherwise, without waiting on it."
scope:
  - "apps/majordomus-cli/src/fabric"
  - "apps/majordomus-cli/src/commands/env.rs"
  - "apps/majordomus-cli/src/environment"
  - "apps/majordomus-cli/src/mesh/repository.rs"
  - "test/cases"
non_scope:
  - "Enrolling a repository into the mesh or granting it access to another project"
  - "A session created by cd alone"
  - "Scanning every project on the host"
depends_on:
  - "I4724"
acceptance_criteria:
  - "Registration is idempotent by the derived context id, and two worktrees of one repository are two contexts of one repository"
  - "A deleted, moved or symlink-swapped root and a tampered context id are revalidated or refused, never registered as another context"
  - "With no host agent, env enter stays within the policy's entry budgets and its output is unchanged"
validation:
  - "majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "context_registration_test"
  - "entry_without_agent_unchanged_test"
created_at: 2026-11-25
updated_at: 2026-11-25
