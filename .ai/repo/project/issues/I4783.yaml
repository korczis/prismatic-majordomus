  - "Shipping hooks in the skeleton (I4784)"
depends_on: []
serves:
  - "a-downstream-adopter-is-told-the-truth-and-keeps-its-proofs#a-projects-proofs-are-registered"
acceptance_criteria:
  - "An entry `{path: scripts/gate, args: [], wired_by: git-hook:pre-push}` with a hook line `scripts/gate` is reported wired"
  - "The same with `scripts/gate || exit $?` is reported wired, and with `scripts/gate || true` reported as swallowing the exit code"
  - "A hook whose only mention is `# scripts/gate` is reported unwired"
  - "The case fails against lib/doctor.sh as it is at 46775282570"
validation:
  - "bash test/run.sh 4783_a_path_only_invocation_is_wired"
evidence_required:
