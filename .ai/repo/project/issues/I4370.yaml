non_scope:
  - "Merging, arming auto-merge or landing anything: the intent's non-goal 'Auto-merge on GitHub' stands"
  - "Moving the plan to GitHub issues or Projects, or reading anything back from GitHub into a record"
  - "A network call in the Rust executable beyond ADR 0101's exception: the adapter stays shell over gh, as github-sync is; the one issue-events read for release-freeze is part of prs refresh's observation"
  - "The adopter's workflow files (I4371), renamed records (I4369) and the repository-settings comparison behind `forge check --repo` (I4372)"
acceptance_criteria:
  - "Case 4370 installs the packaged archive (scripts/release-package) into a temporary prefix, with no checkout of this repository on PATH or in MJ_ROOT, and runs `majordomus forge check --prs` and `forge apply --prs` from that prefix in a fixture adopter with OSCILLA's layout (project.yaml korczis/oscilla, default_branch main, V603.yaml, M048.yaml) against a scripted forge. The pull request 'feat(studio): V603 pinch zoom' from feat/v603-x gets type:feat, priority, milestone M048, assignee and a Refs region naming V603"
  - "In the same fixture, a pull request titled 'feat(studio): pinch zoom' (no id) from feat/v603-x is attributed to V603 through its branch alone and gets the same metadata"
  - "With the fixture adopter's declared families adding a train type, a pull request titled 'train(studio): ...' gets that type label; in this repository, the library test of I3979 still holds the declaration equal to release/model.rs's commit types and to LABEL_POLICY"
  - "Scripted forge: a second apply makes 0 writes; a region whose hash no longer matches is reported edited and not overwritten; a label outside the declared families is untouched; with `apply.budget: 5` against 8 owed writes, apply exits 16 after 5 writes and the next run writes the other 3 and exits 0; `--budget 2` overrides the declared budget for one run; gh unauthenticated exits 12 with 0 writes; a listing shorter than totalCount exits 12 (I3920); an unmanaged issue is never closed; no projected text contains a closing keyword"
  - "With `facts:` declared, a facts command that prints majordomus.pr-facts/v1 JSON decides the served ids and the level; facts that fail the schema exit 12 naming the field and write nothing; doctor reports the pr-facts schema as applied (case 32 stays green)"
  - "A pull request whose head changes pr-meta.yaml's `facts:` line is judged by the default branch's command, its own is never executed (a fixture facts command in the head that writes a marker file leaves no marker), and the finding names the ignored change"
  - "`forge apply --plan-records --milestones-only` creates the 54 milestones of a fixture shaped like OSCILLA's and no issue, and a second run makes 0 writes"
  - "`forge apply --labels` creates every declared label missing on the scripted forge and reports GitHub's default labels without deleting any"
  - "A pull request carrying release-freeze whose latest labeled event's actor is pr-meta.yaml's `actor.login` is held by the integration classifier; one whose release-freeze was set by any other login is ignored, reported and not held; a pull request with no release-freeze makes no events read (the scripted forge's call log)"
  - "`forge render --prs --pr <n> --out <file>` writes a majordomus.forge-plan/v1 document holding the facts read and the writes owed, valid against its shipped schema; `forge apply --from <file>` makes exactly those writes on the scripted forge, reads no record, and never runs the `facts:` command (a facts command that writes a marker file leaves no marker); a file of another schema version exits 10 with 0 writes"
  - "lib/common.sh defines MJ_EX_* constants for 14 (a title over GitHub's limit) and 16 (the write budget is spent), the adapter exits only through MJ_EX_* constants, and the `forge` entry in share/commands.yaml declares exit codes 0, 2, 10, 11, 12, 13, 14, 15 and 16, reconciled by test/cases/30_command_registry.sh"
  - "The location of the pull-request vocabulary is recorded as a `majordomus decision` or in the forge ADR, which names the file; forge reads the type and label families from that file only, and no other file declares them"
  - "SECURITY.md's 'Local only' promise names the forge adapter as the shell tool's one request that leaves the machine and lists it beside ADR 0067 and ADR 0101 as the second exception that reaches the forge, citing its ADR; case 08 scans share/libexec/*, refuses a fixture gh call in lib/ or in any share/libexec file other than the declared adapter, and passes on the tree with share/libexec/sccache-mesh present"
  - "The ADR that overrides work-graph-github's non-scope against network calls in the tool itself has status accepted, set by the owner's act, before the pull request lands; SECURITY.md and .ai/repo/project/milestones/work-graph-github.yaml cite it by number"
  - "`majordomus shell check` exits 0 with lib/forge.sh and share/libexec/github-sync recorded in the inventory; cases 30 and 31 pass with `forge` in share/commands.yaml and the usage text"
  - "Cases 3970, 894 and 45 pass with scripts/github-sync as the wrapper"
validation:
