id: I3820
milestone: fly-deployment
title: "A deployment names the provider that hosts it, and the provider's files are generated from it"
slug: a-deployment-derives-its-provider-files
priority: p1
profile: implementation
parallel_safe: false
objective: "deployment/v1 gains an optional provider block (name gigalixir, app, stack, url); the typed model parses and checks it; majordomus generate deployment renders deploy/gigalixir/Procfile and deploy/gigalixir/bin/{detect,compile,release} from the object with provenance headers under generate --check; the crate's build script reads the provider's SOURCE_VERSION when MAJORDOMUS_BUILD_COMMIT is unset; rule majordomus.deployment-contract moves to version 2 (a known provider is accepted, an unknown one refused, every provider file generated); .ai/repo/deployments/majordomus.yaml names the Gigalixir application prismatic-majordomus. ADR 0219."
why: "The owner ordered on 2026-10-20/21 that Prismatic Majordomus run on Gigalixir and that the deployment be derived, enforced and always current, not a parallel universe. The first deployment was a hand-assembled slug whose file list, start command and port restate facts the deployment object holds, and the contract refused the provider key that would let the object state where it runs."
current_state: "Measured on master 573df967bb5: deployment/v1 has no provider field and rule deployment-contract v1 refuses one (case 84 asserts it); render.rs renders only deploy/Dockerfile and .dockerignore; build.rs reads MAJORDOMUS_BUILD_COMMIT or git; https://prismatic-majordomus.gigalixirapp.com runs a slug assembled by hand and answers the release binary's commit 9a5a9b77520."
desired_state: "The object states provider.name gigalixir, app prismatic-majordomus, stack gigalixir-24 and url https://prismatic-majordomus.gigalixirapp.com; deploy/gigalixir/ holds the generated Procfile and hooks and generate --check refuses a hand edit; case 84 refuses an unknown provider name, a non-https url and a hosted loopback interface; case 86 checks the provider files' header, command, port and credential scan; case 3820 renders a fixture object with a provider and proves the Procfile starts the declared executable on the provider's port."
scope:
  - ".ai/repo/adrs/0219-a-deployment-names-its-provider-and-every-provider-file-is-derived.md"
