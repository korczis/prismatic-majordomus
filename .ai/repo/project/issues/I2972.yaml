acceptance_criteria:
  - "The decision names the selected issue, each rejected candidate with its failed constraint, and each ranking term"
  - "It is one capability projected on the command line, MCP and HTTP, and writes nothing"
validation:
  - "majordomus plan validate"
evidence_required:
