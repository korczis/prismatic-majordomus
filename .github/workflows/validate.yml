name: validate
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The CLI needs no Node. The derived site's tests and check do (flowbite assets),
      # so the matrix installs it once; the CLI's own tests would pass without it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: shell syntax
        run: for f in bin/majordomus lib/*.sh test/run.sh test/lib.sh test/cases/*.sh; do bash -n "$f"; done
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x -s bash -S warning bin/majordomus lib/*.sh test/run.sh test/lib.sh scripts/generate-site-data scripts/github-sync scripts/site-build scripts/site-check scripts/site-serve scripts/rules-package scripts/rust-check
          shellcheck -x -s bash -S warning test/cases/*.sh
      # The one canonical validation surface. Every behavioural, negative and integration
      # case runs here; nothing is skipped, and no failure is swallowed. test/run.sh exits
      # non-zero when any case fails, and this step has no `|| true` to hide it.
      - name: behavioural tests
        run: bash test/run.sh
      - name: self-supervision
        run: |
          git config core.hooksPath .githooks
          bin/majordomus doctor
          bin/majordomus watch
      # The scoped context documents: the tree validates, every projection matches its
      # stamp, and this repository resolves its own context from the root down.
      - name: context documents in sync
        run: |
          bin/majordomus context check-sync
          bin/majordomus context resolve lib | grep -q '^01  ai.layer'
      # The continuity subsystem reached through the real CLI, in this checkout rather than
      # in a disposable one: the commands a worker actually runs must work where the tool
      # supervises itself, not only in a fixture.
      - name: continuity subsystem is reachable
        run: |
          bin/majordomus context --budget-lines 400 > /dev/null
          bin/majordomus context --json | head -c 1 | grep -q '{'
          bin/majordomus history --validate
          bin/majordomus handover --resolve > /dev/null
          bin/majordomus checkpoint --list > /dev/null
          bin/majordomus decision list > /dev/null
          bin/majordomus question list --all > /dev/null
          bin/majordomus prompt list | grep -q .
          for p in $(ls .ai/repo/prompts/*.md | xargs -n1 basename | sed 's/\.md$//'); do
            bin/majordomus prompt render "$p" | grep -q '{{' && { echo "unrendered token in $p"; exit 1; }
            true
          done
      # The canonical project model: schemas, references, the dependency graph, and status
      # consistency. Blocking, with no advisory pass — a model that cannot be executed is not
      # a warning. `plan validate` exits 10 on any failing finding and 0 on warnings only.
      - name: the project model validates
        run: bin/majordomus plan validate
      # The GitHub projection, computed offline. This needs no token and makes no request: it
      # renders what would be posted from the canonical model, so a projection that cannot be
      # produced fails here rather than at the moment somebody runs --apply.
      - name: the GitHub projection is producible offline
        run: |
          scripts/github-sync --plan
          for id in $(bin/majordomus plan list | awk 'NR>1{print $1}'); do
            scripts/github-sync --render "$id" | grep -q '^<!-- majordomus:begin' || { echo "no generated region for $id"; exit 1; }
          done
      # The committed derived site data must match the canonical files it is generated from.
      - name: derived site data in sync
        run: scripts/generate-site-data --check

  # The Rust executable: format, lints as errors, and its own suite, which spawns the built
  # binary and speaks MCP to it over pipes. The behavioural case 72_rust_mcp.sh in the job
  # above covers the cross-check against the layer the shell tool writes.
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/majordomus-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/majordomus-cli
      - run: cargo fmt --check
      # missing documentation on a public item is a warning, and warnings are errors here
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --no-fail-fast
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo bench --no-run
      # the registry builds and every projection with it; the committed projections
      # (docs/generated, share/allow, the provider bootstraps AGENTS.md/CLAUDE.md, and the
      # site's registry dataset) match the registry, the schemas and the policy
      - run: cargo run --quiet -- capabilities validate
      - run: cargo run --quiet -- generate --check
      # every externally callable operation is a benchmark target; the denominator is the
      # registry's, and a missing case fails here before it can be merged
      - run: cargo run --quiet -- bench coverage --check
      # a conservative measurement through the real transports, compared with this
      # platform's baseline under .ai/repo/benchmarks/rust/ when one is committed
      - run: cargo run --quiet -- bench --profile ci --check --no-write

  # Line coverage of the crate, with the threshold scripts/rust-check enforces locally.
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/majordomus-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/majordomus-cli
      - run: cargo llvm-cov --all-targets --summary-only --fail-under-lines "$(cat ../../scripts/rust-coverage-threshold)"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - name: derived site data in sync
        run: scripts/generate-site-data --check
      - name: build the site
        run: scripts/site-build
      # Metadata and landmarks on every route, no unrendered template delimiter, every
      # internal link resolving, no remote asset, no credential, and the generated data
      # still matching its canonical sources.
      - name: check the site
        run: scripts/site-check
      # Every route measured at every supported width, in a real browser. The deploy
      # workflow samples one route per template; this one is the complete measurement, and
      # the branch is not green until it passes. It runs here rather than in front of the
      # artifact so that a slow check does not sit between a green build and a published
      # page — the deploy queue was reaching seventeen minutes with it there, long enough
      # that pushes began superseding each other's deploys.
      - name: probe the site in a browser
        run: CHROME_BIN=google-chrome scripts/site-probe
      - name: manifest
        run: cat site/data/generated/source.json
