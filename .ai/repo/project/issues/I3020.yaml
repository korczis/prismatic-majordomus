id: I3020
milestone: truthful-plan-surfaces
title: "The Knowledge screen states nothing about the repository that its checkout could not observe"
slug: the-knowledge-screen-reads-true
priority: p0
profile: implementation
parallel_safe: true
objective: "Where knowledge_base.status read no line of the session ledger (no close, no derivation, no close without a derivation), /ui/knowledge shows the ledger-derived tiles (Closed, underived; Newest episode) as 'not recorded here' and its deriver panel says that no ledger is recorded in this checkout and where the judgement is made, instead of '0', 'unknown' and 'never, in this checkout'."
why: "The published snapshot of /ui/knowledge (majordomus.dev, v0.29.0 at 707a04c7ce8) read 'Closed, underived 0', 'Last derived: never, in this checkout', 'Last closed: never, in this checkout' and 'Judgement: not judged'. The Pages runner is a fresh clone with no session ledger; a visitor reads those as facts about the repository's knowledge base. Candidate counts are tracked records and stay as read."
current_state: "The screen draws every status field as read, so a checkout with no ledger shows zero and never."
desired_state: "A tile or a panel whose value comes from the session ledger says it is not recorded here when the status read no ledger line; a crate test pins it."
scope:
  - "apps/majordomus-cli/src/ui/knowledge.rs"
acceptance_criteria:
  - "In a checkout without a session ledger, the Closed, underived and Newest episode tiles read 'not recorded here' and still cite knowledge_base.status"
  - "The deriver panel names no 'never' there and names majordomus knowledge status as where the judgement is made"
  - "A checkout whose ledger holds a close keeps its counts and judgement as read"
validation:
  - "cargo test --lib ui::knowledge"
  - "scripts/ui audit --only /ui/knowledge"
evidence_required:
  - "knowledge_screen_reads_true"
