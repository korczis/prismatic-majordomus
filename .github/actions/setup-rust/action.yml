name: setup-rust
description: >-
  The Rust toolchain and the crate's build cache, the same in every job that touches
  apps/majordomus-cli. The version is not chosen here: `rust-toolchain.toml` at the root is
  the one declaration, and rustup reads it, so a runner and a developer get the same rustc,
  rustfmt and clippy. This step seeds a toolchain and the components; the file governs which
  one cargo then uses. It said "the pinned Rust toolchain" while nothing was pinned, and the
  gap between a runner's `stable` and a developer's default reached eight minor versions. The cache (Swatinem/rust-cache) holds the cargo registry, the git
  checkouts of dependencies and the target directory, keyed by the job, the OS, the
  toolchain and Cargo.lock, restored from the default branch when a branch has none yet.
inputs:
  components:
    description: rustup components to add (comma separated), e.g. rustfmt,clippy
    required: false
    default: ""
  cache:
    description: whether to restore and save the build cache
    required: false
    default: "true"
outputs:
  cache-hit:
    description: whether the build cache was restored from an exact key
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    # Where cargo compiles (I4221), as cargo itself answers it. .cargo/config.toml puts the
    # intermediates — the dependencies, fingerprints and incremental state — in build-dir,
    # {cargo-cache-home}/build-shared/majordomus, and leaves only finished artifacts in the
    # workspace's target/. rust-cache joins a workspace's target onto the workspace root, so
    # the directory is handed over relative to apps/majordomus-cli.
    - id: build-dir
      if: inputs.cache == 'true'
      shell: bash
      run: |
        dir=$(cargo metadata --format-version 1 --no-deps --manifest-path apps/majordomus-cli/Cargo.toml | jq -r '.build_directory // empty')
        [ -n "$dir" ] || { echo "setup-rust: cargo metadata names no build_directory" >&2; exit 1; }
        rel=$(python3 -c 'import os, sys; print(os.path.relpath(sys.argv[1], sys.argv[2]))' "$dir" apps/majordomus-cli)
        echo "relative=$rel" >> "$GITHUB_OUTPUT"
    - id: cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        # The build directory is a second target of the same workspace rather than a
        # cache-directories entry. Caching target/ alone restored the executables and none of
        # the compilation, so a job reported `cache hit=true` and still compiled every
        # dependency. A cache-directories entry is saved as it lies, so the coverage job's
        # carried every instrumented test executable of the crate, and its save ran the runner
        # out of disk ("No space left on device", runs 41107049778 and 41254167755) and stored
        # nothing. A target is pruned before the save, to the dependencies' units only: the
        # crate's own units, its test executables and the incremental state are left behind,
        # in llvm-cov-target as in debug. The finished artifacts stay per tree.
        workspaces: |
          apps/majordomus-cli
          apps/majordomus-cli -> ${{ steps.build-dir.outputs.relative }}
        # a red job leaves no cache behind: a half-built target directory would be restored
        # by the next run of the same key
        cache-on-failure: false
    # `just` is an input of the generated files, not a convenience: the editor projection
    # reads the tracked justfile's recipes through `just --dump` (ADR 0140), and `majordomus
    # generate` refuses rather than commit a task list that depends on whether the runner
    # happened to have it. Every job that builds the crate may generate, so every one has it.
    - uses: taiki-e/install-action@v2
      with:
        tool: just
