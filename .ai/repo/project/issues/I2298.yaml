id: I2298
milestone: test-evidence
title: "A pull request stacked on one that landed merges on the verdict its head already has"
slug: the-refresh-pipeline-is-a-train
priority: p1
profile: implementation
parallel_safe: true
objective: "Give the integration queue a typed relation for a head that lacks master's commits and whose merge writes its own tree, so that the links of a stacked train land one after another in a single run of the required check, and record the train as a decision."
why: "The refresh pipeline is one deep by design (docs/INTEGRATION.md, 'One merge at a time'): throughput is one pull request per run of the required check. Measured on 2026-10-10: a pull request's validate run is 398 job-minutes and 85 to 100 minutes of wall clock, set by the slowest suite shard; this checkout's trail holds 15 verified merges in four days against 52 open pull requests, 23 of them `needs_refresh`. The owner approved a stacked train on 2026-10-10 and one session runs it by hand: each head is brought up to date on the prepared head of the one before. When the lower one lands, the upper head does not contain master's merge commit, so the queue calls it `behind` and wants a refresh: a merge of master that changes no file, a new head, and a second 398 job-minute run for a tree the first run already judged. The executor's only way around it was to ask the owner before passing the freshness gate by hand."
current_state: "RelationToMaster has `up_to_date` (the head contains master) and `behind` (it does not, and the merge is clean). The freshness gate passes only `up_to_date`. A head stacked on a landed pull request is `behind`, whatever its merge would write. The relation cache keeps an entry forever under its pair of commit ids, with no record of which vocabulary decided it."
desired_state: "A head whose clean merge into master writes the head's own tree, and which lacks only merge commits of master, is `carries_master`. The freshness gate passes it, a ready one says `carries_master`, `prs repair` has nothing to repair on it, and the executor merges it with no refresh between. One change on master the head never saw, authored or derived, or one commit of master's own that is not a merge, and it is `behind`: the changelog is composed from history. The relation cache drops relations decided under another vocabulary. ADR 0129 records the train: what a link is, what orders the links, what a red link costs, and what is left to a later issue (the executor building the train itself, to a declared depth)."
