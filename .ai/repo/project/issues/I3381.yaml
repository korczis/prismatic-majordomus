id: I3381
milestone: every-task-states-its-delivery-economics
title: "A task counts as accepted only by the written definition of an accepted outcome, with the issue's furthest delivery stage shown beside it"
slug: accepted-is-the-finish-definition
priority: p1
profile: implementation
objective: "Fill accepted from I0401's definition, called through its function and never restated; show beside it the issue's furthest delivery stage from plan.delivery (pr_open, merged, released, deployed) as a separate field."
why: "T3 of the owner's report of 2026-10-19 asks for accepted results. I0401 owns the definition, which must match what the finish contract enforces; a second definition would let the two drift. Delivery stage is shown apart because merged is not accepted."
