id: execution-telemetry
title: Execution telemetry, only from providers that expose it honestly
slug: execution-telemetry
version: "0.3"
order: 30
priority: p2
problem: "Nothing here measures what a session actually consumed. Every economic statement about AI-assisted work in this repository is currently an argument rather than a measurement."
outcome: "Execution telemetry is recorded for providers that report it truthfully, and absence is recorded as absence rather than estimated."
current_state: "Not started. docs/ECONOMICS.md states what it would take and deliberately claims nothing."
desired_state: "A completed task carries measured execution facts, or an explicit record that the provider did not supply them."
scope:
  - bin
  - lib
  - share
  - test/cases
  - docs
  - site/data/generated
non_scope:
  - Estimating a number a provider does not report
acceptance_criteria:
  - Telemetry is recorded only where the provider reports it
  - A provider that reports nothing produces an explicit absence, never a guess
  - The record is durable and readable back through the existing history surface
validation:
  - bash test/run.sh
evidence_required:
  - suite
depends_on:
  - runtime-adapters
claims:
  - telemetry
risks:
  - "A provider's self-reported usage may itself be unreliable; the record must say who reported it."
created_at: 2026-09-04
updated_at: 2026-09-04T14:05:00Z
