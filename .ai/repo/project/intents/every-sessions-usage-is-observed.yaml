id: every-sessions-usage-is-observed
title: "What every AI session consumed is observed from the provider, attributed to the work it served, and never estimated into a fact"
statement: "Token consumption, model and cost of every Claude Code, Codex and Gemini session on this repository are recorded automatically from what the provider itself reports, and recorded as not observed, with the reason, where the provider reports nothing Majordomus can receive; they are attributed to session, task, issue and intent, shown in /ui with a click-through to the reported event, and used to judge what Majordomus costs and saves, with no estimate shown as a measurement."
invariants:
  - "One provider-neutral record and one normalisation (economics::usage) serve every provider; adding one is a declaration, a mapping and fixtures"
  - "A value the provider did not report is recorded as absent with a reason, never as zero"
  - "Reported tokens, a price-list estimate and a billed amount are separate fields"
  - "No prompt, response body or transcript is stored; events are runtime state, never .ai/repo"
  - "No renderer computes accounting of its own"
non_goals:
  - "A MITM proxy, transcript parsing or patching a client"
  - "A savings figure before the publication rule of ADR 0082 is met"
milestones:
  - "every-sessions-usage-is-observed"
satisfaction:
  - id: claude-code-usage-recorded
    criterion: "A Claude Code session with collection enabled leaves usage records with model and input, output, cache-read and cache-write tokens as reported (planned proof: I3288's case replaying OTLP JSON fixtures that name their client, version and capture date, and I3289's recorded live round)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: a-silent-provider-is-absent
    criterion: "A provider that reports nothing, and an event missing a token category, yield an explicit absence with a reason, never a zero (planned proof: the absence case I3288 adds (a declared usage: none provider and an event missing a category))"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: cumulative-is-never-summed
    criterion: "Codex cumulative totals replayed from fixtures produce the same session total as the increments, and Codex usage no evidenced seam hands Majordomus reads not observed with its reason, never zero (planned proof: the economics::usage unit test and the case I3290 adds)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: gemini-usage-recorded
    criterion: "Gemini CLI usage events captured from a named, dated client version map onto the same usage record, thought tokens included (planned proof: the Gemini fixture test I3291 adds)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: usage-drills-to-its-event
    criterion: "/ui shows usage by provider, model, session, task and issue, and every figure links to its reported events and names its measurement class (planned proof: the test I3294 adds to the observatory's Token Spectrum scene)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: compaction-is-measured
    criterion: "Each compaction's context before and after is recorded from a captured provider event of a dated client version, or recorded absent where the provider reports no counts; no transcript is parsed (planned proof: the case I3296 adds once a compaction event is captured)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: over-budget-is-told
    criterion: "A task over its declared token budget is told so, naming the budget, the figure and its class, and is refused only where policy declares refuse (planned proof: the case I3295 adds)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: no-estimate-shown-as-spend-or-saving
    criterion: "majordomus economics check refuses a waste finding's counterfactual effect, or a subscription session's price-list estimate, presented as a saving or as spend, on generated and UI surfaces as well as in hand-written prose (planned proof: the case I3297 adds beside case 431, which holds the prose-only refusal today)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: savings-are-measured-by-arm
    criterion: "majordomus economics summary lists every declared treatment arm (per mechanism and per agent topology) and every hypothesis, each untested until its pairs meet ADR 0082's publication rule (planned proof: majordomus economics summary and the methodology validation I3298 adds)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
  - id: own-overhead-is-measured
    criterion: "Majordomus's own per-operation overhead in an adopting fixture repository (CLI start, warm discovery, idle server CPU and memory, incremental derive, bootstrap tokens) is measured against declared budgets, and bench --check fails when one is exceeded (planned proof: majordomus bench --check over the adoption overhead suite I3299 declares)"
    evidence: command
    ref: "majordomus intent explain every-sessions-usage-is-observed"
