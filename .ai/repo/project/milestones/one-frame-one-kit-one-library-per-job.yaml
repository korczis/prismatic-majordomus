non_scope:
  - "The design book sections, copy control and shell block of milestone one-kit-on-every-surface (I3790 to I3797), which this milestone builds on and does not redo; I4534 records each one's end, and I3793's tab half moved to I4536"
  - "Rustdoc's own pages and themes"
  - "Adopting Chart.js, or keeping Cytoscape past I4541: both are rejected by the owner's rule of 2026-11-14 (Visuals, derivation and links)"
  - "The swagger page's frame: its whole document is the Swagger UI bundle, pinned on unpkg with its SRI (apps/majordomus-cli/src/http/swagger.rs, the intent's one accepted CDN exception), so the one frame does not wrap it; I4534's route inventory lists it exempt with this reason"
  - "The handbook's frame and its visuals' wrapper: it is one HTML file published as a claude.ai Artifact with no served tree (ADR 0149), so it keeps its own single-file shell and cannot load share/design/js; its libraries are in scope (I4545), and I4534's route inventory lists it exempt with this reason"
acceptance_criteria:
  - "From I4534's gate commit on, validate.yml and the pre-push hook run majordomus design kit --check as a ratchet that fails when the finding count exceeds its committed baseline, and the ratchet case of I4534 refuses a new page without the frame mark, a component class outside the kit and a library constructed outside share/design/js beyond their baselines; after I4546, design kit --check reports zero findings for /ui, /cockpit and the site and every baseline is empty"
  - "A case renders every kit component through the Rust El kit and the Tera kit and finds one markup contract"
  - "No helper of share/design/js/core and no library integration exists twice under share/ui, share/cockpit and site, and a case fails on a planted copy"
  - "Every list screen renders the one advanced table, and every entity id and every chart and graph mark that stands for an entity on every surface is a link (case 1091, extended by I4540)"
  - "Every chart, graph and scene opens to the full viewport, closes with Escape, restores its state from its URL, or is declared static with its reason, held by I4653's probe; project.viz-ergonomics and project.everything-interlinked are class: blocking rules under .ai/repo/rules/project with their gates in verify, CI and the pre-push hook"
  - "Every page has a rel=alternate JSON link, /ui and the site serve llms.txt, and /ui SCREENS is derived from the router's route table"
  - "Every route of I4534's route inventory is visited by a ui-shard probe, and every kit component and every share/design/js module is driven by an interaction spec or a case; a case fails on one that none covers (I4546)"
  - "After the pages deploy that carries I4546, a browser probe of the published site and of the published /ui and /cockpit snapshot finds every page of the route inventory served with the frame mark and its visuals drawn, recorded in I4546's evidence with the deployed commit"
  - "I4534's evidence carries one entry per open UI pull request with covers: pr_triage_record, a result that names its end (landed, absorbed into a named slice, superseded by a named pull request, or held by the owner) and its reason, and a commit naming the master commit or refs/rescue/ ref that holds its head; and one entry per older record (I3790 to I3797, I4334, I4377, I2654, I2656, I4494, I4495) with covers: older_record_disposition"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
  - "majordomus design kit --check"
evidence_required: []
depends_on: []
risks:
  - "Flowbite JS reads data-* attributes at load: a fragment swapped in later needs its initialiser called again, or a drawer and a dropdown in it are dead"
  - "Moving the site's inline x-data to Alpine.data under the CSP build can break the 15 templates that carry it; each must be driven by the interaction probe before the slice lands"
  - "Moving the graphs from Cytoscape to ECharts graph series and D3 is a rewrite, not a deduplication (the two Cockpit Cytoscape setups are about 3 % similar, peer spike of 2026-11-17); /cockpit/trains, the busiest graph, can regress, so its interaction spec runs before and after"
  - "I4535 waits on I3794 (the probe on /ui and /cockpit), which waits on I3793; if I3793 is slow, S1 and every slice after it wait, while the gates of I4534 already stand"
