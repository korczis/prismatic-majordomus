non_scope:
  - "A second derivation of stage, presence or claims: the screen draws what the capabilities answered and computes no stage, rank or join of its own"
  - "Moving, assigning or closing work from the board; it reads"
  - "A new third-party library in the UI bundle"
depends_on: []
acceptance_criteria:
  - "Every column, card, avatar, chip and count on /ui/board is drawn from a capability answer, and a case fails if a stage, worker or pull request on the screen disagrees with plan.delivery, blackboard.snapshot or the integration queue at the same revision"
  - "Every card links to its issue, every avatar to its worker, every pull-request chip to the pull request and every train to its train, and the interaction specs click each kind"
  - "An open page follows the blackboard and the integration queue and redraws on a change without a reload; it says live, reconnecting or snapshot, and the age of each source"
  - "The screen is reachable from the /ui navigation and from the IDD workspace, works at phone width, and passes scripts/ui check and audit"
  - "The published site's UI snapshot includes /ui/board, labelled as a snapshot with its revision, carrying no private path, message body or claim scope"
validation:
