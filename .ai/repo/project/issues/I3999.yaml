parallel_safe: false
objective: "fixture_repo copies .claude/skills, which scripts/generate-site-data reads for every skill its artifacts manifest names, so the cases that build a fixture and run the generator (10, 11, 37) pass on a checkout that has the skills."
why: "On 2026-10-23 cases 10_site_data, 11_site_derivation and 37_responsibility_surface failed with sed: .claude/skills/<id>/SKILL.md: No such file or directory. The generator reads those files since ADR 0165, they are the editors projection's output and so not canonical inputs, and fixture_repo copied only what --inputs names."
current_state: "test/lib.sh fixture_repo copies the generator's inputs, the layer and the generated registry files, and not .claude/skills."
desired_state: "A fixture holds the skills directory; a new case proves every skill file the manifest names is present in it."
