  - id: obligation-closure
    claim: A task that declares obligations reaches the outcome completed only when each one has evidence recorded against it, and evidence taken over files that have since changed, or at a commit the branch has since left, no longer discharges anything
    source: docs/CLI.md
    implementation: lib/evidence.sh
    test: test/cases/103_obligations.sh
    status: guaranteed
