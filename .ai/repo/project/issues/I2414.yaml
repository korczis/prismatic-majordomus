  - "apps/majordomus-cli/src/integration/exclusive.rs"
  - "apps/majordomus-cli/tests/mesh_cooperation.rs"
  - "apps/majordomus-cli/tests/integration_across_machines.rs"
  - "apps/majordomus-cli/tests/reasoning_mesh.rs"
  - "scripts/lib/advisors/mesh-review.mjs"
  - "scripts/lib/advisors/contract.test.mjs"
  - "docs/claims/mesh-liveness-expiry.md"
  - "docs/claims/mesh-three-runtime-convergence.md"
  - "docs/MESH.md"
acceptance_criteria:
  - "mesh.state with no input answers under 16 kB on a journal of 20 000 events"
  - "Each filter returns exactly the matching items, proved on a fixture state"
  - "The full answer is still available with an explicit input"
validation:
