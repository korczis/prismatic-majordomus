id: I4177
milestone: recovery-from-injected-faults-is-proven
title: "An outcome the system cannot confirm after a failure is recorded as unknown-outcome and reconciled against remote evidence before any retry of a non-idempotent step"
slug: an-unconfirmed-outcome-is-unknown
priority: p2
profile: implementation
parallel_safe: true
objective: "The execution engine (apps/majordomus-cli/src/execution) gains an unknown-outcome state for a step whose result could not be confirmed after a failure, and a retry of a non-idempotent step such as a merge first reads the forge (apps/majordomus-cli/src/integration) and makes no second effect when the first landed."
why: "The ask is in campaigns/majordomus-mission-control-pack-2026-10-22 ( on branch chore/the-packs-of-10-22-and-10-23-are-recorded, not yet on master), which the owner handed over; no plan record covered it when the packs were audited on 2026-10-23. The owner ordered on 2026-10-23 that every unfinished pack is part of the mesh's zero goal."
current_state: "Measured on master 575d39f8d24: I3390 to I3394 inject faults; the execution state model in apps/majordomus-cli/src/execution/model.rs was read for the states it names, and the audit finds none called unknown-outcome."
desired_state: "After a crash mid-effect the system says it does not know, checks, and then acts."
scope:
  - ".ai/repo/project/issues/I4177.yaml"
  - "apps/majordomus-cli/src/execution"
  - "apps/majordomus-cli/src/integration"
  - "test/cases/4177_an_unconfirmed_outcome_is_unknown.sh"
  - "docs"
non_scope:
