id: I4343
milestone: development-runtime
title: "A build host's disk guard is observed live every five minutes, and the observation fails while it is not"
slug: a-build-hosts-disk-guard-is-observed-live
priority: p0
profile: implementation
parallel_safe: true
objective: "On a node the policy declares a build host, `mesh doctor --build-host` observes disk-guard.timer active, the ballast present, /var/lib/majordomus/disk-guard.json younger than 15 minutes and every declared drop-in present, and each missing item is a failure with a non-zero exit naming the item and `mesh build-cache provision`. Nobody has to ask: the provision installs build-host-observe.service with build-host-observe.timer, which runs that observation every five minutes, writes its verdict and failing items to /var/lib/majordomus/build-host.json and publishes it as a mesh event build_host_observed, which `mesh events` and `monitor` show. The build host layer is applied on lundra and the evidence is recorded on this issue. Lundra's baseline tenants (the korczis home, docker, minio and swap) are named in the policy, each with a bound the observation reads."
why: "Incident 1 of 2026-10-28: at about 12:00Z, during run 40680986818, lundra's disk filled and its runners lundra-1..3 went offline, as on 10-18 and 10-22. I2674's build host layer (disk-guard, ballast) is on master and was never applied on lundra, and no check failed while it was missing; nothing runs `mesh doctor` on its own (no caller in .github, the assets or share), so a check that only answers when asked would repeat the incident. The runner listener then crash-looped inside units systemd still showed active. Lundra's baseline holds the korczis home 159G, docker 53G, minio 29G and swap 17G, none of them bounded. This issue does not wait for I2674: the disk-guard code is on master, and I2674's open criteria (an unauthenticated write refused, no credential anywhere, a provider not tied to MinIO) belong to the S3 cache provider and stay there; its criterion that the data path cannot exhaust the root filesystem is shown here, on lundra. The provisioning change (runner homes, runner drop-ins) is I4352 on fix/lundra-provisions-its-runners, not landed; this issue takes it into depends_on once it is on master."
current_state: "Measured at 81ef931a3e1: apps/majordomus-cli/assets/mesh-cache-provider/disk-guard line 37 hard-codes HOMES=(/home/korczis); apps/majordomus-cli/src/mesh/cache_provision.rs installs disk-guard.service and disk-guard.timer; nothing the doctor runs reads whether the timer is active, the ballast exists or the guard has written its state recently, and no unit runs the doctor on a schedule."
desired_state: "Every five minutes a build host observes its own guard and publishes the verdict; the observation exits non-zero while disk-guard.timer is inactive, the ballast is missing, disk-guard.json is older than 15 minutes or a declared drop-in is missing, naming each; on lundra it exits 0 after the apply and its events are visible on the mesh. Enforced by the observation timer on the host, the doctor check's non-zero exit and cache_provision unit tests; I4359 refuses CI on a host whose latest observation is missing or failing."
