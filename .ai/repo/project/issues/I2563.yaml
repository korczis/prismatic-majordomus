  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib ui::"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test ui_surface"
  - "MJ_TEST_JOBS=2 bash test/run.sh 1096_no_screen_waits_for_a_source"
evidence_required:
  - "screen_etag_unit_tests"
  - "screen_304_renders_nothing_test"
