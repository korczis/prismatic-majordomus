acceptance_criteria:
  - "The conservation reading names every violation with its records, and a clean run reads zero violations"
  - "Each registered fault kind has its registered number of trials committed, each with its conservation reading"
  - "The mesh lab's required scenario set includes the work-level scenarios, and case 414 holds it"
validation:
