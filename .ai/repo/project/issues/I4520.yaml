id: I4520
milestone: ci-critical-path
title: "finish runs its verify command in the caller's environment, not with the launcher's own MJ_* exported"
slug: finish-verify-does-not-inherit-the-launcher-env
priority: p1
profile: implementation
parallel_safe: true
objective: "`majordomus finish --verify-command <cmd>` runs <cmd> with the MJ_* environment of the process that called majordomus, not the one majordomus built for itself: bin/majordomus records the MJ_* variables it inherited before it exports any, and lib/finish.sh unsets every MJ_* variable and MAJORDOMUS_LAUNCHER inside the verify subshell, then re-exports the inherited ones (MJ_FINISH_OUTCOME stays unset, as before). A verify command then judges the tree as a worker running it by hand, the pre-push hook and CI do."
why: "Seen on PR #2689 and PR #2683 on 2026-10-30: `majordomus finish --verify-command \"scripts/ci/run-plan --before-push\"` failed cases 3021, 3029, 276, 850, 861, 911, 912 and 925-939, all of which pass standalone and in the pre-push hook. The launcher exports some forty variables of its own (MJ_ROOT, MJ_STATE_DIR, MJ_AI_DIR, MJ_AI_LOCAL_DIR, MJ_BIN_DIR, MJ_LIB_DIR, MJ_SELF, MJ_JSON, MJ_SCOPE_FILE, MJ_DOCTRINE_CMD and the other path and exit-code variables), and the installed launcher adds MAJORDOMUS_LAUNCHER; scripts that take MJ_ROOT=<dir> as an override (scripts/ci/release-check, scripts/case-numbers and others) then examined the finishing checkout instead of their fixture, and a checkout's bin/majordomus started under them named the installed launcher as itself. A verification that fails for an environment no worker has is evidence about nothing, and a completed finish that cannot be claimed on correct work is worked around rather than trusted."
current_state: "Measured at 51b38035a71: lib/finish.sh mj_validate_verification runs `( cd \"$MJ_ROOT\" && unset MJ_FINISH_OUTCOME && sh -c \"$MJ_FINISH_VERIFY\" )`, so every variable the launcher exported reaches the verify command; exporting MJ_ROOT, MJ_STATE_DIR and MJ_AI_DIR alone reproduces case 3029's failure standalone (`release-check: apps/majordomus-cli/src/release/version.rs is missing`). lib/usecase.sh mj_uc_run_one already unsets the variables of its caller that would leak into a scenario (MJ_TIMING, MJ_SESSION_KEY)."
desired_state: "A verify command sees no MJ_* variable and no MAJORDOMUS_LAUNCHER that its caller did not have, and keeps every MJ_* variable its caller did have, with the caller's value. Enforced by case 4520."
scope:
  - ".ai/repo/project/issues/I4520.yaml"
  - "bin/majordomus"
  - "lib/finish.sh"
  - "test/cases/4520_a_verify_command_runs_in_the_callers_environment.sh"
non_scope:
