id: M002
title: A durable record names the worker that wrote it
slug: record-attribution
order: 2
priority: p1
problem: "Every durable record is attributed to the task that is active in the checkout, because decision, checkpoint and question all read .majordomus/state/current.yaml to find out whose work they belong to. Several workers share one checkout, so the record names whoever started a task there rather than whoever ran the command. In one evening three sessions wrote under another session's active task, and one decision had to be dropped by hand after the fact because the premise it recorded belonged to somebody else. Attribution is the one property of a record that cannot be reconstructed later: the conversation that would settle it is gone."
outcome: "A durable record either names the worker that produced it or is refused, and a record written from one session can never arrive attributed to another session's task."
current_state: "Delivered. I0701 reproduced the misattribution (case 3049). I0702 chose ADR 0164: a durable record names the session that ran the command and relates the active task unless a different, still-open episode opened it; nothing is refused for want of an identity. I0703 implemented it through train 5 (mj_record_attribution in lib/common.sh, used by decision, question, checkpoint, check --checkpoint, handover and knowledge observe) and recorded it done with suite evidence. I0704 publishes the claim record-attribution, whose detail page says the identity is supplied by the session and never verified. The outcome's 'or is refused' was not chosen: ADR 0164 writes an unattributed record instead of refusing, because refusing loses the record somebody was trying to make."
desired_state: "Attribution is verifiable from the record alone. Where the tool cannot establish who wrote something, it says so and refuses rather than guessing from what happens to be active."
scope:
  - lib
  - share
  - test/cases
  - docs
non_scope:
  - A registry of named workers, personas or agents
  - Any identity the repository has to maintain, or that outlives the session that used it
  - Locking a checkout to one worker
acceptance_criteria:
  - A record written while another worker's task is active is attributed correctly or refused by name
  - The attribution can be checked from the record alone, with no conversation history
  - No new record type and no registry of workers is introduced
  - A behavioural case reproduces two workers writing in one checkout
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
depends_on: []
claims:
  - record-attribution
risks:
  - "The obvious fix is an identity the tool maintains, which is a registry of named workers by another name and is refused everywhere else in this repository. Whatever is chosen has to be supplied by the session and stored only inside the record it explains."
  - "Refusing to write an unattributable record can lose a decision somebody was trying to make. The refusal has to say what to run instead, in the same breath."
