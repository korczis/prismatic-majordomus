id: an-authorised-node-connects-from-anywhere
title: "An authorised node reaches another across LAN, tailnet or NAT, and says how"
slug: an-authorised-node-connects-from-anywhere
order: 176
priority: p1
problem: "Two trusted Majordomus nodes cooperate whether they share a LAN, a tailnet or neither, choose a working path by themselves, fall back to a relay when no direct path exists, and every surface shows the path in use and why it was chosen. Proposed in ADR 0202 (The mesh routes work to an identity, never an address, and selects among proven transports instead of implementing NAT traversal); ADR 0203 (GitHub Pages is a signed bootstrap anchor for the mesh, never its signalling channel) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c237#5, chatgpt-majordomus:c279#7, chatgpt-majordomus:c282#2."
outcome: "Two trusted Majordomus nodes cooperate whether they share a LAN, a tailnet or neither, choose a working path by themselves, fall back to a relay when no direct path exists, and every surface shows the path in use and why it was chosen."
current_state: "Its issues extend existing milestones; see each issue's why."
desired_state: "Every criterion of the intent is carried by an issue here and proven by its test."
acceptance_criteria:
  - "mesh peers names, per link, the candidates tried, the one chosen and why"
  - "Two nodes with no direct path cooperate through a trusted hub relaying authenticated frames, in the mesh lab"
  - "A node with no peers finds the mesh from the signed Pages manifest and refuses a stale, rolled-back or unsigned one"
validation:
