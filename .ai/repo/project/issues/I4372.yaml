  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 3970_a_pull_request_carries_its_metadata 894_github_sync_applies_only_the_trunk 45_github_projection"
  - "bin/majordomus plan validate"
