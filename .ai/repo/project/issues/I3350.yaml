  - "scripts/ci/homepage-check --only promises over the built site reports OK"
  - "Adding a line using 'faster' to a scratch copy of site/data/marketing.toml makes homepage-check --only promises exit 10 naming the word and that no claim permits it"
  - "bash test/run.sh 333_homepage_narrative stays green"
validation:
