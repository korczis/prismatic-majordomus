id: I3285
milestone: a-workspace-reaches-the-repository
title: "A vendor workspace reads the plan through the authenticated remote MCP surface, and a tunnel never makes it look local"
slug: a-workspace-reads-the-plan
priority: p3
profile: implementation
objective: "Let a vendor's remote MCP connector — a ChatGPT custom connector, or a claude.ai custom connector, which the Claude in Chrome side panel and claude.ai chat call — call the read capabilities (plan, intents, evidence) over the existing MCP-over-HTTP projection, through a listener of its own whose callers authenticate by the mechanism an ADR amending ADR 0126 defines (ADR 0126 admits reads beyond loopback without authentication), and refuse any deployment where a tunnel terminating on loopback would make vendor requests pass as local."
why: "ADR 0126 judges a caller by its address. The router already refuses a loopback request whose Host is neither an address nor localhost (rebound()), so only a tunnel that rewrites Host to localhost passes as local; that hole affects every mutation and belongs to runtime-trust. Read-only is what ADR 0126 already allows remotely and what every ChatGPT plan can call. Critique 2026-10-18: ADR 0126 admits every read beyond loopback without authentication, so authenticating a vendor reader is a new mechanism that needs its own ADR; this issue serves the intent's a-vendor-reads-and-never-writes, not a-reference-validates-everywhere, which it does nothing for. The Claude in Chrome side panel is the same case: it is an agent on claude.ai and reaches only a connector Anthropic's cloud can call over the public internet (support.claude.com/en/articles/11175166), so it cannot reach the loopback server either (docs/MCP.md#claude-in-the-browser, 2026-10-21). Sources: chatgpt-majordomus:c239#7, chatgpt-majordomus:c267#2, chatgpt-majordomus:c065#4."
current_state: "MCP over HTTP exists on the shared server; I2123 (runtime-trust) covers remote reads; nothing declares a vendor caller."
desired_state: "A declared remote listener for vendor callers, separate from the loopback one, serving reads only, with tool schemas derived from the registry."
scope:
  - "apps/majordomus-cli/src/http"
  - "apps/majordomus-cli/src/mcp"
  - "docs/MCP.md"
  - ".ai/repo/adrs/0126-a-caller-beyond-loopback-reads-and-changes-nothing-it-cannot-authenticate.md"
non_scope:
  - "Mutation from a vendor (I3286)"
  - "Hosting a public endpoint"
  - "Serving workspace message text to a vendor caller"
depends_on:
  - "I2123"
serves:
  - "what-a-workspace-decides-reaches-the-repository-with-its-source#a-vendor-reads-and-never-writes"
acceptance_criteria:
  - "A request through the vendor listener runs a read capability and is refused a repository_mutation one"
  - "A request arriving on the loopback listener with a forwarding header is refused remote-only reads' privileges, not granted loopback ones"
  - "No credential appears in output or logs"
  - "An ADR amending ADR 0126 defines how a vendor reader authenticates (OAuth for a ChatGPT or a claude.ai connector) before the vendor listener admits any caller"
  - "A successful local loopback MCP read or native subscription account probe is not accepted as evidence that a remote vendor connector authenticates or can reach the listener"
  - "The vendor listener never exposes native-client subscription credentials, local workspace message bodies or a credential-bearing provider proxy"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test remote_callers"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test http_host"
evidence_required:
  - "case_a_vendor_caller_reads_only"
created_at: 2026-10-18
updated_at: 2026-10-22
