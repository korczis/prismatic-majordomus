acceptance_criteria:
  - "Unit test of worktree::liveness: fixtures for each signal (an open task, a claim, HEAD written 10 minutes ago, an offload pid file, a running runner job, a process whose CARGO_TARGET_DIR points inside) each yield keep with that reason, and a fixture with no signal yields reclaim"
  - "Case 611: reap-orphans --targets keeps every target the capability answers keep for, with its reason; a declared mesh whose claims cannot be read removes nothing and exits non-zero; a target with no signal at all is reclaimed"
  - "Case 276: a hard-tier directory idle for 30 minutes whose HEAD changed within the window is kept, and disk-guard run with no executable at the path its service names removes no build directory"
  - "`majordomus shell check` passes and reports no new shell unit"
  - "reclaim-only-what-you-own v2 is class blocking, its tests name cases 611 and 276, and `majordomus rule proves` resolves it"
