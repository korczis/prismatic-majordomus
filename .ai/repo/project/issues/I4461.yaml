acceptance_criteria:
  - "Case 4461: a handover written over a dirty tree, then a tracked file edited further with no commit; `majordomus handover --resolve` under a new MJ_SESSION_KEY exits 0, prints `Git state: exact` and a `Working tree: changed since the handover` line naming the edited path"
  - "Case 4461: with nothing changed after the handover, the same command prints `Working tree: unchanged since the handover`"
  - "Case 4461: a handover record written without a tree line (the fixture strips it) resolves with `Working tree: unknown` and never `unchanged`"
  - "Case 4461: the session briefing printed at episode start carries the same Working tree word as --resolve for the same record"
  - "Case 05 passes unchanged"
  - "Before the change, case 4461 fails at its first assertion"
