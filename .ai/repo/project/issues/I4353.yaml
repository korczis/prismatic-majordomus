id: I4353
milestone: ci-critical-path
title: "A train's top goes first on the runner pool, and resume never re-runs a held member"
slug: a-train-top-goes-first-on-the-pool
priority: p1
profile: implementation
parallel_safe: true
objective: "scripts/ci/release-path gains a landing path beside the release path: while an integration/* run is queued or running, other pull requests' runs yield; `preempt` cancels queued pull_request runs that are not a top, never a push, schedule or dispatch run; `resume` waits until no top is in flight and skips a pull request that carries any hold label of LABEL_POLICY, read live from the forge."
why: "Incident 3 of 2026-10-28: trains 10a (#2630) and 10b (#2631) waited 73 and 108 minutes; behind the superseded runs (I4347, I3903), pool contention from held and resumed pull request runs kept the tops waiting. The review found that a top preempting other pull request runs is the only remedy for that first wave; I4338 (fix/a-held-member-runs-no-validate, not pushed) yields a held member's own run, a mitigation that leaves every unheld run ahead of the top."
current_state: "Measured at 81ef931a3e1: validate.yml runs `scripts/ci/release-path yield` (line 155), which yields only to the release path; apps/majordomus-cli/src/integration/classify.rs holds LABEL_POLICY (line 112), and release-path reads no hold label."
desired_state: "A queued top runs before any other pull request's run; preempt touches only pull_request runs; resume does nothing while a top is in flight and never re-runs a held pull request. Enforced by case 3027 with a fake forge and a classify.rs parity test."
scope:
  - ".ai/repo/project/issues/I4353.yaml"
  - "scripts/ci/release-path"
  - ".ai/repo/ci/release-path.yaml"
  - ".github/workflows/validate.yml"
  - ".github/workflows/release-path.yml"
  - "apps/majordomus-cli/src/integration/classify.rs"
  - "test/cases/3027_the_release_path_goes_first.sh"
  - "docs/CI.md"
non_scope:
  - "The hold label's own yield (I4338)"
  - "Cancelling superseded runs (I3903)"
acceptance_criteria:
  - "Case 3027: a fix/y run yields to a queued integration/* run, and the top's run is not cancelled"
  - "Case 3027: preempt cancels only queued pull_request runs that are not a top, never a push, schedule or dispatch run"
  - "Case 3027: resume with a top in flight re-runs nothing"
  - "Case 3027: a run of a pull request labelled hold is not re-run, and its ci:yielded label is removed"
  - "A classify.rs unit test keeps release-path's hold set equal to LABEL_POLICY's hold labels"
validation:
  - "bash test/run.sh 3027_the_release_path_goes_first"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib integration::classify"
  - "bin/majordomus plan validate"
evidence_required:
  - "test"
  - "rust"
depends_on:
  - "I4347"
serves: []
