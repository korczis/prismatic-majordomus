id: I4007
milestone: a-session-proceeds-through-the-mesh
title: "An idle serve exits by itself after a bound"
slug: an-idle-serve-exits-by-itself
priority: p1
profile: implementation
parallel_safe: true
serves:
  - a-session-proceeds-through-the-mesh#heavy-work-shares-the-machine
objective: "An idle serve that holds no lease, has no peers and no executions exits by itself after a bound read from policy."
why: "Idle servers accumulate across worktrees and keep their claims live; each costs memory and a port on a shared machine."
current_state: "Not built: this issue is planned by the milestone a-session-proceeds-through-the-mesh and nothing of it exists."
desired_state: "The acceptance criteria below hold and case 4007 proves them."
scope:
  - "apps/majordomus-cli/src/commands/serve.rs"
  - "apps/majordomus-cli/src/shared.rs"
  - "apps/majordomus-cli/src/lease.rs"
  - "docs/MCP.md"
  - "test/cases/4007_an_idle_serve_exits_by_itself.sh"
  - ".ai/repo/project/issues/I4007.yaml"
acceptance_criteria:
  - "A serve with a lease, a peer or a running execution never exits"
  - "An idle one exits after the bound and says why on stderr"
  - "The bound is policy data"
  - "An attached MCP client, an open event stream or a running execution keeps it alive, while the machine's own probes and mesh link traffic do not; the next client re-ensures it"
validation:
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 4007_an_idle_serve_exits_by_itself"
evidence_required:
  - "case_4007_an_idle_serve_exits_by_itself"
