acceptance_criteria:
  - "check_of records startedAt as started_at, and an observation without it still reads"
  - "integration.timings answers each check's measured runs, failures, median, 90th percentile and longest seconds, and each open head's wall time and slowest check, from the recorded observation alone"
  - "a run without a start or an end, and a status context, is counted as unmeasured and never measured as zero"
  - "the CI/CD screen draws the timings, and a head leads to its pull request; without an observation it says nothing is measured"
validation:
