id: I0206
milestone: runtime-adapters
title: Publish the runtime-adapters claim with the test that proves it and the limits it does not cover
slug: publish-runtime-adapters-claim
priority: p2
profile: implementation
parallel_safe: false
objective: "Move the runtime-adapters row from planned to guaranteed, citing the adapter and the case, and state on its detail page which axes remain advisory and why, so that the guarantee is narrower than the milestone title rather than as wide as it."
why: "A claim promoted to the width of its milestone title overstates what one adapter does. The matrix is where the difference between what is enforced and what is described is either kept honest or lost."
current_state: "The claim is planned, with no implementation and no test, and its note describes the rolled-back attempt."
desired_state: "The claim is guaranteed for the limits that are actually applied, names the file and the case, and says plainly which axes are still advice."
scope:
  - docs
  - site/data/generated
non_scope:
  - Any behaviour change
  - Widening the claim beyond the limits an adapter applies
depends_on:
  - I0205
acceptance_criteria:
  - The claim cites an implementation path and a test path that both exist
  - The detail page names the axes that remain advisory
  - The generated site data regenerates with no stale file
validation:
  - scripts/generate-site-data --check
  - bash test/run.sh
evidence_required:
  - docs_build
risk: "This is the moment the repository starts being believed about runtime enforcement; a claim wider than the adapter is worse than no claim."
created_at: 2026-09-04
updated_at: 2026-09-04
