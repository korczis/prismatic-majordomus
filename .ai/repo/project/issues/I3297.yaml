id: I3297
milestone: every-sessions-usage-is-observed
title: "A waste finding names its evidence and confidence and is never presented as a saving"
slug: a-waste-finding-names-its-evidence
priority: p3
profile: implementation
objective: "Derive findings (low cache-read share, oversized tool results, repeated tool calls, an expensive model on routine work, subagent cost without an accepted outcome) from attributed usage, each with the events behind it, a confidence and an estimated effect labelled counterfactual."
why: "Recommendations without evidence are opinions with a command around them (routing-recommendations problem statement); ECONOMICS already reserves the counterfactual class for exactly this. The prose-only refusal already holds on master (case 431); this plan's proof is the refusal across generated and UI surfaces. It extends milestone routing-recommendations. Proposed in ADR 0213 (Usage is observed through each provider's official telemetry into one provider-neutral record, and reported, estimated and billed amounts are never merged) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c236#4, chatgpt-majordomus:c236#7."
current_state: "Nothing derives findings."
desired_state: "economics findings lists them; economics check refuses prose that turns one into a saving."
scope:
  - "apps/majordomus-cli/src/economics"
  - "docs/ECONOMICS.md"
  - "apps/majordomus-cli/src/economics/claims.rs"
  - "share/commands.yaml"
  - "test/cases"
depends_on:
  - "I3293"
  - "I0501"
serves:
  - "every-sessions-usage-is-observed#no-estimate-shown-as-spend-or-saving"
acceptance_criteria:
  - "Each finding cites its events and threshold"
  - "An estimated effect is classed counterfactual everywhere it is shown"
  - "economics check refuses a waste finding's counterfactual effect, or a subscription session's price-list estimate, when either is presented as a saving or as spend, reading generated and UI surfaces as well as prose (case)"
  - "The economics findings capability is declared canonically and its share/commands.yaml and MCP/HTTP/OpenAPI projections are generated (majordomus generate --check)"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib economics::claims"
  - "bash test/run.sh 431_economics_claims_gated"
  - "majordomus economics check"
evidence_required:
  - "test_waste_findings_cite_evidence"
created_at: 2026-10-18
updated_at: 2026-10-18
