acceptance_criteria:
  - "Case 4598, with a fixture service (a script that appends a line every second and exits 0 on SIGINT) and a free-space reading injected through a test seam: below floor_mib the service receives SIGINT and exits, `service status --format json` reports stopped with reason floor and the free MiB read, and `executions events` of the service's execution lists a stop event carrying the same figure. The environment file's values appear in neither"
  - "Case 4598: a service that ignores SIGINT is killed after grace_seconds, and its exit is recorded as signalled"
  - "Case 4598: between floor_mib and resume_mib the service stays stopped. After free space stays above resume_mib for resume_after_seconds it is started again, status reports resumed with both times, and `brief` names the service and its state"
  - "Case 4598: `service start` below resume_mib refuses with exit 15 and names the free MiB and the mark"
  - "Case 4598: a decoy process with the same command line, started outside the server, is never signalled"
  - "Case 4598: after the server is restarted while the service runs, status reports the same pid and the server does not start a second copy"
  - "Case 4598: a policy whose resume_mib is not above floor_mib, or whose grace_seconds or resume_after_seconds is missing, is refused by doctor and the schema"
  - "Before the change, case 4598 fails at its first assertion"
validation:
