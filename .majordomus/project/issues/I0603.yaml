id: I0603
milestone: shared-policy
title: Report drift from the shared policy in one command
slug: report-policy-drift
priority: p3
profile: implementation
parallel_safe: false
objective: "Report, in one command, every way a repository's effective policy differs from the shared source it names, separating declared overrides from undeclared divergence."
why: "The point of naming a shared source is being able to see where it is not being followed. Without one command that answers that, shared policy is just a longer path to the same drift."
current_state: "A shared source is resolved and overrides are declared. Nothing summarises the difference."
desired_state: "One command lists each difference, says whether it is a declared override or undeclared divergence, and names the reproduce command for each."
scope:
  - lib
  - bin
non_scope:
  - Changing anybody's policy; the command reports and never writes
depends_on:
  - I0602
acceptance_criteria:
  - Every difference is listed with the key, both values, and whether it is declared
  - Undeclared divergence exits non-zero and declared overrides do not
  - Every finding carries a reproduce command
  - The command writes nothing
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "A drift report that is noisy is a drift report nobody runs; declared overrides have to be quiet by default."
created_at: 2026-09-04
updated_at: 2026-09-04
