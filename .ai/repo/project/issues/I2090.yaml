  - "bin/majordomus plan validate"
evidence_required:
  - "growth_is_reviewed"
scope:
  - "apps/majordomus-cli/src/intent.rs"
  - "apps/majordomus-cli/src/intent_plan.rs"
  - "apps/majordomus-cli/src/capability"
  - "share/providers"
  - "test/cases"
acceptance_criteria:
  - "A capability module added outside every intent scope is reported in a fixture, and refused under the required policy"
