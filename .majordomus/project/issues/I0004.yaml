id: I0004
milestone: M000
title: Implement DAG validation and execution waves
slug: dag-and-waves
priority: p0
profile: deep-work
parallel_safe: false
objective: "Validate the dependency graph and derive topological execution waves, refusing every malformed graph with a named finding rather than a guess."
why: "A dependency list without validation is a suggestion. A cycle that nobody detects becomes a set of issues that can never be ready and nobody can explain why."
current_state: "No graph existed."
desired_state: "Unknown, self and duplicate dependencies, duplicate ids and cycles are each rejected by name, and waves are computed by Kahn layering."
scope:
  - lib/project.awk
non_scope:
  - Estimation or critical-path scheduling
depends_on:
  - I0003
acceptance_criteria:
  - A cycle is detected and the issues inside it are named
  - A self-dependency and an unknown dependency are each a distinct finding
  - Waves place an issue one layer past its deepest dependency
  - Two issues sharing a wave and a scope path are reported as serialised
validation:
  - bash test/run.sh 30_dag_waves
evidence_required:
  - dag_test
risk: Low
