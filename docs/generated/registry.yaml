                description: "Declarative content the repository holds: read as it is, never executed."
            description: "What a capability is. Three kinds exist because three semantics exist: something that\nis executed and changes nothing, something that is executed and changes this process's\nown memory, and something that is read. Nothing of any kind writes to the repository."
          CapabilityProvenance:
