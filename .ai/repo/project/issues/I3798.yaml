  - "apps/majordomus-cli/src/mesh/journal.rs"
  - "apps/majordomus-cli/src/mesh/cooperation.rs"
  - "apps/majordomus-cli/tests/mesh_cooperation.rs"
  - "docs/MESH.md"
non_scope:
  - "Fencing an exclusive claim against a returning holder, which is I3174"
  - "The bridge's replay of board announcements after a re-attach, which is I3609"
depends_on: [I3810]
acceptance_criteria:
  - "A claim survives a lease takeover once its session re-attaches to the successor, and a later claim from another runtime conflicts with it"
  - "A claim expires at busy grace + one expiry when its session never re-attaches"
  - "An instance of a different runtime does not keep the claim alive"
  - "Compaction keeps a dead instance's stream while a claim on it is carried by a live instance of the same runtime, and drops it once that claim ends"
validation:
