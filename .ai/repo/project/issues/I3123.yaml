id: I3123
milestone: a-claim-stands-only-on-its-evidence
title: "finish refuses a verify command the profile does not admit for the change, and keeps its output"
slug: verify-command-is-admitted-by-policy
priority: p2
profile: implementation
objective: "Let a profile or policy declare the verify commands (or command prefixes) a completed outcome may cite per scope class. finish refuses a command outside that set, beyond the no-op and print refusal already in mj_verify_is_vacuous, and records the tail of its output with the exit code."
why: "The 2026-10-08 audit (c193#1) found vacuous verify commands (ls, true, test 1) accepted. Measured on master 707a04c: lib/finish.sh:161 refuses true, :, exit 0, echo and printf, but not ls or test 1. No policy pins what verifies a change. It extends milestone architecture-is-enforced. Sources: chatgpt-majordomus:c193#1."
current_state: "mj_verify_is_vacuous in lib/finish.sh; profile key verification.verify_command_required."
desired_state: "A profile key verification.verify_commands; a refusal names the admitted set."
scope:
  - "lib/finish.sh"
  - ".ai/repo/profiles"
  - "share/schemas"
  - "share/allow/profile.txt"
non_scope:
  - "Judging whether a real command is the right one for the change"
serves:
  - "a-claim-stands-only-on-its-evidence#blocking-rule-shows-refusal"
acceptance_criteria:
  - "A completed finish citing ls or test 1 under a profile with an admitted set is refused"
  - "An admitted command passes and its output tail is in the ledger"
  - "doctor admits the new profile key verification.verify_commands through share/allow/profile.txt"
validation:
  - "MJ_TEST_JOBS=4 bash test/run.sh 06_finish"
