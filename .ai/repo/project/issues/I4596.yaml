# NEEDS THE OWNER'S DECISION: options (a), (b) and (c) below; nothing here is chosen, and no
# acceptance criterion binds until the decision is recorded and names one of them.
# Related: I3763 (READY, same milestone) plans superseded_by and a cancelled_dependency warning
# and puts "a cancelled dependency without a replacement is satisfied" in its non_scope; this
# record does not edit it, and the decision says whether I3763 proceeds, is amended or is superseded.
# case number 4596 stands for the case allocated with the id
id: I4596
milestone: truthful-plan-surfaces
title: "The owner decides what a cancelled dependency means, so that cancelling an issue no longer strands its dependents in silence"
slug: the-owner-decides-what-a-cancelled-dependency-means
priority: p1
profile: implementation
parallel_safe: false
serves: []
objective: "Record the owner's decision on what an issue's dependency on a cancelled issue means, choosing one of three options, and then make both plan engines and plan validate hold that one choice: (a) a cancelled dependency counts as satisfied; (b) it stays unsatisfied, and plan validate warns, naming each open dependent of a cancelled issue and suggesting it drop the dependency; (c) cancelling an issue requires a recorded decision about each of its open dependents. Needs the owner's decision: this record presents the options and their acceptance criteria and pre-decides none of them."
why: "In Majordomus 1.0.1 an issue marked cancelled: true counts as an unsatisfied dependency, so every issue that lists it in depends_on is BLOCKED for ever: plan ready and plan next never offer it, and plan validate reports nothing about it. A downstream repository hit exactly this: two issues were cancelled by a decision record, and its launch issue, which depended on both, stayed BLOCKED and was never offered by plan next until someone noticed and removed the two ids from its depends_on by hand. Nothing in the tool pointed at the cause; the dependent looked like ordinary waiting work. This repository carries the same defect in its own plan: at 3fcaafac355 five open issues are BLOCKED on cancelled issues, four of them on nothing else (I0916 on I0914; I0925 on I0915; I0926 on I0913 and I0924; I2975 on I2974; and I0932, whose blocked_by holds the cancelled I0929 and I0931 beside six open issues), and plan validate reports 0 failures and no finding that names a cancelled dependency. The engines also disagree with themselves: the walk that counts what taking an issue unblocks already treats CANCELLED as finished, while the status derivation treats it as never satisfied."
current_state: "Measured at origin/master 3fcaafac355 with majordomus 1.0.1. apps/majordomus-cli/src/plan.rs:794 makes an issue done only when it is not cancelled (done[n] = !r.cancelled && ...); plan.rs:949-956 builds blocked_by from every declared dependency whose done is false, so a cancelled dependency is always listed; plan.rs:957-966 derives CANCELLED for the cancelled issue itself and BLOCKED for any dependent whose blocked_by is non-empty (:965-966). lib/project.awk:118 is the same done rule, :179 the same blocked_by filter (!done[d]) and :185 the same BLOCKED branch; test/cases/99_plan_capabilities.sh holds the two engines to byte equality. By contrast plan.rs:582 (Plan::unblocks) and lib/project.sh:293 (unblocked) skip a CANCELLED dependent as finished. docs/PLANNING.md:54 documents BLOCKED as 'a dependency is not DONE'. Neither engine emits any finding about a dependency on a cancelled issue (the findings of plan.rs:805-971 and lib/project.awk:121-186 are self_dependency, unknown_dependency, duplicate_dependency, no_milestone, unknown_milestone, no_acceptance, no_validation, no_evidence_required, stamp_without_event, evidence_missing, cycle and premature_execution). Cancellation is authored by writing cancelled: true into the record; no plan command performs it, so nothing asks about the dependents at that moment."
desired_state: "The owner's choice among (a), (b) and (c) is recorded as a decision with its question and answer, and docs/PLANNING.md states the chosen meaning of a cancelled dependency. Both engines implement exactly the chosen option, identically, and case 99 compares their statuses, blocked_by and findings over a fixture holding an open issue that depends on a cancelled one. Whichever option is chosen, a dependent of a cancelled issue is never again BLOCKED without either a finding that names the cause or a rule that makes it READY. I3763's objective and non_scope agree with the decision (amended or superseded in its own change)."
scope:
  - ".ai/repo/project/issues/I4596.yaml"
  - "apps/majordomus-cli/src/plan.rs"
  - "lib/project.awk"
  - "test/cases/99_plan_capabilities.sh"
  - "test/cases/4596_a_cancelled_dependency_has_one_meaning.sh"
  - "docs/PLANNING.md"
  - "site/content/plan/I4596.md"
non_scope:
  - "Choosing the option: that is the owner's decision, recorded before any implementation starts"
  - "Rewriting the depends_on of existing dependents of cancelled issues (I0916, I0925, I0926, I0932, I2975 here, or any adopter's): those are records, changed by their own owners once the meaning is decided"
  - "The superseded_by replacement chain of I3763, which this decision may keep, amend or supersede but does not implement"
  - "Cancelled or superseded milestones, whose gate already has its own rule"
depends_on: []
acceptance_criteria:
  - "The owner's decision is recorded as a decision record naming exactly one of (a), (b) or (c), with the question and the answer verbatim, before plan start I4596"
  - "If (a) is chosen: an open issue whose only unfinished dependency is cancelled is READY in both engines and is offered by plan ready and plan next; blocked_by never names a cancelled issue; waves are unchanged; Plan::unblocks and lib/project.sh agree with the status derivation; negative: a dependency that is neither DONE nor cancelled still blocks"
  - "If (b) is chosen: the dependent stays BLOCKED, and plan validate warns cancelled_dependency once per edge, naming the dependent and the cancelled issue and suggesting the dependency be dropped from depends_on; the warning does not fire for a dependent that is itself DONE or CANCELLED; this repository's own plan reports the five dependents listed in why"
  - "If (c) is chosen: an open issue that depends on a cancelled issue fails plan validate (exit 10) unless a decision record names that dependent and says whether it drops the dependency, is cancelled too, or keeps waiting; the failure names the cancelled issue, the dependent and the decision it lacks; a decided dependent passes"
  - "Case 4596 proves the chosen behaviour and its negative on a fixture plan, and case 99 shows both engines agree on statuses, blocked_by and findings"
  - "docs/PLANNING.md states the meaning of a dependency on a cancelled issue in the status table and the findings list"
validation:
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 4596_a_cancelled_dependency_has_one_meaning 99_plan_capabilities"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib plan::tests"
  - "bin/majordomus plan validate"
evidence_required:
  - "owner_decision_on_cancelled_dependency_recorded"
  - "cancelled_dependency_has_one_meaning_in_both_engines"
risk: "Medium. (a) silently readies work whose premise may have been cancelled with its dependency, and readies five dependents in this repository's own plan at once; (b) keeps the hand edit as the remedy and adds warnings to every adopter's validate; (c) makes cancellation a heavier act and fails validate in every repository that already holds such an edge until each is decided. Whichever is chosen changes a derived status, so every surface that reads plan.json (roadmap, plan status pages, GitHub projection) moves in the same change."
created_at: 2026-11-15
updated_at: 2026-11-15
