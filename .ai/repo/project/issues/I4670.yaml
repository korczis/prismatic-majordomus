  - "`machine slot handover` to a live fixture session moves the slot atomically. The record then names the new holder and the ledger line names both sessions. A handover to a session that is not live is refused (exit 15) and leaves the slot with its holder"
  - "With a fixture process table where the holder is alive and none of its descendants is a build process for longer than idle_release_seconds, the next take releases the slot and records `idle`. With a compile child alive, the slot stays held"
