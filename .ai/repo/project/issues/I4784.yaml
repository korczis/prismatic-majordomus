acceptance_criteria:
  - "init --hooks versioned in a fresh repository leaves .githooks/pre-commit and .githooks/pre-push executable and tracked-ready, core.hooksPath set, and doctor reporting both entries wired"
  - "`hooks add pre-push scripts/e2e-gate` writes the dispatcher entry and the enforcement entry; doctor proves it wired; a gate that exits 1 refuses `git push` to a local bare remote"
  - "A second clone without core.hooksPath set is reported by doctor with the command that sets it"
  - "init without the option behaves as at 46775282570"
