id: I0804
milestone: M003
title: Close a session into an envelope derived from the ledger
slug: session-close-envelope
priority: p1
profile: deep-work
parallel_safe: false
objective: "Implement `session close`: read the active record, derive the episode's references from the ledger between its start and now, write an immutable closed record with computed end-state git facts and an optional authored summary body, remove the active record, and append the close event to the ledger."
why: "This is the mechanism that makes the session an envelope rather than a narrative. Nothing accumulates references during the episode, so no command outside session pays for them; and because the ledger is append-only and machine-written, the envelope is a derivation of existing evidence rather than a second account of it."
current_state: "The ledger records task, checkpoint, handover, finish, decision, question, plan and maintenance events, each with a timestamp, a branch and a head. Nothing reads a time range out of it."
desired_state: "A closed record under .majordomus/state/sessions/ carries the computed identity, started_at and closed_at, start and end head and working tree, the outcome, and reference lists of task ids, issue ids, milestone ids, checkpoint paths, handover paths, decision entries and question ids observed in the ledger window. It copies no body. An authored summary on stdin is optional and is stored as the record body, subject to the identity-field refusal every other record uses."
scope:
  - lib/session.sh
  - test/cases/60_session_lifecycle.sh
  - test/cases/61_session_envelope.sh
non_scope:
  - Reading a closed record back, which is its own issue
  - Retention and archiving
  - Any copying of a checkpoint, handover or decision body into the session file
depends_on:
  - I0803
acceptance_criteria:
  - Closing writes an immutable record, removes the active record, and appends one ledger event
  - The reference lists match the events the ledger holds in the window, and nothing outside the window appears
  - An episode that spans two tasks names both; a task that spans two sessions is named by both
  - No body of any referenced record appears in the session file, and a case asserts that
  - An authored summary containing an identity field is refused, as it is for a checkpoint
validation:
  - bash test/run.sh 60_session_lifecycle
  - bash test/run.sh 61_session_envelope
evidence_required:
  - session_closes
  - envelope_is_references
risk: "The ledger window is bounded by timestamps with second resolution, so two episodes that abut within one second could each claim an event. The ledger's line order is the existing tiebreak for exactly this and has to be used rather than the timestamps alone."
created_at: 2026-09-04
updated_at: 2026-09-04
