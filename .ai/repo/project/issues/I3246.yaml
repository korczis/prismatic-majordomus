id: I3246
milestone: an-unmet-criterion-is-drafted-into-work
title: "The evidence half of a gap is drafted from the ledger, and a second draft at one commit is the same"
slug: the-gap-is-drafted-from-the-ledger
priority: p1
profile: implementation
objective: "Revive I2217 from origin/chore/the-owner-packs-are-planned (ec37317fe7c, 2026-10-10, never landed): a read-only intents.draft_gap (`intent draft gap <intent>`) prints a majordomus.gap/v1 record whose criterion states are derived from the evidence at the presented commit, each observation citing the ledger execution or claim it read. Port the record byte-identical first, then update its current_state to master."
why: "The owner asked from 2026-09-15 to 2026-10-16 that Majordomus find what is not true instead of a person writing it. On master a gap is hand-written and intent_review.rs only judges it; the draft was planned on 2026-10-10 on a branch that never reached master. Proposed in ADR 0191 (A plan drafted from an intent is a proposal, checked by the plan's own validators before any record is written); ADR 0192 (Replanning is bounded, idempotent and never weakens its intent) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c205#2."
current_state: "apps/majordomus-cli/src/intent_review.rs judges gap records under .ai/repo/project/gaps/; capability/builtin/intents.rs declares list, record, validate, coverage, preflight, binding and propose; nothing drafts a gap."
desired_state: "intents.draft_gap is pure over IntentView, the evidence index and the ledger; its output passes intent validate's gap checks unchanged; nothing is written."
scope:
  - "apps/majordomus-cli/src/capability/builtin/intents.rs"
  - "docs/PLANNING.md"
  - "apps/majordomus-cli/src/intent_review.rs"
