  { label = "Sessions", href = "/sessions/", bar = true },
  { label = "How planning works", href = "/docs/planning/" },
  { label = "Design", href = "/docs/design/" },
  { label = "Component kit", href = "/kit/" },
  { label = "How the surfaces are derived", href = "/docs/surfaces/" },
  { label = "How this site is built", href = "/architecture/" },
  { label = "How the product page is derived", href = "/docs/product/" },
  { label = "Article: proof-carrying documentation", href = "/proof-carrying-documentation/" },
