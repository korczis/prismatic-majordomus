id: I4309
milestone: a-review-is-published-at-its-commit
title: "A finding carries severity, a verification state and its measured commit, and a critical or high finding without a plan issue is refused by a rule and its gate"
slug: an-untracked-serious-finding-is-refused
priority: p1
profile: implementation
parallel_safe: false
objective: "Extend the critique finding shape with optional severity (critical, high, medium, low), verification (state confirmed or plausible, and the refuter's note when plausible) and the commit the finding was measured at, in share/schemas/majordomus/critique/critique.v1.schema.json and CritiqueRecord, with share/allow/critique.txt regenerated by majordomus generate; then add the rule project.review-findings-are-tracked, version 1, blocking: a finding of severity critical or high names the plan issue that resolves it, or is rejected with the owner's recorded reason; enforce it in intent validate as a FAIL naming the record and the finding id; and give the rule its proving test."
why: "dev-68 asked that each finding carry a verification state (confirmed or plausible, with the refuter's note) so a reader can tell a measured fault from a suspicion, and asked for a tracked-finding rule; the conclusion adopted both: 'a critical or high finding without an issue is refused by a rule.' The critique finding shape (share/schemas/majordomus/critique/critique.v1.schema.json) has id, class, subject, finding, blocking and resolution, and no severity or verification; reusing it keeps project.optional-complexity, with no new finding noun. The JOBL rule of the same id (jobl-mirror .ai/repo/rules/project/review-findings-are-tracked.v1.md) refuses an untracked serious finding at the session's end through its atlas check. Here critique findings are validated by intent validate (apps/majordomus-cli/src/intent_review.rs), which already refuses work while a blocking finding is open, so the rule belongs beside that check rather than in a new gate. Severity and its rule land together, and before the first review (I4305), so that review is written in the shape and judged by the rule."
current_state: "On 81ef931a3e1 CritiqueRecord (apps/majordomus-cli/src/intent_review.rs:340) reads the six finding fields, no finding has a severity or a verification state, and no rule names review findings."
desired_state: "The critique schema and CritiqueRecord carry the three optional fields; the rule file exists under .ai/repo/rules/project with its rationale, required behaviour, failure behaviour and verification; intent validate fails on a planted high finding with state open or planned without an issue; majordomus-cli rules proves names the rule for its test."
scope:
  - ".ai/repo/project/issues/I4309.yaml"
  - "share/schemas/majordomus/critique/critique.v1.schema.json"
  - "apps/majordomus-cli/src/intent_review.rs"
  - ".ai/repo/rules/project/review-findings-are-tracked.v1.md"
non_scope:
  - "Findings outside critique-shaped records"
  - "Mapping quality.report's error/warning severity onto critical, high, medium and low"
  - "Proposing an issue from a finding (I4308)"
  - "A security class and its redaction (I4314)"
depends_on: []
serves:
  - "a-review-is-seen-at-its-commit#an-untracked-serious-finding-is-refused"
acceptance_criteria:
  - "A critique finding with severity high, verification plausible and a refuter's note validates; one with verification plausible and no note is refused"
  - "intent validate fails on a fixture critique whose high finding has no resolution issue, naming the record and the finding id"
  - "A high finding rejected with a reason passes"
  - "A medium finding without an issue passes"
  - "majordomus-cli rules proves <the new test> names project.review-findings-are-tracked"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib intent_review::"
  - "bin/majordomus generate --check"
  - "bin/majordomus intent validate"
  - "bin/majordomus plan validate"
evidence_required:
  - "untracked_serious_finding_is_refused"
risk: "Low. Existing critiques carry no severity, so the rule reads them as unrated and refuses nothing until a finding is rated."
created_at: 2026-10-28
updated_at: 2026-10-28
