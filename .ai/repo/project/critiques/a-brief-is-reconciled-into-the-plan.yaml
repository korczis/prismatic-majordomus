  - id: fixture-test-does-not-settle-a-skill-run
    class: unproven_assumption
    subject: "I3404 / a-decomposed-paste-passes-the-plan-checks"
    finding: "The test checks records committed inline and labelled 'from one recorded run'. A hand-written or hand-edited fixture passes the same way, so the criterion's verdict ('one recorded run of the skill writes...') is not what the test settles. The test proves that the checks accept a decomposition of the right shape and that the digests agree, not that the skill produces one. Fix: reword the criterion to what the test proves, and settle 'the skill produces valid records' from a live run's PR (plan validate and intent validate as recorded evidence), for example the three untracked pastes with the owner's consent. Also align the counts: I3404 requires exactly 'one issue in the first wave' while the criterion says 'at least one'."
    blocking: false
    resolution:
      state: open
      because: "Planned in part. The criterion is reworded to what the test settles: the checks accept a decomposition in the skill's output shape, and the digests agree. It says outright that it does not settle a live run. Both the criterion and I3404 now say 'at least one' first-wave issue. Settling that a live run produces valid records needs the owner's consent to run the skill over the three untracked pastes, so that half stays an owner question and no criterion claims it."
  - id: pasted-model-answer-classified-as-a-brief
    class: regression_risk
    subject: "skill step 2"
    finding: "The step 2 table sends 'a document handed over: a report' to campaigns/ and only 'an exchange between several speakers' to workspace references. The three pastes are model answers taken from a conversation: the first title carries a link with utm_source=chatgpt.com. The intent's non-goal forbids 'Keeping a conversation's bytes under .ai/repo/ or campaigns/', and ADR 0211 cites a workspace message by reference. The plan lists this as an open question for the owner, yet the skill answers it silently in favour of storing. Fix: step 2 treats a pasted answer from an AI conversation as a conversation message (a workspace reference, or ask the person) until the owner rules otherwise."
    blocking: false
    resolution:
      state: planned
      issue: I3400
      because: "Step 2 now treats an AI assistant's answer, or a text that quotes one, as a conversation message. It is cited by workspace reference when a synced workspace holds it (ADR 0211). Otherwise the person is asked whether it may be kept, until the owner rules otherwise, and the owner question is recorded."
  - id: offering-by-announce-claims-the-scope
    class: regression_risk
    subject: "skill step 9"
    finding: "Announcing every first-wave issue 'as offered, with its id and its scope' through peers.announce makes the announcer the holder of those scopes, and board announcements replicate on the mesh as advisory claims (repository CLAUDE.md). The decomposer would appear to claim work it is told not to take ('Take one at most yourself'), which keeps away the workers it is offering to. Offer without a scope claim (mesh handover publish or review request, or point to plan next), and announce only the issue actually taken."
    blocking: false
    resolution:
      state: planned
      issue: I3400
      because: "Step 9 announces with a scope only the one issue the decomposer takes. The rest are offered by a handover published on the mesh that names their ids and claims no scope, and plan next picks for the takers."
  - id: skill-task-scope-and-manifest-steps-incomplete
    class: insufficient_work
    subject: "skill steps 1, 2, 8"
    finding: "`majordomus start ... --scope campaigns,.ai/repo/project` leaves out scripts/ci/english-only-allow.txt, which step 2 edits for a non-English paste. It also leaves out the projections that new plan records derive into: site/content/plan/<id>.md, site/data/generated/plan.json and entities.json, and docs/generated/graph.json (I3272 appears in all four). The procedure never runs the derive. campaigns/README.md is itself listed in MANIFEST.sha256, so adding a row changes its digest: 'add its line' leaves campaigns-check red. The skill should regenerate the manifest with the command campaigns-check prints. The directory pattern `<date>-<slug>` also differs from the existing names (slug, or slug-date)."
    blocking: false
    resolution:
      state: planned
      issue: I3400
      because: "The task scope in step 1 now names scripts/ci/english-only-allow.txt and the projections that plan records derive into (site/content/plan, site/data/generated/{plan,entities,delivery,source}.json, site/data/registry/registry.json, docs/generated/graph.json, docs/PLAN_STATUS.md). Step 8 runs majordomus generate and scripts/generate-site-data before validating. Step 2 regenerates the manifest with the command campaigns-check prints, because README.md is itself in the manifest. The directory follows the existing <slug>-<yyyymmdd> pattern."
  - id: single-line-paste-still-kept-verbatim
    class: missed_requirement
    subject: "I3401"
    finding: "The detector is structural only, and I3401's doctest explicitly accepts 'a single long line'. A paste with its newlines stripped, or any one-paragraph text of any length, is still written verbatim, which falls short of the owner's order that a paste be decomposed. Add a length bound, derived from the measured maximum statement length of the tracked intents on master and stated in ADR 0144, so the threshold is a measured value and not an invented one."
    blocking: false
    resolution:
      state: planned
      issue: I3401
      because: "A length bound is added: the smallest power of two above the longest statement of a tracked intent on the issue's base. The longest statement line on 9904000d2df measures 846 bytes, which gives 1024 unless the base measures otherwise. ADR 0144 states it with the command that measured it, and a test asserts that every tracked statement stays within it, so the constant stays pinned by what it measures."
  - id: adr-0144-decision-and-error-variant
    class: regression_risk
    subject: "I3401"
    finding: "ADR 0144's Decision says the statement is written verbatim. One of its rejected alternatives turns down plan records shaped by 'the model's guess at milestones and criteria'. I3401 adds only a Consequence. The Decision must state the refusal, and the alternatives section must say why a decomposition drafted by the worker and held to a critique and to plan validate differs from the rejected guess. 'ProposeError::Exists-style refusal' is ambiguous: reusing Exists mislabels the error, whose doc reads 'A record with this identity exists'. A new variant extends a public, exhaustive enum (intent.rs:2251, not non_exhaustive), and release analysis judges that change. Name the variant and accept the contract effect explicitly."
    blocking: false
    resolution:
      state: planned
      issue: I3401
      because: "The refusal reuses ProposeError::Invalid, whose doc already reads 'the input cannot make a record' and which maps to invalid_input (intents.rs:460). The public, exhaustive enum and the release contract stay unchanged, and no new variant is added. The criterion now says invalid_input, not refused. I3401 amends ADR 0144's Decision as well as its Alternatives."
  - id: order-pay-70-before-its-referrers
    class: regression_risk
    subject: "I3401, I3402, I3403 depends_on"
    finding: "I3401, I3402 and I3403 name the decompose-a-brief skill that I3400 adds, so a merge order that lands them first would point readers at a skill that does not exist yet; each must depend on the skill issue."
    blocking: false
    resolution:
      state: planned
      issue: I3401
      because: "I3401 now depends on I3400. I3402, I3403 and I3404 depend on I3400 and I3401, and I3405 depends on I3402. Waves: 0 = I3400; 1 = I3401; 2 = I3402, I3403, I3404; 3 = I3405."
  - id: criterion-names-untested-transports
    class: delivery_verification
    subject: "a-paste-is-decomposed-not-stored-verbatim"
    finding: "The criterion claims the command line, MCP, HTTP and the /intent alias. I3401 tests only the command line and MCP. No issue posts to POST /api/v1/intents/propose, and the alias is a text file that no test executes (I3402 asserts its sentences, not its behaviour). Add the HTTP form to I3401's test (the Served helper is already used in tests/intent_plan.rs), and word the alias part as 'the generated alias carries the rule', or drop those transports from the verdict."
    blocking: false
    resolution:
      state: planned
      issue: I3401
      because: "I3401's test now covers HTTP POST /api/v1/intents/propose through the Served helper, as well as the command line and MCP. The alias and the domain skills moved to a separate criterion, a-refused-paste-leads-to-the-skill, which is worded as 'the generated text carries the rule', the thing a test can check."
