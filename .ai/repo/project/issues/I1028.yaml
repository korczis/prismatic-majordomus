id: I1028
milestone: capability-graph
title: The inventories this replaces are removed, not left running beside it
slug: remove-duplicate-inventories
priority: p1
profile: deep-work
parallel_safe: false
objective: "Find the hand-maintained inventories this architecture replaces — menus, landing cards, route lists, documentation indexes, rule and skill catalogues — and remove them, so that one derivation is the only one."
why: "Two systems doing the same job is worse than either alone: the old one keeps working just well enough that nobody notices it has diverged. Migration is finished when the thing it replaced is gone."
current_state: "Several surfaces assemble their own lists. Which ones exactly is a reconnaissance result, not an assumption."
desired_state: "Each replaced inventory is deleted, its consumers read the derivation, and nothing hand-written survives as a fallback."
scope:
  - site
  - apps/majordomus-cli/src/cockpit/mod.rs
non_scope:
  - Deleting a list that is genuinely authoritative for something the graph does not model
  - Leaving a hand-written list in place as a fallback
depends_on:
  - I1009
acceptance_criteria:
  - The inventories that are replaced are enumerated from the repository, not assumed, and each is either removed or justified as authoritative for something else
  - Every consumer reads the derivation after the removal
  - Nothing that was removed is reachable as a fallback path
  - The built site and the running interface show the same content as before the removal, except where the derivation is more complete
validation:
  - bash test/run.sh
  - majordomus generate --check
evidence_required:
  - duplicates_removed
  - consumers_migrated
risk: "Removing a list that quietly held something the graph does not model loses content. Each removal is checked against what the derivation actually produces."
created_at: 2026-09-06
updated_at: 2026-10-26
cancelled: true
completion: "Cancelled 2026-10-26 on master 6259dac47af as a duplicate of I1117 (two-folder-integration): both remove the hand-maintained lists one derivation replaces, enumerated from the repository, with every consumer on the derivation, no fallback, and the same content after; I1117 also refuses a new enumeration by check. I1030 now depends on I1117 in its place. Found in the oldest-first issue elimination, batch 8."
