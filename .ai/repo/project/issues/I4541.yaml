title: "One Cytoscape module draws every graph on every surface, and the duplicated PR and milestone dependency graphs become one each"
slug: one-cytoscape-module
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S7 of milestone one-frame-one-kit-one-library-per-job. Add share/design/js/graph: one Cytoscape 3.33.1 integration with token styling, the core theme observer, one keyboard model and a Flowbite drawer for a node's details. share/cockpit/graph.js, share/cockpit/trains.js, the graph part of share/ui/ui.js and site/graph.js become callers of it. The PR dependency graph (/ui/prs and /cockpit/trains) and the milestone dependency graph (/ui/roadmap, /roadmap/ and the Mermaid of /plan/ and /dag/) are drawn once each. Decision recorded here by measurement: three.js stays for the topology page when its 3D view is measured to show what a Cytoscape layout cannot, otherwise the topology page moves to Cytoscape and three.js leaves package.json; the measurement and the verdict are recorded in this issue's evidence."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). Four Cytoscape integrations carry four stylings, four theme observers and four keyboard handlings, and two graphs are drawn twice."
current_state: "Measured on master on 2026-11-07: Cytoscape 3.33.1 (package.json) in share/cockpit/graph.js (1310 lines), share/cockpit/trains.js (1259 lines), share/ui/ui.js (window.cytoscape at lines 572 and 838 of 1150) and site/graph.js (755 lines); PR dependencies on /ui/prs and /cockpit/trains; milestone dependencies on /ui/roadmap, Cytoscape on /roadmap/ and Mermaid on /plan/ and /dag/; mesh topology on /ui/mesh (Cytoscape) and /cockpit/graphs/topology (three.js 0.185.1, share/cockpit/topology.js)."
desired_state: "share/design/js/graph is the one Cytoscape integration; each graph kind has one view; the three.js verdict is recorded with its measurement."
