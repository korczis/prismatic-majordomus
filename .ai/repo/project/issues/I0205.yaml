id: I0205
milestone: runtime-adapters
title: Declare the clamp as a doctrine so the mapping and the adapter cannot drift
slug: clamp-doctrine
priority: p2
profile: implementation
parallel_safe: false
objective: "Declare the rule that every applied limit is derived from the declared mapping as a doctrine with its own validator, dispatched from the registry, reaching the command that claims to run it, covered by a case and run in CI."
why: "A new enforced rule that lives as an inline check inside a command is invisible to doctor and to the doctrine list, and drifts the first time somebody edits the adapter. The registry is the only place a rule can be proven to be wired."
current_state: "One adapter applies one derived limit. Nothing refuses an adapter that stops consulting the mapping, and nothing lists this rule among the rules the repository enforces."
desired_state: "The rule appears in the doctrine list, a refusal names it, doctor proves it reaches its command and that a case covers it, and CI runs that case."
scope:
  - share
  - lib
  - test/cases
non_scope:
  - Blocking on anything a worker cannot fix from inside the repository
depends_on:
  - I0204
acceptance_criteria:
  - The doctrine is declared in the registry with its validator, and doctor fails if either half is missing
  - An adapter that applies a value the mapping does not derive is refused, and the refusal names the doctrine
  - A case covers the refusal and CI runs it
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
  - doctor
risk: "A blocking doctrine over a provider-specific adapter can refuse work in a repository whose provider changed underneath it; whether it blocks or advises is decided against that, and recorded."
created_at: 2026-09-04
updated_at: 2026-09-04
