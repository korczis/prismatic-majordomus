id: I3122
milestone: a-claim-stands-only-on-its-evidence
title: "A coverage figure on every surface names its dimension, its commit and what it does not measure"
slug: coverage-names-what-it-measures
priority: p2
profile: implementation
objective: "Make the coverage publication carry, per figure, its dimension (Rust crate lines, functions or regions; session domain), the commit and tree state it measured, and the list of unmeasured dimensions (shell cases, browser, MCP and WebSocket transports). The site and /ui render that, not one percentage."
why: "The owner asked for the real state of test coverage on 2026-10-17 (c293#0) and was given one Rust line figure. \"100 percent tested\" was defined in c143#8 as a set of dimensions, not as line coverage. The last published snapshot the owner saw (25b5fce9b65c) gave lines 91.29, functions 90.25 and regions 90.22, with nothing to say what it left out. On 2026-10-18 f6 settled the overlap on the mesh: I2965, which qualifies the site's proof words by their verdict, lands first, and the count qualification f6 had staged as I2970 is carried here instead. It extends milestone test-evidence. Sources: chatgpt-majordomus:c100#3, chatgpt-majordomus:c102#16, chatgpt-majordomus:c143#8, chatgpt-majordomus:c158#19, chatgpt-majordomus:c293#0, chatgpt-majordomus:c293#2, chatgpt-majordomus:c087#1."
current_state: "docs/COVERAGE.md describes crate floor, domain floor and differential gate. scripts/rust-coverage records commit and tree state. I1011 (READY) is the coverage matrix."
desired_state: "Every surface reads one record with dimension, revision and an explicit \"not measured\" list."
scope:
  - "scripts/rust-coverage"
  - "scripts/generate-site-data"
  - "docs/COVERAGE.md"
  - "apps/majordomus-cli/src/ui/evidence.rs"
  - "site/templates/evidence.html"
  - "apps/majordomus-cli/src/evidence/coverage.rs"
  - "scripts/ci/evidence-collect"
  - "test/cases/10_site_data.sh"
non_scope:
  - "Measuring shell or browser coverage"
depends_on:
  - "I2965"
serves:
  - "a-claim-stands-only-on-its-evidence#proof-from-ci-runs"
acceptance_criteria:
  - "The published coverage section names its commit and lists unmeasured dimensions"
  - "No surface shows a coverage percentage without its dimension"
validation:
  - "scripts/generate-site-data --check"
evidence_required:
  - "coverage_states_its_scope"
created_at: 2026-10-18
updated_at: 2026-10-18
