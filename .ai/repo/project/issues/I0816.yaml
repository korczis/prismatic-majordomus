id: I0816
milestone: M003
title: Prove the loop on a real issue, without a transcript
slug: dogfood-the-loop
priority: p1
profile: deep-work
parallel_safe: false
objective: "Execute the whole lifecycle against a real issue of this repository — session start, plan next, plan show, context, knowledge retrieval, work, checkpoint and decision, evidence, plan done, session close, knowledge sync, watch — and record as evidence what a following session could determine from the records alone."
why: "The milestone is not finished when a command returns something. It is finished when a worker with no conversation history can say what happened, why, what was decided, which evidence supports it, where the canonical source lives and what to do next. That is a demonstration, not an assertion, and it is the only acceptance criterion that tests the parts against each other."
current_state: "The pieces are individually tested in disposable repositories. Nothing has run the assembled loop on this repository's own canonical model."
desired_state: "The loop has been run, its measurements recorded — discovery, cold sync, no-op sync, search, context assembly — and the questions a following worker can answer from records alone are listed with the command that answers each."
scope:
  - docs/DOGFOODING.md
  - .majordomus/project
non_scope:
  - Any new capability
  - Any performance guarantee in README or claims that the measurement does not support
depends_on:
  - I0815
acceptance_criteria:
  - The loop ran on a real issue and the evidence names the commands and what each showed
  - Each of the six questions a following worker must answer is listed with the command that answers it
  - The measurements are recorded, and no number appears in README or claims that they do not support
  - A read-only pass over the whole surface leaves git status byte-identical
validation:
  - bash test/run.sh
  - bin/majordomus doctor
  - bin/majordomus watch
  - bin/majordomus plan validate
evidence_required:
  - dogfood_loop
risk: "A dogfood run that is narrated rather than measured proves nothing. Every claim in the evidence has to name a command that produced it."
created_at: 2026-09-04
updated_at: 2026-09-04
