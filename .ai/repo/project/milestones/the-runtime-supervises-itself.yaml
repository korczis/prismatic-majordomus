id: the-runtime-supervises-itself
title: "The runtime says what is progressing, waiting or stalled, and repairs only what is safe"
slug: the-runtime-supervises-itself
order: 170
priority: p2
problem: "The owner asked on 2026-10-17 for a background watchdog that keeps the mesh running, drains tasks and leaves no zombies. The primitives exist one by one (heartbeats, leases, serve ensure, health.report, monitor.stream, scripts/reap-orphans, recover orphans) but nothing composes them into one judgement of what is stuck. Proposed in ADR 0199 (A hub is a declared host service; a working checkout's server stays a client's child); ADR 0200 (Supervision repairs only what is idempotent, owned and verified, and never restarts blindly) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c288#13."
outcome: "One read capability classifies the runtime's work; a bounded repair loop acts only through ensure, recovery, leases and the reaper."
current_state: "Verified on master 707a04c: mesh heartbeat 5 s / expiry 30 s (docs/MESH.md), server.idle_seconds 900 (.ai/repo/policy.yaml), health.report, monitor, scripts/reap-orphans, scripts/liveness-check, majordomus recover orphans; no capability classifies stalled versus waiting."
desired_state: "supervision.status (read-only) on every surface; supervision repair under ADR 'supervision repairs only what is idempotent'; OS units only for declared hubs."
scope:
  - "apps/majordomus-cli/src/capability/builtin/health.rs"
  - "apps/majordomus-cli/src/capability/builtin/monitor.rs"
  - "apps/majordomus-cli/src/lease.rs"
  - "scripts/reap-orphans"
  - "docs/MONITOR.md"
  - "test/cases"
non_scope:
  - "Service units for hubs: I2722"
  - "Restarting live sessions or retrying merges"
  - "Remote execution on a peer"
acceptance_criteria:
  - "A stalled execution and a session legitimately waiting for CI are told apart by one read"
  - "A repair loop never kills a process it does not own"
  - "A repeated repair failure escalates on the board instead of looping"
validation:
  - "majordomus plan validate"
evidence_required: []
depends_on:
  - "failure-is-visible"
  - "runtime-lifecycle"
risks:
  - "A repair that races a peer's own recovery: every action asks ownership again before it acts"
  - "Collides with ADR 0003 if it grows into a daemon; it runs inside the existing server"
created_at: 2026-10-18
updated_at: 2026-10-18
