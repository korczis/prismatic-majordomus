    result: "ok 3090: every parseable tracked YAML file (546 of 551) flattens byte-identically to the parser alone, cold and warm, each warm call a counted hit; a same-length change in the same slot is parsed again; truncated, garbage, forged-source, forged-length, empty and unreadable entries are never served and are rewritten; a failed parse prints and exits 3 as before and is never kept; the directory never exceeds a cap of 3, oldest written removed first; no key or 0 is no cache; a changed parser gets another directory; doctor, context, history, prompt list, skills list and check print the same cold and warm in a fresh repository with yaml_flatten counted equally. Per call on 44 issue files: uncached 171-175 ms (about 4.0 ms each), warm 49-68 ms (about 1.2 ms), cold 400-606 ms once (the write and rename). doctor on this repository: yaml_flatten 571 cold and warm, flatten_cache_hit 16 cold and 337 warm, output identical but for clock-driven lines; wall time 511 s cold and 523 s warm at load average 40-62, which the load dominates. The other 234 calls run in processes that never load the policy and stay uncached."
