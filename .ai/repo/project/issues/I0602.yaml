id: I0602
milestone: shared-policy
title: Make a local override explicit and prove it survives an update of the shared source
slug: explicit-override
priority: p3
profile: implementation
parallel_safe: false
objective: "Define how a repository overrides part of a shared policy, require the override to be declared rather than inferred from a value differing, and prove with a case that updating the shared source leaves the override standing."
why: "An override that looks like an ordinary key is indistinguishable from a stale copy. Declaring it is what lets the drift report tell a deliberate exception from an accident."
current_state: "A shared source can be named and resolved. Anything a repository writes locally either wins or loses by a rule nobody has written down."
desired_state: "Overrides are declared, the merge order is documented and tested, and a shared source that changes underneath a repository does not silently take an override away."
scope:
  - lib
  - share
  - docs
non_scope:
  - Overriding a rule the shared policy declares non-overridable, if such a class is introduced later
depends_on:
  - I0601
acceptance_criteria:
  - An override is a declaration, and a local value that differs without one is a finding
  - The merge order is documented and covered by a case
  - A case updates the shared source and shows the override still applies
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "Merge semantics are where shared configuration usually becomes unexplainable; the documented order and its case are the whole defence."
created_at: 2026-09-04
updated_at: 2026-09-04
