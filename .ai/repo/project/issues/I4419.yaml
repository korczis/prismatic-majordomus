  - "Unit test: given the same measurement and no observation, or an observation in which a run is in progress, the answer equals today's, held_by absent"
  - "Case 4419, with gh stubbed on PATH to list queued runs and none in progress past I4326's bound: doctor's release line is a WARN carrying 'the forge has started no job since' and the remedy 'the release waits for the forge', and does not carry 'releases it now'"
  - "Case 4419: with the stub listing one run in progress, doctor's release line is today's OVERDUE line and its remedy is 'the release seat releases it now'"
  - "Case 4419: the brief's release part reads 'release OVERDUE <n> (forge starved)' while the signal holds and 'release OVERDUE <n>' once it clears"
  - "Before the change the first unit test fails, because the answer carries no held_by"
