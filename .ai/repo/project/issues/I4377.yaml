  - "scripts/interaction-probe --spec graph passes on every graph and chart page with no console error, driving search, zoom, fit, legend filter, focus and reset"
  - "Cases 190, 3723, 12c, 107 and 1072 pass"
  - "scripts/cockpit-assets --check passes: the built stylesheets match their sources"
validation:
