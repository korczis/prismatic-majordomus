id: I0402
milestone: cost-per-accepted-outcome
title: Report cost only where measurement and acceptance both exist
slug: report-measured-cost
priority: p2
profile: implementation
parallel_safe: false
objective: "Add the command that reports what accepted outcomes cost, computed only from measured facts, and reports no figure at all where either half is missing, saying which half."
why: "A cost report that fills gaps is worse than no cost report, because it is believed. The command has to be as willing to answer nothing as to answer a number."
current_state: "The join exists as a derivation. Nothing reports it."
desired_state: "One command answers what an accepted outcome cost, in text and as JSON, and where it cannot answer, it names whether acceptance or measurement was missing."
scope:
  - lib
  - bin
non_scope:
  - Elapsed time or token count used as a proxy for progress
  - Any projection of a future cost
depends_on:
  - I0401
acceptance_criteria:
  - A figure is reported only where a measured record and an accepted outcome both exist
  - Where no figure is reported, the output names which half was missing
  - JSON and text agree on the set of outcomes and the figures reported
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "The first number this command prints will be quoted somewhere; its units and its denominator have to be in the output itself, not only in the documentation."
created_at: 2026-09-04
updated_at: 2026-09-04
