  - id: perf.counters
    module: perf
    kind: query
    title: Performance counters
    description: "The counters of this process: repository scans, index and registry builds, schema generations, projection builds, executions, handler invocations, cache hits, misses and evictions, and the phase timings, as they stand now."
    input:
      name: Empty
      schema:
        type: object
        additionalProperties: false
        description: No input.
        title: Empty
    output:
      name: CounterSnapshot
      schema:
        type: object
        properties:
          repository_scans:
            type: integer
            format: uint64
            minimum: 0
            description: "Enumerations of the repository's declared sources."
          index_builds:
            type: integer
            format: uint64
            minimum: 0
            description: Index builds.
          registry_builds:
            type: integer
            format: uint64
            minimum: 0
            description: Registry builds.
          schema_generations:
            type: integer
            format: uint64
            minimum: 0
            description: JSON Schemas derived from Rust types.
          mcp_projection_builds:
            type: integer
            format: uint64
            minimum: 0
            description: MCP tool and resource listings computed.
          openapi_builds:
            type: integer
            format: uint64
            minimum: 0
            description: OpenAPI documents built.
          http_projection_builds:
            type: integer
            format: uint64
            minimum: 0
            description: HTTP routers built.
          graph_builds:
            type: integer
            format: uint64
            minimum: 0
            description: Graphs derived from the registry and the index.
          executions:
            type: integer
            format: uint64
            minimum: 0
            description: "Calls through the executor, every transport."
          handler_invocations:
            type: integer
            format: uint64
            minimum: 0
            description: Handlers actually run.
          cache_hits:
            type: integer
            format: uint64
            minimum: 0
            description: Executions answered from the cache.
          cache_misses:
            type: integer
            format: uint64
            minimum: 0
            description: Executions of a cached capability that ran the handler.
          cache_evictions:
            type: integer
            format: uint64
            minimum: 0
            description: Cache entries dropped.
          phases:
            type: object
            additionalProperties:
              "$ref": "#/$defs/PhaseTotals"
            description: Phase totals by phase name.
        required:
          - repository_scans
          - index_builds
          - registry_builds
          - schema_generations
          - mcp_projection_builds
          - openapi_builds
          - http_projection_builds
          - graph_builds
          - executions
          - handler_invocations
          - cache_hits
          - cache_misses
          - cache_evictions
          - phases
        description: "The counters and phase totals of this process at one moment. Every value is a count\nor a duration this process measured; none is written anywhere by hand."
        title: CounterSnapshot
        "$defs":
          PhaseTotals:
            type: object
            properties:
              count:
                type: integer
                format: uint64
                minimum: 0
                description: How many times the phase ran.
              total_nanos:
                type: integer
                format: uint64
                minimum: 0
                description: "Nanoseconds spent in it, summed."
            required:
              - count
              - total_nanos
            description: "A phase's totals."
    provenance:
      source: builtin
      module: majordomus_cli::capability::builtin::perf
    exposure:
      mcp:
        tool: majordomus_perf
      http:
        method: GET
        path: /api/v1/perf
    availability: runtime
    visibility: public
    stability: behaviorally_verified
    tags:
      - performance
      - introspection
    benchmark:
      policy: required
    cache:
      policy: disabled
