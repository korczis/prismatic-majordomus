id: I3177
milestone: safe-self-update
title: "Two nodes one release apart keep linking, and what the older cannot answer is shown unavailable"
slug: mixed-versions-keep-linking
priority: p2
profile: verification
objective: "Prove in the mesh lab that a node upgraded one release ahead keeps its node identity, takes a new instance id, still links to the older node through the negotiated protocol, and that a capability only the newer offers is listed unavailable on the older's surfaces rather than hidden."
why: "The 10-08 robustness pack asked for a mixed-version mesh test (scenarios M13/M15); the 10-12 resident design asked that compatibility be negotiated by protocol range and capability set, not SemVer. ADR 0161 rolls nodes forward one at a time, so mixed versions are the normal state of every rollout. Proposed in ADR 0205 (What a runtime can do is a set of separately evidenced facts, and detection never authorises) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c200#2, chatgpt-majordomus:c240#2."
current_state: "Verified: I2163 (DONE) refuses a silent attach across versions on one host; I2723 (READY) publishes each node's version; test/mesh-lab/run builds every node from one executable."
desired_state: "A lab scenario with two executables; a capability-set field in the hello or advertisement; unavailable rendered by mesh peers."
scope:
  - "test/mesh-lab/run"
  - "test/mesh-lab/Dockerfile"
  - "apps/majordomus-cli/src/mesh/protocol.rs"
  - "scripts/ci/mesh-lab-evidence"
  - "docs/MESH.md"
non_scope:
  - "Cluster-wide automatic rollout"
depends_on:
  - "I2723"
acceptance_criteria:
  - "The lab's mixed_versions scenario passes and case 414 requires it"
  - "Restart keeps node identity and changes instance identity"
validation:
  - "majordomus plan validate"
  - "bash test/run.sh 414_mesh_lab_evidence"
evidence_required:
  - "mesh_lab_mixed_versions"
created_at: 2026-10-18
updated_at: 2026-10-18
