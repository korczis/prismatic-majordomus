id: I0833
milestone: M004
title: knowledge nodes and edges read each source once
slug: knowledge-hot-spots
priority: p0
profile: implementation
parallel_safe: false
objective: "Time the knowledge stages, then remove the per-file subprocesses in discovery and extraction so that nodes and edges take one pass per source."
why: "knowledge nodes costs 5.7 s and flattens 146 files on this repository."
current_state: "Discovery hashes and flattens per file with a subprocess each."
desired_state: "nodes and edges under 1 s on this repository with identical output."
scope:
