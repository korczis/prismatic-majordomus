findings:
  - id: stale-invariant-flips-on-any-commit
    class: regression_risk
    subject: I2022
    finding: "No issue serves an invariant, so its evidence has no declared inputs and goes stale after any change; with stale counted as violated, every satisfied intent with an evidenced invariant would turn unsatisfied on the next unrelated commit."
    source: the reviewing subagent
    blocking: true
    resolution:
      state: planned
      issue: I2022
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "Only a failing run violates a guard; stale, never run and unresolved are named as not judged."
  - id: mixed-list-breaks-allowlist-generator
    class: unproven_assumption
    subject: I2022
    finding: "The allowlist generator emits either the scalar pattern or the object walk for a list, so a list holding strings and records would leave the record keys unknown."
    source: the reviewing subagent
    blocking: true
    resolution:
      state: planned
      issue: I2022
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "Guards are a key of their own, a list of records; invariants stay strings and no reader or generator changes."
  - id: review-hash-blind-to-new-keys
    class: invariant_conflict
    subject: I2021
    finding: "The review revision and the plan revision hash criterion text, evidence and reference and the invariant strings; flipping a criterion to optional or changing a guard would leave a stamped review standing."
    source: the reviewing subagent
    blocking: true
    resolution:
      state: planned
      issue: I2021
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "Both hashes take optional and guards in where a record declares them, so existing stamps keep their revision."
  - id: verdict-reason-shape-pinned
    class: regression_risk
    subject: I2022
    finding: "A verdict reason is criterion, evidence and state, compared by exact JSON in tests and read by the drift findings; an invariant reason would break them or put a guard's id in a field named criterion."
    source: the reviewing subagent
    blocking: true
    resolution:
      state: planned
      issue: I2022
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "Failing guards are carried in verdict.guards, a field of its own that is absent when empty."
  - id: stage-and-verdict-are-two-derivations
    class: insufficient_work
    subject: I2021
    finding: "The stage computes whether every criterion is met separately from the verdict, and the plan did not say how the counts change."
    source: the reviewing subagent
    blocking: true
    resolution:
      state: planned
      issue: I2021
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "The stage reads the verdict; met is over required criteria and the optional count is carried apart."
  - id: all-optional-should-be-a-finding
    class: invariant_conflict
    subject: intent-satisfaction#optional-criterion-does-not-block
    finding: "An intent with no criterion is already refused, and ADR 0107 defines unknown only for unsettleable kinds or none declared."
    source: the reviewing subagent
    blocking: false
    resolution:
      state: planned
      issue: I2021
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "An intent with no required criterion is the failure intent_without_required_criterion, and ADR 0113 states how that extends ADR 0107's unknown."
  - id: optional-vs-coverage-and-gap
    class: missed_requirement
    subject: I2021
    finding: "Coverage fails every uncovered criterion and a gap must answer every criterion; the plan was silent on optional ones."
    source: the reviewing subagent
    blocking: true
    resolution:
      state: planned
      issue: I2021
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "An uncovered optional criterion is a warning and a gap still answers it, each with a test."
  - id: invariant-id-namespace
    class: unproven_assumption
    subject: I2022
    finding: "serves, gap conditions and critique subjects resolve against criteria only; whether a guard shares that namespace was undefined."
    source: the reviewing subagent
    blocking: false
    resolution:
      state: planned
      issue: I2022
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "A guard id may not repeat a criterion's, and an issue may not serve a guard."
  - id: policy-version-is-invented
    class: unproven_assumption
    subject: intent-satisfaction#evaluation-is-explained
    finding: "The judgement carries a state, the changed inputs and a detail, and no rule or version constant exists, so a rule applied would be a new table in the intent engine."
    source: the reviewing subagent
    blocking: false
    resolution:
      state: planned
      issue: I2020
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "No rule name is invented; the proof word the criterion already carries names the judgement."
  - id: claim-evaluation-undefined
    class: insufficient_work
    subject: I2020
    finding: "A claim's standing copies state and proof although the claim's proof already has its execution, the changed inputs and a detail."
    source: the reviewing subagent
    blocking: false
    resolution:
      state: planned
      issue: I2020
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "A claim's evaluation is its proof's execution, changed inputs and detail, and considered means the latest run only."
  - id: evaluation-partly-restates
    class: unnecessary_work
    subject: I2020
