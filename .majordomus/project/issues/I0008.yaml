id: I0008
milestone: M000
title: Project the model to GitHub milestones and issues
slug: github-projection
priority: p1
profile: implementation
parallel_safe: true
objective: "Create and update GitHub milestones and issues from the canonical model, report drift instead of overwriting human edits, and keep every network call out of the tool itself."
why: "GitHub is where collaboration happens, so it must show the plan. It is not where the plan lives, so it must never be the thing that defines it."
current_state: "The repository had no GitHub issues or milestones at all."
desired_state: "scripts/github-sync renders the projection from majordomus plan body, creates what is missing, updates what changed, and reports what a human has edited."
scope:
  - scripts/github-sync
non_scope:
  - Writing GitHub state back into the canonical files
  - Any network call inside bin, lib, share or test
depends_on:
  - I0005
acceptance_criteria:
  - The adapter runs offline against a fixture and produces the exact payload it would post
  - A managed issue whose body differs from the projection is reported as drift, not overwritten
  - A closed issue whose canonical status is not DONE is reported
  - The tool itself contains no network client
validation:
  - bash test/run.sh 33_github_projection
  - scripts/github-sync --plan
evidence_required:
  - projection_test
  - github
risk: "A sync that overwrites a human comment thread would make GitHub hostile to use."
created_at: 2026-09-04
updated_at: 2026-09-04
