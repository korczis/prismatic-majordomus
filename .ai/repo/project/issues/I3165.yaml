  - "I3163"
serves:
  - "the-layer-evolves-when-it-is-due#evolution-outcomes-are-measured"
acceptance_criteria:
  - "Each figure carries its denominator and window"
  - "No data reads unavailable"
  - "The reading is shown on /ui/knowledge as well as CLI, HTTP and MCP"
  - "The criterion evolution-outcomes-are-measured is rewritten to evidence: test naming test_evolution_outcomes_measured, and that test runs in this issue's validation"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test knowledge_base"
