# The Fly.io configuration of this repository's deployment.
# GENERATED by `majordomus generate deployment` from .ai/repo/deployments/majordomus.yaml.
# Do not edit: `majordomus generate --check` refuses a hand edit. Change
# the deployment object and regenerate.

app = "majordomus"
primary_region = "fra"

[build]
dockerfile = "deploy/Dockerfile"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

  [http_service.concurrency]
  type = "requests"
  soft_limit = 20
  hard_limit = 40

  [[http_service.checks]]
  grace_period = "2s"
  interval = "15s"
  method = "GET"
  timeout = "2s"
  path = "/api/v1/live"

  [[http_service.checks]]
  grace_period = "2s"
  interval = "15s"
  method = "GET"
  timeout = "2s"
  path = "/api/v1/ready"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256
