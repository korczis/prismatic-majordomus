id: the-peer-blackboard-is-one-reality
title: Who works on what, holding which claim and talking to whom, is one projection every surface follows live
statement: "A person opening /ui, /cockpit or the local home page sees, without reloading, which workers of this repository are attached on every board and every linked machine, what each announced and claims, which claims meet, which reviews and handovers wait and for whom, and whether every source could be read; each fact carries the record it came from, a relation between two workers says whether it is verified or only a candidate, and the published site shows the same picture as a snapshot it labels as one."
invariants:
  - The blackboard is a projection of the board, the mesh journal and the monitor, computed in one capability; it stores nothing and no surface computes a fact of it again
  - A board that could not be read or a source that is absent is reported with its reason, never as an empty board
  - A relation between two workers is verified only when an explicit identifier joins them; anything weaker is a candidate, and a position such as p1 is never an identity across boards
  - A page that says live is fed by a socket the server pushes on; a page that reads a published snapshot or polls says so
milestones:
  - peer-blackboard
satisfaction:
  - id: one-projection
    criterion: The command line, HTTP and MCP answer the same blackboard, with the boards and sources it covers, whether it is complete, every worker with its claims, the conflicts, the open reviews and untaken handovers, the typed relations and the recent signals
    evidence: test
    ref: test/cases/3380_the_blackboard_is_one_projection.sh
  - id: pushed-live
    criterion: A peer's announcement reaches a connected follower of the blackboard as a frame without a poll, a resumed follower repeats nothing, and a cursor the server cannot serve is answered with a resync and a fresh snapshot
    evidence: test
    ref: test/cases/3381_the_blackboard_is_pushed.sh
  - id: the-client-follows
    criterion: The browser's one socket client resumes a blackboard channel by its cursor and epoch and reports a resync, and the monitor page adds what the server pushes without polling and says when it has to poll
    evidence: test
    ref: test/cases/3382_the_monitor_is_pushed.sh
  - id: the-screen-follows
    criterion: The UI's Peers screen lists every worker with its intent and claims from the blackboard, is read again on every snapshot frame, a connection's first one included, one reading at a time, never shows the blackboard from before a change it was told of, says whether it is live, and is withheld from the published snapshot
    evidence: test
    ref: test/cases/3383_the_peers_screen_follows_the_blackboard.sh
  - id: published-safely
    criterion: The published site shows the blackboard's counts and every source's state with the revision and time they were read, says it is a snapshot and never live, and names no worktree path, scope, intent, session key, node id or endpoint
    evidence: test
    ref: test/cases/1092_the_ui_snapshot_holds_every_screen.sh
  - id: every-surface-reads-it
    criterion: /cockpit/peers renders the projection /ui/peers renders and follows the same frames, and no page that shows peers asks peers.list or mesh.state for them itself
    evidence: test
    ref: test/cases/3383_the_peers_screen_follows_the_blackboard.sh
  - id: acted-on-through-capabilities
    criterion: An operator answers a review, takes a handover or releases their own claim from /ui/peers through the capability that owns the record, offered only where that capability admits the caller, and the page shows the result only when the blackboard does
    evidence: test
    ref: test/cases/3383_the_peers_screen_follows_the_blackboard.sh
governance:
  - rule:project.derived-once
  - adr:adr-0044
  - adr:adr-0133
  - adr:adr-0176
non_goals:
  - A second board, registry or message store; the blackboard reads the records that already exist
  - Presence of a provider that cannot be observed through a supported, authenticated interface
