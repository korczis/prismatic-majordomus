# The categories use cases are filed under: presentation metadata, nothing else. Which use
# cases a category holds is each use case's own `category`; every count, index page,
# breadcrumb and facet is derived from that. A category with no use case renders nothing.
version: 1

categories:
  - id: adoption
    title: Getting started and adoption
    summary: Bringing Majordomus into a repository, new or old, without losing what people already wrote.
    order: 10
  - id: continuity
    title: Sessions and handover
    summary: Stopping and resuming work across sessions and workers from durable state, never a transcript.
    order: 20
  - id: workers
    title: Parallel workers
    summary: Several agents or people on one repository: claimed scopes, overlap, and who touched what.
    order: 30
  - id: policy
    title: Policy and enforcement
    summary: Declaring rules, proving they are wired, and reproducing a finding.
    order: 40
  - id: completion
    title: Completion and quality gates
    summary: Deciding whether work is finished, with a contract every line of which passes or fails.
    order: 50
  - id: drift
    title: Drift and reconciliation
    summary: Detecting that policy, projections, state and git disagree, and putting them back in step.
    order: 60
  - id: knowledge
    title: Repository knowledge
    summary: What the repository declares about itself: sources, nodes, edges, the plan, and searching them.
    order: 70
  - id: mcp
    title: Serving the layer to AI clients
    summary: One shared server per repository, every client a peer, the same layer over MCP, HTTP and the command line.
    order: 80
  - id: performance
    title: Performance
    summary: Benchmarks derived from the registry, baselines that are data, and budgets doctor reports against.
    order: 90
  - id: extension
    title: Extension
    summary: Adding a kind, a rule, a command or a use case as data, with the checks that follow from it.
    order: 100
