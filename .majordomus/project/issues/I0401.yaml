id: I0401
milestone: cost-per-accepted-outcome
title: Define an accepted outcome, and join it to its measurements without storing the join
slug: define-accepted-outcome
priority: p2
profile: deep-work
parallel_safe: false
objective: "Define precisely which finishes count as accepted outcomes, and derive the join between an accepted outcome and the execution facts of the work that produced it from records that already exist, storing no third record."
why: "Cost per outcome is a ratio, and both halves of it are already recorded: the finish contract decides acceptance and telemetry measures consumption. Storing the join would be a third place for them to disagree."
current_state: "The finish contract evaluates acceptance and records the outcome. Telemetry records what a session consumed. Nothing connects them, and the word outcome is used loosely across the documents."
desired_state: "One written definition of an accepted outcome, matching what the finish contract actually enforces, and a derivation that produces the set of accepted outcomes with their measurements, computed on demand."
scope:
  - lib
  - docs
non_scope:
  - Any stored aggregate
  - Counting a completed finish that the contract did not accept
depends_on: []
acceptance_criteria:
  - The definition matches what the finish contract enforces, and a case fails if the two drift apart
  - The join is derived from existing records, with nothing new persisted
  - An outcome whose work reported no telemetry appears in the set with an explicit absence
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "The tempting definition is the one that produces more data points; the correct one is the one the finish contract already enforces, even when that is a smaller set."
created_at: 2026-09-04
updated_at: 2026-09-04
