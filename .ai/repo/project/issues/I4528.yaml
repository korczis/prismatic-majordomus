depends_on: []
acceptance_criteria:
  - "Case 3002 passes in under a minute on a machine with less than 51200 MB free (measured: 17 s at 47 GB free); without the line it times out on the same machine"
  - "The next master validate passes suite-shard (4)"
validation:
  - "bash test/run.sh 3002_a_build_never_waits_in_silence"
evidence_required:
  - suite
risk: "None for the product: a test-only change that makes one scenario set what the others already set."
