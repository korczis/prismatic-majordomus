  - ".ai/repo/ci/README.md"
  - ".ai/repo/ci/gates.yaml"
  - ".ai/repo/ci/pages.yaml"
  - ".github/workflows/validate.yml"
  - ".github/workflows/pages.yml"
  - "scripts/ci/step-bound-check"
  - "test/cases/4532_the_hosted_ci_jobs_are_bounded_to_fourteen.sh"
  - "site/content/plan/I4532.md"
non_scope:
  - "The account's plan, its hosted-job cap, or more self-hosted runners: the owner's question, not this repository's"
  - "OSCILLA's own workflows and how it spends its six"
  - "Removing, skipping or making advisory any gate to fit the bound; a plan that does not fit waits for its own jobs"
depends_on: []
acceptance_criteria:
  - "What the hosted jobs of validate.yml and pages.yml can hold at once — the sum of every matrix job's max-parallel and of the single jobs, or the widths of the concurrency groups the CI model declares — is at most fourteen, and a case computes it from the workflow files and refuses a workflow that exceeds it"
  - "The bound and the measurement that set it (20/20 on 2026-11-06, six reserved for OSCILLA) are written in .ai/repo/ci/"
  - "A job whose runs-on is a self-hosted label (lundra) is not counted against the bound, and the case proves it on a fixture workflow"
  - "scripts/ci/step-bound-check and case 26 are green on the changed workflows"
validation:
  - "bash test/run.sh 4532_the_hosted_ci_jobs_are_bounded_to_fourteen 26_ci_wiring"
  - "scripts/ci/step-bound-check"
evidence_required:
  - suite
risk: "A bound lengthens every full validate: a plan that spreads over its shards now waits for them. The minutes it costs are measured on GitHub before the bound is tightened below fourteen, and a case can only prove the declared width, never the account's live queue."
