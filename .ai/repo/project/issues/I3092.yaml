id: I3092
milestone: public-proof
title: "A translation-memory edit says which pages each changed key reaches, and refuses one that reaches none"
slug: a-memory-edit-reaches-a-page
priority: p2
profile: implementation
parallel_safe: false
objective: "Have the i18n pass write target/site-i18n/reach.json, every segment key of the English pages with the pages it occurs on, and give scripts/site-translate a `reach` command that lists, for every memory entry changed against a revision, the pages its key reaches and refuses (exit 10) one that reaches none; `import` refuses an entry whose key reaches no page."
why: "On 2026-10-20 a hand edit put the Czech for the site bar's toggle on the key of the plain sentence 'How it works' instead of the toggle's 'How it works<t1/>'. The memory took it, the bar stayed English, and only a peer reading the live page saw it. A key that no page carries is a translation nobody will ever read, and nothing said so."
current_state: "The pass lists only what the memory does not know (missing.json); an entry whose key no page carries is kept silently, and site-translate import admits any key with a matching English."
desired_state: "reach.json is written beside missing.json; `site-translate reach` names, for each changed key, its pages or that it reaches none, and fails on the latter; import refuses an unreachable key."
scope:
  - "scripts/lib/site-i18n.mjs"
  - "scripts/site-translate"
  - "test/cases/3590_the_site_is_derived_in_every_language.sh"
  - ".ai/repo/project/issues/I3092.yaml"
non_scope:
  - "Garbage-collecting unreachable entries already in the memory (they are listed, not removed)"
depends_on: []
acceptance_criteria:
  - "reach.json lists every segment key of the English pages with its page count"
  - "A changed memory entry whose key no page carries is named and refused; one whose key a page carries is listed with its pages"
  - "import refuses an entry whose key reaches no page"
validation:
  - "env -u MAJORDOMUS_SHARE bash test/run.sh 3590_the_site_is_derived_in_every_language"
evidence_required:
  - "unreached_key_is_refused"
