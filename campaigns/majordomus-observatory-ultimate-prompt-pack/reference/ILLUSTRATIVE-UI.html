<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Observatory: art-direction sketch (NOT LIVE)</title><style>html,body{margin:0;height:100%;background:#060c15;color:#b8dce6;font:13px system-ui}#root{height:100vh;display:flex;flex-direction:column;overflow:hidden}header,footer{display:flex;justify-content:space-between;padding:16px 24px;letter-spacing:2px}canvas{flex:1;min-height:0;width:100%}small{color:#9fabb5}.warning{color:#f9c67f}</style></head><body><main id="root"><header><span>◆ PRISMATIC / MAJORDOMUS  · OBSERVATORY</span><span class="warning">ART DIRECTION SKETCH · SYNTHETIC · NOT LIVE</span></header><canvas id="c"></canvas><footer><span>MESH COSMOS / GENERATIVE CONCEPT</span><small>There are no real Majordomus connections, metrics or sources in this HTML file.</small></footer></main><script>const c=document.getElementById('c'),x=c.getContext('2d');let w,h,d=1,step=0;function resize(){let r=c.getBoundingClientRect();w=r.width;h=r.height;d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(c);resize();const nodes=Array.from({length:9},(_,i)=>({x:Math.sin(i*2.399)*(.15+.12*(i%3)),y:Math.cos(i*2.399)*(.15+.12*(i%3))}));const links=[[0,1],[0,2],[0,3],[0,4],[1,5],[2,6],[3,7],[4,8]];function draw(){step+=.01;x.clearRect(0,0,w,h);x.fillStyle='#07101b';x.fillRect(0,0,w,h);const P=i=>({x:w*(.5+nodes[i].x),y:h*(.5+nodes[i].y)});for(const [a,b] of links){let p=P(a),q=P(b);x.strokeStyle='rgba(89,182,211,.28)';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();let f=(step*.2+(a*3+b)*.07)%1;x.fillStyle='#79edff';x.beginPath();x.arc(p.x+(q.x-p.x)*f,p.y+(q.y-p.y)*f,2,0,Math.PI*2);x.fill()}nodes.forEach((n,i)=>{let p=P(i),r=i===0?10:5;x.shadowBlur=25;x.shadowColor='#60efff';x.fillStyle=i%4===0?'#ffc389':'#8eeefa';x.beginPath();x.arc(p.x,p.y,r,0,Math.PI*2);x.fill();x.shadowBlur=0});requestAnimationFrame(draw)}requestAnimationFrame(draw)</script></body></html>
