id: I2327
milestone: a-finished-task-is-explained-by-its-evidence
title: "Legacy evidence is migrated without invented measurements, and the readers it replaces are deleted"
slug: legacy-evidence-is-migrated
priority: p2
profile: implementation
parallel_safe: true
objective: "Migrate existing evidence to the converged model with explicit lossless handling where possible, never fabricate a historic measurement, delete the redundant state readers once nothing calls them, and generate the documents and claim traceability from the canonical model."
why: "A converged model that leaves the old readers in place is one more copy. The pack's acceptance forbids duplicate manual registration per surface, and the register of duplicated facts (I2226) would gain rows. Source: convergence prompts/01-canonical-execution-evidence.md Issue 01.5 'Migration and observability'."
current_state: "The shell tool and the executable each read evidence (lib/evidence.sh, apps/majordomus-cli/src/evidence/ledger.rs); recorded runs live under .ai/repo/evidence; migrate carries layer migrations (lib/migrate.sh). Which readers become redundant is known only after I2325."
desired_state: "A migration reads every tracked evidence record into the current schema, leaving a field no record had as absent. Each reader made redundant is removed in the change that removes its last caller, and the list of removed readers is in the commit. The evidence document and the claim pages are generated from the model, and the report of the migration names the commands that prove it."
scope:
  - "apps/majordomus-cli/src/evidence/ledger.rs"
  - "lib/evidence.sh"
  - "lib/migrate.sh"
  - ".ai/repo/evidence"
  - "docs/EVIDENCE.md"
  - "docs/CLAIMS.yaml"
non_scope:
  - "Rewriting a recorded run's outcome."
  - "Deleting a reader that still has a caller."
depends_on:
  - I2325
acceptance_criteria:
  - "Every tracked evidence record reads under the current schema, and no migrated record carries a measurement its source lacked"
  - "No function that reads evidence state exists twice, and the removed readers are named"
  - "The evidence reference is regenerated by the derive and agrees with the model"
validation:
  - "bin/majordomus plan validate"
  - "scripts/evidence-check"
  - "scripts/derive-check"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the cases this issue adds>"
evidence_required:
  - "legacy_evidence_migration"
  - "redundant_readers_removed"
created_at: 2026-10-10
updated_at: 2026-10-10
