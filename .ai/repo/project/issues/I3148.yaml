id: I3148
milestone: entry-proves-what-it-handed
title: "An episode records the governance digest and the briefing digest it was handed at start"
slug: an-episode-records-what-it-was-handed
priority: p1
profile: implementation
objective: "Write governance_digest and the governance manifest into session.started, and append a session.briefed event carrying briefing_digest once the start briefing has been derived; the preflight and the brief show the recorded values; an episode that edited files with no session.briefed receipt is flagged where the policy and the provider promise a briefing."
why: "docs/PREFLIGHT.md on master: 'No compiled context revision exists in a checkout yet, so none is shown.' The 2026-09-10 brief asked for evidence that auto-load happened (a load receipt per episode). Proposed in ADR 0181 (An episode records the governance and the briefing it was handed, each by one digest) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c097#2."
current_state: "session.started carries neither digest; case 127 judges briefing freshness by HEAD and tree only."
desired_state: "The governance digest is recorded per episode at open and the briefing digest as a delivery receipt; both are shown; a missing receipt is a finding where one was due."
scope:
  - "share/events.yaml"
  - "apps/majordomus-cli/src/session"
  - "apps/majordomus-cli/src/environment/preflight.rs"
  - "apps/majordomus-cli/src/capability/builtin/brief.rs"
  - "lib/capture.sh"
  - "docs/PREFLIGHT.md"
non_scope:
  - "Changing what the briefing contains"
depends_on:
  - "I3147"
  - "I3142"
serves:
  - "entry-proves-what-it-handed#episode-pins-what-it-was-handed"
acceptance_criteria:
  - "session.started names the governance digest, and session.briefed the briefing digest"
  - "The preflight shows the recorded briefing digest instead of 'none'"
  - "An episode with edits and no receipt is reported where a briefing was due"
validation:
  - "bash test/run.sh 127_briefing_freshness 190_entry_is_automatic"
evidence_required:
  - "case_episode_pins_what_it_was_handed"
created_at: 2026-10-18
updated_at: 2026-10-18
