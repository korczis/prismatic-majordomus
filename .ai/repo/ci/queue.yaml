version: 1

# ---------------------------------------------------------------- what this workflow is for
# `majordomus prs` answers the question this repository cannot ask GitHub: what each open pull
# request is to the current master, decided by git on a machine that has the derived merge
# driver (docs/INTEGRATION.md, ADR 0101). GitHub cannot run a per-clone driver, so it marks
# nearly every pull request CONFLICTING and its own answer is worthless — which is how sixteen
# pull requests, fifteen of them cleanly mergeable, once sat open at once (rule
# project.accumulation-is-measured).
#
# The command existed and nothing ran it, so the answer existed only when somebody thought to
# ask. On 2026-09-15 five sessions spent a night relaying that state to each other by hand.
# This runs it on a clock and publishes the verdict, so the queue's state is a measurement
# rather than a conversation.
#
# WHAT IT DELIBERATELY DOES NOT DO. It runs `prs refresh` and `prs status`, which observe and
# render, and never `prs drain` or `prs cleanup --apply`, which act. Integration is one merge
# at a time under a lease, verified after each (ADR 0101); an automation that quietly took that
# power on a schedule would delete a decision somebody made on purpose. So the queue's state
# becomes automatic; the merge stays a decision with an approval behind it. The token is
# read-only, which also means the branch protection cannot be read on the runner: the report
# then says so (exit 10), and no pull request is called `ready` from here.
trigger:
  branch: master
  schedule: '*/30 * * * *'

report:
  command: majordomus prs refresh && majordomus prs status
  # exit 10 is a finding about the queue — a stale observation, an unread protection — and not
  # a fault of this run, so it does not fail the job. Exit 12 is "the measurement could not be
  # made" and does: a report nobody can trust is worse than no report, and a green job that
  # measured nothing is the shape this repository has paid for repeatedly.
  fails_on: unusable
