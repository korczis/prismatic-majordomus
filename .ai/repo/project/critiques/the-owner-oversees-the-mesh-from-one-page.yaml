intent: the-owner-oversees-the-mesh-from-one-page
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: 6 of 9 findings are blocking, 5 of them planned. One stays open (blackboard-dependency-is-prose-only): the I2983 record it must depend on exists only on 5a's unlanded branch, and the open finding holds I3137 and I3138 until that record lands. Of the non-blocking findings, 2 are planned and 1 is open for the owner's skill and route decision."
findings:
  - id: blackboard-dependency-is-prose-only
    class: unproven_assumption
    subject: "I3138"
    finding: "I3138 says it 'starts after [5a's I2981-I2983] land', but its depends_on lists only I3137, and I3137's depends_on is empty. The plan will therefore derive I3137 as READY now and I3138 as READY right after it, before blackboard.snapshot, http/follow.rs, share/ui/live.js and share/ui/socket.js exist on master (707a04c7ce8). A worker who starts then would build a second live mechanism into /ui/mesh. The plan's premise that 'no record of them is in this tree' is true only of master: .ai/repo/project/issues/I2983.yaml and milestones/peer-blackboard.yaml are committed on feature/the-peers-screen-follows-the-blackboard (fa1571ff0a7), with stable ids. Fix: make I3138 (and I3137, whose entry must name blackboard) depend on I2983 or on milestone peer-blackboard, recorded when 5a lands. Until then neither issue may be READY."
    blocking: true
    resolution:
      state: open
      because: "Confirmed: I2983 and milestone peer-blackboard exist only on 5a's unlanded branch fa1571ff0a7, not in this tree, so depends_on_add I2983 would name a record the plan cannot resolve. No other existing record stands in for the blackboard. Leaving this blocking finding open is the honest state and has the required effect: it refuses work on I3137 and I3138 until 5a's records land. The amendments add the dependency as acceptance criteria now. When I2983 is on master, depends_on I2983 is recorded on both issues and this finding closes."
  - id: a-second-page-for-the-blackboard
    class: unnecessary_work
    subject: "I3138"
    finding: "5a's I2983 already delivers most of this criterion on /ui/peers (apps/majordomus-cli/src/ui/peers.rs at fa1571ff0a7):\n- It renders blackboard.snapshot: workers, intents, claims, claims that meet, reviews and handovers that wait, and every source with its state.\n- It follows /events?follow=blackboard&frames=snapshot through live.js and reads the screen again after a reconnection, without a reload.\n- It keeps a live/reconnecting/offline state line.\n\nI3138 would make /ui/mesh compose blackboard.snapshot, mesh.peers and mesh.state again. That is the second join that blackboard.rs's header forbids ('joins them once, so that no surface joins them again'), and it gives the owner two mesh pages, plus /cockpit/mesh, /cockpit/peers and /ui/observatory. That contradicts the criterion's 'one /ui page'. ADR 0209 fixes the page as /ui/mesh without weighing /ui/peers. The reconnect and resnapshot are also covered by I3181 and I3222 in other intents. Note also that the UI snapshot withholds /ui/peers until I2984, which matters for I3139's 'disabled in the snapshot'. Fix: name one page (either /ui/peers, or /ui/mesh rendering the blackboard through http::follow::blackboard). Shrink I3138 to the delta: age on every figure, the unresponsive wording, blockers. State what becomes of the other mesh pages."
    blocking: true
    resolution:
      state: planned
      issue: I3138
      because: "The one page is /ui/mesh, as ADR 0209 (proposed) fixes until the owner names a route. It renders the blackboard through 5a's shared read and renderer, never a second join. I3138 shrinks to the delta over I2983: the source and age of every figure, the runtime's liveness words and the blocker source. /ui/peers stays the blackboard's own screen, linked from /ui/mesh and not re-rendered there. Its objective and desired state are rewritten to that delta in the plan. The cockpit pages and the follower guarantees of I3181/I3222 are out of scope. The snapshot form of the page follows I2984."
  - id: liveness-and-blocker-words-do-not-exist
    class: unproven_assumption
    subject: "the-owner-oversees-the-mesh-from-one-page#the-mesh-is-overseen-from-one-page"
    finding: "The words the criterion and I3138's acceptance criteria rely on come from no capability:\n- **Liveness:** the runtime's StreamLiveness is only own/live/expired (mesh/journal.rs:1265-1272). Nothing says 'unresponsive' or 'disconnected', and ui/mesh.rs:98 draws 'expired' in the same rose tone as 'gone'/'dead'. So 'a peer that stopped answering reads unresponsive, never failed' would mean either the page inventing a verdict (against the intent's first two invariants and ADR 0089) or a runtime vocabulary change that no issue scopes (the milestone forbids adding capability surface).\n- **Resynchronising:** live.js's SAID says 'reconnecting', not 'resynchronising'.\n- **Blocker:** nothing on master gives 'blocker' a source. It is either the blackboard's waits (5a) or I3182's classification (milestone the-runtime-supervises-itself), and I3138 depends on neither.\n\nFix: write the acceptance criteria in the runtime's words (expired, plus the link state mesh.peers reports), or plan the vocabulary change in the capability. Name the blocker source and depend on it."
    blocking: true
    resolution:
      state: planned
      issue: I3138
      because: "Confirmed: StreamLiveness is own/live/expired (mesh/journal.rs:1265-1272). The amendments write I3138's criteria in the runtime's words: expired, the link state mesh.peers reports, and live.js's 'reconnecting'. Expired is drawn apart from gone/dead without the page inventing a verdict (ADR 0089). Blockers come from I3182's classification and the blackboard's waits, with depends_on I3182 added. That edge is acyclic: I3182 has no dependency on I3138. The earlier 'unresponsive' and 'resynchronising' acceptance criteria are struck from I3138, and the intent's criterion and second invariant are restated now in these words: expired, the link state, reconnecting, every blocker naming its source."
  - id: the-page-chooses-the-actions-author
    class: regression_risk
    subject: "I3139"
    finding: "'Authorised as those capabilities already are' means nothing authorises a browser click today. mesh.review.request and mesh.handover.publish over plain HTTP need the caller to name the session (capability/builtin/mesh.rs:272-285, session_of: 'over the command line or plain HTTP there is no calling session'). This node then signs the event with its own key: the signing-oracle shape ADR 0126's Context describes. On loopback the only guard is the Origin check (http/router.rs:605-615, 875-897). So the page would pick the author string, against invariant 3, and identity would be deferred, which the source critique (c296#18) says not to do.\n\nI3192 (the other intent) requires an ADR amending 0126, deciding how a mesh event names its human author, 'accepted before any code'. Yet I3139 ships the action first, and I3192 builds on it. The acceptance criterion 'an unauthorised client is refused by the capability' is already proven by case 1086 (the router refuses beyond loopback) and adds nothing. 'Requesting a review or publishing a handover' also leaves the action undecided; handover.publish would publish the server checkout's newest handover. Fix: pick one action and state which session or identity it is written under, refusing without one. Or sequence I3139 behind I3192's ADR, or merge the two."
    blocking: true
    resolution:
      state: planned
      issue: I3139
      because: "Confirmed by session_of in capability/builtin/mesh.rs. I3139 picks one action, mesh.review.request, and writes it only under the identity resolved by I1205 (web-sign-in, depends_on added), refusing without one. The page never supplies a session or author string. The ADR amending 0126 on how a mesh event names its human author moves into I3139: it is proposed there and must be accepted by the owner before any code. I3192 then builds on that ADR instead of following it. No cycle results: I1205 does not depend on I3139. The vacuous criterion is struck and replaced by a named test that adds proof beyond case 1086, and the intent criterion one-action-reads-its-result-from-the-journal now names the action and the resolved identity."
  - id: case-28-cannot-hold-the-term
    class: unproven_assumption
    subject: "I3137"
    finding: "Case 28's vocabulary check (test/cases/28_no_hardcoded_values.sh:173-179) matches only lowercase bold rows (`^\\| \\*\\*[a-z ]+\\*\\*`). The word must also appear in docs/, lib/, bin/majordomus or share/ outside CONCEPTS.md; apps/ and .ai/repo/adrs are not searched. I3137's desired state is 'One CONCEPTS entry, the ADR accepted, nothing else'. With that:\n- A lowercase **lumen** row fails case 28 ('appears nowhere else in the repository').\n- A capitalised **Lumen** or **Prismatic Lumen** row is skipped by the regex, so the case passes vacuously.\n- Case 28 never refuses a lumen.* registry, contrary to the objective's claim.\n- The acceptance criterion 'the entry names only capabilities that exist' fails while blackboard.snapshot is unlanded, yet I3137 has no depends_on.\n- 'Once the owner accepts the Lumen ADR' (0209, proposed) is not encoded anywhere the plan can read.\n\nFix: add the lowercase term in the same change as the first surface that says it (docs/MAJORDOMUS_UI.md, inside I3138). Or defer the row until the owner decides route/skill/command (ADR 0209), and gate I3137 on that decision."
    blocking: true
    resolution:
      state: planned
      issue: I3137
      because: "Confirmed against case 28 lines 173-179. I3137 adds the row as lowercase **lumen**, so the regex reads it. In the same change docs/MAJORDOMUS_UI.md says the word, so the row is not vacuous. The claim that case 28 refuses a lumen.* registry is struck: rule project.no-new-nouns and ADR 0209 hold that line. The row is gated on ADR 0209 being accepted, and the gate is checked from the ADR's status field. Its objective and desired state are rewritten accordingly. The 'capabilities that exist' criterion stays unready behind the open blackboard finding, which already refuses work on this intent until 5a lands."
  - id: latency-baseline-has-no-instrument
    class: insufficient_work
    subject: "I3140"
    finding: "No tool measures first paint, event-to-screen or subscription recovery of a /ui page. .ai/repo/benchmarks/README.md requires a baseline to be 'regenerated by the command that measures it, never edited by hand'. The pages baseline holds site build timings (scripts/pages), and the only browser timing code is in scripts/lib/ui-observatory.mjs. Yet I3140's scope (.ai/repo/benchmarks, docs/PERFORMANCE.md) excludes scripts/, where the instrument must live, and its validation is only `majordomus plan validate`. Other gaps:\n- 'First paint from cache' assumes a client cache; share/ui has no service worker or caches API.\n- 'Warm status' names no capability or route.\n- I3140's own `why` already states the targets (p95 under 100 ms, under 250 ms, under 5 s), so the record breaks its own criterion that no target appears in prose before the baseline.\n- ADR 0196 makes latency targets budgets of benchmark policy, but I3140 says nothing of where its targets would be declared.\n\nFix: scope the measuring script and its route list, drop or define 'from cache', strike the numbers from the record, and declare targets as benchmark-policy budgets."
    blocking: true
    resolution:
      state: planned
      issue: I3140
      because: "The instrument enters scope: scripts/ui and scripts/lib, beside ui-observatory.mjs, with a declared route list. 'From cache' becomes cold and warm loads, with no client cache assumed. 'Warm status' names its route. I3140's why no longer carries the numbers, and the intent criterion now says the baseline is regenerated by its command and targets are budgets. Targets are declared only as budgets in .ai/repo/benchmarks/rust/policy.yaml beside the UI budgets (ADR 0196, I2489), each citing the baseline it came from. The baseline is regenerated by the measuring command, never hand-edited, per .ai/repo/benchmarks/README.md."
  - id: criteria-can-never-be-satisfied
    class: delivery_verification
    subject: "the-owner-oversees-the-mesh-from-one-page"
    finding: "All three criteria carry `evidence: command` with ref `majordomus intent explain the-owner-oversees-the-mesh-from-one-page`. The ledger settles only test and claim (intent.rs:301-303); a command is NotDerivable, so the verdict stays Unknown forever (intent.rs doctest at 318-320). Master intents bind each criterion as `evidence: test` with a test path (e.g. the-owner-directs-work-from-the-ui to tests/ui_idd.rs). No issue's acceptance criteria rebind a criterion to its case or test once that exists. Validation also misses the required proofs:\n- I3138 runs `scripts/ui audit --only /ui/mesh` and plan validate, not the reconnect case it requires; --only also marks the audit partial (scripts/ui:13).\n- I3139's `cargo test --lib ui::` names no test.\n- No issue checks the published snapshot (cases 1092/1093) or that the release carries the page.\n\nFix: each issue sets its criterion to evidence: test with the case or test path, and its validation runs `bash test/run.sh <case>`."
    blocking: false
    resolution:
      state: planned
      issue: I3138
      because: "Confirmed: ledger_settles in intent.rs accepts only test and claim. Each of I3138, I3139 and I3140 now rebinds its criterion in .ai/repo/project/intents/the-owner-oversees-the-mesh-from-one-page.yaml to evidence: test, with the case or test path it adds. Each also runs that case. The validation of I3138 and I3139 now runs the full ui audit rather than --only and cases 1092/1093 for the snapshot, and I3139 runs cargo test --lib, which holds its named test."
  - id: two-intents-split-one-v0-1
    class: unnecessary_work
    subject: "prismatic-lumen"
    finding: "Intent the-mesh-is-operated-from-any-device was promoted from the same 10-18 conversation, and its milestone the-mesh-is-operated-from-one-page depends on prismatic-lumen. It re-plans the same page and action:\n- I3192: 'The action is the one I3139 offers', and its acceptance criterion repeats I3139's snapshot 'live only' rendering even though its non_scope says I3139 delivers it.\n- I3181: 'a gap triggers a resnapshot and says resynchronising', which is I3138's criterion.\n- I3191 also excludes I3138's per-figure age.\n\nThe split leaves an unauthorised action in this intent and its authorisation in the other. The ids invite confusion: 'the-mesh-is-operated-from-one-page' is the other intent's milestone, while this intent is 'the-owner-oversees-the-mesh-from-one-page'. Fix: fold the two intents or state the boundary in both (for example, this one is loopback read plus the action; that one is remote reach and authorisation). Remove the duplicated acceptance criteria from I3192 and I3181, and consider renaming the milestone."
    blocking: false
    resolution:
      state: planned
      issue: I3139
      because: "This intent states the boundary in I3138 and I3139. This intent is the loopback read, plus one action written under a resolved identity together with its ADR. The other intent is remote reach and remote-caller authorisation (I3191, I3196, I3192), and gap and partition recovery across nodes (I3181, I3222). Removing I3192's and I3181's duplicated criteria and renaming milestone the-mesh-is-operated-from-one-page are edits to the other intent's records, which this critique cannot amend additively. They go to that intent's critique."
  - id: owner-named-surfaces-unplanned
    class: surface_missing
    subject: "prismatic-lumen"
    finding: "In message c296#0 the owner asked for a robust skill, documentation, the landing page, the UI and GH Pages, usable from PC and mobile. The plan covers /ui and docs/MAJORDOMUS_UI.md only. Uncovered, with neither an issue nor a non_goal:\n- **The skill:** ADR 0209 leaves skill/route/command to the owner, but the intent records neither an open question nor a non_goal for it.\n- **The landing page:** site/content.\n- **/cockpit/mesh:** apps/majordomus-cli/src/cockpit/mod.rs:120,267 will drift from the chosen page.\n- **The phone:** a phone cannot reach a loopback server, and remote reads are I3191/I3196 of the other intent, yet the milestone problem promises 'desktop, phone'.\n\nThe milestone also says 'in Claude Code', which nothing delivers. Fix: add the skill and site entries as issues or explicit non_goals or owner questions, say what /cockpit/mesh becomes, and either remove 'phone' from the problem or depend on the reach work."
    blocking: false
    resolution:
      state: open
      because: "The skill, CLI command and route are decided by the owner (ADR 0209: 'decided by the owner separately'). Until that decision the question stays open, not planned. The rest is handled by additive amendments. Phone and other-machine reach move to non_scope as I3191/I3196's work, and the intent's non_goals now name that reach and a skill, command or route named lumen before the owner decides. /cockpit/mesh and /cockpit/peers are left as they are, because /ui is the primary surface (ADR 0135). The landing-page and Pages entry is a non_scope until the page exists and its public-safe snapshot (I2984) does. Removing 'phone' and 'in Claude Code' from the milestone problem is a milestone edit, made when the owner answers."
