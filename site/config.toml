# Zola configuration for the derived Prismatic Majordomus site.
# Content and data come from the repository; see docs/GITHUB_PAGES_ARCHITECTURE.md.
base_url = "https://majordomus.dev"
title = "Prismatic Majordomus"
description = "A lightweight supervisory control layer for AI-assisted work."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false
minify_html = false

[markdown]
insert_anchor_links = "heading"
# GitHub alerts are projected into Flowbite alerts by scripts/lib/project-markdown.awk (zero custom
# CSS); Zola's own alert markup would need styling, so it stays off.
github_alerts = false
render_emoji = false
external_links_target_blank = false
external_links_no_follow = false
smart_punctuation = false
bottom_footnotes = true

[markdown.highlighting]
# One highlighter on every surface (ADR 0166 §7). Zola 0.23 highlights with giallo; the
# executable embeds the same giallo and renders the Cockpit's and the reports' code blocks with
# this same theme, so a block carries the same classes wherever it is drawn. The theme is
# generated by `majordomus generate` (apps/majordomus-cli/src/highlight.rs): its classes name
# the kind of token, and share/design/code.css, imported by every stylesheet, colours each kind
# from the design tokens in both themes. The giallo.css Zola writes beside it is not used.
style = "class"
theme = "majordomus"
extra_themes = ["highlighting/majordomus.json"]

[link_checker]
internal_level = "error"

[extra]
repository_url = "https://github.com/korczis/prismatic-majordomus"
