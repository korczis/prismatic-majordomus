problem: "campaigns/ keeps 52 packs verbatim (ls -d campaigns/*/ | wc -l at 707a04c) with campaigns/MANIFEST.sha256, held by scripts/ci/campaigns-check and case 340, but its README says nothing loads them, share/kinds.yaml has no campaign kind, no intent, milestone or issue cites the pack that drove it, a new pack is copied in by hand, and ADR 0124 (proposed) leaves the ingestion noun open. Proposed in ADR 0180 (A prompt pack is a campaign: kept as received, indexed as a kind, and cited by the records it drove) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c245#11."
