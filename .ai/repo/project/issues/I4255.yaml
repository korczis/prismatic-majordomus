id: I4255
milestone: a-second-adopter-is-served
title: "A project rule can be enforced by a command the repository names"
slug: a-project-rule-names-a-command-validator
priority: p1
profile: implementation
parallel_safe: true
objective: "A project rule may declare a command (repository-relative, with arguments) as its validator; doctor runs or reconciles it like a dispatched doctrine, and `rules list` reports it enforced."
why: "An adopter's field report (a private Python client repository adopted from the v1.0.0-alpha.8 release on 2026-10-27, with the plan model, project rules, knowledge, skills, Claude Code capture and a GitHub projection all in use) found: every project rule the adopter wrote reported 'no validator; see the rule', because x-majordomus.validator must name an mj_validate_* function in the tool's lib/; the adopter's own checks (commit traceability, link integrity, wiki currency) ran in hooks Majordomus could not see as the rule's enforcement."
current_state: "Only the tool's own validators can back a rule; a project rule is documentation."
desired_state: "A project rule may declare a command (repository-relative, with arguments) as its validator; doctor runs or reconciles it like a dispatched doctrine, and `rules list` reports it enforced."
scope:
  - ".ai/repo/project/issues/I4255.yaml"
  - "lib/rules.sh"
  - "lib/doctor.sh"
  - "share/allow/rule.txt"
  - "docs/DOCTRINE.md"
  - "test/cases/4255_a_project_rule_runs_its_command.sh"
depends_on: []
acceptance_criteria:
  - "A project rule with a command validator is reported enforced and fails doctor when the command fails"
  - "A command that does not exist is a wiring failure naming the rule"
validation:
  - "bash test/run.sh 4255_a_project_rule_runs_its_command"
evidence_required:
  - "case_a_project_rule_names_a_command_validator"
