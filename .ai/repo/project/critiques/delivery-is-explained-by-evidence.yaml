  - id: comparison-derives-from-an-unnamed-measurement
    class: unproven_assumption
    subject: I2370
    finding: "I2370 writes docs/generated and site data through the derive from the tracked baseline and a current measurement taken the same way (gh calls), but does not say the current measurement is a tracked record or that I2341 declares it as an input; a derive that reads an untracked or network-sourced measurement breaks derive-check on any other machine and rule project.derived-once."
    blocking: false
    resolution:
      state: open
  - id: operation-identity-is-narrower-than-the-pack
    class: missed_requirement
    subject: I2350
    finding: "Convergence 01.1 asks the operation identity to carry HEAD, worktree, exact inputs and hashes, generator or capability version, environment identity and output digests; I2350 joins four ids and adds two edges and routes only the derive part to I2341, so executions and evidence runs gain none of the rest. The adversarial list of 01.4 (duplicate and reordered events, clock skew, corrupted payload) appears in none of I2351-I2353."
    blocking: false
    resolution:
      state: open
  - id: input-declarations-are-unenforced-on-real-generators
    class: unproven_assumption
    subject: I2343
    finding: "The skip of I2343 and the selection of I2344 trust the declarations of I2341, whose only refusal of an undeclared read is over a fixture generator, and I2345 mutates declarations over stand-in generators. A real generator that reads an undeclared input (git history, environment, the machine dependence I1409 records) makes a derive report that nothing changed while the tree is stale; only a later full derive-check would notice."
    blocking: false
    resolution:
      state: open
  - id: high-level-ui-and-derive-facts-have-no-owner
    class: missed_requirement
