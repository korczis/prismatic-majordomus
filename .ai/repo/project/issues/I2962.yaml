  - "test/cases/3363_what_mutates_is_said_as_it_is.sh"
depends_on: []
acceptance_criteria:
  - "The interfaces feature names exactly the capabilities whose registry effect is repository_mutation, and a page that drops one is refused"
  - "No retired read-only or one-command sentence remains in README, docs or the features"
  - "README's mesh paragraph states exclusivity as the milestone records it"
validation:
