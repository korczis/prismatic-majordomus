objective: "Emit the warning gap_observation_contradicted from Intents::build, which holds the gaps, the coverage and the evaluated criteria, one per required criterion whose remains is failed on gap_observation, through intent_remains::remains; it changes neither the exit nor the failure count, and reaches intent oppose as an advisory structural finding. Case 969 builds a fixture whose gap observed a criterion satisfied with no serving issue, records a failing run, and asserts the warning, the unchanged exit, the advisory finding and a byte-identical tree. Document the outcome table beside stage, verdict and evidence state in docs/PLANNING.md and the fields in docs/CLI.md, add the claim and its page, and measure this repository's own intents in the pull request."
why: "Coverage takes a gap's satisfied observation as served, and when the evidence later fails nothing says the plan rests on a broken observation."
current_state: "Nothing compares a gap's satisfied observation with the evidence."
desired_state: "One warning, for the one fact nothing else reports."
