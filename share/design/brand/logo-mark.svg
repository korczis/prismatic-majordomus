<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Prismatic Majordomus">
  <title>Prismatic Majordomus</title>
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- one incoming beam: the canonical policy -->
    <path d="M4 32h16"/>
    <!-- the prism: the supervisory layer -->
    <path d="M32 12 46 52H18Z"/>
    <!-- three outgoing beams: the workers -->
    <path d="M44 24l16-8"/>
    <path d="M46 32h14"/>
    <path d="M44 40l16 8"/>
  </g>
  <g fill="currentColor">
    <circle cx="60" cy="16" r="3"/>
    <circle cx="60" cy="32" r="3"/>
    <circle cx="60" cy="48" r="3"/>
  </g>
</svg>
