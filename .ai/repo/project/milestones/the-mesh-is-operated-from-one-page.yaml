id: the-mesh-is-operated-from-one-page
title: "The owner operates the mesh from one page: every runtime readable, one action authorised end to end"
slug: the-mesh-is-operated-from-one-page
order: 173
priority: p2
problem: "On 2026-10-18 the owner asked for a skill and one page ('prismatic-lumen') to control the whole mesh from PC and mobile, report periodically and stay up to date; on 09-15 for a Cockpit whose default backend is lundra. /ui/mesh reads only the local runtime and offers no authorised action. Proposed in ADR 0201 (The persistent runtime is the authority; every operator surface, Lumen included, is a client of it); ADR 0209 (Prismatic Lumen names the owner's mesh-wide view, and it owns no scheduler, event bus, store or API) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c296#18, chatgpt-majordomus:c138#0."
outcome: "/ui reads any linked runtime and says which runtime every reading came from, and one mutating operation is authorised, audited and streamed back."
current_state: "Verified: /ui/mesh (apps/majordomus-cli/src/ui/mesh.rs) reads the local server; ADR 0126 refuses remote writes without authentication; web-sign-in (I1201-I1208) is open; the peer blackboard (I2980-I2983, 5a) is in flight with no records yet."
desired_state: "A backend-target choice derived from mesh nodes, an audited action path, runtime-scheduled reports, measured SLOs."
scope:
  - "apps/majordomus-cli/src/ui"
  - "apps/majordomus-cli/src/capability/builtin/executions.rs"
  - "apps/majordomus-cli/src/execution"
  - "docs/MAJORDOMUS_UI.md"
non_scope:
  - "A Lumen backend or repository (open question)"
  - "Federation with a second project"
  - "Natural-language control without the typed operation underneath"
acceptance_criteria:
  - "Every reading names the runtime it came from"
  - "No operation reachable from the page bypasses authorisation"
validation:
  - "majordomus plan validate"
evidence_required: []
depends_on:
  - "web-sign-in"
  - "prismatic-lumen"
risks:
  - "False authority: the page must never say healthy without evidence (10-18 critique)"
  - "It follows everything-is-followed-in-one-stream in practice; the edge is kept off the milestone so two milestones of one order are not reordered."
created_at: 2026-10-18
updated_at: 2026-10-18
