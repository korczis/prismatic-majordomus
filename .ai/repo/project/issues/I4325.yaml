id: I4325
milestone: test-evidence
title: "node:test and Playwright are runners in code, so a claim proven by an adopter's JavaScript suite can be recorded, and an unproven intent names the runner set as its cause"
slug: node-test-and-playwright-are-runners
priority: p1
profile: implementation
parallel_safe: true
objective: "Two new variants of Runner (apps/majordomus-cli/src/evidence/mod.rs:207), each with a branch in TestId::of (:450) and a reader in the recorder (evidence/record.rs). This follows docs/EVIDENCE.md:87-89: a third runner is a code change, not configuration. Runner::Node is node's built-in test runner. Its paths are the file names `node --test` finds by default (`*.test.{js,mjs,cjs}`, `*-test.*`, `*_test.*`, `test-*.*`, `test.*`, and files under a `test/` directory), its id is `node:<path>`, and its report is the TAP stream of `node --test --test-reporter=tap`, one top-level test per file. Runner::Playwright is @playwright/test. Its paths are the `*.spec.{js,jsx,ts,tsx,mjs,cjs}` half of its default testMatch. The `*.test.*` half is left to node, so that no path belongs to two runners. Its report is the file its JSON reporter writes. `majordomus evidence record --origin ci --runner node|playwright --report <file>` reads the report at the commit and tree it was run on, and merges it into the ledger as record does for test/run.sh and cargo today. Majordomus never runs node or a browser itself. The runner answers EVIDENCE.md's objection, 'a runner nothing executes is a runner whose results nothing can record', because each variant comes with the reader for the report its runner writes. Second, separately: a criterion whose claim names a path no runner drives keeps that cause up to the intent. Today intent.rs:216-217 folds ProofState::Unrunnable and NoTest into IntentEvidenceState::NotRun, so closed_work_unproven (intent_realization.rs:795-805) says 'no recorded run'. After the change it says `criterion <c> cites <path>, which no runner drives (runners: suite test/cases/*.sh, crate apps/majordomus-cli/tests/*.rs, ...)`. A missing runner and a missing run then read differently."
why: "Observed in OSCILLA (korczis/oscilla) on 2026-10-28 with majordomus 1.0.0-alpha.8. `majordomus evidence show` reports 87 claims: 82 unrunnable ('the claim guarantees a behaviour and names a path no runner drives', which covers OSCILLA's tests/unit/*.test.mjs, run by `node --test`, and its tests/browser/*.cjs suites), 5 with no test, and 0 executions recorded. Every intent criterion that cites a claim therefore stays unmet. All 12 OSCILLA intents read 0 met while their milestones are DONE, and closed_work_unproven says only 'no recorded run', so the first reading was that tests were missing. The tests exist and run in CI. What is missing is a runner Majordomus knows. The owner's goal of clean zeros cannot be reached from the repository side, because TestId::of on master 81ef931a3e1 knows test/cases/ and apps/majordomus-cli/tests/ only, and EVIDENCE.md rules out declaring a runner in the layer. I3124 (JUnit import, behind I2786 while I1954 is blocked, ADR 0189 proposed) defines no mapping from an imported case to a claim's test path, so its executions would not discharge these claims either. The coarser route is I3395 (p0): a verify:<name> criterion cites a verification the profile declares, and a recorded passing run at the current tree makes it current. It would turn OSCILLA's command criteria (59 of its criteria are `evidence: command`) into derivable ones, but it is unimplemented (no started_at). OSCILLA's tests/browser/*.cjs are plain node scripts that drive the Playwright library through their own harness, not @playwright/test, so they match neither default. That is OSCILLA's side to change, by moving them under @playwright/test or reporting them through node:test."
current_state: "On master 81ef931a3e1, Runner has two variants (Suite, Crate), TestId::of returns None for any other path, evidence classes such a claim as unrunnable (evidence/freshness.rs:564-565, :679), and the intent read reports the same claim as 'no recorded run'."
desired_state: "In a repository whose claims cite *.test.mjs files, a recorded node:test TAP report at a commit makes each claim passed or failed at that commit and stale after it, through the same freshness rule (evidence/freshness.rs), and the same holds for a Playwright JSON report. A path that matches no runner is still unrunnable, and closed_work_unproven says so with the runner set. This repository's own suite and crate paths resolve as before."
