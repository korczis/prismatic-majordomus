  - "Binding only the tailnet and LAN addresses rather than every interface: the bind follows the existing 0.0.0.0 path the hubs and MAJORDOMUS_HTTP_HOST use."
  - "Self-update of an installed release (docs/DISTRIBUTION.md, plan safe-self-update)."
