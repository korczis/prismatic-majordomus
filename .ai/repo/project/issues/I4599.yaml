id: I4599
milestone: a-second-adopter-is-served
title: "A step that waits says whose turn it is: when every unfinished issue waits on the person, proceed.step orders wait_on_person, names each pull request the person must act on, and steps again on the policy's person cadence"
slug: a-wait-on-the-person-names-the-levers
priority: p2
profile: implementation
parallel_safe: true
serves: []
objective: "proceed.step's wait carries the class of every wait it found: a dependency, another worker, a milestone gate, or the person. A wait is the person's when the unfinished issue depends on an issue whose open pull request (matched through the assessment's issue, model.rs:1179-1184) is recorded with a disposition that only a person's act releases: WaitingForReview (a person reviews), Conflicting (a person resolves) or Unsafe (a person disarms). When every wait is the person's, the order is `wait_on_person`. It lists each such pull request with its number and disposition, and its next_due_at follows the cadence the policy declares for the person. The report it announces says so in one line, so a loop that proceeds stops polling every five minutes for an act only the person can take."
why: "Observed on 2026-11-14/15 in a client adopter (a service repository, not named here by policy). A self-paced session loop ran for about 44 hours while every next step was the owner's: seven reviewed pull requests to merge, a deploy approval, and four product decisions. Each tick rebuilt the same picture by hand from git, the forge and the plan, and concluded that nothing could start until the owner acted. The tool already holds the deciding facts. The integration dispositions say which pull request waits on a person. But proceed.step words every wait alike ('each waits on a dependency, its milestone's gate or another worker') and steps again every 300 s."
current_state: "Measured at origin/master 3fcaafac355. capability/builtin/proceed/step.rs:355 (waiting) answers OrderOutcome::Wait with the decision's reason, or for an intent the sentence at :377, which does not tell the person's waits from a worker's. CADENCE_SECONDS (:56) is 300 for every wait. integration/model.rs:377 (WaitingForReview), :384-385 (Conflicting, 'a person resolves them') and :390-391 (Unsafe, 'held until a person disarms it') already classify a pull request's wait on a person. The assessment carries the issue it serves (model.rs:1179-1184), and the summary lives under the checkout's integration state (integration/mod.rs:83). proceed.rs and step.rs read none of it."
desired_state: "proceed.step's answer carries `waits`, each with class dependency, worker, gate or person and the record it waits on. When every wait is class person, the outcome is wait_on_person, `levers` lists each pull request with its number and disposition, and next_due_at is the next boundary of `proceed.person_cadence_seconds` after the moment of the step, using the same arithmetic the work cadence uses. When the policy declares no person cadence, the outcome and levers are the same, the work cadence applies, and the answer says the person cadence is undeclared. A declared value below CADENCE_SECONDS is refused. The announced report reads 'waits on the person: <n> pull request(s)' and names the first three. With any wait of another class, the order is Wait on the work cadence, as today."
