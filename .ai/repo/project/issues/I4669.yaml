  - "share/allow/owner-answer.txt"
  - "lib/answer.sh"
  - "lib/commands.sh"
  - "lib/doctor.sh"
  - "lib/project.awk"
  - "docs/CLI.md"
  - "test/cases/4669_an_owner_answer_carries_its_provenance.sh"
  - ".ai/repo/project/issues/I4669.yaml"
  - "site/content/plan/I4669.md"
non_scope:
  - "Asking the owner: the provider's question tool or the terminal asks, and this records what was asked and answered"
  - "Typed coordination records in the mesh journal: I4665"
  - "Attributing a record to the session that wrote it: the other issues of M002"
  - "Rewriting the existing prose answers in issue records: a later change cites them once the kind exists"
depends_on: []
acceptance_criteria:
  - "Case 4669: a fixture session records an answer with channel question-tool, a question, two offered options and the chosen answer. The record carries the session id and both times without the caller typing them, and `answer show` prints the question and answer byte for byte"
  - "`answer relay` from the asking session to a second fixture session appends one hop with both sessions and the time, and the receiving session's `answer show` lists the hop"
  - "A rule file citing owner-answer:<id> passes the validator. A citation to an id that does not exist is refused, and a quoted answer that differs from the record by one word is refused. Both refusals name the record and the citing file"
  - "A record whose text the policy marks private is committed with its digest only, `answer show` in the checkout that holds the text prints it, and in a fresh clone it prints the digest and says the text is local"
  - "Negative control: with the validator reverted to master, the case finds the unresolved citation accepted"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=2 bash test/run.sh 4669_an_owner_answer_carries_its_provenance"
evidence_required:
  - "an_owner_answer_carries_its_provenance"
serves: []
