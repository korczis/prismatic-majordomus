id: I3025
milestone: truthful-plan-surfaces
title: "Every Knowledge tile reads whole at a phone's width"
slug: the-knowledge-tiles-fit-a-phone
priority: p1
profile: implementation
parallel_safe: true
objective: "The hero tiles of /ui/knowledge carry labels and written values that fit the kit's narrowest tile (9.5rem, about 152 px at 390 px): Unknown branch, Not learned from, and 'no ledger' where no session ledger is recorded, with a crate test that holds every tile label and the written value to the measured budget."
why: "Verified live on v0.30.1 (majordomus.dev, 9904000d2df) with headless Playwright at 390 px: the tiles read 'From an unknown …', 'Sessions not yet le…' and 'not recor…'. The kit truncates tile labels and values on one line; measured in the published kit at 390 px, a label of 18 characters fits and one of 22 does not, and a value of 9 characters fits and one of 10 does not. The kit itself is not changed here (2b's)."
current_state: "The tiles are labelled From an unknown branch and Sessions not yet learned from, and the ledger tiles read 'not recorded here'; all three are truncated at 390 px."
desired_state: "Every tile label is at most 18 characters and the value the screen writes is at most 9; a crate test holds both."
scope:
  - "apps/majordomus-cli/src/ui/knowledge.rs"
acceptance_criteria:
  - "No tile label or value of /ui/knowledge is truncated at 320 or 390 px on the commit's own binary"
  - "A crate test holds every tile label to 18 characters and the written ledger value to 9"
validation:
  - "cargo test --lib ui::knowledge"
  - "scripts/ui audit --only /ui/knowledge"
evidence_required:
  - "knowledge_tiles_fit_a_phone"
created_at: 2026-10-19
updated_at: 2026-10-19
