id: I2490
milestone: derived-data-integrity
title: "An incremental derive skips stage B only when nothing it can read changed and every output is as the last run left it"
slug: derive-skips-what-did-not-change
priority: p1
profile: implementation
parallel_safe: true
objective: "Give scripts/derive an opt-in incremental mode that leaves stage B (scripts/generate-site-data) alone when a typed key over everything the stage can read equals the key of this checkout's last successful stage B and every one of its outputs verifies on disk; keep the full derive the default and the oracle, and prove incremental equals full on a fixture."
why: "Measured 2026-10-12 on this Mac at load 25-30: a full derive took 546 s, 512 s of it stage B, and a derive after a test-only change took 415 s and changed 0 files. Stage B had no way to notice that nothing it reads had moved. Its own input hash (source_hash) cannot be that way: it misses the generator's own text, every sourced library but one, its awk and jq programs, site/content-src, the release records, the closed sessions and the executable its scenarios run (owner pack derive-pack, CHECKPOINT-01 HZ-5)."
current_state: "scripts/derive runs build, stage A, stage B, stage C and stage D on every call; stage B regenerates and rewrites every output each time."
desired_state: "`scripts/derive --incremental` (or MAJORDOMUS_DERIVE_MODE=incremental) asks `majordomus derive begin` before stage B and skips it on exit 0, runs it and calls `majordomus derive record` otherwise; `--shadow` runs it regardless and exits 13 when the run changed what the skip would have kept; `--full` and the default are today's derive. The key covers every tracked path's work-tree bytes and mode except stage B's own outputs (by name only) and the crate's tests and benches (by presence only), ignored files a glob could reach, the executable's generation, profile and target, the tools on PATH, the MAJORDOMUS_*/MJ_* and locale environment, git's global and system configuration, and the local use-case evidence. The record lives in the checkout's git directory and is written only after a successful stage B whose inputs did not move while it ran."
scope:
  - "scripts/derive"
  - "scripts/generate-site-data"
  - "apps/majordomus-cli/src/derive"
  - "apps/majordomus-cli/src/commands/derive.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/src/cli/local.rs"
  - "test/cases/400_derivation_is_one_graph.sh"
  - "test/cases/87_release_pipeline.sh"
  - "test/cases/1100_a_derive_skips_only_what_did_not_change.sh"
  - ".github/workflows/release.yml"
  - ".github/workflows/version.yml"
  - ".ai/repo/rules/project/derived-files-regenerated.v1.md"
  - "docs/GITHUB_PAGES_ARCHITECTURE.md"
non_scope:
  - "Making incremental the default: rollout steps 1-2 of the pack (DESIGN-11-12 §2.2) need a shadow window with zero divergences first."
  - "A policy key derive.mode: the flag and MAJORDOMUS_DERIVE_MODE suffice for an opt-in mode; the policy switch comes with the default."
  - "Splitting stage B into a scenario node and a projection node, a content-addressed store, skipping stages A and C or the build: later slices of the pack."
  - "scripts/derive-check, scripts/pages current, release.yml and version.yml consulting the record: they stay the full oracle."
acceptance_criteria:
  - "On a fixture, an incremental derive and a full derive after the same edit leave byte-identical trees for a no-op, a tracked input any list names, a tracked input no list names, a deleted output, a tampered output, a staged new file, an unstaged tracked change and a crate test edit; stage B is skipped exactly for the no-op and the test edit"
  - "A failed stage B records nothing, and the next incremental derive runs it"
  - "A shadow derive whose stage B changed an output under an unchanged key keeps the full bytes, writes the divergence and exits 13 after the last stage"
  - "The default derive makes exactly the four calls it made before; release.yml and version.yml derive with --full"
  - "The key's decision is typed Rust with unit tests for every reason; scripts/derive only asks and acts on the exit code"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib derive::"
  - "bash test/run.sh 400_derivation_is_one_graph 1100_a_derive_skips_only_what_did_not_change 87_release_pipeline"
  - "scripts/derive-check"
evidence_required:
  - "derive_incremental_equals_full_fixture"
  - "derive_no_op_measured_seconds"
depends_on: []
created_at: 2026-10-12
updated_at: 2026-10-12
