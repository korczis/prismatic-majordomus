acceptance_criteria:
  - "The case runs on the release candidate commit in CI"
  - "A failure at any stage names the stage"
  - "The case reuses the existing fixtures and adds no second installer"
  - "After I2717 lands, the first release record commit's evidence job is read by its failed steps, not its job conclusion, and recorded green in this issue's evidence, or the failing step is cited and handed back to I2717"
validation:
