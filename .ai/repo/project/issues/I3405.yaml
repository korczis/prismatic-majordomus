id: I3405
milestone: a-paste-is-decomposed-by-a-skill
title: "Every generated model-invocable domain skill follows the skill an unsuccessful answer names, so the MCP path does not end at a refused paste"
slug: domain-skills-follow-the-named-skill
priority: p1
profile: implementation
objective: "Put the rule I3402 gives the alias into the generic domain-skill text at apps/majordomus-cli/src/editors/claude.rs:179: an unsuccessful answer of a capability that changes something, when it names majordomus://skill/<id>, is followed by reading that skill (majordomus skills show <id> or majordomus://skill/<id>) with the same text; the capability is never called again with altered text; any other refusal is reported as it is. Reuse the sentence I3402 introduced rather than writing it twice, regenerate the 58 .claude/skills/mj-*/SKILL.md projections and extend docs/EDITORS.md."
why: "The owner's 2026-10-19 order covers every path a paste can take. Under T6 of the owner's report of 2026-10-19 a new user does not pick the alias; a model reaches majordomus_intent_propose through the model-invocable mj-intents skill, and that text today ends the turn at the refusal. Split from I3402 so the change to 58 generated files is reviewed alone; it depends on I3402 because both edit claude.rs, case 2980 and docs/EDITORS.md."
current_state: "apps/majordomus-cli/src/editors/claude.rs:179-181 says a capability that changes something is called once 'and if it is refused or its outcome is not known, report that as it is and do not try again by another way'. That sentence is line 26 of .claude/skills/mj-intents/SKILL.md and appears in all 58 tracked .claude/skills/mj-*/SKILL.md files (git ls-files '.claude/skills/mj-*/SKILL.md' | wc -l). No .agents/skills/mj-* projection exists."
desired_state: "An agent that reaches intents.propose through a domain skill and is refused for a paste continues into decompose-a-brief with the same text, and every other refusal behaves as today."
