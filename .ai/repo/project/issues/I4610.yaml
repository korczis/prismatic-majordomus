id: I4610
milestone: a-second-adopter-is-served
title: "The pre-push finish --check names a pushed tree that its branch's last finished task did not verify, and says what to do"
slug: a-push-names-a-tree-its-branch-did-not-verify
priority: p2
profile: implementation
parallel_safe: true
objective: "Once a task is finished, `finish --check` compares the tree of the commit a push publishes for this checkout's branch with the `verify.tree` of the branch's last `task.finished` event, and when they differ prints both tree ids and the remedy: re-run the verification over the pushed tree, or say why not. The policy key `verification.pushed_tree_unverified` (off, info, warning, error) decides the level; absent is warning, error refuses the push."
why: "On 2026-11-15 an integrator in an adopting repository verified one tree under `finish --verify-command` and would have pushed a different HEAD: the pre-push `finish --check` returned at `already completed` (lib/finish.sh:55) or `no active task` (lib/finish.sh:42) and compared nothing. `finish` records the tree its verification proved (lib/finish.sh:210-224, case 572), and nothing ever read it back at the one moment it matters, when the work is published. A merge of the trunk after the verification changes the tree legitimately, so the finding warns by default rather than refuses, and its remedy names both ways out."
current_state: "On origin/master 3fcaafac355, lib/finish.sh records `verify.tree` in `task.finished` and refuses a tree that changed under the run, and `finish --check` returns 0 without reading the ledger when no task is active or the task is already finished. .githooks/pre-push calls `bin/majordomus finish --check` with no word of what the push publishes; the adopter hook line init prints is `majordomus finish --check || exit $?`."
desired_state: "`finish --check [--pushed <commits>]`, with no active task or a finished one, reads the last `task.finished` of the current branch from the ledger; when it carries a `verify.tree` and the pushed commit's tree (HEAD's when `--pushed` is absent; none when it is empty) differs, a finding `pushed-tree` names the commit, both full tree ids, the task, the verify command and the remedy, at the level the policy declares. The repository's own pre-push hook passes the commits the push publishes for the current branch. Case 4610 fails on master and passes here."
scope:
  - "lib/finish.sh"
  - ".githooks/pre-push"
  - "share/schemas/majordomus/policy/policy.v1.schema.json"
  - "share/allow/policy.txt"
  - "share/skeleton/policy.yaml"
  - "share/commands.yaml"
  - "docs/CLI.md"
  - "docs/SCHEMAS.md"
  - "test/cases/4610_a_push_names_a_tree_its_branch_did_not_verify.sh"
  - ".ai/repo/project/issues/I4610.yaml"
non_scope:
  - "Changing the hook line init prints for adopters: HEAD is what their push of the current branch publishes, and doctor verifies the line as it is"
  - "Comparing a push while a task is active: that task's own finish verifies its tree"
  - "Verifying anything at push time: the check reads the record, it never runs the verify command"
depends_on: []
serves: []
acceptance_criteria:
  - "After a completed finish whose verification recorded tree T, a commit whose tree is T passes `finish --check` silently, and a commit whose tree differs gets a WARN naming both full tree ids and the remedy, exit 0"
  - "With `verification.pushed_tree_unverified: error` the same push is refused with exit 10; with `off` nothing is said"
  - "`--pushed` with a commit compares that commit; `--pushed \"\"` compares nothing; another branch's finished task is never compared"
  - "Negative: case 4610 fails on origin/master's lib/finish.sh"
validation:
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 4610_a_push_names_a_tree_its_branch_did_not_verify 572_verification_records_the_tree_it_proved 06_finish"
evidence_required:
  - "a_push_names_a_tree_its_branch_did_not_verify"
created_at: 2026-11-15
