id: I2632
milestone: concurrent-sessions-are-served
title: "A record that recovery writes says where it lands, and recovery in a shared checkout says whose it is"
slug: a-recovered-record-has-somewhere-to-land
priority: p3
profile: implementation
parallel_safe: true
objective: "Make `recover episodes` state, for each tracked record it writes, the branch it belongs to and whether the checkout it wrote it in is the one that will commit it."
why: "Observed on 2026-10-13 in prismatic-platform under majordomus 0.22.0 (docs/ADOPTION_CONCURRENT_SESSIONS.md, H12); read again on master e506c041a4. `recover episodes` closed three stranded episodes and wrote three records under `.ai/repo/sessions/`, tracked paths, in a checkout where several sessions work and nothing is committed. `doctor` then warned that three records `are committed nowhere, so they reach no surface`; no session owns them."
current_state: "lib/recover.sh writes the record where it runs. session.commit_record_on_end and push_record_on_end are false in this adopter's policy; the record has no owner."
desired_state: "Recovery prints, per record, the branch of the episode and the worktree that holds it, and writes the record there when that worktree exists; where the policy commits no records, the record is local and says so instead of warning for ever."
scope:
  - "lib/recover.sh"
  - "lib/doctor.sh"
  - "docs/CONTINUITY.md"
  - "test/cases"
depends_on: []
acceptance_criteria:
  - "A recovered record of an episode of another worktree is written in that worktree"
  - "Under a policy that commits no records, doctor does not warn about a record that policy keeps local"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "recovered_record_placement_case"
created_at: 2026-10-13
updated_at: 2026-10-13
