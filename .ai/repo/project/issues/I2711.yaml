    command: "MJ_TEST_JOBS=3 bash test/run.sh 3027_the_release_path_goes_first 3028_the_pages_job_waits_for_its_deployment 3029_a_tag_in_flight_is_pending 3021_a_tag_does_not_freeze_the_queue 3019_a_failed_branch_run_cancels_itself 103_release_projection 94_ci_plan"
    result: "tests: 7 passed, 0 failed (run 2026-10-14 ~22Z on master c0e3585dc836201089d6b5dd49f5a79fe8bff798 plus this change); case 3028: pages-check --for COMMIT waits, polling build.json every 30 s up to a declared 1200 s, passes when production serves the commit or a newer one, fails early only when an older commit is served with no deploy in flight, and names both commits"
