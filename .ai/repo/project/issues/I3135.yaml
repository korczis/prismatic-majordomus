title: "The launch kit is held by the same promise check as the homepage, and the tool publishes none of it"
slug: the-launch-kit-is-held-like-the-homepage
priority: p3
profile: implementation
objective: "Extend homepage-check's [promises] and product-sentence checks to docs/LAUNCH.md and site/content/docs/launch.md, derive the kit's one-sentence pitch from the declaration, and correct what the kit states that the model does not (it runs 'in portable shell')."
why: "The 2026-10-13 launch-kit proposal required every kit text to be regenerated from the product identity and nothing auto-published; the kit today is hand-written and repeats a claim the 2026-10-08 audit found false. Proposed in ADR 0210 (The sentence that says what Majordomus is has one declaration, and every surface reads it) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c250#5, chatgpt-majordomus:c193#1."
current_state: "docs/LAUNCH.md last changed around 2026-10-11; its 'One sentence' differs from site/data/marketing.toml [hero] lead; it says 'It runs locally, in portable shell, and never calls a model' while bin/majordomus execs libexec/majordomus-cli for Rust commands."
desired_state: "The kit's pitch is a projection; its other prose passes the promise vocabulary; its 'What not to say' list is read by the check."
