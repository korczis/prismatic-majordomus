id: one-frame-one-kit-one-library-per-job
title: "/ui, /cockpit and the site are one page frame, one component kit, one client core and one library per job, every visual a driven model, every entity linked and every page readable by a model"
slug: one-frame-one-kit-one-library-per-job
order: 551
priority: p1
problem: "Two read-only inventories of master on 2026-11-07 (the owner's order of 13:30Z) found the three surfaces drawn four ways. There are four page frames: cockpit/view.rs page (apps/majordomus-cli/src/cockpit/view.rs:62), ui/shell.rs page (apps/majordomus-cli/src/ui/shell.rs:83), web/html.rs page with inline CSS (apps/majordomus-cli/src/web/html.rs:48) and swagger from unpkg. Sidebar, card, kpi, hero, meter, timeline, breadcrumbs, footer, table and badge are each drawn by two or three implementations over overlapping .mj-* classes (.mj-card, .mj-ui-panel and .mj-panel; .mj-stat, .mj-ui-kpi and .mj-kpi). Flowbite 4.0.2 is used as CSS only and its JavaScript is loaded nowhere, so collapse, dropdown, tabs, modal, drawer and tooltip are hand-written. Alpine is two builds, Cytoscape is four integrations, charts are five renderers, and the shared client helpers are copied several times. Proposed ADR 0230 names the Flowbite move and proposed ADR 0152 names ECharts as the one chart library. The owner's rule of 2026-11-14 (Visuals, derivation and links) then set the library per job (ECharts for charts and graphs, D3 for bespoke layouts and force physics, p5 for generative art, no Chart.js or Cytoscape), simulators over pictures (every visual driven, maximisable, deep-linked, its state in the URL, a static one declared with its reason) and enforcement by blocking project rules and gates. On 2026-11-17 the owner found every page aligned and looking differently, no DRY, the .ai/ layer and Flowbite Pro not followed, the shell inconsistent, pages not fully working, coverage short of 100 %, and issues, pull requests and intents piling up while code is duplicated instead of reusing or extending the mechanisms that exist (his words are quoted in the intent's statement)."
outcome: "A reader meets one frame, one kit and one behaviour on /ui, /cockpit and majordomus.dev: the Flowbite Pro shell, one component per kind in both renderers, Flowbite JS for every interactive control, ECharts for charts and graphs, D3 for bespoke layouts and force physics, p5 for the kiosk's generative scenes, Alpine CSP components for behaviour, every visual a maximisable, deep-linked model whose state is in the URL, one advanced table on every list, every id and every mark a link, and every page with a JSON alternate and an llms.txt beside it. The gates land first, as ratchets over a baseline that only shrinks (I4534, slice S0, for design kit and the frame, kit and library case; I4653 for project.viz-ergonomics and project.everything-interlinked), and I4546 holds them at zero last. The plan is the 14 slices I4534 to I4546 and I4653, taken in dependency order; each is one pull request except I4535, which lands its deletion order one step per pull request."
current_state: "Measured on master on 2026-11-07. Frames: /ui has 19 screens and 5 panels with SCREENS hand-listed (apps/majordomus-cli/src/ui/mod.rs:140); about 40 /cockpit pages whose sidebar is derived from the registry (apps/majordomus-cli/src/cockpit/nav.rs); the site is Zola and Tera with 39 partials and a kit under site/templates/kit. Cytoscape 3.33.1 runs in share/cockpit/graph.js (1310 lines), share/cockpit/trains.js (1259), share/ui/ui.js (cytoscape at lines 572 and 838) and site/graph.js (755). Charts: ECharts 6.0.0 on the site only (site/charts.js, 2391 lines), Rust SVG lines (apps/majordomus-cli/src/ui/trends.rs), a Rust SVG donut, a Tera SVG sparkline and a p5 time series (share/cockpit/activity.js); Chart.js is absent. three.js 0.185.1 draws share/cockpit/topology.js only, with no dedicated test. The handbook loads ECharts 5.5.0, Mermaid 10.9.1 and highlight.js 11.9.0 from cdnjs (handbook/cs/extras10.js:6-11, handbook/cs/extras11.js:14, handbook/cs/extras12.js:17). Nine open UI pull requests (#2583, #1761, #1346, #1345, #1178, #1050, #966, #933, #2349) touch these paths. Read at master ae13be1 on 2026-11-17: site/nav.js = share/ui/nav.js = share/cockpit/nav.js and site/theme.js = share/ui/theme.js = share/cockpit/theme.js are triple byte copies, and share/ui/socket.js = share/cockpit/socket.js, all written by scripts/cockpit-assets (COPIES, lines 41-45) and held by its --check; cytoscape and p5 are vendored into both share/cockpit/vendor and share/ui/vendor; p5 2.3.2 is constructed in share/cockpit/activity.js (a time series) and share/ui/observatory-kiosk.js (the kiosk's scenes, ADR 0160); the handbook calls echarts.init in handbook/cs/extras10.js, extras11.js and extras12.js; site/diagrams.js alone has a full-viewport mode with Escape, and no chart or graph keeps its state in the URL; design kit reports 6 findings (4 S3, 2 S5) with ui.kit empty; no project.viz-ergonomics or project.everything-interlinked rule exists. The milestone one-kit-on-every-surface of 2026-10-20 (I3790 to I3797, I4334, I4377) holds the design-book, copy and shell-block parts; plan delivery reads I4334 and I4377 released in v1.0.0-alpha.10 while their records read READY, and I3790 to I3797 not started; I4534 records each one's end."
desired_state: "Every criterion of the intent one-kit-on-every-surface is carried by an issue here and proven by its case or probe: one Pro frame for /ui and /cockpit and the Pro navbar and footer on the site, one kit contract across the Rust and Tera renderers, Flowbite JS behind every control, one shared ESM module per library job under share/design/js, one share/design/js/core served from its own asset root, one visual wrapper that makes every chart, graph and scene maximisable, deep-linked and URL-stateful, one advanced table, one link resolver for every id and every mark, rel=alternate JSON and llms.txt from the route registry, SCREENS derived from the router's route table, project.viz-ergonomics and project.everything-interlinked blocking, and every route, component and module under the ui-shard and interaction probes, with the published copy probed after the deploy."
