    finding: "Convergence 05.3 `majordomus ui` is handed to I2231, which is gated on I2131 whose record may decide against the command; the 05.1 facts for the derive critical path, cache hits and the running worker are deferred until a cheap source holds them, although I2311 and I2343 write checkout-local records. The 05 acceptance, diagnosing a slow delivery from the same evidence on every surface, then lacks the derive half."
    blocking: false
    resolution:
      state: open
  - id: consumer-proof-and-rehearsal-are-partial
    class: missed_requirement
