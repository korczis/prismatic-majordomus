# The release model of this repository: what a tag sets in motion, in what order, and what
# each phase is allowed to decide for itself — which is nothing. Every platform, runner,
# artifact name and archive root comes from share/distribution.yaml through
# docs/generated/distribution-matrix.json; .github/workflows/release.yml is an adapter over
# this file and that matrix, and carries no platform of its own.
#
# The rule this encodes is project.distribution-canonical: adding a target to the model adds
# a build here, and a release that cannot build every supported target does not publish.
version: 1

# ---------------------------------------------------------------- what triggers a release
# A tag, and nothing else. The version is not chosen by the workflow: the tag must already
# agree with the crate's version and with bin/majordomus, which `release-version --check`
# proves before a single artifact is built.
trigger:
  tags: 'v*'
  dispatch: true

# ---------------------------------------------------------------- where the matrix comes from
# Generated from the distribution model. The workflow reads `.include` and nothing else; a
# target added to the model appears here after `just derive`, and the drift gate refuses a
# tree where it has not.
matrix:
  source: docs/generated/distribution-matrix.json
  # the entries whose runner can execute what it built are the ones smoke-tested in place
  native_field: native

# ---------------------------------------------------------------- the phases, in order
# Each `runs` is the command a person can run too. A phase that needs elevated permission
# says so; every other job has none.
phases:
  - id: plan
    job: plan
    runs: scripts/release-version --check --tag "$TAG"
    summary: the tag, the crate and the shell tool state one version, and the distribution model and every recorded release hold their invariants

  # The compatibility gate, on the release path. Until this phase the structural analysis
  # ran only when a change landed; a tag whose version matched both writers was never asked
  # whether the public contract had moved further than the number says, and tagging was
  # the one way past `version-surface`. The plan job already builds the executable, so the
  # same adapter the validate pipeline runs asks the same engine here (rule
  # project.the-version-is-measured): a release under-versioned against its baseline does
  # not build a single artifact.
  - id: contract
    job: plan
    runs: scripts/ci/version-matches-surface
    summary: the version the tag names is at least what the public contract requires since the last release, measured by the one engine every surface renders

  - id: build
    job: build
    runs: scripts/release-package --target "$TARGET" --tag "$TAG" --out dist
    summary: one archive per supported target, built on the runner the model names

  - id: verify
    job: build
    runs: scripts/release-verify --archive "dist/$ARTIFACT" --target "$TARGET" --tag "$TAG"
    summary: the archive is what the model says it is; where the runner can execute it, the unpacked tool reports the release's own version

  - id: publish
    job: publish
    permissions: contents-write
    runs: gh release create "$TAG" --notes-from-tag
    summary: the digests, the GitHub release with every artifact and SHA256SUMS, the release record, and every projection of it — the public metadata, the installation guide, the site's data and content — regenerated by scripts/derive and committed to the default branch

  - id: smoke
    job: smoke
    runs: curl -fsSL "$INSTALLER_URL" | sh -s -- --version "$TAG"
    summary: the published installer, from the published URL, installing the release that was just published, on every runner whose target it was built for

# ---------------------------------------------------------------- what publication may not do
# A release is all of its supported targets or it is not a release. The build matrix does not
# continue past a failure, and publication does not begin unless every build succeeded.
completeness:
  fail_fast: true
  require_every_supported_target: true

# ---------------------------------------------------------------- rerunning a release
# A release can fail after it has changed something the world can see, and the operator's
# first instinct — rerun the workflow — must then be safe. It is, and this is what it means:
#
#   adopt_published_assets   When the tag already has a GitHub release, this run's rebuild is
#                            discarded and the release's own assets are downloaded in its
#                            place. The record about to be written is evidence of what a user
#                            downloads, and a rebuild is not bit-identical, so recording this
#                            run's bytes would state digests nothing serves.
#   commit_is_idempotent     A rerun whose record and projections are already committed pushes
#                            nothing and succeeds; the state the step exists to reach is there.
#   smoke_is_never_skipped   Both paths end in the same public smoke, so a rerun proves the
#                            same external contract a first run does.
#
# The one case a rerun cannot repair is a release that exists and publishes no archive: the
# assets cannot be reconstructed from a tag, so the run stops and names the command that
# clears the way (gh release delete). docs/DISTRIBUTION.md carries the stage-by-stage runbook.
rerun:
  adopt_published_assets: true
  commit_is_idempotent: true
  smoke_is_never_skipped: true

# ---------------------------------------------------------------- artifacts between jobs
# The built archives move between jobs as Actions artifacts rather than being rebuilt, so a
# failed upload can be retried without rebuilding the universe.
artifacts:
  name: release-<target>
  retention_days: 7
