id: I2500
milestone: adopter-upgrades
title: "Accumulation is watched: worktrees, merged branches and free disk are read against the policy's budgets at the provider's episode events, said in the briefing, and reduced on the policy's consent"
slug: accumulation-is-watched
priority: p1
profile: implementation
parallel_safe: true
objective: "Give the three quantities that grow on their own the watch a session's context already has: budgets declared in the policy, one measurement read at the provider's start, prompt, compaction and end events, a crossed budget said before a worker's first tool call, and a reduction that runs without anybody typing a command when the policy consents."
why: "ADR 0150. project.accumulation-is-measured gave each quantity a measuring command and a reducing one, and nothing ran either: docs/WORKTREES.md said 'nothing in the topology reclaims anything and no budget is declared'. On 2026-10-13 the repository had 247 registered worktrees, 118 merged local branches and 47 GiB free on a volume that had reached zero three times in two days; each time a session noticed, ran the command by hand and wrote the alert by hand. worktree cleanup --remove never deleted a branch name, so merged names only grew."
current_state: "The measurements exist (majordomus worktree, worktree cleanup, scripts/reap-orphans) and are run by a person. No budget is declared anywhere. The start event's briefing does not mention worktrees, branches or the disk. No command deletes a landed branch name."
desired_state: "The policy's accumulation block declares the budgets and whether crossing one may remove anything. accumulation.status measures and judges; majordomus accumulation prints it and exits 10 when a budget is crossed. The start event's briefing names what is over budget, the prompt event says once when the disk is under its floor, and the compaction and end events start a reduction when act is reduce and the cooldown has passed. worktree cleanup --remove --branches deletes landed names nothing has checked out, keeping one at the trunk's own tip."
scope:
  - "apps/majordomus-cli/src/accumulation.rs"
  - "apps/majordomus-cli/src/capability/builtin/accumulation.rs"
  - "apps/majordomus-cli/src/commands/accumulation.rs"
  - "apps/majordomus-cli/src/commands/worktree.rs"
  - "apps/majordomus-cli/src/worktree/state.rs"
  - "apps/majordomus-cli/src/policy.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "lib/capture.sh"
  - "lib/derive.sh"
  - "lib/rust_bin.sh"
  - "test/run.sh"
  - ".ai/repo/policy.yaml"
  - "share/skeleton/policy.yaml"
  - "share/allow/policy.txt"
  - "share/schemas/majordomus/policy/policy.v1.schema.json"
  - "docs/ACCUMULATION.md"
  - "docs/WORKTREES.md"
  - "docs/CLAIMS.yaml"
  - "docs/claims/accumulation-is-watched.md"
  - ".ai/repo/adrs/0150-accumulation-is-watched-at-the-episodes-events.md"
  - ".ai/repo/rules/project/accumulation-is-watched.v1.md"
  - ".ai/repo/features/worktrees.md"
