  - ".ai/repo/rules/project/the-site-offers-the-release-it-published.v1.md"
  - "site/content/plan/I4531.md"
non_scope:
  - "The release workflow and scripts/release-record, which publish the document and open the record's pull request as before"
  - "/releases/latest.json and the installer's unasked default, which stay the stable release (I2829)"
depends_on: []
acceptance_criteria:
  - "scripts/site-build --release on a tree holding only the alpha.9 record, with origin/gh-pages serving releases/v1.0.0-alpha.10.json, names prerelease 1.0.0-alpha.10 with source published"
  - "Case 3727 proves the selection over both readings: a published pre-release newer than every record wins, the record wins an older or equal publication, a yanked record withdraws the published document, a published pre-release behind the stable release is not offered, a malformed document is refused"
  - "Case 1087 proves the published branch is read for the pre-release and the live gate judges the pre-release surfaces: agreeing, behind inside and beyond the window, ahead of GitHub, disagreeing with build.json"
  - "Case 3222 proves an ordinary deploy keeps a published pre-release document the build does not carry until its record lands"
validation:
  - "bash test/run.sh 1087_the_site_offers_the_release_it_published 3727_the_pages_name_the_pre_release_beside_the_stable_one 3222_an_alpha_publishes_beside_the_latest_release 352_the_version_the_site_shows_is_one_you_can_get 180_publication_is_observed"
  - "scripts/site-build --release"
evidence_required:
  - suite
risk: "A deploy now keeps every release document gh-pages serves that the build lacks; a document deliberately removed from the records is not a case that exists (a record is yanked, never deleted), and a yanked record withdraws the published document from the pages."
