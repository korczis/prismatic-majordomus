id: I2295
milestone: development-runtime
title: "What a session must know to work beside others is written where it is read"
slug: working-beside-other-sessions-is-written-where-it-is-read
priority: p1
profile: implementation
parallel_safe: true
objective: "Write the five coordination lessons of 2026-10-09 and 2026-10-10 into the layer as a workflow a session can follow without any tool, state the one about a relayed approval in the rule it belongs to, point every repository bootstrap at the workflow, publish what it asks and why as a page of the site, and hold all of it with a case and a claim."
why: "On 2026-10-09 and 2026-10-10 about ten sessions on four machines shipped two releases and integrated pull requests under one integration executor. Five coordination failures cost hours and none of them was written anywhere a new session reads. (1) The owner approved a merge shortcut in one session; that session and a second relayed it to the executor, which refused twice, then reasoned its way to acting on the relays plus a standing authorisation, and was stopped only by its permission layer. (2) The executor coordinated for a day through local messages and the local board and never read what a session on another machine had addressed to it over the mesh: a ready pull request and a relayed owner order. (3) Heads were repaired, with master merged in and derived, before their turn; each was conflicting again after the next landing, and a derive and a run of the required check of about ninety minutes were thrown away each time. (4) From a release tag's push until its record landed, scripts/ci/release-check failed the structure job on every other head, the owner decided on 2026-10-10 to keep that check strict, and the record's dispatched run did not satisfy the branch protection until the pull request was closed and reopened. (5) The executor stopped its own queued job seconds after it took the machine's derive lock; the exit trap never ran and the dead owner held every other session's derive for two hours and fifteen minutes. The bootstraps named the board and the mesh tools but not when to read them, and nothing said what a relayed approval is."
current_state: "The bootstraps tell a worker to announce on the board and name the mesh tools for claiming and handing over; no document says to read the mesh state for what was addressed to this session, what an approval reported by another session is worth, that a head is not brought up to master before its turn in the lane, what a release tag does to every other head, or to look at a lock after stopping its holder. project.mesh-is-observation-not-authority speaks of discovery events only."
desired_state: ".ai/repo/workflows/working-beside-other-sessions.md states the five as operating instructions with their reasons and dated evidence, linking docs/MESH.md, docs/INTEGRATION.md and docs/DISTRIBUTION.md for the mechanisms; project.mesh-is-observation-not-authority gains a clause for what a session reads on the mesh or the board, with the evidence; AGENTS.md and CLAUDE.md carry one sentence pointing at the workflow, rendered from their templates; docs/WORKING_BESIDE_OTHER_SESSIONS.md is indexed in docs/README.md and so rendered on the site, and docs/INTEGRATION.md and docs/MESH.md each link to it; the claim sessions-read-how-to-work-beside-others names case 1034, which fails when the workflow is not discovered, a bootstrap drops the pointer, the rule drops the clause, the workflow names a tool or command that does not exist, or the published page loses a section the workflow has."
