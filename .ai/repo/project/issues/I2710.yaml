id: I2710
milestone: M004
title: "A release run never waits behind pull-request validates for a job slot"
slug: a-release-run-never-starves
priority: p0
profile: implementation
parallel_safe: true
depends_on: []
objective: "Give the release path (the release workflow, the record pull request's verdict and the Pages deploy that publishes the release) priority over branch validates on the shared runner pool, so that a published release reaches majordomus.dev within its own run time."
why: "2026-10-14 19:07Z: v0.26.0 was published, but its record PR #1147 sat BLOCKED: the verdict run 38620987044 and the Pages deploy 38620990702 were queued because the pull-request validates of #897 and #946 held all 20 job slots. majordomus.dev kept offering 0.25.0 and the landing HOLD could not be lifted; the run of #897 was cancelled by hand to free slots. The owner: \"tohle se nesmi stavat\"."
current_state: "Every workflow competes for the same runner pool first come, first served. Nothing makes a pull-request validate yield while a release, its record verdict or its Pages deploy waits for a slot."
desired_state: "While a release run, a record pull request's verdict or a Pages deploy of master is queued or running, a pull-request validate that has not yet finished yields: it does not start new jobs (or cancels itself with a reason naming the release run and is re-requested after it), and the release path never waits for a slot a branch validate holds. Master's own validate is never cancelled by this."
scope:
  - .github/workflows/validate.yml
  - .github/workflows/release.yml
  - scripts/ci
  - docs/CI.md
  - docs/RELEASE.md
  - test/cases
non_scope:
  - "Buying runners or changing the pool's size"
acceptance_criteria:
  - "With a release run or record verdict queued, a pull-request validate yields within one minute and says which release run it yielded to"
  - "A yielded validate is re-requested once the release path is done, without a person"
  - "Master's validate and the release path themselves are never cancelled by the rule"
validation:
  - "bin/majordomus plan validate"
evidence_required:
  - "release_path_has_priority_case"
