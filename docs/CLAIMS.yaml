# Claims matrix — the canonical answer to "what does Majordomus actually do today?"
#
# Every capability sentence on the public website is rendered from this file. Nothing
# else on the site may state a capability. The rule from AGENTS.md applies here:
# no claim without an executable behind it.
#
# The statuses a claim may carry are declared below as data, not listed in this comment
# and again in the generator. Their order is the order the website presents them in.
#
# fields:
#   claim           one sentence, present tense for guaranteed, plain future for planned
#   source          the canonical file that defines the behaviour
#   implementation  the file that implements it, or "-" when nothing does
#   test            the behavioural test that proves it, or "-" when none does
#
# `scripts/generate-site-data --check` verifies that every source, implementation and test
# path in this file exists. A guaranteed claim with no test path is an error.
version: 1

statuses:
  - id: guaranteed
    meaning: Deterministic and blocking. Implemented, and a behavioural test proves it.
  - id: advisory
    meaning: Projected into the worker's instructions. Whether a worker honours it is not observable from outside. Documentation, not enforcement.
  - id: planned
    meaning: Specified and not implemented. Named so the omission is visible.
  - id: rejected
    meaning: Considered and deliberately refused, with the reason recorded.

claims:
  - id: distribution-canonical-model
    claim: Every platform, artifact name and installation URL is derived from one model, and a projection that disagrees with it is refused
    source: docs/DISTRIBUTION.md
    implementation: apps/majordomus-cli/src/distribution/mod.rs
    test: test/cases/84_distribution_model.sh
    status: guaranteed
    responsibility: projection
    note: share/distribution.yaml is the model. The installer's platform table, the release build matrix, the documentation's table, the website's dataset and the public release metadata are generated from it, and `majordomus generate --check` exits 10 naming any that has fallen behind.

  - id: install-command-is-derived
    claim: The documented one-line install command is composed from the model's parts, and a document that states a different one fails the suite
    source: docs/INSTALL.md
    implementation: apps/majordomus-cli/src/distribution/mod.rs
    test: test/cases/84_distribution_model.sh
    status: guaranteed
    responsibility: projection
    note: The download command, the base URL, the script name and the shell are four fields; the command is their composition. README.md and the installation guide are checked against it rather than trusted.

  - id: installer-verifies-before-installing
    claim: The installer verifies an artifact's digest and inspects its archive before anything is unpacked, and any failure leaves the previous installation working
    source: docs/INSTALL.md
    implementation: share/install/install.sh.in
    test: test/cases/85_installer.sh
    status: guaranteed
    responsibility: doctor
    note: A wrong digest, a truncated download, an archive that escapes its own directory or carries a link, and an executable that reports another version are each refused by name, before the launcher is replaced. There is no warn-and-continue path and sudo appears nowhere.

  - id: release-is-complete-or-absent
    claim: A release publishes an artifact for every supported target or it is not published
    source: docs/DISTRIBUTION.md
    implementation: scripts/release-record
    test: test/cases/87_release_pipeline.sh
    status: guaranteed
    responsibility: projection
    note: The build matrix stops at the first failure, publication begins only when every build succeeded, and the recorder refuses to write a record missing a target the model marks supported.

  - id: advertised-install-command-works
    claim: The install command this project advertises is fetched and run from the published site every night and on request, and the run that asked for it is red while it does not install a working tool
    source: docs/DISTRIBUTION.md
    implementation: scripts/ci/install-check
    test: test/cases/97_install_gate.sh
    status: guaranteed
    responsibility: projection
    note: The line is run as it is written, pipe included, on Linux and macOS, into a home directory of the run's own. It proves the metadata resolves, the tool reports the version that was resolved, the MCP launcher runs with no toolchain, and a repository can be initialised. A release proves the same thing once at publication; this keeps proving it afterwards. ADR 0037 plans it on demand, because its job has a macOS leg and those runners queued for hours: the nightly schedule, a dispatch and a pull request labelled ci:full ask for it, a routine push does not.

  - id: release-archive-shape
    claim: A release archive carries every path once and carries nothing but files and directories
    source: docs/DISTRIBUTION.md
    implementation: scripts/release-package
    test: test/cases/87b_release_archive_shape.sh
    status: guaranteed
    responsibility: projection
    note: The packer reads back what it wrote and deletes an archive carrying a repeated path or an entry that is not a file or a directory; the verifier checks the same two properties again on the runner that built it. There is no fallback packer, because an archive packed another way is not the one that was verified.

  - id: policy-parse
    claim: The canonical policy is parsed and rejected if it contains an unknown key
    source: docs/SCHEMAS.md
    implementation: lib/common.sh
    test: test/cases/00_yaml_flatten.sh
    status: guaranteed
    responsibility: policy
    note: A restricted YAML subset. Tabs, anchors, flow maps and multi-line scalars are refused rather than guessed at.

  - id: profile-validate
    claim: Every profile is parsed, its unknown keys rejected, and the default profile proven to exist
    source: docs/SCHEMAS.md
    implementation: lib/doctor.sh
    test: test/cases/02_doctor_basic.sh
    status: guaranteed
    responsibility: profiles

  - id: wiring-reconciliation
    claim: Every enforcement the policy declares is reconciled against what actually runs
    source: docs/DESIGN.md
    implementation: lib/doctor.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: doctor
    note: The path must exist, be executable, and be invoked by the named dispatcher. A hook that invokes it and discards the exit code counts as not wired.

  - id: exit-code-contract
    claim: Exit codes are a contract, and no code means "warn and continue"
    source: docs/CLI.md
    implementation: lib/common.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: none      # a property of every command, not of one responsibility

  - id: projection-generation
    claim: Provider instruction files are generated from the one policy, deterministically
    source: docs/DESIGN.md
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection
    note: Running update twice leaves the byte-identical file. The test asserts the hash.

  - id: projection-fingerprint
    claim: Every generated instruction file carries its own stamp, and a hand edit is detected
    source: docs/SCHEMAS.md
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection

  - id: region-projection
    claim: A projection can own only the region between its markers, leaving the rest of the file untouched
    source: docs/SCHEMAS.md
    implementation: lib/update.sh
    test: test/cases/13_region_projection.sh
    status: guaranteed
    responsibility: projection
    note: How a repository that already has a hand-written CLAUDE.md adopts Majordomus. An edit outside the markers is never drift; an edit inside them is caught. Malformed markers are refused, not guessed at.

  - id: dispatcher-wiring
    claim: Wiring is found in a hook or in any subhook of the directory that hook dispatches to
    source: docs/CLI.md
    implementation: lib/doctor.sh
    test: test/cases/14_wiring_dispatcher.sh
    status: guaranteed
    responsibility: doctor
    note: The finding names the file that actually carries the invocation. A subhook that is not executable is reported as not wired, because the dispatcher skips it.

  - id: doctrine-registry
    claim: Every rule the tool enforces is declared once, as a rule object in the repository's effective set, and doctor proves each one is reached by the command that claims to run it
    source: docs/DOCTRINE.md
    implementation: lib/doctrine.sh
    test: test/cases/18_doctrine_wiring.sh
    status: guaranteed
    responsibility: doctor
    note: A doctrine whose validator does not exist, a validator no doctrine declares, a command that never dispatches, a blocking rule whose command cannot exit non-zero, a missing test, and CI that swallows the suite are six separate failures with six separate messages. Each is mutation-tested.

  - id: doctrine-class-decides
    claim: A doctrine's class is what decides whether a violation stops the command, not a label beside it
    source: docs/DOCTRINE.md
    implementation: lib/doctrine.sh
    test: test/cases/17_doctrine_enforcement.sh
    status: guaranteed
    responsibility: policy
    note: The test changes checkpoint freshness from advisory to blocking in a copy of the vendored rule file and asserts that check's exit code moves from 0 to 10. There are two classes and no override.

  - id: ledger-integrity
    claim: Every line of the append-only ledger is a well-formed event, and a malformed line is a failure rather than a skipped record
    source: docs/DOCTRINE.md
    implementation: lib/check.sh
    test: test/cases/22_history.sh
    status: guaranteed
    responsibility: state
    note: The reader skips a bad line rather than crashing, and check, doctor and watch all report it. The ledger is the one durable record nothing else can reconstruct.

  - id: decision-attribution
    claim: A decision record without a task, a head and a reason is reported, and does not block
    source: docs/DOCTRINE.md
    implementation: lib/check.sh
    test: test/cases/21_decision_question.sh
    status: advisory
    responsibility: state
    note: decisions.md is hand-editable by design, so an unattributable entry is a warning. finish still refuses when a profile requires a record it cannot find.

  - id: blocker-store
    claim: An entry in the questions store that does not parse blocks acceptance exactly as an unresolved question does
    source: docs/DOCTRINE.md
    implementation: lib/check.sh
    test: test/cases/21_decision_question.sh
    status: guaranteed
    responsibility: scope
    note: A gate that cannot read an entry can be bypassed by mistyping one, so an unreadable question is not a lesser problem than an open one.

  - id: prompt-capture
    claim: A declared provider hook captures the person's raw prompts below the model, and doctor proves it by running it
    source: docs/DOCTRINE.md
    implementation: lib/capture.sh
    test: test/cases/29_prompt_capture.sh
    status: guaranteed
    responsibility: policy
    note: Covers the five states a provider can be in, idempotence on the provider's prompt identity, an archive that is ignored and untracked, a record set that cannot carry model output, the record-and-rendering pair every prompt is kept as, and the schema identifier resolving to the two files that describe both halves.

  - id: prompt-continuity
    claim: A captured prompt names the episode it belongs to or records that none could be resolved; the archive is private, bounded and free of credential material
    source: docs/DOCTRINE.md
    implementation: lib/capture.sh
    test: test/cases/140_prompt_continuity.sh
    status: guaranteed
    responsibility: policy
    note: The mapping from a provider session to an episode used to exist only while the episode was open, so a closed episode's prompts became unattributable at once — 713 of this repository's 974 records. The record now carries the episode, the provider session, the repository and the worktree, with the provenance of the link; the archive is 0600 and bounded by prompts.retention_max_days and prompts.retention_max_bytes, which prune the body and keep the record; and credential shapes are replaced before anything is persisted. The unlinked legacy records stay unlinked: the evidence for them does not exist, and this claim does not pretend otherwise.

  - id: prompt-assets
    claim: Every repository-local prompt asset renders, and an unknown token is a failure
    source: docs/DOCTRINE.md
    implementation: lib/prompt.sh
    test: test/cases/24_prompt_search.sh
    status: guaranteed
    responsibility: policy
    note: Covers name and filename mismatch, an empty description, an unknown front-matter key, missing front matter, and a block token used inline.

  - id: catalogue-resolves
    claim: A use case or application cannot name a command, doctrine or claim that does not exist, and the two catalogues cannot disagree about which applies to which
    source: docs/DOCTRINE.md
    implementation: lib/usecase.sh
    test: test/cases/28_catalogue.sh
    status: guaranteed
    responsibility: doctor
    note: Prose describing the tool is checked the same way the tool checks itself. Cross-references are verified in both directions, so a use case naming an application that does not name it back is a failure rather than a silent asymmetry. An application declaring no does_not_fit_when is refused, because a catalogue that only lists fits is marketing.

  - id: no-silent-overwrite
    claim: A hand-edited instruction file is never silently overwritten
    source: docs/CLI.md
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection
    note: update refuses, offers a diff, and overwrites only under an explicit flag.

  - id: archive-fidelity
    claim: An archive that lost the file modes fails rather than travelling
    source: docs/ARCHIVE.md
    implementation: lib/archive.sh
    test: test/cases/130_archive.sh
    status: guaranteed
    responsibility: projection
    note: The mode of every entry is taken from the git index, written into the archive manifest and proved through the container before the command returns.

  - id: context-budget
    claim: The always-loaded instruction file has a line budget with a failing check
    source: share/skeleton/policy.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: projection
    note: Over budget, nothing is written at all.

  - id: pointer-integrity
    claim: Every repository-relative reference in the always-loaded file is proven to resolve
    source: docs/DESIGN.md
    implementation: lib/doctor.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: doctor

  - id: no-counts-in-context
    claim: A hardcoded count in the always-loaded file is a failure
    source: docs/DESIGN.md
    implementation: lib/doctor.sh
    test: test/cases/03_update.sh
    status: guaranteed
    responsibility: doctor

  - id: retention-caps
    claim: The append-only ledger and handover store have retention caps that are checked
    source: share/skeleton/policy.yaml
    implementation: lib/doctor.sh
    test: test/cases/02_doctor_basic.sh
    status: guaranteed
    responsibility: doctor

  - id: init-refuses
    claim: Installing into a repository that already has an installation is refused
    source: docs/CLI.md
    implementation: lib/init.sh
    test: test/cases/01_init.sh
    status: guaranteed
    responsibility: none      # installation, which precedes every responsibility

  - id: reproduce-command
    claim: Every finding carries the command that reproduces it
    source: docs/DESIGN.md
    implementation: lib/common.sh
    test: test/cases/02_doctor_basic.sh
    status: guaranteed
    responsibility: none      # a property of every finding, not of one responsibility

  - id: no-network
    claim: Nothing performs a network call, evaluates generated text, or deletes recursively
    source: docs/DESIGN.md
    implementation: bin/majordomus
    test: test/cases/08_no_forbidden_constructs.sh
    status: guaranteed
    responsibility: none      # a boundary of the whole tool

  - id: scoped-task
    claim: A task is started with a declared file scope and a profile, and only one task is active per checkout
    source: docs/CLI.md
    implementation: lib/start.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope
    note: A scope path that escapes the repository root is refused. Starting a second task while one is active is refused.

  - id: git-identity
    claim: Identity fields on every state record are computed from git and never authored
    source: docs/SCHEMAS.md
    implementation: lib/start.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: state
    note: A handover body that tries to set one is rejected rather than merged.

  - id: consistency-check
    claim: check reports whether state, scope, blockers and checkpoint age are consistent right now
    source: docs/CLI.md
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope

  - id: scope-enforcement
    claim: A touched file outside the claimed scope is a failure, not a warning
    source: docs/DESIGN.md
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope

  - id: divergence-label
    claim: State read back is labelled exact, advanced, diverged or different_context against git
    source: docs/SCHEMAS.md
    implementation: lib/common.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: state

  - id: overlap-report
    claim: Overlap between parallel workers is computed on claimed paths in both containment directions
    source: docs/DESIGN.md
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: guaranteed
    responsibility: scope
    note: Reported, never blocking. Work in progress is reported and never blocked.

  - id: drift-watch
    claim: watch reports policy, projection, state, scope, handover, verification, staleness and retention drift
    source: docs/DESIGN.md
    implementation: lib/watch.sh
    test: test/cases/07_watch.sh
    status: guaranteed
    responsibility: watch

  - id: handover-record
    claim: handover writes an append-only record with computed front matter and required sections
    source: docs/SCHEMAS.md
    implementation: lib/handover.sh
    test: test/cases/05_handover.sh
    status: guaranteed
    responsibility: handover
    note: A body with a missing or empty required section is refused and names the sections.

  - id: no-transcripts
    claim: Handovers carry durable facts, never conversation transcripts
    source: docs/DESIGN.md
    implementation: lib/handover.sh
    test: test/cases/05_handover.sh
    status: guaranteed
    responsibility: handover

  - id: finish-contract
    claim: finish evaluates the finish contract line by line and refuses when any line is unmet
    source: docs/CLI.md
    implementation: lib/finish.sh
    test: test/cases/06_finish.sh
    status: guaranteed
    responsibility: finish

  - id: typed-outcome
    claim: An outcome is a value from a closed vocabulary, not free text
    source: docs/SCHEMAS.md
    implementation: lib/finish.sh
    test: test/cases/06_finish.sh
    status: guaranteed
    responsibility: finish
    note: no_match means the work was done and the thing sought does not exist. failed means the work could not be done. They are different facts.

  - id: profile-axes
    claim: Capability class, reasoning effort, output verbosity, context and verification are five independent axes
    source: share/skeleton/profiles/implementation.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: advisory
    responsibility: profiles
    note: The axes are validated and projected into the worker's instructions. Whether a worker honours them is not observable from outside the worker.

  - id: capability-class
    claim: A profile names a capability class rather than a vendor model
    source: share/skeleton/profiles/deep-work.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: advisory
    responsibility: profiles
    note: Mapping a class to a concrete model is left to whoever runs the worker. Majordomus never selects or invokes a model.

  - id: minimum-context
    claim: A profile declares which context a worker should load and no more
    source: share/skeleton/profiles/routine.yaml
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: advisory
    responsibility: profiles
    note: majordomus context now assembles a briefing from those toggles, and that selection is guaranteed (see context-assembly). This claim stays advisory because nothing measures what the worker actually read once it has been handed the briefing.

  - id: effort-escalation
    claim: Escalating reasoning effort after repeated blocked attempts is recorded rather than assumed
    source: share/skeleton/profiles/debugging.yaml
    implementation: lib/update.sh
    test: test/cases/03_update.sh
    status: advisory
    responsibility: profiles

  - id: checkpoint-interval
    claim: A profile sets how often a worker should checkpoint, and a stale task is reported
    source: share/skeleton/policy.yaml
    implementation: lib/check.sh
    test: test/cases/04_start_check.sh
    status: advisory
    responsibility: profiles
    note: The staleness report is guaranteed. Whether the worker checkpoints is not.

  - id: context-assembly
    claim: The context a worker is given is assembled from durable state in authority order, and what a profile excludes is excluded
    source: docs/CONTINUITY.md
    implementation: lib/context.sh
    test: test/cases/23_context.sh
    status: guaranteed
    responsibility: profiles
    note: Git first, then task and profile, then blockers, then authored records, then history. The profile's context block decides what is offered; it is the only code that reads those fields.

  - id: context-selection-budget
    claim: The assembled context obeys a line budget, and every section it drops is named with its reason
    source: share/skeleton/policy.yaml
    implementation: lib/context.sh
    test: test/cases/23_context.sh
    status: guaranteed
    responsibility: profiles
    note: The count is of the printed document, not of its sections. Git, task, profile and open blockers are never dropped; record bodies degrade to a pointer before they disappear.

  - id: checkpoint-record
    claim: A checkpoint is a capped progress record with computed identity, and a body over the cap is refused rather than truncated
    source: docs/SCHEMAS.md
    implementation: lib/checkpoint.sh
    test: test/cases/20_checkpoint.sh
    status: guaranteed
    responsibility: state
    note: The cap is what keeps a checkpoint distinct from a handover. Mode 0600, created atomically, never staged.

  - id: record-resolution
    claim: The right prior record is resolved by worktree and branch, and an unrelated one is never offered
    source: docs/CONTINUITY.md
    implementation: lib/common.sh
    test: test/cases/23_context.sh
    status: guaranteed
    responsibility: handover
    note: Same worktree and branch, else same branch, else nothing. Ties within one second are broken by ledger order. Absence is reported as absence.

  - id: history-ledger-read
    claim: The ledger is readable back as operational history, filtered by task, event and time
    source: docs/CLI.md
    implementation: lib/history.sh
    test: test/cases/22_history.sh
    status: guaranteed
    responsibility: watch
    note: What happened, when, for which task, at which head, and what outcome was accepted. Never what anyone said.

  - id: record-retention
    claim: Rotating the ledger archives the oldest lines and never deletes them
    source: docs/SCHEMAS.md
    implementation: lib/history.sh
    test: test/cases/22_history.sh
    status: guaranteed
    responsibility: watch
    note: Refuses to overwrite an existing archive, and does nothing when the ledger is under its cap.

  - id: decision-record
    claim: A decision is recorded with its reason and its task, and is superseded by a later entry rather than edited
    source: docs/SCHEMAS.md
    implementation: lib/decision.sh
    test: test/cases/21_decision_question.sh
    status: guaranteed
    responsibility: state
    note: --why is required. --supersedes refuses text matching no recorded decision. Task and head are computed.

  - id: open-question-gate
    claim: An unresolved question blocks acceptance, and an entry the gate cannot parse is a failure rather than a silent pass
    source: docs/SCHEMAS.md
    implementation: lib/question.sh
    test: test/cases/21_decision_question.sh
    status: guaranteed
    responsibility: finish
    note: A gate that cannot read an entry can be bypassed by mistyping one, so check, doctor and watch all fail on a malformed entry.

  - id: prompt-asset
    claim: A repository-local prompt renders against a closed set of state tokens, and an unknown token is an error
    source: docs/SCHEMAS.md
    implementation: lib/prompt.sh
    test: test/cases/24_prompt_search.sh
    status: guaranteed
    responsibility: policy
    note: No conditionals, loops, includes or shell. A prompt that silently renders a misspelled token as literal text is worse than one that refuses.

  - id: record-search
    claim: Durable records are searchable literally, across kinds, without an index
    source: docs/CLI.md
    implementation: lib/search.sh
    test: test/cases/24_prompt_search.sh
    status: guaranteed
    responsibility: watch
    note: A fixed-string grep in authority order. No ranking, no embedding, no index that could fall out of step with the records it describes.

  - id: continuity-reachable
    claim: Every continuity store is proven reachable through its own command, not merely present on disk
    source: docs/CLI.md
    implementation: lib/doctor.sh
    test: test/cases/25_continuity_lifecycle.sh
    status: guaranteed
    responsibility: doctor
    note: doctor runs the resolver, renders every prompt asset, validates both parsed stores and builds the context. A directory of records that no command reads is the failure this tool exists to catch.

  - id: context-documents
    claim: The context that applies to a path is composed from the layer's scoped documents, root to target, in one deterministic order with provenance, and a tree that does not validate resolves nothing
    source: docs/CLI.md
    implementation: lib/context_docs.sh
    test: test/cases/69_context_documents.sh
    status: guaranteed
    responsibility: layer
    note: A document is a Markdown file under .ai/ whose front matter carries schema context/v1; the file name is a convention and the id is the identity. Ordering is depth, then declared order, then path. Providers and audience filter; extend, replace and final compose; a duplicate id, a dangling reference, a superseded final document or a cycle is refused by name.

  - id: context-coverage
    claim: Every directory of the layer carries a context document, the exemption is declared by the contract that governs the subtree, and a descendant may narrow that requirement but never weaken it
    source: docs/CONTEXT.md
    implementation: lib/context_docs.sh
    test: test/cases/69_context_documents.sh
    status: guaranteed
    responsibility: layer
    note: A directory inside the tree with no document is missing-contract, naming the directory and, where an ancestor made the requirement explicit, the contract that did. The exemption is children.require_contract on a subtree document; the value nearest a directory applies, absence means one is owed, and lowering an inherited true is illegal-override. The tree is the manifest's directory minus the half the manifest declares untracked; nothing else is skipped by name, and a subtree the layer carries but does not author is released by children.exempt on the contract that governs it, which may name only directories inside its own scope.

  - id: context-impact
    claim: The impact of a change set on the scoped context is reported from git — the documents, the scopes below them, moves with their ancestry, tracked sources to review, and stale projections — and an unrelated change reports nothing
    source: docs/CLI.md
    implementation: lib/context_docs.sh
    test: test/cases/70_context_impact.sh
    status: guaranteed
    responsibility: layer
    note: context affected reads the working tree, the index, or a base ref, with renames detected; a tracked source change is a WARN to review and never an exit code, because the tool cannot decide whether prose still describes code. context check-sync is validate, then every projection against its stamp, then affected; test/cases/71_context_sync.sh proves the exit codes.

  - id: ai-layer-manifest
    claim: The repository's AI layer is one directory whose manifest names every section, readable without the tool
    source: docs/SCHEMAS.md
    implementation: lib/init.sh
    test: test/cases/01_init.sh
    status: guaranteed
    responsibility: layer
    note: init seeds .ai/ from the skeleton and nothing else; no hook, no shell file, no tool installation. doctor fails on a section the manifest names that is absent, and on a manifest key nothing reads.

  - id: local-state-ignored
    claim: Checkout-local state lives under .ai/local/, is ignored by git, and is absent on a fresh clone or worktree
    source: docs/SCHEMAS.md
    implementation: lib/common.sh
    test: test/cases/01_init.sh
    status: guaranteed
    responsibility: state
    note: The task record, ledger, decisions, questions, checkpoints and handovers never travel through git. A record that arrives in another checkout by other means names the checkout it belongs to and is enforced nowhere else, which test/cases/27_foreign_task.sh proves.

  - id: vendored-rule-package
