name: validate
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The CLI needs no Node. The derived site's tests and check do (flowbite assets),
      # so the matrix installs it once; the CLI's own tests would pass without it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: shell syntax
        run: for f in bin/majordomus lib/*.sh test/run.sh test/lib.sh test/cases/*.sh; do bash -n "$f"; done
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x -s bash -S warning bin/majordomus lib/*.sh test/run.sh test/lib.sh scripts/generate-site-data scripts/site-build scripts/site-check scripts/site-serve
          shellcheck -x -s bash -S warning test/cases/*.sh
      # The one canonical validation surface. Every behavioural, negative and integration
      # case runs here; nothing is skipped, and no failure is swallowed. test/run.sh exits
      # non-zero when any case fails, and this step has no `|| true` to hide it.
      - name: behavioural tests
        run: bash test/run.sh
      - name: self-supervision
        run: |
          git config core.hooksPath .githooks
          bin/majordomus doctor
          bin/majordomus watch
      # The continuity subsystem reached through the real CLI, in this checkout rather than
      # in a disposable one: the commands a worker actually runs must work where the tool
      # supervises itself, not only in a fixture.
      - name: continuity subsystem is reachable
        run: |
          bin/majordomus context --budget-lines 400 > /dev/null
          bin/majordomus context --json | head -c 1 | grep -q '{'
          bin/majordomus history --validate
          bin/majordomus handover --resolve > /dev/null
          bin/majordomus checkpoint --list > /dev/null
          bin/majordomus decision list > /dev/null
          bin/majordomus question list --all > /dev/null
          bin/majordomus prompt list | grep -q .
          for p in $(ls .majordomus/prompts/*.md | xargs -n1 basename | sed 's/\.md$//'); do
            bin/majordomus prompt render "$p" | grep -q '{{' && { echo "unrendered token in $p"; exit 1; }
            true
          done
      # The committed derived site data must match the canonical files it is generated from.
      - name: derived site data in sync
        run: scripts/generate-site-data --check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - name: derived site data in sync
        run: scripts/generate-site-data --check
      - name: build the site
        run: scripts/site-build
      # Metadata and landmarks on every route, no unrendered template delimiter, every
      # internal link resolving, no remote asset, no credential, and the generated data
      # still matching its canonical sources.
      - name: check the site
        run: scripts/site-check
      # Every route measured at every supported width, in a real browser. The deploy
      # workflow samples one route per template; this one is the complete measurement, and
      # the branch is not green until it passes. It runs here rather than in front of the
      # artifact so that a slow check does not sit between a green build and a published
      # page — the deploy queue was reaching seventeen minutes with it there, long enough
      # that pushes began superseding each other's deploys.
      - name: probe the site in a browser
        run: CHROME_BIN=google-chrome scripts/site-probe
      - name: manifest
        run: cat site/data/generated/source.json
