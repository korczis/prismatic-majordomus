id: I1516
milestone: work-graph-github
title: The adapter composes a projected body in one place
slug: the-adapter-composes-one-body
priority: p0
profile: implementation
parallel_safe: true
objective: "Make the body scripts/github-sync posts to an issue the same text it prints for that issue, by composing it once, so that a body the adapter wrote is a body the adapter recognises as its own."
why: "The adapter composed the generated region twice — once for --render and once for the splice that updates an issue that already exists — and the two compositions drifted. record_marker() prints without a trailing newline; --render wrapped it in printf '%s\\n' and the splice did not, so the first line of the record was glued to the marker in every body the splice posted. region_intact() drops the marker line before hashing the region back, and that prefix match took the glued first line with it, so such a region never hashed to what its own marker claimed. Every issue written through the splice was then classified `edited` — a person's hand-edit, never to be overwritten — and --force could not repair one, because it rewrote it exactly the same way. This is measured, not hypothetical: 19 of the 215 managed issues on GitHub carry a marker line with body text appended, and they are exactly the 19 findings that keep the github-projection gate red."
current_state: "19 managed issues carry a concatenated marker line; scripts/ci/github-check exits 10 on them; the structure job fails on every branch that reaches it. test/cases/45 exercises only the --render composition, so the splice composition has never been tested at all."
desired_state: "One function composes the region's content, and both the rendering and the splice call it. The case refuses a second composition and refuses a caller that writes the marker without ending its line. The 19 remote bodies are rewritten by --apply --force and the gate goes green."
scope:
  - scripts/github-sync
  - test/cases
non_scope:
  - The remote rewrite itself, which is an operation and not a change to the repository.
  - The drift baseline, which shrinks on its own once the bodies are correct.
depends_on: []
acceptance_criteria:
  - The region body is composed in exactly one place in the adapter
  - No caller writes the record marker without terminating its line
  - A body the splice would post classifies as insync, not edited
validation:
  - bash test/run.sh 45_github_projection
  - bash scripts/ci/shell-lint
evidence_required:
  - the_two_compositions_are_one
  - a_spliced_body_is_recognised_as_its_own
risk: "Low. The change removes a duplicate definition; the rendering it keeps is the one every other surface already prints."
created_at: 2026-09-15
updated_at: 2026-09-15
started_at: 2026-09-15
