id: I2265
milestone: first-runs-by-strangers-are-recorded
title: "Observations of first runs are records, and their summary is derived from them"
slug: first-run-observations-are-records
priority: p3
profile: implementation
parallel_safe: false
objective: "Give observation files a tracked home and kind, derive a summary (counts, medians, refusals by kind) from them alone, and refuse a hand-written summary or a fixture record counted as real."
why: "Pack M12-I03: raw anonymised observations and a derived view from the same source. Nothing reads observations today because none exist."
current_state: "No observation kind or summary."
desired_state: "Observation records validate against their schema; the summary is generated; fixture records are excluded by rule."
scope:
  - ".ai/repo"
  - "share/schemas/majordomus"
  - "apps/majordomus-cli/src"
  - "docs/generated"
  - "test/cases"
non_scope:
  - "Any decision from the data; continue/pivot/retire is the owner's"
depends_on:
  - "I2264"
acceptance_criteria:
  - "The summary of a fixture set equals the hand-computed values in the case"
  - "A summary edited by hand fails generate --check"
  - "A record with fixture: true is excluded and the summary says how many were excluded"
validation:
  - "bin/majordomus plan validate"
  - "bin/majordomus-cli generate --check"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "observation_summary_case"
created_at: 2026-10-09
updated_at: 2026-10-09
