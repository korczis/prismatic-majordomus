id: I4811
milestone: finished-work-reaches-a-verified-release
title: "A green landing that carries an issue publishes vX.Y.Z-dev.N, and a completed milestone the minor, with no person tagging"
slug: a-landing-publishes-its-release
priority: p0
profile: implementation
parallel_safe: true
objective: "After master's validate concludes success on a push, scripts/ci/release-autotag (from .github/workflows/release-auto.yml, modelled by .ai/repo/ci/release-auto.yaml) reads the commit's records with the plan engine: an issue DONE there and not at the newest release tag the commit contains is tagged v<declared>-dev.<N>, N one past the highest such tag; a milestone DONE there and not at the last stable tag is tagged v<declared> when the tree declares at least the next minor; a tree that declares a released version gets a version.yml proposal for the next minor instead. It pushes the tag and dispatches release.yml for it exactly once. release.yml accepts a dev tag of the declared version through scripts/release-stamp, which stamps the tag's version into the build checkout and never into the tree."
why: "The owner's order of 2026-11-28 (majordomus decision add, verbatim): 'zase tisic let zadna verze / jaktoze spravne nefunguje to uatomaticke verzovani / bumpovani / kazdy issue musi bunpnout dev / Kazdy milestone minor / automagicky / resime to jiz po trocate'. ADR 0134 point 5 said nothing tags or publishes, docs/RELEASE.md called the tag a person's decision, and release.currency reported landed work overdue until a person tagged: 1.3.0 on 2026-11-28 was tagged by hand and its record #3202 merged by hand."
current_state: "At origin/master 649e41282d4 every v* tag is pushed by a person; release.yml refuses any tag that is not v<declared>; version.yml proposes contract bumps and never tags; site-deploy, install-check, release-check and release.yml's smoke know alpha, beta and rc as pre-releases and no other suffix."
desired_state: "A green master commit that landed an issue carries exactly one vX.Y.Z-dev.N tag and its prerelease is published by release.yml; a rerun tags nothing and dispatches nothing twice; a red commit tags nothing; a completed milestone is published as the minor; no person tags. Enforced by cases 4780 and 4781 and the release-auto workflow."
