intent: delivery-is-explained-by-evidence
reviewed_at: 4dfd1856d2
reviewed_by: "claude-code subagent (general-purpose, fresh context) dispatched by session b24c5456 with the records, the packs and the audits and none of the author's reasoning; same model and operator session as the author, so independent of the authoring context and not of its blind spots"
findings:
  - id: command-evidence-can-never-settle-a-criterion
    class: delivery_verification
    subject: "delivery-is-explained-by-evidence#one-query-explains-a-task"
    finding: "All fourteen criteria use `evidence: command`, which intent.rs:1135-1139 resolves to NotDerivable without reading the ref, and verdict() turns any NotDerivable into unknown: an intent about evidence can never be read satisfied by evidence, and a ref naming a test nobody writes is never reported. Every ref is a cargo test binary or a suite case, which `evidence: test` (crate:<binary>, suite:<case>) resolves and the ledger settles."
    blocking: true
    resolution:
      state: rejected
      because: "A `test` ref must name a test already in the tree or the validator fails it (apps/majordomus-cli/src/intent.rs:1101-1112, unresolved_evidence_ref), and every test these criteria name is written by the issue that serves the criterion; so each criterion names the command that will prove it until then, and the issue that adds the test switches its criterion to `evidence: test` in the same pull request."
  - id: case-selection-trusts-self-declared-reads
    class: regression_risk
    subject: I2348
    finding: "A case is left out of an affected plan on its own `# majordomus-reads:` header, and the only check is that header paths match tracked files; nothing proves a case reads no more than it declares (I2341 refuses an undeclared read for generators, I2348 has no counterpart). An under-declared header skips a case whose behaviour changed while `ci` stays green, against convergence pack 04.1 (conservative selection, full fallback when impact cannot be proven) and the intent statement that the verdict holds against a skipped job."
    blocking: true
    resolution:
      state: planned
      issue: I2348
      because: "I2348 now verifies every declaration by a file-read trace on each full Linux run and leaves a case out of an affected plan only with a verification from the last full run at the planned base."
  - id: skip-criterion-ref-is-already-green
    class: delivery_verification
    subject: "delivery-is-explained-by-evidence#skips-are-recorded"
    finding: "The ref `bash test/run.sh 94_ci_plan` names a case that exists and passes at 4dfd1856d2, so it cannot tell the plan before from the plan after; surfaces-agree and facts-carry-their-age share `--test surface_contract`, which I2362 starts and I2365 extends, so the first assertion to land answers both criteria."
    blocking: false
    resolution:
      state: open
  - id: derive-redesign-is-not-ordered-after-its-baseline
    class: regression_risk
    subject: derive-does-bounded-work
    finding: "Both packs ask for the baseline before any redesign (convergence 00, autopilot 00 issue 4), yet derive-does-bounded-work has depends_on [] and I2343 and I2344 depend only on I2341 and I2342, not on I2311; I2310 records the derive as unknown. A no-op or incremental derive can land before any derive sample exists, leaving I2370 no before side for the figure the packs care most about."
    blocking: false
    resolution:
      state: open
  - id: baseline-provenance-is-an-untracked-capture
    class: delivery_verification
    subject: I2310
    finding: "The record of 2026-10-10 is written from the audit capture, which lives under /tmp/ of the primary checkout, ignored by .gitignore:9, and is outside I2310 scope; the tracked figures then cite rows no other reader can check. Convergence 00.3 and autopilot 05 issue 1 also ask for CPU, IO, memory, cache hits and output churn over no-op, one-rule, Rust and docs-only scenarios, while I2311 records wall seconds only and no scenario set is part of the baseline."
    blocking: false
    resolution:
      state: open
  - id: no-regression-gate-is-planned
    class: insufficient_work
    subject: I2346
    finding: "Autopilot 05 issue 5, convergence 02.5 and 06.4 ask for budgets in the existing CI policy and a gate on bounded non-regression; I2346 is a manual `scripts/derive --benchmark --check` plus a doctor INFO or WARN that never changes the exit code, and I2370 gates nothing, so criterion budgets-are-measured is met by a judgement no routine run makes."
    blocking: false
    resolution:
      state: open
  - id: explain-adds-a-fifth-partial-join
    class: unnecessary_work
    subject: I2349
    finding: "The milestone lists four partial joins (intent_realization.explain, trace.issue and trace.commit, gates.completion, delivery.feature); I2349 adds a fifth capability beside delivery.feature and retires or folds none of them, against the operating contract of the packs (improve what exists and remove the competing implementation) and rule project.interfaces-are-projections."
    blocking: false
    resolution:
      state: open
  - id: slice-deployment-source-is-not-the-query-source
    class: unproven_assumption
    subject: I2366
    finding: "I2366 records the deployment observation on the issue evidence list so its case passes outside the observing checkout, but I2349 reads deployment from the served observations under .ai/local of one checkout and its acceptance names no issue-evidence source. Either the case fails in CI on an unknown deployment, or the issue record becomes a second source of deployment truth beside served.observe."
    blocking: false
    resolution:
      state: open
  - id: covered-elsewhere-claims-name-unrecorded-work
    class: missed_requirement
    subject: the-verdict-cannot-be-bypassed
    finding: "non_scope hands the correction of docs/CI.md:308 and :349-350 (which say master has no required check, false per audit-20261010/protection.json) to I2241, the CI acceptance gate and bypass cases to I2239 and I2240, and the verifier catalogue and CI receipt to I2245-I2247; none has a record on any ref, only placeholder prompts in gitignored tmp/, and I2302 and I2297 have no record either. The false document stays, and the bypass attempts of convergence 04.5 have no owner."
    blocking: false
    resolution:
      state: open
  - id: statement-promises-what-the-plan-only-reports
    class: missed_requirement
    subject: "delivery-is-explained-by-evidence#verdict-cannot-be-bypassed"
    finding: "The statement says the required verdict holds against an administrator, while the non-goals exclude changing GitHub settings and I2355 only reports that enforce_admins is false. I2356 records a foreign merge with `not_concluded`, as #901 was, and no issue of either intent stops a run from merging onto a master whose own `ci` never concluded."
    blocking: false
    resolution:
      state: open
  - id: completion-issue-collides-with-the-done-invariant-work
    class: regression_risk
    subject: I2357
    finding: "I2357 scope is all of apps/majordomus-cli/src/gates plus share/completion.yaml and its depends_on is empty, while the milestone says it starts only after #821 and I2301 land; session 95 holds gates/done.rs, gates/mod.rs and gates/closing.rs for I2301 on the board, and plan next offers I2357 as ready now."
    blocking: false
