id: I2686
milestone: development-runtime
title: "The cluster page states estimates, risks and timings only where a source records them"
slug: the-cluster-page-states-estimates-risks-and-timings-it-can-read
priority: p2
profile: implementation
parallel_safe: false
objective: "Add the sections of the owner's report that need measurements \u2014 estimates, risks and the derive and hook durations \u2014 read from the ledgers and timings the repository already keeps, and refuse to state what it cannot read."
why: "The owner, 2026-10-13/14: a brief report every minute with deliveries, plan, charts, dependencies and estimates, for every peer of the mesh, derived and generated, real time in /ui, nice in the console, on every surface and enforced from .ai. See ADR 0159."
current_state: "Measured on master a3a67a307e on 2026-10-14: integration.timings, the bench results and the evidence ledger hold durations; the cluster page reads none of them, and the estimates in the owner's report were written by a session from memory."
desired_state: "An estimates section derived from recorded durations of the same kind of work (a derive, a landing, a suite shard) with the sample size, and a risks section drawn from health findings, blocked issues and overlapping claims; each states its basis and says none where there is no sample."
scope:
  - "apps/majordomus-cli/src/capability/builtin/dashboard_cluster.rs"
  - "apps/majordomus-cli/src/integration/timings.rs"
  - "test/cases/3012_the_dashboard_is_one_reading.sh"
non_scope:
  - "Predicting the unmeasured"
depends_on:
  - I2685
acceptance_criteria:
  - "An estimate names the recorded durations it is the median of and how many"
  - "With fewer than three samples the page says there is no estimate"
  - "A risk is a finding another capability reported, with its pointer"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=2 bash test/run.sh 3012_the_dashboard_is_one_reading"
evidence_required:
  - "estimate_basis_case"
  - "risk_pointer_case"
created_at: 2026-10-14
updated_at: 2026-10-14
