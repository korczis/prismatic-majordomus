id: I0829
milestone: M004
title: Performance doctrine as project rules
slug: performance-rules
priority: p0
profile: implementation
parallel_safe: false
objective: "Add project rules: derived state is computed once per state version, a command's hot path does not re-parse canonical files, every public command is benchmarkable from the registry, cacheability never changes observable behaviour, and performance claims need benchmark evidence."
why: "A rule that lives only in a document is not enforced; project rules are loaded by every worker and named by doctor."
current_state: "No performance rule exists."
desired_state: "Five rules under .ai/repo/rules/project, advisory where a reviewer decides and enforced by the cases and counters where a case exists, each naming its case."
scope:
  - .ai/repo/rules/project
  - docs/DOCTRINE.md
non_scope:
  - Provider-specific copies
depends_on: []
acceptance_criteria:
  - rules list shows the five rules resolving
  - Each rule names the case or the review that proves it
validation:
  - bin/majordomus rules list
  - bash test/run.sh 67_rule_dag
evidence_required:
  - docs_integrated
risk: "project.no-new-nouns: the rules use the existing vocabulary (phase, counter, cache, baseline) and add no concept."
