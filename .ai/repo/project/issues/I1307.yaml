updated_at: 2026-09-09T20:37:43Z
started_at: 2026-09-09T20:37:28Z
verified_at: 2026-09-09T20:37:35Z
completed_at: 2026-09-09T20:37:43Z
evidence:
  - covers: chain_proved_both_ways
    type: test
    command: "bash test/run.sh 99_work_graph_chain"
    result: "one synthetic issue carried outcome -> issue -> branch -> commit -> pull request -> evidence -> accepted, then walked back from both the work commit and the merge commit to the issue and milestone they served; a commit with no contract reports unattributed rather than being dropped; completion is refused while required evidence is missing even though the fixture remote has the issue closed, and the projection reports that disagreement as DRIFT closed rather than resolving it either way; the case runs offline against fixture remotes with no token"
