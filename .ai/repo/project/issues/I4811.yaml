  - "Exempting a dev release's run from the release path's runner priority (scripts/ci/release-path)"
  - "Moving the decision into a typed capability beside release.currency (the inventory records the migration)"
acceptance_criteria:
  - "Case 4780: on a fixture with the real plan engine, a bare origin and a stub gh, a landed issue on a green commit yields exactly one annotated v1.4.0-dev.1 tag naming the issue and one release.yml dispatch; a rerun tags and dispatches nothing; a red commit tags nothing; the next green landing is v1.4.0-dev.2; a completed milestone is v1.4.0; a tree declaring the released 1.4.0 asks version.yml for 1.5.0 and is tagged v1.5.0-dev.1 once it declares it; an unreadable verdict refuses"
  - "Case 4781: release-stamp accepts v<declared>-dev.<N> and nothing else, stamps the manifest, the lock's own entry and share/version.txt so the shell tool prints the dev version; release.yml stamps before it packages; a dev release is a pre-release in site-deploy, install-check, release-check and release.yml"
  - "On master, the first green landing after this lands carries a v<declared>-dev.<N> tag whose release.yml run was dispatched by release-auto (the evidence names the run)"
