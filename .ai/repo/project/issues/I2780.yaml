id: I2780
milestone: idd-workspace
title: "The UI has an intent workspace: an intent, its milestones, issues, waves and graph on one screen"
slug: the-ui-is-an-idd-workspace
priority: p0
profile: implementation
parallel_safe: false
objective: "Add /ui/idd to the UI's screens: the intents as a choice with stage and verdict, the chosen one's criteria, its milestones in the roadmap's order with status, its issues with status, wave, priority and what blocks them, the waves those issues occupy, and the dependency graph between them with a table beneath it, every entity a link to its existing inspector and every ready issue a link to the move that starts it."
why: "On 2026-10-16 the owner asked to direct the work from the UI rather than from pasted prompts. Every answer the workspace needs is already a capability; what is missing is the one screen that starts from what the work is for."
serves:
  - the-owner-directs-work-from-the-ui#workspace-is-derived
current_state: "No /ui/idd; the plan is read on four screens, the waves on none."
desired_state: "/ui/idd answers with a hero, the intent choice, the criteria, milestones, issues, waves and graph panels, each naming its sources, and refuses an unknown intent by name."
scope:
  - "apps/majordomus-cli/src/ui"
  - "apps/majordomus-cli/tests/ui_idd.rs"
  - "docs/MAJORDOMUS_UI.md"
  - ".ai/repo/project"
depends_on: []
acceptance_criteria:
  - "The intent the query names, or the first executing then planned one in intents.list's order, is shown, and the rule is printed"
  - "Milestones, issues and waves come from plan.roadmap, plan.issues and plan.waves and no list of the screen's own"
  - "An issue added to the plan appears with no other edit"
  - "An intent that is not recorded is refused by name, and a capability that cannot answer says so in its panel"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
  - "cargo test --lib ui::"
  - "cargo test --test ui_idd"
evidence_required:
  - "ui_idd_tests"
