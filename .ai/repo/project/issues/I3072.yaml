id: I3072
milestone: a-version-follows-the-work
title: "A task holding the release seat does not finish completed while landed work has waited past the threshold"
slug: the-release-seat-finishes-only-current
priority: p1
profile: implementation
parallel_safe: false
serves:
  - a-version-follows-every-session#the-seat-releases
objective: "Add a doctrine of its own, enforced by finish with its own validator, policy key and wording, that reads release.currency. It refuses the outcome completed only to a task shown to hold the release seat. Before the gate is built, the join between a finishing task and the seat is defined: either the task claims release/seat exclusively under its own task-<id> session, or the seat's claim carries the task id in its task field, and the gate reads that join from mesh.state. The task holding the seat is refused completed when release.currency says overdue, and when the measurement is unknown. A pushed v* tag counts as released only while scripts/ci/release-check reads its run as queued or running, or once that run has succeeded; a failed run, or none past release-check's grace, refuses the seat, and a forge that cannot be read is reported, never counted. Every other finish is told the stance and whether release/seat is held, and is never refused by it; a measurement or seat that cannot be read refuses no other task. Case 3472 proves each of these, and the intent's criterion the-seat-releases names it."
why: "Rule 4 of the cooperation model binds the release seat. A seat that ends its session with overdue landed work leaves the owner's order unmet, with every check green. The plan critique of 2026-10-19 found that nothing joins a finishing task to the seat (a task's own claim is advisory and holds no seat), and that a gate copied into publication-currency's shape would refuse every task on an unknown measurement and name the published site as the cause."
current_state: "finish asks publication-currency about the site and nothing about the release, and no task record names the seat it holds."
desired_state: "The release seat's finish says completed only when the trunk's landed work is released, still inside the threshold, or being released by a run the release check reads as alive; every other finish names the stance and the seat's holder."
scope:
  - ".ai/repo/ci/gates.yaml"
  - ".ai/repo/policy.yaml"
  - ".ai/repo/rules/project/land-and-publish.v1.md"
  - ".ai/repo/project/intents/a-version-follows-every-session.yaml"
  - "apps/majordomus-cli/src/capability/builtin/release.rs"
  - "apps/majordomus-cli/src/capability/builtin/mesh.rs"
  - "lib/finish.sh"
  - "lib/gates.sh"
  - "lib/common.sh"
  - "docs/DOCTRINE.md"
  - "docs/RELEASE.md"
  - "test/cases/3472_the_release_seat_finishes_only_when_released.sh"
depends_on:
  - "I3070"
acceptance_criteria:
  - "A task shown to hold the release seat is refused completed when release.currency says overdue, naming the count, the wait and the version or the reason none was decided, and when the measurement is unknown"
  - "The same task finishes when its tag's run is queued or running by release-check's reading, or has succeeded, and when nothing has landed past the release; a failed run, or none past the grace, refuses it"
  - "A task that does not hold the seat is told the stance and whether release/seat is held, and is never refused by this gate, including when release.currency or the mesh cannot be read"
validation:
  - "bin/majordomus plan validate"
  - "bash test/run.sh 3472_the_release_seat_finishes_only_when_released"
evidence_required:
  - "case_the_release_seat_finishes_only_when_released"
