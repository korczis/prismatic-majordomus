id: I1305
milestone: external-workspaces
title: An observed contract has a fingerprint, a compatibility state and a fixture
slug: observed-contracts
priority: p1
profile: deep-work
parallel_safe: true
objective: "Record what the browser observed as a versioned contract: a fingerprint of the shape, a compatibility state, and a sanitised fixture that CI replays — so that a private surface changing is a diagnosable event rather than a silent wrong answer."
why: "A vendor's undocumented surface is not a contract and will change. The failure this must prevent is not the loud one; it is a parse that half succeeds and writes plausible nonsense into the store."
current_state: "Nothing exists."
desired_state: "Each observed operation carries a schema fingerprint and a state — compatible, degraded, incompatible. A shape that no longer matches marks the contract degraded, refuses to persist a partial parse, falls back to the browser transport, and captures a new sanitised observation for a person to review. No observation ever promotes itself to a production contract."
scope:
  - scripts/lib
  - test/cases
  - docs
non_scope:
  - Hardcoding any endpoint path taken from a prompt, a gist or documentation rather than from observed authorised traffic
  - Automatic promotion of a new observed shape
depends_on:
  - I1304
acceptance_criteria:
  - Every observed operation has a fingerprint over its shape and a compatibility state
  - A mismatched shape fails closed; nothing partial is persisted
  - A degraded contract falls back to the browser transport where one exists, and reports unavailability where none does
  - Fixtures are sanitised at capture time and CI replays them with no network and no account
  - Promoting a new contract requires a person and a passing test, and the mechanism cannot do it alone
validation:
  - bash test/run.sh
evidence_required:
  - fingerprinted
  - fails_closed
  - fallback_proven
  - fixtures_sanitised
  - promotion_manual
risk: "A fixture is a recording of private conversation. Sanitisation that runs after capture is sanitisation that has already failed; it runs before anything reaches disk."
created_at: 2026-09-09
updated_at: 2026-09-09
