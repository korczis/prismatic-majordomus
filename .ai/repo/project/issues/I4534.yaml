title: "The open UI pull requests and the older one-kit records each get a recorded end, the routes are inventoried, and the kit's gates start as ratchets, before the reintegration touches their paths"
slug: the-open-ui-pull-requests-are-triaged
priority: p0
profile: implementation
parallel_safe: false
objective: "Slice S0 of milestone one-frame-one-kit-one-library-per-job, in four parts. (1) The gates first. Its first commit adopts the kit with majordomus design kit adopt flowbite-pro (ADR 0230, decision 4: ui.kit, the repository's section of rule project.ui-uses-flowbite-pro, the design-kit-on-push and design-kit enforcement entries), so design licence and the gate come from the adoption and not from a hand-written workflow step, and makes design kit --check a ratchet in validate.yml, the pre-push hook and scripts/ci/run-plan (a gate of .ai/repo/ci/gates.yaml): it fails when the finding count exceeds a committed baseline (6 on 2026-11-17: 4 S3, 2 S5), and the baseline only shrinks. The same commit adds the ratchet case that refuses a page without the one frame's mark, a component class outside the kit (share/design/kit.css and share/design/primitives.css, with today's mj-ui- classes as the baseline I4537 shrinks) and a construction of ECharts, D3, p5, Alpine, Cytoscape or Chart.js outside share/design/js, each beyond a committed baseline that only shrinks; later slices shrink the baselines and I4546 holds them at zero. (2) Each of the nine open UI pull requests #2583, #1761, #1346, #1345, #1178, #1050, #966, #933, #2349, and every other open pull request whose diff touches a slice's scope, is assessed through the one integration engine (majordomus prs explain <n>) and carried to one end: landed through the landing seat's queue, absorbed into the slice that owns its paths (its commits kept, its pull request open until that slice merges), superseded by a named pull request, or held by the owner. A refs/rescue/ ref is written for each head before any branch is rewritten or any pull request is closed. (3) The pile-up the owner named on 2026-11-17 ('nakupene/nahromazene ukoly v .ai/ jsou nedotazene ... hromadi se issues/mrs/prs/intents') is given one end per record, read from its status on master, and no record is cancelled without a reason naming the slice that replaces it: I4334 and I4377 are delivered (plan delivery reads them released in v1.0.0-alpha.10 at 4346f610652 and fd411938fa2 while their records read READY), so their done stamps are recorded through plan done with the delivering commit as evidence; I3793's tab half moved to I4536 (I3793's record says so) and its copy control stays, later moved by I4535 under share/design/js/core without a second implementation; I3794 stays as I4535's dependency; I3790, I3791, I3795, I3796 and I3797 stay in their milestone (I3790 and I3791 wait on I2747, pull request #1294); I3792 and I2654 are merged into I4542 and I2656 into I4541, each closed by that slice naming its delivering commit; I4494 stays as I4541's dependency and I4495 as I4539's. (4) The routes are inventoried ('review vsech rotes'): every route of web.surfaces, the /ui router's route table, the Cockpit's route table (case 760) and the site's sections, each with the capability answers or data files it renders, read from those sources and never hand-listed; for every /ui screen and /cockpit page that render the same answers, a verdict: one page and a link from the other, or both kept with the ADR 0135 reason (delivery vocabulary against operations vocabulary); the swagger page and the handbook are listed exempt from the frame with the milestone's reasons. The inventory is the input of I4538 (SCREENS), I4544 (llms.txt) and I4546 (route coverage)."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). Open pull requests already change the paths the slices S1 to S12 rewrite; starting a slice over them would either conflict with them or silently drop their work. The owner's rule of 2026-11-14 (Visuals, derivation and links) says 'Enforced, not advised', so the gates land before the work they judge; and on 2026-11-17 he found issues, pull requests and intents piling up undone, so the older records this plan overlaps get an end here instead of a second copy."
current_state: "Open on 2026-11-07, read with gh pr view: #2583 feat(ui) the Blackboard is the board of the work (I4236), feature/the-blackboard-is-the-board-of-the-work; #1761 fix(ui) a screen behind the repository says why, and a page follows it by a pulse (ADR 0173), feature/a-display-behind-the-repository-says-why; #1346 feat(knowledge) /ui/knowledge browses the knowledge base, feature/the-knowledge-base-is-listed-and-browsed; #1345 feat(ui) a page computes the canonical digest in a Worker (I2788), feature/a-browser-computes-on-the-page; #1178 feat(ui) the Observatory hears executions as they happen (case 3046), feature/the-observatory-hears-executions-as-they-happen; #1050 Markdown is rendered once (ADR 0148), feature/markdown-is-rendered-once; #966 / is the UI's front door, and the capabilities are faceted (I2480, I2479), feature/the-capabilities-are-faceted; #933 feat(site) seven widths, a reduced-motion pass and a rendering budget, feature/the-site-is-probed-at-every-width-and-budget; #2349 feat(site) the navbar names the newest pre-release, feature/the-site-names-the-newest-prerelease; scripts/collision-check over the milestone's scope adds #1294 (feature/one-highlighter, I2747). #1346, #1345 and #1294 were last updated on 2026-11-17, the others between 2026-10-30 and 2026-11-01. Verdicts proposed on 2026-11-17 by the repair lane of PR #2962, context for this triage and not yet its evidence: LAND #1761, #1294, #1346 and #1345; ABSORB #2583 into I4537, #1178 into I4535, #966 into I4539 and #933 into I4546; SUPERSEDE #2349 by #2970; #1050 is held, and that hold is the owner's decision, not this triage's. Read on 2026-11-17: plan list reads I4334 and I4377 READY, I3793 and I3795 READY, I3790, I3791, I3792, I3794, I3796 and I3797 BLOCKED, I2654, I2656, I4494 and I4495 READY; plan delivery reads I4334 and I4377 released and the others at stage none. design kit reports 6 findings (4 S3, 2 S5) with ui.kit empty, and no gate runs it in validate.yml. No route inventory exists: the /ui routes are the hand list at apps/majordomus-cli/src/ui/mod.rs:140."
desired_state: "The ratchet gates stand in validate.yml and the pre-push hook before any other slice lands. Every open pull request on a slice's scope has a recorded verdict before any slice whose scope its diff touches starts; a landed or superseded one is closed, an absorbed one stays open until its absorbing slice merges and is then closed by that slice naming the delivering commit. Every older record named here has its end recorded, and I4334 and I4377 carry their done stamps. The route inventory is recorded with a verdict for every /ui and /cockpit pair over the same answers."
