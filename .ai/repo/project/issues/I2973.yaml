id: I2973
milestone: "a-session-proceeds"
title: "The choice ranks by what it unblocks"
slug: the-choice-ranks-by-what-it-unblocks
priority: p1
profile: implementation
parallel_safe: false
objective: "Move the transitive-unblock count from proceed.rs into Plan::unblocks (distinct unfinished issues that depend on an issue, walked only through unfinished ones, each counted once), and order READY issues by it after milestone membership, wave and priority and before id, in plan.rs (ready_in_order, so plan.next and proceed.plan) and lib/project.sh (mj_pj_ready_ranked) together, held to one answer by case 99."
why: "ADR 0177 decision 2: the order is explainable before it is clever, and the first term beyond the plan's own order is what a choice unblocks. Until now proceed.plan shows the count and does not rank by it; a READY issue that unblocks seven others waits behind one that unblocks none whenever their ids say so."
current_state: "READY issues are ordered by milestone membership, wave, priority and id; proceed.plan reports unblocks without ranking by it."
desired_state: "Among READY issues of equal milestone membership, wave and priority, the one that unblocks more is handed out first by plan.next, majordomus plan next and proceed.plan alike; adding a dependency to the plan changes that order and the reason with no list edited."
