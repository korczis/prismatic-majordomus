id: I4224
milestone: builds-reuse-the-mesh-cache
title: "A command line that carries a secret is refused before it lands"
slug: a-secret-on-a-command-line-is-refused
priority: p1
profile: implementation
parallel_safe: true
objective: "The typed capability quality.secret_argv (gate secret-argv, rule project.a-secret-never-travels-on-a-command-line) refuses a Rust or shell command line that carries a value read from a credential source. Each finding names the file, the line and the rule, so the defect I3996 removed from cache_provision.rs cannot come back anywhere."
why: "I3996 moved mesh build-cache provision's MinIO secret from mc's argv to its standard input. The defect existed because nothing refused it: no gate, rule or case looked at what a command line carries, and the review of I2674 (#2402) found it by reading. An argument can be read by every user of the host in ps and /proc/<pid>/cmdline for as long as the command runs. The intent this milestone serves says no credential appears in a process's environment, a log or an answer."
current_state: "Measured at master b62848cb6f5 with I3996 (#2519) on top, on 2026-10-25: no gate, rule or case refuses a secret on a command line. A search of the Rust (Command::new, .arg, .args), lib/, scripts/ and share/ found no other secret handed to a child as an argument."
desired_state: "No command the repository runs carries a secret in its argv. The forms that pass are standard input, the child's environment and a 0600 file. A new command line that carries a secret is refused at pre-push and in CI."
scope:
  - "apps/majordomus-cli/src/quality/secret_argv.rs"
  - "apps/majordomus-cli/src/quality/mod.rs"
  - "apps/majordomus-cli/src/capability/builtin/quality.rs"
  - "apps/majordomus-cli/src/commands/quality.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - ".ai/repo/ci/gates.yaml"
  - ".ai/repo/rules/project/a-secret-never-travels-on-a-command-line.v1.md"
  - ".ai/repo/project/issues/I4224.yaml"
  - "test/cases/3996_a_secret_never_travels_on_a_command_line.sh"
non_scope:
  - "The GitHub workflows: their run: blocks receive secrets through env: and write them with shell builtins, and they are not shell units the check reads"
  - "The cache_provision.rs fix itself, which is I3996"
depends_on:
  - I3996
acceptance_criteria:
  - "The gate refuses a fixture that pushes a secret read from a credential file onto an argv, and passes the fixed form"
  - "The gate refuses a shell fixture that passes a token as an argument of an external command, and passes the same value given on standard input or in the child's environment"
  - "This repository's tree passes the gate"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=2 bash test/run.sh 3996_a_secret_never_travels_on_a_command_line"
evidence_required:
  - "secret_argv_case"
serves:
  - "a-build-reuses-what-the-mesh-already-built#nothing-secret-nothing-unbounded"
created_at: 2026-10-25
updated_at: 2026-10-25
