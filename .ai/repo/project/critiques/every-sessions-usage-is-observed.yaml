intent: every-sessions-usage-is-observed
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author, and reconciled with the plan by a third after the 2026-10-18 verification. Read only: nothing was run. Disposition: Accept with required changes: all 9 findings are planned, including the 4 blocking ones. The intent's criteria were repaired in the plan on 2026-10-18; the existing execution-telemetry milestone and I0301-I0304 are repaired by I3287, the issue every telemetry issue waits on, and the absence, receiver, Codex-seam and billing-mode decisions are written into I3288, I3289, I3290 and I3292."
findings:
  - id: telemetry-chain-blocked-behind-runtime-adapters
    class: insufficient_work
    subject: "every-sessions-usage-is-observed"
    finding: "I3288, I3290 and I3292 depend on I0301, which `majordomus plan show I0301` reports as BLOCKED (derived) even though it has no issue dependencies. The block comes from its milestone: .ai/repo/project/milestones/execution-telemetry.yaml:27-28 depends_on runtime-adapters, which is PLANNED with 1 of 6 issues ready and sits behind foundation. ADR 0213's Consequences says 'execution-telemetry loses its dependency on runtime-adapters', but the worktree changes no milestone file; the only modified files are campaigns/MANIFEST.sha256 and campaigns/README.md. I0301-I0304 are still scoped to shell-era lib/bin/share, I0302 does the same job as I3288, and I0303 owns the absence criterion. The new milestone also restates execution-telemetry's outcome while every issue's why says 'It extends milestone execution-telemetry / cost-per-accepted-outcome / routing-recommendations / development-runtime', so two milestones would rank the same work. Fix before starting: remove the runtime-adapters dependency from execution-telemetry, rescope I0301 to apps/majordomus-cli/src/economics and share/schemas, and fold I0302 into I3288 and I0304 into I3293/I3294. Either file these issues in execution-telemetry or have that milestone point at this one."
    blocking: true
    resolution:
      state: planned
      issue: I3287
      because: "Verified: execution-telemetry.yaml still depends_on runtime-adapters and is unmodified in the worktree while ADR 0213 promises otherwise; I0301-I0304 are scoped to lib/bin/share. I3287 has no dependencies and every telemetry issue of this milestone already depends on it or now does (I3292 gains depends_on I3287), so I3287 carries the plan repair as its first deliverable: drop runtime-adapters from execution-telemetry (as ADR 0213 states) and make it depend on every-sessions-usage-is-observed, rescope I0301 to apps/majordomus-cli/src/economics and share/schemas, cancel I0302 as superseded by I3288 (its criteria are copied into I3288), rescope I0303 to test/cases over the Rust receiver and I0304 to the Rust economics read surface (I3294 keeps its existing dependency on I0304, which is why I0304 is rescoped rather than cancelled), so that no criterion is ranked by two milestones."
  - id: economics-usage-turns-absent-into-zero
    class: unproven_assumption
    subject: "I3288"
    finding: "I3288 says to 'map ... through economics::usage' and also to record absent fields as absent. The existing normalisation cannot do that. apps/majordomus-cli/src/economics/usage.rs:86-88 `fn u` returns `unwrap_or(0)` for a missing key, EconomicsRequest (economics/model.rs:583-597) stores every token category as a plain u64, and openai_request sets cache_creation_input_tokens to 0 'which is what it is'. Turning those fields into Option would change the schema of the recorded benchmark runs under .ai/repo/benchmarks/economics/runs/context, and the report/stats calculators that read them, which is a regression risk no issue owns. There is also a name clash: 'the execution record' that I3288 and I3292 extend does not exist (no not_reported in src or share/schemas), while apps/majordomus-cli/src/execution/ already defines capability executions (ExecutionStore, executions.get). I3292's 'give the execution record reported_tokens' could land on the wrong type. I0301 (rescoped) must first define the usage record with Option<u64> plus a reason and a lossless mapping from the existing normalisers, with a test that a missing cache-write field reads absent. The benchmark record stays unchanged."
    blocking: true
    resolution:
      state: planned
      issue: I3288
      because: "Verified usage.rs:86-88 `u` defaults to 0 and apps/majordomus-cli/src/execution/ is the capability-execution store. I3288 now requires a separate usage record type in economics (Option<u64> per category plus an absence reason) fed by a lossless adapter over the existing normalisers, a test that a missing cache-write field reads absent, and an unchanged benchmark record and run files; I3292 is amended to put its fields on that usage record and never on execution::Execution. The I0301 rescope in I3287 writes the same definition into I0301."
  - id: receiver-endpoint-is-not-stable
    class: unproven_assumption
    subject: "I3289"
    finding: "I3289 writes a persistent user-level OTEL_EXPORTER_OTLP_ENDPOINT that points at 'the shared server's loopback listener', but that listener has no stable address. The shared server binds a derived port (8741 for the primary checkout, its own block for each linked worktree; cli.rs:3878-3890) and takes a free port when that one is busy (http/server.rs:130-139); this session's server is on 54441. It is also a client's child that exits when idle (ADR 0003/0103). A user-level variable names one URL for every Claude Code session on the machine. Sessions in linked worktrees and in other repositories would post to whichever process holds that port, or to nothing. Events sent before the MCP server starts, and the exporter's final flush after it idles out, are dropped by the client and leave no absence record. Decide the receiving process before I3288 is built: a stable receiver (as ADR 0199 proposes), or launcher-scoped env plus OTEL_RESOURCE_ATTRIBUTES naming the checkout. Add cases for three things: an event from an unknown repository or checkout is not stored, a gap while the receiver was down is recorded, and the dry-run output names the port the receiver actually holds."
    blocking: true
    resolution:
      state: planned
      issue: I3289
      because: "Decision as plan author: collection is launcher-scoped by default, with OTEL_RESOURCE_ATTRIBUTES naming repository and checkout and the endpoint read from the port the receiver holds at apply time. A persistent user-level endpoint is written only once a stable receiver (the ADR 0199 hub) is declared, and is refused before that. I3288 refuses events from an unknown repository or checkout. I3293 records a session span without received events as absent with reason receiver_unavailable. I3289 gains the dry-run port case. All three cases the finding asks for are now acceptance criteria."
  - id: codex-sessions-the-person-starts-are-unseen
    class: unproven_assumption
    subject: "I3290"
    finding: "App-server notifications (thread/tokenUsage/updated) reach only the app-server's own client, so Majordomus sees Codex usage only for sessions it starts itself. I3289's own why says most sessions are started by the person. The source turn (6ace668b, transcript line 126) proposes a read-only adapter over local session files for independently started sessions, and the intent's non_goal 'transcript parsing' forbids exactly that. I3289 configures only Claude Code's environment. Codex lifecycle is `unadapted` (share/providers.yaml:136-141), so no session record carries a Codex provider_session and I3293 would put every Codex record in the unattributed bucket. The criterion cumulative-is-never-summed checks fixture arithmetic only, so 'every Codex session' in the statement has no proof and no path. Before writing the app-server mapping, verify whether Codex's own OpenTelemetry export reaches person-started sessions and declare that seam with evidence in prv-10. Otherwise narrow the statement to Codex sessions Majordomus launches."
    blocking: true
    resolution:
      state: planned
      issue: I3290
      because: "ADR 0213 rejects transcript parsing, so session files stay out. I3287 must declare Codex's usage seam with dated evidence, including whether Codex's own OpenTelemetry export covers sessions the person starts. I3290 has I3287's evidence as a precondition. Where that export exists, I3290 maps it through the same receiver and I3289 generates its configuration. Where it does not, every surface reports person-started Codex usage as not observed with the reason, never as zero and never only in the unattributed bucket, with a case. In the plan the statement now says usage is recorded as not observed, with the reason, where the provider reports nothing Majordomus can receive, and #cumulative-is-never-summed includes that reading."
  - id: no-unmeasured-claim-is-already-true
    class: unnecessary_work
    subject: "every-sessions-usage-is-observed#no-unmeasured-claim"
    finding: "This criterion is already true on master, so it proves nothing about this plan. economics/claims.rs:1-20 scans prose for unsupported quantities, test/cases/431_economics_claims_gated.sh:32-58 expects exit 10, and site/content/economics.md states the refusal. I3297, I3298 and I3299 claim to serve it, but none of them is needed to make it true and none is proven by it. I3299 (CLI start, idle CPU, resident memory, derive budgets in an adopting repository) has nothing to do with session usage. It overlaps I2485, ADR 0169, rule project.performance-evidence and `bench --check`, and its own why says it extends development-runtime, so move it there. I3298 is ADR 0082 benchmark design and belongs to cost-per-accepted-outcome. Replace the criterion with one this plan makes true, for example: economics check refuses a waste finding's counterfactual effect, or a subscription session's price-list estimate, when either is presented as a saving or as spend. That requires the check to read generated and UI surfaces, not only hand-written prose. The statement's 'used to judge what Majordomus costs and saves' has no criterion either."
    blocking: false
    resolution:
      state: planned
      issue: I3297
      because: "I3297 carries the proof this plan makes true: economics check refuses a counterfactual waste effect, or a subscription price-list estimate, presented as a saving or as spend, on generated and UI surfaces as well as prose, with a case. In the plan (2026-10-18) the intent's #no-unmeasured-claim is replaced by #no-estimate-shown-as-spend-or-saving, which I3297 serves. I3298 and I3299 no longer serve it. Rather than being re-filed into cost-per-accepted-outcome and development-runtime, milestones no intent owns (the 2026-10-18 verification refuses unbound work), they serve two criteria that give the statement's 'costs and saves' the proof it lacked: #savings-are-measured-by-arm (I3298) and #own-overhead-is-measured (I3299)."
  - id: absence-and-gemini-have-no-criterion
    class: missed_requirement
    subject: "every-sessions-usage-is-observed#claude-code-usage-recorded"
    finding: "The milestone's acceptance criterion 'A provider that reports nothing yields an explicit absence record, never a zero' is not one of the intent's criteria and no issue in this milestone serves it; only I0303, shell-scoped and blocked, does. That leaves the central invariant untested. Gemini is named in the statement but has no criterion: I3291 serves claude-code-usage-recorded, which its test_gemini_usage_maps cannot prove. Gemini CLI's OTLP 'http' protocol encoding is also unverified. If it sends protobuf, I3291 is impossible under I3288's 'no protobuf, no dependency' non_scope. Add an absence criterion with a case (a declared `usage: none` provider and an OTLP event missing a category both produce absent with a reason, and no surface prints 0), and a Gemini criterion whose fixture is captured from a dated client version."
    blocking: false
    resolution:
      state: planned
      issue: I3288
      because: "I3288 owns the absence case: a declared `usage: none` provider and an OTLP event missing a category both yield absent with a reason, and no surface prints 0; I0303's rescope in I3287 points at the same case. I3291 needs a fixture captured from a named, dated Gemini CLI version, plus verification that its OTLP http export is JSON; if it is protobuf only, I3291 reports itself blocked by I3288's non_scope instead of adding a dependency. Applied in the plan on 2026-10-18: #a-silent-provider-is-absent is served by I3288 and the new #gemini-usage-recorded by I3291."
  - id: ui-usage-view-duplicates-token-spectrum
    class: surface_missing
    subject: "I3294"
    finding: "I3294's current_state ('The economics page renders benchmark results only') is wrong: /ui has no economics page. Usage is drawn today by the observatory's 'Token Spectrum' scene over economics.runs (ui/observatory.rs:199-206 and 648-655, linking to /ui/evidence). A separate usage view would be a second rendering of usage unless it replaces or extends that scene. No issue covers /cockpit (live.rs), site/content/economics.md, or the MCP/HTTP/OpenAPI projection and share/commands.yaml entry for the new `economics usage --by issue` (I3293) and `economics findings` (I3297) capabilities. The desired state 'published snapshot shows only aggregates the publication rule allows' contradicts the invariant that usage is runtime state and never in .ai/repo: the CI-taken snapshot has no usage store. Say the snapshot shows the absence, and add an acceptance criterion for it."
    blocking: false
    resolution:
      state: planned
      issue: I3294
      because: "I3294 now extends the observatory's Token Spectrum scene instead of adding a second rendering. Its scope adds apps/majordomus-cli/src/live.rs and site/content/economics.md. It gains a criterion that the published snapshot shows the absence of a usage store and no figures. I3293 and I3297 now owe their capabilities' canonical declarations and the generated share/commands.yaml and MCP/HTTP/OpenAPI projections, through majordomus generate."
  - id: no-live-round-proves-collection
    class: delivery_verification
    subject: "every-sessions-usage-is-observed#claude-code-usage-recorded"
    finding: "Every planned proof replays fixtures. Nothing shows that a real session with collection turned on through I3289 leaves records, or which client version produced each fixture. I3289's desired state mentions a doctor that says whether collection is on per provider, but none of its acceptance criteria does. Several vendor facts are taken on the ChatGPT assistant's word, not on documentation cited the way providers.yaml cites it: the request id on claude_code.api_request, and the `claude_code.compaction` event with pre_tokens/post_tokens that I3296 relies on (6acd352a transcript line 25). The PreCompact hook payload carries no token counts, and lib/capture.sh:286 captures only the hook, so if that event does not exist I3296 can only be met by transcript parsing, which is a non_goal. Required: fixtures headed with client name, version and capture date; a doctor-style check of the age of the last received event per provider; and I3296 gated on a captured compaction event."
    blocking: false
    resolution:
      state: planned
      issue: I3289
      because: "I3289 now requires a per-provider report of whether collection is on and how old the last received event is. It also requires one recorded live round: a real Claude Code session with collection on, whose records are kept as evidence with the client version. I3288 requires every fixture to name its client, version and capture date, and treats the request id as optional until a fixture shows it. I3296 is gated on a captured compaction event from a dated client version. Without one, compaction counts are recorded absent, and transcript parsing stays excluded under ADR 0213."
  - id: billing-mode-has-no-reporter
    class: unproven_assumption
    subject: "I3292"
    finding: "I3292 adds billing_mode (subscription, api_key, api_credits, unknown), but no planned seam reports which account paid. None of the Claude Code OTel, Codex app-server or Gemini events in the sources carries a plan type. Under I0301's 'every field names its reporter' the value would be declared by a person or inferred, and the issue says neither. Name the reporter: a declaration the person makes through the consented I3289 step, recorded as declared rather than observed, otherwise unknown. Test that an inferred value is refused."
    blocking: false
    resolution:
      state: planned
      issue: I3292
      because: "I3292 names the reporter. billing_mode is a declaration the person makes in the consented I3289 step and is recorded with class declared, not observed. Without that declaration it reads unknown. An inferred value is refused, and a test covers the refusal."
