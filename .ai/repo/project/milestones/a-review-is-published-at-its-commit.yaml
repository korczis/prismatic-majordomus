  - "Blaming every cited line of a large baseline costs build time; I4301 measures it and bounds it before it lands"
  - "The ECharts custom build for the treemap must stay inside the homepage byte budget, which loads charts lazily (I4304)"
  - "#2520 holds an exclusive claim on apps/majordomus-cli/src/cockpit/pages.rs; nothing in this milestone edits it, and the Cockpit quality page's commit is I4311's in the second milestone"
