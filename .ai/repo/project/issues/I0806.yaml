id: I0806
milestone: M003
title: Make the session rules doctrines, with retention and archiving
slug: session-doctrines-retention
priority: p1
profile: implementation
parallel_safe: false
objective: "Finish the session rules: the record and lifecycle rules are declared in share/standard/majordomus/ and dispatched by doctor and watch; what remains is a reference to a record that does not exist, retention over a declared cap, and policy-driven archiving that never deletes and never overwrites."
why: "A rule enforced by an inline check in one command is the declared-but-not-wired failure this tool measures in other people's repositories. Every enforced rule here is declared in the registry and dispatched from it, or it is not enforced."
current_state: "Measured on master 4090b2b8ae, 2026-10-08. Two session rules are declared in share/standard/majordomus/rules and dispatched by doctor and watch: majordomus.session-records (validator session_records, test/cases/63_session_records.sh) and majordomus.session-lifecycle (validator session_lifecycle, test/cases/54_session_lifecycle_hooks.sh), landed in e9ffa54f1c. Doctor reports an episode left open past session.stranded_after. Not on master: the policy (.ai/repo/policy.yaml since bd7cb2a579) carries retention caps for checkpoints, handovers and the ledger and none for sessions; share/allow/policy.txt lists no session retention key; majordomus.retention-caps does not report sessions; lib/session.sh has no archiving. history --rotate remains the precedent for retention that archives rather than deletes and refuses to overwrite an existing archive."
desired_state: "The session rules that exist stay declared and dispatched. The policy carries a session retention cap and whether archiving is enabled, its keys are in the policy allowlist, and majordomus.retention-caps reports sessions alongside checkpoints and handovers. A session naming a checkpoint that does not exist is reported, naming both. Archiving happens only when a command asks for it."
scope:
  - share/standard/majordomus/
  - share/allow/policy.txt
  - share/skeleton
  - lib/session.sh
  - lib/doctor.sh
  - lib/watch.sh
  - .ai/repo/policy.yaml
  - test/cases/63_session_records.sh
non_scope:
  - Any background or automatic maintenance
  - Deleting a record under any circumstance
depends_on:
  - I0805
acceptance_criteria:
  - majordomus.session-records and majordomus.session-lifecycle appear in the rule list with a validator that exists, and doctor proves each reaches the command that claims to run it
  - A malformed closed record fails doctor and drifts watch, and the finding carries a reproduce command
  - A session naming a checkpoint path that does not exist is reported, naming both
  - Archiving moves records without deleting them and refuses to overwrite an existing archive
  - A session left open longer than the policy allows is reported by watch and does not block anything
validation:
  - bash test/run.sh 63_session_records
  - bin/majordomus doctor
  - bin/majordomus watch
evidence_required:
  - session_doctrines_wired
risk: "An open session is normal for most of its life, so the staleness rule has to be advisory. A blocking check on an open session would refuse work during the episode it is meant to describe."
