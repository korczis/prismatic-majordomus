depends_on: []
acceptance_criteria:
  - "A session-start hook announces the session's cross-session address on the board, and the board row carries it"
  - "An offload derive and a remote run export the owner (session key, peer, issue) into the remote process environment and write it into the host's run record"
  - "mesh who answers the owner of a remote pid, a local pid, a worktree path and an issue, with the address, from a fixture of two sessions"
  - "A command that starts cargo on a cluster host outside the offload path is refused by a hook, naming the traced path"
  - "A remote run is started in its own process group and stopped as a group; a run's leftover (parent init, working directory deleted) is found by a sweep and named with its owner (measured 2026-10-22: rustc pid 1416661 survived its cargo and bash being killed, 50 min, lundra in 11 GiB swap)"
validation:
