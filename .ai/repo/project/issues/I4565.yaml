id: I4565
milestone: development-runtime
title: "The kit licence judge starts its git through the busy retry, so a stand-in git written a moment ago is waited for, not failed"
slug: the-kit-licence-judge-starts-git-through-the-busy-retry
priority: p1
profile: implementation
parallel_safe: true
objective: "Every start of git in design::licence (git_out, git_ok and the cat-file --batch child) goes through crate::process::retrying_busy, so a test's stand-in git that another test thread's forked child still holds open no longer fails the judge with ETXTBSY."
why: "Master validate 42516893636 on 51719a44824 (2026-11-08) failed rust (2) on one test of 4608: design::licence::tests::a_git_that_fails_half_way_is_no_answer_never_a_clean_tree panicked at licence.rs:1775 with \"git could not start: Text file busy (os error 26)\". The test writes a stand-in git script (fake_git) and the judge runs it at once. On Linux a child forked by another test thread while the script was open for writing holds it busy until that child execs. process.rs names that race and retrying_busy waits it out for the other just-written programs in the crate (I4245, I4373). design::licence started git directly in three places."
current_state: "Measured at origin/master df412480833 on 2026-11-09: git_out calls Command::output(), git_ok Command::status() and fingerprint_objects Command::spawn() on the configured git once each."
desired_state: "All three start git through crate::process::retrying_busy, which asks again for up to five seconds while the program's file is busy and answers any other failure at once."
scope:
  - "apps/majordomus-cli/src/design/licence.rs"
  - ".ai/repo/project/issues/I4565.yaml"
non_scope:
  - "The stand-in git the tests write, which stays as it is"
  - "Other modules that start programs directly (I4486 makes one typed capability for that)"
depends_on: []
acceptance_criteria:
  - "The design::licence tests pass, every git start going through retrying_busy"
  - "A git that cannot start for another reason is still answered at once as git could not start"
validation:
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib -- design::licence process::"
evidence_required:
  - rust
serves: []
created_at: 2026-11-09
