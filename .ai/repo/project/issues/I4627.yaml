id: I4627
milestone: adopter-upgrades
title: "scripts/derive borrows MAJORDOMUS_BIN over a merged crate only when it is of the tree's generation, and otherwise builds its own and says why"
slug: a-merge-does-not-borrow-a-foreign-executable
priority: p1
profile: implementation
parallel_safe: true
objective: "Where the tree's crate came through a merge, scripts/derive uses a borrowed MAJORDOMUS_BIN only when mj_rust_same_generation accepts it: the commit it was built from (MAJORDOMUS_BIN_COMMIT) carries the tree's crate inputs (MJ_RUST_CRATE_INPUTS) byte for byte. Otherwise the derive drops the borrowed executable, prints which merge and which generation answer it refused, and builds this tree's own. The crate came through a merge in exactly two cases. Either MERGE_HEAD is present and the staged merge changes MJ_RUST_CRATE_INPUTS against HEAD, or HEAD is a merge whose crate inputs differ from its first parent's. A merge that leaves the crate alone borrows as before. The scratch derive of a merge in progress is handed the commit its executable is of: the merge commit when the outer derive built it, or the commit a borrowed one was vouched for by. That way it does not build a second time. The release job records the commit its executable was built from right after the build, because the default branch's tip is usually a merge."
why: "On 2026-11-17 the landing seat built the combined top #3065 (#3044, #3047, #3062 and #3064 on master e54bbdb). Its script exported MAJORDOMUS_BIN after the first member, so every later derive borrowed the first member's executable. Nothing refused it. `majordomus generate` (refuse_foreign_generation, check 3) lets an executable of another generation through when it projects the committed docs/generated/registry.json, and after a merge that file is the side scripts/merge-derived kept, which is what the same executable wrote one derive earlier. The check compared the executable with its own output. Pre-push ran 47 gates and 233 cases green. derive-check passed with the same binary. The top carried an openapi.json byte-identical to e54bbdb's, without #3062's capabilities. Only CI's rust (3) job, which builds a fresh executable, found the eight stale artifacts (run 43987911544, `generate --check` exit 10). The landing seat fixed its script, but any merge-and-derive flow that borrows an executable reaches the same hole: a repair, an integration top, or a session that sets MAJORDOMUS_BIN to skip a ten-minute build."
current_state: "Measured on 2026-11-17 at origin/master e54bbdb12a. scripts/derive takes MAJORDOMUS_BIN without asking anything ('not building; it must be of this tree's generation'). It relies on the executable's own refusal (generate exit 15), whose third check accepts a registry the tree has committed. The shell already has the notion of generation, mj_rust_same_generation in lib/rust_bin.sh (I2848), but only scripts/ci/run-plan applies it before borrowing. The release workflow's derive sets MAJORDOMUS_BIN without MAJORDOMUS_BIN_COMMIT. The pages workflow already passes MAJORDOMUS_BIN_COMMIT=$GITHUB_SHA."
desired_state: "A derive over a merged crate either runs an executable built from that crate or builds one, and its log says which and why. The committed registry is never the only witness that an executable fits a tree whose crate the merge driver did not derive. Follow-up, not in this record: `majordomus generate` voids check 3 under the same condition and refuses (exit 15), so a caller that runs generate without scripts/derive is covered too. Until then that caller is still exposed."
scope:
  - "scripts/derive"
  - ".github/workflows/release.yml"
  - "test/cases/4627_a_merge_does_not_borrow_a_foreign_executable.sh"
  - ".ai/repo/project/issues/I4627.yaml"
non_scope:
  - "majordomus generate's own check 3 (refuse_foreign_generation, projects_the_committed_registry): the Rust follow-up named in desired_state"
  - "A tree whose crate moved through a rebase or a cherry-pick rather than a merge"
  - "The landing seat's integration script, which is outside the repository and already fixed"
  - "lib/rust_bin.sh, which two open members of the combined top change: the condition lives in scripts/derive and uses mj_rust_same_generation as it is"
acceptance_criteria:
  - "HEAD merges two crate changes and MAJORDOMUS_BIN is the first side's (MAJORDOMUS_BIN_COMMIT names it): the derive prints 'not borrowing', the merge and 'the crate differs from <commit>', builds once, and never runs the borrowed executable"
  - "The same merge with MAJORDOMUS_BIN_COMMIT unset: not borrowed, reason 'the commit it was built from is unknown'"
  - "The same merge with MAJORDOMUS_BIN_COMMIT=HEAD: borrowed, nothing built"
  - "A merge that changes no crate input borrows an executable of an older or unknown commit as before"
  - "A merge in progress that changes the crate is built exactly once, and the scratch derive of the merge borrows that build"
  - "Against master's scripts/derive the case fails at its first scenario (negative control). With the scratch hand-off removed it fails at its fifth"
  - "The release job records MAJORDOMUS_BIN_COMMIT=$(git rev-parse HEAD) in GITHUB_ENV in its own step right after the build, so the publish step stays `run: scripts/derive` (the command case 87_release_pipeline orders)"
validation:
  - "bin/majordomus plan validate"
  - "env -u MAJORDOMUS_SHARE bash test/run.sh 4627_a_merge_does_not_borrow_a_foreign_executable 3837_a_derive_does_not_run_mid_merge 3963_a_merge_of_master_derives_in_one_go 87_release_pipeline"
evidence_required:
  - "a_merge_does_not_borrow_a_foreign_executable"
