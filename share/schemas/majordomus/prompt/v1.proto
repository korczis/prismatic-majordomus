// majordomus.prompt/v1 — the Markdown document a captured prompt renders as.
//
// One identifier, two projections, each described in the language that fits it. The record is
// JSON and is described by JSON Schema, in `v1.schema.json` beside this file. The document is
// Markdown — a shape, an order, and sections that are present or absent — and is described here,
// where a message and its field numbers say "these parts, in this order" without pretending the
// file is a bag of keys.
//
// Both are reachable from the identifier alone: `<namespace>.<name>/<version>` lives at
// `share/schemas/<namespace>/<name>/<version>`, with `.schema.json` for the record and `.proto`
// for the document. The `schema` member of every record, and `schema:` in the front matter of
// every rendering, is that identifier, so a reader holding either half holds the way to read
// both. There is no registry in between that could fall out of step.
//
// Protobuf is used here as a schema language, not as a wire format: nothing serialises these
// messages. Field numbers are the order of the sections in the file, and `optional` means the
// section is present exactly when the record carries the member behind it — never that it was
// dropped. Capture runs in the provider's hook before the model is invoked, so a document
// rendered from a record the hook alone wrote has no CONTEXT and no OUTPUT, and that is the
// normal case rather than a deficient one.

syntax = "proto3";

package majordomus.prompt.v1;

// PromptDocument is `.ai/local/prompts/<YYYYMMDDHHMMSS>-<slug>.md`, beside the record of the same
// stem. It is a projection: it holds nothing the record does not, it is regenerated by
// `majordomus capture render`, and it is never edited by hand — an edit is lost on the next
// render, which is why the record and not this file is what the archive guarantees.
//
// The field numbers are the order in the file:
//
//   ---                            1  front_matter
//   ---
//   # Prompt — <started_at>        2  heading
//   | | |                          3  summary
//   ## CONTEXT                     4  context      (optional)
//   ## OUTPUT                      5  output       (optional)
//   ## PROMPT                      6  prompt       (always, always last)
message PromptDocument {
  // YAML front matter: every member of the record except `text`, in the record's own order,
  // followed by `record`. Members the record does not carry are omitted rather than written as
  // null. The values are what a YAML parser reads; the record is what they came from.
  FrontMatter front_matter = 1;

  // `# Prompt — 2026-09-05 12:48:55 UTC`, the record's `started_at` in a form a person reads.
  string heading = 2;

  // The same members as the front matter, as a two-column Markdown table: Started, Finished,
  // Duration, Provider, Model, Session, Prompt, Source, Repository, Branch, Directory, Schema,
  // Record. A row is omitted when the record does not carry it, because an absent row tells a
  // reader more than a row reading null.
  //
  // Saying it twice is not duplication that can drift: one function writes the front matter and
  // the table out of one record in one pass.
  SummaryTable summary = 3;

  // `## CONTEXT` — what was loaded when the prompt was read. Present exactly when the record
  // carries `context`.
  optional ContextSection context = 4;

  // `## OUTPUT` — how the turn ended. Present exactly when the record carries `output`.
  //
  // This is the model's half of the exchange, which a prompt record may not carry: the doctrine
  // majordomus.prompt-capture fails a record naming a response, a completion or a transcript. A
  // conforming writer puts the outcome in a separate after-the-turn record whose `meta.parent`
  // names the prompt record, and the renderer joins the two into one document. The section is
  // declared here because the document has it; the rule says where the bytes live.
  optional OutputSection output = 5;

  // `## PROMPT` — the prompt itself. Always present and always last, because it is the only part
  // with no bound on its size, so everything a reader scans for stays above it.
  PromptSection prompt = 6;
}

// FrontMatter is the record, minus its text, plus the name of the file it was rendered from.
// Every member is defined in v1.schema.json; this says only which of them appear here and that
// `record` is added.
message FrontMatter {
  // The record's members except `text`, in the record's declared order, as YAML scalars: strings
  // single-quoted, null bare, numbers bare.
  map<string, string> members = 1;

  // The file name of the JSON this document was rendered from — a name, never a path, because a
  // document can only ever point inside its own directory.
  string record = 2;
}

message SummaryTable {
  repeated Row rows = 1;

  // A row is a bold label and one or two values in backticks, joined by a middle dot when there
  // are two — which is how provider/event, model/effort and branch/head read as one fact rather
  // than two.
  message Row {
    string label = 1;
    string value = 2;
    optional string qualifier = 3;
  }
}

// The rules in effect and what else was loaded, rendered as a list under `## CONTEXT`.
message ContextSection {
  repeated string rules = 1;
  optional string profile = 2;
  optional string task = 3;
  repeated string documents = 4;
}

// The result code and one paragraph of what happened, under `## OUTPUT`.
message OutputSection {
  optional int32 code = 1;
  optional string summary = 2;
}

// The prompt, decoded from the record's escaped span, inside a fence.
message PromptSection {
  // The prompt as the person wrote it: JSON escapes undone, \u and surrogate pairs decoded to
  // UTF-8, and not a byte otherwise changed.
  string text = 1;

  // The fence that holds it: a run of backticks longer than the longest run inside `text`, and
  // never shorter than three. A fixed three-backtick fence would be a claim about the prompt's
  // content that capture is in no position to make — prompts quote code, and a prompt opening a
  // fence of its own would end the block early and spill the rest of itself into the document.
  string fence = 2;
}
