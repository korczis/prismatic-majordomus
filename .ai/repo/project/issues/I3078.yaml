milestone: public-proof
title: "An article explains derivation in both languages: written once, derived everywhere"
slug: written-once-derived-everywhere
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/written-once-derived-everywhere.md, an English article on how this repository derives its surfaces. It covers one canonical declaration per capability (ADR 0004), and committed projections that are regenerated, never edited (project.derived-files-regenerated). It covers the commit hook's scripts/pages current, which compares the input hash and runs the executable's own generate --check. It covers scripts/derive's stages, scripts/derive-check and CI's refusal, one derive at a time per machine (project.one-derive-at-a-time), and the refusal of an untracked file (project.a-derive-sees-what-the-commit-will). It ends with the derived merge driver and what all of it costs. Every statement and quotation is one that ADR 0004, those rules, scripts/derive, scripts/pages or the pre-commit hook on master states, and no count is typed by hand. site/content-src/napsano-jednou-odvozeno-vsude.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the proof-carrying documentation, the plan critique and the bet on a layer, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. Derivation is why a published surface of this product cannot say something its code does not. The site explained it only in ADR 0004, the rules and the architecture document, which are written for the sessions that follow them."
current_state: "No article explains derivation. The six article groups relate each other, and none of them names it."
desired_state: "/written-once-derived-everywhere/ and /napsano-jednou-odvozeno-vsude/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 passes, with the translation at its source's digest."
