id: repository-automation-is-typed
title: "Repository automation is typed capabilities that Rhai orchestrates, and domain-logic shell only shrinks"
slug: repository-automation-is-typed
order: 169
priority: p1
problem: "A person, CI and an agent run the same repository automation through one executable with an embedded Rhai engine and typed Rust capabilities; just recipes are derived from the command graph and the commit hook is one call of the executable; shell remains only at declared OS, bootstrap and provider boundaries, and the domain logic left in shell only shrinks; and every migrated unit proved it behaves as its predecessor before the predecessor was deleted. Proposed in ADR 0184 (Every command name is implemented by exactly one executable, and the other only delegates) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c105#0, chatgpt-majordomus:c110#0, chatgpt-majordomus:c110#3, chatgpt-majordomus:c110#4, chatgpt-majordomus:c140#0, chatgpt-majordomus:c140#2, chatgpt-majordomus:c192#5, chatgpt-majordomus:c230#0, chatgpt-majordomus:c230#6, chatgpt-majordomus:c244#6, chatgpt-majordomus:c290#0, chatgpt-majordomus:c290#2."
outcome: "A person, CI and an agent run the same repository automation through one executable with an embedded Rhai engine and typed Rust capabilities; just recipes are derived from the command graph and the commit hook is one call of the executable; shell remains only at declared OS, bootstrap and provider boundaries, and the domain logic left in shell only shrinks; and every migrated unit proved it behaves as its predecessor before the predecessor was deleted."
current_state: "Its issues extend existing milestones; see each issue's why."
desired_state: "Every criterion of the intent is carried by an issue here and proven by its test."
acceptance_criteria:
  - "A scripted capability declared in the layer runs through majordomus run and appears on every projection with no edit elsewhere"
  - "Neither the class-A unit count nor the class-A line count, derived from the tree, rises against the merge base, and a record relabelled away from A without a reason is refused; the shell check says so"
  - "Every command path (program plus its full word sequence) resolves to one implementing executable, and a path both executables implement outside a declared delegation is a finding"
  - "Every just recipe is a recipe of the generated, untracked command-graph bridge or a hand-written recipe with its inventory record, a hand-written duplicate of a bridged recipe is refused, and regeneration is byte-identical"
  - "A class A or B shell unit is deleted only when its parity case has a recorded pass for the head being judged; otherwise the shell check refuses the deletion and names the missing case"
  - "The commit hook is one call of a command path the Rust executable owns, every enforcement entry wired by it is still proven invoked, and it reports its time per component against its budget"
validation:
  - "majordomus plan validate"
evidence_required: []
