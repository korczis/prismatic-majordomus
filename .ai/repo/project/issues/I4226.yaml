  - "other cases with the same pipe form"
depends_on:
  - I2486
acceptance_criteria:
  - "test/cases/1096_no_screen_waits_for_a_source.sh has no printf piped into grep"
  - "Case 1096 passes, with the same checks and messages as before"
validation:
  - "MJ_TEST_JOBS=2 bash test/run.sh 1096_no_screen_waits_for_a_source"
  - "bin/majordomus plan validate"
evidence_required:
