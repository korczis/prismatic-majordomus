# The lanes of the delivery board (I4294): every open milestone of the plan in exactly one
# lane, declared once. `board.snapshot` composes the board's documents from the plan, the
# intents and the recorded pull request queue, and files each open issue under the lane of
# its milestone. A milestone in no lane is an error, never "other": the snapshot refuses,
# and `board::tests::every_open_milestone_has_a_lane` fails CI naming every milestone that
# has none. Only a DONE milestone may stay unlaned.
#
# Declaration order is the board's lane order. A milestone belongs to one lane; the loader
# refuses a key, or a milestone, declared twice.
version: 1

