acceptance_criteria:
  - "Case 4415, driving the measured load through the helper's test seam: a verify command that exits 1 is refused with a line naming exit 1, its seconds, the load at start and end and the core count, and the task.refused line carries verify with exit, seconds, load_start, load_end, cores and tree"
  - "Case 4415: with verification.load_max_per_core declared and the load held above it, finish does not start the command (a marker file it would write is absent), waits no longer than verification.load_wait_seconds, fails the line as `not run: load ...`, and task.refused records verify.not_run: load"
  - "Case 4415: the same run with CI=true starts the command at once"
  - "Case 4415: with verification.verify_retries: 1 and a command that fails once then passes, a failed attempt above the bound is retried and accepted, the result line names `attempt 2 of 2`, and task.finished's verify.attempts holds both attempts"
  - "Case 4415: the same command with no load bound declared, or with its failed attempt below the bound, is refused after one attempt; a tree changed between attempts is refused without a retry"
  - "Case 06 passes unchanged for a policy that declares none of the new keys"
  - "doctor admits verification.load_max_per_core, verification.load_wait_seconds and verification.verify_retries through share/allow/policy.txt, and the policy schema refuses verify_retries above 2"
  - "lib/bench.sh's load reading is the shared helper, and the benchmark cases that read it still pass"
  - "Before the change case 4415 fails at its first assertion"
