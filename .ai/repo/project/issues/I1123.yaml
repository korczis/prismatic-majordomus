id: I1123
milestone: two-folder-integration
title: The milestone is accepted on its evidence
slug: two-folder-acceptance
priority: p0
profile: implementation
parallel_safe: false
objective: "Close the milestone: every acceptance criterion carries evidence, the measured baselines are recorded with the environment they were taken on, the adoption and removal run as documented on a clean checkout, and the remaining limitations are stated."
why: "A milestone is accepted by its evidence. What a later reader has is the record, not this session."
current_state: "Open."
desired_state: "Accepted with evidence against every criterion, with the footprint, the budgets and the limitations written where they will be found."
scope:
  - docs/PLAN_STATUS.md
  - .ai/repo/project
non_scope:
  - Reporting a mechanism as proved without the artifact that proves it
depends_on:
  - I1104
  - I1107
  - I1115
  - I1117
  - I1118
  - I1119
  - I1120
  - I1122
acceptance_criteria:
  - Every acceptance criterion of the milestone has evidence recorded against it
  - The measured footprint of an adoption is recorded — every path, with its namespace and its owner
  - The budgets are recorded with the machine and environment they were measured on
  - The documented adoption and removal run exactly as written on a clean checkout
  - Pre-existing failures, failures introduced here and failures fixed here are distinguished explicitly
  - Remaining limitations are stated rather than omitted
validation:
  - bash test/run.sh
  - bin/majordomus doctor
  - majordomus generate --check
evidence_required:
  - criteria_covered
  - footprint_recorded
  - limitations_stated
risk: "The end of a long milestone is where intent gets recorded as outcome. Anything not demonstrated is written as a limitation."
created_at: 2026-09-06
updated_at: 2026-09-06
