id: I3088
milestone: public-proof
title: "An article explains in both languages why automation is a capability, not a shell script"
slug: automation-is-a-capability
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/automation-is-a-capability.md, an English article on why this repository's automation becomes a typed or scripted capability rather than shell (ADR 0069). It covers what shell cost, a scripted capability and the sandbox it runs in, one declaration reaching every surface (ADR 0004), the automation inventory and its exemptions, how shell check refuses new shell, the portable-shell rule for the shell that remains, and what is not built yet. Every statement is one that ADR 0069, ADR 0004, rules project.no-new-nouns, project.no-network-no-eval and project.portable-shell, docs/SHELL.md, docs/CAPABILITIES.md, the automation inventory or the plan on master states, each ADR with its status, and no count is typed by hand. site/content-src/automatizace-je-schopnost.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the derivation, layer and proof-carrying documentation articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. That new automation is a capability and never another shell script is a rule every worker's bootstrap states, and the site explained it only in an ADR, a manual and an inventory written for the sessions that follow them."
current_state: "No article explains why automation is a capability. The article groups relate each other, and none of them names it."
desired_state: "/automation-is-a-capability/ and /automatizace-je-schopnost/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 passes, with the translation at its source's digest."
