id: I3295
milestone: every-sessions-usage-is-observed
title: "A task declared over its token budget is told so, and refused only where policy says refuse"
slug: a-task-has-a-token-budget
priority: p3
profile: implementation
objective: "Declare per-profile token and cost budgets as data in policy, have finish and the brief compare a task's attributed usage with them, and say which figure (reported or estimated) the judgement read."
why: "The owner asked that coordination never out-spend implementation; a budget is only honest once usage is observed and attributed. It extends milestone cost-per-accepted-outcome. Proposed in ADR 0213 (Usage is observed through each provider's official telemetry into one provider-neutral record, and reported, estimated and billed amounts are never merged) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c198#11, chatgpt-majordomus:c236#4, chatgpt-majordomus:c082#8."
current_state: "No budget exists; rule every-wait-is-bounded bounds time, not tokens."
desired_state: "A budget warns by default; a repository may declare refuse; an exemption is recorded."
scope:
  - ".ai/repo/policy.yaml"
  - "apps/majordomus-cli/src/economics"
  - "test/cases"
depends_on:
  - "I3292"
  - "I3293"
  - "I0402"
serves:
  - "every-sessions-usage-is-observed#over-budget-is-told"
acceptance_criteria:
  - "A fixture task over budget gets a warning naming the budget, the figure and its class"
  - "With refuse declared, finish refuses and names the exemption command"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test economics"
  - "majordomus plan validate"
evidence_required:
  - "case_a_task_has_a_token_budget"
created_at: 2026-10-18
updated_at: 2026-10-18
