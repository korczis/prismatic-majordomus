    command: "bash test/run.sh 3064_a_pushed_branch_is_judged_by_its_holder"
    result: "1 passed, 0 failed: slice 1 of the ADR 0105 amendment; two branches pushed from one checkout are each judged by the task of the checkout holding them, a branch held nowhere is admitted with a line naming it"
