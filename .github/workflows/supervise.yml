# The CI runs, supervised: a run superseded while a newer run of its pull request waits behind
# it, or one queued or running past its workflow's declared bound, is force-cancelled with its
# reason recorded (I3903). An adapter over `majordomus prs supervise --apply`; the model and its
# rationale are .ai/repo/ci/supervise.yaml, the decision is
# apps/majordomus-cli/src/integration/supervise.rs, and docs/CI.md is the prose.
#
# Event-driven first, the clock as the watchdog: every requested validate run starts this, so a
# new run that would wait behind its pull request's superseded one is unblocked within a minute;
# the schedule catches whatever an event did not, and survives every local restart because it
# runs here, not on anybody's machine.
name: supervise
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows: [validate]
    types: [requested]
  workflow_dispatch:

# Cancelling a run is Actions write. Reading the open pull requests' heads is pull-requests
# read; nothing here writes the tree, a pull request or an issue.
permissions:
  actions: write
  contents: read
  pull-requests: read

# One supervisor at a time, and the newest observation wins: a tick that is still reading when
# a newer event arrives has nothing to say that the newer one will not say better.
concurrency:
  group: supervise
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    # a build from the cache and a handful of API calls; the bound turns a hang into a failure
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: the executable that supervises the runs
        run: cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml

      # `--apply`: each run decided on is read again, recorded on the trail, then cancelled.
      # 0 is nothing to do or every act done; 12 is a forge that could not be read or an act
      # that could not be taken, and that fails the job.
      - id: supervise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mj="$PWD/apps/majordomus-cli/target/debug/majordomus"
          rc=0
          "$mj" prs supervise --apply > "$RUNNER_TEMP/supervise.txt" 2>&1 || rc=$?
          sed 's/^/    /' "$RUNNER_TEMP/supervise.txt"
          {
            printf '## The CI runs, supervised here\n\n```\n'
            cat "$RUNNER_TEMP/supervise.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || { echo "supervise: majordomus prs supervise --apply exited $rc" >&2; exit "$rc"; }
