non_goals:
  - A tracing service, a task database or an evidence store beside the ledger, the trail and the release records
  - A promised duration for the pipeline; budgets follow measurements
  - Removing the machine-wide lock that keeps one derive running at a time
  - The high-level `ui` command, which is planned with the Cockpit control centre
  - Changing GitHub's settings; what they leave open is reported, and closing it is the owner's act
