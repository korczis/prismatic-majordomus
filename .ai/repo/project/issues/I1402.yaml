    type: test
    command: "bash test/run.sh 45_github_projection"
    result: "six states proved against fixture remotes: insync, behind, edited, conflict, adopt, missing, plus unmanaged for a remote record claiming an unknown id; the unmanaged finding now counts toward the exit code"
    commit: 3db47f7d6081cad387f91fc33eddb67773d8da8d
    recorded_at: 2026-09-09T17:20:38Z
  - covers: edit_protection_holds
    type: test
    command: "bash test/run.sh 45_github_projection"
    result: "an edited region is detected both when the canonical record is unchanged (edited) and when it has moved since (conflict); the second was unreachable before, so --apply would have overwritten a person's text without --force"
    commit: 3db47f7d6081cad387f91fc33eddb67773d8da8d
    recorded_at: 2026-09-09T17:20:39Z
