  - "apps/majordomus-cli/tests/intent.rs"
  - ".ai/repo/project/issues"
acceptance_criteria:
  - "A drafted gap validates with no finding"
  - "Every state that is not unknown cites an observation that resolves"
  - "Two runs at one commit print byte-identical output and leave the tree clean"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
evidence_required:
  - "test_the_gap_is_drafted_from_the_ledger"
