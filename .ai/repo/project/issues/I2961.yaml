id: I2961
milestone: "the-mesh-works-out-of-the-box"
title: "Upgrading a macOS hub never silently cuts it off the mesh"
slug: an-upgraded-hub-stays-reachable
priority: p1
profile: implementation
parallel_safe: true
objective: "After an install or upgrade on macOS, the installer itself says when the application firewall admits an older majordomus tree but not the one just installed, and prints the one command that admits it, so an upgrade that moves a hub to a new versions/<v>/libexec path is never left listening behind a firewall that silently drops every other machine."
why: "2026-10-17 ~20:50Z the second MacBook's hub was upgraded 0.27.0 -> 0.28.0 with install.sh and restarted. It answered locally and was unreachable from every other machine: the macOS application firewall (stealth mode on) admits by binary path, held entries for versions 0.14.0-0.27.0 and none for versions/0.28.0/libexec/majordomus-cli. That hub was the rendezvous through which this Mac knew every remote node; admitting the new path needs sudo, which only the owner can give. Nothing said so: install.sh reported success and the hub's own health was green."
current_state: "Detection exists and nothing runs it: `majordomus mesh firewall` judges the macOS application firewall for the running executable (measured on the second MacBook 10-17: observation missing for versions/0.28.0/libexec/majordomus-cli) and `majordomus mesh doctor` fails its firewall check, but install.sh never looks at the firewall and reports success. Until this lands, the re-admit step after upgrading a macOS mesh hub, run on that Mac by its owner: `sudo ~/.local/bin/majordomus mesh firewall apply --repo <the hub's checkout>` (or, without a checkout: B=$HOME/.local/share/majordomus/versions/<v>/libexec/majordomus-cli; sudo /usr/libexec/ApplicationFirewall/socketfilterfw --add \"$B\" && sudo /usr/libexec/ApplicationFirewall/socketfilterfw --unblockapp \"$B\"), then restart the hub and read it from another machine: curl -H 'Accept: application/json' http://<tailnet address>:8791/ answers the new version."
desired_state: "On macOS with the application firewall on, install.sh ends by reading socketfilterfw --getglobalstate and --listapps; when an older versions/*/libexec/majordomus-cli is admitted and the new one is not, it prints a warning naming the new path and the exact socketfilterfw --add/--unblockapp lines to run as root, and exits zero. It never takes root or changes the firewall. The tool it asks is overridable (MAJORDOMUS_SOCKETFILTERFW) so a case can hold the judgement on any host."
scope:
  - "share/install/install.sh.in"
  - "site/static/install.sh"
  - "test/cases/3361_an_upgraded_hub_names_its_firewall_gap.sh"
