id: the-proof-scorecard-is-published
title: "One derived scorecard publishes every proof test's computed status, losses included, on every surface, and no value claim stands without a passed test"
slug: the-proof-scorecard-is-published
order: 201
priority: p1
problem: "The owner's report of 2026-10-19 asks that the verdict of every test be public and evidence-backed, and that feature counts on the landing page not be the test. Nothing computes a status for a proof test, no surface lists them, and the gates do not hold a qualitative value claim: economics check refuses only a quantity beside an economics word (apps/majordomus-cli/src/economics/claims.rs:1-31), and the homepage promise list (site/data/homepage.toml:53-68) names no word of speed, cost, effort or recovery."
outcome: "economics.proof computes six rows from committed records and is served by CLI, HTTP, MCP, /ui/evidence and the site economics page; a guaranteed claim and a homepage value word stand only while the settling test reads passed."
current_state: "docs/generated/economics.json reports verdict.publishable false with 0 valid pairs of the 30 the rule asks for. apps/majordomus-cli/src/capability/builtin/economics.rs:141-202 declares economics.summary, explain, runs and check. ui/evidence.rs:17 reads only evidence.report. site/data/marketing.toml and site/data/manifesto.toml hold none of the value words I3350 declares (grep at the import's head). Other hand-written prose uses such words in other senses, for example site/content-src/proof-carrying-documentation.md:52 'the part that pays for itself', which is why the gate is limited to the claims matrix and the homepage copy. I2965 is READY in site/data/generated/plan.json while its proven and proves words are already present at site/data/homepage.toml:54-55."
desired_state: "majordomus economics proof, /api/v1/economics/proof, majordomus_economics_proof, /ui/evidence and /economics/ show six rows with per-status totals summing to six; economics check and homepage-check refuse an unbacked value claim."
scope:
  - "site/data/homepage.toml"
  - "apps/majordomus-cli/src/economics"
  - "apps/majordomus-cli/src/economics/claims.rs"
  - "apps/majordomus-cli/src/economics/report.rs"
  - "apps/majordomus-cli/src/economics/model.rs"
  - "apps/majordomus-cli/src/capability/builtin/economics.rs"
