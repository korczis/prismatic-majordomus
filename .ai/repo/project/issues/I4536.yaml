  - "I4535"
acceptance_criteria:
  - "majordomus design kit --check reports zero S3 findings on /ui, /cockpit and the site"
  - "The interaction probe opens and closes every collapse, dropdown, modal, drawer, tab and tooltip on /ui, /cockpit and the site by mouse and keyboard, with focus returned and no CSP violation"
  - "No script under share/ui, share/cockpit or site reads data-collapse-toggle, data-dropdown-toggle, data-modal-target, data-drawer-target, data-tabs-toggle or data-tooltip-target itself"
  - "The served Flowbite file's bytes equal the npm 4.0.2 build's, checked by the asset build"
  - "After a fragment swap on /ui and /cockpit, every collapse, dropdown, modal, drawer, tab and tooltip that was on the page before the swap opens and closes exactly once per activation, and the browser console shows no Flowbite 'already exists' warning"
  - "Escape closes an open dropdown and the mobile menu and returns focus to the button that opened it on all three surfaces, as the nav-dropdown and nav-collapse interaction specs drive today"
  - "The site's transferred bytes per page with Flowbite JS stay within the site probe's declared budget, measured before and after; site/nav.js:10-12 records that the 134 KB bundle was removed for that budget"
  - "Flowbite's injected backdrop (backdropClasses, flowbite.js:6419) is given token classes, so no raw palette value reaches a page (scripts/ci/design-check)"
validation:
