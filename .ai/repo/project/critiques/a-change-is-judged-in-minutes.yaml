intent: a-change-is-judged-in-minutes
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: 5 of 10 findings are blocking and all 5 are planned; of the 5 non-blocking, 4 are planned and the 300 s target question stays open for the owner."
findings:
  - id: criteria-evidence-can-never-settle
    class: delivery_verification
    subject: "a-change-is-judged-in-minutes"
    finding: "All five criteria in .ai/repo/project/intents/a-change-is-judged-in-minutes.yaml use `evidence: command` with `ref: majordomus intent explain a-change-is-judged-in-minutes`. The ref is the intent's own explain command, so it is circular and proves nothing. The ledger also cannot settle command evidence: intent.rs:301 `ledger_settles` accepts only test|claim, and the doctest at intent.rs:318-320 shows that a command criterion is NotDerivable and leaves the verdict Unknown. As written, the intent can never be satisfied however much work lands. On master, 17 of 18 criteria use `evidence: test`. Each criterion should be `evidence: test` and name the case that proves it: the derive bench --check case, I2527's incremental_equals_full case, I2348's skipped-gate case, and a ci-timings window case."
    blocking: true
    resolution:
      state: planned
      issue: I3236
      because: "Confirmed: intent.rs:302-304 settles only test|claim and a command criterion falls through to NotDerivable (intent.rs:1135-1138). Each criterion is rewritten to `evidence: test`, and its ref is the case of the issue that produces it. I3236 owns unchanged-tree-derive-is-sub-second and one-input-derive-is-sub-second (the derive bench --check case it now adds) and incremental-equals-full (I2527's incremental_equals_full_case, now a dependency). I3238 owns no-required-check-is-dropped (impact_selection_never_skips_an_affected_case, with I2348 and I2527 as dependencies). I3242 owns pr-verdict-within-five-minutes (the ci-timings window case). Each carrier has the intent record in its scope. Until a carrier's case exists the criterion is written `evidence: command` with the planned proof in its text, which the promotion's convention requires (a test ref must name a file under test/cases or apps/majordomus-cli/tests). That ref resolves and is never counted met. The plan now names each planned case in the criterion's text, and each carrier's acceptance flips its criteria to `evidence: test` in the commit that adds the case. So the criterion is unknown only until its own case lands, never permanently."
  - id: no-issue-builds-the-derive-bench
    class: missed_requirement
    subject: "a-change-is-judged-in-minutes#unchanged-tree-derive-is-sub-second"
    finding: "Both sub-second criteria are proved by 'bench --check over the derive scenarios of I2349 (amended)', but I2349 is in neither tree: .ai/repo/project/issues/I2349.yaml is absent on master and in the worktree, and no issue in the bundle revives it. That leaves several criteria with no issue at all: milestone a-derive-answers-within-a-second's first two (derive scenarios as bench targets with a committed baseline and a declared reference machine; bench --check names the regressing stage), and the sixth criterion of milestone a-change-is-judged-in-minutes (a derive or CI regression past its noise-aware budget fails a gate). The milestone's only issues are drv-04 and drv-05. The 'declared reference machine' does not exist: .ai/repo/benchmarks/ has no derive policy, and the CI bench job runs `bench --profile ci` on macos-latest (validate.yml:850-866), which is not the shared laptop where derives queue. The milestone's own order puts 'baseline first', yet no baseline issue precedes drv-01 to drv-05. One issue is needed before them: the derive bench target, the reference machine, a noise rule consistent with I2068, and a baseline."
    blocking: true
    resolution:
      state: planned
      issue: I3236
      because: "Confirmed: I2349 is absent, and .ai/repo/benchmarks/ holds only economics, observatory, pages and rust. The baseline already exists as I2521, which records per-stage durations for each scenario with commit, machine, load and sample counts, and has apps/majordomus-cli/src/bench in its scope. I2521 is added as a dependency of drv-02 to drv-05 (drv-01 already depends on it), so the baseline comes first. I3236 is the first issue of milestone a-derive-answers-within-a-second and now carries the bench part. It makes the no-op, one-input and batch scenarios bench targets with a committed baseline, and declares the reference machine as the shared development machine where derives queue, not the macos-latest runner. It adds a noise rule from I2068 (now a dependency), and bench --check names the regressing stage. The gate lands before parallel nodes are switched on. The CI half of the milestone's sixth criterion goes to I3242's per-job budget gate. I3236 and I3242 now both serve a-regression-fails-its-budget, so the intent carries that criterion rather than dropping it as uncovered."
  - id: drv-02-runs-a-generator-and-is-not-sub-second
    class: unproven_assumption
    subject: "I3234"
    finding: "I3234 serves unchanged-tree-derive-is-sub-second, which says 'runs no generator'. But its mechanism is `generate --check`, and that is plan() over every target (generate.rs:657-662: 'the one plan generate writes and generate --check compares'), a full in-memory render. I2880's own measurement shows the cost: a no-op derive with stage B skipped still spent 114 s on stages A-D (I2880.yaml at 62c15721140). The issue's desired_state, 'returns in seconds', is not sub-second. The 'stage-B key' it reads is `generate-site-data --derive-key`, which exists only on the unlanded I2880 branch (0c064fa614f), with a competing unlanded skip in I2490 (b890cedff4a). Yet depends_on is []. Choosing an existing executable through the generation guard already appears in I2525's desired_state, so that part is duplicated. Fix: drv-02 should answer from I2525's recorded node keys with no generator, and depend on I2525 and on whichever of I2490 or I2880 is chosen to land, per ADR 0185."
    blocking: true
    resolution:
      state: planned
      issue: I3234
      because: "Accepted. I3234 now depends on I2525, whose desired_state records each node's key and chooses the executable through the generation guard; I2525 depends on I2524, which builds on I2523's keys. The no-op answer compares those recorded node keys, the site-data node included, and spawns no generator: no generate, no generate --check, no generate-site-data. Under ADR 0185 the derivation is a typed graph of its generators, so the node key is the canonical stage-B key. The issue therefore depends on neither of the unlanded I2490 or I2880 branches, and neither has an issue record in the tree to depend on. Executable selection is moved to non_scope as I2525's. 'Returns in seconds' is replaced by under 1 s p95 in I3236's no-op bench scenario."
  - id: proof-issues-do-not-serve-the-intent
    class: insufficient_work
    subject: "a-change-is-judged-in-minutes#no-required-check-is-dropped"
    finding: "The criteria name their proofs in I2525 and I2527 (milestone a-derive-does-only-the-work-its-inputs-changed) and in I2348 (ci-critical-path). None of those issues has a `serves` field. Neither milestone is listed in the intent's milestones, and no intent on master or in the worktree names them. serving_scope (intent.rs:1156-1162) counts only issues whose `serves` names the criterion, so no-required-check-is-dropped is carried by I3238 alone. I3238's acceptance criteria cover neither 'a skipped gate carries the proof' (I2348) nor 'an omitted dependency turns a gate red' (I2527). Two related problems: the issue records of drv-01 to drv-03 and drv-06 to drv-11 say they 'extend' those other milestones while filed under a-change-is-judged-in-minutes; and invariant 1 cites `scripts/derive --full`, which master does not accept (scripts/derive:127 allows only --locked, --orphans and --preflight; I2525 introduces it). Fix: add `serves` to I2348, I2525 and I2527 and list both milestones in the intent, or move those cases into issues here."
    blocking: true
    resolution:
      state: planned
      issue: I3238
      because: "Confirmed: serving_scope filters on `serves` only, and I2348, I2525 and I2527 have none. I2348, I2525 and I2527 are not in this bundle and cannot be amended here, so the critique's second option is taken: their cases move into issues here. I3238 now depends on I2348 and I2527. Its acceptance requires that a skipped gate's verdict row names the unchanged input digest (I2348's gate_result_reuse_case) and that omitted_edge_turns_the_gate_red (I2527) passes, so the criterion it serves is carried by work it owns. I3236 already depends on I2525 and I2527 and now owns the derive proofs. I3234 now depends on I2525, so the invariant's `scripts/derive --full` exists on master before any issue that relies on the oracle. The intent record rewrite in I3236 and I3238 also adds milestones a-derive-does-only-the-work-its-inputs-changed and ci-critical-path to the intent. The 'It extends milestone X' sentence stays in each moved issue's why: it records the milestone the issue came from, which is accurate, and the issues that work needs from that milestone are now in its depends_on (I2521 for I3233-I3237, I2348 and I2527 for I3238, I2350 for I3240)."
  - id: pr-verdict-work-cannot-reach-300s
    class: insufficient_work
    subject: "a-change-is-judged-in-minutes#pr-verdict-within-five-minutes"
    finding: "The required path today is far above 300 s. Suite shards were measured at 94-148 min (validate.yml:303-305). suite-durations.tsv sums 43,048 case-seconds, and 95_skills alone takes 3114 s. The UI audit takes about 2345 s. The rust, coverage, macos and structure jobs have bounds of 90, 55, 110 and 55 min. The issues do not reach those costs: drv-06 lets a case with no declaration run always, which covers 282 'none' cases plus 96 headerless ones, 378 of 527. The `# majordomus-covers:` header names commands (e.g. 'doctor'), not paths, so declaring paths for about 500 cases is unscoped. drv-07 is one build, drv-09 saves 10-60 s of fetch, drv-08 selects UI pages. No issue touches the rust, clippy, coverage, macos or structure jobs, or per-case cost (I2115 sits in ci-critical-path and serves nothing). ci-critical-path's own non_scope forbids redesign before a GitHub baseline is committed, and no issue here records that baseline. Needed: a baseline issue, a per-required-job budget that sums to 300 s, and work on the slow required jobs, or an explicit gate-model decision on which checks make up the 'binding verdict'."
    blocking: true
    resolution:
      state: planned
      issue: I3242
      because: "Accepted. ci-critical-path's non_scope forbids any redesign before the GitHub baseline exists, so I3242 now runs first. It commits a baseline window through the existing scripts/ci-baseline (written to .ai/repo/ci/baseline.json), with warm, partial and cold runs reported apart. From that baseline it derives a budget for each required pull-request job that sums to 300 s on the critical path. Every required job over its share (rust, clippy, coverage, macos, structure, suite shards, ui) is named, and an issue is filed for it from the measurement. Writing per-job remedies now would be the redesign the milestone forbids. Which checks make up the binding verdict is I2350's gate model, now a dependency of I3242. The full suite still proves a combined top and a release (I3238 non_scope), so no required check becomes advisory, in line with the intent's non_goals. I3238, I3239, I3240 and I3241 now depend on I3242. I3238 derives case inputs from the covered commands through the feature-to-module map, counts the cases left undeclared and their case-seconds, and does not require hand declarations for about 500 cases. Whether the owner's 300 s holds for the whole required set stays visible as the open target question (two-targets-and-queue-excluded)."
  - id: ci-timings-cannot-measure-the-criterion
    class: delivery_verification
    subject: "a-change-is-judged-in-minutes#pr-verdict-within-five-minutes"
    finding: "The planned proof is 'majordomus integration ci-timings over a window of runs (I2472 instrument)'. integration.timings does not provide that. It reports, per check, the median, 90th percentile and longest run over the open pull requests' last recorded observation, plus wall time from a head's first check start (capability/builtin/integration.rs:361). It has no p95, no window of past runs, and no queue wait: queued runs are counted as unmeasured. drv-10 (I3242) adds cache states and the critical path to scripts/ci/summary, but no issue adds p95, a run window or separate queue wait to the instrument. No issue scopes the /ui CI/CD timings panel (ui/timings.rs from I2472) to draw them either, although I3242's desired_state says the screen 'can draw it'."
    blocking: false
    resolution:
      state: planned
      issue: I3242
      because: "I3242 now depends on I2472 and has capability/builtin/integration.rs, ui/timings.rs and case 1077_ci_timings_are_measured in its scope. integration.timings gains p50, p90 and p95 over a declared window of past runs, with queue wait measured and reported apart instead of counted as unmeasured. The /ui CI/CD timings panel draws the same values. The window case becomes the criterion's test ref."
  - id: two-targets-and-queue-excluded
    class: unproven_assumption
    subject: "a-change-is-judged-in-minutes#pr-verdict-within-five-minutes"
    finding: "ci-critical-path.yaml, staged in the same worktree, sets the outcome 'change-to-verdict p95 under 60 s warm' for the same path, while this intent says 300 s. Issues that say they extend ci-critical-path are filed here, so two binding numbers apply to one path. The owner's words were 'pull requests musi byt pod 5 min' (c208#24), which reads as a push-to-verdict figure. The criterion measures 'from validation start, with queue wait reported separately', and .ai/repo/ci/baseline.json records job queue_seconds of up to 1672 s. Excluding queue wait could let the number pass while the owner still waits. The owner should confirm the target, or it should go in open_questions, and ci-critical-path's 60 s outcome should be reconciled with it or superseded."
    blocking: false
    resolution:
      state: open
      because: "Confirmed: ci-critical-path.yaml:7 sets p95 under 60 s warm for change-to-verdict, and the intent sets 300 s from validation start. Whether 'pod 5 min' means push-to-verdict including queue wait, and whether 300 s replaces the milestone's 60 s, is the owner's figure to set, and a plan author cannot pick between them. Meanwhile I3242 measures and reports queue wait apart, and its non_scope forbids excluding queue wait from the owner's figure before the owner answers, so the measurement serves either reading. The question belongs in the intent's open_questions, and the domain plan now records it there for the owner."
  - id: drv-02-unlocked-binary-and-holder-identity
    class: regression_risk
    subject: "I3234"
    finding: "drv-02 picks a built executable before taking the lock. Worktrees can share CARGO_TARGET_DIR (scripts/derive:32), and another worktree's derive rebuilds that same file under the lock (scripts/derive:144 `mj_lock_run mj_cargo_bounded ... build`). Between the generation check and the exec, the binary can be half-linked or replaced. The criterion 'waits if a derive of the same worktree holds the lock' is not derivable either: the owner line is '<who>:<branch> <pid>' (lib/machine_lock.sh:14-15). It names a branch, not a worktree root, so detached-HEAD worktrees collide. The issue needs a pinned copy of the executable (or exec by content hash) and a worktree identity in the owner line, and the amendment to rule project.one-derive-at-a-time must state both."
    blocking: false
    resolution:
      state: planned
      issue: I3234
      because: "Accepted. The read-only pre-lock answer now runs a pinned copy of the chosen executable, or one verified by content hash right before exec, so a concurrent rebuild in a shared target directory cannot swap the binary under it. The lock owner line carries the worktree root, so 'a derive of the same worktree' can be derived even on a detached HEAD. The amendment to rule project.one-derive-at-a-time states both. lib/machine_lock.sh and the rule are already in scope."
  - id: drv-11-duplicates-pre-push-run-plan
    class: unnecessary_work
    subject: "I3243"
    finding: "I3243's current_state, '.githooks has no call to scripts/ci-plan', is true only literally. .githooks/pre-push:32 runs `scripts/ci/run-plan --before-push`, which calls scripts/ci-plan (run-plan:96) and runs the plan's structure gates plus the suite's fast cases within a bound (rule project.a-push-runs-what-ci-would-find-first). Local and CI already share one planner. The only remaining difference is that --before-push should use drv-06's case selection, which belongs as an acceptance criterion of I3238. Fold it in or rewrite the issue against run-plan."
    blocking: false
    resolution:
      state: planned
      issue: I3238
      because: "Confirmed: .githooks/pre-push:32 runs scripts/ci/run-plan --before-push. The shared case selection is folded into I3238, with scripts/ci/run-plan and case 1021_a_push_runs_what_ci_would_find_first in scope. What remained of I3243 also exists or moved: run-plan --before-push already prints each gate it leaves out and why, and times itself against MJ_PUSH_BOUND. The 60 s leaf-edit bound is now an acceptance criterion of I3238, along with its local_plan_equals_ci_plan_case evidence and case 1021 in its validation. I3243 is dropped from the plan as a duplicate."
  - id: validation-commands-do-not-exist-or-test-nothing
    class: delivery_verification
    subject: "I3239"
    finding: "Three issues have validation commands that cannot verify their own work:\n- I3239 runs `3019_every_job_cancels_itself_on_failure`, but the case on disk is test/cases/3019_a_failed_branch_run_cancels_itself.sh.\n- I3242's validation is a placeholder, `bash test/run.sh <the summary case>`.\n- I3240's only validation is 3220_the_idd_loop_is_walked_in_a_browser, which walks /ui/idd and tests nothing about audit page selection.\nI3239's acceptance case 'exactly one Linux cargo build step (a case reads the workflow)' also misses in-suite compiles: 18 cases call cargo build/run/test directly, and test/lib.sh:171 builds whenever MAJORDOMUS_BIN is unset. 'Each consumer's job time falls by its former build time' may not hold for suite shards."
    blocking: false
    resolution:
      state: planned
      issue: I3239
      because: "Confirmed: the case on disk is 3019_a_failed_branch_run_cancels_itself.sh, and 18 cases call cargo directly. Each issue's validation field is now corrected in the plan, and its acceptance names the same cases. I3239 validates with bash test/run.sh 3019_a_failed_branch_run_cancels_itself, the case on disk. It requires test/lib.sh and the 18 cargo-calling cases to use the downloaded MAJORDOMUS_BIN, or be listed as exempt with their measured cost, and measures shard time against I3242's baseline. I3242 validates with 1077_ci_timings_are_measured and 413_a_skipped_case_is_not_a_proof, and the summary, window and budget cases it adds are in its evidence_required. I3240 validates with 349_a_step_reports_its_own_time and 334_ui_audit_hears_uncaught_errors in place of 3220, and its selection case is in its evidence_required."
