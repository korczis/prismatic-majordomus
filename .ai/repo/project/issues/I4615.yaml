id: I4615
milestone: a-second-adopter-is-served
title: "Never-reported gates are counted right and point at the command that reports them: `evidence --run-gates`, which also proves each `runs` executes as declared"
slug: never-reported-gates-are-counted-and-run
priority: p2
profile: implementation
parallel_safe: true
objective: "The check finding for required gates that never reported counts them correctly, reads cleanly, and gives `majordomus evidence --run-gates` as the remedy (the one command that runs each gate by its declared `runs` and records it), with `--gate <id> --exit <status>` for a verdict taken elsewhere."
why: "An adopter (korczis.github.io, 2026-11-15) saw '3 required gate(s) have never reported: commits doctor skills-proof validate— never-reported is not green': four gates counted as three (lib/gates.sh counts with `printf '%s' \"$unverified\" | wc -l`, which drops the last line's newline) and no space before the dash. The remedy named `evidence --gate <id> --exit <status>`, a hand entry per gate. `evidence --run-gates --all` was the right tool and found a real defect at once: the adopter's own gates.yaml declared `runs: scripts/lint-commits.sh` without its required argument, which exits 1 with its usage line, so that gate could never have reported green. A model whose `runs` cannot execute as written is only caught by running it."
current_state: "lib/gates.sh miscounts by one, joins the list and the dash without a space, and suggests the manual --gate form only."
desired_state: "The count equals the names listed; the text reads '<n> required gate(s) have never reported: <a> <b> — never-reported is not green (…)'; the reproduce is `majordomus evidence --run-gates` (naming --gate for an outside verdict). A case asserts the count with one and with four unverified gates."
scope:
  - ".ai/repo/project/issues/I4615.yaml"
  - "lib/gates.sh"
  - "apps/majordomus-cli/src/gates/mod.rs"
  - "test/cases/4615_never_reported_gates_are_counted_and_run.sh"
depends_on: []
acceptance_criteria:
  - "With four required gates unreported the finding says 4 and lists four names"
  - "With one unreported gate it says 1"
  - "The reproduce is majordomus evidence --run-gates"
validation:
  - "bash test/run.sh 4615_never_reported_gates_are_counted_and_run"
evidence_required:
  - "case_never_reported_gates_are_counted_and_run"
created_at: 2026-11-15
updated_at: 2026-11-15
