id: I2734
milestone: every-session-joins-the-mesh
title: "A session joins the mesh at its start and leaves it at its end"
slug: a-session-joins-the-mesh-at-start
priority: p0
profile: implementation
parallel_safe: true
objective: "The provider's start event opens the session on the mesh of the checkout's shared server as <provider>-<provider session>, with client, branch, head and the active task; the briefing names that id; a resume says it again; the end event closes it."
why: "On 2026-10-15 the owner asked why a new session did not join the mesh, report or start working, neither through direnv nor at session start, and why nothing enforces it. Measured: the start hook only printed the mesh's health (lib/capture.sh mj_capture_mesh_line); the only mesh session a Claude Code session got was its nameless board connection board-pN, with no intent and no claim, until the worker chose to announce. The milestone's first branches (I2285..I2292, 2026-10-10) never reached a pull request."
current_state: "The start event prints one health line about the mesh and opens no mesh session; the end event closes none."
desired_state: "Every provider session with a session id is on the mesh from its start event under a durable id the provider's payload names again, and off it at its end event, best-effort and never failing the event."
