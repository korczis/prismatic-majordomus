  - "Widening `context resolve` beyond the context documents of a path, or adding per-object entries to the `why` catalogue: an object of a repository kind is reached through objects, entity and trace"
  - "Discovering untracked or draft records (item 3 of the same report)"
  - "Pull requests in the traceability join (scripts/traceability)"
