id: I1011
milestone: capability-graph
title: The coverage matrix reports evidence, and never a green cell without one
slug: coverage-matrix
priority: p0
profile: deep-work
parallel_safe: true
objective: "Generate a matrix showing, for every capability, whether it is documented, tested, enforced, benchmarked and exposed, where each cell resolves to an artifact or a relation rather than to a claim."
why: "This is the view that makes the graph worth building: it turns the question of what is actually finished into something a person can read in one screen. A cell that is green because metadata said so would make it worse than useless."
current_state: "Benchmark coverage exists for capabilities. Documentation, tests and enforcement have no coverage view at all."
desired_state: "Each cell resolves to a named artifact — a document, a test, a rule, a benchmark case — and an unresolved claim is reported as missing rather than shown as satisfied."
scope:
  - apps/majordomus-cli/src/capability/builtin/health.rs
non_scope:
  - A status a contributor can declare without an artifact behind it
  - Demanding evidence from purely descriptive metadata that has no behaviour to test
depends_on:
  - I1002
acceptance_criteria:
  - Every filled cell names the artifact that supports it and can be followed to it
  - A relation that claims evidence but does not resolve is reported as a gap, and the report says which end failed
  - The policy for what evidence a kind requires is data, not a condition in the renderer, and a descriptive kind is not asked for a behavioural test
  - The matrix is available in both projections and in machine-readable form
validation:
  - cargo test --workspace --all-features
  - bin/majordomus doctor
evidence_required:
  - coverage_matrix
  - no_false_green
risk: "A matrix that is mostly empty on the first run will be read as an indictment rather than a baseline. It is a starting measurement, and saying so is part of shipping it."
created_at: 2026-09-06
updated_at: 2026-09-06T17:16:00Z
started_at: 2026-09-06T16:40:34Z
completed_at: 2026-09-06T17:16:00Z
evidence:
  - covers: coverage_matrix
    type: test
    command: "GET /api/v1/coverage against the built executable serving this repository"
    result: "795 capabilities: 795 exposed, 17 benchmarked, 3 documented, 3 tested, 0 enforced; every filled cell names the artifact and the object that named it, for example objects.get is documented by docs/MCP.md and tested by test/cases/72_rust_mcp.sh, both via docs/CLAIMS.yaml. A baseline measurement, not a verdict."
    commit: fc080baeb76c51de9997c54acb7672db6da69509
    recorded_at: 2026-09-06T17:15:51Z
  - covers: no_false_green
    type: test
    command: "cargo test --lib health (apps/majordomus-cli)"
    result: "six unit tests over synthetic layers: a cell names the artifact it was resolved from, a file nothing names carries nothing, a directory contract covers the files under it, the policy is data so a resource is never asked to prove it runs, a declaration claiming a behavioural test owes an artifact naming one, and every ancestor of a path is a way the layer could name it. Over this repository fourteen gaps are reported, each naming the capability, the dimension and the file nothing names."
    commit: fc080baeb76c51de9997c54acb7672db6da69509
    recorded_at: 2026-09-06T17:15:55Z
