id: I2321
milestone: a-drain-is-a-durable-run
title: "A run ends satisfied, blocked, out of budget, cancelled or fatal, and a budget or no progress ends it"
slug: a-run-ends-typed
priority: p1
profile: implementation
parallel_safe: false
serves:
  - "a-drain-settles-unattended#a-run-ends-typed"
objective: "Replace the free-text end of a continuous drain with a closed end written on its stop line: `satisfied`, `blocked`, `out_of_budget`, `cancelled` or `fatal`, each with its reasons and, when blocked, the pull requests and dispositions that block it. Bound a run in apps/majordomus-cli/src/integration/drain.rs and run.rs by a deadline, a number of cycles, a number of merges and a number of consecutive cycles without progress, taken from the trunk's authority profile (I2315) and narrowed, never widened, by flags."
why: "Autopilot pack 02 issue 3. `ContinuousReport.stopped` and `DrainReport.stopped` are free text (apps/majordomus-cli/src/integration/drain.rs:1581 and :1436), so no surface and no test can tell a satisfied queue from a stalled one. The pieces of a typed end exist and are not joined into one. `FailureClass::recoverable` (drain.rs:537) decides whether a failure stops the drain. `halted_by` (drain.rs:1211) holds every drain after a verification failure (owner decision D7). `CONTINUOUS_TRANSIENT_LIMIT` (drain.rs:1609) ends a run after 3 outage cycles. `ContinuousOptions` (drain.rs:1590) bounds merges per cycle and cycles. A refused merge or failed refresh is held back until its head or master moves, so it is not retried as is (apps/majordomus-cli/src/integration/mod.rs:746). Dispositions separate a pull request that needs repair from one waiting for checks, reviews or a dependency. There is no deadline, no budget across a run and no progress bound: a continuous drain over a queue that cannot move cycles until a signal. That is the measured queue: at 17:32Z on 2026-10-10 it held 51 open pull requests, 0 ready, 25 needing refresh, 10 needing repair, 7 waiting for a dependency, 1 conflicting, 8 drafts, and no next merge. The circuit breaker in apps/majordomus-cli/src/reasoning/availability.rs is a pure function of recorded outcomes and the clock, and is the pattern for the progress bound. The audit names the risk: D7 and the staged rollout are owner decisions, so an unattended end must stop on a verification failure and never acknowledge it."
current_state: "A continuous drain ends on a signal, a cycle count, a verification failure or an unreadable forge, and says which in a sentence. Nothing ends it when the queue does not move, and it has no deadline."
desired_state: "Every run's stop line carries one of the five ends with reasons, and the fold of I2320 exposes it. A signal ends a run `cancelled`; a verification failure or a forge or git unreadable past its retries ends it `fatal`, and the hold of D7 stays until a person acknowledges it; a deadline, cycle or merge budget ends it `out_of_budget`; a declared number of cycles in which no act succeeded and no pull request changed head or disposition ends it `blocked`, naming every open pull request with its disposition; a run whose desired outcome holds ends `satisfied`. The budget a run starts with is on its start line beside the base commit of the profile it was read from."
scope:
  - "apps/majordomus-cli/src/integration/drain.rs"
  - "apps/majordomus-cli/src/integration/run.rs"
  - "apps/majordomus-cli/src/integration/authority.rs"
  - "apps/majordomus-cli/src/commands/prs.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/tests/integration_run.rs"
  - "apps/majordomus-cli/tests/integration_rollout.rs"
  - "docs/INTEGRATION.md"
  - "docs/CLAIMS.yaml"
  - "docs/claims"
non_scope:
  - "Not acknowledging a verification failure: a run never writes `failure_acknowledged`, and no budget or profile lifts the hold; `prs drain --resume-after-failure` stays a person's act (owner decision D7)"
  - "Not the settle predicate that decides when a settling drain is satisfied: I2325; this issue gives `satisfied` its place and the bounded outcome its predicate"
  - "Not spend in money: a per-task spend budget belongs to the worker that spends it (I2335; ADR 0082 for the economics runner)"
  - "Not continuing other independent work of the plan: a run here is a drain of one base"
  - "Not the verbs that start, stop and resume a run: I2322"
  - "Not widening any bound by flag beyond what the profile declares"
depends_on:
  - "I2320"
  - "I2315"
acceptance_criteria:
  - "Every stop line of a run carries exactly one end from the closed five and its reasons, and a test fails on a stop line without one"
  - "A run over a fixture queue in which nothing becomes ready ends `blocked` after the declared number of cycles without progress, naming every open pull request and its disposition"
  - "A run past its deadline, its cycle budget or its merge budget ends `out_of_budget` at the next safe point, after the step in progress, and starts no new act"
  - "A verification failure ends the run `fatal`, a later run is refused until `failure_acknowledged` is on the trail, and no flag or profile key changes that"
  - "A budget asked by flag beyond the profile's is refused with exit 10 before the lease is taken; a run asked for with no profile on the trunk is refused with exit 10; and `prs drain --continuous` started without a run behaves as at master 4dfd1856d2"
  - "A signal ends the run `cancelled` after the step in progress, as `stop_on_signals` already does"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --test integration_run"
  - "cargo test --test integration_rollout"
  - "scripts/derive-check"
evidence_required:
  - "typed_end_test"
  - "no_progress_ends_blocked_test"
  - "verification_failure_holds_test"
created_at: 2026-10-10
updated_at: 2026-10-10
