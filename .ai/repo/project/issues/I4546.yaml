acceptance_criteria:
  - "The ui-shard probe visits every route of I4534's route inventory (case 3602 holds that each is visited by exactly one shard) and refuses a page without the frame mark"
  - "A case relates every kit component and every share/design/js module to the interaction specs and cases that drive it, and fails on a planted component or module that none drives"
  - "The Rust coverage gate (scripts/rust-coverage-threshold) holds apps/majordomus-cli/src/web/kit and apps/majordomus-cli/src/web/links at the threshold the repository declares"
  - "validate.yml and the pre-push hook run majordomus design kit --check with no baseline, and the job fails on a planted finding (case 26 still passes)"
  - "The baselines of I4534's ratchet case and of I4653's two gates are empty and removed, and each gate fails on one planted violation"
  - "A case fails on a planted import of cytoscape or chart.js anywhere in the tree and on a planted construction of ECharts, D3, p5 or Alpine outside share/design/js, and passes on the tree"
  - "The ui-shard probe visits /cockpit/graphs/topology, the activity chart and the observatory kiosk's p5 scenes (share/ui/observatory-kiosk.js, ADR 0160) and fails when any renders an empty canvas or stage"
  - "After the pages deploy that carries this slice, a browser probe of the published site and of the published /ui and /cockpit snapshot finds every page of the route inventory served with the frame mark and its visuals drawn, and this issue's evidence (covers: published_copy_probe) records the result with the deployed commit"
  - "The first commit that adds this issue's case also changes criteria one-library-per-job and derived-and-proven of .ai/repo/project/intents/one-kit-on-every-surface.yaml to evidence: test with that case as their ref, so the criteria stop being proven by majordomus intent explain of itself"
validation:
  - "majordomus design kit --check"
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 26_ci_wiring"
