    resolution:
      state: planned
      issue: I3411
      because: "I3411 records the prompt identity on task.started, through the task lifecycle that owns that state (lib/start.sh:158). That is the validated state change and the causal parent, with no new store. I3409 joins on that recorded key and labels a fallback as inferred. It adds the task.finished outcome, the verify command and the served criterion's evidence state. I3430 renders the knowledge per criterion on the Cockpit intent page as well as /ui/idd. I3431, broadened to the ledger and capture stamps on the existing 20 s heartbeat (events.rs:70), pushes new prompts and task starts, and I3409 and I3430 depend on it. Criteria the-slice-is-one-identity and a-task-names-the-prompt-it-followed were rewritten or added."
