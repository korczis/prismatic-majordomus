id: I3958
milestone: builds-reuse-the-mesh-cache
title: "A store declared without a scheme is spoken to"
slug: a-scheme-less-store-is-spoken-to
priority: p1
profile: implementation
parallel_safe: true
objective: "One normaliser reads every build-cache endpoint (a bare host:port means http://host:port), called by the health probe, the offer a node signs and the S3 client's Endpoint::parse, so a store the probe finds healthy is a store ensure speaks to."
why: "Train 6 found select_store refusing a node file whose endpoint names no scheme (only http:// endpoints) while the probe and the signed offer both accepted and normalised it: three readers, two meanings (ADR 0004). The second half of this issue, the store-health budget of the env report as a parameter (report_under, HEALTH_BUDGET in production, PATIENT in the env tests), landed with train 6 and is not part of this slice."
current_state: "Measured on the train-6 block 376493cd4c9: a_declared_store_without_a_scheme_is_probed_but_not_spoken_to pins the defect."
desired_state: "A bare host:port store is chosen and answered by ensure's client, through one endpoint normaliser."
scope:
  - "apps/majordomus-cli/src/mesh/build_cache.rs"
  - "apps/majordomus-cli/src/mesh/build_cache/"
  - ".ai/repo/project/issues/I3958.yaml"
non_scope:
  - "Accepting any scheme but http://"
  - "The env report store-health budget, which train 6 already made a parameter"
depends_on: []
acceptance_criteria:
  - "An endpoint without a scheme is read as http://host:port by the health probe, the signed offer and Endpoint::parse through one function, and a store declared that way is chosen and answers a signed request"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --lib mesh::build_cache"
evidence_required:
  - "scheme_less_store_spoken_to_test"
serves:
  - "a-build-reuses-what-the-mesh-already-built#store-absent-is-only-a-miss"
