id: I3094
milestone: architecture-is-enforced
title: "The Pages build and check hold a site built in every language"
slug: the-pages-check-holds-every-language
priority: p0
profile: implementation
parallel_safe: true
objective: "The build and check steps of the Pages workflow are bounded for the site as it is now built, in every language site/i18n/languages.json declares, so a correct site is published rather than stopped by a bound sized for one language."
why: "On 2026-10-20 the first Pages run of the alpha.1 master (39392245576, 82ac259d0ae) built 5100 routes in English and Czech and then stopped at `scripts/pages check` after its 3-minute step bound, so nothing was published and /cs/ stayed a 404 on majordomus.dev. The bound had been sized for the ~2550 routes of one language; the build step of the same run took 172 of its 180 seconds."
current_state: "pages.yml bounds `build` and `check` at 3 minutes each."
desired_state: "Both are bounded at 10 minutes, with the reason and the run that showed it beside them."
scope:
  - ".github/workflows/pages.yml"
  - ".ai/repo/project/issues/I3094.yaml"
depends_on: []
acceptance_criteria:
  - "The build and check steps of .github/workflows/pages.yml carry timeout-minutes: 10"
  - "The first Pages run of master after this lands publishes the site, both languages, without a hand deploy"
validation:
  - "majordomus plan validate"
  - "actionlint .github/workflows/pages.yml"
evidence_required:
  - "landed_change"
