id: I3165
milestone: knowledge-acts-on-what-it-learns
title: "What evolution changed is measured: recurrence of a subject after its lesson landed, per window, with its denominator"
slug: evolution-outcomes-are-measured
priority: p3
profile: deep-work
objective: "Derive, from candidates, promotions and later observations, how often a subject recurs after its lesson landed, over declared windows, and show unavailable as unavailable."
why: "2026-10-16: close the loop with real numbers rather than assertions of benefit. Depends on I3163 for the evolve.run marker, which attributes a landed lesson to the run that produced it and anchors the 'after' window. Proposed in ADR 0183 (Evolution is scheduled at the episode boundary and carried out by a session; nothing promotes itself) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c274#4."
current_state: "No such reading."
desired_state: "A reading with denominator and window on CLI, HTTP, MCP and /ui/knowledge."
scope:
  - "apps/majordomus-cli/src/capability/builtin/knowledge_base.rs"
  - "docs/KNOWLEDGE.md"
