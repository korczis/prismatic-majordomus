id: I3840
milestone: idd-reads-at-a-glance
title: "The intent workspace answers within its 100 ms budget: its shared-scope fold holds the first pairs, not every pair"
slug: the-intent-workspace-answers-within-its-budget
priority: p1
profile: implementation
parallel_safe: true
objective: "Bring /ui/idd back under the warm p95 budget of .ai/repo/benchmarks/rust/policy.yaml without touching the budget. The 'What can run together?' panel's shared-scope fold draws its first SHARED_SCOPE_SHOWN pairs and links to /ui/panels/shared-scope, a panel route that lists every pair; the screen borrows the plan's lists (view::items) instead of cloning them on every request."
why: "validate failed on master twice in a row, 91c0b5d5658 and 573df967bb5 (runs 39501132905-era and 39504455062): gate ui-audit, job ui, bench --check over budget, system.http.ui.idd warm p95 105.8 ms and system.http.live.ui.idd warm p95 106.5 ms against 100 ms. The screen of the-owner-directs-work-from-the-ui was 401 876 bytes, 296 216 of them the 'What can run together?' panel: its folded details drew all 1058 shared-scope pairs, each message run through prose::inline, although I2900 says the pairs are one click away and never outweigh the waves they qualify."
current_state: "The fold renders every entry of plan.waves serialised_by_scope whose subject serves the intent; render clones plan.waves (1.6 MB) and plan.issues (1 MB) as Vec<Value> on each request."
desired_state: "The fold renders at most SHARED_SCOPE_SHOWN pairs and, past that, a link to /ui/panels/shared-scope?intent=<id> naming the total; the panel route lists them all; the screen reads the plan's arrays borrowed. bench system.http.ui.idd and system.http.live.ui.idd pass their budget on the CI runner."
scope:
  - ".ai/repo/project/issues/I3840.yaml"
  - "apps/majordomus-cli/src/ui/idd.rs"
  - "apps/majordomus-cli/src/ui/mod.rs"
depends_on: []
acceptance_criteria:
  - "The shared-scope fold draws at most SHARED_SCOPE_SHOWN pairs and links to the panel listing all of them, stating the total"
  - "/ui/panels/shared-scope lists every pair of the named intent's issues and is a panel the UI dispatcher answers"
  - "bench --check passes system.http.ui.idd and system.http.live.ui.idd within the 100 ms warm p95 budget, which is unchanged"
validation:
  - "cargo test --lib -- ui::"
  - "majordomus bench system.http.ui.idd --transport system --profile ci --no-write"
evidence_required:
  - "shared_scope_fold_test"
