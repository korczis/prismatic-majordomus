{#- expects: rp_path — a repository-relative path, linked to the file itself. Nothing is
    claimed on this site that is not linked to the file that backs it. -#}
<a class="font-mono text-xs break-all text-blue-700 underline decoration-dotted underline-offset-2 hover:decoration-solid dark:text-blue-400" href="{{ config.extra.repo_url }}/blob/master/{{ rp_path }}">{{ rp_path }}</a>
