  - "Reclaiming outside cargo's lock on a developer machine (I4354)"
acceptance_criteria:
  - "Unit test: for a policy declaring a runner home with a cap, the provision plan creates that home's bounded filesystem (or project quota) of the cap's size and mounts it at the home's build directory; a second plan over the applied fixture owes nothing"
  - "On lundra: a fixture job that writes past its home's cap fails with ENOSPC inside the home, and the root filesystem's free space stays above the policy's floor throughout (df sampled during the job, recorded as evidence)"
  - "Case 4344 fails on an action.yml without a self-hosted bound step before cargo, or without one after it, and passes on the change"
  - "Case 4344 with RUNNER_ENVIRONMENT=self-hosted stubbed: scripts/rust-coverage leaves no llvm-cov-target after exporting its report; with a hosted runner it behaves as before"
  - "Case 4344: the sampler writes `build-dir peak` as the largest of its samples, not the last one"
  - "Case 3959: the post step's bound over a build directory past its cap evicts idle units and keeps a unit with an open file"
  - "Two consecutive coverage runs on lundra report a `build-dir peak` under each home's cap in their job summaries"
validation:
