id: knowledge-is-reconciled-before-it-is-reviewed
title: "What a session proposes as knowledge is reconciled with what the repository already knows before a person reviews it, and a promotion stands on evidence that resolves"
slug: knowledge-is-reconciled-before-it-is-reviewed
order: 213
priority: p2
problem: "The deriver compares a new candidate with curated knowledge only by full id, episode included (lib/knowledge.sh:1334-1337), so the same decision in a second episode becomes a second candidate. Nothing relates a candidate to the curated notes or rules about its subject: knowledge_base.rs:733-768 groups candidates/ only, and the contradicts relation has no producer or consumer. Promotion accepts any non-blank prose without a transcript marker (lib/knowledge.sh:1586-1591). An observation cannot cite a mesh review (lib/knowledge.sh:187). Repetition, partial tasks and concurrent closes hold by construction, and nothing proves them."
outcome: "A known fact gets one candidate. Each candidate group names what already speaks about its subject, read from the entity layer rather than from a second derivation. A promotion needs a resolvable reference and records it. An observation can cite the review that found it."
current_state: "Cases 564, 707-711, 980, 981 and 3004 verify knowledge observe, derive --dry-run, candidates, reject and check. session.knowledge_on_end derives knowledge at the episode end (lib/session.sh:663-673)."
desired_state: "I3416, I3413, I3414, I3415 and I3417 have landed in that order, each extending an existing case."
scope:
  - "lib/knowledge.sh"
  - "apps/majordomus-cli/src/capability/builtin/knowledge_base.rs"
  - "apps/majordomus-cli/src/ui/knowledge.rs"
  - "test/cases/564_knowledge_derivation_is_idempotent.sh"
  - "test/cases/709_knowledge_promotion_is_an_act.sh"
  - "test/cases/980_a_session_records_what_it_observed.sh"
  - "test/cases/981_an_observation_becomes_a_grouped_candidate.sh"
  - "test/cases/3004_evolve_is_a_procedure_of_existing_commands.sh"
  - ".ai/repo/skills/evolve/SKILL.md"
  - "docs/KNOWLEDGE.md"
  - "docs/CLI.md"
  - "share/events.yaml"
  - ".ai/repo/project/intents"
non_scope:
  - "Automatic promotion, rejection or relation of any record"
  - "Model-based similarity or contradiction judgement"
  - "Rejected subjects proposed again (I3164)"
  - "An incident entity, a review event or any new store (rule project.no-new-nouns)"
  - "The evolve readiness verdict, friction derivation, self-feeding and moved-source flags (milestone knowledge-acts-on-what-it-learns, I3162-I3166)"
acceptance_criteria:
  - "The criteria a-known-fact-is-one-candidate, a-candidate-names-what-already-says-it, promotion-cites-resolvable-evidence and an-observation-cites-its-review are rewritten to evidence: test naming the extended cases"
  - "Case 981's shell and Rust parity block stays byte-identical outside the related field, which only the Rust reader answers"
validation:
  - "majordomus plan validate"
evidence_required: []
depends_on:
  - "knowledge-acts-on-what-it-learns"
  - "an-entity-says-how-it-is-known-and-what-it-affects"
risks:
  - "I3162, I3163, I3164 and I3166 also have lib/knowledge.sh, knowledge_base.rs, ui/knowledge.rs and the evolve skill in scope; I3413 depends on I3164, and the rest must be announced on the board, with master merged between them"
  - "I3415 changes promote's documented evidence contract. Whether an agent may promote at all is an open owner question that this milestone does not settle: ADR 0091 says a person promotes, while step 2 of the evolve skill has an agent run promote"
  - "I3413 runs inside session close (lib/session.sh:663-669); its comparison is a directory listing of file names, not a read of records, and its added time is measured and reported"
  - "I3413's curated arm matches nothing today, because no curated note's file name has the derived episode-and-digest shape (ls .ai/repo/knowledge/curated); its value lies in the pending arm and in promotions from now on"
