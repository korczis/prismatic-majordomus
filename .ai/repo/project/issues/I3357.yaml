  - "the-product-proves-it-pays#scorecard-is-published"
acceptance_criteria:
  - "The screen test renders one row per test from a fixture repository with a plan"
  - "An unanswered economics.proof renders the unanswered state"
  - "Every emitted class is one the stylesheet defines"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib ui::"
