objective: "Slice S12 of milestone one-frame-one-kit-one-library-per-job. Extend the ui-shard and interaction probes (scripts/lib, scripts/interaction-probe, scripts/lib/interaction-specs) to the three.js topology page, the p5 activity page and every component of the one kit on all three surfaces, and run majordomus design kit --check in .github/workflows/validate.yml as a gate that fails on any finding. The deploy is verified in a browser after it publishes."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). The topology page has no dedicated test, and nothing yet refuses a change that reintroduces a second frame, kit or library."
current_state: "Measured on master on 2026-11-07: share/cockpit/topology.js (three.js 0.185.1) and share/cockpit/activity.js (p5 2.3.2) have no dedicated probe; .github/workflows/validate.yml runs four ui-shard jobs and no design kit --check step; case 4334 (test/cases/4334_the_ui_kit_is_checked_by_one_capability.sh) proves the capability, not the gate on this tree."
desired_state: "Every kit component and the topology and activity pages are visited by a probe; validate.yml fails on any design kit finding; the pages deploy is followed by a browser probe of the published site."
