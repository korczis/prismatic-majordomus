acceptance_criteria:
  - "No module but the helper formats a github.com commit, pull or blob URL, checked by a grep in the helper's test"
  - "The helper refuses a branch name where a commit is required"
  - "Each listed Cockpit and /ui site renders a commit as a link to commit/<sha>"
  - "The Cockpit quality page names the commit the findings were measured at, as a link to commit/<sha>"
  - "Case 1091 fails on a planted outbound commit link the history does not hold"
validation:
