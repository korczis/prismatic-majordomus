id: I2108
milestone: adopter-upgrades
title: "An accepted decision record is history: reasoning check reports it, never fails it"
slug: an-accepted-decision-record-is-history
priority: p0
profile: implementation
parallel_safe: true
objective: "Keep refused claims standing in accepted decision records (an adr/adrs/decisions directory, status accepted, approved, implemented, deprecated or superseded) out of reasoning.check's findings and report them in a new `history` list; doctor and the CLI print them as INFO. Proposed or undeclared records stay findings."
why: "prismatic-platform's accepted ADR-0023 says its build 'Requires Ollama binary'. reasoning check failed it and doctor printed a FAIL that could only be cleared by rewriting the record of a decision the owner took long before adopting Majordomus."
current_state: "The claims check reads every document under docs, site/content and .ai/repo and the README alike; a finding is a FAIL wherever it stands."
desired_state: "reasoning.check answers { ok, checks, findings, history }; ok is still exactly findings.is_empty(); is_accepted_record reads the status in front matter, a bold or plain label, or a '## Status' heading."
scope:
  - "apps/majordomus-cli/src/reasoning/check.rs"
  - "apps/majordomus-cli/src/capability/builtin/reasoning.rs"
  - "apps/majordomus-cli/src/commands/reasoning.rs"
  - "lib/doctor.sh"
  - "docs/generated"
  - "site/data"
  - "test/cases/1005_an_accepted_decision_is_history.sh"
acceptance_criteria:
  - "An accepted ADR in each status form is reported in history and reasoning check exits 0; a proposed or statusless ADR, and an accepted status outside a decision-record directory, still fail"
  - "Case 1005 fails against master's binary"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --lib reasoning && cargo test --doc reasoning"
  - "MJ_TEST_JOBS=2 bash test/run.sh 1005_an_accepted_decision_is_history 736_reasoning_check_refuses_drift 730_reasoning_works_with_no_advisor"
  - "majordomus generate --check"
evidence_required:
  - "accepted_record_history_case"
created_at: 2026-10-09
updated_at: 2026-10-09
