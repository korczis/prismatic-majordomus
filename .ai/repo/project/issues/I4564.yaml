non_scope:
  - "A relay through a trusted hub (I3189), which this connection makes possible"
  - "NAT hole punching and ICE (ADR 0202)"
  - "Per-message ACK, retry and dead letters (Mesh Fabric phase 04)"
  - "Adaptive route selection by measured RTT (Mesh Fabric phase 07); this issue only falls back from QUIC to HTTP"
depends_on: []
serves: []
acceptance_criteria:
  - "Two runtimes in one test, each on its own UDP socket on 127.0.0.1, complete Hello and Sync over QUIC, and a claim written on either side reaches the other"
  - "A QUIC peer that presents a certificate over any key other than the expected node key is refused before any link message is read, and the refusal names the key it expected"
  - "When the peer's QUIC port does not answer, the same dial completes over HTTP, and the link records path http"
  - "A message over MAX_LINK_MESSAGE is refused before it is sent, and a reply over MAX_LINK_REPLY is refused, exactly as on HTTP"
  - "mesh status names the QUIC listener or why there is none (MAJORDOMUS_MESH_QUIC=off, a port QUIC cannot bind), and for each endpoint dialled the transport its last round took, the round time and why it fell back; the advertisement and the card are unchanged, so an older runtime links as before"
  - "A live link between two machines (this Mac and lundra over the tailnet) carries a claim both ways over QUIC; its round time, and the HTTP round time on the same pair, are recorded in the issue's evidence"
  - "The added build time and release binary size are measured and recorded in ADR 0233"
validation:
