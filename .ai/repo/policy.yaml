# Majordomus canonical policy. Provider-neutral. Edit this file, then run
# `majordomus update` to regenerate the provider instruction files.
version: 1

context:
  always_loaded_budget_lines: 150        # hard cap on the always-loaded projection
  builder_budget_lines: 300              # hard cap on what `majordomus context` prints
  recent_decisions: 5                    # decisions offered to a worker, newest first
  max_list_items: 20                     # cap on any list inside the assembled context
  strategy: minimum-sufficient
  transcript_is_state: false

profiles:
  default: implementation
  checkpoint_interval_default: 15m

verification:
  required_for_changes: true
  finish_requires:
    - scope_respected
    - verification_ran
    - state_updated
    - no_open_blockers
    - note_present
    - obligations_met

checkpoint:
  max_body_lines: 40                     # a checkpoint is a progress note, not a report
  retention_max_files: 500

handover:
  required_sections: [Objective, Current State, Next Action]
  retention_max_files: 200

ledger:
  retention_max_lines: 5000

# The provider's episode events do three things beyond drawing the boundary, and each is a
# switch here rather than a constant in the shim. The start event hands the worker a
# briefing on standard output, which the provider adds to the context it is about to build;
# the compaction event records a derived checkpoint, because a compaction discards the
# conversation while the work continues; the end event writes a derived continuation record,
# because a closed envelope says what an episode produced and not what the next worker
# should do. None of the three asks whether a task is active: an episode is the provider's
# boundary and a task is an optional relation it carries, and making the first depend on the
# second is what silenced this subsystem for six days (ADR 0041).
session:
  briefing_on_start: true
  # The sections a closed episode's record carries in its body. The front matter is what a
  # machine can prove; these are what the episode was for and how it turned out, composed
  # from the worker's own checkpoints and decisions where it left any and from git and the
  # ledger where it did not. A section named here with no writer in lib/derive.sh is a
  # configuration error reported by name, never a silently empty heading.
  record_sections: [What Happened, Progress Notes, Decisions, Open Questions, Outcome]
  # The lifecycle commits the record it writes. A record nobody committed reaches no
  # surface — not the site, not the Rust index, not `session list` in another clone — so
  # leaving it in the working tree is the same as not writing it.
  commit_record_on_end: true
  push_record_on_end: true
  briefing_budget_lines: 60              # cap on what the start event injects, per episode
  checkpoint_on_compact: true            # also the checkpoint the close records, for the
                                         # same reason: both are moments at which what the
                                         # episode knows stops being reachable
  handover_on_end: true
  ensure_server_on_start: true           # the start event converges on a ready shared server
  stranded_after: 12h                    # an open episode silent this long may be recovered
  # How old a continuation record may be before it stops being current. Divergence
  # (exact/advanced/diverged/different_context) is a fact about git topology and says
  # nothing about age; a record can be `advanced` and six days dead at the same time, which
  # is exactly the combination that promoted a finished instruction into every new episode.
  # Declared once here and read by every surface: a second copy of these numbers in a
  # shell function, a Rust constant or a page of prose is the drift this file exists to
  # prevent.
  freshness:
    fresh_minutes: 720                   # 12h: within a working day either side, current
    stale_minutes: 2880                  # 48h: beyond this it is history, never current

# `majordomus bench` samples every public command this many times after the warm-up runs;
# `bench --check` refuses a regression larger than these fractions of the baseline's
# p50, p95 and p99; doctor and watch report their own wall time against these budgets
# (WARN, never the exit code). Measured, not guessed: change a budget with a run.
benchmark:
  samples: 10
  warmup: 2
  regression:
    p50: 0.5
    p95: 0.5
    p99: 0.6
  budget:
    doctor_ms: 3000
    watch_ms: 3000

# Use-case coverage: every public command must be named and run by an active use case
# (required); a guaranteed claim or an MCP tool without one is reported (advisory).
use_cases:
  coverage:
    commands: required
    claims: advisory
    mcp_tools: advisory

# Every entry here is reconciled by `majordomus doctor`: the path must resolve (on PATH,
# repo-relative, or absolute in the hook line), be executable, and be invoked by the
# artifact named in wired_by without its exit code being swallowed.
enforcement:
  - name: doctor-on-commit
    path: bin/majordomus
    args: [doctor]
    wired_by: git-hook:pre-commit
  - name: finish-on-push
    path: bin/majordomus
    args: [finish, --check]
    wired_by: git-hook:pre-push
  # .gitattributes marks the derived artifacts `merge=derived`, but the driver that name
  # resolves to is declared per clone and per worktree. Git says nothing when it is missing:
  # it falls back to the default text merge and conflicts on every generated file, which is
  # the state this repository was in. Declaring it here is what makes doctor — and therefore
  # the pre-commit hook — refuse a clone that has not run `just derive-merge-driver`.
  - name: derived-merge-driver
    path: scripts/merge-derived
    args: []
    wired_by: git-config:merge.derived.driver
  - name: prompt-capture
    path: bin/majordomus
    args: [capture, prompt]
    wired_by: provider-hook:claude-code
  - name: session-lifecycle
    path: bin/majordomus
    args: [capture, session]
    wired_by: provider-hook:claude-code:session
  - name: derived-current
    path: scripts/pages
    args: [current]
    wired_by: git-hook:pre-commit
  # The branch-to-worktree topology (ADR 0021, rule project.worktree-topology): a feature
  # branch is committed from its canonical worktree, <repo>-wt/<branch>, and the trunk from
  # the primary checkout. The hook asks the guard and carries no logic of its own.
  - name: worktree-guard-on-commit
    path: bin/majordomus-cli
    args: [worktree, guard]
    wired_by: git-hook:pre-commit

projections:
  - provider: agents
    target: AGENTS.md
    always_loaded: true
  - provider: claude-code
    target: CLAUDE.md
  - provider: bb
    target: .bb/AGENTS.md
