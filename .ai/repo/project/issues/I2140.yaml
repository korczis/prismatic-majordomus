    type: test
    command: "cargo test --lib mesh::journal"
    result: "ok on 98ef9ac6e3 (master c0e3585dc8 + #1179) with this branch's test, 2026-10-15T04:36Z on aarch64-darwin: 38 passed, 0 failed; paging_by_stamp_returns_every_event_exactly_once (three concurrent writers sharing stamps, paged by one, resumed after each answer's lamport) and paging_while_events_arrive_returns_every_event_exactly_once (own and peer events appended between pages, the cursor asked twice answers the same page) both ok; clippy --lib --tests -D warnings clean. The fix itself landed on master in f820f5ab02 (2026-10-10): a page never ends inside a run of equal stamps, and EventList.lamport is the stamp of the last event returned. Not covered by this cursor: an event stamped at or below a position already passed (a writer partitioned away), stated in docs/MESH.md"
    artifact: "apps/majordomus-cli/src/mesh/journal.rs"
