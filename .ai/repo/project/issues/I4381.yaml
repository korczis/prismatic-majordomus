non_scope:
  - "Dropping, sampling or weakening any gate, or lowering shellcheck's severity (`-S warning` stays)"
  - "Linting only changed files: master and the trains run the full plan, so it saves nothing where the time is spent, and it misses a case whose behaviour changes with test/lib.sh or lib/rust_bin.sh"
  - "More shellcheck parallelism: the step already uses `xargs -P $(nproc)` and saturates the 4 vCPUs of ubuntu-latest"
  - "Sharding shell-lint into a matrix: it needs more runners from a loaded pool, and the directive removes the repeated work instead"
  - "The per-job budget of the pull-request critical path (I3242) and the checkout budget (I4349): this issue budgets the structure job's wall time against its own bound"
  - "Raising `timeout-minutes` of structure to follow runner load"
depends_on: []
serves:
  - "a-change-is-judged-in-minutes#a-regression-fails-its-budget"
acceptance_criteria:
  - "test/lib.sh carries `# shellcheck source=test/lib/rust_bin.functions.sh` directly above both `. \"$ROOT/lib/rust_bin.sh\"` lines, and the misleading `source=../lib/sha256.sh` directive resolves from the repository root or is corrected"
  - "Case 4381: test/lib/rust_bin.functions.sh lists exactly lib/rust_bin.sh's top-level `name() ` functions and `NAME=` globals, in its order, and a copy of rust_bin.sh with one function added is reported as drift. Functions defined another way, globals set by export, readonly or declare, and variables assigned inside a function are not declared and not checked"
  - "Case 4381: `xargs mj_cargo_target_dir`, `sudo -n mj_rust_resolve` and `find -exec mj_cargo_target_dir` in a file that sources test/lib.sh are each SC2033, and the same file with the directives pointed at /dev/null is not; a file that only sources test/lib.sh still lints in at most three times the CPU of test/lib.sh alone"
  - "Linting all cases at `-x -S warning` with the trimmed test/lib.sh reports the same findings as with the current one (0 at master), and lib/rust_bin.sh is still linted with -x as part of shell-lint's lib/ set"
  - "Case 4381: a case that reads a variable only a function of lib/rust_bin.sh assigns fails shell-lint loudly (SC2154); the declarations never let it pass silently, and with rust_bin.sh followed the same file passes"
  - "`just ci-structure` runs both structure and structure-b, and clause 4 of project.an-expedited-landing-is-the-owners-word names both as the whole structure job; case 4381 reads every `structure` or `structure-<x>` job of .ai/repo/ci/gates.yaml and fails on one the recipe does not run or the clause does not name"
  - "github-projection and worktree-topology carry `job: structure-b` in .ai/repo/ci/gates.yaml. validate.yml has a structure-b job that runs `run-plan --plan plan.json --job structure-b` and uploads its own timings and receipts, and the ci job's `needs` names it"
  - "Case 94_ci_plan: every gate of a plan that selects it still runs, the verdict refuses a run that lacks structure-b's receipts, and the model readers (case 94, apps/majordomus-cli/src/gates/model.rs) refuse a gate assigned to a job the workflow does not define"
  - "A gate in the CI model, a typed capability under ADR 0069 and not shell, fails when the p90 wall time of structure or structure-b over the committed baseline window passes 50% of that job's `timeout-minutes`. It names the job and its three most expensive gates. Case 4381: a fixture window at 49% of the bound passes, one at 51% fails, and a missing window is a failure, never a pass"
  - "scripts/ci/step-bound-check passes with structure-b in the workflow, and every timed step of structure-b is bounded under its job"
  - ".ai/repo/ci/structure-durations.tsv is regenerated by `scripts/ci-baseline --structure-durations` from runs that carry this change, and covers both jobs"
  - "On GitHub, over the first 10 full-plan runs that carry this change, the p90 wall time of structure and of structure-b is each under 1650 s, and no run is cancelled at its bound. The run ids are recorded as this issue's ci evidence"
