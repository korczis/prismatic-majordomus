# The one action on the bar. Not a sixth category: a visitor who has decided does not want a
# dropdown, and /getting-started/ is the canonical start — it exists, it has its own
# template, and its steps are the ones the tool's own tests exercise.
[cta]
label = "Get started"
href = "/getting-started/"

# Routes that moved. The generator turns each into a Zola alias on the page it points at,
# so the old address answers with a redirect; scripts/site-check proves every one resolves.
# The old outcome pages were the hero's three propositions; the features replaced them.
[[redirects]]
from = "/outcomes/"
to = "/features/"

[[redirects]]
from = "/outcomes/faster-onboarding/"
to = "/features/"

[[redirects]]
from = "/outcomes/lower-cost/"
to = "/features/"

[[redirects]]
from = "/outcomes/less-wasted-time/"
to = "/features/"

# Receipts, not destinations. The detail pages under these sections are the repository's audit
# trail — one page per issue and milestone, per capability and module, per closed session —
# and they stay published, linked and reachable, because a claim on this site that cannot be
# followed to its receipt is not worth making. What they are not is what a search engine
# should rank for this project: hundreds of them outnumbered every product page ten to one.
#
# A section named here keeps its own index page indexed and in the sitemap; every page below
# that index carries <meta name="robots" content="noindex"> (templates/base.html) and is left
# out of sitemap.xml (templates/sitemap.xml). scripts/ci/homepage-check holds both directions
# over every built page, so the policy is this list and nothing else.
[indexing]
unlisted = ["plan", "registry", "sessions"]
