id: I0015
milestone: M000
title: Open the first real milestone and execute one issue through it
slug: dogfood-cutover
priority: p0
profile: deep-work
parallel_safe: false
objective: "Prove the system on real repository work: open a milestone that exists because the repository needs it, and take one of its issues from READY to DONE entirely through the model."
why: "Infrastructure that has never carried real work is a demo. The cutover is the only evidence that the discipline is usable."
current_state: "M000 was executed partly outside the system, because the system did not exist when it began."
desired_state: "A real post-bootstrap milestone exists, one of its issues is DONE with evidence recorded through plan evidence, and the graph has recomputed the next ready issue."
scope:
  - .majordomus/project
non_scope:
  - A synthetic demonstration milestone
depends_on:
  - I0012
  - I0014
acceptance_criteria:
  - The milestone addresses a defect or gap the repository already recorded, not one invented for this issue
  - One issue moved READY to ACTIVE to VERIFY to DONE through the command surface
  - The evidence attached to it is a command and its result, not a narrative
  - The next ready issue after it is derived, not chosen
validation:
  - bin/majordomus plan status
  - bin/majordomus plan next
evidence_required:
  - lifecycle
risk: "Choosing a milestone to make the demonstration easy would defeat the purpose."
