  - "apps/majordomus-cli/src/commit/mod.rs"
  - "apps/majordomus-cli/src/commit/policy.rs"
  - "apps/majordomus-cli/tests/commit_consumed.rs"
  - "lib/finish.sh"
  - "lib/doctor.sh"
