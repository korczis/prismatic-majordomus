id: derive-does-bounded-work
title: "A derive does the work its changed inputs ask for and no more, and what it produces is what a full derive would"
slug: derive-does-bounded-work
order: 325
priority: p1
problem: "Every derive regenerates every derived artifact. `scripts/derive` runs stage A (`majordomus generate`), stage B (`scripts/generate-site-data`), stage C (`majordomus generate` again) and stage D (`scripts/gitattributes`) in sequence (scripts/derive:152-185) with no skip at any stage: `generate::write` rewrites each artifact in place whether or not it changed (apps/majordomus-cli/src/generate.rs:2351-2362), and stage B rebuilds its whole output and runs every use-case scenario (scripts/generate-site-data:1084). The only cheap question is freshness: one fingerprint over the whole input list (scripts/generate-site-data:176, lib/common.sh:49), so any canonical change invalidates everything; 37b825efec changed a TSV and one case, and `artifacts.*`, `source.json`, `registry.json`, `PLAN_STATUS.md` and `PAGES_STATUS.md` all moved. Which artifact reads which input is prose: the manifest names 178 artifacts with an output hash and a sentence for a source (generate.rs:1803-1830), and the derivation graph is script order and a diagram (docs/GITHUB_PAGES_ARCHITECTURE.md:126-181). The cost lands on every branch and every refresh: 699 s on Linux with the build (f1a892ebc6), over an hour on the shared Mac at load 25, and 185 s, 1125 s and 2135 s for three derives of one branch in one evening (I1409); the integrator's refresh act runs a full derive per pull request (apps/majordomus-cli/src/integration/drain.rs:2150). The machine lock of PR #855 (lib/machine_lock.sh) keeps that cost to one derive at a time, which is right and makes every derive wait for every other. No incremental path exists to prove equal to the full one, and rule project.cache-is-invisible records that no cache exists and sets the conditions for adding one."
outcome: "Every derived artifact names the inputs it is made from, in the declarations that already exist: the manifest the executable writes for stages A and C, and the site generator's own input list, refined per section, for stage B. The executable's generation is staged and published whole, as the site's already is. A derive whose inputs did not move runs no stage and says so; a derive after one canonical change regenerates what reads that change and writes, byte for byte, the tree a full derive writes. The equivalence is a case that reorders inputs, renames one, interrupts a derive and poisons the record, and the full derive stays the authority: `scripts/derive-check` is unchanged and a bypass switch runs everything. Derive has a budget per scenario, set from the samples of milestone the-delivery-baseline-is-recorded and judged with their noise. A CI gate that was not run leaves a record bound to the inputs that excused it, and a suite case that declares what it reads is selected only by a change to it."
current_state: "No per-artifact input is data, no derive skips anything, stage A and C write in place, no derive budget exists, and a CI skip is a 14-day `ci-plan` artifact bound to no input digest. 22 of the gate model's 28 path classes select the whole shell suite, and no suite case declares what it reads."
desired_state: "A person who edits one rule runs `scripts/derive` and sees which artifacts were regenerated and why, and `scripts/derive-check` agrees with the result; a second derive says nothing changed; a CI run's skip of a gate names the inputs whose hash excused it."
