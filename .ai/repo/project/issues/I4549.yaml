id: I4549
milestone: idd-reads-at-a-glance
title: "A draft revision compiles to one deterministic prompt preview that can be copied, and an unchanged revision compiles to the same bytes"
slug: a-draft-previews-its-prompt
priority: p2
profile: implementation
objective: "Derive, read-only, a prompt text from one draft revision and its brief (I3251): the statement, the criteria, the context the brief cites with its sources, and the delivery contract the repository's rules already state; show it on the draft screen with a copy action."
why: "The owner's pack of 2026-11-07 asks for a live prompt and prompt-pack preview (campaigns/majordomus-intent-workbench-pack-20261107/prompts/03-P03-LIVE-PROMPT-AND-PACK-PREVIEW.md). The preview is never named pack or intake: intent a-brief-is-reconciled-into-the-plan holds that no kind, command, schema or capability is so named, and pack.plan already means repository shards."
current_state: "devcontext says rendering a prompt is a projection of its selection; nothing renders one from a draft."
desired_state: "The same revision and the same index fingerprint give byte-identical text on every surface; a changed revision gives a new text and the screen says which revision it shows."
scope:
  - "apps/majordomus-cli/src/capability/builtin/intents.rs"
  - "apps/majordomus-cli/src/devcontext/mod.rs"
  - "apps/majordomus-cli/src/ui/draft.rs"
  - "apps/majordomus-cli/tests/ui_idd_draft.rs"
depends_on:
  - "I4548"
  - "I3251"
non_scope:
  - "Executing the prompt"
  - "A stored prompt: the preview is derived on read"
serves:
  - "the-owner-directs-work-from-the-ui#a-draft-is-composed-from-the-workspace"
acceptance_criteria:
  - "One revision at one index fingerprint compiles to byte-identical text twice and on the command line, HTTP and MCP"
  - "The preview names the draft revision and the fingerprint it was compiled at"
  - "No capability, command or kind added by this issue is named pack or intake"
  - "The preview writes nothing"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test ui_idd_draft"
evidence_required:
  - "test_a_draft_previews_its_prompt"
created_at: 2026-11-07
updated_at: 2026-11-07
