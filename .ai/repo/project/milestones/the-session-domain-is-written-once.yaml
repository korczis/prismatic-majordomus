id: the-session-domain-is-written-once
title: "The session lifecycle is written by the typed domain, and the shell only parses and renders"
slug: the-session-domain-is-written-once
order: 165
priority: p1
problem: "ADR 0047 built the typed session domain (apps/majordomus-cli/src/session/) additively and recorded a six-step cutover; none of the steps has happened. At 707a04c the lifecycle is still written by lib/session.sh (1341 lines), lib/capture.sh (2821 lines; wc -l at 707a04c), lib/checkpoint.sh and lib/handover.sh, while session/store.rs has a close() no command calls. Freshness exists twice (mj_freshness in lib/common.sh and Freshness in capability/builtin/continuity.rs, both reading session.freshness), and continuity resolution exists twice (mj_resolve_latest and continuity.rs). Records still close with tasks: [] and issues: [] when a session worked on a task, because the task an episode began on is not recorded as a ledger fact of that episode when it was started in an earlier one. Proposed in ADR 0182 (A closed session record is judged by what it can attribute, not only by its schema) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c097#2, chatgpt-majordomus:c116#7."
outcome: "Each lifecycle transition has one implementation in the typed domain; the shell commands keep their arguments, output and exit codes and delegate; a closed record states whether it is complete."
current_state: "Verified on master 707a04c: exactly-once close is enforced in shell under a lock (case 220_exactly_once_close, I1503 DONE); the record body is composed from the ledger (.ai/repo/sessions/README.md, session.record_sections); the six-day-outage fixture is case 130_lifecycle_survives_a_stale_task; per-provider episodes are case 111. The automation inventory classifies the session libraries as disposition A; that label is hand-authored and shell check validates only its form. Cases that need the executable skip without one unless the run passes --no-skips (test/run.sh). No completeness verdict exists."
desired_state: "ADR 0047 steps 1-6 landed one PR each; lib/session.sh, lib/checkpoint.sh and lib/handover.sh are argument parsing and rendering; one freshness function and one resolver; a completeness verdict derivable for every closed record and shown where a resuming session reads."
scope:
