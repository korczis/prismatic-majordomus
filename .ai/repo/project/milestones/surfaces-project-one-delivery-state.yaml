id: surfaces-project-one-delivery-state
title: "A slow or stuck delivery is diagnosed from the same facts on the command line, over MCP, over HTTP and in the browser, each with its age"
slug: surfaces-project-one-delivery-state
order: 329
priority: p2
problem: "One declaration reaches MCP, HTTP, OpenAPI and the Cockpit's explorer, runner, navigation and palette by construction (capability/closure.rs:3-7; tests/projections.rs:26 and :239; tests/cockpit.rs:115), so the surfaces do not disagree about what exists. They do not yet answer the question a person has when delivery is slow or stuck. The Overview's twelve cards (capability/builtin/dashboard.rs:472-617) say nothing about the pull-request queue, the required verdict, a run or whether the last release is served, and its cost rule (dashboard.rs:31-33) forbids asking an expensive source for them. A card carries no moment of its own (dashboard.rs:162-181), so a queue observed hours ago reads like one observed now: on 2026-10-10 at 17:32Z the queue held 51 open pull requests with none ready, and the required check on their heads was 14 failed, 2 passed and 35 absent. The one live channel, the WebSocket at `/events` (http/events.rs:45), carries executions only; the integration trail, the plan and the mesh reach a page by reload or by polling (share/cockpit/worktrees.js:62). A command capability declares its effect and nothing about a dry run or about what makes a repeat harmless (capability/model.rs:442 and :614-637), and no fixture asserts that one delivery fact has the same id, order and status on all four surfaces. The command `majordomus ui` does not exist: the only `Ui` variant is `web report ui` (cli.rs:2801)."
outcome: "The Overview answers delivery from the cheap sources that already hold it: the queue's last observation, the required verdict that observation carries, and the record and the served standing of the last release; a run gains its card when the run model projects it. Every fact carries the observation of its own source, and one older than that source's bound is shown as stale and never as a pass. The one channel at `/events` carries the integration trail beside executions, with the same cursor and resync, and no second push channel exists. A command capability declares whether it has a dry run and which input makes a repeat harmless, and the hints every projection renders follow from that. One fixture holds the four surfaces to the same ids, order and status."
current_state: "Delivery is diagnosed by running `majordomus prs status` in a terminal and reading the Integration page after a reload; the Overview, MCP and HTTP answer four other questions, and a card does not say how old its fact is."
desired_state: "A person or an agent asks any surface why delivery is stuck and reads the same facts with their age, and a page that shows the queue moves when the trail does."
