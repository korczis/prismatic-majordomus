  - "Adding runner units to critical_services: critical.conf's OOMScoreAdjust=-900 would be inherited by the CI compilers"
  - "I2674's S3 criteria: the store's authentication, credentials and the provider's server"
  - "Refusing CI on a failing observation (I4359)"
acceptance_criteria:
  - "Unit test: observe() over a fixture root without disk-guard.timer yields a plan owing changes, and the doctor check derived from it fails with a non-zero exit naming `mesh build-cache provision`"
  - "Unit test: a fixture with the timer inactive, the ballast missing, disk-guard.json 16 minutes old, or a declared drop-in missing each fails the check, naming the missing item; a fixture with all four present passes"
  - "Unit test: the provision plan installs build-host-observe.service and build-host-observe.timer with OnUnitActiveSec of five minutes and enables the timer; a second plan over the applied fixture owes nothing"
  - "Unit test: `mesh doctor --build-host` writes build-host.json with the verdict, the failing items and the time, and journals one build_host_observed event carrying the node and the verdict"
  - "Evidence on this issue from lundra: the provision applied, a second apply reporting 0 changes, `systemctl is-active disk-guard.timer build-host-observe.timer` printing active twice, build-host.json under 15 minutes old with verdict pass, and a build_host_observed event from lundra in `mesh events`"
  - "policy.json names lundra's baseline tenants with a bound each, and the observation reports a tenant over its bound"
validation:
