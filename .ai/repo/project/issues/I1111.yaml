id: I1111
milestone: two-folder-integration
title: Uninstall gives back exactly what was taken
slug: uninstall-reverses
priority: p0
profile: deep-work
parallel_safe: true
objective: "Implement removal that reverses every recorded mutation, refuses anything a person has since edited, and leaves authored knowledge in place unless removal is asked for separately and explicitly."
why: "A tool that cannot be removed is a tool people hesitate to adopt. And the half of the footprint that matters most — the decisions, the handovers, the knowledge accumulated over months — is the project's property, not the tool's leftovers."
current_state: "Nothing removes an adoption. What Majordomus wrote outside its namespaces can only be found by reading a diff."
desired_state: "One command reverses the ledger, one flag additionally removes generated state, and removing authored content is a separate decision the default never makes."
scope:
  - apps/majordomus-cli/src/commands/uninstall.rs
non_scope:
  - Removing authored content under any default
  - A broad recursive delete of any path not named by the ledger
depends_on:
  - I1109
acceptance_criteria:
  - Every recorded mutation outside the two namespaces is reversed to the state the ledger recorded as prior
  - A managed region is removed without disturbing the rest of its file, and a file that exists only because Majordomus created it is removed whole
  - A bridge whose hash no longer matches is left in place and reported, never overwritten or deleted
  - The default leaves authored `.ai/` content untouched; removing generated state and removing authored content are separate, explicit requests
  - After the default removal, the repository is what it was before adoption apart from authored content, proved by comparing against a recorded starting state
validation:
  - bash test/run.sh
  - cargo test --workspace --all-features
evidence_required:
  - reverses_ledger
  - refuses_edited
  - authored_survives
risk: "This is the operation where a mistake destroys somebody's work. Every deletion is justified by a ledger entry and a matching hash, or it does not happen."
created_at: 2026-09-06
updated_at: 2026-09-06
