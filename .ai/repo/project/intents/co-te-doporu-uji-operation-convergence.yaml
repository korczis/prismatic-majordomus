title: "# Co teď doporučuji: Operation Convergence"
statement: "# Co teď doporučuji: Operation Convergence\n\nZastavit rozšiřování scope, dokončit integraci a připravit `v1.0.0-alpha.1` na pondělí 19. října.\n\nNe proto, že Majordomusu docházejí nápady. Právě naopak. Má jich implementovaných tolik, že další feature má nyní pravděpodobně menší hodnotu než bezpečné doručení těch existujících.\n\nZnovu jsem ověřil GitHub. Stav je následující:\n\nBatch 71a · PR #1340\n\nCI probíhá\n\nHead `0a19b7fe`\n\n12 zahrnutých PR\n\nDocker image: success\n\nPlánovací a vybrané integrační kontroly: success\n\nCelkový `validate`: in progress\n\n`master` je stále `25b5fce9`, batch 71a dosud není mergovaný.\n\nMoje doporučení je rozdělit práci na čtyři řízené fáze a nic mimo ně teď neotevírat.\n\n## Fáze 1: Doručit to, co už čeká na landing\n\nP0\n\nNejvyšší priorita\n\nPrvní cíl: uzavřít [PR #1340](https://github.com/korczis/prismatic-majordomus/pull/1340?utm_source=chatgpt.com).\n\nAktuální společný CI běh už má zelené `plan`, `pages`, `mesh-lab`, `cockpit`, `rust (2)` a Docker. Ostatní důležité kontroly ještě dobíhají.\n\nDoporučuji:\n\n1. Pokud CI selže, opravovat pouze konkrétní selhání, bez přidávání dalších features.\n2. Po úplném zeleném verdiktu mergovat přes existující landing mechanismus.\n3. Ověřit nový `master` a navazující validate.\n4. Uzavřít nebo označit 12 původních PR jako zahrnutých.\n5. Přepočítat skutečné zbývající závislosti a konflikty.\n\nNespouštět další velký batch, dokud první nemá doložený zelený výsledek.\n\n## Fáze 2: Zaplatit provozní dluh\n\nPo 71a bych dal přednost těmto čtyřem zásahům.\n\n| Pořadí | Zásah                                                                                                             | Proč                                        |\n| ------ | ----------------------------------------------------------------------------------------------------------------- | ------------------------------------------- |\n| 1      | [#1349](https://github.com/korczis/prismatic-majordomus/pull/1349?utm_source=chatgpt.com) Disk-safe build cleanup | ENOSPC zastavuje vývoj                      |\n| 2      | [#1313](https://github.com/korczis/prismatic-majordomus/pull/1313?utm_source=chatgpt.com) Prerelease isolation    | Alpha nesmí nahradit stable                 |\n| 3      | [#1347](https://github.com/korczis/prismatic-majordomus/pull/1347?utm_source=chatgpt.com) Evidence ledger         | Dokončení musí být podloženo důkazy         |\n| 4      | [#1312](https://github.com/korczis/prismatic-majordomus/pull/1312?utm_source=chatgpt.com) MCP resilience          | Agent nesmí tiše běžet bez kontrolní vrstvy |\n\nSoučasně bych dotáhl kontrolu aktuálnosti checkoutu z [#1299](https://github.com/korczis/prismatic-majordomus/pull/1299?utm_source=chatgpt.com).\n\nA u #1313 je nutné dokončit i prerelease parsing v `Version::parse`. Samotné označení GitHub releasu jako prerelease nestačí.\n\nVšechny tyto změny nejprve aktualizovat vůči aktuálnímu `master`, nezachraňovat konfliktní historii ručním přepisováním výsledků kontrol.\n\n## Fáze 3: Dokončit jednu produktovou vertikálu\n\nTady bych zvolil IDD, nikoli mesh compute.\n\n## IDD jako hlavní ukázka alpha\n\n\\#chatgpt-mermaid-\\_r_12r\\_{font-family:-apple-system-body,ui-sans-serif,-apple-system,system-ui,\"Segoe UI\",Helvetica,\"Apple Color Emoji\",Arial,sans-serif,\"Segoe UI Emoji\",\"Segoe UI Symbol\";font-size:16px;fill:rgb(13, 13, 13);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#chatgpt-mermaid-\\_r_12r\\_ .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#chatgpt-mermaid-\\_r_12r\\_ .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#chatgpt-mermaid-\\_r_12r\\_ .error-icon{fill:rgb(243, 243, 243);}#chatgpt-mermaid-\\_r_12r\\_ .error-text{fill:rgb(13, 13, 13);stroke:rgb(13, 13, 13);}#chatgpt-merma