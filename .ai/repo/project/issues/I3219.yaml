id: I3219
milestone: every-surface-follows-what-changed
title: "The Observatory is told what happened over the live channel, and asks only when it cannot be told"
slug: the-observatory-is-told
priority: p2
profile: implementation
objective: "Let /ui/observatory and /ui/kiosk be told what the journal appended: the journal tells its subscribers every append, /events serves it as a topic carrying the client's logical clock, and PR #1178's observatory-stream.js applies each frame to the scene model the page already builds; the page falls back to its cursor read of /api/v1/observatory/events only when the socket is refused, saying so; the published replay is untouched."
why: "Owner, 2026-10-14: Observatory content must be live and streamed over WebSocket. ADR 0158 states the journal-follow is not a true push and anticipates a display that is told rather than asks. Proposed in ADR 0216 (Every live surface follows one channel with named follow streams, and nothing polls where a stream exists) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c260#0, chatgpt-majordomus:c260#3."
current_state: "Verified on master 707a04c7ce8: share/ui/observatory.js fetches /api/v1/observatory/events?after=<cursor> on an interval; I2679 (DONE) made that cursor read; PR #1178 (open, conflicting) holds observatory-stream.js and names the journal follow as its next leaf; I2985 (5a, taken) adds a blackboard scene, not the transport."
desired_state: "One socket client and one status machine per page, #1178's observatory-stream.js extended with the journal topic; LIVE is shown only while frames arrive."
scope:
  - "share/ui/observatory.js"
  - "share/ui/observatory-kiosk.js"
  - "apps/majordomus-cli/src/ui/observatory.rs"
  - "docs/MAJORDOMUS_UI.md"
non_scope:
  - "Any write over the socket"
  - "New scenes"
serves:
  - "every-surface-follows-what-changed#the-observatory-is-told"
acceptance_criteria:
  - "A journal append reaches an open Observatory without its cursor read running"
  - "With the socket refused the page reads by cursor and labels itself so"
  - "The public replay still says REPLAY"
validation:
  - "bash test/run.sh 3011_the_observatory_draws_nothing_it_did_not_read"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test observatory"
  - "scripts/ui audit --only /ui/observatory"
evidence_required:
  - "case_the_observatory_is_told"
created_at: 2026-10-18
updated_at: 2026-10-18
