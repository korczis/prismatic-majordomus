id: I3147
milestone: entry-proves-what-it-handed
title: "The effective governance has one digest, computed by one function and shown by the preflight"
slug: governance-has-one-digest
priority: p1
profile: implementation
objective: "Compute a digest over the sources of the effective governance, declared once in policy.yaml (project and vendored rules at their versions, profiles, workflows, skills, prompts, scope.yaml, the declared share/schemas entries, the hook wiring in .claude/settings.json and a declared list of governing policy keys), as sha256 over a canonical manifest of (input id, content hash) from working-tree bytes, and show the digest and its manifest in the preflight's governance check and on every entry surface."
why: "On 2026-09-10 the owner asked to see at every start that governance is in force; the assistant's answer named a fingerprint to prove what an agent started under, detect a change and pin handovers. On master the preflight counts rules but no digest exists; intent_binding's plan_revision pins intents only. Proposed in ADR 0181 (An episode records the governance and the briefing it was handed, each by one digest) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c103#2."
current_state: "environment/cache.rs fingerprints cache tiers by path, size and modification time (fingerprint_of); environment/preflight.rs has no governance digest; docs/PREFLIGHT.md 'Governance status' names none."
desired_state: "environment.preflight answers governance.digest; the same tree gives the same digest on every surface."
scope:
  - "apps/majordomus-cli/src/environment"
  - "apps/majordomus-cli/src/capability/builtin/environment.rs"
  - ".ai/repo/policy.yaml"
  - "docs/PREFLIGHT.md"
non_scope:
  - "Recording the digest per episode (I3148)"
serves:
  - "entry-proves-what-it-handed#one-governance-digest"
acceptance_criteria:
  - "Editing a rule changes the digest"
  - "Touching a timestamp or a non-governance file does not"
  - "The input set is declared once and the preflight names it"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test preflight"
  - "bash test/run.sh 190_entry_is_automatic"
evidence_required:
  - "test_governance_digest_is_stable"
created_at: 2026-10-18
updated_at: 2026-10-18
