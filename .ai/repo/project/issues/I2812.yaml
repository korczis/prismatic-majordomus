objective: "Add case 3220: on a fixture repository and a real server, a real browser picks a test intent in /ui/idd, reads its issues and the dependency between them, starts an issue from its move form, sees the row change without the test reloading, writes and commits the work, runs the issue's own check as a real test and records its command and result as evidence, verifies the issue from a second tab while the first shows it without navigating, marks it done, and reads the standing panel's explanation and the issue page's evidence; the recorded command, run again, gives the recorded result. No feature is added."
why: "The owner's acceptance for v1.0.0-alpha.1 is the IDD loop walked once, on one exact commit, in CI: the pieces each have their own tests, and nothing proved that they make one loop a person can walk."
