id: I4318
milestone: surfaces-never-disagree
title: "The homepage's count of machine-enforced rules agrees with /doctrines/"
slug: the-homepage-rule-count-agrees-with-doctrines
priority: p1
profile: implementation
parallel_safe: true
objective: "The hero strip's rule figure and the page it links say one number: the homepage reads the rule package's blocking doctrines (site/data/generated/doctrines.json counts.blocking), the figure /doctrines/ shows under blocking, labels it as blocking, and scripts/ci/homepage-check `figures` fails whenever a hero figure differs from the figure its link target shows under the same data-figure key."
why: "Evidence from 2026-10-28 on https://majordomus.dev (serving 81ef931): the homepage figure \"rules a machine enforces, not a reviewer 68\" links to /doctrines/, which reads \"declared 50 blocking 43 advisory 7\". The homepage counted this repository's resolved rules (site/data/registry/product.json rules with class blocking and enforced: 38 project.* and 30 majordomus.*), while /doctrines/ counts the rule package share/standard/majordomus/ (doctrines.json counts), so a reader following the link met another number for what reads as the same thing."
current_state: "site/templates/index.html sets blocking = [r for r in model.rules if r.class == \"blocking\" and r.enforced] (68) and renders it as \"rules a machine enforces, not a reviewer\" linked to /doctrines/; the evidence chain's \"rules that stop the command\" node reuses it, also linked to /doctrines/; site/templates/doctrines-section.html renders doctrines.json counts (declared 50, blocking 43, advisory 7); /method/ already says 43 of 50 from method.json governance. No check compares a homepage figure with the page it links."
desired_state: "The homepage's rule figure, labelled \"blocking rules a machine enforces, not a reviewer\", and the evidence chain's rules node both read doctrines.json counts.blocking, the figure /doctrines/ shows; the hero figure and the /doctrines/ blocking figure both carry data-figure=\"rules-blocking\"; scripts/ci/homepage-check `figures` fails when a hero figure's value differs from its link target's figure of the same key, when the key or the target is missing, or when a keyless figure links a page that declares figures. This repository's own 83 resolved rules stay counted on /method/argument/, which links no figure of the strip."
scope:
  - ".ai/repo/project/issues/I4318.yaml"
  - "site/templates/index.html"
  - "site/templates/partials/evidence-chain.html"
  - "site/templates/doctrines-section.html"
  - "scripts/ci/homepage-check"
  - "test/cases/4318_the_homepage_rule_figure_agrees_with_its_link.sh"
  - "test/cases/333_homepage_narrative.sh"
acceptance_criteria:
  - "A homepage whose rule figure reads 68 while /doctrines/ shows rules-blocking 43 fails homepage-check `figures` with a finding naming both numbers (test/cases/4318)"
  - "A figure whose key its target does not carry, a target the build did not write, a keyless figure linking a page that declares figures, and a homepage with no hero strip each fail `figures`; a clean tree passes, with absolute and relative links resolved alike (test/cases/4318)"
  - "site/templates/index.html reads doctrines.json counts.blocking for the rule figure and names it rules-blocking, and site/templates/doctrines-section.html names its blocking count rules-blocking (test/cases/4318)"
  - "scripts/ci/homepage-check over the built site reports OK for `figures` with rules-blocking 43 = /doctrines/"
validation:
  - "bash test/run.sh 4318_the_homepage_rule_figure_agrees_with_its_link 333_homepage_narrative"
  - "scripts/site-build --no-css && scripts/ci/homepage-check --only figures"
  - "bin/majordomus plan validate"
evidence_required:
  - test
risk: "A future hero figure that links a page declaring figures must name one of them, so adding a data-figure to a page the strip links obliges the homepage to name it; that is the intent, and the finding says which figures the target shows."
created_at: 2026-10-28
updated_at: 2026-10-28
