id: I2872
milestone: two-folder-integration
title: "The skeleton a new repository receives is derived from the layout declaration"
slug: the-skeleton-is-derived
priority: p0
profile: implementation
parallel_safe: true
objective: "init seeds a new repository from I2870's declaration instead of lib/init.sh's hand-written list of files, and a derive-check proves share/skeleton's manifest and directory contracts agree with the declaration, so the skeleton cannot drift from the layer it seeds."
why: "The third slice of I1102. On 2026-10-21 share/skeleton was found hand-copied by lib/init.sh, a second enumeration of the layout. Its manifest lacks the `releases` section .ai/manifest.yaml has, which is not drift: .ai/repo/releases is Majordomus's own release history (release/version.rs pins apps/majordomus-cli; records come from scripts/release-record), repository-only, as the release seat (9c) confirmed; a check that cannot tell such a section from drift is what this slice adds."
current_state: "share/skeleton is 41 hand-written files; lib/init.sh copies them through a hard-coded list and creates the local directories itself; no generator or check covers it."
desired_state: "The skeleton is derived from the declaration, and a check fails when they disagree."
scope:
  - share/skeleton
  - lib/init.sh
  - apps/majordomus-cli/src
  - scripts
  - .ai/repo/project/issues/I2872.yaml
non_scope:
  - "Adopting an existing repository (the adopter milestones)"
depends_on:
  - I2870
acceptance_criteria:
  - "init's seeded tree is derived from the declaration, not from a second list"
  - "A check fails when share/skeleton and the declaration disagree, and names a repository-only section (releases) as such instead of reporting it as drift"
validation:
  - "cargo test --workspace --all-features"
  - "scripts/derive-check"
evidence_required:
  - skeleton_derived
created_at: 2026-10-21
updated_at: 2026-10-21
