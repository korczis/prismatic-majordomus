id: I4460
milestone: a-bounded-task-is-carried-to-accepted-work
title: "An obligation whose inputs name no file in the repository is never a freshness proof: check reports it unknown and a completed finish refuses it, by one judgement both engines share"
slug: an-obligation-over-no-file-is-never-fresh
priority: p1
profile: implementation
parallel_safe: true
objective: "When the inputs share/obligations.yaml declares for a token resolve to no tracked file in the repository, evidence recorded for that token can be judged neither fresh nor stale, and the judgement says so instead of comparing an empty hash with an empty hash. The shell judge (mj_obligation_judge, lib/evidence.sh:457-459) and the Rust judge (apps/majordomus-cli/src/capability/builtin/obligations.rs:683) return the same reading for that case: unknown, with the detail `the obligation <token> names no file in this repository (inputs <globs>); its evidence cannot be judged fresh` and a remedy that names what would give it inputs. unknown is mapped onto the vocabulary each engine already has, never onto pass: the shell judge reports it in its unmet column with that reason, and the Rust judge does not return Divergence::Exact for it. The outcome decides as it does for every other shortfall (mj_obl_verdict): a completed finish refuses, partial and blocked report it. The rule an empty input set obeys is written once: one table of cases (inputs that resolve to files, inputs that resolve to none, a token with no inputs, a recorded empty hash, a recorded non-empty hash) that a parity case runs through both engines, so the two judgements cannot drift apart again."
why: "Observed in session 98's stranger fixture on 2026-10-30 (installed 1.0.0-alpha.8, pass 2, scenario N4). A task was started with `--requires tests,commit`, evidence was recorded with `evidence --covers tests --type test --command \"python3 -m unittest -q\"`, calc/__init__.py was then edited, and `check` printed `OK obligation tests — discharged over inputs \"\"`. The tests token is discharged by `usecase impact` and its inputs (share/obligations.yaml:49) are lib/**, bin/majordomus, share/**, apps/majordomus-cli/src/** and test/cases/**, paths of this repository; in a repository that has none of them the input set is empty, the recorded hash is empty, the current hash is empty, and the two are equal. Stale-evidence protection, which mission section 9 requires (a change of the relevant inputs must invalidate the evidence or demand a new verification, and unknown must never mean passed), does not exist for an adopter. The shell comment at lib/evidence.sh:426-429 says a second implementation is how check and a gate come to disagree, and the empty-set rule is implemented twice; mission section 12 requires local and CI enforcement to share one implementation of an invariant."
current_state: "At master 51b38035a71: mj_obligation_inputs_hash (lib/evidence.sh:74-83) prints an empty string when the token declares no inputs (:77) or none of them is tracked (:80); mj_obligation_judge compares the recorded and current hashes with `[ \"$ih_rec\" = \"$ih_now\" ]` (lib/evidence.sh:458) and prints pass `discharged over inputs ` for two empty strings. apps/majordomus-cli/src/capability/builtin/obligations.rs:683 compares `hash_now.as_deref().unwrap_or(\"\") == ev.inputs_hash`, so a current hash of None equals a recorded empty one and the judgement is Divergence::Exact. share/obligations.yaml:45-50 declares the tests token's inputs as this repository's own paths. Case 103 (test/cases/103_obligations.sh:65-79) proves staleness only over lib/a, a path the inputs name; no case records evidence over an input set that resolves to nothing."
desired_state: "Evidence over an empty input set never discharges an obligation: check names it unknown with the reason and the inputs, finish --outcome completed refuses it, an honest partial or blocked finish reports it, and both engines answer the same for the same tree. An adopter whose repository matches none of a token's inputs is told so instead of being shown a pass. Enforced by case 4460, by case 103 unchanged, and by a mutation that restores the empty-equals-empty pass and turns case 4460 red."
scope:
