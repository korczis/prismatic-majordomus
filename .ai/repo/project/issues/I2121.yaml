id: I2121
milestone: public-proof
title: The roadmap is inferred from the plan and the releases, and no milestone carries a version
slug: the-roadmap-is-inferred-from-what-shipped
priority: p1
profile: implementation
parallel_safe: false
objective: "Make /roadmap/ a projection of one Rust function. It places every live milestone in the horizon its derived status gives it (now, next, later, done) and attributes shipped work to the published release that shipped it. It measures a pace over recent releases and gives a forecast only where one was measured, names the intents each milestone realises, and reports where the records and the released commits disagree. Serve the same answer as plan.roadmap's `inferred`, and remove the authored versions from the milestone records."
why: "The roadmap showed eight of twenty-six milestones, under versions typed into their records: 0.1 to 1.0, with 0.5 typed twice. The tool had shipped 0.18.0 by then. A milestone with active work but no typed version was invisible. Records that lagged the released code (I2000 and I2004 shipped in 0.18.0 and still read BLOCKED) were invisible too. The graph's text rendering read its edges backwards."
current_state: "site/templates/roadmap.html lists only milestones with a `version`. Eight milestone records carry one. plan.roadmap answers the rank order with now and next by the order field. roadmap-graph.json names its edges `requires` in the unblocking direction."
desired_state: "roadmap::infer answers plan.roadmap's `inferred` and site/data/registry/roadmap.json. The page renders the horizons, the shipped releases, the pace, the intents and the signals. No milestone record carries a version. The graph's edges read `unblocks`."
scope:
  - apps/majordomus-cli/src/roadmap.rs
  - apps/majordomus-cli/src/lib.rs
  - apps/majordomus-cli/src/site.rs
  - apps/majordomus-cli/src/generate.rs
  - apps/majordomus-cli/src/capability/builtin/plan.rs
  - apps/majordomus-cli/src/intent_binding.rs
  - apps/majordomus-cli/tests/roadmap.rs
  - scripts/generate-site-data
  - site
  - docs
  - .ai/repo/project
  - .ai/repo/adrs
non_scope:
  - Transitioning an issue or accepting a milestone the signals name
  - Reading the forge's open pull requests
  - Projecting a version number for a milestone that has not shipped
depends_on: []
acceptance_criteria:
  - plan.roadmap answers `inferred` with the four horizons, the releases, the intents and the basis of every inference
  - majordomus generate writes site/data/registry/roadmap.json from published releases only
  - /roadmap/ renders every live milestone, the shipped releases and the signals, and no authored version
  - no milestone record of this repository carries a version
  - the roadmap graph's edges read from their source as `unblocks`
validation:
  - cargo test --lib roadmap
  - cargo test --test roadmap
  - scripts/derive-check
evidence_required:
  - roadmap_inferred
risk: "plan.roadmap's answer grows by one field; nothing is removed from it. A milestone's `version` stays accepted so that an adopter's records keep validating, but nothing reads it any more."
created_at: 2026-10-09
updated_at: 2026-10-09
