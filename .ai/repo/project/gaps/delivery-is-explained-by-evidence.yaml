risks:
  - The machine-wide derive lock protects machine load, not a shared destination, so splitting it by key without a concurrency bound recreates the contention pull request 855 fixed
  - Pull request 821 and I2301 both rewrite gates/done.rs and gates/mod.rs, so whichever lands second must be re-ported
  - Every existing derive number is a single sample taken under unknown or extreme load, so the first real baseline is not comparable with them and must not be read as a regression or an improvement
  - I1409 records that generated content is machine-dependent, so a cache keyed only on file digests would serve bytes a clean derive on another host would not produce
  - A new operation identity would be a fourth scheme beside the test id, the execution id and the task id unless it is defined as a join over them
  - With strict off and administrators not enforced, a merge through the forge can land on a verdict computed against an older master
  - Tagging by hand is a recorded decision of version.yml, so automating it reverses a decision rather than filling a gap
