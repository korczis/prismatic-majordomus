acceptance_criteria:
  - "Case 4597, in a fixture whose master policy declares one recomputed line in README.md with a writer that prints a digest of a watched directory: two branches each change the watched directory and rewrite the line; after the first lands, `prs status --format json` reports the second needs_refresh, not conflicting"
  - "Case 4597: the executor's refresh of the second branch leaves README.md with exactly the line the writer prints on the merged tree and no conflict markers, and the derive runs after it"
  - "Case 4597: when README.md also carries a conflicting prose hunk, the second is conflicting on README.md and the refresh writes nothing"
  - "Case 4597: when the declaration exists only on the second branch's policy, the second is conflicting, as without one"
  - "Case 4597: a conflict on both the recomputed line and, under landing allocation, the version line alone is cleared by the one refresh"
  - "Case 4597: `prs explain` of the two open branches before either lands reports their README.md overlap as kind recomputed, and their contention as 0 when that is the only shared path"
  - "Case 4597: a recomputed_lines entry with no writer, an empty pattern or a pattern that does not compile is refused by `majordomus doctor` and the schema, naming the key"
  - "Before the change, case 4597 fails at its first assertion"
validation:
  - "bash test/run.sh 4597_a_recomputed_line_is_the_landings_to_write"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib -- integration::relation integration::classify integration::drain policy"
  - "bin/majordomus plan validate"
evidence_required:
  - suite
risk: "A pattern that matched too much would hand a person's edit to a writer. The pattern is anchored to whole lines, both sides of every hunk must match, a non-matching hunk keeps the whole path authored, and only master's policy can declare one."
