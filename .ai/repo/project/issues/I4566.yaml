id: I4566
milestone: development-runtime
title: "The across-machines tests take the lease as held once its holder record reads, not once its file exists"
slug: the-across-machines-test-waits-for-the-lease-holder
priority: p1
profile: implementation
parallel_safe: true
objective: "Node::hold in tests/integration_across_machines.rs waits until the integration lease file holds a holder record that parses and names a pid, so the brief the test reads next never meets the lease between its creation and its first write."
why: "Coverage on master validate 42525378591 (df412480833, 2026-11-08) failed where_no_mesh_runs_the_lease_guards_the_clone_and_says_so at integration_across_machines.rs:374: the brief said \"lease held (holder unreadable)\" where the test expects \"per-clone guard only\". IntegrationLease::acquire_holding opens the lock file with create(true), locks it, and only then writes the holder record. hold() waited for lock.exists(), which is true from the open, and IntegrationLease::read retries an unreadable record for 5 x 2 ms only, a window an instrumented binary on a loaded runner outlasts. The same master's previous validate (42516893636) passed coverage, so the test races and is not wrong."
current_state: "Measured at origin/master df412480833 on 2026-11-09: hold() waits for the lock path to exist."
desired_state: "hold() waits, within the same bound, for the lock file to read as a JSON holder record carrying a pid."
scope:
  - "apps/majordomus-cli/tests/integration_across_machines.rs"
  - ".ai/repo/project/issues/I4566.yaml"
non_scope:
  - "The lease's own read retry in integration/drain.rs, which stays as it is"
depends_on: []
acceptance_criteria:
  - "The integration_across_machines tests pass, each hold() returning only once the holder record reads"
validation:
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --test integration_across_machines"
evidence_required:
  - rust
serves: []
