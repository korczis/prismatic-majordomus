id: I3253
milestone: an-outcome-becomes-a-reviewed-plan
title: "A proposal lists the values it left unresolved, and a draft that carries an invented threshold is refused"
slug: a-proposal-says-what-it-left-open
priority: p2
profile: implementation
objective: "Add an `unresolved` list (value, why it matters, who decides) to the intent proposal and draft; the draft check refuses a numeric threshold in a criterion that cites no measurement or decision."
why: "2026-10-11 and 2026-10-13: a 'fast' or a budget number written by the plan author is an unproven assumption; thresholds come from measurement. Proposed in ADR 0191 (A plan drafted from an intent is a proposal, checked by the plan's own validators before any record is written) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c247#2."
current_state: "intents.propose takes a statement and optional title and id; no field carries open values."
desired_state: "Open values are returned by intents.list, which /ui draws, and a draft that carries one is refused by the write until it is resolved or deferred with a reason."
scope:
  - "apps/majordomus-cli/src/intent.rs"
  - "apps/majordomus-cli/src"
  - "share/schemas/majordomus/intent"
depends_on:
  - "I3251"
  - "I3252"
acceptance_criteria:
  - "A criterion with '< 200 ms' and no cited measurement is refused naming it"
  - "A proposal's unresolved items are returned by intents.list"
  - "intents.draft_write (I3252) refuses a draft whose unresolved list holds a value that is neither resolved nor marked deferred with a reason, naming each such value, and writes nothing"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
evidence_required:
  - "test_a_proposal_says_what_it_left_open"
created_at: 2026-10-18
updated_at: 2026-10-18
