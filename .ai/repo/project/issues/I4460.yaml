id: I4460
milestone: a-bounded-task-is-carried-to-accepted-work
title: "A gate run over an input set that selects no file is never a freshness proof: both gate judges read it unknown and a completed finish refuses it"
slug: gate-evidence-over-no-file-is-never-fresh
priority: p1
profile: implementation
parallel_safe: true
objective: "When a gate's inputs (Model::inputs_of, mj_gate_inputs) are empty or select no tracked file, a run recorded for it can be judged neither fresh nor stale, and the judgement says so instead of comparing an empty hash with an empty hash. Both Rust gate judges, judge_one (apps/majordomus-cli/src/gates/judge.rs:359-385), which gates.completion answers, and standing_of (apps/majordomus-cli/src/gates/state.rs:142-188), which gate state answers, return unknown for that case with the detail `the gate <id> selects no file in this repository (inputs <specs>); its run cannot be judged fresh` and a remedy naming the class paths that would give it inputs; neither returns pass for a recorded \"\" against a current \"\". The shell recorder (mj_gate_inputs_hash, lib/gates.sh:97-106) keeps writing the empty hash it writes today, so the ledger is unchanged and the decision is the judges' alone; mj_validate_completion_gates already maps unknown onto a refusal of completed and a named skip otherwise (lib/gates.sh:150-151, mj_gate_unknown). The rule is written once, as one table of cases (inputs that select files, inputs that select none, a gate no class names, an always gate, a recorded empty hash, a recorded non-empty hash) that a parity case drives through the shell recorder and both Rust judges, so the recorded hash and the two readings cannot drift apart."
why: "Found beside F11 of the integration map on 2026-10-30. The obligation judge's \"\" == \"\" pass (lib/evidence.sh:457-459, obligations.rs:683) is the obligation judge, I4434 / #2751, which the landing seat carries; the gate judges have the same shape and nothing owns it. At 51b38035a71, gate_hashes (apps/majordomus-cli/src/capability/builtin/gates.rs:382-395) hands Some(\"\") to a gate whose inputs are empty (:388), inputs_hash_with (obligations.rs:519-523) returns Some(\"\") when the specs select no tracked file, mj_gate_inputs_hash returns \"\" in both cases (lib/gates.sh:100 and :103), and judge.rs:367 and state.rs:159 compare the recorded hash with the current one, so two empty strings are equal and an exit-0 run reads pass (judge.rs:377, state.rs:172) however the tree changed. In an adopter whose class paths name none of its files, every gate that is not always: true is in that state, and the stale-run protection mission section 9 requires (a change of the relevant inputs invalidates the evidence; unknown never means passed) does not exist there. Mission section 12 asks that local and CI enforcement share one implementation of an invariant: today one rule is spelled in two Rust judges and a shell recorder."
current_state: "At 51b38035a71: judge.rs:359 takes `hash_now.unwrap_or(\"\")`, :360 reads None as unknown, :367 compares `r.inputs_hash != now_hash` and :377 passes an exit-0 run, so a recorded \"\" against a current Some(\"\") is pass `exit 0 at <head> over inputs `. standing_of (state.rs:151-172) does the same for gate state. gate_hashes (gates.rs:382-395) and its unit test a_gate_with_inputs_is_hashed_from_them_and_one_without_hashes_to_nothing (gates.rs:878) fix the empty string as the hash of a gate with no inputs. An always: true gate has inputs `*` (model.rs:429-432, lib/gates.sh:80) and is hashed over every tracked file, so it is not in this state. Case 131 (test/cases/131_completion_gates.sh:127-135) proves staleness only over a gate whose class paths select files; no case records a run over a gate whose inputs select nothing."
desired_state: "A gate run over an empty input set never discharges its gate: gates.completion and gate state both read it unknown with the reason and the specs, check names it, finish --outcome completed refuses it through mj_gate_unknown, an honest partial or blocked finish reports it, and an always gate and a gate whose paths select files are judged exactly as today. Enforced by case 4460, by cases 131 and 3059 unchanged, and by a mutation that restores the empty-equals-empty pass in either judge and turns case 4460 red."
