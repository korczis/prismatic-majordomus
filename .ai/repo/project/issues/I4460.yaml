  - "test/cases/4460_an_obligation_over_no_file_is_never_fresh.sh"
non_scope:
  - "Declaring an adopter's own inputs for the tests token, or deriving them from the task's scope: the empty set is reported and refused here, never guessed"
  - "Remote obligations (push, target, pages, deploy), which are judged by commit, not by inputs hash (lib/evidence.sh:449-456)"
  - "The attribution of evidence to the calling episode: I4292, which also edits lib/evidence.sh and is merged around, not absorbed"
depends_on: []
serves: []
acceptance_criteria:
  - "Case 4460, in a fixture repository with no path any of the tests token's inputs name: a task started with `--requires tests`, evidence recorded for tests, then a tracked file edited; `majordomus check` exits 0 and its line for tests says unknown and `names no file in this repository`, and never `discharged over inputs`"
  - "Case 4460: in the same state `majordomus finish --outcome completed` exits 10 and names the tests obligation and the reason; `finish --outcome partial` with a note exits 0 and reports it"
  - "Case 4460: the Rust judgement (the obligations capability, through the executable) gives the same state and reason for the same fixture as the shell's check line, asserted in one parity table over: inputs resolving to files, inputs resolving to none, a token declaring no inputs, a recorded empty hash and a recorded non-empty hash"
  - "Case 4460: with the fixture given a file the inputs name, evidence recorded and that file then changed, the line reads stale exactly as case 103 asserts today"
  - "Mutation: restoring `[ \"$ih_rec\" = \"$ih_now\" ]` as a pass for two empty strings, or the `unwrap_or(\"\") ==` comparison, turns case 4460 red at its first assertion; the case's header names both mutations"
  - "Case 103 passes unchanged"
  - "Before the change, case 4460 fails at its first assertion"
validation:
