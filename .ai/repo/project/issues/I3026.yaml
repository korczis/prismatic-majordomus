id: I3026
milestone: truthful-plan-surfaces
title: "A tile's label and a value in words read whole at a phone's width; a figure keeps one line"
slug: a-tile-reads-whole-on-a-phone
priority: p1
profile: implementation
parallel_safe: true
objective: "Every KPI tile of /ui wraps its label and any value written in words (a state, a string, none, not answered, not observed) at a phone's width instead of cutting it with an ellipsis, and keeps a figure (a number, or a count of a list or map) on one line in tabular figures. The screen marks a value in words with mj-ui-kpi-value--text from the reading it drew the value from (ui/view.rs); the stylesheet never guesses."
why: "A read-only sweep of the published /ui (v0.30.1, majordomus.dev) at 390 px found tile text cut on five screens: the dashboard's 'not observed', the roadmap's label 'Now: milestones in flight', the delivery timestamp '2026-10-19T09:23:30Z', the evidence value 'working_tree' and the knowledge tiles. The kit's tile label and value were 'truncate', and its narrowest tile is 9.5rem (about 152 px), which holds 18 label characters and 9 value characters. Handed over by 2b, who claimed it; assigned by a3."
current_state: ".mj-ui-kpi-label and .mj-ui-kpi-value are one line with an ellipsis; any longer label or word is cut."
desired_state: "Labels wrap; a value in words carries mj-ui-kpi-value--text and wraps; a figure stays one line in tabular figures. The deploy probe and case 1092, which read an undecided first-screen figure by its class, read the marked class too."
scope:
  - "share/ui/src/ui.css"
  - "share/ui/ui.css"
  - "apps/majordomus-cli/src/ui/view.rs"
  - "scripts/pages"
  - "test/cases/1092_the_ui_snapshot_holds_every_screen.sh"
  - "test/cases/2983_the_published_ui_is_the_trunks.sh"
acceptance_criteria:
  - "No tile label or value is cut on the dashboard, roadmap, delivery, evidence and knowledge screens at 320 and 390 px, nor on the /ui/idd hero strip at 320 px, and no page overflows horizontally"
  - "A crate test holds which tile values are figures and which are words"
  - "The first-screen undecided-figure check of scripts/pages verify-ui still refuses an unknown badge or 'not answered' in a tile marked as words (case 2983)"
validation:
  - "cargo test --lib ui::"
  - "scripts/cockpit-assets --check"
  - "scripts/ui audit --only /ui/"
evidence_required:
  - "a_tile_reads_whole_on_a_phone"
created_at: 2026-10-19
updated_at: 2026-10-19
