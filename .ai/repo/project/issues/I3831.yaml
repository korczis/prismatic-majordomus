id: I3831
milestone: ci-critical-path
title: "A hook never starts a cold cargo build: a stale executable is the installed release, or the check is skipped and says so"
slug: the-worktree-guard-never-starts-a-cold-build
priority: p1
profile: implementation
parallel_safe: true
objective: "Make bin/majordomus-cli, when run from a git hook (MAJORDOMUS_HOOK set) with a missing or stale executable, run the installed release the way `mcp` already does (mj_rust_installed, ADR 0172), and when there is none, skip with a line naming what was not checked, instead of building the crate."
why: "On 2026-10-20 the pre-commit worktree guard of feature/the-tailnet-finds-a-trusted-machine waited 60 s on the shared build directory's lock and then compiled every dependency cold in ~/.cargo/build-private, at a load of 77, for a check that takes a second."
current_state: "bin/majordomus-cli builds whenever the executable is stale unless MAJORDOMUS_BIN or MAJORDOMUS_NO_BUILD is set; only `mcp` falls back to the installed release (use_installed_for_mcp)."
desired_state: "No hook starts cargo; a hook run with a stale executable names the release it used or the check it skipped."
scope:
  - "bin/majordomus-cli"
  - "lib/rust_bin.sh"
  - ".githooks"
  - "test/cases/3831_a_hook_never_starts_a_cold_build.sh"
  - "docs/WORKTREES.md"
non_scope:
  - "Changing which checks CI requires"
  - "Claude Code permission settings, which are the owner's to paste"
depends_on: []
acceptance_criteria:
  - "With a stale executable and an installed release, a hook's guard runs the installed release and says so on stderr, and no cargo process starts"
  - "With a stale executable and no installed release, the hook skips the check with a line naming it and exits as its gate class says"
  - "Outside a hook the launcher builds as before"
validation:
  - "bash test/run.sh 3831_a_hook_never_starts_a_cold_build 96_worktree_topology"
  - "bin/majordomus plan validate"
evidence_required:
  - "a_hook_never_starts_a_cold_build_test"
created_at: 2026-10-21
updated_at: 2026-10-21
