# The one declaration of what a session reports about itself on the interval (ADR 0136,
# amended 2026-10-29). `brief.session` composes this file, with the attention entries it
# measured, into three texts: `keep_awake` (what a session is told at its start),
# `report.prompt` (what wakes it on the interval) and `report.reminder` (what rides on a
# prompt the person sends). Every carrier relays those texts verbatim — the start event
# (lib/capture.sh), the Claude Code mod (share/mods/claude-code/majordomus-brief) and the
# Cockpit — and nothing else states what is here: test/cases/4401 refuses a second copy.
#
# The executable holds a compiled copy (apps/majordomus-cli/src/capability/builtin/brief/
# report.yaml), written by `majordomus generate` behind its banner, as it holds the design
# declaration. Its fingerprint is the sha256 of this file's bytes, cut to 12 hex digits;
# every text names it, so a reader can tell which contract a report was written under.
#
# Written in the layer's YAML subset (docs/SCHEMAS.md): no flow maps and no folded
# scalars, so every rule is one double-quoted line. Validated by
# share/schemas/majordomus/brief-report/brief-report.v1.schema.json.
schema: majordomus/brief-report/v1
id: brief-report
version: 1
# the first words of every interval prompt: the mod's guard against briefing its own prompt
marker: "Majordomus report owed"
about: "What a session reports about itself on the interval, composed by brief.session from this declaration and the attention entries it measured, and relayed verbatim by every carrier."
order_note: "The sections below are reported in this order, and none is ever omitted."

sections:
  - key: header
    heading: "Majordomus report"
    holds: "the report's clock time in the person's zone and in UTC; the session id and its peer id; when the brief was composed, by which process, and in how long"
    evidence: "brief.at, answered_by.process, answered_by.elapsed_ms"
    cap: "1 line"
  - key: blocked
    heading: "Blocked on you"
    holds: "each decision, approval, credential, scope or physical act only the person can give (the attention entries whose actor is person), and what waits on it"
    evidence: "the waiting object (PR number, run id, issue id, seat) and since when"
    cap: "5 lines"
    empty: "one word"
  - key: delivered
    heading: "Delivered since {since}"
    holds: "own pull requests merged (with the merge sha), own branch heads pushed (branch, sha of 10, push time) and releases tagged since the previous report"
    evidence: "per report-verification-state: VERIFIED with the command that showed it, or PARTIAL or BLOCKED with what is missing"
    cap: "8 lines"
    empty: "one word"
  - key: in_flight
    heading: "In flight"
    holds: "each own item of work, one per issue or pull request: issue, branch, worktree, PR number, head, merge-state word; the train carrying it; its latest run with id, jobs done/total and every failed job by name; local background processes with pid and age"
    evidence: "a status word per item; run ids; the source and age of any fact not read live"
    cap: "8 items, at most 2 lines each"
    empty: "one word"
  - key: integration
    heading: "Integration"
    holds: "the master sha and its required run's word and id; the queue observation's word, age and remedy; the trains carrying own pull requests or master's fix; the last merge on master"
    evidence: "sha of 10, run id, the observation's age"
    cap: "3 lines"
  - key: mesh
    heading: "Mesh"
    holds: "peers and unread boards; overlaps with own claims and with whom; reviews and handovers for this runtime; failing links"
    evidence: "peer ids, claim scopes, link counts"
    cap: "3 lines"
    empty: "one word"
  - key: machine_ci
    heading: "Machine and CI"
    holds: "free disk against the builder floor; swap; builders against their limit; the derive lock; CI hosted running and queued; self-hosted runners online and busy"
    evidence: "GiB figures, runner names, the age of the forge reading"
    cap: "3 lines"
  - key: next
    heading: "Next"
    holds: "the one next action of this session with its trigger (now, or an event); then each planned action, labelled planned, with its owner and trigger; with no work in hand, say so and stop"
    evidence: "the object each action acts on"
    cap: "3 lines"

rules:
  - id: status-words
    text: "Every state is a status word of share/design/tokens.yaml status.states, written in brackets ([failing], [stale], [queued], [merged]). No other verdict adjective (green, red, done, fine, OK, looks good)."
  - id: evidence
    text: "Every line carries the identifier that proves it (PR number, run id, sha of 10, issue id, path). A fact not read in this turn also carries its source and age."
  - id: stale-is-not-current
    text: "A fact the brief marks stale, partial or unread is reported with that word, its age and its remedy, or is first read live with a command under live reads. It is never presented as current."
  - id: planned
    text: 'Nothing future is written as state ("X will be removed", "is being fixed"). A future action is labelled planned and names its owner (this session, a peer id, a seat) and its trigger (an event or a clock time).'
  - id: empty
    text: "An empty section is its heading and one word (none; in Czech, nic)."
  - id: no-restatement
    text: "Do not restate this contract, the brief's lines, or a list of categories. Report only what was measured or read."
  - id: language
    text: "Write in the language of the person's last message. Identifiers, commands, branch names, section keys and status words stay verbatim."
  - id: length
    text: 'At most a section''s cap. Past it, write "+N more — <command that lists them>". Never pad to reach a cap, and never drop an attention entry.'
  - id: then
    text: "After the report, carry on with the work in hand, without asking."

# The rows the Rust conditions fill (brief/report.rs `derive_attention`): the ids here and
# the conditions there are one set, which a unit test holds equal. `word` is a status word
# filed in share/design/tokens.yaml; `actor` is session, person or seat:<name>; `{name}`
# is a value the condition measured.
attention:
  - id: integration.stale
    section: integration
    word: stale
    actor: session
    fact: "queue observed {age} ago at {observed}; origin/master is {now} (+{moved})"
    remedy: "majordomus prs refresh"
  - id: integration.unfetched
    section: integration
    word: stale
    actor: session
    fact: "origin/master last fetched {age} ago"
    remedy: "git fetch origin master"
  - id: master.failing
    section: integration
    word: failing
    actor: "seat:landing"
    fact: "master {sha}: {workflow} run {run} {conclusion}"
    remedy: "gh run view {run} --json jobs"
  - id: run.failing
    section: work
    word: failing
    actor: session
    fact: "{branch}: run {run} {done}/{total}, failed {jobs}"
    remedy: "gh run view {run} --log-failed"
  - id: pr.dirty
    section: work
    word: dirty
    actor: session
    fact: "#{pr} conflicts with master"
    remedy: "git -C {worktree} merge origin/master"
  - id: pr.blocked
    section: work
    word: blocked
    actor: session
    fact: "#{pr} mergeStateStatus BLOCKED"
    remedy: "gh pr checks {pr}"
  - id: branch.no_pr
    section: work
    word: unmerged
    actor: session
    fact: "{branch} pushed at {head}, no PR"
    remedy: "gh pr create --head {branch}"
  - id: ci.queued_idle
    section: ci
    word: queued
    actor: session
    fact: "{queued} queued while self-hosted {online} online, {busy} busy"
    remedy: "gh api repos/{repo}/actions/runners"
  - id: ci.no_runner
    section: ci
    word: blocked
    actor: person
    fact: "{queued} queued, 0 runners online"
    remedy: "gh api repos/{repo}/actions/runners"
  - id: ci.unread_scope
    section: ci
    word: unread
    actor: person
    fact: "runners not readable ({reason})"
    remedy: "gh auth refresh -h github.com -s admin:org"
  - id: machine.below_floor
    section: machine
    word: blocked
    actor: session
    fact: "{free} GiB free < floor {floor} GiB"
    remedy: "scripts/reap-orphans"
  - id: machine.swap
    section: machine
    word: degraded
    actor: session
    fact: "swap {used}/{total} GiB ({pct} %)"
    remedy: "top -o mem"
  - id: machine.builders_full
    section: machine
    word: blocked
    actor: session
    fact: "builders {n}/{max}"
    remedy: "ps -Ao pid,etime,comm | grep -E 'cargo|rustc'"
  - id: peers.unread
    section: peers
    word: unread
    actor: session
    fact: "boards not read: {boards}"
    remedy: "majordomus peers"
  - id: peers.superseded
    section: peers
    word: superseded
    actor: session
    fact: "this server lost the lease to {leaseholder}"
    remedy: "majordomus server"
  - id: mesh.review
    section: mesh
    word: pending
    actor: session
    fact: "{n} review(s) for this runtime"
    remedy: "majordomus mesh state"
  - id: mesh.handover
    section: mesh
    word: pending
    actor: session
    fact: "{n} handover(s) waiting"
    remedy: "majordomus mesh handover consume"
  - id: mesh.overlap
    section: mesh
    word: warn
    actor: session
    fact: "{n} overlap(s) between a claim of this runtime and another's"
    remedy: "majordomus peers"
  - id: mesh.failing
    section: mesh
    word: failing
    actor: session
    fact: "{n} link(s) failing"
    remedy: "majordomus mesh doctor"
  - id: release.owed
    section: release
    word: owed
    actor: "seat:release"
    fact: "{landed} landed commit(s) past the last release"
    remedy: "majordomus release next"
  - id: release.overdue
    section: release
    word: overdue
    actor: "seat:release"
    fact: "{landed} landed commit(s) past the last release, past its bound"
    remedy: "majordomus release next"
  - id: derive.dead_holder
    section: derive
    word: blocked
    actor: session
    fact: "derive lock held by dead pid {pid} for {held}"
    remedy: "majordomus doctor"
  - id: session.no_task
    section: session
    word: inactive
    actor: session
    fact: "no active task (last {task} [{outcome}])"
    remedy: 'majordomus start "<task>" --scope <paths>'
  - id: section.over_budget
    section: "{section}"
    word: unread
    actor: session
    fact: "{section} took > {budget} ms"
    remedy: "majordomus brief --format json"

# Where the brief cannot be current, the command that is.
live_reads:
  - fact: "a run's jobs now"
    command: "gh run view <id> --json jobs"
  - fact: "the integration queue"
    command: "majordomus prs refresh"
  - fact: "origin/master"
    command: "git fetch origin master"
  - fact: "one pull request"
    command: "gh pr view <n> --json mergeStateStatus,statusCheckRollup"
  - fact: "every worker"
    command: "majordomus peers"
  - fact: "the mesh"
    command: "majordomus mesh state"
  - fact: "the CI pool"
    command: "gh api repos/<owner>/<repo>/actions/runners"
  - fact: "the machine"
    command: "df -g / ; sysctl vm.swapusage"
