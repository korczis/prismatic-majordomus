id: I3400
milestone: a-paste-is-decomposed-by-a-skill
title: "The decompose-a-brief skill exists, is invoked by the plan workflow, and is named by both skill tests, so skills verify holds it as a capability"
slug: a-brief-is-decomposed-by-a-skill
priority: p1
profile: implementation
objective: "Add .ai/repo/skills/decompose-a-brief/SKILL.md (skill/v1) with the procedure given in this program: open the run and claim identities, keep the paste in one canonical byte form as a campaign (or as a reference, or ask, for a conversation or an AI assistant's answer), classify every item, map each requirement to the existing plan before drafting, draft only what is new, have the draft critiqued by a reviewer that did not write it, resolve the findings, derive and validate, deliver, and offer the first wave on the mesh without claiming its scope. Invoke it from .ai/repo/workflows/plan.md, add its id to the majordomus-skill marker lines of apps/majordomus-cli/tests/skills.rs and test/cases/391_skills_are_proven_capabilities.sh, and regenerate its projections."
why: "The owner ordered on 2026-10-19 that a pasted text be decomposed by an agent following a skill. The owner's report of 2026-10-19 asks under T6 that a new user reach a first verified intent without knowing the internal doctrines, and under T3 that human interventions be measured. Today a pasted brief becomes a record with no plan, and only a person who knows the plan's vocabulary can turn it into work. The skill writes that knowledge down once, reuses existing commands only and adds no capability. It lands first because I3401, I3402, I3403 and I3405 all point a reader at it."
current_state: "ls .ai/repo/skills lists eight skills, none decomposes a paste. The marker lines at apps/majordomus-cli/tests/skills.rs:6 and test/cases/391_skills_are_proven_capabilities.sh:3 list those eight. .ai/repo/workflows/plan.md (19 lines) names no skill. The evolve skill's commit a9d7b21157b also touched .gitattributes (merge=derived lines 93 and 102 for its two pointers) and docs/generated/artifacts.{json,md,yaml} and graph.json; site/data/generated/{artifacts,context,source,skills,plan}.json and site/data/registry/registry.json name skills/evolve today (git grep -l 'skills/evolve'). The issues and ADR the procedure names (I3168, I3169, I3251, I3254, ADR 0211) are tracked only on the planning branch docs/the-chatgpt-project-is-promoted."
desired_state: "majordomus skills show decompose-a-brief prints the procedure. skills status reports it as an active skill with a naming test and an invocation, and the generated pointers, .gitattributes, the site page and the generated indexes carry it."
scope:
  - ".ai/repo/skills"
  - ".ai/repo/workflows/plan.md"
  - "apps/majordomus-cli/tests/skills.rs"
  - "test/cases/391_skills_are_proven_capabilities.sh"
  - ".claude/skills"
  - ".agents/skills"
