# Site navigation: four top-level user intents and one call to action. Rendered by
# templates/partials/navbar.html as dropdowns on desktop and as labelled flat lists inside the
# collapsed mobile menu, and by templates/partials/footer.html as the footer's columns. Every
# href must resolve; scripts/site-check verifies it, and scripts/ci/nav-check verifies that no
# href is written twice and that every projection of this file derives from it.
#
# Nothing here enumerates a feature, a domain, a module, a capability or a command: those
# routes are the generator's, and site-check refuses a feature route named by hand here.
#
# # Why four
#
# A navbar is not a sitemap. It carries the top-level questions a visitor arrives with, in the
# order they arrive with them, and this file once carried nine categories that answered a
# different question each — a visitor had to know this repository's internal ontology before
# they could find anything, which is the reader doing the information architecture's job.
#
#   Product        what it does, what it controls, and for whom    evaluate.capabilities
#   How it works   how the system actually behaves                 understand.system
#   Evidence       why I should believe any of it                  verify.system
#   Docs           how I use it, and what everything is            use.system
#   [Get started]  an action, not a category                       adopt.start
#
# The challenge opens Evidence: it is the question a visitor from a link arrives with — "show
# me it doing something" — answered with a recorded run rather than a description, and the
# homepage's first call to action already leads to it. Why opens Product's second line: the
# failure modes are the reason the product has the shape it has. Neither is a category of its
# own, so neither is a top-level entry; both stay one click from every page.
#
# Two pages left the navbar rather than moving: /docs/extraction-report/ records how
# DESIGN.md was derived in the design phase, and /docs/economics/ is the methodology behind
# the economics page rather than a page of its own. Both are reachable from /docs/ and neither is
# a question a visitor arrives with. Not every page deserves a place in the navbar.

[[groups]]
label = "Product"
href = "/domains/"
items = [
  { label = "The product, by domain", href = "/domains/" },
  { label = "Why it exists: the failure modes", href = "/why/" },
  { label = "Features", href = "/features/" },
  { label = "Features against interfaces", href = "/features/matrix/" },
  { label = "Use cases", href = "/use-cases/" },
  { label = "Applications", href = "/applications/" },
  { label = "Skills", href = "/skills/" },
  { label = "What it supervises", href = "/supervises/" },
]

[[groups]]
