id: I4357
milestone: merging-and-referencing-are-enforced
title: "Issue, ADR and case numbers are reserved atomically at origin and checked at landing"
slug: numbers-are-reserved-atomically-at-origin
priority: p1
profile: implementation
parallel_safe: true
objective: "`next --kind issue|adr|case --reserve` reserves a number by creating refs/ids/<kind>/<n> on the forge (`gh api repos/{owner}/{repo}/git/refs -f ref=refs/ids/<kind>/<n> -f sha=<commit>`), which fails atomically with 422 when the ref exists and runs no local hook, and takes the next number on that refusal; .githooks/pre-push skips refs/ids/* as it skips refs/majordomus/*, so a reservation that does reach origin through git does no hook work; a required landing check refuses an id that is already on master or reserved under different content; the identifier gates (collision-check, adr-collision, case-numbers) run in a job that needs only plan, is exempt from the first-red cancel and checks out blobless. The issue kind is reachable to an adopter as `majordomus plan reserve <prefix> [--count N]` in the shipped tree (lib/ or the plan capability), with the series prefix and the zero-padded width derived from the plan's existing ids, never hard-coded to I."
why: "Incident 6 of 2026-10-28: I4251 was taken by both #2601 and #2605, and I4296 by both #2633 and the deployed-stage worker. Ids come from one global sequence and nothing reserves a number atomically: the mechanisms are advisory (the board; `--advisory` claims followed by `|| true`), eventually consistent (one admission mutex per runtime), or detect too late (the collision gate runs behind the build and is lost when the run cancels itself). I3974 plans a survey allocator, and ADR 0168 collided even with a survey; on 2026-10-29 the block I4340-I4359 claimed on the mesh was found already used by I4340, I4350 and I4352 in uncommitted work of three other worktrees. On 2026-10-29 OSCILLA (an adopter) observed the same defect in its plan: two independent draft sets both took K120, and nothing caught it until the merge (filed from oscilla-b0's upstream candidates, item 4). An adopter plans in several lettered series (D, E, K, Q, R, S, V, ...), not one I sequence, and it has none of this repository's scripts."
current_state: "Measured at 81ef931a3e1: lib/adr.sh and scripts/case-numbers survey this tree, the sibling worktrees, the refs and the board; nothing pushes a reservation to origin; scripts/ci/collision-gate runs inside the validate jobs that build; .githooks/pre-push skips only refs/majordomus/* and delete-only pushes, so any other ref push runs `finish --check`, case-numbers and run-plan (its own comment records a rescue-ref push spending 3490 s in run-plan). Measured at 51b38035a71: scripts/release-package:91,95 ships lib/* and share/ only, so scripts/case-numbers and scripts/ci/collision-gate never reach an adopter; the majordomus plan dispatcher (lib/plan.sh:95-112) has no reserve subcommand; lib/project.sh:44-46 keys records by filename, so two branches adding one id meet only as a git add/add conflict at merge."
desired_state: "Two concurrent reservations of one number give one success and one next number; a pull request adding an id already on master or reserved under other content is refused without a build; the identifier half of rule project.work-is-claimed-before-it-is-built is blocking. Enforced by cases 560, 566 and 4357, the landing check and the rule. An adopter reserves plan ids through the shipped command: `majordomus plan reserve <prefix> [--count N]` takes the next N ids of that series above every id of the series on the tree, the refs and the reservations at origin, reserves them as one atomic refs/ids/issue/<prefix><n> set, and prints them. `majordomus plan validate` refuses an added record whose id is reserved at origin under another branch's content."
