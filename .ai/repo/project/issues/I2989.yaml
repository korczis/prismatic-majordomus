current_state: "The regex runs over the whole host file."
desired_state: "Only the region is judged; text outside it is the adopter's."
scope:
  - "lib/doctor.sh"
  - "test/cases"
depends_on: []
acceptance_criteria:
  - "A region-mode AGENTS.md with headings and bold bullets outside the region passes the bootstrap check"
  - "A rule bullet inside the region still fails it"
validation:
  - "majordomus plan validate"
evidence_required:
  - "case_bootstrap_region"
