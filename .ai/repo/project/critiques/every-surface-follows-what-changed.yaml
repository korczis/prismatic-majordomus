intent: every-surface-follows-what-changed
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: 5 of the 6 blocking findings are resolved by planned amendments to I3218, I3219, I3221 and I3222, with the I3220 binding applied on the intent record. One non-blocking finding stays open: the owner has to say what 'hooks' means and whether push notifications may be deferred."
findings:
  - id: workspace-push-is-unbound
    class: missed_requirement
    subject: "every-surface-follows-what-changed"
    finding: "The intent statement promises that 'a move on an issue, a new intent' shows on an open /ui screen without a reload. One of its sources says exactly that: c232#6, owner: 'v claude code zadam \"/intent ...\" v browseru to vidim v \"/ui\" hned skrze websocket' (I type /intent in Claude Code and see it in /ui at once over the websocket). No criterion covers it, though. The issue that does the work, I3220 ('An intent proposed or an issue moved by any client reaches an open intent workspace', p1, same sources c232#6 and c208#73), is staged in milestone everything-is-followed-in-one-stream and has no `serves` at all. So the intent could be judged satisfied without the thing the owner asked for most directly. Add a criterion such as 'a write by any client reaches an open /ui/idd without a reload', bind I3220 to it, and move it into this milestone."
    blocking: true
    resolution:
      state: planned
      issue: I3220
      because: "Applied in the plan of 2026-10-18. The intent gains criterion every-surface-follows-what-changed#a-write-reaches-the-workspace ('An intent proposed or an issue moved by any client (the command line, MCP from a Claude Code session, another tab) reaches an open /ui/idd without a reload'), recorded as evidence: command until its case exists; I3220 serves it and moves from milestone everything-is-followed-in-one-stream, which no intent owns, into milestone every-surface-follows-what-changed. I3220 gains an acceptance criterion switching the criterion to evidence: test, ref case_the_workspace_follows_every_client, in the change that adds the case. I3220 still needs I2981's crate::change and I2783, which are branch-only, so plan.rs cannot name them in depends_on (unknown_dependency); an entry criterion holds the start until they are on master and their ids join depends_on in the change that records them. Until then the coordinator must not hand I3220 out, because the derived plan shows it READY."
  - id: observatory-socket-already-in-pr-1178
    class: unnecessary_work
    subject: "I3219"
    finding: "PR #1178 (feature/the-observatory-hears-executions-as-they-happen, 9b4ebffd540) is OPEN and CONFLICTING. It already adds share/ui/observatory-stream.js: the Observatory's read-only client of WS /events, with snapshot plus dense-sequence deltas, gap/stream.lagged resync, 2.5-heartbeat retirement, jittered backoff and the words LIVE/RECONNECTING/STALE, tested by case 3046. Its body names the journal follow as the next leaf, 'OB.4'. I3219 ignores it. It plans a second client for the same page ('share/cockpit/socket.js, byte-copied to share/ui per I2983'), and its overlaps list I2679, I2985 and I2983 but not #1178. Starting I3219 now would put two socket clients and two status machines in one page. First decide #1178: land it, or close it in favour of socket.js. Then write I3219 as OB.4 on top of that decision."
    blocking: true
    resolution:
      state: planned
      issue: I3219
      because: "Confirmed with gh: #1178 is OPEN and CONFLICTING, last updated 2026-10-15, one commit 9b4ebffd540. Its body says 'Untouched: the journal follow (OB.4, after #1159)'. Decision: #1178 is kept, not replaced. Its observatory-stream.js already implements ADR 0158 point 11's word set and reconnect contract and has a proof (case 3046), while socket.js is the Cockpit's client. I3219 becomes OB.4 on top of it. Its first step brings #1178 current by merging master into its branch (never force-push, following 'reviving abandoned work keeps its bytes'), after asking the PR's session if one is live on the board or in ListAgents, and hands the green head to the landing seat. The journal topic then extends observatory-stream.js, and socket.js is not loaded on /ui/observatory. The amendment to ui-07 adds this order, an acceptance criterion of one socket client and one status machine per page, and #1178 named in why. If #1178 cannot land, it is closed with a comment naming I3219 and its file is ported byte-identical."
  - id: journal-follow-topic-is-unowned
    class: insufficient_work
    subject: "I3219"
    finding: "I3219 says the Observatory follows the journal 'through /events?follow= (the channel I2981 adds)'. I2981 only adds follow=blackboard. On the newest 5a branch (feature/the-peers-screen-follows-the-blackboard), apps/majordomus-cli/src/http/follow.rs:188 refuses every follow value except blackboard, and it carries blackboard.snapshot and monitor.stream signals, not observatory.events marks. ADR 0158 point 11 (.ai/repo/adrs/0158-...md:127-140) requires server-side work: the journal tells subscribers what it appended, the subscription carries the client's logical clock, the server subscribes first, then replays retained events, then goes live, and an expired clock is answered as observatory.events answers it. I3219's scope is share/ui/*.js, ui/observatory.rs and docs only, with no http/follow.rs, http/events.rs or mesh/journal.rs. Nobody owns the server-side journal topic, so the criterion cannot be made true by the planned work."
    blocking: true
    resolution:
      state: planned
      issue: I3219
      because: "Confirmed against ADR 0158 lines 128-140 on master. I3219 now owns the server-side journal topic. Its scope gains apps/majordomus-cli/src/mesh/journal.rs (subscribers told of every append, own and replicated), apps/majordomus-cli/src/http/events.rs (the journal named as a topic of the request target, with the client's logical clock) and test/cases. Its acceptance gains the order point 11 decides: subscribe first, replay what is retained after the clock, then go live. An expired clock is answered as observatory.events answers it, and stream.lagged triggers a re-read. All of these paths exist on master, so the topic no longer depends on 5a's branch-only follow.rs. If I2981 lands before I3219 starts, the topic is added as a follow value of follow.rs rather than a second mechanism. The issue runs scripts/collision-check against 5a's branches before it starts, keeping the invariant of one /events channel."
  - id: liveness-words-contradict-adr-0158-and-in-flight-clients
    class: regression_risk
    subject: "every-surface-follows-what-changed#one-live-word"
    finding: "The criterion fixes the vocabulary as live, resynced, refreshing, snapshot, disconnected. Four other vocabularies already exist or are in flight, and none of them agree with it or with each other. (1) ADR 0158 point 11 (line 141-145) decides LIVE / RECONNECTING / STALE on a server, with SNAPSHOT and REPLAY on the public site. (2) PR #1178's observatory-stream.js uses LIVE / RECONNECTING / STALE. (3) I2983's share/ui/live.js (branch fa1571ff0a7) uses connecting / live / reconnecting / offline. (4) master's share/ui/observatory.js:720 uses REPLAY / SNAPSHOT / RESYNCED / LIVE / STALE. The plan also contradicts itself: I3219's acceptance says 'The public replay still says REPLAY', but REPLAY is not in one-live-word's list. Before I3221 builds anything, reconcile the word list with ADR 0158 (amend it or adopt it) and with live.js, which is already the shared JS component for /ui screens."
    blocking: true
    resolution:
      state: planned
      issue: I3221
      because: "ADR 0158 point 11 is accepted, and #1178 already implements it, so the plan adopts its words rather than the criterion's own list. On a server the words are LIVE, RECONNECTING and STALE. On the published site they are SNAPSHOT and REPLAY. ADR 0158's fallback ('its status says it is reading rather than being told') names no word, so I3221 records one, POLLING, for a page that reads by cursor or timer, in an amendment to ADR 0158 made in the same change. Master's RESYNCED becomes a transient note rather than a status word. live.js's connecting/live/reconnecting/offline are mapped onto these words when I2983 lands. The amendment to ui-09 adds this vocabulary as an acceptance criterion and the ADR to its scope, and it makes I3219's 'REPLAY' consistent. The intent criterion one-live-word is re-recorded in the plan with this list: LIVE, RECONNECTING, STALE or POLLING on a server, SNAPSHOT or REPLAY on the published site, through one browser-side mapping; I3221's title and objective say the same. I3221 already depends on I3219, so the word list is settled before anything is built."
  - id: one-kit-component-is-server-side-but-the-word-changes-in-js
    class: unproven_assumption
    subject: "I3221"
    finding: "I3221 puts the component in apps/majordomus-cli/src/ui/view.rs ('view::liveness') and plans its proof as `cargo test --lib ui::view`. Three problems. (1) view.rs renders on the server (its header says charts are 'drawn here as SVG, on the server'), while the word has to change in the browser when a socket closes: observatory.js:720, live.js and socket.js's state callback. (2) /cockpit/monitor is rendered by the Cockpit's own separate kit, apps/majordomus-cli/src/cockpit/view.rs (semantic mj-* classes, Alpine CSP), not ui::view. So 'one kit component' across /ui and /cockpit is two kits plus three scripts. (3) A ui::view unit test cannot prove 'No surface prints LIVE while its socket is closed'. Only the browser case case_one_word_for_liveness can. Name the shared JS module as the component, make the browser case the criterion's proof, and give the Cockpit its own rendering of the same words."
    blocking: false
    resolution:
      state: planned
      issue: I3221
      because: "Accepted. The component is the browser-side state-to-word mapping, shared by the scripts of every listed surface. view::liveness renders only the server's first-paint word and markup, and apps/majordomus-cli/src/cockpit/view.rs (added to scope) renders the same words in the Cockpit kit. The proof is the browser case case_one_word_for_liveness, and cargo test --lib ui::view covers only the server markup. The amendment to ui-09 adds these acceptance criteria and the Cockpit kit to scope."
  - id: execution-cursor-cannot-be-folded-from-per-execution-sequenc
    class: unproven_assumption
    subject: "I3218"
    finding: "I3218 plans 'the store's per-execution sequence folded into the monitor cursor'. The store has no store-wide position to fold. Sequences are dense per execution (execution/event.rs:28). The store keeps up to 200 executions with random ids and evicts the oldest (execution/store.rs:53,636). It lives only in server memory, so a restart erases it (execution/mod.rs:37-40). docs/MONITOR.md:135 says as much: 'nothing joins them into one feed'. A cursor of per-execution positions would grow with the number of executions, and nothing keeps it from replaying or skipping after an eviction or a restart. The source needs a store-wide publish counter plus the server epoch (as follow.rs's epoch does), or a time position like the github part. That has to be decided before the cursor contract is written. The acceptance also names source states 'unread', 'empty' and 'observed' that MonitorSourceHealth (monitor/mod.rs:164-173: ok, absent, error, skipped) does not have. MONITOR.md's rule for the executor is the opposite: nothing recorded is `absent`. Pick one vocabulary."
    blocking: true
    resolution:
      state: planned
      issue: I3218
      because: "Confirmed: execution/event.rs documents per-execution dense sequences, and MonitorSourceHealth on master is ok/absent/error/skipped. Decision: the executions part of the cursor is a store-wide publish counter in apps/majordomus-cli/src/execution/store.rs (added to scope) paired with the server's epoch. A cursor whose epoch is not the server's, or whose counter is older than the oldest retained event, is answered the way the other sources answer an expired cursor: the caller reads afresh and nothing is replayed or skipped in silence. The vocabulary is MonitorSourceHealth's. A process with no executions reports executions as `absent` with a reason, as docs/MONITOR.md does for the executor. The desired_state's 'unread/empty/observed' and the third acceptance criterion's 'observed and empty' are superseded by an added acceptance criterion that states this, since amendments are additive."
  - id: executions-reach-the-pushed-monitor-only-if-follow-and-chang
    class: insufficient_work
    subject: "I3218"
    finding: "I3218 is scoped to apps/majordomus-cli/src/monitor, docs/MONITOR.md and test/cases. The reads are assembled elsewhere, in capability/builtin/monitor.rs:126-200, where ctx.executions (capability/handler.rs:177) would be read. On 5a's branch, /cockpit/monitor and the blackboard signals are pushed by http/follow.rs. That file whitelists sources to mesh, executor and github (line 188), and when sources is not given it defaults to 'mesh and executor'. It re-reads only when crate::change says the board or journal changed. Unless an execution publish advances a change generation and follow.rs accepts and defaults to the new source, execution signals reach /cockpit/monitor only on the follower's timeout read. That is not 'followed everywhere'. The issue also names I2981 and I2982 under overlaps rather than dependencies, and it edits files 5a owns on a branch that has not landed."
    blocking: false
    resolution:
      state: planned
      issue: I3218
      because: "Scope gains apps/majordomus-cli/src/capability/builtin/monitor.rs and apps/majordomus-cli/src/capability/handler.rs, where the read is assembled. The CLI and pull half (majordomus monitor, monitor.read) is deliverable on master now. The pushed half is an added acceptance criterion: when I2981's follow.rs and crate::change are on master, an execution publish advances the change generation, and follow.rs accepts `executions` as a source and includes it by default. That half is written onto 5a's landed files, not onto the unlanded branch. I2981 cannot be a depends_on until it is recorded on master (plan.rs refuses an unknown_dependency), so why records this explicitly."
  - id: branch-dependencies-are-prose-so-plan-next-hands-them-out-no
    class: delivery_verification
    subject: "every-surface-follows-what-changed"
    finding: "The why of I3219, I3221 and I3222 says 'It waits on in-flight work not yet on master: I2981/I2983'. Yet depends_on is [] for I3218, I3219 and I3222, and for I3221 it holds only I3219. The I2980-I2999 records are not on master (no I298x.yaml under .ai/repo/project/issues on master or in the worktree), so they cannot be named as dependencies. As a result, plan next and plan waves will report I3219 and I3222 as READY at 707a04c7ce8, while the channel they build on (follow.rs, crate::change, share/ui/socket.js) exists only on 5a's unpushed branches, and those have changes_requested reviews (r-be1a4401fe22, r-1ecd125e3db6). Either land or record I2981-I2983 first and depend on them, or mark these issues blocked with a reason the plan reads."
    blocking: true
    resolution:
      state: planned
      issue: I3219
      because: "Confirmed: there is no I298x.yaml on master, and plan.rs refuses an unknown_dependency, so the branch work cannot be named. The plan model has no blocked-with-reason field, because status derives from depends_on. The fix removes the wait instead of hiding it. With the amendments for journal-follow-topic-is-unowned and observatory-socket-already-in-pr-1178, I3219 builds on master's http/events.rs, mesh/journal.rs and #1178's observatory-stream.js, so READY is true for it. I3218's CLI half needs nothing branch-only, and its pushed half is a conditional criterion. I3221 depends on I3219, and the live.js mapping applies only when I2983 lands. I3222 gains depends_on I3218 and I3219, so it is BLOCKED until the streams it judges exist on master, and the blackboard stream joins its case when I2981 lands. The only issue still waiting on branch work is I3220, which is not in this bundle (see workspace-push-is-unbound). It gets depends_on I2981 and I2783 in the change that records them, and the coordinator holds it until then. Applied in the plan of 2026-10-18: I3219 no longer names I2981 and I3221 no longer names I2983 in depends_on, so no prose wait is added to their why; I3222 depends on I3218 and I3219 only."
  - id: criteria-cite-the-intent-instead-of-a-test
    class: delivery_verification
    subject: "every-surface-follows-what-changed"
    finding: "Every criterion has evidence: command and ref: 'majordomus intent explain every-surface-follows-what-changed', which is the intent explaining itself. The real proofs are left as '(to be written)', '3011_* extended or a new case' and '35xx_...'. Master intents use evidence: test with a named case or test file (17 of 18 criteria). The one command criterion on master (intent-lifecycle#model-is-gated) runs the very command it is about. Give each criterion the evidence_required case its issue already names: case_an_execution_reaches_the_monitor, case_the_observatory_is_told, case_one_word_for_liveness, case_a_follower_converges_after_loss. Otherwise satisfaction is never decided by a test."
    blocking: false
    resolution:
      state: planned
      issue: I3218
      because: "Accepted for all four criteria. The criterion records are switched to evidence: test with the case each issue's evidence_required names (plus case_the_workspace_follows_every_client for the new criterion from workspace-push-is-unbound). Each switch is made in the same change that adds its case file, so a ref never points at a file that does not exist. Each of I3218, I3219, I3221 and I3222 gains an acceptance criterion requiring the switch for the criterion it serves."
  - id: chaos-case-needs-a-fault-injector-and-overlaps-existing-case
    class: insufficient_work
    subject: "I3222"
    finding: "I3222 says 'no feature is added', yet it must drop, delay and reorder frames on a TCP WebSocket and partition a mesh peer. Nothing in test/, scripts/ or apps/majordomus-cli/tests provides fault injection: a grep for chaos, fault inject or proxy finds nothing. So a frame-level proxy or a client-side fault hook is unplanned work. The follower being judged is browser JS (socket.js, live.js, observatory-stream.js), but the scope is test/cases and Rust tests only. The acceptance 'equal to a fresh snapshot or a resync frame' is weaker than the criterion: a resync frame alone proves no equality. The restart and epoch parts overlap case 3046 (PR #1178: stop the server, it goes STALE, restart, it converges) and 5a's cases 3381 and 3382 (stream.resync, epoch). Name the injector, the followers it drives, and what is new beyond those cases."
    blocking: false
    resolution:
      state: planned
      issue: I3222
      because: "Accepted. The injector is test-only: a frame-level WebSocket proxy between the follower and majordomus serve, added under apps/majordomus-cli/tests with its helper in test/lib.sh. It drops, delays and reorders frames, and the protocol is not changed. The followers it drives are the scripts' pure reducers run without a browser (as case 3046 runs observatory-stream.js) and share/cockpit/socket.js. Equality is always state against a fresh snapshot, never just receiving a resync frame. What is new beyond 3046, 3381 and 3382 is reordering, delay, peer partition, and equality across every follow stream. Stopping and restarting the server stays with those cases and is not repeated. The amendment to ui-10 adds these to scope and acceptance."
  - id: surfaces-left-polling-without-saying-so
    class: surface_missing
    subject: "every-surface-follows-what-changed"
    finding: "Several surfaces are left uncovered. (1) The source conversation (c294#7) names 'monitor --follow polls'. docs/MONITOR.md still says --follow 'asks again every --interval seconds', and no issue makes the CLI follow /events or say that it polls. (2) The owner's acceptance message (c294#3) asks for push 'do /ui, /cockpit, events, hooks' and for push notifications. Hooks get no criterion. Push notifications are a non_goal, a deferral the owner's words do not grant. (3) Every other /ui screen keeps ui.js's 60 s refresh (share/ui/ui.js:222) and is covered only by I3221's wording. (4) When I3219 lands, ADR 0158's 'Not delivered: a pushed stream' (line 169-171) and site/content/features/observatory.md must change in the same change, and no issue's scope names the ADR. Also, ADR 0133:28,48 already lists executions as a monitor source while docs/MONITOR.md:135 says they are not, so I3218 should reconcile the two."
    blocking: false
    resolution:
      state: open
      because: "Parts 1, 3 and 4 are carried by amendments. I3218: monitor --follow names itself as polling, with its interval, in text and JSON until a follow of /events serves it, and docs/MONITOR.md and ADR 0133 are reconciled on executions. I3221: every /ui screen still on ui.js's 60 s refresh says POLLING. I3219: ADR 0158's 'Not delivered: a pushed stream' and site/content/features/observatory.md change in the same change. Part 2 stays open for the owner. The non_goal deferring push notifications 'before the channel is proven' is the plan author's sequencing, not something the owner granted, and what 'hooks' means in c294#3 (Claude Code hooks as clients, which I3220's any-client frame would cover, or hooks as a delivery target) needs the owner's reading. The finding is non-blocking, so leaving this part open does not refuse work on the intent."
