  - "Which runner validate itself runs on (I4242, MJ_RUNNER)"
  - "Exporting the queue time of a cancelled run by other means: the traces of the runs that completed still show the queue those runs waited in"
  - "The export itself, its action pin and its secrets (I3934)"
acceptance_criteria:
