id: I3268
milestone: the-plan-says-what-a-fix-unblocks
title: "The published plan has an impact page whose graph and sortable table agree and name the commit they were read at"
slug: the-impact-page-is-published
priority: p2
profile: implementation
objective: "Generate /plan/impact/ on the site from plan.impact over every issue: a sortable, filterable table (id, milestone, wave, status, immediate unlocks, transitive reach, remaining blockers) and the graph via site/graph.js; row and node select each other; a no-JS table is the fallback."
why: "Owner order 2026-10-17 for an interactive per-issue graph and an aggregated table ranked by impact. Proposed in ADR 0195 (What accepting an issue unblocks is answered by one counterfactual evaluator over the plan graph) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c284#5."
current_state: "site/graph.js and diagrams.js draw graphs; no page ranks issues by unlock."
desired_state: "The page is generated by derive; its numbers carry the source commit and graph fingerprint."
scope:
  - "site/graph.js"
  - "site/data/generated/plan.json"
  - "apps/majordomus-cli/src/generate.rs"
  - "scripts/generate-site-data"
  - "lib/plan_json.awk"
  - "site/templates/plan-section.html"
  - "site/templates/dag.html"
depends_on:
  - "I3267"
acceptance_criteria:
  - "The table and graph name the same commit and fingerprint as plan.impact on the CLI"
  - "A new issue appears with no edit but its record"
validation:
  - "scripts/derive-check"
  - "majordomus plan validate"
evidence_required:
  - "case_the_impact_page_agrees_with_the_cli"
created_at: 2026-10-18
updated_at: 2026-10-18
