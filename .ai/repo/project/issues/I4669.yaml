id: I4669
milestone: M002
title: "An owner's answer is a typed, committed record with its provenance, so a session that receives it relayed cites it by id and a validator proves where it came from"
slug: an-owner-answer-carries-its-provenance
priority: p1
profile: implementation
parallel_safe: true
objective: "An owner-answer record kind (majordomus.owner-answer/v1, data-declared in share/kinds.yaml, so the registry validates it and serves it as majordomus://owner-answer/<id> over MCP and HTTP) holds one question put to the repository's owner and the answer, under .ai/repo/answers/<id>.yaml. Its fields are the id, the channel, the provider, the asking session with where that came from, both times, the question, the options and the answer verbatim (as JSON strings, so no byte is folded away), how the text was obtained (text_source: transcript-checked, provider-payload or typed), the transcript locator and the sha256 of its raw lines, sha256 digests of the question and of the answer, an optional translation that never replaces the verbatim text, what it settles, what it supersedes, and the recording session, time and identity, computed. `majordomus question record` writes it, reading the question, options, session and times from the provider transcript when --transcript is given and checking the answer against the result; `question answers` and `question answer <id>` read it back; `question resolve --owner-answer <id>` closes a blocking question with it. A baseline rule (majordomus.owner-answers-are-recorded) and its validator, run by check, doctor and watch, recompute both digests, refuse a label that was not offered, and report every owner-answer:<id> cited under .ai/repo/ that names no record."
why: "Observed on 2026-11-21 and 2026-11-22 during a long run with many sessions in an adopter repository. The lead session asked the owner through its provider's question tool and passed the verbatim answer to a subagent. The subagent wrote the answer into a rule file and a decision. The provider's harness flagged the subagent twice for possible instruction poisoning, because the text it acted on arrived in a message from another agent and nothing in any record proved that the owner had said it. The same gap is in this repository's own plan. I4665's current_state retypes an owner's answer by hand, with the asking session's id, the question and the answer in prose, and the note that a coordinator relayed it. No reader can check that prose, and the next record that needs the answer has to retype it again."
current_state: "Measured at origin/master 46775282570 on 2026-11-25. lib/question.sh keeps open questions as single lines of .ai/local/state/open-questions.md and lib/decision.sh appends free text to .ai/local/state/decisions.md: both are local and never committed. Owner answers reach git only as prose retyped into curated knowledge (PR #3103, #3121) or issue fields (I4665), which no validator reads. On 2026-11-25 a relay of three owner answers between sessions of an adopter repository said two English questions had been translated and changed a double space in free text to a single one; the provider transcript showed both. The branch feature/I4669-an-owner-answer-carries-its-provenance delivers the kind, the writer, the readers, the rule and the validator, from a design reviewed in two rounds (codex and an independent reviewer; gemini and the API advisors refused authentication), whose positions are in its pull request. ADR acceptance as one command (adr accept --answer <id>) is planned by another session on top of this record and stores no answer of its own."
desired_state: "A session that acts on an owner's answer cites owner-answer:<id>; `question answer` and the validator show from committed records who asked, through which channel, when, what the owner said byte for byte and how strong that provenance is. Retyping the answer is unnecessary, and an edit or paraphrase of a record after the fact is reported."
