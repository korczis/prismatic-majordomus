non_scope:
  - "Not the `carries_master` relation, the freshness gate that passes it or the relation cache's vocabulary version: that is I2298 / ADR 0129, session p5's, unlanded on feature/the-refresh-pipeline-is-a-train. I2326 starts only after it lands."
  - "Not composing several pull requests into one batch pull request: that is ADR 0114 `prs compose`, proposed on origin/feature/a-batch-is-composed-and-names-its-members."
  - "Not rebase or squash, and no choice of merge method: the merge commit is a decision of ADR 0101 (mod.rs:326-337, docs/INTEGRATION.md:174), because the derived-file driver resolves merges."
  - "Not the run's identity, its budget or its five typed ends: milestone a-drain-is-a-durable-run (I2320-I2324). This milestone gives the predicate those ends read."
  - "Not starting a worker, its permissions or its claim: milestone repair-is-dispatched-to-a-worker (I2334-I2340)."
  - "Not the scheduled workflow: `.ai/repo/ci/queue.yaml` keeps running `prs refresh && prs status` and never a drain or `cleanup --apply`, as case 350 asserts."
  - "Not reopening a record pull request no run was started for: I2296 on origin/fix/the-executor-reopens-a-record-pull-request."
  - "Not the disposition of stale worktrees: pull request #882 (feature/every-worktree-has-a-disposition, ADR 0127)."
  - "Not timing the refresh, the percentile throughput or the rollout record of stages two to four: I2312, I2313 and I2314 of milestone the-delivery-baseline-is-recorded."
  - "Not acknowledging an unverified merge for itself, and never `--admin`: owner decision D7 and ADR 0101 stand under every profile."
acceptance_criteria:
  - "A drain asked to settle ends by itself only when every pull request of its observation is merged, closed under the policy or reported blocked with its reason codes and the trail events of the steps tried on it"
  - "A stale, unreadable or truncated observation is never settled: the drain ends saying what could not be read, with a non-zero exit"
  - "With a declared depth, two stacked pull requests land in two steps with no refresh between and one run of the required check each; with no depth declared the pipeline is one deep as before"
  - "A cancelled required check and one that failed inside a release window are not in the repair lane, and neither ever makes a pull request ready"
  - "With no authority profile the settling drain closes nothing and records no repair, and `prs cleanup`, `prs repair` and `prs drain` behave as before"
  - "Simulated queues of twenty and of fifty pull requests settle with each pull request merged at most once and every merge on a head that held the master of that moment with its required check passed"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib integration::"
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --test integration_settle"
  - "MJ_TEST_JOBS=4 bash test/run.sh 350_the_queue_measures_itself 720_integration_follows_the_current_master 850_integration_drains_cycle_by_cycle"
  - "scripts/derive-check"
evidence_required:
  - "settle_predicate_proved"
  - "train_built_to_declared_depth"
  - "red_check_classified"
  - "large_queue_settled"
depends_on: []
risks:
  - "A settle loop that composes refresh, cleanup and repair in one command removes the separate approvals `.ai/repo/ci/queue.yaml` and case 350 keep on purpose. Closing and recording a repair are therefore tied to a grant of the authority profile, and the scheduled workflow is not changed."
  - "Pull requests #828 and #859 and the unlanded branches of I2296 and I2298 all edit drain.rs, forge.rs or tests.rs. Work here collides with them until they land; the issues are marked not parallel-safe for that reason."
  - "Session p5 holds an owner mandate to automate the refresh of `needs_refresh` pull requests and to triage `needs_repair`, and another session runs a hand train over `refs/prep/*`. Each issue here is announced on the peer board before it is started."
  - "The release-window class of I2328 rests on five failures read from run logs on 2026-10-10. If the window cannot be decided from git and the run's own times, that class is dropped and said so, rather than guessed from a title or an age."
  - "A link of a train whose lower link is closed without a merge holds that pull request's commits and stays blocked for a person (ADR 0129 decision 5); a deep train makes one such closure cost more."
created_at: 2026-10-10
