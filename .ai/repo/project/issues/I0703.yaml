id: I0703
milestone: M002
title: Implement the decision and prove it holds
slug: implement-attribution
priority: p1
profile: debugging
parallel_safe: false
objective: "Implement whatever I0702 decided across every command that writes a durable record, and turn the characterisation case into one that asserts the new behaviour."
why: "A defect is fixed when the case that reproduced it goes from describing the gap to describing the guarantee. Anything less leaves the next worker unable to tell which of the two the code is in."
current_state: "Implemented and on master. ADR 0164 was accepted on 2026-10-22 with the amendment that a task is related unless another episode that is still open opened it, and the implementation landed through train 5 (b0e33db797d, fixed in d078fb2309e) and is carried by master 2efeacea031. lib/common.sh prepares attribution once in mj_record_attribution: mj_open_session_id names the caller's own episode, an explicit identity with no open episode names none, and with no identity it names the one open episode or none, never the pointer's guess; mj_task_opening_session and mj_session_is_open relate the active task unless a different live episode opened it. Every writer uses it and passes the prepared session to mj_ledger_append: decision add (lib/decision.sh), question add and resolve (lib/question.sh), checkpoint (lib/checkpoint.sh), check --checkpoint (lib/check.sh), handover (lib/handover.sh), knowledge observe (lib/knowledge.sh) and derive (lib/derive.sh). Case 3049 asserts the guarantee: I0701's zero-episode example, two real episodes under one $USER, the caller's own task, an unknown explicit identity and anonymous calls; cases 111, 61 and 388 prove the per-provider episode and a task carried across episodes and providers. ADR 0164 refuses nothing and share/doctrines.yaml no longer exists (rules carry x-majordomus validators), so the refusal and doctrine criteria have nothing to cover. Running the suite from inside an agent exposed one defect left over: case 61 failed because test/run.sh let the host's CLAUDE_CODE_SESSION_ID through, which ADR 0164 reads as a supplied identity with no episode; test/run.sh now drops the provider session variables the lifecycle adapters declare."
desired_state: "Every command that writes a durable record follows the decision, the case asserts the new behaviour, and a refusal — if that is what was chosen — names the rule that refused and what to run instead."
scope:
  - lib
  - share
  - test/cases
non_scope:
  - Any behaviour the decision did not choose
depends_on:
  - I0702
acceptance_criteria:
  - Every command that writes a durable record is covered, not only decision
  - The case from I0701 asserts the guarantee rather than the gap
  - A refusal names the rule and the command that resolves it
  - If the rule is enforced, it is declared in share/doctrines.yaml and doctor proves it reaches its command
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
  - doctor
risk: "Three commands share this resolution path; fixing one and not the others leaves a defect that looks fixed, which is worse than one that looks broken."
