depends_on: []
risks:
  - "Composing the delta from HEAD into committed data makes every commit stale, the defect compose_published was written to remove; the delta is computed at build time from the deployed commit into git-ignored build data, as site/data/build.json already is."
  - "A prose check that matches words can over-refuse or be evaded by a synonym; it decides only the words it declares and the names of non-stable features, and it must not become a second claim-proof-check."
  - "Two more widths and a reduced-motion pass lengthen the site-probe and ui-audit jobs, which have already outgrown their bounds once (.ai/repo/ci/gates.yaml:527-535); the cost is measured before the widths are declared."
  - "Retiring `featured` removes `product list --featured`, a public-surface movement `release analyze` counts, so the pull request carries the version movement the analysis names."
