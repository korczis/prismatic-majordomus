  - The finish contract
acceptance_criteria:
  - "Every criterion carries its evaluation on every surface"
  - "An optional criterion does not hold the verdict back"
  - "A failing guard makes the verdict unsatisfied, and one not judged violates nothing"
validation:
  - majordomus intent validate
  - cargo test --test intent_satisfaction
  - bash test/run.sh 965_a_failing_guard_keeps_an_intent_unsatisfied
evidence_required: []
depends_on: []
risks:
  - "IntentView is read by the binding, the opposition, the Cockpit and the realization; a changed field shape breaks every reader at once, so new facts are added beside what exists."
  - "The records, the ADR and the tests they name land in one pull request and one commit to the trunk."
  - "Every changed line owes an in-process test (project.new-code-is-covered)."
