  - "bash test/run.sh <n>_every_component_and_module_is_driven (n from scripts/case-numbers next)"
  - "scripts/interaction-probe"
  - "majordomus plan validate"
evidence_required:
  - "kit_gate_case"
  - "published_copy_probe"
