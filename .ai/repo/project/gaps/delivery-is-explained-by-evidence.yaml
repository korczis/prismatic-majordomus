intent: delivery-is-explained-by-evidence
observed_at: 4dfd1856d2
recorded_by: "claude-code (session b24c5456, planning worktree; six read-only audit agents over master 4dfd1856d2)"
recorded_at: 2026-10-10
observations:
  - id: derive-runs-every-stage
    statement: scripts/derive runs stages A, B, C and D in sequence on every call with no skip and no cache, and prints whole seconds per stage to stderr without writing them, the host or the load to any record
    source: file:scripts/derive
  - id: validate-runs-as-measured
    statement: Of the 120 newest validate runs on 2026-10-10, 116 had completed (39 success, 48 failure, 29 cancelled), 9 had needed a second attempt, and the 32 first-attempt successes took 5423 s at the median and 8290 s at the ninety-fifth percentile
    source: command:gh run list --workflow validate.yml --limit 120
  - id: open-to-merge-as-measured
    statement: The 150 pull requests merged between 2026-09-26 and 2026-10-10 took 17.8 h from opening to merge at the median and 98.2 h at the ninety-fifth percentile
    source: command:gh pr list --state merged --limit 150
  - id: throughput-is-medians
    statement: integration/metrics.rs folds merges per day and the medians of actionable-to-merged, CI rounds per merge and cycle from the trail, and holds no ninety-fifth percentile and no count of the times a person had to act
    source: file:apps/majordomus-cli/src/integration/metrics.rs
  - id: delivery-evidence-is-a-constant-unknown
    statement: The delivery report answers its three evidence dimensions with a constant unknown whose stated reason is that the evidence model lands with pull request 577, and no file under src/delivery reads a ledger
    source: file:apps/majordomus-cli/src/delivery/mod.rs
  - id: execution-duration-is-in-memory
    statement: An execution carries its created, started and finished times and a duration in milliseconds, and docs/EXECUTIONS.md states that it does not outlive the process that accepted it
    source: file:apps/majordomus-cli/src/execution/model.rs
  - id: ledger-reads-one-version
    statement: The evidence ledger reads version 1 and refuses any other, and saving it is one write of the whole file with no lock and no rename
    source: file:apps/majordomus-cli/src/evidence/ledger.rs
  - id: manifest-lists-outputs-only
    statement: The manifest docs/generated/artifacts.json gives every generated artifact its path, format, a prose source, its size and its sha256, and names no input of any artifact as data
    source: file:apps/majordomus-cli/src/generate.rs
  - id: one-fingerprint-for-every-input
    statement: scripts/generate-site-data hashes its whole canonical input list into the one source_hash it writes to source.json, and that single value is what the fast currency check compares
    source: file:scripts/generate-site-data
  - id: budgets-name-no-derive
    statement: .ai/repo/ci/suite.yaml budgets the summed and the slowest case seconds and .ai/repo/ci/pages.yaml the warm and cold publication, and neither file sets a budget for a derive
    source: file:.ai/repo/ci/suite.yaml
  - id: a-skip-leaves-a-fourteen-day-artifact
    statement: Which gates a run skipped and why is in plan.json, which the workflow uploads as the artifact ci-plan with a retention of 14 days, and in the run's step summary
    source: file:.github/workflows/validate.yml
  - id: verdict-is-red-on-a-skipped-gate
    statement: scripts/ci/verdict is red when planning did not succeed, the plan selected nothing, or the job of a selected gate reported anything but success, and it is decided from the plan and the needs context of one run without reading a commit id
    source: file:scripts/ci/verdict
  - id: protection-as-measured
    statement: On 2026-10-10 the protection of master required the status check ci from app 15368, with strict false, enforce_admins false and no required review
    source: command:gh api repos/korczis/prismatic-majordomus/branches/master/protection
  - id: a-foreign-merge-leaves-no-line
    statement: Pull request 901 was merged on 2026-10-10 at 17:25Z, and the integration trail read seven minutes later holds no event that names it
    source: command:majordomus prs events
  - id: done-asks-four-questions
    statement: gates/done.rs asks integrated, published, deployed and deployment-verified as separate questions, and share/obligations.yaml establishes target and pages while it marks deploy and verify as established by none
    source: file:share/obligations.yaml
  - id: release-is-six-hand-steps
    statement: docs/DISTRIBUTION.md gives a release as six numbered steps a person runs in a shell, from release bump and the tag to merging the record and confirming the site
    source: file:docs/DISTRIBUTION.md
  - id: overview-asks-no-delivery
    statement: dashboard.overview states that it asks no delivery report, release analysis or evidence judgement, a test refuses those sources for it, and no card carries when its fact was observed
    source: file:apps/majordomus-cli/src/capability/builtin/dashboard.rs
  - id: event-channel-carries-executions
    statement: The WebSocket at /events subscribes to the execution store alone and reports what this process's executions are doing, and carries no event of the integration trail
    source: file:apps/majordomus-cli/src/http/events.rs
  - id: one-execution-on-five-surfaces
    statement: Case 100 proves that one execution reads identically over HTTP, the WebSocket, the snapshot, the Cockpit page and the command line, and its subject is an execution, not the queue, a verdict or a release
    source: test:test/cases/100_execution_plane.sh
  - id: release-smoke-stops-at-init
    statement: The smoke job of the release workflow installs the published release, checks the version it reports and runs majordomus init in an empty repository, and ends there without starting or finishing a task
    source: file:.github/workflows/release.yml
