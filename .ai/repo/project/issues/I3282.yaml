id: I3282
milestone: a-promoted-record-opens-its-message
title: "A workspace reference resolves to its message where the store holds it, and says 'not held here' where it does not"
slug: a-workspace-reference-resolves-locally
priority: p2
profile: implementation
objective: "Resolve a workspace: reference through the one continuity-shaped workspaces capability (I1308) to the stored message, returning resolved, not-held-here or gone-upstream (tombstone), never failing a check because the store is absent."
why: "Drill-back is only useful if the reference opens something, and only safe if a checkout without the store stays green. Critique 2026-10-18: admits_remote admits every Effect::Read beyond loopback and the server can bind non-loopback addresses, so a resolve that returns message text must be local-only by policy, not by deployment. Proposed in ADR 0211 (A record promoted from a workspace cites the message it came from by a typed reference that validates in every checkout and resolves only where the store is held) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c267#0."
current_state: "No workspaces capability exists (I1308 open)."
desired_state: "Resolution is an operation of I1308's one workspaces capability: a loopback caller gets the three states on CLI, HTTP and MCP from the registry, a caller beyond loopback gets 403 or the reference without text, and doctor counts unresolved references as information."
scope:
  - "apps/majordomus-cli/src/capability/builtin"
  - "test/cases"
  - "apps/majordomus-cli/src/capability/model.rs"
  - "apps/majordomus-cli/src/http"
non_scope:
  - "A second workspace capability beside I1308's"
depends_on:
  - "I3281"
  - "I1308"
serves:
  - "what-a-workspace-decides-reaches-the-repository-with-its-source#a-reference-opens-its-message"
acceptance_criteria:
  - "With the store present a reference returns the message's role, time and text to the local caller"
  - "Without it the answer is not-held-here and every gate stays green"
  - "A tombstoned message answers gone-upstream with the date it was seen last"
  - "Resolution is an operation of I1308's single workspaces capability, not a separate capability"
  - "The resolving read carries a local-only policy that ExecutionPolicy::admits_remote refuses"
  - "A request arriving beyond loopback receives 403 or the reference without role, time or text; a loopback request receives the text"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test remote_callers"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib capability::model"
evidence_required:
  - "case_a_workspace_reference_resolves_locally"
  - "test_a_local_only_read_is_refused_beyond_loopback"
created_at: 2026-10-18
updated_at: 2026-10-18
