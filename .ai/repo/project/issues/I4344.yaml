id: I4344
milestone: development-runtime
title: "A CI runner's home stays under its cap during a job, not only between jobs"
slug: a-runner-home-stays-under-its-cap-during-a-job
priority: p0
profile: implementation
parallel_safe: true
objective: "Bound a self-hosted runner's build directory inside a job, not only around it. The build host policy gives each runner home's build directory a filesystem of its own size, a loop-mounted ext4 image or an XFS project quota the provision creates from the policy's per-home cap, so a job that outgrows it fails with ENOSPC inside its own home while the root filesystem keeps its floor. Around that hard bound: on runner.environment == 'self-hosted', .github/actions/setup-rust runs the build directory bound (mj_rust_bound_build_dir) before cargo and again in a post step; scripts/rust-coverage removes llvm-cov-target on a self-hosted runner once its report is exported; and every job that builds on a self-hosted runner samples its build directory every 30 s and writes the job summary facts `build-dir size` and `build-dir peak`."
why: "Incident 1 of 2026-10-28: lundra's root filesystem reached 100% under the runners' cargo build directories, /home/ghrunner/home-2 and home-3/.cargo/build-shared (74.6 and 39.9 GiB, as measured for I4352), and runners lundra-1..3 went offline during run 40680986818. Three hand-provisioned runner homes each keep an unbounded build directory. I4352 (fix/lundra-provisions-its-runners, not landed) renders the homes and the runner drop-ins and makes disk-guard reclaim a runner build directory over its cap once it is idle; it sets no quota, and a coverage job that fills tens of GiB inside one run never becomes idle. A bound applied before and after cargo is also only a bound between invocations. I3959's bound runs only where lib/rust_bin.sh is the entry, and #2567 never reaches CI."
current_state: "Measured at 81ef931a3e1: .github/actions/setup-rust/action.yml has no step conditioned on a self-hosted runner; scripts/rust-coverage names no llvm-cov-target; apps/majordomus-cli/assets/mesh-cache-provider/policy.json declares no per-home cap and cache_provision.rs creates no per-home filesystem or quota; no job reports the size of its build directory."
desired_state: "A runner home's build directory cannot outgrow its cap during a job: the job fails with ENOSPC in its own home and the root filesystem keeps its floor; around the hard bound a self-hosted job evicts idle units before cargo and after it, a coverage run leaves no llvm-cov-target behind, and each job's summary carries the peak it reached. Enforced by the per-home filesystem the provision creates and the observation (I4343) reports, by case 4344 on action.yml and rust-coverage, by case 3959, and by the `build-dir peak` fact."
