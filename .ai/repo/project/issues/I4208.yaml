id: I4208
milestone: ci-critical-path
title: Case 1024 meets the launcher's closed pipe on every run, so a gate that dies of the write fails it every time
slug: a-closed-pipe-is-met-on-every-run
priority: p2
profile: implementation
parallel_safe: true
serves: []
objective: "scripts/ci/install-check waits MJ_INSTALL_CHECK_SEND_AFTER seconds (unset in every real run) before its step-7 writes to the MCP launcher, and case 1024's broken-launcher run sets it to 1, so the planted launcher that exits at once has always closed the pipe before the gate writes."
why: "Master validate 40146366621 at b62848cb6f5 failed suite-shard (2) on 1024_an_installed_release_serves_a_foreign_repository: the planted launcher exited before the gate wrote initialize, printf hit EPIPE, and set -e ended install-check before its 'did not start a shared server' verdict. Train 6's run passed the same case, because the race fell the other way. 9d's fix (the writes in a guarded subshell, f49a7399498) made the gate survive the closed pipe, but nothing proves it: without the guard the case still passes on any run where the launcher is slower than the write."
current_state: "install-check writes to the launcher as soon as the fifo opens; whether the planted launcher has exited by then is a race, so case 1024 exercises the closed pipe on some runs only."
desired_state: "Case 1024's broken-launcher run waits a second before the writes, the closed pipe is met every run, the gate still names the launcher's failure, and the case fails every run if the write guard is removed."
scope:
  - scripts/ci/install-check
  - test/cases/1024_an_installed_release_serves_a_foreign_repository.sh
  - .ai/repo/project/issues/I4208.yaml
non_scope:
  - "What the gate checks"
  - "The write guard itself, which landed in f49a7399498"
depends_on: []
acceptance_criteria:
  - "Case 1024 passes with the write guard"
  - "With the write guard removed (the writes straight to fd 3), case 1024 fails on every run"
validation:
  - "bash test/run.sh 1024_an_installed_release_serves_a_foreign_repository"
evidence_required:
  - suite
created_at: 2026-10-25
updated_at: 2026-10-25
