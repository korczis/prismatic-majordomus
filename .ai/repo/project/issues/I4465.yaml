id: I4465
milestone: a-bounded-task-is-carried-to-accepted-work
title: "Every enforced rule names the principle it rests on, doctrine show prints it, doctrine status counts the rules that name none, and a rule's class is called its binding level"
slug: doctrine-show-names-the-principle
priority: p2
profile: implementation
parallel_safe: true
objective: "Four changes. First, the loader of lib/doctrine.sh derives each enforced rule's principle instead of reading a field no rule has: the principles are the rules of the effective set tagged `principle` (ten, under share/standard/majordomus/rules/principle-*.v1.md), and a rule's principle is every principle reached through its depends_on, transitively, with the version suffix dropped, comma-joined in the order reached. The awk pass that builds doctrines.N (lib/doctrine.sh:40-61), whose key list at :42 has no principle, records it as doctrines.N.principle, so the existing `principle` line of `doctrine show` (lib/doctrine.sh:301) prints it. A rule that reaches none prints `principle   none — no principle in its depends_on`. Second, `doctrine status` adds one count, `enforced rules naming no principle: <n>`, of the enforced rules whose own depends_on names no principle, and `doctrine status --json` the ids; it is reported, never a refusal. Third, the 13 dispatched rules of the shipped package that name no principle in their depends_on each name, as an exact id@version, the principle they rest on, so README.md:195 and :205-206 ('every enforced rule names the principle it rests on', at :206 'in `depends_on`') become true; the package manifest is rewritten by scripts/rules-package write and the vendored copy by `majordomus rules vendor update`, never by hand. Fourth, a rule's `class` is its binding level (what a violation means: blocking or advisory), and it stops being called an enforcement class: docs/DOCTRINE.md says so where it defines the field and in its section on the two classes, and apps/majordomus-cli/src/graph.rs:734 no longer says 'enforcement class'; how a rule is enforced (its validator, its mode, its proof) stays derived apart, and no schema changes."
why: "Found by the P00 audit on master 51b38035a71 (H4, H5, matrix row Rule -> principle) and in the backward walk from mj_validate_knowledge_integrity: the `principle` line of `doctrine show` is blank for every rule, because the loader never parses a principle, and 13 of 50 dispatched rules name no principle in depends_on, although README.md:195 and :205 say every enforced rule names the principle it rests on. A reader asking why a refusal exists, which mission section 9 requires to be traceable from requirement to check, gets an empty line where the authority should be; and the README makes a claim no reader checks. The owner decided two of the audit's questions on 2026-10-30: Q-principle, fix the 13 rules and keep the README claim true by a check, rather than narrow the README; and Q-H5, keep `class` as the rule's binding level and stop calling it an enforcement class, with no binding field and no schema change. Both touch the doctrine surface this issue already changes."
current_state: "At master 51b38035a71: lib/doctrine.sh:42 splits `id title class validator category policy_key exit_code file provenance` as the scalar keys of a doctrine and lists depends_on among the list fields (:58); mj_doctrine_show prints `principle   $(mj_doc \"$i\" principle)` (lib/doctrine.sh:301), always empty. Principle rules carry `tags: [principle]` (for example share/standard/majordomus/rules/principle-10-handovers-carry-state.v1.md, id majordomus.handovers-carry-state). majordomus.scope-integrity depends on majordomus.one-worker-one-scope, a principle. Of the 50 rules of share/standard/majordomus/rules with an x-majordomus validator, 13 name no principle in depends_on: majordomus.candidates-reviewed, majordomus.completion-gates, majordomus.deployment-contract, majordomus.knowledge-graph, majordomus.knowledge-integrity, majordomus.knowledge-observed, majordomus.lifecycle-observed, majordomus.obligation-closure, majordomus.prompt-continuity, majordomus.publication-currency, majordomus.record-changed-files, majordomus.task-on-the-mesh and majordomus.use-case-coverage. Nine of them reach a principle through another rule; four reach none at all: candidates-reviewed (depends only on knowledge-integrity), knowledge-graph, knowledge-integrity and task-on-the-mesh (`depends_on: []`). The vendored rules under .ai/repo/rules/vendor/majordomus/rules are identical to the shipped ones. docs/DOCTRINE.md:45 defines `class` as `blocking` or `advisory` and :187-196 (Two classes, and no third) say what each routes without naming it a binding level; apps/majordomus-cli/src/graph.rs:734 describes the rule graph 'with the enforcement class each carries', the only use of that phrase in tracked code and documentation. Case 18 (test/cases/18_doctrine_wiring.sh:74-75) asserts `wired       yes` for doctrine show and nothing about the principle."
desired_state: "Every enforced rule names the principle it rests on in depends_on, as the README says, doctrine show prints it, and a rule that stops naming one is counted and fails a case, so the README claim cannot silently become false again. A rule's class reads everywhere as its binding level, never as how it is enforced. Enforced by case 4465 and case 18 unchanged."
