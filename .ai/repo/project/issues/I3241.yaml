id: I3241
milestone: a-change-is-judged-in-minutes
title: "Only a job that reads history fetches all of it"
slug: only-history-gates-fetch-history
priority: p3
profile: implementation
objective: "Declare in gates.yaml which gates read history, and give fetch-depth 0 only to the jobs that run one of them."
why: "c228#3: a full fetch costs 10-60 s per job on a repository of about 1 GB. It extends milestone ci-critical-path. Sources: chatgpt-majordomus:c228#3, chatgpt-majordomus:c025#3."
current_state: "Measured on master 707a04c, 2026-10-18: nine validate.yml jobs check out with fetch-depth 0 (structure, suite-shard, rust, coverage, evidence, site, macos, install, pages); the plan job uses 2."
desired_state: "fetch-depth follows the gate model, and a case refuses a full fetch no gate needs."
scope:
  - ".github/workflows/validate.yml"
  - ".ai/repo/ci/gates.yaml"
  - "scripts/ci-plan"
  - "test/cases"
depends_on:
  - "I3242"
serves:
  - "a-change-is-judged-in-minutes#pr-verdict-within-five-minutes"
acceptance_criteria:
  - "Each fetch-depth 0 is justified by a declared history gate (case)"
  - "No history-reading gate fails for want of history"
validation:
  - "scripts/ci-plan --check"
evidence_required:
  - "fetch_depth_follows_gates_case"
created_at: 2026-10-18
updated_at: 2026-10-18
