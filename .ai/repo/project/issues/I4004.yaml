id: I4004
milestone: a-session-proceeds-through-the-mesh
title: "The executor takes the issue's mesh claim in the handler and releases it when the run ends"
slug: the-executor-holds-the-issues-claim-while-it-runs
priority: p1
profile: implementation
parallel_safe: false
serves:
  - a-session-proceeds-through-the-mesh#two-sessions-never-share-an-item
objective: "The executor takes the issue's mesh claim in the handler of an execution and releases it when the run ends, however it ends; fencing is deferred to I3174 (Mission Control B6)."
why: "A claim taken by the caller outlives a caller that died and is not tied to the run that holds the work."
current_state: "Built on #2522: an execution takes the issue's mesh claim in the handler, releases it at every final state and keeps it on an unknown outcome (case 4004)."
desired_state: "The acceptance criteria below hold and case 4004 proves them."
scope:
  - "apps/majordomus-cli/src/execution"
  - "apps/majordomus-cli/src/mesh"
  - "docs/MESH.md"
  - "test/cases/4004_an_execution_holds_its_issue_claim.sh"
  - ".ai/repo/project/issues/I4004.yaml"
depends_on:
  - "I4000"
acceptance_criteria:
  - "The claim exists while the run does and is released at every final state (completion, failure, cancellation); an unknown outcome keeps it, because whether the work happened is still to be read (docs/EXECUTIONS.md; corrected 2026-11-02 to the designed and tested behaviour)"
  - "A second start for a claimed item is refused naming the holder"
  - "Fencing is not written here: it is I3174's, and this issue records the dependency"
validation:
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 4004_an_execution_holds_its_issue_claim"
evidence_required:
  - "case_4004_an_execution_holds_its_issue_claim"
created_at: 2026-10-23
updated_at: 2026-10-23
