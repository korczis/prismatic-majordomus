id: the-product-shows-what-it-caught
title: "Majordomus shows from its own records what it caught that would otherwise have passed, and what being caught cost"
statement: "The question 'is this worth it' is answered by data the tool already writes, not by a feature count or a forecast: how many tasks a worker called finished were refused by finish and later accepted, by which doctrine, how long the correction took, and how often a refusal was answered by no change to anything its doctrine reads. Beside it stands a controlled comparison on the benchmark corpus with and without the finish contract, including how often finish accepted work whose hidden tests fail. Every figure names its denominator and says not observed where the data is absent."
invariants:
  - "Read from the ledgers and the benchmark runs that exist; no second ledger, metrics registry or hand-typed number"
  - "A refusal after which no input its refusing doctrine reads (the tree, the completion note, the verify command, the obligation evidence) changed before acceptance is never counted as a caught false done"
  - "Accepted means I0401's written definition of an accepted outcome; no second definition is made"
  - "Only finish refusals are counted; a finish --check forecast is not"
  - "A figure without its denominator, or computed from estimated values, is not published"
  - "No task.* event in any ledger read, or no valid run, reads not observed, never zero"
non_goals:
  - "Token savings, which ADR 0082 and the economics benchmark already own"
  - "Ranking providers or models"
  - "Any productivity percentage the recorded runs do not support"
  - "Keeping the ledger of a worktree removed after landing; a figure covers the ledgers that exist when it is read"
  - "A /cockpit or dashboard.overview card, until that capability has a measure that renders absence as not observed"
  - "A ledger-side false-acceptance signal such as a reopen or a revert; no event records one"
  - "Recording a finish --check forecast event"
milestones:
  - "the-product-shows-what-it-caught"
satisfaction:
  - id: false-dones-are-counted
    criterion: "One capability answers, over the ledgers of every checkout `git worktree list` reports, the accepted tasks, each refusal's class (caught, unanswered, downgraded, digest unknown), refusals by doctrine and the tasks never accepted, with the task ids it counted and each ledger it read with its task.* line count (planned proof: apps/majordomus-cli/tests/gates_caught.rs)"
    evidence: command
    ref: "majordomus intent explain the-product-shows-what-it-caught"
  - id: unanswered-refusals-are-separated
    criterion: "A refusal after which no input its refusing doctrine reads changed before acceptance is reported unanswered, and a task refused as completed and accepted at a lower outcome is reported downgraded, each apart from a caught false done (planned proof: a refusal-classification case numbered by `scripts/case-numbers next` and announced on the board at start)"
    evidence: command
    ref: "majordomus intent explain the-product-shows-what-it-caught"
  - id: ui-shows-caught-beside-cost
    criterion: "/ui shows what finish caught, labelled as finish refusals only, beside the time from first refusal to acceptance, and not observed where no ledger read holds a task.* event (planned proof: apps/majordomus-cli/tests/ui_caught.rs)"
    evidence: command
    ref: "majordomus intent explain the-product-shows-what-it-caught"
  - id: acceptance-is-a-benchmark-treatment
    criterion: "The economics methodology has an acceptance metric with its own pairing rule: on the same corpus, the share of sessions that declared done while the task's hidden tests fail, with and without the finish contract, and the treatment arm's false acceptance (finish accepted while hidden tests fail), each beside its denominator and published only past that pairing's min_valid_pairs (planned proof: the acceptance-metric tests added to apps/majordomus-cli/tests/economics.rs)"
    evidence: command
    ref: "majordomus intent explain the-product-shows-what-it-caught"
