acceptance_criteria:
  - "Case 4418, in a fixture repository with a bare origin moved 3 commits ahead of its clean clone on main, policy without checkout.fast_forward: `serve ensure --format json` exits as today, does not move HEAD, and its answer carries trunk.behind 3, trunk.eligible true and the command `majordomus serve ensure --fast-forward`. The MCP initialize instructions' Remedy names that command"
  - "Case 4418: `serve ensure --fast-forward` on that clone moves HEAD to origin/main, answers trunk.fast_forwarded with the old and new full shas, and afterwards `worktree trunk` reports behind 0. With checkout.fast_forward: apply, a plain `serve ensure` does the same"
  - "Case 4418: with checkout.fast_forward: off, `serve ensure` reports the distance without eligible or command, and HEAD is unchanged"
  - "Case 4418: in five clones (one with a modified tracked file, one with a staged file, one with a commit origin/main lacks, one on a feature branch, one with .git/index.lock present), `serve ensure --fast-forward` leaves HEAD and `git status --porcelain` unchanged. Each answer names its condition, and the remedy still names rescuing uncommitted work"
  - "Case 4418: an untracked file at a path origin/main adds makes `git merge --ff-only` refuse; ensure reports git's refusal, HEAD and the untracked file are unchanged, and the server standing and exit code are those of a plain ensure"
  - "Case 4418: no `git fetch` runs during ensure (the fixture origin's refs/heads/main moves after the clone's last fetch, and the fast-forward lands on the remote-tracking ref, not on the moved origin head)"
  - "Case 4418: `majordomus init` in an empty repository writes a policy whose checkout.trunk_distance is warn_behind 20 and fail_behind 200 and whose checkout.fast_forward is offer. Doctor then judges a clone 25 commits behind as lagging (WARN), not unjudged"
  - "Case 4418: with checkout: removed from the policy, doctor's clone/trunk line is INFO unjudged and its remedy names the checkout: block of share/skeleton/policy.yaml. No reader judges the distance lagging or stale"
  - "Case 3176 passes, extended with the ensure answer's trunk field for its stale fixture"
  - "The policy schema refuses checkout.fast_forward values other than off, offer and apply, and share/allow/policy.txt admits the key after `majordomus generate`"
  - "Before the change, case 4418 fails at its first assertion"
