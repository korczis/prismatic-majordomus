milestone: public-proof
title: "An article explains in both languages why silence is not a verdict"
slug: silence-is-not-a-verdict
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/silence-is-not-a-verdict.md, an English article on why a check that has not reported is unknown and never passing (rule project.never-reported-is-not-green). It covers the night of 2026-09-10 that ADR 0037 measured, the other shapes the rule records, a verdict arranged so that it arrives, the queued status a task's gates carry, proof as a recorded execution (ADR 0041 and ADR 0080), the required verdict a skipped gate owes its proof to (ADR 0186), and what a gate enforces against what only review holds (ADR 0039). Every statement is one that those ADRs, the rule, rule majordomus.completion-gates, docs/EVIDENCE.md, docs/CLI.md or docs/CI.md on master states, each ADR with its status, and no count is typed by hand. site/content-src/mlceni-neni-verdikt.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the proof-carrying documentation, everything-followed and reasoning articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. That a missing verdict is not a passing one is the principle every gate and every finish of this repository rests on, and the site explained it only in a rule and five ADRs written for the sessions that follow them."
current_state: "No article explains why silence is not a verdict. The article groups relate each other, and none of them names it."
desired_state: "/silence-is-not-a-verdict/ and /mlceni-neni-verdikt/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 passes, with the translation at its source's digest."
