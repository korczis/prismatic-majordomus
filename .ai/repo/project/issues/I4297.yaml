id: I4297
milestone: a-review-is-published-at-its-commit
title: "The quality report records the commit and the tree it measured"
slug: the-quality-report-records-its-commit
priority: p1
profile: implementation
parallel_safe: false
objective: "Add to QualityReport the commit, the tree digest and whether the measured checkout was dirty, read once when the measurement starts from the same git provenance the evidence ledger uses, and carry them on every transport quality.report already has. Showing the commit on the Cockpit quality page is I4311's, so that the first published page does not wait on the exclusive claim #2520 holds on apps/majordomus-cli/src/cockpit/pages.rs."
why: "QualityReport (apps/majordomus-cli/src/quality/model.rs:484-498) holds schema, target, public_api, modules, operations and violations and nothing that says what was measured, so no finding can be linked to its line at a commit or reproduced there. codex (consultation d37ae1) named provenance as what a due-diligence reader needs first, and f3 asked that this land before any page publishes findings (the conclusion's order: A3, then A1, then A2). The evidence ledger already records a measurement's commit and refuses one of another commit (apps/majordomus-cli/src/capability/builtin/evidence.rs:782-851); this issue reuses that provenance rather than inventing a second one. The Cockpit prints findings as path:line text (apps/majordomus-cli/src/cockpit/pages.rs:6108)."
current_state: "On 81ef931a3e1 quality.report (apps/majordomus-cli/src/capability/builtin/quality.rs:363) answers with no commit, tree or dirty flag, and rust_only (apps/majordomus-cli/src/quality/report.rs:77) takes a crate directory and nothing about the checkout."
desired_state: "QualityReport carries commit, tree and dirty fields filled from the checkout the crate lies in, or explicitly not observed when the crate is outside a git checkout; the JSON schema and every projection are regenerated by majordomus generate; a report taken on a dirty tree says so and is refused by the site data step that I4299 adds."
scope:
  - ".ai/repo/project/issues/I4297.yaml"
  - "apps/majordomus-cli/src/quality/model.rs"
  - "apps/majordomus-cli/src/quality/report.rs"
  - "apps/majordomus-cli/src/capability/builtin/quality.rs"
non_scope:
  - "Publishing the report on the site (I4299)"
  - "Line links and blame (I4298, I4301)"
  - "New violation codes (I4303)"
  - "The Cockpit quality page naming the commit, which I4311 delivers with the forge-URL helper after #2520 releases apps/majordomus-cli/src/cockpit/pages.rs"
  - "Changing the baseline key, which deliberately excludes the line number (.ai/repo/rust-quality-baseline.txt:3-5)"
depends_on: []
serves:
  - "a-review-is-seen-at-its-commit#findings-are-published-at-their-commit"
acceptance_criteria:
  - "A report of a crate in a clean checkout carries the HEAD commit and the tree digest of that checkout"
  - "A report taken with an uncommitted edit under the crate carries dirty: true"
  - "A report of a crate outside any git checkout carries commit and tree as not observed, never an empty string read as a value"
  - "The capability is changed only in its canonical declaration and every projection comes from majordomus generate"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib quality::"
  - "bin/majordomus-cli quality report --format json"
  - "bin/majordomus plan validate"
evidence_required:
  - "quality_report_records_its_commit"
risk: "Low. Every transport is regenerated from the one declaration; the git read happens once per measurement and must not slow quality.report noticeably on a large checkout."
created_at: 2026-10-28
updated_at: 2026-10-28
