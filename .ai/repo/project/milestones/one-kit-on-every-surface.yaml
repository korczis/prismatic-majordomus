  - "share/design"
  - "share/ui"
  - "share/cockpit"
  - "site/templates"
  - "site/kit.js"
  - "site/charts.js"
  - "apps/majordomus-cli/src/ui"
  - "apps/majordomus-cli/src/cockpit"
  - "scripts/lib/ui-audit.mjs"
  - "scripts/interaction-probe"
  - "scripts/lib/interaction-specs"
  - "scripts/ci/design-check"
  - "test/cases"
non_scope:
  - "Rustdoc's own highlighting and themes, which rustdoc owns; it stays excluded from the audit as it is today"
  - "New chart types or new controls: this milestone makes the existing ones one kit"
acceptance_criteria:
  - "The design book has a section for code, charts, controls, embeds and shell blocks, each naming its mechanism, tokens and gate"
  - "For each element kind a planted second implementation on any surface fails a gate that names it"
  - "The site, /ui and the Cockpit pass every one of those gates on master, and the published site is deployed from that master"
validation:
  - "bin/majordomus plan validate"
  - "scripts/ci/design-check"
  - "node scripts/ui audit"
evidence_required:
  - "one_kit_gates_case"
depends_on: []
risks:
