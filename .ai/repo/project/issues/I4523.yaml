non_scope:
  - "Page size, retry count and retry backoff of the open list (I4380 and retry.rs): this issue adds a read when they are exhausted, and does not tune them"
  - "Landing without a verdict: a candidate whose rollup, writers or cross-references could not be read is still not decided, as case 934 requires of a failed declarations read"
  - "Refresh, reopen and cleanup on a partial observation: each of them chooses among every open pull request and stays a whole-observation act"
  - "A tracked train manifest that names the next top without asking the forge (I3915)"
  - "The Pages workflow's forge observation (`prs refresh` in pages.yml): it degrades already (I4380)"
acceptance_criteria:
  - "Unit test in integration::tests with a scripted forge: the whole open list fails (a 504 on `gh pr list` and a 502 on every page of 25), the light list names a ready integration/train-* head, and the drain decides WouldMerge for that number; the observation is partial and names the failed read"
  - "Unit test: with --pr N and every open-list read failing, the drain reads only N (its rollup and its cross-references) and decides on it, and a hold label, a red required check or an unread writer still refuses it exactly as on a whole observation"
  - "Unit test: when the candidate's own read fails too, step returns an error that names the full list, the paged list and the candidate read with each forge message, and nothing is recorded as decided"
  - "Unit test: a partial observation never chooses a refresh, a reopen or a cleanup, and a partial observation written then read back keeps partial, while one written before this change reads as whole"
  - "Case 4523, through the real command line against a scripted gh: `prs drain --dry-run` with the open list answering 504 and its pages 502 prints the would-merge of the train top and says the queue is partial; `prs drain --dry-run --pr N` decides N; with the candidate read failing too, exit 12 and the refusal names every failed read"
  - "Cases 742, 850 and 934 pass unchanged: a whole observation decides as before"
  - "docs/INTEGRATION.md, section One merge at a time, says when the drain judges one candidate, which reads it makes and what a partial queue leaves out"
