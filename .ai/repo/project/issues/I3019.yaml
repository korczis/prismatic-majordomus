id: I3019
milestone: capability-graph
title: A capability declared behaviourally verified is held to a test that reaches it
slug: behaviorally-verified-is-held-to-a-test
priority: p1
profile: implementation
parallel_safe: true
objective: "Refuse a capability declaration whose stability is behaviorally_verified when the evidence subject index reaches no test from it, so that the word is a measurement rather than a claim."
why: "Stability::BehaviorallyVerified is written by hand in each capability! declaration and nothing checks it. The coverage matrix (I1011) reports such a capability as a gap row, but a report is advisory; the declaration itself keeps saying verified, and every surface that shows stability repeats it."
current_state: "The stability is declared per capability and copied to every projection. No check compares it with the routes the evidence subject index walks from capability:<id>."
desired_state: "A capability is behaviorally_verified only while a test reaches it; one that is not is refused where the registry is validated, with the capability and the remedy named, and the existing declarations either gain a test or are declared implemented."
scope:
  - apps/majordomus-cli/src/capability/model.rs
  - apps/majordomus-cli/src/capability_coverage.rs
  - apps/majordomus-cli/src/capability/builtin
non_scope:
  - Deciding whether a test that reaches a capability passed; that is the ledger's verdict
  - Changing the coverage policy's columns
depends_on:
  - I1011
acceptance_criteria:
  - "A capability declared behaviorally_verified that no test reaches is refused, and the refusal names the capability and says to add a test or declare it implemented"
  - "Every capability declared behaviorally_verified on the base reaches a test, or its declaration is changed in the same slice"
  - "The coverage matrix and the refusal read the same routes, so the two cannot disagree"
validation:
  - cargo test --workspace --all-features
  - bin/majordomus capabilities validate
evidence_required:
  - verified_is_measured
risk: "Many declarations may say verified today without a reaching test; the first run is a list to work through, not a reason to weaken the rule. The slice that turns it on changes those declarations in the same change."
created_at: 2026-10-22
updated_at: 2026-10-22
