id: I2623
milestone: concurrent-sessions-are-served
title: "What a peer is touching is derived from its checkout, and the board shows where that leaves what it announced"
slug: a-peers-scope-is-derived-from-its-checkout
priority: p1
profile: implementation
parallel_safe: true
objective: "Derive each attached peer's touched paths from the working tree of the checkout it is attached to, compute overlaps on the derived set, and show the difference between announced and touched."
why: "Observed on 2026-10-13 in prismatic-platform under majordomus 0.22.0 (docs/ADOPTION_CONCURRENT_SESSIONS.md, H04); read again on master e506c041a4. One peer announced four paths and its worktree held changes in nine tracked files and one untracked directory of the layer. The other announced a case directory and then edited the layer. Both announcements were true when made and wrong within minutes; the board computed overlaps on the announcements, so it reported none while two sessions wrote the same files."
current_state: "peers.announce stores `scope` as given (informational). `worktree status` and `worktree inspect` already read each checkout's uncommitted work; nothing joins the two."
desired_state: "The board carries, per peer, `announced` and `touched` (from git status of its checkout, tracked and untracked, ignored paths excluded); overlaps are computed on the union; a path touched and never announced is listed as such; a checkout shared by several peers attributes a touched path only when a ledger line of an episode names it."
scope:
  - "apps/majordomus-cli/src/capability/builtin"
  - "apps/majordomus-cli/src/shared.rs"
  - "apps/majordomus-cli/src/mesh"
  - "apps/majordomus-cli/src/ui"
  - "docs/MCP.md"
  - "docs/MESH.md"
  - "test/cases"
depends_on: []
acceptance_criteria:
  - "A peer whose checkout has an uncommitted change outside its announcement shows the path as touched and unannounced"
  - "Two peers of two checkouts that changed the same tracked path are an overlap with no announcement from either"
  - "In a checkout shared by two peers an unattributable path is reported as unattributed, never assigned"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "derived_scope_case"
  - "unannounced_overlap_case"
created_at: 2026-10-13
updated_at: 2026-10-13
