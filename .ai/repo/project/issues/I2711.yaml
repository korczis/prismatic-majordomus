id: I2711
milestone: M004
title: "The pages job judges production only after the deployment of its own commit has arrived"
slug: the-pages-job-waits-for-its-deployment
priority: p0
profile: implementation
parallel_safe: true
depends_on: []
objective: "Stop validate's `pages` job on master from reporting red because it read majordomus.dev before the deployment of the commit it judges had been served."
why: "2026-10-14: validate 38579234241 on 0dff496d1c and validate 38600347235 on ff38297096 both concluded failure on the `pages` job, step \"the published site came from master, is current, and is being served\" exit 10, while production served that very commit minutes later; the job passed on a manual rerun. A false red on master holds the v0.26.0 tag (only a commit with ci success may be tagged) and costs a rerun of the job each time."
current_state: "The step reads production's build.json once, at the time the job reaches it, and fails when the deployment of its commit has not finished yet."
desired_state: "The step waits, bounded, for production to serve its commit (polling build.json with a declared limit, saying what it waits for), and fails only when the bound passes or production serves a different commit that is not newer; a deployment that is still queued is reported as such, never as a defect of the tree."
scope:
  - .github/workflows/validate.yml
  - scripts/ci/pages-check
  - scripts/site-check
  - docs/CI.md
  - test/cases
non_scope:
  - "Making the Pages deployment itself faster"
acceptance_criteria:
  - "The pages job passes when the deployment of its commit arrives within the declared bound after the job starts"
  - "It fails, naming both commits, when production serves an older commit after the bound"
  - "The wait is bounded and declared, and liveness-check accepts it"
validation:
  - "bin/majordomus plan validate"
evidence_required:
  - "pages_waits_for_its_deployment_case"
