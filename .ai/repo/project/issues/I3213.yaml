id: I3213
milestone: a-release-is-proven-end-to-end
title: "One case walks a fresh clone from init to published evidence on the release candidate"
slug: a-fresh-clone-reaches-published-evidence
priority: p2
profile: verification
objective: "Compose the paths existing cases already prove separately (install into a foreign repository, init, a session joining, an issue started and finished, its test run, its evidence recorded and published) into one case that runs on the release candidate and names the stage that fails."
why: "The 2026-10-18 analysis proposed alpha acceptance as one reproducible scenario rather than badges that measure different things (c295#3). The owner's alpha conditions (Operation Convergence, 2026-10-17) are proved by separate cases today. It also carries the after-landing observation the critique asked for: that a record commit's evidence job passes once I2717 lands. Sources: chatgpt-majordomus:c295#3, chatgpt-majordomus:c015#4."
current_state: "I1407 (DONE) walks one issue through the path, I2162 (DONE) serves a foreign repository from a released archive, scripts/ci/install-check installs, case 3220 (I2812, branch) walks the IDD loop in a browser. No case joins them on one commit. The evidence job of validate run 39064457813 on the v0.29.0 record commit 707a04c7ce8 failed in step gather with exit 12, the planned-empty report I2717 owns."
desired_state: "A case in the install or ui job runs the composed scenario on the candidate commit; each stage prints its name and evidence; a failure names its stage."
scope:
  - "scripts/ci/install-check"
  - "docs/RELEASE.md"
