id: I2399
milestone: development-runtime
title: "Every session briefs itself on an interval, without being asked"
slug: sessions-brief-themselves
priority: p1
profile: implementation
parallel_safe: true
objective: "Give every worker of a supervised repository one short, typed brief of what surrounds it (its own episode and task, the peers of every board, the mesh, the integration queue and the derive queue), projected to the command line, HTTP, MCP and the Cockpit, and have a Claude Code provider mod the policy switches keep that brief in front of the session on its own: as the status line, injected on an interval, and with the session told at its start how to keep itself awake."
why: "The owner ordered on 2026-10-11 that every Claude Code session working in this repository keeps itself alive and gives brief periodic reports without anyone asking. The facts already exist in five places (`peers.list`, `mesh.cooperation`, `mesh.state`, `majordomus prs brief`, the derive lock beside the primary checkout) and a session reads none of them unless it remembers to; the sessions of 2026-10-10 relayed board state to each other by hand, and a superseded server's board was silently missing from every gather. A session that is not told goes quiet, and a quiet session is indistinguishable from a dead one."
current_state: "No capability composes the brief: `prs brief` is a private function of the command line, `peers.list` run from the command line reads an empty board of its own process instead of the server's, and the mesh runtime answers only inside a server. The only provider mod is majordomus-handover (ADR 0123). Nothing refreshes a status line, nothing reminds a session of its surroundings on an interval, and the SessionStart briefing says nothing about staying awake."
desired_state: "`brief.session` (CLI `majordomus brief`, `GET /api/v1/brief`, MCP `majordomus_brief`) answers one line and a multi-line form from the leaseholder's view: the command line asks the server its checkout's lease names and composes locally only when none answers, and a superseded server says that its own board is unreachable by the repository's gather. The Cockpit overview shows it. `session.brief_on_interval` switches a second provider mod, majordomus-brief, installed by `capture install` beside the handover mod: it renders the line as the status line on a clock, injects the multi-line brief into the conversation when the last one is older than the declared interval, and at session start tells the worker to schedule its own periodic self-report. ADR 0136 records the decision."
