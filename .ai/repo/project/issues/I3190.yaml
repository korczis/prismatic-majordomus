id: I3190
milestone: mesh-connectivity
title: "The mesh lab proves links behind NAT, with the relay, a hub outage and an address change"
slug: the-lab-runs-behind-nat
priority: p3
profile: verification
objective: "Add NAT topologies to test/mesh-lab (two private networks behind masquerading routers, one blocked UDP) and scenarios for relayed link, direct upgrade, hub down, address change and compromised bootstrap, each with measured connect time, required by scripts/ci/mesh-lab-evidence."
why: "The 10-12 criteria require network namespaces and never localhost as proof of NAT traversal; the 10-16 matrix listed Pages offline, hub offline, symmetric NAT, IP change and partition. The lab has ten scenarios on one bridge network. Proposed in ADR 0202 (The mesh routes work to an identity, never an address, and selects among proven transports instead of implementing NAT traversal) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c282#5, chatgpt-majordomus:c102#14, chatgpt-majordomus:c166#6."
current_state: "Verified: test/mesh-lab/run scenarios claim_conflict ... three_node_convergence; no NAT."
desired_state: "The lab's required set includes the NAT scenarios; case 414 holds the set."
scope:
  - "test/mesh-lab"
  - "scripts/ci/mesh-lab-evidence"
  - ".github/workflows/validate.yml"
non_scope:
  - "Proving traversal on a real multi-network (a manual, recorded run)"
depends_on:
  - "I3189"
serves:
  - "an-authorised-node-connects-from-anywhere#relay-when-no-direct-path"
acceptance_criteria:
  - "Each scenario has a measured outcome"
  - "A dropped scenario fails case 414"
  - "The relayed_link scenario runs both nodes on private networks that cannot dial each other and reach the hub only over a private or overlay network, so the lab proves the relay without a public cleartext hop"
validation:
  - "majordomus plan validate"
  - "bash test/run.sh 414_mesh_lab_evidence"
evidence_required:
  - "mesh_lab_nat_matrix"
created_at: 2026-10-18
updated_at: 2026-10-18
