system_targets:
  - key: system.mcp.process_cold
    transport: mcp
    measures: "spawn a majordomus mcp process, initialize, first tools/list"
  - key: system.mcp.initialize
    transport: mcp
    measures: initialize on a running process
  - key: system.mcp.ping
    transport: mcp
    measures: "ping: the protocol round trip with nothing behind it"
  - key: system.mcp.tools_list
    transport: mcp
    measures: tools/list
  - key: system.mcp.resources_list
    transport: mcp
    measures: resources/list
  - key: system.mcp.resources_read
    transport: mcp
    measures: resources/read of the first declarative resource
  - key: system.http.index
    transport: http
    measures: GET / (the topology as JSON)
  - key: system.http.home
    transport: http
    measures: "GET / with Accept: text/html (the home page, rendered from the topology)"
  - key: system.http.openapi
    transport: http
    measures: GET /openapi.json
  - key: system.http.swagger
    transport: http
    measures: GET /swagger (the Swagger UI shell)
  - key: system.http.cockpit_overview
    transport: http
    measures: "GET /cockpit (the Cockpit's landing page, server-rendered)"
  - key: system.http.cockpit_capabilities
    transport: http
    measures: "GET /cockpit/capabilities (every capability as a table: the widest page)"
  - key: system.http.cockpit_graph
    transport: http
    measures: GET /cockpit/graphs/registry (a page whose content is a derived graph)
