  - "The built homepage's install section carries exactly one link to /docs/install/"
  - "The button after the copy button carries a label declared in marketing.toml that is not the install action"
  - "The refusals disclosure names each use case once and lists every recorded refusal under its use case, and its summary count equals terminal.json counts.refusals"
