id: I3155
milestone: repository-automation-is-typed
title: "The shell check reports shell by disposition, and the count of domain-logic shell never rises against the merge base"
slug: domain-shell-only-shrinks
priority: p2
profile: implementation
objective: "Add a ratchet to majordomus shell check comparing the class-A unit and line counts with the merge base and refusing an increase or an unexplained relabel, serve the per-class counts as a reading on CLI, MCP and HTTP, and draw that reading as the shell observatory on /ui."
why: "The README of .ai/repo/automation says 'The list only shrinks' but nothing compares with master; the owner asked for progress measured by logic removed, not .sh counts (2026-10-12), and a derived shell observatory (2026-10-17). It extends milestone automation. Sources: chatgpt-majordomus:c105#1, chatgpt-majordomus:c230#5, chatgpt-majordomus:c290#2."
current_state: "inventory.jsonl: 237 records, dispositions A-F (113 A; counted at 707a04c with wc -l and grep -c on the disposition field); shell check refuses unexempted units; the judgement lives in apps/majordomus-cli/src/automation/mod.rs."
desired_state: "A rise in class A fails the check; counts are derived, never typed into prose."
scope:
  - "apps/majordomus-cli/src/capability/builtin/shell.rs"
  - ".ai/repo/automation"
  - "docs/SHELL.md"
  - "test/cases/365_new_shell_is_refused.sh"
  - "apps/majordomus-cli/src/automation/mod.rs"
  - "apps/majordomus-cli/src/commands/shell.rs"
  - "apps/majordomus-cli/src/ui/mod.rs"
  - "apps/majordomus-cli/src/ui/governance.rs"
  - "docs/generated/modules/shell.md"
serves:
  - "repository-automation-is-typed#domain-shell-ratchet"
acceptance_criteria:
