id: I2989
milestone: a-second-adopter-is-served
title: "doctor's bootstrap check judges the generated region of a host file, not the adopter's text around it"
slug: the-bootstrap-check-judges-only-the-region
priority: p2
profile: implementation
parallel_safe: true
objective: "Make the bootstrap-integrity check that refuses a rule corpus in AGENTS.md read only the generated region of a region-mode projection, and report text outside the region at WARN at most."
