# Deploys the derived documentation site to GitHub Pages.
#
# The site is generated from canonical repository files: scripts/generate-site-data normalises
# them into site/data/generated/, Zola renders templates over that data, Tailwind compiles the
# Flowbite stylesheet. There is no second, hand-maintained content tree. The job first proves the
# tree is healthy (tests, doctor), then that the committed derived data matches the sources, then
# builds and checks the output, and only then deploys.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install pinned Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin zola
          zola --version
      - name: install site build dependencies
        run: npm ci --no-audit --no-fund
      - name: behavioural tests
        run: bash test/run.sh
      - name: self-supervision
        run: |
          git config core.hooksPath .githooks
          bin/majordomus doctor
      - name: derived data is in sync with canonical sources
        run: scripts/generate-site-data --check
      - name: build the site
        run: scripts/site-build
      - name: check the site
        run: scripts/site-check
      # Browser-measured: no horizontal overflow at 320/390/1280, mobile menu, dropdowns, theme
      # toggle, Mermaid rendering. Skips with a notice when no Chrome is present.
      - name: probe the site in a browser
        # One route per template, which covers every layout: pages sharing a template share
        # their overflow behaviour, and the sample follows the template rather than the section
        # name, which is only a proxy for it. The complete sweep of every route runs in
        # validate.yml on the same push, in parallel, so the branch is still not green until
        # every route has been measured — it just no longer sits between a green build and a
        # published artifact. What that trades away, stated plainly: an overflow that only one
        # page of a template exhibits, from its own data rather than its layout, can be live
        # for minutes rather than hours. The full run in validate is what catches it.
        run: CHROME_BIN=google-chrome scripts/site-probe --quick
      - name: manifest
        run: cat site/data/generated/source.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
