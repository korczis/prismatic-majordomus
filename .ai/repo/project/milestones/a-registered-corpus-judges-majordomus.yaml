  - "site/content/docs/economics.md"
non_scope:
  - "The definition of accepted (I0401) and the acceptance pairing (I3133)"
  - "Arms per mechanism (I3298)"
  - "Human interventions and CI reruns on real work (T3)"
  - "Re-running or excluding a recorded run to change a verdict"
acceptance_criteria:
  - "Each blocked dependency of the program is either cut by a recorded owner decision or recorded as refused with the criteria it leaves outside the window"
  - "The primary verdict is computed by the registered exact test and is inconclusive when underpowered"
  - "Every declared pair is attempted and every missing or invalid pair is published with its reason"
validation:
  - "majordomus plan validate"
evidence_required: []
risks:
  - "The owner may refuse to cut I3133's dependency; then T2 waits on execution-telemetry"
  - "Live runs spend provider usage and are account-bound; a weekly limit can leave pairs missing, which is published as missing"
  - "With 20 tasks the acceptance difference may well be inconclusive; that is a valid published result"
  - "I3133 and I3298 scope the whole economics directory; the landing seat orders them against I3366 and I3371"
