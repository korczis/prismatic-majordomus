id: a-claim-stands-only-on-its-evidence
title: "A claim that something is enforced, tested or delivered stands only on recorded evidence that would have caught it being false"
slug: a-claim-stands-only-on-its-evidence
order: 161
priority: p1
problem: "The owner wants every rule, guarantee and delivered feature that Majordomus states to be backed by a recorded execution at the revision being shown. For a blocking rule, that execution shows a violation being refused. Every way around a gate (an override, a disabled protection, a proposed decision cited as law) must be visible. Any statement that lacks this evidence reads as not proven on every surface, never as done. Proposed in ADR 0188 (A rule's proof of effect is a recorded refusal of its violation, not the presence of its wiring) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c098#0, chatgpt-majordomus:c109#4, chatgpt-majordomus:c109#6, chatgpt-majordomus:c115#0, chatgpt-majordomus:c124#0, chatgpt-majordomus:c124#1, chatgpt-majordomus:c130#4, chatgpt-majordomus:c135#0, chatgpt-majordomus:c135#1, chatgpt-majordomus:c139#0, chatgpt-majordomus:c139#1, chatgpt-majordomus:c139#4, chatgpt-majordomus:c142#0, chatgpt-majordomus:c143#2, chatgpt-majordomus:c143#7, chatgpt-majordomus:c143#13, chatgpt-majordomus:c147#7, chatgpt-majordomus:c193#0, chatgpt-majordomus:c193#1."
outcome: "The owner wants every rule, guarantee and delivered feature that Majordomus states to be backed by a recorded execution at the revision being shown. For a blocking rule, that execution shows a violation being refused. Every way around a gate (an override, a disabled protection, a proposed decision cited as law) must be visible. Any statement that lacks this evidence reads as not proven on every surface, never as done."
current_state: "Its issues extend existing milestones; see each issue's why."
desired_state: "Every criterion of the intent is carried by an issue here and proven by its test."
acceptance_criteria:
  - "majordomus-cli rules report names every blocking rule with no case whose '# majordomus-refutes:' header shows its violation refused; the count ratchets and only falls"
  - "Every dispatched blocking validator is run against a declared violation in a disposable repository and refuses it"
  - "On master, rule and claim states read the executions the validate run recorded for its own head, and the blocking rules no recorded run proves are printed"
  - "The delivery report computes required_tests_current, test_evidence_published and ui_linked; none reads unknown because of a pending pull request"
  - "A merge past the required check without a recorded authorisation, and a protection that stopped requiring ci, are findings of a gate"
  - "A scheduled mutation run over the declared critical predicates publishes its survivors as evidence"
  - "No README or site sentence contradicts master about runtime, model invocation, baselines or the edit guard"
  - "No surface (/ui/rule, /ui/governance, the published snapshot, site/content/rules) draws a not_run, stale or unknown rule as pass, or as satisfied without its state"
  - "Every blocking rule or guarantee that cites a proposed ADR as its authority is listed, ordered by how many rest on it, as the owner's acceptance queue"
validation:
  - "majordomus plan validate"
evidence_required: []
