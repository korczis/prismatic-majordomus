id: I4539
milestone: one-frame-one-kit-one-library-per-job
serves:
  - "one-kit-on-every-surface#advanced-tables"
title: "One advanced table component, rendered on the server and enhanced on the client, lists issues, prs, capabilities, skills, objects, executions and commands"
slug: one-advanced-table
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S5 of milestone one-frame-one-kit-one-library-per-job. Add one table component to web/kit and its enhancement to share/design/js/table: search, filter, sort, pagination, column visibility, CSV and JSON export and a row link. Without script the table is the server's page of the list, paginated as the Cockpit's Window and pagination already do (cockpit/view.rs:606-670), never every row of capabilities.list (3920) or objects (3689); the client enhances the page it was given and asks the list's own capability filters for more. Adopt it on the issues, prs, capabilities, skills, objects, executions and commands lists of /ui and /cockpit."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). The owner asks for advanced tables; each list screen sorts, pages and filters its own way today, and some do not at all."
current_state: "Measured on master on 2026-11-07: the table is one of the components drawn two or three times (S3 inventory); apps/majordomus-cli/src/cockpit/view.rs:630 and :644 hold the Cockpit's own pages and page_numbers; no share/design/js/table exists and no list exports CSV or JSON."
desired_state: "Every list screen named here renders the one table; with script it searches, filters, sorts, pages, hides columns, exports CSV and JSON and links each row; without script it is the complete server-rendered table."
scope:
  - "apps/majordomus-cli/src/web/kit"
