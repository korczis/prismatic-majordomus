id: I4531
milestone: surfaces-never-disagree
title: The pages name the pre-release that was published, not only the one recorded
slug: the-pages-name-the-pre-release-that-was-published
priority: p0
profile: implementation
parallel_safe: true
serves: []
objective: "scripts/site-build derives the pre-release the pages name beside the stable release the way it derives the stable one (project.the-site-offers-the-release-it-published): from the release records of the tree and from the pre-release documents the published branch already serves, the newer pick named and its source recorded in build.json; scripts/site-deploy keeps a published release document the build does not carry; scripts/pages release-live holds the live homepage's pre-release to GitHub's newest pre-release the way it holds the stable one."
why: "On 2026-11-06 v1.0.0-alpha.10 was released at 17:09Z and its document published on gh-pages (4d804d0b7a4), while its record was pull request #2942 in the train queue. Master (1112bace343) carried the alpha.9 record, and the pre-release was read from the records alone ('never from a ref', I3449), so every pages deploy of master that evening (0381bb36144, 926562c712f, 60f08268f38) rebuilt the homepage's hero as '1.0.0-alpha.9 (pre-release) · stable 0.30.2' — the screenshot the owner sent many times — and each took releases/v1.0.0-alpha.10.json off the site, because an ordinary deploy kept only latest.json and the stable tag file it names (ADR 0131). The stable channel got the published-wins rule on 2026-10-12; the pre-release channel did not."
current_state: "scripts/site-build release_prerelease() reads .ai/repo/releases/v*.yaml only; scripts/site-deploy keeps releases/latest.json and the tag file it names; scripts/pages release-live reads data-release, /build.json's release.version, /releases/latest.json and GitHub's newest release, and nothing of the pre-release."
desired_state: "release_prerelease() merges the records with the pre-release documents of the published ref (every releases/v*.json of channel prerelease; --release-published-dir for the cases), applies the one selection to each side, names the newer pick with its source and published_from, and copies a winning published document into the build; site-deploy keeps every release document gh-pages serves that the build lacks and names them; release-live reads data-prerelease, release.prerelease.version and GitHub's newest pre-release and fails past the window, or at once for one GitHub has not published; the rule names both channels."
scope:
  - ".ai/repo/project/issues/I4531.yaml"
  - "scripts/site-build"
