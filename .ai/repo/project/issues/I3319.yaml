  - "Changing what adr-0017 decided"
  - "Forbidding the name of the owner's adopter repository, which the independence check and the adoption records need"
acceptance_criteria:
  - "adr-0017 and its site projection carry the decision without naming either studied repository"
  - "A check fails on a tracked file that names a forbidden token, reporting the file and line and never the token, and passes on master afterwards"
  - "The check and its list hold a digest of each forbidden token, never the token itself"
  - "The list's header states why the owner's adopter repository is not on it, and no tracked file other than adr-0017 named it as a design source"
  - "The staged batch that planned this issue, I3129 and an-adopters-work-never-waits-for-majordomus among it, passes the check"
