{#- flowbite.com/docs/components/breadcrumb/ — the trail, composed in share/design/shell.css so that the Cockpit emits the same one. -#}
<nav class="mj-crumbs-nav" aria-label="Breadcrumb">
  <ol class="mj-crumbs">
    <li class="mj-crumb"><a href="{{ get_url(path="/", trailing_slash=true) }}" class="mj-crumb-link">Home</a></li>
    {% if crumb_parent %}<li aria-hidden="true">/</li><li class="mj-crumb"><a href="{{ crumb_parent.permalink }}" class="mj-crumb-link">{{ crumb_parent.title }}</a></li>{% endif %}
    <li aria-hidden="true">/</li>
    <li aria-current="page" class="mj-crumb-current">{{ crumb_title }}</li>
  </ol>
</nav>
