id: I0103
milestone: M001
title: Implement the decision and prove it holds
slug: implement-blocker-persistence
priority: p1
profile: implementation
parallel_safe: false
objective: "Make the chosen behaviour real in the question store and the blocker gate, and turn the characterisation case from I0101 into a case that fails when the behaviour is removed."
why: "The gate is the only mechanism in the tool that stops a completed finish for a human reason. A gate with a known escape is worse than none, because people trust it."
current_state: "The gate reads only unresolved questions belonging to the active task."
desired_state: "The behaviour the decision chose is implemented, and removing it turns a case red."
scope:
  - lib/question.sh
  - lib/check.sh
  - test/cases
non_scope:
  - Changing any other line of the finish contract
depends_on:
  - I0102
acceptance_criteria:
  - The case from I0101 asserts the chosen behaviour rather than the gap
  - Reverting the implementation turns that case red, demonstrated by running it against the reverted source
  - majordomus doctor and majordomus watch stay green
validation:
  - bash test/run.sh 50_blocker_across_handover
  - bin/majordomus doctor
evidence_required:
  - behaviour_tested
risk: "The question store's line format is machine-written and read by three commands; a change to it has to keep every existing entry parseable, which questions_store_integrity checks."
created_at: 2026-09-04
updated_at: 2026-09-04
