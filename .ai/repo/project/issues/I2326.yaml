id: I2326
milestone: a-finished-task-is-explained-by-its-evidence
title: "A duplicated, reordered, corrupted or secret-bearing evidence event is refused or reconciled, and each case is a test that can fail"
slug: evidence-survives-adversarial-input
priority: p1
profile: implementation
parallel_safe: true
objective: "Add unit and integration tests for duplicate execution events, a retry, clock skew, a changed head, ambiguous refs, reordered independent events, concurrent writers, a crash and recovery, secret redaction, a corrupted payload, an incompatible schema and a stalled worker, and wire the schema, rule and CI checks through the existing governance with a negative test proving the gate fails."
why: "The evidence model becomes the authority for completion and release in the later milestones. An authority that has only been shown its happy path will be trusted exactly where it is weakest. Source: convergence prompts/01-canonical-execution-evidence.md Issue 01.4 'Adversarial verification'."
current_state: "Freshness is judged by one function at the presented revision; printed text is redacted by one rule set; the evidence gate reads claims and recorded runs (apps/majordomus-cli/src/evidence/freshness.rs, apps/majordomus-cli/src/redaction.rs, scripts/evidence-check). Concurrent writers, reordering and a corrupted payload have no dedicated tests."
desired_state: "Each of the twelve conditions has a test whose failure message says what to do. Each guard has a mutation that makes its test fail, recorded in the test. The gate's own negative case is part of the suite, and the rule that requires it is registered with its validator."
scope:
  - "apps/majordomus-cli/src/evidence/ledger.rs"
  - "apps/majordomus-cli/src/evidence/freshness.rs"
  - "apps/majordomus-cli/src/redaction.rs"
  - "apps/majordomus-cli/tests/redaction.rs"
  - "scripts/evidence-check"
  - ".ai/repo/ci/gates.yaml"
non_scope:
  - "New evidence semantics. The tests hold what I2323 and I2324 define."
depends_on:
  - I2324
acceptance_criteria:
  - "Each of the twelve named conditions has a test, and removing the guard it covers makes that test fail"
  - "Two writers appending at once leave a ledger every reader parses, with both records present once"
  - "A corrupted or incompatible record is reported with its location and is never read as a pass"
  - "The evidence gate fails on a fixture built to violate it"
validation:
  - "bin/majordomus plan validate"
  - "scripts/evidence-check"
  - "cargo test --test redaction"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the cases this issue adds>"
evidence_required:
  - "adversarial_evidence_tests"
  - "gate_negative_case"
created_at: 2026-10-10
updated_at: 2026-10-10
