id: I2254
milestone: adoption-is-light
title: "A minimal adoption seeds what the lifecycle needs and references the rule package instead of copying it"
slug: a-minimal-adoption-references-the-rules
priority: p2
profile: implementation
parallel_safe: false
objective: "Add init --minimal that writes the manifest, policy, scope and lifecycle directories only, and resolves the vendored rule package from the installed tool by version instead of copying 60 files."
why: "init copies 41 skeleton files and the 60-file rule package (lib/init.sh:43-70; share/skeleton, share/standard); the m00 findings counted 99 files after init. The footprint outside .ai is two-folder-integration's (I1101-I1112); the count inside .ai is not owned by any milestone."
current_state: "Every adoption copies about a hundred files."
desired_state: "init --minimal creates a counted, documented set; doctor and the lifecycle pass in it; the journey case runs on it and reports the count."
scope:
  - "lib/init.sh"
  - "lib/common.sh"
  - "lib/rules.sh"
  - "share/skeleton"
  - "docs/ADOPTION.md"
  - "test/cases"
non_scope:
  - "Changing the default init; minimal is opt-in until the owner decides"
  - "The reconciler of two-folder-integration"
depends_on:
  - "I2255"
  - "I2253"
acceptance_criteria:
  - "init --minimal creates the number of files docs/ADOPTION.md states, counted by the case"
  - "doctor, start, check and finish pass in a minimal repository"
  - "The rule package version the minimal layer resolves is named in its manifest"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the journey case> <the case this issue adds>"
evidence_required:
  - "minimal_init_count_case"
created_at: 2026-10-09
updated_at: 2026-10-09
