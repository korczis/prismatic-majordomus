id: I0302
milestone: execution-telemetry
title: Record telemetry a provider reports, and refuse anything it did not
slug: record-reported-telemetry
priority: p2
profile: implementation
parallel_safe: false
objective: "Add the command that attaches measured execution facts to the active task, accepting only values a provider actually reported and refusing any field the caller cannot attribute to a reporter."
why: "The tool never invokes a model, so it cannot measure a session itself; the numbers have to be handed to it. The boundary where they arrive is the only place their provenance can still be checked."
current_state: "The record has a shape and nothing writes one."
desired_state: "A worker or a wrapper hands measured facts to one command, they are validated and stored against the task, and a value with no reporter is refused with a finding that names the field."
scope:
  - lib
  - bin
non_scope:
  - Any network call, poll, or background collection
  - Deriving one field from another to fill a gap
depends_on:
  - I0301
acceptance_criteria:
  - Measured facts attach to the active task and survive into the completed record
  - A field without a reporter, or with a reporter that is not named, is refused
  - No code path fabricates, interpolates or defaults a measured value
  - The command works with no network and leaves no background process
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "A provider's self-reported usage may itself be wrong; the record says who reported it so that a later correction has something to correct."
created_at: 2026-09-04
updated_at: 2026-09-04
