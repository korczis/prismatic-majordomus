id: I3833
milestone: ci-critical-path
title: "majordomus disk prune reclaims the container runtime's caches by name: build cache, anonymous unused volumes, dangling images, then trims the VM disk"
slug: the-container-runtime-is-pruned-by-name
priority: p2
profile: implementation
parallel_safe: true
objective: "Add a typed capability disk.prune (CLI `majordomus disk prune`, --check and --apply) that reports and, with --apply, runs docker builder prune -af, docker volume prune -f (anonymous unused volumes only, never a named volume), docker image prune -f (dangling only), and on colima `colima ssh -- sudo fstrim -av`, reporting the space each step gave back and announcing it on the mesh; it starts no stopped VM unless asked."
why: "The owner's relaxation of 2026-10-21 (I3824 clause 8). On 2026-10-20 these four steps shrank the colima disk image from 73 GiB to 43 GiB without touching a named data volume."
current_state: "No capability; the steps were typed by hand."
desired_state: "One named capability the owner can allow; --check is read-only; named volumes and tagged images are never removed."
scope:
  - "apps/majordomus-cli/src/capability/builtin"
  - "share/commands.yaml"
  - "docs/DEVELOPMENT_RUNTIME.md"
non_scope:
  - "Changing which checks CI requires"
  - "Claude Code permission settings, which are the owner's to paste"
depends_on: []
acceptance_criteria:
  - "--check reports what each step would reclaim and writes nothing"
  - "--apply never removes a named volume or a tagged image, which a fixture with a stubbed docker proves"
  - "A machine without docker or colima reports the step as absent, never as a failure"
  - "Each applied step is announced on the mesh with the bytes it reclaimed"
validation:
  - "bash test/run.sh 3833_the_container_runtime_is_pruned_by_name"
  - "bin/majordomus plan validate"
evidence_required:
  - "the_container_runtime_is_pruned_by_name_test"
created_at: 2026-10-21
updated_at: 2026-10-21
