id: I3600
milestone: surfaces-never-disagree
title: "The main navigation is the same bar in every language the site publishes"
slug: a-translated-bar-is-the-source-bar
priority: p1
profile: implementation
parallel_safe: true
objective: "The UI audit measures the main navigation on every page and width it visits: it fits its row, shows its labels whole, and in a translated page is as tall as the source language's bar on the same page and width, closed and opened, in both themes (navbar.wraps, navbar.clipped, navbar.locale-drift)."
why: "On 2026-10-19 the owner switched majordomus.dev to Czech and found the top navbar broken: it took two rows at 1280px and 768px (73px and 121px in English, 121px and 157px in Czech). Every link and control still worked, so interaction-probe and the language probe were green; nothing measured what a translation does to the bar."
current_state: "The audit checks overflow, landmarks, ids, component targets, runtime errors and accessibility; nothing compares a translated page's bar with the source page's."
desired_state: "scripts/lib/ui-navbar-locale.mjs measures the bar on every audited visit and the run compares each translated bar with the source bar; case 3600 holds every finding on a fixture in a real browser; docs/UI.md names the three rules."
scope:
  - "scripts/lib/ui-navbar-locale.mjs"
  - "scripts/lib/ui-audit.mjs"
  - "scripts/lib/ui.test.mjs"
  - "test/cases/3600_a_translated_bar_is_the_source_bar.sh"
  - "docs/UI.md"
  - ".ai/repo/project"
depends_on: []
acceptance_criteria:
  - "A translated bar taller than the source bar on the same page and width is navbar.locale-drift, closed and opened, in both themes"
  - "A bar whose items take more than one row is navbar.wraps, and an item that cuts off its text is navbar.clipped"
  - "The English site as published today carries none of the three findings"
validation:
  - "majordomus plan validate"
  - "scripts/ui test"
  - "bash test/run.sh 3600_a_translated_bar_is_the_source_bar"
evidence_required: []
created_at: 2026-10-19
updated_at: 2026-10-19
