# Site navigation: a handful of intents, small on purpose. Rendered by templates/partials/navbar.html
# as Flowbite dropdowns on desktop and as labelled flat lists inside the collapsed mobile menu,
# and by templates/partials/footer.html as the footer's columns. A group with no items is a
# plain link. Every href must resolve; scripts/site-check verifies it. Nothing here enumerates
# a feature, a module, a capability or a command: those routes are the generator's.

[[groups]]
label = "Why"
href = "/why/"

[[groups]]
label = "Product"
href = "/features/"
items = [
  { label = "Features", href = "/features/" },
  { label = "Features against interfaces", href = "/features/matrix/" },
  { label = "Use cases", href = "/use-cases/" },
  { label = "Applications", href = "/applications/" },
  { label = "Skills", href = "/skills/" },
]

