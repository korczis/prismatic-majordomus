id: I2974
milestone: "a-session-proceeds"
title: "Proceeding claims and starts the chosen work once"
slug: proceeding-claims-and-starts-once
priority: p1
profile: implementation
parallel_safe: false
objective: "Add majordomus proceed take: through the existing capabilities only, take proceed.plan's selection with one exclusive mesh claim on the primary checkout's runtime, ensure the issue's canonical worktree, record the take in that worktree and start the task bound to the issue there; a session whose take is recorded gets that work back and nothing is created, a finished one is reported and its claim released."
why: "ADR 0177 decision 3. Claim, worktree and start are three commands typed by hand, and nothing stops a second proceed in the same session from opening a second claim, worktree and task."
current_state: "proceed.plan says what to take and prints the three commands; nothing takes it."
desired_state: "One command takes it; run again, from the primary checkout or the worktree, after a restart of the server or after finish, it creates nothing; case 3443 holds each of these on a fixture repository with a declared mesh."
serves:
  - a-session-proceeds#a-session-is-told-what-to-take
scope:
  - "apps/majordomus-cli/src/commands/proceed.rs"
  - "apps/majordomus-cli/src/capability/builtin/proceed.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/src/cli/local.rs"
  - "apps/majordomus-cli/src/commands/worktree.rs"
  - "test/cases/3443_proceeding_twice_creates_nothing.sh"
depends_on:
  - "I2973"
acceptance_criteria:
  - "One proceed take claims the selection exclusively on the primary checkout's runtime, ensures its canonical worktree and starts the task bound to it there"
  - "A second take by the same session, from the primary checkout or the worktree, after a server restart or after finish, creates no claim, worktree or task"
  - "A take whose start is refused keeps its claim and record, and a rerun continues at the start; a take whose worktree cannot be ensured releases the claim it made"
validation:
  - "majordomus plan validate"
  - "bash test/run.sh 3443_proceeding_twice_creates_nothing"
evidence_required:
  - "case_proceeding_twice_creates_nothing"
created_at: 2026-10-18
updated_at: 2026-11-02
cancelled: true
completion: "Cancelled 2026-11-02 by the owner's decision (asked in session oscilla-af while #2522 was readied for a train): `proceed take` is retired. It was a second composition of claim, worktree and start beside devtask.implement, holding a caller-side claim and its own record (.ai/local/state/proceed.json), so I4005's criterion that the stack is extended and not duplicated could not hold while it existed, and it carried most of the stack's uncovered code. One path acts: proceed.step's work order names devtask.implement (I4003), whose execution takes the issue's mesh claim and releases it when the run ends (I4004), and a repeated start answers the same execution (I4000). Proceeding twice creating nothing is a-session-proceeds-through-the-mesh#an-implement-request-runs-once, carried by I4003 (on 2026-11-03 the duplicate criterion a-session-proceeds#proceeding-twice-creates-nothing was removed from that intent; the critique findings planned into this issue concern the retired command and close with it), and case 3443 is removed with the command. ADR 0177 decision 3 is amended to say so."
