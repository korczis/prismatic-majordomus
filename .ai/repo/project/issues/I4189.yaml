  - "A refusal is recorded as failed"
  - "A result with a reference that does not resolve is recorded as failed"
validation:
  - "bash test/run.sh 4189_a_headless_result_is_accepted_only_when_complete"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib reasoning::"
  - "majordomus plan validate"
