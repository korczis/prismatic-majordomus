  - "Lease-based assignment (I3198)"
  - "Per-mechanism attribution (I3298)"
acceptance_criteria:
  - "A replaying harness runs the coordinated arm end to end without a provider"
  - "No favourable verdict is printed while the accepted-share guard fails"
  - "The T4 row publishes the verdict with every lost or invalid pair"
validation:
