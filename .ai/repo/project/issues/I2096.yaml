id: I2096
milestone: mobile-first
title: the Cockpit sections are reachable on a phone through one drawer
slug: cockpit-sections-on-a-phone
priority: p0
profile: implementation
parallel_safe: false
objective: 'Below lg, show the sidebar as a drawer opened by a Sections control in the top bar: the same element, catalogue and rendering as the sidebar, its state owned by the cockpit component and written synchronously, a modal dialog only while it is a drawer, and a link to #mj-nav so that it opens through :target without the script.'
why: The sidebar was `hidden lg:block` with nothing that showed it, so a phone had no section navigation; the overflow sweep at 320 and 390 passed because an empty page does not overflow.
current_state: 'Implemented on feature/cockpit-mobile-navigation: view.rs renders the trigger, the close control and the backdrop; cockpit.js holds navOpen; cockpit.css places the drawer under max-lg; docs/COCKPIT.md documents it.'
desired_state: At every width below lg a tap on Sections opens the catalogue as a named modal dialog; the close control, the backdrop, Escape, an entry, back, widening and Ctrl/Cmd+K each close it with no lock, inert element or covering layer left; at lg the sidebar is unchanged.
scope:
- apps/majordomus-cli/src/cockpit/view.rs
- apps/majordomus-cli/src/cockpit/nav.rs
- share/cockpit/cockpit.js
- share/cockpit/src/cockpit.css
- share/cockpit/cockpit.css
- docs/COCKPIT.md
depends_on: []
acceptance_criteria:
- scripts/cockpit-probe --drawer passes at 320x740, 390x740 and 667x375 on touch and with JavaScript disabled
- The same check fails against master's shell with 'no visible trigger; the sections are unreachable'
- cockpit::view unit tests hold the trigger, the close control, the backdrop's position and the sidebar never rendered as a dialog
validation:
- scripts/cockpit-probe --drawer
- cargo test --lib cockpit::view
- scripts/cockpit-assets --check
evidence_required:
- sections_reachable_on_a_phone
