  - "Package managers other than npm and mix (pnpm, yarn, cargo): a later list, once an adopter asks for it"
  - "The adopter's own verify step"
depends_on: []
serves: []
acceptance_criteria:
  - "In a fixture repository whose package-lock.json gained a dependency in a linked worktree while the primary checkout's node_modules predates it, `majordomus doctor` prints a WARN clone line naming the primary checkout's path and `npm ci` as the fix; after `npm ci` there the line is gone and an OK line says every checkout is current"
  - "The same holds with the roles swapped: a linked worktree behind its lockfile is named by doctor run in the primary checkout"
  - "Where mix is installed, a fixture mix project whose deps fail `mix deps.check` is named with `mix deps.get` as the fix; where it is not, the reading is INFO"
  - "A checkout with no lockfile is not judged, and MAJORDOMUS_DOCTOR_CONTEXT=commit leaves the other checkouts unread"
  - "Negative: the case fails against lib/doctor.sh at defd88e5896, which prints no such line"
  - "Each new case named here takes its number from `scripts/case-numbers next` and is announced on the board before the file is written (ADR 0053)"
