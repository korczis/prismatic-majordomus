id: I3383
milestone: delivery-economics-are-measured-over-declared-windows
title: "The T3 delivery window is registered before it opens: its period, the work it admits, the definition of accepted and a bound on each field's not-observed share"
slug: the-delivery-window-is-registered
priority: p1
profile: docs
objective: "Register the T3 window protocol in .ai/repo/benchmarks/proof-plan.yaml: a period that begins after the registration's commit, the work it admits (every task started in the period in any checkout of this repository), accepted as I0401 defines it, the bound per field on its not-observed share, the snapshot of checkouts taken at open and close, and the cross-check against tracked session records. Record which fields are expected to read not observed in light of I3373's decisions."
why: "T3 of the owner's report of 2026-10-19 asks for real figures. The critique found an instrument without a measurement over work chosen in advance does not answer T3, and that removed worktrees bias the denominator, so the checkout snapshot and the session-record cross-check are part of the protocol."
current_state: "No window is declared. git ls-files .ai/repo/sessions counts 91 tracked session records; policy.yaml:122-123 sets commit_record_on_end and push_record_on_end."
desired_state: "The T3 protocol validates with its digest and the T3 row reads running once the period opens."
scope:
  - ".ai/repo/benchmarks"
non_scope:
  - "Measuring the window (I3384)"
  - "Changing what the session lifecycle commits"
depends_on:
  - "I3352"
  - "I3373"
serves:
  - "the-product-proves-it-pays#delivery-is-measured-over-a-declared-window"
acceptance_criteria:
  - "The protocol validates, and its period starts after its registration commit"
  - "Each field has a declared not-observed bound"
  - "The protocol names the snapshot and the cross-check"
validation:
  - "majordomus economics proof"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test economics"
  - "majordomus plan validate"
evidence_required:
  - "t3_window_registered"
