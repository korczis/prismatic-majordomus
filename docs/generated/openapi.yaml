          format: uint64
          minimum: 0
          description: Index builds.
        registry_builds:
          type: integer
          format: uint64
          minimum: 0
          description: Registry builds.
        schema_generations:
          type: integer
          format: uint64
          minimum: 0
          description: JSON Schemas derived from Rust types.
        mcp_projection_builds:
          type: integer
          format: uint64
          minimum: 0
          description: MCP tool and resource listings computed.
        openapi_builds:
          type: integer
          format: uint64
          minimum: 0
          description: OpenAPI documents built.
        http_projection_builds:
          type: integer
          format: uint64
          minimum: 0
          description: HTTP routers built.
        graph_builds:
          type: integer
          format: uint64
          minimum: 0
          description: Graphs derived from the registry and the index.
        executions:
          type: integer
          format: uint64
          minimum: 0
