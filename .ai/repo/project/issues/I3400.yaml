  - "site/data/generated/context.json"
  - "site/data/generated/source.json"
  - "site/data/generated/plan.json"
  - "site/data/registry/registry.json"
  - "docs/generated/artifacts.json"
  - "docs/generated/artifacts.md"
  - "docs/generated/artifacts.yaml"
  - "docs/generated/graph.json"
non_scope:
  - "Any Rust change"
  - "The paste guard in intents.propose (I3401)"
  - "An examples/ file beside the skill"
  - "Editing .ai/repo/workflows/task-lifecycle.md, which the unpushed promote-a-workspace branch also edits"
  - "Naming promote-a-workspace in related before that skill is on master"
serves:
  - "a-brief-is-reconciled-into-the-plan#a-decomposed-paste-passes-the-plan-checks"
acceptance_criteria:
  - "Precondition: the planning branch docs/the-chatgpt-project-is-promoted, carrying this program and the critique reviewed against the three new criteria, is on master, and majordomus intent preflight for this issue passes from a branch of master"
  - "majordomus skills check passes and refuses nothing about decompose-a-brief: the front matter has only skill/v1 keys, the id equals the directory, the three required sections are non-empty, and the description differs from every other skill's"
  - "majordomus skills verify exits 0 and majordomus skills explain decompose-a-brief lists tests/skills.rs and case 391 as naming tests and .ai/repo/workflows/plan.md as an invocation"
  - "The procedure names only commands and files that exist on master or names the issue that adds them (I3169 campaign add, I3168 campaign references, I3251 and I3254 drafts and duplicates), and names no provider or provider tool"
  - "Step 2 defines the canonical byte form (whitespace trimmed at both ends, exactly one trailing line feed), routes an exchange between speakers and an AI assistant's answer to a workspace reference or to the person, stops on a credential or personal data, and regenerates the campaigns manifest with the command campaigns-check prints"
  - "Step 9 announces only the issue the decomposer takes, and offers the rest by a handover with no scope claim"
  - "majordomus generate --check and scripts/generate-site-data --check are clean after the regeneration"
validation:
  - "majordomus skills check"
  - "majordomus skills verify"
  - "cargo test -p majordomus-cli --test skills"
  - "bash test/run.sh 391_skills_are_proven_capabilities"
  - "majordomus intent validate"
  - "majordomus generate --check"
  - "scripts/generate-site-data --check"
evidence_required:
  - "test_the_decompose_skill_is_a_proven_capability"
