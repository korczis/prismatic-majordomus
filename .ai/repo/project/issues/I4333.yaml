  - "Given a recorded forge observation in which the pull request is MERGED with that head, the proof names the pull request and its merge commit"
  - "A squash-merged issue whose completed_at commit cannot be found resolves its release through the landing commit and does not read UNRELEASED"
  - "The same fixture with `landing: merge` gives byte-identical output to the output before the change"
  - "An unmerged branch reads not landed under both values"
  - "Before the change the case fails on the cleanup listing, which omits the squash-merged branch"
