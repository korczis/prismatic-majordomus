id: I4334
milestone: one-kit-on-every-surface
title: "The UI kit is checked by one capability: design kit judges a repository's interface against the Flowbite Pro profile, and design kit adopt declares it"
slug: the-ui-kit-is-checked-by-one-capability
priority: p1
profile: implementation
parallel_safe: true
objective: "A typed, read-only capability design.kit (CLI majordomus design kit [--check] [--repo PATH], MCP majordomus_design_kit; no HTTP route, as its evidence input names a file the process opens) judges a repository's tree against the kit profile share/design/kits/flowbite-pro.yaml, which holds markers only and no Pro source: S0 has a UI, S1 the flowbite (or flowbite-react) dependency, S2 the Tailwind 4 @plugin and @source or the Tailwind 3 config with no Play CDN or CDN-only Flowbite, S3 Flowbite JS behind every data-drawer, dropdown, modal, tabs, collapse and tooltip attribute with no re-implementation, S4 no other kit with Alpine reported, S5 the Pro shell on every root layout. Each finding is {signal, path, evidence, remedy}; the policy side is the ui block I4336 declares, ui.kit naming the profile and ui.exempt holding exemptions of exactly {path, because}, and the exit is 0 when clean or without a UI, 10 for a finding under --check and 2 for a bad policy. design kit adopt flowbite-pro writes the rule project.ui-uses-flowbite-pro from share/design/kits/flowbite-pro.rule.md, ui.kit and the design-kit and design-kit-on-push enforcement entries, idempotently."
why: "On 2026-10-28 the owner ordered that every project with a user interface is built on their licensed Flowbite Pro, documented, enforced, back-propagated and verified. The audit that day found free Flowbite with hand-rolled shells, the Tailwind Play CDN, daisyUI, Preline, TW Elements and shadcn/Radix mixed in, and drawers wired by hand (this repository's own site/nav.js), and the only check was a scanner on one machine that a CI or a pre-push hook cannot require. ADR 0230 records that Pro is adapted onto Tailwind 4 and Flowbite 4 and that a brand's colour is the primary scale."
current_state: "On 81ef931a3e1 the design module answers only for this tool's own design (design.system, design.tokens, design.explain, design.contrast); no capability judges a repository's UI kit; no project rule names Flowbite Pro; the policy schema has no design_kit block; the owner's skill carries verify.mjs, which checks dependencies and the rule file only."
desired_state: "crate::design::kit is a pure judge over a tree with a unit test for every signal, the vacuous pass, exemptions and the marketing shell; design.kit and design.kit.adopt are declared once in capability/builtin/design.rs and projected by majordomus generate; share/design/kits/ holds the profile, with its wiring, usage and licensed markers, and the rule template, whose last section 'In this repository' is the repository's and is never overwritten by a later adoption; S0 finds published pages and cuts the tree into surfaces (the root, every declared workspace, every nested app), each passing S1 to S3 only with usage in its own files; a licensed marker (a Pro distribution directory, a manifest named after a Pro product, a Pro package among a manifest's dependencies) the design licence does not decide as active is a finding no exemption moves, through licence_answer, which calls I4336's design::licence library function and maps its verdict (active and inactive pass through, refused stays refused, not_judged or no answer is undecided); the policy is read only through policy_block from I4336's ui block, ui.kit and ui.exempt [{path, because}], with the layouts, the role aliases and the marketing layouts the profile's alone, and the policy schema is I4336's; nothing under examples or fixtures counts, a Mix project included; a submodule or a nested repository is named in a notice and judged in its own repository; ADR 0230 is proposed; case 4334 proves each signal by mutation in a disposable repository. This repository does not adopt the rule in this issue: its site would fail S3 and S5 today, and adoption here is a later slice."
scope:
  - "apps/majordomus-cli/src/design/kit.rs"
  - "apps/majordomus-cli/src/design/mod.rs"
  - "apps/majordomus-cli/src/capability/builtin/design.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/src/commands/design.rs"
  - "apps/majordomus-cli/src/commands/mod.rs"
  - "share/design/kits"
  - ".ai/repo/adrs/0230-flowbite-pro-is-adapted-onto-tailwind-4.md"
  - ".ai/repo/project/issues/I4334.yaml"
  - "test/cases/4334_the_ui_kit_is_checked_by_one_capability.sh"
  - "docs/DESIGN_SYSTEM.md"
  - ".ai/repo/features/interfaces.md"
  - "apps/majordomus-cli/src/capability/builtin/mod.rs"
  - "apps/majordomus-cli/src/design/licence.rs"
  - "apps/majordomus-cli/src/commands/design_licence.rs"
  - "bin/majordomus"
acceptance_criteria:
  - "majordomus design kit --check exits 0 in a repository without a UI and in a conformant one, 10 when any one signal's marker is removed, and 2 for an exemption without a because"
  - "Every finding carries signal, path, evidence and remedy, and every exemption is listed with its reason and how many findings it covered"
  - "majordomus design kit adopt flowbite-pro writes the rule, ui.kit in the policy's ui block and both enforcement entries, writes no design_kit key and no exemption, and a second run reports every file unchanged"
  - "The profile and the rule template carry no Pro source file"
  - "A published page is an interface; a workspace or nested app that is wired and uses the kit in none of its own files is a finding; a manifest that is no surface is a notice"
  - "A licensed marker the design licence does not judge (a public tree with a kit adopted, a UI and no evidence) is an undecided finding an exemption does not move, and one in a tree that adopts no kit is unlicensed"
  - "A Mix project under examples or fixtures is no surface and adds nothing to S4 or the stacks; a submodule or a nested repository is named in a notice; a script key named like a Pro product is no licensed marker; another object's .plugin() or .content() does not configure flowbite-react; an unrelated template beside layouts.ex supplies no shell"
  - "A second adoption keeps the rule's section 'In this repository' as the repository wrote it"
  - "design.kit has no HTTP route, so no HTTP caller names a file its evidence input opens; the launcher routes design kit and design licence through mj_fleet_design_judge when a MAJORDOMUS_KIT_EVIDENCE_<KIT> variable is exported"
validation:
  - "cargo test --lib design::kit"
  - "cargo test --test cli_examples --test cli_docs"
  - "test/run 4334"
  - "cargo test --lib design::licence"
  - "bin/majordomus plan validate"
evidence_required:
  - suite
risk: "The signals read markers in text, not a rendered page: a shell assembled at run time from components the profile does not name reads as missing. The remedy is an exemption with its reason under ui.exempt, which keeps every exception visible, or the layout's shape added to the profile; a profile that grows too many alternatives would stop meaning anything, so additions go through the profile and its tests."
