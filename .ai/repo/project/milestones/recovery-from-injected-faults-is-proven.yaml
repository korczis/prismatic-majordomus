id: recovery-from-injected-faults-is-proven
title: "A killed worker, a cut connection and a conflict are injected on purpose, and recovery is proven without lost work or duplicate completion"
slug: recovery-from-injected-faults-is-proven
order: 208
priority: p1
problem: "T5 of the owner's report of 2026-10-19 asks to kill a worker, cut a connection and cause a conflict, then prove recovery without loss or duplicate completion of work. The mesh lab proves the mesh layer recovers (test/mesh-lab/run scenarios claim_conflict, network_partition, process_crash_recovery), but no scenario holds a task, and nothing counts completions per issue or checks that a task's commits survived. Recovery of the record stores is covered by case 135, but not as a work-level trial."
outcome: "A conservation reading counts completions per issue, unreachable commits, stranded claims and multiply-consumed handovers; the T5 protocol registers three fault kinds; mesh lab scenarios and live single-host trials inject them; the T5 row publishes every trial."
current_state: "test/mesh-lab/run:187-245 runs scenarios on claims, handovers, partition and crash, each judged by scripts/ci/mesh-lab-evidence and case 414. apps/majordomus-cli/src/mesh/state.rs:274 and :313 say consumed_by keeps two workers from both resuming a handover; mesh/handover.rs:15 says materializing the same handover twice writes one file. share/events.yaml:152-158 declares session.recovered. I3198 (lease-based assignment that returns when its lease is lost) is BLOCKED at p3 and is not on master."
desired_state: "economics tasks carries a conservation section; T5 trials are committed for each fault kind; the mesh lab's evidence includes the work-level scenarios."
scope:
