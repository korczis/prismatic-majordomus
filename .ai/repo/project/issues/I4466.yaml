acceptance_criteria:
  - "Case 4466, with one mesh runtime over a fixture repository whose branch feature has head H1 over trunk base B1: a review requested with subject feature records head H1 and base B1, and an answer records head H1 and base B1; mesh state shows the review `current`"
  - "Case 4466: after a commit on feature (head H2), the same review reads `stale: head moved` naming H1 and H2; after the trunk advances and is merged into feature, it reads `stale: base moved`"
  - "Case 4466: an answer stating a head that differs from what the runtime resolves for the subject is refused, naming both commits, and nothing is written to the journal"
  - "Case 4466: a ReviewAnswered event without the new fields (written as a runtime of today writes it) reads `unbound`, and one whose subject the runtime cannot resolve reads `unknown` with the reason; neither reads `current`"
  - "Case 3051 passes with the new fields listed as clear in .ai/repo/ci/mesh-event-fields.yaml"
  - "Before the change, case 4466 fails at its first assertion"
