acceptance_criteria:
  - "One function computes now and next; plan.flight answers from it and no other module computes a now or a next (a grep for a second derivation in plan.rs, capability/builtin/plan.rs and lib/plan.sh finds none)"
  - "plan.roadmap's answer carries no now and no next, and majordomus generate --check passes with its regenerated projections"
  - "/ui/roadmap, the Overview and the observatory name the same now and next as plan.flight on one fixture; a fixture where plan.roadmap's old rule and plan.flight disagree shows only plan.flight's pair on every one of them"
  - "A next whose prerequisites are all done is not captioned as coming after the milestones in flight; a next that waits on a milestone in flight is"
  - "With nothing in flight, every surface says nothing is in flight and none names the plan's first open milestone as now"
