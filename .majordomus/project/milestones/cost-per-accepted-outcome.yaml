id: cost-per-accepted-outcome
title: Cost per accepted outcome, only on measured data
slug: cost-per-accepted-outcome
version: "0.4"
order: 40
priority: p2
problem: "Cost per token is not a useful unit of work. The unit that matters is what an accepted outcome cost, and that cannot be computed without both telemetry and an acceptance record."
outcome: "The cost of an accepted outcome is computed from measured telemetry and the finish contract that accepted it, and is reported only where both exist."
current_state: "Not started, and not startable: it needs execution telemetry underneath it."
desired_state: "A completed, accepted task can state what it cost, from measurement rather than estimate."
scope:
  - lib
non_scope:
  - Any figure derived from elapsed time or token count as a proxy for progress
acceptance_criteria:
  - Cost is reported only for outcomes that were accepted by the finish contract
  - An outcome without telemetry reports no cost rather than a modelled one
  - The denominator is a real acceptance, never a count of sessions
validation:
  - bash test/run.sh
evidence_required:
  - suite
depends_on:
  - execution-telemetry
claims:
  - cost-per-outcome
risks:
  - "Accepted outcomes are rare enough early on that the number is noisy; it must say so."
created_at: 2026-09-04
updated_at: 2026-09-04
