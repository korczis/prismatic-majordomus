id: a-prompt-reaches-the-work-it-serves
title: "A captured prompt is matched to its existing intent and recorded on the task that follows, joined to its outcome and evidence, shown on /ui and the Cockpit, read only on its own machine and never published"
slug: a-prompt-reaches-the-work-it-serves
order: 211
priority: p1
problem: "Provider hooks archive prompts and draw episode boundaries, but they reconcile nothing. A prompt is matched to no existing intent: intents.propose refuses only an existing id (apps/majordomus-cli/src/capability/builtin/intents.rs:585-591), and the primary checkout holds untracked intents whose ids are slugs of pasted prompts. Dedup checks the bare prompt id over today's files only, with no lock (lib/capture.sh:563-570). No task records the prompt it followed (lib/start.sh:158-160), and no Rust code reads the archive. Every read is served to a caller beyond loopback (capability/model.rs:708-710, ADR 0126). The snapshots reach gh-pages after the privacy gates have run (.github/workflows/pages.yml:479-481 before the snapshot steps)."
outcome: "The first vertical slice of the pack, with the privacy gates landed before the first reader of the prompt archive: UserPromptSubmit, then capture with a namespaced idempotency key, a deterministic match against existing intents, the task that records the prompt it followed (the validated state change, through the task lifecycle that owns it), that task's outcome and verify command, the evidence state of the criterion it serves, and the matched intent's knowledge on /ui/idd and the Cockpit, pushed on the live channel."
current_state: "Capture is verified: .claude/settings.json wires UserPromptSubmit, and lib/capture.sh redacts before any write. devcontext/select.rs scores term share with named terms. The I2789 standing panel on /ui/idd shows each unmet criterion with its evidence state and serving issues (landed, ui/idd.rs). I3251 plans the brief and I3254 the duplicate refusal at proposal. I3220 plans frames for writes made through capabilities. None of the issues below has landed."
desired_state: "I3406, I3434, I3432, I3408, I3411, I3433, I3435, I3409 and I3430 have landed, each as one pull request, each reusing the capture archive, the ledger, the task lifecycle, devcontext, intents.binding, the entity relations, ADR 0126's remote refusal and the snapshot exporter."
