acceptance_criteria:
  - "majordomus design kit --check reports zero S5 findings for /ui, /cockpit and the site"
  - "A test removes a screen from the registry and finds it gone from /ui's navigation, and adds one and finds it there, with no edit to a hand list"
  - "Every /ui and /cockpit page is served by the one frame function, read by the ui-shard probe at every width it visits"
  - "The site's base.html renders the Pro navbar and footer at every width the site probe visits"
validation:
