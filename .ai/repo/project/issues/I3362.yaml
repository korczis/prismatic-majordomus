id: I3362
milestone: a-foreign-repository-is-adopted-and-measured
title: "Candidate repositories are measured against the registered floors and admitted or refused before any of them is installed into"
slug: foreign-candidates-are-admitted
priority: p0
profile: docs
objective: "Measure at least three candidates against the registered floors and record each in .ai/repo/benchmarks/trials/t1-external-onboarding/candidates.yaml as admitted, refused or awaiting_consent, with every measured value, its command, the adopted commit in the form its basis allows, and the basis. At least one candidate is a public third-party repository in a language other than Rust or shell under a licence permitting a local clone and published measurements. The owner's pre-Majordomus repositories may be candidates only at the parent of their first Majordomus commit and only with the owner's decision that they count."
why: "T1 of the owner's report of 2026-10-19. Admission before any run keeps the choice independent of the results."
current_state: "No candidate is recorded. The owner's two adopted repositories carry Majordomus at HEAD, so only a pre-adoption commit could qualify."
desired_state: "The file lists every candidate considered, refused ones included."
scope:
  - ".ai/repo/benchmarks"
non_scope:
  - "Installing into any candidate"
  - "Recording consent on the owner's behalf"
depends_on:
  - "I3360"
serves:
  - "the-product-proves-it-pays#a-foreign-repository-is-admitted-before-it-is-adopted"
acceptance_criteria:
  - "At least three candidates are recorded with every measurement and its command"
  - "At least one admitted candidate is a third-party public repository with its licence named"
  - "A candidate without a basis is recorded in redacted form only"
  - "The file passes the I3360 candidate check"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test economics"
  - "majordomus plan validate"
evidence_required:
  - "foreign_candidates_recorded"
created_at: 2026-10-19
updated_at: 2026-10-19
