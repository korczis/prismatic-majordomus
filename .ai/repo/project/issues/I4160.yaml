why: "The ask is in campaigns/majordomus-observatory-ultimate-prompt-pack/contracts/01-EVIDENCE-LINEAGE-AND-TRUTH.md and campaigns/majordomus-observatory-ultimate-prompt-pack/contracts/05-REAL-DATA-ADMISSIBILITY.md, which the owner handed over; no plan record covered it when the packs were audited on 2026-10-23. The owner ordered on 2026-10-23 that every unfinished pack is part of the mesh's zero goal."
current_state: "Measured on master 575d39f8d24: apps/majordomus-cli/src/ui/observatory.rs defines SCENES and REDIRECTS and the functions project, project_from and event_marks; docs/MAJORDOMUS_UI.md describes fifteen scenes; case 3011 asserts the Observatory draws nothing it did not read, but no case reads a per-signal lineage or a class vocabulary."
desired_state: "Every drawn mark can be traced to the record ids and transform it came from and states its class; a signal without lineage is refused with a visible reason."
