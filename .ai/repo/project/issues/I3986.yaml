id: I3986
milestone: one-click-implement
title: "An implement execution ends by running the issue's validation in its worktree and recording the evidence, so done means verified and never delivered"
slug: an-implement-execution-ends-with-its-evidence
priority: p0
profile: implementation
objective: "Add a final step verify to implement.issue: after the worker exits successfully, run the issue's declared validation commands in the execution's worktree, record the result through majordomus evidence record against the issue's evidence_required, and end Succeeded only when every required piece of evidence is recorded and passing, otherwise Failed naming the missing or failing piece; the execution's view says done (verified) and never delivered."
why: "Owner's P0 DoD ends with 'a testable result with evidence'; ADR 0225 decision 6 separates done from delivered."
current_state: "Evidence is recorded by hand or by CI; no execution records it."
desired_state: "The execution that implemented an issue is the one that proves it, in the same worktree, with the evidence linked from its view."
scope:
  - "apps/majordomus-cli/src/capability/builtin"
  - "apps/majordomus-cli/src/evidence"
  - "apps/majordomus-cli/src/execution"
  - "apps/majordomus-cli/tests/issue_implement.rs"
non_scope:
  - "Pushing, opening a PR, CI, merge or release (P2)"
depends_on:
  - "I3983"
serves:
  - "an-issue-is-implemented-from-one-click#the-loop-is-walked-across-a-restart"
acceptance_criteria:
  - "A worker success whose validation fails ends the execution Failed naming the failing command"
  - "Missing required evidence ends it Failed naming the missing piece"
  - "Success records the evidence and the view links it, labelled done, not delivered"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test issue_implement"
evidence_required:
  - "apps/majordomus-cli/tests/issue_implement.rs"
created_at: 2026-10-23
updated_at: 2026-10-23
