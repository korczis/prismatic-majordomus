  - "Of two READY issues equal in milestone, wave and priority, the one that unblocks more comes first in plan.next, majordomus plan next and proceed.plan"
  - "Adding a dependency to the plan changes the order and the reason, and a shared downstream issue is counted once"
  - "The shell and Rust engines answer the same next issue on every plan case 99 compares"
validation:
