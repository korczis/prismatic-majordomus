objective: "Run plan.drift on the trunk and, for every merged_not_recorded issue, either record it through plan verify|evidence|done with evidence actually run, or record why it is not done (a slice) by narrowing the issue or opening its remainder as a new issue; then make the drift gate blocking."
why: "ADR 0166, consequence 3. On 2026-10-16 at least I2653, I2417, I2652, I2734, I2601, I2288, I2289 and I2735 had merged pull requests naming them while not DONE; a blocking gate over them would turn the trunk red at once."
