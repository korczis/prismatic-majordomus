id: the-host-knows-its-runtimes
title: "A host knows every Majordomus runtime it runs, with no project open"
slug: the-host-knows-its-runtimes
order: 171
priority: p3
problem: "On 2026-10-12 the owner asked for a tiny host-level service that coordinates several Majordomus versions on one machine, keeps the mesh healthy and self-updates. Every server today is one checkout's (ADR 0035); nothing answers for the host, and two versions on one machine are found only by knowing their checkouts. Decided in ADR 0199, amended into Majordomus Fabric's opt-in host agent and accepted by the owner on 2026-11-25 (PR #3123); the agent itself is milestone fabric-local-pilot. Sources: chatgpt-majordomus:c240#0, chatgpt-majordomus:c240#2, chatgpt-majordomus:c240#5."
outcome: "A read-only host inventory first, derived from the leases every checkout already writes; a routing answer second. A hub's service is the declared deployment target of the-hub-is-reached-from-any-device, and this milestone builds no resident: Fabric's opt-in host agent is fabric-local-pilot's, and this inventory needs no process of its own."
current_state: "On 2026-11-25 the owner lifted this milestone's dependencies on runtime-lifecycle and safe-self-update so that I3184, a read-only inventory, can start (see evidence owner_lifted_dependencies); I3184 is in flight on branch feature/I3184-host-runtime-inventory. Verified: per-repository server listing exists (majordomus server); leases live under each checkout's .ai/local/state; README and ADR 0003 say Majordomus is not a daemon; hubs nevertheless run as a systemd user unit on lundra (docs/MESH.md 'The hubs as services')."
desired_state: "majordomus runtimes (host scope) answers with no checkout open; side-by-side versions are routed by negotiated capability; a resident exists only by decision."
