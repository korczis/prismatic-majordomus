id: I4598
milestone: a-second-adopter-is-served
title: "A long-running process a session leaves running is declared and guarded by the machine's disk floor: stopped through its own process group below the floor, resumed above a higher mark, each change an execution event the brief reads"
slug: a-long-running-process-is-guarded-by-the-disk-floor
priority: p2
profile: implementation
parallel_safe: true
serves: []
objective: "A repository declares the long-running local processes its sessions start: a name, an executable and argument list, a working directory, an environment file path, the signal that stops it cleanly, a grace before that signal escalates, a free-space floor below which it stops, a higher resume mark and the interval free space must stay above it before a resume. The checkout's server runs each one as an executable and argument list (never a command string), watches the free space of the volume it writes to with the measurement the build floor already uses, signals the process group it started (never a process found by name) when free space falls under the floor, and starts it again once free space has stayed above the resume mark for the declared interval. Every start, stop, exit and resume is an execution event, so `majordomus executions` and `majordomus brief` show it."
why: "Observed on 2026-11-14/15 in a client adopter (a service repository, not named here by policy). A long-running worker ran for days on a shared Mac while other sessions built. A hand-written shell guard stopped it four times in about 20 hours when free space fell under 3 GiB. Each stop was clean, and each restart was a manual step taken after reading df by hand, so the work fell behind in between. The hand-written guard failed twice by itself. One version waited on a process-name pattern that matched other sessions' processes. Another ended after 20 s while the worker still ran, because zsh does not split a variable holding several pids into words. Every adopter that keeps a worker running beside agents' builds writes this guard again, and the tool already owns the free-space floor for its own builds."
current_state: "Measured at origin/master 3fcaafac355. The free-space floor exists only for builds. lib/rust_bin.sh:461 and :551 refuse a build below MAJORDOMUS_MIN_FREE_MB (default 5120 MiB), and mesh/build_cache/ensure.rs:54 and :308 (statvfs_free) read the same floor in Rust. I3825 extends the build refusal, I4006 (machine.slot, not built) counts heavy work entering the machine, and I4355 watches free space to announce an emergency on the mesh with a publish/withdraw hysteresis. None of them stops or resumes work that is already running. Executions (execution/mod.rs:1-7) watch a capability call of the registry, not an adopter's program. I4486 (open) plans a typed runner for a bounded run: a mandatory deadline, a kill of the process group at the deadline or on cancel, a refusal of any environment that sets a redacted name, and exposure on the command line only. A service has no deadline, stops on a signal with a grace, reads an environment file that usually carries secrets, and is run by the server, so it shares only the process-group handling with that runner. Nothing declares, supervises or resumes a process a session left running."
desired_state: "A policy entry under `machine.services` (name, argv, cwd, env_file, stop_signal, grace_seconds, floor_mib, resume_mib above floor_mib, resume_after_seconds; each typed) lets `majordomus service start <name>` run the process under the checkout's server, in a process group of its own. The environment file is read by path and its values are never echoed into events or logs. Below floor_mib the server signals the process group it recorded, escalates after grace_seconds, and records the exit. Once free space has stayed above resume_mib for resume_after_seconds, it starts the process again. Each transition is an execution event with the free MiB read. `majordomus service status`, `majordomus executions` and `majordomus brief` say each service's state (running, stopped by the floor at <n> MiB, resumed, exited <code>) and when it changed. A service never starts below resume_mib. A server restart re-adopts a running service by its recorded pid and start time, never a second copy."
