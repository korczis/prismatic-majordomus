id: I3207
milestone: delivery-flow-is-measured
title: "A finished task names the pull request that carries its branch and that pull request's disposition"
slug: finish-names-its-pull-request
priority: p2
profile: implementation
objective: "Make majordomus finish report, from the last recorded queue observation, the pull request whose head is the task's branch, its disposition and next action, or that no pull request carries the branch yet, so the work a worker hands to the landing seat is named at the moment it is handed."
why: "The 2026-10-10 queue pack asked that a session's finish name the candidate it created, its disposition and its next action (c209#3). Under ADR 0167 a worker hands its green head to the landing seat; today that hand-off is prose on the board. Sources: chatgpt-majordomus:c209#3."
current_state: "lib/finish.sh judges the task's own scope, obligations and verification and says nothing of pull requests; integration.queue knows each open pull request's head branch and disposition."
desired_state: "finish prints one line 'pull request #N: <disposition>, next: <action>' or 'no pull request carries <branch>; push it and open one', read from the recorded observation with its age, never from the network; the handover body carries the same line."
scope:
  - "lib/finish.sh"
  - "apps/majordomus-cli/src/commands/prs.rs"
  - "test/cases"
  - "docs/INTEGRATION.md"
non_scope:
  - "Opening or pushing from finish"
  - "Refusing finish on a disposition"
serves:
  - "finished-work-reaches-a-verified-release#finished-work-names-its-landing"
acceptance_criteria:
  - "A task whose branch heads an observed pull request names it with its disposition and the observation's age"
  - "A task whose branch no pull request carries says so"
  - "A checkout with no observation says the queue is unobserved"
validation:
  - "bash test/run.sh 06_finish"
  - "majordomus plan validate"
evidence_required:
  - "case_finish_names_its_pull_request"
created_at: 2026-10-18
updated_at: 2026-10-18
