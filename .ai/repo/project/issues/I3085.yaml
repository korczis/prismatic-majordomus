id: I3085
milestone: public-proof
title: "An article explains how a doubt is settled in both languages: by an experiment, not a count"
slug: a-doubt-is-settled-by-an-experiment
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/a-doubt-is-settled-by-an-experiment.md, an English article on how a session settles a material engineering uncertainty (ADR 0098). It covers why a decision made silently cannot be audited and why advice pasted into a chat is lost, the assessment and the evidence its writer requires, the review budget a policy computes, advisors as optional capabilities whose absence is state, the structured local review, a disagreement settled by an experiment and never by a count, the conclusion whose review count is computed, how the records reach the next session, and what the protocol does not do. Its example is the doubt weighed on 2026-10-21 that docs/RELEASE.md records. Every statement is one that ADR 0098, rules project.advisors-are-optional and project.review-is-recorded-not-claimed, docs/REASONING.md, docs/RELEASE.md or the reasoning code on master states, and no count is typed by hand. site/content-src/pochybnost-rozhodne-experiment.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the plan-critique, continuity and mesh articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. How a session decides under uncertainty, with evidence first and advisors optional, was explained only in docs/REASONING.md and ADR 0098, which are written for the sessions that follow them."
current_state: "No article explains how a doubt is settled. The article groups relate each other, and none of them names it."
desired_state: "/a-doubt-is-settled-by-an-experiment/ and /pochybnost-rozhodne-experiment/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 passes, with the translation at its source's digest."
