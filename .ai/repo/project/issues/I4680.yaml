  - "docs/generated/registry.yaml"
  - "test/cases/4680_stale_topology_judges_the_pushers_own_holdings.sh"
non_scope:
  - "Uncommitted work in a worktree being named: I1995"
  - "Reclaiming a finished worktree's build output: I4324"
  - "A stale task read as active: I4416"
  - "Deleting a holding without first keeping it in a rescue ref and a verified bundle"
depends_on: []
acceptance_criteria:
  - "Case 4680 holds the pusher's branch, two other branches and an orphan dirty worktree: the pre-push check refuses only while the pusher's own branch is stale, and lists the others without refusing"
  - "The rescue command turns the orphan worktree into a refs/rescue/ ref and a bundle that `git bundle verify` accepts, removes the worktree, and pushes nothing (the remote's refs are unchanged)"
  - "Negative control: the case's first assertion fails against master, where the other holdings refuse the push"
validation:
