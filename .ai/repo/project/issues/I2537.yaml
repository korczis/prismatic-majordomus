id: I2537
milestone: the-ui-starts-work-through-the-executor
title: "A capability's inspector on the UI starts it as an execution, from the one form both surfaces share"
slug: a-capability-is-started-from-the-ui
priority: p1
profile: implementation
parallel_safe: false
objective: "Let a person start a capability from the primary surface: the capability inspector on /ui draws the form generated from the capability's input schema, the form posts to the route the registry declares for executions.start, and the person lands on the execution's inspector. The form builder is the Cockpit's, moved to a module both surfaces import."
why: "campaigns/majordomus-intent-driven-ui-prompt-pack/02-ACTION-PLANE.md asks that the UI execute every authorised capability through the same handler, validation and effect policy as the command line and MCP, that a safe form be derived from the input schema, and that a disabled action explain why. campaigns/majordomus-intent-driven-ui-prompt-pack/04-UI-PROJECTIONS.md asks for schema-generated forms on the Capabilities view. The mechanism exists once, in the Cockpit: runner_form and field in apps/majordomus-cli/src/cockpit/pages.rs, with share/cockpit/runner.js asking for confirmation when the descriptor's effect says something changes. ADR 0135 says shared mechanics move to a module both surfaces import and are not duplicated, and ADR 0142 and project.no-screen-waits-for-a-source forbid a UI page from calling a handler, so the UI's control must post to the API route and the UI's own routes must stay reads."
current_state: "apps/majordomus-cli/src/ui/capabilities.rs draws one capability from capabilities.describe with its interfaces and no form. apps/majordomus-cli/src/ui/mod.rs answers 405 to every method but GET, and apps/majordomus-cli/tests/ui_surface.rs (the_ui_is_a_public_surface_and_answers_only_reads) holds that. share/ui/ui.js sends no POST. The form builder is private to cockpit/pages.rs and reads the registry type Capability directly."
desired_state: "One module builds the runner form from a capability's description for both surfaces. /ui/capabilities?id=<id> draws it under an anchor other screens can link to. Submitting it posts the capability id and the input to the route capabilities.describe gives for executions.start, with confirmation when the effect says something changes, and follows the answer's link to /ui/command?execution=<id>. A capability that is not executable, has no HTTP exposure or is refused for this caller shows the reason in place of the control. With scripts off the inspector shows the command line and the route, and no button. The snapshot draws no form."
