id: I3601
milestone: surfaces-never-disagree
title: "The UI draws the trains of stacked pull requests, linked and explained"
slug: the-ui-draws-the-trains
priority: p1
profile: implementation
parallel_safe: true
objective: "/ui/trains draws integration.trains: every train in landing order with the next to land marked, each pull request leading to the forge, its checks and the PR Drain's detail of it, prose that says what a train is and who lands it, and a legend whose meanings are the integration model's own doc comments."
why: "On 2026-10-19 the owner asked for the browser's mesh, trains and lanes to be linked, readable and explained; no screen of majordomus ui named a train, which only the Cockpit drew."
current_state: "Trains are drawn at /cockpit/trains only; the UI's navigation has no trains screen."
desired_state: "/ui/trains is a screen of the UI's navigation, derived from integration.trains and the model's vocabulary, with three tests and a row in docs/MAJORDOMUS_UI.md."
scope:
  - "apps/majordomus-cli/src/ui/trains.rs"
  - "apps/majordomus-cli/src/ui/mod.rs"
  - "docs/MAJORDOMUS_UI.md"
  - ".ai/repo/project"
depends_on: []
acceptance_criteria:
  - "A train is drawn in landing order, every pull request leading to its page, its checks and its PR Drain detail, the next to land marked"
  - "Every disposition and lane on the screen is explained by the model's own words"
  - "No observation is said with its reason, never drawn as no trains"
validation:
  - "majordomus plan validate"
  - "cargo test --lib ui::trains"
  - "scripts/ui audit --only /ui/trains"
evidence_required: []
