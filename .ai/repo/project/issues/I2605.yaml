id: I2605
milestone: a-second-adopter-is-served
title: "Every record with a Markdown body has a rendered page in the UI, with its diagrams"
slug: every-record-body-is-a-rendered-page
priority: p1
profile: implementation
parallel_safe: true
objective: "Give every indexed kind that carries a Markdown body a list and a page in the UI, rendered by the one renderer, with diagrams drawn, and hold it with a case."
why: "Observed on 2026-10-13 adopting 0.21.0 and 0.22.0 in a pnpm/TypeScript repository (docs/ADOPTION_SECOND_RUN.md, G20); read again on master e506c041a4. The adopter's 53 ADRs and 76 knowledge records were reachable only through /api/v1/objects. The UI has 13 screens and none for an ADR, a knowledge record, a skill, a use case, a session or a document; a rule's body is not shown."
current_state: "On master no Markdown parser is in the crate and the Cockpit object page shows a body as preformatted text. #1050 (ADR 0148, conflicting) adds apps/majordomus-cli/src/markdown.rs and calls it from the Cockpit object page; the UI calls only its inline form and does not load the diagram script."
desired_state: "After #1050 lands: one generic record list and record page in the UI over the index, calling the renderer for the whole body; the vendored diagram script loaded by the UI; the snapshot publishing those pages; the rendered-once case walking every screen that shows a body."
scope:
  - "apps/majordomus-cli/src/ui"
  - "apps/majordomus-cli/src/markdown.rs"
  - "apps/majordomus-cli/src/web/report"
  - "share/ui"
  - "docs/MAJORDOMUS_UI.md"
  - "test/cases"
  - "apps/majordomus-cli/tests"
depends_on: []
acceptance_criteria:
  - "An ADR and a knowledge record of a foreign fixture repository each have a UI page whose body is rendered Markdown"
  - "A fenced diagram in a body is drawn by the vendored script and stays readable source without it"
  - "Every screen that shows a body calls the one renderer, held by the rendered-once case"
  - "The snapshot contains those pages"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "record_pages_render_markdown_case"
  - "every_body_goes_through_the_renderer_case"
created_at: 2026-10-13
updated_at: 2026-10-13
