title: Cross-surface consistency and mutation tests
slug: consistency-and-mutation
priority: p0
profile: debugging
parallel_safe: false
objective: "Prove that the CLI, the generated site data and the GitHub projection describe the same graph, and that changing one canonical dependency changes all of them."
why: "One engine is a claim. A test that compares the surfaces is the only thing that keeps it true after the next change."
current_state: "Each surface was tested on its own."
desired_state: "A case compares the issue set, the READY set and the edge set across surfaces, and a second case mutates a dependency and asserts every surface moved."
scope:
  - test/cases
non_scope:
  - Live GitHub calls in the test suite
