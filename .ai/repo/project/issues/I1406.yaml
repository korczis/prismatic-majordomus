id: I1406
milestone: work-graph-github
title: The plan's derivations are capabilities, so every surface reads the readiness the terminal reads
slug: plan-derivations-as-capabilities
priority: p1
profile: implementation
parallel_safe: false
objective: "Make status, ready, blocked, waves, next and roadmap answerable through the capability registry, so that MCP, HTTP, OpenAPI and the Cockpit read the derived plan rather than only the raw documents."
why: "Issues and milestones are already served as objects: `majordomus://issue/I0001` returns the record. What is not served is everything that makes the model worth having. The derivations live in lib/plan.sh and lib/project.awk, the Rust executable opens `.ai/repo/project/issues/` only to read filenames, and an agent asking the server what to work on next cannot be told."
current_state: "lib/plan.sh, 520 lines, computes the derived states. apps/majordomus-cli/src/worktree/state.rs line 190 is the only place the executable touches the project directory, and it reads the directory listing. There is no plan capability and therefore no plan tool, route or Cockpit page."
desired_state: "The derivations are declared where every other capability is declared and projected by the same generator. The shell keeps its command surface by calling the executable, or the two agree by construction and a test proves they agree."
scope:
  - apps/majordomus-cli/src/capability/builtin
  - apps/majordomus-cli/src
  - lib/plan.sh
  - docs/CAPABILITIES.md
  - test/cases
non_scope:
  - Changing what the derivations mean
  - A second plan implementation that may disagree with the first
depends_on: []
acceptance_criteria:
  - The derivations are declared once and projected to MCP, HTTP and OpenAPI with no transport registry edited by hand
  - The executable and the shell answer identically for every record in this repository, proved by a test that compares them
  - majordomus generate --check is clean after the declaration is added
  - The Cockpit shows the derived plan and its drift
validation:
  - cargo test --workspace --all-features
  - majordomus generate --check
  - bash test/run.sh
evidence_required:
  - derivations_projected
  - shell_and_executable_agree
risk: "Two implementations of one derivation is the failure this repository exists to prevent; the equality test is the acceptance criterion, not a nicety."
created_at: 2026-09-09
updated_at: 2026-09-09
