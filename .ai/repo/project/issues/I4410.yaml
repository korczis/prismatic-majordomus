  - "The landed predicate and a declared landing mode: I4333"
  - "Warning or refusing at evidence time when HEAD is a branch commit and --commit is absent"
  - "The Rust plan.transition capability (apps/majordomus-cli/src/capability/builtin/plan.rs): plan evidence stays a command-line operation there (:27-28)"
  - "The whole-token match of --covers (I4235, #2582), which edits the same function and is merged around, not absorbed"
depends_on: []
serves: []
acceptance_criteria:
  - "Case 4778, in a fixture repository with a bare origin whose refs/remotes/origin/HEAD names main: on a branch two commits ahead of origin/main, `plan evidence <id> --covers <t> --type manual --command x --commit origin/main~1` exits 0 and the entry's commit: is the full 40-hex sha of origin/main~1, not HEAD"
  - "Case 4778: two such records for two issues on the same branch, committed in one commit, both carry their named trunk commits"
  - "Case 4778: `--commit HEAD` on that branch (a commit origin/main does not reach) exits 15, names the commit and refs/remotes/origin/main, and leaves the issue file unchanged"
  - "Case 4778: an unknown revision exits 2 (usage); a shallow clone and a repository without refs/remotes/<remote>/HEAD each exit non-zero with a message naming why the commit cannot be judged, and write nothing"
  - "Case 4778: without --commit the entry records HEAD exactly as before (the bytes of the record are compared with the current output)"
  - "Case 4778: the plan_evidence ledger event carries the recorded commit and source named or head"
  - "`plan --help`, docs/PLANNING.md and docs/CLI.md document --commit and its refusal"
  - "Before the change, case 4778 fails at its first assertion"
validation:
