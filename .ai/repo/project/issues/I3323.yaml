id: I3323
milestone: a-provider-carries-the-contract-natively
title: "An unclaimed edit is refused in Claude Code once no live peer edits without a claim"
slug: unclaimed-edits-are-refused
priority: p2
profile: implementation
objective: "Switch the edit guard from advisory to refusing through .ai/repo/policy.yaml once the claim-coverage report of I3322 shows no live peer editing without a claim, and prove an unclaimed edit is refused through the generated Claude Code configuration."
why: "The rollout the 2026-10-18 critique required: refusal turns on in a separate, later change than the wiring, because .ai/repo/policy.yaml sets edits_require_claim: true and a dozen concurrent sessions edit this repository, most without a live mesh claim. Split from I3300 by the 2026-10-18 verification. Governed by ADR 0214. Sources: chatgpt-majordomus:c174#18, chatgpt-majordomus:c193#1."
current_state: "After I3322 the guard is wired and advisory; case 3069 proves the guard's judgement alone."
desired_state: "An unclaimed Edit through the generated configuration is refused with the guard's message, and a claimed one passes."
scope:
  - ".ai/repo/policy.yaml"
non_scope:
  - "Judging Bash-tool writes at edit time"
  - "Wiring the guard (I3322)"
depends_on:
  - "I3322"
serves:
  - "a-provider-carries-the-contract-natively#unclaimed-edit-refused"
acceptance_criteria:
  - "Refusal is enabled only with a dated claim-coverage report that shows no live unclaimed editor, cited in the change"
  - "A case pipes a Claude Code PreToolUse payload through the command the generated .claude/settings.json names; it is refused for an unclaimed path and admitted for a claimed one"
  - "The change is announced on the board and the mesh before it lands"
validation:
  - "bash test/run.sh 3069_an_edit_no_claim_covers_is_refused"
  - "majordomus plan validate"
evidence_required:
  - "case_an_unclaimed_edit_is_refused_through_the_generated_settings"
created_at: 2026-10-18
updated_at: 2026-10-18
