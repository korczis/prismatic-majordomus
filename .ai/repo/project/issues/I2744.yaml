id: I2744
milestone: truthful-plan-surfaces
title: "The UI roadmap reads delivery and the releases themselves, and its now is where work is"
slug: the-ui-roadmap-reads-delivery
priority: p0
profile: implementation
parallel_safe: true
objective: "Make /ui/roadmap (apps/majordomus-cli/src/ui/roadmap.rs) show each issue's inferred stage from plan.delivery beside its declared status, derive Now as the milestones with work in flight (open pull requests, mesh claims, ACTIVE) and Next from the graph, and read the latest release from the releases (tags and the published latest.json) at the moment it renders, so a snapshot never shows an older release than the executable that drew it."
why: "ADR 0166 decision 4. The 07:15Z snapshot of 2026-10-16 said Latest release 0.26.0 under a 0.27.0 header and Now M002, a milestone with no work."
current_state: "ui/roadmap.rs reads plan.roadmap, plan.status, intents.list and plan.issues; latest release comes from the committed release records."
desired_state: "The screen and its snapshot state stages with proof links, Now and Next as derived, and the release from the releases; the snapshot test fails on a release older than the drawing executable."
