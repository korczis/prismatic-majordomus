id: I3660
milestone: every-model-call-is-paid-from-a-declared-source
title: "A vendor declares its funding sources in the model catalogue, each with dated, quoted vendor evidence"
slug: a-vendor-declares-its-funding-sources
priority: p2
profile: implementation
objective: "Add a `funding` list to each vendor of share/models.yaml (ADR 0049): each source with an id, a kind (local, credit_grant, subscription or metered), the credential variable that reaches it or a note that a client login does, the period it renews over where the vendor states one, the vendor-domain page where the owner claims it, and evidence (page, day read, the vendor's own words); extend models::Vendor; report a source that cannot be read (no evidence, an unknown kind) as a diagnostic naming the vendor and the source while the rest of the catalogue loads; make reasoning check forbid every declared credential variable in CI, not only the vendor's."
why: "The catalogue knows a vendor's credential variable and nothing about how a call through it is paid, while the vendor's documentation (code.claude.com/docs/en/authentication, read 2026-10-21) shows a subscription seat reached through Claude Code's login or CLAUDE_CODE_OAUTH_TOKEN and API use reached through ANTHROPIC_API_KEY, and the owner's Max plan now includes a monthly credit grant claimed at claude.ai/settings/billing (where clau.de/api-credits redirects, observed 2026-10-21). The grant and metered billing share that one key, so the catalogue names both and states no draw order the vendor does not. reasoning/catalogue.rs loads the same file, so one bad source must not take every advisor down (critique finding new-credential-variables-escape-the-ci-guard)."
current_state: "share/models.yaml declares id, title, inference and credential_env per vendor; no funding source exists; reasoning check collects CI-forbidden variables from vendor.credential_env only."
desired_state: "Every vendor lists its funding sources with vendor evidence, an unreadable source is a diagnostic, models.list shows them, and no field can carry an amount."
scope:
  - "share/models.yaml"
  - "apps/majordomus-cli/src/models/mod.rs"
  - "apps/majordomus-cli/src/reasoning/check.rs"
  - "docs/generated"
  - "share/schemas/generated"
non_scope:
  - "Which sources the owner holds, any amount, cap, price or balance"
  - "Routing by funding source"
depends_on: []
serves:
  - "every-model-call-is-paid-from-a-declared-source#vendor-declares-its-sources"
acceptance_criteria:
  - "Anthropic declares subscription, credit_grant and metered sources and OpenAI its own, each with an evidence page, day and quote; Ollama and LM Studio declare local"
  - "The credit grant's claim page is the vendor-domain page clau.de redirects to, not the shortlink"
  - "A source without evidence, or of an unknown kind, is a diagnostic naming the vendor and the source, and the catalogue's other entries still load (test)"
  - "No property of the catalogue schema is named for an amount, price, balance, cost or currency (test)"
  - "reasoning check forbids a source's own credential variable in CI as it forbids the vendor's (test)"
  - "models.list carries the sources, and majordomus generate --check is clean"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib models::"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib reasoning::check"
  - "majordomus generate --check"
evidence_required:
  - "test_a_funding_source_without_evidence_is_refused"
