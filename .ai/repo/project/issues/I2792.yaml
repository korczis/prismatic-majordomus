  - "test/cases/3191_the_knowledge_base_is_listed.sh"
  - "docs/KNOWLEDGE.md"
  - "docs/MAJORDOMUS_UI.md"
  - "docs/generated"
non_scope:
  - "Any write: the capability and the screen read"
  - "Bumping the version on the feature branch"
depends_on: []
