intent: a-stranger-adopts-it-unaided
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: all 10 findings are planned and none rejected or left open; the 6 blocking ones fall on I3127 (3), I3128 (1) and I3129 (2), and the intent's criteria are re-recorded as evidence: test in the same changes as their cases."
findings:
  - id: criteria-can-never-be-derived
    class: delivery_verification
    subject: "a-stranger-adopts-it-unaided#first-refusal-in-ten-minutes"
    finding: "All four criteria are recorded as evidence: command with ref \"majordomus intent explain a-stranger-adopts-it-unaided\". That ref points at the intent itself, and the real proofs (35NN cases, curated records) appear only as prose inside the criterion text. In apps/majordomus-cli/src/intent.rs:1136-1139 every kind other than test, claim and deployment falls to NotDerivable, and the doctest at intent.rs:318-320 shows that one NotDerivable criterion holds the verdict at Unknown. So no finished work can ever move this intent to Satisfied. ADR 0206 (worktree .ai/repo/adrs/0206-public-outreach-begins-only-after-a-stranger-has-finished-a-firs.md) makes this intent's derived verdict the gate for outreach, so that gate could never open on evidence. 17 of the 18 criteria on master use evidence: test with a case path. Fix: take the case numbers now (scripts/case-numbers / the 3500-3599 block) and record evidence: test with the concrete paths. Land the records and cases together, as the precedent records-fail-intent-validate-until-last-issue in critiques/intent-bound-work.yaml does. Give outside-runs-are-recorded and friction-becomes-a-case a case of their own that counts and checks the outside-run records, rather than plan show."
    blocking: true
    resolution:
      state: planned
      issue: I3127
      because: "Each issue that proves a criterion now re-records it in the same change. I3127 re-records first-refusal-in-ten-minutes, I3128 re-records init-says-what-it-found, and I3129 re-records outside-runs-are-recorded and friction-becomes-a-case. In each case the evidence becomes test with the concrete case path, each case is numbered by `scripts/case-numbers next` and announced on the board at start (no reserved block), and the case lands with the record so the intent verdict can be derived. I3129 gains its own case that counts and checks the outside-run records in place of plan show. Until then the plan records every criterion as evidence: command with its planned proof named in the criterion text and no placeholder case number."
  - id: fixture-release-is-not-the-published-installer
    class: unproven_assumption
    subject: "I3127"
    finding: "The intent's invariant requires the time and the manual steps to be measured 'on a clean machine from the published installer, not from a development checkout'. I3127's non_scope keeps 'the fixture release and origin local', and its case reuses case 1024's fixture. That fixture is this checkout's own build: test/cases/1024_an_installed_release_serves_a_foreign_repository.sh:15,24 runs MAJORDOMUS_DIST_BIN=\"$(rust_bin)\" scripts/release-fixture. So the planned proof measures the development build on a machine that has the toolchain, which the invariant rules out. The published path already exists. .github/workflows/validate.yml:1302-1322 (job install, ubuntu-latest and macos-latest, `install-check --wait 300` against the published site) and .github/workflows/release.yml:602 (smoke `install-check --expect <tag>`) run install-check on clean runners. A first-run stage added to install-check runs in both, and that is the per-platform measurement the milestone's risk asks for. I3127 must name those jobs and their receipts as the criterion's proof, with .github/workflows and .ai/repo/ci/gates.yaml in scope. Keep the fixture case only as the pre-merge regression test. Note also that a scripted run finishes in seconds, so a ten-minute bar applied to it says nothing about a person."
    blocking: true
    resolution:
      state: planned
      issue: I3127
      because: "I3127 now names the install job in validate.yml (ubuntu-latest, macos-latest, against the published site) and the release.yml smoke step as the criterion's proof, each writing a first-run receipt per platform. Those files and .ai/repo/ci/gates.yaml are added to its scope. The fixture case is kept only as the pre-merge regression test, and the local-only non_scope item is narrowed to that case. The scripted bar is recorded as tool overhead per platform. The human ten-minute bar moves to the outside-run criteria that I3129 carries. The plan reflects this now: the criterion text of first-refusal-in-ten-minutes names the per-platform receipts and tool overhead, and the intent gains an invariant that the ten-minute bar is a person's."
  - id: i3213-builds-the-same-install-check-stage
    class: unnecessary_work
    subject: "I3127"
    finding: "I3213 in finished-work-reaches-a-verified-release (same import) also extends scripts/ci/install-check with an installed-release walk through init, start and finish in a foreign repository, and its own criterion is 'adds no second installer'. Neither issue names the other in overlaps or depends_on. scripts/ci/install-check also carries two unlanded peer edits: p3's installer fix 0707822cda55 (also touching case 1024) and p7's I2829 alpha refusal 9f8baafeea4. I3127 depends only on I2162 (DONE). Without one owner for the refuse-then-accept stage, two stages get written into the same script and conflict with in-flight work. Fix: I3127 owns the refusal stage, I3213 depends on I3127 and composes the evidence and publication stages on top, and I3127 depends on (or rebases onto) the two unlanded commits."
    blocking: true
    resolution:
      state: planned
      issue: I3127
      because: "I3127 is declared the single owner of the install-check refuse-then-accept stage. Its acceptance now requires I3213's record to depend on I3127 and to compose only the evidence and publication stages before either issue starts; I3213 is outside this bundle, so its depends_on line is carried as I3127's precondition. I2829 and the installer fix 0707822cda55 are not issue records in this tree, so they cannot go into depends_on. I3127 instead must not start on scripts/ci/install-check until both commits are on master or it is based on them."
  - id: verify-command-is-declared-nowhere
    class: unproven_assumption
    subject: "I3128"
    finding: "I3128 has init report 'whether a verify command is declared, each naming its file', but no such declaration exists. share/skeleton/policy.yaml:17-23 (verification:) lists only finish_requires; the command is passed per call as finish --verify-command (lib/finish.sh:23,181-188); the profiles carry only the boolean verification.verify_command_required. The only proposal for a declared set is I3123 (a-claim-stands-only-on-its-evidence: a new profile key verification.verify_commands). Fix: make I3128 depend on I3123 and read that key. The alternative is detecting test entry points such as package.json scripts.test or a Makefile test target, but that is the 'new scan' I3128 rules out. Until this is decided, that finding cannot be specified or tested."
    blocking: true
    resolution:
      state: planned
      issue: I3128
      because: "I3128 now depends on I3123. Its verify-command finding reads the profile key verification.verify_commands that I3123 introduces and names the profile file it read. Scanning for test entry points stays out of scope."
  - id: outside-runs-have-no-pass-bar
    class: missed_requirement
    subject: "a-stranger-adopts-it-unaided#outside-runs-are-recorded"
    finding: "The statement says a stranger 'within ten minutes sees it refuse ... and accept'. The only criterion with a time bar, though, is the scripted case. outside-runs-are-recorded asks only that five runs be recorded with their elapsed time, and friction-becomes-a-case asks only that the frictions be filed. Five outside runs that all failed, with every friction filed, would satisfy all four criteria and, under ADR 0206, release outreach. The 10-13 assessment the intent was promoted from set the bar explicitly: 2026-10-13--6acea187...md message [2], line 140, 'Pozvat 5 externích vývojářů | Alespoň 3 samostatně dokončí scénář' (invite 5 outside developers; at least 3 finish the scenario on their own), and line 136 'do 5 minut' (within 5 minutes). Message [2] is not even among intent_sources. Fix: add a criterion, settled from fields of the recorded runs, that at least N of them reached the accepted finish unaided within the bar. I3129's record format must then carry a reached-accepted-finish field and the elapsed time to it."
    blocking: true
    resolution:
      state: planned
      issue: I3129
      because: "I3129 adds the reached_accepted_finish and seconds_to_accepted_finish fields to the outside-run record. It also adds an intent criterion, settled by its records case: at least 3 of the recorded outside runs reached the accepted finish unaided within ten minutes. The ten-minute bar is the intent statement's; the 3-of-5 count comes from c256#2, which is added to the intent's sources. The plan now carries the criterion as outside-runs-reach-the-accepted-finish, served by I3129, with c256#2 in the intent's sources; it is re-recorded as evidence: test when I3129's records case lands."
  - id: outside-run-record-has-no-checkable-shape
    class: unproven_assumption
    subject: "I3129"
    finding: "I3129 records a run 'unedited' as a curated knowledge record and also 'without the person's name, employer or repository contents'. These two requirements conflict, and the schema does not support either. For a verified record, share/schemas/majordomus/knowledge/knowledge.v1.schema.json:128-150 requires provenance whose derived_from resolves to decision, session, task, commit, issue, file or test. A stranger's own report has no such reference unless it is committed, and committing it unedited breaks the anonymity invariant; a maintainer rewriting it breaks 'unedited'. Nothing links a friction to its issue either: issue sources are workspace message refs, and a friction has no id, so the planned proof `majordomus plan show` cannot tell a covered friction from an uncovered one. I3129's validation (knowledge status, plan validate) checks none of this. Fix: the workflow defines the raw artifact (the tester's own answers to a fixed form, redacted only in declared fields, committed so that file: resolves) and gives each friction an id that issues cite. A case then refuses a record with a missing required field or a forbidden field, and fails on any friction no issue or cancellation names. Build on docs/ADOPTION_FIRST_RUN.md, the existing pinned forensic first-run format (installer, throwaway HOME, fresh repository), which the plan does not cite."
    blocking: true
    resolution:
      state: planned
      issue: I3129
      because: "The workflow now defines the raw artifact: the tester's own answers to a fixed form, redacted only in declared fields, committed under .ai/repo/knowledge/curated so that a file: provenance resolves. Each friction gets an id that the issue or cancellation citing it names. A new case refuses a record with a missing required field or a forbidden one, and fails on any friction id that no issue or cancellation cites. The form builds on the pinned conditions in docs/ADOPTION_FIRST_RUN.md."
  - id: five-runs-but-one-issue-and-no-permitted-recruitment
    class: insufficient_work
    subject: "I3129"
    finding: "The criterion needs at least five outside runs. I3129's acceptance needs one, and no issue holds runs two to five. Recruiting is in I3129's non_scope, and choosing outreach channels is a non_goal. ADR 0206 forbids 'public invitation' until the intent is satisfied, yet satisfying it needs outsiders to be invited. Read strictly, that leaves the milestone waiting on an action no record permits or owns. Fix: ADR 0206 and the outside-first-run workflow separate a private, consented invitation of individual testers from public outreach. Either I3129 carries all five runs (profile verification, blocked on external until done) or one issue is planned per run, so the plan shows how many runs are still missing."
    blocking: false
    resolution:
      state: planned
      issue: I3129
      because: "I3129 now carries all five runs and stays blocked on external until they are recorded. Its records case reports how many are still missing. The workflow and ADR 0206, which is still proposed and is added to I3129's scope, separate a private, consented invitation of named individual testers from public outreach. Only public outreach waits on the verdict. The plan carries the separation now in ADR 0206's decision and in the intent's statement."
  - id: init-findings-reuse-assumptions-false
    class: unproven_assumption
    subject: "I3128"
    finding: "I3128 reuses 'the editors projection model and doctor's checks rather than a new scan', but neither reaches what it wants to report. (1) doctor's wiring check (lib/doctor.sh:168-185, mj_validate_wiring) iterates only the policy's own enforcement entries. Right after init those are the skeleton's two hooks, which init already prints at lib/init.sh:208-213. It never sees an adopter's husky, lefthook or core.hooksPath hooks. (2) share/providers.yaml declares agents, bb, claude-code, codex, gemini and generic, with no Cursor, so '.cursor rules' cannot come from the providers data. (3) 'whether their shared content disagrees' is undefined for two hand-written files, since the region and fingerprint checks apply only to projections Majordomus wrote. (4) Acceptance 'In this repository init's findings are empty or true' cannot run as written: init exits 15 on an existing layer (lib/init.sh:53), and --extend writes. Fix: define each finding against data that actually exists (git config core.hooksPath and the hook files git would run; providers.yaml targets plus a stated comparison rule), add Cursor to providers.yaml or drop it, and run the self-check read-only."
    blocking: false
    resolution:
      state: planned
      issue: I3128
      because: "Each finding is now defined against data that exists. Hooks are read from git config core.hooksPath and the hook files git would actually run. Instruction files are the targets that share/providers.yaml declares, compared by a rule written down in docs/ADOPTION.md. Cursor is dropped until providers.yaml declares it. The self-check runs init in a temporary clone of this repository with .ai/ removed, so nothing in the checkout is written."
  - id: init-output-and-documented-path-surfaces-unscoped
    class: surface_missing
    subject: "I3128"
    finding: "Changing init's output changes contracts that neither issue has in scope. test/fixtures/commands/init.json asserts init's stdout. The init note in share/commands.yaml:58-74 describes its output. Init's recorded runs in use cases (adopt-an-existing-repository, install-the-tool-in-one-command, use-the-tool-as-your-own-in-a-shared-repository, say-what-the-tool-is-for) are derived into site/data/generated/catalogue.json. docs/ADOPTION.md is projected to site/content/docs/adoption.md (source = docs/ADOPTION.md), so derive must run. A personal init must also keep its git-status-unchanged check (lib/init.sh, the --personal block before the hook advice) true after the findings run. Separately, for I3127: the stranger 'has only the public site', and the commands the site actually publishes are hard-coded in site/templates/getting-started.html:12-32 plus install_command in site/data/registry/distribution.json. I3127 scopes only docs/ADOPTION.md. Unless the case reads the documented-command list from what the site publishes, 'undocumented commands = 0' is checked against a list the case declares itself, which is true by construction. Put these files and derive in scope."
    blocking: false
    resolution:
      state: planned
      issue: I3128
      because: "I3128 adds to its scope test/fixtures/commands/init.json, share/commands.yaml, the four use cases, site/data/generated/catalogue.json and site/content/docs/adoption.md. It also requires derive-check to pass and the personal git-status-unchanged check to stay true. For I3127, the site's getting-started template and distribution.json are added to scope. Its case reads the documented-command list from those published files rather than from a list it declares itself."
  - id: scripted-worker-is-not-an-agent-and-restates-the-scenario
    class: missed_requirement
    subject: "a-stranger-adopts-it-unaided#first-refusal-in-ten-minutes"
    finding: "The statement says 'refuse a task their agent called finished'. The owner-accepted beta contract (2026-10-12--6acd5d8a...md message [4]: 'Execute: alespoň jeden podporovaný AI coding workflow', meaning at least one supported AI coding workflow, and 'Integrace Claude/Codex ... alespoň jeden kompletně ověřený provider | P0', meaning at least one fully verified provider) asks for the refusal to reach a real provider workflow. I3127 uses a scripted worker that calls check and finish itself, and no issue proves that the projected instruction files or hooks bring the refusal to an agent's session in the stranger's repository. I3127's current_state is also wrong that the challenge 'runs only in this repository'. It runs in a disposable repository built by test/fixtures/commands/setup/challenge.sh through lib/usecase.sh:212-216. An installed release cannot run it, because scripts/release-package:86-95 ships only bin, lib, libexec and share, with no use cases or fixtures. Restating its steps inside install-check makes a second copy of .ai/repo/use-cases/catch-an-agent-that-says-it-is-done.md that will drift from it. Fix: drive the use case's steps from its file against the installed binary, and add a stage, or state it as a recorded limit, in which the refusal is reached through the wired pre-push hook (finish --check) of a provider projection."
    blocking: false
    resolution:
      state: planned
      issue: I3127
      because: "I3127's stage now reads its steps from .ai/repo/use-cases/catch-an-agent-that-says-it-is-done.md in the CI checkout and runs them against the installed binary, so no second copy is written. It adds a stage in which the refusal is reached through the wired pre-push hook (finish --check) of the claude-code projection. The current_state is corrected in why. A real agent session in a real repository is a stated limit of the scripted proof, and I3129's outside runs carry it. The pre-push hook stage was split from I3127 by the 2026-10-18 verification (one worker, one issue, one pull request) into its own issue, 'In a foreign repository, the wired pre-push hook of the claude-code projection refuses what finish would refuse, through the installed release', which depends on I3127 and serves the same criterion."
