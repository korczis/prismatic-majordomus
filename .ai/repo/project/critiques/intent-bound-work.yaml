  - id: stored-intent-id-contradicts-rule-v2
    class: unproven_assumption
    subject: intent-bound-work#start-is-gated
    finding: "Rule project.an-intent-outlives-its-sessions v2 says the lineage from an intent to tasks and handovers is stored in none of them, and the plan stores an intent id and a revision in both."
    blocking: true
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2000
      because: "I2000 delivers v3 of the rule: a name a worker declared and a hash compared on read are not intent state; stage, verdict and criteria stay derived and stored nowhere."
  - id: adr-0111-does-not-exist
    class: delivery_verification
    subject: I2000
    finding: "The intent's governance cites adr-0111, which no tree holds; an unresolved governance reference fails intent validate."
    blocking: true
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2000
      because: "ADR 0111 is a deliverable of I2000 and lands with the intent record, status proposed."
  - id: records-fail-intent-validate-until-last-issue
    class: delivery_verification
    subject: intent-bound-work#resume-detects-drift
    finding: "Every criterion references a test not yet in the tree, each a failing unresolved reference, so the intent gate is red until the last issue."
    blocking: true
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2000
      because: "The milestone records state that the records, the ADR and the tests land in one change; nothing reaches the trunk without the rest."
  - id: other-entry-points-unbound
    class: missed_requirement
    subject: intent-bound-work#start-is-gated
    finding: "plan start and the plan.transition capability move an issue to ACTIVE with no preflight, so a task is not the only way work begins and the gate at start can be walked around."
    blocking: true
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2004
      because: "I2004 gates the start transition in both plan engines; the criterion start-is-gated now names plan start."
  - id: stale-critique-not-refused
    class: missed_requirement
    subject: I2000
    finding: "The requirement asks that a stale critique blocks start; the preflight refuses an absent critique and an open blocking finding and never compares reviewed_at."
    blocking: true
    resolution:
      state: rejected
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      because: "A critique records the commit it was written at and no revision of the plan it reviewed, so staleness has nothing to be judged against; the opposition milestone gives the record that revision and its refusal reuses the plan_revision I2000 computes. Named as a non-goal of this intent."
  - id: realization-and-binding-disagree
    class: regression_risk
    subject: I2001
    finding: "intent realization reads scope from task.started and takes a declared link from the title; a task started with --issue whose title does not cite the issue would be bound by one capability and inferred by the other."
    blocking: true
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2001
      because: "Realization reads the ledger's issue as a declared link, with a test that both capabilities agree about one task."
  - id: one-revision-or-two
    class: insufficient_work
    subject: I2003
    finding: "The plan stored one revision and reported two; evidence state depends on the tree, so one hash would report drift on ordinary commits."
    blocking: true
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2000
      because: "Two pins with stated contents: plan_revision over statement, invariants, criteria, links and critique; evidence_standing over the served criteria's evidence states."
  - id: paths-mode-nearly-always-refused
    class: unproven_assumption
    subject: intent-bound-work#binding-is-resolved
    finding: "Path resolution judges every open issue whose scope overlaps and one refusal refuses the work; with scopes as broad as docs, a scope-only start under required may rarely bind, and nobody measured it."
    blocking: false
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2001
      because: "The binding rate of scope-only starts is measured against this repository's plan before its policy is set to required."
  - id: issue-id-as-password
    class: insufficient_work
    subject: I2001
    finding: "Nothing compares the task's scope with the named issue's scope, so naming any bound issue binds any work."
    blocking: false
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2001
      because: "The binding notes a scope outside the issue's scope and start prints it; a refusal would punish issues whose scope omits generated projections."
  - id: required-without-binary-locks-out
    class: regression_risk
    subject: I2001
    finding: "Under required an unreadable binding refuses, and an exemption is validated by the same executable, so an adopter without the built binary or jq cannot start."
    blocking: false
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2001
      because: "Each policy value's behaviour without the executable and without jq is an acceptance criterion with a case; required is a choice a repository makes with the executable built."
  - id: handover-identity-guard
    class: regression_risk
    subject: I2003
    finding: "The guard that refuses bodies forging computed front-matter keys does not know the new keys, and the front-matter writer is shared with checkpoints."
    blocking: false
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2003
      because: "The guard covers both pins and a checkpoint carries neither."
  - id: context-section-order
    class: regression_risk
    subject: I2002
    finding: "Case 23 pins the order of the context sections and its JSON list; the plan gave the intent section no position, id or drop priority."
    blocking: false
    resolution:
      state: planned
      resolved_by: "claude-code (session fcbeae95), the author of the plan"
      issue: I2002
      because: "After PROFILE, JSON id intent, gap conditions dropped first under budget, never dropped whole."
