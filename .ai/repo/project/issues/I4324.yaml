acceptance_criteria:
  - "In a fixture with `landing: squash`, a clean worktree whose branch was squash-merged is listed by `worktree cleanup` as eligible"
  - "A kept finished worktree with an ignored node_modules/ and target/ is listed by `cleanup --build-output` with each size, and `--remove` deletes both and leaves every tracked file and the branch"
  - "A node_modules/ that is not ignored, or holds a tracked file, is listed as kept with the reason and is never removed"
  - "A directory that is a process's cwd, or was written within the idle window, is kept"
  - "Before the change the case fails on the squash-merged worktree missing from the eligible list"
  - "In a fixture whose finished, kept worktree holds an ignored node_modules/ above the floor, `majordomus doctor` prints one WARN disk naming the count, the total size and `majordomus worktree cleanup --build-output` as the remedy, and removes nothing"
  - "Below the floor, or with MAJORDOMUS_DOCTOR_CONTEXT=commit, doctor prints no such line"
  - "On a fixture of OSCILLA's 2026-10-29 shape (3 worktrees removable today and 90 clean worktrees whose branches were merged and deleted at the origin, so their upstream is gone and their HEAD is an ancestor of the remote trunk), `worktree cleanup --remove` goes from 3 removed and 90 refused before the change to 93 removed and 0 refused after it"
  - "In the same case, a worktree whose HEAD carries a commit the remote trunk lacks is still refused, with its upstream gone and with no upstream (OSCILLA's fix/v272-* shape), as are a gone-upstream worktree with uncommitted work and one with a process whose cwd is inside it"
  - "The unit test an_upstream_deleted_after_the_listing_is_seen_by_the_reclaim is kept for a head the trunk lacks (a commit made before the upstream is deleted) and still refuses it; a new unit test shows a gone upstream whose head the trunk contains is not refused"
