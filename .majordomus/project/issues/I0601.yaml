id: I0601
milestone: shared-policy
title: Let a policy name a shared source it does not copy
slug: name-shared-source
priority: p3
profile: deep-work
parallel_safe: false
objective: "Let a repository's policy name a shared policy source and resolve it offline from the filesystem, so that one statement of a rule can govern more than one repository without being pasted into each."
why: "Copying is what makes organisational policy drift: every repository holds a fork of the rule and nobody can see which forks moved. A named source is the smallest change that makes drift detectable at all."
current_state: "Policy is per repository and entirely local. Nothing refers to anything outside the checkout."
desired_state: "A policy names a shared source, the tool resolves it without a network call, and every command that reads policy reads the resolved result."
scope:
  - lib
  - share
  - docs
non_scope:
  - Fetching a policy over a network, from a registry, or from any service
  - A hosted component that must be running for the tool to work
depends_on: []
acceptance_criteria:
  - A shared source is resolved from the filesystem with no network access
  - Every policy reader sees the resolved policy, and no reader bypasses resolution
  - An unresolvable source is a named finding that stops the command, never a silent fallback to local
  - A repository that names no shared source behaves exactly as it does today
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
risk: "This is where a local-first tool grows a dependency outside its checkout; keeping resolution to the filesystem is what preserves the offline guarantee."
created_at: 2026-09-04
updated_at: 2026-09-04
