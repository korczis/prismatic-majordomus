id: I4341
milestone: development-runtime
title: "release-check excuses a tag without a record until its grace ends, whatever the job fetched and whenever the release run concluded"
slug: a-tag-is-excused-until-its-grace-ends
priority: p0
profile: implementation
parallel_safe: true
objective: "Make the excuse scripts/ci/release-check gives a published tag without a record monotonic over its grace: when proposed_record() finds no local release/record-<tag> ref it asks `git ls-remote --heads origin release/record-<tag>` and fetches that one ref, and release_in_flight() reads a GitHub release of the tag younger than RECORD_GRACE_HOURS as pending whatever its release run concluded."
why: "Incident 7 of 2026-10-28: master validate run 40676150754 went red on case 103 after v1.0.0-alpha.9 was tagged before its record landed. release-check has two excuses and they do not cover the same time: 'in flight' (I2712) ends when the release run concludes, and 'proposed record' (I2054) reads only the refs fetched at checkout. A job that fetched after the tag and before the record branch was pushed, and judged after the run ended, matched neither; the structure job has the same gap. The record pull request #2626 is open and blocked (action_required), so unless it lands every job turns red about 2026-10-29 12:47Z, when the 24-hour grace from the record branch ends; the next release meets the same gap."
current_state: "Measured at 81ef931a3e1: proposed_record() (scripts/ci/release-check line 281) reads local refs only; release_in_flight() (line 254) reads a tag as pending only while its release run is listed in flight or while GitHub holds no release of it; RECORD_GRACE_HOURS (line 223) defaults to 24."
desired_state: "Within the grace, a tag without a record reads pending in every ordering of the checkout's fetch, the record branch's push and the release run's conclusion; past the grace it is a finding as today; with origin unreachable the finding stands and its note names the remote it could not ask. Enforced by cases 3029 and 3021 in the suite gate."
