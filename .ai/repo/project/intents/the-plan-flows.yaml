id: the-plan-flows
title: "The plan flows: ready work reaches delivery, and every number that shows it is derived, current and enforced"
statement: "The plan flows. Work that is ready does not wait: on the delivery summary of /ui (at v0.29.0: 86 ready, 159 blocked, 1 active, 7 in verify, 161 done) work moves from ready through active and verify to done continuously, and what blocks the most work is unblocked first. Every number on that summary, and every state behind it, is derived from the records, inferred from what actually happened (branches, pull requests, merges, releases, deploys), dynamic and up to date rather than a snapshot nobody refreshes, enforced by a gate, its regressions prevented, tested, and deployed."
