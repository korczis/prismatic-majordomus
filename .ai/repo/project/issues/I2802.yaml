  - "docs/MESH.md"
  - "test/cases"
depends_on: [I2798]
acceptance_criteria:
  - "A linked node's observed model appears as a candidate on another node with the node's identity, and an unlinked node's does not"
validation:
  - "bin/majordomus plan validate"
evidence_required:
  - "mesh_inference_case"
