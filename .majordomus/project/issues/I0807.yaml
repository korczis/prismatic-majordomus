id: I0807
milestone: M003
title: Discover knowledge sources from git, not from the filesystem
slug: knowledge-discovery
priority: p1
profile: implementation
parallel_safe: true
objective: "Implement the discovery stage of lib/knowledge.sh: a declared list of source classes, each with a scope of shared or operational, resolved through git ls-files for tracked repository artifacts and through the known state paths for operational records, producing a deterministic ordered list of sources with their content hashes."
why: "A recursive filesystem walk indexes vendored trees, build output, editor droppings and untracked files that were never meant to be knowledge, and it produces a different answer on two machines. git ls-files answers with repository truth, in a stable order, and is already the boundary this project treats as authoritative."
current_state: "Nothing in lib/ enumerates repository files. scripts/generate-site-data declares its canonical inputs, which is the precedent for a declared source list rather than a walk."
desired_state: "`knowledge sources` prints each discovered source with its class, its scope and its hash, in a deterministic order, and the same repository produces the same list twice. An untracked file is not a source. Operational state paths are added explicitly and are marked operational, never shared."
scope:
  - lib/knowledge.sh
  - bin/majordomus
  - test/cases
non_scope:
  - Extraction, nodes, edges
  - Any recursive walk of a hidden directory
  - Indexing a path merely because it exists
depends_on:
  - I0801
acceptance_criteria:
  - The source classes are declared in one place and each carries its scope
  - Discovery is driven by git for tracked sources, and a case proves an untracked file is excluded
  - The output order is deterministic and independent of filesystem order
  - A pathname containing a space or a non-ASCII character is handled without splitting
  - A declared source class that discovers nothing is reported, so a forgotten path is visible
validation:
  - bash test/run.sh 64_knowledge_discovery
  - shellcheck -x -s bash lib/knowledge.sh
evidence_required:
  - discovery_deterministic
risk: "The historical whitespace bug class lives here. Every pathname read out of git has to be read NUL-safely or with an explicit field separator, never through unquoted word splitting."
created_at: 2026-09-04
updated_at: 2026-09-04
