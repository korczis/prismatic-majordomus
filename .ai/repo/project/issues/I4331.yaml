id: I4331
milestone: a-second-adopter-is-served
title: "pack build never leaves an un-ignored copy of the repository in its work tree"
slug: pack-build-output-is-ignored-or-refused
priority: p1
profile: implementation
parallel_safe: true
objective: "Before it writes, pack build checks its output directory with `git check-ignore`. That is the default <root>/tmp/packs/<repo>-<profile>-<commit12> (apps/majordomus-cli/src/pack/mod.rs:1189-1220) or the --out path. When the directory lies inside the work tree and is not ignored, pack build refuses and writes nothing. The refusal names the path and three remedies: ignore tmp/ in .gitignore, ignore it locally in .git/info/exclude (no commit needed), or pass --out with an ignored directory. On success, the output line names the path written and says that it is ignored. pack.verify keeps its rule that a pack is verified where it was built, inside the repository (inside(), apps/majordomus-cli/src/capability/builtin/pack.rs:115-133). That is why the fix is a refusal and not a new default outside the work tree. Writing under .git/ does not work either: in a linked worktree .git is a file, and the common git directory lies outside the work tree, where inside() refuses it."
why: "Observed in OSCILLA (korczis/oscilla) on 2026-10-28 with majordomus 1.0.0-alpha.8. `majordomus pack build chatgpt` wrote tmp/packs/oscilla-chatgpt-<sha>/ inside the checkout. OSCILLA does not ignore tmp/ (`git check-ignore tmp/x` matches nothing), so the pack's verbatim copies of tracked source became untracked, non-ignored files. OSCILLA's version-authority unit test enumerates `git ls-files --others --exclude-standard`, and it failed with two hard-coded-version findings on those copies until the pack was moved out. What worked well: `pack plan` refused five files that named the machine's checkout path (pack.leak). Those files were a real defect in OSCILLA, and the refusal is how it was found. This issue leaves that behaviour as it is. On master 81ef931a3e1, default_out (pack/mod.rs:1193) assumes tmp/ is ignored. That is true of this repository and was never checked."
current_state: "On master 81ef931a3e1, pack build writes under <root>/tmp/packs/ whether or not the path is ignored, and its output does not say."
desired_state: "In a repository that does not ignore the output path, pack build refuses with the remedy and leaves `git status --porcelain` unchanged. In one that does, it writes as before and says that the path is ignored."
scope:
  - "apps/majordomus-cli/src/pack/mod.rs"
  - "apps/majordomus-cli/src/cli/local.rs"
  - "docs/ADOPTION.md"
  - "test/cases"
non_scope:
  - "Moving the default output outside the work tree or under .git/, which would break pack.verify's inside() rule"
  - "Writing to .git/info/exclude or .gitignore on the adopter's behalf: the refusal names the line to add"
  - "What pack plan selects or refuses"
depends_on: []
acceptance_criteria:
  - "In a fixture repository that does not ignore tmp/, pack build refuses, names the path and both remedies, writes nothing, and `git status --porcelain` is unchanged"
  - "With tmp/ ignored through .gitignore, or through .git/info/exclude, pack build writes the pack as before, its output names the path as ignored, and pack verify on that path passes"
  - "An --out path that is inside the work tree and not ignored is refused the same way"
  - "Before the change the case fails on the untracked pack files git status reports"
validation:
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib pack::"
  - "MJ_TEST_JOBS=4 bash test/run.sh <the case this issue adds>"
evidence_required:
  - "pack_output_is_ignored_case"
serves: []
created_at: 2026-10-28
updated_at: 2026-10-28
