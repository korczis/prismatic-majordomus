parallel_safe: true
objective: "Make the executable's plan report carry the name, repository and default branch that project.yaml declares."
why: "Observed on 2026-10-13 adopting 0.21.0 and 0.22.0 in a pnpm/TypeScript repository (docs/ADOPTION_SECOND_RUN.md, G15); read again on master e506c041a4. `/api/v1/plan/status` answered three empty strings although project.yaml declares all three. It is empty in this repository too."
current_state: "apps/majordomus-cli/src/plan.rs:587-606 fills the header from an index object of kind `project`, and no source class of that kind exists in the skeleton or here; apps/majordomus-cli/src/devtask/task.rs:593-600 says so in a comment."
desired_state: "The skeleton and this repository declare the class, an existing layer is told to add it, and an unreadable header is reported as unknown with its reason."
