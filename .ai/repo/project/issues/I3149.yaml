id: I3149
milestone: entry-proves-what-it-handed
title: "A governance change during a session is told at the session's next brief or check"
slug: a-governance-change-is-told
priority: p2
profile: implementation
objective: "Compare the current governance manifest with the episode's recorded one whenever the session briefs itself (I2399), runs check or reaches the next lifecycle event its provider wires, and print the inputs that moved with the command that re-reads them."
why: "Startup validation alone does not cover AGENTS.md or .ai/** edited during a session (2026-09-10). Proposed in ADR 0181 (An episode records the governance and the briefing it was handed, each by one digest) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c103#2."
current_state: "The interval brief (I2399, case 1065) reports stream events, not governance changes."
desired_state: "A visible notice names the changed rules or policy keys."
scope:
  - "apps/majordomus-cli/src/capability/builtin/brief.rs"
  - "lib/check.sh"
non_scope:
  - "Filesystem watchers"
depends_on:
  - "I3148"
serves:
  - "entry-proves-what-it-handed#change-is-told"
acceptance_criteria:
  - "A rule edited mid-episode is reported at the next brief"
  - "An unchanged tree reports nothing"
  - "Each new case named here takes its number from `scripts/case-numbers next` and is announced on the board before the file is written (ADR 0053); a case number written in this record before that is provisional"
validation:
  - "bash test/run.sh 1065_a_session_briefs_itself"
evidence_required:
  - "case_governance_change_is_told"
created_at: 2026-10-18
updated_at: 2026-10-18
