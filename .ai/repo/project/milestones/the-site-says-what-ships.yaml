acceptance_criteria:
  - "The navbar badge, the hero badge, the trust card and releases/latest.json name the same version, and a fixture adding a higher prerelease or yanked record leaves all four on the stable one"
  - "A deploy whose served page names a version other than latest.json or a commit other than build.json fails `scripts/pages verify --smoke` naming both values"
  - "The site shows the movements between the previously deployed commit and the built one, each labelled released or not yet released, and no committed file carries them"
  - "A capability word in marketing.toml or manifesto.toml whose claim is not guaranteed and supported fails homepage-check naming the line and the claim"
  - "The first screen carries the outcome, the audience, what the tool does not do and the install command, and five pains each lead to a stable domain or a stated limitation"
  - "site-probe and ui-audit measure every declared width including 375 and 768 and a reduced-motion pass, and a rendering measurement over its declared budget fails the site job"
