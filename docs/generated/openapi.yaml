          type: string
          description: "The identity, the slug and the file name."
        title:
          type: string
          description: The area.
        summary:
          type: string
          description: "One line: what falls under it."
        status:
          type: string
          description: "`stable`, `draft` or `deprecated`."
        weight:
          type: integer
          format: uint32
          minimum: 0
          description: Presentation order.
