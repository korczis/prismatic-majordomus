intent: the-ui-runs-and-explains-the-work
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: all 6 blocking and 3 non-blocking findings are planned onto I3225-I3230. Plan validate refuses depends_on ids for branch-only records (I2902, I2917, I2980, I2982/I2983), so those gates are acceptance criteria. The plan rewords all six criteria of the intent record to these resolutions and binds each to the test or case its issue writes; a test ref must already exist, so the record carries `evidence: command` with that planned proof until the issue's first commit adds the file and flips it to `evidence: test`. I3225 moves any run path another issue put on /ui first (I3139's included) onto its shared one."
findings:
  - id: criteria-proof-is-circular
    class: delivery_verification
    subject: "the-ui-runs-and-explains-the-work#a-capability-runs-from-the-ui"
    finding: "All six criteria have `evidence: command` with `ref: majordomus intent explain the-ui-runs-and-explains-the-work`, which means the intent is checked by explaining itself. On master, intent.rs treats every command criterion as NotDerivable. `majordomus intent explain intent-lifecycle` prints \"has evidence of a kind the ledger cannot derive, so it is never met by itself\" for model-is-gated, so as things stand no criterion here can ever be met. I3255 in the same import would count a command criterion as met by a passing run of exactly its ref. `intent explain` exits 0 even for an unmet intent (observed exit=0 on intent-lifecycle), so once I3255 lands all six would be met with nothing proven. The planned proof names also disagree with the issues. The criterion names apps/majordomus-cli/tests/ui_capability_run.rs, I3225's evidence_required says test_ui_capability_run, and its validation runs only `--lib ui::capabilities` and `--test cockpit`, neither of which runs that file. The same applies to the other five criteria (test_server_timing_header vs `--lib http::`, bench_prefetched_navigation vs `bench --check`). Fix before work starts: give each criterion `evidence: test` with the path its issue writes, as the-owner-directs-work-from-the-ui does (ref apps/majordomus-cli/tests/ui_idd.rs), and put that target in each issue's validation."
    blocking: true
    resolution:
      state: planned
      issue: I3225
      because: "Confirmed: intent.rs:1135 makes every command criterion NotDerivable, and a `test` ref must already be in the tree (intent.rs:1093-1112), which is why the drafts used command. Each of I3225-I3230 now owns one test path, which the intent record names as its criterion's planned proof and the issue's evidence_required names as the file. Its validation runs that target, and its first commit adds the file and changes the criterion to `evidence: test` with that ref in .ai/repo/project/intents/the-ui-runs-and-explains-the-work.yaml. The paths are: tests/ui_capability_run.rs (I3225), tests/http_server_timing.rs (I3226), a test/cases browser case each for I3227 and I3228, tests/ui_version_badge.rs (I3229) and tests/ui_dashboard_needs_the_owner.rs (I3230). The self-referential `intent explain` ref is forbidden as proof. It stays in the record only as the placeholder of a criterion whose test does not exist yet, because the writer cannot name a missing file as a test ref; so the window I3255 opens stays open for an issue that has not started, and each issue's first commit closes it for its criterion."
  - id: the-runner-is-not-an-execution
    class: unproven_assumption
    subject: "I3225"
    finding: "The objective says to move \"the Cockpit's schema-generated capability form and runner (cockpit/pages.rs, share/cockpit/runner.js)\" into shared code. But runner.js does not start an execution. It calls the capability's own route directly (runner.js:6-8, api() at :108), behind the \"Run\" submit button (pages.rs:1262-1270). Only the second button, \"Run as an execution\", goes through the executor: share/cockpit/executions.js:22-55 (installStartButton, data-mj-start, data-mj-confirm). That file, and socket.js, which follows the run, are not in I3225's scope. Moving runner.js as written would put a run path on /ui that is not an execution, which breaks invariant 1. Following the run on /ui is also not designed. ExecutionLinks (capability/builtin/executions.rs:55-66) has only a `cockpit` page link, and there is no /ui execution view. The issue must say which it is: add links.ui plus one /ui execution view, or hand off to /cockpit/executions. It must also use the one live channel of ADR 0216 / I3221. share/ui/socket.js and live.js are 5a's in-flight work (I2982/I2983), so it needs a dependency on them. Scope the shared module as executions.js's start path, and drop the direct-route runner from /ui."
    blocking: true
    resolution:
      state: planned
      issue: I3225
      because: "Accepted as stated. ExecutionLinks has only `cockpit` as a page link (executions.rs:55-66). I3225 now shares executions.js's start path (installStartButton, data-mj-confirm) together with the socket.js follow. The direct-route runner is out of scope for /ui. The run is followed in place on /ui/capabilities through the execution's own links.events and links.websocket, and its full page opens at links.cockpit. The issue's objective and desired_state say this, and runner.js leaves its scope. No links.ui and no /ui execution view are added, so the non-goal 'no new screen family' and the public ExecutionLinks output stay unchanged. The issue depends on I3221 for the one liveness vocabulary. I2982/I2983 are not recorded on master or in this tree, so plan validate would refuse them as depends_on ids; the gate is therefore written as an acceptance criterion."
  - id: confirm-predicate-and-dry-run
    class: regression_risk
    subject: "the-ui-runs-and-explains-the-work#a-capability-runs-from-the-ui"
    finding: "The criterion asks for confirmation \"exactly when the capability's declared effect writes the repository\". The Cockpit's predicate, ExecutionPolicy::needs_confirmation (capability/model.rs:719-721), is `!matches!(effect, Effect::Read)`, so it also asks for ProcessState capabilities. Once one module serves both surfaces, one of two things happens: the Cockpit quietly stops asking for ProcessState (dropping a deliberate conservative policy, see model.rs:732-736), or the criterion is false. Write the criterion and its test to needs_confirmation, so the UI never classifies effects itself. Also, \"shows its dry run when one exists\" has nothing in the descriptor to read: grep finds no dry_run in capability/model.rs, only per-handler inputs in served.rs and integration.rs. Showing one would take a per-capability list, which contradicts \"no per-capability markup\". Either declare dry-run on the descriptor (in scope, with release impact) or drop the clause."
    blocking: true
    resolution:
      state: planned
      issue: I3225
      because: "Verified at model.rs:719-721 (`!matches!(self.effect, Effect::Read)`) and confirmed that model.rs declares no dry_run. I3225 now confirms exactly when ExecutionPolicy::needs_confirmation is true, ProcessState included. Its test covers one Read, one ProcessState and one RepositoryMutation capability on both surfaces, and the criterion is reworded to that predicate in the intent record now. The dry-run clause is dropped through non_scope rather than adding a descriptor field the release would have to carry."
  - id: no-per-request-timing-source
    class: unproven_assumption
    subject: "I3226"
    finding: "The issue's current_state says the perf module already counts \"route, each capability read with cache hit or miss, render, bytes\". It does not. crate::perf::COUNTERS is one process-global static of AtomicU64 totals (perf.rs:40-90) with eight phases (perf.rs:118-127: repository_discovery, index_build, registry_build, open_api_build, mcp_projection_build, graph_build, handler_execution, cache_lookup). There is no route, render or bytes phase and no record per capability call. The HTTP server runs several worker threads (http/server.rs Running.threads), so subtracting global counters around one request mixes in whatever runs at the same time. The acceptance criterion \"a repeated capability read on one request is visible as two entries\" therefore needs a new request-scoped recorder: set in Router::handle (router.rs:610), fed by ui::source's ask and by the executor, and with its own tests. The criterion's wording \"derived from the counters perf.counters reports\" cannot be literally true per response; reword it to \"the same Phase vocabulary\". It must also say what streamed and upgraded responses carry (/events WebSocket, SSE), where headers go out before the total is known."
    blocking: true
    resolution:
      state: planned
      issue: I3226
      because: "Accepted. The counters are process-global totals and the server is multi-threaded, so a per-response figure needs a request-scoped recorder. I3226 now builds that recorder in Router::handle. It is fed by ui/source.rs and capability/executor.rs, uses the perf::Phase vocabulary plus the route, render and bytes stages it adds, and has its own tests. A streamed or upgraded response carries only the stages completed before its headers, marked as partial and without a total. The criterion now reads 'recorded for that request alone, in the same Phase vocabulary perf.counters reports', with streamed or upgraded responses marked partial, and the issue's objective and current_state no longer claim the perf module counts per route."
  - id: dashboard-sentences-have-no-source
    class: unproven_assumption
    subject: "I3230"
    finding: "Three of the panel's sentences have no source that exists today. (1) \"What was verified since the last release\": evidence.report has no since or range input (EvidenceReportInput, evidence.rs:133-157: state, status, findings_only, presented, presented_tree). Filtering executions by the release date in the UI would be a figure of the UI's own, against desired_state and invariant 2, and non_scope forbids a new capability. Plan the input on evidence.report, or drop the sentence. (2) \"Who works on them\" reads the blackboard, which is I2980 (5a, local, unpushed, changes_requested in r-be1a4401fe22), yet depends_on is []. plan.next will offer I3230 as ready although its own why says it waits. (3) \"The one next move\" overlaps 2b's I2917 (one primary action per intent from plan.next and the issue's move), I2915 and I2907 on /ui/idd. The milestone lists this as a risk, but the issue does not depend on them, so two derivations of \"next move\" would drift apart. Cost is a further problem. evidence.report and plan.next added to dashboard.rs FIRST_PAINT (:37) would risk the 100 ms p95 budget in .ai/repo/benchmarks/rust/policy.yaml, so the panel must be a fragment (ADR 0142). I3138 (the /ui/mesh page from the blackboard, same import) should own the 'who' source that both read."
    blocking: true
    resolution:
      state: planned
      issue: I3230
      because: "Fixed by four changes. (1) The 'since the last release' qualifier is dropped. The sentence states evidence.report's verdict at the presented revision with no date filter, and the criterion now reads 'what evidence.report verifies at the presented revision and plan.next's one next move'. (2) I3230 now depends on I3138 instead of I2980 (not in this tree). I3138 is in this tree, owns the blackboard 'who' source and is itself gated behind 5a's landing. plan.next therefore no longer offers I3230 as ready. (3) The next move must be plan.next's single answer and the same derivation 2b's I2917 renders. I2917 is not in this tree or on master, so it cannot be a depends_on id; it is named in why. (4) The panel is a /ui/panels fragment (ADR 0142), and FIRST_PAINT and the 100 ms budget are unchanged."
  - id: search-needs-a-contract-change
    class: insufficient_work
    subject: "I3228"
    finding: "\"Names why each result matched\" cannot be done from the UI alone. objects.search returns SearchHit {object, snippet?} (capability/builtin/objects.rs:347-354), with a snippet only when content matched, no matched field, and hits \"in URI order\" (:365). Saying whether identity, title, description or content matched is a change to a public output (OpenAPI /api/v1/search, MCP majordomus_search, release analysis), and objects.rs is not in scope. The current_state is also wrong: the UI's search form submits to /cockpit/search (ui/shell.rs:253), so /ui has no search of its own today. The issue moves come from I2902 (2b, branch, not on master), but depends_on is []; starting now would rebuild the status-to-move table I2902 owns. The proof cannot run as written either: scripts/lib/cockpit-probe.mjs never visits /ui (no /ui route in it), so the keyboard walk belongs in scripts/ui or case 3220's harness. Nothing says what search does on the published snapshot, which has no API."
    blocking: true
    resolution:
      state: planned
      issue: I3228
      because: "Verified: SearchHit at objects.rs:347-354 has no matched field, and shell.rs:253 submits to the Cockpit's /search. I3228 now adds an additive `matched` field to SearchHit in objects.rs through its canonical declaration and `majordomus generate`, a minor public-output change that the release analysis records. It also gives /ui a search of its own, and the criterion now says the search answers on /ui and names the match from that field. The keyboard proof moves to a browser case in the ui job, and the snapshot behaviour is defined. I2902 is only on branch docs/the-idd-workspace-reads-at-a-glance, so plan validate cannot accept it as a depends_on id. The issue may not start until I2902's record is on origin/master, and it imports that table rather than rebuilding it."
  - id: badge-breaks-the-shared-bar
    class: regression_risk
    subject: "I3229"
    finding: "apps/majordomus-cli/src/ui/navbar.html is the site's built bar copied byte for byte. `scripts/ui navbar` checks it (rule project.the-ui-wears-the-sites-navbar), and the copy has one slot, @MJ_VERSION@ (navbar.rs:27), inside a `data-release` attribute (navbar.html:24). That attribute already mislabels the executable's version as a release on /ui and /cockpit (cockpit/view.rs:114 renders the same bar). A kind label and an ahead/behind phrase that differ per surface need new slots in site/templates/partials/navbar.html, in scripts/lib/ui-navbar.mjs fragmentOf, and a regenerated ui/navbar.html. The last two are not in scope, and without them the navbar check fails. \"From release.version\" is also costly: it runs the contract analysis (0.6 s, measured in I2460), and the bar is on every page, so every screen would miss its 100 ms budget. Use distribution.releases (records only) plus the compiled version. The snapshot's badge comes from the same executable-version slot, while its banner names the commit (web/report/snapshot.rs:864-872). Snapshot.rs is not in scope. \"Latest release\" should also say whether it means recorded or published; the site's badge means published (`offered`)."
    blocking: false
    resolution:
      state: planned
      issue: I3229
      because: "Accepted. I3229's scope now includes ui-navbar.mjs, the regenerated navbar.html, cockpit/view.rs and snapshot.rs. The comparison comes from distribution.releases plus the compiled version rather than release.version, and 'latest' means the published (offered) release, as on the site; the criterion now says 'the latest published release'."
  - id: prefetch-has-no-measured-problem
    class: unnecessary_work
    subject: "I3227"
    finding: "The bench already keeps every system.http.ui.* screen under a 100 ms warm p95 budget (.ai/repo/benchmarks/rust/policy.yaml budgets), and bench --check fails the build otherwise (I2489 DONE). So \"a /ui link whose route the bench measures under its budget\" covers every screen, and the criterion separates nothing. The slow parts are the panel fragments (/ui/panels/*), and prefetching a screen's HTML does not fetch them. /ui documents are sent `Cache-Control: no-cache` with no ETag (ui/mod.rs:424), and API answers default to no-store (http/server.rs:442-450), so the gain from a prefetched document on navigation is unproven. Its CSP interaction (cockpit::csp) is unexamined. bench_prefetched_navigation cannot be produced by the Rust HTTP bench, which cannot observe hover, focus or Save-Data. Proposed ADR 0207 says a mechanism without its measured problem stays an open question. Keep it behind I3226 and state the navigation cost it removes, or reject it."
    blocking: false
    resolution:
      state: planned
      issue: I3227
      because: "I3227 stays behind I3226, as it already depended on it. It now has a measurement gate: no prefetch code is written until I3226's Server-Timing shows a document-fetch cost on a /ui navigation that prefetch would remove under no-cache and the CSP. If no such cost is measured, the issue closes as not needed and its criterion is withdrawn. The criterion already selects links by that measured cost rather than by the bench budget. The proof moves to a browser case, because the Rust bench cannot observe hover, focus or Save-Data."
  - id: second-run-path-and-phone-width
    class: surface_missing
    subject: "the-ui-runs-and-explains"
    finding: "I3139 (the-owner-oversees-the-mesh-from-one-page) adds an action button on /ui/mesh through an existing capability, with its own authorisation and its own handling of the result. With I3225 that makes two run-and-confirm paths on /ui, so I3139 should use I3225's shared start, confirm and follow, and depend on it. Proposed ADR 0215 makes a phone the baseline width, but no criterion or issue checks the generated form, the confirmation, the search overlay or the new Dashboard panel at 390 px. I3216/I3217 cover only the IDD loop and tables. On documentation: docs/MAJORDOMUS_UI.md:529 says \"Nothing on the UI starts work yet\" and :377 \"Nothing on the screen starts work\"; I3225 covers the first, but nobody owns the second. I3228 and I3229 change UI behaviour without a docs/MAJORDOMUS_UI.md entry. No issue updates the public site or generated docs about running from /ui, or explains the Server-Timing header to a reader."
    blocking: false
    resolution:
      state: planned
      issue: I3225
      because: "The phone-width checks at 390 px and the docs ownership are added to I3225, I3228, I3229 and I3230 (I3225 owns both passages, :377 and :529); I3226's docs/MAJORDOMUS_UI.md now explains the Server-Timing header to a reader. I3225 exports its start, confirm and follow path for every /ui screen, and if I3139's /ui/mesh action lands first, I3225 moves it onto that path in its own PR, so /ui keeps one run-and-confirm path whichever lands first. I3139 belongs to another intent, and its depends_on I3225 (still owed by that intent's critique, which added only I1205) would only fix the order; I3225's why records the expectation."
