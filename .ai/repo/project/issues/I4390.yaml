id: I4390
milestone: peer-blackboard
title: "A session reports what it measured, from one declared report contract, and the brief says how old each fact is"
slug: the-brief-tells-the-truth-and-the-report-shows-it
priority: p1
profile: implementation
parallel_safe: true
objective: "Declare the self-report once, in share/brief/report.yaml, and have brief.session compose from it the three texts every carrier relays verbatim (keep_awake, report.prompt, report.reminder), each carrying the attention entries the brief measured; give every section of the brief one evidence envelope (source, age, bound, verdict, remedy, cost) so that a stale or unread fact is never shown as current; make the session section the caller's; add this session's own work, the CI pool and the machine; and bound every section by a budget so that a slow owner reads unread instead of stalling the brief."
why: "On 2026-10-29 the owner read the interval prompt and called it a placeholder: it asked for a fixed number of lines and named categories rather than anything measured, and the same contract was worded four ways (brief.rs keep_awake, the mod's selfReport, docs/BRIEF.md, ADR 0136). The same morning majordomus brief named another session's episode and a task that had finished partial on 10-23, showed a 17 h old integration observation as current while origin/master was three merges further on, cut peer intents mid-word, and said nothing about the machine (swap 91 %), the CI pool (16 queued, three self-hosted runners idle) or the session's own pull requests and runs, which were the night's blockers."
current_state: "On bd373b4b7d7 (#2605's head merged with master 5370ee63d19): brief.rs keep_awake asks for a report of a fixed number of lines and names five categories; register.ts selfReport appends the same in other words and parses the brief's prose with regular expressions to decide what changed; session_section asks continuity.state (50 s cold) and falls back to the pointer's episode without saying so; integration_section relays prs brief's sentence with no age verdict; peers lines clip intents at 72 characters; there is no work, CI or machine section and no attention list."
desired_state: "share/brief/report.yaml (schema majordomus/brief-report/v1) is the one declaration of the report; majordomus generate writes its compiled copy; brief.session answers attention, report.prompt, report.reminder and per-section fingerprints beside the sections session, work, peers, mesh, integration, ci, machine, release and derive, each with its observed envelope and budget; the mod relays report.prompt and report.reminder verbatim and decides a change by the fingerprints; docs/BRIEF.md, the mod README and ADR 0136 cite the contract without copying it; cases 4401 to 4405 hold it."
