  - "lib/capture.sh"
  - "lib/checkpoint.sh"
  - "lib/handover.sh"
  - "lib/common.sh"
  - ".claude/hooks"
  - ".ai/repo/automation/inventory.jsonl"
  - "share/schemas/majordomus/session-record"
  - "docs/CONTINUITY.md"
