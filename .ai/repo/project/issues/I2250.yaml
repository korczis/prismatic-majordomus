id: I2250
milestone: a-provider-hook-refuses-an-out-of-scope-edit
title: "The provider declaration says, with a dated source, which providers can refuse a tool call before it runs"
slug: providers-declare-tool-call-refusal
priority: p1
profile: implementation
parallel_safe: true
objective: "Add a tool-call refusal capability to each provider in share/providers.yaml (hook, unsupported or unadapted, with a source URL and a verification date), project it to docs/generated/providers.md and doctor, and emit no configuration for a provider that cannot refuse."
why: "share/providers.yaml records session and prompt hooks per provider with sources dated 2026-09-11 (share/providers.yaml:109-142) and nothing about refusing a tool call; Codex is declared unadapted (share/providers.yaml:127). Without the column, an adapter cannot say where enforcement is native and where it is not (pack M06-I01, I04)."
current_state: "No provider declares whether it can refuse a tool call."
desired_state: "Every provider carries the capability with evidence; doctor and the generated provider document show it; adapters read it."
scope:
  - "share/providers.yaml"
  - "share/schemas/majordomus"
  - "apps/majordomus-cli/src/providers.rs"
  - "docs/generated"
  - "scripts/ci/providers-check"
  - "test/cases"
non_scope:
  - "Writing any adapter (I2251, I2252)"
depends_on: []
acceptance_criteria:
  - "Every declared provider has the capability with a source and a date, and providers-check fails on a missing one"
  - "docs/generated/providers.md shows the column, regenerated by majordomus generate"
  - "A provider declared unsupported has no generated hook configuration"
validation:
  - "bin/majordomus plan validate"
  - "scripts/ci/providers-check"
  - "bin/majordomus-cli generate --check"
evidence_required:
  - "provider_refusal_matrix"
created_at: 2026-10-09
updated_at: 2026-10-09
