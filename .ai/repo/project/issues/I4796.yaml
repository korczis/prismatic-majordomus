non_scope:
  - "Judging whether a locator supports its claim, or whether a formula compares like with like: that is the cross-check's work"
  - "Checking prose outside the tables; a claim that matters is a row"
  - "Storing an analysis as reasoning records under .ai/local: an analysis is published, records are not"
  - "Requiring an advisor (project.advisors-are-optional)"
