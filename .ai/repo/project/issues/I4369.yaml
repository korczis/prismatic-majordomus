acceptance_criteria:
  - "Case 4369, against a scripted forge in a fixture repository with git history: after a rename of V606 to V607 with `replaces: [V606]`, --check reports V607 behind and does not report V607 missing or the V606 issue unmanaged (both of which today's code reports); --apply moves the marker of the issue projected for V606 to V607 and retitles it, makes no create, and a second --apply writes nothing and a second --check exits 0"
  - "When V606 and V607 both have an issue, --apply closes the V606 issue as not planned with the comment 'superseded by #<n of V607>' and writes nothing else to it; a second --apply writes nothing, and --check then reports no drift for either issue and exits 0"
  - "After a fixture rename of milestone M006 to M007 with `replaces: [M006]`, --check does not report M007 missing; --apply retitles the GitHub milestone of M006 to M007's title, creates no milestone, and the issues assigned to it stay assigned"
  - "Without `replaces:`, --check reports the V606 issue unmanaged, naming the commit that deleted V606.yaml, and exits 11; --apply leaves it open with its marker and title and creates the V607 issue; an issue claiming an id that was never a record is reported unmanaged without a commit, as today (case 45's I9999 finding still passes); in a shallow clone that lacks the deleting commit, the finding says the history could not be read rather than reading as never a record"
  - "plan validate, from bin/majordomus and from the Rust capability alike, refuses `replaces: [V606]` while V606.yaml still exists, and the same former id claimed by two records; case 99's two engines agree on both findings"
  - "`next --kind issue` (I4357) never hands out an id that a `replaces` entry names, and the identifier landing check refuses a new record carrying such an id"
validation:
