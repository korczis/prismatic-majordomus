id: I3363
milestone: a-foreign-repository-is-adopted-and-measured
title: "One admitted foreign repository is adopted from the published installer to an accepted finish by a real coding agent, and its record is committed whatever its outcome"
slug: a-foreign-repository-is-adopted
priority: p0
profile: implementation
objective: "In a local clone of an admitted candidate at its adopted commit, follow the workflow literally from the published installer: init, update, capture install, a first task by a real coding agent under majordomus start with a narrow scope, the first refusal, the accepted finish after the repository's own verify command passes, and removal. Read step times from majordomus history --json (task.started, task.refused, task.finished) and from the run clock where no ledger line is written. Commit the T1 trial record and regenerate the economics projections."
why: "This is the experiment T1 of the owner's report of 2026-10-19 asks for. It does not wait on I3127 (BLOCKED), because the ledger observes the task steps. A failed run is recorded and published, never retried silently."
current_state: "lib/finish.sh:108 writes task.refused and :131 task.finished; lib/check.sh:51-58 writes no line for a refused check, so that refusal is timed by the run clock. No adoption record exists."
desired_state: "At least one committed T1 record of an admitted repository; the T1 row reads a computed status."
scope:
  - ".ai/repo/benchmarks"
  - "docs/generated/economics.json"
  - "docs/generated/economics.md"
  - "docs/generated/economics.yaml"
  - "site/data/generated/economics.json"
non_scope:
  - "Pushing to the adopted repository's remote"
  - "Fixing what the run meets (I3365)"
  - "Repository contents in the record"
depends_on:
  - "I3362"
serves:
  - "the-product-proves-it-pays#a-foreign-repository-reaches-an-accepted-finish"
acceptance_criteria:
  - "The record passes the loader and names its candidate"
  - "Each timing names its source"
  - "The agent and version and the count of manual interventions are recorded"
  - "Each friction met has an id and a declared code"
  - "If reached_accepted_finish is false, the record is committed anyway and the issue states what stopped it"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test economics"
  - "majordomus economics proof"
  - "majordomus plan validate"
  - "scripts/derive-check"
evidence_required:
  - "adoption_record_committed"
created_at: 2026-10-19
updated_at: 2026-10-19
