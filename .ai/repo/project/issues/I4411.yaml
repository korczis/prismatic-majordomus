  - "Case 4411: the same commit with scope `lib` prints `0 touched file(s) within scope, and N of the layer (.ai/) admitted` with N equal to the files the commit changed, and finish --check still exits 0"
  - "Case 4411: a task whose only commits since start are a trunk merge prints a scope line that names the commit count and says they are merges or trunk commits this checkout did not make"
  - "Cases 108, 108b, 1073 and 25 pass unchanged"
  - "Before the change, case 4411 fails on the first criterion (0 touched files and a single head)"
  - "docs/claims/finish-contract.md, consistency-check.md and divergence-label.md show the new lines, and their site/content/guarantees projections are regenerated"
