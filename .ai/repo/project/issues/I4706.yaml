non_scope:
  - "Fetching a dependency's upstream at commit time without a network. An unreadable upstream refuses at push and is reported, not refused, at commit, and the answer says which"
  - "Updating a pin automatically"
  - "Dependencies that a package manager resolves (lockfiles). Their own tools judge them"
depends_on: []
acceptance_criteria:
  - "Case 4706: a fixture repository declares a submodule consumed from a local upstream. A commit that bumps the gitlink to a commit on the upstream branch passes commit validate and finish --check"
  - "A commit whose gitlink points at a commit made inside the submodule's checkout and absent from the upstream is refused by both, naming the path and the commit"
  - "A commit that changes a declared vendored directory without the sync trailer is refused. With the trailer and the command's output, it passes"
  - "doctor names a declared submodule whose checkout is dirty"
  - "A repository that declares nothing is unaffected"
validation:
