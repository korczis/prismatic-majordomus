# Every field a mesh event carries, and whether its value is redacted before it is signed.
# `scripts/ci/mesh-check` reads this file against apps/majordomus-cli/src/mesh/journal.rs;
# test/cases/3051_an_unlisted_event_field_fails_the_mesh_check.sh holds the two to each other.
#
# Why this file exists (I2708). The mesh signs each event body into the journal and replicates
# it, in clear, over plain HTTP to every linked runtime. A field added to `EventBody` reached
# every machine the day it merged, and nothing asked whether anyone had decided it may. Now
# the gate fails on:
#
#   - a field of an `EventBody` variant that is not listed here;
#   - a field of a struct a variant carries (`SessionInfo`, `HandoverBody`, and whatever brace
#     struct of journal.rs a variant names next) that is not listed here;
#   - an entry whose value is neither `redacted` nor `clear`;
#   - an entry for a field the source no longer has.
#
# The values:
#
#   redacted  the value passes redaction::redact_secrets before the event is signed, so a
#             credential the author pasted travels as a marker (say where, in a comment);
#   clear     the value is signed and replicated as written. Choosing `clear` is a decision
#             that the field carries no secret: an identifier, a digest, a path inside the
#             repository, a word from a fixed vocabulary.
#
# A container field (`info`, `handover`) is `clear` as a field; what it carries is decided
# field by field under its struct's own name below.
#
# Free text is where a credential arrives. The handover body is redacted in mesh/handover.rs
# and a review's subject, body, verdict and notes in mesh/cooperation.rs, each before signing.
# A claim's or a session's intent is listed `clear` because that is what the code does now, not
# because it is decided right.
version: 1
fields:
  # ------------------------------------------------------------- EventBody variants
  EventBody.SessionOpened.info: clear
  EventBody.SessionClosed.session: clear
  EventBody.ClaimAcquired.claim: clear
  EventBody.ClaimAcquired.session: clear
  EventBody.ClaimAcquired.scope: clear
  EventBody.ClaimAcquired.intent: clear
  EventBody.ClaimAcquired.mode: clear
  EventBody.ClaimAcquired.issue: clear
  EventBody.ClaimReleased.claim: clear
  EventBody.HandoverPublished.handover: clear
  EventBody.HandoverConsumed.handover: clear
  EventBody.HandoverConsumed.session: clear
  EventBody.ReviewRequested.review: clear
  EventBody.ReviewRequested.session: clear
  # mesh::cooperation::request_review passes subject and body through redact_secrets
  EventBody.ReviewRequested.subject: redacted
  EventBody.ReviewRequested.scope: clear
  EventBody.ReviewRequested.issue: clear
  EventBody.ReviewRequested.reviewer: clear
  EventBody.ReviewRequested.body: redacted
  EventBody.ReviewAnswered.request: clear
  EventBody.ReviewAnswered.session: clear
  # mesh::cooperation::answer_review passes verdict and note through redact_secrets; a verdict
  # is then one of approved, changes_requested, commented, so a credential there is refused
  EventBody.ReviewAnswered.verdict: redacted
  EventBody.ReviewAnswered.note: redacted
  EventBody.ReviewWithdrawn.request: clear
  EventBody.ReviewWithdrawn.session: clear
  # mesh::cooperation::withdraw_review passes the note through redact_secrets
  EventBody.ReviewWithdrawn.note: redacted
  EventBody.NoticePublished.session: clear
  # mesh::cooperation::publish_notice passes subject and text through redact_secrets: both are
  # free text a seat writes about what it did, and they cross machines (I2874, I2708)
  EventBody.NoticePublished.subject: redacted
  EventBody.NoticePublished.text: redacted
  EventBody.NoticePublished.bytes: clear
  # ------------------------------------------------------------- SessionInfo (session_opened)
  SessionInfo.session: clear
  SessionInfo.client: clear
  SessionInfo.worker: clear
  SessionInfo.intent: clear
  SessionInfo.task: clear
  SessionInfo.issue: clear
  SessionInfo.milestone: clear
  SessionInfo.checkout: clear
  SessionInfo.branch: clear
  SessionInfo.head: clear
  SessionInfo.dirty: clear
  SessionInfo.context: clear
  SessionInfo.client_pid: clear
  SessionInfo.client_started: clear
  # ------------------------------------------------------------- HandoverBody (handover_published)
  HandoverBody.id: clear
  HandoverBody.task: clear
  HandoverBody.issue: clear
  HandoverBody.milestone: clear
  HandoverBody.branch: clear
  HandoverBody.head: clear
  HandoverBody.created_at: clear
  HandoverBody.name: clear
  # mesh::handover::to_body passes the body through redaction::redact_secrets before signing
  HandoverBody.body: redacted
