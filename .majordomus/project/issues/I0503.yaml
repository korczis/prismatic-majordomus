id: I0503
milestone: routing-recommendations
title: Return no recommendation where the data is too thin, and say why
slug: no-weak-recommendation
priority: p3
profile: debugging
parallel_safe: false
objective: "Make insufficient data produce no recommendation rather than a weak one, with the threshold declared as data and the reason printed, proved by cases on both sides of it."
why: "The failure mode of every routing feature is a confident answer from three data points. Refusing to answer is the behaviour that has to be tested, because it is the one that will be pressured away."
current_state: "The command recommends from whatever measurements exist."
desired_state: "Below the threshold the command returns no recommendation and names what it would take to have one; above it, the recommendation carries its denominator."
scope:
  - lib
  - test/cases
non_scope:
  - A weaker recommendation with a caveat attached
depends_on:
  - I0502
acceptance_criteria:
  - The threshold is declared as data and printed with every answer and every refusal
  - Below it, no profile is named at all
  - Cases cover both sides of the threshold
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "A threshold nobody can reach makes the whole command dead code; if the case shows the bar is unreachable in practice, that is a finding about the milestone, not a reason to lower it quietly."
created_at: 2026-09-04
updated_at: 2026-09-04
