id: I2415
milestone: the-mesh-works-out-of-the-box
title: "A mesh review request carries a body, can be withdrawn, and expires"
slug: a-review-request-ends
priority: p2
profile: implementation
parallel_safe: true
objective: "Give review requests a body beside the 256-byte subject, a withdraw event its requester may write, an optional expiry, and a result note the requester may attach to its own request, so a request ends instead of staying open forever."
why: "ReviewRequested has a subject capped at 256 bytes and no body (apps/majordomus-cli/src/mesh/journal.rs:520-536, 702); ReviewState is only Open or Answered (state.rs:341-346); KNOWN_KINDS has no close or expiry (journal.rs:553-561); and a requester cannot answer its own request (cooperation.rs:3617-3620). On 2026-10-10 pre-flight requests for rebuilt, void heads stayed open, and results had to be posted as new requests."
current_state: "Requests stay open until someone else answers; no body, no withdrawal, no expiry."
desired_state: "body up to 8 KiB; review_withdrawn by the requester; expires_at honoured by the fold; a requester's own result note linked to its request without counting as another session's verdict."
scope:
  - "apps/majordomus-cli/src/mesh/journal.rs"
  - "apps/majordomus-cli/src/mesh/state.rs"
  - "apps/majordomus-cli/src/mesh/cooperation.rs"
  - "apps/majordomus-cli/src/capability/builtin/mesh.rs"
  - "docs/MESH.md"
acceptance_criteria:
  - "A request with an 8 KiB body replicates and folds on two runtimes"
  - "A withdrawn or expired request folds to a closed state on every runtime"
  - "A requester's result note is shown with its request and is not an answer"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --lib mesh::"
evidence_required:
  - "review_lifecycle_test"
created_at: 2026-10-10
updated_at: 2026-10-10
