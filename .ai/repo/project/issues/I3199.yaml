id: I3199
milestone: mesh-peers-execute-assigned-work
title: "An assignment names the execution profile it needs, and a peer whose envelope does not satisfy it is refused"
slug: a-profile-picks-the-peer
priority: p3
profile: implementation
objective: "Carry the effective profile limits (write, deploy, tests required) on an assignment, compare them with each candidate peer's declared envelope, refuse an unsatisfying peer by the missing limit, and refuse an implementer as its own verifier."
why: "The 09-20 profiles talk: roles that exist only in a prompt are roleplay; separation of duties must be runtime behaviour. runtime-adapters derives the limits (I0201-I0206). Proposed in ADR 0205 (What a runtime can do is a set of separately evidenced facts, and detection never authorises) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c160#3, chatgpt-majordomus:c082#10."
current_state: "Verified: I0201 READY, I0202-I0206 BLOCKED (majordomus plan show, 2026-10-18); no peer envelope exists."
desired_state: "assignment.offer checks the envelope; the plan surface shows the refusal."
scope:
  - "apps/majordomus-cli/src/mesh/cooperation.rs"
  - ".ai/repo/profiles"
non_scope:
  - "Choosing models"
depends_on:
  - "I3198"
  - "I0202"
serves:
  - "nothing-in-the-mesh-waits-on-something-dead#assigned-work-returns"
acceptance_criteria:
  - "The scheduler refuses a peer that does not satisfy the profile and names why"
  - "Implementer and verifier of one issue differ"
validation:
  - "majordomus plan validate"
  - "cargo test --lib mesh::cooperation"
evidence_required:
  - "test_a_profile_picks_the_peer"
