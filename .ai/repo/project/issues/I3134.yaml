objective: "Make the owner's chosen product sentence a field of the declared site copy, have scripts/generate-site-data read it instead of grepping README.md for '**A lightweight', render README's bold line and lead from it (or fail homepage-check when they differ), and close docs/HARDCODING_LEDGER.yaml row product-sentence-has-two-wordings."
why: "The owner's standing order of 2026-10-13 is that the landing page reflects and derives the positioning. Today the sentence a visitor reads depends on the door: the homepage hero (edited 2026-10-16, I2745) and the README's 'A lightweight supervisory control layer' disagree, and every page title follows the README by a grep. Proposed in ADR 0210 (The sentence that says what Majordomus is has one declaration, and every surface reads it) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c250#2, chatgpt-majordomus:c250#4, chatgpt-majordomus:c156#4, chatgpt-majordomus:c001#26, chatgpt-majordomus:c038#0."
current_state: "scripts/generate-site-data:317 TAGLINE=grep '^\\*\\*A lightweight' README.md; site/templates/base.html:27-51 use project.tagline for title, description and og:description; site/data/marketing.toml [hero] title/subtitle/lead; ledger row status open, recommended MOVE_TO_CANONICAL_DATA."
desired_state: "One declaration; every reader derived; homepage-check holds README and titles to it."
