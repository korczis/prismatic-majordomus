profile: implementation
objective: "Extend the idempotency case so that it proves three behaviours the deriver has by construction and no case asserts. An identical observation recorded twice in one episode derives one file. A task finished partial yields no candidate, while knowledge.derived is still written. Two episodes of one checkout closing concurrently each write their own candidate once, knowledge check passes, and no staging file is left."
why: "The owner's 2026-10-19 Cognitive Fabric pack lists the same observation twice, a partial task and a multi-peer race among its verification cases (campaigns/prismatic-way-cognitive-fabric-prompt-pack/prompts/03_KNOWLEDGE.md). verification/ACCEPTANCE.md asks for the same canonical state after a duplicate replay. This is wave 0: a change to tests only."
current_state: "lib/knowledge.sh:1118-1129 digests kind, subject and statement, so a repeated observation maps to one id. :1105-1113 maps no partial outcome, and :1259-1273 stages and renames atomically. Case 564 proves the rerun idempotent and case 981:59-61 proves replay. No case records an observation twice, finishes a partial task or closes two episodes concurrently."
desired_state: "Case 564 asserts the three behaviours and fails when any of them breaks."
