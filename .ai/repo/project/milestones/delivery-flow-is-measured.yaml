id: delivery-flow-is-measured
title: "The way from a pull request to a verified publication is measured per phase, and its bounds are read where work starts"
slug: delivery-flow-is-measured
order: 179
priority: p1
problem: "Between 2026-09-10 and 2026-10-18 the owner asked more than a dozen times for faster turnaround and an empty backlog, and every audit reconstructed queue waits and lead times by hand from run timestamps. The repository measures CI run durations and merges per day, but not the wait before a run starts, not what happens after a merge, and its backlog bound is an environment default of one script. Proposed in ADR 0196 (Delivery latency targets are budgets of benchmark policy, measured per phase, and never a correctness gate on runners the repository does not own); ADR 0197 (The backlog is bounded by a declared bound that every session reads at start, and the bound reports rather than refuses); ADR 0198 (Delivery is judged by verified outcomes landed per day, with lead time p95 as its control, never by commits, pull requests or sessions) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c199#14, chatgpt-majordomus:c255#7, chatgpt-majordomus:c204#2, chatgpt-majordomus:c216#6, chatgpt-majordomus:c238#2, chatgpt-majordomus:c280#2, chatgpt-majordomus:c287#2, chatgpt-majordomus:c295#7, chatgpt-majordomus:c112#3, chatgpt-majordomus:c207#6, chatgpt-majordomus:c209#3."
outcome: "Queue time, run time and lead time per phase are derived readings; the backlog bound is policy and the brief says when it is passed; finish names the pull request it hands on; budgets exist per phase without turning runner wall time into a correctness gate."
current_state: "Verified on master 707a04c7ce8: integration.timings measures started-to-completed only (timings.rs); I2474 draws merges per day; scripts/ci/backlog-check reads MJ_BACKLOG_MAX (default 10); brief.rs reports prs brief without a bound; lib/finish.sh names no pull request. I2946 (board on 2026-10-18, p7, not on master) measures throughput from prs and ci-timings."
desired_state: "One measured flow from opened to served-verified, read by the drain screen, the brief, CLI, HTTP and MCP from the same capabilities, with unmeasured phases said as unmeasured."
scope:
