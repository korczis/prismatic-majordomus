id: I3013
milestone: test-evidence
title: "The evidence job runs only when a planned lane ran tests, so a records-only pull request is not red"
slug: the-evidence-job-runs-only-when-a-lane-left-a-report
priority: p1
profile: implementation
parallel_safe: true
objective: "validate.yml's evidence job runs when the plan selected a lane that runs tests and leaves a report (the shell suite, or the crate's tests under rust_check) and that lane ran, instead of whenever the rust job succeeded. A records-only plan, whose rust lanes only build the executable and run the registry checks (rust_integration), then skips the evidence job rather than failing it at evidence-collect's exit 12."
why: "On 2026-10-20 the records pull requests #1745, #1746 and #1749 (validate run 39483394648, job 118855710606) all ended with evidence red: 'evidence-collect: no report to record: the suite and the crate both left none', exit 12 in the gather step. Their plan ran rust-check --integration in lane 3, which writes no cargo test output, ran nothing in lanes 1 and 2, and skipped the suite. The job's condition (validate.yml, the evidence job's if) fires on needs.rust.result == success, so it ran with nothing to record and failed. A red check that says nothing about the change trains everyone to read red as noise, and the landing seat has to explain it on every records batch."
current_state: "The evidence job's if is always() && (suite succeeded or failed, or rust succeeded or failed). rust succeeds on an integration-only plan, which runs no test, so the job runs and scripts/ci/evidence-collect exits 12."
desired_state: "The evidence job's if names the plan outputs that make a lane leave a report (shell_suite, rust_check) together with that lane's result. A plan that selects neither skips the job. evidence-collect keeps refusing a run where a planned lane should have left a report and left none."
scope:
  - ".github/workflows/validate.yml"
  - "test/cases/3402_a_records_only_plan_owes_no_test_report.sh"
  - ".ai/repo/project/issues/I3013.yaml"
  - "site"
non_scope:
  - "Making evidence-collect pass with nothing to record: a planned lane that left no report stays a failure"
  - "The rust lanes' modes and what rust-check --integration runs"
depends_on: []
acceptance_criteria:
  - "The evidence job's if requires that the plan selected shell_suite or rust_check and that the matching job succeeded or failed"
  - "A case evaluates the job's condition for a records-only plan (shell_suite false, rust_check false, rust_integration true, rust success) and finds it false, and for a suite or crate-test plan finds it true"
  - "A records-only pull request's validate run shows evidence skipped, not failed"
validation:
  - "bash test/run.sh 3402_a_records_only_plan_owes_no_test_report"
  - "bash test/run.sh 26_ci_wiring"
  - "majordomus plan validate"
  - "scripts/derive-check"
evidence_required:
  - records_only_plan_case
created_at: 2026-10-20
updated_at: 2026-10-20
