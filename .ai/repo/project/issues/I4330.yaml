id: I4330
milestone: the-plan-says-what-a-fix-unblocks
title: "plan next and plan waves give each open issue its tail, and split the open graph into lanes with one take-next each"
slug: the-plan-gives-each-issue-its-tail-and-lane
priority: p2
profile: implementation
parallel_safe: false
objective: "apps/majordomus-cli/src/plan.rs computes a tail for every open issue: the length of the longest chain of open dependents after it, beside its wave, which is the longest path to it (plan.rs:375). plan.next and plan.ready rank READY issues by (tail descending, wave, priority, id) instead of (wave, priority, id) (plan.rs:567-580), so the first issue named is the one that unblocks the most remaining depth. plan.waves also splits the open graph into lanes: the weakly connected components of the open dependency graph, merged where their issues share a scope path (the I0004 serialisation). Each lane has its ready issues ordered by tail and one take_next. Every issue object on the CLI, HTTP and MCP carries its tail and its lane. ui/milestone.rs critical_path() (I2471) reads the same longest-chain function."
why: "Observed on 2026-10-28 while dispatching OSCILLA (korczis/oscilla) work with majordomus 1.0.0-alpha.8. The owner asked for one live plan the whole mesh dispatches from. `plan next` names one issue and `plan waves` gives topological waves, but nothing computes each issue's remaining chain length or groups independent lanes. The session built this by hand as a shared board: round as the longest open chain before an issue, tail as the longest after it, and take-next as the ready issues sorted by tail. On master 81ef931a3e1 the only longest-chain computation is ui/milestone.rs critical_path() (:72-117), which works per milestone and only for display. I0004 (M000) put 'Estimation or critical-path scheduling' out of scope as a cut of the first slice, not as a decision, and no later issue or ADR takes up a per-issue tail or lanes."
current_state: "On master 81ef931a3e1, plan.next orders READY issues by wave, priority and id, no issue carries a tail, and plan.waves reports scope-overlap serialisation but no lanes."
desired_state: "Each open issue carries its tail and lane, plan next names the ready issue with the longest tail first, and plan waves lists the lanes, each with one take-next."
scope:
  - "apps/majordomus-cli/src/plan.rs"
  - "apps/majordomus-cli/src/capability/builtin/plan.rs"
  - "apps/majordomus-cli/src/ui/milestone.rs"
  - "docs/PLANNING.md"
non_scope:
  - "Reporting a claimed or PR'd issue as taken, and claim staleness (I3971, I3754, I3990)"
  - "What accepting an issue unblocks, counted by plan.impact (I3267): tail is depth, not count"
depends_on: []
acceptance_criteria:
  - "On a fixture graph A->B->C and D->E with A and D ready, A has tail 2 and D has tail 1, and plan next names A first"
  - "plan waves in JSON gives every open issue its tail and lane, and the fixture has two lanes, each with one take_next"
  - "Two components whose issues share a scope path form one lane"
  - "The roadmap's per-milestone critical path is unchanged on master's plan"
  - "Before the change the ordering test fails, because D precedes A by id"
validation:
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib plan::"
  - "bin/majordomus plan validate"
evidence_required:
  - "plan_tail_and_lanes_unit_tests"
serves: []
created_at: 2026-10-28
updated_at: 2026-10-28
