id: the-hub-is-reached-from-any-device
title: "The hub is reached privately from any of the owner's devices, and a public ingress is configuration"
slug: the-hub-is-reached-from-any-device
order: 174
priority: p2
problem: "On 2026-09-11 the owner chose Lundra over a free PaaS and asked to try the hub over a Tailscale name now and majordomus.dev (Cloudflare) later. The lundra hub runs as a systemd user unit started by hand; no deployment target describes it and no surface knows its external URL. Proposed in ADR 0204 (The hub is reached privately over the tailnet first; a public ingress is a deployment target, never an application change) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c118#6, chatgpt-majordomus:c118#9."
outcome: "The hub is a declared deployment target with a tailnet ingress, and the external URL is one typed fact."
current_state: "Verified: .ai/repo/deployments/majordomus.yaml declares the GHCR image with listen.interface: all (I0903 and I0904 done) and no hosting provider (owner order 2026-10-12); no external_url or trusted-host field in apps/majordomus-cli/src."
desired_state: "Deployment targets local and tailnet share one origin; served observe probes the ingress chain from a tailnet device and from outside it."
scope:
  - ".ai/repo/deployments"
  - "share/schemas/majordomus/deployment"
  - "apps/majordomus-cli/src/deploy"
  - "apps/majordomus-cli/src/capability/builtin/deploy.rs"
non_scope:
  - "Router port-forwarding"
  - "Any free PaaS"
  - "Joining public CI to the tailnet"
acceptance_criteria:
  - "A second authorised device reaches /ui, the API and MCP of the hub over its tailnet name"
  - "No hostname or address of the hub is a source constant"
validation:
  - "majordomus plan validate"
evidence_required: []
depends_on:
  - "safe-self-update"
risks:
  - "Tailscale CLI syntax drift (knowledge note)"
  - "Ingress must wait for web-sign-in before anything but reads reaches the hub"
created_at: 2026-10-18
updated_at: 2026-10-18
