id: I2718
milestone: development-runtime
title: "A linked worktree runs its own hooks, never the primary checkout's"
slug: a-worktree-runs-its-own-hooks
priority: p0
profile: implementation
parallel_safe: true
depends_on: []
objective: "Make every linked worktree run, and doctor judge, the hooks of its own tree, so that a stale primary checkout cannot refuse or weaken the commits of every other worktree."
why: "2026-10-14 ~19:25Z: commits on branches based on current master were refused in every worktree with \"FAIL wiring ssh-permissions-on-commit — providers-check --permissions-only is not invoked by <primary checkout>/.githooks/pre-commit\". core.hooksPath is the relative `.githooks`, and git 2.55 resolves it against the MAIN worktree (`git -C <linked worktree> rev-parse --git-path hooks` answered the primary's path), so all 329 linked worktrees ran the primary checkout's hooks, and the primary sat at afbc25924a (2026-10-11). Fixed by hand at 19:3xZ with the owner's approval: the primary's .githooks restored from origin/master, extensions.worktreeConfig enabled (repositoryformatversion 1), and each linked worktree given core.hooksPath = its own absolute .githooks in its config.worktree. A worktree created after that falls back to the primary again."
current_state: "The per-worktree setting exists only where it was set by hand; `majordomus worktree create` does not set it; doctor's wiring check reads whatever `git rev-parse --git-path hooks` answers without saying which tree's hooks those are."
desired_state: "`majordomus worktree create` (and `worktree migrate`/repair) sets the worktree's own core.hooksPath, enabling extensions.worktreeConfig when it is off; doctor fails, with the command that fixes it, when a linked worktree's hooks resolve outside its own tree; the main worktree keeps `.githooks`."
scope:
  - apps/majordomus-cli/src/worktree
  - apps/majordomus-cli/src/commands/worktree.rs
  - lib/doctor.sh
  - docs/WORKTREES.md
  - test/cases
acceptance_criteria:
  - "A worktree made by `majordomus worktree create` answers its own .githooks to `git rev-parse --git-path hooks`"
  - "doctor in a linked worktree whose hooks resolve to another tree fails with the fixing command"
  - "The main worktree's hooks path is unchanged"
validation:
  - "bin/majordomus plan validate"
evidence_required:
  - "worktree_runs_its_own_hooks_case"
