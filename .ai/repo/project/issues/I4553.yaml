id: I4553
milestone: the-mesh-works-out-of-the-box
title: "A review request addressed to a session answers the route that wakes it, and the answer wakes the requester the same way"
slug: a-review-request-wakes-the-session-it-names
priority: p2
profile: implementation
parallel_safe: true
objective: "ReviewRequestInput and EventBody::ReviewRequested (apps/majordomus-cli/src/mesh/journal.rs) gain an optional `session` addressee, read with serde(default) so that a runtime written before the change reads a request without it, as it reads one without a body. The Written answer of mesh.review.request, and of mesh.review.answer for the requester, carries a `route` resolved from the board row's PeerAddress (apps/majordomus-cli/src/peers.rs): `{via: provider-socket, to: uds:<socket>}` when the row names a provider and a socket, `{unavailable: <why>}` otherwise. The requesting worker wakes the addressee with its own provider's messaging tool, carrying the review key; the addressee reads the request once by that key and answers it with mesh.review.answer, whose route wakes the requester, who reads the answer once. Majordomus sends nothing to the socket and never reads the provider's messaging token (peers.rs: the address is where to knock, not the key). `share/providers.yaml` gains a `messaging` cell in its `offers` block: `socket` for claude-code, with its citation, and `none` for every other provider. Optionally, scripts/lib/advisors/mesh-review.mjs follows the existing /events stream for its requester instead of reading mesh state every two seconds."
why: "The owner's Mesh Fabric pack of 2026-11-07 makes its first milestone two live AI peers exchanging a real request and answer without polling a shared board (campaigns/majordomus-mesh-fabric-pack-20261107/prompts/03-03-local-direct-routing.md, campaigns/majordomus-mesh-fabric-pack-20261107/prompts/05-05-agent-runtime-adapters.md). Measured on master on 2026-11-07: a review request is a signed, correlated request and answer in the journal, and every peer's board row carries its provider socket, but nothing reaches the addressee. A request names a runtime, never a session; the advisor polls mesh state every two seconds until an answer appears; and one bridge peer announces that replies to it are read at periodic checks. Sessions already wake each other through the provider's own messaging, informally and outside the record. This issue joins the two: the journal stays the durable record and the provider's channel only wakes. It changes the same review fields as I4327, so it follows it."
current_state: "A review request is addressed to a runtime or to anyone; its answer reaches the requester only when the requester reads mesh state again. The board row's socket is recorded and checked for existence, and nothing uses it. share/providers.yaml declares no messaging offer."
desired_state: "A request can name the session it is for, and its answer and the request each say how to wake the other side or why that is unavailable. A worker that follows the route is woken by the other side's answer, not by polling, and the exchange is recorded in the journal as before."
