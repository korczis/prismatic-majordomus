id: I4585
milestone: a-claim-stands-only-on-its-evidence
title: "A claim sourced outside the repository records where it came from and whether that source is official, and an unofficial one reads unverified"
slug: an-external-claim-carries-its-source-standing
priority: p3
profile: implementation
parallel_safe: true
objective: "A knowledge record or an evidence entry that rests on a source outside the repository (a vendor's documentation, a published article, a forum answer, a model's answer) names it with a typed reference `source:<url>` and a standing, `official` (published by the party the claim is about) or `unofficial`, and `majordomus knowledge check` reports a record whose claim rests only on unofficial sources as unverified, never as verified or decided."
why: "Intake from the kompendium-epistemicke-anihilace-2e session (2026-11-11 about 20:05Z, the owner's /evolve, principle 29), item K2: research claims taken from outside a repository need their provenance, legitimate or unofficial, and an unofficial source leaves the claim unverified. The knowledge schema (share/schemas/majordomus/knowledge/knowledge.v1.schema.json) has provenance.origin `authored` or `extracted` and typed derived_from references `decision`, `session`, `commit`, `issue`, `task`, `file` and `test`, all inside the repository: an outside source can be named only in prose, and its standing nowhere."
current_state: "At origin/master d34f159439f: derived_from's pattern admits no external source; epistemics is observed, inferred or decided, independent of where a claim came from."
desired_state: "A record citing `source:<url>` with standing unofficial and no other evidence reads unverified in knowledge check; with an official source, or with repository evidence beside it, it reads as today; a record with no external source is unchanged."
scope:
  - ".ai/repo/project/issues/I4585.yaml"
  - "share/schemas/majordomus/knowledge/knowledge.v1.schema.json"
  - "share/schemas/majordomus/knowledge/knowledge.v1.proto"
  - "lib/knowledge.sh"
  - "docs/KNOWLEDGE.md"
  - "test/cases/4585_an_external_claim_carries_its_source_standing.sh"
non_scope:
  - "Fetching or archiving the source"
depends_on: []
acceptance_criteria:
  - "A case checks three fixture records, one on an unofficial source alone, one on an official source, one with repository evidence beside an unofficial source, and reads unverified only for the first"
validation:
  - "bash test/run.sh 4585_an_external_claim_carries_its_source_standing 405_the_knowledge_reader_honours_the_schema"
evidence_required:
  - test
serves:
  - a-claim-stands-only-on-its-evidence#unproven-never-reads-pass
created_at: 2026-11-12
