acceptance_criteria:
  - "The unit tests of brief/report.rs, brief/machine.rs, brief/ci.rs, brief/work.rs, brief/refs.rs and brief/mod.rs pass, among them the_compiled_contract_is_the_share_file, every_attention_row_has_a_condition_and_every_condition_a_row, the_prompt_carries_every_attention_entry_verbatim_and_no_category_list, an_observation_past_its_bound_is_stale, peers_lines_are_never_clipped and a_section_over_budget_is_unread_not_late"
  - "Cases 4401 to 4405, 1065 and 501 pass"
  - "The mod's test proves report.prompt is submitted byte for byte and that only a changed section fingerprint triggers a report"
  - "This repository's policy switches session.brief_on_interval on, so capture install writes the mod to .claude/skills/majordomus-brief and the tracked copy is byte for byte share/mods/claude-code/majordomus-brief without its test: on 2026-10-29 the switch was on and nothing was installed, so sessions here were never briefed"
