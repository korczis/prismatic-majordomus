title: "The nine open UI pull requests are each landed, absorbed or superseded with a recorded reason before the reintegration touches their paths"
slug: the-open-ui-pull-requests-are-triaged
priority: p0
profile: implementation
parallel_safe: false
objective: "Slice S0 of milestone one-frame-one-kit-one-library-per-job. Each of the nine open UI pull requests #2583, #1761, #1346, #1345, #1178, #1050, #966, #933, #2349 is assessed through the one integration engine (majordomus prs explain <n>) and carried to one of three ends: landed through the landing seat's queue, absorbed into the slice that owns its paths (its commits kept, its pull request closed naming the absorbing slice), or superseded with its reason. A refs/rescue/ ref is written for each head before any branch is rewritten or any pull request is closed. The verdict, the reason and the rescue ref of each are recorded in this issue's evidence and in the pull request's closing comment."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). Nine open pull requests already change the paths the slices S1 to S12 rewrite; starting a slice over them would either conflict with them or silently drop their work."
current_state: "Open on 2026-11-07, read with gh pr view: #2583 feat(ui) the Blackboard is the board of the work (I4236), feature/the-blackboard-is-the-board-of-the-work; #1761 fix(ui) a screen behind the repository says why, and a page follows it by a pulse (ADR 0173), feature/a-display-behind-the-repository-says-why; #1346 feat(knowledge) /ui/knowledge browses the knowledge base, feature/the-knowledge-base-is-listed-and-browsed; #1345 feat(ui) a page computes the canonical digest in a Worker (I2788), feature/a-browser-computes-on-the-page; #1178 feat(ui) the Observatory hears executions as they happen (case 3046), feature/the-observatory-hears-executions-as-they-happen; #1050 Markdown is rendered once (ADR 0148), feature/markdown-is-rendered-once; #966 / is the UI's front door, and the capabilities are faceted (I2480, I2479), feature/the-capabilities-are-faceted; #933 feat(site) seven widths, a reduced-motion pass and a rendering budget, feature/the-site-is-probed-at-every-width-and-budget; #2349 feat(site) the navbar names the newest pre-release, feature/the-site-names-the-newest-prerelease. Each was last updated between 2026-10-30 and 2026-11-01."
desired_state: "Every one of the nine has a recorded verdict before any slice whose scope its diff touches starts; a landed or superseded one is closed, an absorbed one stays open until its absorbing slice merges and is then closed by that slice naming the delivering commit. Each one's end (landed, absorbed into a named slice, or superseded) and its reason are recorded, and each head is reachable from a refs/rescue/ ref or from master."
