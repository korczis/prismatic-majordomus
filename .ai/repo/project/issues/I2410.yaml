    result: "at master 2efeacea031: 19 passed 0 failed. C1: mesh::tailscale::tests::online_peers_are_asked_as_rendezvous_and_their_candidates_observed and peers_are_sorted_unique_and_ipv4_first (a stubbed tailscale status with online peers offers their tailnet addresses on the declared port). C2: a_running_provider_names_its_port_and_asks_nobody_when_no_peer_is_online (offline peer), unreadable_status_and_addresses_offer_nothing (no usable tailnet IP), a_machine_without_the_cli_stops_the_provider_with_the_reason_and_is_no_fault (missing CLI), each with its reason on the provider status. C3: mesh::cooperation::tests::isolation_version_trust_and_replay_are_typed_refusals (an untrusted peer is refused by the link, whatever offered the candidate). Landed through #947 in train 4 (35f852d9ed7, which names I2410)"
