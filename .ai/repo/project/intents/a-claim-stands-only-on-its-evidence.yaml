id: a-claim-stands-only-on-its-evidence
title: "A claim that something is enforced, tested or delivered stands only on recorded evidence that would have caught it being false"
statement: "The owner wants every rule, guarantee and delivered feature that Majordomus states to be backed by a recorded execution at the revision being shown. For a blocking rule, that execution shows a violation being refused. Every way around a gate (an override, a disabled protection, a proposed decision cited as law) must be visible. Any statement that lacks this evidence reads as not proven on every surface, never as done."
invariants:
  - "A blocking rule is reported proven only by a recorded run of a case in which its violation is refused"
  - "Proof states are computed from the executions recorded for the presented revision (the CI run's own record, or the tracked ledger where that revision's run is tracked); no surface types a verdict"
  - "Unknown, not run and stale are never rendered as pass"
  - "A merge past the required check, a protection that no longer requires the verdict, and a rule resting on a proposed ADR are each reported"
non_goals:
  - "A second rule engine, evidence store or \"rules self-check\" command beside rules/mod.rs, lib/doctrine.sh and scripts/ci/rule-proof-check"
  - "A global 100 percent coverage threshold; the differential gate stays the changed-code invariant"
  - "Blocking every change on mutation testing"
milestones:
  - "a-test-fails-when-the-code-is-wrong"
  - "a-claim-stands-only-on-its-evidence"
satisfaction:
  - id: blocking-rule-shows-refusal
    criterion: "majordomus-cli rules report names every blocking rule with no case whose '# majordomus-refutes:' header shows its violation refused; the count ratchets and only falls (planned proof: the new case carrying case_rule_refusal_ratchet (I3110); case 125 passes on master today and is not this proof)"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: validator-refuses-violation
    criterion: "Every dispatched blocking validator is run against a declared violation in a disposable repository and refuses it (planned proof: the new case carrying case_every_validator_refuses_its_violation (I3111); case 18 stays the wiring verifier's proof)"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: proof-from-ci-runs
    criterion: "On master, rule and claim states read the executions the validate run recorded for its own head, and the blocking rules no recorded run proves are printed (planned proof: majordomus-cli rules report --format json in the validate job after scripts/ci/evidence-collect; the new case carrying case_blocking_not_run_ratchet (I3112))"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: delivery-dimensions-computed
    criterion: "The delivery report computes required_tests_current, test_evidence_published and ui_linked; none reads unknown because of a pending pull request (planned proof: apps/majordomus-cli/src/delivery/mod.rs tests carrying delivery_test_dimensions_computed (I3119))"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: bypass-observed
    criterion: "A merge past the required check without a recorded authorisation, and a protection that stopped requiring ci, are findings of a gate (planned proof: docs/CLAIMS.yaml claim a-bypass-is-observed over the cases carrying case_protection_drift_refused (I3113) and case_expedited_merge_accounted (I3114))"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: critical-predicates-mutated
    criterion: "A scheduled mutation run over the declared critical predicates publishes its survivors as evidence (planned proof: docs/CLAIMS.yaml claim critical-predicates-are-mutated over the mutation_run_recorded record (I3120))"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: public-text-true
    criterion: "No README or site sentence contradicts master about runtime, model invocation, baselines or the edit guard (planned proof: docs/CLAIMS.yaml claim readme_claims_bound, held by scripts/ci/claim-proof-check (I3117))"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: unproven-never-reads-pass
    criterion: "No surface (/ui/rule, /ui/governance, the published snapshot, site/content/rules) draws a not_run, stale or unknown rule as pass, or as satisfied without its state (planned proof: the new case carrying case_unproven_never_reads_pass (I3112))"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
  - id: proposed-adr-reported
    criterion: "Every blocking rule or guarantee that cites a proposed ADR as its authority is listed, ordered by how many rest on it, as the owner's acceptance queue (planned proof: the new case carrying case_rule_on_proposed_adr_listed (I3115))"
    evidence: command
    ref: "majordomus intent explain a-claim-stands-only-on-its-evidence"
created_at: 2026-10-18
