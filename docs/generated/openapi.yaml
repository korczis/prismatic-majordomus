        status:
          anyOf:
            - "$ref": "#/components/schemas/DeploymentStatus"
            - type: "null"
          description: Where it stands.
          default: null
        application:
          type: string
          description: "The application's name at the provider."
        build:
          "$ref": "#/components/schemas/Build"
          description: What is shipped and what it is built from.
        listen:
          "$ref": "#/components/schemas/Listen"
          description: The address the process listens on.
        health:
          "$ref": "#/components/schemas/HealthRoutes"
          description: The routes a platform polls.
        resources:
          "$ref": "#/components/schemas/Resources"
          description: What one machine is granted.
        machines:
          "$ref": "#/components/schemas/Machines"
          description: How many machines run.
        region:
          type: string
          description: The region they run in.
        budgets:
          "$ref": "#/components/schemas/Budgets"
          description: The measured figures it is held to.
          default:
            image_bytes: null
            binary_bytes: null
            build_context_bytes: null
            cold_start_ms: null
            resident_memory_mb: null
            blocking_check_ms: null
            request_p99_ms: null
        provider:
          "$ref": "#/components/schemas/Provider"
          description: The provider and its own facts.
        created_at:
          type:
            - string
            - "null"
          description: When the object was written.
          default: null
        updated_at:
          type:
            - string
            - "null"
          description: When it was last changed.
          default: null
      required:
        - file
        - schema
        - kind
        - id
        - title
        - application
        - build
        - listen
        - health
        - resources
        - machines
        - region
        - provider
      description: "One deployment as this process reads it, with where it came from."
    Diagnosis:
      type: object
      properties:
        moments:
          type: array
          items:
            type: string
          description: "The moments the selection resolved to, in presentation order."
        unresolved:
          type: array
          items:
            type: string
          description: Selected names that resolved to nothing.
        areas:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          description: "Operational areas by how many selected moments fall under them, heaviest first."
        audiences:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          description: "Audiences by how many selected moments they recognise, heaviest first."
        capabilities:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          description: Capabilities of the executable that answer the selected moments.
        commands:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          description: Commands that answer them.
        claims:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          description: Claims that say what is guaranteed.
        doctrines:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          description: Rules of the effective set that govern them.
        use_cases:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          description: Use cases that show the way out.
        also_worth_reading:
          type: array
          items:
            type: string
          description: Moments the selection did not include that share an area with one that it did.
      required:
        - moments
        - unresolved
        - areas
        - audiences
        - capabilities
        - commands
        - claims
        - doctrines
        - use_cases
        - also_worth_reading
      description: "What a reader's selection implies, computed by counting rather than by inference.\n\nThe arithmetic is the whole model and is stated so a reader can check it: a selection\nresolves to a set of moments; an area or an audience scores the number of selected\nmoments that name it; a recommendation scores the number that name it and carries\ntheir ids. There is no weighting and no percentage, because there is no model behind\none."
    Diagnostic:
      type: object
      properties:
        severity:
          "$ref": "#/components/schemas/Severity"
          description: How bad.
        code:
          type: string
          description: "A stable machine-readable code, e.g. `unknown_key`, `duplicate_identity`."
        path:
          type:
            - string
            - "null"
          description: "Repository-relative path of the file concerned, when there is one."
        message:
          type: string
          description: "What is wrong, for a person; the code is for a program."
      required:
        - severity
        - code
        - message
      description: "One finding about the declarative state, named by a stable code, tied to a path where\nthere is one, and carrying the command that reproduces it where there is one."
    DiagnosticCode:
      oneOf:
        - type: string
          const: worktree.path_mismatch
          description: "A linked work tree is not at its branch's canonical path."
        - type: string
          const: worktree.container_occupied
          description: A linked work tree occupies the container path itself.
        - type: string
          const: worktree.nested
          description: A linked work tree sits inside the primary checkout or inside another work tree.
        - type: string
          const: worktree.destination_conflict
          description: The canonical path of a branch is occupied by something that is not its work tree.
        - type: string
          const: worktree.missing
          description: "A registered work tree's directory does not exist."
        - type: string
          const: worktree.stale_registration
          description: Git reports the registration as prunable.
        - type: string
          const: worktree.branch_already_checked_out
          description: A branch is checked out somewhere other than its canonical path.
        - type: string
          const: worktree.detached
          description: A linked work tree has no branch.
        - type: string
          const: worktree.ephemeral
          description: "A linked work tree is a session's scratch checkout: under the temporary directory or\nunder the primary checkout's `.claude/worktrees/`."
        - type: string
          const: worktree.primary_on_non_trunk
          description: The primary checkout holds a branch that is not the trunk.
        - type: string
          const: worktree.trunk_in_linked_worktree
          description: The trunk is checked out in a linked work tree rather than the primary checkout.
        - type: string
          const: worktree.path_escape
          description: A derived path would leave the container. Cannot happen for a valid branch name.
        - type: string
          const: worktree.invalid_branch_name
          description: A branch name git accepted that this executable cannot derive a path for.
        - type: string
          const: worktree.locked
          description: "A work tree is locked, so it cannot be moved until it is unlocked."
        - type: string
          const: worktree.migration_verification_failed
          description: A move happened and the fingerprint after it differs from the one before.
        - type: string
          const: worktree.trunk_unknown
          description: The trunk could not be determined.
        - type: string
          const: worktree.case_collision
          description: Two branch names map to one directory on a case-insensitive filesystem.
        - type: string
          const: worktree.cross_device
          description: "A move crossed devices and was made by copy, repair and verification."
      description: "The stable machine name of everything that can be wrong with the topology. One code per\ncondition, reused by the command line, the API, MCP, the Cockpit, the tests and the\ndocumentation; the prose beside a code is rendered from the typed state."
    DirectoryNode:
      type: object
      properties:
        path:
          type: string
          description: "Repository-relative, forward slashes."
        depth:
          type: integer
          format: uint
          minimum: 0
          description: Segments below the layer root; the root itself is 0.
        parent:
          type:
            - string
            - "null"
          description: "The directory above, when it is inside the layer."
        children:
          type: array
          items:
            type: string
          description: "The directories immediately below, sorted."
        state:
          "$ref": "#/components/schemas/DirectoryState"
          description: Whether it carries the contract it owes.
        requires_contract:
          type: boolean
          description: Whether a contract is owed here at all.
        governed_by:
          type:
            - string
            - "null"
          description: "The contract that made the requirement explicit, when one did."
        exempted_by:
          type:
            - string
            - "null"
          description: "The contract that released this subtree, when one did."
        objects:
          type: integer
          format: uint
          minimum: 0
          description: How many objects of any kind the index holds directly in this directory.
        contract:
          anyOf:
            - "$ref": "#/components/schemas/ContractView"
            - type: "null"
          description: "The contract this directory declares, before inheritance."
        effective:
          type: array
          items:
            "$ref": "#/components/schemas/EffectiveEntry"
          description: "The contracts that apply here once inheritance is resolved, least specific first.\nPresent when the request asked for it, or when it asked about one path."
      required:
        - path
        - depth
        - state
        - requires_contract
        - objects
      description: "One directory of the layer, what it owes, and what applies to it."
    DirectoryReport:
      type: object
      properties:
        root:
          type: string
          description: The layer root the tree is rooted at.
        tallies:
          "$ref": "#/components/schemas/DirectoryTallies"
          description: The directories in each state.
        directories:
          type: array
          items:
            "$ref": "#/components/schemas/DirectoryNode"
          description: "Every directory asked for, sorted by path."
      required:
        - root
        - tallies
        - directories
      description: "The layer's directories, what each owes, and the contracts that apply."
    DirectoryState:
      oneOf:
        - type: string
          const: documented
          description: It carries a context document of its own.
        - type: string
          const: exempt
          description: "It owes none, because a contract above it says so."
        - type: string
          const: owed
          description: It owes one and has none.
      description: Whether a directory of the layer carries the contract it owes.
    DirectoryTallies:
      type: object
      properties:
        directories:
          type: integer
          format: uint
          minimum: 0
          description: Every directory of the layer the index knows.
        documented:
          type: integer
          format: uint
          minimum: 0
          description: Carrying a contract of their own.
        exempt:
          type: integer
          format: uint
          minimum: 0
          description: Released by a contract above them.
        owed:
          type: integer
          format: uint
          minimum: 0
          description: Owing a contract and carrying none.
      required:
        - directories
        - documented
        - exempt
        - owed
      description: How many directories are in each state.
    DirtyState:
      type: object
      properties:
        staged:
          type: integer
          format: uint
          minimum: 0
          description: Entries with a change in the index.
        unstaged:
          type: integer
          format: uint
          minimum: 0
          description: Entries with a change in the work tree that is not in the index.
        untracked:
          type: integer
          format: uint
          minimum: 0
          description: "Untracked, not ignored, files."
        conflicted:
          type: integer
          format: uint
          minimum: 0
          description: Entries with an unresolved merge conflict.
        clean:
          type: boolean
          description: Nothing above is non-zero.
        in_progress:
          type:
            - string
            - "null"
          description: "A merge, rebase, cherry-pick, revert or bisect is in progress here."
      required:
        - staged
        - unstaged
        - untracked
        - conflicted
        - clean
      description: "Uncommitted work in a work tree, counted from `git status --porcelain`. Untracked\ncontent counts: it is exactly what a careless move loses."
    DistributionReport:
      type: object
      properties:
        binary:
          type: string
          description: The command a person types after installing.
        repository:
          type: string
          description: "`owner/name`, the only host release assets come from."
        installer_url:
          type: string
          description: "The installer's canonical URL."
        install_command:
          type: string
          description: "The one-line install command, composed from its parts."
        install_and_init_command:
          type: string
          description: "The same, initialising the repository afterwards."
        next_command:
          type: string
          description: What a person runs next.
        checksum:
          type: string
          description: The digest algorithm the installer verifies.
        install_dir:
          type: string
          description: Where the launchers go by default.
        prefix:
          type: string
          description: Where the versioned trees go by default.
        latest_url:
          type: string
          description: Where the stable release metadata is published.
        supported:
          type: integer
          format: uint
          minimum: 0
          description: How many targets a release builds.
        targets:
          type: array
          items:
            "$ref": "#/components/schemas/TargetView"
          description: "Every declared target, in the model's order."
      required:
        - binary
        - repository
        - installer_url
        - install_command
        - install_and_init_command
        - next_command
        - checksum
        - install_dir
        - prefix
        - latest_url
        - supported
        - targets
      description: "The distribution, as a person or a script asks for it."
    Divergence:
      oneOf:
        - type: string
          const: exact
          description: Written at this commit. Trust it.
        - type: string
          const: advanced
          description: "Git has moved forward since. Trust it, and expect some of it to be done."
        - type: string
          const: diverged
          description: "The recorded commit is not an ancestor: history was rewritten. Trust git, not this."
        - type: string
          const: different_context
          description: Another branch or another worktree. This record is not about your work.
        - type: string
          const: unknown
          description: "Git could not answer, so this process says so rather than guessing `exact`."
      description: "How far a record's recorded commit is from the commit this checkout is on.\n\nThe four words are the shell tool's, deliberately. A reader that met `advanced` from one\nsurface and `stale` from another would have to learn the same four facts twice."
    DocumentView:
      type: object
      properties:
        id:
          type: string
          description: "The document id, shared by every encoding of it."
        schema:
          type:
            - string
            - "null"
          description: The schema id its structured encodings carry.
        source:
          type: string
          description: "One line: what it was derived from."
        formats:
          type: array
          items:
            "$ref": "#/components/schemas/ArtifactFormat"
          description: "The encodings, in the manifest's order."
      required:
        - id
        - source
        - formats
      description: "One document, and the encodings it is committed in."
    Edge:
      type: object
      properties:
        source:
          type: string
          description: The node the edge leaves.
        target:
          type: string
          description: The node the edge enters.
        kind:
          type: string
          description: "One of the graph's declared edge kinds."
      required:
        - source
        - target
        - kind
      description: "One directed edge. Both ends are node ids of the same graph; a derivation that cannot\nresolve an end adds an external node rather than a dangling edge."
    EffectiveEntry:
      type: object
      properties:
        id:
          type: string
          description: "The document's identity."
        path:
          type: string
          description: "The document's path."
        depth:
          type: integer
          format: uint
          minimum: 0
          description: Depth below the layer root; less is less specific and applies first.
        order:
          type: integer
          format: int64
          description: "The declared order, the second sort key."
        composition:
          type: string
          description: "`extend`, `replace` or `final`."
        reason:
          type: string
          description: "Why it applies to this directory, in words."
        local:
          type: boolean
          description: "True for the directory's own document, false for one it inherits."
      required:
        - id
        - path
        - depth
        - order
        - composition
        - reason
        - local
      description: "One contract in a directory's effective chain, in the order it is applied."
    ErrorBody:
      type: object
      properties:
        error:
          "$ref": "#/components/schemas/ErrorDetail"
          description: The one error.
      required:
        - error
      description: The body of every error response.
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: "What kind of failure it is: `invalid_input`, `not_found`, `method_not_allowed`,\n`refused`, `forbidden`, `too_large`, `unavailable` (a surface whose producer has not\nrun) or `internal`."
        message:
          type: string
          description: "The reason, for a person."
      required:
        - code
        - message
      description: "What went wrong, as the HTTP projection names it."
    Example:
      type: object
      properties:
        id:
          type: string
          description: Unique within the moment.
        audience:
          type: string
          description: The audience this situation belongs to; must name an audience of the catalogue.
        title:
          type: string
          description: One line naming the situation.
        before:
          type: string
          description: What happens without the tool.
        after:
          type: string
          description: What happens with it.
      required:
        - id
        - audience
        - title
        - before
        - after
      description: "One concrete situation, in one audience, with what happens today and what happens\ninstead."
    Exposure:
      type: object
      properties:
        mcp:
          anyOf:
            - "$ref": "#/components/schemas/McpExposure"
            - type: "null"
          description: "The MCP projection, when declared."
        http:
          anyOf:
            - "$ref": "#/components/schemas/HttpExposure"
            - type: "null"
          description: "The HTTP projection, when declared."
        cli:
          anyOf:
            - "$ref": "#/components/schemas/CliExposure"
            - type: "null"
          description: "The command-line projection, when declared."
      description: "The projections a capability declares. Absence is explicit: `None` means not exposed\nthere, and nothing infers an exposure a descriptor did not declare."
    FacetValue:
      type: object
      properties:
        value:
          type: string
          description: The value as a moment declares it.
        label:
          type: string
          description: The name to show; the value itself when the taxonomy holds no title for it.
        count:
          type: integer
          format: uint
          minimum: 0
          description: How many public moments carry it.
      required:
        - value
        - label
        - count
      description: "One selectable value of one facet, with how many public moments carry it. Every filter\na reader is offered is one of these; nothing anywhere lists the values by hand."
    Facets:
      type: object
      properties:
        audiences:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By audience.
        areas:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By operational area.
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By tag.
        severities:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By severity.
        frequencies:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By frequency.
        lifecycle:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By stage of work.
        capabilities:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By capability of the executable.
        commands:
          type: array
          items:
            "$ref": "#/components/schemas/FacetValue"
          description: By command.
      required:
        - audiences
        - areas
        - tags
        - severities
        - frequencies
        - lifecycle
        - capabilities
        - commands
      description: "The filters the catalogue offers, derived from the records rather than declared."
    Fact:
      anyOf:
        - type: boolean
          description: A yes or a no.
        - type: integer
          format: int64
          description: "A whole number: an order, a version, a weight."
        - type: string
          description: One short value.
        - type: array
          items:
            type: string
          description: Several short values.
      description: "One fact a node carries from its object's front matter, in the shapes a node can hold."
    Feature:
      oneOf:
        - type: string
          const: mcp
          description: This process answers MCP over HTTP.
        - type: string
          const: cockpit
          description: This process serves the Cockpit.
      description: "A capability of the running process a surface needs in order to exist.\n\nThe registry describes the effective process, not the maximum one: a build or an\ninvocation that answers no MCP has no MCP surface, and the home page cannot link to\none. Stating the dependency as data is what keeps that automatic."
    Finding:
      type: object
      properties:
        severity:
          "$ref": "#/components/schemas/Severity"
          description: "`error` or `warning`."
        code:
          type: string
          description: "A short category: `unknown_reference`, `duplicate_identity`, `missing_content`, ..."
        path:
          type: string
          description: The repository-relative file the finding is in.
        id:
          type:
            - string
            - "null"
          description: "The record's identity, when one record owns the finding."
        field:
          type:
            - string
            - "null"
          description: "The front-matter key the finding is about, when one key owns it."
        message:
          type: string
          description: "What is wrong, in one sentence."
        did_you_mean:
          type:
            - string
            - "null"
          description: "The nearest existing name, when the value looks like a typo of one."
      required:
        - severity
        - code
        - path
        - message
      description: "One thing wrong with the catalogue, named where it is, with the nearest candidate when\nthere is one. A finding always carries enough to fix it without searching."
    Fixtures:
      type: object
      additionalProperties: false
      properties:
        paths:
          type: array
          items:
            type: string
          description: Pathspecs anchored at the repository root.
          default: []
        names:
          type: array
          items:
            type: string
          description: Patterns matched against the file name alone.
          default: []
        max_bytes:
          type: integer
          format: uint64
          minimum: 0
          description: A fixture over this many bytes is out.
      required:
        - max_bytes
      description: "The `fixtures` category: where fixtures live and how large one may be."
    Fly:
      type: object
      additionalProperties: false
      properties:
        org:
          type:
            - string
            - "null"
          description: The organisation the application belongs to.
          default: null
        force_https:
          type:
            - boolean
            - "null"
          description: Whether the edge redirects plain HTTP to HTTPS.
          default: null
        concurrency:
          anyOf:
            - "$ref": "#/components/schemas/Concurrency"
            - type: "null"
          description: When the edge considers a machine loaded.
          default: null
      description: "Fly.io's own facts: what has no meaning for any other provider."
    GitInfo:
      type: object
      properties:
        toplevel:
          type: string
          description: Absolute path of the work tree top level.
        head:
          type:
            - string
            - "null"
          description: "Full commit id of HEAD, or `None` in an unborn repository."
        branch:
          type:
            - string
            - "null"
          description: "Branch name, or `None` when detached or unborn."
        working_tree:
          type: string
          description: "`clean` or `dirty`, from `git status --porcelain`."
      required:
        - toplevel
        - working_tree
      description: "What `git` said about the repository."
    GitState:
      oneOf:
        - "$ref": "#/components/schemas/GitInfo"
          type: object
          properties:
            state:
              type: string
              const: available
          required:
            - state
          description: "`git` answered; the facts follow."
        - type: object
          properties:
            reason:
              type: string
              description: "What `git` said, or why it could not be run."
            state:
              type: string
              const: unavailable
          required:
            - state
            - reason
          description: "`git` could not be asked, or the root is not a work tree; the reason says which."
      description: "What git says about the repository, or why it could not be asked."
    Graph:
      type: object
      properties:
        id:
          type: string
          description: "The identity, `[a-z][a-z0-9-]*`; the last segment of its route."
        title:
          type: string
          description: The short name.
        description:
          type: string
          description: "One paragraph: what a reader learns from it."
        source:
          type: string
          description: "What it was derived from, in the repository's own words."
        node_kinds:
          type: object
          additionalProperties:
            type: string
          description: Node kind to what that kind means.
        edge_kinds:
          type: object
          additionalProperties:
            type: string
          description: Edge kind to what that edge asserts.
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/Node"
          description: Sorted by id.
        edges:
          type: array
          items:
            "$ref": "#/components/schemas/Edge"
          description: Sorted.
        metadata:
          "$ref": "#/components/schemas/GraphMetadata"
          description: Counts and invariants.
      required:
        - id
        - title
        - description
        - source
        - node_kinds
        - edge_kinds
        - nodes
        - edges
        - metadata
      description: "A derived graph: what it is, where it came from, what its vocabularies mean, and the\nnodes and edges themselves."
    GraphInfo:
      type: object
      properties:
        id:
          type: string
          description: The identity.
        title:
          type: string
          description: The short name.
        description:
          type: string
          description: One paragraph.
        source:
          type: string
          description: What it is derived from.
      required:
        - id
        - title
        - description
        - source
      description: "One graph the executable can derive: what it is, without deriving it."
    GraphList:
      type: object
      properties:
        count:
          type: integer
          format: uint
          minimum: 0
          description: How many.
        graphs:
          type: array
          items:
            "$ref": "#/components/schemas/GraphInfo"
          description: "Each, described but not derived."
      required:
        - count
        - graphs
      description: Every graph this executable derives.
    GraphMetadata:
      type: object
      properties:
        nodes:
          type: integer
          format: uint
          minimum: 0
          description: How many nodes.
        edges:
          type: integer
          format: uint
          minimum: 0
          description: How many edges.
        acyclic:
          type: boolean
          description: "Whether the edges form a directed acyclic graph. Derived, never declared: a graph\nwhose contract is a DAG and whose answer here is `false` is a defect in the data."
        truncated:
          type: boolean
          description: "True when the derivation stopped at [`MAX_NODES`] and the graph is a prefix of\nwhat the repository holds."
      required:
        - nodes
        - edges
        - acyclic
        - truncated
      description: What a reader needs to know about the graph as a whole before drawing it.
    Health:
      type: object
      properties:
        status:
          "$ref": "#/components/schemas/HealthStatus"
          description: "The worst check's status."
        tallies:
          type: object
          additionalProperties:
            type: integer
            format: uint
            minimum: 0
          description: "How many checks stand where, by status word."
        checks:
          type: array
          items:
            "$ref": "#/components/schemas/HealthCheck"
          description: "Every dimension, in a stable order."
      required:
        - status
        - tallies
        - checks
      description: The health of what this process serves.
    HealthCheck:
      type: object
      properties:
        id:
          type: string
          description: "A stable id, `[a-z][a-z0-9-]*`."
        title:
          type: string
          description: The short name.
        status:
          "$ref": "#/components/schemas/HealthStatus"
          description: Where it stands.
        detail:
          type: string
          description: "One line: what the engine decided and on what."
        decided_by:
          type: string
          description: "The engine that decided it, named so the reader knows what to fix."
        evidence:
          type: array
          items:
            type: string
          description: "What reproduces the verdict: a command, or a path."
        findings:
          type: array
          items:
            type: string
          description: "Findings behind the verdict, when the engine produced any: the diagnostic\nmessages, the stale files, the missing coverage lines."
      required:
        - id
        - title
        - status
        - detail
        - decided_by
      description: "One dimension of the system, decided by one engine, with what a reader needs to check\nit themselves."
    HealthRoutes:
      type: object
      additionalProperties: false
      properties:
        liveness:
          "$ref": "#/components/schemas/Route"
          description: Is this process alive.
        readiness:
          "$ref": "#/components/schemas/Route"
          description: Can this process serve traffic.
        grace_seconds:
          type:
            - integer
            - "null"
          format: uint32
          minimum: 0
          description: How long the platform waits before the first check counts.
          default: null
        interval_seconds:
          anyOf:
            - "$ref": "#/components/schemas/Positive"
            - type: "null"
          description: How often the platform polls liveness.
          default: null
        timeout_seconds:
          anyOf:
            - "$ref": "#/components/schemas/Positive"
            - type: "null"
          description: How long one check may take before it counts as failed.
          default: null
      required:
        - liveness
        - readiness
      description: "The routes a platform polls, and how often."
    HealthStatus:
      oneOf:
        - type: string
          const: ok
          description: The engine that decides this dimension is satisfied.
        - type: string
          const: warn
          description: Nothing is broken and something is worth looking at.
        - type: string
          const: fail
          description: The engine that decides this dimension is not satisfied.
        - type: string
          const: unknown
          description: "This process cannot decide it, and says so rather than reporting `ok`."
      description: "Where one dimension of the system stands. Ordered by severity, so the worst check\ndecides the whole."
    HttpExposure:
      type: object
      properties:
        method:
          "$ref": "#/components/schemas/HttpMethod"
          description: The method.
        path:
          type: string
          description: "The absolute path, under [`HttpExposure::PREFIX`]."
      required:
        - method
        - path
      description: "How a capability appears over HTTP. `GET` binds every top-level input property as a\nquery parameter; `POST` binds the input as the JSON request body. Paths are absolute\nand live under [`HttpExposure::PREFIX`]."
    HttpMethod:
      oneOf:
        - type: string
          const: GET
          description: Read-only; the input is bound from the query string.
        - type: string
          const: POST
          description: The input is bound from the JSON body. No builtin uses it yet.
      description: The HTTP methods a capability may be bound to.
    InspectReport:
      type: object
      properties:
        branch:
          type: string
          description: The branch asked about.
        branch_exists:
          type: boolean
          description: The branch exists locally.
        expected_path:
          type: string
          description: Where its work tree belongs.
        destination_exists:
          type: boolean
          description: Something exists at that path.
        worktree:
          anyOf:
            - "$ref": "#/components/schemas/WorktreeState"
            - type: "null"
          description: "The work tree that holds the branch, when one does."
        canonical:
          type: boolean
          description: The branch is checked out at its canonical path.
        diagnostics:
          type: array
          items:
            "$ref": "#/components/schemas/TopologyDiagnostic"
          description: "What stands in the way, if anything."
      required:
        - branch
        - branch_exists
        - expected_path
        - destination_exists
        - canonical
        - diagnostics
      description: "One branch, inspected: where its work tree belongs and what is there."
    Interface:
      oneOf:
        - type: string
          const: loopback
          description: "Reachable from this host alone: the local default, and what every local invocation\nkeeps."
        - type: string
          const: all
          description: "Every interface. A hosted process needs it and a local one never does; stating it\nis the intent that replaces suppressing the bind warning."
      description: Which interface a process listens on.
    KnowledgeAddedCapability:
      type: object
      properties:
        id:
          type: string
          description: The capability id.
        declared_in:
          type: string
          description: "The file it is declared in: its canonical source."
        surfaces:
          type: array
          items:
            "$ref": "#/components/schemas/CanonicalitySurface"
          description: "Every surface derived from the declaration, ticked."
        mms:
          type: integer
          format: uint
          minimum: 0
          description: Its manual maintenance surface.
        mentions:
          type: integer
          format: uint
          minimum: 0
          description: Hand-written files that already name it.
      required:
        - id
        - declared_in
        - surfaces
        - mms
        - mentions
      description: "A capability the change set adds, with the surfaces derived for it."
    KnowledgeAffected:
      type: object
      properties:
        id:
          type: string
          description: The node.
        kind:
          type: string
          description: Its kind.
        title:
          type: string
          description: Its title.
        depth:
          type: integer
          format: uint
          minimum: 0
          description: "`0` for a node whose own evidence changed; the hop count otherwise."
        via:
          type: string
          description: The evidence id or the relation that carried the impact.
        reason:
          type: string
          description: "One line: why."
      required:
        - id
        - kind
        - title
        - depth
        - via
        - reason
      description: A node the change set reaches.
    KnowledgeBaselineSummary:
      type: object
      properties:
        recorded:
          type: boolean
          description: Whether one was recorded.
        recorded_at:
          type:
            - string
            - "null"
          description: "The commit it was recorded at, when it says."
        path:
          type: string
          description: "Where it is, repository-relative."
        nodes:
          type: integer
          format: uint
          minimum: 0
          description: Nodes recorded.
        verified:
          type: integer
          format: uint
          minimum: 0
          description: Verified claims.
        debt:
          type: integer
          format: uint
          minimum: 0
          description: Tolerated debt.
        accepted:
          type: integer
          format: uint
          minimum: 0
          description: Accepted conflicts.
        canonicality:
          type: integer
          format: uint
          minimum: 0
          description: Tolerated canonicality violations.
      required:
        - recorded
        - path
        - nodes
        - verified
        - debt
        - accepted
        - canonicality
      description: "The baseline, summarised."
    KnowledgeChangedEntry:
      type: object
      properties:
        path:
          type: string
          description: The file.
        member:
          type: string
          description: The entry within it.
        status:
          type: string
          description: "`added`, `modified` or `deleted`."
      required:
        - path
        - member
        - status
      description: One entry of a structured file that changed.
    KnowledgeCheckReport:
      type: object
      properties:
        mode:
          "$ref": "#/components/schemas/KnowledgeMode"
          description: The mode the check ran in.
        baseline_recorded:
          type: boolean
          description: Whether a baseline was recorded at all.
        recorded_at:
          type:
            - string
            - "null"
          description: "The commit the baseline was recorded at, when it says."
        new_debt:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeDebtItem"
          description: "Debt the baseline does not tolerate: what fails the check in protect mode."
        tolerated:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeDebtItem"
          description: "Debt the baseline tolerates, still present."
        resolved:
          type: array
          items:
            type: string
          description: "Debt the baseline tolerates that is gone: the baseline should be recorded again\nso that it cannot come back."
        verdict:
          type: string
          description: "The verdict: `pass` or `fail`."
        summary:
          type: string
          description: One line a person reads.
      required:
        - mode
        - baseline_recorded
        - new_debt
        - tolerated
        - resolved
        - verdict
        - summary
      description: What the check found.
    KnowledgeClaim:
      type: object
      properties:
        id:
          type: string
          description: "Stable identity: `<subject>#<predicate>` with a discriminator when several claims\nshare both."
        subject:
          type: string
          description: The node the claim is about.
        predicate:
          type: string
          description: "The predicate, from the vocabulary an extractor declared."
        value:
          description: "The value: a string, a number, a boolean, a list."
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: How the claim came to be known.
        evidence:
          type: array
          items:
            type: string
          description: The evidence ids that support it.
        confidence:
          "$ref": "#/components/schemas/KnowledgeConfidence"
          description: How strongly.
        verification:
          "$ref": "#/components/schemas/KnowledgeVerification"
          description: How it is verified again.
        state:
          "$ref": "#/components/schemas/KnowledgeClaimState"
          description: Where it stands.
        freshness:
          "$ref": "#/components/schemas/KnowledgeFreshness"
          description: Where it stands against the baseline; filled by the freshness pass.
        reason:
          type:
            - string
            - "null"
          description: "Why it stands there, when the reason is worth a line."
      required:
        - id
        - subject
        - predicate
        - value
        - provenance
        - confidence
        - verification
        - state
        - freshness
      description: "One proposition: a subject, a predicate and a value, with what supports it."
    KnowledgeClaimLine:
      type: object
      properties:
        id:
          type: string
          description: The claim id.
        predicate:
          type: string
          description: The predicate.
        value:
          description: The value.
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: The provenance.
        freshness:
          "$ref": "#/components/schemas/KnowledgeFreshness"
          description: The freshness.
        state:
          type: string
          description: The state.
        evidence:
          type: array
          items:
            type: string
          description: The evidence ids.
        reason:
          type:
            - string
            - "null"
          description: "Why, when it is not current."
      required:
        - id
        - predicate
        - value
        - provenance
        - freshness
        - state
        - evidence
      description: One claim as an explanation states it.
    KnowledgeClaimState:
      oneOf:
        - type: string
          const: asserted
          description: "Asserted, and nothing contradicts it."
        - type: string
          const: conflicted
          description: Another claim about the same subject and predicate carries a different value.
        - type: string
          const: unverified
          description: "Its evidence does not resolve, or it has none."
      description: Where a claim stands.
    KnowledgeConfidence:
      type: object
      properties:
        level:
          "$ref": "#/components/schemas/KnowledgeConfidenceLevel"
          description: "The level, which follows from the basis."
        basis:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeConfidenceBasis"
          description: "Why, in the order the reasons were established."
      required:
        - level
        - basis
      description: The confidence of a claim or a node.
    KnowledgeConfidenceBasis:
      oneOf:
        - type: string
          const: deterministic_extraction
          description: A deterministic extractor read it from the source itself.
        - type: string
          const: structured_declaration
          description: A structured declaration states it and the declaration validates against its schema.
        - type: string
          const: human_curation
          description: A person wrote it as curated knowledge.
        - type: string
          const: corroborated
          description: Two independent sources agree.
        - type: string
          const: single_source
          description: One source only.
        - type: string
          const: reference_unresolved
          description: The evidence it names does not resolve to anything this repository holds.
        - type: string
          const: semantic_inference
          description: A semantic provider inferred it.
      description: Why a confidence level is what it is.
    KnowledgeConfidenceLevel:
      oneOf:
        - type: string
          const: high
          description: "Deterministically extracted, or corroborated by independent sources."
        - type: string
          const: medium
          description: "One structured declaration or one curated statement, resolvable, uncontradicted."
        - type: string
          const: low
          description: "An inference, or a statement whose evidence does not resolve."
      description: "How strongly the evidence supports a statement. Never a number a model produced: the\nlevel follows from the basis, and the basis is a fact about the evidence."
    KnowledgeConflict:
      type: object
      properties:
        id:
          type: string
          description: "Stable identity: `<subject>#<predicate>`."
        subject:
          type: string
          description: The node both claims are about.
        predicate:
          type: string
          description: The predicate they disagree on.
        sides:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeConflictSide"
          description: "The sides, strongest provenance first."
        severity:
          "$ref": "#/components/schemas/KnowledgeConflictSeverity"
          description: How serious.
        basis:
          type: string
          description: Why the severity is what it is.
        resolution:
          "$ref": "#/components/schemas/KnowledgeResolution"
          description: Where it stands.
        remedy:
          type: string
          description: What a person does about it.
      required:
        - id
        - subject
        - predicate
        - sides
        - severity
        - basis
        - resolution
        - remedy
      description: "Two claims about one subject and one functional predicate carrying different values.\nNeither side is chosen."
    KnowledgeConflictSeverity:
      oneOf:
        - type: string
          const: high
          description: "An observed fact contradicts a declaration: the declaration is wrong or the code moved."
        - type: string
          const: medium
          description: Two declarations disagree.
        - type: string
          const: low
          description: A derived statement disagrees with something stronger.
      description: How serious a conflict is.
    KnowledgeConflictSide:
      type: object
      properties:
        claim:
          type: string
          description: The claim id.
        value:
          description: Its value.
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: Its provenance.
        evidence:
          type: array
          items:
            type: string
          description: The evidence ids behind it.
      required:
        - claim
        - value
        - provenance
      description: One side of a conflict.
    KnowledgeConflictsReport:
      type: object
      properties:
        conflicts:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeConflict"
          description: "The conflicts, by id."
        open:
          type: integer
          format: uint
          minimum: 0
          description: "Open ones, over the whole model."
        accepted:
          type: integer
          format: uint
          minimum: 0
          description: Accepted ones.
      required:
        - conflicts
        - open
        - accepted
      description: "The answer of `knowledge.conflicts`."
    KnowledgeContextBundle:
      type: object
      properties:
        paths:
          type: array
          items:
            type: string
          description: The paths asked about.
        budget:
          type: integer
          format: uint
          minimum: 0
          description: The budget in bytes of rendered JSON the bundle was cut to.
        public_only:
          type: boolean
          description: Only public knowledge was included.
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeSummary"
          description: "The nodes, most governing first."
        caveats:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeClaimLine"
          description: "The claims of those nodes that are not current: what the agent must not trust."
        conflicts:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeConflict"
          description: Open conflicts among them.
        gaps:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeGap"
          description: Gaps about them.
        omitted:
          type: integer
          format: uint
          minimum: 0
          description: How many nodes the budget left out.
      required:
        - paths
        - budget
        - public_only
        - nodes
        - caveats
        - conflicts
        - gaps
        - omitted
      description: "What an agent should read before touching some paths: the nodes whose sources are\nunder them, what those relate to one hop out, the open conflicts and the gaps among\nthem — ordered so that the governing things come first, and cut to a budget."
    KnowledgeCoverage:
      type: object
      properties:
        rows:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeCoverageRow"
          description: "The rows, in a stable order."
      required:
        - rows
      description: Every coverage row.
    KnowledgeCoverageReport:
      type: object
      properties:
        rows:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeCoverageRow"
          description: The rows.
      required:
        - rows
      description: "The answer of `knowledge.coverage`."
    KnowledgeCoverageRow:
      type: object
      properties:
        id:
          type: string
          description: Stable identity.
        title:
          type: string
          description: What is counted.
        denominator:
          type: string
          description: What defines the denominator.
        discovered:
          type: integer
          format: uint
          minimum: 0
          description: How many were discovered.
        covered:
          type: integer
          format: uint
          minimum: 0
          description: How many are covered.
        missing:
          type: array
          items:
            type: string
          description: The node ids that are not.
      required:
        - id
        - title
        - denominator
        - discovered
        - covered
      description: "One coverage row: a denominator this executable can define deterministically, and how\nmuch of it is covered. No percentage is computed; the numbers are the answer."
    KnowledgeDebtItem:
      type: object
      properties:
        class:
          type: string
          description: "What kind of debt: `freshness`, `conflict` or `canonicality`."
        id:
          type: string
          description: "The node, conflict or violation id."
        state:
          type: string
          description: The state it is in.
        reason:
          type:
            - string
            - "null"
          description: "Why, as the scan said."
      required:
        - class
        - id
        - state
      description: One item of debt the check found.
    KnowledgeEvidence:
      type: object
      properties:
        id:
          type: string
          description: "Stable identity: `file:<path>`, `entry:<path>#<member>`, `object:<uri>`,\n`commit:<sha>`, `capability:<id>`, `artifact:<path>`."
        kind:
          "$ref": "#/components/schemas/KnowledgeEvidenceKind"
          description: What kind of thing it is.
        locator:
          "$ref": "#/components/schemas/KnowledgeLocator"
          description: Where it is.
        fingerprint:
          "$ref": "#/components/schemas/KnowledgeFingerprint"
          description: Its fingerprint at the moment it was read.
        extractor:
          type: string
          description: The extractor that read it.
        visibility:
          "$ref": "#/components/schemas/KnowledgeVisibility"
          description: Who may see it.
        remote_processing:
          type: boolean
          description: Whether its content may be sent to a remote provider at all.
      required:
        - id
        - kind
        - locator
        - fingerprint
        - extractor
        - visibility
        - remote_processing
      description: "One piece of evidence: something that was read, fingerprinted, and can be read again."
    KnowledgeEvidenceKind:
      oneOf:
        - type: string
          const: file
          description: "A tracked file, whole."
        - type: string
          const: object
          description: "One object of the layer's index, with its parsed metadata."
        - type: string
          const: manifest_entry
          description: "One entry of a manifest or a configuration file: a dependency, a member, a section."
        - type: string
          const: commit
          description: A git revision.
        - type: string
          const: capability
          description: "A capability of this executable's registry."
        - type: string
          const: artifact
          description: A generated artifact of the generation plan.
      description: What kind of thing a piece of evidence is.
    KnowledgeEvidenceLine:
      type: object
      properties:
        id:
          type: string
          description: The evidence id.
        kind:
          type: string
          description: Its kind.
        path:
          type:
            - string
            - "null"
          description: "The path, when it has one."
        fingerprint:
          type: string
          description: "The fingerprint, shortened."
        extractor:
          type: string
          description: The extractor that read it.
        remote_processing:
          type: boolean
          description: Whether it may leave the machine.
      required:
        - id
        - kind
        - fingerprint
        - extractor
        - remote_processing
      description: "One line of an explanation's evidence chain."
    KnowledgeExplanation:
      type: object
      properties:
        id:
          type: string
          description: The node.
        kind:
          type: string
          description: Its kind.
        title:
          type: string
          description: Its title.
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: How it is known.
        ownership:
          "$ref": "#/components/schemas/KnowledgeOwnership"
          description: Who owns its source.
        visibility:
          "$ref": "#/components/schemas/KnowledgeVisibility"
          description: Who may see it.
        extractor:
          type: string
          description: Which extractor produced it.
        source:
          type:
            - string
            - "null"
          description: Where it came from.
        freshness:
          "$ref": "#/components/schemas/KnowledgeFreshness"
          description: Its freshness.
        freshness_reason:
          type:
            - string
            - "null"
          description: "Why, when it is not current."
        confidence:
          type: string
          description: "The confidence, in words."
        why:
          type: array
          items:
            type: string
          description: "The explanation, one sentence per line."
        evidence:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeEvidenceLine"
          description: The evidence chain.
        claims:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeClaimLine"
          description: Every claim.
        relates_to:
          type: array
          items:
            type: string
          description: "What it relates to, as `kind -> target`."
        related_from:
          type: array
          items:
            type: string
          description: "What relates to it, as `source -> kind`."
        conflicts:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeConflict"
          description: Conflicts it is party to.
        gaps:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeGap"
          description: Gaps about it.
        remedies:
          type: array
          items:
            type: string
          description: "What to do, when something is wrong."
      required:
        - id
        - kind
        - title
        - provenance
        - ownership
        - visibility
        - extractor
        - freshness
        - confidence
        - why
        - evidence
        - claims
        - relates_to
        - related_from
        - conflicts
        - gaps
        - remedies
      description: Why the model says what it says about one node.
    KnowledgeExtractorInfo:
      type: object
      properties:
        id:
          type: string
