# A tagline is not execution policy. Every technical statement on the site comes from
# site/data/generated/, which comes from canonical repository files. If a sentence here
# ever states a capability, it is in the wrong file: move it to docs/CLAIMS.yaml, where
# it must name an implementation and a test.
headline = "Supervision for AI-assisted work"
subheadline = "Policy, context, state and verification. Without another runtime."
lede = "Majordomus is a directory and nine subcommands. It does not run your model, hold your context, or ask for a server. It holds the rules, the scope and the state that the model forgets between sessions, and it refuses to call work done until the contract is met."

[[cta]]
label = "Get started"
href = "/getting-started/"
primary = true

[[cta]]
label = "What it supervises"
href = "/supervises/"
primary = false

[problem]
title = "AI workers are capable. They are still operated badly."
lede = "None of the following is a model problem, and none of it is fixed by a better prompt."
items = [
  "too much context, loaded every session, mostly irrelevant",
  "stale context that contradicts the working tree",
  "reasoning effort set once and never matched to the task",
  "narration mistaken for progress",
  "the same work done twice in two checkouts",
  "handovers that are transcripts instead of state",
  "verification described rather than run",
  "no agreed definition of done",
]

[not]
title = "What it is not"
items = [
  "not another model",
  "not an agent runtime",
  "not a prompt marketplace",
  "not a SaaS dependency",
  "not a background daemon",
]
