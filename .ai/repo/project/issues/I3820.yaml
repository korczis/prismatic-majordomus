acceptance_criteria:
  - "An object with provider.name gigalixir, app, stack and an https url parses and checks; an unknown provider name, an http url or a hosted loopback interface is refused naming the file, key, value and correction"
  - "generate deployment writes deploy/gigalixir/Procfile and deploy/gigalixir/bin/{detect,compile,release}, each with the provenance header, and generate --check refuses a hand edit"
  - "The Procfile starts the deployment's executable with serve --discovery filesystem on all interfaces and the provider's PORT, falling back to listen.port"
  - "A build with SOURCE_VERSION set to a 40-hex commit and no MAJORDOMUS_BUILD_COMMIT answers that commit on /api/v1/live"
  - "Rule deployment-contract is version 2 in share/standard and in the vendored copy, identical"
validation:
