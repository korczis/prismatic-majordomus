id: I3077
milestone: public-proof
title: "An article explains the plan critique in both languages: a plan is attacked before it is built"
slug: a-plan-is-attacked-before-it-is-built
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/a-plan-is-attacked-before-it-is-built.md, an English article on the critique of an intent's plan. It covers the record under .ai/repo/project/critiques/, the seven classes of finding, and the three resolutions planned, rejected and open. It covers the gate that reads it: preflight's intent_not_critiqued and open_blocking_finding, intent.binding, and intent validate's executing_without_critique and executing_with_open_blocker. It shows what the critiques on master found, planned and rejected, and who wrote them, fresh subagents and self-reviews, each saying which. It ends with what a critique cannot do. Every statement and quotation is one that docs/PLANNING.md, the critique README or a critique record on master states, and no count is typed by hand. site/content-src/plan-se-napadne-driv-nez-se-postavi.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the pasted brief, the proof-carrying documentation and the seats, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. The critique is how this repository keeps a plan from agreeing with itself, and the published site explains it only in the planning manual, which is written for the sessions that follow it."
current_state: "No article explains the plan critique. The five article groups relate each other, and none of them names the critique."
desired_state: "/a-plan-is-attacked-before-it-is-built/ and /plan-se-napadne-driv-nez-se-postavi/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 passes, with the translation at its source's digest."
