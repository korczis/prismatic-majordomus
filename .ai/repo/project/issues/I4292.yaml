  - "docs/CLI.md"
non_scope:
  - "The six writers ADR 0164 named, already covered by I0703"
  - "The Rust writers (I4291)"
depends_on: []
acceptance_criteria:
  - "With two episodes open in one checkout, session close, finish, evidence, gate and the mesh join each name the calling episode, and none attaches to the task the other episode opened"
  - "Every refusal names the rule that refused and the command that resolves it"
  - "No ledger line carries the literal task_id none"
validation:
  - "bash test/run.sh 3049"
  - "bash test/run.sh"
  - "bin/majordomus doctor"
evidence_required:
  - suite
  - doctor
risk: "finish and gate decide whether work counts as done; a refusal that is wrong there stops a worker, so each refusal has to name the command that resolves it in the same breath."
