id: I4466
milestone: a-bounded-task-is-carried-to-accepted-work
title: "A mesh review answer names the head and the base it reviewed, and a verdict whose head or base has moved reads stale wherever reviews are shown"
slug: a-review-verdict-names-its-head-and-base
priority: p1
profile: implementation
parallel_safe: true
objective: "The mesh review events carry the revision they are about, and every reader of a review compares it with the subject now. ReviewRequested (apps/majordomus-cli/src/mesh/journal.rs:638-659) gains optional head and base: when its subject names a branch or a commit the requesting runtime's checkout can resolve, the runtime records the subject's head commit and its merge base with the trunk (the trunk crate::delivery::revision::trunk_ref resolves, apps/majordomus-cli/src/delivery/revision.rs:96), from git, never from the requester's text. ReviewAnswered (journal.rs:661-671) gains the same two optional fields, filled by the answering runtime the same way, and, when it cannot resolve the subject, copied from the request and marked `as_requested`. The mesh.review.answer capability (apps/majordomus-cli/src/capability/builtin/mesh.rs:1579-1606) takes an optional head that the answerer may state and refuses one that differs from what its own git resolves, naming both. A reader (mesh state, the mesh page, the monitor's review lines) gives each answered review one standing: `current` when the subject's head and base are the recorded ones, `stale: head moved <old>..<new>` or `stale: base moved <old>..<new>` when either differs, `unbound` for an answer written before this change, and `unknown: <reason>` when the reading runtime cannot resolve the subject; unbound and unknown never read as current. Both fields are listed in .ai/repo/ci/mesh-event-fields.yaml as clear (commit ids are not secrets), so the mesh check admits them."
why: "Observed in OSCILLA (korczis/oscilla) by session oscilla-b0, 2026-10-29 18:00 to 2026-10-30 01:30 CET, items 4 and 5 of its adopter dossier. OSCILLA's independent review is a verdict bound to a content digest and required on guarded paths. Reviewers answered over the mesh, but the answer carried no revision, so each verdict was committed on the builder's branch and relayed by the coordinating session by hand: #253, #299, #295, #303, #296 and #287, twice with the verdict commit left only in the shared object store. #253's verdict, given at ef722987, went stale after a merge of main and a comment edit, and the builder learnt it only from CI's review check hours later, CI being starved. Mission section 6 says reviews go through the mesh and section 9 that evidence names the revision it is about and that a change of the relevant inputs invalidates it; a verdict with no revision can be neither relayed nor judged stale."
current_state: "At master 51b38035a71: ReviewRequested carries review, session, subject (free text: a branch, a commit or a pull request), scope, issue, reviewer and body (apps/majordomus-cli/src/mesh/journal.rs:638-659); ReviewAnswered carries request, session, verdict and note (journal.rs:661-671), no revision. mesh_review_answer (apps/majordomus-cli/src/capability/builtin/mesh.rs:1606) passes request, session, verdict and note to Cooperation::answer_review (apps/majordomus-cli/src/mesh/cooperation.rs:4525); it is exposed over MCP as majordomus_mesh_review_answer and over HTTP as POST /api/v1/mesh/reviews/answer (mesh.rs:2091-2101). Reviews are read by mesh/state.rs, mesh/page.rs, mesh/cooperation.rs and monitor/mesh.rs. Every field the wire carries must be listed in .ai/repo/ci/mesh-event-fields.yaml (case 3051)."
desired_state: "A review verdict is about a named revision, and anyone reading it is told whether that revision is still the subject's, without waiting for CI. Older answers read unbound, never current. Enforced by case 4466 and case 3051."
