parallel_safe: true
objective: "`majordomus gates run [--tier <t>]` runs each gate the change selects (or all), records `evidence --gate` with its exit, and exits non-zero when one fails; the pre-push line init prints can use it."
why: "An adopter's field report (a private Python client repository adopted from the v1.0.0-alpha.8 release on 2026-10-27, with the plan model, project rules, knowledge, skills, Claude Code capture and a GitHub projection all in use) found: the adopter declared .ai/repo/ci/gates.yaml and check then reported every gate as never reported; recording them took a hand-written loop over `evidence --gate`, because scripts/ci-plan, which runs a plan, exists only in the tool's source tree."
current_state: "Gate evidence is recorded one gate at a time by hand."
desired_state: "`majordomus gates run [--tier <t>]` runs each gate the change selects (or all), records `evidence --gate` with its exit, and exits non-zero when one fails; the pre-push line init prints can use it."
