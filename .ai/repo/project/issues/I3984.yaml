id: I3984
milestone: one-click-implement
title: "/ui/idd offers each issue the one primary move its state admits: Implement, Open execution, Verify, Deliver or View blockers"
slug: the-issue-offers-one-move
priority: p0
profile: implementation
objective: "Replace the primary button of /ui/idd (ui/idd.rs:519-600, today Start/Verify/Mark done through plan.transition) with the one move the issue's derived state admits: READY starts implement.issue as an execution through the existing move start path (share/cockpit/moves.js, with I3981's key); ACTIVE links its live execution; VERIFY starts the verification; DONE offers Deliver (an execution of the delivery policy, a stub refusing until P2 says otherwise); BLOCKED lists the blockers. The executor's refusal is shown verbatim; the snapshot shows state and a link to the live server, never the control."
why: "Owner's P0 of 2026-10-23, section 6: one contextual primary move instead of three near-synonymous verbs; ADR 0225 consequences."
current_state: "The issue view's only move is plan.transition; no Implement."
desired_state: "One primary move per state; the click is an execution; the issue row links the execution that works it."
scope:
  - "apps/majordomus-cli/src/ui/idd.rs"
  - "apps/majordomus-cli/src/cockpit/plan.rs"
  - "share/cockpit/moves.js"
  - "share/ui"
  - "docs/MAJORDOMUS_UI.md"
non_scope:
  - "The generic capability form on /ui (I3225)"
  - "Delivery itself (P2)"
depends_on:
  - "I3983"
serves:
  - "an-issue-is-implemented-from-one-click#the-issue-offers-one-move"
acceptance_criteria:
  - "Each of the five states renders exactly its one primary move (unit test over the view)"
  - "Implement starts implement.issue as an execution with an idempotency key; a refusal is the executor's text"
  - "The published snapshot of /ui/idd carries no control"
  - "The view fits 390 px with no horizontal scroll"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib ui::idd"
evidence_required:
  - "test/cases/3982_one_click_implement_survives_a_restart.sh"
created_at: 2026-10-23
updated_at: 2026-10-23
