intent: the-owner-directs-work-from-the-ui
observed_at: d116266803
recorded_by: claude-code (session 21616f1e, worktree feature/the-ui-is-an-idd-workspace; read-only inventory of /ui, /cockpit, the plan capabilities and the open pull requests at master)
recorded_at: 2026-10-16
observations:
  - id: pieces-without-a-workspace
    statement: The UI has a Roadmap (milestones, intents, their inspectors), Issues, Issues & PRs and a PR Drain screen, each reading the plan's capabilities, and no screen that starts from an intent and shows its milestones, issues, waves and graph together
    source: file:apps/majordomus-cli/src/ui/mod.rs
  - id: waves-unscreened
    statement: plan.waves answers the layering and the scope overlaps over HTTP, MCP and the command line; no /ui screen on master reads it, and the open #1184 that would is in conflict with master
    source: file:apps/majordomus-cli/src/capability/builtin/plan.rs
  - id: moves-only-in-the-cockpit
    statement: The start, verify and done moves exist as plan.transition run through executions.start, on the Cockpit's issue page only; every /ui screen is GET-only and the workspace's move column links away to the Cockpit
    source: file:apps/majordomus-cli/src/cockpit/plan.rs
  - id: refresh-by-the-minute
    statement: Every /ui screen reads its sources again once a minute while it is visible; the live channel /events, which reports every execution the server runs, has the Cockpit's socket.js as its one client and no /ui screen follows it
    source: file:share/ui/ui.js
  - id: standing-read-elsewhere
    statement: The workspace shows an intent's criteria and its issues but not why the intent stands where it does, the work realising it or the moves made on its issues; intent_realization.explain (seconds per call) and executions.list answer both, and no screen reads them for an intent
    source: file:apps/majordomus-cli/src/capability/builtin/intent_realization.rs
  - id: the-loop-has-no-ends
    statement: The workspace reads an intent's milestones, issues, waves, graph, standing and moves, but a new intent is proposed only from a terminal or MCP
    source: file:apps/majordomus-cli/src/ui/idd.rs
  - id: remaining-read-per-issue
    statement: What keeps a milestone from DONE — which issues are not complete and which evidence tokens their records do not hold — is read issue by issue in their records or with devtask, and no screen gathers it for a milestone
    source: file:apps/majordomus-cli/src/capability/builtin/devtask.rs
  - id: only-the-sidebar-leads-there
    statement: No screen but the sidebar links to /ui/idd, so a reader of the roadmap, a milestone or an issue cannot reach the workspace of what they read, and the published snapshot reaches only the intents the workspace itself lists
    source: file:apps/majordomus-cli/src/ui/mod.rs
conditions:
  - criterion: workspace-is-derived
    state: missing
    because: no screen composes an intent with its milestones, issues, waves and graph
    observations: [pieces-without-a-workspace, waves-unscreened]
  - criterion: next-move-is-reachable
    state: missing
    because: the move is offered on the Cockpit's issue page, a surface away from where the work is read
    observations: [moves-only-in-the-cockpit]
  - criterion: the-workspace-follows-moves
    state: missing
    because: a move made from another tab, the Cockpit or an agent shows on the workspace only after the next minute's refresh
    observations: [refresh-by-the-minute]
  - criterion: the-workspace-shows-why-and-what-moved
    state: missing
    because: the evidence and execution steps of the loop are read on the Cockpit, the command line or MCP, away from the workspace
    observations: [standing-read-elsewhere]
  - criterion: an-intent-is-proposed-from-the-workspace
    state: missing
    because: the workspace offers no way to begin with an intent
    observations: [the-loop-has-no-ends]
  - criterion: a-milestone-says-what-remains
    state: missing
    because: what remains before a milestone is DONE is read issue by issue
    observations: [remaining-read-per-issue]
  - criterion: every-inspector-leads-to-its-workspace
    state: missing
    because: only the sidebar leads to the workspace
    observations: [only-the-sidebar-leads-there]
