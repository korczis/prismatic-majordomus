id: every-model-call-is-paid-from-a-declared-source
title: "How a model call Majordomus starts can be paid is declared by the vendor with evidence, and each call names the source it was declared to draw on"
statement: "Each vendor of the model catalogue (share/models.yaml, ADR 0049) declares the sources a call to it can be paid from (a subscription seat, a recurring credit grant such as the monthly API credits a Claude Max plan includes, metered use, a local runtime) with the vendor page it was read from, the day and the vendor's own words; an Anthropic API advisor lets a held Anthropic credit grant pay for independent review the way the OpenAI credential pays for ChatGPT today; and every benchmark run and advisor consultation records the funding kind the owner declared for it through I3289's consented step, or unknown, never a value inferred from which credential was present."
invariants:
  - "Funding is a field of the vendor declaration, not a new kind of record: no vendor, plan or amount is named in code, and adding a source is editing data"
  - "The catalogue states what a vendor offers, never what the owner holds and never an amount, price or balance"
  - "Only a credential variable's presence is ever read, never its value; a source the vendor reaches through a client login rather than a variable says so"
  - "Two sources reached through one credential are both named, and which one a call draws on is the vendor's billing order, stated only where vendor evidence says it"
  - "A funding source that cannot be read is a diagnostic naming its vendor and id; the rest of the catalogue still loads, so no advisor or route fails over one bad entry"
  - "models::route stays pure over the catalogue and its inputs (ADR 0049 point 4)"
  - "The funding kind of a run or consultation has one reporter and one vocabulary: I3292's billing_mode, declared through I3289, whose values are the catalogue's funding kinds"
non_goals:
  - "Routing by funding source, a source order in policy, a gate before a run, a nudge to claim credits, or spend and balance tracking: each waits for a vendor seam that reports spend to an individual account and a measured instance of the problem it removes (ADR 0207)"
  - "Reading, storing or rotating a credential value"
  - "Automating the vendor's claim flow, console login or plan changes"
  - "A price list or cost model"
milestones:
  - "every-model-call-is-paid-from-a-declared-source"
satisfaction:
  - id: vendor-declares-its-sources
    criterion: "share/models.yaml declares for each vendor its funding sources (kind, the credential variable or client login that reaches it, the renewal period where the vendor states one, the vendor-domain claim page, the evidence page, day and quote), an unreadable source is a diagnostic naming vendor and id, models.list projects them, and reasoning check forbids every declared credential variable in CI (planned proof: test_a_funding_source_without_evidence_is_refused and the shipped-catalogue test I3660 adds)"
    evidence: command
    ref: "majordomus intent explain every-model-call-is-paid-from-a-declared-source"
  - id: anthropic-api-reaches-the-advisors
    criterion: "share/advisors.yaml declares an Anthropic API advisor reached through the vendor's credential, its adapter meets the advisor contract against a recorded fixture, and an absent credential reads not_configured (planned proof: the contract case I3663 adds to scripts/lib/advisors/contract.test.mjs, and one owner-recorded consultation that the vendor console shows drawn on the grant)"
    evidence: command
    ref: "majordomus intent explain every-model-call-is-paid-from-a-declared-source"
  - id: each-call-names-its-declared-source
    criterion: "A benchmark run record and an advisor consultation record carry the funding kind the owner declared for them, or unknown; an old run without one reads unknown; no inferred value is stored (planned proof: the run-record and consultation cases I3665 adds)"
    evidence: command
    ref: "majordomus intent explain every-model-call-is-paid-from-a-declared-source"
