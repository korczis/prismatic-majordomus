id: I4564
milestone: mesh-connectivity
title: "Two runtimes link over QUIC, each pinned to the other's node key, and fall back to HTTP when QUIC cannot connect"
slug: a-link-runs-over-quic
priority: p1
profile: deep-work
objective: "A QuicTransport implements LinkTransport (apps/majordomus-cli/src/mesh/link.rs) beside HttpTransport. It uses quinn on one adapter-owned runtime thread. A runtime presents a self-signed certificate over its Ed25519 node key, and each side accepts only the key it expects (the dialled peer's key; on accept, a trusted key). The shared server accepts QUIC on a UDP port and answers the same Signed Hello and Sync messages as on HTTP. The server answers QUIC on its own port number over UDP; nothing new is advertised. The dialer tries QUIC first, falls back to HTTP, and records the path each link took. A connection stays open between rounds."
why: "Owner order 2026-11-08 (session 8e226cf8-e383-4936-afd0-7cd6f4227ccd): 'QUIC (fáze 06, I3189): dělat ho teď…?' was answered 'hned', and 'Zúžení packu…?' was answered 'nezuzuj'. ADR 0233 records both verbatim. The measured problem (ADR 0207): on master 8a7e9df20d8 a link to an advertised address is cleartext HTTP, which the client sends only to private or overlay addresses (docs/MESH.md, ADR 0220). Nodes on two networks cannot link without a publicly trusted certificate. Every round is a new dialer-initiated TCP request (HttpTransport::post), so an undialable node has no reverse channel (I3189). The first Mesh Fabric exchange (reviews r-34030860b2bd, r-60970e4c34ea) reached only sessions on one machine."
current_state: "On master 8a7e9df20d8 a link is HTTP only: one TCP connection per Hello or Sync round, cleartext unless the endpoint is https:// with a web-PKI certificate. Nothing in apps/ speaks QUIC."
desired_state: "A link between two runtimes runs over an encrypted QUIC connection pinned to their node keys and falls back to HTTP. Mesh status and the path record say which transport each link uses."
