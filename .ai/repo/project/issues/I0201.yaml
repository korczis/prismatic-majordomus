id: I0201
milestone: runtime-adapters
title: Declare which profile axis may become which runtime limit
slug: declare-limit-mapping
priority: p1
profile: deep-work
parallel_safe: false
objective: "Add one canonical file beside the profiles that maps a profile axis to the runtime limit it may derive, so that a limit has a single source, an axis nobody can enforce cannot be listed, and a limit no adapter applies is a validation error rather than a comment."
why: "The implementation studied before this one was rolled back because its limits were global constants. A constant is not derived from a profile, and nothing in the repository could tell the difference. The mapping has to exist as data before anything can be clamped honestly."
current_state: "A profile declares capability, effort, verbosity, presentation, context depth, verification requirements and a checkpoint interval. Every one of them is projected as prose and none of them constrains anything. There is no file that says which of them could."
desired_state: "One file declares each enforceable axis, the limit it derives, and how the limit is computed from the axis value. An unknown axis, an unknown limit, or a limit no adapter implements is refused by name."
scope:
  - share
  - lib
non_scope:
  - Applying any limit; this issue only declares what may be applied
  - Any axis whose enforcement could not be observed from this repository
depends_on: []
acceptance_criteria:
  - The mapping is one canonical file, read by the tool and written by hand nowhere else
  - Every declared axis exists on every profile, and an axis that does not is refused by name
  - A declared limit whose adapter does not exist is refused, and an adapter for an undeclared limit is refused
  - Every profile resolves to a complete set of limits, printed as data rather than prose
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
risk: "Declaring an axis enforceable before an adapter can apply it is how the previous attempt became theatre; the reconciliation in both directions is the guard against repeating it."
