  - "apps/majordomus-cli/src/cockpit/nav.rs"
  - "apps/majordomus-cli/src/cockpit/pages.rs"
  - "apps/majordomus-cli/src/cockpit/trains.rs"
  - "share/cockpit/trains.js"
  - ".ai/repo/adrs/0138-a-train-of-pull-requests-is-a-typed-object-that-can-be-seen.md"
  - "docs/INTEGRATION.md"
  - "docs/COCKPIT.md"
