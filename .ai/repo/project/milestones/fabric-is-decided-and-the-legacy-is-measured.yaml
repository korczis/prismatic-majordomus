  - "G1: scripts/fabric-baseline measures L1, L2 and L3 (2 repositories, 10 worktrees, 20 concurrent MCP sessions) in fixtures it made, counts every Majordomus process and listener, records cold and warm latencies and every failure beside its attempts, and refuses to run outside a fixture"
  - "G1: the first L3 baseline, with host metadata, is attached as evidence on I4722"
