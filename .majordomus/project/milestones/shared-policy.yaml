id: shared-policy
title: Shared policy across repositories and workers
slug: shared-policy
version: "1.0"
order: 60
priority: p3
problem: "Policy is per repository. An organisation running many repositories has no way to state a rule once, and no way to see where it is not being followed."
outcome: "A policy can be shared across repositories and workers, with local override remaining explicit and drift from the shared source detectable in one command."
current_state: "Not started. Everything the tool does today is scoped to a single checkout."
desired_state: "One policy statement governs many repositories, and every deviation from it is visible rather than assumed."
scope:
  - bin
  - lib
  - share
  - test/cases
  - docs
  - site/data/generated
non_scope:
  - A hosted service, a registry, or any component that must be running for the tool to work
acceptance_criteria:
  - A shared policy can be consumed by more than one repository without copying it
  - A local override is explicit and survives an update of the shared source
  - Drift between the shared policy and a repository's effective policy is reported by one command
validation:
  - bash test/run.sh
evidence_required:
  - suite
depends_on:
  - routing-recommendations
claims:
  - shared-policy
risks:
  - "Shared policy is where a local tool becomes a distributed one; the offline guarantee has to survive it."
created_at: 2026-09-04
updated_at: 2026-09-04T14:05:00Z
