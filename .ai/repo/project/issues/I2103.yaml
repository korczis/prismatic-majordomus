id: I2103
milestone: mobile-first
title: the Cockpit dense surfaces are audited and operable at a phone width
slug: cockpit-dense-surfaces-on-a-phone
priority: p1
profile: implementation
parallel_safe: false
objective: Audit the Cockpit's tables, graphs, runner forms, code and log blocks, filters and pagination at 320 and 390 by interaction, not only by overflow, and fix what a person cannot do there.
why: The overflow sweep passes on 139 routes at five widths, which says nothing scrolls sideways; it does not say a runner form can be submitted, a graph selected or a table read on a phone.
current_state: "In progress. The runner and the graph are exercised at 320 on touch by the probe's phoneSurfaces (commit 0fce63df17) and pass; the UI audit over 186 Cockpit pages at 13 widths finds no accessibility, overflow, landmark or target-size defect. Still unexercised by interaction at a phone width: pagination, listing filters, the plan moves on an issue page, the topology and activity views. Agreed with the owner of #833 (the evidence figure, ADR 0122): its phone-width check joins phoneSurfaces in this branch once #833 is on master (narrowest viewport, touch, page not widened, canvas scrolls, a tapped box and a tapped edge fill the info box), rather than a second phone harness."
desired_state: Every family of Cockpit route has an interaction check at a phone width in the probe.
scope:
- apps/majordomus-cli/src/cockpit
- share/cockpit
- scripts/lib/cockpit-probe.mjs
