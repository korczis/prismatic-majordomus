id: I3098
milestone: development-runtime
title: "Waiting derives take the machine's derive lock in the order they arrived"
slug: derives-take-the-lock-in-arrival-order
priority: p1
profile: implementation
parallel_safe: true
objective: "Give lib/machine_lock.sh a queue: a waiting derive writes a ticket (arrival time, pid, branch) under <home>/.derive.queue, the lock goes to the oldest ticket whose pid is alive, a ticket whose pid is gone is reaped, and the priority marker still overrides the order; the waiting line names the position (\"2nd of 4, behind <branch>\") and the brief's derive row shows the queue."
why: "On 2026-10-20 three derives of one session waited 40 to 150 minutes on the lock while derives that started later took it: the lock is a directory every waiter polls with mkdir every 15 s, so the next holder is whichever poll lands first after the holder leaves. Sessions asked the release seat to hand-edit .derive.priority to get a turn, which is the agreement the lock was written to replace."
current_state: "machine_lock.sh takes <home>/.derive.lock by mkdir and polls every MAJORDOMUS_DERIVE_POLL seconds; there is no ticket, so arrival order is not kept, and the waiting line names only the holder."
desired_state: "Waiters are served in arrival order unless the priority marker names a branch; each waiting line and `majordomus brief` say the position and who is ahead."
scope:
  - "lib/machine_lock.sh"
  - "scripts/derive"
  - "test/cases"
  - ".ai/repo/project/issues/I3098.yaml"
non_scope:
  - "The offload queue on other machines (I2398)"
depends_on: []
acceptance_criteria:
  - "Two waiters that arrive in order A then B take the lock A then B, whichever polls first"
  - "A ticket whose pid has died is reaped and does not hold the queue"
  - "The priority marker still serves its branch first"
  - "The waiting line names the position and the branch ahead"
validation:
  - "env -u MAJORDOMUS_SHARE bash test/run.sh 1018"
evidence_required:
  - "arrival_order_is_kept"
  - "dead_ticket_is_reaped"
