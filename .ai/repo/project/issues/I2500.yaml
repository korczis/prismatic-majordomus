non_scope:
  - "Build output of branches that are pushed and not merged: scripts/reap-orphans and pull request #921"
  - "A timer or daemon: the watch reads at the provider's events only"
  - "A Cockpit page of its own: the capability is listed with every other"
depends_on: []
acceptance_criteria:
  - "majordomus accumulation prints each quantity with its reading, budget and state and exits 10 when one is over budget; a quantity with no declared budget is unbudgeted and one that could not be read is unknown"
  - "The start event's briefing names every quantity over its budget and what the policy allows, and prints nothing about accumulation when the watch is off or every budget holds"
  - "With act: report, accumulation --reduce removes nothing, exits 10 and names the command"
  - "With act: reduce, a reduction removes the worktrees of landed branches and deletes landed names nothing has checked out, keeps unlanded work, a name at the trunk's tip and a branch with no upstream, and records what it did"
  - "A second reduction inside cooldown_minutes does not run under --if-due"
  - "A compaction event starts a reduction with no command typed"
  - "The prompt event says the free disk is under its floor once per cooldown"
  - "With announce_on_mesh: true the start event makes an advisory mesh claim of the session accumulation-watch naming what is over budget, and closes that session when the budgets hold again"
  - "MAJORDOMUS_ACCUMULATION=off silences every path, and test/run.sh sets it"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=2 bash test/run.sh 2986_accumulation_is_watched 611_the_reclaim_refuses_what_it_cannot_prove 54_session_lifecycle_hooks"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib accumulation"
evidence_required:
  - "accumulation_watch_case_2986"
  - "accumulation_unit_tests"
created_at: 2026-10-13
updated_at: 2026-10-13
