id: I4728
milestone: safe-self-update
title: "An unattended follower installs only a release whose provenance it verified, and refuses otherwise"
slug: an-unattended-follower-requires-provenance
priority: p0
profile: implementation
objective: "Make every update a follower applies without a person (follow: stable) run the installer with provenance required, so that an archive whose provenance cannot be verified (gh missing, signed out, or the attestation failing) is refused and the round records why; a manual self update keeps today's behaviour and warns when it installed on the checksum alone."
why: "Owner decision of 2026-11-24 (AskUserQuestion, session 9ae82e7a-b0e4-44c0-a305-9c69cd1acf6a, answer verbatim: 'Required for unattended (Recommended)'; knowledge record fabric-starts-with-p00-s00-s01). PR #3110 runs install.sh with the inherited environment, and unless MAJORDOMUS_REQUIRE_PROVENANCE=1 is set install.sh installs on the checksum alone when gh is missing or signed out (site/static/install.sh, verify_provenance). The owner also closed #2977 as a duplicate of #3110. Fabric's gate G8 (no unattended activation without authenticated provenance) asks the same."
current_state: "Observed 2026-11-25: on master install.sh verifies provenance when it can and fails only under MAJORDOMUS_REQUIRE_PROVENANCE=1; the follower of I2721 is in PR #3110 (branch feature/I2721-a-node-follows-the-stable-pointer), open."
desired_state: "The follower's apply sets MAJORDOMUS_REQUIRE_PROVENANCE=1 itself and never inherits a weaker setting; self-update.json names a provenance refusal as such; I2721's follower ships only with this in place."
scope:
  - "apps/majordomus-cli/src/release"
  - "apps/majordomus-cli/src/capability/builtin/self_update.rs"
  - "site/static/install.sh"
  - "test/cases"
  - "docs/DISTRIBUTION.md"
non_scope:
  - "Changing what a person's manual install.sh or self update verifies, beyond the warning"
  - "A second installer or verifier; install.sh stays the one path (ADR 0161)"
depends_on:
  - "I2720"
  - "I2165"
traces:
  - "https://github.com/korczis/prismatic-majordomus/pull/3110"
acceptance_criteria:
  - "A following node with gh absent or signed out refuses the update, keeps its version and records the provenance refusal in its round"
  - "An environment that sets MAJORDOMUS_REQUIRE_PROVENANCE=0 does not weaken the follower"
  - "A manual self update without verifiable provenance installs and says it verified the checksum only"
validation:
  - "majordomus plan validate"
  - "MJ_TEST_JOBS=4 bash test/run.sh 85_installer <the case this issue adds>"
evidence_required:
  - "follower_refuses_unverified_provenance_test"
created_at: 2026-11-25
updated_at: 2026-11-25
