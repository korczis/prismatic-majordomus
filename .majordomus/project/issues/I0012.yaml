id: I0012
milestone: M000
title: Make CI refuse an invalid model or a stale projection
slug: ci-enforcement
priority: p1
profile: implementation
parallel_safe: true
objective: "Add the model validation and the projection freshness check to the blocking CI job, with no advisory pass."
why: "A validator that runs only when somebody remembers is not enforcement."
current_state: "CI ran the suite, doctor, watch and the site data sync check."
desired_state: "CI also runs plan validate and the offline GitHub projection check, and fails on either."
scope:
  - .github/workflows
non_scope:
  - Any CI step that needs a GitHub token to pass
depends_on:
  - I0011
acceptance_criteria:
  - plan validate runs in the blocking job and its exit code is not swallowed
  - The GitHub projection is checked offline against the canonical model
  - No new step requires network access to succeed
validation:
  - bash test/run.sh 26_ci_wiring
evidence_required:
  - ci_test
risk: Low
