id: I2157
milestone: failure-is-visible
title: "Ready means ready: a lost lease, a degraded layer or a failing mesh is not reported ready"
slug: ready-means-ready
priority: p1
profile: implementation
parallel_safe: false
objective: "Fold lease loss and a degraded index into readiness with a named reason, add a mesh check to health.report, and make majordomus doctor report the runtime or say that it does not."
why: "Readiness (apps/majordomus-cli/src/capability/builtin/health.rs:214, GET /api/v1/ready) checks a non-empty registry and that the code is not replaced; a degraded index stays ready:true with layer: warn, and mesh state and lease loss are absent: was_lost() reaches only GET / through LEASEHOLDER_KEY (apps/majordomus-cli/src/http/router.rs:710). health.report (apps/majordomus-cli/src/capability/builtin/health.rs:299) has no mesh and no policy-allowed dimension; mesh health lives only in mesh.status, mesh doctor and mesh verify. Running, ready, mesh-healthy and degraded are split across /live, /ready, server.standing_at (apps/majordomus-cli/src/capability/builtin/server.rs:403), MeshStatus, index::State::Degraded (apps/majordomus-cli/src/index.rs:34) and LinkState::Degraded (apps/majordomus-cli/src/mesh/cooperation.rs:265). The top-level majordomus doctor is a governance doctor (lib/doctor.sh:53-77) that checks nothing about the server, the lease or the mesh, which its name suggests it does. Baseline audit of 2026-10-09 at master 1fb8d6be44, failure gap 10 and premise 4."
current_state: "A server that lost its lease, or serves a degraded index, answers /api/v1/ready with ready true."
desired_state: "GET /api/v1/ready answers ready false after a lease loss, with reasons naming lease_lost (and stale, as before); a degraded layer is listed as layer_degraded and stays ready, which docs/MCP.md says; health.report carries a mesh check that applies mesh doctor's runtime verdict (doctor::runtime_verdict) in a process whose server decided the mesh, and reports unknown elsewhere. Not done here: majordomus doctor still checks governance alone and its help does not yet say so; the shell usage, share/commands.yaml and docs/CLI.md that would change together are left to their own change."
scope:
  - "apps/majordomus-cli/src/capability/builtin/health.rs"
  - "apps/majordomus-cli/src/http/router.rs"
  - "apps/majordomus-cli/src/lease.rs"
  - "apps/majordomus-cli/src/mesh/doctor.rs"
  - "lib/doctor.sh"
  - "apps/majordomus-cli/tests/health_server.rs"
  - "docs/MCP.md"
depends_on: []
acceptance_criteria:
  - "A server that lost its lease answers /api/v1/ready with ready false and the reason lease_lost"
  - "A degraded index is reported on /api/v1/ready with its reason, and docs/MCP.md says whether that is ready"
  - "health.report carries a mesh check whose status follows mesh doctor's verdict when the mesh is enabled"
  - "majordomus doctor in a checkout whose server is stale reports it, or its help states that it checks governance only"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --test health_server --test lease_lost"
evidence_required:
  - "ready_false_on_lease_loss_test"
  - "health_mesh_check_test"
created_at: 2026-10-09
updated_at: 2026-10-09
