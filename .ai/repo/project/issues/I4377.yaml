  - "scripts/interaction-probe --spec graph"
  - "bash test/run.sh 190_graph_drawing 3723_the_graph_text_reads_each_edge_its_way 12c_graph_data 107_design_tokens 1072_the_train_is_seen"
  - "scripts/cockpit-assets --check"
evidence_required:
  - ci
risk: "A reader used to wheel-zooming the site's relation graphs now zooms with Ctrl/Cmd+wheel or the + and - buttons; the keys note under each graph says so."
