id: I1107
milestone: two-folder-integration
title: Discovery is deterministic, cached, and its cost is known
slug: discovery-determinism-and-cost
priority: p1
profile: implementation
parallel_safe: true
objective: "Make one discovery over one tree produce one answer, cache it by what it was derived from, and measure what it costs — because everything downstream now pays that cost."
why: "A model every consumer reads is on the hot path of every command, including the ones that run when a person changes directory. An unmeasured spine becomes the reason the tool is avoided."
current_state: "The layer's flattening is cached by content hash and the executable's phases are timed. The composed model's own cost has not been measured."
desired_state: "The cost is a benchmark with a baseline, the cache is keyed by the inputs, and a stale entry cannot be read for a changed tree."
scope:
  - apps/majordomus-cli/src/index.rs
  - .ai/repo/benchmarks/rust
non_scope:
  - A cache that can serve a stale answer for a changed input
  - A persistent cache shared between repositories
depends_on:
  - I1106
acceptance_criteria:
  - Two discoveries over an unchanged tree produce structurally identical models, with no dependence on directory iteration order
  - The cache is keyed by the content it was derived from, so a stale entry costs a miss and never a wrong answer
  - Cold and warm discovery are benchmarked separately with a recorded baseline
  - A cache hit and a cache miss produce byte-identical output for every read-only command
validation:
  - majordomus bench --check
  - cargo test --workspace --all-features
evidence_required:
  - deterministic_model
  - cache_correct
  - cost_measured
risk: "A cache is a second thing that can be believed. Keying it by content hash means a wrong key costs time, never correctness."
created_at: 2026-09-06
updated_at: 2026-09-06
