id: I2147
milestone: mcp-transports-are-reliable
title: "The MCP transports bound what they read and follow the Streamable HTTP rules they claim"
slug: mcp-transports-are-bounded
priority: p2
profile: implementation
parallel_safe: false
objective: "Apply one declared message bound to stdin lines, request bodies and every response the bridge reads, validate MCP-Protocol-Version, issue unpredictable session ids, and never reap a session whose request is still running."
why: "Bounds are asymmetric. stdin lines have no length bound (apps/majordomus-cli/src/mcp/stdio.rs:40); request bodies are capped at 1 MiB (apps/majordomus-cli/src/http/server.rs:20,207-214) but the owner's in-process stdio session is not; responses the bridge reads have no cap (apps/majordomus-cli/src/mcp/bridge.rs:85, read_to_end), and the mesh's rendezvous and link replies go through the same function (apps/majordomus-cli/src/mcp/bridge.rs:84-85). On the Streamable HTTP endpoint the MCP-Protocol-Version and Accept headers are ignored, session ids are pid-seq-subsecnanos and predictable (apps/majordomus-cli/src/http/mcp.rs:159), and the 90 s idle reaper can expire a session whose single request is still running, because last_seen is stamped only when a request starts (apps/majordomus-cli/src/http/mcp.rs:138). Baseline audit of 2026-10-09 at master 1fb8d6be44, lifecycle gap 14, the payload-limit row and the Streamable HTTP row."
current_state: "One oversized line or response can exhaust a client or a server; a long request can lose its session."
desired_state: "One declared bound applies to stdin lines, request bodies and every response read through the bridge's request function; MCP-Protocol-Version is validated against PROTOCOL_VERSIONS (apps/majordomus-cli/src/mcp/protocol.rs:71); session ids are 128 bits from the operating system's random source; last_seen is stamped again when the answer is written."
scope:
  - "apps/majordomus-cli/src/mcp/stdio.rs"
  - "apps/majordomus-cli/src/mcp/bridge.rs"
  - "apps/majordomus-cli/src/http/mcp.rs"
  - "apps/majordomus-cli/src/http/server.rs"
  - "apps/majordomus-cli/tests/mcp_conformance.rs"
  - "apps/majordomus-cli/tests/mcp_conformance_http.rs"
  - "docs/MCP.md"
depends_on: []
acceptance_criteria:
  - "A stdin line, a request body and a response body each one byte over the declared bound are refused with a typed error, and the session survives"
  - "A request naming an unsupported MCP-Protocol-Version is answered 400"
  - "A session whose single request runs longer than the reap interval is not reaped"
  - "Session ids are drawn from the operating system's random source"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --test mcp_conformance --test mcp_conformance_http --test mcp_stdio"
evidence_required:
  - "transport_bounds_test"
  - "protocol_version_header_test"
  - "long_request_not_reaped_test"
created_at: 2026-10-09
updated_at: 2026-10-09
