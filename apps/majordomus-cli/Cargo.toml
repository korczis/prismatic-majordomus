[package]
name = "majordomus-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Majordomus control-plane CLI: a data-driven stdio MCP server over the repository's .ai/ layer"
license = "MIT"
repository = "https://github.com/korczis/prismatic-majordomus"
publish = false
default-run = "majordomus"

[[bin]]
name = "majordomus"
path = "src/main.rs"

[lib]
name = "majordomus_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# No YAML crate: the layer's YAML is the small subset docs/SCHEMAS.md defines, read by
# src/metadata/yaml.rs exactly as the shell tool reads it.
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
# jsonschema validates every declarative object against the JSON Schema of its kind, read
# at run time from share/schemas/ (and a repository's own). No network resolution.
jsonschema = { version = "0.53", default-features = false }
# schemars derives the one canonical JSON Schema of every typed input and output; MCP and
# OpenAPI schemas are projections of it.
schemars = "1"
# tiny_http: a synchronous HTTP/1.1 server for the loopback `serve` command. No async
# runtime, no framework; routes are derived from the capability registry, not declared.
tiny_http = "0.12"
# sha2: the registry and index fingerprints (cache keys, generated-file headers, benchmark
# evidence) need a stable hash across processes; the standard library's is not.
sha2 = "0.10"
# libc: the lease file is removed inside the SIGTERM/SIGINT/SIGHUP handler (unlink, then
# the default disposition), so a killed server leaves no stale lease. Nothing else.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", default-features = false }
# proptest: the property-based harnesses (cache equivalence, key normalisation, transport
# equivalence, projection determinism, duplicate detection), strategies derived per
# capability from its benchmark cases.
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "projections"
harness = false

[[bench]]
name = "shared"
harness = false

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "routes"
harness = false

[profile.release]
strip = true
