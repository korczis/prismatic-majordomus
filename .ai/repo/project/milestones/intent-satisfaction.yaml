id: intent-satisfaction
title: Satisfaction is explained, and held to the invariants
slug: intent-satisfaction
order: 130
priority: p1
problem: "A criterion's state and an intent's verdict are derived from current evidence (ADR 0107), and the derivation throws away its reasons: the judgement names the inputs that changed and the engine keeps only one word. Every criterion blocks the verdict; an intent cannot say one is optional. And the invariants are prose: they are printed to the worker and judged by nothing, so an intent reads satisfied while what it said must stay true has stopped being true."
outcome: "Each judged criterion carries an evaluation a reader can check. A criterion may be optional. An intent may declare guards, invariants that name their evidence, and a failing one makes the verdict unsatisfied, naming it."
current_state: "IntentCriterion carries state, met, proof and reproduce. TestStanding drops Judgement.changed and Judgement.detail. The criterion schema has no optional key. IntentRecord.invariants is a list of strings nothing evaluates."
desired_state: "The engine's own judgement travels with the criterion; the verdict counts required criteria and judged invariants; intent show, intent explain, the binding and the opposition print what the engine answered."
scope:
  - apps/majordomus-cli/src/intent.rs
  - apps/majordomus-cli/src/intent_realization.rs
  - apps/majordomus-cli/src/intent_opposition.rs
  - apps/majordomus-cli/src/intent_binding.rs
  - apps/majordomus-cli/src/evidence
  - apps/majordomus-cli/src/intent_plan.rs
  - apps/majordomus-cli/src/intent_review.rs
  - apps/majordomus-cli/src/capability/builtin
  - site
  - apps/majordomus-cli/src/commands/intent.rs
  - apps/majordomus-cli/tests
