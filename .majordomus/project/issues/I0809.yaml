id: I0809
milestone: M003
title: Record only edges that a file states, each with where it was observed
slug: knowledge-edges-provenance
priority: p1
profile: deep-work
parallel_safe: false
objective: "Implement the resolve and graph stages: edges derived from the explicit relationships the canonical files already declare — claim to source, implementation and test; issue to milestone and to its dependencies; evidence to issue; doctrine to validator, claim and test; record to task — each carrying the file and field it was observed in, and none carrying a relationship inferred from prose."
why: "The repository already contains a dense, hand-maintained, machine-readable graph that no command can traverse. Extracting it costs nothing in accuracy because every edge is stated. Heuristic extraction from prose would add edges nobody wrote, and an edge nobody wrote cannot be checked by the person who would notice it is wrong."
current_state: "docs/CLAIMS.yaml states three relationships per claim; the issue files state a milestone and a dependency list; share/doctrines.yaml states a validator, a claim list, a test and the commands that enforce it; every continuity record states its task. Nothing reads any of them as a graph."
desired_state: "An edge is a from, a to, a type and a provenance, and the graph stage rejects an edge missing any of the four. Edge types are a closed declared set. A dangling edge — one whose target is not a node — is retained and reported rather than dropped, because a broken reference is the finding."
scope:
  - lib/knowledge.sh
  - lib/knowledge.awk
  - test/cases/66_knowledge_edges.sh
  - test/cases/67_knowledge_mutation.sh
non_scope:
  - Inferring a relationship from prose
  - Any similarity, clustering or taxonomy generation
  - Session edges, which arrive with the session integration
depends_on:
  - I0808
acceptance_criteria:
  - Every edge carries the source file it was observed in, and an edge without provenance is a validation failure rather than a silent drop
  - The edge types are a declared closed set and an undeclared type is an error
  - Changing a dependency in an issue file changes the graph on the next sync with no generated file edited by hand
  - A dangling edge is reported and names both ends
  - No edge is produced from a Markdown link whose target is outside the repository
validation:
  - bash test/run.sh 66_knowledge_edges
  - bash test/run.sh 67_knowledge_mutation
evidence_required:
  - provenance_required
  - mutation_propagates
risk: "Markdown links are the one edge source that is not curated. Treating a broken external link as the same severity as a broken claim-to-test reference would make a permanent red gate out of an intentional outbound link; ownership and severity have to be distinguished."
