  - ".ai/repo/rules/project/a-push-runs-what-ci-would-find-first.v1.md"
  - ".ai/repo/rules/project/a-push-runs-what-ci-would-find-first.v2.md"
  - ".ai/repo/policy.yaml"
  - ".ai/repo/automation/inventory.jsonl"
