        resource:
          anyOf:
            - "$ref": "#/components/schemas/McpResource"
            - type: "null"
          description: As a readable resource.
      description: "How, if at all, a capability appears to an MCP client."
    McpResource:
      type: object
      properties:
        uri:
          type: string
          description: "`majordomus://<kind>/<identity>`, or `majordomus://repository`."
