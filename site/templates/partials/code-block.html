{#- expects: cb_id, cb_label, cb_body. Copy is Flowbite's data-copy-to-clipboard-target,
    not a hand-written clipboard implementation. -#}
<div class="overflow-hidden rounded-lg border border-gray-200 dark:border-gray-800">
  <div class="flex items-center justify-between border-b border-gray-200 bg-gray-50 px-3 py-2 dark:border-gray-800 dark:bg-gray-800/60">
    <span class="font-mono text-xs text-gray-500 dark:text-gray-400">{{ cb_label }}</span>
    <button data-copy-to-clipboard-target="{{ cb_id }}" type="button"
            class="rounded px-2 py-1 font-mono text-xs text-gray-600 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300 dark:text-gray-400 dark:hover:bg-gray-700">copy</button>
  </div>
  <pre id="{{ cb_id }}" class="overflow-x-auto bg-white p-4 font-mono text-xs leading-relaxed text-gray-800 dark:bg-gray-900 dark:text-gray-200"><code>{{ cb_body }}</code></pre>
</div>
