id: a-session-proceeds
title: Any session becomes a productive worker of the repository with one word
statement: "A person who opens any session on any machine and says /proceed gets a worker that has resolved the repository's context, read every board and the mesh, chosen the most valuable work no one else holds and that it may take, explained that choice, claimed it, executed it under the task lifecycle, proved it, and handed it to the landing seat — and the same word said again, with nothing changed, creates nothing."
invariants:
  - The decision is one capability answered from the existing capabilities; the skill, the command line, MCP and the UI are its projections and hold no rule, workflow step or issue list of their own
  - A choice is explained term by term and refuses a candidate another worker claims, whose scope another worker holds, or whose binding is refused
  - Proceeding never merges, tags or releases; delivery stays with the landing and release seats
  - Exclusivity across machines is the mesh's claim, not a lock of this feature's own
milestones:
