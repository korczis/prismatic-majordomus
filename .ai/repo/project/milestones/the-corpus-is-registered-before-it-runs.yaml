id: the-corpus-is-registered-before-it-runs
title: "A corpus of 20 tasks, stratified by a difficulty proxy measured and registered before the new tasks are written, is registered with its analysis, run order, stopping rule and a pinned release"
slug: the-corpus-is-registered-before-it-runs
order: 203
priority: p1
problem: "The owner's report of 2026-10-19 (T2) asks for 20 comparable tasks split by difficulty in advance. The economics corpus has seven tasks, 4 small and 3 medium by their declared complexity and none large (grep complexity .ai/repo/benchmarks/economics/tasks/*/task.yaml). The suite declaration (model.rs:437) registers no strata, outcomes, analysis, run order or stopping rule. Difficulty is only the author's declaration. The treatment runs the checkout's own bin, lib and share (suites/pilot.yaml freshness_inputs), which the mesh changes many times a day, so a run spanning days would go stale before its pairs complete."
outcome: "suites/corpus.yaml is a registration committed before the first run: 20 tasks in three strata whose cut-offs on a measured proxy were registered before the new tasks existed, each task proven failable and passable and reviewed by someone other than its author, a seeded interleaved run order, a stopping rule, and a treatment pinned to one released version."
current_state: "suites/pilot.yaml:10-14 fixes model claude-sonnet-5, repetitions 2 and 5 USD per session against methodology.yaml:57 min_repetitions 3. methodology.yaml:43 lists majordomus revision among the comparability keys. runner.rs:103 RunOptions has a per-session timeout and no suite ceiling. wc -l test/fixtures/economics/reference/*.patch gives patches of 11 to 92 lines."
desired_state: "suites/corpus.yaml loads under the registration validation; economics references proves all 20 tasks; the T2 protocol in the proof plan names the suite's registration digest."
