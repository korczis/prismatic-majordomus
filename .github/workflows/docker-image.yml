# Build and publish the canonical generated deployment image, independently from
# the release archive workflow. No production deploy occurs here.
# BuildKit registry cache is reusable from local Docker Buildx on any machine.
name: docker-image

on:
  push:
    branches: [master]
    paths:
      - '.ai/repo/deployments/**'
      - 'apps/majordomus-cli/**'
      - 'apps/majordomus-cli/src/deploy/render.rs'
      - 'deploy/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact-commit image with shared registry cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            MAJORDOMUS_BUILD_COMMIT=${{ github.sha }}
            MAJORDOMUS_BUILD_DIRTY=false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
      - name: Local reuse
        run: |
          echo "BuildKit cache: ghcr.io/${{ github.repository }}:buildcache" >> "$GITHUB_STEP_SUMMARY"
          echo 'Local: docker buildx build --load --cache-from type=registry,ref=ghcr.io/${{ github.repository }}:buildcache --build-arg MAJORDOMUS_BUILD_COMMIT="$(git rev-parse HEAD)" -f deploy/Dockerfile -t majordomus:dev .' >> "$GITHUB_STEP_SUMMARY"
