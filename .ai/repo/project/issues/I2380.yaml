  - "Not deleting any branch: the owner, or the session that owns each one, decides"
  - "Not the duplicate derivation of the latest release at generate-site-data:281: I2372"
  - "Not the obsolete ui-implementation pack under tmp/owner-packs, which is untracked working material"
  - "Not adding widths or reduced motion to the sweeps: I2378"
depends_on: []
acceptance_criteria:
  - "No file under scripts/, site/templates/, apps/majordomus-cli/src/ or .ai/repo/features/ reads or sets a feature's `featured`, and `rg` over them for the phrase on the homepage beside featured finds nothing"
  - "A feature file that still sets `featured` is refused by the feature schema as an unknown key"
  - "generate-site-data succeeds over a layer whose features set no `featured`, and `product list --featured` exits 2 as an unknown option"
  - "Neither the site-probe gate summary nor the header of scripts/site-probe names a count of widths"
validation:
