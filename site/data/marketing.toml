# The only hand-written prose on the site: positioning sentences and button labels. No
# capability claims (those are features under .ai/repo/features/ and claims in
# docs/CLAIMS.yaml, both derived onto the page) and no numbers (the generator computes
# every count). Budget: scripts/site-check fails when this file exceeds 60 lines.

[hero]
eyebrow = "Intent-driven development"
title = "Stop telling AI what files to edit."
subtitle = "Tell it what must become true."
mantra = ["Not merely implemented.", "Not merely tested.", "Not merely merged."]
verdict = "Satisfied."
lead = "Majordomus is a control plane built on a doctrine: the desired state of the system, the constraints that must stay true and the evidence completion requires belong to the repository, not to a prompt. What follows keeps the two halves apart and marks each one — the part that is enforced here today, and the part that is still only the argument."
cta_primary = "Install"
cta_secondary = "How an intent becomes proof"
console_caption = "The answer this command returned when the page was built, drawn as a table rather than terminal text, with the features still in draft left out. The rows are the features this repository declares and the marks are derived from what each one names; the same answer is on the command line, over HTTP and over MCP."

[install]
layer = "What init creates is the layer this site is generated from: one directory, tracked, readable without the tool. The sections below are this repository's own."

[recognise]
title = "You need this if, this week, you have…"
closing = "None of these are model problems. They are operations problems, and operations is what Majordomus does."

[chapters]
kicker = "what it does"
lead = "Each chapter is one feature file under the layer. The interfaces, the counts, the mechanisms and the moments beside it are derived from what that file names; the words are the only thing a person wrote."

[write_once]
title = "Write once. Surface everywhere."
lead = "A rule, a skill, a decision, a use case, an operational moment, a feature: each is one file under the layer with a schema. Discovery finds it, the schema validates it, the index holds it, and every interface reads the index. Registration happens where the kinds are declared, and again by hand only for the command line and the Cockpit's own pages."

[providers]
title = "Provider-neutral by construction"
lead = "The policy is one file and every tool's instruction file is generated from it — an agent's, or an orchestrator's that runs agents over the repository. A worker's context, its worktree, its handovers and the repository's decisions belong to the repository, not to the vendor whose session happened to produce them."
boundary = "Majordomus never invokes a model; it decides what a worker is told, what it may touch, and whether its claim of being done can be believed."

[surfaces]
title = "One registry, every interface"
lead = "A capability is declared once. The command line, the HTTP API, the OpenAPI document and the Swagger UI over it, the MCP tools and resources, the Cockpit and this site are projections of that declaration; a projection that disagrees with it fails its check, and the part of the command line not yet derived is reported rather than hidden."

[matrix]
lead = "Every mark is derived. A feature is on an interface because a module, command or kind it names is projected there, never because a page says so; a gap is shown rather than hidden."

[graph]
lead = "The same model as a graph: features, what each is made of, and the interfaces that follow. Select a node to see what it touches; the list under it is the graph without a script."

[contract]
caption = "The contract as the repository's own README works it through — an illustration, not a capture. One line per check, each naming what it proved; a failing line carries the command that reproduces it, and nothing is written until every line passes."

[architecture]
lead = "This page is a projection of the repository it describes. Every feature, count, provider, interface and moment on it came out of the same executable that answers agents, and a stale page fails the build before it can be deployed."

