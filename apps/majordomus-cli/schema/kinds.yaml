# The object kinds this executable knows how to read, one entry each. Embedded into the
# binary at build time; the repository never needs a copy.
#
# Rust carries the mechanism (read a file in a format, validate its keys, take an identity
# and a title from named fields). This file carries the knowledge of which fields mean what
# for each kind. Which files are of which kind is not decided here either: the repository's
# own .ai/repo/knowledge/sources.yaml maps pathspecs to kinds, and a kind it names that this
# file does not know is reported, never guessed.
#
# fields:
#   format          markdown | yaml — how the file is read
#   front_matter    required | optional | none — for markdown, whether a YAML front matter
#                   block must be present, may be present, or is not looked for
#   without_front_matter
#                   for markdown, the kind a file with no front matter is read as instead
#                   of being refused: a README inside the rules tree is a document, not a
#                   broken rule. The named kind must itself accept such a file.
#   allow           the allow-list under share/allow/<name>.txt that every flattened key
#                   path of the metadata must match; absent means the kind declares no key
#                   contract and its metadata is carried through unvalidated
#   identity        the metadata fields joined with '@' that make the object's identity;
#                   empty means the repository-relative path is the identity
#   title           the metadata field holding the title, or '@heading' for the first
#                   level-one Markdown heading; absent means no title
#   description     the metadata field holding the one-line description; absent means none
#   schema_version  a field that must carry one of the supported values, when the kind
#                   has a format version distinct from its identity
schema: majordomus-kinds/v1

kinds:
  rule:
    format: markdown
    front_matter: required
    without_front_matter: document
    allow: rule
    identity: [id, version]
    title: title
    description: description

  prompt:
    format: markdown
    front_matter: required
    allow: prompt
    identity: [name]
    title: name
    description: description

  profile:
    format: yaml
    allow: profile
    identity: [name]
    title: name
    description: description

  policy:
    format: yaml
    allow: policy
    identity: []
    schema_version:
      field: version
      supported: [1]

  milestone:
    format: yaml
    allow: milestone
    identity: [id]
    title: title
    description: outcome

  issue:
    format: yaml
    allow: issue
    identity: [id]
    title: title
    description: objective

  document:
    format: markdown
    front_matter: optional
    identity: []
    title: '@heading'
