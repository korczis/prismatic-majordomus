id: I4360
milestone: the-runtime-supervises-itself
title: "monitor reports a GitHub run queued past its bound, not only the runs that completed"
slug: monitor-reports-a-run-queued-past-its-bound
priority: p2
profile: implementation
parallel_safe: true
objective: "`workflow_run` in apps/majordomus-cli/src/monitor/github.rs turns a run whose status is queued, waiting or in_progress and whose age is past the bound I3903 declares for it into one warning moment naming the run, its workflow, its head branch and the age, raised once per run; a completed run is read as before. When the run waits for a self-hosted label and no runner of the repository is online (`actions/runners`), the moment names \"no runner online\" as the cause, so a watcher does not wait or re-run into a queue nothing serves."
why: "On 2026-10-28 trains 10a and 10b sat queued for hours behind superseded runs (40708407548, 40713047404, 40713048283) and monitor said nothing, because workflow_run returns None for every run that is not completed; and GitHub reports a run queued while any job waits, so `gh run list --status in_progress` = 0 did not mean nothing ran. On 2026-10-27 master's validate sat queued for 50 minutes with twelve runs queued and none in progress because every self-hosted runner was offline, and nothing said so. I3903 cancels such a run on a schedule; nothing tells a watching session that one is stuck."
current_state: "Verified at 81ef931: apps/majordomus-cli/src/monitor/github.rs:307-309 returns None for any run whose status is not completed."
desired_state: "A run queued past its bound is a monitor moment, with a unit test over a fixture run list holding a queued, an in-progress and a completed run."
scope:
  - "apps/majordomus-cli/src/monitor/github.rs"
  - "docs/MONITOR.md"
  - ".ai/repo/project/issues/I4360.yaml"
acceptance_criteria:
  - "A fixture run queued longer than its bound yields exactly one warning moment; one under its bound yields none; a completed run yields what it yields today"
  - "A fixture run queued past its bound for a self-hosted label, with a runner list in which every runner is offline, yields a moment whose cause is no runner online"
validation:
  - "cargo test --lib monitor::github"
  - "bin/majordomus plan validate"
evidence_required:
  - rust
depends_on: ["I3903"]
serves:
  - "nothing-in-the-mesh-waits-on-something-dead#states-are-classified"
created_at: 2026-10-28
updated_at: 2026-10-29
