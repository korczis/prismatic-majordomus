id: I2343
milestone: the-queue-drains-until-settled
title: "Without an autonomous profile a drain behaves as it did, and each new mutation is opened by a recorded rollout stage"
slug: unattended-drain-is-rolled-out-in-stages
priority: p1
profile: implementation
parallel_safe: true
objective: "Gate the risky mutations behind stages during the migration, preserve the present semantics of prs drain when no autonomous profile is given, provide a migration and a rollback, and publish a version only once the checks prove it."
why: "The continuous mode was itself opened by a gate that reads the trail: five verified merges since the last unverified one. Repair by a worker, parallel repair and automatic closure each deserve the same, and an adopter who never asks for autonomy must see no change. Source: autopilot prompts/06-closed-loop-delivery.md Issue 5 'Rollout and compatibility'."
current_state: "The rollout has four stages recorded in docs/INTEGRATION_ROLLOUT.md, and the continuous stage is refused until the trail holds five verified merges (docs/INTEGRATION.md, apps/majordomus-cli/tests/integration_rollout.rs). Gating and recording every stage in general is planned on a rescue branch (I2048)."
desired_state: "Each new mutation of this milestone has a stage that the trail must have proved before it is allowed: dry run of the action, one supervised act, a bounded number, then unattended. A stage is refused with exit 10 before the lease is touched, and the refusal names what the trail lacks. With no profile, every case that holds the present drain passes unchanged. Rolling back is turning the profile off, and the document says what state that leaves."
scope:
  - "apps/majordomus-cli/src/integration/drain.rs"
  - "apps/majordomus-cli/tests/integration_rollout.rs"
  - "docs/INTEGRATION_ROLLOUT.md"
  - "docs/INTEGRATION.md"
  - ".ai/repo/policy.yaml"
non_scope:
  - "The release that ships the mode, which is the proof milestone's."
depends_on:
  - I2337
  - I2321
acceptance_criteria:
  - "With no autonomous profile, the cases 720, 741, 850 and 910 pass unchanged"
  - "Each new mutation is refused until the trail shows its previous stage, and the refusal names the missing evidence"
  - "Turning the profile off mid-run ends the run in order and leaves no worker and no lease"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --test integration_rollout"
  - "MJ_TEST_JOBS=4 bash test/run.sh 720_integration_follows_the_current_master 741_a_continuous_drain_stops_cleanly_and_alone 850_integration_drains_cycle_by_cycle 910_nothing_merges_around_the_integrator"
evidence_required:
  - "no_profile_no_change_cases"
  - "stage_gate_refusal_test"
  - "rollback_case"
created_at: 2026-10-10
updated_at: 2026-10-10
