[package]
name = "majordomus-core"
version = "0.27.0"
edition = "2021"
rust-version = "1.85"
description = "The portable core of Majordomus: canonical JSON and its digest, identical on a native host and in a browser's WebAssembly."
license = "MIT"
publish = false

[lib]
name = "majordomus_core"
# rlib only, for the executable that depends on it. The wasm32 module a browser loads is the
# cdylib `scripts/rust-check --portable-core` asks for (`cargo rustc --crate-type cdylib`).
# With a cdylib here too, cargo names the rlib without a hash. Every worktree's builds share
# one build directory (.cargo/config.toml), so a standalone build of this crate against its
# own Cargo.lock then replaced the rlib the executable links, and the next executable build
# anywhere failed at canonical_json (2026-10-24, 2026-10-25; I4232). An rlib alone is named
# by its hash, so the two builds keep two rlibs.
crate-type = ["rlib"]

[dependencies]
# The same two crates the executable already takes, with the same features, so that a value
# parsed here is the value the executable parses: nothing new enters either lock.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
