id: I1012
milestone: capability-graph
title: One detail view, assembled from what a node actually has
slug: capability-detail-and-traceability
priority: p1
profile: implementation
parallel_safe: true
objective: "Render a capability's detail page from its populated sections and its resolved relations, with a stable deep link and a repository-relative reference to where the information came from."
why: "The question a detail page has to answer is where this thing actually comes from. A separate hand-written template per kind guarantees that answer is inconsistent, and a link built from a display title breaks the first time somebody improves the wording."
current_state: "The Cockpit renders views over the registry. Deep links and source traceability are not part of the model."
desired_state: "One assembly renders any node, showing only populated sections, with a stable link and a repository-relative source reference."
scope:
  - apps/majordomus-cli/src/cockpit/view.rs
non_scope:
  - A separate hardcoded template per kind unless the presentation genuinely differs
  - A machine-absolute path in any published output
  - Identity derived from a display title
depends_on:
  - I1005
acceptance_criteria:
  - Empty sections are absent rather than rendered blank
  - The deep link is built from the stable identity and survives a title change
  - Source references are repository-relative and never machine-absolute
  - The static projection produces compatible links
validation:
  - cargo test --workspace --all-features
  - bash test/run.sh
evidence_required:
  - detail_assembled
  - deep_links_stable
  - traceability
risk: "Traceability that publishes a path from the machine that built the site is a leak. Repository-relative is the only form that ships."
created_at: 2026-09-06
updated_at: 2026-09-06
