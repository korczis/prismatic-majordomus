id: I3255
milestone: command-and-deployment-criteria-are-judged
title: "A command criterion is met only by a recorded passing run of exactly that command at the presented revision"
slug: a-command-criterion-is-judged
priority: p1
profile: implementation
objective: "Revive I2222 and I2223 from origin/chore/the-owner-packs-are-planned (ec37317fe7c, 2026-10-10, never landed): a criterion with evidence command reads current from a ledger execution receipt of exactly its ref, passing, whose inputs did not change since; stale, failing or not_run otherwise; never current on an unexecuted, deleted, forged or wrong-target receipt."
why: "On master intent.rs maps every command criterion to IntentEvidenceState::NotDerivable (intent.rs ~1137), so intent-lifecycle's own criterion model-is-gated and any intent with a command criterion can never be satisfied (observed 2026-10-17 and on master 707a04c). Sources: chatgpt-majordomus:c196#6, chatgpt-majordomus:c288#8."
current_state: "intent.rs: `command` and `deployment` arms return NotDerivable; test and claim are judged."
desired_state: "Command criteria are judged from the same receipts finish and the evidence ledger read; no new store."
scope:
  - "apps/majordomus-cli/src/intent.rs"
  - "apps/majordomus-cli/src/evidence"
  - "apps/majordomus-cli/tests/intent.rs"
  - "docs/EVIDENCE.md"
acceptance_criteria:
  - "A passing receipt of the exact command at the presented revision reads current"
  - "A receipt of a different command, a failing run, or a run before a change to its inputs reads not current with the reason"
  - "intent-lifecycle#model-is-gated stops reading not_derivable"
  - "A command criterion whose ref is `majordomus intent explain <its own intent>` never reads current: it is a placeholder for a planned proof and reads not_derivable naming it, because intent explain exits 0 whatever it finds"
validation:
  - "majordomus plan validate"
  - "majordomus intent validate"
  - "cargo test --test intent"
evidence_required:
  - "test_a_command_criterion_is_judged"
created_at: 2026-10-18
updated_at: 2026-10-18
