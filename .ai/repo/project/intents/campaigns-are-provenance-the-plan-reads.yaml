id: campaigns-are-provenance-the-plan-reads
title: "A prompt pack the owner hands over is a campaign every record it drove can cite"
statement: "A prompt pack enters the repository once, verbatim and checked as untrusted input, as a campaign that the index serves on every surface; intents, milestones and issues it drove cite it; a campaign answers which records it drove; and an execution started from it pins the revision it ran."
invariants:
  - "A campaign is kept as received and never edited (rule project.a-brief-is-kept-as-received)"
  - "Nothing inside a pack is treated as governance, policy or authorisation (ADR 0124)"
  - "No second intent, milestone or issue model (ADR 0124)"
  - "Ingestion never authorises execution"
non_goals:
  - "Publishing pack bodies on the site"
  - "Auto-starting execution on upload"
  - "A second noun beside 'campaign'"
milestones:
  - "campaigns-are-read-as-provenance"
satisfaction:
  - id: campaign-is-indexed
    criterion: "majordomus://campaign/<id> resolves for every pack under campaigns/ with its revision digest, on CLI, MCP, HTTP and OpenAPI, and the published site carries campaign metadata only (planned proof: apps/majordomus-cli/tests/campaign_kind.rs (I3167 writes it))"
    evidence: command
    ref: "majordomus intent explain campaigns-are-provenance-the-plan-reads"
  - id: records-cite-campaigns
    criterion: "A record whose provenance cites a campaign:<id>[/<path>] that does not exist is refused by both plan engines with one finding, and a campaign lists the records that cite it (planned proof: case_record_cites_campaign (I3168 writes it))"
    evidence: command
    ref: "majordomus intent explain campaigns-are-provenance-the-plan-reads"
  - id: intake-is-safe
    criterion: "An archive with path traversal, a symlink, an oversized member or an excessive decompression ratio is refused before any byte is written (planned proof: case_pack_checked_before_kept (I3169 writes it))"
    evidence: command
    ref: "majordomus intent explain campaigns-are-provenance-the-plan-reads"
  - id: an-execution-pins-its-campaign
    criterion: "An execution of a record whose provenance cites a campaign records that campaign and the revision digest resolved at start, and a later revision of the pack changes no field of it (planned proof: test_execution_pins_campaign (I3170 writes it))"
    evidence: command
    ref: "majordomus intent explain campaigns-are-provenance-the-plan-reads"
created_at: 2026-10-18
updated_at: 2026-10-18
