  - "test/cases/4460_gate_evidence_over_no_file_is_never_fresh.sh"
non_scope:
  - "The obligation judge, I4434 / #2751: the same \"\" == \"\" shape in mj_obligation_judge (lib/evidence.sh:457-459) and obligations.rs:683, fixed there and merged around, never absorbed here"
  - "Declaring an adopter's own class paths in .ai/repo/ci/gates.yaml, or deriving them from the task's scope: the empty set is reported and refused here, never guessed"
  - "Changing what the shell recorder writes to the ledger: a run over no file keeps recording the empty hash, so existing ledgers read the same"
depends_on: []
serves: []
acceptance_criteria:
  - "Case 4460, in a fixture repository with a CI model whose class paths select none of its tracked files: a task started, a run recorded with `evidence --gate <id> --exit 0`, then a tracked file edited; `majordomus check` exits 0 and names the gate unknown with `selects no file in this repository`, and never `exit 0 at` for it"
  - "Case 4460: in the same state `majordomus finish --outcome completed` exits 10 and names the gate and the reason; `finish --outcome partial` with a note exits 0 and reports it"
  - "Case 4460: one parity table, run through the shell recorder (the inputs_hash it writes), gates.completion and gate state for the same fixture, gives the same hash and the same state and reason over: class paths that select files, class paths that select none, a gate no class names, an always gate, a recorded empty hash and a recorded non-empty hash"
  - "Case 4460: with the fixture given a file the class paths select, a run recorded and that file then changed, the gate reads stale exactly as case 131 asserts today, and an always gate's run is judged as today"
  - "Mutation: restoring the pass for a recorded \"\" against a current \"\" in judge.rs or in state.rs turns case 4460 red at its first assertion for that judge; the case's header names both mutations"
  - "Cases 131 and 3059 pass unchanged"
  - "Before the change, case 4460 fails at its first assertion"
validation:
  - "MJ_TEST_JOBS=4 bash test/run.sh 4460_gate_evidence_over_no_file_is_never_fresh 131_completion_gates 3059_gate_state_is_answerable"
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib gates"
  - "bin/majordomus shell check"
  - "bin/majordomus doctor"
  - "bin/majordomus plan validate"
evidence_required:
  - "empty_gate_input_set_case"
risk: "Every adopter whose class paths select none of its files starts seeing unknown where it saw pass for each gate that is not always: true, and a completed finish is refused until the CI model's paths are its own; the line has to name the specs that matched nothing so the reader knows the refusal is about the model, not about the work."
