acceptance_criteria:
  - "every gate, deployment, release, milestone, intent, rule test, rule declaration and claim source, implementation and test a screen names is a link, to a UI route or to the technical view of an object the index holds"
  - "a reference the index does not hold is text, never a link to a page that answers 404"
  - "a missing value reads none or unknown, never a blank"
  - "a list cut short says how many it leaves out"
  - "the merge tiles and the throughput chart use the queue's own window, and a window the queue does not state is never invented"
