id: I4364
milestone: development-runtime
title: "A promoted knowledge note cites only references a clean clone resolves"
slug: a-promoted-note-cites-what-a-clone-resolves
priority: p1
profile: implementation
parallel_safe: true
objective: "knowledge derive and knowledge promote write into a candidate's and a curated note's provenance.derived_from only references every clone of the repository resolves: the commit, file, rule, test or capability the evidence names, never a session or task identity whose record lives in .ai/local or in an episode that has not been closed and committed; a note that still carries one is refused by knowledge check with the reference named."
why: "On 2026-10-29 de took #2650 out of train 11 because doctor failed twelve references in its curated notes: lib/knowledge.sh (the candidate writer) puts `- session:<sid>` and `- task:<tid>` into every derived candidate's derived_from, promote keeps them, and they resolve only in the checkout that holds those episodes, so doctor and knowledge check passed where the notes were written and failed in the train's clean tree. #2676, written the same morning, carried the same eight references, and #2646's notes too."
current_state: "On master 5370ee63d19 lib/knowledge.sh writes session:%s and task:%s (or decision:%s) into derived_from for every candidate; knowledge check resolves them against the local episode store, so it cannot see the failure a clone sees."
desired_state: "A candidate's derived_from names the observation's evidence references and, when the episode's record is not yet committed, no session or task; knowledge check, run as a clean clone would, refuses a curated note whose derived_from names a session or task with no committed record; the curated notes of #2650, #2676 and #2646 pass in a clean clone."
scope:
  - ".ai/repo/project/issues/I4364.yaml"
  - "lib/knowledge.sh"
  - "lib/knowledge.awk"
  - "test/cases/4364_a_promoted_note_cites_what_a_clone_resolves.sh"
non_scope:
  - "Closing and committing episodes automatically at promotion"
depends_on: []
acceptance_criteria:
  - "knowledge derive writes no session: or task: reference into a candidate whose episode has no committed record"
  - "knowledge check refuses a curated note citing a session or task with no committed record, naming the note and the reference, in a checkout with no .ai/local"
  - "A case plants such a note in a fresh clone of a fixture repository and watches knowledge check refuse it, and passes once the note cites the commit"
validation:
  - "bash test/run.sh 4364_a_promoted_note_cites_what_a_clone_resolves"
  - "majordomus knowledge check"
evidence_required:
  - ci
risk: "Notes already curated with session references keep them; the check names each, and the fix is to cite the commit that added the note."
created_at: 2026-10-29
updated_at: 2026-10-29
