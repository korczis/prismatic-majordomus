id: I4537
milestone: one-frame-one-kit-one-library-per-job
serves:
  - "one-kit-on-every-surface#one-component-kit"
title: "One component kit: the /ui and Cockpit El kits merge into web/kit, the Tera kit emits the same markup contract, and a case holds the two together"
slug: one-component-kit-two-renderers
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S3 of milestone one-frame-one-kit-one-library-per-job. Merge apps/majordomus-cli/src/ui/view.rs into the Cockpit's El kit as apps/majordomus-cli/src/web/kit, one implementation each of card, kpi, table, badge, hero, meter, timeline, breadcrumbs, pagination, facts and alert. Remove the .mj-ui-* classes and the duplicate stat and kpi CSS so share/design/kit.css is the one stylesheet of the kit. Bring site/templates/kit to emit the same markup contract, and add a case that renders every component through both renderers and compares the structure and classes."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). Each component is drawn two or three ways over overlapping classes, so a fix in one surface never reaches the others."
current_state: "Measured on master on 2026-11-07: card, kpi, table, badge, hero, meter, timeline, breadcrumbs, footer and sidebar are drawn by two or three implementations over .mj-card, .mj-ui-panel and .mj-panel, and .mj-stat, .mj-ui-kpi and .mj-kpi; share/ui/src/ui.css imports ../../design/kit.css (line 33) and uses none of it; apps/majordomus-cli/src/ui/view.rs and apps/majordomus-cli/src/cockpit/view.rs are two El kits; site/templates/kit holds the Tera kit's 6 files."
desired_state: "apps/majordomus-cli/src/web/kit is the one El kit both /ui and /cockpit use; no .mj-ui-* class remains; share/design/kit.css styles every component; site/templates/kit emits the same contract; the contract case passes and fails on a planted divergence."
