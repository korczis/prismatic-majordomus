id: I4254
milestone: a-second-adopter-is-served
title: "An adopter projects its plan to GitHub with the installed tool, not a clone of its source"
slug: the-github-projection-ships-with-the-release
priority: p1
profile: implementation
parallel_safe: true
objective: "The release carries the projection as a command (for example `majordomus github plan|check|apply`), its network calls still outside lib/, and apply sets or derives the remote's default branch when refs/remotes/<remote>/HEAD is absent."
why: "An adopter's field report (a private Python client repository adopted from the v1.0.0-alpha.8 release on 2026-10-27, with the plan model, project rules, knowledge, skills, Claude Code capture and a GitHub projection all in use) found: the GitHub projection (scripts/github-sync, scripts/traceability) is not in the release archive, which ships bin/, lib/, libexec/ and share/; the adopter cloned the tool's source at its tag, in CI and locally. --apply also needs refs/remotes/<remote>/HEAD, which a fresh CI checkout lacks."
current_state: "The projection lives in scripts/ of the source tree only."
desired_state: "The release carries the projection as a command (for example `majordomus github plan|check|apply`), its network calls still outside lib/, and apply sets or derives the remote's default branch when refs/remotes/<remote>/HEAD is absent."
scope:
