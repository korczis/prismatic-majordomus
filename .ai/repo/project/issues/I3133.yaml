id: I3133
milestone: the-product-shows-what-it-caught
title: "The economics benchmark measures acceptance: how many sessions declared done while the task's hidden tests fail, with and without the finish contract"
slug: the-benchmark-measures-false-dones
priority: p2
profile: deep-work
objective: "Add an acceptance metric to the economics methodology over the existing pilot corpus: per arm, the fraction of sessions whose final state the agent called done while the hidden acceptance tests fail, and add a treatment variant that includes the finish contract and hooks the first treatment excludes; the generator publishes it only past the methodology's existing rule."
why: "Assessments of 2026-10-02, 10-11 and 10-13 asked for identical tasks with and without Majordomus, measuring false completion, not only tokens. The corpus already has hidden tests that decide whether a 'done' is done; docs/ECONOMICS.md lists 'the finish contract's effect on rework' as unmeasured. Under version 1's pairing rule, the runs this metric counts are invalid, and without a declaration that the runner observes, the metric would only repeat the failed-run table already in docs/generated/economics.md. Proposed in ADR 0208 (The product's value is stated as the false dones its finish caught, beside the friction it cost) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c176#9, chatgpt-majordomus:c226#18, chatgpt-majordomus:c256#5, chatgpt-majordomus:c194#3, chatgpt-majordomus:c001#2, chatgpt-majordomus:c119#5, chatgpt-majordomus:c126#1, chatgpt-majordomus:c179#11, chatgpt-majordomus:c179#13, chatgpt-majordomus:c198#14."
current_state: ".ai/repo/benchmarks/economics/methodology.yaml (version 1, primary metric effective_token_reduction, a pair valid only when both runs succeeded); seven tasks with hidden tests; docs/generated/economics.md at 707a04c7ce8 reports 0 valid live pairs under methodology 1 and already tabulates failed runs per arm."
desired_state: "Methodology version 2 declares the acceptance metric and the finish treatment; the calculator in apps/majordomus-cli/src/economics computes it; the report says unmeasured until pairs exist."
scope:
  - ".ai/repo/benchmarks/economics/methodology.yaml"
  - "apps/majordomus-cli/src/economics"
  - "docs/ECONOMICS.md"
  - "docs/generated/economics.md"
  - "apps/majordomus-cli/src/economics/runner.rs"
  - "apps/majordomus-cli/tests/economics.rs"
  - ".ai/repo/benchmarks/economics/tasks"
  - ".ai/repo/project/intents/the-product-shows-what-it-caught.yaml"
non_scope:
  - "Recording the live runs (needs a provider account and the owner's budget)"
  - "Cross-provider comparison"
  - "A ledger-side false-acceptance signal (reopen or revert after a completed finish); no event records a reopen"
depends_on:
  - "I0401"
serves:
  - "the-product-shows-what-it-caught#acceptance-is-a-benchmark-treatment"
acceptance_criteria:
  - "majordomus economics references still proves every hidden test fails on start and passes on reference"
  - "With a fixture of paired runs the calculator reports the acceptance metric per arm; with none it reports no claim"
  - "majordomus economics check refuses a prose figure for the metric"
  - "Methodology version 2 declares an acceptance pairing of its own: a pair is valid when both sessions ran to their end and the hidden tests ran on both final states; a hidden-test failure is the measured outcome, never a reason to invalidate the pair; the pairing has its own min_valid_pairs"
  - "'Declared done' is defined the same way in both arms as a completion declaration the shared task prompt requires and the runner parses; the finish-contract variant also requires an accepted `majordomus finish --outcome completed`, applied by the runner rather than left to the agent's choice"
  - "The denominator is the arm's sessions in valid acceptance pairs, and the report prints it beside every figure"
  - "The treatment-arm count of finish accepted while hidden tests fail is reported under the name false acceptance"
  - "Criterion acceptance-is-a-benchmark-treatment of the intent names false acceptance, and carries evidence: test with ref apps/majordomus-cli/tests/economics.rs"
validation:
  - "cargo test --test economics"
  - "majordomus economics check"
  - "majordomus generate --check"
evidence_required:
  - "test_acceptance_metric"
created_at: 2026-10-18
updated_at: 2026-10-18
