  - "The reference gate of I3973 and the commit rule of I3976, which call the predicate once it exists"
depends_on: []
acceptance_criteria:
  - "The issue schema declares id pattern `^[A-Z][0-9]{3,}$`, and plan validate fails naming the record on a fixture issue whose id is I12, i1234 or V-603; plan validate passes on this repository and on a fixture with OSCILLA's layout (V603.yaml, U001.yaml, R022.yaml, milestone M048.yaml)"
  - "ui/prs.rs (is_issue_id and issues_named), release/commits.rs (record_candidates and the kind test at :149) and capability/builtin/brief.rs (task_label) call one plan::is_record_id, and plan/delivery.rs named_by passes it the tree it reads"
  - "Library test in ui::prs: issues_named over title 'feat(studio): V603 pinch zoom' against a tree holding V603.yaml yields [V603]; over branch 'chore/plan-done-v603-u001' (OSCILLA #254) against a tree holding V603.yaml and U001.yaml yields [V603, U001], an id inside a component as today; a title naming H264, v3.13.0 or V999 with no such record yields nothing"
  - "Library test in release::commits: references() finds E019, R022 and milestone M048 when their records exist, takes each one's kind from where its record lives and not from its first letter, still finds I4359, still scans the body, and never yields a slug milestone"
  - "Case 2901: a source scan fails when any file other than plan::is_record_id's module and the case itself tests a word against a record-id shape: a Rust starts_with('I') or starts_with('M') id test, an awk, sed or grep pattern such as `[MI][0-9]` or `I[0-9][0-9][0-9][0-9]`, or a JS regular expression such as /I\\d{4}/; the scan covers apps/, bin/, lib/, scripts/, share/libexec/ (where I4370 moves the adapter), share/ui and test/cases/, and it fails on a planted copy of each of the nine patterns this record lists"
  - "`majordomus plan ids --named-by --title <t> --branch <b> --json` returns the ids the title and the branch name, by plan::is_record_id and the scan issues_named uses: title 'feat(studio): V603 pinch zoom' with branch 'chore/plan-done-v603-u001' against a tree holding V603.yaml and U001.yaml returns [V603, U001], and a title naming H264 or V999 with no such record returns []"
  - "scripts/github-sync, scripts/ci/audit-plan-check and case 3220 take their ids from the typed subcommand, and cases 3970, 3220 and 2901 pass"
validation:
