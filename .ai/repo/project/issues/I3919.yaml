id: I3919
milestone: ci-critical-path
title: "The coverage gate finds the end of a test module across multi-line and raw string literals"
slug: the-coverage-scanner-reads-raw-strings
priority: p1
profile: implementation
parallel_safe: false
objective: "scripts/rust-coverage's test_lines, which finds where an inline #[cfg(test)] module ends by matching braces, follows a string literal across lines and reads raw strings (r#...#) with their hashes, so braces inside a multi-line or raw string never close the module early. Case 132 gains a fixture whose test module holds a multi-line raw JSON string and whose uncovered panic branch after it is test code and owes nothing."
why: "On 2026-10-22 train 4's coverage gate called three panic branches of a generate.rs test production code: a multi-line raw JSON fixture at generate.rs:3795-3798 made the scanner close the test module 63 lines early. The fixture was rewritten with json! to land the train; every later test with such a fixture would meet the same gate."
current_state: "test_lines (scripts/rust-coverage:268-318) skips a string only within one line and does not know raw strings."
desired_state: "A test module holding multi-line and raw string literals is test code to its real closing brace; case 132 proves it with a fixture."
scope:
  - "scripts/rust-coverage"
  - "test/cases/132_coverage_differential.sh"
  - ".ai/repo/project/issues/I3919.yaml"
acceptance_criteria:
  - "A multi-line raw string inside a test module leaves the whole module test code"
  - "A raw string with hashes and braces is skipped whole"
  - "Case 132 fails if the scanner closes the module early"
validation:
  - "bin/majordomus plan validate"
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 132_coverage_differential"
evidence_required:
  - "raw_strings_stay_in_test_module"
depends_on: []
serves: []
created_at: 2026-10-22
updated_at: 2026-10-22
