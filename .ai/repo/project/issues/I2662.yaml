id: I2662
milestone: M004
title: "Validation leaves the deployment a runner: a branch's checks never hold the pool a publication or a release record needs"
slug: validation-leaves-the-deployment-a-runner
priority: p1
profile: implementation
parallel_safe: true
objective: "Bound what validation may occupy, so that the two things only the trunk can do, publish and record a release, start when they are ready."
why: "The owner, 2026-10-13: 'investigate what is slow ... solve it systemically, prevent it next time' and 'this must be analysed and solved through .ai/; it must not happen again'. Measured that day: a merge reached production 45 to 61 minutes later, and two landings of the evening were not served an hour after they merged."
current_state: "Measured 2026-10-13: jobs of the pages workflow waited 78 to 876 s for a runner in two finished runs and 20.5 minutes in a third, while several validate runs of branches were queued or running; each validate run starts about nineteen jobs. No rule says how much of the pool validation may take, and a run nobody will read is cancelled only by hand (ADR 0155 clause 7)."
desired_state: "The validate workflow declares how many of its jobs may run at once and cancels a branch's superseded run by itself; a run on the trunk, a deployment and a release run are never cancelled and never wait behind a branch's matrix. The wait of a pages job for a runner is recorded per run and has a declared bound."
scope:
  - ".github/workflows/validate.yml"
  - ".github/workflows/pages.yml"
  - ".ai/repo/ci/gates.yaml"
  - "scripts/ci-plan"
  - "docs/CI.md"
  - ".ai/repo/project/issues/I2662.yaml"
non_scope:
  - "Buying runners"
  - "What the gates check"
acceptance_criteria:
  - "A new push to a branch cancels that branch's unfinished validate run; the trunk's runs are never cancelled"
  - "The number of validate jobs running at once has a declared maximum, and a case holds the workflow to it"
  - "Over a day of landings no pages job waits longer for a runner than the declared bound, read from the recorded timings"
validation:
  - "bin/majordomus plan validate"
  - "scripts/ci/github-check"
  - "scripts/ci-plan --check"
evidence_required:
  - "runner_wait_per_pages_job_over_a_day"
  - "superseded_run_cancelled_case"
created_at: 2026-10-13
updated_at: 2026-10-13
