# Deploys the derived documentation site to GitHub Pages.
#
# The site is a projection of canonical repository files by scripts/generate-site-data
# and Zola; there is no second, hand-maintained content tree. This workflow proves the
# tree it deploys from is healthy, and that the output was built from the sources in
# that same commit.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      # The site says the tool's tests pass and that each command and profile is exercised
      # by them. Deploying from a tree whose tests fail would publish a claim the tree
      # does not support.
      - name: behavioural tests
        run: bash test/run.sh

      # The repository supervises itself with its own tool. A fresh clone has no
      # core.hooksPath, so the shipped hooks are inactive and doctor would correctly
      # report the declared enforcement as unwired — this is the once-per-clone step
      # CONTRIBUTING.md documents for contributors.
      - name: self-supervision
        run: |
          git config core.hooksPath .githooks
          bin/majordomus doctor

      - name: canonical data
        run: scripts/generate-site-data --check

      - name: build the site
        run: scripts/site-build

      # Metadata and landmarks on every route, no unrendered template delimiter, every
      # internal link resolving, the deployment path prefix on every reference, no remote
      # asset, no credential, and the generated data still matching its canonical sources.
      - name: check the site
        run: scripts/site-check

      - name: manifest
        run: cat site/data/generated/source.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
