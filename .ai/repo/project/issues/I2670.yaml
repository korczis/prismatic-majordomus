    command: "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib mesh::build_cache; cargo test --doc mesh::build_cache; cargo clippy --lib -- -D warnings"
    result: "on 81ef931a3e1 plus this change: 148 mesh::build_cache lib tests ok, 38 doctests ok, clippy clean. Criteria 1-3 (deterministic selection for any ordering, stale/unhealthy passed over with the rule, no offers selects none and says so) were already ok in master validate 40573560939 (rust (2) 122655219231). Criterion 4 is new here: an endpoint carrying userinfo, a query, a fragment or a credential-shaped path is refused where an Offer is read, built, validated or read from a node file, and the error names the offer and the place but never the secret (tests an_endpoint_with_user_information_is_refused_and_the_refusal_keeps_the_secret, an_endpoint_with_a_query_or_a_fragment_is_refused_without_echoing_it, a_node_file_whose_endpoint_carries_a_credential_is_refused_by_whose_it_is); a plain scheme://host:port endpoint round-trips. On master the same userinfo endpoint was read as an offer (reproduced, then fixed)."
