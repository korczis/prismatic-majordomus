id: I2732
milestone: capability-graph
title: "The MCP reference repeats no registry entry: no hand-written document lists tools"
slug: the-mcp-reference-repeats-no-registry
priority: p2
profile: implementation
parallel_safe: true
depends_on: []
objective: "Remove the second inventory of MCP tools from docs/MCP.md and hold every hand-written document under docs/ to naming tools in prose, so the next composed module cannot be missing from a list nobody regenerates."
why: "On 2026-10-15 the 0.27.0 integration top (#1183) went red on case 532 while the new capability worktree.uncommitted reached the registry and every generated page; tracing it showed that docs/MCP.md's five hand-written tool tables (29 rows: tool, capability, arguments, answers) did not carry it. Those tables repeated the registry, which CLAUDE.md and ADR 0004 call a design defect, and the generated reference already exists: docs/generated/capabilities.md and the site's /registry/mcp/, which case 532 holds to the registry."
current_state: "docs/MCP.md carries hand-written tool tables under Peers, Episodes, Tools and Sessions and continuity; nothing checks them against the registry, and majordomus_worktree_uncommitted is absent from them."
desired_state: "docs/MCP.md names each tool in prose where it explains why it exists, and links the derived reference for arguments and answers (docs/generated/capabilities.md, /registry/mcp/, majordomus_capability at runtime; the local-only session tools through majordomus capabilities describe). Case 3062 refuses a table row whose first cell is a majordomus_ tool in any tracked Markdown document under docs/ outside docs/generated/, after proving its pattern on a planted row and a planted non-row."
scope:
  - docs/MCP.md
  - test/cases/3062_the_mcp_reference_repeats_no_registry_entry.sh
  - .ai/repo/project/issues/I2732.yaml
non_scope:
  - "Generating a tool table into a region of docs/MCP.md, which would need a region projection in majordomus generate"
  - "The site's /registry/mcp/ page, which is already derived and held by case 532"
acceptance_criteria:
  - "No tracked document under docs/ outside docs/generated/ has a table row whose first cell is a backticked majordomus_ tool name"
  - "Case 3062 fails on the tables docs/MCP.md carried before this change and passes after it"
validation:
