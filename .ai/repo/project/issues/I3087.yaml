  - ".ai/repo/rules/vendor/majordomus/rules/completion-gates.v1.md"
  - ".ai/repo/project/milestones/architecture-is-enforced.yaml"
non_scope:
  - "Changing ADR 0037, which is accepted and is the measurement the others are brought to"
