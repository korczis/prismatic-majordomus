      issue: I2075
      because: "Adopted as written: platform is command:, capability:, rule:majordomus.*, the vendored rules directory, or the tool's share/ only when it is inside the repository; case 982 runs in a fresh init with a share/ of its own."
  - id: sequencing-against-i1984
    class: regression_risk
    subject: a-session-leaves-what-it-observed
    finding: "Recurrence counted on tracked candidate files breaks if I1984 moves trunk candidates under .ai/local."
