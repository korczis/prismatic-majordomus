id: I4155
milestone: ci-critical-path
title: The follower's shared board and page caches are keyed by the repository they read
slug: the-follow-caches-are-keyed-by-their-repository
priority: p2
profile: implementation
parallel_safe: true
serves: []
objective: "The process-wide BOARD and PAGE caches in apps/majordomus-cli/src/http/follow.rs carry the Context they were read for in their key, so two Contexts in one process never answer each other's snapshot or latest cursor."
why: "Found while diagnosing I4154: the keys are \"repository\" and \"latest|<sources>|<reader>|\", which do not identify the Context. Tests in one process run in parallel, and one can be served another repository's snapshot or cursor when it was read at the same or a higher generation within 30 s. A production server serves one Context today, so this is a test-isolation hazard first."
current_state: "BOARD and PAGE are statics keyed without the Context's identity."
desired_state: "Each key names the Context (its repository root or identity), and a case or unit test reads two Contexts in one process and gets each its own answer."
scope:
  - apps/majordomus-cli/src/http/follow.rs
  - .ai/repo/project/issues/I4155.yaml
depends_on: [I4154]
acceptance_criteria:
  - "Two Contexts read through the shared caches in one process each get their own snapshot and cursor"
validation:
  - cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib http::follow::tests
evidence_required:
  - suite
risk: "A key that is too narrow defeats the share the caches exist for; key by the Context, not by the caller."
created_at: 2026-10-23
updated_at: 2026-10-23
