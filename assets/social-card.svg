<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Prismatic Majordomus — a lightweight supervisory control layer for AI-assisted work">
  <title>Prismatic Majordomus</title>
  <rect width="1280" height="640" fill="#0f172a"/>
  <!-- faint beam grid -->
  <g stroke="#1e293b" stroke-width="1">
    <path d="M0 160h1280M0 320h1280M0 480h1280"/>
  </g>
  <!-- mark, scaled x4 -->
  <g transform="translate(120 192) scale(4)" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 32h16"/>
    <path d="M32 12 46 52H18Z"/>
    <path d="M44 24l16-8" stroke="#38bdf8"/>
    <path d="M46 32h14" stroke="#a78bfa"/>
    <path d="M44 40l16 8" stroke="#34d399"/>
  </g>
  <g transform="translate(120 192) scale(4)">
    <circle cx="60" cy="16" r="3" fill="#38bdf8"/>
    <circle cx="60" cy="32" r="3" fill="#a78bfa"/>
    <circle cx="60" cy="48" r="3" fill="#34d399"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e2e8f0">
    <text x="440" y="250" font-size="28" letter-spacing="8" fill="#94a3b8">PRISMATIC</text>
    <text x="440" y="340" font-size="96" font-weight="600" letter-spacing="-2">Majordomus</text>
    <text x="440" y="410" font-size="30" fill="#cbd5e1">A lightweight supervisory control layer</text>
    <text x="440" y="452" font-size="30" fill="#cbd5e1">for AI-assisted work.</text>
    <text x="440" y="540" font-size="22" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">majordomus start · check · handover · finish</text>
  </g>
</svg>
