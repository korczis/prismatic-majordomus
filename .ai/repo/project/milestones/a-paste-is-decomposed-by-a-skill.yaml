acceptance_criteria:
  - "The three criteria the milestone adds to a-brief-is-reconciled-into-the-plan (a-paste-is-decomposed-not-stored-verbatim, a-refused-paste-leads-to-the-skill, a-decomposed-paste-passes-the-plan-checks) are each served by at least one issue here, and majordomus intent coverage shows them served"
  - "majordomus skills verify names decompose-a-brief as an active skill that is not an orphan"
  - "A two-paragraph statement, a statement opening with a Markdown heading and a one-paragraph statement over the ADR 0144 bound, each given to intents.propose over the command line, MCP and HTTP, write no file under .ai/repo/project/intents, and a one-paragraph statement within the bound is written as before"
  - "The generated /intent alias and all 58 generated .claude/skills/mj-*/SKILL.md files carry the follow-the-named-skill rule, and case 3220 shows the Cockpit link for a refused paste"
  - "The fixture decomposition in apps/majordomus-cli/tests/intent_plan.rs passes plan validate and intent validate with zero failures"
  - "No issue here started before the planning branch docs/the-chatgpt-project-is-promoted was on master"
validation:
  - "majordomus plan validate"
evidence_required: []
risks:
  - "The two hand lists (tests/skills.rs:6, case 391:3) are also edited by the unpushed branch feature/a-workspace-is-promoted-by-a-skill, which adds promote-a-workspace. Whichever lands second resolves a one-line conflict by keeping both ids"
  - "intents.rs and ADR 0144 are also in I3286's scope. That later structured-delta path must keep the paste guard"
  - "A paste that holds a conversation, an AI assistant's answer or personal data must not reach campaigns/ without the person's ruling. The skill's step 2 decides that, and a worker who skips it breaks project.never-store-transcripts"
  - "Classifying a paste by structure and length refuses some legitimate statements. A person can still write such a record by hand, and no override field is added"
  - "A copy of the paste relayed through a model may differ from the received bytes; the skill reports a digest mismatch instead of hiding it"
  - "Case 3220 is a browser case that runs only in the ui job; a flaky new step there blocks every landing that runs it"
  - "The derive may touch generated files beyond those listed. Each issue's scope must name every projection before finish"
