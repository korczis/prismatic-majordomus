id: a-paste-is-decomposed-by-a-skill
title: "A pasted brief is decomposed into the plan by a skill, and never kept verbatim as an intent statement"
slug: a-paste-is-decomposed-by-a-skill
order: 210
priority: p1
problem: "intents.propose keeps any statement verbatim: apps/majordomus-cli/src/intent.rs:2327-2366 trims it, takes the first line as the title and writes the whole text as the statement. The generated /intent alias (apps/majordomus-cli/src/editors/claude.rs:79-94) and the generic text of every model-invocable domain skill (claude.rs:179, projected into .claude/skills/mj-*/SKILL.md, for example mj-intents/SKILL.md:26) forbid trying again another way after a refusal. Three pastes became untracked intent records in the primary checkout (wc -c: 50814, 16314 and 9437 bytes); none has a criterion, milestone or issue. The longest statement line of a tracked intent on master 9904000d2df measures 846 bytes (grep '^statement:' | wc -c). No skill under .ai/repo/skills decomposes a paste. On 2026-10-19 the owner ordered that a pasted text be decomposed by an agent following a skill."
outcome: "A multi-paragraph, Markdown or over-length paste given to intents.propose on any transport writes nothing and answers invalid_input, naming the skill decompose-a-brief and the digest of the paste's canonical text. The /intent alias, the domain skills, the Cockpit runner and the intent workspace lead to that skill instead of stopping at the refusal. The skill keeps the paste as a campaign whose digest equals the refused one, maps it to the existing plan, drafts only what is new, has the draft critiqued, derives and validates it, and offers its first wave on the mesh without claiming it. A test holds a decomposition of the skill's output shape valid under plan validate and intent validate."
current_state: "PRECONDITION: the host intent a-brief-is-reconciled-into-the-plan, its critique and the issues and ADRs the skill names (I3168, I3169, I3251, I3254, I3273, ADR 0211, milestone an-outcome-becomes-a-reviewed-plan) are tracked only on docs/the-chatgpt-project-is-promoted, which is ahead of master 9904000d2df and has no remote head. No issue of this milestone starts until that branch, with these records and the critique reviewed against the three new criteria, is on master; each issue's acceptance checks this through intent preflight from a branch of master. Skills on master: assess-before-deleting, deploy-site, evolve, implement, pack-for-chatgpt, pack-for-review, repo-review, report-verification-state; the hand lists are apps/majordomus-cli/tests/skills.rs:6 and test/cases/391_skills_are_proven_capabilities.sh:3. ProposeError (intent.rs:2251) has Invalid, Exists and Write; intents.rs:460-462 maps Invalid to invalid_input. share/cockpit/runner.js:126-161 and share/cockpit/executions.js:85-97 render a refusal as text with no link, and no case loads runner.js except the browser case 3220 that walks the Cockpit. The intent-intake milestone of the same intent depends on an-outcome-becomes-a-reviewed-plan, which is not DONE, and plan.rs:1104-1131 marks every issue of a gated milestone BLOCKED."
desired_state: "Every paste follows one path whichever surface it arrives by: refused without a write, kept as a campaign in one canonical byte form, decomposed by the skill under a critique, derived and validated, and offered on the mesh. The skill is a proven capability under skills verify, and its output contract is held by a test."
