id: the-layer-evolves-when-it-is-due
title: "The repository decides when its layer should evolve, and a session carries it out"
statement: "At each episode boundary the repository derives once, at the episode's close and with no model, whether evolving its layer is due (skip, defer or run) and why, and the next session is told, with a directive to run the evolve skill when it is run; friction from refused tasks becomes a candidate only after it has been measured over every checkout's ledger; what an evolve run changes yields no candidate about itself; what evolution changed is measured; a curated note whose cited source moved since its last review is flagged for review; and promotion stays a person's act. It extends intent a-session-leaves-what-it-observed, whose criteria stand unchanged."
invariants:
  - "Promotion, routing into the plan and rejection remain acts; the readiness verdict proposes and never promotes (ADR 0091)"
  - "Derivation needs no model, network or provider"
  - "At most one evolve run acts on a scope at a time: the evolve skill holds an exclusive mesh claim on it, so concurrent 'run' verdicts in several checkouts lead to one run"
non_goals:
  - "Promoting or merging a lesson without a person"
  - "Deriving friction from task.refused before the measurement of I3162 is recorded, or from task.gate at all"
  - "Changing the criteria of a-session-leaves-what-it-observed"
  - "Lowering devcontext selector confidence for a stale note"
milestones:
  - "knowledge-acts-on-what-it-learns"
satisfaction:
  - id: evolve-readiness-is-derived
    criterion: "Every closed episode records exactly one evolve readiness verdict (skip, defer, run), written at its close and never by knowledge derive, with the factors behind it: a live mesh claim on the evolve scope or a landing or release claim defers, no evidence newer than the last evolve.run skips, and an episode that evolved skips; the next SessionStart briefing and brief.session name it, and on run the briefing directs the session to run the evolve skill (planned proof: case_evolve_readiness_is_derived (I3163 writes it))"
    evidence: command
    ref: "majordomus intent explain the-layer-evolves-when-it-is-due"
  - id: evolution-does-not-feed-itself
    criterion: "An episode holding an evolve.run contributes none of its task.finished or decision.recorded lines as sources and none of its commits as references to any candidate, while its observations still count; and a rejected subject is proposed again only beside a later observation (planned proof: case_evolution_does_not_feed_itself (I3164 writes it))"
    evidence: command
    ref: "majordomus intent explain the-layer-evolves-when-it-is-due"
  - id: friction-is-measured-first
    criterion: "Which task.refused lines are friction is a recorded measurement over every checkout's ledger with its denominator, and task.gate's count and the reason it is rare are reported; only then does a refused rule id seen in a declared number of the closing checkout's episodes become one candidate citing every episode by references that resolve in any checkout (planned proof: case_friction_becomes_a_candidate (I3162 writes it))"
    evidence: command
    ref: "majordomus intent explain the-layer-evolves-when-it-is-due"
  - id: evolution-outcomes-are-measured
    criterion: "The recurrence of a subject after its lesson landed is a reading with its window and denominator on CLI, HTTP, MCP and /ui/knowledge, and no data reads unavailable (planned proof: test_evolution_outcomes_measured (I3165 writes it))"
    evidence: command
    ref: "majordomus intent explain the-layer-evolves-when-it-is-due"
  - id: a-moved-source-is-flagged
    criterion: "A curated note whose cited file differs from the blob recorded at its last review is reported needs-review where it is served (knowledge validate as a warning, /ui/knowledge, the briefing's knowledge pointers), a note without recorded blobs reads unanchored, a recorded re-review clears the flag, and the compiled context reports needs-review with its reason in its own field (planned proof: case_note_source_moved (I3166 writes it))"
    evidence: command
    ref: "majordomus intent explain the-layer-evolves-when-it-is-due"
