non_scope:
  - "Running any experiment"
  - "Typing a status, a verdict or a figure"
  - "Scanning general prose for value words"
  - "A homepage section; linking the scorecard from the homepage proof band is an owner question"
acceptance_criteria:
  - "Every scorecard surface returns the same six rows from one calculator, and a failed or inconclusive row has the shape of a passed one"
  - "A test below its registered sample reads running with no verdict word"
  - "economics check refuses a guaranteed claim settled by a test that has not passed; homepage-check refuses each declared value word while no claim permits it"
  - "majordomus economics check passes on master's tree"
validation:
  - "majordomus plan validate"
evidence_required: []
risks:
  - "Until the experiment milestones land, most rows read not_run; that is the honest state and the surfaces word it plainly"
  - "claims.rs is also in I3297's scope and docs/CLAIMS.yaml in I3117's; whichever lands second merges onto the first"
  - "A new capability regenerates many projections; the worker runs majordomus generate first and widens scope at start if it writes more"
