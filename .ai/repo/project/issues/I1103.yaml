id: I1103
milestone: repository-knowledge
title: Phase 2: the Cockpit page table is derived from the router
slug: tightening-cockpit-document
priority: p1
profile: implementation
parallel_safe: false
objective: "docs/COCKPIT.md lists every route with the capability behind it by hand; derive the table from the router's own declarations."
