id: every-surface-follows-what-changed
title: "Every surface follows what changed in the repository by push, and a surface that does not says so"
slug: every-surface-follows-what-changed
order: 183
priority: p1
problem: "docs/MONITOR.md says executions are not a monitor source yet; on master /events carries executions only, /ui refreshes on a 60 s timer (share/ui/ui.js), and the Observatory asks /api/v1/observatory/events with a cursor on an interval (share/ui/observatory.js). Each surface words its liveness differently, and an intent proposed from a terminal reaches an open /ui/idd only on that timer. Proposed in ADR 0216 (Every live surface follows one channel with named follow streams, and nothing polls where a stream exists) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c294#3, chatgpt-majordomus:c294#7, chatgpt-majordomus:c260#8, chatgpt-majordomus:c208#73, chatgpt-majordomus:c260#0, chatgpt-majordomus:c232#6."
outcome: "Executions are a monitor source; the Observatory is told over /events; a write by any client reaches the workspace; every live surface states its transport in ADR 0158's words; a follower converges after loss; a kiosk keeps following for days."
current_state: "Verified on master 707a04c7ce8: apps/majordomus-cli/src/monitor has the executor, github and mesh sources; apps/majordomus-cli/src/http/events.rs serves executions; share/ui/observatory.js polls by cursor and words REPLAY, SNAPSHOT, RESYNCED, LIVE and STALE for itself. In flight, not on master: PR #1178 (observatory-stream.js) and 5a's follow channel I2980-I2983."
desired_state: "Each criterion of every-surface-follows-what-changed is carried by one issue here and proven by the case its issue's evidence_required names, on the one /events channel."
