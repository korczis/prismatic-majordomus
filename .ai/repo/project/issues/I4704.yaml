id: I4704
milestone: truthful-plan-surfaces
title: "plan.findings derives every open finding from the layer: what is blocked, left out of scope with no follow-up, handed to another repository, not run, partial or drifting, each with its locator"
slug: open-findings-are-derived-from-the-layer
priority: p1
profile: implementation
parallel_safe: true
objective: "A read-only capability plan.findings (CLI `majordomus plan findings [--json] [--live]`, MCP majordomus_plan_findings, GET /api/v1/plan/findings) answers one list of findings computed from the layer and written by nobody. Each finding has `kind`, `text`, `path`, `line`, `record`, `follow_up` (the open issue ids that take it over, empty when none does) and `label`. The label is OBSERVED when a record states the open status itself, and DERIVED when the answer computed it from several records. Built-in kinds: `blocked` (an open issue with a dependency that is not done, naming the blocker), `out-of-scope` (a non_scope entry of a DONE issue that no open issue cites), `not-run` and `partial` (an evidence result or a task outcome carrying a status the policy declares open, such as NOT RUN, PARTIAL or FAIL), `outbound` (an intent, critique or proposal addressed to another repository with no recorded answer), and `drift` (plan.drift's non-advisory findings, read only with `--live`, since they depend on the moment). A repository adds its own vocabulary under a policy key `findings:` (open statuses, Markdown table columns, front-matter fields and an in-document marker). The output carries the same fields as a repository-local generator that an adopter already runs, so that generator can become a thin projection of this capability. A derived page under docs/ is regenerated by the existing derive step and checked fresh by it."
why: "Observed on 2026-11-22 in an adopter repository. An agent asked `what is missing?` answered with a hand-written list. Every item on it was derivable from records the layer already held: non_scope entries of finished issues with no follow-up issue, BLOCKED issues and their blockers, proposals sent to other repositories with no answer, NOT RUN and PARTIAL results recorded as evidence, and drift findings. A list written by hand goes stale the moment it is written, cites nothing, and is rebuilt from scratch by the next agent asked. A peer session in that repository is building a repository-local generator for the same answer. Majordomus should own the derivation, so that every adopter gets it from the layer it already keeps."
current_state: "Measured at origin/master 636acc8c845 on 2026-11-22. The pieces exist apart: `majordomus plan blocked` lists issues waiting on a dependency, plan.drift classifies stamps against delivery, intents.coverage and convergence.report judge intents, and evidence records carry a free-text result. No capability joins them. Nothing reads a non_scope entry as a finding that should have a follow-up, or treats an evidence result such as NOT RUN as an open status. The generated capability table (docs/generated/capabilities.md) has no findings capability, and the policy schema has no `findings` key."
desired_state: "`majordomus plan findings` answers `what is missing` for any supervised repository, from its records and nothing else, with every finding pointing at the line that states it. The same answer reaches the command line, MCP, HTTP and a derived page."
scope:
  - "apps/majordomus-cli/src/plan/findings.rs"
  - "apps/majordomus-cli/src/plan.rs"
  - "apps/majordomus-cli/src/capability/builtin/plan.rs"
  - "apps/majordomus-cli/tests/plan_findings.rs"
  - "share/skeleton/policy.yaml"
  - "share/schemas/majordomus/policy/policy.v1.schema.json"
  - "share/allow/policy.txt"
  - "docs/PLANNING.md"
  - "docs/CLI.md"
  - "test/cases/4704_open_findings_are_derived_from_the_layer.sh"
  - ".ai/repo/project/issues/I4704.yaml"
  - "site/content/plan/I4704.md"
non_scope:
  - "Opening an issue for a finding. The answer names the missing follow-up and a person or the plan's own commands create it"
  - "Judging whether a finding is true. The answer reports what the records state"
  - "Reading untracked or .ai/local/ state"
  - "Changing an adopter's own generator. It may adopt the capability as a change of its own"
depends_on: []
acceptance_criteria:
  - "Case 4704: a fixture layer with a DONE issue whose non_scope names no open issue, a BLOCKED issue, an evidence result `NOT RUN`, and an intent proposed to another repository yields exactly one finding of each kind, each with its path and line. The out-of-scope finding has an empty follow_up"
  - "Adding an open issue that cites the non_scope entry fills that finding's follow_up and leaves the rest unchanged"
  - "A status declared under policy `findings.statuses` is picked up from a Markdown table row and from a front-matter field"
  - "`--live` adds plan.drift's non-advisory findings. Without it, the answer is a function of the commit"
  - "The CLI, MCP and HTTP answers are the same JSON, from one capability"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test plan_findings"
  - "MJ_TEST_JOBS=2 bash test/run.sh 4704_open_findings_are_derived_from_the_layer"
  - "bin/majordomus plan validate"
evidence_required:
  - "open_findings_are_derived_from_the_layer"
serves: []
created_at: 2026-11-22
