id: I3903
milestone: the-runtime-supervises-itself
title: "A stuck or superseded CI run is found and stopped by a declared bound, by a typed capability on a schedule"
slug: a-stuck-run-is-stopped-by-its-bound
priority: p0
profile: implementation
parallel_safe: true
objective: "A typed forge capability beside apps/majordomus-cli/src/integration/forge.rs lists the repository's in-flight GitHub Actions runs. It cancels three kinds: a run queued longer than its declared bound, a run in progress past its workflow's bound, and a pull-request run whose head is no longer its branch's head. Each cancellation is recorded with its reason in the integration audit trail. It runs on a schedule, the way queue.yml runs `majordomus prs`, and absorbs the cancel logic scripts/ci/release-path carries in shell."
why: "On 2026-10-22 the Actions queue was saturated. Master's validate and pages waited behind runs of heads that had already moved, and a person found and cancelled them by hand. Nothing in the repository cancels a stuck or superseded run: validate's concurrency group never cancels in progress, a failed run cancels only itself (I2664), and Rust has no run cancellation at all. The owner, in Czech: stuck builds must be watched, timed out and killed automatically, because they burn compute minutes and delivery time, and this must be in Majordomus's DNA."
current_state: "Stuck and superseded runs hold runners until GitHub's six-hour limit or a person cancels them."
desired_state: "Every in-flight run is judged against a declared bound on a schedule, and the ones past it, or superseded, are cancelled with a recorded reason. Master, release, tag and deploy runs are never cancelled for being superseded."
scope:
  - "apps/majordomus-cli/src/integration"
  - "apps/majordomus-cli/src/capability/builtin"
  - ".ai/repo/ci"
  - ".github/workflows"
  - "scripts/ci/release-path"
  - "docs/CI.md"
  - "docs/INTEGRATION.md"
  - "test/cases/3903_the_supervisor_is_wired_to_survive_a_burst.sh"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/src/commands/prs.rs"
  - "SECURITY.md"
non_scope:
  - "Hung Pages builds: I3902."
depends_on: ["I3902"]
acceptance_criteria:
  - "A queued or in-progress run past its declared bound is cancelled once, with its reason recorded"
  - "A pull-request run whose head moved is cancelled; a run of master, a release, a tag or a deploy never is for that reason"
  - "A dry run decides without acting, and the decision is the same"
  - "The running bound holds each job in progress from that job's start, never the run: replays of 40764355688 at 00:50Z, 40576851731 at 01:10Z, 40680986818 at 15:58Z, release 38013111243's attempt 2 at 07:20Z and 40747313397's attempt 3 at 01:11Z give no cancel; jobs a re-run carries over never count"
  - "The queue bound runs from the later of created_at and run_started_at, so a re-run of a run created six hours earlier and queued two minutes is not cancelled"
  - "A waiting first-attempt pull-request run of a commit that has a run of the same branch in flight, or one that passed within 120 s of it, is cancelled as a duplicate (a replay of 40713048283 by 15:10Z); a re-run, a reopen, a head back at a judged sha, a judged failure and a train sharing a member's sha are not, and ci:full holds it"
  - "An integration/* run is never cancelled through queued_past_bound or running_past_bound, and a queued run of the trunk, a tag, the schedule, a dispatch or a release is held"
  - "supervise.yml runs on lundra with a hosted fallback, from a prebuilt executable, bounded at five minutes, with cancel-in-progress false, so five validate requests within 60 s let an apply complete"
  - "A newest supervise success older than 30 minutes is reported as supervise_stale, and queue.yml fails on it"
validation:
  - "cargo test --lib integration"
  - "bash test/run.sh 3903_the_supervisor_is_wired_to_survive_a_burst 350_the_queue_measures_itself"
evidence_required:
  - "supervise_unit_tests"
serves:
  - "nothing-in-the-mesh-waits-on-something-dead#states-are-classified"
created_at: 2026-10-22
updated_at: 2026-10-29
