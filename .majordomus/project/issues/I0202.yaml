id: I0202
milestone: runtime-adapters
title: Resolve a task's effective limits and print them as data
slug: resolve-effective-limits
priority: p1
profile: implementation
parallel_safe: false
objective: "Add a read-only command that resolves the limits the active task's profile derives and prints them, in text and as JSON, so that a worker, a wrapper or a test can read the same numbers the enforcement will use."
why: "A limit that cannot be read before it bites is a limit nobody can test, and a limit computed twice is a limit that will disagree with itself. One resolver, one output, consumed by everything downstream."
current_state: "The mapping declares what a limit is. Nothing computes the limits for a given task, and the task record carries no way to ask."
desired_state: "Running one command inside a task prints every limit the profile derives and the axis each came from. With no active task it resolves the default profile and says so."
scope:
  - lib
  - bin
non_scope:
  - Enforcing any limit
  - Caching the resolved values anywhere; resolution is cheap and stays derived
depends_on:
  - I0201
acceptance_criteria:
  - The command prints every declared limit, its value, and the profile axis it was derived from
  - JSON output carries the same set the text output does
  - With no active task the default profile is resolved and named as the default
  - The resolver is the only place a limit value is computed
validation:
  - bash test/run.sh
evidence_required:
  - suite
risk: "A second computation of a limit anywhere else silently forks the contract; the case has to compare the enforced value against this command's output rather than against a constant."
created_at: 2026-09-04
updated_at: 2026-09-04
