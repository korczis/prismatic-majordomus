non_scope:
  - "The executor refreshing a pull request onto another one's head by itself, and the pipeline depth in .ai/repo/ci/queue.yaml: a later issue, named in ADR 0129."
  - "The run master's own push starts after every merge: 521 job-minutes for a tree a pull request's run judged. Not decided here."
  - "Which pull requests are put on a train and in what order: the executor's plan."
acceptance_criteria:
  - "`relation_to_master` answers `carries_master` for a head built on another head once that one landed as a merge commit, and `behind` for the same head once master holds one more change, authored or derived, or one more commit that is not a merge; proven on a real repository"
  - "A `carries_master` head with its required checks passed is `ready`, passes every gate and gives the reasons `carries_master`, `required_checks_passed`"
  - "`prs drain` merges two stacked pull requests in two steps with no refresh between, through the command line against a scripted forge, and the master it leaves has the second head's tree"
  - "A relation cached under another vocabulary is asked of git again"
  - "`prs explain` names every relation by its own word; before this it printed `unknown` for every relation but `behind` and `conflicting`"
  - "docs/INTEGRATION.md names the relation, the gate and the train, and ADR 0129 is proposed"
