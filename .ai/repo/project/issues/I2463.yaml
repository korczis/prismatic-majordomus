depends_on: []
acceptance_criteria:
  - "Trains are derived by pure, unit-tested functions from the recorded observation, the queue and the local refs/prep/<n> refs; nothing reaches the network or writes a ref"
  - "integration.trains is declared once with capability! and projected to the command line, HTTP and MCP by majordomus generate"
  - "/cockpit/trains draws the trains interactively and renders the same facts as a table without JavaScript; colours come from the design tokens"
  - "test/cases/1072_the_train_is_seen.sh passes with the change and fails against master without it"
validation:
