# The one validation workflow. It is an adapter over repository-owned tooling, never a
# second implementation of the gates: `scripts/ci-plan` decides from the CI model in
# .ai/repo/ci/gates.yaml which gates a change can affect, every job runs the same script a
# person runs, and `scripts/ci/verdict` turns the plan and the jobs' results into the one
# status a branch rule can require. Docs: docs/CI.md.
#
# The shape: plan → structure (always) → the selected gates, in parallel → ci (the verdict).
# Publication is not here: .github/workflows/pages.yml is the latency-sensitive path that puts
# a master commit on GitHub Pages, and it runs beside this workflow rather than after it. This
# one decides whether a change may merge; that one decides what the public site shows. The
# split is docs/GITHUB_PAGES_PERFORMANCE.md; the model is .ai/repo/ci/pages.yaml.
name: validate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # the full plan once a week, so a gate nothing selected for a while still has a run
    - cron: '17 4 * * 1'

permissions:
  contents: read

# A newer commit of the same pull request supersedes the runs of the older ones. Every
# other run (master, the schedule, a dispatch) is its own group: it neither waits for nor
# cancels another, so a master run held up by a scarce runner does not hold up the next
# commit's evidence; only deployments queue, in the pages job's own group.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------ plan
  # What this change can affect, from the model: a pull request is planned from its diff
  # against the base it will merge into (HEAD^1 of the merge commit); everything else, and a
  # pull request labelled ci:full, runs the full plan. The plan is the artifact ci-plan.
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      selected: ${{ steps.plan.outputs.selected }}
      shell_suite: ${{ steps.plan.outputs.shell_suite }}
      rust_check: ${{ steps.plan.outputs.rust_check }}
      rust_integration: ${{ steps.plan.outputs.rust_integration }}
      projection_closure: ${{ steps.plan.outputs.projection_closure }}
      web_topology: ${{ steps.plan.outputs.web_topology }}
      rust_coverage: ${{ steps.plan.outputs.rust_coverage }}
      rust_bench: ${{ steps.plan.outputs.rust_bench }}
      command_graph: ${{ steps.plan.outputs.command_graph }}
      cockpit_assets: ${{ steps.plan.outputs.cockpit_assets }}
      cockpit_probe: ${{ steps.plan.outputs.cockpit_probe }}
      site_build: ${{ steps.plan.outputs.site_build }}
      site_probe: ${{ steps.plan.outputs.site_probe }}
      ui_audit: ${{ steps.plan.outputs.ui_audit }}
      macos: ${{ steps.plan.outputs.macos }}
      installer_live: ${{ steps.plan.outputs.installer_live }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case "$EVENT" in
            pull_request)
              case ",$LABELS," in
                *,ci:full,*) scripts/ci-plan --full "pull request labelled ci:full" > plan.json ;;
                *) scripts/ci-plan --base HEAD^1 --head HEAD > plan.json ;;
              esac ;;
            *) scripts/ci-plan --full "$EVENT on $REF" > plan.json ;;
          esac
          jq -r '"mode=\(.mode)", "selected=\(.selected | join(" "))", (.gates[] | "\(.id | gsub("-"; "_"))=\(.selected)")' plan.json >> "$GITHUB_OUTPUT"
          {
            echo "## plan"; echo
            jq -r '"**\(.mode)** — \(.reason). \(.changed | length) changed path(s), base `\(.base)`, head `\(.head)`."' plan.json; echo
            echo '| gate | job | planned | reason |'; echo '|---|---|---|---|'
            jq -r '.gates[] | "| \(.id) | \(.job) | \(if .selected then "run" else "skip" end) | \(.reason) |"' plan.json
            echo
            jq -r 'if (.classes | length) > 0 then "Classes: " + (.classes | map("\(.id) (\(.paths | length))") | join(", ")) else "" end' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: plan.json
          retention-days: 14

  # ------------------------------------------------------------------ structure
  # The cheap, deterministic gates every plan runs: the shell syntax and shellcheck, then
  # doctor, watch, the context documents, the continuity subsystem, the project model, the
  # offline GitHub projection and the derived site data, through scripts/ci/core-check.
  structure:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck >/dev/null
      - name: pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin actionlint
          actionlint -version
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      # Every gate the model assigns to this job, in its order, as the plan selected them:
      # shell-lint, ui-check and core-check on every plan, and the structural gates a change
      # needs — site-basepath, rust-command, worktree-topology, providers-data. Dispatched
      # from the plan rather than listed here, so a gate declared in the model cannot be
      # reported as run and never executed, which is what happened to four of them.
      - name: the structure gates of the plan
        run: MJ_CI_TIMINGS=timings.tsv scripts/ci/run-plan --plan plan.json --job structure
      - if: always()
        run: scripts/ci/summary --job structure --timings timings.tsv
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-structure
          path: timings.tsv
          retention-days: 14

  # ------------------------------------------------------------------ suite
  # Every behavioural case (test/run.sh), four at a time, in a disposable repository each.
  # The Rust cases drive the executable built here once (MAJORDOMUS_BIN); the two that are
  # cargo's own gates (the crate's HTTP and projection suites, the doc examples, the
  # benchmark build) keep cargo, warm from the cache. Zola and the site dependencies are
  # present so the site cases run rather than skip.
  suite:
    needs: plan
    if: needs.plan.outputs.shell_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      # the whole history: a case that clones this checkout into a fixture and pushes
      # (96_site_deploy does, to a bare repository of its own) cannot push a shallow clone
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: site
        uses: ./.github/actions/setup-site
      - id: rust
        uses: ./.github/actions/setup-rust
      - name: the executable, built once for every case
        run: |
          RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          echo "MAJORDOMUS_BIN=$PWD/apps/majordomus-cli/target/debug/majordomus" >> "$GITHUB_ENV"
      # The one canonical validation surface. Every behavioural, negative and integration
      # case runs here; nothing is skipped, and no failure is swallowed. test/run.sh exits
      # non-zero when any case fails, and this step has no `|| true` to hide it.
      - name: behavioural tests
        env:
          MJ_TEST_JOBS: 4
          MJ_TEST_REPORT: suite.tsv
        run: bash test/run.sh
      - if: always()
        run: scripts/ci/summary --job suite --report suite.tsv --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}" --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-suite
          path: suite.tsv
          retention-days: 14

  # ------------------------------------------------------------------ rust
  # The Rust executable through scripts/rust-check: every gate (--ci: format, lints as
  # errors, the suites, rustdoc, the benchmarks building, the registry checks, the benchmark
  # check against this platform's baseline) when the crate can be affected, or the registry
  # checks alone (--integration) when only the data it reads changed. Either way the built
  # executable is the artifact majordomus-cli-<target> for a later job or a later phase.
  rust:
    needs: plan
    if: needs.plan.outputs.rust_check == 'true' || needs.plan.outputs.rust_integration == 'true' || needs.plan.outputs.projection_closure == 'true' || needs.plan.outputs.web_topology == 'true' || needs.plan.outputs.command_graph == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: rust-check
        if: needs.plan.outputs.rust_check == 'true' || needs.plan.outputs.rust_integration == 'true'
        env:
          MODE: ${{ needs.plan.outputs.rust_check == 'true' && '--ci' || '--integration' }}
        run: MJ_CI_TIMINGS=timings.tsv scripts/rust-check "$MODE" --artifact dist
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      # The other gates the model assigns to this job — the ones that need the executable
      # the step above built: projection-closure, web-topology, command-graph. rust-check
      # and rust-integration are the step above, with the mode and the artifact argument
      # the model's line does not carry, so they are the only two skipped here.
      - name: the rust gates of the plan
        run: MJ_CI_TIMINGS=timings.tsv scripts/ci/run-plan --plan plan.json --job rust --skip rust-check,rust-integration
      - id: target
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - if: needs.plan.outputs.rust_check == 'true' || needs.plan.outputs.rust_integration == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: majordomus-cli-${{ steps.target.outputs.triple }}
          path: dist
          retention-days: 7
      - if: always()
        run: scripts/ci/summary --job rust --timings timings.tsv --fact "mode=${{ needs.plan.outputs.rust_check == 'true' && 'ci' || 'integration' }}" --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}" --fact "artifact=majordomus-cli-${{ steps.target.outputs.triple }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-rust
          path: timings.tsv
          retention-days: 14

  # ------------------------------------------------------------------ coverage
  # Line coverage of the crate, with the threshold scripts/rust-check enforces locally.
  coverage:
    needs: plan
    if: needs.plan.outputs.rust_coverage == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/majordomus-cli
    steps:
      - uses: actions/checkout@v4
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-targets --summary-only --fail-under-lines "$(cat ../../scripts/rust-coverage-threshold)"
      - if: always()
        run: ../../scripts/ci/summary --job coverage --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}" --fact "threshold=$(cat ../../scripts/rust-coverage-threshold)"

  # ------------------------------------------------------------------ bench
  # The benchmark check against the committed baseline of its platform (.ai/repo/benchmarks/
  # rust/): a conservative measurement through the real transports. The baseline is per
  # platform, and the one committed is macOS's, so this is where the comparison is real.
  bench:
    needs: plan
    if: needs.plan.outputs.rust_bench == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/majordomus-cli
    steps:
      - uses: actions/checkout@v4
      - id: rust
        uses: ./.github/actions/setup-rust
      - run: cargo run --quiet -- bench --profile ci --check --no-write
      - if: always()
        run: ../../scripts/ci/summary --job bench --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"

  # ------------------------------------------------------------------ site
  # The site built once: the derived data current, the build, every static check over the
  # output, then every route at every width in a real browser (four at a time). On master
  # the same bytes become the Pages artifact the deploy job publishes; nothing rebuilds them.
  site:
    needs: plan
    if: needs.plan.outputs.site_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: site
        uses: ./.github/actions/setup-site
      # One generation for the whole job. This step is the gate — it stages a fresh generation
      # from the canonical sources and diffs it against what is committed, which is the only
      # thing that proves the two agree — and the build and the check then read the committed
      # data rather than each paying for a generation of their own to learn the same fact.
      # The Cockpit's stylesheet is compiled from one source file; this is the only gate
      # that can prove the committed one still matches it, because it needs the Node
      # toolchain the site job already has.
      - name: the Cockpit stylesheet in sync
        if: needs.plan.outputs.cockpit_assets == 'true'
        run: scripts/ci/timed cockpit-assets "cockpit-assets --check" timings.tsv scripts/cockpit-assets --check
      - name: derived site data in sync
        run: scripts/ci/timed site-build "generate-site-data --check" timings.tsv scripts/generate-site-data --check
      - name: build the site
        run: scripts/ci/timed site-build site-build timings.tsv scripts/site-build --no-data
      # Metadata and landmarks on every route, no unrendered template delimiter, every
      # internal link resolving, no remote asset, no credential, and the generated data
      # still matching its canonical sources.
      - name: check the site
        run: scripts/ci/timed site-build site-check timings.tsv scripts/site-check --no-sync
      # Browser-measured: no horizontal overflow at 320/390/1280 on every route, the mobile
      # menu, the dropdowns, the theme toggle, Mermaid rendering. The full sweep, deliberately:
      # every overflow this site has produced came from canonical data rendered into a shared
      # template, which no sample of one route per template can see.
      - name: probe the site in a browser
        if: needs.plan.outputs.site_probe == 'true'
        run: CHROME_BIN=google-chrome SITE_PROBE_JOBS=4 scripts/ci/timed site-probe site-probe timings.tsv scripts/site-probe
      # Every discovered page at every width the compiled theme implies, in a browser,
      # against the responsive, semantic, component and WCAG invariants. It drives the
      # repository's own server, so it needs the executable; the Rust cache makes that a
      # restore rather than a build in nearly every run.
      - id: rust
        if: needs.plan.outputs.ui_audit == 'true'
        uses: ./.github/actions/setup-rust
      - name: the executable the audit drives
        if: needs.plan.outputs.ui_audit == 'true'
        run: |
          RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          echo "MAJORDOMUS_BIN=$PWD/apps/majordomus-cli/target/debug/majordomus" >> "$GITHUB_ENV"
      - name: audit the UI in a browser
        if: needs.plan.outputs.ui_audit == 'true'
        run: scripts/ci/timed ui-audit ui-audit timings.tsv scripts/ui audit --report
      - if: always() && needs.plan.outputs.ui_audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: |
            target/web/run-ui.json
            target/web/tests/ui
          retention-days: 14
      - name: manifest
        run: cat site/data/generated/source.json
      - if: always()
        run: scripts/ci/summary --job site --timings timings.tsv --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}" --fact "routes=$(find site/public -name index.html | wc -l | tr -d ' ')"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-site
          path: timings.tsv
          retention-days: 14

  # ----------------------------------------------------------------- cockpit
  # The Cockpit measured against a server this job starts: every route the server serves
  # answered — derived from that server, never listed — then the pages and the interactions
  # in a real browser. Its own job rather than a step of the site's, because the gate that
  # selects it is a change to the crate or to share/cockpit/, and neither of those builds
  # the website.
  cockpit:
    needs: plan
    if: needs.plan.outputs.cockpit_probe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: site
        uses: ./.github/actions/setup-site
      - id: rust
        uses: ./.github/actions/setup-rust
      # the graph and topology pages load vendored libraries that are deliberately not
      # committed (two megabytes nothing on the critical path needs), so the runner has to
      # build them out of node_modules before a browser is pointed at those pages. Without
      # this the probe reports a console 404 on every page that lazily loads one.
      - name: vendor the lazy-loaded libraries the probe expects to find
        run: scripts/ci/timed cockpit-assets cockpit-assets timings.tsv scripts/cockpit-assets
      - name: probe the Cockpit
        run: CHROME_BIN=google-chrome scripts/ci/timed cockpit-probe cockpit-probe timings.tsv scripts/cockpit-probe
      - if: always()
        run: scripts/ci/summary --job cockpit --timings timings.tsv --fact "npm cache hit=${{ steps.site.outputs.npm-cache-hit }}" --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-cockpit
          path: timings.tsv
          retention-days: 14

  # ------------------------------------------------------------------ macos
  # The behaviour that depends on the platform: the suite under the stock macOS shell
  # (bash 3.2) and BSD userland, and the crate's own suites there (files, signals, the
  # lease, the spawned processes). Lints, docs and coverage are platform-independent and
  # run on Linux only.
  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: site
        uses: ./.github/actions/setup-site
      - id: rust
        uses: ./.github/actions/setup-rust
      - name: shell syntax under bash 3.2
        run: for f in bin/majordomus lib/*.sh test/run.sh test/lib.sh test/cases/*.sh; do /bin/bash -n "$f"; done
      - name: the executable, built once for every case
        run: |
          RUSTFLAGS='' cargo build --quiet --locked --manifest-path apps/majordomus-cli/Cargo.toml
          echo "MAJORDOMUS_BIN=$PWD/apps/majordomus-cli/target/debug/majordomus" >> "$GITHUB_ENV"
      - name: behavioural tests
        env:
          MJ_TEST_JOBS: 3
          MJ_TEST_REPORT: suite.tsv
        run: bash test/run.sh
      - name: the crate's suites
        run: RUSTFLAGS='' cargo test --no-fail-fast --manifest-path apps/majordomus-cli/Cargo.toml
      - if: always()
        run: scripts/ci/summary --job macos --report suite.tsv --fact "rust cache hit=${{ steps.rust.outputs.cache-hit }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-macos
          path: suite.tsv
          retention-days: 14

  # ------------------------------------------------------------------ install
  # The advertised command, from the published site, on two of the platforms it claims to
  # serve. Every other job here reads this checkout; this one reads what a stranger gets,
  # which is why the plan selects it only in the full mode (a master push, the schedule, a
  # dispatch, a pull request labelled ci:full): no change to a tree can make it pass or fail
  # — only a deployment can. A release proves the same thing once, at publication; this is
  # what keeps proving it afterwards.
  install:
    needs: plan
    if: needs.plan.outputs.installer_live == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # --wait: publishing a release and deploying the site are two workflows, and the
      # second is not instant. A push that lands between them would be told the promise is
      # broken when it is merely a few minutes old; a site that cannot serve the metadata
      # inside the window is broken, and the finding stands.
      - name: the advertised install command, from the published site
        run: scripts/ci/install-check --wait 300

  # ------------------------------------------------------------------ ci
  # The one status to require: green only when planning succeeded, every selected gate's job
  # succeeded, and no job that ran failed or was cancelled. Always runs, so a required check
  # is never left pending by a skipped job. It also gathers the jobs' timing rows into the
  # artifact ci-performance-metrics.
  ci:
    needs: [plan, structure, suite, rust, coverage, bench, site, cockpit, macos, install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-metrics-*
          path: metrics
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          scripts/ci/metrics metrics > ci-metrics.tsv
          scripts/ci/verdict --plan plan.json --needs needs.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-performance-metrics
          path: |
            plan.json
            needs.json
            ci-metrics.tsv
          retention-days: 90
