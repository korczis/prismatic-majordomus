// majordomus.capture/v1 — the Markdown document a captured prompt renders as.
//
// One identifier, two projections, each described in the language that fits it. The record is
// JSON and is described by JSON Schema, in `v1.schema.json` beside this file. The document is
// Markdown — a shape, an order, and sections that are present or absent — and is described here,
// where a message and its field numbers say "these parts, in this order" without pretending the
// file is a bag of keys.
//
// Both are reachable from the identifier alone: `<namespace>.<name>/<version>` lives at
// `share/schemas/<namespace>/<name>/<name>.v<version>`, with `.schema.json` for the record and `.proto`
// for the document. The `schema` member of every record, and `schema:` in the front matter of
// every rendering, is that identifier, so a reader holding either half holds the way to read
// both. There is no registry in between that could fall out of step.
//
// Protobuf is used here as a schema language, not as a wire format: nothing serialises these
// messages. Field numbers are the order of the sections in the file, and a field the document
// does not carry is simply absent — this vocabulary has no proto3 `optional` label, because
// section is present exactly when the record carries the member behind it — never that it was
// dropped. Capture runs in the provider's hook before the model is invoked, so a document
// rendered from a record the hook alone wrote has no CONTEXT and no OUTPUT, and that is the
// normal case rather than a deficient one.

syntax = "proto3";

package majordomus.capture.v1;

import "majordomus/options.proto";

// The identity fixes this file's path, as it does for every schema of the layer, and this
// file is the canonical half: `majordomus generate` projects capture.v1.schema.json beside
// it, so there is one definition rather than a hand-written pair that could disagree.
//
// The Header below is the rendering's front matter, which is the record's own field set
// minus `text` — the prompt lives in the body, not the header — plus `record`, the name of
// the JSON it was rendered from. The record's own shape is not this file's to enforce and
// is not enforced here: lib/capture.sh holds it to the closed field set and to being one
// object, one member per line, opening with the identifier.
option (majordomus.schema_id) = "majordomus.capture/v1";
option (majordomus.document_format) = "markdown";

// PromptDocument is `.ai/local/prompts/<YYYYMMDDHHMMSS>-<slug>.md`, beside the record of the same
// stem. It is a projection: it holds nothing the record does not, it is regenerated by
// `majordomus capture render`, and it is never edited by hand — an edit is lost on the next
// render, which is why the record and not this file is what the archive guarantees.
//
// The field numbers are the order in the file:
//
//   ---                            1  front_matter
//   ---
//   # Prompt — <started_at>        2  heading
//   | | |                          3  summary
//   ## CONTEXT                     4  context      (optional)
//   ## OUTPUT                      5  output       (optional)
//   ## PROMPT                      6  prompt       (always, always last)
// The rendering as a whole: the front matter over the body.
message Document {
  Header header = 1 [(majordomus.required) = true];
  Body body = 2 [(majordomus.required) = true];
}

// The front matter of a rendering: every member of the record except `text`, in the
// record's own declared order, then `record`. A member the record does not carry is
// omitted rather than written as null — absent says "not observed", null would claim it
// was observed to be nothing. The record is what these values came from; this is a
// projection of it and never the other way round.
message Header {
  option (majordomus.closed) = true;

  string schema = 1 [(majordomus.required) = true, (majordomus.const) = "majordomus.capture/v1"];
  string started_at = 2 [(majordomus.required) = true];
  string provider = 3 [(majordomus.required) = true];
  string event = 4 [(majordomus.required) = true];
  string id = 5 [(majordomus.required) = true];
  string session = 6;
  string source = 7;
  string cwd = 8;
  string repository = 9;
  string branch = 10;
  string head = 11;

  // Observable only after the turn the capture hook runs in front of, so absent from a
  // record the UserPromptSubmit hook wrote rather than present and empty.
  string finished_at = 12;
  uint32 duration_ms = 13;
  string model = 14;
  string effort = 15;
  uint32 tokens = 16;
  string meta = 17;

  // The file name of the JSON this was rendered from — a name, never a path, because a
  // rendering can only ever point inside its own directory.
  string record = 18 [(majordomus.required) = true];
}

// The body: a heading, the same fields again as a table a person reads, then the prompt
// last and always. CONTEXT and OUTPUT are written when the record carries them.
message Body {
  option (majordomus.body) = true;

  Section prompt = 1 [
    (majordomus.heading) = "PROMPT",
    (majordomus.level) = 2,
    (majordomus.required) = true,
    (majordomus.non_empty) = true
  ];
}

message Section {
  string heading = 1;
  uint32 level = 2;
  bool empty = 3;
}
