id: I2566
milestone: a-screen-is-fast-bounded-and-says-why
title: "The issue list is read a page at a time, and the page is in the URL"
slug: the-issue-list-is-read-a-page-at-a-time
priority: p2
profile: implementation
parallel_safe: true
objective: "Draw the issues screen a bounded page at a time, with the page in the query string beside the filters, so the size of the response does not grow with the plan."
why: "campaigns/majordomus-ui-speed-pack/00-MASTER.md step 7 asks for bounded pagination and its proof matrix says large issue and task lists are bounded; its URL policy says query parameters encode pagination. ui/issues.rs draws one row for every issue the filters admit, and the plan holds 338 issue records on 2026-10-13 and grows with every brief that is planned."
current_state: "apps/majordomus-cli/src/ui/issues.rs collects every issue Pick admits (status, milestone, priority, q) into rows and says N of M issues shown. Pick has no page. The dashboard's lists are cut at ROWS (8) and say what they leave out (I2481)."
desired_state: "Pick carries a page. The screen draws PAGE issues, says which of how many it shows, and links to the next and previous page with every filter kept. A page past the end is answered as the last page. The order is the plan's own, so a page is stable while the plan stands still."
scope:
  - "apps/majordomus-cli/src/ui/issues.rs"
  - "apps/majordomus-cli/src/ui/view.rs"
  - "docs/MAJORDOMUS_UI.md"
  - "test/cases/1080_the_issues_are_browsed.sh"
  - ".ai/repo/project/issues/I2566.yaml"
non_scope:
  - "Paging in plan.issues itself: the capability's answer is unchanged"
  - "Scrolling that loads more rows by script"
depends_on: []
acceptance_criteria:
  - "The screen given ten thousand issues emits at most PAGE rows"
  - "Next and previous keep status, milestone, priority and q, and every page link answers 200"
  - "The pages of one filter, read in order, hold every admitted issue once"
  - "A page number that is not a number or is past the end is answered, never an error page"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib ui::issues"
  - "MJ_TEST_JOBS=2 bash test/run.sh 1080_the_issues_are_browsed"
evidence_required:
  - "issue_list_paging_unit_tests"
  - "issues_case_1080"
created_at: 2026-10-13
updated_at: 2026-10-13
