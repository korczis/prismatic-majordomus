title: Project the model into the website
slug: site-projection
priority: p1
profile: implementation
parallel_safe: true
objective: "Generate the roadmap, every milestone page, every issue page and the DAG page from the canonical model through the existing site data pipeline."
why: "The website already derives every capability claim from a canonical file. A hand-written roadmap page beside it would be the one page that can be wrong."
current_state: "The site derived project, profiles, policy, claims, doctrines, commands and docs. It had no roadmap."
desired_state: "site/data/generated/plan.json exists, and the roadmap, milestone, issue and DAG routes render from it and from nothing else."
scope:
  - scripts/generate-site-data
  - site/templates
  - site/data/generated
non_scope:
  - Any hand-written roadmap content
depends_on:
  - I0005
  - I0006
acceptance_criteria:
  - The generated data contains every milestone and issue with its derived status and wave
  - The roadmap, milestone, issue and DAG routes exist and are reachable from navigation
  - The pages are mobile-first and the DAG stays readable on a narrow screen
  - Stale generated data fails the sync check
validation:
  - scripts/generate-site-data --check
  - scripts/site-build
  - scripts/site-check
evidence_required:
  - site_test
risk: "The site build is the slowest surface; a regression here is found late."
