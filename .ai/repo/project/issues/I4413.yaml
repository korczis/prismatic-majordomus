acceptance_criteria:
  - "Case 4413, in a fixture repository with a bare origin whose refs/remotes/origin/HEAD names main, origin/main carrying a test that fails with `not ok 1 - perf`: with verification.failure_pattern `^not ok [0-9]+ - (.*)$` and verification.base_rerun true, a task whose change touches nothing the test reads is refused, the line names the merge base by short id with (trunk), `pre-existing`, `1 of 1` and `perf`, and task.refused carries verify.failures [\"perf\"] and verify.origin.class pre-existing with base_failures [\"perf\"]"
  - "Case 4413: a task whose change makes a second test fail (`not ok 2 - parse`) over that base is refused with class introduced, and the line lists `parse` as introduced and `perf` as pre-existing"
  - "Case 4413: over a base whose suite passes, a failing change is refused with class introduced and verify.origin.base_exit 0"
  - "Case 4413: with base_rerun true and no failure_pattern, a base that fails too yields class unknown with a reason naming the absent pattern, and the line never says pre-existing"
  - "Case 4413: a shallow clone, a repository with no refs/remotes/<remote>/HEAD and no task start head, and a verification.base_prepare that exits non-zero each yield class unknown with a reason naming why, and the task is refused"
  - "Case 4413: in every class finish exits 15 (contract) and task.finished is not written; `git worktree list` is the same before and after, and no temporary export directory is left behind, including when the base run is interrupted"
  - "Case 4413: without verification.base_rerun, or with `--no-base-rerun`, the verify command runs once, exactly as before"
  - "Case 06 passes unchanged for a policy that declares none of the new keys"
  - "doctor admits verification.failure_pattern, verification.base_rerun and verification.base_prepare through share/allow/policy.txt, regenerated by `majordomus generate`, and the policy schema refuses a failure_pattern that is not a string"
  - "Before the change, case 4413 fails at its first assertion"
