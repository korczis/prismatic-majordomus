id: I3833
milestone: ci-critical-path
title: "majordomus disk prune reclaims by name what nobody is using: idle build directories under their cargo locks, and the container runtime's cache"
slug: the-container-runtime-is-pruned-by-name
priority: p2
profile: implementation
parallel_safe: true
objective: "Add a typed capability disk.prune (CLI `majordomus disk prune`, a check unless --apply) with two sources. The build directories under <CARGO_HOME>/build-private and any extra one named, each removed only while this process holds every cargo lock in it, renamed aside under the locks and then removed. With `containers` (--containers), the container runtime's cache: `docker builder prune --all --force`, `docker image prune --force` (dangling only), and under colima `colima ssh -- sudo fstrim -a`, each bounded in time and named in the answer with the VM disk image's allocation before and after; it starts no stopped runtime, and the prune is announced on the mesh once a replicated notice exists (I2874)."
why: "The owner's relaxation of 2026-10-21 (I3824 clause 8). On 2026-10-20 these four steps shrank the colima disk image from 73 GiB to 43 GiB without touching a named data volume."
current_state: "Source patch with a3 (2026-10-21): both sources and their tests; no volume is pruned, including anonymous ones, because a `docker run -v /data` database is anonymous too; the mesh announcement waits for I2874."
desired_state: "One named capability the owner can allow; a check is read-only; no volume, container or tagged image is ever removed, and a build starting during a prune never loses its directory."
scope:
  - "apps/majordomus-cli/src/capability/builtin/disk.rs"
  - "apps/majordomus-cli/src/disk.rs"
  - "apps/majordomus-cli/src/disk"
  - "apps/majordomus-cli/src/commands/disk.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/tests/disk_prune.rs"
  - "share/commands.yaml"
  - "docs/DEVELOPMENT_RUNTIME.md"
non_scope:
  - "Changing which checks CI requires"
  - "Claude Code permission settings, which are the owner's to paste"
depends_on:
  - "I2874"
acceptance_criteria:
  - "A check reports what each source would reclaim and runs nothing but `docker system df`"
  - "A build directory with a cargo lock another process holds, or a file younger than idle_minutes, is kept; idle_minutes of zero is refused"
  - "--apply never removes a volume, a container or a tagged image, which a stubbed docker that records its arguments proves"
  - "A runtime that is not running is not started, and the report says so with the disk image's allocation"
  - "A machine without docker or colima reports the step as absent, never as a failure"
  - "Each applied prune run is one mesh notice (I2874) with the total bytes it reclaimed and the sources it ran"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib disk::"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test disk_prune"
  - "bin/majordomus plan validate"
evidence_required:
  - "over_mcp_an_idle_directory_is_removed_and_a_locked_one_kept"
  - "a_prune_touches_cache_only_and_trims_under_colima"
  - "a_container_check_reads_the_runtime_and_runs_nothing_else"
created_at: 2026-10-21
updated_at: 2026-10-21
