intent: repository-automation-is-typed
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: 7 of 10 findings are blocking. 5 blocking findings are planned through amendments (I3155, I3159, I3156, I3154, I3161). 2 blocking findings stay open (the duplicate milestone with I1801 unbound, and the self-referential proofs with the taken case 383) because they need the intent and milestone records staged again. Of the 3 non-blocking findings, 1 is planned (I3160) and 2 are open. Re-resolved on 2026-10-18 by the plan author after verification: the statement finding is planned (I3159), the observatory finding is planned (I3155), the continuity-port finding is rejected because I3160 became maintenance outside the intent, and the two blocking findings stay open."
findings:
  - id: milestone-duplicates-automation-and-leaves-i1801-unbound
    class: unnecessary_work
    subject: "repository-automation-is-typed"
    finding: "Master already has milestone `automation` (.ai/repo/project/milestones/automation.yaml, order 130). Its title is nearly the same and its acceptance criteria are the same (a scripted capability on every projection with no other edit, the effect ceiling, the shell inventory). The new milestone at order 169 copies it. All eight issues say \"It extends milestone automation\" in their why, yet each one's `milestone:` field points at the new milestone. The result is that the issues that carry the intent's main criterion serve nothing. I1801 is open and gives scripted-capability-runs its whole meaning: the kind, `majordomus run`, CLI/MCP/OpenAPI after generate, case 383. I1804 holds the first migrations and their parity. Only I3157 (an adopter fixture) and I3158 (an AST cache) serve the criterion, and both depend_on I1801. Coverage would count the criterion as covered while the work that makes it true sits outside the intent. I3158 does not make the criterion true either: nothing has measured a compile cost, and `import` resolves no module today (apps/majordomus-cli/src/script/mod.rs:21-23), so a jailed resolver guards a feature that does not exist. Fix: bind the intent to milestone `automation`, add `serves` to I1801 and I1804, and drop or defer the duplicate milestone and I3158."
    blocking: true
    resolution:
      state: open
      because: "Confirmed on master: automation.yaml (order 130) carries the same acceptance criteria, I1801's desired_state and validation are the criterion's substance, and script/mod.rs:21-23 says import resolves no module. Every fix this finding needs is a change to records the additive issue amendments cannot reach: intent.milestones -> [automation], removing the order-169 milestone, moving the eight issues' `milestone:` to automation, adding `serves: [repository-automation-is-typed#scripted-capability-runs]` to I1801 and `serves: [...#domain-shell-ratchet]` to I1804 (neither is in this bundle), and deferring I3158 (no amendment can remove an issue or its `serves`). The plan author has to stage the intent and milestone again. Until that happens this blocking finding stays open, which is the honest state. Plan reconciled on 2026-10-18 after verification: I3158 is deferred in the plan (skipped, with its reason) and I3160 serves nothing of this intent. What remains open needs hand edits the generated writer does not make: binding the intent to the existing milestone automation (the writer derives the intent's own milestone when an issue extends an existing milestone no intent owns), moving the issues' milestone back to automation, and adding serves to I1801 and I1804."
  - id: proofs-are-self-referential-and-case-383-is-taken
    class: delivery_verification
    subject: "repository-automation-is-typed#scripted-capability-runs"
    finding: "Every criterion has `evidence: command, ref: majordomus intent explain repository-automation-is-typed`. That points the proof back at the intent itself. Master intents point at the test that proves the criterion (intent-planning.yaml: `evidence: test, ref: test/cases/386_...`). Three of the four planned proofs are written as `<n>` or 'to be written'. The one proof that names a file, test/cases/383_a_scripted_capability_runs.sh (also in I1801 and I3157 validation), names a case number already taken on master: test/cases/383_convergence_is_enforced.sh. The planned case is also two issues' proof, I1801 inside the tree and I3157 for an adopter. Fix: give each criterion a reserved case number or Rust test path as `evidence: test`, and give I3157 its own case."
    blocking: true
    resolution:
      state: open
      because: "Confirmed: test/cases/383_convergence_is_enforced.sh exists on master, and intent-planning.yaml uses `evidence: test` with a test ref. The amendments below give each bundle issue its own proof file, numbered by its issue id; 3154, 3155, 3157, 3159 and 3161 are free in test/cases and I3156/I3160 are Rust tests. I3157 then gets its own case. Two parts of the fix are outside what additive issue amendments can change. First, each intent criterion's `evidence`/`ref` has to become `evidence: test` with these paths. Second, I1801's validation and automation.yaml's validation, both outside the bundle, still name the taken 383 and need a new number. Both parts belong to the re-stage that finding 1 needs. Each number also has to be announced on the board before it is taken (project.work-is-claimed-before-it-is-built), and this read-only step cannot do that. Plan reconciled on 2026-10-18 after verification: each criterion now names the planned proof of the issue that serves it (case_just_is_derived, case_domain_shell_only_shrinks, test_one_executable_per_command, case_adopter_scripted_capability, case_parity_before_deletion, case_commit_hook_is_one_call), no validation names 383, and each new case takes its number from scripts/case-numbers next and the board (ADR 0053). Numbers chosen by issue id (3154-3161) sit below the case high-water mark (3178 on master) and 3160 is taken, so they are provisional. Still open: I1801's and automation.yaml's validation name the taken 383, and the criteria flip to evidence: test only when their tests land."
  - id: ratchet-counts-self-declared-labels
    class: unproven_assumption
    subject: "I3155"
    finding: "The domain-shell-ratchet criterion counts class-A records. Invariant 4 says \"Progress is measured by logic removed, never by counting .sh files\", and a count of records is exactly a file count. The disposition is a label people write into .ai/repo/automation/inventory.jsonl (113 A, 48 F, 32 C, 30 B, 13 E, 1 D at 707a04c), so a branch can relabel A to C, or fold two units into one, and pass. Nothing ties a disposition to a fact the tree can derive. The count also has to be compared with the merge base, but today the check reads only the index and file heads (gates.yaml:533-539), and the shell-inventory class runs only when governed paths change (gates.yaml:1121-1123). The issue's scope names capability/builtin/shell.rs, which is an 83-line declaration; the judgement lives in apps/majordomus-cli/src/automation/mod.rs, which is out of scope. Fix: define the measure (for example lines or units of class A, plus refusing a disposition change without a reason a reviewer reads), say where the merge base comes from, and widen the scope."
    blocking: true
    resolution:
      state: planned
      issue: I3155
      because: "Confirmed: shell.rs has 83 lines, and the judgement lives in automation/mod.rs (939 lines), which already derives line counts and does not record them. In the amendment to I3155 the measure is the class-A unit count plus the class-A line count, derived from the tree. A move of a disposition away from A is refused unless the record carries a reason. The merge base is named and reported, and a check with no base reports skipped, not clean. The gate also runs when the inventory alone changes. The scope adds automation/mod.rs and gates.yaml. The criterion's wording ('count of class-A units never rises') stays true under this stricter measure."
  - id: parity-check-cannot-see-a-deletion
    class: unproven_assumption
    subject: "I3159"
    finding: "\"The shell check refuses deleting a class A or B unit whose record names no passing parity case\" cannot work as written. The inventory README says \"A migrated unit's record is deleted in the same change that deletes the unit\", so when the check runs the record holding the parity field is already gone. shell.check also \"reads the tree and git's index only; no build and no network\" (shell.rs:43), so it cannot know a case passes. That needs a merge-base read of the old record plus an evidence-ledger entry. The issue also serves domain-shell-ratchet, a criterion that says nothing about parity, so no criterion would ever judge its work. The statement's \"every migrated unit proved it behaves as its predecessor\" has no criterion at all."
    blocking: true
    resolution:
      state: planned
      issue: I3159
      because: "In the amendment the deleted unit's record is read from the merge-base inventory, a local git object read with no network and no build. The pass is read from a recorded entry in .ai/repo/evidence/ledger.json, never by running the case. The issue's work is tied to the criterion it serves: the ratchet counts a class A or B unit as removed only when its parity case has a recorded pass, and otherwise the shell check refuses the deletion. That is the 'and the shell check says so' half of domain-shell-ratchet. A criterion of its own for the statement's parity promise is still worth adding at the intent re-stage (finding statement-promises-without-criteria)."
  - id: ownership-per-name-already-fails
    class: unproven_assumption
    subject: "repository-automation-is-typed#one-executable-per-command"
    finding: "\"Every command name resolves to one implementing executable\" is false on master today, by design. skills, knowledge, rules, bench and evidence are top-level commands in docs/generated/cli.yaml and also in the shell tool's dispatch (bin/majordomus:276-282), which hands over by subcommand word (mj_words_are_the_executables). Ownership is per command path, not per name. I3156's current_state says \"nothing joins them per name\", but command_graph/mod.rs:175-206 already joins the two origins and reports `workflow-name-qualified` for bench. Its plan to \"generate bin/majordomus's delegation lines\" brings back the catalogue that bin/majordomus:100-103 says project.commands-are-projections forbids; delegation is currently read from cli.yaml at run time. Fix: restate the criterion per command path, and build on the command graph's join instead of a new table and generated shell lines."
    blocking: true
    resolution:
      state: planned
      issue: I3156
      because: "Confirmed at bin/majordomus:100-103 and 276-282 and at command_graph/mod.rs qualify_collisions. In the amendment I3156 judges ownership per command path, meaning the program and the full word sequence that cli.yaml and share/commands.yaml declare. A shared top-level word that is handed over by subcommand word is not a finding. The reading is derived from the command graph's existing join, and generated delegation lines are put out of scope by project.commands-are-projections. This makes the criterion decidable and true-able. Its wording ('command name' should read 'command path') can be corrected at the intent re-stage without changing the work."
  - id: tracked-just-reverses-adr-0027
    class: regression_risk
    subject: "I3154"
    finding: "ADR 0027 decided \"The workflow bridge is generated and untracked\" (0027:61), and rejected \"Generating the bridge into the tree\" because of the merge cost on every branch that touches the command line (0027:82-86, bridge.rs:14-19, justfile:50-58). I3154 asks for \"a tracked generated recipe file, drift-checked\" and supersedes no ADR. The bridge already derives every command of both programs as a recipe. The hand-written .just recipes already have anchored inventory records with dispositions (inventory.jsonl lines 31-38), so most of the criterion's \"declared exemption\" half exists. Fix: either record an ADR that supersedes 0027 or reword the criterion so the untracked bridge counts as \"generated\", and limit the work to refusing a hand-written recipe that duplicates a bridged one."
    blocking: true
    resolution:
      state: planned
      issue: I3154
      because: "Confirmed: justfile:50-58 imports the untracked .ai/local/cache/command-graph/bridge.just, which ADR 0027 (.ai/repo/adrs/0027-...md) holds untracked. The criterion as written ('generated from the command graph or carries a declared exemption') is already met by the untracked bridge, so the ADR does not need superseding. The amendment rules out tracking the bridge. It counts the untracked bridge as the criterion's generated recipes, with regeneration byte-identical. It limits the work to refusing a hand-written recipe that duplicates a bridged command and to every remaining hand-written recipe resolving to its inventory record. The desired_state's 'tracked' is overridden by the new non_scope entry."
  - id: commit-hook-breaks-wiring-checks
    class: regression_risk
    subject: "I3161"
    finding: "Collapsing .githooks/pre-commit to one exec line breaks the checks that read the hook's text. In .ai/repo/policy.yaml:281-289 doctor requires the hook to invoke `scripts/ci/providers-check --permissions-only` and `bin/majordomus doctor`. The I2718 incident was exactly this FAIL ('ssh-permissions-on-commit ... is not invoked by .githooks/pre-commit'), and it refused commits in every worktree. scripts/ci/worktree-check:53 greps for `majordomus-cli worktree guard`. Cases 26_ci_wiring.sh:145 and 56_derived_current_gate.sh:157 grep for `majordomus doctor` and `scripts/pages current`. None of these is in scope. The composed command would still run the shell doctor (lib/doctor.sh, 1593 lines), scripts/pages (1569 lines) and providers-check, so the slow path stays. The issue serves one-executable-per-command without making it true. Fix: move the wiring model to `wired_by: <hook command>` in the same change and widen the scope, or drop the issue."
    blocking: true
    resolution:
      state: planned
      issue: I3161
      because: "Confirmed: policy.yaml enforcement entries are wired_by git-hook:pre-commit, and doctor reconciles them against the hook text. The amendment adds to scope policy.yaml, lib/doctor.sh, scripts/ci/worktree-check and cases 26 and 56. In the same change the wiring model moves to the hook command's declared composition, so every enforcement entry is still proven invoked and no check greps the hook text. The I3156 dependency ties the issue to its criterion: the hook command is one command path that the Rust executable alone owns, and the ownership reading reports it so. The slow path stays visible through per-component time against the budget."
  - id: continuity-port-serves-nothing-here
    class: insufficient_work
    subject: "I3160"
    finding: "I3160 serves domain-shell-ratchet, but test/ is not governed (apps/majordomus-cli/src/automation/mod.rs:28 and GOVERNED at :45). The whole of test/cases is one class-C record, so porting cases 821-827 moves no class-A count and can prove nothing for that criterion. Deleting the seven shell files also breaks rule project.session-continuity-is-portable, whose x-majordomus.tests list them (.ai/repo/rules/project/session-continuity-is-portable.v1.md:15-21). The rule is not in scope. Either bind the issue to a criterion it can prove or call it maintenance, and add the rule to its scope."
    blocking: false
    resolution:
      state: rejected
      because: "Accepted as stated, so nothing is planned under this intent: I3160 now serves no criterion of it and is harness maintenance in milestone automation (test/ is not governed, automation/mod.rs:28). Its amendment keeps rule project.session-continuity-is-portable's tests resolved when cases 821-827 move to Rust."
  - id: statement-promises-without-criteria
    class: missed_requirement
    subject: "repository-automation-is-typed"
    finding: "The statement promises things no criterion or issue carries: Linux, macOS and Windows (no workflow under .github/workflows runs on Windows); no bash, Python, jq or Rust toolchain (the justfile sets `shell := [\"bash\", ...]`, and bin/majordomus, lib/ and the hooks are bash); hooks as generated adapters (I3161 hand-writes one line, and the pre-push hook is out of its scope); shell only at declared boundaries; parity before deletion. The owner's words (c230#0: get rid of all or most bash for Rhai; c290#0) do not name Windows or a toolchain-free install. Those came from the assistant's replies. Either trim the statement to what the four criteria prove, or add criteria with proofs, for example a Windows job and a hook-is-generated check."
    blocking: false
    resolution:
      state: planned
      issue: I3159
      because: "The statement is trimmed to what the owner's words and the criteria carry: Windows, the toolchain-free install and 'generated' hooks are dropped. The parity promise gains the criterion parity-before-deletion, served by I3159, and the hook promise the criterion the-commit-hook-is-one-call, served by I3161."
  - id: shell-observatory-and-ownership-reach-no-ui
    class: surface_missing
    subject: "I3155"
    finding: "The owner asked for a derived shell observatory (2026-10-17, cited in I3155's why). I3155 serves per-class counts \"for the UI to draw\" but puts /ui out of scope as \"(ui-surfaces)\", and that names no issue. I3156's ownership table goes to CLI and MCP only. No issue puts the shell counts, the ownership table or the just-derivation state on /ui, /cockpit, the site or the generated docs (only docs/SHELL.md and docs/COMMANDS.md are in scope), and no issue verifies a deployed page."
    blocking: false
    resolution:
      state: planned
      issue: I3155
      because: "I3155's '/ui screen' non_scope is removed: it now draws the per-class counts and their change against the merge base as the shell observatory on /ui from the same reading, and checks the published page carries them. I3156's amendment already brings the ownership reading to the /ui command surface."
