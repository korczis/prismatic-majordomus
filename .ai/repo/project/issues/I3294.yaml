id: I3294
milestone: every-sessions-usage-is-observed
title: "/ui shows usage by provider, model, session, task and issue, and every figure opens its reported events"
slug: the-ui-shows-usage
priority: p3
profile: implementation
objective: "Extend the observatory's Token Spectrum scene on /ui, read only from the economics capabilities, to group usage by provider, model, session, task and issue, each figure naming its class and age and linking to the events it sums."
why: "The owner wants consumption visible in the UI immediately; ADR 0135 makes /ui the primary surface and forbids accounting in a renderer. /ui has no economics page; usage is drawn today by the Token Spectrum scene, and usage is runtime state the CI-taken snapshot cannot hold. It extends milestone execution-telemetry. Proposed in ADR 0213 (Usage is observed through each provider's official telemetry into one provider-neutral record, and reported, estimated and billed amounts are never merged) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c236#7, chatgpt-majordomus:c253#2."
current_state: "/ui has no economics page; the observatory's Token Spectrum scene (ui/observatory.rs) draws economics.runs and links to /ui/evidence; nothing draws session usage."
desired_state: "A live usage view over the existing stream; the published snapshot, taken where no usage store exists, shows that absence and no usage figures."
scope:
  - "apps/majordomus-cli/src/ui"
  - "docs/MAJORDOMUS_UI.md"
  - "apps/majordomus-cli/src/live.rs"
  - "site/content/economics.md"
depends_on:
  - "I3293"
  - "I3292"
  - "I0304"
serves:
  - "every-sessions-usage-is-observed#usage-drills-to-its-event"
acceptance_criteria:
  - "Every figure links to its events"
  - "Estimated figures are visibly distinct from reported ones"
  - "The view computes no sum the capability did not return"
  - "Usage is drawn by extending the observatory's Token Spectrum scene (ui/observatory.rs), not by a second rendering"
  - "The published snapshot shows the absence of a usage store and no usage figures (test)"
  - "/cockpit and site/content/economics.md show the same capability output and compute no sum of their own"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test observatory"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib ui::observatory"
evidence_required:
  - "test_ui_usage"
created_at: 2026-10-18
updated_at: 2026-10-18
