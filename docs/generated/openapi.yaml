        title:
          type: string
          description: The short name.
        description:
          type: string
          description: One paragraph.
        deterministic:
          type: boolean
          description: True when the same tree always yields the same result; false for a semantic one.
        reads_sensitive:
          type: boolean
          description: True when it reads content that may hold secrets.
        kinds:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeKindInfo"
          description: The kinds it emits.
        relations:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeRelationInfo"
          description: The relation kinds it emits.
        predicates:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgePredicateInfo"
          description: The predicates it emits.
      required:
        - id
        - version
        - title
        - description
        - deterministic
        - reads_sensitive
        - kinds
        - relations
        - predicates
      description: "What an extractor is, declared once beside its behaviour."
    KnowledgeExtractorsReport:
      type: object
      properties:
        extractors:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeExtractorInfo"
          description: "Every extractor, in the order they run."
        kinds:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeKindOwner"
          description: "Every node kind, with the extractor that declares it."
        relations:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeRelationInfo"
          description: Every relation kind.
        predicates:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgePredicateInfo"
          description: Every predicate.
        providers:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeProviderInfo"
          description: The semantic providers this executable ships.
        schemas:
          type: array
          items: true
          description: "The schema versions this executable reads and writes, and the migrations it knows."
      required:
        - extractors
        - kinds
        - relations
        - predicates
        - providers
        - schemas
      description: "The answer of `knowledge.extractors`: how the model is made."
    KnowledgeFingerprint:
      type: object
      properties:
        algorithm:
          type: string
          description: "The algorithm; `sha256` today."
        value:
          type: string
          description: The hex digest.
        granularity:
          "$ref": "#/components/schemas/KnowledgeGranularity"
          description: How much of the source it covers.
      required:
        - algorithm
        - value
        - granularity
      description: A content fingerprint.
    KnowledgeFreshness:
      oneOf:
        - type: string
          const: current
          description: Every piece of evidence the knowledge rests on is what it was verified against.
        - type: string
          const: possibly_stale
          description: Something the knowledge depends on moved; the knowledge itself was not touched.
        - type: string
          const: stale
          description: Evidence the knowledge rests on directly changed since it was verified.
        - type: string
          const: conflicted
          description: "Other evidence contradicts it, and nobody has resolved which side holds."
        - type: string
          const: unverified
          description: "Nothing verifies it: no evidence, evidence that does not resolve, or no baseline."
      description: "Whether knowledge may still be trusted, decided against its evidence and never by its\nage. An old decision can be current; yesterday's note can already be contradicted."
    KnowledgeGap:
      type: object
      properties:
        id:
          type: string
          description: "Stable identity: `<category>:<subject>`."
        category:
          "$ref": "#/components/schemas/KnowledgeGapCategory"
          description: The category.
        subject:
          type: string
          description: The node or evidence it concerns.
        reason:
          type: string
          description: Why it is a gap.
        remedy:
          type: string
          description: What closes it.
      required:
        - id
        - category
        - subject
        - reason
        - remedy
      description: "Something the repository should know and does not, with what to do about it."
    KnowledgeGapCategory:
      oneOf:
        - type: string
          const: undocumented_component
          description: A component the repository has and no document describes.
        - type: string
          const: unresolved_reference
          description: "A declaration names a file, a test or an object that does not exist."
        - type: string
          const: unverified_knowledge
          description: Knowledge nothing verifies.
        - type: string
          const: unexercised_capability
          description: "A capability no use case, claim or decision names."
        - type: string
          const: canonicality
          description: "A generated artifact whose source cannot be found, or a mirror of a canonical source."
      description: What kind of gap a gap is.
    KnowledgeGapsReport:
      type: object
      properties:
        gaps:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeGap"
          description: "The gaps, by id."
        tallies:
          type: object
          additionalProperties:
            type: integer
            format: uint
            minimum: 0
          description: "How many of each category, over the whole model."
      required:
        - gaps
        - tallies
      description: "The answer of `knowledge.gaps`."
    KnowledgeGranularity:
      oneOf:
        - type: string
          const: revision
          description: The whole revision.
        - type: string
          const: file
          description: The whole file.
        - type: string
          const: entry
          description: One entry of a structured file.
        - type: string
          const: object
          description: "One object's parsed metadata, independent of its prose."
      description: "How much of a source a fingerprint covers. Stated rather than implied: file-level\nevidence cannot pretend to entry-level precision."
    KnowledgeGraphEdge:
      type: object
      properties:
        source:
          type: string
          description: The source.
        target:
          type: string
          description: The target.
        kind:
          type: string
          description: The kind.
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: The provenance.
      required:
        - source
        - target
        - kind
        - provenance
      description: An edge of a graph slice.
    KnowledgeGraphNode:
      type: object
      properties:
        id:
          type: string
          description: The id.
        kind:
          type: string
          description: The kind.
        title:
          type: string
          description: The title.
        label:
          type: string
          description: "The short label a renderer draws: the local part of the id."
        route:
          type:
            - string
            - "null"
          description: Where the Cockpit shows the node.
        freshness:
          "$ref": "#/components/schemas/KnowledgeFreshness"
          description: The freshness.
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: The provenance.
        depth:
          type: integer
          format: uint
          minimum: 0
          description: "Distance from the root, when the slice has one."
      required:
        - id
        - kind
        - title
        - label
        - freshness
        - provenance
        - depth
      description: A node of a graph slice.
    KnowledgeGraphSlice:
      type: object
      properties:
        root:
          type:
            - string
            - "null"
          description: "The root, when the slice was cut around one."
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeGraphNode"
          description: The nodes.
        edges:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeGraphEdge"
          description: The edges among them.
        omitted:
          type: integer
          format: uint
          minimum: 0
          description: How many nodes the cut left out.
      required:
        - nodes
        - edges
        - omitted
      description: A slice of the knowledge graph.
    KnowledgeHit:
      type: object
      properties:
        id:
          type: string
          description: The node.
        kind:
          type: string
          description: Its kind.
        title:
          type: string
          description: Its title.
        freshness:
          "$ref": "#/components/schemas/KnowledgeFreshness"
          description: Its freshness.
        matched:
          type: string
          description: "Where the query matched: `id`, `title`, `summary`, `claim`."
        excerpt:
          type: string
          description: "The matching text, shortened."
        score:
          type: integer
          format: uint32
          minimum: 0
          description: Higher is better; deterministic.
      required:
        - id
        - kind
        - title
        - freshness
        - matched
        - excerpt
        - score
      description: One search hit.
    KnowledgeImpactReport:
      type: object
      properties:
        change_set:
          type: string
          description: "What the change set is: `working-tree`, `revisions` or `paths`."
        base:
          type:
            - string
            - "null"
          description: "The base the working tree or the revision was compared with, when there is one."
        changed:
          type: array
          items:
            "$ref": "#/components/schemas/ChangedPath"
          description: The paths that changed.
        entries:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeChangedEntry"
          description: "The entries that changed, where an extractor could tell."
        direct:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeAffected"
          description: Nodes whose own evidence changed.
        transitive:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeAffected"
          description: "Nodes reached along propagating relations, nearest first."
        claims:
          type: array
          items:
            type: string
          description: "The claims resting on changed evidence, by id."
        extractors:
          type: array
          items:
            type: string
          description: "Extractors whose evidence the change set touches: what a scan re-reads."
        unmodelled:
          type: array
          items:
            type: string
          description: "Paths no evidence rests on: a change nothing in the model knows about."
      required:
        - change_set
        - changed
        - entries
        - direct
        - transitive
        - claims
        - extractors
        - unmodelled
      description: The impact of a change set.
    KnowledgeInspection:
      type: object
      properties:
        base:
          type: string
          description: The base the change set was cut against.
        impact:
          "$ref": "#/components/schemas/KnowledgeImpactReport"
          description: The impact of the change set on the model.
        added_capabilities:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeAddedCapability"
          description: Every capability the change set adds.
        new_debt:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeDebtItem"
          description: "Debt the baseline does not tolerate: what the change must fix or record."
        violations:
          type: array
          items:
            "$ref": "#/components/schemas/CanonicalityViolation"
          description: Canonicality violations that count.
        mode:
          "$ref": "#/components/schemas/KnowledgeMode"
          description: "The check's mode."
        verdict:
          type: string
          description: "`pass` or `fail`."
        summary:
          type: string
          description: One line.
      required:
        - base
        - impact
        - added_capabilities
        - new_debt
        - violations
        - mode
        - verdict
        - summary
      description: The inspection.
    KnowledgeKindInfo:
      type: object
      properties:
        kind:
          type: string
          description: The kind.
        meaning:
          type: string
          description: What a node of this kind is.
      required:
        - kind
        - meaning
      description: "One kind an extractor emits, with what it means."
    KnowledgeKindOwner:
      type: object
      properties:
        kind:
          type: string
          description: The kind.
        meaning:
          type: string
          description: What a node of this kind is.
        extractor:
          type: string
          description: The extractor.
      required:
        - kind
        - meaning
        - extractor
      description: A node kind and who declares it.
    KnowledgeLocator:
      type: object
      properties:
        path:
          type:
            - string
            - "null"
          description: "The repository-relative path, when the evidence is in a file."
        uri:
          type:
            - string
            - "null"
          description: "The `majordomus://` URI, when the evidence is an object of the layer."
        member:
          type:
            - string
            - "null"
          description: "The member inside the file, when the evidence is one entry of it\n(`dependencies.serde`, `claims.3`)."
        id:
          type:
            - string
            - "null"
          description: "The canonical id, when the evidence is a capability or an artifact."
      description: "Where a piece of evidence is found. Repository-relative, never a machine path."
    KnowledgeMode:
      oneOf:
        - type: string
          const: observe
          description: Report everything; never fail.
        - type: string
          const: warn
          description: Report new debt as warnings; never fail.
        - type: string
          const: protect
          description: Refuse new debt; tolerate what the baseline records.
        - type: string
          const: strict
          description: Refuse any debt at all.
      description: How strictly the check holds a scan against the baseline.
    KnowledgeModel:
      type: object
      properties:
        schema:
          type: string
          description: "[`SCHEMA`]."
        repository:
          "$ref": "#/components/schemas/KnowledgeRepositoryIdentity"
          description: The repository it is about.
        reference:
          "$ref": "#/components/schemas/KnowledgeReferenceInfo"
          description: The reference freshness was decided against.
        extractors:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeExtractorInfo"
          description: "Every extractor that ran, with its vocabulary."
        evidence:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeEvidence"
          description: "Every piece of evidence, by id."
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeNode"
          description: "Every node, by id, claims inside."
        relations:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeRelation"
          description: "Every relation, sorted."
        conflicts:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeConflict"
          description: "Every conflict, by id."
        gaps:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeGap"
          description: "Every gap, by id."
        coverage:
          "$ref": "#/components/schemas/KnowledgeCoverage"
          description: Coverage where a denominator is defined.
        diagnostics:
          type: array
          items:
            "$ref": "#/components/schemas/Diagnostic"
          description: What could not be read or did not validate.
        fingerprint:
          type: string
          description: "A hash of every node, claim, evidence fingerprint and relation, freshness excluded:\nthe same tree yields the same fingerprint."
      required:
        - schema
        - repository
        - reference
        - extractors
        - evidence
        - nodes
        - relations
        - conflicts
        - gaps
        - coverage
        - fingerprint
      description: "The whole model: what the repository knows, with the evidence behind it."
    KnowledgeNode:
      type: object
      properties:
        id:
          type: string
          description: "Stable identity, `<kind>:<local>`: `component:majordomus-cli`, `document:docs/CLI.md`,\n`decision:adr-0021`, `capability:objects.get`. Survives a retitle."
        kind:
          type: string
          description: "The kind, from the vocabulary an extractor declared."
        title:
          type: string
          description: The short name a listing shows.
        summary:
          type:
            - string
            - "null"
          description: "One line about it, when the source holds one."
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: How the node came to be known.
        ownership:
          "$ref": "#/components/schemas/KnowledgeOwnership"
          description: Who owns its source.
        visibility:
          "$ref": "#/components/schemas/KnowledgeVisibility"
          description: Who may see it.
        confidence:
          "$ref": "#/components/schemas/KnowledgeConfidence"
          description: How strongly the evidence supports it.
        evidence:
          type: array
          items:
            type: string
          description: The evidence ids the node itself rests on.
        claims:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeClaim"
          description: The claims made about it.
        source:
          type:
            - string
            - "null"
          description: "The repository-relative source, when one file owns the node."
        extractor:
          type: string
          description: The extractor that emitted it.
        freshness:
          "$ref": "#/components/schemas/KnowledgeFreshness"
          description: Where it stands against the baseline; filled by the freshness pass.
        freshness_reason:
          type:
            - string
            - "null"
          description: "Why, when the reason is worth a line."
        route:
          type:
            - string
            - "null"
          description: "The Cockpit route of the underlying object, when it has one."
      required:
        - id
        - kind
        - title
        - provenance
        - ownership
        - visibility
        - confidence
        - extractor
        - freshness
      description: "One node of the knowledge graph: a thing the repository holds, has, decides or does."
    KnowledgeNodeView:
      type: object
      properties:
        node:
          "$ref": "#/components/schemas/KnowledgeNode"
          description: The node.
        evidence:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeEvidence"
          description: "Its evidence, resolved."
        outgoing:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeRelation"
          description: Relations leaving it.
        incoming:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeRelation"
          description: Relations entering it.
        conflicts:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeConflict"
          description: Conflicts it is the subject of.
        gaps:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeGap"
          description: Gaps about it.
      required:
        - node
        - evidence
        - outgoing
        - incoming
        - conflicts
        - gaps
      description: One node with everything that bears on it.
    KnowledgeOwnership:
      oneOf:
        - type: string
          const: external
          description: "A person or another tool owns the source; Majordomus reports and proposes, never\nrewrites."
        - type: string
          const: majordomus
          description: Majordomus generates the source and may regenerate or re-accept it.
        - type: string
          const: hybrid
          description: "A file with a machine-owned part and a human-owned part; only the machine-owned\npart is ever updated automatically."
      description: "Who may change the source a piece of knowledge came from, which decides what\nreconciliation may do with it."
    KnowledgePage:
      type: object
      properties:
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeSummary"
          description: The nodes on the page.
        total:
          type: integer
          format: uint
          minimum: 0
          description: How many matched in all.
        offset:
          type: integer
          format: uint
          minimum: 0
          description: The offset of the page.
        limit:
          type: integer
          format: uint
          minimum: 0
          description: The page size asked for.
      required:
        - nodes
        - total
        - offset
        - limit
      description: A page of a listing.
    KnowledgePredicateInfo:
      type: object
      properties:
        name:
          type: string
          description: The predicate.
        meaning:
          type: string
          description: What a claim of it says.
        functional:
          type: boolean
          description: "True when one subject has exactly one value: two different values are a conflict."
      required:
        - name
        - meaning
        - functional
      description: "One predicate an extractor emits, with what it means and how claims of it behave."
    KnowledgeProposal:
      type: object
      properties:
        id:
          type: string
          description: "Stable across runs: `<class>:<subject>`."
        class:
          type: string
          description: "`resolve_conflict`, `reverify`, `fix_reference`, `document`, `exercise`,\n`derive` or `review`."
        subject:
          type: string
          description: The node or claim it is about.
        action:
          type: string
          description: "What to do, one sentence."
        owner:
          "$ref": "#/components/schemas/KnowledgeOwnership"
          description: "Who owns the source: `external` means a person edits it."
        applies_by:
          type: string
          description: "`accept` applies it on `--accept`; `edit` needs a person."
      required:
        - id
        - class
        - subject
        - action
        - owner
        - applies_by
      description: One proposal.
    KnowledgeProvenance:
      oneOf:
        - type: string
          const: observed
          description: "Read off the repository or git by a deterministic extractor: a file exists, a\nmanifest names a package, HEAD is a commit. The evidence is the source itself."
        - type: string
          const: declared
          description: "Stated by a structured declaration a person wrote about the repository: front\nmatter, a claims matrix, a deployment object. True because somebody said so."
        - type: string
          const: derived
          description: "Concluded from other knowledge by a rule this executable applies, or by a semantic\nprovider. Never mistaken for an observation."
        - type: string
          const: curated
          description: "Written deliberately by a person as knowledge, under the curated kind of the layer."
      description: "How a statement came to be known. The four classes are the whole vocabulary; a fifth\nwould be a class nobody can decide from evidence."
    KnowledgeProviderInfo:
      type: object
      properties:
        id:
          type: string
          description: The id.
        model:
          type: string
          description: The model it uses.
        remote:
          type: boolean
          description: Whether it sends text off the machine.
        operations:
          type: array
          items:
            type: string
          description: The operations.
      required:
        - id
        - model
        - remote
        - operations
      description: "A semantic provider, described."
    KnowledgeReconciliation:
      type: object
      properties:
        proposals:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeProposal"
          description: "Every proposal, by class then subject."
        acceptable:
          type: integer
          format: uint
          minimum: 0
          description: "How many are applied by `--accept`."
        accepted:
          type: array
          items:
            type: string
          description: "The claims accepted, when `--accept` ran."
        baseline_written:
          type: boolean
          description: Whether the baseline was written.
      required:
        - proposals
        - acceptable
        - accepted
        - baseline_written
      description: "What reconciliation found and, on accept, did."
    KnowledgeReferenceInfo:
      type: object
      properties:
        kind:
          type: string
          description: "`baseline` when a tracked baseline exists, `none` otherwise."
        revision:
          type:
            - string
            - "null"
          description: "The revision the baseline was taken at, when there is one."
        mode:
          type: string
          description: The enforcement mode in force.
        path:
          type:
            - string
            - "null"
          description: "Where the baseline is, repository-relative, when there is one."
      required:
        - kind
        - mode
      description: Which reference freshness was decided against.
    KnowledgeRelation:
      type: object
      properties:
        source:
          type: string
          description: The node the relation leaves.
        target:
          type: string
          description: The node it enters.
        kind:
          type: string
          description: "The kind, from the vocabulary an extractor declared."
        provenance:
          "$ref": "#/components/schemas/KnowledgeProvenance"
          description: How the relation came to be known.
        evidence:
          type: array
          items:
            type: string
          description: The evidence ids that state it.
      required:
        - source
        - target
        - kind
        - provenance
      description: "One typed, directed relation between two nodes."
    KnowledgeRelationInfo:
      type: object
      properties:
        kind:
          type: string
          description: The relation kind.
        meaning:
          type: string
          description: What an edge of this kind asserts.
        propagates:
          type: boolean
          description: True when a change at the target may make the source possibly stale.
      required:
        - kind
        - meaning
        - propagates
      description: "One relation kind an extractor emits, with what it asserts."
    KnowledgeRepositoryIdentity:
      type: object
      properties:
        name:
          type: string
          description: "The repository's name: the last component of its root."
        id:
          type: string
          description: "A digest of the root, so two processes can tell they mean one repository."
        branch:
          type:
            - string
            - "null"
          description: "The branch, when git could say."
        head:
          type:
            - string
            - "null"
          description: "The commit, when git could say."
        working_tree:
          type: string
          description: "`clean`, `dirty` or `unknown`."
      required:
        - name
        - id
        - working_tree
      description: "The repository the model is about, as git identifies it. No machine path: the model is\nserved and cached locally, but a projection of it may be published."
    KnowledgeResolution:
      oneOf:
        - type: string
          const: open
          description: Nobody has decided which side holds.
        - type: string
          const: accepted
          description: The baseline accepts it as known debt.
      description: Where a conflict stands.
    KnowledgeSearchResult:
      type: object
      properties:
        query:
          type: string
          description: The query.
        hits:
          type: array
          items:
            "$ref": "#/components/schemas/KnowledgeHit"
          description: "The hits, best first."
      required:
        - query
        - hits
      description: "The answer of `knowledge.search`."
    KnowledgeSemanticSummary:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the policy enables it.
        provider:
          type: string
          description: The provider the policy names.
        allow_remote:
          type: boolean
          description: Whether a remote provider is allowed.
        derived_claims:
          type: integer
          format: uint
          minimum: 0
          description: Derived claims in the model.
      required:
        - enabled
        - provider
        - allow_remote
        - derived_claims
      description: "The semantic layer, summarised."
    KnowledgeStatusReport:
      type: object
      properties:
        schema:
          type: string
          description: "`majordomus/knowledge/v1`."
        repository:
          "$ref": "#/components/schemas/KnowledgeRepositoryIdentity"
          description: The repository scanned.
        reference:
          "$ref": "#/components/schemas/KnowledgeReferenceInfo"
          description: What freshness is judged against.
        fingerprint:
          type: string
          description: "The model's fingerprint: content, not freshness."
        mode:
          "$ref": "#/components/schemas/KnowledgeMode"
          description: "The check's mode."
        baseline:
          "$ref": "#/components/schemas/KnowledgeBaselineSummary"
          description: The baseline.
        nodes:
          type: integer
          format: uint
          minimum: 0
          description: Nodes.
        claims:
          type: integer
          format: uint
          minimum: 0
          description: Claims.
        evidence:
          type: integer
          format: uint
          minimum: 0
          description: Evidence.
        relations:
          type: integer
          format: uint
          minimum: 0
          description: Relations.
        kinds:
          type: object
          additionalProperties:
            type: integer
            format: uint
            minimum: 0
          description: Nodes by kind.
        freshness:
          type: object
          additionalProperties:
            type: integer
            format: uint
            minimum: 0
          description: Nodes by freshness.
        provenance:
          type: object
          additionalProperties:
            type: integer
            format: uint
            minimum: 0
          description: Nodes by provenance.
        conflicts_open:
          type: integer
          format: uint
          minimum: 0
          description: Open conflicts.
        conflicts_accepted:
          type: integer
          format: uint
          minimum: 0
          description: Accepted conflicts.
        gaps:
          type: object
          additionalProperties:
            type: integer
            format: uint
            minimum: 0
          description: Gaps by category.
        coverage:
          "$ref": "#/components/schemas/KnowledgeCoverage"
          description: The coverage rows.
        check:
          "$ref": "#/components/schemas/KnowledgeCheckReport"
          description: "The check against the baseline, in the policy's mode."
        canonicality:
          "$ref": "#/components/schemas/CanonicalitySummary"
          description: "The canonicality audit, summarised."
        semantic:
          "$ref": "#/components/schemas/KnowledgeSemanticSummary"
