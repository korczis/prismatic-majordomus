  - "Changing which commits mj_git_touched walks: the first-parent, no-merges, foreign-trunk rule of lib/common.sh:470-525 stays as cases 108 and 108b prove it"
  - "Refusing layer paths outside the scope: they stay admitted"
  - "Recording an explicit commit for plan evidence (item 1 of the same OSCILLA list)"
  - "OSCILLA itself: it is the evidence, read only"
depends_on: []
serves: []
