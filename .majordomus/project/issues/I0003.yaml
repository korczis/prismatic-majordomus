id: I0003
milestone: M000
title: Implement the model loader and the status derivation engine
slug: derivation-engine
priority: p0
profile: deep-work
parallel_safe: false
objective: "Load every canonical file into one normalised model and derive issue and milestone status from recorded facts, in exactly one implementation that every surface calls."
why: "Four surfaces need to know what is READY. Four implementations of READY is four answers. One engine is the whole architecture."
current_state: "Nothing read the canonical files."
desired_state: "lib/project.sh loads the files, lib/project.awk derives the model, and the CLI, the site generator and the GitHub adapter all read that model."
scope:
  - lib/project.sh
  - lib/project.awk
non_scope:
  - Any status field a human can set directly
depends_on:
  - I0002
acceptance_criteria:
  - Issue status is derived from started_at, verified_at, completed_at, cancelled, evidence coverage and dependency state
  - Milestone status is derived from its issues and its own evidence
  - The active milestone is derived from order and status, not declared
  - A completed issue whose required evidence is missing derives VERIFY, not DONE
validation:
  - bash test/run.sh 29_project_status
evidence_required:
  - status_test
risk: "bash 3.2 has no associative arrays; the graph work is done in awk, which does."
created_at: 2026-09-04
updated_at: 2026-09-04
