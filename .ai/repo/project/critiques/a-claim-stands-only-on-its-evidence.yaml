intent: a-claim-stands-only-on-its-evidence
reviewed_at: 707a04c7ce8
reviewed_by: "claude-code subagent (read-only, fresh context, Plan type, same model family as the author) dispatched by session 82f2734c over the staged records of branch docs/the-chatgpt-project-is-promoted and the ChatGPT-conversation sources they were promoted from; resolved by a second fresh subagent acting as the plan author. Read only: nothing was run. Disposition: Accept with required changes: all 6 blocking findings are planned (I3110, I3111, I3112, I3113, I3117, with criteria rebound in I3119 and I3120); of the 4 non-blocking, 3 are planned and 1 is left open for the owner (the serves edges need new intent criteria or issues moved to other intents)."
findings:
  - id: command-criteria-can-never-be-met
    class: delivery_verification
    subject: "a-claim-stands-only-on-its-evidence#proof-from-ci-runs"
    finding: "Five of the seven criteria (proof-from-ci-runs, delivery-dimensions-computed, bypass-observed, critical-predicates-mutated, public-text-true) are `evidence: command` with ref `majordomus intent explain a-claim-stands-only-on-its-evidence`, in the staged intent at lines 27-44. share/schemas/majordomus/intent/intent.v1.schema.json:109 says a `command` criterion \"is never counted as met\", so this intent can never be satisfied. The ref also points back at the intent itself. That is exactly what invariant 2 forbids (\"no surface types a verdict\"). The real proof of each criterion sits in prose inside the criterion text (\"planned proof: ... delivery/mod.rs tests\", \"scripts/ci/github-check cases\", \"docs/CLAIMS.yaml entry\"). Before any issue starts, each needs a `test` or `claim` ref to a named case or claim id that the serving issue creates (case_rule_refusal_ratchet, case_protection_drift_refused, delivery_test_dimensions_computed, mutation_run_recorded, readme_claims_bound), so the realization view can show which criterion each issue makes true. Small fix at the same time: criterion 1 says `rules report`, but `majordomus rules report` is not a shell subcommand. Only `majordomus-cli rules report --format json` exists; `--json` is refused."
    blocking: true
    resolution:
      state: planned
      issue: I3112
      because: "Verified: intent.v1.schema.json:109 says command criteria are never counted as met. A test or claim ref must name a case or claim that exists, so each criterion is rebound in the same commit as the issue that creates its proof, and each serving issue carries that rebinding as an acceptance criterion. I3112 rebinds proof-from-ci-runs to the new case carrying case_blocking_not_run_ratchet; the criterion's planned proof already names `majordomus-cli rules report --format json`. I3119 rebinds delivery-dimensions-computed to its delivery_test_dimensions_computed test. I3113 creates the docs/CLAIMS.yaml claim a-bypass-is-observed over the case carrying case_protection_drift_refused, I3114 adds the case carrying case_expedited_merge_accounted to it, and bypass-observed is rebound to that claim. I3120 creates the claim critical-predicates-are-mutated over the mutation_run_recorded record. I3117 rebinds public-text-true to claim readme_claims_bound. Until a criterion is rebound it stays command and reads never met, which is honest, and the intent as a whole cannot read met early. No case number is reserved here: each new case takes its number from scripts/case-numbers next when its issue starts, and announces it on the board."
  - id: test-criteria-read-met-before-any-work
    class: delivery_verification
    subject: "a-claim-stands-only-on-its-evidence#blocking-rule-shows-refusal"
    finding: "The two `test` criteria cite cases that are already in the tree and pass today: test/cases/125_rule_proof.sh and test/cases/18_doctrine_wiring.sh. As soon as CI records a run of either, blocking-rule-shows-refusal and validator-refuses-violation read met, with no refusal ratchet (I3110) and no violation fixtures (I3111) delivered. A ledger this intent wants to fill (I2786) makes that more likely, not less. validator-refuses-violation is also bound to the wrong test: I3111 builds a new case (validation says `<new case>`), and case 18 only proves that doctor notices a broken link. Each ref should name the new case that the serving issue adds and that fails today (for example a 35xx case from the I3100-I3299/3500-3599 block). Otherwise the intent turns green for the very thing it says is a false proof."
    blocking: true
    resolution:
      state: planned
      issue: I3110
      because: "Verified: case 125 carries only '# majordomus-negative: rules' and case 18 carries 'doctrine doctor'. Both pass on master today, and ADR 0188 says case 18 stays the wiring verifier's proof, not a rule's. The plan no longer binds either criterion to those cases: blocking-rule-shows-refusal and validator-refuses-violation are written as command criteria that name their planned proof, so neither can read met before its work lands. I3110 adds the case carrying case_rule_refusal_ratchet, which fails on 707a04c, and the same commit rebinds blocking-rule-shows-refusal to it. I3111 adds the case carrying case_every_validator_refuses_its_violation and does the same for validator-refuses-violation; its validation now runs case 18 and plan validate instead of a `<new case>` placeholder. Each case number comes from scripts/case-numbers next when the issue starts."
  - id: negative-header-is-command-vocabulary
    class: unproven_assumption
    subject: "I3110"
    finding: "current_state says rules/mod.rs reads the negative header \"(lines 21-34, NEGATIVE const at 126)\". It does not: those lines are in apps/majordomus-cli/src/evidence/subject.rs:21 and :126. More important, `# majordomus-negative:` already has a meaning: a failure mode of a public command, gate:, script:, workflow: or capability:. lib/commands.sh:216-229 and scripts/ci/command-furnished:71 read it that way, and mj_covers_resolve refuses any other prefix as \"an unknown vocabulary\" (lib/commands.sh:186-188). Only the first negative line of each file is read. So \"carries a negative header\" says nothing about the rule: 125 says `negative: rules` and 99_adr says `negative: adr doctor`, and both would count as showing a refusal for any rule that names them. A `rule:<id>` word would make doctor and case 31 fail. The issue needs to decide how a case declares the rule it refuses (a new `rule:` vocabulary in mj_covers_resolve, or a separate header). It also needs lib/commands.sh, scripts/ci/command-furnished, evidence/subject.rs and the scripts/generate-site-data:580-589 parser in scope. Without that, the ratchet counts the wrong relation."
    blocking: true
    resolution:
      state: planned
      issue: I3110
      because: "Verified in lib/commands.sh:186-188 and 216-229. Decision: a case names the rule it refuses with a separate header, '# majordomus-refutes: <rule-id>'. Every such line is read, not only the first. '# majordomus-negative:' keeps its command vocabulary and does not count as rule proof, so doctor, case 31 and command-furnished stay unchanged. The parsers that must ignore or read the new header are now in scope. I3110's objective, current_state and acceptance criteria are rewritten to the refutes header, and ADR 0188's decision names that header."
  - id: tracked-ledger-invariant-contradicts-ci-proof
    class: unproven_assumption
    subject: "I3112"
    finding: "Invariant 2 says proof states come \"from the tracked ledger at the presented revision\". Criterion proof-from-ci-runs says they read \"the executions CI recorded\". The tracked ledger holds 14 local runs, the newest 2026-09-17 (I2786.why). I2786 brings the CI ledger only into the Pages ui-snapshot job (scripts/pages evidence --ledger-out), not into the tracked tree, and f6's staged I2968 keeps the CI ledger out of the tracked tree. rule-proof-check runs in the `structure` job (.ai/repo/ci/gates.yaml:301-303), which runs no suite and so has no executions. So I3112's \"a rise in blocking not_run on master fails the gate\" will either always measure 156/187 not_run from the tracked ledger, or turn red on unrelated pull requests as old runs go stale. Depending on I2786 does not fix this. The plan has to say which ledger the gate reads, in which job, and that the ratchet compares one revision's own run (or the recording branch, I1954, which is BLOCKED), and then restate the invariant. I3110 and I3112 also both rewrite scripts/ci/rule-proof-check, the rules module and case 125, adding two new ratchets, with no order between them."
    blocking: true
    resolution:
      state: planned
      issue: I3112
      because: "Verified: gates.yaml:301-303 runs rule-proof in the structure job, and validate.yml:834 runs scripts/ci/evidence-collect over the run's own suite. The not_run ratchet moves into the validate job after evidence-collect. It reads that run's own executions for its own head, ratchets only on a full-suite run (master or an integration top), and reports 'not read' when that ledger is absent. It never reads the stale tracked ledger. The structure-job check keeps only the static checks. Invariant 2 is restated in the intent to match this: proof states come from the executions recorded for the presented revision. I3112 now depends on I3110, so the two ratchets land in order in the same files."
  - id: protection-unreadable-with-actions-token
    class: unproven_assumption
    subject: "I3113"
    finding: "desired_state says \"every CI run that has a token proves that the protection still requires the verdict check\". github-check runs in .github/workflows/github.yml:145-152 with `GH_TOKEN: ${{ github.token }}`. forge.rs:1500 reads `repos/{repo}/branches/{base}/protection`, and GitHub serves that endpoint only to callers with administration rights, which a GITHUB_TOKEN cannot be given. Only `rules/branches/{base}` is readable with read access. As written, then, every CI run gets UNKNOWN (exit 13): either the gate is red for good, or exit 13 is tolerated and the bypass-observed criterion is never shown in CI. Before building, the issue must pick the credential and the job (a declared app or owner token on a schedule, or rulesets only) and handle the 'Branch not protected' and unreadable cases, which board item I2966 (\"an unreadable forge setting renders unknown\") also touches in forge.rs. I3114 has the same gap: \"no successful required check at merge time\" needs the set of checks required then, which neither the API nor this token can read after the fact."
    blocking: true
    resolution:
      state: planned
      issue: I3113
      because: "Verified: github.yml uses github.token, and forge.rs:1500 reads the classic protection endpoint, which needs administration rights. I3113 now reads rules/branches/{base} first, which the Actions token can read. It reads classic protection only where the credential allows. 403, 404 'Branch not protected' and absent are distinct typed readings, and none of them is pass. In CI, an unread classic protection is reported as not read (exit 13 is tolerated for that check only). The credentialed reading comes from the landing seat's own run of github-check under the owner's gh credential, recorded with its revision. A secret or a ruleset migration is the owner's act and is left out of scope. I3114 judges a merge against the verdict check that gates.yaml declared at the merge's parent tree, which is readable after the fact, instead of the forge's past setting. Coordinate with I2966 (in flight on another branch, not on master) on the board before editing forge.rs."
  - id: readme-correction-duplicates-in-flight
    class: unnecessary_work
    subject: "I3117"
    finding: "I3117 rewrites README.md:7 (\"lightweight\") and :20-21 (\"portable shell, and never invokes a model\") plus docs/LAUNCH.md:44,61. Two other issues target the same sentences. f6's staged I2971 (worktree docs/the-fleet-disk-is-watched; acceptance \"No hand-written page says the product is portable shell with no server\", scope README.md) does, and so does I3134 in this same import (milestone public-proof: the product sentence declared once, with README's bold line rendered from it, replacing the generate-site-data grep for '**A lightweight'). I3117 lists I2962/I2963 as overlaps but neither of these. Three issues editing the same lines will conflict, or one will undo another's change to a derived sentence. I3117 is also marked alpha_blocker: true, yet it is recorded on a records-only branch the board calls post-alpha, while the alpha is 2026-10-19, so the flag cannot be honoured as planned. Narrow I3117 to the model-invocation and override claims, cite I2971 and I3134, and either drop alpha_blocker or move it into the alpha batch."
    blocking: true
    resolution:
      state: planned
      issue: I3117
      because: "Verified: I3134 (this tree) owns the '**A lightweight' sentence, and I2971 (in flight on another branch, not on master) owns 'portable shell ... no server' in README.md:20 and getting-started. I3117 is narrowed in title, objective, scope and acceptance to the model-invocation clause (README.md:20-21, docs/LAUNCH.md:44,61) and the override sentence, with both other issues named in non_scope. Its alpha_blocker flag is cleared, and its why says it is post-alpha and does not gate v1.0.0-alpha.1."
  - id: readme-209-is-about-doctrine-dispatch
    class: unproven_assumption
    subject: "I3117"
    finding: "README.md:207-212 says that a doctrine class has \"no third class, no severity ladder, no baseline, and no override\". That describes dispatch in lib/doctrine.sh and lib/check.sh, which has no baseline or override path (grep finds none). The 16 *-baseline.txt files are CI ratchet gates, not doctrine classes. Replacing the sentence with \"16 ratchet baselines exist\" would make a true statement about dispatch confusing or false. The fix is to qualify which mechanism the sentence describes, with a case that would fail if a doctrine baseline appeared, not to declare the sentence false."
    blocking: false
    resolution:
      state: planned
      issue: I3117
      because: "Verified: README.md:207-212 describes how a doctrine class is dispatched. I3117 now qualifies the sentence as the doctrine dispatch of lib/doctrine.sh and lib/check.sh, distinct from CI ratchet baselines (I3116's table). It binds the sentence with a case that fails if either library gains a baseline or override path, and it does not replace the sentence with a baseline count."
  - id: rule-surfaces-not-in-scope
    class: surface_missing
    subject: "I3110"
    finding: "The intent says unproven claims read as not proven \"on every surface\" (invariant 3), but I3110's acceptance covers only CLI, MCP and HTTP, and I3112's \"published evidence view\" has no site path in scope. Rules are rendered by apps/majordomus-cli/src/ui/rule.rs and ui/governance.rs (/ui), by site/content/rules through scripts/generate-site-data, and by the cockpit. Today `rules report` gives every rule `satisfied: true` (coverage.satisfied 187) while 156 are not_run, and the field is easy to draw as a pass. f6's I2970 (staged) already edits ui/governance.rs and ui/evidence.rs to qualify these counts. No criterion tests invariant 3 at all. Add a criterion with a case over /ui, the snapshot and the site that fails when a not_run or stale rule is drawn as pass. Then either put those files in I3110/I3112 scope with refusal_shown rendered, or name I2970 as the carrier and depend on it."
    blocking: false
    resolution:
      state: planned
      issue: I3112
      because: "I3112 carries the rendering of rule state and refusal_shown on /ui/rule, /ui/governance, the snapshot and site/content/rules. A case fails when a not_run, stale or unknown rule is drawn as pass. The intent now has criterion unproven-never-reads-pass, written as a command criterion that names that case as its planned proof, and I3112 serves it and rebinds it when the case lands. I2970 keeps the count titles; it is in flight on another branch and not yet an issue on master, so it is cited in non_scope rather than added as a dependency."
  - id: issues-serve-criteria-they-cannot-make-true
    class: insufficient_work
    subject: "I3123"
    finding: "Several `serves` edges point at criteria the issue cannot satisfy. I3123 (finish admits verify commands by profile) serves blocking-rule-shows-refusal, which is about rules report and a refusal ratchet. Its scope also lacks share/allow/profile.txt, the allowlist that doctor checks profile keys against (line 23 lists only verify_command_required). I3126 (governance error rates, milestone cost-per-accepted-outcome) and I3115 (rules resting on proposed ADRs) serve bypass-observed, whose text covers only unauthorised merges and protection drift. Invariant 4's \"rule resting on a proposed ADR is reported\" has no criterion at all. I3116 (baseline table) serves public-text-true but checks no README sentence; its glob .ai/repo/*-baseline.txt also misses .ai/repo/ci/case-numbers-baseline.txt, ci/github-drift-baseline.txt and evidence/published-not-run.txt. I3124 and I3125 (JUnit and LCOV import from a foreign repository) serve proof-from-ci-runs, which is about this repository's CI on master; they belong to a-second-adopter-is-served. Either add the missing criteria (proposed-ADR queue, verify-command admission, error rates), or move these issues to the intents whose criteria they make true, so this intent's realization does not count work that proves none of its criteria."
    blocking: false
    resolution:
      state: open
      because: "Applied: share/allow/profile.txt is added to I3123, and the three missed baseline files to I3116. Invariant 4 already says a rule resting on a proposed ADR is reported, so the intent gains criterion proposed-adr-reported (a command criterion naming I3115's case as its planned proof), and I3115 serves it instead of bypass-observed. What remains is the owner's choice, because it changes what the owner's acceptance (c139#4) covers: I3123 (verify-command admission) still serves blocking-rule-shows-refusal, I3126 (error rates) still serves bypass-observed, I3116 (baseline table) still serves public-text-true, and I3124/I3125 (foreign JUnit and LCOV import) still serve proof-from-ci-runs rather than a-second-adopter-is-served. Each needs either a new criterion here or a move to the intent whose criterion it makes true. The finding is non-blocking, and leaving it open does not stop work on the criteria that are correctly served."
  - id: guard-table-waits-on-blocked-chain
    class: regression_risk
    subject: "I3118"
    finding: "I3118 depends on I2735 (BLOCKED, \"An edit no claim covers is refused\"), which is blocked by I2289 (BLOCKED). I3118 is meant to document and table-test what guard.rs lets through now (15 tests), and to remove public sentences saying every unclaimed edit is refused. That is a public-text-true fix with no need for I2735. Chained this way, the false description stays public until two blocked features land, and the table would describe I2735's future behaviour rather than master's. Drop the dependency, write the table for master's guard.rs, and let I2735 add rows when it lands."
    blocking: false
    resolution:
      state: planned
      issue: I3118
      because: "Verified: I2735 depends on I2289. I3118 now says its table states the decisions master's guard.rs makes at the commit the issue starts from, and I2735 adds rows when it lands. The depends_on edge to I2735 is removed from I3118."
