        - status
        - severity
        - frequency
        - audiences
        - areas
        - signals
        - examples
        - responsibilities
        - backlinks
        - similar
        - related_detail
        - neighbours
      description: "One moment in full, with everything derived that a page shows and no file states."
    MomentRef:
