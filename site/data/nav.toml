# Site navigation: four top-level user intents and one call to action. Rendered by
# templates/partials/navbar.html as the bar's menus — one list per group, a dropdown on a wide
# screen and an accordion inside the collapsed menu on a narrow one — and by
# templates/partials/footer.html as the site map every page ends with. Every href must
# resolve; scripts/site-check verifies it, and scripts/ci/nav-check verifies that no href is
# written twice and that every projection of this file derives from it.
#
# # The bar and the map
#
# An item marked `bar = true` is one of the few its group shows in the bar; every item, marked
# or not, is in the footer's site map, and each menu ends with a link to its group there. The
# bar once rendered all of this file twice (a dropdown and a flat mobile list) and the footer
# a third time: a hundred and four links inside <nav> on every page, and a menu a visitor had
# to read like an index. The bar is for the questions a visitor arrives with; the map is for
# finding a page whose name they already know.
#
# An item may name a `surface`: the id of a web surface (docs/generated/web.json). The bar then
# leads to the published copy of that surface when the publication holds one, labelled as a
# snapshot, and to the item's `href` — the page about it — when it does not. The site map
# always lists the `href`. No mount is written in this file.
#
# One item may be marked `primary = true`: the product itself. The bar then also shows it as a
# link of its own beside the call to action on a wide screen, and above it inside the collapsed
# menu on a narrow one, led by the same rule as its menu entry — the published copy when the
# publication holds one, the page about it otherwise. It is the same item, rendered from this
# one declaration, so no href is written twice; a visitor who came for the product does not
# have to open a menu to find it.
#
# Nothing here enumerates a feature, a domain, a module, a capability or a command: those
# routes are the generator's, and site-check refuses a feature route named by hand here.
#
# # Why four
#
# A navbar is not a sitemap. It carries the top-level questions a visitor arrives with, in the
# order they arrive with them, and this file once carried nine categories that answered a
# different question each — a visitor had to know this repository's internal ontology before
# they could find anything, which is the reader doing the information architecture's job.
#
#   Product        what it does, what it controls, and for whom    evaluate.capabilities
#   How it works   how the system actually behaves                 understand.system
#   Evidence       why I should believe any of it                  verify.system
#   Docs           how I use it, and what everything is            use.system
#   [Get started]  an action, not a category                       adopt.start
#
# The challenge opens Evidence: it is the question a visitor from a link arrives with — "show
# me it doing something" — answered with a recorded run rather than a description, and the
# homepage's first call to action already leads to it. Why opens Product's second line: the
# failure modes are the reason the product has the shape it has. Neither is a category of its
# own, so neither is a top-level entry; both stay one click from every page.
#
# Two pages left the navbar rather than moving: /docs/extraction-report/ records how
# DESIGN.md was derived in the design phase, and /docs/economics/ is the methodology behind
# the economics page rather than a page of its own. Both are reachable from /docs/ and neither is
# a question a visitor arrives with. Not every page deserves a place in the navbar.

[[groups]]
label = "Product"
href = "/domains/"
items = [
  { label = "The product, by domain", href = "/domains/", bar = true },
  { label = "Why it exists: the failure modes", href = "/why/", bar = true },
  { label = "Features", href = "/features/", bar = true },
  { label = "Features against interfaces", href = "/features/matrix/" },
  { label = "Use cases", href = "/use-cases/", bar = true },
  { label = "Applications", href = "/applications/" },
  { label = "Skills", href = "/skills/" },
  { label = "What it supervises", href = "/supervises/" },
  { label = "Product UI", href = "/docs/majordomus-ui/", surface = "ui", bar = true, primary = true },
  { label = "Cockpit", href = "/docs/cockpit/", bar = true },
]

[[groups]]
