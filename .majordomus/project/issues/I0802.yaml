    command: "bin/majordomus doctor"
    result: "exit 0. CONCEPTS.md gains session and envelope to the vocabulary and a section naming what each of the three possible collapses loses; SCHEMAS.md documents the open record and the immutable closed record with the full field list, the filename grammar and the four properties it carries, and a table giving the identity used for each reference kind with the two weak ones marked as weak; CONTINUITY.md adds the seventh kind, the envelope-not-narrative rule, the derivation rule with the rejected alternative, and what a session is not"
