id: a-bounded-task-is-carried-to-accepted-work
title: "A bounded task is carried to accepted work: one integration map of the cycle, each break owned by an existing issue and closed by a case"
slug: a-bounded-task-is-carried-to-accepted-work
order: 523
priority: p1
problem: "The owner's integration mission of 2026-10-30 asks that a person states a bounded task and the existing Majordomus carries it through one cycle: intent, verifiable criteria and authority, relevant context and existing work, a bounded task and its coordination, implementation, independent verification by risk, integration and deployment where the task's contract requires them, acceptance on current evidence, and a handover with a usable lesson, inside the overhead budgets of its section 10. Two real passes walked that cycle on 2026-10-30. Session 98 ran a stranger fixture (a three-file Python repository, an off-by-one in calc.mean and its regression test) through the installed 1.0.0-alpha.8: a failing test, an out-of-scope change and uncommitted work were refused correctly and a handover resolved for a new session key, but evidence over an empty input set never went stale, completed was accepted over uncommitted work, task.finished named the pre-fix head and doctor took 58.7 s against a 20 s budget. Session f3 ran the in-repo pass on master 51b38035a71 by taking I4292: plan next took 118 s and proposed I0703, which its own record says is blocked; plan start took 346 s, opened no task and named a Rust issue next on a machine below the build floor; start --issue carried none of the issue's evidence; check took 93 s and read 50 never-reported gates as INFO. OSCILLA's adopter dossier (oscilla-b0) and the P00 audit added the review relay, delegated work, the doctrine principle and knowledge edges. Each break, and each step the passes showed working, is one row of the map below; the rows are this milestone's acceptance criteria, each naming the user step, its state, the gap, the existing owner and the proof that will show it closed."
outcome: "Every row reads wired with its proof run: each break is closed in the owner it names by the smallest change that unblocks its user step, with a case that fails before the change, and the stranger fixture and the in-repo pass, run again, reach acceptance with no hand-written state and no step outside its budget."
scope:
  - "lib"
  - "apps/majordomus-cli/src"
  - "share"
  - "docs"
  - "test/cases"
  - ".ai/repo/project"
non_scope:
  - "A new orchestrator, graph, database, registry, command family or dashboard (mission section 1)"
  - "The external fixture harness, owned by the peers that run it (mission section 11)"
  - "Findings the passes made that break no step of the cycle and have no owner (F5 false WARN on sessions/README.md, F9 integration silently not_applicable with no CI model, F10 start --help on evidence): triaged apart, not bundled (mission section 3)"
acceptance_criteria:
  - "intent: unverified — neither pass declared an intent (the stranger start needed no --intent or --issue and the in-repo pass began at plan next), so whether a person's words reach the task's criteria was not observed — owner I3280, I2001 — proof case 960 and case 388"
  - "criteria/authority: missing — doctrine show prints a blank principle because lib/doctrine.sh:42 never parses one, and 13 of 50 dispatched rules name no principle although README.md:195,205 says every enforced rule does — owner I4465 — proof case 4465"
  - "criteria/authority: exists-unwired — init appends an AI agents section to README.md without saying so (lib/init.sh:372, while lib/init.sh:42 says it installs nothing) and leaves both hooks to the person (lib/init.sh:212-216), so doctor FAILs until they are written by hand — owner I3128, I4265, I3321 — proof case 4265 and the init case I3128's amendment names"
  - "criteria/authority: exists-unwired — following a release in an adopter is the owner's launcher flip and nothing names that step: the stranger fixture ran alpha.8 while alpha.9 was released, and OSCILLA learnt it only from the brief's version line — owner I1980, I2720, I2721 — proof case 1024"
  - "context/existing work: missing — plan next proposed I0703, whose current_state says it completes only when I4291 and I4292 land, because that blocker is prose and depends_on names only I0702 — owner I4463 — proof case 4463"
  - "context/existing work: exists-unwired — a curated note's file: reference to an ADR or a rule is dropped silently (lib/knowledge.awk:452), so knowledge record, knowledge related and entity show give 6, 3 and 0 references for one note and lessons never reach the context a task compiles — owner I3318, I3412, I4417, I0813 — proof the case I3318's amendment names"
  - "bounded task/coordination: duplicate — plan next prints plan start, plan start marks the issue ACTIVE and opens no task, and start --issue refuses without a description (lib/start.sh:56), so one step has two entry points and the pass needed both (346 s and 147 s) — owner I2974, I2972, I3983, I2004, I2001 — proof case 3368, case 3367 and case 962"
  - "bounded task/coordination: exists-unwired — start --issue takes neither the issue's evidence_required nor the obligations its paths imply into the task, so check reports them as INFO and finish would accept without them unless --requires is typed by hand — owner I4433, I2001 — proof case 880 and case 960"
  - "bounded task/coordination: missing — ready work is ranked by wave, priority and id only (apps/majordomus-cli/src/plan.rs:573-579, lib/project.sh:268-274), so with 26 GiB free plan start named the Rust issue I4291 next — owner I4464 — proof case 4464"
  - "implementation: duplicate — a running task's scope cannot widen, so two OSCILLA builders closed their tasks and started new ones and the in-repo pass grew I4292's scope by hand for case 980 and docs/CLI.md, while I2114 (scope widen) and I4260 (scope add) plan the same command — owner I4260, I2114 — proof case 4260"
  - "verification: wired — a failing regression test is refused with its command, its exit and the command that reproduces it (rule majordomus.verification-integrity), as the stranger fixture showed (N1) — owner the rule, no issue — proof case 06 and case 572"
  - "verification: wired — a change outside the task's scope is refused by path with the command that reproduces it (rule majordomus.scope-integrity), as the stranger fixture showed (N2) — owner the rule, no issue — proof case 06 and case 04"
  - "verification: wired — finish --outcome completed is refused when the profile requires --verify-command and none is given (rule majordomus.verification-integrity), as the stranger fixture showed (N5) — owner the rule, no issue — proof case 06"
  - "verification: missing — an obligation whose inputs resolve to no tracked file compares an empty hash with an empty one and passes, so its evidence never goes stale in an adopter (apps/majordomus-cli/src/capability/builtin/obligations.rs:683, lib/evidence.sh:457-459) — owner I4460 — proof case 4460 and its mutation"
  - "verification: exists-unwired — a red test the trunk shares reads as each task's own defect (nine OSCILLA tasks refused for one wall-clock test), because finish runs the verify command once with its output discarded (lib/finish.sh:199) — owner I4413, I3313 — proof case 4413"
  - "verification: missing — use-case coverage of 0 of 30 targets prints OK (lib/usecase.sh:1006) whenever the policy requires no target, so zero coverage reads as green — owner I4462 — proof case 4462"
  - "verification: exists-unwired — check lists 50 required gates that never reported as INFO and prints 0 failing (lib/gates.sh:265-271), so a pass reads green while nothing ran — owner I4433, I4268 — proof case 880 and case 4268"
  - "verification (independent review): missing — a mesh review answer names no head and no base (apps/majordomus-cli/src/mesh/journal.rs:661-671), so OSCILLA relayed six verdicts by hand and #253's verdict went stale on a merge of main with no signal — owner I4466 — proof case 4466"
  - "integration/deploy: exists-unwired — task.finished records the start head and the verified tree, not the commit that carried the fix (lib/finish.sh:131; stranger fixture head 8147f81, fix 44efcba8), so the verified revision is not linked to the accepted one — owner I4411, I4410, I4413 — proof case 4411 and case 4410"
  - "integration/deploy: exists-unwired — released is not installable: the next pages deploy removed v1.0.0-alpha.9.json, install.sh refuses that version and adopters stay on alpha.8 — owner I3448 — proof the case I3448's amendment names"
  - "acceptance on evidence: wired — the commit obligation refuses completed while files the task touched are uncommitted (rule majordomus.obligation-closure), as the stranger fixture showed (N5) — owner the rule, no issue — proof case 103"
  - "acceptance on evidence: exists-unwired — finish --outcome completed accepts uncommitted work when the task declares no commit obligation and says completed, not verified and unintegrated, and #2748 refuses only under verification.completed_means_complete, which ships false — owner I4433, I3259, I3381, I3986 — proof case 880"
  - "handover/lesson: wired — a handover written by one session resolves for a new session key with its task, objective and next action (same_worktree_same_branch), as the stranger fixture showed (S1) — owner rule majordomus.handover-integrity, no issue — proof case 05 and case 388"
  - "handover/lesson: missing — handover --resolve prints Git state exact over a tree changed since the handover, because it compares HEAD (lib/handover.sh:147, lib/common.sh:458) and the clean or dirty word (lib/handover.sh:158) only — owner I4461 — proof case 4461"
  - "handover/lesson: missing — a handover carries one task (lib/handover.sh:74), not the subagents, peers, review requests and runs its writer delegated, so a coordinator resumed after a usage limit rebuilt that state by hand — owner I4467 — proof case 4467"
  - "handover/lesson: exists-unwired — the briefing calls a finished task 26 days old Active, and doctor's stranded-episode FAIL names session list instead of the command that recovers it — owner I4416 — proof case 4416"
  - "speed (section 10): exists-unwired — doctor re-validates the shipped skeleton on every run (about 73 s of 83 s in the stranger fixture, 58.7 s against a 20 s budget, 36 s to 133 s in OSCILLA) and the commit hook pays it on every commit — owner I0828, I3299, I3127 — proof case 83 with the skeleton pinned by content hash"
  - "speed (section 10): exists-unwired — plan next, plan start and check took 118 s, 346 s and 93 s in the in-repo pass and MJ_TIMING prints no phase on their path (lib/plan.sh and lib/check.sh never read it), so no budget can be enforced there — owner I3299, I3161, I0822, I0840 — proof case 83 extended to plan next and check"
  - "the five untracked verbatim pastes under .ai/repo/project/intents/ of the primary checkout re-enter as campaigns through the paste skill, then the raw pastes are removed (owner decision 2026-10-30)"
