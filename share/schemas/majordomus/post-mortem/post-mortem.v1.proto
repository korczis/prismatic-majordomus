// A post-mortem under .ai/repo/post-mortems/.
//
// One record per cause that turned the trunk's CI red: which runs failed, what failed in
// them, why, which parts of the repository the cause lives in, what fixed it and what now
// stops it from coming back. It is the answer the rule
// `project.a-ci-failure-has-a-post-mortem` asks for, and the data `majordomus postmortem
// diagnose` matches a new failure against: the `signals` of every record are what a
// failing log is searched for.
//
// Canonical. `majordomus generate` projects this file into share/allow/post-mortem.txt,
// share/sections/post-mortem.txt and post-mortem.v1.schema.json beside it.

syntax = "proto3";

package majordomus.post_mortem.v1;

import "majordomus/options.proto";

option (majordomus.schema_id) = "majordomus.post-mortem/v1";
option (majordomus.allow_list) = "post-mortem";
option (majordomus.document_format) = "markdown";

// The whole record: the front matter, then the account in prose.
message Document {
  Header header = 1 [(majordomus.required) = true];
  Body body = 2 [(majordomus.required) = true];
}

message Header {
  option (majordomus.closed) = true;

  // The format version of this record. A version the tool does not know is refused, never
  // guessed.
  string schema = 1 [(majordomus.required) = true, (majordomus.const) = "post-mortem/v1"];

  // The identity: `pm-`, the day the failure was first seen, and a slug. It fixes the file
  // name and survives a retitle.
  string id = 2 [(majordomus.required) = true, (majordomus.pattern) = "^pm-[0-9]{8}-[a-z0-9][a-z0-9-]*$"];

  string kind = 3 [(majordomus.required) = true, (majordomus.const) = "post-mortem"];

  // What went wrong, in one line, as an assertion: the cause when it is known, the symptom
  // while it is not.
  string title = 4 [(majordomus.required) = true, (majordomus.min_length) = 1];

  // One line saying what a reader who meets the same failure should take from the record.
  string description = 5 [(majordomus.required) = true, (majordomus.min_length) = 1];

  Status status = 6 [(majordomus.required) = true];

  // The day the failure was first seen, YYYY-MM-DD.
  string date = 7 [(majordomus.required) = true, (majordomus.pattern) = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];

  // Every run this record answers. One cause can fail several runs, and each of them is
  // answered by naming it here; a record that names none answers nothing and is refused.
  repeated Run runs = 8 [(majordomus.required) = true, (majordomus.min_items) = 1];

  Cause cause = 9 [(majordomus.required) = true];

  // Where the cause lives, as references of the layer: `file:<repository-relative path>`,
  // `test:<path>`, or `<kind>:<identity>` for an object the layer holds (`rule:`, `adr:`,
  // `claim:`, `skill:`). Each is an edge of the graph, so the record is reached from the
  // page of every component it names. A reference must resolve while the record is not
  // `resolved`; a record that is `analysed` or `resolved` names at least one.
  repeated string components = 10 [(majordomus.pattern) = "^[a-z][a-z-]*:.+$"];

  // What the failure looks like from outside: text a failing log or a job's summary shows.
  // `majordomus postmortem diagnose` searches a failure for these, so a signal is the
  // shortest text that is this failure's and no other's.
  repeated Signal signals = 11;

  // What removed the cause: `commit:<sha>`, `pr:<number>`. Present exactly when the status
  // is `resolved`.
  repeated string fixed_by = 12 [(majordomus.pattern) = "^(commit:[0-9a-f]{7,40}|pr:[0-9]+)$"];

  // What now stops the cause from returning or shortens the next diagnosis, as references
  // of the layer: `test:<path>`, `file:<path>`, `rule:<identity>`, `issue:<id>`. Each must
  // resolve.
  repeated string prevention = 13 [(majordomus.pattern) = "^[a-z][a-z-]*:.+$"];

  repeated string tags = 14 [(majordomus.pattern) = "^[a-z][a-z0-9-]*$"];

  // What else of the layer the failure concerns, as `<kind>:<identity>`: the issue that
  // plans the follow-up, the milestone, the decision, the intent or the claim it touched.
  // Each must resolve, and each is an edge both ways: the issue's page names the record.
  repeated string related = 15 [(majordomus.pattern) = "^[a-z][a-z-]*:.+$"];
}

// draft: the failure is recorded and the cause is not yet established. analysed: the cause
// is established and named, with the components it lives in. resolved: the fix is on the
// trunk and `fixed_by` names it.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_DRAFT = 1 [(majordomus.value) = "draft"];
  STATUS_ANALYSED = 2 [(majordomus.value) = "analysed"];
  STATUS_RESOLVED = 3 [(majordomus.value) = "resolved"];
}

// One failed run of a workflow on the trunk.
message Run {
  option (majordomus.closed) = true;

  // The workflow's name as the forge reports it (`validate`, `pages`).
  string workflow = 1 [(majordomus.required) = true, (majordomus.min_length) = 1];

  // The forge's identifier of the run, as a string: it is an identity, never a quantity.
  string id = 2 [(majordomus.required) = true, (majordomus.pattern) = "^[0-9]+$"];

  // The commit the run judged.
  string commit = 3 [(majordomus.required) = true, (majordomus.pattern) = "^[0-9a-f]{7,40}$"];

  // The jobs that failed in it, by name.
  repeated string jobs = 4 [(majordomus.required) = true, (majordomus.min_items) = 1];

  // The step that failed, where one job failed in one step.
  string step = 5;
}

// Why it failed, as a class and one sentence. The prose is the body's; this is what a
// table, a count and a diagnosis read.
message Cause {
  option (majordomus.closed) = true;

  CauseClass class = 1 [(majordomus.required) = true];

  // The cause in one sentence. For `undetermined`, what is known and what was ruled out.
  string summary = 2 [(majordomus.required) = true, (majordomus.min_length) = 1];
}

// defect: the change under test was wrong. test: the test asserted something that was no
// longer, or never, true. race: the outcome depended on timing. gate: the gate judged
// something other than what it names. environment: the runner, a tool on it or the forge.
// dependency: something outside the repository changed. undetermined: not established —
// the only class a `draft` may carry, and one an `analysed` record may not.
enum CauseClass {
  CAUSE_CLASS_UNSPECIFIED = 0;
  CAUSE_CLASS_DEFECT = 1 [(majordomus.value) = "defect"];
  CAUSE_CLASS_TEST = 2 [(majordomus.value) = "test"];
  CAUSE_CLASS_RACE = 3 [(majordomus.value) = "race"];
  CAUSE_CLASS_GATE = 4 [(majordomus.value) = "gate"];
  CAUSE_CLASS_ENVIRONMENT = 5 [(majordomus.value) = "environment"];
  CAUSE_CLASS_DEPENDENCY = 6 [(majordomus.value) = "dependency"];
  CAUSE_CLASS_UNDETERMINED = 7 [(majordomus.value) = "undetermined"];
}

// One recognisable trace of the failure.
message Signal {
  option (majordomus.closed) = true;

  // The signal's name within the record, lower-case letters, digits and hyphens.
  string id = 1 [(majordomus.required) = true, (majordomus.pattern) = "^[a-z][a-z0-9-]*$"];

  // The text itself, matched as written, ignoring case.
  string text = 2 [(majordomus.required) = true, (majordomus.min_length) = 4];
}

// The body is the account a reader comes for when the same job is red again.
message Body {
  option (majordomus.body) = true;

  Section what_failed = 1 [
    (majordomus.heading) = "What failed",
    (majordomus.level) = 2,
    (majordomus.required) = true,
    (majordomus.non_empty) = true
  ];
  Section root_cause = 2 [
    (majordomus.heading) = "Root cause",
    (majordomus.level) = 2,
    (majordomus.required) = true,
    (majordomus.non_empty) = true
  ];
  Section fix = 3 [
    (majordomus.heading) = "Fix",
    (majordomus.level) = 2,
    (majordomus.required) = true,
    (majordomus.non_empty) = true
  ];
  Section prevention = 4 [
    (majordomus.heading) = "Prevention",
    (majordomus.level) = 2,
    (majordomus.required) = true,
    (majordomus.non_empty) = true
  ];
  // Optional: when it was seen, by whom, and how long the trunk stayed red.
  Section timeline = 5 [
    (majordomus.heading) = "Timeline",
    (majordomus.level) = 2
  ];
}

message Section {
  string heading = 1;
  uint32 level = 2;
  bool empty = 3;
}
