id: I0703
milestone: M002
title: Implement the decision and prove it holds
slug: implement-attribution
priority: p1
profile: debugging
parallel_safe: false
objective: "Implement whatever I0702 decided across every command that writes a durable record, and turn the characterisation case into one that asserts the new behaviour."
why: "A defect is fixed when the case that reproduced it goes from describing the gap to describing the guarantee. Anything less leaves the next worker unable to tell which of the two the code is in."
current_state: "Started, not done. ADR 0164 was accepted on 2026-10-22 with the amendment that a task is related unless another episode that is still open opened it, and the shell half landed through train 5 (b0e33db797d, fixed in d078fb2309e). lib/common.sh prepares attribution once in mj_record_attribution: mj_open_session_id names the caller's own episode, an explicit identity with no open episode names none, and with no identity it names the one open episode or none; mj_task_opening_session and mj_session_is_open relate the active task unless a different live episode opened it. The six writers ADR 0164 names use it and pass the prepared session to mj_ledger_append: decision add (lib/decision.sh), question add and resolve (lib/question.sh), checkpoint (lib/checkpoint.sh), check --checkpoint (lib/check.sh), handover (lib/handover.sh) and knowledge observe (lib/knowledge.sh). Case 3049 asserts the guarantee for two real episodes under one $USER (it passed at 81ef931a3e1, 1/1 in 31.8 s); cases 111, 61 and 388 prove the per-provider episode and a task carried across episodes and providers; test/run.sh drops the provider session variables the lifecycle adapters declare, so a suite run from inside an agent no longer hands every case the host's session. Not every writer is covered, so criterion 1 is unmet: an adversarially verified audit at master 81ef931a3e1 (2026-10-28) found that the Rust ledger writer (apps/majordomus-cli/src/ledger.rs open_session_id, reached by every plan transition through plan.rs) still reads the session pointer, as do continuity publish (continuity/local.rs) and reasoning record (reasoning/store.rs takes the task with no opener check) - I4291; and that session close, finish, evidence, gate and the mesh join still attribute to the checkout's task, while knowledge observe refuses without naming a rule - I4292. The DONE stamped on 2026-10-26 was withdrawn on the owner's word on 2026-10-28; this issue completes when I4291 and I4292 have landed and the suite and doctor evidence is taken again."
desired_state: "Every command that writes a durable record follows the decision, the case asserts the new behaviour, and a refusal — if that is what was chosen — names the rule that refused and what to run instead."
scope:
  - lib
  - share
  - test/run.sh
  - test/cases/3049_a_second_workers_record_lands_on_the_first_workers_task.sh
non_scope:
  - Any behaviour the decision did not choose
depends_on:
  - I0702
acceptance_criteria:
  - Every command that writes a durable record is covered, not only decision
  - The case from I0701 asserts the guarantee rather than the gap
  - A refusal names the rule and the command that resolves it
  - If a refusal is enforced, the rule that carries it names an x-majordomus validator and doctor proves it reaches its command
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
  - doctor
risk: "Three commands share this resolution path; fixing one and not the others leaves a defect that looks fixed, which is worse than one that looks broken."
