hatgpt-mermaid-\\_r_12r\\_ .image-shape p{background-color:rgb(252, 252, 252);padding:2px;}#chatgpt-mermaid-\\_r_12r\\_ .icon-shape .label rect,#chatgpt-mermaid-\\_r_12r\\_ .image-shape .label rect{opacity:0.5;background-color:rgb(252, 252, 252);fill:rgb(252, 252, 252);}#chatgpt-mermaid-\\_r_12r\\_ .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#chatgpt-mermaid-\\_r_12r\\_ .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#chatgpt-mermaid-\\_r_12r\\_ .node .neo-node{stroke:rgb(83, 154, 248);}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].node rect,#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].cluster rect,#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].node polygon{stroke:url(#chatgpt-mermaid-\\_r_12r\\_-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].swimlane.cluster rect{filter:none;}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].node path{stroke:url(#chatgpt-mermaid-\\_r_12r\\_-gradient);stroke-width:1px;}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].node .neo-line path{stroke:rgb(83, 154, 248);filter:none;}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].node circle{stroke:url(#chatgpt-mermaid-\\_r_12r\\_-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].node circle .state-start{fill:#000000;}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].icon-shape .icon{fill:url(#chatgpt-mermaid-\\_r_12r\\_-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#chatgpt-mermaid-\\_r_12r\\_ [data-look=\"neo\"].icon-shape .icon-neo path{stroke:url(#chatgpt-mermaid-\\_r_12r\\_-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#chatgpt-mermaid-\\_r_12r\\_ .node text{font-size:14px;font-weight:600;letter-spacing:normal;fill:rgb(65, 65, 65);}#chatgpt-mermaid-\\_r_12r\\_ .edgeLabels text{font-size:13px;font-weight:600;letter-spacing:-0.08px;fill:rgb(65, 65, 65);}#chatgpt-mermaid-\\_r_12r\\_ .node tspan[font-weight=\"normal\"],#chatgpt-mermaid-\\_r_12r\\_ .edgeLabels tspan[font-weight=\"normal\"]{font-weight:600;}#chatgpt-mermaid-\\_r_12r\\_ .edgeLabel .label rect{opacity:1;rx:13px;ry:13px;fill:rgb(252, 252, 252);stroke:rgb(219, 219, 219);stroke-width:1px;}#chatgpt-mermaid-\\_r_12r\\_ .node rect,#chatgpt-mermaid-\\_r_12r\\_ .node circle,#chatgpt-mermaid-\\_r_12r\\_ .node ellipse,#chatgpt-mermaid-\\_r_12r\\_ .node polygon,#chatgpt-mermaid-\\_r_12r\\_ .node path{fill:rgb(243, 243, 243);stroke:rgba(0, 0, 0, 0.1);stroke-width:1px;}#chatgpt-mermaid-\\_r_12r\\_ .node rect{rx:16px;ry:16px;}#chatgpt-mermaid-\\_r_12r\\_ .node.mermaid-decision .label-container{fill:rgb(249, 249, 249);stroke:rgb(219, 219, 219);stroke-dasharray:2,2;}#chatgpt-mermaid-\\_r_12r\\_ .edgePaths .flowchart-link{stroke:rgb(143, 143, 143);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;}#chatgpt-mermaid-\\_r_12r\\_ .marker{fill:rgb(143, 143, 143);stroke:rgb(143, 143, 143);}#chatgpt-mermaid-\\_r_12r\\_ :root{--mermaid-font-family:-apple-system-body,ui-sans-serif,-apple-system,system-ui,\"Segoe UI\",Helvetica,\"Apple Color Emoji\",Arial,sans-serif,\"Segoe UI Emoji\",\"Segoe UI Symbol\";}Intent + acceptance criteriaDerived issues / wavesUI start / verify / doneExecution eventsEvidence + provenanceVerified intent standing\n\nCílový průchod, který musí být doložen end-to-end testem.\n\nPo landingu 71a už bude základní `#1307` obsažen v `master`. Pak lze správně aktualizovat a integrovat:\n\n[#1341](https://github.com/korczis/prismatic-majordomus/pull/1341?utm_source=chatgpt.com) → [#1342](https://github.com/korczis/prismatic-majordomus/pull/1342?utm_source=chatgpt.com) → [#1348](https://github.com/korczis/prismatic-majordomus/pull/1348?utm_source=chatgpt.com).\n\nAcceptance test, který požaduji:\n\nV UI vytvořit nebo vybrat testovací intent, zobrazit jeho issues a závislosti, spustit povolený přechod, vidět změnu bez ručního reloadu, ověřit issue skutečným testem a zobrazit reprodukovatelnou evidence spolu s vysvětlením výsledného stavu.\n\nA to vše nad jedním konkrétním commitem, nikoli s testy z jiného checkoutu.\n\nKdyž tento průchod funguje, máš produktově přesvědčivější demonstraci než dalších dvacet capabilities.\n\n## Fáze 4: Mesh compute nechat experimentální\n\nBrowser compute je technicky zajímavý, ale pro pondělní alpha bych ho nedával na kritickou cestu.\n\nKonkrétně:\n\n- [#1309](https://github.com/korczis/prismatic-majordomus/pull/1309?utm_source=chatgpt.com): opravit generování Docker dependency stage, které selhává na `majordomus-core`.\n- [#1343](https://github.com/korczis/prismatic-majordomus/pull/1343?utm_source=chatgpt.com): zachovat server-side verification.\n- [#1345](https://github.com/korczis/prismatic-majordomus/pull/1345?utm_source=chatgpt.com): ponechat browser Worker jako experimentální výpočetní demonstraci.\n- Scheduler, browser enrollment, trust a resource budgeting řešit jako další vývojovou etapu.\n\nNedávat na web tvrzení, že návštěvník už může automaticky přispívat výkonem do meshe. To zatím není prokázané.\n\n## Jak bych řídil zbývající backlog\n\n## Rozdělení práce pro nejbližší integrační cyklus\n\nLanding\n\nBatch 71a, CI, merge, ancestry, cleanup\n\nRelease safety\n\nBuild, prerelease, evidence, MCP, freshness\n\nIDD\n\nWorkspace, transitions, events, verification\n\nMaximálně tři aktivní integrační proudy. Ostatní PR zůstávají v backlogu bez nového rozšiřování scope.\n\nStarší PR bych rozdělil podle výsledku Git ancestry a obsahu do čtyř stavů: land, rebase, superseded, still required. To by mělo být odvoditelné a auditovatelné z již existujících capability a plan dat.\n\nŽádné masové zavírání jen proto, aby počet PR vypadal hezky.\n\n## Rozhodnutí pro alpha\n\nZa mě je důvěryhodná alpha ta, která bezpečně zvládá základní kontrakty:\n\n- čistou instalaci i odinstalaci,\n- připojení AI klienta k dozorové vrstvě,\n- scoped task a odmítnutí neověřeného dokončení,\n- konzistentní evidence a stav projektu,\n- bezpečnou izolaci alpha releasu od stable,\n- zelený CI běh nad přesným vydávaným commitem.\n\nIDD bych do releasu zahrnul, pouze pokud projde svým integrovaným end-to-end testem. Pokud ne, může alpha vyjít bez jeho nedokončených částí. Totéž platí dvojnásob pro compute.\n\n## Co bych teď nedělal\n\nNeotvíral bych nové implementační fronty pro WebRTC, STUN/TURN, Fast Flux, lokální LLM adaptéry, další dashboardy ani autonomní evolve orchestration.\n\nVšechny tyto směry mohou dávat smysl. Ale před alpha by jejich rozpracování znamenalo další riziko, nikoli dokončení.\n\n## Můj konečný rozkaz pro nejbližší cyklus\n\n# Integrate → Verify → Release\n\nPrimární cíl: důvěryhodný `v1.0.0-alpha.1`.\n\nPrvní akce: dokončit a vyhodnotit CI batch 71a.\n\nDruhá akce: uzavřít provozní a release P0 problémy.\n\nTřetí akce: integrovat IDD end-to-end, pokud to neohrozí release.\n\nČtvrtá akce: vydat alpha s přesně deklarovanými schopnostmi a omezeními.\n\nMajordomus má nyní dostatečné množství architektury, subsystémů i hotové práce. Největší návratnost už nepřinese nový nápad, ale snížení integračního dluhu a prokázání, že celý systém funguje pod jedním kontraktem.\n\nA ještě jedna důležitá věc: jakmile alpha vyjde, začal bych měřit intent-to-verified-done, čas governance, spotřebu tokenů a rework na stejných úlohách s Majordomusem a bez něj.\n\nTím konečně prokážeš, zda projekt AI vývoj skutečně zlepšuje. Ne pouze zda dokáže organizovat vlastní vývoj."
