id: I3321
milestone: a-stranger-adopts-it-unaided
title: "In a foreign repository, the wired pre-push hook of the claude-code projection refuses what finish would refuse, through the installed release"
slug: the-pre-push-hook-refuses-in-a-foreign-repository
priority: p2
profile: implementation
objective: "Add to install-check's first-run stage a step in which the refusal is reached through the pre-push hook (finish --check) that the claude-code projection wires in the foreign fixture repository, so the refusal is shown to arrive on the path an agent's session takes, not only through commands the stage calls itself."
why: "Split from I3127 by the verification of 2026-10-18 (one worker, one issue, one pull request). The critique of a-stranger-adopts-it-unaided found that a scripted worker calling check and finish itself proves nothing about whether the projected hooks bring the refusal to an agent in the stranger's repository; the owner-accepted beta contract asks for at least one supported AI coding workflow. Sources: chatgpt-majordomus:c241#2, chatgpt-majordomus:c256#5, chatgpt-majordomus:c269#5, chatgpt-majordomus:c069#2, chatgpt-majordomus:c126#8."
current_state: "init wires the skeleton's hooks and prints hook advice (lib/init.sh); no case pushes from a foreign repository through an installed release and observes the hook refuse."
desired_state: "The stage pushes an unfinished change in the foreign fixture, the wired pre-push hook refuses it with the doctrine finish names, and the receipt records the step and says that a live agent session is not exercised."
