id: completion-is-proved
title: A development session is complete when the repository can prove it, and every surface reads the same proof
slug: completion-is-proved
version: "0.6"
order: 96
priority: p1
problem: "Done was stated in four places that could not disagree loudly - the policy's finish_requires selected the shell validators, share/obligations.yaml named the tokens a task owes, .ai/repo/ci/gates.yaml named the gates, and gates::done carried nineteen questions as a Rust literal - and the provider bootstraps restated it a fifth time in prose. The completion gate could never refuse: a gate that never reported left the task finishable, no gate run had ever been recorded, and choosing the outcome partial skipped every validator. The structural version analysis existed and the release workflow never ran it, so a tag was the one way past it. The deploy and verify obligations were declared unestablishable, nothing asked a live surface which commit it was serving, and a deploy command exiting 0 with the old revision still live was indistinguishable from a deployment."
outcome: "One completion policy, share/completion.yaml, is the definition of done. The completion report derives the lifecycle stage a task stands at from the answers to it, states whether the task is complete, and every surface - check and finish, the HTTP route, the MCP tool, the Cockpit, the generated section of every provider bootstrap, the site - reads that one report. The outcome completed is refused until the report says complete. The published site, the release metadata and every active deployment are asked what they serve and compared with what the trunk expects, and a stale or unreachable surface refuses. The release path runs the structural version gate."
current_state: "Measured on 2026-09-12 against master 3407ca2d4: gates.completion answered finishable: true with 34 required gates never reported and zero task.gate lines in any ledger; finish --outcome completed had never been refused by a gate; release.yml ran scripts/release-version --check and never scripts/ci/version-matches-surface; share/obligations.yaml declared deploy and verify with established_by: none; the live site had no verifier but a continue-on-error step in the Pages workflow; AGENTS.md and CLAUDE.md carried no definition of done and their templates duplicated prose by hand."
desired_state: "Completion is derived from evidence, refused when the evidence is missing, projected to every surface from one report, and verified against what is actually live. This repository's own sessions pass through it."
scope:
  - share/completion.yaml
  - share/obligations.yaml
  - share/providers
  - share/schemas
  - apps/majordomus-cli/src/gates
  - apps/majordomus-cli/src/deploy
  - apps/majordomus-cli/src/release
  - apps/majordomus-cli/src/capability/builtin
  - apps/majordomus-cli/src/providers.rs
  - apps/majordomus-cli/src/cockpit
  - lib
  - scripts/ci
  - .ai/repo/ci
  - .ai/repo/rules/project
  - .ai/repo/adrs
  - .ai/repo/providers
  - .ai/repo/policy.yaml
  - .github/workflows
  - docs
  - site
  - test/cases
non_scope:
  - Deploying the declared Fly.io application. The object stays declared; the report says so by name rather than pretending to verify it.
  - A second implementation of the completion judgement in any surface. Every surface reads gates.completion.
  - Turning on branch protection. A repository setting, and the operator's decision.
acceptance_criteria:
  - share/completion.yaml is the only declaration of what done means, and gates.policy answers it
  - finish --outcome completed is refused while the completion report says complete is false, naming each question owed
  - deploy.verify asks each applicable surface for its identity and refuses a stale or unreachable one
  - The release workflow runs the structural version gate before building an artifact
  - AGENTS.md and CLAUDE.md carry the definition of done as a generated fragment both renderers produce byte for byte
  - This repository's own session for this milestone passes through the lifecycle and records its evidence
validation:
  - bash test/run.sh 280_completion_is_proved
  - bash test/run.sh 281_deploy_verify_live
  - bash test/run.sh 282_tooling_is_derived
  - scripts/ci/version-matches-surface
evidence_required:
  - completed_is_refused_without_proof
  - a_stale_surface_refuses
  - the_bootstrap_fragment_is_derived
risks:
  - "A repository adopting the policy with no CI model and no built executable would be refused every completion; the validator reports the gap as unknown and the policy key completed_means_complete can be set false while the model is written."
  - "Live verification reaches the network. It reaches only addresses the repository declares, sends no header, and records no body beyond the fields compared."
created_at: 2026-09-12
updated_at: 2026-09-12
