id: I0813
milestone: M003
title: A closed session becomes a node that points at its episode
slug: session-knowledge-integration
priority: p1
profile: implementation
parallel_safe: false
objective: "Extract closed sessions as knowledge nodes whose edges point at the tasks, issues, checkpoints, handovers, decisions and questions they name, so that the graph answers which sessions touched an issue, which decisions affected it, and which handover continued a task — without any session body being copied anywhere."
why: "This is what makes the two halves of the milestone one thing. Temporal and causal navigation is what a worker actually wants from a prior session, and it is exactly the part that does not require reading the prose."
current_state: "The knowledge graph covers repository artifacts. Sessions exist as records that nothing traverses."
desired_state: "A session node carries its id, its window and its outcome; its edges carry the relationship and the session record they were observed in. Checkpoints, which are numerous and individually low-value, are represented as references from the session rather than as one node each, so that a high-volume record kind does not dominate the graph."
scope:
  - lib/knowledge.sh
  - lib/knowledge.awk
  - test/cases/71_session_knowledge.sh
non_scope:
  - Any inference about why a session touched something
  - Copying a session summary into a node
depends_on:
  - I0806
  - I0812
acceptance_criteria:
  - A query for an issue names the sessions that touched it, and each answer carries the session record it came from
  - A session node holds no body text from any record it references
  - A high-volume record kind does not produce one node per file where a reference list is sufficient, and the reason is stated
  - Sessions are operational scope and never shared, proved by a case
validation:
  - bash test/run.sh 71_session_knowledge
evidence_required:
  - session_nodes_reference
risk: "Every operational record kind added to the graph increases the chance one of them leaks into a shared projection. The scope field has to be the only thing that decides, and it has to be tested at the projection boundary rather than at each producer."
created_at: 2026-09-04
updated_at: 2026-09-04
