id: I3980
milestone: one-click-implement
title: "An execution is journaled to disk and recovered on start: one it was running comes back failed with code interrupted at its cursor, a reported one is re-attached, none is re-run"
slug: an-execution-survives-a-restart
priority: p0
profile: implementation
objective: "Append every execution record and event to a journal under .ai/local/state/executions/ before it is acknowledged, fold it back when the server starts, and recover an execution this server was running when it stopped as Failed with the error code interrupted naming its last sequence (the vocabulary abandon_silent already uses), and one another process reports as reported so that its next report continues it under the same id and cursor; never re-run. The WebSocket cursor (http/events.rs) replays from the journal across the restart."
why: "Owner's P0 of 2026-10-23 (ADR 0222 decisions 1 and 2): an execution's state must survive a browser refresh, a lost node and a restart. execution/mod.rs states the opposite today and store.rs is memory only."
current_state: "ExecutionStore is in memory (execution/store.rs Limits: 200 executions, 2000 events, 4 running); nothing is recovered on start; adopt/report/abandon_silent exist for majordomus run."
desired_state: "A server restarted mid-execution answers executions.get and the event cursor for that execution exactly as before, failed with code interrupted or continuing; the module documentation states the journal."
scope:
  - "apps/majordomus-cli/src/execution"
  - "apps/majordomus-cli/src/http/events.rs"
  - "apps/majordomus-cli/tests/execution_journal.rs"
non_scope:
  - "Retrying or resuming an interrupted mutation automatically"
  - "Replicating executions over the mesh (P1)"
depends_on: []
serves:
  - "an-issue-is-implemented-from-one-click#an-execution-survives-a-restart"
acceptance_criteria:
  - "An execution killed with its server is recovered failed with code interrupted naming its last sequence, and is not re-run"
  - "A reporting process alive across the restart is re-attached and its events continue at the next sequence number"
  - "GET /events?execution=<id>&after=<seq> after a restart replays exactly the gap"
  - "The journal is bounded by the existing Limits and a record over them is archived, never deleted"
  - "execution/mod.rs no longer says no execution outlives its process"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test execution_journal"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib execution::"
evidence_required:
  - "apps/majordomus-cli/tests/execution_journal.rs"
created_at: 2026-10-23
updated_at: 2026-10-23
