id: I3191
milestone: the-mesh-is-operated-from-one-page
title: "The UI reads any linked runtime the mesh names, and says which runtime every reading came from"
slug: the-ui-reads-a-linked-runtime
priority: p2
profile: implementation
objective: "Offer on /ui a target choice derived from mesh nodes (local, each trusted linked runtime), read the chosen runtime over HTTP from the endpoint on its signed RuntimeCard, through its declared ingress where one exists, stamp every panel with the runtime, the transport, that the read is unsigned and the observation time, and render an unreachable target as a state."
why: "On 2026-09-15 the owner wanted the Cockpit's default backend to be lundra, autodetected and never hard-coded; on 10-18 to see the whole mesh from one page. Reads beyond loopback are allowed by ADR 0126; writes are not. Critique 10-18: the link carries only the hello and sync exchanges (mesh/link.rs), so reads go over HTTP and the page says so. The owner's c296#0 also asked for a skill and a route. ADR 0209 leaves whether 'prismatic-lumen' becomes a route, CLI command, MCP namespace or skill to the owner, and that question is open until the owner answers it. Proposed in ADR 0201 (The persistent runtime is the authority; every operator surface, Lumen included, is a client of it) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c138#2."
current_state: "Verified: /ui reads only the server that serves it (apps/majordomus-cli/src/ui); the link protocol has only the hello and sync exchanges, protocol range 1..1 (mesh/link.rs)."
desired_state: "?target=<node> on /ui screens; target list from mesh.peers; read-only for remote targets."
scope:
  - "apps/majordomus-cli/src/ui"
  - "docs/MAJORDOMUS_UI.md"
  - "apps/majordomus-cli/src/mesh/testing.rs"
  - "apps/majordomus-cli/src/cockpit"
  - "site/content"
non_scope:
  - "Remote writes (I3192 after web-sign-in)"
  - "A signed read domain in the link protocol; LINK_PROTOCOL_MAX stays 1 and a protocol bump is a later issue with its own mixed-version rule"
  - "The per-figure source and age and reconnect recovery that I3138 already delivers"
depends_on:
  - "I2414"
  - "I3138"
  - "I3196"
  - "I3182"
serves:
  - "the-mesh-is-operated-from-any-device#reads-any-linked-runtime"
acceptance_criteria:
  - "Switching target changes every reading and says so"
  - "No address is typed in code; the target resolves by node identity"
  - "A linked runtime is read over HTTP from the endpoint on its signed RuntimeCard, through its declared ingress where one exists, and every panel names the runtime, the transport and that the read is unsigned"
  - "apps/majordomus-cli/tests/ui_linked_runtime.rs links two runtimes through apps/majordomus-cli/src/mesh/testing.rs and reads B's state from A's /ui"
  - "The page shows what is blocked and why from I3182's classification, with its source and age"
  - "The published Pages snapshot renders the target choice disabled with a 'live only' state"
  - "The /cockpit mesh view and the site documentation show the same target choice and its live-only state in the snapshot"
validation:
  - "majordomus plan validate"
  - "cargo test --test ui_surface"
evidence_required:
  - "ui_linked_runtime_tests"
created_at: 2026-10-18
updated_at: 2026-10-18
