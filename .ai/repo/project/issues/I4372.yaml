non_scope:
  - "Changing any repository setting or protection from the tool"
  - "Requiring the comparison as a check: it is a report and a scheduled drift finding"
  - "The protection readings themselves and scripts/ci/github-check (I3113), and the verdict-check declaration (I3200)"
  - "The allowed-methods reading and the drain's landing method (I2966), which this reuses unchanged"
  - "Reading the forge from doctor: doctor reads the recorded observation, as I3200 declares"
acceptance_criteria:
  - "Library test in integration::forge: a fixture with OSCILLA's 2026-10-29 settings against a block declaring merge only, PR_TITLE, PR_BODY, delete_branch_on_merge true, allow_auto_merge true and required [gate] strict yields no finding"
  - "The same block against OSCILLA's settings before 2026-10-29 (all three methods allowed, merge_commit_title MERGE_MESSAGE, merge_commit_message PR_TITLE) yields one finding per drifted field (allow_squash_merge, allow_rebase_merge, merge_commit_title, merge_commit_message), each naming a gh api -X PATCH repos/korczis/oscilla command; applying the printed commands to the scripted forge and observing again yields no finding"
  - "A block requiring [gate, metadata / metadata] against required [gate] yields a finding naming the missing check and the protection command; a block declaring strict against a protection that is not strict yields a strict finding"
  - "A repos/{repo} answer without merge_commit_title, merge_commit_message, squash_merge_commit_title, squash_merge_commit_message and allow_auto_merge (a token without admin rights) reads each declared one UNKNOWN, never a pass; an observation whose classic protection read was refused with 403 reads the declared required checks and strict UNKNOWN even when the rulesets were read"
  - "A field the block does not declare is not compared and yields no finding, whatever the forge holds"
  - "`prs status` and doctor show the same findings as the library comparison, from the recorded observation and without reaching the network"
  - "`majordomus forge check --repo` exits 11 on drift, 12 when a declared field reads UNKNOWN and 0 otherwise, prints the findings the library comparison yields, and writes nothing to the forge (the scripted forge's call log holds only reads); case 4372 carries evidence case_merge_settings_drift_reported"
validation:
