id: I3305
milestone: repository-automation-is-typed
title: "A scripted capability installed from outside the repository registers like one inside it"
slug: an-external-scripted-capability-registers
priority: p3
profile: implementation
objective: "Discover scripted-capability packages from a declared install location outside the tree and hand them to the registration I3157 proves, so they reach CLI, MCP and HTTP with their origin and no second registration."
why: "The owner's audit (10-13) put an external plugin vertical first; the scripted-capability kind (I1801) is the mechanism, so a plugin is a scripted capability from elsewhere, not a new plugin system. Critique 2026-10-18: this issue duplicates I3157 except for discovery from an install location outside the tree. It moves to milestone repository-automation-is-typed and serves repository-automation-is-typed#scripted-capability-runs, reduced to that remainder. It extends milestone automation. Sources: chatgpt-majordomus:c244#8, chatgpt-majordomus:c035#7, chatgpt-majordomus:c031#12, chatgpt-majordomus:c031#24."
current_state: "automation milestone: I1800 sandboxed engine, I1801 scripted capability kind; I3157 proves an adopter-declared capability in the layer reaches its surfaces; nothing loads from outside the tree."
desired_state: "A fixture package outside the repository shows in capabilities.list with its origin."
scope:
  - "apps/majordomus-cli/src/capability"
  - "share/kinds.yaml"
  - "share/schemas"
non_scope:
  - "Registration on CLI, MCP and OpenAPI with origin and the over-ceiling refusal, which I3157 already proves"
  - "Anything about a client carrying the contract (ADR 0214)"
depends_on:
  - "I1801"
  - "I3157"
serves:
  - "repository-automation-is-typed#scripted-capability-runs"
acceptance_criteria:
  - "A package from a temp directory registers a capability visible on CLI and MCP"
  - "An invalid manifest is refused and named"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test external_extension"
  - "majordomus generate --check"
evidence_required:
  - "case_an_external_scripted_capability_registers"
created_at: 2026-10-18
updated_at: 2026-10-18
