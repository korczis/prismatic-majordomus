acceptance_criteria:
  - "Case 4416, in a fixture with session.stranded_after 12h and a current.yaml whose outcome is partial, started_at and checkpoint_at 26 days ago: the briefing printed by the episode-start event contains `Last task <id> (partial, closed 26 d` and does not contain `Active task`"
  - "Case 4416: an active task with checkpoint_at 26 days ago is briefed `Active task <id> (active, ...` with its started and checkpoint ages, and the same line names `stale`, the 12h threshold and `majordomus recover tasks --check`; an active task checkpointed 10 minutes ago gets its ages and no stale mark"
  - "Case 4416: `majordomus recover tasks --check` on the stale active task exits 0, names the task id, its age, the threshold and `outcome interrupted`, and leaves current.yaml and the ledger byte-for-byte unchanged"
  - "Case 4416: `majordomus recover tasks` sets outcome: interrupted, changes no other line of current.yaml, appends one task.interrupted ledger line with task_id, checkpoint_at, age, threshold and source recover, and a following `majordomus finish --outcome completed` is refused with `already interrupted`"
  - "Case 4416: with the task checkpointed inside the threshold, or already partial, `recover tasks` names it as not a candidate with the reason and writes nothing; with current.yaml naming another worktree it refuses and names that worktree; with no session.stranded_after declared it exits non-zero naming the key, and writes nothing"
  - "Case 4416: `recover status` lists the tasks subject beside episodes, records and orphans"
  - "Case 4416: a fixture with two open episodes older than the threshold makes doctor's lifecycle episodes FAIL name `majordomus recover episodes --check`, and its handovers FAIL name it too; with no stranded episode the handovers FAIL keeps `majordomus handover --list`"
  - "doctor admits outcome: interrupted in current.yaml through share/allow/current.txt and the current.v1 schema, regenerated by `majordomus generate`, and share/events.yaml declares task.interrupted"
  - "Cases 130 and 60 pass"
  - "Before the change, case 4416 fails at its first assertion on the `Active task <id> (partial)` line"
