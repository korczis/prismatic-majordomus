# The only hand-written prose on the site: positioning sentences and button labels. No
# capability claims (those are features under .ai/repo/features/ and claims in
# docs/CLAIMS.yaml, both derived onto the page) and no numbers (the generator computes
# every count). Budget: scripts/site-check fails when this file exceeds 60 lines.

[hero]
eyebrow = "Prismatic Majordomus"
title = "Your repository, run like a system — not a chat log."
mantra = ["One repository.", "Many agents.", "One source of truth."]
lead = "Agents forget everything between sessions. People move on. Majordomus keeps what matters in the repository itself — the rules a worker must follow, the paths it may touch, the decisions already made, and the evidence that work is actually finished. Every tool reads the same files, so nothing depends on whose window it happened in."
cta_primary = "Install"
cta_secondary = "See what it does, interface by interface"
console_caption = "Real output, not a mockup. The rows are the features this repository declares and the marks are derived from what each one names; ask the command line, the HTTP API or an agent over MCP and you get the same answer."

[install]
layer = "What init creates is one tracked directory you can read without the tool — and this site is generated from it. The sections below are this repository's own."

[recognise]
title = "You need this if, this week, you have…"
closing = "None of these are model problems. They are operations problems, and operations is what Majordomus does."

[chapters]
kicker = "what it does"
lead = "Each chapter is one feature file in the layer. The words are the only part a person wrote; the interfaces, counts, mechanisms and moments beside them are read back out of what that file names."

[write_once]
title = "Write it once. It shows up everywhere."
lead = "A rule, a skill, a decision, a use case, a feature: each is one file with a schema. Discovery finds it, the schema checks it, the index holds it, every interface reads the index. You never register anything anywhere."

[providers]
title = "Works with whichever agent you use"
lead = "One policy file generates the instructions each tool reads, whether it runs a single agent or many. A worker's context, its worktree, its handovers and the repository's decisions belong to the repository — not to the vendor whose session happened to produce them."
boundary = "Majordomus never calls a model. It decides what a worker is told, what it may touch, and whether its claim of being done can be believed."

[surfaces]
title = "One declaration, every interface"
lead = "Declare a capability once. The command line, the HTTP API, the OpenAPI document and its Swagger UI, the tools an agent sees over MCP, the Cockpit and this page are all projections of that one declaration — and a projection that disagrees with it fails the build."

[matrix]
lead = "Every mark here was derived, never typed. A feature reaches an interface because something it names is projected there; where there is a gap, the gap is shown rather than hidden."

[graph]
lead = "The same model as a graph: features, what each is made of, and the interfaces that follow. Select a node to see what it touches; the list under it is the graph without a script."

[principles]
title = "Rules a machine decides, not suggestions a model may ignore"
lead = "A rule is a portable file with a class. A rule the tool enforces names the validator that decides it, the commands that run it and the tests that prove it — and doctor walks that chain from the source, so an unenforceable rule cannot hide."

[contract]
caption = "Real output from this repository's own README. One line per check, each naming what it proved; a failing line carries the command that reproduces it, and nothing is written until every line passes."

[architecture]
lead = "This page is a projection of the repository it describes. Every feature, count, provider, interface and moment on it came out of the same executable that answers agents — and a stale page fails the build before it can be deployed."

[final]
title = "One directory in your repository. One source of truth for every agent that opens it."
