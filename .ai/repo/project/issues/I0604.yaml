id: I0604
milestone: shared-policy
title: Prove the offline guarantee survives sharing
slug: offline-survives-sharing
priority: p3
profile: debugging
parallel_safe: false
objective: "Prove with cases and a doctrine that no path introduced by shared policy reaches a network, and that an unavailable shared source degrades to a named refusal rather than a fetch or a silent local fallback."
why: "Every guarantee this tool makes rests on it being local and offline. Sharing policy across repositories is the exact feature that historically converts a local tool into a client of something, and it has to be refused structurally rather than by intention."
current_state: "Resolution, override and drift reporting all exist and are documented as filesystem-only. Nothing enforces that they stay so."
desired_state: "A doctrine refuses a network call in the policy resolution path, cases cover an unavailable source, and the refusal names the doctrine."
scope:
  - share
  - lib
  - test/cases
non_scope:
  - Any offline cache of a remote source, which would be a fetch with extra steps
depends_on:
  - I0603
acceptance_criteria:
  - A doctrine declares the rule, its validator exists, and doctor proves it reaches the command that runs it
  - A case shows an unavailable shared source producing a named refusal, with nothing fetched and no fallback
  - CI runs the case
validation:
  - bash test/run.sh
  - bin/majordomus doctor
evidence_required:
  - suite
  - doctor
risk: "The pressure to add a remote source arrives with the first user who has repositories on two machines; the doctrine is what makes that a decision rather than a patch."
created_at: 2026-09-04
updated_at: 2026-09-04
