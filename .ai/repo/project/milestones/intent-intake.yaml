id: intent-intake
title: "A received brief is a campaign revision whose requirements are reconciled into the one plan"
slug: intent-intake
order: 187
priority: p3
problem: "Briefs (prompt packs, ZIPs, Markdown documents) are kept as received under campaigns/, but an agent reads each once and its requirements are reconciled into the plan by hand; nothing says which requirement became which criterion or which a later revision changed. ADR 0124 asks for the noun first, and proposed ADR 0180 names it campaign. Proposed in ADR 0194 (An ingested brief is an intake revision, and its requirements are reconciled into the existing plan) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c245#11, chatgpt-majordomus:c174#19, chatgpt-majordomus:c210#4, chatgpt-majordomus:c297#9, chatgpt-majordomus:c210#2, chatgpt-majordomus:c239#0, chatgpt-majordomus:c245#9."
outcome: "A campaign revision's requirements get content-derived identities, are classified against the existing intents and issues into a draft, a later revision reports only the criteria whose source changed, and every intent shows the segments it was derived from."
current_state: "campaigns/ on master keeps packs as received under MANIFEST.sha256 (scripts/ci/campaigns-check, rule project.a-brief-is-kept-as-received); ADR 0124 is proposed, and ADRs 0180 (campaign) and 0194 (reconciliation) are proposed on this branch; `majordomus pack` is the text-shard tool; I3167 and I3169 make a campaign a kind with one add command."
desired_state: "The owner has accepted ADR 0180's noun and the four issues land on the drafting path of an-outcome-becomes-a-reviewed-plan, held to a committed synthetic fixture."
scope:
  - "apps/majordomus-cli/src/reconcile.rs"
  - "apps/majordomus-cli/tests/intake.rs"
  - "apps/majordomus-cli/tests/ui_intent.rs"
  - "share/schemas/majordomus/intent"
  - "test/fixtures"
  - "apps/majordomus-cli/src/ui"
  - "apps/majordomus-cli/src/cockpit/intents.rs"
  - "docs/PLANNING.md"
non_scope:
  - "Executing on upload"
  - "The `pack` command name, and the noun intake in any kind, command, schema or capability"
  - "A store beside campaigns/, or conversation bytes in any tracked file"
acceptance_criteria:
  - "A committed synthetic brief under test/fixtures, with two revisions and an expected class per requirement, is classified to exactly those classes, and its renamed revision reports nothing"
  - "Every criterion of a-brief-is-reconciled-into-the-plan is served by an issue here and named by its test"
validation:
  - "majordomus plan validate"
evidence_required: []
depends_on:
  - "an-outcome-becomes-a-reviewed-plan"
risks:
  - "Untrusted content: no instruction-following from a brief's text; ZIP limits are I3169's"
created_at: 2026-10-18
updated_at: 2026-10-18
