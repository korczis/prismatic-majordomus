id: I3981
milestone: one-click-implement
title: "executions.start takes an idempotency key: the same key and input answer the first execution, the same key with another input is refused"
slug: a-start-is-idempotent
priority: p0
profile: implementation
objective: "Add an optional idempotency_key to the input of executions.start (declared in the capability, so every projection carries it after majordomus generate); keep the key on the journaled record (I3980); a repeated start answers the existing execution's view, a conflicting one is refused naming it; share/cockpit/executions.js and moves.js send a key per click."
why: "ADR 0225 decision 3: every mutating click carries an idempotency key; today the only guard is a disabled button (share/cockpit/executions.js:39)."
current_state: "executions.start (capability/builtin/executions.rs:700) has no key; a double submit from two tabs starts two executions."
desired_state: "Two starts with one key from two tabs yield one execution; the UI's start path always sends a key."
scope:
  - "apps/majordomus-cli/src/capability/builtin/executions.rs"
  - "apps/majordomus-cli/src/execution"
  - "share/cockpit/executions.js"
  - "share/cockpit/moves.js"
  - "share/cockpit/api.js"
  - "apps/majordomus-cli/tests/execution_idempotency.rs"
non_scope:
  - "Idempotency of capabilities called directly, outside an execution"
depends_on:
  - "I3980"
serves:
  - "an-issue-is-implemented-from-one-click#a-start-is-idempotent"
acceptance_criteria:
  - "Same key, same input: the second start answers the first execution's id"
  - "Same key, different input: refused with the first execution's id in the refusal"
  - "The key survives a server restart (it is on the journaled record)"
  - "The UI start path sends a fresh key per click and reuses it on a retried request"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test execution_idempotency"
evidence_required:
  - "apps/majordomus-cli/tests/execution_idempotency.rs"
created_at: 2026-10-23
updated_at: 2026-10-23
