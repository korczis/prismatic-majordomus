id: I4207
milestone: measurements-are-tracked-over-time
title: Only a trends series of the shape the publication writes decides a run link
slug: a-trends-series-is-trusted-by-its-schema
priority: p1
profile: implementation
parallel_safe: true
serves: []
objective: "scripts/ci/link-check adds the runs of site/data/trends.json to the runs it decides by provenance only when the file is the series `scripts/pages trends` writes, an object of schema trends/v1; a file of any other shape decides nothing and does not break the check."
why: "I4220 admitted every runs[].run_id of site/data/trends.json without looking at what the file is. The trust rests on provenance: scripts/pages trends wrote it from the forge's answers at publish time, and its own output says schema trends/v1. A stale, hand-made or differently shaped file with a runs list would turn arbitrary run links into decided ones, and a top-level list made the check die with AttributeError instead of deciding."
current_state: "link-check reads `.get('runs')` of whatever site/data/trends.json parses to: any object's runs are decided, and a JSON list raises AttributeError."
desired_state: "Only an object whose schema is trends/v1 contributes runs; a series of another schema or none leaves those run links refused as undecidable offline (exit 10), and case 335 holds both."
scope:
  - scripts/ci/link-check
  - test/cases/335_every_link_resolves.sh
  - .ai/repo/project/issues/I4207.yaml
non_scope:
  - "What scripts/pages trends writes, which already carries schema trends/v1"
  - "Deciding any other forge path offline"
depends_on: []
acceptance_criteria:
  - "A run a trends/v1 series names is still decided"
  - "The same run named by a series of schema trends/v0 is refused as undecidable offline (exit 10)"
  - "The same run named by a top-level JSON list is refused (exit 10), not a crash"
validation:
  - "bash test/run.sh 335_every_link_resolves"
evidence_required:
  - suite
risk: "None: the only series the publication writes is trends/v1 (scripts/pages, `schema: \"trends/v1\"`), so a published site decides exactly what it did."
