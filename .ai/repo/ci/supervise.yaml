version: 1

# ---------------------------------------------------------------- what this workflow is for
# `majordomus prs supervise --apply` (I3903) judges every in-flight GitHub Actions run of this
# repository against the bounds below and force-cancels the ones past them, or superseded while
# something waits behind them, each with its reason on the integration audit trail
# (`run_cancel_attempted`, then `run_cancelled` or `run_cancel_failed`). The decision is
# apps/majordomus-cli/src/integration/supervise.rs, pure and unit-tested; the forge side is
# integration/runs.rs; .github/workflows/supervise.yml only runs the command.
#
# Why. On 2026-10-28 train 10a's and 10b's new validate runs sat `pending` for hours behind
# their own superseded runs. Validate's concurrency group is one per pull request and never
# cancels in progress, deliberately: a started run reaches its verdict, and #576 was once
# cancelled four times in a row without ever producing one (the comment above `concurrency:`
# in validate.yml). Nothing ended a run whose head nobody would merge while the verdict that
# mattered waited behind it; the owner ordered that CI never stay stuck for hours again.
#
# What ends a run, and nothing else:
#   duplicate_run                a first-attempt pull_request run that waits in its group with
#                                no job created while an older run of the same pull request,
#                                branch and commit, created within 120 s of it, is in flight.
#                                Opening a train with `--label train` is `opened` and `labeled`
#                                at once and starts validate twice (6 of 8 trains on
#                                2026-10-28; 10b's twin 40713048283 held its group seven
#                                hours). Never once the group admitted it and its jobs exist: a
#                                cancel still runs its `if: always()` jobs, and validate's `ci`
#                                then writes a failure over the twin's pass (#2678, run
#                                40811621641, 2026-10-29), so a judged run is never the older
#                                half. Never while the older run is itself to be ended, now or
#                                within 30 min (held as earlier_run_ends: it takes that run's
#                                place). Outside the burst a second run was asked for (a
#                                reopen, a label added later, a re-run); a re-run, or a pull
#                                request labelled `ci:full`, is held.
#   superseded_blocks_successor  a pull_request run of a workflow declared `superseded:
#                                per_pull_request`, whose head is no longer its pull
#                                request's, while a newer run of the same pull request waits in
#                                the same group. With nothing waiting it is left alone: the
#                                concurrency rationale stands.
#   queued_past_bound            a pull request's run whose attempt queued longer than
#                                `queued_minutes` with no job of it started, from the later of
#                                created_at and run_started_at (a re-run keeps its creation).
#                                Never an integration/* top (it waits for a runner, and its
#                                verdict is the one a landing needs), nor a push, the schedule,
#                                a dispatch or a release: each waits in a group of its own, so
#                                ending it frees nothing.
#   running_past_bound           a job in progress longer than `running_minutes`, from that
#                                job's start. Each running job, never the run: validate's jobs
#                                run in a chain with the runner queue between the stages, and
#                                healthy runs took 579 minutes first job to last (40576851731).
#                                A completed job, a re-run's carried one among them, is no
#                                job's time. Never an integration/* top.
#
# What is never cancelled for being superseded is fixed in the code, not declared here: a push
# to the default branch, any other push (a tag push among them), the schedule, a dispatch, a
# release, and every run of the pages or release workflows. The supervisor's own runs are never
# cancelled at all, and a workflow named nowhere below is judged by nothing.
#
# Before each cancel the run and its pull request's head are read again, and the run is
# cancelled only if the same reason still holds (the drain's observe-twice discipline). The
# act is recorded first; a trail that cannot be written stops every act. The cancel is the
# forge's force-cancel: `gh run cancel` on a queued run has returned success and done nothing.
# Where it runs: lundra ("self-hosted","lundra", or vars.MJ_SUPERVISE_RUNNER once a runner is
# registered for it alone) first, then a GitHub-hosted fallback in the same run that `needs` the
# lundra lane and runs only when it did not supervise (`if: always()`, no `supervised` output):
# on a tick lundra supervised, no second apply spends the request budget. Each lane is its own
# concurrency group with cancel-in-progress false, so a lundra job that waits for a runner (none
# online, or all busy with validate's first wave once vars.MJ_RUNNER sends it there, #2596) is
# replaced by the next trigger's but one, and the replaced run's hosted lane applies. A hosted
# lane still stands aside when lundra's supervision succeeded in the last eight minutes in
# another run (`--unless-supervised-within 8 --supervised-by lundra`; its own stand-aside is a
# success that must not count). Both lanes run a downloaded executable that answers `prs
# supervise --help`; each step is bounded on its own (checkout 1, executable 2, supervise 4
# minutes, under the job's 8), so the job is never killed in the middle of an act. Its liveness
# is the queue workflow's to report: no successful supervision by lundra for thirty minutes is
# `supervise_stale` (.ai/repo/ci/queue.yaml).
runs_on:
  lanes: [lundra, hosted]
  timeout_minutes: 8
  cancel_in_progress: false
  stale_minutes: 30

trigger:
  branch: master
  schedule: '*/10 * * * *'
  # event-driven: a new validate run that would wait behind a superseded one is unblocked
  # within a minute of being requested, not at the next tick
  workflow_run: validate
  workflow_run_types: requested

supervisor: supervise

report:
  command: majordomus prs supervise --apply
  # 0: nothing needed doing, or every act succeeded or was rightly skipped on a second read.
  # 12: the forge could not be read or an act could not be taken, and the job fails on it.
  # 10 is a dry run's finding and never happens under --apply.
  fails_on: unusable

# ---------------------------------------------------------------- the bounds
# Generous on purpose: a bound turns a hang into an end, and must never cut a healthy run.
# `queued_minutes` is at least 240 everywhere. `running_minutes` is the workflow's largest job
# `timeout-minutes` plus 30, and it bounds one running job, so a job is ended only after its own
# timeout should already have ended it; raise a job's timeout and the test
# `the_declared_bounds_hold_to_every_workflows_real_timeouts` asks for this number to follow.
bounds:
  docker-image:
    queued_minutes: 240
    running_minutes: 75
  github:
    queued_minutes: 240
    running_minutes: 90
  pages:
    queued_minutes: 240
    running_minutes: 110
  pr-meta:
    queued_minutes: 240
    running_minutes: 70
  provider:
    queued_minutes: 240
    running_minutes: 105
  queue:
    queued_minutes: 240
    running_minutes: 60
  release:
    queued_minutes: 240
    running_minutes: 75
  release-path:
    queued_minutes: 240
    running_minutes: 35
  telemetry:
    queued_minutes: 240
    running_minutes: 40
  validate:
    queued_minutes: 240
    running_minutes: 255
    # `validate-<pull request>` for its pull_request runs, never cancel-in-progress
    superseded: per_pull_request
  version:
    queued_minutes: 240
    running_minutes: 50
