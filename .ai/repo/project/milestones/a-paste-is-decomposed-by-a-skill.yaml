  - "A new writing capability, or intents.propose writing anything except one intent record"
  - "Storing a campaign from inside intents.propose"
  - "A new ProposeError or CapabilityError variant"
  - "Automatic classification of a campaign's segments, which I3273 owns"
  - "The draft brief, check and apply commands, which I3251 and I3252 own"
  - "Transliterating non-ASCII letters in a proposed id"
