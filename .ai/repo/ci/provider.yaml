# The provider deployment's model: when the deployment object's provider (ADR 0219) receives a
# new tree, what that tree is assembled from, how it reaches the provider and what proves it
# arrived. .github/workflows/provider.yml is an adapter over this file; the tree itself is
# `majordomus deploy slug` (apps/majordomus-cli/src/deploy/slug.rs), and the provider's files
# in it are generated by `majordomus generate deployment`.
#
# Rules this file encodes:
#   - publication follows verification: a tree is pushed only for a master commit whose
#     validate run on the push concluded success, and a dispatch is held to the same proof;
#   - one commit: the executable is built at the commit the tree is read from, so the
#     deployment's liveness route answers the commit it serves;
#   - nothing else pushes to the provider, and the repository is never what is pushed;
#   - the push is a fast-forward on the provider's own history, never forced;
#   - the credential is a workflow secret, never a field of the object, a file or a log line.
version: 1

deployment: majordomus
# the object the provider block, the inputs and the liveness route are read from
object: .ai/repo/deployments/majordomus.yaml

# ---------------------------------------------------------------- when it runs
trigger:
  # validate's run on a master push, once it has concluded success
  after_validate:
    branch: master
    event: push
    conclusion: success
  dispatch:
    input: sha
    requires: a successful validate run on a master push of that commit
  # one deployment at a time, never cancelled: a half-pushed tree is a provider in an
  # unknown state
  concurrency: provider-deploy

# ---------------------------------------------------------------- what is pushed
build:
  # the distribution model's target, as release.yml builds it
  target: x86_64-unknown-linux-musl
  commit_variable: MAJORDOMUS_BUILD_COMMIT
  dirty_variable: MAJORDOMUS_BUILD_DIRTY
slug:
  command: majordomus deploy slug --deployment majordomus --commit SHA --executable BIN --out DIR
  carries:
    - the object's build.inputs at SHA, except the package the executable is compiled from
    - the provider's generated files at SHA, at the slug's root, the hooks mode 755
    - the provider's buildpack line (.buildpacks)
    - the executable built at SHA (.majordomus/bin/majordomus)
    - the record of what it was assembled from (.majordomus/SOURCE.json)

# ---------------------------------------------------------------- how it reaches the provider
push:
  provider: gigalixir
  remote: https://git.gigalixir.com/APP.git
  branch: main
  history: one commit on top of the provider's main, so the push is a fast-forward
  force: never
  secrets:
    - GIGALIXIR_EMAIL
    - GIGALIXIR_API_KEY
  credential: a git credential helper that reads the secrets from the push step's environment; nothing is written to disk

# ---------------------------------------------------------------- what proves it arrived
observe:
  # provider.url and health.liveness of the object
  route: liveness
  expects: the commit the tree was read from
  within_seconds: 600
  interval_seconds: 15
