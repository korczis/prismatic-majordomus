id: I2132
milestone: runtime-trust
title: "A hello names the runtime it is meant for, and no other runtime accepts it"
slug: a-hello-names-its-recipient
priority: p1
profile: implementation
parallel_safe: false
objective: "Bind each link hello to its intended recipient inside the signed bytes, refuse a hello addressed elsewhere, and make the documented check order the one the code runs."
why: "Hello (apps/majordomus-cli/src/mesh/link.rs:444-456) names no audience. The nonce cache that refuses a replay is per answerer, held in memory and checked after trust (apps/majordomus-cli/src/mesh/cooperation.rs:1847-1875), so a captured hello replays to another runtime of the same repository, or to the same runtime after a restart, within the 300 s skew window (threat T6). The effect is a displaced inbound link and a false 'connected' for the real peer (apps/majordomus-cli/src/mesh/cooperation.rs:1918-1934); the replayer cannot sync. docs/MESH.md:128-136 and item 1 of rule project.mesh-cooperation-is-authenticated put the nonce check before protocol, self, repository and trust; the code checks it last on purpose, so strangers cannot fill the cache, while the blocking rule says 'verify, in order'. Baseline audit of 2026-10-09 at master 1fb8d6be44, mesh gap 9 and drift 1."
current_state: "A valid hello is accepted by any runtime of the repository that trusts its key and has not seen its nonce."
desired_state: "Hello carries an optional to (the runtime key it means to reach) inside its signed bytes; the dialer fills it whenever it knows the key (a registry target, or a runtime it linked before); accept_hello refuses a hello addressed elsewhere as misaddressed, before the replay cache sees its nonce; a hello without to is still admitted (seeds, first contacts, releases before this one), so the link protocol version is unchanged and a mixed fleet keeps linking. docs/MESH.md states the order the code checks in and why the nonce cache is last. The deferred part, bringing rule project.mesh-cooperation-is-authenticated to the code's check order, is I2703."
scope:
  - "apps/majordomus-cli/src/mesh/link.rs"
  - "apps/majordomus-cli/src/mesh/cooperation.rs"
  - "apps/majordomus-cli/tests/mesh_cooperation.rs"
  - "docs/MESH.md"
  - ".ai/repo/rules/project/mesh-cooperation-is-authenticated.v1.md"
depends_on: []
acceptance_criteria:
  - "A hello captured from a link to runtime A and replayed to runtime B within the skew window is refused with a typed refusal and changes no link of B"
  - "A hello replayed to A after A restarts cannot displace an established link"
validation:
