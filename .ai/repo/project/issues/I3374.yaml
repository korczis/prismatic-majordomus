id: I3374
milestone: the-corpus-is-registered-before-it-runs
title: "Task difficulty is a proxy measured from each task's reference, and the stratum cut-offs are registered before any new task is written"
slug: difficulty-is-measured-and-registered
priority: p1
profile: implementation
objective: "Compute per task a difficulty proxy from records that exist: reference patch lines changed, files and fixture modules it touches, and the number of sessions the task declares. Let a registration declare stratum cut-offs on the proxy, and refuse on load a task whose measured proxy falls outside its stratum's cut-offs or whose declared complexity disagrees. Commit the cut-offs, with the proxies of the seven existing tasks, into the corpus registration skeleton before I3368 and I3369 write a task."
why: "T2 of the owner's report of 2026-10-19 asks for a split by difficulty in advance. The critique found that a complexity the author declares while designing tasks with the treatment in mind is open to bias, so the split is a measured quantity whose thresholds precede the tasks."
current_state: "model.rs:527 every task declares complexity; wc -l test/fixtures/economics/reference/*.patch gives 11 to 92 lines, the largest recurring-invoices with two sessions. No proxy is computed."
desired_state: "economics references prints each task's proxy; the corpus skeleton holds cut-offs committed before any new task file."
scope:
  - "apps/majordomus-cli/src/economics/model.rs"
  - "apps/majordomus-cli/src/economics/mod.rs"
  - "apps/majordomus-cli/tests/economics.rs"
  - ".ai/repo/benchmarks/economics/suites"
  - ".ai/repo/benchmarks/economics/README.md"
non_scope:
  - "Writing tasks (I3368, I3369)"
  - "Changing any existing task"
depends_on:
  - "I3367"
serves:
  - "the-product-proves-it-pays#the-corpus-is-registered-before-any-run"
acceptance_criteria:
  - "The proxy of each existing task is printed and matches a hand count in a test"
  - "A task outside its stratum's cut-offs is refused on load, naming the measure"
  - "The cut-offs' commit precedes every new task file's first commit, checked by a test reading git"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test economics"
  - "majordomus economics references --work-dir \"$(mktemp -d)\""
evidence_required:
  - "test_difficulty_proxy_registered_first"
created_at: 2026-10-19
updated_at: 2026-10-19
