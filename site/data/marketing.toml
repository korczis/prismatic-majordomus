# The only hand-written prose on the site: positioning sentences and button labels; no claims
# (derived from the layer) and no numbers (computed). scripts/site-check holds it to 90 lines.
[hero]
eyebrow = "The control layer for AI-assisted development"
title = "Your AI agents say the work is done."
subtitle = "Majordomus makes them prove it."
lead = "Majordomus keeps AI coding agents honest. It remembers what every session learned, keeps parallel agents out of each other's way, and accepts a task as finished only when your own checks pass. It works beside the agent you already use, and it never calls a model."
cta_primary = "Watch it refuse unfinished work"
cta_install = "Get started"
cta_product = "Open the product"
reassure = "Open source. One command to install. No account, no sign-up."
scenarios_label = "Or step into one recorded refusal"
scenario_challenge = "The challenge: refused, then accepted"
works_with = "Works beside the tools your team already uses"
product_kicker = "the product · this project's own delivery"
product_title = "This project's own plan and releases, read from its records at the commit this site was built from."
product_snapshot = "A snapshot, read once at this site's commit."
console_caption = "Recorded runs, not a mockup: each panel is the stdout of a scenario this site executed while it was being generated, with the machine and the clock redacted and nothing else touched."
[recognise]
title = "Agents are fast. Trust is slow."
guaranteed = "The number beside each feature counts its guaranteed claims."
lead = "AI agents can write code all day. The hard part is knowing what they changed, what they forgot, and whether any of it actually works."
closing = "Majordomus fixes all three in the one place every agent already works: your repository."
who = "Built for the people who answer for the result"
more = "Recognise a specific moment? See the failures it answers"
[map]
kicker = "what you get"
title = "Everything AI-assisted work needs, in one layer"
lead = "The things every team ends up building by hand, ready on day one. Open any of them to see what it does and the evidence behind it."
from = "what an agent changed"
to = "what you can trust"
[workflow]
kicker = "how it works"
title = "From first prompt to a checked finish"
no_feature = "No feature names this step yet."
lead = "Every task follows the same short path, whoever or whatever does the work. Your repository answers at each step, so nothing depends on an agent remembering to behave."
closing = "No prompt tricks and no leap of faith. If a check fails the task is not finished, and the record says why."
recorded = "See it run"
[refuses]
kicker = "the proof"
title = "Watch it say no."
lead = "An agent wanders outside its task, says it is done, and is refused. It cleans up and is refused again, because your own test still fails. Only when every check passes is the work accepted. This is a recording of the real tool, not a demo script."
closing = "Any tool can tell an agent what to do. Majordomus decides whether what it did counts, and it keeps the record either way."
replay = "Replay the run, step by step"
more = "Every other refusal on record"
verdict_kicker = "recorded run · the worker says it is done"
verdict_after = "It is accepted only when every line passes:"
verdict_link = "Replay the whole run, step by step"
[surfaces]
kicker = "works your way"
title = "One source of truth, wherever you work"
lead = "Managers follow delivery in a browser. Agents ask through their own tools. Engineers stay in the terminal. Everyone gets the same answer, because every view is generated from the same records."
source = ".ai/ declarations and the executable's capabilities"
registry = "one registry, validated"
engineers = "For engineers: one declaration reaches every interface"
size = "The command-line tool is a small shell script; the executable it ships does the rest. A capability is a built-in operation of that executable, and the registry also holds one generated resource for each object of the layer. The MCP tools and HTTP routes are the built-in capabilities, projected."
[interfaces]
ui = "For whoever follows the delivery: health, releases, the roadmap, open work, evidence and rules, in one place."
cockpit = "For whoever wants the detail: every rule, record and check behind a figure, with its source."
cli = "For whoever does the work, person or agent: start a task, check it, hand it over, finish it."
api = "For your own tools and dashboards: the same answers, over HTTP."
mcp = "For coding agents: the same answers, as tools an agent can call."
docs = "For everyone: the guides, the reference and the decisions behind them."
live = "On your own repository it is live: start the local server and it answers at"
published = "Open the published snapshot"
snapshot = "A snapshot of this project's own repository, read once at the commit this site was published from. It is not a live reading, and nothing on it refreshes."
[blackboard]
kicker = "who works on what"
title = "Who is working on what, on one board"
lead = "Every session attached to a checkout or open on a linked machine, in one picture: what each says it is doing, the claims it holds and which of them meet, the reviews and handovers that wait, and whether every source could be read."
served = "Start the local server and the board is followed live: the server pushes each change to the page, and a page that is not live says so."
published = "This site is files, read once at the commit it was built from. It follows no server, so it shows only what was read then, and it changes only when it is built again."
[proof]
plain = "Two numbers, kept apart on purpose. Declared is a promise written down together with the test meant to prove it. Supported means that test ran against this exact revision and the run was recorded. A promise without a recorded run is counted as a promise, and as nothing more."
[chain]
legend = "A solid line is held by a machine: a projection that disagrees with its declaration fails the build, and a blocking rule is decided by a validator or a test. A dashed line is declared and waits for its evidence: a guaranteed claim names the test that is to prove it, and it counts as supported only when a recorded run of this revision does."
[providers]
title = "Bring your own AI. Keep your own rules."
boundary = "Majordomus never invokes a model; it decides what a worker is told, what it may touch, and whether its claim of being done can be believed."
[install]
kicker = "get started"
title = "Running on your repository in minutes"
layer = "One command installs it and one sets up your repository. It adds a single tracked directory, readable without the tool, and nothing else."
[write_once]
title = "Write once. Surface everywhere."
lead = "A rule, a skill, a decision, a use case, an operational moment, a feature: each is one file under the layer with a schema. Discovery finds it, the schema validates it, the index holds it, and every interface reads the index. Nothing registers anything."
[contract]
caption = "The contract as the repository's own README shows it: a recorded run from the challenge, redacted and otherwise untouched, which the build refuses to publish if it stops matching. One line per check, each naming what it proved; a failing line carries the command that reproduces it, and nothing is written until every line passes."
[architecture]
lead = "This page is a projection of the repository it describes. Every feature, count, provider, interface and moment on it came out of the same executable that answers agents, and a stale page fails the build before it can be deployed."
