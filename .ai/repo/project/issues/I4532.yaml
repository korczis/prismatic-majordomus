id: I4532
milestone: ci-critical-path
title: "The hosted CI jobs of this repository are admitted to fourteen in flight, leaving six for OSCILLA"
slug: the-hosted-ci-jobs-are-bounded-to-fourteen-in-flight
priority: p1
profile: implementation
parallel_safe: true
serves: []
objective: "Bound the GitHub-hosted jobs of this repository so that at most fourteen run at once across every run, leaving six of the account's twenty hosted runners to OSCILLA, as the owner decided: before any gate asks for a runner, a run's plan job counts the hosted jobs of this repository already in flight and yields, as the release-path yield does, when admitting its plan would pass fourteen; the bound is declared in the CI model, proved by a case, and never counts a job on a self-hosted runner."
why: "OSCILLA and prismatic-majordomus share one GitHub account, and the account's plan runs at most 20 GitHub-hosted jobs at once across every repository. Measured on 2026-11-06: 18/20 in flight from 18:30Z, 17/20 at 22:30Z, 20/20 at 22:54Z and again after 23:00Z, most of them this repository's; at 22:27Z master's validate alone held 11 jobs and a train top 4. Each OSCILLA release waited about 1.5-3 h for a runner. In session 6f686fcc (OSCILLA, 2026-11-06 ~22:58Z) the owner was asked 'Measured tonight: OSCILLA and prismatic-majordomus share one account-wide cap of 20 GitHub-hosted CI jobs. It sat at 20/20 from 18:30Z, mostly Majordomus jobs, so each OSCILLA release waits about 1.5-3 h for runners. How should CI capacity be split?' and answered 'Reserve 6 for OSCILLA (Recommended)'; OSCILLA records the answer as its plan issue Q102. This repository holds no bound of its own: a full validate plan fans out to the four suite shards, the three rust lanes, the six site-probe and six interaction-probe shards, the four ui shards and the two install runners beside its single jobs, and pages.yml adds five more, so two validating heads and a publication fill the account by themselves."
current_state: "Measured at 5ca0bec8c42: no job of .github/workflows/validate.yml or pages.yml carries max-parallel; the two concurrency groups (validate-<pr or run>, pages-<ref>) serialise runs of one head and one ref with cancel-in-progress false, and neither bounds how many jobs of a run start. .ai/repo/ci/gates.yaml names the job of every gate and .ai/repo/ci/pages.yaml the publication's budgets; neither declares how many hosted runners the repository may hold. The one job that can run on a self-hosted runner is the ci aggregate (vars.MJ_AGGREGATE_RUNNER, e.g. lundra); every other job runs on ubuntu-latest or macos-latest. Re-scoped 2026-11-08 (dev-e6 triage, landing seat agreed): per-run max-parallel does not bound the repository. One validate run is ~43 jobs (suite 4, rust 3, site-probe 6, interaction-probe 6, ui 4, install 2 ...), Majordomus and OSCILLA share one 20-slot account cap (observed 16+4 in progress), and 11 PR runs live x max-parallel 14 still exceed it. Evidence: runs 42410525008 (#2960, 5 running / 12 queued), 42422924251 (OSCILLA, 4 in progress), superseded 42414190309 / 42415589257 / 42416714967 (19 queued jobs)."
desired_state: "At most fourteen GitHub-hosted jobs of this repository run at once, whatever heads are validating and publishing: the plan job of validate.yml (and the first job of pages.yml) admits its run only when the hosted jobs of this repository in flight plus the jobs its plan selects stay within fourteen, and otherwise yields, labels its pull request and is resumed when slots free, as scripts/ci/release-path yields and resumes; the release path and master keep their precedence. The bound is written in .ai/repo/ci/ with the measurement that set it, a case replays concurrent runs and proves the in-flight count never passes fourteen, and a job whose runs-on is a self-hosted label is never counted against it."
