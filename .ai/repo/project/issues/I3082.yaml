id: I3082
milestone: public-proof
title: "An article explains the worktree topology in both languages: one branch, one place"
slug: one-branch-one-place
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/one-branch-one-place.md, an English article on why a branch's worktree is at one derived place. It covers the paths that callers chose before the rule and the cost of having no answer to where a branch is. It covers the derivation from git's shared metadata, its safety checks and its fixed suffix (ADR 0021), `majordomus worktree create`, and the layered enforcement with its honest limits (project.worktree-topology). It covers migration verified by fingerprints, and a reclaim that removes worktrees, never branches, and refuses what it cannot prove. Every statement is one that ADR 0021, that rule or docs/WORKTREES.md on master states, and no count is typed by hand. site/content-src/jedna-vetev-jedno-misto.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the claiming, continuity and derivation articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site's articles be developed and interlinked in every language. Where each session's work lives is the first thing a session working beside others has to know. The site explained it only in docs/WORKTREES.md, the rule and the ADR, which are written for the sessions that follow them."
current_state: "No article explains the worktree topology. The nine article groups relate each other, and none of them names it."
desired_state: "/one-branch-one-place/ and /jedna-vetev-jedno-misto/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 passes, with the translation at its source's digest."
