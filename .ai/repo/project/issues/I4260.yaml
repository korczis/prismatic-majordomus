id: I4260
milestone: a-second-adopter-is-served
title: "A task's scope can be widened, with the widening recorded"
slug: a-task-scope-grows-on-the-record
priority: p2
profile: implementation
parallel_safe: true
objective: "`majordomus scope add <path>...` widens the active task's scope and appends a ledger line naming who widened it and why."
why: "An adopter's field report (a private Python client repository adopted from the v1.0.0-alpha.8 release on 2026-10-27, with the plan model, project rules, knowledge, skills, Claude Code capture and a GitHub projection all in use) found: work that legitimately grew (a lock file, a new test directory) could only be accepted by `finish --outcome partial` and a second `start` with the wider scope."
current_state: "start fixes the scope for the task's life. Data point 2026-11-25: a third adopter widened two scopes in one day by finish --outcome partial and a fresh start, the same remedy each time. The same day a start was refused twice for its form: the scope list is comma-separated (a space-separated list was read as more task words) and an undeclared exemption class is refused."
desired_state: "`majordomus scope add <path>...` widens the active task's scope and appends a ledger line naming who widened it and why."
scope:
  - ".ai/repo/project/issues/I4260.yaml"
  - "lib/start.sh"
  - "lib/check.sh"
  - "bin/majordomus"
  - "test/cases/4260_a_scope_widens_on_the_record.sh"
depends_on: []
acceptance_criteria:
  - "A path added to the scope stops failing check"
  - "The ledger names the widening"
validation:
  - "bash test/run.sh 4260_a_scope_widens_on_the_record"
evidence_required:
  - "case_a_task_scope_grows_on_the_record"
created_at: 2026-10-27
updated_at: 2026-10-27
evidence:
  - covers: second-adopter
    type: manual
    command: "majordomus start \"<task>\" --scope templates,scripts,content,static,data,i18n,zola.toml; npm install --save-dev --save-exact esbuild@0.28.2; majordomus check"
    result: "check: FAIL scope package.json, outside claimed scope. A partial ECharts bundle needed esbuild in package.json and package-lock.json. The only exit was handover --close on task t-20261114161439-96ea, which had no commits, then a fresh start (t-20261114162648-a7df) with package.json and package-lock.json added. That task landed 35d7350 and 5f272e0. Same adopter, 2026-11-12: a generator (build-i18n) rewrote zola.toml outside a task's scope and finish was refused under scope-integrity, closed the same way. majordomus 1.0.1."
    url: "https://github.com/korczis/korczis.github.io/commit/5f272e072742db3c875b123ebf05fff0a1123092"
    recorded_at: 2026-11-14T18:24:21Z
  - covers: third-adopter
    type: manual
    command: "git push  # korczis/oscilla pre-push: majordomus finish --check"
    result: "From oscilla-ff (OSCILLA session cae276ab, 2026-11-15), a third adopter. finish --check refused the pre-push three times in one session where the work honestly reached past the task's scope: R050 (modulation.js), V503 (audio/clock.js and the synth sinks) and V508 (main.js). The only remedy each time was finish --outcome partial and a fresh start with the wider scope."
    url: "https://github.com/korczis/oscilla/pull/562"
    recorded_at: 2026-11-15T19:10:56Z
