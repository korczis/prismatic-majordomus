objective: "An Implement action on an issue page (apps/majordomus-cli/src/ui/issues.rs) starts one authorised execution through apps/majordomus-cli/src/execution that a local worker runs in a worktree created by the worktree topology; an idempotency key derived from the issue and actor makes a double click, reload or retry return the same execution id, and with no worker enabled the page states the waiting reason."
