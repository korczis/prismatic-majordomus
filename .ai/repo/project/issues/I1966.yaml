    type: test
    command: "jq '.graph.metadata.truncated, (.graph.nodes|length), (.graph.edges|length)' docs/generated/graph.json; cargo test --lib -- graph:: generate::tests::a_composed_graph"
    result: "ok at e8505a431d plus this change, on lundra: 89 passed, 0 failed. The committed docs/generated/graph.json holds 2795 nodes and 6128 edges with metadata.truncated false, past MAX_NODES 2000, because graph::composed_complete composes without a bound; generation now passes it through graph::whole, so a truncated composition exits 10 naming the count it held and the bound instead of being written. The implemented_by edge from majordomus://claim/mcp-uri-resolution to apps/majordomus-cli/src/capability/builtin/objects.rs is present"
    artifact: "docs/generated/graph.json"
    commit: e8505a431d552b9a9d6b7baebb91dfdee4451bbf
    recorded_at: 2026-10-14T20:14:05Z
  - covers: truncation_refusal_case
    type: test
    command: "cargo test --lib generate::tests::a_composed_graph_that_stopped_at_a_bound_is_refused_and_not_committed, then again with the refusal in graph::whole removed"
    result: "ok as written: a composition bounded at one node is refused with exit 10 and a message naming 1 node and the bound 2000, and a whole one is accepted. With the refusal removed the same test FAILED, panicked at generate.rs:3248, so the test fails if the refusal is removed; the file was restored afterwards"
    artifact: "apps/majordomus-cli/src/generate.rs"
    commit: e8505a431d552b9a9d6b7baebb91dfdee4451bbf
    recorded_at: 2026-10-14T20:14:19Z
  - covers: size_budget_measured
    type: artifact
    command: "wc -c docs/generated/graph.json; jq '(.graph.nodes|length), (.graph.edges|length)' docs/generated/graph.json"
    result: "measured at master 97c4521f91 and written beside graph::composed_complete: 2795 nodes, 6128 edges, 3,339,236 bytes. The committed artifact carries no bound, so no new constant was introduced; MAX_NODES stays the bound of a graph a person is shown"
    artifact: "apps/majordomus-cli/src/graph.rs"
    commit: e8505a431d552b9a9d6b7baebb91dfdee4451bbf
    recorded_at: 2026-10-14T20:14:33Z
