        min_running:
          type: integer
          format: uint32
          minimum: 0
          description: How many stay running when idle.
        autostart:
          type: boolean
          description: Whether a request to a stopped machine starts it.
        autostop:
          type: boolean
          description: Whether an idle machine is stopped.
