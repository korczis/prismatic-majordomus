# The Pages fast path: a push to master that can change the site becomes public without
# waiting for anything that cannot. It is an adapter over `scripts/pages`, which a person runs
# the same way (docs/GITHUB_PAGES_PERFORMANCE.md); the model it reads is .ai/repo/ci/pages.yaml.
#
# What is on this critical path: the committed derived data proved current by its own input
# hash, the site rendered from it, every static check over the output, and the push to
# gh-pages. What is not: the behavioural suite, the crate's gates, coverage, the macOS suite,
# the benchmark check and the browser probe — validate.yml runs all of them on this same
# commit, in parallel, and they gate merging through the `ci` status. Nothing that can make the
# published bytes wrong was moved off; only what guards the repository rather than the bytes.
#
# One Rust step is on it, because it produces published bytes (ADR 0086): the crate's rustdoc,
# which the site serves at /rustdoc. The `rustdoc` job runs it through .github/actions/rustdoc
# — the rust gate's own rustdoc invocation and its handoff, nothing else of the crate's gates —
# and hands the tree to the deploy job as an artifact of this run; scripts/site-build composes
# it and refuses to build without it, and the deploy proves the public copy is this commit's.
#
# The `paths:` below is derived, not written: it is `scripts/pages paths`, which is the union
# of the gate model's classes that name the site-build gate plus this model's extras.
# test/cases/97_pages_fast_path.sh fails when the two differ.
name: pages
on:
  # Every thirty minutes, matching the window pages-check judges by (OWED_AFTER, 1800s). The
  # publisher had no retry: a run that failed left the site where it was until a person noticed,
  # and on 2026-09-14 that was seven hours — every push-triggered run failed at link-check's
  # refusal while the site served 8cf4570. The gate that would have said so, `pages-live`, is
  # at-finish, so it is asked when a session declares itself done and never on a clock.
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [master]
    paths:
      - .ai/**
      - .ai/repo/doc-command-baseline.txt
      - .ai/repo/evidence-baseline.txt
      - .ai/repo/evidence/**
      - .envrc
      - .githooks/**
      - .github/actions/rustdoc/**
      - .github/workflows/pages.yml
      - .nojekyll
      - AGENTS.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - LICENSE
      - README.md
      - SECURITY.md
      - apps/majordomus-cli/Cargo.lock
      - apps/majordomus-cli/Cargo.toml
      - apps/majordomus-cli/build.rs
      - apps/majordomus-cli/src/**
      - apps/majordomus-cli/src/capability/builtin/design.rs
      - apps/majordomus-cli/src/cockpit/logo-mark.svg
      - apps/majordomus-cli/src/design/**
      - apps/majordomus-cli/src/web/tokens.css
      - assets/**
      - bin/**
      - docs/**
      - docs/CLAIMS.yaml
      - docs/DESIGN_SYSTEM.md
      - docs/EVIDENCE.md
      - docs/claims/**
      - docs/generated/**
      - examples/**
      - lib/**
      - package-lock.json
      - package.json
      - rust-toolchain.toml
      - scripts/ci/design-check
      - scripts/ci/doc-command-check
      - scripts/cockpit-assets
      - scripts/cockpit-probe
      - scripts/evidence-check
      - scripts/generate-site-data
      - scripts/github-sync
      - scripts/interaction-probe
      - scripts/lib/**
      - scripts/lib/browser.mjs
      - scripts/lib/cockpit-probe.mjs
      - scripts/lib/interaction-specs/**
      - scripts/lib/interactions.mjs
      - scripts/lib/project-links.awk
      - scripts/lib/ui-*.mjs
      - scripts/lib/ui-routes.mjs
      - scripts/pages
      - scripts/rules-package
      - scripts/rust-check
      - scripts/site-basepath-check
      - scripts/site-build
      - scripts/site-check
      - scripts/site-deploy
      - scripts/site-probe
      - scripts/site-serve
      - scripts/ui
      - share/**
      - share/allow/**
      - share/cockpit/**
      - share/design/**
      - site/**
      - site/data/registry/**
      - site/data/registry/design.json
      - test/**
      - test/cases/638_a_documented_command_is_run.sh
  workflow_dispatch:

# Only what the deploy needs: the push to gh-pages. GitHub's own "pages build and deployment"
# serves that branch and needs no permission here.
permissions:
  contents: write
  # The second half of publishing, and the half this repository does not own: GitHub's own
  # "pages build and deployment" of the branch pushed below. Its status is a fact with an API,
  # and until 2026-09-11 this run could not read it — which is why an errored build was the one
  # failure mode of the three that left a green tick.
  pages: read
  # The evidence the site publishes beside its claims: `scripts/pages evidence` downloads the
  # `evidence` artifact validate.yml kept for this commit or its nearest ancestor, and reading
  # another run's artifact is this permission. Nothing here writes to Actions.
  actions: read

# The site is a projection of the newest commit, and the group serialises the runs that
# publish it: one run in flight, at most one waiting. Nothing cancels the run in flight —
# neither a push, nor a dispatch, nor the schedule. GitHub keeps only the newest *pending*
# run of a group and cancels the older pending ones, so a burst of merges still costs one
# extra deploy at most: the one already running, of an intermediate commit, which the
# waiting run of the newest commit overwrites as soon as it finishes. gh-pages is pushed in
# commit order, so an older tree can never land after a newer one.
#
# A push used to supersede the run in flight, on the reasoning that it always carries a
# newer tree. That is sound about the trees and wrong about the outcome: it starves the
# publication whenever merges arrive faster than a run completes, because the superseding
# run is itself superseded by the one after it, and nothing is ever published. Measured on
# 2026-09-12: three consecutive runs cancelled (19b275520, 55dbf7b07 and the run before
# them), the published site 34 commits behind master for three hours, and `pages-check`
# reporting "inside the deploy window" throughout because each cancellation reset the clock.
# A run is longer now than it was then — the rustdoc job, the build, and a probe that waits
# up to ten minutes on GitHub's own build — so on a trunk that moves every few minutes a
# cancelling group would publish nothing at all.
#
# A dispatch was already exempt for its own reason, which still holds: it is the recovery
# path, run *because* the automatic one did not publish, and a recovery that kills a deploy
# mid-`git push` to gh-pages, to publish the same tree a moment later, is a race with
# nothing to win.
#
# What this moves elsewhere is named here so that it is not mistaken for a regression of
# this setting: every run now finishes, so gh-pages is pushed more often, and a push to it
# supersedes GitHub's own Pages build in flight, which GitHub reports as `errored` with
# "Page build failed.". That is stage four of publication and is read, not hidden: the
# `GitHub's own build of what we pushed` step below and the `owed` job's rebuild remedy.
# A stale site from any cause is still refused by the `pages-live` gate of
# .ai/repo/ci/gates.yaml once a publication has been owed longer than the deploy window.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A scheduled run asks before it works: is a publication owed at all, and if so, which of its
  # two causes is this? When the site is current the run ends here, green, having spent one
  # small job — which is what makes forty-eight runs a day affordable now that a publication
  # also documents the crate (the rustdoc job below costs a Rust toolchain; ADR 0086). When one
  # is owed, the state chooses the remedy. If gh-pages does not carry the trunk's site,
  # deploying is the fix, and the two jobs below run as a push would run them. If gh-pages is
  # right and GitHub's own builder errored, deploying an identical tree changes nothing — the
  # loop would go round every thirty minutes for ever, looking like it was trying — so this job
  # asks GitHub to build again, through `scripts/pages rebuild`, which refuses to preempt a
  # build in flight. The state is read through `pages built`, the one place this repository
  # reads it. On a push or a dispatch this job is skipped and publishes nothing.
  owed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # pages-check waits up to five minutes for a young mismatch before calling it owed. One
    # bound for the job and none per step: nothing here is continue-on-error, so a kill by the
    # job's bound reads no differently from a step's, and test/cases/26_ci_wiring.sh sums
    # every step bound of this file against the deploy job's.
    timeout-minutes: 10
    # the rebuild request is a write to GitHub's Pages builder, and only this job makes it
    permissions:
      contents: read
      pages: write
    outputs:
      owed: ${{ steps.publication-owed.outputs.owed }}
      gate_rc: ${{ steps.publication-owed.outputs.gate_rc }}
      remedy: ${{ steps.remedy.outputs.remedy }}
    steps:
      # pages-check asks whether the published commit is on master and how far behind it is,
      # so it needs the history and the gh-pages branch, and no file of the past
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - id: publication-owed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          scripts/ci/pages-check > "$RUNNER_TEMP/owed.txt" 2>&1 || rc=$?
          sed 's/^/    /' "$RUNNER_TEMP/owed.txt"
          if [ "$rc" = 0 ]; then echo "owed=false" >> "$GITHUB_OUTPUT"; else echo "owed=true" >> "$GITHUB_OUTPUT"; fi
          echo "gate_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != 0 ]; then
            {
              printf '## A publication was owed when the schedule fired\n\n'
              printf 'What scripts/ci/pages-check said (exit %s):\n\n' "$rc"
              sed 's/^/    /' "$RUNNER_TEMP/owed.txt"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: remedy
        if: steps.publication-owed.outputs.owed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A rebuild helps only a tree that is already right: gh-pages built from this very
        # commit, whose GitHub build errored. An errored build of an older tree is the case a
        # deploy repairs — a push deploy that failed before publishing over a build that had
        # errored too — and asking to rebuild it would republish the stale site and skip the
        # deploy, every thirty minutes. test/cases/625 runs this step against both trees.
        run: |
          state="$(scripts/pages built --porcelain 2>/dev/null | cut -f1)"
          published="$(git show origin/gh-pages:build.json 2>/dev/null | sed -n 's/^  "commit": *"\([0-9a-f]*\)".*/\1/p')"
          head="$(git rev-parse HEAD)"
          if [ "$state" = errored ] && [ "$published" = "$head" ]; then remedy=rebuild; else remedy=deploy; fi
          echo "remedy=$remedy" >> "$GITHUB_OUTPUT"
          echo "the publication is owed; gh-pages carries ${published:-no readable commit} for $head and GitHub's build of it is ${state:-unreadable}, so the remedy is $remedy"
          printf '\ngh-pages carries %s for %s; GitHub'"'"'s build of it is %s, so the remedy is **%s**.\n' "${published:-no readable commit}" "$head" "${state:-unreadable}" "$remedy" >> "$GITHUB_STEP_SUMMARY"

      # the remedy for a build that errored on a tree that is already right
      - id: ask-rebuild
        if: steps.remedy.outputs.remedy == 'rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pages rebuild

  # The crate's Rust API reference, as the published surface `rustdoc` (ADR 0086). A job of its
  # own so that the deploy job keeps no Rust toolchain; its build cache is setup-rust's, which
  # Swatinem/rust-cache keys by this job's id, so it restores the small cache of a doc build and
  # never the multi-gigabyte one of validate.yml's rust job. The tree reaches the deploy job as
  # an artifact of this same run, which needs no permission beyond the ones below, and lives a
  # day: it is an input of this run and of nothing after it. Its wall time, checkout to upload,
  # is a phase of the controlled path (the `rustdoc` row the deploy job writes); the queue in
  # front of it and between the two jobs is GitHub's and is reported as queue.
  rustdoc:
    # A push or a dispatch always documents the crate; a scheduled run only when the owed job
    # chose a deploy. `!cancelled()` because the owed job is skipped on a push, and a skipped
    # need would otherwise skip this job with it.
    needs: owed
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.owed.outputs.remedy == 'deploy') }}
    runs-on: ubuntu-latest
    # a cold runner documents the crate after building every dependency's metadata; a hang is
    # still a failure long before GitHub's six hours
    timeout-minutes: 20
    outputs:
      seconds: ${{ steps.done.outputs.seconds }}
    steps:
      - id: t
        run: echo "start=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rustdoc
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: target/web/rustdoc
          if-no-files-found: error
          retention-days: 1
      - id: done
        run: echo "seconds=$(( $(date -u +%s) - ${{ steps.t.outputs.start }} ))" >> "$GITHUB_OUTPUT"

  # The bound is over two different kinds of second, so it is written twice, and the two
  # numbers are not independent.
  #
  # Each step of the controlled work carries its own minutes — that is what turns a hang into
  # a failure, which is all a timeout is for — and the job's bound must be strictly greater
  # than the sum of them, because *which* bound fires decides what GitHub reports. A step
  # killed by its own bound is a failed step, and on the publication probe below, which is
  # `continue-on-error`, a reported one; a job killed by the job's bound is `cancelled`, over
  # every step at once, including the ones that had already succeeded. Sizing the job at or
  # below the sum makes the job's bound the one that fires, which is the defect this file
  # was carrying: on 2026-09-10 the deploy of 67ec7c2aa published at 13:52:20, GitHub's own
  # "pages build and deployment" ran until 13:57:59, and a five-minute job bound killed the
  # job at 13:56:12 — mid-wait, with the publication already done — so a deployment that had
  # succeeded was reported as `cancelled`.
  #
  # The three controlled steps below bound 9 minutes between them, against the 96 seconds
  # .ai/repo/ci/pages.yaml budgets them warm and the 225 it allows the whole controlled half
  # cold; the probe bounds 11, against a wait this repository does not control and that same
  # file says never to budget. The job's 36 covers the sum of every step's bound — the evidence
  # read before the build, and after the probe the reads of GitHub's build, of the documentation
  # and of the crate's public reference — plus the unbounded checkout, setup, download and report
  # steps on a cold runner, and leaves the job's bound where it belongs: as the last resort
  # behind every step's own. No sum is written here, because a step's bound changes without this
  # comment: test/cases/26_ci_wiring.sh computes it and holds the job strictly above it.
  deploy:
    needs: [owed, rustdoc]
    if: ${{ !cancelled() && needs.rustdoc.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      # when the push was accepted, so that queue and runner allocation are measured as what
      # they are — GitHub's latency, reported beside this repository's and never mixed into it
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          echo "created=$(date -u -d "$created" +%s)" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      # The fast path read the tree and never its history, and was shallow for it. `pages check`
      # stopped being a statement about the tree alone when link-check became blocking (#356):
      # the site links to commits, compares and release tags, and a clone without history or
      # tags cannot decide any of them — 2302 commit links undecided and six existing tags
      # reported as non-existent, on every run since, with `publish` skipped behind the refusal.
      # fetch-depth: 0 is what the checker asks for by name. scripts/site-deploy still fetches
      # the one branch it pushes for itself.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # blob:none keeps the cost to history metadata: every commit and tag is present so the
          # link check can decide a ref, and no file of the past is fetched. The tree being built
          # is still checked out in full. From #357, kept because the declaration says what must
          # be decidable and this is how it is paid for.
          filter: blob:none

      # The depth above is a declaration; this is the measurement, and both come from
      # deploy.checkout in .ai/repo/ci/pages.yaml rather than from this file. `fetch-depth` is
      # one edit away from being tuned back for speed, and the failure that follows is not a
      # missing checkout — it is six links to tags that exist being called non-existent, three
      # steps later, inside a checker that looks like the thing at fault.
      - name: the checkout can decide a ref
        timeout-minutes: 1
        run: scripts/pages checkout --verify

      - id: setup
        uses: ./.github/actions/setup-site

      - name: timings
        run: |
          echo "MJ_PAGES_TIMINGS=$PWD/pages-timings.tsv" >> "$GITHUB_ENV"
          printf 'pages\tcheckout-setup\t%s\n' "$(( $(date -u +%s) - ${{ steps.t.outputs.start }} ))" > "$PWD/pages-timings.tsv"
          echo "MJ_PAGES_T_RUSTDOC=$(date -u +%s)" >> "$GITHUB_ENV"

      # the crate's reference, from the rustdoc job of this run, where scripts/site-build reads
      # the surface's artifact; the build refuses without it, and the check proves it this
      # commit's (scripts/site-check 13m)
      - name: the crate's Rust API reference
        uses: actions/download-artifact@v4
        with:
          name: rustdoc
          path: target/web/rustdoc

      # the `rustdoc` row: the job that produced the tree, checkout to upload, and the download
      # of it here — the whole of what the reference adds to the controlled path
      - name: rustdoc timing
        env:
          RUSTDOC_JOB: ${{ needs.rustdoc.outputs.seconds }}
        run: printf 'pages\trustdoc\t%s\n' "$(( RUSTDOC_JOB + $(date -u +%s) - MJ_PAGES_T_RUSTDOC ))" >> "$MJ_PAGES_TIMINGS"

      # The CI evidence of this commit or of its nearest ancestor, as site/data/evidence.json: a
      # deployment input like build.json, never committed. Never a gate: evidence of an ancestor
      # is published labelled stale, none at all as unavailable. validate.yml's evidence job
      # dispatches this workflow again once this commit's own evidence exists (ADR 68).
      - name: evidence
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pages evidence --commit "$GITHUB_SHA"

      # What moved since the deployment this run replaces is a fact of this build (scripts/site-build
      # `since_deploy`, the "Since the last deploy" section of /changelog/), measured by the
      # executable, which this job does not build: validate.yml's rust job keeps it as the artifact
      # majordomus-cli-<triple> of the commit it built. The one of this commit or its nearest
      # ancestor is fetched; site-build refuses one that does not describe this commit (its analysis
      # against the registry committed here finds a movement), and without one the page says the
      # delta is unknown. The previous deployment is read from gh-pages, whose every commit names
      # its source. Composed here, before the build, so the build row keeps measuring rendering;
      # the build adopts the record only when it names this commit. Never a gate.
      - name: since the last deploy
        id: since
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin gh-pages || echo "::notice::gh-pages could not be fetched; the changelog will say what moved since the last deploy is unknown"
          dir="$RUNNER_TEMP/since-deploy"; mkdir -p "$dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=majordomus-cli-x86_64-unknown-linux-gnu&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "master") | "\(.id)\t\(.workflow_run.head_sha)"' \
            > "$dir/list" 2>/dev/null || : > "$dir/list"
          # the nearest ancestor, not the newest upload, as the evidence step chooses
          while IFS="$(printf '\t')" read -r aid sha; do
            [ -n "$sha" ] || continue
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" 2>/dev/null || continue
            printf '%s\t%s\n' "$(git rev-list --count "$sha")" "$aid"
          done < "$dir/list" | LC_ALL=C sort -t "$(printf '\t')" -k1,1nr > "$dir/candidates"
          best="$(head -1 "$dir/candidates" | cut -f2)"
          bin=""
          if [ -n "$best" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$best/zip" > "$dir/cli.zip" 2>/dev/null \
             && unzip -qo "$dir/cli.zip" -d "$dir/cli" && chmod +x "$dir/cli/majordomus"; then
            bin="$dir/cli/majordomus"
            echo "the executable of $(jq -r '.commit // "an unrecorded commit"' "$dir/cli/majordomus-cli.json" 2>/dev/null) measures what moved since the last deploy"
          else
            echo "::notice::no executable of this commit or an ancestor is kept; the changelog will say what moved since the last deploy is unknown"
          fi
          # never a build here: without a kept executable the record says the delta is unknown
          if MJ_SITE_PREVIOUS_DEPLOY=origin/gh-pages MAJORDOMUS_BIN="$bin" MAJORDOMUS_NO_BUILD=1 \
               scripts/site-build --since-deploy "$PWD" "$dir/since-deploy.json"; then
            echo "record=$dir/since-deploy.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::what moved since the last deploy could not be composed; the changelog will say it is unknown"
          fi

      # the committed derived data proved current by hash, then rendered; no generation. What moved
      # since the last deploy is the record the step above composed, adopted when it names this commit
      - name: build
        timeout-minutes: 3
        env:
          MJ_SITE_SINCE_DEPLOY_RECORD: ${{ steps.since.outputs.record }}
        run: scripts/pages build

      # every static check over the output; the browser probe stays in validate.yml
      - name: check
        timeout-minutes: 3
        run: scripts/pages check

      # the one deploy path, the same script a person runs
      - name: publish
        id: publish
        timeout-minutes: 3
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          t0="$(date -u +%s)"
          scripts/site-deploy --skip-build
          printf 'pages\tpublish\t%s\n' "$(( $(date -u +%s) - t0 ))" >> "$MJ_PAGES_TIMINGS"

      # Publication, not workflow success: the site serves the commit it was built from at
      # /build.json, so this waits for that file to name this commit and measures the wait.
      # The wait is over GitHub's Pages build and its CDN, neither of which this repository
      # controls, so the bound is set from measurement and not from taste: GitHub's own "pages
      # build and deployment" ran for 33, 121, 204 and 338 seconds over the four deployments
      # of 2026-09-10, and 240 sat inside that distribution — which is how a publication that
      # had succeeded came to be reported as a failure. Ten minutes is that observed maximum
      # with about eighty per cent of headroom; it is a bound on waiting, not a budget, and
      # .ai/repo/ci/pages.yaml still budgets the controlled half alone. The step's own minute
      # of slack over it is deliberate: the script's timeout expires first, so what a reader
      # gets is its diagnostic — which commit the site is still serving — rather than a kill.
      # The check is not removed and not softened. continue-on-error keeps it a report rather
      # than a gate on a deployment that has already happened; what refuses a publication that
      # never happened is the `pages-live` gate of .ai/repo/ci/gates.yaml, which reads the
      # live site on the next validation run and is not advisory.
      - id: public
        continue-on-error: true
        timeout-minutes: 11
        run: |
          t0="$(date -u +%s)"
          MJ_PAGES_WAITED=/dev/null scripts/pages verify --commit "$GITHUB_SHA" --timeout 600 --smoke
          echo "pages_build=$(( $(date -u +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          echo "end_to_end=$(( $(date -u +%s) - ${{ steps.t.outputs.created }} ))" >> "$GITHUB_OUTPUT"

      # The documentation that commit publishes, as served. Only once the site serves this
      # commit, so what it measures is this build and not the wait: /docs/index.json must name
      # the commit, and the documentation root, every route the catalogue publishes a kind at,
      # one page per entity kind and the machine-readable documents must answer 200. Unlike the
      # wait above this is definite — the bytes are ours — so a failure fails the run.
      - name: The documentation it publishes
        if: steps.public.outcome == 'success'
        timeout-minutes: 2
        env:
          MJ_PAGES_PROBE_SECONDS: 5
          MJ_PAGES_INDEX_SECONDS: 30
        run: scripts/pages verify-docs --commit "$GITHUB_SHA"

      # The crate's reference, as the public site serves it: the `public` step proved the site
      # serves this commit's /build.json, and this proves the composed surface came with it —
      # /build.json and /rustdoc/surface.json name this commit, the landing page names it, the
      # crate's index is rustdoc's, its stylesheets and scripts, a module page and the search
      # index answer, and the crate's COMMIT constant page, the build's own witness, names this
      # commit too. Not continue-on-error, unlike the wait above: that one measures GitHub's
      # latency, and this one runs only once the site is known to serve this commit, so what
      # it can find is a broken publication — a reference that is missing, stale or half
      # there — and a broken public reference fails the deployment.
      - name: rustdoc
        id: rustdoc
        if: steps.public.outcome == 'success'
        timeout-minutes: 6
        run: scripts/pages verify-rustdoc --commit "$GITHUB_SHA" --timeout 300

      # The third way a deploy fails, and the only one that used to end in a green tick.
      #
      # The `public` step waits for the site to serve this commit and is deliberately a report:
      # what it waits on is the Actions queue, GitHub's Pages build and a CDN, none of which
      # this repository controls, and a gate on somebody else's latency is a gate that gets
      # waived. But "slow" and "failed" are not the same fact, and the second one has an API.
      # On 2026-09-10 at 17:35:10Z GitHub's build of gh-pages commit dfd9c989c errored with
      # "Page build failed."; the push had succeeded, the branch carried the right tree, this
      # workflow reported success, and the public site served the previous commit for 27
      # minutes with nothing red anywhere. A person noticed by eye, again.
      #
      # So the errored case — and only the errored case — is a failure of this run, at the
      # moment it happens, in the run that caused it. `scripts/pages built` separates the two:
      # 10 is a build that errored, which is definite and is ours to report; 12 is a build that
      # has not happened yet or could not be read, which is weather and stays a note. Nothing
      # here waits longer than the probe above already did, so the run costs no extra minute
      # when everything is well.
      #
      # `pages-live` in validate.yml still asks the same question on the next validation of
      # master, because a run that is cancelled before reaching this step cannot report
      # anything — but it no longer has to be the first to notice.
      #
      # Two minutes, and the wait inside them is sixty seconds, because the waiting was already
      # done: the probe above spends up to ten minutes on the site serving this commit, and
      # GitHub's build has either finished or errored long before that returns. This step is
      # the reading, not the wait — which is also what keeps the sum of the step bounds below
      # the job's own, the invariant test/cases/26_ci_wiring.sh holds this file to.
      - name: GitHub's own build of what we pushed
        if: always() && steps.publish.outcome == 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          scripts/pages built --branch gh-pages --wait 60 || rc=$?
          case "$rc" in
            0)  ;;
            10) echo "::error title=GitHub's Pages build errored::gh-pages was pushed and GitHub could not build it; the site still serves an older commit"
                exit 1 ;;
            *)  echo "::notice title=Pages build not determined::GitHub's own build of gh-pages was not readable or not finished within the wait; pages-live will ask again"
                ;;
          esac

      # A cancelled run is not a failure, and on a cancelled run nothing above this line has a
      # conclusion anybody reads: `gh run list` says `cancelled` whether the branch was pushed
      # or not. Fourteen of the seventeen cancelled runs of 2026-09-09/10 had published, and no
      # reader could tell them from the three that had not. So the run states it itself, in one
      # line, before it disappears: an annotation on the run and a line in its summary. This is
      # evidence, not a gate — a cancelled job cannot be made red from inside — and the gate
      # that acts on it is `pages-live`, on the next validation of master.
      - name: publication state
        if: always()
        env:
          PUBLISH: ${{ steps.publish.outcome }}
          SERVED: ${{ steps.public.outcome }}
        run: |
          if [ "$PUBLISH" = success ]; then
            echo "::notice title=Published::gh-pages was pushed with $GITHUB_SHA before this run ended"
            printf '\nPublication: **pushed** — gh-pages carries %s.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            # The public probe's verdict, stated rather than left as a grey icon inside a
            # green run. The probe stays continue-on-error (see its step for why), so without
            # this line a site still serving an older commit after ten minutes looked, from
            # the run page, exactly like a site that served this one.
            if [ "$SERVED" = success ]; then
              printf 'Public site: **serves** %s.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Public site not verified::after the probe's window the public site did not serve $GITHUB_SHA (probe: ${SERVED:-not run}); pages-live will refuse if it still does not"
              printf 'Public site: **not verified** (probe: %s) — it did not serve %s within the window.\n' "${SERVED:-not run}" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::error title=Not published::this run ended (publish: $PUBLISH) without pushing gh-pages; the site still serves an older commit"
            printf '\nPublication: **not pushed** (publish step: %s). The site still serves an older\ncommit; if no newer run of this workflow follows, the pages-live gate will refuse.\n' "$PUBLISH" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The measurement of a deployment that has already happened — and therefore a report,
      # for the same reason the publication probe above is `continue-on-error`.
      #
      # Until 2026-09-12 this step was the run's verdict. `scripts/pages report` exits 10 when
      # the controlled path is over its budget, nothing here softened that, and the step runs
      # after the push to gh-pages — so a breach measured on work already finished turned the
      # whole run red. Eleven runs went that way between 2026-09-11T22:36Z and
      # 2026-09-12T06:38Z (90a875cf2, 8ce9d3157, e98bfd44a, 48a546ebb, 0136bd9eb, b144b2110,
      # bbd5a9791, 94a018ded, 497d56d40, 180687c8f, 4a4ad6aac): every one of them pushed
      # gh-pages successfully, and the live site was verified to serve the newest of them.
      #
      # The proof that this told a reader nothing is the one run in that window which really
      # did fail to publish: d5e27a500, whose `build` step failed, whose `publish` was skipped
      # and whose report step therefore PASSED — there was nothing to add up. The run that had
      # not published was the one where this check was green, and it wore the same `failure`
      # as the eleven that had. On the tick on the commit, in `gh run list` and in the
      # notification the two were identical. This step's Markdown goes to
      # $GITHUB_STEP_SUMMARY and not to the log, so opening the log gave `Process completed
      # with exit code 10` with no number above it.
      #
      # `--advisory` keeps every number — the phase table, the total, the phase that spent it,
      # the `pages-slo` line, this step's outputs — and makes the breach a ::warning annotation
      # on the run instead of this run's conclusion. So the deploy job is red when, and only
      # when, the deployment is: the publish step failing, the build failing, or GitHub's own
      # build of gh-pages erroring. The budget's teeth are not softened anywhere else: the
      # default contract of `scripts/pages report` is still exit 10, for a person and for any
      # gate that calls it.
      - id: slo
        if: always()
        run: |
          scripts/pages report --advisory --timings "$MJ_PAGES_TIMINGS" \
            --queue "$(( ${{ steps.t.outputs.start }} - ${{ steps.t.outputs.created }} - ${{ needs.rustdoc.outputs.seconds || 0 }} ))" \
            --pages-build "${{ steps.public.outputs.pages_build || 'not measured' }}" \
            ${{ steps.public.outputs.end_to_end && format('--end-to-end {0}', steps.public.outputs.end_to_end) || '' }}

  # A scheduled run that found a publication owed has repaired it, or asked GitHub to, and ends
  # red anyway: the push-triggered deploy failed, was cancelled or never ran, and healing
  # without reporting would hide a fault that recurs every thirty minutes — the recurrence is
  # the thing worth seeing. It runs after the remedy, whatever became of it, so the report is
  # of an intervention that happened rather than one that was planned. test/cases/97 names this
  # step by its id rather than by any exit.
  intervention:
    needs: [owed, deploy]
    if: ${{ always() && needs.owed.outputs.owed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - id: report-intervention
        env:
          GATE_RC: ${{ needs.owed.outputs.gate_rc }}
          REMEDY: ${{ needs.owed.outputs.remedy }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          printf '## The publisher needed help\n\nA publication was owed when the schedule fired (pages-check exit %s). Remedy: %s; deploy job: %s.\n' \
            "$GATE_RC" "${REMEDY:-none}" "$DEPLOY" >> "$GITHUB_STEP_SUMMARY"
          echo "publication was owed (pages-check exit $GATE_RC); remedy $REMEDY, deploy $DEPLOY; reporting the intervention" >&2
          exit 1
