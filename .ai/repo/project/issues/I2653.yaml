  - "scripts/lib/diagrams.test.mjs"
  - "scripts/lib/interaction-specs/diagram.mjs"
  - "scripts/lib/interaction-specs/scroll-region.mjs"
  - "scripts/site-build"
  - "scripts/site-check"
  - "scripts/ci/link-check"
  - "test/cases/3006_diagrams_are_interactive_and_linkable.sh"
  - "docs/DIAGRAMS.md"
  - "docs/claims/a-diagram-is-named-linked-and-addressable.md"
