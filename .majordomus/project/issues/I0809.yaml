evidence:
  - covers: provenance_required
    type: test
    command: "test/run.sh 66_knowledge_edges"
    result: "one case passed. Every edge carries the file and the field or line it was observed in; the case asserts the provenance string of each of the six declared relationship kinds and then checks that no emitted row has fewer than four columns. Two guards are mutation-tested against a copy of the extractor: blanking a provenance argument makes the edge refused with a FAIL rather than emitted with an empty source, and renaming an edge type to one the closed set does not declare is an error rather than a new vocabulary word"
    commit: 4a7c934eb496b19925500730d9f2a5c4bbaecfe9
    recorded_at: 2026-09-04T18:30:53Z
  - covers: mutation_propagates
    type: test
    command: "test/run.sh 67_knowledge_mutation"
    result: "one case passed. Each mutation edits exactly one canonical file and the case asserts both what moved and what did not: redirecting a dependency moves that edge and leaves every other edge byte-identical; moving an issue to another milestone moves its part_of edge; repointing a claim's implementation repoints that edge; adding a claim adds its node and exactly its three declared edges and disturbs nothing else; deleting an issue removes its node and makes what pointed at it a reported dangling edge. Nothing generated is edited to make any of it happen, and the working tree is byte-identical afterwards"
    commit: 4a7c934eb496b19925500730d9f2a5c4bbaecfe9
    recorded_at: 2026-09-04T18:31:04Z
