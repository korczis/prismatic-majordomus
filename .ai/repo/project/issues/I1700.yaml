id: I1700
milestone: runtime-continuity
title: One locked ledger writer, one episode resolver, and stranded episodes recover themselves
slug: one-writer-one-resolver
priority: p0
profile: implementation
parallel_safe: false
objective: "Make the Rust session domain the only writer of the ledger and the only resolver of the current episode, recover stranded open episodes automatically at session start, write one spelling of repository identity, and hold the product's claim that it never invokes a model with a blocking gate."
why: "Every later slice records which episode a context revision and a prompt belong to, and today that answer is unreliable: 21 episodes sit open in sessions-open/ and session.recovered has never been written; attribution falls back to whichever episode opened last; the top-level Rust ledger reads a state/session-<key>.yaml layout that no longer exists and appends without a lock, as does the shell's mj_ledger_append; and repository_id is a git-dir path in one record and a remote URL in the next. A context revision attached to the wrong episode is worse than none."
current_state: "lib/common.sh mj_ledger_append is an unlocked >>; apps/majordomus-cli/src/ledger.rs append is unlocked and open_session_id reads a dead layout; session/ledger.rs Ledger::append is locked and unused; SessionStore::writable has no production caller; lib/recover.sh runs only by hand."
desired_state: "session/resolver.rs resolves an episode from the provider session key and never from a pointer when a key is given; session/writer.rs is the one locked append that both the shell and Rust call; session/recovery.rs closes episodes past policy session.stranded_after as interrupted with session.recovered on every SessionStart and on session recover; new records write RepositoryId::of; a gate fails on any HTTP client dependency, model-host string or provider CLI spawn outside declared data."
scope:
  - apps/majordomus-cli/src/session
  - apps/majordomus-cli/src/ledger.rs
  - apps/majordomus-cli/src/capability/builtin
  - lib/common.sh
  - lib/session.sh
  - lib/recover.sh
  - share/events.yaml
  - scripts/ci
  - .ai/repo/ci
  - .ai/repo/rules/project
  - test/cases
non_scope:
  - Context compilation and revisions (I1701)
  - Hook stdout contracts (I1702)
depends_on: []
acceptance_criteria:
  - Concurrent appends from shell and Rust processes produce well-formed lines with none lost, and no code path appends to the ledger outside the one writer, held by a gate
  - An episode is resolved from its provider session key; a missing key resolves to orphan, never to the last-opened episode
  - Stranded episodes are closed interrupted with session.recovered, exactly once, idempotently across repeated starts
  - New records carry one spelling of repository_id and old spellings are still read
  - A blocking gate fails on an HTTP client crate, a model-host string outside share/models or docs data, or a spawn of a provider CLI
  - The events context.created, context.invalidated, context.refreshed, context.delivered, prompt.recorded, invocation.completed, invocation.failed and invocation.unobserved are declared with their required fields
validation:
  - bin/majordomus-cli capabilities validate
  - bin/majordomus-cli generate --check
  - bash test/run.sh 240_the_session_domain_is_typed
evidence_required:
  - one_locked_writer
  - resolver_never_guesses
  - stranded_episodes_recover
  - no_model_invocation_gate
risk: "Shell ledger appends gain one process spawn each, which may move doctor and watch budgets; measured with MJ_TIMING before merging. A machine without the Rust executable loses ledger writes and must see a named refusal, not silence."
