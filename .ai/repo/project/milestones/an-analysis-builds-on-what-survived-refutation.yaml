id: an-analysis-builds-on-what-survived-refutation
title: "An analysis of a hard question tags every claim by its evidence, puts every finding to refutation and builds its conclusion only on what survived, and a check says whether its documents conform"
slug: an-analysis-builds-on-what-survived-refutation
order: 551
priority: p1
problem: "A worker who explains why something failed writes one confident narrative, and its wrong claims read as well as its right ones. In an adopter's three-pass analysis (2026-11-23, a repository with nondeterministic simulation tests) the second pass refuted or corrected 21 claims that the first pass or a peer had stated with confidence: a list called empty that had held rows, a default blamed as an outside change, a decomposition computed over mismatched periods. The protocol that caught them, evidence tags on every claim, a verdict on every finding and a synthesis from confirmed findings only, was enforced by hand, and its pass documents did not survive the session. Majordomus has reasoning records for one executor's decision (ADR 0098) and the project-picture skill asks for OBSERVED, DERIVED and INFERRED tags, but nothing checks an analysis document."
outcome: "A worker follows the skill evidence-tagged-analysis, writes the bundle (question, lenses, cross-checks, synthesis) in a table grammar, and majordomus reasoning analysis says conforms, fails with each defect at its file and line, or incomplete with each check that did not run and why; what a conforming answer proves is structure, and the answer says so."
acceptance_criteria:
  - "I4796 has landed: the skill, the capability reasoning.analysis on every surface, and a fixture bundle that conforms"
validation:
  - "bin/majordomus plan validate"
