id: I2462
milestone: development-runtime
title: "The UI has every screen, and its mesh is a graph whose nodes open an inspector"
slug: the-ui-has-every-screen
priority: p1
profile: implementation
parallel_safe: false
objective: "Complete the navigation of majordomus ui against the owner's references with the Command, Capabilities, Deployments and Documentation screens. Make the Mesh screen interactive: a graph of machines, runtimes and sessions, each node selectable into an inspector whose selection is a URL."
why: "I2461 (PR #940) delivered the surface and seven screens. The owner asked to 'implement every component and view of the screenshots, maximally interactive and clickable' (2026-10-11). The references (campaigns/majordomus-ui-complete-opus-fable-v3-20261011/references) show Command, Capabilities, Deployments and Documentation screens, and the mesh pack (campaigns/majordomus-mesh-interactive-v5-20261011) asks for every real node to be selectable and deep-linkable. The data exists: commands.list (with its origin filter) and executions.list, capabilities.list by kind and capabilities.describe, deploy.list and delivery.report (13 s, so a panel of its own), objects.list for features and documents, web.surfaces, and mesh.peers with runtimes and sessions."
current_state: "The UI shows seven screens; the mesh is a table."
desired_state: "Eleven screens in the references' order. Command lists the command catalogue with what each changes; its tabs pass commands.list's own origin filter, and it shows the executions this process runs. Capabilities shows the registry's tallies, catalogues by kind, and the detail of one capability (?id=) with its input fields and every surface it is exposed on. Deployments shows declared deployments and, on its own route, the delivery report: the public site's verification and each feature's stage and what blocks it. Documentation shows the product features, the documents under docs/ and every public surface. Mesh draws machines, runtimes and sessions as a force-directed graph (sessions as small leaves labelled when selected), and ?node= opens the inspector of a machine: its runtimes with liveness and last beat, its sessions with their claims, and its own journal events. An unknown machine is said to be unknown. Graphs take a layout and their nodes a kind. Not done here: actions on a node (V5 M04, behind the executor) and the execution control plane (V4)."
scope:
  - "apps/majordomus-cli/src/ui"
  - "share/ui"
  - ".ai/repo/project/issues/I2462.yaml"
  - "docs/MAJORDOMUS_UI.md"
  - ".ai/repo/features/ui.md"
depends_on: ["I2461"]
acceptance_criteria:
  - "/ui/command, /ui/capabilities, /ui/deployments and /ui/docs answer 200 with a hero and panels whose sources are named; a test renders every screen against a real registry"
  - "/ui/capabilities?id=plan.status shows that capability's declared input fields and its API, CLI and MCP exposure"
  - "/ui/mesh draws every machine, runtime and session the mesh runtime knows as a graph over a table fallback, and /ui/mesh?node=<name> opens that machine's inspector; an unknown name says it is unknown"
  - "The delivery report is a panel route of its own and never holds the Deployments screen back"
validation:
  - "cargo test --lib ui::"
  - "cargo test --test ui_surface"
  - "scripts/ci/cockpit-projection-check --ui-integrity"
evidence_required:
  - "ui_every_screen_renders_test"
  - "ui_mesh_inspector_screenshot"
