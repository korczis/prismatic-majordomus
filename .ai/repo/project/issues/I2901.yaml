id: I2901
milestone: idd-reads-at-a-glance
title: "One grammar names an issue id, and every surface reads it"
slug: one-grammar-names-an-issue-id
priority: p2
profile: implementation
parallel_safe: false
objective: "Declare the issue id grammar once: a pattern in the issue schema (or generated from one Rust const) and one plan::is_issue_id, read by ui/prs.rs, ui/idd.rs, case 3220 and share/ui JS, so no surface spells it its own way."
why: "Four places restate the grammar and disagree: prs.rs says I and four digits, idd.rs any digits, case 3220 /I\\d{4}/, and the schema declares no pattern at all, although all 429 records are I and four digits."
serves:
  - the-owner-directs-work-from-the-ui#workspace-is-derived
current_state: "issue.v1.schema.json types id as a bare string; four surfaces carry their own predicate."
desired_state: "The schema states the pattern; one predicate exists and every surface calls it; a test fails if a second one appears."
scope:
  - "share/schemas/majordomus/issue/issue.v1.schema.json"
  - "apps/majordomus-cli/src/plan.rs"
