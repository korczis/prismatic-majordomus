id: what-a-workspace-decides-reaches-the-repository-with-its-source
title: "What the owner decides in a vendor workspace reaches the repository, and every promoted record opens the message it came from"
statement: "The owner thinks aloud in the ChatGPT project. What he decides there is read into this checkout's own store, promoted by a person into intents, ADRs, milestones, issues and knowledge, and every promoted record names the conversation and message it came from, so that from the UI one click opens that message for the operator who holds the store, while the public repository and site carry only the reference."
invariants:
  - "Synced content is checkout state under .ai/local/workspaces/ and never reaches a published projection (ADR 0032)"
  - "A promoted record carries the decision and a typed pointer, never a summary of the conversation (rule project.never-store-transcripts)"
  - "A workspace reference validates in every checkout and CI from tracked data alone; only resolving it to the message needs the store"
  - "No credential, cookie or token is stored, and no other tool's credential is read"
  - "Promotion is a person's act; no sync writes the tracked tree"
non_goals:
  - "Mirroring chat history between vendors"
  - "Writing anything to the vendor"
  - "A second vendor (a Claude Project) before the first vendor's pipeline is proven; the owner asked for Claude parity in a conversation this intent cites, so this order stands only until the owner confirms or reverses it"
milestones:
  - "a-promoted-record-opens-its-message"
  - "a-workspace-reaches-the-repository"
  - "what-a-workspace-decides-reaches-the-repository-with-its-source"
satisfaction:
  - id: the-store-holds-the-workspace
    criterion: "majordomus workspaces reports chatgpt-majordomus as synced, with the checkpoint age, conversation and message counts and support level, from .ai/local/workspaces/chatgpt-majordomus/ (planned proof: I1306's resume-and-repeat case run against the imported store, and the workspaces capability of I1308)"
    evidence: command
    ref: "majordomus intent explain what-a-workspace-decides-reaches-the-repository-with-its-source"
  - id: a-reference-validates-everywhere
    criterion: "A plan, ADR or knowledge record whose provenance names workspace:<id>/<conversation>#<message> validates in a clone with no store, and an unknown workspace id is refused (planned proof: a case I3281 adds, numbered from scripts/case-numbers when the issue starts)"
    evidence: command
    ref: "majordomus intent explain what-a-workspace-decides-reaches-the-repository-with-its-source"
  - id: a-reference-opens-its-message
    criterion: "On /ui a promoted record's workspace reference opens the cited message for a loopback caller when the store holds it, reads 'not held in this checkout' when it does not, and a caller beyond loopback never receives message text (planned proof: the ui_workspace_reference test target I3283 adds, and I3282's local-only read test)"
    evidence: command
    ref: "majordomus intent explain what-a-workspace-decides-reaches-the-repository-with-its-source"
  - id: nothing-synced-is-published
    criterion: "The published snapshot and the site build contain no message text or title from the store, and a gate fails when one does (planned proof: I3283's case: a fixture checkout whose store holds a canary message and title builds the snapshot and the site, and fails when either canary appears)"
    evidence: command
    ref: "majordomus intent explain what-a-workspace-decides-reaches-the-repository-with-its-source"
  - id: the-import-is-pinned
    criterion: "No record promoted by the 2026-10-18 import still cites a positional message index, in typed provenance or in prose (planned proof: majordomus plan validate and bin/majordomus knowledge check reporting zero positional typed references, and I3281's prose detector reporting zero untyped ones)"
    evidence: command
    ref: "majordomus intent explain what-a-workspace-decides-reaches-the-repository-with-its-source"
  - id: a-vendor-reads-and-never-writes
    criterion: "A vendor caller, authenticated as an ADR amending ADR 0126 defines, reads plan records through a listener of its own and is refused every repository_mutation capability and all workspace message text (planned proof: a case I3285 adds, numbered from scripts/case-numbers when the issue starts)"
    evidence: command
    ref: "majordomus intent explain what-a-workspace-decides-reaches-the-repository-with-its-source"
  - id: a-proposal-names-its-source
    criterion: "An intent proposed from a workspace lands as a proposed intent whose provenance is its workspace reference, and nothing is recorded as accepted until a person accepts it (planned proof: a case I3286 adds once the owner has decided remote proposal)"
    evidence: command
    ref: "majordomus intent explain what-a-workspace-decides-reaches-the-repository-with-its-source"
