id: a-provider-carries-the-contract-natively
title: "Each agent client enforces and observes the repository's contract through its own extension points, generated from the registry"
statement: "Claude Code first, then Codex, carry Majordomus's scope, finish and session contract through their own hooks, skills, plugins and mods, all generated from the capability registry and kept in sync by a gate, so that an out-of-scope edit is refused before it happens and a session that stops owing work is told so, the hooks and the MCP listing they load stay within declared budgets, and the editors that read the layer validate it against its own schemas, without Majordomus embedding or patching any client."
invariants:
  - "Every client artefact is a generated projection stamped with its source; a hand edit fails the drift gate"
  - "A client's own memory or settings never become canonical state"
  - "Personal settings, permission modes and model choice are never projected (ADR 0140, ADR 0145)"
  - "No client binary is patched"
non_goals:
  - "An agent runtime, marketplace or scheduler of Majordomus's own"
  - "A Gemini adapter, deferred until the Codex adapter (I3303) settles the adapter shape; the verified Gemini evidence and the SessionEnd and PreCompress caveats in share/providers.yaml stay"
  - "Loading code from outside the repository: external scripted capabilities belong to repository-automation-is-typed"
milestones:
  - "a-provider-carries-the-contract-natively"
satisfaction:
  - id: one-plugin
    criterion: "One generated Claude Code plugin carries the skills, hooks, mods and MCP server, loads through an install mechanism recorded with dated vendor evidence and the detected client version, and replaces the hand-assembled pieces rather than doubling them (planned proof: I3300's structural case on the generated plugin, and an opt-in end-to-end case gated like case 2980)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: installed-extension-drift-reported
    criterion: "doctor reports an installed plugin, mod or shim whose digest, version or declared permissions differ from what the repository generated, and an unknown active mod (planned proof: the case I3302 adds)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: the-guard-is-wired
    criterion: "Claude Code calls the edit guard on every Edit, Write, MultiEdit and NotebookEdit through the configuration capture install generates, and doctor reports an unwired or hand-edited guard (planned proof: a case that reads the generated .claude/settings.json, added by I3322)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: unclaimed-edit-refused
    criterion: "An edit no claim covers, made through Claude Code's file-writing tools, is refused before it happens through the generated configuration; a Bash-tool write is not judged at edit time and is caught by the task scope at check, finish and the pre-push hook (planned proof: a case that pipes a payload through the command the generated .claude/settings.json names, added by I3323; case 3069 proves the guard's judgement alone)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: codex-parity
    criterion: "Codex sessions draw episodes from Codex's own hooks and, where share/providers.yaml records dated evidence of a Codex pre-tool hook, refuse an unclaimed edit, judging every path an apply_patch names; without such a hook, Codex edits are caught at check, finish and the pre-push hook (planned proof: I3303's structural case, and an opt-in end-to-end case against a dated Codex version)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: stop-reports-owed
    criterion: "A Claude Code session that ends a turn with an active task that still owes work is told what it owes, read from the running server's obligations capability, without its stop being blocked (planned proof: the case I3301 adds)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: hooks-within-budget
    criterion: "Every generated hook that runs per prompt, per turn or per edit (capture, Stop report, edit guard) stays within a latency budget declared in benchmark policy, and no captured record is lost (planned proof: majordomus bench --check and the burst case I3304 adds)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: mcp-listing-bounded
    criterion: "The default MCP tools/list of the server the plugin carries stays within a declared byte budget, and each tool's full schema is fetched on demand (planned proof: the listing-size gate I3307 adds)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: editor-validates-the-layer
    criterion: "Zed validates and completes .ai records against the layer's own schemas through generated schema associations (planned proof: majordomus generate --check over the associations I3308 generates)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: codex-prompts-are-captured
    criterion: "A Codex prompt delivered through Codex's own UserPromptSubmit hook writes one capture record with provider codex, keyed with I3406's namespaced identity. capture status reports every provider that share/providers.yaml declares with a prompt hook as captured or unadapted (planned proof: case_a_codex_prompt_is_captured in test/cases/29_prompt_capture.sh written by I3410)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
  - id: the-browser-bridge-is-declared
    criterion: "Every provider in share/providers.yaml declares whether its client drives a browser beside the server (browser: bridge or none) with cited evidence, every surface that reports provider capability shows it from that one declaration, and preflight reports a declared bridge whose native messaging host is missing on this machine as a finding with the person's remedy, never as a failure (planned proof: case_a_provider_declares_its_browser_bridge, written by I3829)"
    evidence: command
    ref: "majordomus intent explain a-provider-carries-the-contract-natively"
