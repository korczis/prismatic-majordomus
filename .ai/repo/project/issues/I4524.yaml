  - "Case 4524: .ai/repo/ci/telemetry.yaml declares trigger.skip_conclusions [cancelled] and the case fails when the model and the workflow disagree"
  - "actionlint .github/workflows/telemetry.yml passes"
  - "On GitHub after landing: a cancelled validate run's telemetry run concludes skipped with no runner assigned, and a completed one's export job runs (evidence names both run ids)"
  - "docs/CI.md, section Telemetry, says a cancelled validate run is not exported and that a cancel costs no runner"
