id: I4366
milestone: adopter-upgrades
title: "A merge whose subject is its pull request's title is read as that pull request, and an adopter's lower-case branch names its upper-case record"
slug: a-merge-titled-by-its-pull-request-is-attributed
priority: p1
profile: implementation
parallel_safe: false
objective: "Two readings that I2901's grammar does not fix. (1) worktree/state.rs issue_of compares a branch component with a declared id ASCII-case-insensitively, keeping its rule otherwise (the component equals the id, or begins with the id followed by `-`), and still returns the declared id, so feat/v603-timeline-pinch names V603. Every caller inherits it: delivery's branch_names, integration/mod.rs:1154, capability/builtin/devtask.rs:180, worktree/trace.rs:612, worktree/service.rs:669 and :861, and intent_realization.rs:508. issues_named and named_by keep finding an id anywhere in the branch bounded by non-alphanumerics, as they do today. (2) plan/delivery.rs merge_subject reads a two-parent commit whose subject ends in ` (#N)`, which GitHub appends to a merge commit titled by its pull request (merge_commit_title=PR_TITLE), as the merge of pull request N, with the subject minus that suffix as its title; the body is not read for this form, because under merge_commit_message=PR_BODY its first line is the pull request's body, not its title. A two-parent commit with no trailing ` (#N)` and no `Merge pull request #`, `Merge branch '` or `Merge remote-tracking branch '` prefix stays what it is today: a merge with no pull request, branch or title. This repository's derived merges ('merge: master (6c79dcf68cf) into I4241, derived') are therefore never read as pull requests. Under PR_TITLE plus PR_BODY a merge commit carries no branch, so in an answer at a commit a pull request that named its id only in its branch cannot be attributed. The delivery report then lists such a merge under a new report-level `unattributed` list (commit, pull request, title, reason): the merge carries no branch, and the live answer reads the pull request's branch from the forge's merged-pull-request observation. It is never dropped silently. A merge the live answer attributes through the forge is not listed. The merge-subject reader is one shared function, merge_subject in plan/delivery.rs or a module both callers use: it is the only code that reads a pull request, branch or title from a merge subject, and the first-parent changelog of I4368 calls it rather than matching subjects of its own."
why: "On 2026-10-29 OSCILLA's owner switched korczis/oscilla to merge commits titled by the pull request (allow_squash_merge=false, allow_rebase_merge=false, merge_commit_title=PR_TITLE, merge_commit_message=PR_BODY). From then on its merge subjects no longer start `Merge pull request #`. merge_subject (delivery.rs:418-445) reads them as merges with no pull request, branch or title, so parse_history (delivery.rs:383-387) gives them no title either. In an answer at a commit, a landing is then attributed only through a member commit whose own subject names the id (via `subject`, delivery.rs:996-1000), and to nothing when none does. issue_of compares components case-sensitively, so an adopter's lower-case branch never names its upper-case record, and branch_names (delivery.rs:474-485) inherits that. OSCILLA's owner made the rule universal: every pull request names a record in its title or its branch. A branch is lost at a commit, so the recommendation to OSCILLA is that its planned pull-request-metadata judge (the issue its precondition plan PR files) require the id in the title. This issue makes the branch-only case visible instead of silent."
current_state: "Measured at 5370ee63d19. plan/delivery.rs:418-445 merge_subject recognises only `Merge pull request #N from owner/branch` (the only form it calls a pull-request merge), `Merge branch '...'` and `Merge remote-tracking branch '...'`. parse_history (delivery.rs:366-414) sets a merge's title, from its body's first line, only when merge_subject calls it a pull-request merge (:383-387). worktree/state.rs:564-577 issue_of compares each branch component with each declared id case-sensitively (component == id, or strip_prefix(id) and then `-`). delivery.rs:474-485 branch_names calls issue_of. Six other modules call issue_of too: integration/mod.rs:1154, devtask.rs:180, worktree/trace.rs:612, worktree/service.rs:669 and :861, and intent_realization.rs:508. In this clone 7 refs have a lower-case id component, such as chore/i0905-is-recorded-done and fix/i4223-the-pre-commit-gate-answers-in-its-bound, and issue_of names none of them today. ui/prs.rs:174-191 issues_named upper-cases head_ref and finds an id bounded by non-alphanumerics anywhere in it, and named_by (delivery.rs:449-471) wraps it for merges and pull requests. delivery.rs:1001-1015 reads the forge's merged-pull-request titles and branches, from the deployment observation that `majordomus served forge` records (merged_titles, :788), in the live answer only. IssueDeliveryReport (delivery.rs:311-326) has no list of unattributed merges. This repository has 24 two-parent commits titled 'merge: master (<sha>) into <id>, derived' in master's history, and 313 of the last 400 first-parent commits on master are merges. 15 two-parent commits in master's history end in ` (#N)` without being the forge's `Merge pull request #` merge, such as 'Merge fix/the-crate-floor-is-a-ratchet (#348)' and 'merge: segment 4's base d4ce9d69f7 into the UI stack's top (#957)'. The new rule reads each of these as a pull-request merge, and none of their titles names an issue id."
desired_state: "A merge titled by its pull request is attributed by its title in every answer. A lower-case branch names its record on every surface that calls issue_of. A derived merge is never a pull request. A branch-only pull request is attributed live, and at a commit it is listed as unattributed with its reason. No issue of this repository changes stage. Enforced by case 4366 and by library tests and doctests in plan::delivery and worktree::state."
