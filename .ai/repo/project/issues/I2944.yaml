id: I2944
milestone: every-surface-follows-what-changed
title: "A monitor source is declared once, and every surface derives its inventory from that declaration"
slug: a-monitor-source-is-declared-once
priority: p1
profile: implementation
objective: "One table, SOURCES in apps/majordomus-cli/src/monitor/mod.rs, declares every monitor source with its name, cursor tag, whether a follower reads it unasked and whether its positions are coarse. MonitorSource's inventory, parse and name, the refusal that lists the sources, the follow channel's accepted names and default, the blackboard's default, the cursor's parts and the fold's lanes are read from it, so a new source is its variant, its row and its reader, and nothing else lists it."
why: "The owner's bus mission (2026-11-05, 'jaktoze stale nefunguje genericke bus propojeni?'): discovery found the monitor's sources a closed enum of three, copied by hand into builtin/monitor.rs (the refusal text and the per-source branches), http/follow.rs (DEFAULT_SOURCES, a matches! of the three names, the refusal text), builtin/blackboard.rs (DEFAULT_SOURCES), the CLI help twice and docs/MONITOR.md, with a three-lane fold and a three-part cursor. Reproduced on the shared server: GET /api/v1/monitor?sources=executions answered 'unknown source \"executions\": the sources are mesh, executor and github' while /api/v1/executions held 36 executions. No existing issue owned the registry; I3218 (executions as a source) builds on it."
current_state: "On master 4795a79d954: monitor/mod.rs:40-57 MonitorSource {Mesh, Executor, Github} with ALL: [_; 3]; assemble folds three named lanes and Cursor has three fields; the copies above."
desired_state: "MonitorSource::all, spec, as_str, parse, names_sentence and followed_by_default read SOURCES; Cursor keeps one part per source in SOURCES order with typed accessors; Reads is one entry per source and assemble one lane per row of SOURCES, the never-split-a-second rule being the coarse flag; the follow channel, the blackboard and the capability take their names, default and refusal from it; the CLI help and docs/MONITOR.md no longer list the sources by hand."
