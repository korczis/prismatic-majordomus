id: I4241
milestone: development-runtime
title: "A follower's shared read is keyed by its own server, so a follower of another context is never handed it"
slug: a-followers-read-is-its-own-servers
priority: p0
profile: implementation
parallel_safe: true
objective: "The blackboard snapshot and the pages of signals that followers share are keyed by the server's epoch as well as by what is asked, so two contexts in one process never read each other's board or cursor."
why: "Master validate 40323749698 at 22a914d002a (train 8) was red on one test only: coverage, http::follow::tests::a_follower_is_written_its_snapshot_each_change_and_a_heartbeat (follow.rs:1186; the frames were ready, three snapshots, ping and heartbeat, never blackboard.signals). Train 8's head b63ff0c8701, the same tree, was green. In apps/majordomus-cli/src/http/follow.rs the shared slots BOARD and PAGE are keyed by `checkouts` (\"repository\" for every follower) and by sources, reader and cursor, none of which names the context, and a slot read at a generation at or past the asked one is handed out. The tests run many contexts in one process, so a follow test running beside another was handed that test's board or cursor, and the signals of its own mesh never came. Reproduced on master: 2 of 30 runs of the http::follow module failed. Found by 39 after the 13:30Z crash on 641b."
current_state: "Measured at origin/master 22a914d002a on 2026-10-26: Follower::snapshot calls `shared(&BOARD, checkouts, ...)`, and page_key formats sources, reader and cursor only."
desired_state: "Follower::snapshot keys BOARD by `epoch(ctx)|checkouts`, and page_key prefixes `epoch(ctx)`, so the latest-cursor read and every page of signals are also the server's own. One server per process, which production is, reads exactly what it read before."
scope:
  - "apps/majordomus-cli/src/http/follow.rs"
  - ".ai/repo/project/issues/I4241.yaml"
non_scope:
  - "The shape of the shared slots (one board, one page) and the global BLACKBOARD generation"
  - "Any other flaky test of the coverage job"
depends_on: []
acceptance_criteria:
  - "Two contexts in one process, read at the same generation, are each read their own board"
  - "Without the keyed slots the new test fails at the second context's board"
  - "The http::follow module passes repeatedly where master failed it"
validation:
  - "cargo test --locked --manifest-path apps/majordomus-cli/Cargo.toml --lib http::follow::"
evidence_required:
  - rust
serves: []
