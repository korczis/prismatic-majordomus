id: I3990
milestone: mcp-transports-are-reliable
title: "An exclusive mesh claim lives by its holder's progress: a session stuck on a dialog, hung or crashed stops refusing others while its server beats on"
slug: a-claim-lives-by-its-holders-progress
priority: p0
profile: implementation
parallel_safe: false
objective: "Add a second layer of mesh liveness under the stream beat: a session that does real work (an MCP request other than ping and notifications/*, an announcement, a claim, or an explicit mesh.beat with the phase a long-running process is in) has a session_beat written for it carrying cooperation.session_ttl_seconds (default 600); every runtime ages the newest beat on its own clock and reads a held exclusive claim of a session silent past its ttl (plus the expiry on any runtime but the holder's) as suspended, refusing nobody, until the session beats again. Sessions are never closed for silence, advisory claims are untouched, and nothing is taken over or fenced (that waits for I3174's epoch). A session that never beat keeps the stream rule."
why: "The owner ordered on 2026-10-22 that no work may stall because a peer waits on a permission dialog, crashed or hung. That day the executor of seat 5d held the integration lease, an exclusive mesh claim, for hours and never answered; the claim stayed live because a claim lived while its runtime beat, and the runtime beat on while the worker behind it waited on nobody. The stdio bridge pings every 20 s whatever its client is doing, so nothing a stalled client sends could tell the mesh it had stopped. The design — suspend claims, never close sessions; a typed beat with a phase for long-running processes; one rule for every transport; advisory-first — is the approved mesh review fc/p7 of 2026-10-23."
current_state: "mesh::state::fold expires a claim only when it is released, its session closes, or its stream stops beating (ADR 0067 decisions 7 and 8, rule project.mesh-cooperation-is-authenticated version 1). A session's last MCP message, ping included, refreshes its place on the board and nothing else."
desired_state: "An exclusive claim of a session whose worker stops making progress reads suspended within cooperation.session_ttl_seconds on its holder's runtime and within that ttl plus the expiry everywhere else, while its runtime keeps beating; the scope is admitted to the next claimant; mesh.state, mesh.peers (with each session's progress age and phase), the Cockpit and /ui/mesh say so; a process waiting on CI keeps its claim with majordomus mesh beat --phase; a command-line claim that never beats and a claim of an older runtime are judged exactly as before."
