id: I0814
milestone: M003
title: Give the worker a bounded slice of knowledge, not the knowledge base
slug: context-knowledge-section
priority: p1
profile: implementation
parallel_safe: false
objective: "Add a knowledge section to `majordomus context`, selected deterministically from what the active task and issue already reference, capped by a profile toggle and an item limit, dropped before any immutable fact when the budget is short, and named under EXCLUDED whenever it is dropped or switched off."
why: "A context builder that dumps an index has replaced a selection problem with a bigger one. The value is in choosing the few pointers a worker needs, from relationships that are already explicit, and in saying out loud what was left out."
current_state: "context assembles nine sections in authority order with a fixed drop order and names every exclusion. Its profile toggles decide what is asked for."
desired_state: "The profile carries a knowledge toggle and a maximum item count, both in the profile allowlist. The section lists pointers — id, kind, title and source path — for the current issue, its dependencies, the claims it names and the documents it references. It sits below every immutable fact in the drop order and above nothing that outranks it."
scope:
  - lib/context.sh
  - share/skeleton
  - share/allow/profile.txt
  - .majordomus/profiles
  - docs
  - test/cases
non_scope:
  - Any similarity-based selection
  - Rebuilding the index from context
  - Raising the existing line budget
depends_on:
  - I0811
acceptance_criteria:
  - The section appears only when the profile asks for it, and its absence is named under EXCLUDED with the toggle that caused it
  - It is dropped before git, the task, the profile and open blockers under a tight budget, and the drop is named
  - Selection comes from explicit references only, and a case proves an unrelated document is not selected
  - A stale index makes the section report staleness rather than silently omit itself
  - The existing context case still passes unchanged
validation:
  - bash test/run.sh 3073_context_knowledge_slice
  - bash test/run.sh 23_context
evidence_required:
  - context_bounded
risk: "The budget is already close to full on a rich task. If the knowledge section is added without measuring, it will be the section that always gets dropped, which is a feature nobody receives."
