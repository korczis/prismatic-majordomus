id: I4340
milestone: knowledge-acts-on-what-it-learns
title: "An observation finds the episode that session start just opened in the same provider session"
slug: an-observation-finds-the-episode-session-start-opened
priority: p2
profile: implementation
parallel_safe: true
objective: "`majordomus session start` run by hand inside a provider session and `majordomus knowledge observe` run after it resolve the same episode: either session start keys the episode by the provider session the environment names (as mj_open_session_id reads it), or mj_open_session_id falls back to the hand-opened episode of this worktree when no file carries the provider key. The refusal 'no episode is open in this checkout for this caller' is printed only when no episode of this worktree is open."
why: "On 2026-10-28, following the evolve skill's step 1 in a Claude Code session, `majordomus session start` opened s-20261028215857-d010 as sessions-open/hand.yaml (lib/session.sh keys an episode by --provider-session only, else hand), and ten `knowledge observe` calls were then refused, because mj_open_session_id (lib/common.sh) took the key from CLAUDE_CODE_SESSION_ID and found no file for it; only MJ_SESSION_KEY=hand let them through. The memory note of 2026-10-27 records the same workaround."
current_state: "Verified at 81ef931 by code reading and the reproduction above: the writer of the episode and the reader of the observation derive its key from different sources."
desired_state: "A new case, its number announced on the board when it is taken, opens an episode by hand with a provider session variable set and records an observation without MJ_SESSION_KEY."
scope:
  - "lib/session.sh"
  - "lib/common.sh"
  - ".ai/repo/skills/evolve"
  - ".ai/repo/project/issues/I4340.yaml"
acceptance_criteria:
  - "With CLAUDE_CODE_SESSION_ID set, `session start` then `knowledge observe` records the observation stamped with that episode"
  - "With two episodes of different keys open, observe still refuses rather than guessing"
  - "The evolve skill's MJ_SESSION_KEY remedy in step 1 is removed once the case passes"
validation:
  - "bin/majordomus plan validate"
evidence_required:
  - suite
created_at: 2026-10-28
updated_at: 2026-10-28
