id: mission-global-skill-availability-and-autonomous-lifecycle
title: "# MISSION: Global Skill Availability and Autonomous Lifecycle Convergence"
statement: "# MISSION: Global Skill Availability and Autonomous Lifecycle Convergence\n\nYou are working inside the latest `korczis/prismatic-majordomus`.\n\nYour mission is to make Majordomus skills, particularly `/proceed`, `/evolve`, and the existing `/move` equivalent, genuinely discoverable, executable, synchronized, and lifecycle-integrated across all supported environments.\n\nThis is an architectural correction and implementation task, not a documentation exercise.\n\n## 1. Inspect reality\n\nRead all applicable `AGENTS.md`, `CLAUDE.md`, `.ai/**`, existing skill registries, generation machinery, editor integrations, bootstrap mechanisms, peer discovery, mesh lifecycle, CLI commands, hooks and test contracts.\n\nInspect recent PRs, particularly #1413, for skill shadowing and precedence fixes.\n\nDetermine:\n\n- Which skills actually exist?\n- Which commands are aliases?\n- Which capabilities back those commands?\n- Which files are canonical?\n- Which files are generated?\n- What installs global skills?\n- What happens during client startup?\n- What happens outside the Majordomus repository?\n- What happens inside worktrees?\n- What happens on a new machine?\n- What happens in cloud sessions?\n- How is skill version skew detected?\n- What happens if Majordomus is unavailable?\n- Are collisions diagnosed?\n- Which features are genuinely supported by each client?\n\nDo not assume a proposed skill exists.\n\n## 2. Establish one canonical skill system\n\nExtend existing architecture rather than creating a parallel registry.\n\nThe canonical model must describe:\n\n- stable identity,\n- name and aliases,\n- purpose,\n- trigger conditions,\n- associated capability,\n- supported clients,\n- invocation contract,\n- authorization policy,\n- required runtime dependencies,\n- relevant governance,\n- version and provenance,\n- generation rules.\n\nDerive native adapters for each supported client.\n\nNever maintain independent skill bodies in several locations.\n\nWhere different client formats are required, generate and test them from shared semantics.\n\n## 3. Globally available bootstrap\n\nImplement a minimal, versioned global bootstrap for supported local clients.\n\nFor Claude Code, integrate with its supported personal skill, plugin and lifecycle interfaces.\n\nThe global adapter must:\n\n1. Detect whether Majordomus is available.\n2. Detect the current repository.\n3. Discover the appropriate Majordomus runtime.\n4. Determine whether the repository participates in Majordomus.\n5. Load applicable governance and context.\n6. Establish authorized mesh attachment.\n7. Resolve canonical skill implementations.\n8. Expose supported slash commands.\n9. Report unavailable capabilities clearly.\n\nDo not perform expensive network operations during skill enumeration.\n\nDo not add a large always-on prompt.\n\nDo not auto-enroll unrelated repositories without authorization.\n\nUse a lightweight global bootstrap and lazy contextual resolution.\n\n## 4. `/proceed` contract\n\nMake `/proceed` a universally discoverable entry point in supported environments.\n\nOn execution:\n\n- resolve repository and active session,\n- inspect governance,\n- verify Majordomus runtime,\n- attach to an authorized mesh,\n- recover existing session state where appropriate,\n- reconcile current work,\n- select the next eligible work unit,\n- claim scope,\n- execute through existing capabilities,\n- verify outcomes,\n- publish progress events,\n- persist resumable state,\n- continue according to policy.\n\nNever bypass security or approval gates.\n\nNever create a competing scheduler.\n\n## 5. `/evolve` contract\n\nInspect the existing evolve implementation.\n\nIntegrate it with the autonomous delivery feedback loop.\n\nIt should identify:\n\n- repeated failures,\n- systemic inefficiencies,\n- unnecessary manual operations,\n- duplicated mechanisms,\n- stale documentation,\n- underused capabilities,\n- slow pipelines,\n- missing evidence,\n- recurring mesh coordination failures.\n\nGenerate evidence-backed improvement candidates.\n\nExecute authorized, bounded improvements through the same canonical work and verification pipeline.\n\nDo not allow unrestricted self-modification or weakening of governance.\n\n## 6. `/move` contract\n\nDiscover the actual existing meaning, source and interfaces of `/move`.\n\nPreserve its legitimate semantics.\n\nIf it is a session or work-handover operation, connect it to canonical:\n\n- task ownership,\n- session context,\n- worktree identity,\n- leases,\n- checkpoint state,\n- destination peer,\n- durable handover,\n- recovery.\n\nDo not invent incompatible semantics merely to match this prompt.\n\n## 7. Client precedence and compatibility\n\nExplicitly validate:\n\n- personal skills,\n- project skills,\n- plugins,\n- legacy commands,\n- generated commands,\n- native built-in commands,\n- client-specific reserved names.\n\nHandle shadowing and collisions without silent failure.\n\nGenerate actionable diagnostics identifying the conflicting locations and precedence rules.\n\nNever overwrite user-authored personal commands without explicit permission.\n\n## 8. Automatic lifecycle integration\n\nDiscover the appropriate supported lifecycle hooks.\n\nConnect:\n\n- session start,\n- context recovery,\n- mesh join,\n- task assignment,\n- task completion,\n- compaction,\n- session shutdown,\n- peer disconnect,\n- worker recovery.\n\nUse canonical lifecycle events.\n\nAvoid duplicate hook implementations and repeated expensive bootstrap work.\n\nHooks must remain bounded, fault tolerant and observable.\n\n## 9. Global distribution and version skew\n\nImplement an explicit global distribution contract.\n\nSupport:\n\n- initial installation,\n- update,\n- validation,\n- diagnostics,\n- rollback,\n- offline operation where feasible,\n- worktree consistency,\n- multi-repository operation,\n- version compatibility.\n\nNo silent destructive replacement of existing user configuration.\n\nThe global bootstrap and repository-specific implementation may have different versions, but compatibility must be checked.\n\nA stale global adapter must emit a clear finding.\n\n## 10. Cross-surface integration\n\nProject the skill registry and execution states into existing:\n\n- CLI,\n- REST API,\n- OpenAPI,\n- MCP,\n- `/ui`,\n- `/cockpit`,\n- GitHub Pages,\n- documentation,\n- diagnostics.\n\nThe UI must show which skills are available, installed, compatible, shadowed, unavailable or failing.\n\nWhere supported, show actual invocations, executing peers and evidence.\n\nDo not duplicate the registry inside frontend code.\n\n## 11. Acceptance tests\n\nTest at least:\n\n- Claude Code started inside Majordomus.\n- Claude Code started in an unrelated repository.\n- Claude Code started inside another authorized Majordomus-powered repository.\n- Linked worktree.\n- Fresh process.\n- Missing local runtime.\n- Offline startup.\n- Stale global adapter.\n- Project/personal command collision.\n- Incompatible capability version.\n- Mesh unavailable.\n- Mesh restored.\n- Session restart.\n- Context compaction.\n- Skill generated from a new canonical declaration.\n- Removal of obsolete generated skill.\n- Global adapter rollback.\n- Permissions and unauthorized operations.\n\nVerify that `/proceed` executes a real supported operation, not merely that its name appears in the slash-command menu.\n\nVerify that `/evolve` uses actual evidence.\n\nVerify the discovered `/move` contract.\n\n## 12. Continuous enforcement\n\nMake global integration correctness part of existing:\n\n- doctor diagnostics,\n- derived artifact checks,\n- schema validation,\n- relevant CI gates,\n- installation smoke tests,\n- client integration tests.\n\nDo not require manual synchronization after every new release.\n\nGenerate adapters from canonical source and detect drift automatically.\n\n## 13. Delivery discipline\n\nImplement incrementally:\n\nA. Audit and root-cause evidence.\nB. Canonical registry and compatibility.\nC. Global Claude Code bootstrap.\nD. `/proceed` end-to-end.\nE. `/evolve` lifecycle integration.\nF. Existing `/move` semantics.\nG. Additional supported client adapters.\nH. UI, documentation, distribution and enforcement.\nI. Cross-repository and restart smoke tests.\n\nReuse existing infrastructure.\n\nDo not stop with a prompt, ADR or prototype.\n\nRun the actual tests, inspect output, fix regressions and publish through approved pipelines.\n\n## 14. Final proof\n\nDemonstrate:\n\n1. Start a new Claude Code session outside Majordomus.\n2. Observe `/proceed` in the supported skill interface.\n3. Invoke it.\n4. Resolve the appropriate repository and policy.\n5. Attach to the authorized mesh.\n6. Execute one real bounded operation.\n7. Persist evidence.\n8. Restart the client.\n9. Confirm recovery and version compatibility.\n10. Confirm CLI and UI display the same authoritative state.\n\nReport precise results and limitations.\n\n**Acceptance invariant: a canonical skill becomes discoverable and usable in every compatible authorized client environment through generated adapters, without manual per-project duplication.**\n\nBegin implementing immediately.\n\n+ \"/proceed\""
