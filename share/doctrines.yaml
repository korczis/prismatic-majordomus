# The doctrine registry: every rule Majordomus enforces, what enforces it, where it runs,
# and what proves it. Shipped with the tool, not with the repository — a repository
# configures Majordomus in .majordomus/policy.yaml, it does not invent doctrines.
#
# A doctrine is enforced only when every link of this chain holds:
#   declared here -> validator function exists -> the command it names invokes the
#   dispatcher -> the dispatcher's failure reaches the exit code -> a test proves it ->
#   CI runs that test.
# `majordomus doctor` derives each link from the source rather than trusting this file,
# and reports the break. See docs/DOCTRINE.md.
#
# class:
#   blocking  a violation stops the command with a non-zero exit
#   advisory  a violation is reported and does not stop the command
# There is no third class, no severity ladder, no baseline, and no override. See
# docs/DOCTRINE.md "What was rejected" for why.
version: 1

doctrines:
  - id: scope_integrity
    title: Scope integrity
    class: blocking
    principle: 4
    summary: A task touches only the paths it claimed; work found elsewhere is not accepted as done.
    validator: scope
    category: scope
    enforced_by: [check, finish, watch]
    policy_key: scope_respected
    exit_code: 10
    claims: [scope-enforcement, scoped-task]
    test: test/cases/04_start_check.sh

  - id: state_consistency
    title: State consistency
    class: blocking
    principle: 1
    summary: The task record still describes this checkout — same branch, and HEAD at or ahead of the recorded commit.
    validator: state
    category: state
    enforced_by: [check, finish, watch]
    policy_key: state_updated
    exit_code: 10
    claims: [git-identity, divergence-label, consistency-check]
    test: test/cases/04_start_check.sh

  - id: blocker_resolution
    title: Blocker resolution
    class: blocking
    principle: 3
    summary: A task with an unresolved open question cannot be completed; it can be finished as blocked.
    validator: blockers
    category: blockers
    # Not watch. An open question is a recorded state, deliberately written down — the
    # opposite of drift. A question store that no longer parses is drift, and that is
    # questions_store_integrity, which watch does enforce.
    enforced_by: [check, finish]
    policy_key: no_open_blockers
    exit_code: 10
    claims: [finish-contract]
    test: test/cases/17_doctrine_enforcement.sh

  - id: checkpoint_freshness
    title: Checkpoint freshness
    class: advisory
    principle: 1
    summary: A task whose last checkpoint is older than its profile's interval is reported, not stopped.
    validator: checkpoint
    category: checkpoint
    enforced_by: [check, watch]
    exit_code: 0
    claims: [checkpoint-interval]
    test: test/cases/04_start_check.sh

  - id: verification_integrity
    title: Verification integrity
    class: blocking
    principle: 8
    summary: Completion requires a verification command that actually ran and exited 0; its exit code and duration are recorded.
    validator: verification
    category: verification
    enforced_by: [finish]
    policy_key: verification_ran
    exit_code: 10
    claims: [finish-contract, typed-outcome]
    test: test/cases/19_end_to_end.sh

  - id: note_integrity
    title: Note integrity
    class: blocking
    principle: 10
    summary: Every outcome needs a note carrying the sections that outcome requires, and no transcript.
    validator: note
    category: note
    enforced_by: [finish]
    policy_key: note_present
    exit_code: 10
    claims: [handover-record, no-transcripts]
    test: test/cases/06_finish.sh

  - id: profile_requirements
    title: Profile requirements
    class: blocking
    principle: 5
    summary: A profile may demand more than the shared contract — a regression test, a decision record — and finish refuses without it.
    validator: profile_requirements
    category: regression
    enforced_by: [finish]
    exit_code: 10
    claims: [profile-axes, profile-validate]
    test: test/cases/16_profiles.sh

  - id: ledger_integrity
    title: Ledger integrity
    class: blocking
    principle: 1
    summary: Every line of the append-only ledger is a well-formed event; the one durable record nothing else can reconstruct stays readable.
    validator: ledger
    category: records
    enforced_by: [check, doctor, watch]
    exit_code: 10
    claims: [ledger-integrity]
    test: test/cases/22_history.sh

  - id: decision_records
    title: Decision records
    class: advisory
    principle: 3
    summary: Every entry in decisions.md carries the task, the head and the reason, so a decision can be found by the worker who needs it.
    validator: decisions
    category: records
    enforced_by: [check, doctor, watch]
    exit_code: 0
    claims: [decision-attribution]
    test: test/cases/21_decision_question.sh

  - id: questions_store_integrity
    title: Questions store integrity
    class: blocking
    principle: 3
    summary: Every entry in open-questions.md parses, because a gate that cannot read an entry can be bypassed by mistyping one.
    validator: questions_store
    category: records
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [blocker-store]
    test: test/cases/21_decision_question.sh

  - id: prompt_integrity
    title: Prompt integrity
    class: blocking
    principle: 2
    summary: Every repository-local prompt asset renders, and every token in it is one the renderer knows.
    validator: prompts
    category: prompt
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [prompt-assets]
    test: test/cases/24_prompt_search.sh

  - id: handover_integrity
    title: Handover integrity
    class: blocking
    principle: 10
    summary: The resolver runs and reports either the record for this worktree and branch or its clean absence; a malformed record is never silently skipped, and a record describing a history this checkout no longer has is reported.
    validator: resolver
    category: resolver
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [handover-record, divergence-label]
    test: test/cases/23_context.sh

  - id: task_continuity
    title: Task continuity
    class: advisory
    principle: 10
    summary: A task finished as partial or blocked should leave a handover record, not only a note section.
    validator: continuity
    category: continuity
    enforced_by: [finish]
    exit_code: 0
    claims: [handover-record]
    test: test/cases/25_continuity_lifecycle.sh

  - id: layout_integrity
    title: Layout integrity
    class: advisory
    principle: 1
    summary: The directories the durable commands write into are installed rather than created on first use.
    validator: layout
    category: layout
    enforced_by: [doctor]
    exit_code: 0
    claims: [retention-caps]
    test: test/cases/25_continuity_lifecycle.sh

  - id: policy_integrity
    title: Policy integrity
    class: blocking
    principle: 2
    summary: The policy and every profile parse, declare version 1, and carry no key the schema does not define.
    validator: policy
    category: policy
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [policy-parse, profile-validate]
    test: test/cases/02_doctor_basic.sh

  - id: projection_integrity
    title: Projection integrity
    class: blocking
    principle: 1
    summary: Every generated instruction file exists, matches its fingerprint, and is never silently overwritten after a hand edit.
    validator: projection
    category: projection
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [projection-fingerprint, no-silent-overwrite, region-projection, projection-generation]
    test: test/cases/03_update.sh

  - id: enforcement_wiring
    title: Enforcement wiring
    class: blocking
    principle: 7
    summary: Every enforcement the policy declares is invoked by the hook it names, from a file the dispatcher will actually execute, without swallowing the exit code.
    validator: wiring
    category: wiring
    enforced_by: [doctor]
    exit_code: 10
    claims: [wiring-reconciliation, dispatcher-wiring]
    test: test/cases/14_wiring_dispatcher.sh

  - id: context_budget
    title: Context budget
    class: blocking
    principle: 2
    summary: The always-loaded projection stays within its line budget, every reference in it resolves, it states no count that will go stale, and the assembled context fits the builder's own budget.
    validator: budget
    category: budget
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [context-budget, pointer-integrity, no-counts-in-context]
    test: test/cases/02_doctor_basic.sh

  - id: retention_caps
    title: Retention caps
    class: blocking
    principle: 1
    summary: The ledger and the handover directory stay under the caps the policy sets, so durable state does not grow without bound.
    validator: retention
    category: retention
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [retention-caps]
    test: test/cases/02_doctor_basic.sh

  - id: doctrine_wiring_integrity
    title: Doctrine wiring integrity
    class: blocking
    principle: 7
    summary: Every doctrine in this registry resolves to a validator that exists, is reached from every command it names, propagates failure, is proved by a test, and is run by CI — and every validator in the source is declared here.
    validator: doctrine_wiring
    category: doctrine
    enforced_by: [doctor]
    exit_code: 10
    claims: [wiring-reconciliation, doctrine-registry, doctrine-class-decides]
    test: test/cases/18_doctrine_wiring.sh

  - id: project_integrity
    title: Project model integrity
    class: blocking
    principle: 1
    summary: Every milestone and issue file parses, carries the id its filename claims, and contains no key nobody reads.
    validator: project
    category: project
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [project-schema, project-status-derived]
    test: test/cases/44_model_doctrine.sh

  - id: dag_integrity
    title: Dependency graph integrity
    class: blocking
    principle: 4
    summary: The issue dependency graph is acyclic, every edge names an issue that exists, and no issue is executing ahead of a dependency that is not done.
    validator: dag
    category: dag
    enforced_by: [doctor, watch]
    exit_code: 10
    claims: [dag-validation, execution-waves]
    test: test/cases/44_model_doctrine.sh
