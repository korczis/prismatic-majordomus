id: I4370
milestone: merging-and-referencing-are-enforced
title: "The pull-request and plan projection ships in the release as `majordomus forge`, reads an adopter's own models and facts, and writes only what they declare"
slug: the-projection-ships-as-majordomus-forge
priority: p1
profile: implementation
parallel_safe: false
objective: "`majordomus forge render|check|apply [--prs [--pr <n>]] [--plan-records [--milestones-only]] [--labels] [--budget <n>] [--out <file>] [--from <file>]` is the release's projection command. bin/majordomus dispatches it (a public command: share/commands.yaml, the usage text, its page and coverage, cases 30 and 31) to the adapter scripts/github-sync, shipped in the release archive under share/libexec/ and resolving its lib/ from the installed tree rather than from a checkout. share/libexec/ is already shipped whole (release-package:95 copies share/), but release-package:98 sets every file under share/ to 0644; the installed-archive case proves that the shipped adapter runs. The derivation and the writes can run in separate jobs: `forge render --prs --pr <n> --out <file>` writes a versioned JSON document, schema majordomus.forge-plan/v1 (share/schemas/majordomus/forge-plan/forge-plan.v1.schema.json), holding the facts it read and the writes it owes, and `forge apply --from <file>` applies exactly those writes, derives nothing, reads no record and never runs the `facts:` command. lib/forge.sh and share/libexec/github-sync are new shell units, so each gets a record in .ai/repo/automation/inventory.jsonl with an exemption (platform adaptor over gh), or `majordomus shell check` refuses them (ADR 0069). It reads the adopter's .ai/repo/project/project.yaml (repository, default_branch), .ai/repo/ci/pr-meta.yaml (actor, including `actor.login`, the GitHub login the projection writes as; trigger, permissions, the label families it owns, and an optional `facts:` command) and .ai/repo/ci/github.yaml (apply window, and `apply.budget`, the write budget per run, which `--budget` overrides for one run). A pull request's ids come from the typed subcommand I2901 adds, over its title, its commits' subjects, the records its head changes and its head branch, the branch read case-insensitively as I4366 defines. github-sync --prs reads no branch today. When pr-meta.yaml declares `facts:`, the pull request's facts come from that command's JSON in the declared schema majordomus.pr-facts/v1, shipped as share/schemas/majordomus/pr-facts/pr-facts.v1.schema.json and named by its validator in lib/ (doctor reports a schema nothing in lib/ or the Rust source names as applied by nothing, lib/doctor.sh:1652-1655): served ids with title, milestone and priority, conventional level and breaking flag, role (release, release-record or train), and landing method. Without `facts:`, they come from the adapter's own derivation. The `facts:` command is the default branch's: it runs only from the default-branch checkout, in the read-only job, and a `facts:` declaration that the pull request's head changes is ignored and reported. Type labels: an adopter's declared families override release/model.rs's commit types for that adopter, so OSCILLA's train(...) titles can carry a type. github-sync's own list is hard-coded today (header :90-91), not read from model.rs. I3979's equality test is amended to match: this repository's declaration still equals model.rs:23-43, and an adopter's declaration may add types. Where the pull-request vocabulary lives (the type and label families) is this issue's decision, which OSCILLA's owner left to this repository (C7): it is made before the implementation, recorded as a `majordomus decision` or in the ADR this command owes, and that record names the one file that holds the vocabulary; forge, I4371 and I4372 read it from that file and no second declaration exists. Identity markers (<!-- majordomus:record <id> -->), the six body states plus unmanaged, the managed pr-meta region and the closing-keyword refusal stay as github-sync has them. Exit codes, each an MJ_EX_* constant of lib/common.sh and declared on the `forge` entry of share/commands.yaml: 0 in sync or applied; 2 usage; 10 a declaration or a forge-plan file this version cannot read; 11 drift; 12 cannot run, or the reading is incomplete (gh unauthenticated, a pull request unread, a listing shorter than its totalCount; I4372 adds a declared repository field read UNKNOWN under `forge check --repo`); 13 a mutation failed; 14 a title over GitHub's limit; 15 apply refused; 16 the write budget is spent, nothing is half-written, and the next run resumes. A projection-owned `release-freeze` label family is added, declared in the pull-request vocabulary and in integration/classify.rs LABEL_POLICY. classify holds a pull request on it only when the observation shows that the login pr-meta.yaml declares as `actor.login` set it. To know that, integration/forge.rs reads, for an open pull request that carries release-freeze, the actor of its latest `labeled` event (one bounded issue-events read, inside ADR 0101's existing exception). A release-freeze set by any other login is ignored and reported, and `hold` stays a person's. Every workflow that writes with GITHUB_TOKEN writes as the same login, so a projection that uses GITHUB_TOKEN cannot be told apart from any other workflow of the repository; the documentation recommends a dedicated bot account or app token for the projection actor. The hold acts only on landings by `prs drain`: an adopter that merges with GitHub auto-merge, as OSCILLA does, gets no effect from release-freeze, and the documentation says so. The adapter in share/libexec reaches the forge through gh, so it is a network call by 'the tool itself' as github-sync's header defines it (bin/, lib/, share/, test/). That overrides work-graph-github's non-scope 'Moving network calls into the tool itself, which test/cases/08 forbids'. An ADR records the override; it is accepted by the owner's act before the pull request lands, and SECURITY.md and .ai/repo/project/milestones/work-graph-github.yaml cite it by number. SECURITY.md's 'Local only' promise (SECURITY.md:13-24, 'Nothing leaves the machine', one loopback request) is amended to name the adapter as the one request of the shell tool that leaves the machine, and the adapter joins the mesh (ADR 0067) and pull-request integration (ADR 0101) as the declared exceptions that reach the network, the second that reaches the forge. Case 08 adds share/libexec/* to the files it scans, recognises gh as a network client (it names none today), admits gh only in the declared adapter, and states how it treats share/libexec/sccache-mesh, whose loopback `nc -z` probe and `eval` of derived exports its existing patterns refuse. scripts/github-sync in this repository becomes the wrapper the release ships, so cases 3970, 894 and 45 keep passing. The trunk projection's prove phase, which today runs scripts/ci/github-check (.ai/repo/ci/github.yaml phases, github.yml:152) and is not shipped either, becomes `majordomus forge check` for an adopter."
why: "OSCILLA (korczis/oscilla) asked on 2026-10-29 for GitHub to be a projection of its records. It has 0 GitHub milestones, 10 labels (GitHub's 9 defaults and a person's accessibility), 309 plan issues and 54 milestones. Its owner decided on 2026-10-29 that OSCILLA writes no label or milestone writer of its own, and that milestones are mirrored first and issues later. The projection exists only in this checkout: the models it reads are this repository's, and the adapter cannot run from an installed release. Without the command every adopter writes a second implementation, which project.the-projection-is-applied-at-landing and the intent's invariant (records canonical, GitHub a projection) exist to prevent."
current_state: "Measured at 5370ee63d19: scripts/github-sync (1139 lines) sets MJ_BIN_DIR and MJ_LIB_DIR to its own checkout (github-sync:128); its header (:8-10) says the tool itself (bin/, lib/, share/, test/) makes no network calls and case 08 proves it; scripts/release-package:86-95 ships bin, lib, libexec and share and never scripts/, and :98 sets every file under share/ to 0644, so share/libexec/sccache-mesh is shipped without its executable bit; --prs reads ids from the title, its commits' subjects and the records the head changes, never the branch (header :85-87), matched by `^I[0-9][0-9][0-9][0-9]+$` (:394) and `^I[0-9]+\\.yaml$` (:399); the type labels are fixed in shell to feat fix perf refactor docs test chore ci style build (header :90-91), not read from release/model.rs; a missing or unauthenticated gh exits 12 with nothing written (:335-336), and an unread pull request exits 12 (:646); the record marker is grammar-neutral (jq scan of [A-Za-z0-9_.-]+ at :244); integration/forge.rs:541-549 keeps an open pull request's label names, not who set them; integration/classify.rs:112-121 LABEL_POLICY holds on do-not-merge, do not merge, blocked, hold, on-hold, wip and manual-merge, and marks obsolete; test/cases/08_no_forbidden_constructs.sh:6 scans bin/majordomus, lib/*.sh and share/providers/* only, and its network-client patterns (:12, :18) name wget, nc, ssh, scp and curl but not gh; bin/majordomus has no forge command and the executable has none either; .ai/repo/automation/inventory.jsonl records scripts/github-sync and share/libexec/sccache-mesh but no lib/forge.sh or share/libexec/github-sync; .ai/repo/ci/pr-meta.yaml declares the actor (.github/workflows/pr-meta.yml, job project, bound 40), the pull_request_target trigger, permissions pull-requests write, issues read and contents read, and forbids touching labels outside type:*, priority:*, train and records; SECURITY.md promises 'Local only' with one declared loopback request (:13-24, lib/context.sh's peer-board read) and declares two exceptions on the executable's side, the mesh (ADR 0067, :33-34) and pull-request integration (ADR 0101, :53-56, 'Nothing else does'); .ai/repo/ci/github.yaml's prove phase runs scripts/ci/github-check; no file declares a write budget; lib/common.sh:7-9 defines MJ_EX_OK 0, MJ_EX_USAGE 2, MJ_EX_CONTRACT 10, MJ_EX_DRIFT 11, MJ_EX_MISSING 12, MJ_EX_INTERNAL 13 and MJ_EX_REFUSED 15, and no constant for 14 or 16; pr-meta.yaml declares no actor login. Open: whether the shipped adapter is run through `bash` or the archive restores its executable bit (release-package:98 sets 0644 on every file under share/)."
desired_state: "An adopter that commits pr-meta.yaml and github.yaml gets its pull requests' labels, milestone, assignee and Refs region, and its plan milestones (and later issues), projected by the installed release, with no adopter-side writer and no second id rule; a rerun writes nothing; a spent budget resumes; nothing outside the declared families is touched; the head of a pull request cannot change the facts command that judges it. Enforced by case 4370 against a scripted forge, cases 3970, 894, 45, 08, 30, 31 and 32, `majordomus shell check`, and the ADR SECURITY.md cites."
