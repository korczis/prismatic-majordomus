id: I4222
milestone: ci-critical-path
title: A forge reply cut off on its way is asked again, and the declarations are read in smaller pages
slug: a-truncated-forge-reply-is-retried
priority: p0
profile: implementation
parallel_safe: true
serves: []
objective: "When gh reports a forge reply that was cut off ('unexpected end of JSON input'), the integration forge counts it as an outage and asks again within its bounded backoff. The declarations read asks for 25 open pull requests per page instead of 50, so each reply is shorter."
why: "Master's pages runs went red twice in ui-snapshot, step 'the forge, observed', exit 12, for this one cause. Run 40086406838 (10:41Z) failed on the declarations GraphQL query at -F n=50 with 'failed: unexpected end of JSON input'. Run 40093453442 (12:38Z) failed the same way on 'gh pr list --state open --limit 500 --json ...,body,statusCheckRollup,...'. retry::transient matched timeouts, 5xx, rate limits, resets and EOFs, but not gh's wording for a cut-off reply, so the first truncation failed the whole observation and the site could not publish."
current_state: "A cut-off reply is taken as the forge's answer: gh_retrying returns it at once and the observation fails with exit 12. The declarations read asks for 50 open pull requests a page, each with up to a hundred cross-references and their sources' bodies."
desired_state: "'unexpected end of JSON input' is transient, retried with the forge's backoff (four attempts, 2/4/8 s) and reported with its attempt count if it does not stop. DECLARATIONS_PAGE is 25. Case 742 proves a list cut off once is asked again and the observation is recorded."
scope:
  - apps/majordomus-cli/src/integration/retry.rs
  - apps/majordomus-cli/src/integration/forge.rs
  - test/cases/742_only_an_outage_is_asked_again.sh
  - .ai/repo/project/issues/I4222.yaml
non_scope:
  - "Replacing gh pr list with a paged GraphQL read of its own; gh already pages it at a hundred"
  - "Retrying a merge: a merge that timed out may have landed, and it is still never asked again"
depends_on: []
acceptance_criteria:
  - "retry::transient holds 'unexpected end of JSON input' as an outage; a 401, a 404 and a refusal are still answers"
  - "Case 742: a pr list cut off once is asked exactly twice, the refresh exits 0 and records the observation; the four outage and refusal sections still hold"
  - "The declarations read asks n=25"
validation:
  - "cargo test --lib integration::retry integration::forge::tests::the_forge_is_asked_exactly_this"
  - "bash test/run.sh 742_only_an_outage_is_asked_again"
evidence_required:
  - suite
risk: "A forge that keeps cutting replies off now takes about 14 s of backoff before the observation fails, as for any outage. A declarations read of 120 open pull requests takes five pages instead of three."
created_at: 2026-10-24
updated_at: 2026-10-24
