  - ".ai/repo/project/issues/I4668.yaml"
  - "site/content/plan/I4668.md"
non_scope:
  - "Killing a process, or changing a file's mode or contents to stop it: pause and resume are signals to a process group and nothing else"
  - "Reading another machine's process table: the inbound peer is named, never contacted"
  - "Refusing an untraced remote run the tool itself starts: I3956"
  - "Supervising a service a session declares: I4622, whose declarations this sweep reads once they exist and does not wait for"
  - "Reclaiming disk or swap"
depends_on: []
acceptance_criteria:
  - "Case 4668 uses a fixture process table read through a test seam. The table holds one session's build tree, one offload run that carries its owner variables, one group of a declared service, and one group of 32 busy processes whose chain runs init, then an SSH server connection process for a fixture peer 192.0.2.10:52144, then a shell, then the workload. `mesh who --unattributed --format json` lists only the last group, with its pgid, 32 members, summed CPU and RSS, start time, chain and peer, and doctor reports exactly one WARN that names the command"
  - "The thresholds are read from the policy's machine.heavy_process, with typed defaults in share/skeleton/policy.yaml. A group under the threshold, or one busy for less than sustained_seconds, is not reported"
  - "Negative control: a heavy group whose command line contains a live session's id, but whose tree, environment and records do not lead to that session, is reported unattributed. A command line is shown and is never used to attribute"
  - "`machine pause <pgid>` without an owner approval that names that pgid exits 15 and signals nothing. If the leader's start time differs from the one the approval names (a reused pid), it also exits 15. With a matching approval it stops the whole group, `machine status` lists the group as paused with the approval and the reason, and `machine resume <pgid>` continues it. Each transition is one ledger line"
  - "The sweep is one capability. The command line, MCP and HTTP serve it from the registry, and docs/generated is regenerated by `majordomus generate`"
validation:
  - "bin/majordomus plan validate"
  - "MJ_TEST_JOBS=2 bash test/run.sh 4668_an_unattributed_heavy_process_is_named"
evidence_required:
  - "an_unattributed_heavy_process_is_named"
serves:
  - a-session-proceeds-through-the-mesh#heavy-work-shares-the-machine
