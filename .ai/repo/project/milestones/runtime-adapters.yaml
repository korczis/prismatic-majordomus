id: runtime-adapters
title: Profiles become runtime constraints rather than advice
slug: runtime-adapters
version: "0.2"
order: 20
priority: p1
problem: "A profile declares an effort and a verbosity, and then nothing enforces them. The worker reads the projection and is trusted to behave. An axis that only ever appears in generated prose is a preference, not a control."
outcome: "A profile's axes become opt-in runtime clamps a provider actually applies — read size, output condensation, subagent budget — with the limit derived from the profile rather than configured twice."
current_state: "Not started. The profiles exist and project correctly; nothing derives a runtime limit from them."
desired_state: "Starting a task under a profile constrains what the worker may do, and the constraint is visible in the same place the profile is."
scope:
  - bin
  - lib
  - share
  - test/cases
  - docs
  - site/data/generated
non_scope:
  - Provider-specific behaviour that cannot be verified from this repository
acceptance_criteria:
  - At least one runtime limit is derived from the profile and applied, not merely printed
  - The limit is opt-in and a repository that does not want it is unaffected
  - A behavioural case proves the limit changes what happens, not only what is reported
validation:
  - bash test/run.sh
evidence_required:
  - suite
depends_on:
  - foundation
claims:
  - runtime-adapters
risks:
  - "Only providers that expose a real knob can be clamped honestly; the rest would be theatre."
created_at: 2026-09-04
updated_at: 2026-09-04T14:05:00Z
