id: I2012
milestone: intent-opposition
title: Recording a review stamps the plan it reviewed, through one writing capability
slug: recording-a-review-stamps-the-plan
priority: p1
profile: implementation
parallel_safe: false
serves:
  - intent-opposition#review-names-what-it-reviewed
objective: "Add the writing capability intent_opposition.record (majordomus-cli intent stamp <intent>, POST, an MCP tool): it refuses a critique whose findings do not validate, creates the record with no findings when none exists, sets the top-level scalars reviewed_revision, reviewed_at and reviewed_with by the line replacement plan.transition uses, and appends the ledger event opposition.recorded; it writes no finding and no disposition. Widen the pinned writer set by exactly that capability everywhere it is pinned or stated. Write ADR 0112 naming the sentences of ADR 0073 it supersedes, and amend intent-planning's invariant that Majordomus generates no critique. Stamp this repository's critiques."
why: "A review says nothing of which plan it read, so a critique of last month's plan cannot be told from one of today's, and nothing in the ledger says a review was ever run."
current_state: "CritiqueRecord has intent, reviewed_at, reviewed_by and findings, all authored by hand. The writer set is plan.transition, reasoning.record and recover.orphans, pinned in several places. The crate has no YAML emitter; plan.transition replaces top-level scalar lines."
desired_state: "A stamped critique names the plan revision reviewed, the commit, the actor and the tool; the ledger carries the event; the record's findings are byte-identical before and after a stamp."
scope:
  - apps/majordomus-cli/src/intent_opposition.rs
  - apps/majordomus-cli/src/intent_review.rs
  - apps/majordomus-cli/src/capability/builtin
  - apps/majordomus-cli/src/about.rs
  - apps/majordomus-cli/tests
  - share/schemas/majordomus/critique
  - share/allow
  - share/events.yaml
  - .ai/repo/project/critiques
  - .ai/repo/project/intents/intent-planning.yaml
  - .ai/repo/adrs/0112-the-opposition-to-a-plan-is-executed-and-revision-bound.md
  - test/cases/963_an_opposition_is_executed_and_names_the_plan_it_reviewed.sh
  - docs
depends_on:
  - I2011
acceptance_criteria:
  - intent stamp stamps an existing critique and leaves every line of its findings unchanged, on the command line and over MCP
  - With no critique it writes one with no findings and the stamp, which both the Rust reader and the shell flattener read
  - A critique whose findings do not validate is refused and nothing is written
  - The ledger carries opposition.recorded with the intent, the revision and the disposition derived at that moment, and share/events.yaml declares it
  - The writer set is the three it was and intent_opposition.record, in the pin, the module tests, about, the documents and the generated registry
  - ADR 0112 is proposed, names what it supersedes in ADR 0073, and says a seal or a stamp is evidence of tampering and of a run, not proof against a determined author
validation:
  - bash test/run.sh 963_an_opposition_is_executed_and_names_the_plan_it_reviewed
  - cargo test --lib capability
  - bash test/run.sh 33_event_registry
evidence_required:
  - a_review_is_stamped_and_its_findings_are_untouched
created_at: 2026-10-07
updated_at: 2026-10-07
