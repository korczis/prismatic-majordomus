id: I3365
milestone: a-foreign-repository-is-adopted-and-measured
title: "Every intervention, undocumented command and refused step of a foreign adoption carries a friction id or a reason, and every friction id is cited by an issue or a cancellation"
slug: foreign-friction-becomes-issues
priority: p1
profile: docs
objective: "Add a test that fails when a T1 record holds a manual intervention, an undocumented command or a refused step without a friction id or a declared not-a-friction reason, or a friction id that no issue's why and no cancellation cites. Then, for each friction id in the committed records, record one issue through majordomus plan record whose acceptance names a case or test that fails without its fix, or a cancellation with its reason."
why: "T1 of the owner's report of 2026-10-19 asks that friction be recorded. The critique noted that a count of uncited ids measured against ids the runner chose to record is satisfied by recording few, so the denominator is the observed events."
current_state: "No adoption record exists. The 2026-10-13 findings map to I2585-I2608 only on PR #1089, and only I2601 is on master."
desired_state: "Zero uncovered events and zero uncited friction ids across T1 records, checked by a test."
scope:
  - "apps/majordomus-cli/tests/economics.rs"
  - ".ai/repo/benchmarks"
non_scope:
  - "Fixing the frictions"
  - "The earlier findings PR #1089 carries"
depends_on:
  - "I3363"
serves:
  - "the-product-proves-it-pays#foreign-friction-becomes-a-case"
acceptance_criteria:
  - "A fixture record with an uncovered intervention fails the test, naming it"
  - "A fixture friction id nothing cites fails the test"
  - "Every friction id in the committed records is cited exactly once"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --test economics"
  - "majordomus plan validate"
evidence_required:
  - "friction_ids_cited"
created_at: 2026-10-19
updated_at: 2026-10-19
