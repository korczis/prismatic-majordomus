acceptance_criteria:
  - "A source slower than the caller's patience and never read is handed over as pending before its handler finishes, and a caller that then waits joins the same reading: one handler run"
  - "A source that has been read is handed over without its handler running on the caller's thread, however slow the handler is, and is read again behind the caller once the reading is older than a second"
  - "After the repository moved, a slow source is handed over as it was, marked stale and refreshing, within the patience; a caller that waits gets the current reading; a source read lately and not asked for is read again"
  - "A source that fails or panics is a reading that says so, with an age, and is read again"
  - "A screen whose source is catching up marks that source's line with data-catching-up and says how old the reading is; a screen whose sources are current does not"
  - "No screen under src/ui calls a handler: outside ui/source.rs and tests, nothing there calls execute"
  - "With MAJORDOMUS_READING_PATIENCE_MS=0, a served screen answers after a change of the repository without waiting for its sources, and shows the changed value once the readings have caught up"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --test executor"
  - "cargo test --lib ui::"
  - "MJ_TEST_JOBS=2 bash test/run.sh 1096_no_screen_waits_for_a_source"
evidence_required:
