id: one-click-implement
title: "One click on a ready issue starts a durable execution that works it, followed live across a browser close and a server restart"
slug: one-click-implement
order: 514
priority: p0
problem: "The owner's P0 of 2026-10-23 (One-Click Mission Control). Verified on master 355a0cee79a: a move on an issue starts an execution and its WebSocket replays from a cursor. But the execution store is memory only and nothing is recovered on start (execution/mod.rs: 'no execution that outlives the process'). executions.start takes no idempotency key. No execution runs an AI worker; the only harness spawner is economics/runner.rs. Worktrees and mesh claims exist but are not tied to an execution. /ui/idd offers only plan.transition. Test 3220 neither restarts the server nor uses a worker."
outcome: "I3980 to I3986 close the P0 vertical slice, local click-to-execute, under ADR 0222 and the intent an-issue-is-implemented-from-one-click."
current_state: "serve, /ui/idd, executions.start, the event cursor and test 3220 exist; durability, idempotency, issue.implement, a worker adapter, the lease and a restart-surviving browser case do not."
desired_state: "The owner's P0 Definition of Done holds: serve, open the UI, pick a real issue, click Implement, an authorised worker starts, close the browser, restart the server, come back to the same execution continuing or correctly recovered, and end with a testable result and its evidence."
