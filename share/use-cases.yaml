# What people actually do with Majordomus, as data.
#
# A use case is a task shape: a situation, the sequence of commands that answers it, and
# what you are left holding. It is not a tutorial and not a feature list — every step
# names a real command, every rule it relies on names a real doctrine, and every promise
# it makes names a real claim. `majordomus doctor` refuses a reference that does not
# resolve, so a use case cannot describe a workflow the tool does not have.
#
# Distinct from the other three catalogues, deliberately:
#   why/          a moment you recognise      "I have had this problem"
#   use-cases/    a task you perform          "here is how the tool answers it"
#   applications/ a context it suits          "does this fit my repository"
#   commands/     one command's surface       "what does this flag do"
#
# Extending this file is the whole extension mechanism: add an entry, run
# scripts/generate-site-data, and the route, the cross-links and the checks appear.
version: 1

use_cases:
  - id: adopt-an-existing-repository
    title: Adopt a repository that already has its own rules
    weight: 1
    summary: Install the supervisory layer into a repository with a hand-written CLAUDE.md, without the tool taking ownership of a file somebody else wrote.
    situation: "The repository already has a governance root — a CLAUDE.md, an AGENTS.md, a contributing guide people actually follow. A tool that regenerates that file wholesale would overwrite months of authored judgement, so the usual answer is to not adopt the tool at all."
    steps:
      - command: init
        note: writes .majordomus/ and refuses if an installation is already there
      - command: update
        note: renders the projection into the region between the markers, leaving the rest of the file alone
      - command: doctor
        note: proves the projection matches its own stamp and the declared enforcement is actually invoked
    outcome: The authored text stays authoritative and the generated section sits inside it, stamped like any other projection. An edit outside the markers is never drift; an edit inside them is caught.
    commands: [init, update, doctor]
    doctrines: [majordomus.projection-integrity, majordomus.enforcement-wiring, majordomus.policy-integrity]
    claims: [region-projection, no-silent-overwrite, projection-fingerprint, dispatcher-wiring]
    responsibilities: [projection, policy, doctor]
    applications: [repository-with-authored-governance]

  - id: hand-work-between-sessions
    title: Hand unfinished work to the next session
    weight: 2
    summary: Stop mid-task and leave the next worker something to act on that is not a transcript.
    situation: "A session ends with the work half done. The usual handover is a paste of the conversation, which the next worker has to read in full to find the three facts that matter, and which is stale the moment the branch moves."
    steps:
      - command: checkpoint
        note: a short progress record inside the active task, refused if it grows into a report
      - command: handover
        note: an append-only record with computed front matter and the sections the policy requires
      - command: context
        note: the next session reads this instead of the transcript, within a line budget
    outcome: The next worker starts from durable state with the git position it was written at, and is told how far the repository has moved since.
    commands: [checkpoint, handover, context, check]
    doctrines: [majordomus.handover-integrity, majordomus.note-integrity, majordomus.task-continuity, majordomus.context-budget]
    claims: [handover-record, no-transcripts, divergence-label, minimum-context]
    responsibilities: [handover, state]
    applications: [several-agents-one-repository, long-running-work]

  - id: prove-a-rule-is-enforced
    title: Prove a rule is actually enforced, not merely written down
    weight: 3
    summary: Answer "is this rule real?" with a command rather than a reading of the source.
    situation: "A repository says a rule is enforced. A script exists, a test exists, and nothing invokes the script. Every artifact of enforcement is present and the enforcement is fiction — and no amount of reading the files tells you, because each one looks right."
    steps:
      - command: doctrine
        note: list what is declared, its class, and the validator that decides it
      - command: doctor
        note: walks declaration to validator to dispatch to exit code to test to CI, from the source
      - command: check
        note: run one rule against the current task with --rule
    outcome: Every link of the chain is resolved from the source rather than from the registry's description of itself, and a break is named. A validator no rule declares fails too.
    commands: [doctrine, doctor, check]
    doctrines: [majordomus.doctrine-wiring-integrity, majordomus.enforcement-wiring]
    claims: [doctrine-registry, doctrine-class-decides, wiring-reconciliation, reproduce-command]
    responsibilities: [doctor, policy]
    applications: [repository-with-authored-governance, ci-gated-project]

  - id: run-several-workers-at-once
    title: Run several workers in one repository without them colliding
    weight: 4
    summary: Give each worker a declared scope, and find out immediately when two of them claim the same paths.
    situation: "Two agents work the same repository at the same time. Each is individually reasonable; together they edit the same file from different assumptions, and the conflict surfaces as a merge, long after the decision that caused it."
    steps:
      - command: start
        note: takes the paths this task may touch, and refuses a second active task in one checkout
      - command: check
        note: --overlap reports other worktrees whose claims intersect yours
      - command: finish
        note: refuses to accept work outside the claimed paths
    outcome: Overlap is reported when the task starts rather than when the branches merge, and a task record belonging to another checkout is reported as foreign rather than enforced against yours.
    commands: [start, check, finish]
    doctrines: [majordomus.scope-integrity, majordomus.state-consistency]
    claims: [scope-enforcement, scoped-task, overlap-report, git-identity]
    responsibilities: [scope, state]
    applications: [several-agents-one-repository]

  - id: accept-or-refuse-finished-work
    title: Decide whether finished work is actually finished
    weight: 5
    summary: Evaluate a contract line by line instead of accepting a sentence that says the work is done.
    situation: "A worker reports success. The report is a paragraph, the evidence is the paragraph, and accepting it is a matter of trust rather than of checking."
    steps:
      - command: question
        note: anything unresolved is recorded as state, and refuses completion while it stands
      - command: finish
        note: --verify-command runs the project's own verification and records its exit code and duration
    outcome: A refusal names the rules that refused. An outcome is typed — completed, partial, blocked, no_match, failed — so "the thing does not exist" and "I could not do it" stay different facts.
    commands: [finish, question, check]
    doctrines: [majordomus.verification-integrity, majordomus.blocker-resolution, majordomus.profile-requirements, majordomus.note-integrity]
    claims: [finish-contract, typed-outcome, consistency-check]
    responsibilities: [finish, scope]
    applications: [ci-gated-project, long-running-work]

  - id: find-out-what-drifted
    title: Find out what has drifted since anyone last looked
    weight: 6
    summary: Ask what has moved, rather than whether anything is wrong.
    situation: "The policy changed but the projections did not. A generated file was hand-edited. A task record describes a commit the branch no longer contains. Each is invisible until something downstream behaves oddly."
    steps:
      - command: watch
        note: reports drift across policy, projections, state, scope, records and retention
      - command: update
        note: --dry-run shows what regeneration would change before it changes it
    outcome: Every finding carries the command that reproduces it, and the same rules produce it as produce the failures — one vocabulary, one registry, a different question.
    commands: [watch, update, history]
    doctrines: [majordomus.projection-integrity, majordomus.policy-integrity, majordomus.ledger-integrity, majordomus.retention-caps]
    claims: [drift-watch, projection-fingerprint, reproduce-command]
    responsibilities: [watch, projection]
    applications: [repository-with-authored-governance, long-running-work]

  - id: serve-the-layer-to-ai-clients
    title: Serve the repository's AI layer to every AI client through one shared server
    weight: 7
    summary: Open the repository in Claude Code, Codex or Gemini CLI and have each of them read the same rules, prompts and knowledge over MCP from one process, seeing each other.
    situation: "Three AI clients are open in one checkout. Each reads .ai/ by hand, none knows the others exist, and the first thing two of them do is edit the same file. The layer is the contract, but nothing serves it and nothing shows who is working where."
    steps:
      - command: init
        note: writes the .ai/ layer the executable serves; the client configurations at the root (.mcp.json, .gemini/settings.json, .codex/config.toml) start bin/majordomus-mcp, which builds the Rust executable when it must
      - command: doctor
        note: proves the layer and its projections are consistent before a client reads them, and that the MCP client autostart is wired
    outcome: "The first client to open the repository is the shared server; every later one attaches to it. Each client sees the same objects as majordomus:// resources and the same tools, lists the other clients with majordomus_peers, and announces its intent and the paths it will touch with majordomus_announce. A lease a client leaves behind never locks the others out, and a client that cannot serve says so instead of serving a degraded layer silently."
    commands: [init, doctor]
    doctrines: [majordomus.ai-layout-integrity, majordomus.projection-integrity, majordomus.scope-integrity]
    claims: [mcp-client-autostart, mcp-shared-server, mcp-peers, mcp-lease-resilience, mcp-stdio-surface, mcp-uri-resolution, mcp-degraded-not-silent]
    responsibilities: [layer, scope, doctor]
    applications: [repository-opened-in-ai-clients, several-agents-one-repository]

  - id: prove-performance-with-benchmarks
    title: Prove the tool is fast, not assume it, and refuse a regression
    weight: 8
    summary: Measure every public command and every capability of the executable against a committed baseline, and let the check fail on a regression rather than a reviewer noticing later.
    situation: "A refactor made doctor slower and nobody measured; a hot path in the executable rebuilds the index on every request and the only evidence is a feeling that MCP calls got sluggish. Performance claims exist in the README and nowhere else."
    steps:
      - command: bench
        note: samples every public command of the shell tool, cold and warm, after warm-up runs, and writes a result document under the local half; --check refuses a regression larger than the fractions the policy declares
      - command: doctor
        note: reports its own wall time against the budget in the policy, as a warning that names the key and never as the exit code
    outcome: "Every externally callable operation is a benchmark target derived from the registry, directly and over each transport it is exposed on, with a coverage table that CI checks is complete. Hundreds of MCP or HTTP requests rebuild nothing, and the counters prove it. The hot paths of the executable carry criterion benchmarks that build on every push, and the thresholds and budgets are policy, measured and changed with a run."
    commands: [bench, doctor]
    doctrines: [majordomus.verification-integrity, majordomus.enforcement-wiring, majordomus.policy-completeness]
    claims: [benchmark-coverage-derived, hot-path-no-rebuild, rust-hot-path-benchmarks, rust-evidence-gates]
    responsibilities: [doctor]
    applications: [ci-gated-project]

  - id: extend-what-the-executable-serves
    title: Extend what the executable serves by adding a file, never by rebuilding it
    weight: 9
    summary: Add a rule, a prompt or a knowledge node to .ai/ and have it appear as an MCP resource, an HTTP route and a reference entry, with the same binary.
    situation: "A team wants its own kind of object served to its AI clients. With most tools that means a fork and a build; the knowledge would then live in the binary, and the binary would own it."
    steps:
      - command: init
        note: writes the layer; kinds and their JSON Schemas are read at run time from the share directory, and a repository may add its own
      - command: update
        note: regenerates the projections (AGENTS.md, CLAUDE.md) from the policy, so the bootstrap every worker reads names the new object
      - command: doctor
        note: validates every declarative object against the schema of its kind and reports a duplicate identity or an unknown key as a diagnostic, never as a crash
    outcome: "The executable discovers the file through the version-control index, validates it against the schema of its kind, and serves it as a resource; MCP, HTTP, OpenAPI, Swagger UI and the generated reference all show it because they are projections of one registry. A broken file is excluded and named; nothing was compiled and nothing was rebuilt."
    commands: [init, update, doctor]
    doctrines: [majordomus.ai-layout-integrity, majordomus.projection-integrity, majordomus.policy-integrity]
    claims: [mcp-data-driven, capability-registry, interfaces-are-projections, capability-modules, mcp-degraded-not-silent]
    responsibilities: [layer, projection, doctor]
    applications: [repository-with-authored-governance, repository-opened-in-ai-clients]
