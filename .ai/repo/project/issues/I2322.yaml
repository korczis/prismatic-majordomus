id: I2322
milestone: a-drain-is-a-durable-run
title: "Starting, reading, stopping and resuming a run are idempotent, and one run leads a base"
slug: run-lifecycle-is-idempotent
priority: p1
profile: implementation
parallel_safe: false
serves:
  - "a-drain-settles-unattended#a-run-is-durable"
objective: "Add the lifecycle of a run to `prs` in apps/majordomus-cli/src/commands/prs.rs and apps/majordomus-cli/src/integration: ensure (start one unless one leads the base, and return the leader either way), status, stop (a stop request recorded on the trail, which the leader honours at its next safe point) and resume (continue the unended run of the base after `reconcile`). Declare status as a read capability in apps/majordomus-cli/src/capability/builtin/integration.rs, projected to the command line, MCP and HTTP from the fold of I2320, and keep the verbs that change state on the command line only."
why: "Autopilot pack 02 issue 2. A drain has no verbs of its own: stop is a signal to a foreground pid (`stop_on_signals`, apps/majordomus-cli/src/integration/drain.rs:1746) and resume is starting again. The parts that make the verbs safe exist. The lease is an exclusive flock in the common git directory that the kernel releases when its holder dies (drain.rs:60-68), so a dead leader is detected by the lock and not by time. `renew` (drain.rs:273) stops a drain whose lease was lost. The exclusive mesh claim refuses a second machine's executor (apps/majordomus-cli/src/integration/exclusive.rs:188). `record` writes an act before it is taken (drain.rs:664). `reconcile` verifies a merge left without an end, asking whether it landed and never merging again (drain.rs:1124). The idempotent ensure pattern is the shared server's `converge` (apps/majordomus-cli/src/commands/serve.rs:481), where three concurrent callers start one process. What is missing is a run identity tying a restart to the run it continues, a stop that reaches a leader in another process, and a status any surface can read. The audit's limit stands: a killed executor leaves its mesh claim held until this checkout runs an executor again (exclusive.rs:15-18), so another machine learns of the death from the next local start. `prs drain` is a command of the CLI and not a capability (apps/majordomus-cli/src/commands/prs.rs:339-440), and a capability that changes the repository reached over HTTP or MCP waits for I2153 and ADR 0126 (PR #860), so the state-changing verbs stay on the command line here."
current_state: "A drain is started by running it and stopped by a signal to its process. Starting again after a crash begins a new drain with no relation to the old one, and the only status is the lease holder record that `prs status` and `prs brief` show."
desired_state: "`prs run ensure` started three times at once leaves one run leading the base and returns its identity to all three. `prs run status`, MCP and HTTP return the run that leads each base, or the last one with its end. `prs run stop` records a stop request on the trail and returns at once; a second stop of the same run changes nothing; the leader ends `cancelled` after its step in progress. After a kill, `prs run resume` or `ensure` verifies any merge left without an end and continues the same run identity, and never starts a second run while one leads. The verb names are the ADR's of I2320."
scope:
  - "apps/majordomus-cli/src/integration/run.rs"
  - "apps/majordomus-cli/src/integration/drain.rs"
  - "apps/majordomus-cli/src/integration/exclusive.rs"
  - "apps/majordomus-cli/src/commands/prs.rs"
  - "apps/majordomus-cli/src/cli.rs"
  - "apps/majordomus-cli/src/capability/builtin/integration.rs"
  - "apps/majordomus-cli/tests/integration_run.rs"
  - "apps/majordomus-cli/tests/lease_lost.rs"
  - "docs/INTEGRATION.md"
  - "docs/CLI.md"
non_scope:
  - "Not a stop, resume or start reachable over HTTP, MCP or the Cockpit: that waits for I2153 (the Cockpit asks before it runs a capability that changes the repository) and ADR 0126 on PR #860"
  - "Not detaching from the terminal: I2323"
  - "Not a heartbeat that tells another machine a leader died: the claim is released by the next executor of the checkout, as exclusive.rs:15-18 describes; changing that is milestone work-is-coordinated (I2143, origin/chore/the-runtime-pack-is-planned)"
  - "Not a second lease, lock or claim: one run leads a base by holding the lease and the claim that exist"
  - "Not hosting the run as an execution: src/execution is in memory by design (docs/EXECUTIONS.md:59)"
  - "Not acknowledging a verification failure on resume: the hold of owner decision D7 stays"
depends_on:
  - "I2320"
acceptance_criteria:
  - "Three concurrent `ensure` calls on one base leave one run leading it, and all three return the same run identity"
  - "A second `ensure` while a run leads returns the leader and starts nothing; an `ensure` from another worktree of the same repository does the same"
  - "`stop` records one stop request on the trail; a repeated `stop` adds nothing; the leader ends `cancelled` after the step in progress; `stop` with no run leading exits 10 and writes nothing"
  - "After the leader is killed between `merge_attempted` and its end, `resume` verifies that merge first, records how it ended, and continues the same run identity without merging it again"
  - "The status capability returns the same run on the command line, MCP and HTTP, and no capability that changes a run is exposed over HTTP or MCP"
  - "A resume while a verification failure is unacknowledged is refused with exit 10 naming the merge"
validation:
  - "bin/majordomus plan validate"
  - "cargo test --test integration_run"
  - "cargo test --test lease_lost"
  - "scripts/derive-check"
evidence_required:
  - "one_leader_per_base_test"
  - "idempotent_stop_test"
  - "resume_after_kill_test"
created_at: 2026-10-10
updated_at: 2026-10-10
