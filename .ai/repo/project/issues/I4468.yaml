acceptance_criteria:
  - "The grammar is declared once under share/schemas/majordomus/exemption/ with the fields scope, rule, reason, approver, expires_at, removal and shrink_only, where scope, rule, reason and approver are required and one of expires_at or removal is required; no other file spells the field list by hand"
  - "`majordomus generate` writes the grammar into each of the eleven shapes named in the objective, and `majordomus generate --check` fails when any one of them is edited away from it"
  - "Every existing exemption of the eleven shapes is migrated in this change: the approver of an entry that has none is the owner, by the decision of 2026-10-30, and its removal is the condition its current reason or header states; no entry is dropped"
  - "Case 4468: in a fixture, an exemption entry of each kind of shape (a policy class, an inventory.jsonl unit, a baseline header, a reason-per-line list) without an approver is refused by that shape's reader with the missing field named and the rule id, at the reader's existing exit code"
  - "Case 4468: an entry whose expires_at is past is reported naming the entry, the rule and the date, and an entry with neither expires_at nor removal is refused"
  - "Case 4468: adding a line to a shrink_only baseline without a new approval is refused, and removing one passes"
  - "README.md:211-213 no longer says 'no baseline, and no override': it says a doctrine is blocking or advisory and that what does not yet meet a rule is a declared, shrink-only exemption naming its rule, reason, approver and expiry or removal condition; docs/CLAIMS.yaml binds that sentence to case 4468"
  - "Before the change, case 4468 fails at its first assertion"
