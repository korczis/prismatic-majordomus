id: I3290
milestone: every-sessions-usage-is-observed
title: "Codex usage is read from app-server increments, and a cumulative total is never summed"
slug: codex-usage-is-read
priority: p2
profile: implementation
objective: "Map Codex app-server thread/tokenUsage/updated notifications into the same record, adding last-increment values only, cross-checking against total_token_usage, and recording a session as incomplete when turn completion arrives without a final total."
why: "Summing cumulative snapshots reports spend nobody incurred (lesson recorded 2026-10-13); the first Codex vertical must carry the regression case. App-server notifications reach only Majordomus-started sessions; the statement's 'every Codex session' must be proved through an evidenced seam or narrowed by evidence, not assumed. It extends milestone execution-telemetry. Proposed in ADR 0213 (Usage is observed through each provider's official telemetry into one provider-neutral record, and reported, estimated and billed amounts are never merged) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c253#2."
current_state: "Codex is `unadapted` for lifecycle in share/providers.yaml; nothing reads its usage."
desired_state: "Codex sessions Majordomus starts produce usage records indistinguishable in shape from Claude Code's; a Codex session the person started is received through the seam I3287 evidences, or reported not observed with the reason."
scope:
  - "apps/majordomus-cli/src/economics/usage.rs"
  - "test/fixtures/telemetry"
  - "test/cases"
depends_on:
  - "I0301"
  - "I3287"
  - "I3289"
serves:
  - "every-sessions-usage-is-observed#cumulative-is-never-summed"
acceptance_criteria:
  - "A fixture of increments and cumulative snapshots yields one total equal to the last cumulative value"
  - "A fixture missing the final total is recorded incomplete, not completed"
  - "Codex usage of a session the person started is either received through the official seam evidenced in share/providers.yaml (I3287) and configured by I3289, or reported on every surface as not observed with the reason, never as zero and never only as unattributed (case)"
  - "No Codex session file or transcript is read (ADR 0213)"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib economics::usage"
  - "majordomus plan validate"
evidence_required:
  - "test_codex_cumulative_is_never_summed"
  - "case_unseen_codex_usage_is_not_observed"
created_at: 2026-10-18
updated_at: 2026-10-18
