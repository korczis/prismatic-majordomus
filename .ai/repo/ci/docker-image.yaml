# The deployment image's model: when the image built from the generated deploy/Dockerfile is
# built, what it is checked for, under which name it is published, and which caches each kind
# of build may read and write. .github/workflows/docker-image.yml is an adapter over this file;
# the release's own image is release.yaml's (it compiles nothing, it copies the release's
# executable), and nothing here deploys anything.
#
# Rules this file encodes:
#   - publication follows verification: an image is pushed only for a master commit whose
#     validate run on the push concluded success, and a dispatch is held to the same proof;
#   - a pull request that changes how the image is made is built and smoke-tested, never
#     published, and never writes a cache another build reads;
#   - the name a published image is known by is the commit it was built from; no tag that
#     moves (latest, a branch) stands for a verified image.
version: 1

image: ghcr.io/korczis/prismatic-majordomus
# generated by `majordomus generate deployment`
definition: deploy/Dockerfile

# ---------------------------------------------------------------- when it runs
trigger:
  # validate's run on a master push, once it has concluded success
  after_validate:
    branch: master
    event: push
    conclusion: success
  # the image definition's own inputs; a pull request touching one proves the image still
  # builds and runs before it can merge
  pull_request:
    paths:
      - .ai/repo/deployments/**
      - deploy/Dockerfile
      - .dockerignore
      - rust-toolchain.toml
      - apps/majordomus-cli/Cargo.toml
      - apps/majordomus-cli/Cargo.lock
      - apps/majordomus-cli/build.rs
      - apps/majordomus-cli/src/deploy/**
      - .github/workflows/docker-image.yml
      - .github/actions/image-smoke/**
  dispatch:
    input: sha
    requires: a successful validate run on a master push of that commit
  # one build per commit, never cancelled, because each publishes a different immutable name
  concurrency: per-commit

# ---------------------------------------------------------------- what is checked
smoke:
  action: .github/actions/image-smoke
  checks:
    - the image runs as a user that is not root
    - the runtime carries no cargo and no rustc
    - /api/v1/ready answers ready within 60 s, with capabilities and objects
    - /api/v1/live names the commit the image was built from, and not a dirty tree

# ---------------------------------------------------------------- what is published
publish:
  # immutable, the only name a verified image has
  tag: sha-COMMIT
  attestations:
    - provenance
    - sbom
  # never for a pull request
  when: after_validate or dispatch

# ---------------------------------------------------------------- the caches
caches:
  layers:
    # a GHCR ref, not the Actions cache, which is past its 10 GB bound already
    backend: registry
    master_ref: buildcache
    master_ref_written_by: verified master builds only
    pull_request_ref: buildcache-pr-NUMBER
    pull_request_ref_written_by: that same-repository pull request's own builds; a fork writes none
  sccache:
    # SCCACHE_MOUNT_ID in apps/majordomus-cli/src/deploy/render.rs
    mount: majordomus-sccache
    backend: actions-cache
    key: docker-sccache-ARCH-HASH of rust-toolchain.toml and Cargo.lock
    written_by: verified master builds only; a pull request restores and never saves
