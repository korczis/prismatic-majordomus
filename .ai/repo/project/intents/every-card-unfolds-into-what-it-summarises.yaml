id: every-card-unfolds-into-what-it-summarises
title: "Every card of the site unfolds into what it summarises, recursively"
statement: "Every card on majordomus.dev — on the homepage and on every page a card links to — opens in place into the thing it summarises: its facts, its evidence, its own cards and a live reading of the record behind it, derived from the canonical records and never hand-written, and each card it reveals unfolds the same way, so a reader can go from a headline to the proof without leaving the page, in every language the site declares."
