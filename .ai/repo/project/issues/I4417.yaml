acceptance_criteria:
  - "Unit test of discovery: a class with a `generator:` block (command, inputs, stamp) parses; one with an unknown generator key, a non-`:(glob)` input pathspec or a kind whose lifecycle is not derived is refused naming the class"
  - "Unit test: the inputs digest is the same for the same tracked blobs in any order of discovery and changes when one input's blob changes; an untracked file matching an input does not change it"
  - "Case 4417, in a fixture adopter with a kind `component` (format yaml, members `components`, lifecycle derived, references issues: issue, intents: intent, rules: rule) and a script that writes .ai/repo/components.yaml stamped with `majordomus knowledge digest components`: the index reads each component as majordomus://component/<id> with no diagnostic"
  - "Case 4417: after an input file is changed and committed, the repository diagnostics and `majordomus doctor` each report derived_source_stale naming the class, the file, both digests and the declared command; after the script reruns and the output is committed, the finding is gone"
  - "Case 4417: no step of the case executes the generator except the case itself (a generator that writes a marker file leaves none after index, doctor and entity reads)"
  - "Case 4417: `majordomus entity show` on a component that names I1 shows an outgoing edge to issue I1, `majordomus entity show` on I1 shows the incoming edge from the component, and GET /api/v1/trace/issue?id=I1 on the fixture's server lists the component under the objects that reference it"
  - "Case 4417: a component naming an issue the plan does not declare is the existing dangling-reference finding, not a silent omission"
  - "docs/KNOWLEDGE.md and docs/ADOPTION.md describe the generator block, the digest command, the staleness finding and `references:`; docs/KNOWLEDGE.md:369 no longer says that a repository cannot add a kind"
  - "Before the change, case 4417 fails at its first assertion"
