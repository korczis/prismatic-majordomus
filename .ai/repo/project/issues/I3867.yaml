id: I3867
milestone: public-proof
title: "An article explains in both languages how every language of the site is derived from one source"
slug: one-source-every-language
priority: p2
profile: implementation
parallel_safe: true
objective: "Publish site/content-src/one-source-every-language.md, an English article on how majordomus.dev is multilingual (ADR 0218 and its amendment of 2026-10-21). It covers the owner's order, the three ways weighed and the one taken, the pass over the built site, the memory keyed by the English and the structure a translation must keep, the separate translation step and its coverage, the rule and the site-languages gate that hold every copy to its original in a browser, the article translations that are a second source held to the first by check 21, and what the pass does not do yet. Every statement is one that ADR 0218, rule project.the-site-is-offered-in-every-language, the gates or case 3590 state on master, and no count is typed by hand. site/content-src/jeden-zdroj-kazdy-jazyk.md is its Czech translation, naming translated_from and its source's digest. site/data/nav.toml lists both. Both relate the derivation, proof-carrying documentation and reasoning articles, each of which names them back in its own language."
why: "The owner asked on 2026-10-19 that the site be multilingual and that its articles be interlinked in every language. A reader meets two kinds of Czech page, machine copies and authored translations, and no article says which is which or why neither is maintained by hand."
current_state: "No article explains how the site's languages are derived. The article groups relate each other, and none of them names it."
desired_state: "/one-source-every-language/ and /jeden-zdroj-kazdy-jazyk/ are built, are counterparts of each other, are listed in the navigation, and are related both ways with three other groups. Check 21 and check 19 pass, with the translation at its source's digest."
