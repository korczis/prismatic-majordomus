acceptance_criteria:
  - "Step 0 lands first: /design/assets/ serves share/design on /ui and /cockpit, and rewrite_imports versions its specifiers; a case (C7) finds that a changed core file changes the digested URL of every importer across the /design, /ui and /cockpit prefixes, and that the site build fingerprints the same graph"
  - "A case (C1) finds no two served scripts with one blob; it replaces the copy check of scripts/cockpit-assets --check, which is deleted with COPIES in step 2"
  - "A case (C2) finds that every asset a page names exists, and a case (C3) that every static import of every served module resolves"
  - "A case (C4) fails when a planted copy of any core helper (socket, nav, theme, tokens, load, clipboard, tip) is added under share/ui, share/cockpit or site, and passes on the tree"
  - "The browser cases 3382, 3383, 3386 and 3409 and the nav, theme, copy, chart and graph interaction specs pass on /ui, /cockpit and the site with no CSP violation in the console (C5)"
  - "A case (C6) finds that the /ui and /cockpit Content-Security-Policy still admits exactly one inline script"
  - "design kit's S3 finds one nav carrier (C8), and C1, C3, C4 and C8 run inside the design kit --check ratchet I4534 started"
  - "Step 2 moves nav.js and theme.js to modules on all three surfaces in one pull request, scripts/ui navbar still passes, and rule project.the-ui-wears-the-sites-navbar names share/design/js/core as the served source in the same pull request"
  - "One tab loads one socket.js module instance, read by case 3382 or its successor"
  - "The first commit that adds this issue's case also changes criterion one-client-core of .ai/repo/project/intents/one-kit-on-every-surface.yaml to evidence: test with that case as its ref, so the criterion stops being proven by majordomus intent explain of itself"
