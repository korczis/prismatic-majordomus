title: "Graphs are ECharts graph series and bespoke layouts are D3, through one share/design/js/graph module, the duplicated PR and milestone dependency graphs become one each, and Cytoscape leaves"
slug: one-graph-module
priority: p1
profile: implementation
parallel_safe: false
objective: "Slice S7 of milestone one-frame-one-kit-one-library-per-job, re-scoped on 2026-11-17 by the owner's rule of 2026-11-14 (Visuals, derivation and links): 'ECharts for charts and graphs, D3 for bespoke layouts and force physics ... no Chart.js or Cytoscape'. Add share/design/js/graph: it draws a graph as an ECharts graph series, constructed through I4542's chart module (this module gives it graph data, token styling through the core, one keyboard model and a Flowbite drawer for a node's details), and draws the bespoke layouts, the trains view and the milestone dependency DAG, with D3 (d3-force for force physics), vendored from npm at the version package.json pins. Every graph is mounted through I4653's visual wrapper, and every node and edge that stands for an entity takes its href from I4540's resolver. share/cockpit/graph.js, share/cockpit/trains.js, the graph part of share/ui/ui.js and site/graph.js become callers of it; Cytoscape leaves package.json, share/cockpit/vendor and share/ui/vendor. This is a rewrite and not a deduplication: the two Cockpit Cytoscape setups are about 3 % similar (peer spike of 2026-11-17). The PR dependency graph (/ui/prs and /cockpit/trains) and the milestone dependency graph (/ui/roadmap, /roadmap/ and the Mermaid of /plan/ and /dag/) are drawn once each. three.js is measured against ECharts and D3 for the mesh topology page (/cockpit/graphs/topology): on the same data, the frame time, the node count drawn and the reading each view gives are recorded; three.js stays only when the record names a reading the D3 view cannot give, and otherwise the topology page moves to D3 and three leaves package.json. It absorbs I2656 (the diagram viewer serves the Cockpit and /ui, milestone surfaces-never-disagree): a Mermaid diagram on /ui and /cockpit is drawn through the site's one diagram viewer (site/diagrams.js, moved under share/design/js), and I2656 is closed by this slice naming its delivering commit. It builds on I4494's bounded neighbourhood, on which it depends."
why: "The owner's order of 2026-11-07 13:30Z asks for /ui, /cockpit and the site to be reintegrated on one kit: max reuse, Flowbite Pro best practices, one library per job, everything derived, tested, deployed and linked (intent one-kit-on-every-surface). The owner's rule of 2026-11-14 names ECharts for graphs, D3 for bespoke layouts and force physics, and rejects Cytoscape. Four Cytoscape integrations carry four stylings, four theme observers and four keyboard handlings, and two graphs are drawn twice."
current_state: "Measured on master on 2026-11-07: Cytoscape 3.33.1 (package.json) in share/cockpit/graph.js (1310 lines), share/cockpit/trains.js (1259 lines), share/ui/ui.js (window.cytoscape at lines 572 and 838 of 1150) and site/graph.js (755 lines); PR dependencies on /ui/prs and /cockpit/trains; milestone dependencies on /ui/roadmap, Cytoscape on /roadmap/ and Mermaid on /plan/ and /dag/; mesh topology on /ui/mesh (Cytoscape) and /cockpit/graphs/topology (three.js 0.185.1, share/cockpit/topology.js). Read on 2026-11-17: cytoscape is vendored into both share/cockpit/vendor and share/ui/vendor; D3 is not in package.json; I2656 and I4494 read READY."
desired_state: "share/design/js/graph is the one graph integration, on ECharts graph series and D3; each graph kind has one view; no Cytoscape remains in package.json or the tree; every graph is mounted through the visual wrapper and every entity mark links to its page; the three.js verdict is recorded with its measurement; I2656 is closed by this slice."
