acceptance_criteria:
  - "Library test and doctest in worktree::state. Against declared [V603, R022]: issue_of('feat/v603-timeline-pinch') is V603, issue_of('fix/r022') is R022, and issue_of('feat/v6030-x') is none. Against [I0905]: issue_of('chore/i0905-is-recorded-done') is I0905. The existing I1003 and I0042 doctest lines pass unchanged, including feature/I10030 naming nothing."
  - "Library test in plan::delivery. parse_history over a two-parent commit with subject 'feat(studio): V603 pinch zoom on the timeline (#247)' and body 'Adds pinch zoom.' yields pull request 247, title 'feat(studio): V603 pinch zoom on the timeline' (not the body's line) and no branch, and named_by attributes it to V603 via title_or_branch. 'Merge pull request #250 from korczis/chore/u001-tokens' still yields pull request 250 and branch chore/u001-tokens, and names U001 through its branch."
  - "Library test in plan::delivery. A two-parent commit 'merge: master (6c79dcf68cf) into I4241, derived' gets no pull request, no title and no attribution. A two-parent commit 'merge: main into V603' with no trailing (#N) gets no pull request, no title and no attribution either."
  - "Library test in plan::delivery. named_by(None, Some('chore/plan-done-v603-u001')) against declared V603 and U001 yields both via title_or_branch: an id inside a branch component is still found."
  - "Library test in plan::delivery, at a commit. A merge 'test(plan): pattern matrix (#245)' whose title names no declared record is listed in the report's `unattributed` with commit, pull_request 245, its title, and a reason. The reason says that the merge carries no branch and that the live answer reads the branch from the forge's observation. Declared S080 is not moved to merged by it."
  - "Library test in plan::delivery, live. The deployment observation's merged pull request 245 has head_ref 'test/s080-pattern-matrix' and merge_commit equal to that merge. The live answer attributes S080 via forge_title at stage merged, and merge 245 is not listed as unattributed."
  - "Case 4366 builds a fixture repository with OSCILLA's layout: issues V603.yaml, U001.yaml and S080.yaml, milestone M048.yaml, project.yaml default_branch main. It has one merge of each subject form (PR_TITLE naming V603, `Merge pull request #N from owner/<branch naming u001>`, a derived merge, and a PR_TITLE merge naming S080 only in a branch git does not keep). `majordomus plan delivery --at HEAD --json` reports V603 and U001 at stage merged and S080 at none, and lists the S080 merge under `unattributed` with its reason."
  - "Regression on this repository: `bin/majordomus plan delivery --at 5370ee63d19 --json` reports the same stage and proving commit for every issue before and after the change."
  - "merge_subject is one function, in plan/delivery.rs or a module both delivery and the changelog use, and after I4368 lands release/commits.rs contains no ` (#` or `Merge pull request #` matcher of its own: its first-parent mode calls merge_subject."
  - "`majordomus generate --check` is clean. The plan.delivery capability description in capability/builtin/plan.rs names the ` (#N)` merge form and the `unattributed` list, and the generated registry and OpenAPI projections are regenerated."
