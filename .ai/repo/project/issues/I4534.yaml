acceptance_criteria:
  - "The first commit of this slice adopts the kit: majordomus design licence reports active (ui.kit: flowbite-pro) and majordomus doctor names no missing design-kit enforcement entry"
  - "validate.yml and the pre-push hook run design kit --check as a ratchet: a planted finding above the committed baseline fails it, the baseline equals the tree's finding count when this slice lands, and a commit that raises the baseline fails the ratchet case"
  - "The ratchet case (numbered by scripts/case-numbers next) fails on a planted page without the one frame's mark, a planted component class outside the kit and a planted construction of ECharts, D3, p5, Alpine, Cytoscape or Chart.js outside share/design/js, each beyond its baseline, and passes on the tree"
  - "This issue's evidence holds one entry per open pull request on a slice's scope with covers: pr_triage_record, a result that names its end (landed, absorbed into I45xx, superseded by #n, or held by the owner) and its reason, and a commit naming the master commit or the refs/rescue/ ref that holds its head"
  - "git branch -r --contains or git for-each-ref refs/rescue/ shows every triaged head reachable"
  - "gh pr list --state open shows none of the landed or superseded ones, and an absorbed one is still open with a comment naming its absorbing slice (critique finding s0-gates-everything-and-closes-early)"
  - "A superseded or absorbed pull request is closed only by naming the master commit that delivered its work and its refs/rescue/ ref (owner decision 2026-11-01: never auto-close; close only by delivery)"
  - "This issue's evidence holds one entry per older record (I3790 to I3797, I4334, I4377, I2654, I2656, I4494, I4495) with covers: older_record_disposition and a result naming its end (delivered at a commit, kept as a dependency of a named slice, merged into a named slice, or a half moved to a named slice); no record carries cancelled: true without a reason that names its replacing slice"
  - "plan drift reports no merged_not_recorded for I4334 or I4377"
  - "This issue's evidence holds one entry with covers: route_inventory whose command is the one that derived it and whose result lists every route with its surface, its answers and, for each /ui and /cockpit pair over the same answers, its verdict; the swagger page and the handbook are listed exempt with their reasons"
validation:
  - "majordomus plan validate"
  - "majordomus design kit --check"
  - "majordomus design licence"
  - "majordomus plan drift I4334"
  - "majordomus plan drift I4377"
  - "bash test/run.sh <n>_the_kit_frame_and_library_gates_ratchet (n from scripts/case-numbers next)"
evidence_required:
  - "kit_ratchet_gate"
  - "pr_triage_record"
  - "older_record_disposition"
  - "route_inventory"
