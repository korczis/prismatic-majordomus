id: I4380
milestone: ci-critical-path
title: An optional step of the Pages publication never stops the deploy
slug: a-pages-deploy-is-not-stopped-by-an-optional-step
priority: p0
profile: implementation
parallel_safe: true
serves: []
objective: "A step of pages.yml that is written to degrade (`|| echo \"::warning ...\"`) degrades when it runs out of time instead of being killed: its command is bounded inside the step's own timeout-minutes, and scripts/ci/step-bound-check refuses one that is not. The trends reading reads its runs eight at a time with every forge call bounded, and `majordomus prs refresh` reads the open pull requests in GraphQL pages of 25 when the forge times out `gh pr list`'s page of a hundred (a gateway 504, GraphQL's own \"may be the result of a timeout\", or a body cut off on its way, \"unexpected end of JSON input\"). The ui-snapshot's forge observation is two degrading steps, each bounded from measured runs: a healthy forge is always observed, and a forge that cannot be asked leaves the PR Drain and Deployments screens saying the forge was not observed, and the site is still published."
why: "The Pages workflow had not published master since about 22:29Z on 2026-10-28. On runs 40796031540, 40803295553 and 40823254353 the deploy job's `trends` step, `scripts/pages trends || echo \"::warning title=No trends::...\"` under `timeout-minutes: 4`, read sixty validate runs one call at a time for longer than four minutes; GitHub killed the step (\"The action 'trends' has timed out after 4 minutes\"), a step killed by its own bound is a failed step that `||` never sees, and publication said \"this run ended (publish: skipped) without pushing gh-pages\". In the same runs the ui-snapshot step 'the forge, observed' failed with exit 12: `gh pr list --state open --limit 500 --json ...statusCheckRollup,...` answered HTTP 504 Gateway Timeout on all four attempts with 124 pull requests open, and the deploy job needs that job's artifact. f3 found the same failures first and drafted them as I4376 (the trends step killed by its own bound, and a gh that never answers costing the deploy) and I4377 (the forge observation failing the whole site on one 504); both ids were released and their ideas are folded in here, including f3's acceptance for the trends step: a gh that never answers gives exit 12, no trends.json, the ::warning, and the deploy goes on. The review of daaa81de25a then measured the first bound of the forge step as too short for a healthy forge: `prs refresh` took 128 s with 77 open (run 40573560897: observed 22 s, fetched 106 s), 174 s with 84 (40652175281: 85 s, 89 s) and 163 s with 87 (40696771044: 59 s, 104 s), about 1.2 s a pull request head fetched, so a 135 s bound would have killed it with the 124 open now. The review of b689fdb1fef measured one more answer of the same overloaded page: a body cut off on its way, which gh reports as \"unexpected end of JSON input\" (pages job logs of 2026-10-24: 120850143313, 120870713946, 120881119536, 120966409314); it was asked four times and never read in smaller pages."
current_state: "Measured at 5370ee63d19: the trends step is bounded only by its timeout-minutes; cmd_trends makes about 180 forge calls in sequence with no per-call bound; GhForge::observe asks `gh pr list` four times for the same page of a hundred on a 504; 'the forge, observed' is blocking, so a forge outage fails ui-snapshot and with it the deploy of every page; step-bound-check does not look at degrading steps."
desired_state: "The trends step runs `timeout --kill-after=10 200 scripts/pages trends` inside its four minutes, and the reading takes about 50 s over sixty runs (measured locally: 48 s). A 504 on the open list is answered at once by OPEN_QUERY pages of OPEN_PAGE (25), each retried on an outage as every read is; any other outage of `gh pr list` is still asked again four times. A 504, or a GraphQL answer saying \"This may be the result of a timeout\", on the open list is paged the same way, and so is a body of the open list cut off on its way (\"unexpected end of JSON input\"), while a cut-off answer to any other read is still an outage asked again. A trends call the forge answers with a 5xx or a rate limit is asked once more, a second later, inside what is left of its own MJ_TRENDS_CALL_SECONDS; a refusal or a call stopped at its bound is not. The trends listing is bounded like every other trends call, so a gh that never answers is exit 12 within seconds. The forge observation is two steps: 'the pull requests, observed' runs `timeout --kill-after=10 420 majordomus prs refresh` in 8 minutes (a healthy forge to about 250 open pull requests), 'the deployments and releases, observed' runs `timeout --kill-after=10 135 majordomus served forge` (11-12 s measured) in 3; each degrades with a 'Forge not observed' warning. The per-head fetch stays one `git fetch`: running it in parallel was not measured to help, and concurrent fetches into one clone share FETCH_HEAD and the maintenance lock. step-bound-check section 5 reads the commands as the shell does (continuations, comments), recognises `|| echo ::warning`, `|| {` with the warning in its block and `if [!] cmd; then` with the warning before `fi`, adds up every bounded command of the step, accepts `--bound=N`, and refuses a degrading step with its own minutes whose degrading commands are unbounded or whose bounds add up to the step's minutes or more, unless it is continue-on-error; a command with no bound that does not degrade is its documented limit."
scope:
  - ".ai/repo/project/issues/I4380.yaml"
  - ".github/workflows/pages.yml"
  - "scripts/pages"
  - "scripts/ci/step-bound-check"
  - "apps/majordomus-cli/src/integration/forge.rs"
  - "test/cases/742_only_an_outage_is_asked_again.sh"
  - "test/cases/3933_the_trends_are_read_from_the_runs_themselves.sh"
  - "test/cases/4380_an_optional_step_is_bounded_inside_its_own_bound.sh"
  - "site/content/plan/I4380.md"
non_scope:
  - "Replacing `gh pr list` as the first read: thirty-five cases and six integration tests script a forge that answers it, and the paged read is asked only when the forge times its page out or cuts its body off"
  - "Making the publication itself, the build or the check degrade: those still fail the deploy"
  - "A longer trends series or caching it between publications: it stays stateless (I3933)"
depends_on: []
acceptance_criteria:
  - "step-bound-check: the pages.yml of 5370ee63d19 is refused at the trends step (exit 10); this branch's pages.yml and validate.yml pass; case 4380 holds the two forge steps' measured bounds and the refused and accepted shapes (unbounded, bounds that add up past the step, a bounded non-degrading command that counts, a continuation line, `|| {` and `if !` and `else` blocks, a comment that is not a command, timeout in seconds or minutes, scripts/ci/timed with --bound N and --bound=N, a test condition, continue-on-error, and the documented limit)"
  - "Case 3933: the runs are read in parallel and one at a time with identical bytes, a jobs call that hangs is stopped at MJ_TRENDS_CALL_SECONDS and is exit 12 with no file left, and (section 8, f3's acceptance) a gh that never answers, run through the trends step's own line of pages.yml under bash -e, is exit 12 with no trends.json, the ::warning and a step that ends 0; a reading that outlives the line's own timeout is exit 124, the same warning and the same 0; (section 9) a listing answered HTTP 502 or a rate limit once is asked again exactly once with identical bytes, and a 401 is asked once and is exit 12"
  - "Unit tests in integration::forge: a paged node is observed exactly as `gh pr list` lists the same pull request; the cursor is followed until the forge has no more or the limit is reached; a failing or empty page fails the whole list; only a 504 or GraphQL's own timeout is answered with smaller pages, and for the open list also a body cut off on its way (list_needs_smaller_pages), which the retry still reads as an outage; OPEN_QUERY is pinned"
  - "Case 742 sections 6, 7 and 8: a `pr list` that always answers 504, always answers GraphQL's timeout error, or always answers with a body cut off on its way, is asked once, the open list is read in one GraphQL page of 25, and the observation records #1 with its passing check; section 5: a cut-off answer to another read (`repo view`) is asked again exactly once (I4222)"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib integration::forge"
  - "bash test/run.sh 4380_an_optional_step_is_bounded_inside_its_own_bound 3933_the_trends_are_read_from_the_runs_themselves 742_only_an_outage_is_asked_again 3749_a_full_history_checkout_is_bounded 3748_a_pages_step_bound_follows_its_budget"
  - "scripts/ci/step-bound-check"
  - "actionlint .github/workflows/pages.yml"
evidence_required:
  - suite
risk: "A forge that times out every page of 25 too now costs the observation one failed `gh pr list` plus four attempts per page before it degrades; each read is bounded inside its own step (420 s and 135 s), so the cost is a warning and never the publication; a hung forge adds about seven minutes to ui-snapshot, well inside its 45."
