id: the-product-shows-what-it-caught
title: "What finish caught is counted from the ledger and compared on the benchmark, never asserted"
slug: the-product-shows-what-it-caught
order: 163
priority: p2
problem: "task.refused was added to the ledger so that the tool's own benefit could be counted (share/events.yaml: 'a refusal that was later satisfied is a false done that was caught'), but no capability, page or report reads it. The economics benchmark compares tokens and states that the finish contract's effect is not measured (docs/ECONOMICS.md, 'What this does not measure'), and no live pair has been recorded (docs/generated/economics.md at 707a04c7ce8: 0 valid pairs under methodology 1). So the one product metric every assessment named has a producer and no reader. Proposed in ADR 0208 (The product's value is stated as the false dones its finish caught, beside the friction it cost) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c119#7, chatgpt-majordomus:c119#10, chatgpt-majordomus:c256#2, chatgpt-majordomus:c277#1."
outcome: "One read over the ledger answers what finish caught and what it cost, a refusal nobody answered is separated from a caught one, /ui shows it, and the benchmark gains an acceptance metric beside its token metric."
current_state: "lib/finish.sh:108 appends task.refused (task_id, outcome, unmet, refused, contract) to each checkout's $MJ_STATE_DIR/ledger.jsonl, which is checkout-local and lost when a worktree is removed; task.finished already records verify.tree from mj_worktree_tree_id; lib/history.sh:158 only prints the line. gates.completion judges one task; no capability aggregates, and the Rust side already reads the ledger through apps/majordomus-cli/src/ledger.rs. .ai/repo/benchmarks/economics/methodology.yaml measures effective_token_reduction, and its pairing treats a failed run as invalid; tasks carry hidden acceptance tests already."
desired_state: "A gates capability (one capability! declaration, every transport generated) aggregates task.refused and task.finished; events carry a tree digest; /ui dashboard draws it with view::kpi_not_observed for absence; the methodology names an acceptance metric over the existing pilot corpus."
scope:
  - "apps/majordomus-cli/src/capability/builtin/gates.rs"
  - "lib/finish.sh"
  - "share/events.yaml"
  - "apps/majordomus-cli/src/ui/dashboard.rs"
  - ".ai/repo/benchmarks/economics/methodology.yaml"
  - "docs/ECONOMICS.md"
  - "test/cases"
  - "apps/majordomus-cli/src/ledger.rs"
  - "apps/majordomus-cli/tests"
non_scope:
  - "Token economics (ADR 0082)"
  - "Cost per accepted outcome, which waits on execution-telemetry"
  - "Publishing checkout-local ledger figures on the public site"
  - "The /cockpit overview card (dashboard.overview), until its measure renders absence as not observed"
acceptance_criteria:
  - "Every criterion of intent the-product-shows-what-it-caught has its evidence"
  - "No second ledger, registry or hand-written OpenAPI entry is added"
validation:
  - "majordomus plan validate"
evidence_required: []
risks:
  - "The ledger is checkout-local, so a figure covers one checkout; it must say which"
  - "A counted refusal invites gaming by refusing more; the figure is shown beside the unanswered-refusal count"
created_at: 2026-10-18
updated_at: 2026-10-18
