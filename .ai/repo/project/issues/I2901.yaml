  - "bin/majordomus generate --check"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib -- plan:: ui::prs worktree::state release::commits"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --doc release::commits"
  - "env -u MAJORDOMUS_SHARE -u MAJORDOMUS_HTTP_HOST -u MJ_ROOT bash test/run.sh 2901_one_grammar_names_a_record_id 3970_a_pull_request_carries_its_metadata 3220_the_idd_loop_is_walked_in_a_browser"
