# Build host: this CI runner must always serve. Restart without a limit, so a runner that
# exits (a full disk, an update, a crash) comes back by itself instead of staying offline.
#
# Unlike critical.conf there is no OOMScoreAdjust: a runner's jobs are its children and
# inherit it, and the compilers they start must stay the first the kernel kills.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
