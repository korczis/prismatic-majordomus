id: I4796
milestone: an-analysis-builds-on-what-survived-refutation
title: "reasoning analysis checks an evidence-tagged multi-pass analysis: every finding tagged and sourced, one verdict each, a synthesis on CONFIRMED findings only, gaps ledgered, and not_run never reads as ok"
slug: an-analysis-is-checked-for-what-survived
priority: p1
profile: implementation
parallel_safe: true
objective: "Add the skill evidence-tagged-analysis (the protocol: question and rules first, independent lenses, cross-refutation with one verdict per finding, a synthesis from CONFIRMED findings with remedies mapped to owners, a gaps ledger) and the read-only capability reasoning.analysis that checks one bundle of it against a table grammar, projected to CLI, HTTP and MCP from one declaration."
why: "The owner ordered on 2026-11-25 that the lessons of a long adopter session become generic Majordomus improvements, consulting other models in several passes (BRIEF of session 7709ab47-7786-494d-bbcc-679b293569a7, recorded in docs/REASONING.md#analysis). The best result of that session came from a three-pass evidence-tagged analysis, and its weakness was that the tags were checked by hand and the pass documents were lost."
current_state: "On 46775282570 the reasoning module has six capabilities (capability/builtin/reasoning.rs) and none reads a document of claims; the project-picture skill asks for evidence tags and nothing checks them."
desired_state: "reasoning/analysis.rs parses a bundle and runs the checks bundle, question, findings, verdicts, synthesis, citations and gaps; reasoning.analysis answers conforms, fails or incomplete with ok true only for conforms; the skill and test/fixtures/analysis/conforming/ show a conforming bundle; docs/REASONING.md documents the grammar."
scope:
