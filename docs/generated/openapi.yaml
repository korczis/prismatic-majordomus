        decided:
          type: integer
          format: uint
          minimum: 0
          description: How many deployments were decided.
        refusals:
          type: array
          items:
            "$ref": "#/components/schemas/Refusal"
          description: "Every refusal, in the order the objects and their keys appear."
      required:
        - ok
        - decided
        - refusals
