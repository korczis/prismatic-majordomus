id: I3172
milestone: development-runtime
title: "The compiled context names the small set of capabilities the work needs"
slug: context-names-its-tools
priority: p3
profile: implementation
objective: "Add a selector over the capability registry so a compiled context lists the capabilities relevant to the request's scope and kinds, each with its reason, within the budget."
why: "2026-10-11: avoid overloading the model with the full catalogue (2527 capabilities on this repository on 2026-10-18, from majordomus capabilities). Milestone development-runtime is named by no intent, so this issue is derived maintenance and serves no criterion (intent-bound-work#exemption-is-typed). Sources: chatgpt-majordomus:c226#16."
current_state: "devcontext selects layer objects; capabilities are not candidates."
desired_state: "A bounded, explained tool subset."
scope:
  - "apps/majordomus-cli/src/devcontext"
  - "apps/majordomus-cli/src/capability"
acceptance_criteria:
  - "A request about a path lists the capabilities that read or write it, with reasons"
  - "The list respects the budget"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib devcontext::"
evidence_required:
  - "test_context_tool_subset"
created_at: 2026-10-18
updated_at: 2026-10-18
