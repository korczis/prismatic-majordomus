  - "bin/majordomus shell check"
  - "bin/majordomus doctor"
  - "bin/majordomus plan validate"
evidence_required:
  - "empty_input_set_case"
risk: "Every repository whose layout matches none of a token's inputs starts seeing unknown where it saw OK, and a completed finish that declared that token is refused; the line has to say which inputs matched nothing so the reader knows the refusal is about the declaration, not about the work."
