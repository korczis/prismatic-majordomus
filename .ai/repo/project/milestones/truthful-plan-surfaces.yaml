  - "share/design"
  - "share/schemas"
  - "handbook"
  - ".ai/repo/project/milestones"
  - ".ai/repo/rules/project"
  - ".ai/repo/adrs"
  - "docs/PLANNING.md"
  - "docs/DIAGRAMS.md"
  - "test/cases"
non_scope:
  - "Writing lifecycle stamps from inference; a merge is not acceptance and evidence still decides DONE (ADR 0166, alternatives)."
  - "Rewriting the awk status engine; delivery is Rust only."
acceptance_criteria:
  - "plan.delivery answers a stage with its proving object for every issue, and an unread forge is reported as unread"
  - "The trunk's ci refuses an issue merged and unrecorded past the declared window, naming the command that settles it"
  - "No milestone record carries version, and the schema refuses one"
  - "/roadmap/ and /ui/roadmap list every milestone of the plan in the graph's order, with the inferred stage of each issue linked to its proof"
  - "homepage-check refuses a present-state sentence in site/data"
  - "The diagram gate covers ADRs, rules, the handbook and UI markdown, and finds no box art"
  - "One highlighter: no highlight.js and no CDN highlighter on any surface, and a gate refuses one"
validation:
  - "bin/majordomus plan validate"
  - "bash test/run.sh 3100_an_issue_delivery_is_inferred 3101_merged_work_unrecorded_is_drift 3102_a_milestone_version_is_inferred 3103_the_roadmap_draws_every_milestone 3104_the_ui_roadmap_reads_delivery 3105_the_homepage_states_no_present_it_does_not_read 3106_every_published_tree_draws_its_diagrams 3107_one_highlighter"
evidence_required:
  - "delivery_inferred"
  - "drift_gated"
  - "surfaces_read_one_derivation"
  - "diagrams_and_code_unified"
depends_on: []
risks:
  - "The drift gate turns the trunk red on landing for every issue already merged and unrecorded; I2748 records them before the gate is made blocking."
  - "syntect adds to the executable's build time and size; measured in I2747 before it lands."
