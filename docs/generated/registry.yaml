          Listen:
            type: object
            additionalProperties: false
            properties:
              port:
                "$ref": "#/$defs/Port"
                description: "The port, stated once for the process, the image and the provider configuration."
              interface:
                "$ref": "#/$defs/Interface"
                description: Which interface.
            required:
              - port
              - interface
            description: The address the process listens on.
