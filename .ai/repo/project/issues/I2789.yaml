id: I2789
milestone: idd-workspace
title: "The intent workspace shows why an intent stands where it stands and every move made on its issues"
slug: the-workspace-shows-its-evidence
priority: p1
profile: implementation
parallel_safe: false
objective: "Add to /ui/idd, for the open intent: a panel asked on its own route (/ui/panels/standing?intent=<id>) from intent_realization.explain — the sentences its stage and verdict rest on, each unmet criterion with its evidence state, the command that reproduces it and the issues serving it, the work realising the intent with each link's provenance, and its drift; and a panel from executions.list of every plan.transition this server ran on the intent's issues, newest first, each leading to its execution."
why: "The workspace shows what serves an intent and offers the next move, but not why the intent stands where it does or what was moved: the evidence and execution steps of the IDD loop are read on other surfaces, and intent_realization.explain takes seconds, so it cannot hold the screen's first paint."
serves:
  - the-owner-directs-work-from-the-ui#the-workspace-shows-why-and-what-moved
current_state: "intent_realization.explain and executions.list answer both questions; no screen reads them for an intent."
desired_state: "/ui/idd shows the intent's standing from its own panel route and the moves made on its issues, both read only from those capabilities."
scope:
  - "apps/majordomus-cli/src/ui"
  - "apps/majordomus-cli/tests/ui_idd_evidence.rs"
  - ".ai/repo/project"
  - "docs"
  - "site"
  - ".gitattributes"
depends_on:
  - "I2783"
acceptance_criteria:
  - "The workspace's first paint does not ask intent_realization.explain; its placeholder names the panel route, and the route answers the intent's standing"
  - "Each unmet criterion is shown with its evidence state, its reproduce command and the issues serving it, exactly as the capability answers"
  - "A plan.transition started on one of the intent's issues is listed on the workspace, leading to its execution, and one on another intent's issue is not"
validation:
  - "majordomus plan validate"
  - "cargo test --test ui_idd_evidence"
evidence_required:
  - "ui_idd_evidence_tests"
