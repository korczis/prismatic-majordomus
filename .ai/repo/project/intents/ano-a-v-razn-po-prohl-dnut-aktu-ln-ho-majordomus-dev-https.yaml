id: ano-a-v-razn-po-prohl-dnut-aktu-ln-ho-majordomus-dev-https
title: "Ano. A výrazně. Po prohlédnutí aktuálního [majordomus.dev](https://majordomus.dev/?utm_source=chatgpt.com) bych ale nedoporučil obyčejný redesign. Doporučil bych posunout web do role živé, důkazově podložené produktové demonstrace samotného Majordomusu."
statement: "Ano. A výrazně. Po prohlédnutí aktuálního [majordomus.dev](https://majordomus.dev/?utm_source=chatgpt.com) bych ale nedoporučil obyčejný redesign. Doporučil bych posunout web do role živé, důkazově podložené produktové demonstrace samotného Majordomusu.\n\nSoučasný web už má dobré základy: generované registry, capability matrix, evidence, roadmapu, interaktivní příklady a publikované snapshoty `/ui` a `/cockpit`. To je potřeba zachovat.&#x20;\n\n[image](https://www.google.com/s2/favicons?domain=https://majordomus.dev\\&sz=32)\n\nPrismatic Majordomus\n\n+1\n\n\n\nProblém je jinde: Majordomus začíná být zajímavější než způsob, jakým se prezentuje.\n\n## 1. Co ukazuje aktuální web\n\nPUBLIKOVANÁ VERZE WEBU\n\n# v0.30.0\n\nRelease z 18. října 2026\n\nPůvod stránky\n\n2dfff96\n\nBuild snapshot\n\n## 2 619\n\nregistrovaných capabilities\n\n## 196\n\nMCP nástrojů\n\n## 201\n\nHTTP routes\n\n## 68\n\nvynucovaných pravidel\n\n## 49\n\nspustitelných use cases\n\n## 28\n\nproduktových features\n\n232 deklarovaných guaranteed claims\n\n0 s doloženým recorded run na této revizi\n\nHodnoty z veřejně načtené homepage. Jde o údaje publikovaného snapshotu, ne o nezávislé potvrzení skutečné provozní funkčnosti.&#x20;\n\n[image](https://www.google.com/s2/favicons?domain=https://majordomus.dev\\&sz=32)\n\nPrismatic Majordomus\n\nTo poslední číslo je důležité. Web správně rozlišuje mezi deklarovaným tvrzením a důkazem, ale ukazuje také, že evidenční řetězec není kompletní. Nový marketing nesmí tento rozdíl zamaskovat animacemi.\n\n## 2. Co bych změnil\n\n| Oblast       | Dnešní stav               | Cílový stav                                |\n| ------------ | ------------------------- | ------------------------------------------ |\n| Homepage     | Převážně vysvětluje       | Vysvětluje a demonstruje                   |\n| Capabilities | Odvozený katalog          | Interaktivní průzkumník systému            |\n| Mesh         | Popis funkcí              | Topologie, koordinace a důkazy běhu        |\n| IDD          | Evidence a roadmapa       | Navigovatelný intent → delivery graph      |\n| Observatory  | Produktová feature        | Demonstrace skutečné telemetrie            |\n| Evidence     | Deklarace, testy, záznamy | Interaktivní proof explorer                |\n| Releases     | Changelog                 | Vizualizovaná evoluce produktu             |\n| UI/Cockpit   | Publikovaný snapshot      | Provázaný preview a live režim             |\n| Marketing    | Text + metriky            | Interaktivní use cases a měřitelná hodnota |\n\n### Hlavní architektonický princip\n\nCanonical repository + runtime state\n\n`.ai/**` · registries · code · tests · CI · executions · telemetry\n\nTyped discovery + inference + evidence\n\nProvenance · versions · relations · claim status · visibility\n\nCanonical public product projection\n\nJeden konzistentní model určený k publikování\n\nLanding\n\nDocs\n\nDemo\n\nCockpit\n\nPages\n\nAPI\n\nŽádné duplicitní marketingové inventáře. Žádné nezávislé počítání features. Žádný frontend, který si sám vymýšlí stav systému.\n\nWeb má být consumer stejné architektury, kterou prodává.\n\n## 3. Nová homepage: produkt, který se sám předvádí\n\nNenutil bych návštěvníka číst 2 600 capabilities. To je katalog pro stroje, ne úvodní stránka pro člověka.\n\nNavrhuji sedm hlavních interaktivních demonstrací, nikoli sedm dalších nezávislých aplikací.\n\n[The Platform | Octostar](https://images.openai.com/static-rsc-4/ph-Ktra0ihwQitsVIaufdLbbUU1_LEa2KE4kkret3NKpYKNbt07Uj1jqkc2P4gFKY_LKkOBfuwlbL0ZKlcoiNgSKR_K2XZGURmwBPiAzDA0zXvhOk_3LzfaxqEnuKSdxLnSzmOo0DxIVvBHMYm7jPAuMKh-rAWhw9i7nPqS8pLU?purpose=inline)\n\n01 · Mesh Observatory\n\nAnimovaná topologie peerů, sessions a tasků. Kliknutí na uzel otevře jeho capabilities, heartbeat, práci, vztahy a evidence. Žádní fiktivní peeri vydávaní za živé.\n\n[GitHub - iloom-ai/iloom-cli: iloom: a developer workflow system delivered as a CLI and a VS Code extension for structured AI-assisted development. The CLI is the system of record, running tasks in isolated workflows and persisting analysis, plans, and decisions to your issue tracker, while the VS Code extension exposes insights, assumptions, risks, and decisions in real time. · GitHub](https://images.openai.com/static-rsc-4/zMfzcx1QEWguxwSGz48Eq9kcnniz6O5oyHFg5SaXvpXAuE-69oBDnKMSOtJnBnDMRCMHA4DSqlATV-FSfI6wAFd6mTHcKuo57WptK86ONcQDwQT9fYI8EDIlYVfZ3cv463IlRPh9G2BO4AyB7Ak0OF-6p1aTKv2GXGlItAOyurY?purpose=inline)\n\n02 · Intent-to-Delivery Graph\n\nIntent → criteria → milestones → waves → issues → PRs → tests → releases. Interaktivní dependency graph s filtrováním a vysvětlením, co odblokuje konkrétní práce.\n\n[OpenTelemetry on Kubernetes: Collector, Operator, and Auto-Instrumentation (2026) | Coding Protocols](https://images.openai.com/static-rsc-4/xDqtizr1fSK2liJuPdP4kBloEO3kT1v9Gkw6IZ8OdhkhrHVZNDjTwSPPEuv_15_pvWmfhBQA_T0j-U-azZA8TZ05xVduNpe85e5RsH-zxbAN2s02SRQT-hf_7bXGMC0ckcwwu_VuroHWuUp3zD5lDDmeSbxsRwAwbH84kSmzwnY?purpose=inline)\n\n03 · Live Execution & Economics\n\nSkutečné execution events, latence, tokeny, cost a průběh prací. Veřejný web může bezpečně přehrát zaznamenaný a redigovaný trace.\n\n[Capstone Project & Sprint Help | Osmoutech Labs](https://images.openai.com/static-rsc-4/KbL_wvf-3X3CzKMcF96TQVZmECbWuqfm-Tnf9fXFwZrbzZu_VXULM_8WR7ScCgXvRkvDCfYRjSODfIzPzXhpaoPCE6rIjwKcEtdXkxN5bGV44cwCshDXgftQpsYWmFN3R-SxF6-LDC04-7BaFUHzfyh4JZcACTUurStjzBE-JGU?purpose=inline)\n\n04 · Proof Explorer\n\nNávštěvník si vybere claim a sleduje cestu až k testu a jeho výsledku. Jedním kliknutím zjistí, co je deklarované, ověřené, plánované nebo neprokázané.\n\n[Adib Mohsin (@adib_builds) on X](https://images.openai.com/static-rsc-4/WHSRrPKoe9YZg6RfSXEx03I5W1433KCt5diItgOQBuyVYiByCZc7287le6r4BOhT0Po20o0W6cO1srWzIkRtlOpsEOsnYfVhnpnUg5UsUaQLV06mTyb19OD-RKS3Q2Cs9suWyuABgIG8o-B3blhoV6vx-lK6SUnxT5tQHDIN-3w?purpose=inline)\n\n05 · Capability Explorer\n\nVyhledání jedné capability a okamžité ukázání její CLI, REST, MCP, UI, dokumentační a governance projekce.\n\n[A Two-Hour Prototyping Session | Agentic Insights Blog](https://images.openai.com/static-rsc-4/BbUbkJGXd-sr2YUToIhJkGlUvtlrjbIK1kYd0H9pcR8VRroOt-wQtqJJLe185xA6NPM0VOBQJHB4bpbaykNP2E2X9uQwVx8NWaeMOIDoCVw0N7UvsZSXFdbAFuNfOXzkzMWPo8lxNyJ2oRvron8lsd4AxiorDbm224P3N8Q3OGA?purpose=inline)\n\n06 · Evolution Timeline\n\nReleases, changelog, CI, evidence a změny architektury v čase. Návštěvník uvidí posun projektu místo pouhého tvrzení, že se projekt posouvá.\n\n[Responsive Admin Dashboard UI by Vanessa on Dribbble](https://images.openai.com/static-rsc-4/ARM8k5J5kLqSrQpkp16p03g0vZcpOjz1G9Qtl9kdbHBOuTPTl5o2nXVd5ynE8_VUId99s88WhMGUSKkyu8FegO-DmF3ktyJn_ZjTyARtg7evhkYk1sfO-HbJ3QY0cfgCo0v_GrKxAQYm8dzR_CpG8QEeWHjWHJCDDCjmFNUzRKs?purpose=inline)\n\n07 · Interactive Product Preview\n\nPropojené pohledy `/ui`, `/cockpit` a Observatory, které lze bezpečně procházet i bez lokální instalace.\n\nObrázky jsou vizuální reference, nikoli screenshoty skutečného produktu.\n\n### Jakou interaktivitu myslím\n\nNapříklad dependency explorer: návštěvník klikne na issue a otevře se vztahová síť, která ukáže přímé a nepřímé následky jeho uzavření.\n\nUkázka interakce: dependency explorer\n\nIlustrační data\n\nIntentMilestoneIssueEvidenceRelease\n\nKonkrétní práce\n\nPo uzavření se přepočítají závislosti a kritéria.\n\nPro výsledný web: skutečné uzly a hrany z canonical project graph, nikoli ručně vytvořená demonstrační topologie.\n\n## 4. Kritická hranice: GitHub Pages není živý backend\n\nTo je potřeba vyřešit architektonicky, jinak marketing začne tvrdit nesmysly.\n\nNavrhuji tři výslovně odlišené režimy:\n\n| Režim    | Odkud čerpá                       | Co smí tvrdit                   |\n| -------- | --------------------------------- | ------------------------------- |\n| Snapshot | Public build artifacts            | Stav k určitému commitu         |\n| Replay   | Sanitizované zaznamenané události | Skutečná historická demonstrace |\n| Live     | Autorizovaný runtime stream       | Aktuálně pozorovaný stav        |\n\nKaždý panel musí zobrazovat provenance, čas a stáří dat. Live režim musí mít skutečné připojení přes WebSocket/SSE nebo odpovídající runtime transport. Ztráta připojení znamená `disconnected` nebo `stale`, nikoli vesele animované kuličky a nápis Live.\n\nVeřejný web nemusí dostat přístup k internímu meshi. Pro replay stačí publikovat důkladně sanitizovaný, verzovaný event dataset.\n\nA má to marketingovou výhodu: návštěvník si může projít skutečný průběh práce, i když nikdo zrovna nespouští žádného agenta.\n\n## 5. Co upravit v existující architektuře\n\nTady je dobrá zpráva: není potřeba všechno budovat znovu.\n\nSoučasná dokumentace už popisuje konkrétní derivation pipeline:\n\n`canonical sources → scripts/derive → generated data → Zola/Tera → GitHub Pages`\n\nExistují také `site/data/marketing.toml`, produktové feature definice v `.ai/repo/features/`, generované JSON registry, build provenance a `scripts/derive-check`.&#x20;\n\n[image](https://www.google.com/s2/favicons?domain=https://majordomus.dev\\&sz=32)\n\nPrismatic Majordomus\n\n+1\n\n\n\nPrávě tyto mechanismy bych rozšířil.\n\nNové veřejné projekce by měly pokrýt:\n\n- Product demonstrations: ověřené scénáře a jejich replay manifesty.\n- Runtime observability: bezpečné agregáty a redigované event traces.\n- Intent delivery: graph se závislostmi a odblokovanými uzly.\n- Product evolution: verze, rozdíly, pokrytí a evidence v čase.\n- Marketing claims: každý technický claim s původem, statusem a odkazy na důkazy.\n\nMarketingový text může být editorial. Technická tvrzení, počty, dostupnost funkcí a metriky musí být derived a validated.\n\nZejména bych nezakládal samostatnou `marketing-truth.yaml`, kterou bude další agent slavnostně synchronizovat s ostatními šesti zdroji pravdy.\n\n## 6. Realizační priority\n\nP0\n\nAudit a oprava evidence\n\nOdstranit rozpory mezi claims, recorded runs a publikačním stavem. Zjistit, proč aktuální stránka dokládá 0 z 232 garantovaných claims.\n\nP0\n\nProduct narrative + homepage\n\nZpřehlednit hodnotu produktu, představit nejnovější ověřené schopnosti a přidat přímé vstupy do demonstrací.\n\nP1\n\nCanonical demo/replay subsystem\n\nPropojit existující use cases, jejich výstupy a provenance s interaktivním přehráváním.\n\nP1\n\nGraph explorers\n\nZnovupoužít existující datové modely pro intent, issue, milestone, dependency, capability a evidence.\n\nP1\n\nUI/Cockpit interoperability\n\nSdílené komponenty, deep links, synchronizovaný stav filtrů, mobilní ergonomie a konzistentní design.\n\nP2\n\nPublic observability\n\nSanitizované streamy, snapshot/replay/live přepínání, bezpečné realtime endpointy.\n\nP2\n\nRelease automation + enforcement\n\nAutomatické publikování relevantních změn, drift gate, vizuální regrese a kontrola publikovaných claimů.\n\n### Zadání pro Claude Code\n\nToto je implementační brief navazující na aktuální stav webu. Je napsaný tak, aby Claude nejprve ověřil skutečnost v repozitáři a potom změnu provedl.\n\n# Mission: Majordomus Self-Demonstrating Product Website\n\nRepository: `korczis/prismatic-majordomus`\\\nPublic surface: `https://majordomus.dev/`\n\n## Objective\n\nTransform the existing Majordomus website into a self-demonstrating, evidence-backed, dynamically derived product experience.\n\nDo not build a parallel marketing application. Extend and reuse the existing canonical project models, registry, generation pipeline, component system, site infrastructure, UI, Cockpit and observability architecture.\n\n## Mandatory discovery\n\nRead `AGENTS.md`, all applicable `.ai/**` governance and repository rules, relevant ADRs, architecture documents, site build scripts, UI/Cockpit implementation and CI/CD workflows.\n\nEstablish the actual current state of:\n\n- Public website and publishing pipeline\n- Feature and capability registries\n- Intent-driven development and dependency models\n- Mesh discovery and runtime telemetry\n- Observatory and streaming infrastructure\n- Evidence ledger and executable use cases\n- Release automation and deployment provenance\n- UI component reuse and cross-surface navigation\n\nDistinguish implemented, verified, experimental, planned and unsupported capabilities.\n\nDo not invent a new subsystem when an existing one can be extended.\n\n## Implementation tracks\n\n### A. Canonical public presentation model\n\nCreate or extend the existing typed public projection.\n\nDerive feature inventories, release status, availability, dependency graphs, statistics, proof links and demonstration manifests from canonical sources.\n\nKeep editorial copy separate from technical assertions.\n\nEvery published technical claim must have traceable provenance and an explicit evidence state.\n\n### B. Interactive product homepage\n\nRework the information architecture and visual hierarchy around product outcomes rather than registry size.\n\nExpose entry points for:\n\n1. Mesh Observatory\n2. Intent-to-Delivery Graph\n3. Execution and Token Economics\n4. Evidence and Proof Explorer\n5. Capability Explorer\n6. Product Evolution Timeline\n7. UI/Cockpit Preview\n\nBuild these using existing design components and data sources wherever possible.\n\nPrefer lightweight progressive enhancement. Preserve server-rendered, accessible content.\n\n### C. Demonstration and replay infrastructure\n\nReuse executable use-case artifacts as the canonical basis for demonstrations.\n\nCreate deterministic, sanitizable replay projections where necessary.\n\nEvery demonstration must disclose whether it is a snapshot, replay or live observation.\n\nNever simulate successful outcomes or publish fabricated telemetry as actual events.\n\n### D. Graph exploration\n\nReuse the existing graph and dependency models.\n\nEnable:\n\n- search and filtering\n- node and edge inspection\n- dependency impact exploration\n- cross-links between intents, milestones, waves, issues, PRs, tests, releases and evidence\n- responsive/mobile interactions\n- source provenance and evidence drilldowns\n\nDo not infer a real relationship from display proximity alone.\n\n### E. Public observability\n\nIntegrate the existing streaming/event infrastructure if available and appropriate.\n\nKeep public snapshots and replay independent of private runtime availability.\n\nLive mode requires a verified live data source.\n\nApply strict sanitization, allow-listing, authorization and resource budgets.\n\nNever expose secrets, raw private prompts, private mesh coordinates or internal session data to a public visitor.\n\n### F. Cross-surface integration\n\nKeep the public site, `/ui`, `/cockpit`, docs, capabilities and evidence navigable as one coherent product.\n\nReuse canonical schemas, URL conventions, visual primitives and design tokens.\n\nAvoid duplicating component behavior and domain calculations.\n\nSupport responsive design, keyboard navigation, reduced motion, dark/light appearance and graceful offline/static fallbacks.\n\n### G. Derived marketing\n\nAutomatically reflect newly verified capabilities, releases and demonstrations on appropriate public surfaces.\n\nA new qualifying feature must propagate without manual edits to multiple inventory pages.\n\nEditorial prominence may remain explicitly configured in one canonical location.\n\nUnsupported and planned features must never silently appear as production-ready.\n\n### H. Enforcement\n\nImplement executable checks for:\n\n- generated artifact drift\n- public claim/evidence consistency\n- missing provenance\n- outdated release information\n- broken internal links\n- unsafe published data\n- invalid snapshot/replay/live labels\n- accessibility regressions\n- responsive layout regressions\n- JavaScript failures\n- excessive bundle sizes\n- missing graph relationships\n- non-deterministic rendering\n\nReuse the repository's existing gates and CI architecture.\n\n### I. Deployment\n\nComplete the existing repository-native release and GitHub Pages workflow.\n\nVerify the deployed site, not just the local build.\n\nMaintain version, commit and input-fingerprint provenance.\n\nDo not claim deployment success without checking the public result.\n\n## Delivery discipline\n\nUse vertical slices, prioritizing working integrated functionality over scaffolding.\n\nFor each slice:\n\ninspect → implement → test → derive → validate → document → deploy → verify.\n\nAvoid speculative abstractions, duplicate inventories, parallel architecture and gratuitous dependencies.\n\nDo not weaken governance to make a showcase pass.\n\n## Acceptance criteria\n\nThe work is complete only when:\n\n- Public capabilities are derived from their canonical owners.\n- Visitors can interactively explore real product data.\n- Demonstrations distinguish snapshot, replay and live semantics.\n- Claims clearly distinguish declaration from recorded proof.\n- Cross-surface deep links work.\n- Mobile and desktop experiences are functional.\n- New qualifying product features propagate automatically.\n- Existing CI enforces the public projection contract.\n- The generated site builds deterministically.\n- The deployed public pages pass validation.\n- Documentation and relevant ADRs are updated according to existing policy.\n\nProvide the final report with changed files, verified functionality, unresolved limitations, exact tests, deployment evidence and before/after measurements.\n\n**The website must demonstrate Majordomus's core property by exercising it: discover once, derive consistently, verify claims, publish evidence, and reject drift.**\n\n## 7. Můj verdikt\n\nSoučasný marketingový potenciál\n\n# 6/10\n\nSubjektivní hodnocení prezentace, ne produktu\n\nPriorita aktualizace\n\n# Vysoká\n\nNejdříve evidence a prokazatelné demo\n\nNejvětší příležitost není udělat z homepage další efektní AI landing page. Takových už internet vyrobil dost, obvykle se třemi gradienty, šesti sliby a nulou důkazů.\n\nMajordomus může ukázat něco výrazně silnějšího:\n\nNávštěvník vidí konkrétní problém, spustí nebo přehraje jeho řešení, prozkoumá koordinaci agentů, zobrazí výsledné změny, zjistí, jaké testy prošly, a otevře skutečný evidence chain.\n\nZároveň pochopí, že stejný mechanismus generuje dokumentaci, UI, API i samotnou marketingovou stránku.\n\nTo je přesvědčivější než tisíc dalších marketingových vět.\n\nCíl: `majordomus.dev` není jen web o Majordomusu. Je to veřejný, bezpečný a auditovatelný důkaz jeho architektury.\n# Mission: Majordomus Self-Demonstrating Product Website\n\nRepository: `korczis/prismatic-majordomus`  \nPublic surface: `https://majordomus.dev/`\n\n## Objective\n\nTransform the existing Majordomus website into a self-demonstrating, evidence-backed, dynamically derived product experience.\n\nDo not build a parallel marketing application. Extend and reuse the existing canonical project models, registry, generation pipeline, component system, site infrastructure, UI, Cockpit and observability architecture.\n\n## Mandatory discovery\n\nRead `AGENTS.md`, all applicable `.ai/**` governance and repository rules, relevant ADRs, architecture documents, site build scripts, UI/Cockpit implementation and CI/CD workflows.\n\nEstablish the actual current state of:\n\n- Public website and publishing pipeline\n- Feature and capability registries\n- Intent-driven development and dependency models\n- Mesh discovery and runtime telemetry\n- Observatory and streaming infrastructure\n- Evidence ledger and executable use cases\n- Release automation and deployment provenance\n- UI component reuse and cross-surface navigation\n\nDistinguish implemented, verified, experimental, planned and unsupported capabilities.\n\nDo not invent a new subsystem when an existing one can be extended.\n\n## Implementation tracks\n\n### A. Canonical public presentation model\n\nCreate or extend the existing typed public projection.\n\nDerive feature inventories, release status, availability, dependency graphs, statistics, proof links and demonstration manifests from canonical sources.\n\nKeep editorial copy separate from technical assertions.\n\nEvery published technical claim must have traceable provenance and an explicit evidence state.\n\n### B. Interactive product homepage\n\nRework the information architecture and visual hierarchy around product outcomes rather than registry size.\n\nExpose entry points for:\n\n1. Mesh Observatory\n2. Intent-to-Delivery Graph\n3. Execution and Token Economics\n4. Evidence and Proof Explorer\n5. Capability Explorer\n6. Product Evolution Timeline\n7. UI/Cockpit Preview\n\nBuild these using existing design components and data sources wherever possible.\n\nPrefer lightweight progressive enhancement. Preserve server-rendered, accessible content.\n\n### C. Demonstration and replay infrastructure\n\nReuse executable use-case artifacts as the canonical basis for demonstrations.\n\nCreate deterministic, sanitizable replay projections where necessary.\n\nEvery demonstration must disclose whether it is a snapshot, replay or live observation.\n\nNever simulate successful outcomes or publish fabricated telemetry as actual events.\n\n### D. Graph exploration\n\nReuse the existing graph and dependency models.\n\nEnable:\n\n- search and filtering\n- node and edge inspection\n- dependency impact exploration\n- cross-links between intents, milestones, waves, issues, PRs, tests, releases and evidence\n- responsive/mobile interactions\n- source provenance and evidence drilldowns\n\nDo not infer a real relationship from display proximity alone.\n\n### E. Public observability\n\nIntegrate the existing streaming/event infrastructure if available and appropriate.\n\nKeep public snapshots and replay independent of private runtime availability.\n\nLive mode requires a verified live data source.\n\nApply strict sanitization, allow-listing, authorization and resource budgets.\n\nNever expose secrets, raw private prompts, private mesh coordinates or internal session data to a public visitor.\n\n### F. Cross-surface integration\n\nKeep the public site, `/ui`, `/cockpit`, docs, capabilities and evidence navigable as one coherent product.\n\nReuse canonical schemas, URL conventions, visual primitives and design tokens.\n\nAvoid duplicating component behavior and domain calculations.\n\nSupport responsive design, keyboard navigation, reduced motion, dark/light appearance and graceful offline/static fallbacks.\n\n### G. Derived marketing\n\nAutomatically reflect newly verified capabilities, releases and demonstrations on appropriate public surfaces.\n\nA new qualifying feature must propagate without manual edits to multiple inventory pages.\n\nEditorial prominence may remain explicitly configured in one canonical location.\n\nUnsupported and planned features must never silently appear as production-ready.\n\n### H. Enforcement\n\nImplement executable checks for:\n\n- generated artifact drift\n- public claim/evidence consistency\n- missing provenance\n- outdated release information\n- broken internal links\n- unsafe published data\n- invalid snapshot/replay/live labels\n- accessibility regressions\n- responsive layout regressions\n- JavaScript failures\n- excessive bundle sizes\n- missing graph relationships\n- non-deterministic rendering\n\nReuse the repository's existing gates and CI architecture.\n\n### I. Deployment\n\nComplete the existing repository-native release and GitHub Pages workflow.\n\nVerify the deployed site, not just the local build.\n\nMaintain version, commit and input-fingerprint provenance.\n\nDo not claim deployment success without checking the public result.\n\n## Delivery discipline\n\nUse vertical slices, prioritizing working integrated functionality over scaffolding.\n\nFor each slice:\n\ninspect → implement → test → derive → validate → document → deploy → verify.\n\nAvoid speculative abstractions, duplicate inventories, parallel architecture and gratuitous dependencies.\n\nDo not weaken governance to make a showcase pass.\n\n## Acceptance criteria\n\nThe work is complete only when:\n\n- Public capabilities are derived from their canonical owners.\n- Visitors can interactively explore real product data.\n- Demonstrations distinguish snapshot, replay and live semantics.\n- Claims clearly distinguish declaration from recorded proof.\n- Cross-surface deep links work.\n- Mobile and desktop experiences are functional.\n- New qualifying product features propagate automatically.\n- Existing CI enforces the public projection contract.\n- The generated site builds deterministically.\n- The deployed public pages pass validation.\n- Documentation and relevant ADRs are updated according to existing policy.\n\nProvide the final report with changed files, verified functionality, unresolved limitations, exact tests, deployment evidence and before/after measurements.\n\n**The website must demonstrate Majordomus's core property by exercising it: discover once, derive consistently, verify claims, publish evidence, and reject drift.**\n\n[Image #3]\n[Image #4]\n[Image #5]\n[Image #6]\n[Image #7]\n[Image #8]\n[Image #9]\n\n# PRISMATIC MAJORDOMUS — MAX-EFFORT WEBSITE EVOLUTION\n\n## Mission\n\nYou are operating inside `korczis/prismatic-majordomus`.\n\nYour mission is to transform `https://majordomus.dev/` into a self-demonstrating, evidence-backed, dynamically derived, highly interactive product experience.\n\nThis is an architectural, product, developer-experience, governance, documentation and delivery task.\n\nDo not implement an isolated landing page redesign.\n\nThe resulting website must demonstrate Majordomus by consuming and exercising Majordomus itself.\n\n**Core invariant:**\n\n> Discover once. Model once. Infer where justified. Derive everywhere. Validate continuously. Prove claims. Publish automatically.\n\n## Execution mode\n\nUse the highest available reasoning effort.\n\nPrefer the strongest available coding/reasoning model for architecture and integration, with appropriately selected peers for implementation, testing, adversarial review, accessibility and documentation.\n\nIf the repository provides mesh orchestration, task boards, worker discovery, `/proceed`, MCP integration or session coordination, inspect and use the existing supported mechanisms.\n\nDo not presume any peer is connected.\n\nDo not invent peer responses or orchestration results.\n\nWork autonomously within authorized repository permissions.\n\nDo not stop at analysis if implementation is possible.\n\nDo not ask for obvious implementation choices already determined by repository conventions.\n\nProceed through:\n\nAUDIT → MODEL → IMPLEMENT → INTEGRATE → TEST → ENFORCE → DOCUMENT → RELEASE → VERIFY.\n\nUse coherent vertical slices rather than implementing every backend abstraction before delivering any user-facing functionality.\n\n## 0. Mandatory repository preflight\n\nBefore making architectural decisions, inspect:\n\n- `AGENTS.md` and applicable scoped agent instructions\n- `.ai/**`\n- `.majordomus/**` where present\n- repository documentation hierarchy\n- relevant ADRs\n- governance rules and doctrines\n- canonical registries and schemas\n- current `majordomus.dev` site sources\n- existing site generators\n- existing UI and Cockpit\n- runtime streaming infrastructure\n- public deployment pipeline\n- release/versioning policy\n- tests and CI gates\n- current issues, milestones, PRs and branches where accessible\n\nDo not assume conceptual components exist merely because their names appear in previous design discussions.\n\nFor each relevant component determine whether it is:\n\n1. implemented and verified,\n2. implemented but insufficiently verified,\n3. partially implemented,\n4. declared or designed,\n5. planned,\n6. missing,\n7. deprecated.\n\nRecord source paths and evidence.\n\nRead and follow repository policy before introducing files, dependencies, routes or architectural concepts.\n\n## 1. Audit the current website\n\nInspect the website's actual implementation, generated artifacts and public deployment.\n\nMap:\n\n- homepage sections\n- product domains\n- features\n- capabilities\n- use cases\n- evidence subjects\n- guarantees\n- limitations\n- roadmap\n- release history\n- UI snapshots\n- Cockpit projections\n- navigation\n- search\n- mobile behavior\n- accessibility\n- bundle performance\n- build provenance\n\nIdentify stale, contradictory, weakly supported and under-marketed functionality.\n\nSpecifically investigate inconsistencies between:\n\n- public claims and recorded runs,\n- site version and release metadata,\n- source revisions used for different panels,\n- current product features and marketing presentation,\n- API/MCP/CLI exposure and website inventories.\n\nDo not silently normalize discrepancies.\n\nSurface their causes and correct the canonical derivation when appropriate.\n\n## 2. Reuse existing architecture\n\nFind and extend existing implementations of:\n\n- feature discovery,\n- capability registries,\n- product projection,\n- evidence graph,\n- use-case execution,\n- site generation,\n- dependency graph,\n- telemetry,\n- runtime subscriptions,\n- design components,\n- UI navigation,\n- documentation publishing.\n\nAvoid creating parallel ownership.\n\nA second feature registry, second evidence authority, second product graph or second release manifest is unacceptable unless the architecture demonstrates that it is a distinct bounded context with a genuine purpose.\n\nPrefer deletion and consolidation over another synchronization layer.\n\n## 3. Canonical public product projection\n\nCreate or extend a typed, schema-backed, versioned projection of publicly presentable product state.\n\nIts conceptual entities should include, only where supported by real source models:\n\n- product identity,\n- release and build provenance,\n- product domain,\n- feature,\n- capability,\n- use case,\n- demonstration,\n- evidence subject,\n- evidence verdict,\n- dependency,\n- runtime availability,\n- telemetry projection,\n- public-safe execution trace,\n- release delta,\n- navigation relationship.\n\nThe names and implementation belong to repository conventions.\n\nDo not copy this conceptual list into a new hardcoded universal registry.\n\nCanonical public state must retain:\n\n- stable identifier,\n- canonical source,\n- generated/observed timestamps where meaningful,\n- revision or fingerprint,\n- freshness,\n- evidence status,\n- public visibility,\n- related entities,\n- explainable derivation.\n\nSupport deterministic output, stable links and incremental updates.\n\n## 4. Derived vs inferred vs observed\n\nThese terms must retain precise semantics.\n\n**Authored:** intentionally declared editorial or product metadata.\n\n**Discovered:** found from existing code, metadata or registries.\n\n**Derived:** deterministically computed from canonical inputs.\n\n**Inferred:** a conclusion supported by evidence, confidence and explainable reasoning.\n\n**Observed:** measured runtime or execution data.\n\n**Generated:** materialized output of a derivation or generation process.\n\n**Enforced:** an invariant checked by executable validation with defined failure consequences.\n\nNever describe probabilistic inference as a deterministic guarantee.\n\nNever describe a static snapshot as live runtime state.\n\nNever describe named tests as successful recorded executions.\n\nInference must not silently elevate product availability, proof confidence or claim status.\n\n## 5. Product positioning and storytelling\n\nPreserve what the current product genuinely does.\n\nCommunicate Majordomus as a supervisory control layer for AI-assisted development, emphasizing:\n\n- context continuity,\n- agent coordination,\n- governance,\n- verifiable completion,\n- evidence and provenance,\n- reproducible workflows,\n- consistent derived interfaces.\n\nPresent deeper capabilities where verified.\n\nDifferentiate between value to users and technical implementation.\n\nThe homepage must answer:\n\n1. What problem does this solve?\n2. Why is the problem important?\n3. What does Majordomus actually do?\n4. How does it work?\n5. Can I see it happen?\n6. Can I inspect the proof?\n7. How do I start using it?\n\nDo not lead with large capability counts without practical context.\n\nRetain open-source identity and installation accuracy.\n\nAvoid unverifiable benchmark comparisons and speculative marketing claims.\n\n## 6. Interactive demonstrations\n\nBuild a cohesive set of product demonstrations using real canonical data.\n\nTarget experiences:\n\n### Mesh Observatory\nInspect peers, sessions, task distribution, communication, heartbeats and state transitions where actual runtime evidence exists.\n\n### Intent-to-Delivery Graph\nExplore relationships between intents, acceptance criteria, milestones, waves, issues, PRs, tests, evidence and releases.\n\n### Proof Explorer\nTrace a technical claim to its implementation, relevant tests, recorded executions and evidence verdict.\n\n### Capability Explorer\nInspect how a capability is projected into CLI, REST, OpenAPI, MCP, UI, Cockpit and documentation.\n\n### Execution Explorer\nExplore recorded agent execution, lifecycle events, tool calls and correlated outcomes where telemetry exists.\n\n### Product Evolution\nExplore release deltas, verified capability additions and changes in measured project health over time.\n\n### Product UI Preview\nNavigate coherent public-safe previews of the existing UI and Cockpit.\n\nDo not implement fake static graph data to satisfy a visual requirement.\n\nA demonstration may be unavailable when real evidence does not exist. Explain why.\n\n## 7. Snapshot, replay and live semantics\n\nEvery visualized data source must have a clearly identified mode.\n\nSNAPSHOT:\nA read-only build-time projection of a particular revision.\n\nREPLAY:\nA deterministic playback of real, recorded, sanitized events.\n\nLIVE:\nAn actively connected runtime observation with measured freshness.\n\nUse existing SSE, WebSocket, PubSub or event transport abstractions where suitable.\n\nStatic GitHub Pages must not pretend to provide server-side runtime functionality.\n\nIf the current project supports a public-safe live gateway, reuse it.\n\nOtherwise implement snapshot and replay first.\n\nNever expose credentials, private prompts, raw transcripts, confidential source content or private peer addresses through public pages.\n\nOn disconnect, transition to stale/disconnected state rather than continuing to present fabricated liveness.\n\nProvide pause, replay, speed control and reduced-motion handling when appropriate.\n\n## 8. Interaction model\n\nImplement meaningful interaction, not merely animation.\n\nSupport:\n\n- interactive filtering,\n- searchable registries,\n- graph zoom and pan,\n- node selection,\n- edge inspection,\n- relation highlighting,\n- keyboard navigation,\n- drilldowns,\n- deep linking,\n- URL-state synchronization,\n- timeline scrubbing,\n- provenance inspection,\n- compare modes where actual snapshots permit comparison,\n- reset-to-canonical state,\n- responsive layouts.\n\nUse existing UI patterns wherever possible.\n\nThe user should be able to move from a feature to its capability, proof, documentation, demonstration and relevant release without losing context.\n\nAvoid visual effects that compete with comprehension.\n\n## 9. Canonical navigation and connected surfaces\n\nInspect navigation sources across:\n\n- marketing site,\n- documentation,\n- product UI,\n- Cockpit,\n- registries,\n- evidence views,\n- roadmap,\n- release pages.\n\nInfer navigable relationships from canonical entities.\n\nUse stable identifiers and URLs.\n\nDo not duplicate link inventories across multiple frontends.\n\nEditorial page hierarchy can remain authored.\n\nDomain entity relationships should be derived.\n\nEnforce broken-link and missing-target detection.\n\n## 10. Runtime performance and reliability\n\nDefine explicit budgets from current measured baselines.\n\nMeasure:\n\n- build duration,\n- derivation duration,\n- generated artifact size,\n- JavaScript payload,\n- hydration/interaction readiness,\n- graph rendering responsiveness,\n- memory use,\n- live event throughput,\n- latency from event observation to visible update,\n- recovery after disconnection.\n\nApply:\n\n- incremental derivation,\n- content fingerprints,\n- dependency-aware invalidation,\n- parallel execution of independent derivations,\n- stable serialization,\n- lazy loading,\n- virtualization where necessary,\n- bounded buffers,\n- event backpressure,\n- replay determinism,\n- safe fallback behavior.\n\nDo not block page render on unavailable runtime services.\n\nDo not introduce unnecessary frontend dependencies.\n\nA beautiful website that takes several seconds to respond to a simple filter is not a finished product.\n\n## 11. Accessibility and responsive behavior\n\nSupport desktop, tablet and mobile.\n\nMeet WCAG 2.2 AA where applicable.\n\nCheck:\n\n- semantic markup,\n- focus order,\n- keyboard reachability,\n- accessible graph alternatives,\n- contrast,\n- screen-reader descriptions,\n- touch targets,\n- reduced motion,\n- dark/light mode,\n- viewport overflow,\n- navigation collapse,\n- large graph interaction on small screens.\n\nProvide textual and tabular alternatives for essential graph information.\n\nDo not make essential information dependent on color or animation.\n\n## 12. Evidence and claim honesty\n\nExisting evidence semantics are authoritative.\n\nDo not introduce a new marketing interpretation that collapses:\n\n- guaranteed with named test,\n- tested with recorded passing run,\n- stale evidence,\n- unknown,\n- unavailable,\n- advisory,\n- planned.\n\nEvery demonstration should expose source and proof status.\n\nEvery public quantitative claim must be traceable to a canonical data source or a documented measurement.\n\nIf a published claim is unsupported, fix the claim or the underlying verification pipeline.\n\nDo not fabricate an execution to make the website appear more complete.\n\n## 13. Security and publishing controls\n\nThe public projection is a security boundary.\n\nImplement or reuse:\n\n- explicit public allow-list,\n- sanitization,\n- schema validation,\n- sensitive-field redaction,\n- bounded telemetry publication,\n- output-size limits,\n- link validation,\n- cross-origin restrictions where applicable,\n- authorization of private live endpoints,\n- protection against prompt/transcript leakage.\n\nFail closed for unsafe publication.\n\nNever allow a frontend flag alone to authorize access to private runtime data.\n\nTest adversarial and malformed inputs.\n\n## 14. Enforcement\n\nUse existing repository governance infrastructure.\n\nAdd executable checks for:\n\n- canonical projection drift,\n- schema drift,\n- missing evidence metadata,\n- unsupported public claims,\n- duplicate registries,\n- stale generated indexes,\n- broken relationships,\n- nondeterministic output,\n- publication of private data,\n- invalid replay provenance,\n- falsely labeled live content,\n- stale release information,\n- inaccessible interaction,\n- broken responsive layouts,\n- unverified generated artifacts.\n\nDo not add a decorative rule that CI never invokes.\n\nIntegrate the checks into existing canonical quality gates.\n\nA deliberate malformed fixture must cause an actionable failure.\n\n## 15. Documentation and ADRs\n\nUpdate documentation at the appropriate canonical locations.\n\nDocument:\n\n- architecture,\n- ownership,\n- typed schemas,\n- derivation pipeline,\n- snapshot/replay/live model,\n- extension process,\n- security boundary,\n- troubleshooting,\n- publishing,\n- testing,\n- performance budgets.\n\nFollow actual repository ADR policy.\n\nDo not add an ADR for trivial styling decisions.\n\nDo not manually maintain generated inventories in prose.\n\n## 16. Delivery automation\n\nFind the existing release and publishing machinery.\n\nIntegrate website changes with canonical release/versioning behavior.\n\nA qualifying completed feature should automatically update relevant generated public projections after successful validation.\n\nDo not force a new semantic version for every internal, unpublished state change unless repository policy requires it.\n\nPreserve independent notions of:\n\n- source revision,\n- build revision,\n- product version,\n- deployment revision,\n- runtime freshness.\n\nEnsure deployments are serialized or otherwise protected against outdated builds overwriting newer ones.\n\nVerify deployed content against the intended revision.\n\n## 17. Vertical-slice discipline\n\nOrganize work into independently verifiable vertical slices.\n\nEach slice should contain, as appropriate:\n\n- canonical model change,\n- derivation,\n- API/projection integration,\n- frontend behavior,\n- tests,\n- enforcement,\n- documentation,\n- generated artifacts,\n- deployment verification.\n\nDo not accumulate half-finished parallel features.\n\nPrioritize working evidence and interaction over decorative completeness.\n\n## 18. Mandatory validation\n\nUse actual repository commands, discovered through inspection.\n\nAt minimum validate relevant:\n\n- formatting and linting,\n- compilation,\n- Rust/unit tests,\n- integration tests,\n- derivation checks,\n- schemas,\n- site generation,\n- internal links,\n- evidence contracts,\n- browser functionality,\n- accessibility,\n- responsive views,\n- security/privacy,\n- performance,\n- CI,\n- deployment.\n\nDo not claim that a test ran if it did not.\n\nSeparate pre-existing failures from regressions caused by this task.\n\n## 19. Acceptance criteria\n\nThe project is not complete until:\n\n- [ ] The current site architecture has been audited.\n- [ ] Existing subsystem reuse is documented.\n- [ ] A canonical public product projection exists or is extended.\n- [ ] Core public claims have traceable evidence.\n- [ ] The homepage communicates current product value.\n- [ ] Real interactive demonstrations are accessible.\n- [ ] Snapshot/replay/live states are honest.\n- [ ] Cross-surface deep links work.\n- [ ] Dependency navigation uses real relationships.\n- [ ] The public projection enforces its security boundary.\n- [ ] New qualifying capabilities propagate without per-consumer registration.\n- [ ] Mobile and desktop interfaces work.\n- [ ] Accessibility tests\n\nhttps://chatgpt.com/g/g-p-6a9afb4f933081919d2dfef5c6ce848f-majordomus/c/6ad53c04-b880-83eb-b4bf-61bd5d63a272\n\nPerform a repository-wide reality audit for the Majordomus website evolution mission. Read applicable .ai/** governance and the current site, UI, Cockpit, registries, generators, evidence model and deployment workflows. Produce a source-backed ownership and reuse map, classify each capability as verified/partial/planned/missing, identify claim drift and stale public projections, then begin fixing the highest-impact P0 architectural defect. Do not create parallel subsystems. Provide exact files and test evidence.\n\nImplement the canonical typed public-product projection by extending existing Majordomus registries and generation infrastructure. Ensure provenance, stable IDs, deterministic ordering, revision fingerprints, incremental derivation, freshness, evidence states and public visibility. Integrate site/UI/Cockpit/API consumers where appropriate without creating duplicate catalogs. Add permutation determinism tests, schema/drift gates, an extension test showing automatic propagation of a new qualifying feature, and documentation. Deliver one validated vertical slice.\n\nExtend the existing evidence subject graph, claims matrix, use-case execution and recorded-run ledger into an interactive public Proof Explorer. Derive relationships rather than duplicating subject inventories. Add deterministic sanitized playback for real recorded executions where supported. Distinguish named-test guarantee, observed passing run, stale evidence, unknown, unavailable and planned. Provide claim-to-implementation-to-test-to-run deep links. Test missing evidence, invalid run provenance, redaction, drift and accessibility. Never fabricate proof or present a scenario declaration as an executed test.\n\nInspect the existing Intent-Driven Development, planning and dependency graph implementations. Build a reusable interactive intent-to-delivery explorer spanning actual available intents, criteria, milestones, waves, issues, PRs, tests, evidence and releases. Infer edges only from supported canonical relationships. Add impact/blast-radius exploration, direct versus transitive dependency counts, critical blockers where justified, sorting, filtering, graph/table synchronized selection, URL deep links and mobile accessibility. Add edge-integrity, cycle-policy, determinism and cross-surface consistency tests. Do not invent missing entity types or arbitrary relations.\n\nAudit and extend existing Majordomus mesh discovery, runtime events and observability surfaces into an interactive Observatory. Reuse actual peers, sessions, work items, heartbeats and event transports. Support three explicit modes: build snapshot, deterministic sanitized replay and authenticated live stream. Build graph topology, event timeline, activity highlighting, inspection and filtering. Enforce freshness, backpressure, bounded queues, reconnect with resynchronization, monotonic sequence handling, stale-state indication and privacy boundaries. Test disconnects, out-of-order events, replay determinism, empty mesh and high event volume. No fake live data.\n\nBuild a high-ergonomics Capability Explorer from the existing canonical capability and feature registries. For a selected capability, show real documented exposure across CLI, HTTP API, OpenAPI, MCP, Cockpit, product pages, rules, use cases and evidence. Derive all availability marks and links, including why a surface is absent. Implement indexed search, filters, relation navigation, stable URLs and responsive interaction. Introduce no independently maintained frontend capability catalog. Add cross-surface contract tests and a synthetic qualifying capability propagation test.\n\nExtend Majordomus release, provenance, telemetry and economics data into an evidence-backed Product Evolution dashboard. Show real release deltas, features added or retired, verification changes, delivery graph movement and measured performance trends. Where canonical AI usage telemetry exists, provide token/cost/efficiency views with explicit estimated versus reconciled values. Label missing data honestly. Use revision-consistent comparisons, recorded timestamps, proper denominators and reproducible aggregates. Implement a timeline with filtering, drilldowns, compare modes and links to source evidence. Add aggregation correctness and historical consistency tests.\n\nAudit all site, /ui and /cockpit cross-surface relationships and UX consistency. Reuse canonical entity identifiers, navigation projection, accessible interaction primitives, component styles and existing transport abstractions. Implement bidirectional deep links, URL-backed selection/filter state, graph-to-table synchronization and coherent desktop/mobile interaction. Avoid unnecessary frontend framework migrations. Verify actual cross-surface navigation, keyboard flows, accessible alternative data views, responsive layouts, reduced-motion handling and browser history behavior.\n\nPerform a hostile, evidence-first verification of the complete website evolution. Find unsupported claims, duplicate inventories, stale projections, unsafe public data, false live labels, broken links, deterministic derivation failures, missing CI gates, accessibility failures, performance regressions and unreliable deployment assumptions. Add executable negative fixtures for each important invariant. Integrate checks into canonical repository quality gates. Fix defects rather than weakening expectations. Report every tested property with exact commands, inputs and observed results. Refuse claims of enforcement that lack executable proof.\n\nComplete the website evolution through the existing Majordomus release/deployment process. Discover and follow actual versioning policy; generate and check canonical artifacts; run relevant tests and CI; publish through authorized existing workflows; prevent stale deployments from replacing newer builds; verify the public majordomus.dev site against the intended source/build revisions; smoke-test key pages, interactive assets, links, accessibility and evidence labels. Report exact deployed version, commit, deployment run, tested URLs, results and remaining blockers. Never claim deployment or successful checks without verification.\n\nContinue the Majordomus Website Evolution mission.\n\nReinspect current repository state, applicable `.ai/**` governance, active work, merged changes, blockers, dependency graph, implementation evidence and deployment status.\n\nSelect the next highest-impact unblocked vertical slice.\n\nPrefer completing and integrating existing work over starting new abstractions.\n\nCoordinate through the existing mesh/board when available.\n\nImplement, test, derive, enforce, document and verify the slice end to end.\n\nUpdate the canonical task/evidence state.\n\nDo not claim completion from code existence alone.\n\nDo not repeat already completed work.\n\nDo not introduce new manually maintained inventories.\n\nReport exact changed files, tests, integration state, deployment evidence and the next most important blocker.\n\nThen continue through the repository's supported autonomous orchestration mechanism where authorized.\n\n**No theatrical progress. Produce verified, integrated product improvements.**"
