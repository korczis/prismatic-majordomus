id: I2281
milestone: a-release-is-followed-to-its-users
title: "An agent releases by a workflow that reads release.status, with every wait bounded and every poll logged"
slug: the-release-has-a-workflow-an-agent-follows
priority: p3
profile: deep-work
parallel_safe: true
objective: "Write .ai/repo/workflows/release.md, listed in the workflows README. It is the procedure an agent follows from a measured bump to a verified install: release analyze and bump inside the change that moved the surface, the ci verdict on the merge commit, the tag pushed from the merge, release.status read after each step, the record pull request and its verdict, Pages and latest.json, installer-live, and closing the lifecycle. Each wait is bounded below the agent's background limit and prints the observed stage on every poll. Remove the procedure's duplicated steps from prose that restates docs/DISTRIBUTION.md, and link to it instead."
why: "The 0.15.0 pack's 00_MASTER_RELEASE_ORCHESTRATOR.md exists because no workflow for an agent exists. .ai/repo/workflows/README.md lists task-lifecycle, plan, continuity and use-cases. The procedure is written for a person (docs/DISTRIBUTION.md:158-186). Sessions have written their own landers, and one stalled silently for four hours on 2026-10-04. The traps the landers met are not in any workflow. A tag push from a worktree needs MAJORDOMUS_SHARE unset. smoke fails by design until the record lands (docs/DISTRIBUTION.md:262-279). A jq read of an empty list prints null."
current_state: "Absent. The release pack's prose and session memory are the only agent-facing procedure."
desired_state: "release.md is a context document with the workflows' front matter. Each step is a command, and doc-command-check runs every command or marks why it cannot run. It names release.status (I2279) as the only way to decide that a step is done. It states the bounded-wait rule and the in-flight state (I2280). The workflows README lists it."
scope:
  - ".ai/repo/workflows/release.md"
  - ".ai/repo/workflows/README.md"
  - "docs/DISTRIBUTION.md"
non_scope:
  - "Automating the tag. Tagging stays a person's or an agent's explicit act (docs/RELEASE.md:545-550)."
  - "The before-release audit (I2070). The workflow links to it as a step."
depends_on:
  - "I2279"
  - "I2280"
acceptance_criteria:
  - ".ai/repo/workflows/release.md exists, is listed in .ai/repo/workflows/README.md, and majordomus context resolve .ai/repo/workflows lists it"
  - "Every command in it is run by doc-command-check or marked with the reason it cannot run here"
  - "Every wait in it names its bound and prints the observed stage on each poll"
  - "It decides that each step is done by release.status and not by reading a log"
validation:
  - "bin/majordomus plan validate"
  - "scripts/ci/doc-command-check"
  - "majordomus doctor"
evidence_required:
  - "release_workflow_listed"
  - "release_workflow_commands_checked"
created_at: 2026-10-09
updated_at: 2026-10-09
