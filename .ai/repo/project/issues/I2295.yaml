  - "A change to what docs/INTEGRATION.md, docs/MESH.md or docs/DISTRIBUTION.md say of their mechanisms: the workflow links them, and the first two gain one linking sentence each"
  - "A version bump: the integration executor raises the version once for the whole prevention set"
  - "The executor reopening a record pull request itself, and a release tag refused from an unjudged commit: each has its own issue"
  - "Curated knowledge records of class lesson: promotion is a person's act (ADR 0091)"
