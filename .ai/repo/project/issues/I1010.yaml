    result: "at master 6259dac47af on 2026-10-26: 1 passed each. cockpit::pages::titled_tests::the_overview_lists_the_kinds_with_members_and_counts_them proves a kind with no member has no row, one row per kind held and no other, and a kind added to the fixture (prompt) gains its row with no change to the overview's code"
