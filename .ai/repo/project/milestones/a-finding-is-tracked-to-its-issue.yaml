  - "A Markdown renderer for /ui, which the unlanded ADR 0148 and I3004 own (branch feature/markdown-is-rendered-once)"
  - "Reviving or rewriting PR #1294's engine beyond what ADR 0228 decides"
acceptance_criteria:
