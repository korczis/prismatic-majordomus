# Deploys the derived documentation site to GitHub Pages.
#
# The site is generated from canonical repository files in the order scripts/derive spells
# out: the Rust executable projects its registry (docs/generated/, the provider bootstraps),
# scripts/generate-site-data normalises the canonical files and those projections into
# site/data/generated/ and the derived documents, the executable derives site/data/registry/
# over the index those documents joined, Zola renders templates over that data, Tailwind
# compiles the Flowbite stylesheet. There is no second, hand-maintained content tree. The job
# first proves the tree is healthy (tests, doctor), then that every committed derived artifact
# is what its sources produce (scripts/derive-check: the registry's projections and the site's
# data, so a capability edited in Rust or a document edited by hand both refuse to deploy
# stale), then builds and checks the output, and only then deploys.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install pinned Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin zola
          zola --version
      - name: install site build dependencies
        run: npm ci --no-audit --no-fund
      # The toolchain and the cache before the suite: the behavioural cases build the crate,
      # and a build the cache restores is minutes the deploy does not wait.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/majordomus-cli
      - name: behavioural tests
        run: bash test/run.sh
      - name: self-supervision
        run: |
          git config core.hooksPath .githooks
          bin/majordomus doctor
      # Every committed derived artifact, against its sources: the registry's projections
      # (docs/generated/**, share/allow/**, the provider bootstraps, site/data/registry/) by
      # the executable's own --check, and the site's data and derived documents by the site
      # generator's, whose input hash covers the registry manifest and the OpenAPI document.
      # A stale one — a capability edited in Rust, a document edited by hand — does not deploy.
      - name: every derived artifact is what its sources produce
        run: scripts/derive-check
      - name: build the site
        run: scripts/site-build
      - name: check the site
        run: scripts/site-check
      # Browser-measured: no horizontal overflow at 320/390/1280, mobile menu, dropdowns, theme
      # toggle, Mermaid rendering. Skips with a notice when no Chrome is present.
      - name: probe the site in a browser
        # The full sweep, deliberately, after --quick was tried and measured against the
        # failures it was meant to catch. Sampling one route per template covers layout, and
        # every overflow this site has produced came from canonical data rendered into a
        # shared template: a path in one claim's note, a link in one issue page. Sampling the
        # widest page per template does not close it either — the page that overflowed carried
        # a 40-character token while a page that did not carries an 82-character one, because
        # what overflows depends on which element holds the token and what CSS applies to it,
        # which no static proxy can see. Mobile-first is a stated hard requirement here, so the
        # deploy waits for the measurement rather than for a heuristic that predicts it.
        run: CHROME_BIN=google-chrome scripts/site-probe
      # What was built: the site's inputs and their hash, and the build's own provenance
      # (commit, registry and index fingerprints), which the deployed site serves at /build.json
      - name: manifest
        run: |
          cat site/data/generated/source.json
          cat site/public/build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
