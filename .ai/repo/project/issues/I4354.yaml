  - "CI runner homes (I4344)"
  - "Changing clause 7's 35 GiB or five builders: the owner's word"
acceptance_criteria:
  - "Case 3959: with the debug flock held by a stub build, an idle incremental session is removed and a session holding its s-*.lock is kept"
  - "Case 276: a raw cargo through the shim with free space stubbed below the machine floor after the reclaim exits non-zero before compiling, naming the free space, the floor, the override and the offload route; with the reclaim lifting free space above the floor it is admitted"
  - "Case 276: with free space stubbed at 9 GiB the refusal is disk_emergency and the override does not admit it; at 30 GiB it is the machine floor and the override admits it"
  - "Case 276: with a reclaim pending, a new cargo waits and names the reclaim barrier"
  - "Case 276: CI and a caller that already holds a slot pass unchanged"
  - "Case 276: a stub reap-orphans is not called while free space stays above MAJORDOMUS_MIN_FREE_MB after eviction"
  - "`majordomus shell check` passes with share/libexec/cargo-shim/cargo carrying an F (platform adaptor) exemption in .ai/repo/automation/inventory.jsonl, like share/libexec/sccache-mesh's: cargo is run by name from PATH before any session, so the shim must be an executable; its removal is cargo offering an admission hook the executable can serve"
