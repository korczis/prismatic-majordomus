id: I0303
milestone: execution-telemetry
title: Prove a silent provider produces an explicit absence, never a guess
slug: absence-not-estimate
priority: p2
profile: debugging
parallel_safe: false
objective: "Write the case that runs a whole task under a provider that reports nothing and asserts that the completed record carries an explicit absence with a reason, and that no field anywhere in the surfaces shows an estimated number."
why: "The failure this milestone exists to avoid is not a missing feature, it is a plausible number nobody measured. Only a case that looks for the absence can keep that from creeping back in through a convenience default."
current_state: "The recording path exists. What happens when nobody reports anything is untested."
desired_state: "A case demonstrates the silent path end to end, and a grep-like assertion over the reporting surfaces shows no estimated value is ever printed as measured."
scope:
  - test/cases
non_scope:
  - Any change to the recording path; if the case fails, the fix belongs to the issue that owns that code
depends_on:
  - I0302
acceptance_criteria:
  - The case runs start to finish with no telemetry reported and reaches a completed outcome
  - The stored record carries not_reported with a reason naming the provider
  - No surface prints a number for a task that reported none
validation:
  - bash test/run.sh
evidence_required:
  - absence_proved
risk: "A case that only checks the stored file misses a surface that fills a gap on its way to the screen; it has to assert on what is printed as well."
created_at: 2026-09-04
updated_at: 2026-09-04
