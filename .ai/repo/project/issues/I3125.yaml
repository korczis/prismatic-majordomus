id: I3125
milestone: a-claim-stands-only-on-its-evidence
title: "Coverage from LCOV or Cobertura is linked line by line to the source at the measured revision"
slug: interchange-coverage-links-to-source
priority: p3
profile: implementation
objective: "Import LCOV and Cobertura into the coverage record (reusing the llvm-cov export shape) and render a covered or uncovered region as a link to the source at the measured commit."
why: "Requested as slice V2 of the owner's evidence plan on 2026-10-13 (c246#7). It lands after I3122, which defines the coverage record's dimension and revision fields that an imported report fills, in the same scripts/rust-coverage. It extends milestone test-evidence. Proposed in ADR 0189 (JUnit and Cobertura are formats evidence is imported from and exported to; the tracked ledger stays the only store) (proposed; it carries no authority until the owner accepts it). Sources: chatgpt-majordomus:c246#7."
current_state: "scripts/rust-coverage reads llvm-cov JSON only."
desired_state: "Foreign coverage reaches the same record and view."
scope:
  - "scripts/rust-coverage"
  - "apps/majordomus-cli/src/evidence"
non_scope:
  - "Per-feature coverage attribution where tooling cannot establish it (ADR 0087)"
depends_on:
  - "I3124"
  - "I3122"
serves:
  - "a-claim-stands-only-on-its-evidence#proof-from-ci-runs"
acceptance_criteria:
  - "An LCOV fixture yields the same record shape as llvm-cov"
validation:
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib evidence"
evidence_required:
  - "case_lcov_import"
created_at: 2026-10-18
updated_at: 2026-10-18
