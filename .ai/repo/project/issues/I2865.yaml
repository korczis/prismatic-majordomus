acceptance_criteria:
  - "Each of the eight scenarios has a recorded duration per stage with the commit, the host, the load at the time and the number of samples"
  - "The no-op scenario names the stage that is its largest share, from the samples"
  - "No tracked generated file differs before and after the measurements"
validation:
