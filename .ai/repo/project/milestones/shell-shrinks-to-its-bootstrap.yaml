id: shell-shrinks-to-its-bootstrap
title: "The shell half shrinks to its bootstrap: cases, lifecycle units and embedded shell leave in a declared order, under counts that only lower"
slug: shell-shrinks-to-its-bootstrap
order: 531
priority: p2
problem: "campaigns/majordomus-shellfall/04-port-tests-to-rust-rhai.md, 05-remove-shell-legacy.md, 06-portability-cache-dx.md and 07-enforcement-rollout.md ask that the shell cases become Rust tests with a mapping from each removed case to what replaced it, that the shell behind bin/majordomus moves into the executable, that the core runs without bash, and that gates keep shell from coming back through recipes, workflow steps and sh -c spawns. Measured at 3491f35cab: the person-facing command is bin/majordomus, 177 lines of bash that source one of 29 lib/*.sh command files (42 units, 22,704 lines under lib); the release archive ships that half beside the executable, the four generated provider hooks under .claude/hooks exec it on every prompt and session event, and docs/INSTALL.md records Windows x86_64 as unavailable for exactly that reason. test/cases holds 458 shell cases and 66,875 lines, run by test/run.sh (374 lines) with test/lib.sh (652 lines); the runner's contract is that a behavioural case is a shell script, so test/ is outside what shell check governs, 298 cases never name the Rust executable, and 45 drive only it. Of the 146 exemptions, 90 carry one identical why and one identical removal text, and none names the work that would remove its unit. The executable spawns sh -c in economics/runner.rs and offload/remote.rs with no inventory record, and the 38 records about embedded shell are descriptions no check compares with the tree. Removing the shell half is therefore a migration with an order, and today nothing states the order or holds the counts."
outcome: "A behavioural case may be a Rust integration test that counts in the suite; every shell case that is removed has a tracked row naming the tests that replaced it; the number of shell cases, of exempt units and of exemptions with no issue behind them is refused when a head raises it above its base; the lifecycle units leave lib in the same change that routes their commands to capabilities; the provider hooks reach the executable without the shell tool when it is present; and embedded shell in Rust sources, workflow steps and recipes is judged by shell check rather than described beside it."
current_state: "No Rust test replaces a shell case by declaration: apps/majordomus-cli/tests has 103 entries and test/cases 458 cases, with no record relating them. shell check refuses an undeclared file and a stale record and compares nothing with a base. The lifecycle transitions are lib/start.sh, lib/checkpoint.sh, lib/handover.sh, lib/evidence.sh, lib/finish.sh and lib/session.sh; I1506 (development-runtime) plans their capabilities and states that removing the shell tool is not its scope. lib/capture.sh is the largest shell unit at 2,767 lines and is what every provider hook runs."
desired_state: "The order is written and enforced: a case goes when its replacement is recorded and passing, a lib unit goes when a capability owns its command and the launcher routes to it, an exemption says which issue removes it, and each count is compared with the base on every pull request. What remains shell at the end is what runs before the executable exists (the installer, the launchers that find or build it, the git hooks) and the dialect text the executable generates, each with an exemption a reviewer read."
scope:
  - ".ai/repo/automation"
  - ".ai/repo/ci"
  - ".ai/repo/project"
  - "apps/majordomus-cli/src/automation"
  - "apps/majordomus-cli/src/capability/builtin"
  - "apps/majordomus-cli/src/commands"
  - "apps/majordomus-cli/src/economics/runner.rs"
  - "apps/majordomus-cli/src/offload/remote.rs"
  - "apps/majordomus-cli/tests"
  - "bin/majordomus"
  - "lib"
  - "share/commands.yaml"
  - "test/run.sh"
  - "test/lib.sh"
  - "test/cases"
  - ".github/workflows"
  - "docs"

non_scope:
  - "Declaring the lifecycle transitions as capabilities, which is I1504, I1505 and I1506 of milestone development-runtime; this milestone removes the shell that is left once they exist"
  - "The installer, bin/majordomus-cli, bin/majordomus-env, bin/majordomus-mcp and the three git hooks: they run where the executable may not exist yet and keep their exemptions"
  - "Publishing a Windows archive: it follows from the lifecycle being in the executable and is decided when it is, not promised here"
  - "Deleting a shell case because a Rust test looks similar: a case goes only with its mapping row"
  - "A second test runner with its own report format: Rust tests join the report test/run.sh already writes"
  - "Timing gates on heterogeneous runners beyond the budgets majordomus bench and scripts/ci/suite-budget already hold"

acceptance_criteria:
  - "A Rust integration test declared as the replacement of a case appears in the suite report, and removing a case with no mapping row fails a gate"
  - "A pull request that adds a file under test/cases while the count of shell cases at its head exceeds the count at its base is refused, unless the case declares that its subject is shell itself"
  - "After I1506, lib holds none of start.sh, checkpoint.sh, handover.sh, evidence.sh, finish.sh and session.sh, bin/majordomus answers the same commands with the same exit codes, and the inventory has no record for them"
  - "With the executable present, a provider hook records a prompt without starting bin/majordomus, and with it absent the hook still exits 0"
  - "A sh -c spawn in a Rust source file with no inventory record fails shell check, and so does a record whose anchor the file no longer contains"
  - "shell check reports how many exemptions name no issue, and refuses a head that has more of them than its base"

validation:
  - "bin/majordomus plan validate"
  - "bin/majordomus-cli shell check"
  - "cargo test --manifest-path apps/majordomus-cli/Cargo.toml --lib automation"
  - "MJ_TEST_JOBS=2 bash test/run.sh 365_new_shell_is_refused 366_automation_inventory_agrees_with_the_tree"
  - "bash test/run.sh --verify-report <the report of a full run>"

evidence_required:
  - "rust_case_in_suite_report"
  - "case_mapping_gate"
  - "shell_case_count_never_rises"
  - "lifecycle_units_removed"
  - "hook_reaches_executable"
  - "embedded_shell_judged"
  - "exemptions_name_issues"

risks:
  - "The shell half is what the installer ships and what the hooks run. A unit removed before its capability is served by every installed version breaks an adopter on upgrade; each removal keeps the command name, the arguments and the exit codes, and is proven against an installed release, not only the checkout."
  - "A Rust test that passes is not proof that the shell case it replaces was equivalent. The mapping row records which assertions moved, and a case whose subject is shell behaviour itself (the installer, the launchers, the completion adapters) stays shell."
  - "298 cases test the shell tool and cannot move before the commands they test do. Porting them early would produce Rust tests that spawn bash, which is the dependency with one more process in front of it."
  - "A count compared with the base can be gamed by merging two units into one file. Lines per directory are printed beside units for that reason, and review reads both."

