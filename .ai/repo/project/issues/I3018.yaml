id: I3018
milestone: M004
title: "The intent workspace borrows the plan instead of copying it on every request"
slug: the-intent-workspace-borrows-the-plan
priority: p1
profile: implementation
parallel_safe: true
objective: "/ui/idd and the intent inspector it embeds read plan.issues and plan.roadmap through view::items, a borrow, wherever they only read, instead of view::list, which copies the whole answer: the issues serving the intent, the records the prose may name, the intent's own issues and its milestones."
why: "Master's validate went red in ui on 2026-10-20 and 21 (runs 39485870890 on 91c0b5d5658 and 39504455062 on 573df967bb5): system.http.ui.idd and system.http.live.ui.idd warm p95 105.8 and 106.5 ms against a 100 ms budget, right after the W0 records grew the DONE set, with commits that only added records. The screen deep-copied the 805 full issue records at least four times per request (idd.rs serving and known, intent.rs known and serving), so its cost grew with every record the plan gained."
current_state: "idd.rs and intent.rs call view::list on plan.issues and plan.roadmap, a to_vec of the whole answer, on every request."
desired_state: "They borrow the answer; only the intent's own issues are cloned, and the screen's cost no longer grows with the plan's other records."
scope:
  - apps/majordomus-cli/src/ui/idd.rs
  - apps/majordomus-cli/src/ui/intent.rs
  - .ai/repo/project/issues/I3018.yaml
  - site
  - docs
non_scope:
  - "The budget itself, which stays at 100 ms"
  - "Other screens that copy plan.issues (issues.rs, prs.rs, work.rs, milestone.rs): a follow-up if their budgets move"
depends_on: []
acceptance_criteria:
  - "idd.rs and intent.rs read plan.issues and plan.roadmap through view::items wherever they only read them"
  - "system.http.ui.idd and system.http.live.ui.idd warm p95 are within their 100 ms budget in the ui job"
validation:
  - "cargo test --lib ui::"
  - "majordomus bench system.http.ui.idd --transport system --profile ci --no-write --check"
evidence_required:
  - ui_idd_within_budget
